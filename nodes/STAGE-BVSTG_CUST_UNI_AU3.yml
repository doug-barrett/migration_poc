        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU3
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU1
          - locationName: EDW
            nodeName: DS_CUSTOMER_UNIFICATION_MASTER
        join:
          joinCondition: |-
            EXTENDED
              FROM ( WITH DEDUP_NAME_PHONE_EMAIL AS (
                    SELECT A.CREATED,
                           A.END_MONTH,
                           A.CUSTOMERID,
                           A.PRIMARY_KEY,
                           A.SOURCEDB,
                           A.ISLEGACYCUSTOMER,
                           A.CUSTOMER_STATUS ,
                           A.VALID_FIRSTNAME AS FIRSTNAME ,
                           A.VALID_LASTNAME AS LASTNAME ,
                           A.VALID_DOB AS DOB ,
                           A.VALID_MAINZIP AS MAINZIP ,
                           A.VALID_EMAIL AS EMAIL ,
                           A.VALID_PHONE AS PHONE ,
                           A.GENDER,
                           A.MAINSTREET,
                           A.MAINSTATE,
                           A.LICENSENUMBER,
                           A.NON_NULL_FIELD_COUNT,
                           A.KEY_NAME_DOB_EMAIL_PHONE,
                           A.DUPLICATE_KEY ,
                           B.CDP_CUSTOMERID,
                           B.CLUSTER_KEY ,
                           100 AS FUZZY_SCORE ,
                           'DUPLICATE_NAME_PHONE_EMAIL' AS FUZZ_SCORE_KEY
                      FROM (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }}
                             WHERE VALID_FIRSTNAME <> ''
                               AND VALID_PHONE <> ''
                               AND VALID_EMAIL <> ''
                           ) A
                     INNER JOIN (
                            SELECT FIRSTNAME,
                                   PHONE,
                                   EMAIL,
                                   CDP_CUSTOMERID,
                                   CLUSTER_KEY
                              FROM {{ ref('EDW','DS_CUSTOMER_UNIFICATION_MASTER') }}
                             WHERE CDP_CUSTOMERID <> ''
                               AND FIRSTNAME <> ''
                               AND PHONE <> ''
                               AND EMAIL <> '' QUALIFY ROW_NUMBER() OVER (PARTITION BY FIRSTNAME, PHONE, EMAIL ORDER BY CREATED DESC) = 1
                           ) B
                        ON (A.VALID_FIRSTNAME = B.FIRSTNAME AND A.VALID_PHONE = B.PHONE AND A.VALID_EMAIL = B.EMAIL)
                   ) ,
                   DEDUP_NAME_PHONE AS (
                    SELECT C.CREATED,
                           C.END_MONTH,
                           C.CUSTOMERID,
                           C.PRIMARY_KEY,
                           C.SOURCEDB,
                           C.ISLEGACYCUSTOMER,
                           C.CUSTOMER_STATUS ,
                           C.VALID_FIRSTNAME AS FIRSTNAME ,
                           C.VALID_LASTNAME AS LASTNAME ,
                           C.VALID_DOB AS DOB ,
                           C.VALID_MAINZIP AS MAINZIP ,
                           C.VALID_EMAIL AS EMAIL ,
                           C.VALID_PHONE AS PHONE ,
                           C.GENDER,
                           C.MAINSTREET,
                           C.MAINSTATE,
                           C.LICENSENUMBER,
                           C.NON_NULL_FIELD_COUNT,
                           C.KEY_NAME_DOB_EMAIL_PHONE,
                           C.DUPLICATE_KEY ,
                           E.CDP_CUSTOMERID,
                           E.CLUSTER_KEY ,
                           100 AS FUZZY_SCORE ,
                           'DUPLICATE_NAME_PHONE' AS FUZZ_SCORE_KEY
                      FROM (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }}
                             WHERE VALID_FIRSTNAME <> ''
                               AND VALID_PHONE <> ''
                           ) C
                      LEFT JOIN (
                            SELECT *
                              FROM DEDUP_NAME_PHONE_EMAIL
                           ) D
                        ON (C.PRIMARY_KEY = D.PRIMARY_KEY)
                     INNER JOIN (
                            SELECT FIRSTNAME,
                                   PHONE,
                                   CDP_CUSTOMERID,
                                   CLUSTER_KEY
                              FROM {{ ref('EDW','DS_CUSTOMER_UNIFICATION_MASTER') }}
                             WHERE CDP_CUSTOMERID <> ''
                               AND FIRSTNAME <> ''
                               AND PHONE <> '' QUALIFY ROW_NUMBER() OVER (PARTITION BY FIRSTNAME, PHONE ORDER BY CREATED DESC) = 1
                           ) E
                        ON (C.VALID_FIRSTNAME = E.FIRSTNAME AND C.VALID_PHONE = E.PHONE)
                     WHERE D.PRIMARY_KEY IS NULL
                   ) ,
                   DEDUP_NAME_EMAIL AS ( SELECT F.CREATED,
                   F.END_MONTH,
                   F.CUSTOMERID,
                   F.PRIMARY_KEY,
                   F.SOURCEDB,
                   F.ISLEGACYCUSTOMER,
                   F.CUSTOMER_STATUS ,
                   F.VALID_FIRSTNAME AS FIRSTNAME ,
                   F.VALID_LASTNAME AS LASTNAME ,
                   F.VALID_DOB AS DOB ,
                   F.VALID_MAINZIP AS MAINZIP ,
                   F.VALID_EMAIL AS EMAIL ,
                   F.VALID_PHONE AS PHONE ,
                   F.GENDER,
                   F.MAINSTREET,
                   F.MAINSTATE,
                   F.LICENSENUMBER,
                   F.NON_NULL_FIELD_COUNT,
                   F.KEY_NAME_DOB_EMAIL_PHONE,
                   F.DUPLICATE_KEY ,
                   H.CDP_CUSTOMERID,
                   H.CLUSTER_KEY ,
                   100 AS FUZZY_SCORE ,
                   'DUPLICATE_NAME_EMAIL' AS FUZZ_SCORE_KEY
              FROM (
                    SELECT *
                      FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }}
                     WHERE VALID_FIRSTNAME <> ''
                       AND VALID_EMAIL <> ''
                   ) F
              LEFT JOIN (
                    SELECT PRIMARY_KEY
                      FROM DEDUP_NAME_PHONE_EMAIL
                 UNION ALL SELECT PRIMARY_KEY
                      FROM DEDUP_NAME_PHONE
                   ) G
                ON (F.PRIMARY_KEY = G.PRIMARY_KEY)
             INNER JOIN (SELECT FIRSTNAME,
                   EMAIL,
                   CDP_CUSTOMERID,
                   CLUSTER_KEY
              FROM {{ ref('EDW','DS_CUSTOMER_UNIFICATION_MASTER') }}
