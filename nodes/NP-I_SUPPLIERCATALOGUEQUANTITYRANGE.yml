        join:
          joinCondition: |-
            FROM {{ ref('NP','I_SUPPLIERCATALOGUE') }} I_SUPPLIERCATALOGUE
              LEFT JOIN {{ ref('NP','D_SUPPLIER') }} D_SUPPLIER
                ON I_SUPPLIERCATALOGUE.SUPPLIERCODE = D_SUPPLIER.SUPPLIERCODE --EXCLUDE WHERE DATE RANGE OVER LAPS, CATALOGUE OR QUANTITY AS WE CAN'T WORK OUT WHICH ONE IS CORRECT  -- SOMETIMES THERE ARE OVERLAPS ON THE SAME DAY SO CHANGED THE COMPARISON TO: >= AND <=  WHERE SUPPLIERCATALOGUEID NOT IN (SELECT DISTINCT --GET SUPPLIER CATALOGUE NUMBERS FROM EXCEPTIONS REPORTING BOTH ORIGIANL NUMBER AND AFFECTED NUMBER    SUPPLIERCATALOGUERANGE.SUPPLIERCATALOGUEID   FROM {{ ref('NP','I_SUPPLIERCATALOGUE') }} I_SUPPLIERCATALOGUE   INNER JOIN {{ ref('NP','I_SUPPLIERCATALOGUE') }} SUPPLIERCATALOGUERANGE    ON SUPPLIERCATALOGUERANGE.EFFECTIVEDATE >= I_SUPPLIERCATALOGUE.EFFECTIVEDATE -- START AFTER I_SUPPLIERCATALOGUE IS STARTED    AND SUPPLIERCATALOGUERANGE.EFFECTIVEDATE <= I_SUPPLIERCATALOGUE.EXPIREDDATE    AND I_SUPPLIERCATALOGUE.SHORTITEMNUMBER = SUPPLIERCATALOGUERANGE.SHORTITEMNUMBER    AND I_SUPPLIERCATALOGUE.SUPPLIERCODE = SUPPLIERCATALOGUERANGE.SUPPLIERCODE    AND I_SUPPLIERCATALOGUE.UNITOFMEASURECODE = SUPPLIERCATALOGUERANGE.UNITOFMEASURECODE    AND SUPPLIERCATALOGUERANGE.BUSINESSUNITCODE = I_SUPPLIERCATALOGUE.BUSINESSUNITCODE  --DO NOT JOIN THE RECORD TO ITSELF, AS THESE WILL ALWAYS MATCH   AND SUPPLIERCATALOGUERANGE.SUPPLIERCATALOGUEID <> I_SUPPLIERCATALOGUE.SUPPLIERCATALOGUEID   UNION ALL   SELECT DISTINCT    I_SUPPLIERCATALOGUE.SUPPLIERCATALOGUEID SECONDRANGESUPPLIERCATALOGUE   FROM {{ ref('NP','I_SUPPLIERCATALOGUE') }} I_SUPPLIERCATALOGUE   INNER JOIN {{ ref('NP','I_SUPPLIERCATALOGUE') }} SUPPLIERCATALOGUERANGE    ON SUPPLIERCATALOGUERANGE.EFFECTIVEDATE >= I_SUPPLIERCATALOGUE.EFFECTIVEDATE -- START AFTER I_SUPPLIERCATALOGUE IS STARTED    AND SUPPLIERCATALOGUERANGE.EFFECTIVEDATE <= I_SUPPLIERCATALOGUE.EXPIREDDATE    AND I_SUPPLIERCATALOGUE.SHORTITEMNUMBER = SUPPLIERCATALOGUERANGE.SHORTITEMNUMBER    AND I_SUPPLIERCATALOGUE.SUPPLIERCODE = SUPPLIERCATALOGUERANGE.SUPPLIERCODE    AND I_SUPPLIERCATALOGUE.UNITOFMEASURECODE = SUPPLIERCATALOGUERANGE.UNITOFMEASURECODE    AND SUPPLIERCATALOGUERANGE.BUSINESSUNITCODE = I_SUPPLIERCATALOGUE.BUSINESSUNITCODE   AND SUPPLIERCATALOGUERANGE.SUPPLIERCATALOGUEID <> I_SUPPLIERCATALOGUE.SUPPLIERCATALOGUEID  )  --AND SHORTITEMNUMBER = '11422'
        name: I_SUPPLIERCATALOGUEQUANTITYRANGE
