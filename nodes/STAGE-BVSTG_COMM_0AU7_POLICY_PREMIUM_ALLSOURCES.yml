        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU3_POLICY_PREMIUM_ALLSOURCES
          - locationName: EDW
            nodeName: DS_COMM_EOM_EXTRACT_ALLSOURCES
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU3_EOM_EXTRACT_CS
          - locationName: EDW
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU6_POLICY_PREMIUM_ALLSOURCES
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU2_POLICY_PREMIUM_ALLSOURCES
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT bvstg_comm_au3_policy_premium_allsources.policynumberformatted,
                           bvstg_comm_au3_policy_premium_allsources.policynumberformatted_old,
                           bvstg_comm_au3_policy_premium_allsources.carrier,
                           bvstg_comm_au3_policy_premium_allsources.carrier_old,
                           bvstg_comm_au3_policy_premium_allsources.term,
                           bvstg_comm_au3_policy_premium_allsources.isnewbusinessmonth,
                           bvstg_comm_au3_policy_premium_allsources.isrenewalmonth,
                           bvstg_comm_au3_policy_premium_allsources.newbusinesspolicyflag,
                           bvstg_comm_au3_policy_premium_allsources.asofmonth,
                           bvstg_comm_au3_policy_premium_allsources.paidtype,
                           bvstg_comm_au2_policy_premium_allsources.nbs_wp,
                           CASE WHEN bvstg_comm_au3_policy_premium_allsources.isnewbusinessmonth = 1 THEN ifnull(nbs_premium, writtenpremium)
                                WHEN bvstg_comm_au3_policy_premium_allsources.isrenewalmonth = 1     THEN ifnull(rwl_premium, writtenpremium)
                                ELSE NULL
                                 END AS WrittenPremium,
                           CASE WHEN bvstg_comm_au6_policy_premium_allsources.txn_grp_prem = 'New Business'  THEN nbs_premium
                                WHEN bvstg_comm_au6_policy_premium_allsources.txn_grp_prem = 'Renewal'       THEN rwl_premium
                                WHEN bvstg_comm_au6_policy_premium_allsources.txn_grp_prem = 'Cancellation'  THEN can_premium
                                WHEN bvstg_comm_au6_policy_premium_allsources.txn_grp_prem = 'Endorsement'   THEN end_premium
                                WHEN bvstg_comm_au6_policy_premium_allsources.txn_grp_prem = 'Reinstatement' THEN rei_premium
                                ELSE NULL
                                 END AS CurrentPremium
                      FROM {{ ref('STAGE','BVSTG_COMM_AU3_POLICY_PREMIUM_ALLSOURCES') }} bvstg_comm_au3_policy_premium_allsources
                      LEFT JOIN (
                            SELECT ds_comm_eom_extract_allsources.*,
                                   CASE WHEN bvstg_comm_au3_eom_extract_cs.policynumberformatted IS NOT NULL THEN 1
                                        ELSE 0
                                         END AS ispolicyin_cdrc
                              FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }} ds_comm_eom_extract_allsources
                              LEFT JOIN (
                                    SELECT bvstg_comm_au3_eom_extract_cs.*,
                                           DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF.carrierdisplayname carrierdisplayname_BF
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }} bvstg_comm_au3_eom_extract_cs
                                      LEFT JOIN {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }} DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF
                                        ON BVSTG_COMM_AU3_EOM_EXTRACT_CS.policynumberformatted=DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF.policynumberformatted
                                       AND BVSTG_COMM_AU3_EOM_EXTRACT_CS.carrierdisplayname=DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF.carrierdisplayname_or
                                   )bvstg_comm_au3_eom_extract_cs
                                ON ds_comm_eom_extract_allsources.policynumberformatted_old = bvstg_comm_au3_eom_extract_cs.policynumberformatted
                               AND ds_comm_eom_extract_allsources.carrier_old = bvstg_comm_au3_eom_extract_cs.carrierdisplayname_BF
                           )ds_comm_eom_extract_allsources
                        ON bvstg_comm_au3_policy_premium_allsources.policynumberformatted_old = ds_comm_eom_extract_allsources.policynumberformatted_old
                       AND bvstg_comm_au3_policy_premium_allsources.carrier_old = ds_comm_eom_extract_allsources.carrier_old
                      LEFT JOIN {{ ref('STAGE','BVSTG_COMM_AU6_POLICY_PREMIUM_ALLSOURCES') }} bvstg_comm_au6_policy_premium_allsources
                        ON bvstg_comm_au3_policy_premium_allsources.policynumberformatted_old = bvstg_comm_au6_policy_premium_allsources.policynumberformatted_old
                       AND bvstg_comm_au3_policy_premium_allsources.carrier_old = bvstg_comm_au6_policy_premium_allsources.carrier_old
                       AND bvstg_comm_au3_policy_premium_allsources.asofmonth = bvstg_comm_au6_policy_premium_allsources.asofmonth
                      LEFT JOIN (
                            SELECT DISTINCT policynumberformatted,
                                   carrier,
                                   nbs_premium AS nbs_wp
                              FROM {{ ref('STAGE','BVSTG_COMM_AU2_POLICY_PREMIUM_ALLSOURCES') }}
                           ) bvstg_comm_au2_policy_premium_allsources
                        ON bvstg_comm_au3_policy_premium_allsources.policynumberformatted = bvstg_comm_au2_policy_premium_allsources.policynumberformatted
                       AND bvstg_comm_au3_policy_premium_allsources.carrier = bvstg_comm_au2_policy_premium_allsources.carrier
                     WHERE ds_comm_eom_extract_allsources.ispolicyin_cdrc = 0
                   ) AS bvstg_comm_au3_policy_premium_allsources
