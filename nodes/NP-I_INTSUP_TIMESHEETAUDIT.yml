        dependencies:
          - locationName: NP
            nodeName: I_INTSUP_SUBMITANDAPPROVEVERSION
          - locationName: NP
            nodeName: D_EMPLOYEE
        join:
          joinCondition: |-
            FROM [I_INTSUP_SUBMITANDAPPROVEVERSION]
              LEFT OUTER JOIN [L_INTSUP_FULCRUMTIMESHEET]
                ON I_INTSUP_SUBMITANDAPPROVEVERSION.TIMESHEETID = L_INTSUP_FULCRUMTIMESHEET.TIMESHEET_ID
               AND I_INTSUP_SUBMITANDAPPROVEVERSION.LASTVERSION = L_INTSUP_FULCRUMTIMESHEET.VERSION
              LEFT OUTER JOIN [L_INTSUP_FULCRUMTIMESHEETEMPLOYEES]
                ON I_INTSUP_SUBMITANDAPPROVEVERSION.TIMESHEETID = L_INTSUP_FULCRUMTIMESHEETEMPLOYEES.TIMESHEET_ID
               AND I_INTSUP_SUBMITANDAPPROVEVERSION.LASTVERSION = L_INTSUP_FULCRUMTIMESHEETEMPLOYEES.FULCRUM_RECORD_VERSION
              LEFT OUTER JOIN [L_INTSUP_FULCRUMTIMESHEET] FIRSTAPPROVE
                ON I_INTSUP_SUBMITANDAPPROVEVERSION.TIMESHEETID = FIRSTAPPROVE.TIMESHEET_ID
               AND I_INTSUP_SUBMITANDAPPROVEVERSION.FIRSTAPPROVEVERSION = FIRSTAPPROVE.VERSION
              LEFT OUTER JOIN {{ ref('NP','D_EMPLOYEE') }}
                ON FIRSTAPPROVE.UPDATED_BY = D_EMPLOYEE.EMAIL
              LEFT OUTER JOIN [L_INTSUP_FULCRUMTIMESHEET] FIRSTSUBMIT
                ON I_INTSUP_SUBMITANDAPPROVEVERSION.TIMESHEETID = FIRSTSUBMIT.TIMESHEET_ID
               AND I_INTSUP_SUBMITANDAPPROVEVERSION.FIRSTSUBMITVERSION = FIRSTSUBMIT.VERSION
