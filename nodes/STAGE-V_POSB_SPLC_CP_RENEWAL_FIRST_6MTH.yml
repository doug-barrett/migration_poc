      - aliases:
          V_POSB_SPLC_CP_RENEWAL_FIRST_6MTH: 17ce30df-2d36-4dc6-950d-5bc4bf029252
          DS_SPLC_POLICYTRANSACTION: 5d141078-d046-41e2-9718-10bf4a289f11
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_CP_RENEWAL_FIRST_6MTH') }} AS SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.ID,
                   DS_SPLC_POLICYTRANSACTION_POL.old_policyID
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
             INNER JOIN (
                    SELECT DISTINCT a.policyid,
                           b.policyid old_policyID
                      FROM RETAIL_PROD.SCH_EDW.DS_SPLC_POLICYTRANSACTION a
                     INNER JOIN (
                            SELECT POLICYID,
                                   TRANTYPE,
                                   EXPIRATIONDATE
                              FROM RETAIL_PROD.SCH_EDW.DS_SPLC_POLICYTRANSACTION
                             WHERE TRANTYPE IN('NBS','REW')
                               AND POLICYTERM = 6
                           )b
                        ON a.PRIORPOLID =b.PolicyID
                     WHERE a.TRANTYPE ='RWL'
                       AND a.POLICYTERM = 6
                       AND a.PRIORPOLID IS NOT NULL
                       AND DATEDIFF(DAY,b.expirationdate,a.effectivedate) BETWEEN -30 AND 30
                     UNION SELECT DISTINCT a.policyid,
                           b.policyid old_policyID
                      FROM RETAIL_PROD.SCH_EDW.DS_SPLC_POLICYTRANSACTION a
                     INNER JOIN (
                            SELECT CUSTOMERID,
                                   TRANTYPE,
                                   EXPIRATIONDATE,
                                   CARRIERNAME,
                                   POLICYTYPE,
                                   policyid
                              FROM RETAIL_PROD.SCH_EDW.DS_SPLC_POLICYTRANSACTION
                             WHERE TRANTYPE IN('NBS','REW')
                               AND POLICYTERM = 6
                           )b
                        ON a.CUSTOMERID =b.CUSTOMERID
                       AND a.CARRIERNAME =b.CARRIERNAME
                       AND a.POLICYTYPE =b.POLICYTYPE
                     WHERE a.TRANTYPE ='RWL'
                       AND a.POLICYTERM = 6
                       AND a.PRIORPOLID IS NULL
                       AND DATEDIFF(DAY,b.expirationdate,a.effectivedate) BETWEEN -30 AND 30
                   )DS_SPLC_POLICYTRANSACTION_POL
                ON DS_SPLC_POLICYTRANSACTION.POLICYID = DS_SPLC_POLICYTRANSACTION_POL.POLICYID
             WHERE PolicyType IN('Private Passenger Auto','Business Auto')
