              LEFT JOIN {{ ref('STAGE','V_DLBV_COMM_AGENCYBANKSMAPPING_CURRENT') }} v_dlbv_comm_agencybanksmapping_current
                ON v_dlbv_comm_agencybanksmapping_current.banksname = v_dlbv_comm_bankdatarepository_current.name
