        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AP1LOG_LOGGINGUSERBEHAVIOR_CURRENT V_DLBV_AP1LOG_LOGGINGUSERBEHAVIOR_CURRENT
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AP1LOG_UIELEMENTNAME_CURRENT V_DLBV_AP1LOG_UIELEMENTNAME_CURRENT
                ON V_DLBV_AP1LOG_LOGGINGUSERBEHAVIOR_CURRENT.UIELEMENTNAMEID = V_DLBV_AP1LOG_UIELEMENTNAME_CURRENT.UIELEMENTNAMEID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AP1LOG_UIELEMENTTYPE_CURRENT V_DLBV_AP1LOG_UIELEMENTTYPE_CURRENT
                ON V_DLBV_AP1LOG_LOGGINGUSERBEHAVIOR_CURRENT.UIELEMENTTYPEID = V_DLBV_AP1LOG_UIELEMENTTYPE_CURRENT.UIELEMENTTYPEID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AP1LOG_UICONTAINERCONTROL_CURRENT V_DLBV_AP1LOG_UICONTAINERCONTROL_CURRENT
                ON V_DLBV_AP1LOG_LOGGINGUSERBEHAVIOR_CURRENT.UICONTAINERCONTROLID = V_DLBV_AP1LOG_UICONTAINERCONTROL_CURRENT.UICONTAINERCONTROLID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AP1LOG_UISCREEN_CURRENT V_DLBV_AP1LOG_UISCREEN_CURRENT
                ON V_DLBV_AP1LOG_LOGGINGUSERBEHAVIOR_CURRENT.UISCREENID = V_DLBV_AP1LOG_UISCREEN_CURRENT.UISCREENID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AP1LOG_UIEVENTTYPE_CURRENT V_DLBV_AP1LOG_UIEVENTTYPE_CURRENT
                ON V_DLBV_AP1LOG_LOGGINGUSERBEHAVIOR_CURRENT.UIEVENTTYPEID = V_DLBV_AP1LOG_UIEVENTTYPE_CURRENT.UIEVENTTYPEID
              LEFT JOIN (SELECT t1.loginname AS apponeloginname,
                   COALESCE(t2.cisco_loginname, t3.cisco_loginname) AS cisco_login_name
              FROM ( -- Equivalent to employee_mroc CTE      SELECT LOWER(loginname) AS loginname, userid, employeenumber      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_EMPLOYEE_MROC      WHERE isrowdeleted = 'FALSE' AND isactive = 'TRUE'      QUALIFY ROW_NUMBER() OVER (PARTITION BY LOWER(loginname) ORDER BY TO_TIMESTAMP(created), TO_TIMESTAMP(lastupdated) DESC) = 1  ) AS t1  LEFT JOIN (      -- Equivalent to ds_agent_key_1 CTE      SELECT ap1_userid, employeenumber, cisco_loginname      FROM RETAIL_PROD.SCH_EDW.DS_AGENT_KEY      WHERE Rank_EmployeeNumber = 1 AND ap1_userid IS NOT NULL      QUALIFY ROW_NUMBER() OVER (PARTITION BY employeenumber ORDER BY dss_create_time) = 1  ) AS t2 ON t1.userid = t2.ap1_userid  LEFT JOIN (      -- Equivalent to ds_agent_key CTE      SELECT employeenumber, cisco_loginname      FROM RETAIL_PROD.SCH_EDW.DS_AGENT_KEY      WHERE Rank_EmployeeNumber = 1 AND ap1_userid IS NULL AND employeenumber IS NOT NULL      QUALIFY ROW_NUMBER() OVER (PARTITION BY employeenumber ORDER BY dss_create_time) = 1  ) AS t3 ON t1.employeenumber = t3.employeenumber  WHERE COALESCE(t2.cisco_loginname, t3.cisco_loginname) IS NOT NULL) S_AP1_EMPLOYEE_MROC ON LOWER(V_DLBV_AP1LOG_LOGGINGUSERBEHAVIOR_CURRENT.USERNAME) = S_AP1_EMPLOYEE_MROC.apponeloginname  WHERE LOWER(USERNAME) NOT LIKE '%rpa.system%'     AND LOWER(USERNAME) NOT LIKE '%test.%'     AND LOWER(USERNAME) NOT LIKE '%odt.user%'     AND LOWER(USERNAME) NOT LIKE '%qc.disputes%'    AND TO_DATE(activity_time) >= '2024-10-01'    AND V_DLBV_AP1LOG_UIELEMENTNAME_CURRENT.name NOT IN ('ClearFilters', 'Cancel', 'Save')
        name: BVSTG_PMKT_AU2_ATLAS_ACTIONS
        noLinkRefs: []
