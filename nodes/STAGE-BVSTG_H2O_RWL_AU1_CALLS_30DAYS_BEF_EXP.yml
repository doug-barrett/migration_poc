        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
             INNER JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} DS_MKT_CALL_CUSTOMER
                ON DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY = DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.ID
             INNER JOIN {{ ref('EDW','DS_POLICYSUMMARY_RENEWALS') }} ds_policysummary_renewals
                ON ds_policysummary_renewals.CUSTOMERID = DS_MKT_CALL_CUSTOMER.CUSTOMERID
               AND DS_MKT_CALL_CUSTOMER.SOURCEDB_CUSTOMER = ds_policysummary_renewals.SOURCEDB
               AND DATE(DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.STARTDATETIME) >= DATEADD(MONTH,-2,ds_policysummary_renewals.renewal_start_period)
             INNER JOIN (
                    SELECT DISTINCT customerid,
                           SourceDB
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                   ) bvstg_customer_to_refresh
                ON TO_CHAR(bvstg_customer_to_refresh.customerid) = TO_CHAR(ds_policysummary_renewals.customerid)
               AND bvstg_customer_to_refresh.SourceDB = ds_policysummary_renewals.SourceDB
             WHERE DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.TALKTIME >= 180
             GROUP BY ds_policysummary_renewals.ID
