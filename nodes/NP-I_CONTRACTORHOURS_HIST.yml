        join:
          joinCondition: |-
            FROM {{ ref('NP','L_SHP_CONTRACTOREXPOSUREHOURS') }} L_SHP_CONTRACTOREXPOSUREHOURS
              LEFT OUTER JOIN {{ ref('NP','D_PERIOD') }} D_PERIOD
                ON YEAR(MONTHWORKED) = D_PERIOD.CALENDARYEAR
               AND MONTH(MONTHWORKED) = D_PERIOD.MONTHNUMBER
             WHERE D_PERIOD_KEY IN (
                    SELECT D_PERIOD_KEY
                      FROM D_PERIOD
                     WHERE MOVINGMONTHSORTORDER BETWEEN 1 AND 12
                   )
               AND @V_CURRENTF1OPENPERIOD -1 NOT IN (
                    SELECT PERIODNUMBER
                      FROM I_CONTRACTORHOURS_HIST
                   )
               AND ISDELETED = 'FALSE' --NEED TO IDENTIFY DELETED RECORDS AND EXCLUDE
