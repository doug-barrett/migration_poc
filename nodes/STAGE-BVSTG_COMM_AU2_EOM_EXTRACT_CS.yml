POSITORY') }}           where trim(PolicyNumber) <> ''                 and PolicyNumber is not null                 and label in ('New Business Auto','New Business Complementary')                and counter = 1                and to_date(transactiondate)<= current_date()       and (islegacytransaction<>'Migrated' or islegacytransaction is null)          ) ds_ram_retail_repository        left join             (select distinct PolicyNumber_EDW,                              CarrierName_EDW,                              PolicyNumberFormatted,                              CarrierName_Mapped CarrierName, carrierdisplayname            --from "DATA_LAKE"."BIA_ANALYTICS"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES"      --from "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES"             from {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}             ) ds_bvstg_comm_policynumberformatting_allsources              on ds_bvstg_comm_policynumberformatting_allsources.PolicyNumber_EDW = ds_ram_retail_repository.PolicyNumber                 and ds_bvstg_comm_policynumberformatting_allsources.CarrierName_EDW = ds_ram_retail_repository.CarrierName) ds_ram_retail_repository          inner join (select distinct policynumberformatted, carrier                      --from bvstg_comm_au1_eom_extract_cs                      from {{ ref('STAGE','BVSTG_COMM_AU1_EOM_EXTRACT_CS') }}                     ) bvstg_comm_au1_eom_extract_cs               on bvstg_comm_au1_eom_extract_cs.policynumberformatted = ds_ram_retail_repository.policynumberformatted                   and bvstg_comm_au1_eom_extract_cs.carrier = ds_ram_retail_repository.carriername      qualify row_number
