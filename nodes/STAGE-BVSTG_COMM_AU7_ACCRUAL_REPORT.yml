    sourceMapping:
      - aliases:
          BVSTG_COMM_AU5_ACCRUAL_REPORT: 131b694a-e2d0-4e72-834b-9e9f4b4bcdfd
          V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT: 8115b83c-7121-4506-9878-d35882cdda53
          V_DLBV_COMM_MASTERCARRIER_CURRENT: 8edcf0a2-42cb-43a5-8b6b-1088875c7d88
          DS_BVSTG_COMM_CARRIERMAPPING: 4c8005f8-7d2c-4b7d-ba47-e98ea2706955
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU5_ACCRUAL_REPORT
          - locationName: STAGE
            nodeName: V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_COMM_MASTERCARRIER_CURRENT
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_CARRIERMAPPING
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT BVSTG_COMM_AU5_ACCRUAL_REPORT_ID,
                   asofmonth,
                   CARRIERNAME_GROUPED,
                   CARRIERDISPLAYNAME,
                   STATECODE,
                   branch,
                   OfficeCode,
                   nbs_sales,
                   NBS_WRITTENPREMIUM,
                   RWL_SALES,
                   RWL_WRITTENPREMIUM,
                   MONTHLYNBSPREMIUM,
                   MONTHLYRWLPREMIUM,
                   MONTHLYPREMIUM,
                   CHURNRATE,
                   PAIDTYPE,
                   NEWPERCENTAGE,
                   RENEWALPERCENTAGE,
                   CASE WHEN paidtype = 'As Written' THEN NBS_WRITTENPREMIUM
                        ELSE MonthlyNBSPremium
                         END MonthlyNBSPremium_By_PaidType,
                   CASE WHEN paidtype = 'As Written' THEN RWL_WRITTENPREMIUM
                        ELSE MonthlyRWLPremium
                         END MonthlyRWLPremium_By_PaidType,
                   (CASE WHEN paidtype = 'As Written' THEN NBS_WRITTENPREMIUM ELSE MonthlyNBSPremium END) + (CASE WHEN paidtype = 'As Written' THEN RWL_WRITTENPREMIUM ELSE MonthlyRWLPremium END) TotalMonthlyPremium_ByPaidType,
                   -1*((CASE WHEN paidtype = 'As Written' THEN NBS_WRITTENPREMIUM ELSE MonthlyNBSPremium END) + (CASE WHEN paidtype = 'As Written' THEN RWL_WRITTENPREMIUM ELSE MonthlyRWLPremium END)) * churnrate CANC_WrittenPremium,
                   (CASE WHEN paidtype = 'As Written' THEN NBS_WRITTENPREMIUM ELSE MonthlyNBSPremium END) * NEWPERCENTAGE/100 NBS_Commission,
                   (CASE WHEN paidtype = 'As Written' THEN RWL_WRITTENPREMIUM ELSE MonthlyRWLPremium END) * RENEWALPERCENTAGE/100 RWL_Commission,
                   -1*(((CASE WHEN paidtype = 'As Written' THEN NBS_WRITTENPREMIUM ELSE MonthlyNBSPremium END) + (CASE WHEN paidtype = 'As Written' THEN RWL_WRITTENPREMIUM ELSE MonthlyRWLPremium END)) * churnrate) * ((NEWPERCENTAGE+RENEWALPERCENTAGE)/200) Canc_Commission
              FROM (SELECT DISTINCT bvstg_comm_au5_accrual_report.*,
                   ds_comm_policy_premium_breakdown_dashboard_allsources.churnrate,
                   coalesce(v_dlbv_comm_agreementrepository_current_1.paidtype, 'As Written') PaidType,
                   coalesce(v_dlbv_comm_agreementrepository_current_1.NEWPERCENTAGE, v_dlbv_comm_agreementrepository_current_2.NewPercentage_Median) NEWPERCENTAGE,
                   coalesce(v_dlbv_comm_agreementrepository_current_1.RENEWALPERCENTAGE, v_dlbv_comm_agreementrepository_current_2.RenewalPercentage_Median) RENEWALPERCENTAGE
              FROM {{ ref('STAGE','BVSTG_COMM_AU5_ACCRUAL_REPORT') }} bvstg_comm_au5_accrual_report
              LEFT JOIN (
                    SELECT carrierdisplayname carrier,
                           state,
                           paidtype,
                           NEWPERCENTAGE,
                           RENEWALPERCENTAGE,
                           isactive,
                           effectivedate
                      FROM {{ ref('STAGE','V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT') }} v_dlbv_comm_agreementrepository_current
                      LEFT JOIN (
                            SELECT DISTINCT MASTERCARRIERID,
                                   CARRIERNAME
                              FROM {{ ref('STAGE','V_DLBV_COMM_MASTERCARRIER_CURRENT') }}
                           ) v_dlbv_comm_mastercarrier_current
                        ON v_dlbv_comm_agreementrepository_current.mastercarrierid= v_dlbv_comm_mastercarrier_current.mastercarrierid
                      LEFT JOIN (
                            SELECT DISTINCT carriername,
                                   carrierdisplayname
                              FROM {{ ref('STAGE','DS_BVSTG_COMM_CARRIERMAPPING') }}
                             WHERE SOURCE IN ('CS', 'Agreement Repository')
                           ) ds_bvstg_comm_carriermapping
                        ON v_dlbv_comm_mastercarrier_current.carriername = ds_bvstg_comm_carriermapping.carriername QUALIFY row_number() OVER (PARTITION BY carrierdisplayname ORDER BY effectivedate DESC, isactive DESC) = 1
                   ) v_dlbv_comm_agreementrepository_current_1
                ON bvstg_comm_au5_accrual_report.carrierdisplayname = v_dlbv_comm_agreementrepository_current_1.carrier
             CROSS JOIN (SELECT approx_percentile(NEWPERCENTAGE, 0.5) NewPercentage_Median,
                   approx_percentile(RENEWALPERCENTAGE, 0.5) RenewalPercentage_Median
              FROM (SELECT carrierdisplayname carrier,
                   state,
                   paidtype,
                   NEWPERCENTAGE,
                   RENEWALPERCENTAGE,
                   isactive,
                   effectivedate
              FROM {{ ref('STAGE','V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT') }} v_dlbv_comm_agreementrepository_current
              LEFT JOIN (
                    SELECT DISTINCT MASTERCARRIERID,
                           CARRIERNAME
                      FROM {{ ref('STAGE','V_DLBV_COMM_MASTERCARRIER_CURRENT') }}
                   ) v_dlbv_comm_mastercarrier_current
                ON v_dlbv_comm_agreementrepository_current.mastercarrierid
        name: BVSTG_COMM_AU7_ACCRUAL_REPORT
        noLinkRefs: []
