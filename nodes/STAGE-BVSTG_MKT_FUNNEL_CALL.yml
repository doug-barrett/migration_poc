    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: V_MKT_C2S_SUMMARY
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_LEADHISTORY
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT IFNULL(BUDGETMKTGSTATE,'') AS State ,
                   VINTAGEDATE ,
                   Campaignid ,
                   c_name ,
                   vendor ,
                   Category ,
                   Subcategory ,
                   c2s.BRAND ,
                   c2s.DIVISION ,
                   DELIVERY_METHOD ,
                   c2s.BRAND_NAME AgencyCode ,
                   SUM(CASE WHEN CampaignCall > 0 THEN CampaignCall ELSE 0 END) NonUniqueCampaignCall ,
                   COUNT(DISTINCT CASE WHEN CampaignCall > 0 AND Category != 'Customer Service' THEN remotenumbercallid END) UniqueCampaignCall ,
                   COUNT(CASE WHEN CampaignCall > 0 AND Category = 'Customer Service' THEN c2s.InteractionIDKey END) NonUniqueCustomerServiceCall ,
                   COUNT(DISTINCT CASE WHEN CampaignCall > 0 AND Category = 'Customer Service' THEN remotenumbercallid END) UniqueCustomerServiceCall ,
                   SUM(CASE WHEN isTransferCall > 0 THEN 1 ELSE 0 END) isCiscoTransfer ,
                   SUM(CASE WHEN CampaignCall > 0 THEN IFNULL(isOfferedCall,0) ELSE 0 END) CallsOffered ,
                   SUM(CASE WHEN CampaignCall > 0 AND IFNULL(isOfferedCall,0) = 1 THEN IFNULL(isAnswered,0) ELSE 0 END) CallsAnswered ,
