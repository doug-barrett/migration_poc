                   SUM(CASE WHEN CampaignCall > 0 AND IFNULL(isOfferedCall,0) = 1 AND IFNULL(TCONNECTED,0) BETWEEN 31 AND 60 AND IFNULL(isAnswered,0) = 1 THEN 1 ELSE 0 END) Duration_B_30_60 ,
