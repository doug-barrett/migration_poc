        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_POLICYSUMMARY_RENEWALS') }} ds_policysummary_renewals
             INNER JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                ON TO_VARCHAR(ds_ram_retail_repository.transactionid) = TO_VARCHAR(ds_policysummary_renewals.transactionid)
             INNER JOIN (
                    SELECT DISTINCT customerid,
                           SourceDB
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                   ) bvstg_customer_to_refresh
                ON TO_CHAR(bvstg_customer_to_refresh.customerid) = TO_CHAR(ds_policysummary_renewals.customerid)
               AND bvstg_customer_to_refresh.SourceDB = ds_policysummary_renewals.SourceDB
             WHERE ds_ram_retail_repository.TransactionType IN ('New Business')
               AND ds_ram_retail_repository.CLASSIFICATION = 'Carrier Premium'
               AND ds_ram_retail_repository.ISCORPORATEVOID = 0
               AND ds_ram_retail_repository.ISVOID = 0
             GROUP BY ds_policysummary_renewals.ID
