    sourceMapping:
      - aliases:
          DS_DIALER_TELESALES_SPECIALTY: 32557878-d7a5-4024-9247-3412d5d50575
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_DIALER_AU2_TELESALES
          - locationName: EDW
            nodeName: DS_DIALER_TELESALES_SPECIALTY
        join:
          joinCondition: |-
            FROM "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_DIALER_AU2_TELESALES" bvstg_dialer_au2_telesales
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_DIALER_TELESALES" b
                ON bvstg_dialer_au2_telesales.C_CUSTOMERID = b.C_CUSTOMERID
               AND b.InsertedDate = DATE(CURRENT_DATE())
              LEFT JOIN {{ ref('EDW','DS_DIALER_TELESALES_SPECIALTY') }} ds_dialer_telesales_specialty
                ON bvstg_dialer_au2_telesales.C_CUSTOMERID = ds_dialer_telesales_specialty.C_CUSTOMERID
               AND ds_dialer_telesales_specialty.InsertedDate = DATE(CURRENT_DATE()) -1
              LEFT JOIN (
                    SELECT *
                      FROM "RETAIL_PROD"."SCH_DATA_VAULT"."S_AP1_CUSTOMER_MROC" QUALIFY ROW_NUMBER() OVER (PARTITION BY CustomerID ORDER BY DSS_CREATE_TIME DESC)=1
                   ) Customer
                ON bvstg_dialer_au2_telesales.C_CUSTOMERID =Customer.CUSTOMERID
              LEFT JOIN (
                    SELECT *
                      FROM "RETAIL_PROD"."SCH_DATA_VAULT"."S_AP1_ORGANIZATION_MROC" QUALIFY ROW_NUMBER() OVER (PARTITION BY OrganizationID ORDER BY DSS_CREATE_TIME DESC)=1
                   ) Orgs
                ON Orgs.OrganizationID =Customer.OrganizationID
             WHERE bvstg_dialer_au2_telesales.ISELEGIBLE = 1
               AND b.C_CUSTOMERID IS NULL
               AND ds_dialer_telesales_specialty.C_CUSTOMERID IS NULL /*    AND CASE WHEN bvstg_dialer_au2_telesales.STATECODE = 'AZ' AND bvstg_dialer_au2_telesales.ACTIVITYTRANSFER = 1 THEN 1             WHEN Orgs.CODE = 'FWYTX' AND bvstg_dialer_au2_telesales.ACTIVITYTRANSFER = 1 THEN 1        ELSE 0       END = 0  */
             ORDER BY bvstg_dialer_au2_telesales.GNL_SCORE DESC ,
                      bvstg_dialer_au2_telesales.FIRST_GROUP_LEAD_CREATED_DATE DESC ,
                      bvstg_dialer_au2_telesales.C_CustomerID
             LIMIT 1500
        name: BVSTG_DIALER_TELESALES_SPECIALTY
        noLinkRefs: []
