        join:
          joinCondition: |-
            FROM L_PG_EMPLLEAVECREDITHISTORY
              JOIN {{ ref('NP','L_PG_EMPLOYEEHISTORY') }}
                ON (L_PG_EMPLLEAVECREDITHISTORY.EMPLOYEECODE = L_PG_EMPLOYEEHISTORY.EMPLOYEECODE AND L_PG_EMPLLEAVECREDITHISTORY.PAYSEQUENCE = L_PG_EMPLOYEEHISTORY.PAYSEQUENCE)
              LEFT JOIN L_PG_EMPLOYEE
                ON L_PG_EMPLLEAVECREDITHISTORY.EMPLOYEECODE = L_PG_EMPLOYEE.EMPLOYEECODE
             WHERE LEAVECREDITCODE IN ('ALT', 'XMAS','LIEU','FLEX')
               AND BALANCE IS NOT NULL
             GROUP BY L_PG_EMPLLEAVECREDITHISTORY.EMPLOYEECODE ,
                      L_PG_EMPLLEAVECREDITHISTORY.PAYSEQUENCE ,
                      L_PG_EMPLLEAVECREDITHISTORY.LEAVECREDITCODE ,
