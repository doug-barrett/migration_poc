    sourceMapping:
      - aliases:
          V_PREB_CUSTOMER_SUMMARY_ADDITIONALPRODUCT: db6c2ad0-4f36-4dd8-b8fc-415be5c8a412
          DS_BVSTG_AP1_ANCILLARYPRODUCT: 97a8725f-201b-488b-a21b-80abc5b479fd
          BVSTG_CUSTOMER_TO_REFRESH: 90b8ce37-bcd1-4ba2-bda7-cfcf723b20ac
          DS_AMS_TRANSACTIONDETAIL: c9901845-aea5-46bc-9534-be4cbbe632c7
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_CUSTOMER_SUMMARY_ADDITIONALPRODUCT') }} AS SELECT cast(ds_bvstg_ap1_ancillaryproduct.customerid AS varchar(100)) AS customerid ,
                   count(1) AS Additionalproduct_count ,
                   SUM(CASE WHEN ds_bvstg_ap1_ancillaryproduct.status='Active' THEN 1 ELSE 0 END) AS Additionalproduct_active ,
                   SUM(CASE WHEN ds_bvstg_ap1_ancillaryproduct.status='Expired' THEN 1 ELSE 0 END) AS Additionalproduct_expired ,
                   'AppOne' AS SourceDB
              FROM {{ ref('STAGE','DS_BVSTG_AP1_ANCILLARYPRODUCT') }} ds_bvstg_ap1_ancillaryproduct
             INNER JOIN (
                    SELECT DISTINCT customerid
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                     WHERE bvstg_customer_to_refresh.SourceDb = 'AppOne'
                   ) bvstg_customer_to_refresh
                ON bvstg_customer_to_refresh.customerid = TO_CHAR(ds_bvstg_ap1_ancillaryproduct.customerid)
             GROUP BY cast(ds_bvstg_ap1_ancillaryproduct.customerid AS varchar(100))
             UNION SELECT ds_ams_transactiondetail.customerid ,
                   count(1) AS Additionalproduct_count ,
                   SUM(CASE WHEN DATEADD(MONTH,ds_ams_transactiondetail.term,ds_ams_transactiondetail.PolicyEffectiveDate) > CURRENT_DATE() THEN 1 ELSE 0 END) AS Additionalproduct_active ,
                   SUM(CASE WHEN DATEADD(MONTH,ds_ams_transactiondetail.term,ds_ams_transactiondetail.PolicyEffectiveDate) > CURRENT_DATE() THEN 0 ELSE 1 END) AS Additionalproduct_expired ,
                   'CIGH' AS SourceDB
              FROM {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} ds_ams_transactiondetail
             INNER JOIN (
                    SELECT DISTINCT customerid
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                     WHERE bvstg_customer_to_refresh.SourceDb = 'CIGH'
                   ) bvstg_customer_to_refresh
                ON bvstg_customer_to_refresh.customerid = ds_ams_transactiondetail.customerid
             WHERE ds_ams_transactiondetail.modeid IN (22,24)
             GROUP BY ds_ams_transactiondetail.customerid
        dependencies:
          - locationName: UNKNOWN
            nodeName: DS_AP1_ANCILLARYPRODUCT
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_ANCILLARYPRODUCT
          - locationName: STAGE
