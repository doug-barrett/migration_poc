    sourceMapping:
      - aliases:
          V_H20_CANCEL_EMAIL: cadd00d1-b913-4108-ae9a-6c2012bd7ef5
          DS_POLICYSUMMARY_V2: 23ba684a-5671-4cfa-9e5f-11f1386d24b3
          DS_AGENT_KEY: e03830da-869e-4c69-8cc5-0b677f38927e
          DS_BVSTG_AP1_CUSTOMER: 63de7b8d-d867-4db2-a0d0-3068b99f119e
          DS_CUSTOMERSUMMARY_V2: c5a432da-156b-460f-ba67-985b9517bedb
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_H20_CANCEL_EMAIL') }} AS /*
            SELECT *  FROM "RETAIL_PROD"."SCH_DSCI"."DS_H20_CANCEL_EMAIL"
            */ SELECT ds_policysummary_v2.POLICYID ,
                   MAX(ds_policysummary_v2.POLICYNUMBER) POLICYNUMBER ,
                   MAX(ds_policysummary_v2.CUSTOMERID) CUSTOMERNO ,
                   MAX(ds_policysummary_v2.SourceDB) SourceDB ,
                   MAX(IFNULL(IFNULL(IFNULL(ds_bvstg_ap1_customer.HOMEPHONE,ds_bvstg_ap1_customer.CELLPHONE),DS_CustomerSummary_v2.CONTACTPHONE),DS_CustomerSummary_v2.CELLPHONE)) PHONE ,
                   MAX(ds_policysummary_v2.POLICYSTATUS) POLICYSTATUS ,
                   MAX(ds_policysummary_v2.CUSTOMERNAME) CUSTOMERNAME ,
                   ds_policysummary_v2.ENDDATE AS STATUS_DATE ,
                   MAX(ds_policysummary_v2.EFFECTIVEDATE) EFFECTIVEDATE ,
                   MAX(ds_policysummary_v2.EXPIRATIONDATE) EXPIRATIONDATE ,
                   MAX(ds_policysummary_v2.BIAPRIMARYAGENTOFFICE) PRIMARY_AGENT_OFFICE ,
                   MAX(ds_agent_key.OfficeCode) AS AgentOfficeCode ,
                   MAX(ds_policysummary_v2.PRODUCERFULLNAME) PRODUCERFULLNAME ,
                   MAX(ds_policysummary_v2.PRODUCERID) PRODUCERID ,
                   MAX(CISCO_LOGINNAME) CISCO_LOGINNAME
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
                ON ds_agent_key.EMPLOYEENUMBER = ds_policysummary_v2.PRODUCERID
               AND ds_agent_key.RANK_EMPLOYEENUMBER = 1
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_CUSTOMER') }} ds_bvstg_ap1_customer
                ON ds_policysummary_v2.CUSTOMERNO = ds_bvstg_ap1_customer.CustomerID
              LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CustomerSummary_v2
                ON ds_policysummary_v2.CUSTOMERID = DS_CustomerSummary_v2.CustomerID
               AND DS_CustomerSummary_v2.SourceDB = 'CIGH'
              LEFT JOIN (
                    SELECT CUSTOMERID,
                           COUNT(1) Qty
                      FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
                     WHERE STATUS_STANDARD = 'Active'
                       AND SourceDB IN ('AppOne','CIGH')
                       AND DATE(CREATED) < CURRENT_DATE()
                     GROUP BY CUSTOMERID
                   )ds_policysummary_v2_active
                ON (ds_policysummary_v2.CustomerID = ds_policysummary_v2_active.CustomerID)
             WHERE ds_policysummary_v2.SOURCEDB IN ('AppOne','CIGH')
               AND ISLEGACYTRANSACTION='Native'
               AND IFNULL(ds_policysummary_v2_active.Qty,0) = 0
               AND ds_policysummary_v2.ENDDATE>DATEADD('DAY',-90,CURRENT_DATE())
               AND ds_policysummary_v2.ENDDATE <= CURRENT_DATE()
               AND ds_policysummary_v2.LINEOFBUSINESSTYPE IN ('Auto','Private Passenger Auto')
               AND ds_policysummary_v2.BIAPRIMARYAGENTOFFICE != 'JOR'
               AND ds_policysummary_v2.PRODUCERID != 'TEST'
               AND STATUS_STANDARD ='Inactive'
               AND DATEDIFF('DAY',ds_policysummary_v2.STARTDATE,ds_policysummary_v2.ENDDATE) <= 90
               AND ds_policysummary_v2.TERM IN ('6 Months','1 Year','6','12')
               AND ds_policysummary_v2.NEXT_TRANSACTIONID IS NULL
             GROUP BY ds_policysummary_v2.POLICYID ,
                      ds_policysummary_v2.ENDDATE
        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_CUSTOMER
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
