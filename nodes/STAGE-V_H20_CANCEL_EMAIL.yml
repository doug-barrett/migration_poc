            {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
            {{ ref('EDW','DS_AGENT_KEY') }}
            {{ ref('STAGE','DS_BVSTG_AP1_CUSTOMER') }}
            {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }}
