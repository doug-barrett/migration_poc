        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_COMM_AU10_EOM_EXTRACT_ALLSOURCES') }} bvstg_comm_au10_eom_extract_allsources -- from RETAIL_PROD.SCH_BVSTAGE.BVSTG_COMM_AU10_EOM_EXTRACT_ALLSOURCES bvstg_comm_au10_eom_extract_allsources  left join  (select distinct   OfficeCode,  statecode,  officetype,  TERRITORYMANAGERNAME,  case when TerritoryManagername = 'Michael Sanchez' then 1 else 0 end as IsFranchise  from {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE   -- from "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE"  ) ds_retail_office  on bvstg_comm_au10_eom_extract_allsources.officecode = ds_retail_office.officecode  left join   (select distinct leadid, leadsource, 1 matchedpolicy   from {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} DS_MKT_LEAD_SOURCE  -- from "RETAIL_PROD"."SCH_EDW"."DS_MKT_LEAD_SOURCE"  qualify row_number() over (partition by leadid order by leadcreated) = 1) ds_mkt_lead_source  on bvstg_comm_au10_eom_extract_allsources.leadid = ds_mkt_lead_source.leadid  left join   (select distinct EmployeeNumber, employeename  from {{ ref('EDW','DS_AGENT_KEY') }} DS_AGENT_KEY   -- from "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY"  where Rank_EmployeeNumber=1   qualify row_number() over (partition by EmployeeNumber order by dss_update_time desc) = 1) ds_agent_key  on ProducerID=ds_agent_key.EmployeeNumber  left join   (select distinct policynumberformatted, carrierdisplayname, paidtypefinal  from {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }} BVSTG_COMM_AU3_EOM_EXTRACT_CS  -- from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU3_EOM_EXTRACT_CS"  -- from BVSTG_COMM_AU3_EOM_EXTRACT_CS  ) bvstg_comm_au3_eom_extract_cs  on bvstg_comm_au10_eom_extract_allsources.policynumberformatted = bvstg_comm_au3_eom_extract_cs.policynumberformatted  and bvstg_comm_au10_eom_extract_allsources.carrier = bvstg_comm_au3_eom_extract_cs.carrierdisplayname    -- Updated 2/21/2022  left join   (select distinct customerid, upper(coalesce(mainstate, mailingstate, garagestate)) CustomerState     from {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CUSTOMERSUMMARY_V2   -- from "RETAIL_PROD"."SCH_EDW"."DS_CUSTOMERSUMMARY_V2"  where sourcedb not in ('Velox','InsuredMine')  qualify row_number() over (partition by customerid order by dss_update_time desc) = 1) ds_customersummary_v2  on bvstg_comm_au10_eom_extract_allsources.CustomerId = ds_customersummary_v2.CustomerID  left join   (SELECT distinct policynumberformatted, carrierdisplayname, sourcedb, 1 OnlineBinding  from {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} DS_RAM_RETAIL_REPOSITORY   -- from "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"  left join   (select distinct PolicyNumber_EDW, CarrierName_EDW, PolicyNumberFormatted,Carrierdisplayname  from {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }} DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF   -- from "RETAIL_PROD"."SCH_EDW"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF"  ) ds_bvstg_comm_policynumberformatting_allsources  on ds_bvstg_comm_policynumberformatting_allsources.PolicyNumber_EDW = ds_ram_retail_repository.PolicyNumber  and ds_bvstg_comm_policynumberformatting_allsources.CarrierName_EDW = ds_ram_retail_repository.CarrierName  WHERE label in ('New Business Auto', 'New Business Complementary')      and counter = 1 and (islegacytransaction is null or islegacytransaction <> 'Migrated')      and upper(trim(officecode)) like '%CONOLB%'  ) ds_ram_retail_repository  on bvstg_comm_au10_eom_extract_allsources.PolicyNumberFormatted = ds_ram_retail_repository.PolicyNumberFormatted  and bvstg_comm_au10_eom_extract_allsources.Carrier = ds_ram_retail_repository.CarrierDisplayName  and bvstg_comm_au10_eom_extract_allsources.policysource=ifnull(ds_ram_retail_repository.sourcedb,'Missing')  left join   (select distinct policynumberformatted, carrier, UPRATE_POLICY_FLAG  from {{ ref('STAGE','BVSTG_COMM_AU1_PREMIUM_PERSISTENCY') }}   -- from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU1_PREMIUM_PERSISTENCY"  ) BVSTG_COMM_AU1_PREMIUM_PERSISTENCY  on bvstg_comm_au10_eom_extract_allsources.policy
