'EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CUSTOMERSUMMARY_V2   -- from "RETAIL_PROD"."SCH_EDW"."DS_CUSTOMERSUMMARY_V2"  where sourcedb not in ('Velox','InsuredMine')  qualify row_number() over (partition by customerid order by dss_update_time desc) = 1) ds_customersummary_v2  on bvstg_comm_au10_eom_extract_allsources.CustomerId = ds_customersummary_v2.CustomerID  left join   (SELECT distinct policynumberformatted, carrierdisplayname, sourcedb, 1 OnlineBinding  from {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} DS_RAM_RETAIL_REPOSITORY   -- from "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"  left join   (select distinct PolicyNumber_EDW, CarrierName_EDW, PolicyNumberFormatted,Carrierdisplayname  from {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }} DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF   -- from "RETAIL_PROD"."SCH_EDW"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF"  ) ds_bvstg_comm_policynumberformatting_allsources  on ds_bvstg_comm_policynumberformatting_allsources.PolicyNumber_EDW = ds_ram_retail_repository.PolicyNumber  and ds_bvstg_comm_policynumberformatting_allsources.CarrierName_EDW = ds_ram_retail_repository.CarrierName  WHERE label in ('New Business Auto', 'New Business Complementary')      and counter = 1 and (islegacytransaction is null or islegacytransaction <> 'Migrated')      and upper(trim(officecode)) like '%CONOLB%'  ) ds_ram_retail_repository  on bvstg_comm_au10_eom_extract_allsources.PolicyNumberFormatted = ds_ram_retail_repository.PolicyNumberFormatted  and bvstg_comm_au10_eom_extract_allsources.Carrier = ds_ram_retail_repository.CarrierDisplayName  and bvstg_comm_au10_eom_extract_allsources.policysource=ifnull(ds_ram_retail_repository.sourcedb,'Missing')  left join   (select distinct policynumberformatted, carrier, UPRATE_POLICY_FLAG  from {{ ref('STAGE','BVSTG_COMM_AU1_PREMIUM_PERSISTENCY') }}   -- from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU1_PREMIUM_PERSISTENCY"  ) BVSTG_COMM_AU1_PREMIUM_PERSISTENCY  on bvstg_comm_au10_eom_extract_allsources.policy
