          FROM {{ ref('GOLD', 'SRC_EMPLOYEE_Load') }} "SRC_EMPLOYEE_Load"
          
          LEFT OUTER JOIN "DOUG_POC"."DP001"."CV_EMPLOYEE"
            ON UR.UTILITY.UDF_CHAR_TO_INT(SRC_EMPLOYEE_Load.EMPLID) = CV_EMPLOYEE.Employee_Id
          
          LEFT OUTER JOIN {{ ref('GOLD', 'DV_LOCATION') }} "DV_LOCATION"
            ON SRC_EMPLOYEE_Load.WORKLOCATION = DV_LOCATION.Location_Code
          
          LEFT OUTER JOIN {{ ref('GOLD', 'ETL_LDAP') }} "ETL_LDAP"
            ON UPPER(TRIM(SRC_EMPLOYEE_Load.USERID) || '@ur.com') = UPPER(TRIM(ETL_LDAP.Logon_Name))
          
          LEFT OUTER JOIN {{ ref('GOLD', 'BUS_FAST_CURRENT_EMP_DRIVER') }} "BUS_FAST_CURRENT_EMP_DRIVER" 
            ON UR.UTILITY.UDF_CHAR_TO_INT(SRC_EMPLOYEE_Load.EMPLID) = BUS_FAST_CURRENT_EMP_DRIVER.Employee_Id
          
          LEFT OUTER JOIN {{ ref('GOLD', 'BUS_EMPLOYEE_USER_ID') }} "BUS_EMPLOYEE_USER_ID"
            ON UR.UTILITY.UDF_CHAR_TO_INT(SRC_EMPLOYEE_Load.EMPLID) = BUS_EMPLOYEE_USER_ID.Payroll_Num
          
          LEFT OUTER JOIN (
            SELECT 
                Address_Id
              , Address_Text_1 
              FROM {{ ref('GOLD', 'CV_ADDRESS') }} "EMAIL_ADDRESS"
              WHERE Address_Type_Code = 'E'
                AND Company_Code = 'U1'
            ) AS CV_ADDRESS
            ON UPPER(SRC_EMPLOYEE_Load.BUSNEMAIL) = UPPER(CV_ADDRESS.Address_Text_1) WHERE CAST(SRC_EMPLOYEE_Load.Load_DTTM AS DATE) > (SELECT MAX(HV_EMPLOYEE.Effective_Begin_Date) FROM "DOUG_POC"."DP001"."HV_EMPLOYEE")
          
          QUALIFY RANK()
          OVER (PARTITION BY EMPLID ORDER BY JOBENTRYDATE DESC) = 1
