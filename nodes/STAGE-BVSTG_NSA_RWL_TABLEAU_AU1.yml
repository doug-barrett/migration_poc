        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_TABLEAU_AU1
        join:
          joinCondition: |-
            FROM (
                    WITH EXACT_RENEWALS AS (
                            SELECT BL.TRANSACTIONID,
                                   BL.CUSTOMERID,
                                   BL.EFFECTIVEDATE,
                                   MAX(CASE WHEN COUNTER IS NULL THEN 0 ELSE 1 END) AS TARGET_RAM,
                                   MAX(CASE WHEN COUNTER IS NULL THEN 'Not Renewed' ELSE RR.CLASSIFICATIONGROUP END) NEXT_POLICY_STATUS_RAM
                              FROM DATA_ANALYTICS.DS_FEATURE_REPO.NB_NSA_RWL_FOLLOWUP_EXTRACT BL
                              LEFT JOIN (
                                    SELECT DISTINCT TRANSACTIONID,
                                           NBTRANSACTIONID,
                                           CUSTOMERID,
                                           DATE(CREATEDDATE) AS CREATEDDATE,
                                           CLASSIFICATIONGROUP,
                                           1 AS COUNTER
                                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                                     WHERE 1 = 1
                                       AND LINEOFBUSINESSTYPE = 'Auto'
                                       AND SOURCEDB = 'AppOne'
                                       AND CLASSIFICATION = 'Carrier Premium'
                                       AND CLASSIFICATIONGROUP IN ('New Business', 'Renewal')
                                   ) RR
                                ON (BL.CUSTOMERID = RR.CUSTOMERID AND DATE(RR.CREATEDDATE) > BL.EFFECTIVEDATE AND BL.TRANSACTIONID = RR.NBTRANSACTIONID)
                             GROUP BY BL.TRANSACTIONID,
                                      BL.CUSTOMERID,
                                      BL.EFFECTIVEDATE
                             ORDER BY BL.CUSTOMERID ASC
                           ) ,
                           NEW_BUSINESS AS (
                            SELECT A.TRANSACTIONID,
                                   A.CUSTOMERID,
                                   A.EFFECTIVEDATE ,
                                   MAX(CASE WHEN RR.COUNTER IS NULL THEN 0 ELSE 1 END) AS TARGET_RAM ,
                                   MAX(CASE WHEN RR.COUNTER IS NULL THEN 'Not Renewed' ELSE RR.CLASSIFICATIONGROUP END) NEXT_POLICY_STATUS_RAM
                              FROM (
                                    SELECT *
                                      FROM EXACT_RENEWALS
                                     WHERE TARGET_RAM = 0
                                   ) A
                              LEFT JOIN (
                                    SELECT DISTINCT TRANSACTIONID,
                                           NBTRANSACTIONID,
                                           CUSTOMERID,
                                           DATE(CREATEDDATE) AS CREATEDDATE,
                                           CLASSIFICATIONGROUP,
                                           1 AS COUNTER
                                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                                     WHERE 1 = 1
                                       AND NBTRANSACTIONID IS NULL
                                       AND LINEOFBUSINESSTYPE = 'Auto'
                                       AND SOURCEDB = 'AppOne'
                                       AND CLASSIFICATION = 'Carrier Premium'
                                       AND CLASSIFICATIONGROUP IN ('New Business')
                                   ) RR
                                ON (A.CUSTOMERID = RR.CUSTOMERID AND DATE(RR.CREATEDDATE) > A.EFFECTIVEDATE)
                             GROUP BY A.TRANSACTIONID,
                                      A.CUSTOMERID,
                                      A.EFFECTIVEDATE
                           ) SELECT *
                      FROM EXACT_RENEWALS
                     WHERE TARGET_RAM = 1
                 UNION ALL SELECT *
                      FROM NEW_BUSINESS
                   ) bvstg_nsa_rwl_tableau_au1
