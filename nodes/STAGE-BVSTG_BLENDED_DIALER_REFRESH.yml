        join:
          joinCondition: |-
            FROM "RETAIL_PROD"."SCH_EDW"."DS_INACTIVE_POLICIES" ds_inactive_policies
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_MKT_CALL_CUSTOMER" DS_MKT_CALL_CUSTOMER
                ON DS_INACTIVE_POLICIES.CustomerID = DS_MKT_CALL_CUSTOMER.CustomerID
               AND DS_MKT_CALL_CUSTOMER.SOURCEDB_CUSTOMER = 'AppOne'
               AND DS_MKT_CALL_CUSTOMER.TCONNECTED >= 10
               AND DS_MKT_CALL_CUSTOMER.STARTDATETIME >= CURRENT_DATE() - 90
             WHERE DS_INACTIVE_POLICIES.ISDIALER = 1
               AND ds_inactive_policies.TIMEZONEBIAS IS NOT NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY DS_INACTIVE_POLICIES.CustomerID ORDER BY DS_MKT_CALL_CUSTOMER.STARTDATETIME DESC)=1
