          DS_MKT_CALL_CUSTOMER: b9bec5bd-83fe-4758-95ec-851f723f90ef
          DS_PCCE_TERMINATION_CALL_AGENT_SESSION: 7f87fcca-2084-4933-bc16-b97046b80bfa
          DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION: 850b9b98-fb4d-4e24-ba0d-fc1300bcbebb
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_H20_ACTIVE_EMAIL') }} AS SELECT ds_h20_cancel_email.ID ,
                   MAX(ds_h20_cancel_email.POLICYID) AS POLICYID ,
                   MAX(ds_h20_cancel_email.POLICYNUMBER) AS POLICYNUMBER ,
                   MAX(ds_h20_cancel_email.SourceDB) AS SourceDB ,
                   MAX(ds_h20_cancel_email.CUSTOMERNO) AS CUSTOMERNO ,
                   MAX(ds_h20_cancel_email.CUSTOMERNAME) AS CUSTOMERNAME ,
                   MAX(ds_h20_cancel_email.PHONE) AS PHONE ,
                   MAX(ds_h20_cancel_email.LAST_PHONE_DIGIT) AS LAST_PHONE_DIGIT ,
                   MAX(ds_h20_cancel_email.CISCO_LOGINNAME) AS CISCO_LOGINNAME ,
                   MAX(ds_h20_cancel_email.POLICYSTATUS) AS POLICYSTATUS ,
                   MAX(ds_h20_cancel_email.STATUS_DATE) AS STATUS_DATE ,
                   MAX(ds_h20_cancel_email.EFFECTIVEDATE) AS EFFECTIVEDATE ,
                   MAX(ds_h20_cancel_email.EXPIRATIONDATE) AS EXPIRATIONDATE ,
                   MAX(ds_h20_cancel_email.PRODUCERID) AS PRODUCERID ,
                   MAX(ds_h20_cancel_email.PRODUCERFULLNAME) AS PRODUCERFULLNAME ,
                   MAX(ds_h20_cancel_email.PRIMARY_AGENT_OFFICE) AS PRIMARY_AGENT_OFFICE ,
                   MAX(ds_h20_cancel_email.AGENTOFFICECODE) AS AGENTOFFICECODE ,
                   MAX(ds_h20_cancel_email.ISREADY) AS ISREADY ,
                   MAX(ds_h20_cancel_email.ACTIVE_TRANSACTIONID) AS ACTIVE_TRANSACTIONID ,
                   MAX(ds_h20_cancel_email.ACTIVE_STATUSDATE) AS ACTIVE_STATUSDATE ,
                   MAX(ds_h20_cancel_email.ACTIVE_STATUS) AS ACTIVE_STATUS ,
                   MAX(ds_h20_cancel_email.ACTIVE_REASON) AS ACTIVE_REASON ,
                   MAX(CASE WHEN ds_h20_cancel_email.statusCreated IS NULL THEN v_s_policystatuschange_mroc_current.statusCreated ELSE ds_h20_cancel_email.statusCreated END) statusCreated ,
                   MAX(DS_PCCE_TERMINATION_CALL_AGENT_SESSION.ENDDATETIME) LATEST_PRODUCER_CONNECT ,
                   COUNT(DISTINCT CASE WHEN DS_PCCE_TERMINATION_CALL_AGENT_SESSION.SESSIONID IS NOT NULL THEN DS_PCCE_TERMINATION_CALL_AGENT_SESSION.SESSIONID ELSE NULL END) Producer_Calls ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer.DIRECTION = 1 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME >= 0 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN ds_mkt_call_customer.INTERACTIONIDKEY ELSE NULL END) Inbound_0 ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer.DIRECTION = 1 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME > 10 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN ds_mkt_call_customer.INTERACTIONIDKEY ELSE NULL END) Inbound_10 ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer.DIRECTION = 1 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME > 30 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN ds_mkt_call_customer.INTERACTIONIDKEY ELSE NULL END) Inbound_30 ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer.DIRECTION = 1 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME > 90 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN ds_mkt_call_customer.INTERACTIONIDKEY ELSE NULL END) Inbound_90 ,
                   MAX(CASE WHEN ds_mkt_call_customer.DIRECTION = 1 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME > 10 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN ds_mkt_call_customer.ENDDATETIME ELSE NULL END) LATEST_Inbound_CONNECT ,
                   MAX(CASE WHEN ds_mkt_call_customer.DIRECTION = 1 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME >= 0 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN DS_PCCE_TERMINATION_CALL_AGENT_SESSION.ENDDATETIME ELSE NULL END) LATEST_Inbound_Attempt ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer.DIRECTION = 2 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME >= 0 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN ds_mkt_call_customer.INTERACTIONIDKEY ELSE NULL END) Outbound_0 ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer.DIRECTION = 2 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME > 10 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN ds_mkt_call_customer.INTERACTIONIDKEY ELSE NULL END) Outbound_10 ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer.DIRECTION = 2 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME > 30 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN ds_mkt_call_customer.INTERACTIONIDKEY ELSE NULL END) Outbound_30 ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer.DIRECTION = 2 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME > 90 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN ds_mkt_call_customer.INTERACTIONIDKEY ELSE NULL END) Outbound_90 ,
                   MAX(CASE WHEN ds_mkt_call_customer.DIRECTION = 2 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME > 10 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN DS_PCCE_TERMINATION_CALL_AGENT_SESSION.ENDDATETIME ELSE NULL END) LATEST_Outbound_CONNECT ,
                   MAX(CASE WHEN ds_mkt_call_customer.DIRECTION = 2 AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME >= 0 AND DATE(ds_mkt_call_customer.ENDDATETIME) >= '2021-06-08' THEN DS_PCCE_TERMINATION_CALL_AGENT_SESSION.ENDDATETIME ELSE NULL END) LATEST_Outbound_Attempt ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer_all.CustomerID IS NOT NULL THEN ds_mkt_call_customer_all.INTERACTIONIDKEY ELSE NULL END) ALL_CALLS ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer_all.CustomerID IS NOT NULL AND DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION_ALL.TALKTIME > 10 THEN ds_mkt_call_customer_all.INTERACTIONIDKEY ELSE NULL END) ALL_CONNECTED_CALLS ,
                   MAX(CASE WHEN ds_mkt_call_customer_all.CustomerID IS NOT NULL THEN ds_mkt_call_customer_all.ENDDATETIME ELSE NULL END) LATEST_ALL_CONNECT ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer_all.CustomerID IS NOT NULL AND ds_mkt_call_customer_all.DIRECTION = 2 THEN ds_mkt_call_customer_all.INTERACTIONIDKEY ELSE NULL END) ALL_OUTBOUND_CALLS ,
                   COUNT(DISTINCT CASE WHEN ds_mkt_call_customer_all.CustomerID IS NOT NULL AND ds_mkt_call_customer_all.DIRECTION = 2 AND DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION_ALL.TALKTIME > 10 THEN ds_mkt_call_customer_all.INTERACTIONIDKEY ELSE NULL END) ALL_OUTBOUND_CONNECTED_CALLS ,
                   MAX(CASE WHEN ds_mkt_call_customer_all.CustomerID IS NOT NULL AND ds_mkt_call_customer_all.DIRECTION = 2 THEN ds_mkt_call_customer_all.ENDDATETIME ELSE NULL END) LATEST_OUTBOUND_ALL_CONNECT ,
                   COUNT(DISTINCT CASE WHEN DS_PCCE_TERMINATION_CALL_AGENT_SESSION_Office.SESSIONID IS NOT NULL THEN DS_PCCE_TERMINATION_CALL_AGENT_SESSION_Office.SESSIONID ELSE NULL END) ALL_CALLS_SAME_OFFICE
              FROM {{ ref('STAGE','DS_H20_CANCEL_EMAIL') }} ds_h20_cancel_email
              LEFT JOIN (
                    SELECT a.created statusCreated,
                           a1.policyID,
                           a1.Status_Date
                      FROM {{ ref('STAGE','DS_H20_CANCEL_EMAIL') }} a1
                     INNER JOIN {{ ref('STAGE','V_S_AP1_POLICYSTATUSCHANGE_MROC_CURRENT') }} a
                        ON a1.PolicyID = TO_VARCHAR(a.PolicyID)
                     INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_POLICY') }} b
                        ON (a.policyID = b.PolicyID AND a.POLICYSTATUSID = b.POLICYSTATUSID AND a.EFFECTIVEDATE = b.StatusDate AND b.TRANSACTIONTYPE = 'New Business')
                       AND a1.ACTIVE_REASON = 'Reinstated Same Policy' QUALIFY ROW_NUMBER() OVER (PARTITION BY a1.policyID ORDER BY a.Created DESC) = 1
                   ) v_s_policystatuschange_mroc_current
                ON v_s_policystatuschange_mroc_current.policyID = ds_h20_cancel_email.policyID
               AND v_s_policystatuschange_mroc_current.Status_Date = ds_h20_cancel_email.Status_Date
               AND ds_h20_cancel_email.statusCreated IS NULL
              LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} ds_mkt_call_customer
                ON ds_h20_cancel_email.Customerno = ds_mkt_call_customer.CustomerID
               AND ds_mkt_call_customer.ENDDATETIME > ds_h20_cancel_email.STATUS_DATE
               AND DATE(ds_mkt_call_customer.ENDDATETIME) <= DATE(IFNULL(IFNULL(ds_h20_cancel_email.statusCreated,v_s_policystatuschange_mroc_current.statusCreated),CURRENT_DATE()))
              LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} DS_PCCE_TERMINATION_CALL_AGENT_SESSION
                ON DS_PCCE_TERMINATION_CALL_AGENT_SESSION.SESSIONID=ds_mkt_call_customer.INTERACTIONIDKEY
               AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.AGENT = ds_h20_cancel_email.CISCO_LOGINNAME
              LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} DS_PCCE_TERMINATION_CALL_AGENT_SESSION_Office
                ON DS_PCCE_TERMINATION_CALL_AGENT_SESSION_Office.SESSIONID=ds_mkt_call_customer.INTERACTIONIDKEY
               AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION_Office.AGENTOFFICE = ds_h20_cancel_email.AGENTOFFICECODE
              LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} ds_mkt_call_customer_all
                ON ds_h20_cancel_email.Customerno = ds_mkt_call_customer_all.CustomerID
               AND ds_mkt_call_customer_all.ENDDATETIME > ds_h20_cancel_email.STATUS_DATE
               AND DATE(ds_mkt_call_customer_all.ENDDATETIME) >= '2021-06-08'
               AND DATE(ds_mkt_call_customer_all.ENDDATETIME) <= DATE(IFNULL(IFNULL(ds_h20_cancel_email.statusCreated,v_s_policystatuschange_mroc_current.statusCreated),CURRENT_DATE()))
              LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION_ALL
                ON DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION_ALL.ID=ds_mkt_call_customer_all.INTERACTIONIDKEY --WHERE  isReady = 0

             GROUP BY ds_h20_cancel_email.ID
        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: STAGE
            nodeName: DS_H20_CANCEL_EMAIL
          - locationName: STAGE
            nodeName: V_S_AP1_POLICYSTATUSCHANGE_MROC_CURRENT
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_POLICY
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_AGENT_SESSION
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
            {{ ref('STAGE','DS_H20_CANCEL_EMAIL') }}
            {{ ref('STAGE','V_S_AP1_POLICYSTATUSCHANGE_MROC_CURRENT') }}
            {{ ref('STAGE','DS_BVSTG_AP1_POLICY') }}
            {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }}
            {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }}
            {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }}
        name: V_H20_ACTIVE_EMAIL
        noLinkRefs: []
