        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','V_DLBV_PCCE_DL_5026_5026_CURRENT') }} V_DLBV_PCCE_DL_5026_5026_CURRENT
              LEFT JOIN (
                    SELECT detail.DialingListID ,
                           MIN(calls.FIRST_AGENTNAME) FIRST_AGENTNAME ,
                           MIN(calls.FIRST_AGENTOFFICE) FIRST_AGENTOFFICE ,
                           MAX(calls.DURATION) DURATION ,
                           MAX(calls.RINGTIME) RINGTIME ,
                           MAX(calls.TALKTIME) TALKTIME ,
                           MAX(calls.WORKTIME) WORKTIME ,
                           MAX(TO_NUMBER(detail.PREVIEWTIME/1000)) PREVIEWTIME ,
                           COUNT(1) calls ,
                           MIN(calls.STARTDATETIME) STARTDATETIME ,
                           MAX(detail.datetime) datetime ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'A' THEN 1 ELSE 0 END) Active ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'B' THEN 1 ELSE 0 END) Callback ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'C' THEN 1 ELSE 0 END) Closed ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'D' THEN 1 ELSE 0 END) Dialed ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'F' THEN 1 ELSE 0 END) Fax_Machine ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'L' THEN 1 ELSE 0 END) Not_Allocated ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'J' THEN 1 ELSE 0 END) Agent_rejected ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'M' THEN 1 ELSE 0 END) Max_num_attempts_reached ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'P' THEN 1 ELSE 0 END) Pending ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'R' THEN 1 ELSE 0 END) Retry ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'S' THEN 1 ELSE 0 END) callback_was_requested ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'U' THEN 1 ELSE 0 END) UNKNOWN ,
