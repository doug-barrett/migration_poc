                           SUM(CASE detail.CallStatusZone1 WHEN 'M' THEN 1 ELSE 0 END) Max_num_attempts_reached ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'P' THEN 1 ELSE 0 END) Pending ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'R' THEN 1 ELSE 0 END) Retry ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'S' THEN 1 ELSE 0 END) callback_was_requested ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'U' THEN 1 ELSE 0 END) UNKNOWN ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'X' THEN 1 ELSE 0 END) agent_is_not_available
                      FROM {{ ref('STAGE','V_DLBV_PCCE_DIALER_DETAIL_CURRENT') }} detail
                      LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} calls
                        ON calls.ID = CONCAT(detail.RouterCallKey,'-',detail.RouterCallKeyDay)
                     WHERE detail.QueryRuleID=5026
                     GROUP BY detail.DialingListID
                   ) V_DLBV_PCCE_DIALER_DETAIL_CURRENT
                ON V_DLBV_PCCE_DL_5026_5026_CURRENT.DialingListID = V_DLBV_PCCE_DIALER_DETAIL_CURRENT.DialingListID
              LEFT JOIN ( SELECT b.DialingListID ,
                   a.callresult AS last_CallResult ,
                   CASE a.CallResult WHEN '0' THEN 'Dialer has not yet attempted to contact that customer record' WHEN '2' THEN 'Error condition while dialing' WHEN '3' THEN 'Number reported not in service by network' WHEN '4' THEN 'No ringback from network when dial attempted' WHEN '5' THEN 'Operator intercept returned from network when dial attempted' WHEN '6' THEN 'No dial tone when dialer port went off hook' WHEN '7' THEN 'Number reported as invalid by the network' WHEN '8' THEN 'Customer phone did not answer' WHEN '9' THEN 'Customer phone was busy' WHEN '10' THEN 'Customer answered and was connected to agent' WHEN '11' THEN 'Fax machine detected' WHEN '12' THEN 'Answering machine detected' WHEN '13' THEN 'Dialer stopped dialing customer due to lack of agents or network stopped dialing before it was complete' WHEN '14' THEN 'Customer requested callback' WHEN '15' THEN 'Answering machine requested callback' WHEN '16' THEN 'Call was abandoned by the dialer due to lack of agents' WHEN '17' THEN 'Failed to reserve agent for personal callback.' WHEN '18' THEN 'Agent rejected a preview call or personal callback call.' WHEN '19' THEN 'Agent rejected a preview call with the close option.' WHEN '20' THEN 'Customer has been abandoned to an IVR' WHEN '21' THEN 'Customer dropped call within configured abandoned time' WHEN '22' THEN 'Mostly used with TDM switches - network answering machine, such as a network voicemail' WHEN '23' THEN 'Number successfully contacted but wrong number' WHEN '24' THE
        name: BVSTG_SPECIALTY_DIALER_RESULT
        noLinkRefs: []
