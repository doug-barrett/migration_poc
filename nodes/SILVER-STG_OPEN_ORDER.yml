    - aliases:
        CDC_RAOHDRFL: c694c5c1-2f10-5574-b33a-9f3c16b32e7a
        PARTY: 3a625579-b31e-596c-b22c-35345677b3b7
        CUSTOMER_JOB: 9e36d1be-5998-5e03-bc79-da2580cd99d4
        LOCATION: fc31ae84-5b0b-5e1e-b998-bb5742721756
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: CDC_RAOHDRFL
        - locationName: GOLD
          nodeName: PARTY
        - locationName: GOLD
          nodeName: CUSTOMER_JOB
        - locationName: GOLD
          nodeName: LOCATION
      join:
        joinCondition: |-
          FROM [CDC_RAOHDRFL] CDC_RAOHDRFL
          
          LEFT OUTER JOIN [LOCATION] LOCATION
          ON CDC_RAOHDRFL.RHCMP = LOCATION.Company_Code
          AND CDC_RAOHDRFL.RHLOC = LOCATION.Location_Code
          AND LOCATION.dss_current_flag = 'Y'
          
          LEFT OUTER JOIN [PARTY] PARTY
          ON   CDC_RAOHDRFL.RHCMP = PARTY.Company_Code
          AND CDC_RAOHDRFL.Customer_Account_Num = PARTY.Customer_Account_Num
          AND CDC_RAOHDRFL.Customer_Account_Char = PARTY.Customer_Account_Char
          AND PARTY.Party_Type_Code in (1,2)
          AND PARTY.dss_current_flag = 'Y'
          
          LEFT OUTER JOIN [CUSTOMER_JOB] CUSTOMER_JOB
          ON   CDC_RAOHDRFL.RHCMP = CUSTOMER_JOB.Company_Code
          AND CDC_RAOHDRFL.RHJOB# = CUSTOMER_JOB.Job_Num
          AND PARTY.Party_Id = CUSTOMER_JOB.Party_Id
          AND CUSTOMER_JOB.dss_current_flag = 'Y'
