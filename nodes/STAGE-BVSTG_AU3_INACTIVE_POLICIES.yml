    sourceMapping:
      - aliases:
          BVSTG_AU2_INACTIVE_POLICIES: 80bee4c1-2398-4e5c-bbeb-0dd7b4b55477
          V_PREB_INACTIVE_POLICY_ALL_CALLS: 4fe0d3c1-5034-4944-88ca-30f842502422
          DS_INACTIVE_POLICIES_MAGUIRE: 59e51c11-1cd6-45a9-bcc1-f009fac82f17
