          DS_BLENDED_DIALER_RESULT: d7baf630-bf81-40b0-beee-dc94a5338194
          V_PREB_DNC: 25a90c4c-26d0-4a41-b31e-a97f861a2fbe
          DS_RETAIL_OFFICE: 581aed87-ec65-482f-aa6f-9a04a9d54476
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU2_INACTIVE_POLICIES
          - locationName: STAGE
            nodeName: V_PREB_INACTIVE_POLICY_ALL_CALLS
          - locationName: UNKNOWN
            nodeName: V_PREB_INACTIVE_POLICY_BLENDED_CALLS
          - locationName: UNKNOWN
            nodeName: V_PREB_INACTIVE_POLICY_MAGUIRE_CALLS
          - locationName: UNKNOWN
            nodeName: V_PREB_INACTIVE_POLICY_PRODUCEREMAIL_CALLS
          - locationName: UNKNOWN
            nodeName: V_PREB_INACTIVE_POLICY_PRODUCER_AGENT_CALLS
          - locationName: EDW
            nodeName: DS_INACTIVE_POLICIES_MAGUIRE
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
          - locationName: EDW
            nodeName: DS_BLENDED_DIALER_RESULT
          - locationName: STAGE
            nodeName: V_PREB_DNC
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU2_INACTIVE_POLICIES') }} bvstg_au2_inactive_policies
              LEFT JOIN {{ ref('STAGE','V_PREB_INACTIVE_POLICY_ALL_CALLS') }} v_preb_inactive_policy_all_calls
                ON bvstg_au2_inactive_policies.id = v_preb_inactive_policy_all_calls.id
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_INACTIVE_POLICY_BLENDED_CALLS') }} v_preb_inactive_policy_blended_calls
                ON bvstg_au2_inactive_policies.id = v_preb_inactive_policy_blended_calls.id
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_INACTIVE_POLICY_MAGUIRE_CALLS') }} v_preb_inactive_policy_maguire_calls
                ON bvstg_au2_inactive_policies.id = v_preb_inactive_policy_maguire_calls.id
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_INACTIVE_POLICY_PRODUCEREMAIL_CALLS') }} v_preb_inactive_policy_produceremail_calls
                ON bvstg_au2_inactive_policies.id = v_preb_inactive_policy_produceremail_calls.id
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_INACTIVE_POLICY_PRODUCER_AGENT_CALLS') }} v_preb_inactive_policy_producer_agent_calls
                ON bvstg_au2_inactive_policies.id = v_preb_inactive_policy_producer_agent_calls.id
              LEFT JOIN {{ ref('EDW','DS_INACTIVE_POLICIES_MAGUIRE') }} ds_inactive_policies_maguire
                ON bvstg_au2_inactive_policies.id = ds_inactive_policies_maguire.id
              LEFT JOIN (
                    SELECT MD5(PolicyID || Status_Date) ID ,
                           COUNT(DISTINCT DATE(INSERTEDDATE)) Producer_Email_sent ,
                           MIN(INSERTEDDATE) First_Producer_Email_sent ,
                           MAX(INSERTEDDATE) Latest_Producer_Email_sent
                      FROM RETAIL_PROD.SCH_EDW.DS_INACTIVE_POLICIES_EMAIL
                     GROUP BY MD5(PolicyID || Status_Date)
                   )v_dlbv_boe_lapse_model_emails_sent_current
                ON v_dlbv_boe_lapse_model_emails_sent_current.id = bvstg_au2_inactive_policies.id
              LEFT JOIN (
                    SELECT CNL.id ,
                           TCA.AGENTNAME ,
                           CASE WHEN ISINBOUND = 1 THEN 'Inbound'
                                ELSE 'Outbound'
                                 END Call_Direction ,
                           TCA.TALKTIME ,
                           TCA.AGENTOFFICE
                      FROM {{ ref('STAGE','BVSTG_AU2_INACTIVE_POLICIES') }} CNL
                     INNER JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} CC
                        ON CNL.CustomerID = CC.CustomerID
                       AND CC.SOURCEDB_CUSTOMER = CNL.SOURCEDB
                       AND CC.ENDDATETIME > CNL.Status_Date
                       AND DATE(CC.ENDDATETIME) <= DATE(IFNULL(CNL.End_inactivePolicy_Date,CURRENT_DATE()))
                     INNER JOIN "RETAIL_PROD"."SCH_EDW"."DS_PCCE_TERMINATION_CALL_AGENT_SESSION" TCA
                        ON TCA.SESSIONID=CC.INTERACTIONIDKEY
                       AND TALKTIME > 10 QUALIFY ROW_NUMBER() OVER (PARTITION BY CNL.id ORDER BY TCA.startdatetime DESC)=1
                   )DS_PCCE_TERMINATION_CALL_AGENT_SESSION_Max
                ON bvstg_au2_inactive_policies.id = DS_PCCE_TERMINATION_CALL_AGENT_SESSION_Max.id
              LEFT JOIN(
                    SELECT MD5(PolicyID || Status_Date) ID ,
                           MIN(DATE(INSERTEDDATE)) First_Dialer_Uploaded ,
                           MAX(DATE(INSERTEDDATE)) Last_Dialer_Uploaded ,
                           MAX(TALKTIME) Dialer_max_talktime ,
                           COUNT(DISTINCT DATE(INSERTEDDATE)) Dialer_Uploaded ,
                           COUNT(DISTINCT CASE WHEN TalkTime>0 THEN DATE(INSERTEDDATE) ELSE NULL END) Dialer_Contact_days
                      FROM {{ ref('EDW','DS_BLENDED_DIALER_RESULT') }}
                     GROUP BY MD5(PolicyID || Status_Date)
                   ) ds_blended_dialer_result
                ON bvstg_au2_inactive_policies.id = ds_blended_dialer_result.id
              LEFT JOIN (
                    SELECT DISTINCT CustomerID
                      FROM {{ ref('STAGE','V_PREB_DNC') }}
                   ) V_PREB_DNC
                ON V_PREB_DNC.CustomerID = bvstg_au2_inactive_policies.CustomerID
              LEFT JOIN (
                    SELECT DISTINCT REPLACE(REPLACE(REPLACE(REPLACE(PHONE,')'),'('),'-'),' ') PhoneOffice
                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                   )PhoneOffice
                ON PhoneOffice.PhoneOffice = bvstg_au2_inactive_policies.Phone
