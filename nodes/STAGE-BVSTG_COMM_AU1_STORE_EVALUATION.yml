    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          DS_RAM_RETAIL_REPOSITORY: 39a9b6bb-124a-4925-91e8-c1b9157d7e95
          DS_COMM_EOM_EXTRACT_ALLSOURCES: 2b203c3a-983b-4862-9cb4-5a58db260d09
          DS_RETAIL_OFFICE: 581aed87-ec65-482f-aa6f-9a04a9d54476
          DS_BVSTG_TRANSACTION_METHOD_TYPE: 3a3cd324-bee9-4d14-b812-6ca4745ac411
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: EDW
            nodeName: DS_COMM_EOM_EXTRACT_ALLSOURCES
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: STAGE
            nodeName: DS_BVSTG_TRANSACTION_METHOD_TYPE
        join:
          joinCondition: |-
            FROM (
                    SELECT date_trunc('month',date(createddate)) asofmonth,
                           officecode,
                           SUM(CASE WHEN classification = 'Ancillary' THEN amount ELSE 0 END) total_ancillary_amount,
                           SUM(CASE WHEN classification IN ('Fee','Service Transactions Fee') THEN amount ELSE 0 END) total_fee_amount,
                           SUM(CASE WHEN label IN ('New Business Auto','New Business Complementary') THEN counter ELSE 0 END)TOTALNEWPOLICY,
                           CASE WHEN SUM(CASE WHEN label IN ('New Business Auto','New Business Complementary') THEN counter ELSE 0 END) =0                 THEN 'Zero, 0'
                                WHEN SUM(CASE WHEN label IN ('New Business Auto','New Business Complementary') THEN counter ELSE 0 END) BETWEEN 0 AND 20   THEN 'Alert, 1-20'
                                WHEN SUM(CASE WHEN label IN ('New Business Auto','New Business Complementary') THEN counter ELSE 0 END) BETWEEN 21 AND 40  THEN 'Review, 21-40'
                                WHEN SUM(CASE WHEN label IN ('New Business Auto','New Business Complementary') THEN counter ELSE 0 END) BETWEEN 41 AND 80  THEN 'Coach, 41-80'
                                WHEN SUM(CASE WHEN label IN ('New Business Auto','New Business Complementary') THEN counter ELSE 0 END) BETWEEN 81 AND 150 THEN 'Promote, 81-150'
                                WHEN SUM(CASE WHEN label IN ('New Business Auto','New Business Complementary') THEN counter ELSE 0 END)> 150               THEN 'Leverage, >150'
                                 END AS prod_category
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                     GROUP BY date_trunc('month',date(createddate)),
                              officecode
                   ) ds_ram_retail_repository
              FULL OUTER JOIN (
                    SELECT DISTINCT asofmonth,
                           officecode,
                           sum(isrenewalmonth) renewals
                      FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}
                     WHERE combinedstatus_eom='Active'
                     GROUP BY asofmonth,
                              officecode
                   ) ds_comm_eom_extract_allsources
                ON ds_ram_retail_repository.asofmonth=ds_comm_eom_extract_allsources.asofmonth
               AND ifnull(ds_ram_retail_repository.officecode,'-')=ifnull(ds_comm_eom_extract_allsources.officecode,'-')
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ifnull(ds_ram_retail_repository.officecode,ds_comm_eom_extract_allsources.officecode)=ds_retail_office.officecode
              LEFT JOIN (
                    SELECT officecode,
                           date_trunc('month',date(date))
                     MONTH,
                           sum(CASE WHEN METHOD='Online' THEN 1 ELSE 0 END)
                    ONLINE,
                           sum(CASE WHEN METHOD='Phone' THEN 1 ELSE 0 END) phone,
                           sum(CASE WHEN METHOD='Store' THEN 1 ELSE 0 END) store,
                           sum(CASE WHEN METHOD='Store' AND label IN ('New Business Auto','New Business Complementary') THEN 1 ELSE 0 END) instoresale,
                           CASE WHEN SUM(CASE WHEN METHOD='Store' THEN 1 ELSE 0 END) =0                  THEN 'Zero, 0'
                                WHEN SUM(CASE WHEN METHOD='Store' THEN 1 ELSE 0 END) BETWEEN 0 AND 30    THEN 'Very Low,1-30'
                                WHEN SUM(CASE WHEN METHOD='Store' THEN 1 ELSE 0 END) BETWEEN 31 AND 60   THEN 'Low, 31-60'
                                WHEN SUM(CASE WHEN METHOD='Store' THEN 1 ELSE 0 END) BETWEEN 61 AND 140  THEN 'Moderate, 61-140'
                                WHEN SUM(CASE WHEN METHOD='Store' THEN 1 ELSE 0 END) BETWEEN 141 AND 250 THEN 'High, 141-250'
                                WHEN SUM(CASE WHEN METHOD='Store' THEN 1 ELSE 0 END)> 250                THEN 'Very High, >250'
                                 END AS f2f_prod_category
                      FROM {{ ref('STAGE','DS_BVSTG_TRANSACTION_METHOD_TYPE') }}
                     WHERE isrowdeleted=0
                     GROUP BY officecode,
                              date_trunc('month',date(date))
                   ) ds_bvstg_transaction_method_type
                ON ifnull(ds_ram_retail_repository.officecode,ds_comm_eom_extract_allsources.Officecode)=ds_bvstg_transaction_method_type.officecode
               AND ifnull(ds_ram_retail_repository.asofmonth,ds_comm_eom_extract_allsources.asofmonth)=ds_bvstg_transaction_method_type.month
             WHERE year(ifnull(ds_ram_retail_repository.asofmonth,ds_comm_eom_extract_allsources.asofmonth)) >= 2019
               AND ifnull(ds_ram_retail_repository.asofmonth,ds_comm_eom_extract_allsources.asofmonth)<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
        name: BVSTG_COMM_AU1_STORE_EVALUATION
        noLinkRefs: []
