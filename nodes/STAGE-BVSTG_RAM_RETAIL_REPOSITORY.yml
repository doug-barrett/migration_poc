            EXTENDED
              FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_TRANSACTIONITEM ds_bvstg_ap1_transactionitem
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_TRANSACTIONITEM ds_bvstg_ap1_transactionitem_1
                ON (ds_bvstg_ap1_transactionitem.CreditedTransactionItemID = ds_bvstg_ap1_transactionitem_1.transactionitemid)
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ANCILLARYPRODUCT ds_bvstg_ap1_ancillaryproduct_1
                ON (ds_bvstg_ap1_transactionitem.additionalproductsaleid = ds_bvstg_ap1_ancillaryproduct_1.additionalproductsaleid)
              FULL JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ANCILLARYPRODUCT ds_bvstg_ap1_ancillaryproduct
                ON (IFNULL(ds_bvstg_ap1_transactionitem_1.additionalproductsaleid, ds_bvstg_ap1_transactionitem.additionalproductsaleid) = ds_bvstg_ap1_ancillaryproduct.additionalproductsaleid)
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY ds_ap1_transactionsummary
                ON (IFNULL(ds_bvstg_ap1_transactionitem_1.TransactionID, IFNULL(ds_bvstg_ap1_transactionitem.TransactionID, ds_bvstg_ap1_ancillaryproduct.TransactionID)) = ds_ap1_transactionsummary.TransactionID)
