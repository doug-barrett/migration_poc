             INNER JOIN {{ ref('STAGE','V_PREB_RULEMATRIX_ACTIVITY') }} v_preb_rulematrix_activity
                ON (ds_ams_transactiondetail.ModeID = v_preb_rulematrix_activity.ModeID AND ((v_preb_rulematrix_activity.isTranType = 2) OR (v_preb_rulematrix_activity.isTranType = 1 AND ds_ams_transactiondetail.TranTypecode = v_preb_rulematrix_activity.TransactionType) OR (v_preb_rulematrix_activity.isTranType = 0)) AND ((v_preb_rulematrix_activity.isPolType = 2) OR (v_preb_rulematrix_activity.isPolType = 1 AND IFNULL(ds_ams_transactiondetail.policytype,'NULL') = v_preb_rulematrix_activity.PolicyType) OR (v_preb_rulematrix_activity.isPolType = 0)) AND ((v_preb_rulematrix_activity.isFeeType = 2) OR (v_preb_rulematrix_activity.isFeeType = 1 AND IFNULL(ds_ams_transactiondetail.FeeType,'NULL') = v_preb_rulematrix_activity.FeeType) OR (v_preb_rulematrix_activity.isFeeType = 0)) AND (CASE WHEN v_preb_rulematrix_activity.hasPremium = 1 THEN ds_ams_transactiondetail.BilledPremium END > 0 OR CASE WHEN v_preb_rulematrix_activity.hasPremium = 3 THEN ds_ams_transactiondetail.BilledPremium END = 0 OR CASE WHEN v_preb_rulematrix_activity.hasPremium = 4 THEN ds_ams_transactiondetail.BilledPremium END != 0 OR CASE WHEN v_preb_rulematrix_activity.hasPremium = 5 THEN ds_ams_transactiondetail.BilledPremium END < 0 OR CASE WHEN v_preb_rulematrix_activity.hasPremium = 0 THEN ds_ams_transactiondetail.BilledPremium END <= 0 OR CASE WHEN v_preb_rulematrix_activity.hasPremium = 2 THEN 1 END = 1) AND CASE WHEN v_preb_rulematrix_activity.hasFee = 1 THEN ds_ams_transactiondetail.FeeAmount ELSE 1 END > 0 AND ((v_preb_rulematrix_activity.isLegacy = 2 OR REGEXP_COUNT(ds_ams_transactiondetail.EntByCode, '^[0-9]+$') = v_preb_rulematrix_activity.isLegacy)))
