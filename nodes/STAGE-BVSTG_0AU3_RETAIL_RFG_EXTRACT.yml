          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT V_DLBV_COMM_MVRREPOSITORY_CURRENT.EXECUTIONMONTH,
                   V_DLBV_COMM_MVRREPOSITORY_CURRENT.CARRIER,
                   V_DLBV_COMM_MVRREPOSITORY_CURRENT.OFFICECODE_FINAL,
                   sum(V_DLBV_COMM_MVRREPOSITORY_CURRENT.TOTALMVRCOUNT) AS TOTALMVRCOUNT,
                   sum(V_DLBV_COMM_MVRREPOSITORY_CURRENT.SOLDCOUNT) AS SOLDCOUNT,
                   sum(V_DLBV_COMM_MVRREPOSITORY_CURRENT.MVRCHARGE) AS MVRCHARGE,
                   sum(V_DLBV_COMM_MVRREPOSITORY_CURRENT.CLUECHARGE) AS CLUECHARGE,
                   sum(V_DLBV_COMM_MVRREPOSITORY_CURRENT.MVR_COUNT_DT) AS MVR_COUNT_DT,
                   sum(V_DLBV_COMM_MVRREPOSITORY_CURRENT.MVR_SOLD_DT) AS MVR_SOLD_DT,
                   sum(V_DLBV_COMM_MVRREPOSITORY_CURRENT.NEW_POLICY_SALES) AS NEW_POLICY_SALES
              FROM (SELECT DISTINCT EXECUTIONMONTH,
                   CARRIER,
                   V_DLBV_COMM_MVRREPOSITORY_CURRENT.OFFICECODE_FINAL AS officecode_final_old,
                   TOTALMVRCOUNT,
                   SOLDCOUNT,
                   MVRCHARGE,
                   CLUECHARGE,
                   MVR_COUNT_DT,
                   MVR_SOLD_DT,
                   New_Policy_Sales,
                   ifnull(ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS,V_DLBV_COMM_MVRREPOSITORY_CURRENT.officecode_final) AS officecode_final
              FROM (SELECT ifnull(MVR4.EXECUTIONMONTH,ram3.Date) EXECUTIONMONTH,
                   ifnull(MVR4.CARRIER,ram3.CARRIERNAME_grouped) CARRIER,
                   ifnull(MVR4.OFFICECODE_FINAL,ram3.OFFICECODE) OFFICECODE_FINAL,
                   ifnull(MVR4.TOTALMVRCOUNT,0) TOTALMVRCOUNT,
                   ifnull(MVR4.SOLDCOUNT,0) SOLDCOUNT,
                   ifnull(MVR4.MVRCHARGE,0) MVRCHARGE,
                   ifnull(MVR4.CLUECHARGE,0) CLUECHARGE,
                   ifnull(MVR4.MVR_COUNT_DT,0) MVR_COUNT_DT,
                   ifnull(MVR4.MVR_SOLD_DT,0) MVR_SOLD_DT,
                   ram3.New_Policy_Sales
              FROM (( SELECT Mon_Tbl.month executionmonth,
                   Mon_Tbl.carrier,
                   Mon_Tbl.OFFICECODE_FINAL,
                   MVR0.mastercarrierid,
                   MVR0.TOTALMVRCOUNT,
                   MVR0.SOLDCOUNT,
                   MVR0.MVRCHARGE,
                   MVR0.CLUECHARGE,
                   MVR0.MVR_COUNT_DT,
                   MVR0.MVR_SOLD_DT
              FROM ((SELECT
             MONTH,
                   carrier,
                   OFFICECODE_FINAL
              FROM ((SELECT DISTINCT V_DLBV_COMM_MVRREPOSITORY_CURRENT.carrier,Prod_Map.OFFICECODE_FINAL FROM ((SELECT DISTINCT mastercarrierid,producercode,carrier FROM {{ ref('STAGE','V_DLBV_COMM_MVRREPOSITORY_CURRENT') }} WHERE ifnull(isduplicate,'False')='False' AND ifnull(isdeleted,'False')='False') V_DLBV_COMM_MVRREPOSITORY_CURRENT LEFT JOIN (SELECT DISTINCT mastercarrierid,producercode,producercode2,OFFICE_CAMS OFFICECODE_FINAL FROM {{ ref('STAGE','DS_BVSTG_COMM_PRODUCERCODEOFFICE_MAP') }}) Prod_Map ON ifnull(V_DLBV_COMM_MVRREPOSITORY_CURRENT.mastercarrierid,0) = ifnull(Prod_Map.mastercarrierid,0) AND ifnull(CASE WHEN V_DLBV_COMM_MVRREPOSITORY_CURRENT.mastercarrierid=95 THEN ltrim(trim(V_DLBV_COMM_MVRREPOSITORY_CURRENT.producercode),0) ELSE trim(V_DLBV_COMM_MVRREPOSITORY_CURRENT.producercode) END, '-') = ifnull(CASE WHEN V_DLBV_COMM_MVRREPOSITORY_CURRENT.mastercarrierid=95 THEN Prod_Map.producercode2 ELSE Prod_Map.producercode END, '-')) QUALIFY rank() OVER (PARTITION BY V_DLBV_COMM_MVRREPOSITORY_CURRENT.MASTERCARRIERID,V_DLBV_COMM_MVRREPOSITORY_CURRENT.PRODUCERCODE ORDER BY OFFICECODE_FINAL ASC)=1) UNION (SELECT CARRIERNAME_GROUPED,officecode FROM (SELECT ds_ram_retail_repository.*,ds_bvstg_comm_carriermapping.CARRIERNAME_GROUPED FROM (SELECT DISTINCT carriername,CARRIERNAME_GROUPED,CARRIERDISPLAYNAME FROM {{ ref('STAGE','DS_BVSTG_COMM_CARRIERMAPPING') }} WHERE SOURCE IN ('EDW') AND CARRIERNAME_GROUPED IN (SELECT DISTINCT carrier FROM {{ ref('STAGE','V_DLBV_COMM_MVRREPOSITORY_CURRENT') }})) ds_bvstg_comm_carriermapping LEFT JOIN (SELECT DISTINCT carriername, date_trunc('month',to_date(CreatedDate))CreatedDate, Counter, OfficeCode,policynumber FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} WHERE year(CreatedDate) >= 2021 AND (islegacytransaction IS NULL OR islegacytransaction <> 'Migrated') AND counter = 1 AND label IN ('New Business Auto')) ds_ram_retail_repository ON ds_bvstg_comm_carriermapping.carriername =ds_ram_retail_repository.carriername) WHERE (CASE WHEN day(current_date())<15 THEN CreatedDate <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE CreatedDate <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)))A
              FULL OUTER JOIN (SELECT DISTINCT date_trunc('month',MY_DATE)
