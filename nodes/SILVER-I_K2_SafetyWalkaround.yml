      config: {}
      dataType: VARCHAR(15)
      description: The person doing the interaction may not be doing it for their
        Region. But as the data in the safety interaction is only captured at that
        level, the we will use the Creator's BU when they are the same, and a default
        BU when they are different.
      name: CalculatedBusinessUnitCode
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   --IF WE HAVE NOT MAPPED ALL THE POSIBLE OPTIONS FOR THE
          LSI BUSINESS UNIT   -- USE THE EMPLOYEE'S BUSINESS UNIT   WHEN I_K2_SAFETYWALKAROUNDMAPPED.CALCULATEDBUSINESSUNITCODE
          = 'UNKNOWN'    THEN I_K2_SAFETYWALKAROUNDMAPPED.EMPLOYEEBUSINESSUNITCODE   --IF
          THE EMPLOYEE COMPANY MATCHES THE COMPANY WHERE THE LSI HAPPENED   -- USE
          THE EMPLOYEE BUSINESS UNIT, IF NOT USE THE GENERIC MAPPED BUSINESS UNIT   WHEN
          LEFT(I_K2_SAFETYWALKAROUNDMAPPED.CALCULATEDBUSINESSUNITCODE,1)     <> LEFT(I_K2_SAFETYWALKAROUNDMAPPED.EMPLOYEEBUSINESSUNITCODE,1)    THEN
          I_K2_SAFETYWALKAROUNDMAPPED.CALCULATEDBUSINESSUNITCODE   ELSE I_K2_SAFETYWALKAROUNDMAPPED.EMPLOYEEBUSINESSUNITCODE  END
