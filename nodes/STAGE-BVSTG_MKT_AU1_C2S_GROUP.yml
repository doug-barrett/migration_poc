    sourceMapping:
      - aliases:
          DS_MKT_C2S_DETAIL: 1a7af734-f4a3-47fb-ab12-69df88405b39
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_MKT_C2S_DETAIL
        join:
          joinCondition: |-
            FROM ( WITH RECURSIVE InitialData AS (
                    SELECT DISTINCT a.CustomerID,
                           a.Lead_LOB,
                           a.SourceDB,
                           DATE(a.LEADCREATED) AS LeadDate,
                           DATE(a.SALEDATE) AS SaleDate
                      FROM {{ ref('EDW','DS_MKT_C2S_DETAIL') }} a
                     INNER JOIN (
                            SELECT DISTINCT CustomerID,
                                   SourceDB
                              FROM RETAIL_DEV.SCH_EDW.DS_MKT_C2S_DETAIL
                             WHERE ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0)
                                OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND DATEDIFF(DAY,DS_MKT_C2S_DETAIL.DSS_UPDATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}')
                           )b
                        ON a.CustomerID = b.CustomerID
                       AND a.SourceDb = b.SourceDb
                     WHERE campaign_id IS NOT NULL
                   ),
                   SortedLeads AS ( -- CORRECCIÓN 1: ROW_NUMBER particionado por CustomerID      SELECT           *,          ROW_NUMBER() OVER (PARTITION BY CustomerID,Lead_LOB,SourceDB ORDER BY LeadDate, SaleDate) as rn      FROM InitialData  ),  RecursiveTerms AS (      -- CORRECCIÓN 2: Caso base para el primer registro de CADA cliente      SELECT           rn,          CustomerID,          Lead_LOB,          SourceDB,          LeadDate,          SaleDate,          LeadDate AS TermStartDate,          COALESCE(SaleDate, DATEADD(day, 30, LeadDate)) AS TermEndDate,          1 AS TermIndex -- Empezamos en 1 para mayor claridad      FROM SortedLeads      WHERE rn = 1        UNION ALL        -- CORRECCIÓN 3: Join por rn Y por CustomerID      SELECT           s.rn,          s.CustomerID,          s.Lead_LOB,          s.SourceDB,          s.LeadDate,          s.SaleDate,          CASE               WHEN s.LeadDate > r.TermEndDate THEN s.LeadDate               ELSE r.TermStartDate           END AS TermStartDate,          CASE               WHEN s.LeadDate > r.TermEndDate THEN COALESCE(s.SaleDate, DATEADD(day, 30, s.LeadDate))              ELSE r.TermEndDate           END AS TermEndDate,          CASE               WHEN s.LeadDate > r.TermEndDate THEN r.TermIndex + 1               ELSE r.TermIndex           END AS TermIndex      FROM SortedLeads s      INNER JOIN RecursiveTerms r           ON s.rn = r.rn + 1           AND s.CustomerID = r.CustomerID -- Crucial para no mezclar clientes          AND s.Lead_LOB= r.Lead_LOB          AND s.SourceDB= r.SourceDB  ),  FinalTerms AS (      SELECT           CustomerID,          Lead_LOB,          SourceDB,          TermIndex,          MIN(LeadDate) AS StartDate,          MIN(SaleDate) AS MinSaleDate,          TermEndDate AS EndDate,          -- El TermNumber ya viene dado por TermIndex en la recursión por cliente          TermIndex AS TermNumber      FROM RecursiveTerms      GROUP BY CustomerID,Lead_LOB,SourceDB,   TermIndex, TermEndDate  )   SELECT         b.CustomerID,        b.Lead_LOB,        b.SourceDB,        b.LeadID,        b.LEADCREATED,        b.campaign_id,        b.SESSIONID,        b.StartDateTime,        b.lms_lead_id,        b.lead_created_at,        b.SaleID,        b.issale,        b.SALEDATE,        b.quoteid,        b.isquote,        b.quotedate,        b.transferID,        b.istransfer,        b.transferdate,        ft.TermNumber,        ft.StartDate AS TermStartDate,        CASE WHEN DATE(ft.MinSaleDate) <= ft.EndDate THEN ft.MinSaleDate             ELSE ft.EndDate END AS TermEndDate,        CASE WHEN DATE(ft.MinSaleDate) <= ft.EndDate THEN 'Close By Sale'              ELSE 'Close By Time' END as TermCloseBy                 FROM {{ ref('EDW','DS_MKT_C2S_DETAIL') }} b    INNER JOIN FinalTerms ft         ON b.CustomerID = ft.CustomerID           AND b.Lead_LOB= ft.Lead_LOB          AND b.SourceDB= ft.SourceDB        AND DATE(b.LEADCREATED) BETWEEN ft.StartDate AND ft.EndDate )ds_mkt_c2s_detail
        name: BVSTG_MKT_AU1_C2S_GROUP
        noLinkRefs: []
