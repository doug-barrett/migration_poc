          - locationName: STAGE
            nodeName: BVSTG_COMM_AU2_PREMIUM_PERSISTENCY
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT CARRIER,
                   TERM,
                   POLICYSOURCE,
                   CUSTOMER_TYPE,
                   AGENCY,
                   AGENCYSTATE,
                   LEADTYPE,
                   LINEOFBUSINESS,
                   PAIDTYPE,
                   CUSTOMERSTATE,
                   ISONLINEBINDING,
                   ISLEGACYTRANSACTION,
                   ISFRANCHISE,
                   TERRITORYMANAGERNAME,
                   UPRATE_POLICY_FLAG,
                   NBSMONTH,
                   MONTHSFROMNBS,
                   COLLECTED_PREMIUM,
                   EXPECTED_PREMIUM,
                   PIF_EOM,
                   POLICY_COUNT,
                   EXTRACT_FLAG
              FROM {{ ref('STAGE','BVSTG_COMM_AU3_PREMIUM_PERSISTENCY') }}
             UNION SELECT DISTINCT au2pp.initial_carrier,
                   au2pp.term,
                   au2pp.policysource,
                   au2pp.customer_type,
                   au2pp.agency,
                   au2pp.agencystate,
                   au2pp.leadtype,
                   au2pp.lineofbusiness,
                   au2pp.paidtype,
                   au2pp.customerstate,
                   au2pp.isOnlineBinding,
                   au2pp.ISLEGACYTRANSACTION,
                   au2pp.isFranchise,
                   au2pp.TerritoryManagerName,
                   au2pp.uprate_customer_flag,
                   au2pp.startmonth,
                   au2pp.monthsfromnbs,
                   au2pp.collected_premium,
                   au2pp.expected_premium,
                   au2pp.CIF_EOM,
                   au2pp.Customer_Count,
                   2 Extract_Flag
              FROM (SELECT DISTINCT au2pp.*,
                   datediff('months',au2pp.startmonth,add_months(current_date(),-1)) Age,
                   ifnull(au2pp_1.collected_premium,0) collected_premium,
                   ifnull(au2pp_2.expected_premium,0) expected_premium,
                   ifnull(au2pp_3.CIF_EOM,0) CIF_EOM,
                   ifnull(au2pp_3.Customer_Count,0) Customer_Count
              FROM (
                    SELECT *
                      FROM (
                            SELECT DISTINCT initial_carrier,
                                   term,
                                   policysource,
                                   customer_type,
                                   agency,
                                   agencystate,
                                   leadtype,
                                   lineofbusiness,
                                   paidtype,
                                   customerstate,
                                   isOnlineBinding,
                                   isFranchise,
                                   ISLEGACYTRANSACTION,
                                   TerritoryManagerName,
                                   uprate_customer_flag,
                                   startmonth
                              FROM {{ ref('STAGE','BVSTG_COMM_AU2_PREMIUM_PERSISTENCY') }}
                             WHERE monthsfromnbs='M1'
                           ) au2pp
                     CROSS JOIN (
                            SELECT DISTINCT monthsfromnbs
                              FROM {{ ref('STAGE','BVSTG_COMM_AU2_PREMIUM_PERSISTENCY') }}
                           ) AS au2pp_1
                   ) AS au2pp
              LEFT JOIN (
                    SELECT initial_carrier,
                           term,
                           policysource,
                           customer_type,
                           agency,
                           agencystate,
                           leadtype,
                           lineofbusiness,
                           paidtype,
                           customerstate,
                           isOnlineBinding,
                           isFranchise,
                           ISLEGACYTRANSACTION,
                           TerritoryManagerName,
                           uprate_customer_flag,
                           startmonth,
                           monthsfromnbs,
                           sum(collected_premium) collected_premium
                      FROM {{ ref('STAGE','BVSTG_COMM_AU2_PREMIUM_PERSISTENCY') }}
                     WHERE customerstatus_eom=1
                     GROUP BY initial_carrier,
                              term,
                              policysource,
                              customer_type,
                              agency,
                              agencystate,
                              leadtype,
                              lineofbusiness,
                              paidtype,
                              customerstate,
                              isOnlineBinding,
                              isFranchise,
                              ISLEGACYTRANSACTION,
                              TerritoryManagerName,
                              uprate_customer_flag,
                              startmonth,
                              monthsfromnbs
                   ) au2pp_1
                ON au2pp.initial_carrier=au2pp_1.initial_carrier
               AND au2pp.term=au2pp_1.term
               AND au2pp.policysource=au2pp_1.policysource
               AND au2pp.customer_type=au2pp_1.customer_type
               AND au2pp.agency=au2pp_1.agency
               AND au2pp.agencystate=au2pp_1.agencystate
               AND au2pp.leadtype=au2pp_1.leadtype
               AND au2pp.lineofbusiness=au2pp_1.lineofbusiness
               AND au2pp.paidtype=au2pp_1.paidtype
               AND au2pp.customerstate=au2pp_1.customerstate
               AND au2pp.isOnlineBinding=au2pp_1.isOnlineBinding
               AND au2pp.isFranchise=au2pp_1.isFranchise
               AND au2pp.ISLEGACYTRANSACTION=au2pp_1.ISLEGACYTRANSACTION
               AND au2pp.TerritoryManagerName=au2pp_1.TerritoryManagerName
               AND au2pp.uprate_customer_flag=au2pp_1.uprate_customer_flag
               AND au2pp.startmonth=au2pp_1.startmonth
               AND au2pp.monthsfromnbs=au2pp_1.monthsfromnbs
              LEFT JOIN (
                    SELECT initial_carrier,
                           term,
                           policysource,
                           customer_type,
                           agency,
                           agencystate,
                           leadtype,
                           lineofbusiness,
                           paidtype,
                           customerstate,
                           isOnlineBinding,
                           isFranchise,
                           ISLEGACYTRANSACTION,
                           TerritoryManagerName,
                           uprate_customer_flag,
                           startmonth,
                           sum(expected_premium) expected_premium
                      FROM {{ ref('STAGE','BVSTG_COMM_AU2_PREMIUM_PERSISTENCY') }}
                     WHERE monthsfromnbs='M1'
                     GROUP BY initial_carrier,
                              term,
                              policysource,
                              customer_type,
                              agency,
                              agencystate,
                              leadtype,
                              lineofbusiness,
                              paidtype,
                              customerstate,
                              isOnlineBinding,
                              isFranchise,
                              ISLEGACYTRANSACTION,
                              TerritoryManagerName,
                              uprate_customer_flag,
                              startmonth
                   ) a
