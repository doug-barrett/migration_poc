        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_MKT_FUNNEL_CUSTOMERSERVICE') }} AS SELECT ds_mkt_call_customer.interactionidkey,
                   MAX(ds_mkt_call_customer.startdatetime) AS date,
                   SUM(CASE WHEN ds_mkt_Lead_source.LeadID IS NOT NULL THEN 1 ELSE 0 END) Leadsbeforecall
              FROM (
                    SELECT CustomerID,
                           startdatetime,
                           interactionidkey
                      FROM {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }}
                     GROUP BY CustomerID,
                              startdatetime,
                              interactionidkey
                   ) ds_mkt_call_customer
              LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_Lead_source
                ON (ds_mkt_call_customer.CustomerID = ds_mkt_Lead_source.CustomerID AND ds_mkt_call_customer.startdatetime > ds_mkt_Lead_source.LEADCREATED_SOURCESYSTEMTIME)
             GROUP BY ds_mkt_call_customer.interactionidkey
        dependencies:
          - locationName: EDW
            nodeName: DS_MKT_LEAD_SOURCE
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
