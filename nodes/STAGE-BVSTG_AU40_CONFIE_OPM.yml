        join:
          joinCondition: |-
            EXTENDED
              FROM ((SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('NSA') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('SPLC') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('Missing/Total') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END))) V_PRED_MONTHS -----Tenure <90 Days %  left join  (select asofmonth,PolicySource_Dimension,Tenure_LT90  from  (select date_trunc('month',to_date(EffectiveDate)) asofmonth,  'Missing/Total' PolicySource_Dimension,  count(distinct uniqueid) Tenure_LT90  from "RETAIL_PROD"."SCH_EDW"."DS_HR_SALESEMPLOYEESUMMARY"  where POINTINTIMESTATUS ='Terminated'  and POINTINTIMETENURE in ('LT 90','LT 60','LT 45', 'LT 30')  and date_trunc('month',to_date(EffectiveDate))= date_trunc('month',to_date(terminationdate))  group by date_trunc('month',to_date(EffectiveDate)),PolicySource_Dimension)  ) DS_HR_SALESEMPLOYEESUMMARY  on V_PRED_MONTHS.asofmonth = DS_HR_SALESEMPLOYEESUMMARY.asofmonth and V_PRED_MONTHS.PolicySource_Dimension = DS_HR_SALESEMPLOYEESUMMARY.PolicySource_Dimension  left join  (select asofmonth,  'Missing/Total' PolicySource_Dimension,  count (case when PointinTimestatus_eom = 'Active' then EmployeeNumber end) TJ_Employee_Count_Ops  from  (select a.min_Date asofmonth,  EmployeeNumber,  date_trunc('month', HireDate) HireMonth,  date_trunc('month', terminationdate) TerminationMonth,  case when min_Date = date_trunc('month', terminationdate) then 'Terminated'  else 'Active' end as PointInTimeStatus_EOM,  case when lag(case when min_Date = date_trunc('month', terminationdate) then 'Terminated'  else 'Active' end, 1) over (partition by employeenumber order by asofmonth) is null  and  asofmonth = date_trunc('month',hiredate) then 'Inactive'  else ifnull(lag(case when min_Date = date_trunc('month', terminationdate) then 'Terminated'  else 'Active' end, 1) over (partition by employeenumber order by asofmonth), 'Active') end as PointInTimeStatus_BOM  from {{ ref('STAGE','V_PRED_MONTHS') }} a  cross join {{ ref('STAGE','V_DLBV_TRES_HIERARCHYVIEW_CURRENT') }} b  where a.cal_year >= 2021  and a.min_date >=  date_trunc('month', date(HIREDATE))  and a.min_date <=  ifnull(date_trunc('month', date(TerminationDate)), add_months(date_trunc('month', current_Date()), -1))  and a.min_date <= add_months(date_trunc('month', current_Date()), -1)  and trim(b.CODE_CLASSIFICATION) = 'OPER')  group by asofmonth,PolicySource_Dimension  ) V_DLBV_TRES_HIERARCHYVIEW_CURRENT  on V_PRED_MONTHS.asofmonth = V_DLBV_TRES_HIERARCHYVIEW_CURRENT.asofmonth  and V_PRED_MONTHS.PolicySource_Dimension = V_DLBV_TRES_HIERARCHYVIEW_CURRENT.PolicySource_Dimension  -------New/Rewrite Auto Sales  left join  (select table1.monthyear asofmonth,  'Missing/Total' PolicySource_Dimension,  case when month(monthyear) <> 1 then  values_month- lag(values_month) over (order by monthyear)  else values_month end as Rewrite_Policies  from (  select  distinct date(concat(yearid,'-',replace(replace(month,'M'),'VALUE'),'-01'))
        name: BVSTG_AU40_CONFIE_OPM
        noLinkRefs: []
