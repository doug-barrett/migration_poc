      - aliases:
          BVSTG_AU2_GROUP_LEAD: 64036b9c-0c0f-4538-a61e-3a35a34cdf2f
          DS_CUSTOMERSUMMARY_V2: bfbcbb64-c981-41ce-827f-e0330b80cf2d
          DS_MKT_LEAD_SOURCE: 11ed51b7-3963-4bf2-81b7-ee9ae173436d
          DS_MKT_CAMPAIGN: 7af8f04b-abc3-4181-a605-da78d18d31e6
        customSQL:
