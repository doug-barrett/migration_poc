        dependencies:
          - locationName: EDW
            nodeName: DS_MKT_LEAD_SOURCE
          - locationName: STAGE
            nodeName: BVSTG_AU2_GROUP_LEAD
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN
        join:
          joinCondition: |-
            FROM(
                    SELECT FIRST_GROUP_LEADID ,
                           BVSTG_AU2_GROUP_LEAD.SourceDb ,
                           L_LEADID ,
                           BVSTG_AU2_GROUP_LEAD.RANK_GROUP_LEADID ,
                           CASE WHEN C_ISLEGACY = 'Migrated' AND CUSTOMER_LEAD_TYPE = 'PROSPECT' THEN 1
                                ELSE 0
                                 END MIGRATED_PROSPECT ,
                           CASE WHEN C_ISLEGACY = 'Migrated' AND CUSTOMER_LEAD_TYPE = 'WINBACK' THEN 1
                                ELSE 0
                                 END MIGRATED_EXISTING_CUSTOMER ,
                           CASE WHEN C_ISLEGACY = 'Native' AND CUSTOMER_LEAD_TYPE = 'PROSPECT' THEN 1
                                ELSE 0
                                 END NATIVE_PROSPECT ,
                           CASE WHEN C_ISLEGACY = 'Native' AND CUSTOMER_LEAD_TYPE = 'WINBACK' THEN 1
                                ELSE 0
                                 END NATIVE_EXISTING_CUSTOMER ,
                           CASE WHEN LEADSOURCE IN ('Cust TimeStamp (i)','Cust TimeStamp (o)','Cust TimeStamp (u)','Cust/User (i)','Cust/User (o)','Cust/User (u)','Phone AppOne') THEN 1
                                ELSE 0
                                 END NO_OF_LEAD_SOURCE_PHONE ,
                           CASE WHEN LEADSOURCE IN ('Web','LMS (email)','LMS (Phone)') THEN 1
                                ELSE 0
                                 END NO_OF_LEAD_SOURCE_WEB ,
                           CASE WHEN LEADSOURCE = '' THEN 1
                                ELSE 0
                                 END NO_OF_LEAD_SOURCE_WALKIN ,
                           CASE WHEN DAYNAME(L_LEADDATE)='Mon' THEN 1
                                ELSE 0
                                 END NO_OF_LEADS_CREATED_MON ,
                           CASE WHEN DAYNAME(L_LEADDATE)='Tue' THEN 1
                                ELSE 0
                                 END NO_OF_LEADS_CREATED_TUE ,
                           CASE WHEN DAYNAME(L_LEADDATE)='Wed' THEN 1
                                ELSE 0
                                 END NO_OF_LEADS_CREATED_WED ,
                           CASE WHEN DAYNAME(L_LEADDATE)='Thu' THEN 1
                                ELSE 0
                                 END NO_OF_LEADS_CREATED_THU ,
                           CASE WHEN DAYNAME(L_LEADDATE)='Fri' THEN 1
                                ELSE 0
                                 END NO_OF_LEADS_CREATED_FRI ,
                           CASE WHEN DAYNAME(L_LEADDATE)='Sat' THEN 1
                                ELSE 0
                                 END NO_OF_LEADS_CREATED_SAT ,
                           CASE WHEN DAYNAME(L_LEADDATE)='Sun' THEN 1
                                ELSE 0
                                 END NO_OF_LEADS_CREATED_SUN ,
                           CASE WHEN DAYNAME(BVSTG_AU2_GROUP_LEAD.SALEDATE)='Mon' THEN 1
                                ELSE 0
                                 END NO_OFLEADS_SOLD_MON ,
                           CASE WHEN DAYNAME(BVSTG_AU2_GROUP_LEAD.SALEDATE)='Tue' THEN 1
                                ELSE 0
                                 END NO_OFLEADS_SOLD_TUE ,
                           CASE WHEN DAYNAME(BVSTG_AU2_GROUP_LEAD.SALEDATE)='Wed' THEN 1
                                ELSE 0
                                 END NO_OFLEADS_SOLD_WED ,
                           CASE WHEN DAYNAME(BVSTG_AU2_GROUP_LEAD.SALEDATE)='Thu' THEN 1
                                ELSE 0
                                 END NO_OFLEADS_SOLD_THU ,
                           CASE WHEN DAYNAME(BVSTG_AU2_GROUP_LEAD.SALEDATE)='Fri' THEN 1
                                ELSE 0
                                 END NO_OFLEADS_SOLD_FRI ,
                           CASE WHEN DAYNAME(BVSTG_AU2_GROUP_LEAD.SALEDATE)='Sat' THEN 1
                                ELSE 0
                                 END NO_OFLEADS_SOLD_SAT ,
                           CASE WHEN DAYNAME(BVSTG_AU2_GROUP_LEAD.SALEDATE)='Sun' THEN 1
                                ELSE 0
                                 END NO_OFLEADS_SOLD_SUN ,
                           CASE WHEN DS_MKT_LEAD_SOURCE.LEADSOURCENAME_SYSTEM LIKE '%Step%' THEN 1
                                ELSE 0
                                 END NO_OF_SOUCE_SYSTEM_2STEP ,
                           CASE WHEN DS_MKT_LEAD_SOURCE.LEADSOURCENAME_SYSTEM NOT LIKE '%Step%' THEN 1
                                ELSE 0
                                 END NO_OF_SOUCESYSTEM_VFOTHERS
                      FROM {{ ref('STAGE','BVSTG_AU2_GROUP_LEAD') }} BVSTG_AU2_GROUP_LEAD
                      LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CUSTOMERSUMMARY_V2
                        ON DS_CUSTOMERSUMMARY_V2.CustomerID = BVSTG_AU2_GROUP_LEAD.C_CUSTOMERID
                       AND BVSTG_AU2_GROUP_LEAD.SOURCEDB = ds_customersummary_v2.SOURCEDB
                      LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} DS_MKT_LEAD_SOURCE
                        ON CASE WHEN BVSTG_AU2_GROUP_LEAD.SourceDb ='CIGH' THEN DS_CUSTOMERSUMMARY_V2.CUSTOMERNO
                                ELSE BVSTG_AU2_GROUP_LEAD.L_LEADID
                                 END = DS_MKT_LEAD_SOURCE.LEADID
                       AND BVSTG_AU2_GROUP_LEAD.SourceDb = DS_MKT_LEAD_SOURCE.SourceDb
                      LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} DS_MKT_CAMPAIGN
                        ON DS_MKT_LEAD_SOURCE.CAMPAIGNID=DS_MKT_CAMPAIGN.CAMPAIGNID
                     WHERE DATE(FIRST_GROUP_LEADID_LEADDATE) != DATE(IFNULL(BVSTG_AU2_GROUP_LEAD.SALEDATE,CURRENT_DATE()))
                   )DS_MKT_LEAD_SOURCE
             GROUP BY FIRST_GROUP_LEADID,
                      SourceDb
        name: BVSTG_AU2_GROUP_LEAD_FEATURES_SOURCE
        noLinkRefs: []
