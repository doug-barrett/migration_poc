          V_DLBV_BAA_DL_5058_5058_CURRENT: 0e98a969-a6d0-46cd-8d11-f0c482d5678b
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_IO_RWL_ZERO_DIALER
          - locationName: EDW
            nodeName: DS_IO_RWL_ZERO_DIALER_DETAILS
          - locationName: STAGE
            nodeName: V_DLBV_BAA_DL_5058_5058_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_IO_RWL_ZERO_DIALER') }} DS_IO_RWL_ZERO_DIALER
             INNER JOIN (
                    SELECT DS_IO_RWL_ZERO_DIALER.DEAL_ID,
                           DS_IO_RWL_ZERO_DIALER.DEAL_RENEWED_WON,
                           DS_IO_RWL_ZERO_DIALER.DEAL_LOST,
                           IFNULL(Dialer_Max_Talktime_C, 0) Dialer_Max_Talktime,
                           IFNULL(CELLPHONE.CONTACTS_C, 0) Dialer_Contact_days_m,
                           IFNULL(CELLPHONE.CALLS_C, 0) CALLS,
                           IFNULL(CELLPHONE.CONVERSATION_C, 0) CONVERSATION,
                           DS_IO_RWL_ZERO_DIALER.contact_customer
                      FROM {{ ref('EDW','DS_IO_RWL_ZERO_DIALER') }} DS_IO_RWL_ZERO_DIALER
                      LEFT JOIN (
                            SELECT PHONE,
                                   SUM(CASE WHEN SESSIONID IS NOT NULL THEN 1 ELSE 0 END) CALLS_C,
                                   COUNT(DISTINCT CASE WHEN SESSIONID IS NOT NULL AND TALKTIME > 0 THEN DATE (IMPORTRULEDATE) END) CONTACTS_C,
                                   SUM(CASE WHEN SESSIONID IS NOT NULL AND TALKTIME > 90 THEN 1 ELSE 0 END) CONVERSATION_C,
                                   MAX(TALKTIME) Dialer_Max_Talktime_C
                              FROM {{ ref('EDW','DS_IO_RWL_ZERO_DIALER_DETAILS') }}
                             WHERE DATE (IMPORTRULEDATE) >= DATE (DATEADD(DAY, - 15, GETDATE()))
                               AND SESSIONID IS NOT NULL
                             GROUP BY PHONE
                           ) CELLPHONE
                        ON DS_IO_RWL_ZERO_DIALER.CUSTOMER_PHONE = CELLPHONE.PHONE
                      LEFT JOIN (
                            SELECT ACCOUNTNUMBER,
                                   MIN(DATE (IMPORTRULEDATE)) First_Dialer_Uploaded,
                                   MAX(DATE (IMPORTRULEDATE)) Last_Dialer_Uploaded,
                                   DATEDIFF(DAY, MIN(DATE (IMPORTRULEDATE)), MAX(DATE (IMPORTRULEDATE))) + 1 Dialer_Uploaded
                              FROM {{ ref('STAGE','V_DLBV_BAA_DL_5058_5058_CURRENT') }}
                             WHERE DATE (IMPORTRULEDATE) >= DATE (DATEADD(DAY, - 20, GETDATE()))
                             GROUP BY ACCOUNTNUMBER
                           ) V_DLBV_BAA_DL_5058_5058_CURRENT
                        ON DS_IO_RWL_ZERO_DIALER.CUSTOMER_PHONE = V_DLBV_BAA_DL_5058_5058_CURRENT.ACCOUNTNUMBER
                     WHERE DS_IO_RWL_ZERO_DIALER.contact_customer = 1
                   ) DS_IO_RWL_ZERO_DIALER_RESULT
                ON DS_IO_RWL_ZERO_DIALER.DEAL_ID = DS_IO_RWL_ZERO_DIALER_RESULT.DEAL_ID QUALIFY ROW_NUMBER() OVER (PARTITION BY DS_IO_RWL_ZERO_DIALER.DEAL_ID ORDER BY CASE WHEN DS_IO_RWL_ZERO_DIALER.customer_phone IS NOT NULL THEN 1 ELSE 0 END DESC) = 1
