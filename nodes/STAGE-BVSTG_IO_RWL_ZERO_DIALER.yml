          joinCondition: |-
            FROM RETAIL_PROD.SCH_EDW.DS_IO_RWL_ZERO_INFERENCE_OUTPUT DS_IO_RWL_ZERO_INFERENCE_OUTPUT
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_SPLC_CUSTOMER_CURRENT V_S_SPLC_CUSTOMER_CURRENT
                ON DS_IO_RWL_ZERO_INFERENCE_OUTPUT.custno = V_S_SPLC_CUSTOMER_CURRENT.custno
              LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_CUSTOMER H_SPLC_CUSTOMER
                ON H_SPLC_CUSTOMER.hk_h_customer = V_S_SPLC_CUSTOMER_CURRENT.hk_h_customer
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_IO_RWL_ZERO_DEALS V_IO_RWL_ZERO_DEALS
                ON DS_IO_RWL_ZERO_INFERENCE_OUTPUT.deal_id = V_IO_RWL_ZERO_DEALS.deal_id
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_IO_RWL_ZERO_AMSPOLDATA V_IO_RWL_ZERO_AMSPOLDATA
                ON DS_IO_RWL_ZERO_INFERENCE_OUTPUT.ams_policy_id = V_IO_RWL_ZERO_AMSPOLDATA.expiring
               AND date(V_IO_RWL_ZERO_DEALS.date_deal_created) = date(V_IO_RWL_ZERO_AMSPOLDATA.expected_deal_creation_date)
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_IO_RWL_ZERO_AMSCUSTDATA V_IO_RWL_ZERO_AMSCUSTDATA
                ON DS_IO_RWL_ZERO_INFERENCE_OUTPUT.CUSTNO = V_IO_RWL_ZERO_AMSCUSTDATA.CUSTNO
               AND lower(SPLIT_PART(V_IO_RWL_ZERO_DEALS.lead_name, ' ', 1)) = lower(SPLIT_PART(V_IO_RWL_ZERO_AMSCUSTDATA.firstname, ' ', 1))
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_MKT_TIMEZONES_STATE V_DLBV_MKT_TIMEZONES_STATE
                ON V_DLBV_MKT_TIMEZONES_STATE.STATECODE = V_IO_RWL_ZERO_AMSPOLDATA.STATE
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_MKT_TIMEZONES V_DLBV_MKT_TIMEZONES
                ON V_DLBV_MKT_TIMEZONES.timezonename = V_DLBV_MKT_TIMEZONES_STATE.timezone
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_CUSTOMER DS_BVSTG_AP1_CUSTOMER
                ON H_SPLC_CUSTOMER.hk_h_customer = DS_BVSTG_AP1_CUSTOMER.hk_h_customer
             WHERE 1=1
               AND contact_customer = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY DS_IO_RWL_ZERO_INFERENCE_OUTPUT.DEAL_ID ORDER BY CASE WHEN customer_phone IS NOT NULL THEN 1 ELSE 0 END DESC) = 1
