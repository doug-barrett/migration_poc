            FROM (SELECT FIRST_BIAPRIMARYAGENTOFFICE AS officecode,
                   employeenumber AS producer,
                   cutoffdate,
                   policysource,
                   lineofbusiness,
                   INITIAL_CARRIER AS carrier,
                   sum(CASE WHEN expiringrenewalflag=1 THEN expiringrenewalflag ELSE 0 END) AS Expiring_Renewals,
                   sum(CASE WHEN renewalflag=1 THEN renewalflag ELSE 0 END) AS Renewals
              FROM {{ ref('EDW','DS_COMM_CUSTOMER_SUMMARY_EXTRACT') }} ds_comm_customer_summary_extract -- from RETAIL_PROD.SCH_EDW.DS_COMM_CUSTOMER_SUMMARY_EXTRACT ds_comm_customer_summary_extract   left join (select distinct customer_id, EMPLOYEENUMBER, FIRST_BIAPRIMARYAGENTOFFICE              from {{ ref('STAGE','BVSTG_COMM_AU7_CUSTOMER_PERSISTENCY_EXTRACT') }}              -- from RETAIL_PROD.SCH_BVSTAGE.BVSTG_COMM_AU7_CUSTOMER_PERSISTENCY_EXTRACT             ) bvstg_comm_au7_customer_persistency_extract      on ds_comm_customer_summary_extract.customer_id = bvstg_comm_au7_customer_persistency_extract.customer_id   where policysource in ('AppOne', 'CIGH', 'SPLC')    and cutoffdate <= date_trunc('month', add_months(current_date(), -1))   group by FIRST_BIAPRIMARYAGENTOFFICE, employeenumber, cutoffdate, policysource,     lineofbusiness, INITIAL_CARRIER  ) ds_comm_customer_summary_extract
