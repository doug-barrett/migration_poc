          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: DS_DV_LAPSE_MODEL
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
              LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                ON ds_policysummary_v2.transactionid = TO_VARCHAR(ds_ap1_transactionsummary.transactionid)
               AND ds_ap1_transactionsummary.ISVOID = 0
             WHERE (('{{ parameters.HWM_BVSTG_H20_Refresh_Flag }}' = 0 AND DATE(ds_policysummary_v2.STARTDATE)>='2020-01-01') OR ('{{ parameters.HWM_BVSTG_H20_Refresh_Flag }}' = 1 AND DATE(ds_policysummary_v2.STARTDATE) >= DATEADD(DAY,-7,CURRENT_DATE())) OR ds_policysummary_v2.PolicyID IN(SELECT a.PolicyID FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} a LEFT JOIN {{ ref('STAGE','DS_DV_LAPSE_MODEL') }} b ON a.PolicyID=b.POLICY_ID WHERE b.POLICY_ID IS NULL AND a.SourceDB IN ('AppOne', 'CIGH') AND a.BIAPRIMARYAGENTOFFICE !='JOR' AND a.ISLEGACYTRANSACTION !='Migrated' AND trim(upper(a.LINEOFBUSINESSTYPE)) IN ('AUTO', 'PRIVATE PASSENGER AUTO') AND DATE(a.StartDate) >='2022-01-01'))
               AND ds_policysummary_v2.ISLEGACYTRANSACTION != 'Migrated'
               AND ds_policysummary_v2.SOURCEDB IN ('AppOne', 'CIGH')
               AND ds_policysummary_v2.BIAPRIMARYAGENTOFFICE <> 'JOR'
               AND trim(upper(ds_policysummary_v2.LINEOFBUSINESSTYPE)) IN ('AUTO', 'PRIVATE PASSENGER AUTO')
