    sourceMapping:
      - aliases:
          V_POSB_POLICY_CUTOFF_REVENUE: 22c1a9b1-bf89-4df8-8bab-433beca583ac
          BVSTG_BRDG_POLICYCUTOFFDETAIL_1: 31d3e285-f0d6-4c5b-8074-3cbb9a67e47f
          BVSTG_RAM_RETAIL_REPOSITORY: 169202ec-0dbe-448e-b828-fe5e5b5dee07
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_POLICY_CUTOFF_REVENUE') }} AS SELECT MAX(bvstg_brdg_PolicyCutOffdetail_1.factID) AS factID ,
                   bvstg_brdg_PolicyCutOffdetail_1.policyID ,
                   bvstg_brdg_PolicyCutOffdetail_1.CutOffDate ,
                   SUM(bvstg_ram_retail_repository.Ancillary_Amount) AS Ancillary_Amount ,
                   SUM(bvstg_ram_retail_repository.Fee_Amount) AS Fee_Amount ,
                   SUM(bvstg_ram_retail_repository.ServiceTransactionsFee_Amount) AS ServiceTransactionsFee_Amount ,
                   SUM(bvstg_ram_retail_repository.Ancillary_Count) AS Ancillary_Count ,
                   SUM(bvstg_ram_retail_repository.Fee_Count) AS Fee_Count ,
                   SUM(bvstg_ram_retail_repository.ServiceTransactionsFee_Count) AS ServiceTransactionsFee_Count
              FROM {{ ref('STAGE','BVSTG_BRDG_POLICYCUTOFFDETAIL_1') }} bvstg_brdg_PolicyCutOffdetail_1
              LEFT JOIN (
                    SELECT policyID,
                           LAST_DAY(CreatedDate) AS CutOffMonth,
                           SUM(CASE WHEN classification='Ancillary' THEN Amount ELSE 0 END) AS Ancillary_Amount,
                           SUM(CASE WHEN classification='Fee' THEN Amount ELSE 0 END) AS Fee_Amount,
                           SUM(CASE WHEN classification='Service Transactions Fee' THEN Amount ELSE 0 END) AS ServiceTransactionsFee_Amount,
                           SUM(CASE WHEN classification='Ancillary' THEN Counter ELSE 0 END) AS Ancillary_Count,
                           SUM(CASE WHEN classification='Fee' THEN Counter ELSE 0 END) AS Fee_Count,
                           SUM(CASE WHEN classification='Service Transactions Fee' THEN Counter ELSE 0 END) AS ServiceTransactionsFee_Count
                      FROM {{ ref('STAGE','BVSTG_RAM_RETAIL_REPOSITORY') }}
                     WHERE RefreshType IN('AppOne Revenue','CIGH Ancillary','CIGH Fee')
                       AND isVoid = 0
                     GROUP BY policyID,
                              LAST_DAY(CreatedDate)
                   )bvstg_ram_retail_repository
                ON (bvstg_brdg_PolicyCutOffdetail_1.policyID = bvstg_ram_retail_repository.policyID AND bvstg_ram_retail_repository.CutOffMonth = bvstg_brdg_PolicyCutOffdetail_1.CutOffDate)
             GROUP BY bvstg_brdg_PolicyCutOffdetail_1.policyID,
                      bvstg_brdg_PolicyCutOffdetail_1.CutOffDate
             ORDER BY bvstg_brdg_PolicyCutOffdetail_1.policyID,
                      bvstg_brdg_PolicyCutOffdetail_1.CutOffDate
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_BRDG_POLICYCUTOFFDETAIL_1
