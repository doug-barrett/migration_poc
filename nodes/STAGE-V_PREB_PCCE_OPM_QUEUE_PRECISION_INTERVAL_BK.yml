    sourceMapping:
      - aliases:
          V_PREB_PCCE_OPM_QUEUE_PRECISION_INTERVAL_BK: 16fdac29-d2a8-452a-9322-4230cbc83223
          STAGE_INTERVALS: e5aec9dc-38f0-443e-b8d2-53ab340464ae
          DS_PCCE_QUEUE_PRECISION_INTERVAL: 55ca98ce-718f-4d38-a1b7-0661c4b80b27
          DS_OPM_LOB_QUEUE_MAPPING: 1915302e-d633-4ce2-a63f-6f11d5840da8
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_OPM_QUEUE_PRECISION_INTERVAL_BK') }} AS SELECT Group_Name ,
                   StartDate ,
                   SUM(ANSWERWAITTIME) AS ANSWERWAITTIME ,
                   SUM(CALLSANSWERED) AS CALLSANSWERED ,
                   SUM(TALKTIME) AS TALKTIME ,
                   SUM(HOLDTIME) AS HOLDTIME ,
                   SUM(CALLSOFFEREDROUTED) AS CALLSOFFEREDROUTED ,
                   SUM(ROUTERCALLSABANDQ) AS ROUTERCALLSABANDQ ,
                   SUM(SERVICELEVELCALLS) AS SERVICELEVELCALLS ,
                   SUM(AAT) AS AAT ,
                   SUM(AHT) AS AHT ,
                   SUM(ASA) AS ASA ,
                   MAX(LWT) AS LWT ,
                   SUM(CALLSABANACD) AS CALLSABANACD ,
                   SUM(CALLSHANDLEDACD) AS CALLSHANDLEDACD ,
                   SUM(N_Answered_Acd_Svc_Lvl) AS N_Answered_Acd_Svc_Lvl ,
                   SUM(N_Entered_Acd) AS N_Entered_Acd ,
                   SUM(HANDLEDCALLSTIME) AS HANDLEDCALLSTIME ,
                   SUM(CALLSDEQUEUED) AS CALLSDEQUEUED ,
                   SUM(CALLSABANDDEQUEUED) AS CALLSABANDDEQUEUED ,
                   SUM(SERVICELEVELCALLSABAND) AS SERVICELEVELCALLSABAND ,
                   SUM(TALKOUTTIME) AS TALKOUTTIME ,
                   SUM(TALKINTIME) AS TALKINTIME ,
                   SUM(TALKOTHERTIME) AS TALKOTHERTIME ,
                   SUM(AVAILTIME) AS AVAILTIME ,
                   SUM(NOTREADYTIME) AS NOTREADYTIME ,
                   SUM(LOGGEDONTIME) AS LOGGEDONTIME ,
                   MIN(DSS_UPDATE_TIME) DSS_UPDATE_TIME
              FROM (
                    SELECT ds_opm_lob_queue_mapping.Group_Name,
                           stage_intervals.StartDate,
                           SUM(ds_pcce_queue_precision_interval.ANSWERWAITTIME) ANSWERWAITTIME,
                           SUM(ds_pcce_queue_precision_interval.CALLSHANDLED) CALLSANSWERED,
                           SUM(ds_pcce_queue_precision_interval.handledcallstime) TALKTIME,
                           SUM(ds_pcce_queue_precision_interval.HOLDTIME) HOLDTIME,
                           SUM(ds_pcce_queue_precision_interval.SERVICELEVELCALLSOFFERED) AS CALLSOFFEREDROUTED,
                           (SUM(ds_pcce_queue_precision_interval.CALLSABANDTOAGENT) + SUM(ds_pcce_queue_precision_interval.CALLSABANDQ)) AS ROUTERCALLSABANDQ,
                           SUM(SERVICELEVELCALLS) SERVICELEVELCALLS,
                           sum(ds_pcce_queue_precision_interval.TalkTime) / NULLIF(sum(ds_pcce_queue_precision_interval.CallsHandled),0) AS aat,
                           sum(ds_pcce_queue_precision_interval.AVGHANDLEDCALLSTALKTIME) / NULLIF(sum(ds_pcce_queue_precision_interval.CallsHandled),0) AS aht,
                           sum(ds_pcce_queue_precision_interval.AnswerWaitTime) / NULLIF(sum(ds_pcce_queue_precision_interval.CallsAnswered),0) AS asa,
                           MAX(ds_pcce_queue_precision_interval.maxcallwaittime) lwt,
                           (SUM(ds_pcce_queue_precision_interval.CALLSABANDTOAGENT) + SUM(ds_pcce_queue_precision_interval.CALLSABANDQ)) AS CallsAbanACD,
                           SUM(ds_pcce_queue_precision_interval.SERVICELEVELCALLSOFFERED) AS CallsHandledACD,
                           sum(IFNULL(ds_pcce_queue_precision_interval.HandledCallsTime,0)) AS HandledCallsTime,
                           sum(IFNULL(CallsDequeued,0)) AS CallsDequeued,
                           sum(IFNULL(CallsAbandDequeued,0)) AS CallsAbandDequeued,
                           sum(IFNULL(ServiceLevelCallsAband,0)) AS ServiceLevelCallsAband,
                           SUM(IFNULL(ds_pcce_queue_precision_interval.TalkOutTime,0)) AS TalkOutTime,
                           SUM(IFNULL(ds_pcce_queue_precision_interval.TalkInTime,0)) AS TalkInTime,
                           SUM(IFNULL(ds_pcce_queue_precision_interval.TalkOtherTime,0)) AS TalkOtherTime,
                           SUM(IFNULL(ds_pcce_queue_precision_interval.AvailTime,0)) AS AvailTime --ServiceLevelType as ServiceLevelType
             ,
                           CASE min(ServiceLevelType)
                                WHEN 1                THEN sum(IFNULL(ServiceLevelCalls,0))
                                WHEN 2                THEN sum(IFNULL(ServiceLevelCalls,0))
                                WHEN 3                THEN sum(IFNULL(ServiceLevelCalls,0)) + sum(IFNULL(ServiceLevelCallsAband,0))
                                ELSE 0
                                 END AS N_Answered_Acd_Svc_Lvl ,
                           CASE min(ServiceLevelType)
                                WHEN 1                THEN SUM(ServiceLevelCallsOffered) - SUM(SERVICELEVELCALLSABAND) - SUM(CallsDequeued) - SUM(CallsAbandDequeued)
                                WHEN 2                THEN SUM(ServiceLevelCallsOffered) - SUM(CallsDequeued) - SUM(CallsAbandDequeued)
                                WHEN 3                THEN SUM(ServiceLevelCallsOffered) - SUM(CallsDequeued) - SUM(CallsAbandDequeued)
                                ELSE 0
                                 END AS N_Entered_Acd ,
                           SUM(ds_pcce_queue_precision_interval.NOTREADYTIME) AS NOTREADYTIME ,
                           SUM(ds_pcce_queue_precision_interval.LOGGEDONTIME) AS LOGGEDONTIME ,
                           MIN(ds_pcce_queue_precision_interval.DSS_UPDATE_TIME) DSS_UPDATE_TIME
                      FROM {{ ref('STAGE','STAGE_INTERVALS') }} stage_intervals
                      LEFT JOIN {{ ref('EDW','DS_PCCE_QUEUE_PRECISION_INTERVAL') }} ds_pcce_queue_precision_interval
                        ON ds_pcce_queue_precision_interval.Interval >= stage_intervals.StartDate
                       AND ds_pcce_queue_precision_interval.Interval < stage_intervals.EndDate
                     INNER JOIN {{ ref('EDW','DS_OPM_LOB_QUEUE_MAPPING') }} ds_opm_lob_queue_mapping
                        ON (ds_pcce_queue_precision_interval.FullName = ds_opm_lob_queue_mapping.Queue_Name AND ds_opm_lob_queue_mapping.isActive = 1 AND ds_opm_lob_queue_mapping.QueueType = 'Precision')
                     WHERE DATE(stage_intervals.StartDate)>='2020-08-01'
                     GROUP BY ds_opm_lob_queue_mapping.Group_Name,
                              stage_intervals.StartDate
                   )ds_pcce_queue_precision_interval
             GROUP BY Group_Name,
                      StartDate
        dependencies:
          - locationName: EDW
            nodeName: DS_OPM_LOB_QUEUE_MAPPING
          - locationName: STAGE
            nodeName: STAGE_INTERVALS
          - locationName: EDW
            nodeName: DS_PCCE_QUEUE_PRECISION_INTERVAL
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_OPM_LOB_QUEUE_MAPPING') }}
            {{ ref('STAGE','STAGE_INTERVALS') }}
            {{ ref('EDW','DS_PCCE_QUEUE_PRECISION_INTERVAL') }}
        name: V_PREB_PCCE_OPM_QUEUE_PRECISION_INTERVAL_BK
        noLinkRefs: []
