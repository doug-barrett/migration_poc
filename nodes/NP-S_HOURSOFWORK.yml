        description: 'Preset warning level based on parameters. Values can be 0, 50 or 100 if no timesheet and 25, 75 or 125 if a timesheet. Takes into account the following measures: Days worked in Last 21 Days, Hrs since 24 Hr break, Hrs in the last 7 days, Break Worked and Worked between 10pm and 4am, '
