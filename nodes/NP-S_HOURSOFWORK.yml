                          WHEN HOURSSINCEDAYOFF >= @V_HRSOFWORKHRSSINCE24BREAKWARN THEN 75
                          WHEN HRSWORKEDINLAST7DAYS >= @V_HRSOFWORKHRSIN7DAYSWARN  THEN 75
                          ELSE 25
                           END ELSE --TIMESHEET NOT ENTERED    CASE     WHEN DAYSWORKEDINLAST21 > @V_HRSOFWORKDAYSIN21RED THEN 100     WHEN HOURSSINCEDAYOFF > @V_HRSOFWORKHRSSINCE24BREAKRED THEN 100     WHEN HRSWORKEDINLAST7DAYS > @V_HRSOFWORKHRSIN7DAYSRED THEN 100     WHEN BREAKWORKED = 1 THEN 50     WHEN WORKEDBETWEEN10AND4 = 1 THEN 50     WHEN DAYSWORKEDINLAST21 >= @V_HRSOFWORKDAYSIN21WARN THEN 50     WHEN HOURSSINCEDAYOFF >= @V_HRSOFWORKHRSSINCE24BREAKWARN THEN 50     WHEN HRSWORKEDINLAST7DAYS >= @V_HRSOFWORKHRSIN7DAYSWARN THEN 50     ELSE 0    END  END
