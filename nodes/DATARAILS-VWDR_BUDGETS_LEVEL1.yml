            ON "ACCOUNT"."LEVEL1FORCEID" = "ACCOUNTHIERARCHY_OMNIA"."FORCEID"
          LEFT JOIN {{ ref('STAGE', 'SALESTERRITORY') }} "SALESTERRITORY"
            ON "ACCOUNT"."TERRITORYID" = "SALESTERRITORY"."TERRITORYID"
          LEFT JOIN {{ ref('STAGE', 'FINANCIALSALESTERRITORY') }} "FINANCIALSALESTERRITORY"
