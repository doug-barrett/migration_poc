          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN
          - locationName: STAGE
            nodeName: DS_BVSTG_GROUP_LEAD
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_GROUP_LEAD_FEATURES') }} DS_GROUP_LEAD_FEATURES
              LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} DS_MKT_LEAD_SOURCE
                ON DS_GROUP_LEAD_FEATURES.FIRST_GROUP_LEADID=DS_MKT_LEAD_SOURCE.LEADID
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} DS_MKT_CAMPAIGN
                ON DS_MKT_LEAD_SOURCE.CAMPAIGNID=DS_MKT_CAMPAIGN.CAMPAIGNID
              LEFT JOIN (
                    SELECT FIRST_GROUP_LEADID,
                           L_LEADID,
                           L_LEADDATE
                      FROM {{ ref('STAGE','DS_BVSTG_GROUP_LEAD') }}
                     WHERE LAST_GROUP_LEADID = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY FIRST_GROUP_LEADID ORDER BY L_LEADDATE DESC,L_LEADID DESC)=1
                   )DS_BVSTG_GROUP_LEAD
                ON DS_GROUP_LEAD_FEATURES.FIRST_GROUP_LEADID = DS_BVSTG_GROUP_LEAD.FIRST_GROUP_LEADID
             WHERE DS_GROUP_LEAD_FEATURES.CUSTOMER_LEAD_TYPE='Native PROSPECT'
               AND (DS_MKT_CAMPAIGN.PRODUCTTYPE<>'Health' OR DS_MKT_CAMPAIGN.PRODUCTTYPE IS NULL)
               AND DS_GROUP_LEAD_FEATURES.IS_CONVERTED=0
               AND ((DS_GROUP_LEAD_FEATURES.FIRST_GROUP_LEAD_CREATED_DATE BETWEEN CURRENT_DATE-200 AND CURRENT_DATE-1) OR DS_GROUP_LEAD_FEATURES.LAST_LEAD_INTERACTION_DATE >= CURRENT_DATE-5 OR DS_GROUP_LEAD_FEATURES.LAST_CALL_INTERACTION_DATE >= CURRENT_DATE-5 OR DS_GROUP_LEAD_FEATURES.LAST_INTERACTION_DATE >= CURRENT_DATE-5 OR DS_GROUP_LEAD_FEATURES.MAX_QUOTEDATE >= CURRENT_DATE-5)
               AND DS_MKT_LEAD_SOURCE.sourcedb IS NOT NULL
