        dependencies: []
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT RAM_RETAIL_ID,
                   ds_ram_retail_repository.PolicyNumberFormatted,
                   ds_ram_retail_repository.PolicyID,
                   CarrierName,
                   CreatedDate,
                   Asofmonth,
                   ds_ram_retail_repository.SourceDB,
                   LineofBusiness,
                   LOB_Grouped,
                   CustomerType,
                   ds_ram_retail_repository.Term,
                   WrittenPremiumAmount,
                   AnnualizedWrittenPremium,
                   CASE WHEN AnnualizedWrittenPremium>=0 AND AnnualizedWrittenPremium<500     THEN '0-500'
                        WHEN AnnualizedWrittenPremium>=500 AND AnnualizedWrittenPremium<1000  THEN '500-1000'
                        WHEN AnnualizedWrittenPremium>=1000 AND AnnualizedWrittenPremium<1500 THEN '1000-1500'
                        WHEN AnnualizedWrittenPremium>=1500 AND AnnualizedWrittenPremium<2000 THEN '1500-2000'
                        WHEN AnnualizedWrittenPremium>=2000 AND AnnualizedWrittenPremium<2500 THEN '2000-2500'
                        WHEN AnnualizedWrittenPremium>=2500 AND AnnualizedWrittenPremium<3000 THEN '2500-3000'
                        WHEN AnnualizedWrittenPremium>=3000                                   THEN '3000 or more'
                        ELSE 'Missing'
                         END AS AnnualizedWrittenPremium_Group,
                   CASE WHEN gender NOT IN ('M','F') OR Gender IS NULL THEN 'Unknown'
                        ELSE Gender
                         END AS Customer_Gender,
                   abs(datediff(YEAR, createddate, DOB)) Customer_Age,
                   coalesce(upper(MainState),upper(MailingState),upper(GarageState),'Missing') MainState,
                   IFNULL(DOCUMENTLANGUAGETYPE,'Missing') DOCUMENTLANGUAGETYPE,
                   IFNULL(VERBALLANGUAGETYPE,'Missing') VERBALLANGUAGETYPE,
                   ifnull(territorymanagername,'Missing') TerritoryManagerName,
                   ifnull(CASE WHEN (ds_retail_office.StateCode = 'BC' OR ds_ram_retail_repository.OfficeCode= 'COLT' OR CONTAINS(ds_ram_retail_repository.OfficeCode,'SSB') AND ds_ram_retail_repository.OfficeCode!='GESSB') THEN 'NTS' ELSE ds_retail_office.StateCode END,'Missing') OfficeState,
                   CASE WHEN ds_retail_office.channel IN ('NSA','DNSA') THEN 'NSA'
                        WHEN ds_retail_office.channel IS NULL           THEN 'Missing'
                        ELSE ds_retail_office.channel
                         END AS channel,
                   ds_retail_office.Officetype,
                   ds_retail_office.BRAND agencyname, ----Added Agency Brand 2024/05/07           case when leadsource in ('Cust TimeStamp (i)','Cust TimeStamp (o)','Cust TimeStamp (u)',                               'Cust/User (i)','Cust/User (o)','Cust/User (u)','Phone AppOne') then 'Phone'                when LeadSource IN ('Web','LMS (email)','LMS (Phone)') then 'Online'                else case when ds_ram_retail_repository.sourceDB in ('SPLC') then 'Missing' else 'Walk-In' end end as LeadType,            ifnull(ds_mkt_campaign.category,'Missing') Category, ifnull(ds_mkt_campaign.subcategory,'Missing') SubCategory, ifnull(Method,'Missing') Sale_Type,         ifnull(case when (Upper(Trim(ds_ram_retail_repository.OfficeCode))) like '%CONOLB%' then 1                     else 0 end,0) as OnlineBinding,           ifnull(case when ds_retail_office.territorymanagername='Michael Sanchez' then 1 else 0 end,0) as IsFranchise,        ds_ram_retail_repository.counter,ds_ram_retail_repository.label,           ds_ram_retail_repository.islegacytransaction      from    (select distinct RAM_RETAIL_ID,ds_bvstg_comm_policynumberformatting_allsources.PolicyNumberFormatted, ds_ram_retail_repository.PolicyID,             ds_bvstg_comm_policynumberformatting_allsources.CarrierDisplayname CarrierName, to_date(CreatedDate) CreatedDate,            date_trunc('month',to_date(createddate)) Asofmonth, SourceDB, ifnull(LOB_Mapped,'Missing') LineofBusiness,            case when lower(LOB_Mapped) like '%auto%' then 'Auto'                 when LOB_Mapped is null then 'Missing'                  else 'Non-Auto' end as LOB_Grouped,            CustomerType, ifnull(ds_bvstg_Comm_Termcleaning.Term,'Missing') Term, WrittenPremiumAmount,
        name: BVSTG_0AU1_NEWBUSINESS
        noLinkRefs: []
