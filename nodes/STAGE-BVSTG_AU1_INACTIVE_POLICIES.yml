        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
              LEFT JOIN {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} DS_AMS_TRANSACTIONDETAIL
                ON ds_policysummary_v2.Last_PolicyID= DS_AMS_TRANSACTIONDETAIL.PolicyID
               AND ds_policysummary_v2.Last_PolicyID IS NOT NULL
               AND ds_policysummary_v2.SourceDB = 'CIGH'
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
                ON CASE WHEN LEN(IFNULL(DS_AMS_TRANSACTIONDETAIL.BROKERID,ds_policysummary_v2.PRODUCERID)) >6 THEN RIGHT('00000'||IFNULL(DS_AMS_TRANSACTIONDETAIL.BROKERID,ds_policysummary_v2.PRODUCERID),10)
                        ELSE IFNULL(DS_AMS_TRANSACTIONDETAIL.BROKERID,ds_policysummary_v2.PRODUCERID)
                         END = CASE WHEN LEN(ds_agent_key.EmployeeNumber) >6 THEN RIGHT('00000'||ds_agent_key.EmployeeNumber,10)
                        ELSE ds_agent_key.EmployeeNumber
                         END
               AND ds_agent_key.RANK_EMPLOYEENUMBER = 1
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_CUSTOMER') }} ds_bvstg_ap1_customer
                ON ds_policysummary_v2.CUSTOMERID = ds_bvstg_ap1_customer.CustomerID
               AND ds_policysummary_v2.SourceDB = 'AppOne'
              LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CustomerSummary_v2
                ON ds_policysummary_v2.CUSTOMERID = DS_CustomerSummary_v2.CustomerID
               AND DS_CustomerSummary_v2.SourceDB = 'CIGH'
              LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} DS_AP1_TRANSACTIONSUMMARY
                ON ds_policysummary_v2.NBTRANSACTIONID = TO_VARCHAR(DS_AP1_TRANSACTIONSUMMARY.NBTRANSACTIONID)
               AND DS_AP1_TRANSACTIONSUMMARY.TRANSACTIONTYPE = 'Cancellation Request'
              LEFT JOIN {{ ref('STAGE','V_DLBV_MKT_TIMEZONES_STATE') }} V_DLBV_MKT_TIMEZONES_STATE
                ON CASE WHEN ds_policysummary_v2.SOURCEDB ='AppOne' THEN coalesce(ds_bvstg_ap1_customer.MAINSTATE,ds_bvstg_ap1_customer.MAILINGSTATE,ds_bvstg_ap1_customer.GARAGESTATE)
                        WHEN ds_policysummary_v2.SOURCEDB ='CIGH'   THEN coalesce(DS_CustomerSummary_v2.MAINSTATE,DS_CustomerSummary_v2.MAILINGSTATE,DS_CustomerSummary_v2.GARAGESTATE)
                        ELSE ''
                         END = V_DLBV_MKT_TIMEZONES_STATE.StateCode
              LEFT JOIN {{ ref('STAGE','V_DLBV_MKT_TIMEZONES') }} V_DLBV_MKT_TIMEZONES
                ON V_DLBV_MKT_TIMEZONES.timezonename = V_DLBV_MKT_TIMEZONES_STATE.TimeZone
              LEFT JOIN(
                    SELECT DISTINCT DATE(s_ap1_cdtpolicy.CREATED) cdt_Created ,
                           s_ap1_cdtpolicy.Zip AS ZipCode ,
                           s_ap1_cdtpolicy.PolicyHolderEmail ,
                           PolicyID ,
                           POLICYCANCELLATIONDATE ,
                           s_ap1_cdttype.Name cdt_status
                      FROM {{ ref('DATA_VAULT','S_AP1_CDTPOLICY') }} s_ap1_cdtpolicy
                      LEFT JOIN {{ ref('DATA_VAULT','L_CDTPOLICY_CDTTYPE') }} l_cdtpolicy_cdttype
                        ON s_ap1_cdtpolicy.hk_h_cdtpolicy = l_cdtpolicy_cdttype.hk_h_cdtpolicy
                      LEFT JOIN {{ ref('DATA_VAULT','S_AP1_CDTTYPE') }} s_ap1_cdttype
                        ON l_cdtpolicy_cdttype.hk_h_cdttype = s_ap1_cdttype.hk_h_cdttype
                     WHERE s_ap1_cdttype.Name IN ('Lapse', 'CancelInsuredRequest')
                   ) s_ap1_cdtpolicy
                ON TO_VARCHAR(s_ap1_cdtpolicy.PolicyID) = ds_policysummary_v2.PolicyID
               AND ds_policysummary_v2.enddate BETWEEN DATEADD(DAY,-5,s_ap1_cdtpolicy.POLICYCANCELLATIONDATE) AND DATEADD(DAY,5,s_ap1_cdtpolicy.POLICYCANCELLATIONDATE)
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY OfficeCode ORDER BY CASE WHEN ISACTIVE = 'True' THEN 0 ELSE 1 END)=1
                   ) v_s_ap1_office_mroc_current
                ON v_s_ap1_office_mroc_current.OfficeCode = ds_policysummary_v2.BIAPRIMARYAGENTOFFICE
              LEFT JOIN {{ ref('STAGE','V_S_AP1_ORGANIZATION_MROC_CURRENT') }} v_s_ap1_organization_mroc_current
                ON v_s_ap1_organization_mroc_current.OrganizationID = v_s_ap1_office_mroc_current.OrganizationID
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."MEDIACODE_MAPPING" MediaCode_
