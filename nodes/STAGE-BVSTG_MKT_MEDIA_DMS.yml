        dependencies:
          - locationName: STAGE
            nodeName: V_MKT_MEDIALOGS
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN
          - locationName: EDW
            nodeName: DS_MKT_CALLSOURCE
          - locationName: STAGE
            nodeName: V_S_MKT_BROADCAST_CALENDAR_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_MKT_MEDIALOGS') }} v_mkt_medialogs
             INNER JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON ds_mkt_campaign.CAMPAIGNID = v_mkt_medialogs.IDCAMPAIGN
             INNER JOIN {{ ref('EDW','DS_MKT_CALLSOURCE') }} ds_mkt_callsource
                ON ds_mkt_callsource.INBOUNDNUMBER = v_mkt_medialogs.InboundNo
               AND TO_DATE(ds_mkt_callsource.CALLSTART) = v_mkt_medialogs.Date
             INNER JOIN {{ ref('STAGE','V_S_MKT_BROADCAST_CALENDAR_CURRENT') }} v_s_mkt_broadcast_calendar_current
                ON v_s_mkt_broadcast_calendar_current.DATE = v_mkt_medialogs.DATE
             WHERE ds_mkt_callsource.CALL_STATUS IN ('SYSTEM CONNECT','ANSWER')
               AND ds_mkt_callsource.CAMPAIGN_CATEGORY!= 'Customer Service'
               AND ds_mkt_callsource.CALLER_AREACODETIMEZONE IS NOT NULL
             GROUP BY MD5(v_mkt_medialogs.ISCI||v_mkt_medialogs.DATE||v_mkt_medialogs.TIME||ds_mkt_campaign.INBOUNDNUMBER) ,
                      ds_mkt_campaign.STATIONCAMPAIGNNAME ,
                      ds_mkt_campaign.SOURCE_NAME ,
                      ds_mkt_campaign.DMAIDENTIFIER ,
                      ds_mkt_campaign.C_NAME ,
                      ds_mkt_campaign.STATUS ,
                      ds_mkt_campaign.INBOUNDNUMBER ,
                      ds_mkt_campaign.BRAND_NAME ,
                      v_s_mkt_broadcast_calendar_current.YEAR_NUMBER ,
                      v_s_mkt_broadcast_calendar_current.MONTH_NUMBER ,
                      v_s_mkt_broadcast_calendar_current.WEEK_NUMBER ,
                      v_mkt_medialogs.STATIONCOMMERCIAL ,
                      v_mkt_medialogs.COMMERCIALNAME ,
                      v_mkt_medialogs.LENGTH ,
                      v_mkt_medialogs.CC ,
                      v_mkt_medialogs.ISCI ,
                      v_mkt_medialogs.DATE ,
                      v_mkt_medialogs.TIME ,
                      v_mkt_medialogs.IDRECONCILIATTIONTYPE ,
                      v_mkt_medialogs.RATE
