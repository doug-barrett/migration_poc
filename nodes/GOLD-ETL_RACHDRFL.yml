    - aliases:
        SRC_RACHDRFL: 567ce8f9-7a9f-5088-985e-4251425850bd
      customSQL:
        customSQL: ''
      dependencies:
      - locationName: GOLD
        nodeName: SRC_RACHDRFL
      join:
        joinCondition: "FROM  {{ ref('GOLD', 'SRC_RACHDRFL') }} \"SRC_RACHDRFL\" \n\nLEFT OUTER JOIN IDENTIFIER('\"WS_MIGRATION\".\"GOLD\".ID_LOCATION')\nON \"SRC_RACHDRFL\".\"RHCMP\" = \"ID_LOCATION\".\"COMPANY_CODE\"\n AND \"SRC_RACHDRFL\".\"RHLOC\" = \"ID_LOCATION\".\"LOCATION_CODE\"\n\nLEFT OUTER JOIN IDENTIFIER('\"WS_MIGRATION\".\"GOLD\".ID_PARTY')\nON  \"SRC_RACHDRFL\".\"RHCMP\" = \"ID_PARTY\".\"COMPANY_CODE\"\nAND CASE WHEN \"SRC_RACHDRFL\".\"RHCUS0\" > 0 THEN  \"SRC_RACHDRFL\".\"RHCUS0\" ELSE  0 END \n     = \"ID_PARTY\".\"CUSTOMER_ACCOUNT_NUM\"\nAND CASE WHEN \"SRC_RACHDRFL\".\"RHCUS0\" = 0 AND \"SRC_RACHDRFL\".\"RHOVR\" <> 'L'\n         THEN \"TRIM\"(\"SRC_RACHDRFL\".\"RHDLST\") || \"TRIM\"(\"SRC_RACHDRFL\".\"RHDL0\")\n          WHEN \"SRC_RACHDRFL\".\"RHCUS0\" = 0 AND \"SRC_RACHDRFL\".\"RHOVR\" = 'L'\n         THEN \"SRC_RACHDRFL\".\"RHRLOC\"  ELSE '' END\n   = \"ID_PARTY\".\"CUSTOMER_ACCOUNT_CHAR\"\nAND \"ID_PARTY\".\"PARTY_TYPE_CODE\" in (1,2,3)\n\nLEFT OUTER JOIN IDENTIFIER('\"\
          WS_MIGRATION\".\"GOLD\".ID_CUSTOMER_JOB')\nON  \"SRC_RACHDRFL\".\"RHCMP\" = \"ID_CUSTOMER_JOB\".\"COMPANY_CODE\"\nAND \"ID_PARTY\".\"PARTY_ID\" = \"ID_CUSTOMER_JOB\".\"PARTY_ID\"\nAND \"ID_PARTY\".\"PARTY_TYPE_CODE\" = \"ID_CUSTOMER_JOB\".\"PARTY_TYPE_CODE\"\nAND \"SRC_RACHDRFL\".\"RHJOB0\" = \"ID_CUSTOMER_JOB\".\"JOB_NUM\"\n\n \nWhere \"AUD_TIME\" <= (Select MAX(\"BATCH_END\") "
      name: ETL_RACHDRFL
      noLinkRefs: []
