        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_S_SFDC_ACCOUNT_MROC_CURRENT') }} v_s_sfdc_account_mroc_current
              LEFT JOIN {{ ref('STAGE','BVSTG_SFDC_DISTRICT') }} bvstg_sfdc_district
                ON v_s_sfdc_account_mroc_current.office_hierarchy_c = bvstg_sfdc_district.id
              LEFT JOIN {{ ref('STAGE','BVSTG_SFDC_REGION') }} bvstg_sfdc_region
                ON bvstg_sfdc_district.RegionID = bvstg_sfdc_region.id
              LEFT JOIN {{ ref('STAGE','BVSTG_SFDC_AREA') }} bvstg_sfdc_area
                ON bvstg_sfdc_region.AreaID = bvstg_sfdc_area.id
              LEFT JOIN {{ ref('STAGE','BVSTG_SFDC_TERRITORY') }} bvstg_sfdc_territory
                ON bvstg_sfdc_area.territoryid = bvstg_sfdc_territory.id
              LEFT JOIN {{ ref('DATA_VAULT','L_ACCOUNT_BRAND_C') }} l_account_brand_c
                ON l_account_brand_c.hk_h_account = v_s_sfdc_account_mroc_current.hk_h_account
               AND l_account_brand_c.MARKETING_BRAND_NAME_C = v_s_sfdc_account_mroc_current.MARKETING_BRAND_NAME_C
              LEFT JOIN {{ ref('STAGE','V_S_SFDC_BRAND_C_MROC_CURRENT') }} v_s_sfdc_brand_c_mroc_current
                ON v_s_sfdc_brand_c_mroc_current.hk_h_brand_c = l_account_brand_c.hk_h_brand_c
               AND v_s_sfdc_brand_c_mroc_current.is_deleted = FALSE
              LEFT JOIN {{ ref('DATA_VAULT','L_ACCOUNT_CONTACT') }} l_account_contact
                ON l_account_contact.hk_h_account = v_s_sfdc_account_mroc_current.hk_h_account
               AND l_account_contact.id = v_s_sfdc_account_mroc_current.BRANCH_MANAGER_C
              LEFT JOIN {{ ref('STAGE','V_S_SFDC_CONTACT_MROC_CURRENT') }} v_s_sfdc_contact_mroc_current
                ON v_s_sfdc_contact_mroc_current.hk_h_contact = l_account_contact.hk_h_contact
              LEFT JOIN {{ ref('DATA_VAULT','H_GL_ENTITY_C') }} h_gl_entity_c
                ON h_gl_entity_c.ID = v_s_sfdc_account_mroc_current.gl_entity_c
              LEFT JOIN {{ ref('STAGE','V_S_SFDC_GL_ENTITY_C_MROC_CURRENT') }} v_s_sfdc_gl_entity_c_mroc_current
                ON h_gl_entity_c.HK_H_GL_ENTITY_C = v_s_sfdc_gl_entity_c_mroc_current.HK_H_GL_ENTITY_C
