            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PRED_VEHICLE') }} AS SELECT upper(make) AS make,
                   upper(model) AS model,
                   cast(vehyear AS varchar(10)) AS vehyear
              FROM {{ ref('STAGE','V_S_AMS_VEHICLE_MROC_CURRENT') }}
             WHERE make IS NOT NULL
               AND make <>''
               AND model IS NOT NULL
               AND model <>''
               AND vehyear IS NOT NULL
               AND vehyear <>''
             UNION SELECT upper(make) AS make,
                   upper(model) AS model,
                   cast(vehicleyear AS varchar(10)) AS vehyear
              FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }}
             WHERE make IS NOT NULL
               AND make <>''
               AND model IS NOT NULL
               AND model <>''
               AND vehicleyear IS NOT NULL
               AND vehicleyear > 0
               AND isrowdeleted=0
             ORDER BY 1,
                      2,
                      3
