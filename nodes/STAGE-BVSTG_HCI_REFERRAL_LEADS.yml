        dependencies:
          - locationName: STAGE
            nodeName: V_S_AP1_LEAD_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_EMPLOYEE_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_PRE_AP1_OFFICE_MROC_CURRENT
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTION
          - locationName: STAGE
            nodeName: V_DLBV_CFA_HCI_AGENTS_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }} v_s_ap1_lead_mroc_current
             INNER JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} v_s_ap1_employee_mroc_current
                ON v_s_ap1_lead_mroc_current.CREATEDBY = v_s_ap1_employee_mroc_current.USERID
             INNER JOIN {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} v_s_ap1_office_mroc_current
                ON v_s_ap1_office_mroc_current.OFFICEID = v_s_ap1_lead_mroc_current.OFFICEID
             INNER JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON v_s_ap1_office_mroc_current.OFFICECODE = ds_retail_office.OFFICECODE
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTION') }} ds_bvstg_ap1_transaction
                ON ds_bvstg_ap1_transaction.TRANSACTIONID = v_s_ap1_lead_mroc_current.TRANSACTIONID
             WHERE ds_retail_office.STATECODE IN ('AZ','CA','FL','TX','WA')
               AND ds_retail_office.LOCATIONSTATUS = 'Open'
               AND ds_retail_office.OFFICETYPE IN ('Health Care Office', 'Retail', 'Web Office')
               AND v_s_ap1_lead_mroc_current.ISROWDELETED = FALSE
               AND v_s_ap1_lead_mroc_current.LINEOFBUSINESSTYPEID = 423
               AND v_s_ap1_lead_mroc_current.CREATEDBY NOT IN (
                    SELECT DISTINCT UID
                      FROM {{ ref('STAGE','V_DLBV_CFA_HCI_AGENTS_CURRENT') }}
                     WHERE UID !=''
                   )
               AND ds_bvstg_ap1_transaction.TRANSACTIONOFFICECODE = 'HCIBP'
               AND ds_bvstg_ap1_transaction.ISVOID = FALSE
               AND ds_bvstg_ap1_transaction.ISCORPORATEVOID = FALSE
               AND ds_bvstg_ap1_transaction.TRANSACTIONTYPE = 'New Business'
               AND ds_bvstg_ap1_transaction.TRANSACTIONID IS NOT NULL
             GROUP BY ds_retail_office.STATECODE,
                      ds_retail_office.AREACODE,
                      ds_retail_office.SALESVP,
                      ds_retail_office.DISTRICTCODE,
                      ds_retail_office.DISTRICTMANAGERNAME,
                      ds_retail_office.OFFICECODE,
                      TO_DATE(v_s_ap1_lead_mroc_current.CREATED),
                      v_s_ap1_employee_mroc_current.FIRSTNAME,
                      v_s_ap1_employee_mroc_current.LASTNAME,
                      v_s_ap1_employee_mroc_current.EMPLOYEENUMBER
        name: BVSTG_HCI_REFERRAL_LEADS
        noLinkRefs: []
