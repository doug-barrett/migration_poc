      description: Relies on the departments being set up in a consistent manner in
        QPulse. Where the first three letters are the JDE cost centre code.
      name: JDEBusinessUnit
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE     -- CHECK FOR BOTH TYPES OF DASKES...     WHEN SUBSTRING(LTRIM(RTRIM("L_QP_YDEPARTMENT".""name"")),
          5,1) = '-' OR SUBSTRING(LTRIM(RTRIM("L_QP_YDEPARTMENT".""name"")), 5,1)
          = NCHAR(8211)     -- CORPORATE (A), "network" (B) AND SOLUTIONS (O) DO NOT
          USE 6 DIGIT "business" "units"     THEN SUBSTRING(LTRIM(RTRIM("L_QP_YDEPARTMENT".""name"")),
          1,3) + CASE WHEN LEFT(LTRIM(RTRIM("L_QP_YDEPARTMENT".""name"")),1) IN ('A','B','O')
          THEN '' ELSE '905' END     -- IT COULD BE POSSIBLE TO MAP THE "company"
          LEVEL ENTRIES AS WELL, BUT I THINK I WILL LEAVE THESE AS UNKNOWN, AND LEAVE
          IT TO THE QPULSE USER TO CHOOSE A DEFAULT IF APPLICABLE     -- IF WE DID
          MAP THIS, CONTRACTING WOULD GO TO _CC905, CORPORATE TO AWB AND "network"
          TO BNM     ELSE 'UNKNOWN' END
