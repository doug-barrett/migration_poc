          \ date '2008-01-01' and Date\n\n  And EQUIPMENT_HISTORY.Status_See_Field_Ref\
          \ = 'A'\n  And EQUIPMENT_HISTORY.Equipment_Status_Code <> 'S'\n  And EQUIPMENT.EQUIPMENT_STATUS_CODE\
          \ NOT IN ('S', 'J', 'M', 'T', 'V')\n  And EQUIPMENT.EQUIPMENT_TYPE_CODE\
