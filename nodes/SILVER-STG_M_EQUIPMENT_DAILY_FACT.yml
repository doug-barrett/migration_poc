          \ EQUIPMENT_HISTORY\n  ON M_LOCATION.Location_Id = EQUIPMENT_HISTORY.Current_Location_Id\n\
          \n  JOIN [M_LOCATION] M_LOCATION1\n  ON M_LOCATION1.Location_Id = EQUIPMENT_HISTORY.Assigned_Location_Id\n\
