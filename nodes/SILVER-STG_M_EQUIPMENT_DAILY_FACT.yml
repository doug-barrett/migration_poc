      - columnReferences: []
        transform: "CASE\n\n  WHEN CV_EQUIPMENT.NEW_USED_IND ='U' \n\n   AND CV_EQUIPMENT.MODEL_YEAR_ID\
          \ BETWEEN 0  AND\t9 \n\n   AND CV_EQUIPMENT_HISTORY.Status_See_Field_Ref<>'D'\n\
          \n   AND CV_EQUIPMENT.EQUIPMENT_TYPE_code  IN ('R','S')\n\n   AND CV_EQUIPMENT.CATEGORY_CODE>99\n\
          \n   AND CV_EQUIPMENT.Equipment_Status_Code  NOT IN ('T','M','J','V','S','C')\n\
          \n  THEN FISCALCALENDAR.Calendar_Date - cast ( substr( '200'||trim(EQUIPMENT.model_year_id),\
          \ 1,\t4)||'0701'   as date format 'yyyymmdd') \n\n\n\n  WHEN CV_EQUIPMENT.NEW_USED_IND='U'\
          \ \n\n   AND CV_EQUIPMENT.MODEL_YEAR_ID between 10  and\t74\n\n   AND CV_EQUIPMENT_HISTORY.Status_See_Field_Ref<>'D'\n\
          \n   AND CV_EQUIPMENT.EQUIPMENT_TYPE_code  IN ('R','S')\n\n   AND CV_EQUIPMENT.CATEGORY_CODE>99\n\
          \n   AND CV_EQUIPMENT.Equipment_Status_Code  NOT IN ('T','M','J','V','S','C')\n\
          \n  THEN FISCALCALENDAR.Calendar_Date - cast ( substr( '20'||trim(EQUIPMENT.model_year_id),\
          \ 1, 4)||'0701'   as date format 'yyyymmdd') \n\n\n\n  WHEN CV_EQUIPMENT.NEW_USED_IND='U'\
          \ \n\n   AND CV_EQUIPMENT.MODEL_YEAR_ID BETWEEN 75  and\t99\n\n   AND CV_EQUIPMENT_HISTORY.Status_See_Field_Ref<>'D'\n\
          \n   AND CV_EQUIPMENT.EQUIPMENT_TYPE_code  IN ('R','S')\n\n   AND CV_EQUIPMENT.CATEGORY_CODE>99\n\
          \n   AND CV_EQUIPMENT.Equipment_Status_Code  NOT IN ('T','M','J','V','S','C')\n\
          \n  THEN FISCALCALENDAR.Calendar_Date - cast ( substr( '19'||trim(EQUIPMENT.model_year_id),\
          \ 1, 4)||'0701'   as date format 'yyyymmdd') \n\n\n\n  ELSE FISCALCALENDAR.Calendar_Date\
          \ - CV_EQUIPMENT.PUT_IN_RENTAL_DATE \n\n\n\nEND"
