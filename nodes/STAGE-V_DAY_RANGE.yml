        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_DAY_RANGE') }} AS SELECT CAL_MONTH_NO ,
                   CAL_YEAR ,
                   CAL_MONTH ,
                   MIN(CALENDAR_DATE) AS Min_Date ,
                   MAX(CALENDAR_DATE) AS Max_Date
              FROM {{ ref('UNKNOWN','STAGE_DATE_SF') }}
             WHERE TO_DATE(CALENDAR_DATE) BETWEEN '2019-01-01' /*   CASE WHEN DATE_PART(day,CURRENT_DATE())<4 THEN   DATEADD(Day,1,last_day(DATEADD(MONTH,-2,CURRENT_DATE())))
                                ELSE  DATEADD(DAY,1,last_day(DATEADD(MONTH,-1,CURRENT_DATE())))
                           END
            */ AND DATEADD(DAY,-1,CURRENT_DATE())
             GROUP BY CAL_MONTH_NO ,
                      CAL_YEAR ,
                      CAL_MONTH ,
                      TO_DATE(CALENDAR_DATE)
