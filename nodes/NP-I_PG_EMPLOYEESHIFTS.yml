        name: STARTTIME
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: b63df1a8-cd2d-47fa-8ebe-5728f6197f2e
                stepCounter: 76c1571e-dbfb-4e63-89d0-104812efac09
            transform: --WE NEED A DEFAULT START TIME FOR NON-FIELD STAFF, SET TO 8:00AM  -- WHEN PROFILED TO WORK THAT DAY  CASE WHEN L_PG_EMPLOYEETOUR.TOURCODE IS NULL THEN   CASE    WHEN DATEPART(DW,CALENDARDATE) = 1 AND HOURSSUNDAY <> 0 THEN 480    WHEN DATEPART(DW,CALENDARDATE) = 2 AND HOURSMONDAY <> 0 THEN 480    WHEN DATEPART(DW,CALENDARDATE) = 3 AND HOURSTUESDAY <> 0 THEN 480    WHEN DATEPART(DW,CALENDARDATE) = 4 AND HOURSWEDNESDAY <> 0 THEN 480    WHEN DATEPART(DW,CALENDARDATE) = 5 AND HOURSTHURSDAY <> 0 THEN 480    WHEN DATEPART(DW,CALENDARDATE) = 6 AND HOURSFRIDAY <> 0 THEN 480    WHEN DATEPART(DW,CALENDARDATE) = 7 AND HOURSSATURDAY <> 0 THEN 480    ELSE NULL   END   ELSE L_PG_SHIFTTIMEBAND.STARTTIME  END
      - appliedColumnTests: {}
        columnReference:
          columnCounter: ff09d5d1-006e-4bb2-ad6a-43f03da5b37f
          stepCounter: 2a5f7ac8-adbc-4b15-b587-da87459d21bd
        config: {}
        dataType: INT
        defaultValue: ""
        description: ""
        name: ENDTIME
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 708549c6-9aeb-4d57-9266-16bf1b50cacb
                stepCounter: 76c1571e-dbfb-4e63-89d0-104812efac09
            transform: --WE NEED A DEFAULT END TIME FOR NON-FIELD STAFF, SET TO PROFILED HOURS FROM 8:00AM  -- BUT ONLY WHEN PROFILED TO WORK THAT DAY  CASE WHEN L_PG_EMPLOYEETOUR.TOURCODE IS NULL THEN   CASE    WHEN DATEPART(DW,CALENDARDATE) = 1 AND HOURSSUNDAY <> 0 THEN 480 + (HOURSSUNDAY * 60) + CASE WHEN HOURSSUNDAY > 4.5 THEN 30 ELSE 0 END    WHEN DATEPART(DW,CALENDARDATE) = 2 AND HOURSMONDAY <> 0 THEN 480 + (HOURSMONDAY * 60) + CASE WHEN HOURSMONDAY > 4.5 THEN 30 ELSE 0 END    WHEN DATEPART(DW,CALENDARDATE) = 3 AND HOURSTUESDAY <> 0 THEN 480 + (HOURSTUESDAY * 60) + CASE WHEN HOURSTUESDAY > 4.5 THEN 30 ELSE 0 END    WHEN DATEPART(DW,CALENDARDATE) = 4 AND HOURSWEDNESDAY <> 0 THEN 480 + (HOURSWEDNESDAY * 60) + CASE WHEN HOURSWEDNESDAY > 4.5 THEN 30 ELSE 0 END    WHEN DATEPART(DW,CALENDARDATE) = 5 AND HOURSTHURSDAY <> 0 THEN 480 + (HOURSTHURSDAY * 60) + CASE WHEN HOURSTHURSDAY > 4.5 THEN 30 ELSE 0 END    WHEN DATEPART(DW,CALENDARDATE) = 6 AND HOURSFRIDAY <> 0 THEN 480 + (HOURSFRIDAY * 60) + CASE WHEN HOURSFRIDAY > 4.5 THEN 30 ELSE 0 END    WHEN DATEPART(DW,CALENDARDATE) = 7 AND HOURSSATURDAY <> 0 THEN 480 + (HOURSSATURDAY * 60) + CASE WHEN HOURSSATURDAY > 4.5 THEN 30 ELSE 0 END    ELSE NULL   END   ELSE L_PG_SHIFTTIMEBAND.ENDTIME  END
      - appliedColumnTests: {}
        columnReference:
          columnCounter: e0d50364-65e9-4407-a48f-651fce7c3bd5
          stepCounter: 2a5f7ac8-adbc-4b15-b587-da87459d21bd
        config: {}
        dataType: INT
        defaultValue: ""
        description: ""
        name: BREAKAMOUNT
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 63e0b31b-49fd-4f23-9b0d-17212d44cf67
                stepCounter: 76c1571e-dbfb-4e63-89d0-104812efac09
            transform: --THE DEFAULT FOR ALL EMPLOYEES IS TO HAVE A BREAK.  --BUT ONLY IF THEY ARE ROSTERED ON.  -- SOME TOURS MAKE USE OF THE STB AND RDO SHIFT CODES  -- THESE ARE NOT WORKED AND SHOULD HAVE ZERO AMOUNTS FOR BREAKS  CASE   WHEN ISNULL(L_PG_SHIFTTIMEBAND.BREAKCODE,'30') = '00' THEN 0   WHEN L_PG_SHIFTTIMEBAND.SHIFTCODE IS NULL THEN 0   WHEN L_PG_SHIFTTIMEBAND.SHIFTCODE IN ('RDO','STB') THEN 0   ELSE 30  END
      - appliedColumnTests: {}
        columnReference:
          columnCounter: 7c1912db-3afb-427d-8183-c52b5d73f3bc
          stepCounter: 2a5f7ac8-adbc-4b15-b587-da87459d21bd
        config: {}
        dataType: DECIMAL(9,2)
        defaultValue: ""
        description: ""
        name: ROSTEREDHOURS
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 63e0b31b-49fd-4f23-9b0d-17212d44cf67
                stepCounter: 76c1571e-dbfb-4e63-89d0-104812efac09
            transform: --IF ON PARENTAL LEAVE, THEN SHOULD HAVE 0 ROSTERED HOURS  --SOMETIMES THE END DATE IS NOT SET AND SOMETIMES THE FLAG IS STILL SET EVEN THOUGH THE DATE IS PAST  CASE WHEN PARENTLEAVE = 1 AND CALENDARDATE BETWEEN PARENTLVSTARTDATE AND ISNULL(PARENTLVENDDATE,CALENDARDATE) THEN 0  --IF NOT TOUR CODE SET UP, USE PROFILED HOURS  ELSE CASE WHEN L_PG_EMPLOYEETOUR.TOURCODE IS NULL THEN   CASE DATEPART(DW,CALENDARDATE)    WHEN 1 THEN HOURSSUNDAY    WHEN 2 THEN HOURSMONDAY    WHEN 3 THEN HOURSTUESDAY    WHEN 4 THEN HOURSWEDNESDAY    WHEN 5 THEN HOURSTHURSDAY    WHEN 6 THEN HOURSFRIDAY    ELSE HOURSSATURDAY END  --IF NO BREAK CODE IS SPECIFIED, THE DEFAULT IS TO HAVE A 30 MINUTE BREAK   ELSE (ISNULL(L_PG_SHIFTTIMEBAND.ENDTIME - L_PG_SHIFTTIMEBAND.STARTTIME,0)        - CASE           WHEN ISNULL(L_PG_SHIFTTIMEBAND.BREAKCODE,'30') = '00' THEN 0           WHEN L_PG_SHIFTTIMEBAND.SHIFTCODE IS NULL THEN 0           WHEN L_PG_SHIFTTIMEBAND.SHIFTCODE IN ('RDO','STB') THEN 0           ELSE 30          END        )/60.0   END  END
      - appliedColumnTests: {}
