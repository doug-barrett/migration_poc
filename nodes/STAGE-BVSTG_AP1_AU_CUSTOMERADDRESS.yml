        dependencies:
          - locationName: DATA_VAULT
            nodeName: H_CUSTOMER
          - locationName: STAGE
            nodeName: BVSTG_AP1_CUSTOMER_REFRESH
          - locationName: STAGE
            nodeName: V_S_AP1_CUSTOMERADDRESS_MROC_CURRENT
          - locationName: DATA_VAULT
            nodeName: H_ADDRESS
          - locationName: STAGE
            nodeName: V_S_AP1_ADDRESS_MROC_CURRENT
          - locationName: EDW
            nodeName: REF_AP1_CODEVALUE
          - locationName: DATA_VAULT
            nodeName: H_MAINADDRESS
          - locationName: STAGE
            nodeName: V_S_AP1_CUSTOMER_MROC_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AP1_CUSTOMER_REFRESH') }} bvstg_ap1_customer_refresh
              JOIN {{ ref('DATA_VAULT','H_CUSTOMER') }} h_customer
                ON h_customer.customerid = TO_CHAR(bvstg_ap1_customer_refresh.customerid)
              JOIN {{ ref('STAGE','V_S_AP1_CUSTOMERADDRESS_MROC_CURRENT') }} v_s_ap1_customeraddress_mroc_current
                ON h_customer.customerid = TO_CHAR(v_s_ap1_customeraddress_mroc_current.customerid)
              JOIN {{ ref('DATA_VAULT','H_ADDRESS') }} h_address
                ON v_s_ap1_customeraddress_mroc_current.addressid = h_address.addressid
              JOIN {{ ref('STAGE','V_S_AP1_ADDRESS_MROC_CURRENT') }} v_s_ap1_address_mroc_current
                ON h_address.HK_h_address = v_s_ap1_address_mroc_current.HK_h_address
              JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue
                ON v_s_ap1_address_mroc_current.stateid = ref_ap1_codevalue.codevalueid
              JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevaluetype
                ON v_s_ap1_address_mroc_current.addresstypeid = ref_ap1_codevaluetype.codevalueid
              LEFT JOIN {{ ref('DATA_VAULT','H_MAINADDRESS') }} h_mainaddress
                ON h_address.addressid = h_mainaddress.mainaddressid
              LEFT JOIN (
                    SELECT TO_CHAR(customerid) AS customerid,
                           MAX(mainaddressid) AS mainaddressid
                      FROM {{ ref('STAGE','V_S_AP1_CUSTOMER_MROC_CURRENT') }}
                     WHERE mainaddressid IS NOT NULL
                     GROUP BY customerid
                   ) v_s_ap1_customer_mroc_current
                ON h_customer.customerid=TO_CHAR(v_s_ap1_customer_mroc_current.customerid)
             WHERE v_s_ap1_address_mroc_current.isrowdeleted = 0
             GROUP BY h_customer.HK_h_customer,
                      h_customer.customerid,
                      ref_ap1_codevaluetype.codevalue
