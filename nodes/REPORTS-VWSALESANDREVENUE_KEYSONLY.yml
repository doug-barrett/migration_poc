      join:
        joinCondition: |-
          FROM {{ ref('FACT', 'SalesAndRevenue') }} "AS"
          LEFT JOIN {{ ref('DIM', 'DimReceiptDate') }} "AS"
          FULL JOIN {{ ref('DIM', 'Contract') }} "AS"
          LEFT JOIN {{ ref('DIM', 'Supplier') }} "SUPPLIER"
            ON SUPPLIER.SUPPLIERKEY = CONTRACT.SUPPLIERKEY
          LEFT JOIN {{ ref('FACT', 'RevenueBudgetPD') }} "AS"
          LEFT JOIN {{ ref('DIM', 'RevenueBudgetPDDetail') }} "AS"
          FULL JOIN {{ ref('DIM', 'Account') }} "AS"
          LEFT JOIN {{ ref('DIM', 'AccountGeography') }} "AS"
          LEFT JOIN {{ ref('DIM', 'AccountHierarchy') }} "AS"
          LEFT JOIN {{ ref('DIM', 'Organization') }} "AS"
          LEFT JOIN {{ ref('DIM', 'SalesTerritory') }} "AS"
          LEFT JOIN {{ ref('DIM', 'FinancialSalesTerritory') }} "AS"
          LEFT JOIN {{ ref('DIM', 'DirectSalesTerritory') }} "AS"
          LEFT JOIN {{ ref('FACT', 'RevenueBudgetForceId') }} "AS"
          LEFT JOIN {{ ref('DIM', 'RevenueBudgetForceIdDetail') }} "AS"
          LEFT JOIN {{ ref('FACT', 'RevenueBudgetForceIdDirect') }} "AS"
          LEFT JOIN {{ ref('DIM', 'RevenueBudgetForceIdDirectDetail') }} "AS"
          LEFT JOIN {{ ref('DIM', 'TransactionClass') }} "AS"
          LEFT JOIN {{ ref('REPORTS', 'AggContractUsageByReceiptDate') }} "AGGCONTRACTUSAGEBYRECEIPTDATE"
            ON TRACTUSAGEBYRECEIPTDATE ON ACCOUNT.FORCEID = AGGCONTRACTUSAGEBYRECEIPTDATE.FORCEID AND CONTRACT.PPACONTRACTNUMBER = AGGCONTRACTUSAGEBYRECEIPTDATE.PPACONTRACTNUMBER AND DIMRECEIPTDATE.RECEIPTDATECALQUARTER = AGGCONTRACTUSAGEBYRECEIPTDATE.RECEIPTDATECALQUARTER
          LEFT JOIN {{ ref('STAGE', 'SQLBIT') }} "SQLBIT"
      name: vwSalesAndRevenue_KeysOnly
