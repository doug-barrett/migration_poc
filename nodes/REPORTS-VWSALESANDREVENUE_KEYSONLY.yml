          LEFT JOIN {{ ref('FACT', 'RevenueBudgetPD') }} "RevenueBudgetPD"
            ON REVENUEBUDGETPD.CONTRACTKEY = SALESANDREVENUE.CONTRACTKEY AND REVENUEBUDGETPD.SUPPLIERKEY = SALESANDREVENUE.SUPPLIERKEY AND REVENUEBUDGETPD.BUDGETDATEKEY = SALESANDREVENUE.RECEIPTDATEKEY
          LEFT JOIN {{ ref('DIM', 'RevenueBudgetPDDetail') }} "RevenueBudgetPDDetail"
            ON REVENUEBUDGETPD.REVENUEBUDGETPDDETAILKEY=REVENUEBUDGETPDDETAIL.REVENUEBUDGETPDDETAILKEY
          FULL JOIN {{ ref('DIM', 'Account') }} "Account"
            ON ACCOUNT.ACCOUNTKEY = SALESANDREVENUE.ACCOUNTKEY
          LEFT JOIN {{ ref('DIM', 'AccountGeography') }} "AccountGeography"
            ON ACCOUNTGEOGRAPHY.ACCOUNTGEOGRAPHYKEY = ACCOUNT.ACCOUNTGEOGRAPHYKEY
          LEFT JOIN {{ ref('DIM', 'AccountHierarchy') }} "AccountHierarchy"
            ON ACCOUNTHIERARCHY.ACCOUNTHIERARCHYKEY = ACCOUNT.ACCOUNTHIERARCHYKEY
          LEFT JOIN {{ ref('DIM', 'Organization') }} "Organization"
            ON ORGANIZATION.ORGANIZATIONKEY = ACCOUNT.ORGANIZATIONKEY
          LEFT JOIN {{ ref('DIM', 'SalesTerritory') }} "SalesTerritory"
            ON SALESTERRITORY.SALESTERRITORYKEY = ACCOUNT.SALESTERRITORYKEY
          LEFT JOIN {{ ref('DIM', 'FinancialSalesTerritory') }} "FinancialSalesTerritory"
            ON FINANCIALSALESTERRITORY.FINANCIALSALESTERRITORYKEY = ACCOUNT.FINANCIALSALESTERRITORYKEY
          LEFT JOIN {{ ref('DIM', 'DirectSalesTerritory') }} "DirectSalesTerritory"
            ON DIRECTSALESTERRITORY.DIRECTSALESTERRITORYKEY = SALESANDREVENUE.DIRECTSALESTERRITORYKEY--
          LEFT JOIN {{ ref('FACT', 'RevenueBudgetForceId') }} "RevenueBudgetForceId"
            ON REVENUEBUDGETFORCEID.ACCOUNTKEY = SALESANDREVENUE.ACCOUNTKEY AND REVENUEBUDGETFORCEID.BUDGETDATEKEY = SALESANDREVENUE.RECEIPTDATEKEY
          LEFT JOIN {{ ref('DIM', 'RevenueBudgetForceIdDetail') }} "RevenueBudgetForceIdDetail"
            ON REVENUEBUDGETFORCEIDDETAIL.REVENUEBUDGETFORCEIDDETAILKEY = REVENUEBUDGETFORCEID.REVENUEBUDGETFORCEIDDETAILKEY ------FORCEID(TERRITORY) DIRECT BUDGET (SUBSET OF REVENUEBUDGETFORCEID)
          LEFT JOIN {{ ref('FACT', 'RevenueBudgetForceIdDirect') }} "RevenueBudgetForceIdDirect"
            ON REVENUEBUDGETFORCEIDDIRECT.ACCOUNTKEY = REVENUEBUDGETFORCEID.ACCOUNTKEY AND REVENUEBUDGETFORCEIDDIRECT.BUDGETDATEKEY = REVENUEBUDGETFORCEID.BUDGETDATEKEY
          LEFT JOIN {{ ref('DIM', 'RevenueBudgetForceIdDirectDetail') }} "RevenueBudgetForceIdDirectDetail"
            ON REVENUEBUDGETFORCEIDDIRECTDETAIL.REVENUEBUDGETFORCEIDDIRECTDETAILKEY = REVENUEBUDGETFORCEIDDIRECT.REVENUEBUDGETFORCEIDDIRECTDETAILKEY
          LEFT JOIN {{ ref('DIM', 'TransactionClass') }} "TransactionClass"
            ON TRANSACTIONCLASS.TRANSACTIONCLASSKEY = SALESANDREVENUE.TRANSACTIONCLASSKEY
          LEFT JOIN {{ ref('REPORTS', 'AggContractUsageByReceiptDate') }} "AggContractUsageByReceiptDate"
            ON ACCOUNT.FORCEID = AGGCONTRACTUSAGEBYRECEIPTDATE.FORCEID AND CONTRACT.PPACONTRACTNUMBER = AGGCONTRACTUSAGEBYRECEIPTDATE.PPACONTRACTNUMBER AND DIMRECEIPTDATE.RECEIPTDATECALQUARTER = AGGCONTRACTUSAGEBYRECEIPTDATE.RECEIPTDATECALQUARTER
          LEFT JOIN {{ ref('STAGE', 'vwLevel1__SupplierOccurences') }} "vwLevel1__SupplierOccurences"
            ON VWLEVEL1__SUPPLIEROCCURENCES.LEVEL1FORCEID = SALESANDREVENUE.LEVEL1FORCEID AND VWLEVEL1__SUPPLIEROCCURENCES.RECEIPTDATE = SALESANDREVENUE.RECEIPTDATE AND VWLEVEL1__SUPPLIEROCCURENCES.FINANCIALREPORTINGSUPPLIERNAME = CONTRACT.FINANCIALREPORTINGSUPPLIERNAME
          LEFT JOIN {{ ref('STAGE', 'vwLevel1__ContractOccurences') }} "vwLevel1__ContractOccurences"
            ON VWLEVEL1__CONTRACTOCCURENCES.LEVEL1FORCEID = SALESANDREVENUE.LEVEL1FORCEID AND VWLEVEL1__CONTRACTOCCURENCES.RECEIPTDATE = SALESANDREVENUE.RECEIPTDATE AND VWLEVEL1__CONTRACTOCCURENCES.INITIALCONTRACTID = CONTRACT.INITIALCONTRACTID
