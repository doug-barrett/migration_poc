        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source
             INNER JOIN {{ ref('EDW','DS_INTERACTIONSUMMARY') }} ds_interactionsummary
                ON ds_interactionsummary.INTERACTIONIDKEY = (SPLIT_PART(ds_mkt_lead_source.CALLID,'-',1)||'-'||SPLIT_PART(ds_mkt_lead_source.CALLID,'-',2))
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON ds_mkt_campaign.CAMPAIGNID = ds_mkt_lead_source.CAMPAIGNID
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository_activity
                ON ds_mkt_lead_source.TransferID = ds_ram_retail_repository_activity.Activityid
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                ON ds_ram_retail_repository_activity.TransactionID = ds_ram_retail_repository.TransactionID
               AND ds_ram_retail_repository.Label like 'New Business%'
             WHERE TO_DATE(ds_mkt_lead_source.TRANSFERDATE)>='2020-01-01'
               AND ds_mkt_lead_source.isTransfer = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY md5(DS_INTERACTIONSUMMARY.REMOTENUMBERCALLID||DS_INTERACTIONSUMMARY.STARTDATETIME||'MCC Global Calls Imported - Transfers') ORDER BY DS_INTERACTIONSUMMARY.STARTDATETIME)=1
