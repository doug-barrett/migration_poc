          - locationName: UNKNOWN
            nodeName: STAGE_DATE_SF
          - locationName: EDW
            nodeName: DS_PHONEEXECUTIONSCORE
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
             INNER JOIN {{ ref('UNKNOWN','STAGE_DATE_SF') }} STAGE_DATE_SF
                ON STAGE_DATE_SF.CALENDAR_DATE >='2021-01-01'
             INNER JOIN {{ ref('EDW','DS_PHONEEXECUTIONSCORE') }} ds_phoneexecutionscore
                ON (ds_agent_key.EmployeeNumber = ds_phoneexecutionscore.EmployeeNumber AND ds_phoneexecutionscore.ScoreDate BETWEEN DATEADD(DAY,-15,STAGE_DATE_SF.CALENDAR_DATE) AND STAGE_DATE_SF.CALENDAR_DATE)
             INNER JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON (ds_retail_office.OfficeCode = ds_agent_key.OfficeCode)
             WHERE ds_agent_key.RANK_EMPLOYEENUMBER=1
               AND ds_agent_key.officecode != 'SSBTJ'
               AND ds_agent_key.CompanyCode NOT IN('SSBTJ','CONIS')
               AND STAGE_DATE_SF.CALENDAR_DATE < DATE(CURRENT_DATE())
               AND ds_agent_key.OriginalHireDate<=STAGE_DATE_SF.CALENDAR_DATE
               AND (ds_agent_key.TerminationDate>STAGE_DATE_SF.CALENDAR_DATE OR ds_agent_key.TerminationDate IS NULL)
               AND ds_agent_key.LastHireDate<=STAGE_DATE_SF.CALENDAR_DATE
               AND ds_retail_office.channel !='SPLC'
             GROUP BY ds_agent_key.EmployeeNumber ,
                      STAGE_DATE_SF.CALENDAR_DATE
