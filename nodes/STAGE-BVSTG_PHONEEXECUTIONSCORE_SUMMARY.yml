                          WHEN MAX(ds_retail_office.agencyname)='Acceptance' AND MAX(ds_retail_office.statecode) IN ('GA','FL','AL','MS') AND EndDate < '2024-05-16' THEN 6
                          WHEN MAX(ds_retail_office.agencyname)='Acceptance' AND MAX(ds_retail_office.statecode) IN ('PA','OH') AND EndDate < '2024-05-31'           THEN 6
