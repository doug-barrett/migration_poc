    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            EXTENDED
              FROM DATA_ANALYTICS.WFM_WORKSPACE.TRESS_INCIDENTSOT AS TRESSHOURS
              LEFT JOIN DATA_ANALYTICS.WFM_WORKSPACE.TRESS_OFFICE_ID AS OFFICEBIA
                ON TRESSHOURS.OFFICE_ID = OFFICEBIA.OFFICE_ID
              LEFT JOIN (
                    SELECT ID_NUMBER, DATE, PAYROLL,
                           COALESCE(SUM(ADDITIONAL), 0) / 7 AS ADDHOURS
                      FROM DATA_ANALYTICS.WFM_WORKSPACE.TRESS_INCIDENTSOT AS INADDITIONALHOURS
                     WHERE INADDITIONALHOURS.DEPARTMENT = 'BPO'
                       AND INADDITIONALHOURS.POSITION IN ('REPRESENTANTE CS BILINGÜE BPO', 'AGENTE BILINGUE BPO', 'Representante de ventas BPO', 'Representante Wellness', 'Representante FNOL I', 'Care Navigator BPO', 'Tech Support Agent I', 'Agente Bilingue FNOL BPO', 'AGENTE BILINGUE BPO BackOffice', 'Agente Soporte de Llamadas BPO', 'Care Analyst', 'Contador Sr Accounting', 'SME MENTOR', 'CLAIMS PROCESSING I', 'Agente BPO BackOffice', 'Administrador de Redes sociale', 'Head of Accounting', 'CONTADOR SR', 'Representante CS Bilingüe BPO II', 'Agente Soporte de Llamadas BPO II', 'Agente SPL', 'Sales Agent', 'BPO Data Entry')
                     GROUP BY ID_NUMBER, DATE, PAYROLL
                   ) AS ADDITIONALHOURS
                ON TRESSHOURS.ID_NUMBER = ADDITIONALHOURS.ID_NUMBER
               AND TRESSHOURS.DATE = ADDITIONALHOURS.DATE
              LEFT JOIN ( SELECT ABC.DATE,
                   ABC.OFFICE_ID,
                   MAX(BUDGETHOURS.BUDGETHOURSOPM) AS BUDGETDENOMINATOR,
                   MAX(NUMBERAGENTSDB.NUMBERAGENTS),
                   MAX(WORKEDDAYS.WORKEDDAYS)
              FROM DATA_ANALYTICS.WFM_WORKSPACE.TRESS_INCIDENTSOT AS ABC
              LEFT JOIN (
                    SELECT DATE_PART('MONTH', TO_TIMESTAMP(MONTH)) AS MONTH_PART,
                           DATE_PART('YEAR', TO_TIMESTAMP(MONTH)) AS YEAR_PART,
                           OFFICE,
                           SUM(HOURS_OPM) AS BUDGETHOURSOPM
                      FROM DATA_ANALYTICS.WFM_WORKSPACE.BPO_BILLABLE_UNITS
                     GROUP BY DATE_PART('MONTH', TO_TIMESTAMP(MONTH)),
                              DATE_PART('YEAR', TO_TIMESTAMP(MONTH)),
                              OFFICE
                   ) AS BUDGETHOURS
                ON DATE_PART('MONTH', TO_TIMESTAMP(ABC.DATE)) = BUDGETHOURS.MONTH_PART
               AND DATE_PART('YEAR', TO_TIMESTAMP(ABC.DATE)) = BUDGETHOURS.YEAR_PART
               AND ABC.OFFICE_ID = BUDGETHOURS.OFFICE
              LEFT JOIN (
                    SELECT DATE, OFFICE_ID,
                           COUNT(ID_NUMBER) AS NUMBERAGENTS
                      FROM DATA_ANALYTICS.WFM_WORKSPACE.TRESS_INCIDENTSOT
                     WHERE
                  POSITION IN ('REPRESENTANTE CS BILINGÜE BPO', 'AGENTE BILINGUE BPO', 'Representante de ventas BPO', 'Representante Wellness', 'Representante FNOL I', 'Care Navigator BPO', 'Tech Support Agent I', 'Agente Bilingue FNOL BPO', 'AGENTE BILINGUE BPO BackOffice', 'Agente Soporte de Llamadas BPO', 'Care Analyst', 'Contador Sr Accounting', 'SME MENTOR', 'CLAIMS PROCESSING I', 'Agente BPO BackOffice', 'Administrador de Redes sociale', 'Head of Accounting', 'CONTADOR SR', 'Representante CS Bilingüe BPO II', 'Agente Soporte de Llamadas BPO II', 'Agente SPL', 'Sales Agent', 'BPO Data Entry','Team Leader','Lead Generator','Status Bilingual Agent','Retentions Agent','RECLUTADOR','Bilingual Concierge','Contador Jr','Commission Agent')
                     GROUP BY DATE, OFFICE_ID
                   ) AS NUMBERAGENTSDB
                ON ABC.DATE = NUMBERAGENTSDB.DATE
               AND ABC.OFFICE_ID = NUMBERAGENTSDB.OFFICE_ID
              LEFT JOIN (
                    SELECT DATE_PART('YEAR', TO_TIMESTAMP(DATE)) || DATE_PART('MONTH', TO_TIMESTAMP(DATE)) AS YEAR_MONTH,
                           OFFICE_ID,
                           COUNT(DISTINCT DATE) AS WORKEDDAYS
                      FROM DATA_ANALYTICS.WFM_WORKSPACE.TRESS_INCIDENTSOT
                     GROUP BY DATE_PART('YEAR', TO_TIMESTAMP(DATE)) || DATE_PART('MONTH', TO_TIMESTAMP(DATE)),
                              OFFICE_ID
                   ) AS WORKEDDAYS
