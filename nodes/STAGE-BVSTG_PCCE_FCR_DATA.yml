        join:
          joinCondition: |-
            FROM (
                    SELECT V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.DateTime,
                           CASE WHEN V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.ANI='Restricted' THEN ''
                                ELSE V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.ANI
                                 END ANI,
                           V_DLBV_PCCE_AGENT_CURRENT.skilltargetid skilltargetid,
                           V_DLBV_PCCE_PERSON_CURRENT.loginname,
                           V_DLBV_PCCE_SKILL_GROUP_CURRENT.enterprisename,
                           MIN(CASE WHEN t3.NewCall IS NOT NULL THEN t3.NewCall ELSE '3022-12-31' END) newcall,
                           DATEDIFF(HOUR, V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.DateTime, MIN(CASE WHEN t3.NewCall IS NOT NULL THEN t3.NewCall ELSE '3022-12-31' END)) hoursdiff,
                           DATE_PART(WEEK, V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.Datetime) WEEK,
                           YEAR(V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.Datetime) YEAR
                      FROM {{ ref('STAGE','V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT') }} V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT
                     INNER JOIN {{ ref('STAGE','V_DLBV_PCCE_SKILL_GROUP_CURRENT') }} V_DLBV_PCCE_SKILL_GROUP_CURRENT
                        ON V_DLBV_PCCE_SKILL_GROUP_CURRENT.SkillTargetID = V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.SkillGroupSkillTargetID
                     INNER JOIN {{ ref('STAGE','V_DLBV_PCCE_AGENT_CURRENT') }} V_DLBV_PCCE_AGENT_CURRENT
                        ON V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.AgentPeripheralNumber = V_DLBV_PCCE_AGENT_CURRENT.PeripheralNumber
                     INNER JOIN {{ ref('STAGE','V_DLBV_PCCE_PERSON_CURRENT') }} V_DLBV_PCCE_PERSON_CURRENT
                        ON V_DLBV_PCCE_AGENT_CURRENT.PersonId = V_DLBV_PCCE_PERSON_CURRENT.PersonID
                      LEFT OUTER JOIN (
                            SELECT DateTime AS Newcall,
                                   ANI
                              FROM {{ ref('STAGE','V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT') }} t2
                             INNER JOIN {{ ref('STAGE','V_DLBV_PCCE_SKILL_GROUP_CURRENT') }} sg
                                ON sg.SkillTargetID = t2.SkillGroupSkillTargetID
                               AND sg.enterprisename IN ('OneSource_Customer_Service','TJ_CIGH_Payments')
                             ORDER BY t2.DateTime
                           ) t3
                        ON t3.ANI = V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.ANI
                       AND t3.newCall > V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.DateTime
                     WHERE V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.DateTime >= DATEADD(WEEK,-3,cast(GETDATE() AS date))
                       AND V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.DateTime <= DATEADD(WEEK,-0,cast(GETDATE() AS date))
                       AND ((LEN(V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.ANI)) > 7.0)
                       AND V_DLBV_PCCE_SKILL_GROUP_CURRENT.enterprisename IN ('OneSource_Customer_Service','TJ_CIGH_Payments')
                       AND talktime > 10
                     GROUP BY V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.DateTime,
                              V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.ANI,
                              V_DLBV_PCCE_AGENT_CURRENT.skilltargetid,
                              V_DLBV_PCCE_PERSON_CURRENT.loginname,
                              V_DLBV_PCCE_SKILL_GROUP_CURRENT.enterprisename,
                              DATE_PART(WEEK, V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.Datetime)
                   )v_dlbv_pcce_termination_call_detail_current
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."FCR_FILTERS" FCR_FILTERS_AREACODE
                ON LEFT(RIGHT(v_dlbv_pcce_termination_call_detail_current.ANI,10),3) = FCR_FILTERS_AREACODE.FILTERCODE
               AND FCR_FILTERS_AREACODE.FILRENAME='AreaCode'
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."FCR_FILTERS" FCR_FILTERS_ENTERPRISE
                ON v_dlbv_pcce_termination_call_detail_current.ENTERPRISENAME = FCR_FILTERS_ENTERPRISE.FILTERCODE
               AND FCR_FILTERS_ENTERPRISE.FILRENAME='Fcr Applicable'
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."FCR_FILTERS" FCR_FILTERS_INTERNALNUMBER
                ON RIGHT(v_dlbv_pcce_termination_call_detail_current.ANI,10) = FCR_FILTERS_INTERNALNUMBER.FILTERCODE
               AND FCR_FILTERS_INTERNALNUMBER.FILRENAME='InternalNumber'
             WHERE IFNULL(FCR_FILTERS_INTERNALNUMBER.FILTERVALUE,0) = 0
               AND IFNULL(FCR_FILTERS_AREACODE.FILTERVALUE,'') != 'Tool Free'
