                      FROM {{ ref('STAGE','V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT') }} V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT
                     INNER JOIN {{ ref('STAGE','V_DLBV_PCCE_SKILL_GROUP_CURRENT') }} V_DLBV_PCCE_SKILL_GROUP_CURRENT
                        ON V_DLBV_PCCE_SKILL_GROUP_CURRENT.SkillTargetID = V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.SkillGroupSkillTargetID
                     INNER JOIN {{ ref('STAGE','V_DLBV_PCCE_AGENT_CURRENT') }} V_DLBV_PCCE_AGENT_CURRENT
                        ON V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.AgentPeripheralNumber = V_DLBV_PCCE_AGENT_CURRENT.PeripheralNumber
                     INNER JOIN {{ ref('STAGE','V_DLBV_PCCE_PERSON_CURRENT') }} V_DLBV_PCCE_PERSON_CURRENT
                        ON V_DLBV_PCCE_AGENT_CURRENT.PersonId = V_DLBV_PCCE_PERSON_CURRENT.PersonID
                      LEFT OUTER JOIN (
