                              DATE_PART(WEEK, V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.Datetime)
                   )v_dlbv_pcce_termination_call_detail_current
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."FCR_FILTERS" FCR_FILTERS_AREACODE
                ON LEFT(RIGHT(v_dlbv_pcce_termination_call_detail_current.ANI,10),3) = FCR_FILTERS_AREACODE.FILTERCODE
               AND FCR_FILTERS_AREACODE.FILRENAME='AreaCode'
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."FCR_FILTERS" FCR_FILTERS_ENTERPRISE
                ON v_dlbv_pcce_termination_call_detail_current.ENTERPRISENAME = FCR_FILTERS_ENTERPRISE.FILTERCODE
               AND FCR_FILTERS_ENTERPRISE.FILRENAME='Fcr Applicable'
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."FCR_FILTERS" FCR_FILTERS_INTERNALNUMBER
                ON RIGHT(v_dlbv_pcce_termination_call_detail_current.ANI,10) = FCR_FILTERS_INTERNALNUMBER.FILTERCODE
