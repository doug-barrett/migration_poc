                                   ANI
                              FROM {{ ref('STAGE','V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT') }} t2
                             INNER JOIN {{ ref('STAGE','V_DLBV_PCCE_SKILL_GROUP_CURRENT') }} sg
                                ON sg.SkillTargetID = t2.SkillGroupSkillTargetID
                               AND sg.enterprisename IN ('OneSource_Customer_Service','TJ_CIGH_Payments')
                             ORDER BY t2.DateTime
                           ) t3
                        ON t3.ANI = V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.ANI
                       AND t3.newCall > V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.DateTime
                     WHERE V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.DateTime >= DATEADD(WEEK,-3,cast(GETDATE() AS date))
                       AND V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT.DateTime <= DATEADD(WEEK,-0,cast(GETDATE() AS date))
