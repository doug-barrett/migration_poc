    sourceMapping:
      - aliases:
          BVSTG_NSA_RWL_AU0_BSL: 0ba656cb-34d5-4986-b255-6055716b0770
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_AU2_PREM_FEAT
          - locationName: UNKNOWN
            nodeName: V_POSB_AP1_PREMIUM_EFFECTIVE
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_AU0_BSL
        join:
          joinCondition: |-
            FROM (
                    WITH INITIAL_PREMIUM AS (
                            SELECT BL.STARTDATE,
                                   BL.ESTIMATE_END_DATE,
                                   BL.TRANSACTIONID,
                                   BL.TERM_IN_MONTHS,
                                   PE.POLICYID,
                                   PE.PREMIUMAMOUNT AS INITIAL_PREMIUM,
                                   CASE WHEN PE.PREMIUMAMOUNT < 0   THEN 0
                                        WHEN BL.TERM_IN_MONTHS = 12 THEN PE.PREMIUMAMOUNT/11
                                        WHEN BL.TERM_IN_MONTHS = 6  THEN PE.PREMIUMAMOUNT/5
                                        ELSE PE.PREMIUMAMOUNT
                                         END AS INITIAL_PREMIUM_NORM
                              FROM {{ ref('UNKNOWN','V_POSB_AP1_PREMIUM_EFFECTIVE') }} PE
                             INNER JOIN {{ ref('STAGE','BVSTG_NSA_RWL_AU0_BSL') }} BL
                                ON PE.POLICYID = BL.POLICYID
                             WHERE PE.ISWRITTENPREMIUM = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY PE.POLICYID ORDER BY PE.PREMIUMAMOUNT DESC) = 1
                           ) ,
                           ADJUSTMENTS AS (
                            SELECT INITIAL.STARTDATE ,
                                   INITIAL.ESTIMATE_END_DATE ,
                                   INITIAL.TRANSACTIONID ,
                                   INITIAL.POLICYID ,
                                   INITIAL.TERM_IN_MONTHS ,
                                   INITIAL.INITIAL_PREMIUM_NORM ,
                                   DATEDIFF(DAY, INITIAL.STARTDATE, MAX(CASE WHEN PRE.PREMIUMAMOUNT IS NOT NULL THEN PRE.CREATED END)) AS DAYS_TO_LAST_ADJUSTMENT ,
                                   STDDEV(CASE WHEN PRE.PREMIUMAMOUNT IS NOT NULL AND PRE.CREATED >= INITIAL.STARTDATE AND PRE.CREATED < DATEADD(DAY, -30, INITIAL.ESTIMATE_END_DATE) THEN PRE.PREMIUMAMOUNT END) AS STDDEV_ADJUSTMENT_AMOUNT_30D_BEFORE_END ,
                                   SUM(CASE WHEN PRE.PREMIUMAMOUNT IS NOT NULL AND PRE.CREATED >= INITIAL.STARTDATE AND PRE.CREATED < DATEADD(DAY, -30, INITIAL.ESTIMATE_END_DATE) THEN PRE.PREMIUMAMOUNT ELSE 0 END) AS TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END ,
                                   SUM(CASE WHEN PRE.PREMIUMAMOUNT IS NOT NULL AND PRE.CREATED >= INITIAL.STARTDATE AND PRE.CREATED < DATEADD(DAY, -30, INITIAL.ESTIMATE_END_DATE) THEN 1 ELSE 0 END) AS COUNT_TOTAL_ADJUSTMENTS_30D_BEFORE_END
                              FROM INITIAL_PREMIUM INITIAL
                              LEFT JOIN {{ ref('UNKNOWN','V_POSB_AP1_PREMIUM_EFFECTIVE') }} PRE
                                ON INITIAL.POLICYID = PRE.POLICYID
                               AND PRE.ISWRITTENPREMIUM = 0
                               AND INITIAL.ESTIMATE_END_DATE >= PRE.CREATED
                               AND PRE.CREATED < DATEADD(DAY, -30, INITIAL.ESTIMATE_END_DATE)
                             GROUP BY INITIAL.STARTDATE,
                                      INITIAL.ESTIMATE_END_DATE,
                                      INITIAL.TRANSACTIONID,
                                      INITIAL.POLICYID,
                                      INITIAL.INITIAL_PREMIUM_NORM,
                                      INITIAL.TERM_IN_MONTHS
                           ) ,
                           NORMALIZATION_AND_FLAGS AS (
                            SELECT TRANSACTIONID ,
                                   POLICYID ,
                                   INITIAL_PREMIUM_NORM ,
                                   DAYS_TO_LAST_ADJUSTMENT ,
                                   STDDEV_ADJUSTMENT_AMOUNT_30D_BEFORE_END ,
                                   TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END ,
                                   COUNT_TOTAL_ADJUSTMENTS_30D_BEFORE_END ,
                                   CASE WHEN INITIAL_PREMIUM_NORM = 0 THEN NULL
                                        ELSE TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END/INITIAL_PREMIUM_NORM
                                         END AS PREMIUM_DRIFT_RATIO ,
                                   CASE WHEN COUNT_TOTAL_ADJUSTMENTS_30D_BEFORE_END = 0 THEN NULL
                                        ELSE TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END / COUNT_TOTAL_ADJUSTMENTS_30D_BEFORE_END
                                         END AS RATIO_ADJ_AMOUNT ,
                                   CASE WHEN TERM_IN_MONTHS = 12 THEN TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END/11
                                        WHEN TERM_IN_MONTHS = 6  THEN TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END/5
                                        ELSE TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END/5
                                         END AS TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END_NORM
                              FROM ADJUSTMENTS
                           ) SELECT *
                      FROM NORMALIZATION_AND_FLAGS
                   ) bvstg_nsa_rwl_au2_prem_feat
        name: BVSTG_NSA_RWL_AU2_PREM_FEAT
        noLinkRefs: []
