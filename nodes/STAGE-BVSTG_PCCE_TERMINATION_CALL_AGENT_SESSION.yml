                      FROM {{ ref('EDW','DS_MKT_CAMPAIGN') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY INBOUNDNUMBER ORDER BY STATUS DESC)=1
                   ) DS_MKT_CAMPAIGN
                ON CASE WHEN LEN(v_preb_pcce_termination_call_detail_Agent_Session.dnis) BETWEEN 10 AND 12 THEN v_preb_pcce_termination_call_detail_Agent_Session.dnis
                        ELSE NULL
                         END = DS_MKT_CAMPAIGN.INBOUNDNUMBER
             WHERE 1=1
               AND ('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 0)
