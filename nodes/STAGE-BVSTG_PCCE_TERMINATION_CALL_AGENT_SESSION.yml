                           *
                      FROM {{ ref('STAGE','V_DLBV_CPS_CONFIECISCOICRCALLS_CURRENT') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY SPLIT_PART(CALLID,'-',2)||'-'||SPLIT_PART(CALLID,'-',1) ORDER BY CASE WHEN ICRRESPONSE !='NOMATCH' THEN 0 ELSE 1 END,INPUTDATE)=1
