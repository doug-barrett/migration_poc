                ON v_preb_pcce_termination_call_detail_Agent_Session.SessionAgentID =v_preb_termination_call_detail_ring_group.SessionAgentID
              LEFT JOIN {{ ref('STAGE','V_PREB_PCCE_TERMINATION_CALL_DETAIL_AGENT_SESSION') }} v_preb_pcce_termination_call_detail_Agent_Session_sub
                ON v_preb_pcce_termination_call_detail_Agent_Session_sub.SessionID = v_preb_pcce_termination_call_detail_Agent_Session.SessionID
               AND v_preb_pcce_termination_call_detail_Agent_Session.RANK_AGENT_SESSION = v_preb_pcce_termination_call_detail_Agent_Session_sub.RANK_AGENT_SESSION - 1
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_PCCE_TERMINATION_CALL_DETAIL_AGENT_TRANSFER_OFFERED') }} v_preb_pcce_termination_call_detail_Agent_transfer_offered
                ON v_preb_pcce_termination_call_detail_Agent_Session.SessionAgentID = v_preb_pcce_termination_call_detail_Agent_transfer_offered.SessionAgentID
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_PCCE_TERMINATION_CALL_DETAIL_AGENT_TRANSFER_RECEIVED') }} v_preb_pcce_termination_call_detail_Agent_transfer_received
                ON v_preb_pcce_termination_call_detail_Agent_Session.SessionAgentID = v_preb_pcce_termination_call_detail_Agent_transfer_received.SessionAgentID
              LEFT JOIN (
