        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU1_POLICYSUMMARY') }} bvstg_au1_policysummary
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','BVSTG_AU1_POLICYSUMMARY') }}
                     WHERE Ranking> 1
                       AND TransactionType IN('Renewal','Renewal Payment')
                       AND bvstg_au1_policysummary.isvoid = 0
                       AND bvstg_au1_policysummary.ISCORPORATEVOID = 0
                       AND bvstg_au1_policysummary.ISROWDELETED = 0 QUALIFY ROW_NUMBER() OVER (PARTITION BY NBTransactionID ORDER BY CASE WHEN BIA_Status = 'Active' THEN 1 ELSE 2 END, Ranking) = 1
                   )bvstg_au1_policysummary_Rwl
                ON (bvstg_au1_policysummary.TransactionID = bvstg_au1_policysummary_Rwl.NBTransactionID)
              LEFT JOIN {{ ref('STAGE','V_PREB_POLICYSUMMARY_CDT_SUMMARY') }} v_preb_policysummary_cdt_summary
                ON (bvstg_au1_policysummary.TransactionID= v_preb_policysummary_cdt_summary.NBTransactionID)
              LEFT JOIN {{ ref('STAGE','V_PREB_POLICYNB_REVENUESUMMARY_V2') }} v_preb_policynb_revenuesummary_v2
                ON (v_preb_policynb_revenuesummary_v2.NBTransactionID = bvstg_au1_policysummary.TransactionID)
              LEFT JOIN (
                    SELECT DISTINCT p.PolicyID
                      FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} p
                     INNER JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} o
                        ON o.officecode = p.biaprimaryagentoffice
                     WHERE AgencyName = 'Acceptance Insurance'
                       AND p.islegacytransaction = 'Migrated'
                   ) bvstg_au1_policysummary_acceptance
                ON bvstg_au1_policysummary_acceptance.PolicyID = bvstg_au1_policysummary.policyid
             WHERE bvstg_au1_policysummary.TransactionType IN ('New Business','Additional Products')
               AND bvstg_au1_policysummary.Ranking = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_au1_policysummary.transactionid ORDER BY bvstg_au1_policysummary.created, bvstg_au1_policysummary.isvoid, bvstg_au1_policysummary.policynumber) = 1
