        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU5_CSPR
          - locationName: STAGE
            nodeName: BVSTG_AU4_CSPR
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: STAGE
            nodeName: V_DLBV_BOE_SALESCALENDAR_CURRENT
        join:
          joinCondition: |-
            FROM (
                    SELECT ENDDATE,
                           OFFICECODE,
                           'fte' AS metric,
                           sum(FTE) AS metricvalue
                      FROM (
                            SELECT ENDDATE,
                                   OFFICECODE,
                                   WRKHRS,
                                   WORKING_DAYS,
                                   WORKING_HOUR_DAY,
                                   round(WRKHRS/(WORKING_DAYS*Working_hour_day),1) AS FTE
                              FROM (
                                    SELECT ultipro_ram.*,
                                           Working_days,
                                           '8' AS Working_hour_day
                                      FROM (
                                            SELECT ENDDATE,
                                                   OFFICECODE,
                                                   sum(WRKHRS) AS WRKHRS
                                              FROM (
                                                    SELECT ENDDATE,
                                                           EMPLOYEENUMBER,
                                                           workhours_edw.OFFICECODE,
                                                           WORKED_DAYS,
                                                           round((WORKED_DAYS/Total_Worked_days * metricvalue),1) AS WRKHRS
                                                      FROM (
                                                            SELECT *
                                                              FROM {{ ref('STAGE','BVSTG_AU5_CSPR') }}
                                                             WHERE metric = 'fte'
                                                           ) AS workhours_ultiPro
                                                      LEFT JOIN (
                                                            SELECT *
                                                              FROM {{ ref('STAGE','BVSTG_AU4_CSPR') }}
                                                           ) AS workhours_edw
                                                        ON workhours_ultiPro.EMPLOYEENUMBER = workhours_edw.EMPLOYEE
                                                       AND workhours_ultiPro.ENDDATE = workhours_edw.Date
                                                      LEFT JOIN (
                                                            SELECT DATE, EMPLOYEE,
                                                                   sum(WORKED_DAYS) AS Total_Worked_days
                                                              FROM {{ ref('STAGE','BVSTG_AU4_CSPR') }}
                                                             GROUP BY 1,
                                                                      2
                                                           ) AS workhours_edw_1
                                                        ON workhours_ultiPro.EMPLOYEENUMBER = workhours_edw_1.EMPLOYEE
                                                       AND workhours_ultiPro.ENDDATE = workhours_edw_1.DATE
                                                      LEFT JOIN (
                                                            SELECT DISTINCT officecode,
                                                                   CASE WHEN lower(agencyname) like '%acceptance%' THEN 'Acceptance'
                                                                        ELSE channel
                                                                         END AS channel_1,
                                                                   statecode,
                                                                   SALESTYPE,
                                                                   agencyname
                                                              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                                                           ) AS ds_retail_office
                                                        ON workhours_edw.OFFICECODE = ds_retail_office.officecode
                                                     WHERE CHANNEL_1 = 'NSA'
                                                       AND SALESTYPE = 'Brick-e-Sales'
                                                       AND lower(AGENCYNAME) not like '%velox%'
                                                       AND lower(STATECODE)<>'nts'
                                                   )
                                             GROUP BY ENDDATE,
                                                      OFFICECODE
                                           ) AS ultipro_ram
                                      LEFT JOIN (
                                            SELECT DISTINCT date_trunc('month',SALESDATE) asofmonth,
                                                   sum(SALESDAYWEIGHT) Working_days
                                              FROM {{ ref('STAGE','V_DLBV_BOE_SALESCALENDAR_CURRENT') }}
                                             WHERE year(SALESDATE)>=2021
                                               AND SALESDATE <= dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                                             GROUP BY 1
                                           ) AS calendar
                                        ON ultipro_ram.ENDDATE = calendar.asofmonth
                                   )
                           )
                     GROUP BY 1,
                              2
                     UNION SELECT ENDDATE,
                           OFFICECODE,
                           'compensation' AS metric,
                           sum(GROSSWAGESCURRENT) AS metricvalue
                      FROM (
                            SELECT ENDDATE,
                                   EMPLOYEENUMBER,
                                   bvstg_au4_cspr.OFFICECODE,
                                   WORKED_DAYS,
                                   round((WORKED_DAYS/Total_Worked_days * metricvalue),1) AS GROSSWAGESCURRENT,
                                   AGENCYNAME,
                                   STATECODE
                              FROM (
                                    SELECT *
                                      FROM {{ ref('STAGE','BVSTG_AU5_CSPR') }}
                                     WHERE metric = 'compensation'
                                   ) bvstg_au5_cspr
                              LEFT JOIN (
                                    SELECT *
                                      FROM {{ ref('STAGE','BVSTG_AU4_CSPR') }}
                                   ) bvstg_au4_cspr
                                ON bvstg_au5_cspr.EMPLOYEENUMBER = bvstg_au4_cspr.EMPLOYEE
                               AND bvstg_au5_cspr.ENDDATE = bvstg_au4_cspr.DATE
                              LEFT JOIN (
                                    SELECT DATE, EMPLOYEE,
                                           sum(WORKED_DAYS) AS Total_Worked_days
                                      FROM {{ ref('STAGE','BVSTG_AU4_CSPR') }}
                                     GROUP BY 1,
                                              2
                                   ) bvstg_au4_cspr_1
                                ON bvstg_au5_cspr.EMPLOYEENUMBER = bvstg_au4_cspr_1.EMPLOYEE
                               AND bvstg_au5_cspr.ENDDATE = bvstg_au4_cspr_1.DATE
                              LEFT JOIN (
                                    SELECT DISTINCT officecode,
                                           CASE WHEN lower(agencyname) like '%acceptance%' THEN 'Acceptance'
                                                ELSE channel
                                                 END AS channel_1,
                                           statecode,
                                           SALESTYPE,
                                           agencyname
                                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                                   ) ds_retail_office
                                ON bvstg_au4_cspr.OFFICECODE = ds_retail_office.OFFICECODE
                             WHERE CHANNEL_1 = 'NSA'
                               AND SALESTYPE = 'Brick-e-Sales'
                               AND lower(AGENCYNAME) not like '%velox%'
                               AND lower(STATECODE) <> 'nts'
                           )
                     GROUP BY ENDDATE,
                              OFFICECODE
                   ) AS BVSTG_AU5_CSPR
        name: BVSTG_AU6_CSPR
        noLinkRefs: []
