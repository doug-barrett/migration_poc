l.PolicyNumber,10)) OR (ds_ams_transactiondetail.Company like '%Traders%' AND left(v_posb_renewals_nbpolicy.PolicyNumber,10) = left(ds_ams_transactiondetail.PolicyNumber,10)) OR (ds_ams_transactiondetail.Company like '%Echelon%' AND left(v_posb_renewals_nbpolicy.PolicyNumber,11) = left(ds_ams_transactiondetail.PolicyNumber,11))))
