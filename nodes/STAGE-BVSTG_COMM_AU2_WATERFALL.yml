    sourceMapping:
      - aliases:
          BVSTG_COMM_AU1_WATERFALL: aac1201f-3954-4713-ba00-c24e3c711c5d
          BVSTG_COMM_CUSTOMER_MAPPING: 2de45384-fdd2-4e96-bad6-b000b390eda6
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU1_WATERFALL
          - locationName: STAGE
            nodeName: BVSTG_COMM_CUSTOMER_MAPPING
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT coalesce(a.CURRENT_MONTH_1,Dateadd('year',1,c.Prior_MONTH),Dateadd('year',1,b.Prior_MONTH_1)) CURRENT_MONTH_1,
                   coalesce(a.TERM_LATEST_1,c.Term_old,b.Term_old) TERM_LATEST_1,
                   coalesce(a.INITIAL_CARRIER,c.INITIAL_CARRIER,b.INITIAL_CARRIER) INITIAL_CARRIER,
                   coalesce(a.AGENCYSTATE,c.AGENCYSTATE,b.AGENCYSTATE) AGENCYSTATE,
                   coalesce(a.CUSTOMERSTATE,c.CUSTOMERSTATE,b.CUSTOMERSTATE) CUSTOMERSTATE,
                   coalesce(a.AGENCY,c.AGENCY,b.AGENCY) AGENCY,
                   coalesce(a.POLICYSOURCE,c.POLICYSOURCE,b.POLICYSOURCE) POLICYSOURCE,
                   coalesce(a.ISLEGACYCUSTOMER,c.ISLEGACYCUSTOMER,b.ISLEGACYCUSTOMER) ISLEGACYCUSTOMER,
                   coalesce(a.LEADSOURCE,c.LEADSOURCE,b.LEADSOURCE) LEADSOURCE,
                   coalesce(a.LINEOFBUSINESS,c.LINEOFBUSINESS,b.LINEOFBUSINESS) LINEOFBUSINESS,
                   coalesce(a.OFFICENAME,c.OFFICENAME,b.OFFICENAME) OFFICENAME,
                   coalesce(a.Premium_finance_flag,c.Premium_finance_flag,b.Premium_finance_flag) Premium_finance_flag ,
                   CIF_EOM,
                   Bucket_out,
                   BOM_CIF
              FROM(
                    SELECT DISTINCT CURRENT_MONTH_1,
                           TERM_LATEST_1,
                           INITIAL_CARRIER,
                           AGENCYSTATE,
                           CUSTOMERSTATE,
                           AGENCY,
                           POLICYSOURCE,
                           ISLEGACYCUSTOMER,
                           LEADSOURCE,
                           LINEOFBUSINESS,
                           OFFICENAME,
                           Premium_finance_flag,
                           count(DISTINCT CASE WHEN CUSTOMER_MAPPING_FINAL = 'Cancelled' THEN final_CUSTOMER_ID END) Cancelled,
                           count(DISTINCT CASE WHEN CUSTOMER_MAPPING_FINAL = 'Reinstated' THEN final_CUSTOMER_ID END) Reinstated,
                           count(DISTINCT CASE WHEN CUSTOMER_MAPPING_FINAL = 'Expired' THEN final_CUSTOMER_ID END) Expired,
                           count(DISTINCT CASE WHEN CUSTOMER_MAPPING_FINAL = 'New_Business_Current_Month' THEN final_CUSTOMER_ID END) New_Business_Current_Month,
                           count(DISTINCT CASE WHEN CUSTOMER_MAPPING_FINAL = 'New_Business_Prior_Month' THEN final_CUSTOMER_ID END) New_Business_Prior_Month,
                           count(DISTINCT CASE WHEN CUSTOMER_MAPPING_FINAL = 'Bucket_in' THEN final_CUSTOMER_ID END) Bucket_in,
                           sum(CIF_EOM) CIF_EOM
                      FROM {{ ref('STAGE','BVSTG_COMM_AU1_WATERFALL') }} BVSTG_COMM_AU1_WATERFALL
                     GROUP BY CURRENT_MONTH_1,
                              TERM_LATEST_1,
                              INITIAL_CARRIER,
                              AGENCYSTATE,
                              CUSTOMERSTATE,
                              AGENCY,
                              POLICYSOURCE,
                              ISLEGACYCUSTOMER,
                              LEADSOURCE,
                              LINEOFBUSINESS,
                              OFFICENAME,
                              Premium_finance_flag
                   ) a
              FULL OUTER JOIN (
                    SELECT DISTINCT Prior_MONTH_1,
                           TERM_OLD,
                           INITIAL_CARRIER,
                           AGENCYSTATE,
                           CUSTOMERSTATE,
                           AGENCY,
                           POLICYSOURCE,
                           ISLEGACYCUSTOMER,
                           LEADSOURCE,
                           LINEOFBUSINESS,
                           OFFICENAME,
                           Premium_finance_flag,
                           count(DISTINCT FINAL_CUSTOMER_ID) Bucket_out
                      FROM {{ ref('STAGE','BVSTG_COMM_AU1_WATERFALL') }} BVSTG_COMM_AU1_WATERFALL
                     WHERE term_old<>'60+'
                       AND term_latest IS NOT NULL
                       AND term_old IS NOT NULL
                     GROUP BY Prior_MONTH_1,
                              TERM_OLD,
                              INITIAL_CARRIER,
                              AGENCYSTATE,
                              CUSTOMERSTATE,
                              AGENCY,
                              POLICYSOURCE,
                              ISLEGACYCUSTOMER,
                              LEADSOURCE,
                              LINEOFBUSINESS,
                              OFFICENAME,
                              Premium_finance_flag
                   ) b
                ON a.CURRENT_MONTH_1=Dateadd('year',1,b.Prior_MONTH_1)
               AND a.TERM_LATEST_1=b.TERM_OLD
               AND ifnull(a.INITIAL_CARRIER,'-') = ifnull(b.INITIAL_CARRIER,'-')
               AND ifnull(a.AGENCYSTATE,'-') = ifnull(b.AGENCYSTATE,'-')
               AND ifnull(a.CUSTOMERSTATE,'-') = ifnull(b.CUSTOMERSTATE,'-')
               AND ifnull(a.AGENCY,'-') = ifnull(b.AGENCY,'-')
               AND ifnull(a.POLICYSOURCE,'-') = ifnull(b.POLICYSOURCE,'-')
               AND ifnull(a.ISLEGACYCUSTOMER,'-') = ifnull(b.ISLEGACYCUSTOMER,'-')
               AND ifnull(a.LEADSOURCE,'-') = ifnull(b.LEADSOURCE ,'-')
               AND ifnull(a.LINEOFBUSINESS,'-') = ifnull(b.LINEOFBUSINESS,'-')
               AND ifnull(a.OFFICENAME,'-') = ifnull(b.OFFICENAME,'-')
               AND ifnull(a.Premium_finance_flag,0) = ifnull(b.Premium_finance_flag,0)
              FULL OUTER JOIN (
                    SELECT Prior_MONTH,
                           TERM_OLD,
                           INITIAL_CARRIER,
                           AGENCYSTATE,
                           CUSTOMERSTATE,
                           AGENCY,
                           POLICYSOURCE,
                           ISLEGACYCUSTOMER,
                           LEADSOURCE,
                           LINEOFBUSINESS,
                           OFFICENAME,
                           Premium_finance_flag,
                           count(DISTINCT t1_CUSTOMER_ID) BOM_CIF
                      FROM {{ ref('STAGE','BVSTG_COMM_CUSTOMER_MAPPING') }} BVSTG_COMM_CUSTOMER_MAPPING
                     GROUP BY Prior_MONTH,
                              TERM_OLD,
                              INITIAL_CARRIER,
                              AGENCYSTATE,
                              CUSTOMERSTATE,
                              AGENCY,
                              POLICYSOURCE,
                              ISLEGACYCUSTOMER,
                              LEADSOURCE,
                              LINEOFBUSINESS,
                              OFFICENAME,
                              Premium_finance_flag
                   ) c
                ON a.CURRENT_MONTH_1= Dateadd('year',
                   1,
                   c.Prior_MON
        name: BVSTG_COMM_AU2_WATERFALL
        noLinkRefs: []
