        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_PMKT_AU3_LOGGINGUSERBEHVAIORID_STEP5_2
        join:
          joinCondition: |-
            FROM (
                    SELECT STEP5_2.LOGGINGUSERBEHAVIORID,
                           NULL AS SESSIONAGENTID,
                           COALESCE(CALLS.sessionid, STEP5_2.sessionid_final_t) AS SESSIONID_FINAL,
                           COALESCE(CALLS.phonenumber, STEP5_2.phonenumber_final_t) AS PHONENUMBER_FINAL,
                           CASE WHEN STEP5_2.customeridparameters_final_t IS NULL AND STEP5_2.customeridparameters_2_final_t IS NOT NULL THEN STEP5_2.customeridparameters_2_final_t
                                WHEN STEP5_2.customeridparameters_2_final_t IS NULL AND STEP5_2.customeridparameters_final_t IS NOT NULL THEN STEP5_2.customeridparameters_final_t
                                WHEN STEP5_2.customeridparameters_2_final_t IS NULL AND STEP5_2.customeridparameters_final_t IS NULL     THEN CALLS.final_customer_id_to_keep
                                ELSE 'null'
                                 END AS CUSTOMERID_FINAL,
                           STEP5_2.leadid_final_t AS LEADID_FINAL,
                           STEP5_2.ACTIVITY_TIME AS STARTDATETIME,
                           NULL AS ENDDATETIME,
                           STEP5_2.UIELEMENTNAME,
                           STEP5_2.UIELEMENTTYPE,
                           STEP5_2.UICONTAINERCONTROL,
                           STEP5_2.UISCREEN,
                           STEP5_2.UIEVENTTYPE,
                           STEP5_2.cisco_login_name AS AGENT,
                           'app one' AS source_data,
                           6 AS aa_
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_LOGGINGUSERBEHVAIORID_STEP5_2 AS STEP5_2
                     INNER JOIN (
                            SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ALL_CALLS_WITH_NUMBER
                             WHERE final_customer_id_to_keep IS NOT NULL
                               AND phonenumber IS NOT NULL
                           ) AS CALLS
                        ON STEP5_2.customeridparameters_final_t = CALLS.final_customer_id_to_keep
                       AND STEP5_2.cisco_login_name = CALLS.agent
                       AND STEP5_2.activity_time BETWEEN CALLS.startdatetime AND IFNULL(CALLS.next_starttime, CALLS.enddatetime)
                 UNION ALL SELECT STEP5_2.LOGGINGUSERBEHAVIORID,
                           NULL AS SESSIONAGENTID,
                           COALESCE(CALLS.sessionid, STEP5_2.sessionid_final_t) AS SESSIONID_FINAL,
                           COALESCE(CALLS.phonenumber, STEP5_2.phonenumber_final_t) AS PHONENUMBER_FINAL,
                           CASE WHEN STEP5_2.customeridparameters_final_t IS NULL AND STEP5_2.customeridparameters_2_final_t IS NOT NULL THEN STEP5_2.customeridparameters_2_final_t
                                WHEN STEP5_2.customeridparameters_2_final_t IS NULL AND STEP5_2.customeridparameters_final_t IS NOT NULL THEN STEP5_2.customeridparameters_final_t
                                WHEN STEP5_2.customeridparameters_2_final_t IS NULL AND STEP5_2.customeridparameters_final_t IS NULL     THEN CALLS.final_customer_id_to_keep
                                ELSE 'null'
                                 END AS CUSTOMERID_FINAL,
                           STEP5_2.leadid_final_t AS LEADID_FINAL,
                           STEP5_2.ACTIVITY_TIME AS STARTDATETIME,
                           NULL AS ENDDATETIME,
                           STEP5_2.UIELEMENTNAME,
                           STEP5_2.UIELEMENTTYPE,
                           STEP5_2.UICONTAINERCONTROL,
                           STEP5_2.UISCREEN,
                           STEP5_2.UIEVENTTYPE,
                           STEP5_2.cisco_login_name AS AGENT,
                           'app one' AS source_data,
                           6 AS aa_
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_LOGGINGUSERBEHVAIORID_STEP5_2 AS STEP5_2
                     INNER JOIN (
                            SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ALL_CALLS_WITH_NUMBER
                             WHERE final_customer_id_to_keep IS NOT NULL
                               AND phonenumber IS NOT NULL
                           ) AS CALLS
                        ON STEP5_2.customeridparameters_2_final_t = CALLS.final_customer_id_to_keep
                       AND STEP5_2.cisco_login_name = CALLS.agent
                       AND STEP5_2.activity_time BETWEEN CALLS.startdatetime AND IFNULL(CALLS.next_starttime, CALLS.enddatetime)
                     WHERE (STEP5_2.customeridparameters_final_t != CALLS.final_customer_id_to_keep OR STEP5_2.customeridparameters_final_t IS NULL)
                   ) BVSTG_PMKT_AU3_LOGGINGUSERBEHVAIORID_STEP5_2
