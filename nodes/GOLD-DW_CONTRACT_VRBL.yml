          LEFT JOIN {{ ref(''BRONZE'', ''OR_DPOLY'') }} or_dpoly ON dw_contract.CONTRACT_ID = or_dpoly.PC1_POL_NUM /* Master Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''DW_CONTRACT_VRBL_RAW'') }} dw_contract_vrbl_raw ON /* TODO join key (Joiner not resolved) */ 1=1

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_CLOSE_TYPE'') }} ref360_close_type ON ref360_close_type.CLOSE_TYPE_CODE = or_product_convert.PCL_VOID_CAUSE

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_CONVERT'') }} ref360_convert ON ref360_convert.SOURCE_SYSTEM_CODE = or_product_convert.PC1_POL_STATUS_ACCT

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT'') }} dw_product ON dw_product.PRODUCT_CODE = or_product_convert.PRODUCT_CODE AND dw_product.CLASS_OF_BUSN_CODE = or_product_convert.CLASS_OF_BUSN_CODE AND dw_product.PREMIUM_TYPE_CODE = or_product_convert.PREMIUM_TYPE_CODE'
