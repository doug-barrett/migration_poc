            transform: |-
              CASE WHEN ISNULL(SUM(PAYCOMPONENTAMOUNT),0) = 0             THEN 'UNKNOWN'
                          WHEN SUM(PAYCOMPONENTAMOUNT) < 50000                   THEN 'LESS THAN 50K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 50000 AND 60000   THEN '50 - 60K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 60000 AND 70000   THEN '60 - 70K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 70000 AND 80000   THEN '70 - 80K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 80000 AND 90000   THEN '80 - 90K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 90000 AND 100000  THEN '90 - 100K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 100000 AND 110000 THEN '100 - 110K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 110000 AND 120000 THEN '110 - 120K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 120000 AND 130000 THEN '120 - 130K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 130000 AND 140000 THEN '130 - 140K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 140000 AND 150000 THEN '140 - 150K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 150000 AND 160000 THEN '150 - 160K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 160000 AND 170000 THEN '160 - 170K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 170000 AND 180000 THEN '170 - 180K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 180000 AND 190000 THEN '180 - 190K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 190000 AND 200000 THEN '190 - 200K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 200000 AND 210000 THEN '200 - 210K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 210000 AND 220000 THEN '210 - 220K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 220000 AND 230000 THEN '220 - 230K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 230000 AND 240000 THEN '230 - 240K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 240000 AND 250000 THEN '240 - 250K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 250000 AND 260000 THEN '250 - 260K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 260000 AND 270000 THEN '260 - 270K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 270000 AND 280000 THEN '270 - 280K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 280000 AND 290000 THEN '280 - 290K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 290000 AND 300000 THEN '290 - 300K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 300000 AND 310000 THEN '300 - 310K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 310000 AND 320000 THEN '310 - 320K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 320000 AND 330000 THEN '320 - 330K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 330000 AND 340000 THEN '330 - 340K'
                          WHEN SUM(PAYCOMPONENTAMOUNT) BETWEEN 340000 AND 350000 THEN '340 - 350K'
                          ELSE 'MORE THAN 350K'
                           END
