    sourceMapping:
    - aliases:
        SRC_CUSMASFL: 1a684003-b407-5735-b911-bb4cc7ee7035
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: SRC_CUSMASFL
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'SRC_CUSMASFL') }} "SRC_CUSMASFL"
           Where Aud_Time <= (Select MAX(Batch_End)   FROM "DOUG_POC"."DP001"."CDC_BATCH")
          AND    Aud_Time >   (Select MAX(Batch_Start)  FROM "DOUG_POC"."DP001"."CDC_BATCH")
          AND   (Aud_Code <> 'F' or (Aud_Code is null and Aud_Type = 'RR')) QUALIFY RANK() 
          OVER (PARTITION BY  CMCMP, CMCUS0 
          ORDER BY AUD_TIME DESC, AUD_SEQNO DESC, CASE  
          WHEN Aud_Type in ('PT','PX','FI')	THEN 1 
          WHEN Aud_Type in ('UB','FB','FP','BR')	THEN 2 
          WHEN Aud_Type in ('UP','UR')	THEN 3 
          WHEN Aud_Type in ('DL','FD')	THEN 4 
          WHEN Aud_Type in ('RR')		THEN 5 
           ELSE 0 END DESC) = 1
      name: CDC_CUSMASFL
      noLinkRefs: []
