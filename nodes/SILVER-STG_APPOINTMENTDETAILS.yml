    sourceMapping:
    - aliases:
        SRC_APPOINTMENTDETAILS: b240bf27-4dd3-5325-93de-d18d1ca1104c
      customSQL:
        customSQL: "select appointments.invoice_id as Job_Id, coalesce(appointments.location_id,-11)\
          \ as location_id, IFF(appointments.start_time>0 and appointments.end_time>0,\
          \ TIMESTAMPDIFF(MINUTE,appointments.start_time,appointments.end_time),null)\
          \ as Scheduled_Duration,\n appointments.status,  IFF(appointments.started_time>0\
          \ and appointments.ended_time>0, TIMESTAMPDIFF(MINUTE,appointments.started_time,appointments.ended_time),null)\
          \ as Appointment_Duration,\n IFF((appointments.ended_time is null or appointments.ended_time\
          \ =0)  \n and (appointments.started_time is null or appointments.started_time=0)\n\
          \ and (appointments.end_time is null or appointments.end_time=0) \n and\
          \ (appointments.start_time is null or appointments.start_time=0)\n     and\
          \ invoices.date is not null and invoices.date<>0 and status = 'CLOSED',invoices.date,\
          \  \n   CONVERT_TZ(coalesce(appointments.ended_time,appointments.started_time,appointments.end_time,appointments.start_time,\
          \ appointments.created ),'UTC','US/Central')) as Appointment_Date, \ncase\
          \ when appointments.ended_time is not null and appointments.ended_time<>0\
          \ then 'Ended'\n     when appointments.started_time is not null and appointments.started_time<>0\
          \  then 'Started'\n     when (appointments.end_time is not null and appointments.end_time<>0\
          \  and appointments.end_time >= CURDATE()) then 'Scheduled'\n     when (appointments.end_time\
          \ is not null and appointments.end_time<>0  and appointments.end_time <\
          \ CURDATE()) then 'Scheduled Expired'\n     when (appointments.start_time\
          \ is not null and appointments.start_time<>0  and appointments.start_time\
          \ >= CURDATE()) then 'Scheduled'\n     when (appointments.start_time is\
          \ not null and appointments.start_time<>0  and appointments.start_time <\
          \ CURDATE()) then 'Scheduled Expired'\n     when appointments.status = 'CLOSED'\
          \ and invoices.date is not null  and invoices.date<>0 then 'Invoiced Not\
          \ Scheduled'\n    # when appointments.updated is not null then 'Updated'\n\
          \     else 'Created'\n     end\n    as  Appointment_Date_Used,\nappointments.type,\n\
          coalesce(IFF(appointments.user_id='',null,appointments.user_id),'-11') as\
          \ Tech_Username, appointments.reschedule_count, appointments.ignore_capacity,\
          \ appointments.hold_reason,invoices.date as \"Invoice_Date\",\ncoalesce(invoices.account_company_id,-11)\
          \ as \"Company_Id\",\n-11 As'Sales_Item_Id',\nappointments.requested_window_start\n\
          from appointments \nleft join invoices   on appointments.invoice_id = invoices.id\n\
          ;COMMIT ;"
