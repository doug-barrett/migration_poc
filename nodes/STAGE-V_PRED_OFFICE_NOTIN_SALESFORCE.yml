          BVSTG_RETAIL_OFFICE: 3a428d83-e7ed-44e5-8bec-01e42694b302
          V_PRE_AP1_OFFICE_MROC_CURRENT: 9fca614c-54f1-4c5d-ad2e-ea96636d0128
          REF_AP1_CODEVALUE: 3e151b27-0aac-487a-9684-1e06159f8b6e
          V_S_AP1_ORGANIZATION_MROC_CURRENT: e137f31b-8242-4223-8060-a0925a678538
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PRED_OFFICE_NOTIN_SALESFORCE') }} AS SELECT ifnull(rl.OFFICECODE,rl.POLICYDEPARTMENT) AS OfficeCode ,
                   ifnull(rl.STATE,'Unknown') AS State ,
                   'Unknown' AS OrganizationCode ,
                   'Unknown' AS Organizationname ,
                   'Unknown' AS BMO ,
                   'Unknown' AS territory ,
                   'Unknown' AS area ,
                   ifnull(rl.REGIONALSTORELEADER,'Unknown') AS region ,
                   ifnull(rl.DISTRICTLEADER,'Unknown') AS district
              FROM (
                    SELECT *
                      FROM (
                            SELECT *,
                                   rank() OVER (PARTITION BY POLICYDEPARTMENT ORDER BY DSS_VERSION DESC) AS rankver
                              FROM {{ ref('STAGE','V_S_BOE_RETAIL_LOCATION_MROC_CURRENT') }}
                           )
                     WHERE rankver = 1
                   ) rl
              LEFT JOIN {{ ref('STAGE','BVSTG_RETAIL_OFFICE') }} ro
                ON (rl.officecode = ro.officecode)
             WHERE ro.officecode IS NULL
             UNION SELECT v_s_ap1_office_mroc_current.officecode AS OfficeCode ,
                   ref_ap1_codevaluestate.codevalue AS State ,
                   v_s_ap1_organization_mroc_current.code AS OrganizationCode ,
                   v_s_ap1_organization_mroc_current.name AS Organizationname ,
                   'Unknown' AS BMO ,
                   'Unknown' AS territory ,
                   'Unknown' AS area ,
                   'Unknown' AS region ,
                   'Unknown' AS district
              FROM (
                    SELECT *
                      FROM (
                            SELECT *,
                                   rank() OVER (PARTITION BY officecode ORDER BY DSS_VERSION DESC,isActive DESC) AS rankver
                              FROM {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }}
                           )
                     WHERE rankver = 1
                       AND isrowdeleted=0
                   ) v_s_ap1_office_mroc_current
              LEFT JOIN {{ ref('STAGE','BVSTG_RETAIL_OFFICE') }} ro
                ON (v_s_ap1_office_mroc_current.officecode = ro.officecode)
              JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevaluestate
                ON v_s_ap1_office_mroc_current.Stateid=ref_ap1_codevaluestate.codevalueid
              JOIN (
                    SELECT *
                      FROM (
                            SELECT *,
                                   rank() OVER (PARTITION BY organizationID ORDER BY DSS_VERSION DESC) AS rankver
                              FROM {{ ref('STAGE','V_S_AP1_ORGANIZATION_MROC_CURRENT') }}
                           )
                     WHERE rankver = 1
                       AND isrowdeleted=0
                   ) v_s_ap1_organization_mroc_current
                ON (v_s_ap1_organization_mroc_current.organizationid = v_s_ap1_office_mroc_current.organizationid)
             WHERE ro.officecode IS NULL
               AND v_s_ap1_office_mroc_current.officecode not like 'SSB %'
               AND v_s_ap1_office_mroc_current.officecode !='Closed'
