          - locationName: NP
            nodeName: I_NPS_BANKQUESTIONAREAOFSTANDARDRISK
          - locationName: NP
            nodeName: I_SHP_OBLIGATIONREFERENCE
        join:
          joinCondition: |-
            FROM {{ ref('NP','I_NPS_AUDITCHECKLISTQUESTION') }} I_NPS_AUDITCHECKLISTQUESTION
              LEFT JOIN {{ ref('NP','L_NPS_AUDITCHECKLIST') }} L_NPS_AUDITCHECKLIST
                ON I_NPS_AUDITCHECKLISTQUESTION.AUDITCHECKLISTID = L_NPS_AUDITCHECKLIST.ID
              LEFT JOIN {{ ref('NP','I_AUDITDETAILS') }} I_AUDITDETAILS
                ON L_NPS_AUDITCHECKLIST.AUDITID = I_AUDITDETAILS.ID
               AND I_NPS_AUDITCHECKLISTQUESTION.ODSSOURCESYSTEMNAME = I_AUDITDETAILS.ODSSOURCESYSTEMNAME
              LEFT OUTER JOIN {{ ref('NP','I_AUDITBANKQUESTION') }} I_AUDITBANKQUESTION --FIND THE UNIQUE NUMBER FOLLOWING THE # TAG  ON SUBSTRING(I_NPS_AUDITCHECKLISTQUESTION.QUESTIONTEXT   ,PATINDEX('%#%',I_NPS_AUDITCHECKLISTQUESTION.QUESTIONTEXT) + 1   ,LEN(I_NPS_AUDITCHECKLISTQUESTION.QUESTIONTEXT))    = I_AUDITBANKQUESTION.QUESTIONCODE  --ADDED DUE TO JOINING TWICE TO SOME QUESTIONS KW 20221118   AND I_AUDITBANKQUESTION.ROWNUMBER = 1    LEFT OUTER JOIN {{ ref('NP','I_NPS_BANKQUESTIONAREAOFSTANDARDRISK') }} I_NPS_BANKQUESTIONAREAOFSTANDARDRISK      ON I_AUDITBANKQUESTION.QUESTIONID = I_NPS_BANKQUESTIONAREAOFSTANDARDRISK.QUESTIONID    LEFT OUTER JOIN {{ ref('NP','I_SHP_OBLIGATIONREFERENCE') }} I_SHP_OBLIGATIONREFERENCE    ON I_AUDITBANKQUESTION.QUESTIONCODE = I_SHP_OBLIGATIONREFERENCE.QUESTIONNUMBER    --ENSURE ONLY ONE OBLIGATION IS USING THIS QUESTION    AND I_SHP_OBLIGATIONREFERENCE.QUESTIONNUMBERUNIQUE = 1    AND (ISNULL(I_AUDITDETAILS.ACTUALENDDATE,I_AUDITDETAILS.ACTUALSTARTDATE) >= DATEADD(DAY, -CAST (I_SHP_OBLIGATIONREFERENCE.DATERANGEDAYS AS INT), GETDATE())    OR (I_AUDITDETAILS.SCHEDULEDENDDATE BETWEEN DATEADD(DAY, -CAST (I_SHP_OBLIGATIONREFERENCE.DATERANGEDAYS AS INT), GETDATE()) AND GETDATE()))        --THIS CLAUSE MATCHES THE CODE AGAINST THE QUESTIONS THAT ARE ADDED TO THE AUDIT QUESTION DIMENSION.      --ALL THE NEW QUESTIONS HAVE BEEN SET UP WITH RESPONSES, IN NO RESPONSE SET      -- WE PROBABLY DON'T WANT TO KNOW ABOUT THE QUESTION  WHERE I_NPS_AUDITCHECKLISTQUESTION.USEPREDEFINEDRESPONSE = 1      --DO NOT INCLUDE ANY OF THE PARENT RECORDS SET UP TO GROUP THE QUESTIONS   AND I_NPS_AUDITCHECKLISTQUESTION.ISCATEGORY = 0      --ONLY INCLUDE THE QUESTIONS THAT NORTHPOWER HAVE IDENTIFIED WITH THE UNIQUE      -- QUESTION ID SO WE CAN TRACK THE QUESTION USAGE THROUGH THE USED TEMPLATES AND CHECKLISTS   AND PATINDEX('% #%',I_NPS_AUDITCHECKLISTQUESTION.QUESTIONTEXT) > 0
        name: S_AUDITQUESTIONS
        noLinkRefs: []
