        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_CP_NEW_OLD_ACTIVE_BEF_30DAY_POS') }} AS SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.ID
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
             INNER JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D
                ON DS_SPLC_POLICYTRANSACTION.CustomerID = DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.CustomerID
               AND DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.TranType IN('NBS','RWL','REW')
               AND DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.Status IN('Cancelled','Expired')
               AND DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.STATUSDATE >= DATE(DATEADD(DAY,-30,DATE(DS_SPLC_POLICYTRANSACTION.EFFECTIVEDATE)))
               AND DATE(DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.ReportDate) < DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)
               AND DS_SPLC_POLICYTRANSACTION.PolicyID != DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.PolicyID
             WHERE DS_SPLC_POLICYTRANSACTION.TranType IN('NBS','RWL','REW')
