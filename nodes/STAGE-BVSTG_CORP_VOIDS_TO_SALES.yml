    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          DS_CORP_VOIDS_TO_SALES: b26cab90-4ce8-4e12-9ebd-d25b73cdc2ef
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_CORP_VOIDS
          - locationName: EDW
            nodeName: DS_CORP_VOIDS_TO_SALES
        join:
          joinCondition: |-
            FROM (
                    SELECT TS.TRANSACTIONID::VARCHAR(20) TRANSACTIONID_SALE ,
                           DATE (TS.CREATED) CREATED ,
                           CASE WHEN TS.TRANSACTIONTYPE = 'New Business' THEN 1
                                ELSE 0
                                 END SALE_COUNT ,
                           DATE (TS.CORPORATEVOIDON) CORPORATEVOIDON ,
                           TS.MAINSTATE ,
                           TS.OFFICEID ,
                           TS.ORIGINALOFFICEID ,
                           TS.TRANSACTIONOFFICECODE ,
                           TS.ORGANIZATIONCODE ,
                           TS.ORGANIZATIONNAME ,
                           TS.PRIMARYAGENTFULLNAME ,
                           TS.PRIMARYAGENTOFFICE ,
                           TS.PRIMARYAGENTOFFICENAME ,
                           TS.BIAPRIMARYAGENTOFFICE ,
                           TS.PRIMARYAGENTNUMBER ,
                           TS.POLICYID ,
                           IFNULL(cm.CARRIERDISPLAYNAME, TS.CARRIERNAME) CARRIERNAME_SALE ,
                           TS.BIA_STATUS
                      FROM RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY TS
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_COMM_CARRIERMAPPING cm
                        ON cm.CarrierName = TS.CARRIERNAME
                     WHERE ISROWDELETED = 0
                       AND year(TS.CREATED) BETWEEN 2022 AND year(CURRENT_DATE ()) QUALIFY ROW_NUMBER() OVER (PARTITION BY TS.TRANSACTIONID ORDER BY cm.DSS_UPDATE_TIME DESC) = 1
                   ) AS ds_ap1_transactionsummary
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_CORP_VOIDS bvstg_corp_voids
                ON ds_ap1_transactionsummary.TRANSACTIONID_SALE = bvstg_corp_voids.TRANSACTIONID
              LEFT JOIN (
                    SELECT DISTINCT CarrierName ,
                           CARRIERDISPLAYNAME
                      FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_COMM_CARRIERMAPPING QUALIFY ROW_NUMBER() OVER (PARTITION BY CARRIERDISPLAYNAME ORDER BY DSS_UPDATE_TIME DESC) = 1
                   ) carriermapping
                ON carriermapping.CarrierName = bvstg_corp_voids.CARRIERNAME
              LEFT JOIN {{ ref('EDW','DS_CORP_VOIDS_TO_SALES') }} DS_CORP_VOIDS_TO_SALES
                ON DS_CORP_VOIDS_TO_SALES.TRANSACTIONID_COALESCE = ds_ap1_transactionsummary.TRANSACTIONID_SALE
             WHERE DS_CORP_VOIDS_TO_SALES.TRANSACTIONID_COALESCE IS NULL
        name: BVSTG_CORP_VOIDS_TO_SALES
        noLinkRefs: []
