    sourceMapping:
      - aliases:
          V_QACOM_TRANSACTION_COUNTS: 9657367b-4d9e-4050-aead-c664c87e7e48
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_QACOM_TRANSACTION_COUNTS') }} AS SELECT ---Report filters
             V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.Carrier,
                   year(V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.ExecutionMonth) AS Execution_Year,
                   month(V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.ExecutionMonth) AS Execution_Month, ---Report Fields
             IFNULL(IFNULL(e.TRANSTYPEMAPPING, c.TRANSTYPEMAPPING),V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.TRANSACTIONTYPE) AS TRANS_TYPE_MAPPING,
                   count(V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.TransactionType) AS TRANSACTION_COUNT,
                   sum(V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.ACTUALCOMMISSION) AS ACTUAL_COMMISSION,
                   count(V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.FILECOMPLETEPATH)AS FILE_COMPLETE_PATH
              FROM "RETAIL_DEV"."SCH_BVSTAGE"."V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT" V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT
              LEFT OUTER JOIN "DATA_LAKE"."MAGUIRE"."V_DL_COMM_TRANSTYPEMAPPINGCDRC_CURRENT" d
                ON (V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.MASTERCARRIERID = d.MASTERCARRIERID AND V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.TRANSACTIONTYPE = d.TRANSTYPEMAPPINGCDRC AND d.ISACTIVE='True')
              LEFT JOIN "DATA_LAKE"."MAGUIRE"."V_DL_COMM_TRANSTYPEMAPPING_CURRENT" e
                ON (d.TRANSTYPEMAPPINGID = e.TRANSTYPEMAPPINGID AND e.ISACTIVE='True')
              LEFT OUTER JOIN "DATA_LAKE"."MAGUIRE"."V_DL_COMM_TRANSTYPEMAPPINGCDRC_CURRENT" b
                ON (V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT."TRANSACTIONTYPE" = b.TRANSTYPEMAPPINGCDRC AND b.MASTERCARRIERID=0 AND b.ISACTIVE='True')
              LEFT JOIN "DATA_LAKE"."MAGUIRE"."V_DL_COMM_TRANSTYPEMAPPING_CURRENT" c
                ON (b.TRANSTYPEMAPPINGID = c.TRANSTYPEMAPPINGID AND c.ISACTIVE='True')
             WHERE V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.IsDeleted = 'False'
             GROUP BY V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.Carrier,
                      year(V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.ExecutionMonth),
                      month(V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.ExecutionMonth),
                      IFNULL(IFNULL(e.TRANSTYPEMAPPING, c.TRANSTYPEMAPPING),V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.TRANSACTIONTYPE)
