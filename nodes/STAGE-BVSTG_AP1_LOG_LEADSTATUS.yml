            nodeName: S_AP1_HISTORY_MROC
        join:
          joinCondition: |-
            FROM (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY leadid ORDER BY DSS_VERSION DESC) = 1
                   ) s_ap1_lead_mroc
              LEFT JOIN ( SELECT DISTINCT LEADID ,
                   Created StatusChangedAt ,
                   'Reassigned' LeadStatusType
              FROM {{ ref('DATA_VAULT','S_AP1_LEADSTATUSTYPEHISTORY_MROC') }}
             WHERE (oldleadstatustypeid = 8 OR newleadstatustypeid = 8) --reassigned   ) s_ap1_leadstatustypehistory_mroc ON s_ap1_leadstatustypehistory_mroc.leadid = s_ap1_lead_mroc.leadid  LEFT JOIN (   SELECT TO_NUMERIC(SPLIT_PART(v_dlbv_ap1log_logginguserbehavior_current.PARAMETERS, ':', 2)) ValueID    ,v_dlbv_ap1log_logginguserbehavior_current.DATE datelockevent    ,v_dlbv_ap1log_uielementname_current.name UIELEMENTNAME    ,v_dlbv_ap1log_logginguserbehavior_current.username   FROM {{ ref('STAGE','V_DLBV_AP1LOG_LOGGINGUSERBEHAVIOR_CURRENT') }} v_dlbv_ap1log_logginguserbehavior_current   LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AP1LOG_UIELEMENTNAME_CURRENT v_dlbv_ap1log_uielementname_current ON v_dlbv_ap1log_logginguserbehavior_current.uielementnameid = v_dlbv_ap1log_uielementname_current.UIELEMENTNAMEID   WHERE v_dlbv_ap1log_uielementname_current.name = 'Lock Lead' QUALIFY ROW_NUMBER() OVER (     PARTITION BY v_dlbv_ap1log_logginguserbehavior_current.PARAMETERS ORDER BY v_dlbv_ap1log_logginguserbehavior_current.Logginguserbehaviorid DESC     ) = 1   ) v_dlbv_ap1log_logginguserbehavior_current_leadlock ON s_ap1_leadstatustypehistory_mroc.LeadID = v_dlbv_ap1log_logginguserbehavior_current_leadlock.ValueID   AND CAST(s_ap1_leadstatustypehistory_mroc.StatusChangedAt AS DATETIME) = CAST(v_dlbv_ap1log_logginguserbehavior_current_leadlock.datelockevent AS DATETIME)  LEFT JOIN (   SELECT DISTINCT EntityID    ,changed   FROM (    SELECT *    FROM {{ ref('DATA_VAULT','S_AP1_HISTORY_MROC') }} QUALIFY ROW_NUMBER() OVER (      PARTITION BY entityid ORDER BY dss_version DESC      ) = 1    ) s_ap1_history_mroc   WHERE entitytypeid = 5    AND entityfieldid = 42    AND (     changedfrom = 'Reassigned'     OR changedto = 'Reassigned'     )    AND changedby = 1147   ) s_ap1_history_mroc_system ON s_ap1_history_mroc_system.EntityID = s_ap1_lead_mroc.leadid   AND CAST(s_ap1_history_mroc_system.changed AS DATETIME) = CAST(s_ap1_leadstatustypehistory_mroc.StatusChangedAt AS DATETIME) WHERE (       ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0      AND DATE(s_ap1_lead_mroc.created)>= '2020-01-01'     )       OR      ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1       AND DATEDIFF(DAY,DATE(s_ap1_lead_mroc.created),CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}'     ))
        name: BVSTG_AP1_LOG_LEADSTATUS
