      description: Sharepoint List Name
      name: ListName
      nullable: false
      sourceColumnReferences:
      - columnReferences: []
        transform: '-- EXTRACT THE LIST NAME BY REMOVING THE FIXED ''LISTS/'' PREFIX
          AND TRAILING SLASH      -- ASSUMPTIONS:      -- 1. PATH ALWAYS STARTS WITH
          ''LISTS/'' (6 CHARACTERS)      -- 2. PATH ENDS WITH A TRAILING SLASH ''/''      --
          THIS ALLOWS SIMPLE SUBSTRING EXTRACTION RATHER THAN COMPLEX PARSING FROM
          THE RIGHT      CASE          -- CONFIRM THE PATH STARTS WITH ''LISTS/''          WHEN
          LEFT(JSON_VALUE(JSONPAYLOAD, ''$."{PATH}"''), 6) = ''LISTS/''              THEN                   SUBSTRING(                      --
          THE FULL PATH STRING                      JSON_VALUE(JSONPAYLOAD, ''$."{PATH}"''),                       --
          START AFTER ''LISTS/'' PREFIX (I.E., START AT POSITION 7)                      7,                        --
          LENGTH: TOTAL LENGTH MINUS PREFIX LENGTH (6) MINUS TRAILING SLASH (1)                      LENGTH(JSON_VALUE(JSONPAYLOAD,
          ''$."{PATH}"'')) - 6 - 1                    )          ELSE               --
          FOR PATHS THAT DON''T START WITH ''LISTS/'', RETURN NULL OR HANDLE DIFFERENTLY              NULL      END'
