        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_DLBV_AL3_SWEEPLOGS_CURRENT') }} v_dlbv_al3_sweeplogs_current
              LEFT JOIN {{ ref('STAGE','V_DLBV_AL3_BASICPOLICYINFOGROUP_CURRENT') }} v_dlbv_al3_basicpolicyinfogroup_current
                ON v_dlbv_al3_sweeplogs_current.id = v_dlbv_al3_basicpolicyinfogroup_current.sweeplogid
               AND v_dlbv_al3_basicpolicyinfogroup_current.Header != ''
              LEFT JOIN {{ ref('STAGE','V_DLBV_AL3_TRANSACTIONHEADERGROUP_CURRENT') }} v_dlbv_al3_transactionheadergroup_current
                ON v_dlbv_al3_sweeplogs_current.id = v_dlbv_al3_transactionheadergroup_current.sweeplogid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CDTFILE_CURRENT') }} v_s_ap1_cdtfile_current
                ON v_dlbv_al3_sweeplogs_current.id = v_s_ap1_cdtfile_current.sweepid
              LEFT JOIN {{ ref('DATA_VAULT','H_CDTFILE') }} h_cdtfile
                ON v_s_ap1_cdtfile_current.hk_h_cdtfile = h_cdtfile.hk_h_cdtfile
              LEFT JOIN {{ ref('DATA_VAULT','L_CDTPOLICY_CDTFILE') }} l_cdtpolicy_cdtfile
                ON l_cdtpolicy_cdtfile.HK_H_CDTFILE=h_cdtfile.HK_H_CDTFILE
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CDTPOLICY_CURRENT') }} v_s_ap1_cdtpolicy_current
                ON l_cdtpolicy_cdtfile.HK_H_CDTPOLICY= v_s_ap1_cdtpolicy_current.HK_H_CDTPOLICY
              LEFT JOIN {{ ref('STAGE','V_S_AP1_POLICY_MROC_CURRENT') }} v_s_ap1_policy_mroc_current
                ON v_s_ap1_cdtpolicy_current.policyid = v_s_ap1_policy_mroc_current.policyid
              LEFT JOIN {{ ref('DATA_VAULT','L_CDTPOLICY_CDTTYPE') }} l_cdtpolicy_cdttype
                ON v_s_ap1_cdtpolicy_current.hk_h_cdtpolicy = l_cdtpolicy_cdttype.hk_h_cdtpolicy
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CDTTYPE_CURRENT') }} v_s_ap1_cdttype_current
                ON l_cdtpolicy_cdttype.hk_h_cdttype = v_s_ap1_cdttype_current.hk_h_cdttype
              LEFT JOIN {{ ref('STAGE','V_PREB_AL3_EFFECTIVEDATE') }} v_preb_al3_effectivedate
                ON v_preb_al3_effectivedate.SweepLogid = v_dlbv_al3_sweeplogs_current.id
              LEFT JOIN {{ ref('STAGE','V_DLBV_AL3_MESSAGEHEADERGROUP_CURRENT') }} v_dlbv_al3_MessageHeaderGroup_current
                ON v_dlbv_al3_MessageHeaderGroup_current.SweepLogid = v_dlbv_al3_sweeplogs_current.id
              LEFT JOIN {{ ref('STAGE','V_DLBV_AL3_DOWNLOADEDAL3INFORMATIONS_CURRENT') }} v_dlbv_al3_DownloadedAl3Informations_current
                ON v_dlbv_al3_DownloadedAl3Informations_current.DownloadedFileName = v_dlbv_al3_sweeplogs_current.OriginalFileName
              LEFT JOIN {{ ref('STAGE','V_DLBV_AL3_DOWNLOADEDAL3_CURRENT') }} v_dlbv_al3_DownloadedAl3_current
                ON v_dlbv_al3_DownloadedAl3Informations_current.DOWNLOADEDAL3ID = v_dlbv_al3_DownloadedAl3_current.id
             WHERE v_dlbv_al3_sweeplogs_current.createddate >='2020-01-01' QUALIFY ROW_NUMBER() OVER (PARTITION BY v_dlbv_al3_sweeplogs_current.id ORDER BY v_s_ap1_cdtpolicy_current.created, l_cdtpolicy_cdttype.hk_l_cdtpolicy_cdttype) = 1
               AND (('{{ parameters.HWM_BVSTG_AL3_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_AL3_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,v_dlbv_al3_sweeplogs_current.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AL3_Refresh_Days }}') OR ('{{ parameters.HWM_BVSTG_AL3_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND TO_DATE(v_dlbv_al3_sweeplogs_current.DSS_CREATE_TIME) = TO_DATE(CURRENT_DATE())))
