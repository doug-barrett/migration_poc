        join:
          joinCondition: |-
            EXTENDED
              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_SUBSCRIPTIONTRANSACTION_CURRENT v_dlbv_ac_subscriptiontransaction_current
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_SUBSCRIPTIONTRANSACTIONPRODUCT_CURRENT v_dlbv_ac_subscriptiontransactionproduct_current
                ON v_dlbv_ac_subscriptiontransactionproduct_current.subscriptiontransactionid = v_dlbv_ac_subscriptiontransaction_current.subscriptiontransactionid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_CARRIER_CURRENT v_dlbv_ac_carrier_current
                ON v_dlbv_ac_carrier_current.carrierid = v_dlbv_ac_subscriptiontransactionproduct_current.carrierid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_PRODUCT_CURRENT v_dlbv_ac_product_current
                ON v_dlbv_ac_product_current.productid = v_dlbv_ac_subscriptiontransactionproduct_current.productid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_PRODUCTSTATUS_CURRENT v_dlbv_ac_productstatus_current
                ON v_dlbv_ac_productstatus_current.productstatusid = v_dlbv_ac_subscriptiontransactionproduct_current.productstatusid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_SUBSCRIPTION_CURRENT v_dlbv_ac_subscription_current
                ON v_dlbv_ac_subscription_current.subscriptionid = v_dlbv_ac_subscriptiontransaction_current.subscriptionid
               AND v_dlbv_ac_subscriptiontransactionproduct_current.customerid = v_dlbv_ac_subscription_current.customerid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_TRANSACTIONTYPE_CURRENT v_dlbv_ac_transactiontype_current
                ON v_dlbv_ac_transactiontype_current.transactiontypeid = v_dlbv_ac_subscriptiontransaction_current.transactiontypeid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_TRANSACTIONSTATUS_CURRENT v_dlbv_ac_transactionstatus_current
                ON v_dlbv_ac_transactionstatus_current.transactionstatusid = v_dlbv_ac_subscriptiontransaction_current.transactionstatusid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_SUBSCRIPTIONPRODUCT_CURRENT v_dlbv_ac_subscriptionproduct_current
                ON v_dlbv_ac_subscriptionproduct_current.subscriptionproductid = v_dlbv_ac_subscriptiontransactionproduct_current.subscriptionproductid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_PRODUCTSTATUS_CURRENT v_dlbv_ac_productstatus_current_sp
                ON v_dlbv_ac_productstatus_current_sp.productstatusid = v_dlbv_ac_subscriptionproduct_current.productstatusid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_PRODUCTTYPE_CURRENT v_dlbv_ac_producttype_current
                ON v_dlbv_ac_producttype_current.producttypeid = v_dlbv_ac_product_current.producttypeid
              LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_EMPLOYEE_MROC s_ap1_employee_mroc
                ON lower(publicid) = v_dlbv_ac_subscriptiontransaction_current.userid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PRE_AP1_OFFICE_MROC_CURRENT v_pre_ap1_office_mroc_current
                ON v_pre_ap1_office_mroc_current.ap1_officecode = v_dlbv_ac_subscriptiontransaction_current.officecode
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_ADDITIONALPRODUCT_TERM v_preb_additionalproduct_term
                ON (v_preb_additionalproduct_term.Additionalproductname = v_dlbv_ac_subscriptiontransactionproduct_current.NAME AND v_dlbv_ac_subscriptiontransactionproduct_current.PRICE = v_preb_additionalproduct_term.ap_po_amount AND v_dlbv_ac_subscriptiontransactionproduct_current.COST = v_preb_additionalproduct_term.ap_po_companycost)
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_POLICY_MROC_CURRENT v_s_ap1_policy_mroc_current
                ON UPPER(v_s_ap1_policy_mroc_current.publicid) = UPPER(v_dlbv_ac_subscriptiontransactionproduct_current.policyid)
              LEFT JOIN (
                    SELECT DISTINCT a.programid,
                           a.onlinesalecode,
                           a.programname,
                           b.organizationcode
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_PROGRAM_MROC_CURRENT a
                     INNER JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_POLICY b
                        ON a.programid = b.programid
                     WHERE isrowdeleted = 0 QUALIFY ROW_NUMBER() OVER (PARTITION BY b.organizationcode ORDER BY a.CREATED DESC) = 1
                   ) v_s_ap1_program_mroc_current
                ON v_s_ap1_program_mroc_current.onlinesalecode = v_dlbv_ac_product_current.atlasproductcode
               AND v_s_ap1_program_mroc_current.organizat
