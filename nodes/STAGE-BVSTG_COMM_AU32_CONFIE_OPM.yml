        join:
          joinCondition: |-
            FROM (
                    SELECT date_trunc('month', effectivedate)
                     MONTH,
                           count(DISTINCT CASE WHEN date_trunc('month', effectivedate) = date_trunc('month', terminationdate) AND status_eom = 'Terminated' THEN uniqueid END) Terminated_emp,
                           count(DISTINCT CASE WHEN status_eom = 'Active' THEN uniqueid END) Active_EOM,
                           count(DISTINCT CASE WHEN status_bom = 'Active' THEN uniqueid END) Active_BOM
                      FROM (
                            SELECT uniqueid,
                                   date_trunc('month',to_date(EffectiveDate)) EffectiveDate,
                                   date_trunc('month',to_date(TerminationDate)) TerminationDate,
                                   pointintimestatus Status_EOM,
                                   CASE WHEN ISNEWHIRE = 'NewHire' THEN 'Inactive'
                                        ELSE lag(pointintimestatus, 1) OVER (PARTITION BY uniqueid ORDER BY effectivedate)
                                         END AS Status_BOM
                              FROM {{ ref('EDW','DS_HR_SALESEMPLOYEESUMMARY') }}
                             WHERE lower(jobfamily) ='sales' QUALIFY row_number() OVER (PARTITION BY uniqueid, effectivedate ORDER BY EMPLOYEESTATUSSTARTDATE DESC) = 1
                           )
                     GROUP BY date_trunc('month', effectivedate)
                   )ds_hr_salesemployeesummary
