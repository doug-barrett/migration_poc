    sourceMapping:
      - aliases:
          V_S_AMS_INVOICE_MROC_DUPES: e3c94d9f-8520-4e4a-9ba2-3c0d4736cdb3
          S_AMS_INVOICE: 5b1c5e25-9d62-491f-aad5-1f2783c5bc25
          H_INVOICE: d5fb99ff-f824-46a0-b4ab-a5aa4de2b93d
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_S_AMS_INVOICE_MROC_DUPES') }} COMMENT='Template version:1.0.0' (hk_h_invoice, invid, custid, polid, gldivcode, gldeptcode, brokercode, glbrnchcode, glgrpcode, invseriesid, bhid, cshid, billmethod, invtype, inveffdate, invdate, duedate, invno, oaorigin, oadescription, oafinancecode, polrelation, polno, execcode, repcode, journaltranid, isinstallment, iscancelled, binderstatus, binderpostmethod, binderpolteffdate, lcdate, closeddate, closedstatus, arcloseddate, arclosedstatus, dbreccloseddate, ispre35data, isposted, originalinvidinv, voidinvidinv, origduedate, changedby, changeddate, entereddate, dss_change_hash_ams_invoice_mroc, dss_record_source, dss_load_date, dss_start_date, dss_version, dss_create_time, duperank) AS SELECT S_AMS_INVOICE.HK_H_INVOICE,
                   h_invoice.INVID,
                   S_AMS_INVOICE.CUSTID,
                   S_AMS_INVOICE.POLID,
                   S_AMS_INVOICE.GLDIVCODE,
                   S_AMS_INVOICE.GLDEPTCODE,
                   S_AMS_INVOICE.BROKERCODE,
                   S_AMS_INVOICE.GLBRNCHCODE,
                   S_AMS_INVOICE.GLGRPCODE,
                   S_AMS_INVOICE.INVSERIESID,
                   S_AMS_INVOICE.BHID,
                   S_AMS_INVOICE.CSHID,
                   S_AMS_INVOICE.BILLMETHOD,
                   S_AMS_INVOICE.INVTYPE,
                   S_AMS_INVOICE.INVEFFDATE,
                   S_AMS_INVOICE.INVDATE,
                   S_AMS_INVOICE.DUEDATE,
                   S_AMS_INVOICE.INVNO,
                   S_AMS_INVOICE.OAORIGIN,
                   S_AMS_INVOICE.OADESCRIPTION,
                   S_AMS_INVOICE.OAFINANCECODE,
                   S_AMS_INVOICE.POLRELATION,
                   S_AMS_INVOICE.POLNO,
                   S_AMS_INVOICE.EXECCODE,
                   S_AMS_INVOICE.REPCODE,
                   S_AMS_INVOICE.JOURNALTRANID,
                   S_AMS_INVOICE.ISINSTALLMENT,
                   S_AMS_INVOICE.ISCANCELLED,
                   S_AMS_INVOICE.BINDERSTATUS,
                   S_AMS_INVOICE.BINDERPOSTMETHOD,
                   S_AMS_INVOICE.BINDERPOLTEFFDATE,
                   S_AMS_INVOICE.LCDATE,
                   S_AMS_INVOICE.CLOSEDDATE,
                   h_invoice.CLOSEDSTATUS,
                   S_AMS_INVOICE.ARCLOSEDDATE,
                   S_AMS_INVOICE.ARCLOSEDSTATUS,
                   S_AMS_INVOICE.DBRECCLOSEDDATE,
                   S_AMS_INVOICE.ISPRE35DATA,
                   S_AMS_INVOICE.ISPOSTED,
                   S_AMS_INVOICE.ORIGINALINVIDINV,
                   S_AMS_INVOICE.VOIDINVIDINV,
                   S_AMS_INVOICE.ORIGDUEDATE,
                   S_AMS_INVOICE.CHANGEDBY,
                   S_AMS_INVOICE.CHANGEDDATE,
                   S_AMS_INVOICE.ENTEREDDATE,
                   S_AMS_INVOICE.DSS_CHANGE_HASH,
                   S_AMS_INVOICE.DSS_RECORD_SOURCE,
                   S_AMS_INVOICE.DSS_LOAD_DATE,
                   S_AMS_INVOICE.DSS_START_DATE,
                   S_AMS_INVOICE.DSS_VERSION,
                   S_AMS_INVOICE.DSS_CREATE_TIME,
                   S_AMS_INVOICE.DupeRank
              FROM (
                    SELECT S_AMS_INVOICE.* ,
                           ROW_NUMBER() OVER (PARTITION BY S_AMS_INVOICE.hk_h_invoice ORDER BY S_AMS_INVOICE.dss_start_date) AS DupeRank
                      FROM {{ ref('DATA_VAULT','S_AMS_INVOICE') }} AS S_AMS_INVOICE
                     INNER JOIN (
                            SELECT hk_h_invoice,
                                   dss_start_date,
                                   LEAD(dss_start_date, 1) OVER (PARTITION BY hk_h_invoice ORDER BY dss_start_date) AS last_start_date
                              FROM {{ ref('DATA_VAULT','S_AMS_INVOICE') }}
                             GROUP BY hk_h_invoice,
                                      dss_start_date
                            HAVING COUNT(*) > 1
                           ) sub
                        ON S_AMS_INVOICE.hk_h_invoice = sub.hk_h_invoice
                       AND S_AMS_INVOICE.dss_start_date = sub.dss_start_date
                     WHERE sub.last_start_date IS NULL
                   ) AS S_AMS_INVOICE
             INNER JOIN {{ ref('DATA_VAULT','H_INVOICE') }} h_invoice
                ON h_invoice.hk_h_invoice = s_ams_invoice.hk_h_invoice
        dependencies:
          - locationName: DATA_VAULT
            nodeName: S_AMS_INVOICE
          - locationName: DATA_VAULT
            nodeName: H_INVOICE
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('DATA_VAULT','S_AMS_INVOICE') }}
            {{ ref('DATA_VAULT','H_INVOICE') }}
        name: V_S_AMS_INVOICE_MROC_DUPES
        noLinkRefs: []
