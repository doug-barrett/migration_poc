            nodeName: V_DLBV_MKT_TIMEZONES
          - locationName: EDW
            nodeName: DS_MKT_CALLLOGS
        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','V_DLBV_API_MARCHEX_CURRENT') }} v_dlbv_api_marchex_current
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON v_dlbv_api_marchex_current.cmpid = CAST(ds_mkt_campaign.Marchex_Id AS VARCHAR(50))
              LEFT JOIN {{ ref('STAGE','V_S_MKT_OFFICEDESTINATIONNO_CURRENT') }} v_s_mkt_officedestinationno_current
                ON v_dlbv_api_marchex_current.forwardno = v_s_mkt_officedestinationno_current.DestinationNo
               AND DATE(v_dlbv_api_marchex_current.call_start) >= v_s_mkt_officedestinationno_current.EffectiveDate
               AND DATE(v_dlbv_api_marchex_current.call_start) <= v_s_mkt_officedestinationno_current.TerminationDate
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON v_s_mkt_officedestinationno_current.officecode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('STAGE','V_S_MKT_BROADCAST_CALENDAR_CURRENT') }} v_s_mkt_broadcast_calendar_current
                ON DATE((convert_timezone('UTC','America/Los_Angeles',(CAST(v_dlbv_api_marchex_current.CALL_START AS DATETIME))::timestamp_ntz))) = v_s_mkt_broadcast_calendar_current.date
              LEFT JOIN {{ ref('STAGE','V_S_MKT_AREA_CODES_CURRENT') }} v_s_mkt_area_codes_current
                ON CASE WHEN LEN(IFNULL(try_to_number(LEFT(RIGHT(v_dlbv_api_marchex_current.caller_number,10),3)),'858'))<3 THEN '858'
                        ELSE IFNULL(try_to_number(LEFT(RIGHT(v_dlbv_api_marchex_current.caller_number,10),3)),'858')
                         END = v_s_mkt_area_codes_current.area_code
              LEFT JOIN (
                    SELECT ds_interactionsummary.interactionidkey ,
                           ds_interactionsummary.startdatetime ,
                           ds_interactionsummary.DNIS_LOCALID ,
                           ds_interactionsummary.digitsdialed ,
                           REPLACE(ds_interactionsummary.REMOTENUMBERCALLID,'+1','') AS REMOTENUMBERCALLID
                      FROM {{ ref('EDW','DS_INTERACTIONSUMMARY') }} ds_interactionsummary
                      LEFT JOIN {{ ref('DATA_VAULT','S_I3_ROUTINGCALLRESULTS') }} s_i3_routingcallresults
                        ON s_i3_routingcallresults.interactionidkey = ds_interactionsummary.interactionidkey
                     WHERE s_i3_routingcallresults.interactionidkey IS NULL
                   ) ds_interactionsummary
                ON v_dlbv_api_marchex_current.caller_number = REMOTENUMBERCALLID
               AND DATE(convert_timezone('UTC','America/Los_Angeles',(CAST(v_dlbv_api_marchex_current.CALL_START AS DATETIME))::timestamp_ntz)) BETWEEN DATE(ds_interactionsummary.startdatetime) AND DATE(ds_interactionsummary.startdatetime)
               AND (v_dlbv_api_marchex_current.forwardno = REPLACE(ds_interactionsummary.DNIS_LOCALID,'+1','') OR v_dlbv_api_marchex_current.inboundno = REPLACE(ds_interactionsummary.DNIS_LOCALID,'+1','') OR v_dlbv_api_marchex_current.forwardno = REPLACE(ds_interactionsummary.digitsdialed,'+1','') OR v_dlbv_api_marchex_current.inboundno = REPLACE(ds_interactionsummary.digitsdialed,'+1',''))
              LEFT JOIN {{ ref('STAGE','V_DLBV_MKT_TIMEZONES') }} v_dlbv_mkt_timezones
                ON v_s_mkt_area_codes_current.Time_Zone = v_dlbv_mkt_timezones.TimeZonesID
             WHERE (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND v_dlbv_api_marchex_current.DSS_CREATE_TIME >= DATE_TRUNC(WEEK, DATEADD(DAY,-'{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}',CURRENT_DATE()) ::DATE)) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND v_dlbv_api_marchex_current.DSS_CREATE_TIME > (SELECT DATEADD(HOUR,-1,MAX(DSS_UPDATE_TIME)) FROM {{ ref('EDW','DS_MKT_CALLLOGS') }} WHERE SourceSystem='MCX'))) QUALIFY ROW_NUMBER() OVER (
            PARTITION BY v_dlbv_api_marchex_current.Call_Id
             ORDER BY CAST(v_dlbv_api_marchex_current.call_start AS DATETIME),
                      ds_i
        name: SRC_bvstg_mkt_calllogs_2_mcx
        noLinkRefs: []
