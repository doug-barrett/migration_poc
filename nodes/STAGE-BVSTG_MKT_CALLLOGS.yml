        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','S_I3_ROUTINGCALLRESULTS') }} s_i3_routingcallresults
              LEFT JOIN {{ ref('DATA_VAULT','H_ROUTINGCALLRESULTS') }} h_routingcallresults
                ON s_i3_routingcallresults.hk_h_routingcallresults = h_routingcallresults.hk_h_routingcallresults
              LEFT JOIN {{ ref('STAGE','V_S_I3_CAMPAIGNDNIS_CURRENT') }} v_s_i3_campaigndnis_current
                ON s_i3_routingcallresults.dnis = v_s_i3_campaigndnis_current.dnis
               AND s_i3_routingcallresults.CampaignId= v_s_i3_campaigndnis_current.Campaign_Id
              LEFT JOIN {{ ref('DATA_VAULT','H_CAMPAIGNDNIS') }} h_campaigndnis
                ON v_s_i3_campaigndnis_current.hk_h_campaigndnis = h_campaigndnis.hk_h_campaigndnis
              LEFT JOIN {{ ref('EDW','DS_INTERACTIONSUMMARY') }} ds_interactionsummary
                ON s_i3_routingcallresults.interactionidkey = ds_interactionsummary.interactionidkey
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON h_campaigndnis.id = ds_mkt_campaign.cars_id
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON s_i3_routingcallresults.officecode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('STAGE','V_S_MKT_BROADCAST_CALENDAR_CURRENT') }} v_s_mkt_broadcast_calendar_current
                ON DATE(s_i3_routingcallresults.initiateddatetime) = v_s_mkt_broadcast_calendar_current.date
              LEFT JOIN {{ ref('STAGE','V_S_MKT_AREA_CODES_CURRENT') }} v_s_mkt_area_codes_current
                ON CASE WHEN LEN(IFNULL(try_to_number(LEFT(RIGHT(s_i3_routingcallresults.ani,10),3)),'858'))<3 THEN '858'
                        ELSE IFNULL(try_to_number(LEFT(RIGHT(s_i3_routingcallresults.ani,10),3)),'858')
                         END = try_to_number(v_s_mkt_area_codes_current.area_code)
              LEFT JOIN {{ ref('STAGE','V_DLBV_MKT_TIMEZONES') }} v_dlbv_mkt_timezones
                ON v_s_mkt_area_codes_current.Time_Zone = v_dlbv_mkt_timezones.TimeZonesID
             WHERE (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND s_i3_routingcallresults.DSS_CREATE_TIME >= DATE_TRUNC(WEEK, DATEADD(DAY,-'{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}',CURRENT_DATE()) ::DATE)) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND s_i3_routingcallresults.DSS_CREATE_TIME > (SELECT DATEADD(HOUR,-2,MAX(DSS_UPDATE_TIME)) FROM {{ ref('EDW','DS_MKT_CALLLOGS') }} WHERE SourceSystem='CARS'))) QUALIFY ROW_NUMBER() OVER (PARTITION BY h_routingcallresults.id ORDER BY s_i3_routingcallresults.initiateddatetime) = 1
