        join:
          joinCondition: |-
            FROM (
                    SELECT BSL.created ,
                           BSL.transactionid ,
                           BSL.customerid ,
                           BSL.policyid ,
                           BSL.sourcedb ,
                           BSL.startdate ,
                           BSL.enddate ,
                           BSL.leadid ,
                           BSL.term_in_months ,
                           BSL.estimate_end_date ,
                           BSL.target ,
                           BSL.flag_target ,
                           ACX.MAINSTATE ,
                           VIN.VINCOUNT ,
                           PREM.DAYS_TO_LAST_ADJUSTMENT ,
                           CALLS.DAYS_SINCE_LAST_INBOUND ,
                           CASE WHEN ACX.MAINSTATE = 'TX' THEN 1
                                ELSE 0
                                 END AS MAINSTATE_TX ,
                           CASE WHEN ACX.MAINSTATE IN ('AZ', 'FL', 'NJ') THEN 1
                                ELSE 0
                                 END AS MAINSTATE_D ,
                           CASE WHEN ACX.MAINSTATE IN ('WA', 'LA') THEN 1
                                ELSE 0
                                 END AS MAINSTATE_F ,
                           CASE WHEN CSV.VERBALLANGUAGETYPE = 'English only' THEN 1
                                ELSE 0
                                 END AS VERBALLANGUAGETYPE_English_ONLY ,
                           CASE WHEN CDP.DOB = '1111-11-11'                              THEN NULL
                                WHEN FLOOR(MONTHS_BETWEEN(BSL.CREATED, CDP.DOB)/12) < 18 THEN NULL
                                ELSE FLOOR(MONTHS_BETWEEN(BSL.CREATED, CDP.DOB)/12)
                                 END AS AGE ,
                           CASE WHEN PREM.INITIAL_PREMIUM_NORM IS NULL THEN 0
                                ELSE PREM.INITIAL_PREMIUM_NORM
                                 END AS INITIAL_PREMIUM_NORM ,
                           CASE WHEN PREM.STDDEV_ADJUSTMENT_AMOUNT_30D_BEFORE_END IS NULL THEN 0
                                ELSE PREM.STDDEV_ADJUSTMENT_AMOUNT_30D_BEFORE_END
                                 END AS STDDEV_ADJUSTMENT_AMOUNT_30D_BEFORE_END ,
                           CASE WHEN CALLS.RATIO_ANS_EFFEC_TALKTIME_AT_FIRSTMONTH IS NULL THEN 0
                                ELSE CALLS.RATIO_ANS_EFFEC_TALKTIME_AT_FIRSTMONTH
                                 END AS RATIO_ANS_EFFEC_TALKTIME_AT_FIRSTMONTH ,
                           CASE WHEN PREM.PREMIUM_DRIFT_RATIO IS NULL THEN 0
                                ELSE PREM.PREMIUM_DRIFT_RATIO
                                 END AS PREMIUM_DRIFT_RATIO ,
                           CASE WHEN FEE.FEE_AMOUNT IS NULL THEN 0
                                ELSE FEE.FEE_AMOUNT
                                 END AS FEE_AMOUNT ,
                           CASE WHEN CALLS.DAYS_SINCE_LAST_CALL IS NULL                         THEN 1
                                WHEN CALLS.DAYS_SINCE_LAST_CALL = CALLS.DAYS_SINCE_LAST_INBOUND THEN 1
                                ELSE 0
                                 END AS FLAG_LAST_CALL ,
                           CASE WHEN PREM.RATIO_ADJ_AMOUNT IS NULL THEN NULL
                                WHEN PREM.RATIO_ADJ_AMOUNT < 0     THEN -LN(ABS(PREM.RATIO_ADJ_AMOUNT) + 1)
                                ELSE LN(ABS(PREM.RATIO_ADJ_AMOUNT) + 1)
                                 END AS RATIO_ADJ_AMOUNT ,
                           CASE WHEN MKT.MKT_LEAD_TYPE IN ('UnQualifed Web', 'Qualifed Web') THEN 1
                                ELSE 0
                                 END AS MKT_LEAD_TYPE_WEB
                      FROM (
                            SELECT *
                              FROM {{ ref('UNKNOWN','BVSTG_NSA_RWL_AU1_BSL') }}
                           ) BSL
                      LEFT JOIN (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU2_PREM_FEAT') }}
                           ) PREM
                        ON (BSL.TRANSACTIONID = PREM.TRANSACTIONID AND BSL.POLICYID = PREM.POLICYID)
                      LEFT JOIN (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU4_CALLS') }}
                           ) CALLS
                        ON (BSL.TRANSACTIONID = CALLS.TRANSACTIONID AND BSL.CUSTOMERID = CALLS.CUSTOMERID)
                      LEFT JOIN (
                            SELECT DISTINCT CUSTOMERID,
                                   VERBALLANGUAGETYPE,
                                   MAINSTATE
                              FROM RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2
                             WHERE SOURCEDB = 'AppOne'
                           ) CSV
                        ON (BSL.CUSTOMERID = CSV.CUSTOMERID)
                      LEFT JOIN (
                            SELECT DISTINCT CUSTOMERID,
                                   DOB
                              FROM RETAIL_PROD.SCH_EDW.DS_CUSTOMER_UNIFICATION_MASTER
                             WHERE SOURCEDB = 'AppOne'
                           ) CDP
                        ON (BSL.CUSTOMERID = CDP.CUSTOMERID)
                      LEFT JOIN (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU3_VINCOUNT') }}
                           ) VIN
                        ON (BSL.POLICYID = VIN.POLICYID)
                      LEFT JOIN (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU5_FEES') }}
                           ) FEE
                        ON (BSL.TRANSACTIONID = FEE.TRANSACTIONID AND BSL.POLICYID = FEE.POLICYID)
                      LEFT JOIN (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU6_MKT') }}
                           ) MKT
                        ON (BSL.TRANSACTIONID = MKT.TRANSACTIONID AND BSL.CUSTOMERID = MKT.CUSTOMERID)
                      LEFT JOIN (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU7_ACX') }}
                           ) ACX
                        ON (BSL.CUSTOMERID = ACX.CUSTOMERID)
                   ) bvstg_nsa_rwl_au8_dataset
