                   bvstg_au1_customer_nba.OFFICESTATUS ,
                   bvstg_au1_customer_nba.AGENCYCODE ,
                   bvstg_au1_customer_nba.CUSTOMER_STATUS ,
                   bvstg_au1_customer_nba.CUSTOMER_TENURE ,
