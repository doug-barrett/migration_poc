                   bvstg_au1_customer_nba.FIRSTNAME AS FIRSTNAME ,
                   bvstg_au1_customer_nba.LASTNAME AS LASTNAME ,
                   bvstg_au1_customer_nba.PUBLICID AS PUBLICID ,
