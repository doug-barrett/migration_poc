                   bvstg_au1_customer_nba.CUSTOMERZIPCODE ,
                   bvstg_au1_customer_nba.BUSINESSUNIT ,
                   bvstg_au1_customer_nba.ISSTORESTATE ,
                   v_preb_nba_lead.LEADID ,
                   v_preb_nba_lead.LEADCREATED ,
                   v_preb_nba_lead.CURRENTOFFICECODE AS LEADOFFICECODE ,
                   v_preb_nba_lead.CURRENTORGANIZATIONCODE AS LEADORGANIZATIONCODE ,
                   v_preb_nba_lead.ISPFORG ,
                   v_preb_nba_lead.STATE LEADSTATE ,
                   v_preb_nba_quote.QuoteID ,
                   v_preb_nba_policy_np.NBTRANSACTIONID ,
                   v_preb_nba_policy_np.LAST_TRANSACTIONID AS RENEWALID ,
                   v_preb_nba_policy_np.ActiveNBTransactionID ,
                   v_preb_nba_policy_np.CancelNBTransactionID ,
                   v_preb_nba_ancillaries.AncillaryID ,
                   CASE WHEN v_preb_nba_lead.CUSTOMERID IS NOT NULL THEN 1
                        ELSE 0
                         END AS HAS_LEAD ,
                   CASE WHEN v_preb_nba_quote.customerid IS NOT NULL THEN 1
                        ELSE 0
                         END AS HAS_QUOTE ,
                   CASE WHEN v_preb_nba_turboquote.customerid IS NOT NULL THEN 1
                        ELSE 0
                         END HAS_TURBOQUOTE ,
                   CASE WHEN v_preb_nba_policy_np.customerid IS NOT NULL THEN 1
                        ELSE 0
                         END AS HAS_NEW_POLICY ,
                   CASE WHEN v_preb_nba_ancillaries.customerid IS NOT NULL THEN 1
                        ELSE 0
                         END AS HAS_ANCILLARIES ,
                   CASE WHEN v_preb_nba_policy_np.has_renewalactive = 1 THEN 1
                        ELSE 0
                         END AS HAS_RENEWAL_ACTIVE ,
                   CASE WHEN v_preb_nba_policy_np.has_active = 1 THEN 1
                        ELSE 0
                         END AS HAS_ACTIVE ,
                   CASE WHEN v_preb_nba_policy_np.has_cancelledpolicy = 1 THEN 1
                        ELSE 0
                         END AS HAS_CANCELLED_POLICY ,
                   IFNULL(CONCAT (CASE WHEN v_preb_nba_lead.CUSTOMERID IS NOT NULL THEN 'L,' ELSE '' END ,CASE WHEN v_preb_nba_quote.customerid IS NOT NULL THEN 'Q,' ELSE '' END ,CASE WHEN v_preb_nba_turboquote.customerid IS NOT NULL THEN 'T,' ELSE '' END ,CASE WHEN v_preb_nba_policy_np.customerid IS NOT NULL THEN 'P,' ELSE '' END ,CASE WHEN v_preb_nba_ancillaries.customerid IS NOT NULL THEN '$,' ELSE '' END ,CASE WHEN v_preb_nba_policy_np.has_renewalactive = 1 THEN 'R,' ELSE '' END ,CASE WHEN v_preb_nba_policy_np.has_active = 1 THEN 'A,' ELSE '' END ,CASE WHEN v_preb_nba_policy_np.has_cancelledpolicy = 1 THEN 'X' ELSE '' END), '') AS STATUS ,
                   v_preb_nba_policy_np.cancel_date ,
                   bvstg_au1_customer_nba.SOURCEDB --,bvstg_au1_customer_nba.ZIPCODE    ,bvstg_au1_customer_nba.STATE    ,bvstg_au1_customer_nba.SOURCESYSTEM    ,v_preb_nba_agent.last_startdatetime AS LAST_CONTACT    ,v_preb_nba_agent.last_agent    ,bvstg_au1_customer_nba.EXPIRATIONDATE    ,bvstg_au1_customer_nba.EFFECTIVEDATE    ,v_preb_nba_policy_np.POLICYNUMBER    ,v_preb_nba_policy_np.CARRIERNAME    ,v_preb_nba_policy_np.CARRIERNAME_GROUPED    ,bvstg_au1_customer_nba.LANGUAGE    ,bvstg_au1_customer_nba.EMAIL    ,CASE      WHEN has_quote = 1      AND has_new_policy = 0      THEN 1     ELSE 0     END AS REQUOTE    ,CASE      WHEN v_preb_nba_eft.CUSTOMERID IS NOT NULL      THEN 1     ELSE 0     END AS HAS_RCCEFT    ,CASE      WHEN v_preb_nba_eft.CUSTOMERID IS NULL      THEN 0     ELSE 1     END AS RCCEFT    ,CASE      WHEN has_active = 1      AND has_ancillaries = 0      THEN 1     ELSE 0     END AS ANCILLA
