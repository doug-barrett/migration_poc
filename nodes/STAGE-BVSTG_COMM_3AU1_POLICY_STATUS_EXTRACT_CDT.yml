                   transactions_combined_final2.description,
                   transactions_combined_final2.sourcetable,
                   transactions_combined_final2.lastupdated,
                   transactions_combined_final2.carriername_org,
                   transactions_combined_final2.termdescription,
                   transactions_combined_final2.policynumberformatted,
                   transactions_combined_final2.carriername,
                   transactions_combined_final2.term_final,
                   transactions_combined_final2.premium
              FROM (SELECT DISTINCT transactions_combined_final.POLICYID,
                   transactions_combined_final.CUSTOMERID,
                   transactions_combined_final.POLICYNUMBER,
                   transactions_combined_final.effectivedate,
