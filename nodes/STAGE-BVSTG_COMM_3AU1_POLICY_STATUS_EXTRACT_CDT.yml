            EXTENDED
              FROM (SELECT DISTINCT md5(ifnull(transactions_combined_final2.policyid, '-') || ifnull(transactions_combined_final2.customerid, '-') || ifnull(transactions_combined_final2.policynumber, '-') || ifnull(to_varchar(transactions_combined_final2.effectivedate), '-') || ifnull(to_varchar(transactions_combined_final2.expirationdate), '-') || ifnull(to_varchar(transactions_combined_final2.termid), '-') || ifnull(transactions_combined_final2.lineofbusinessid, '-') || ifnull(transactions_combined_final2.transactionid, '-') || ifnull(transactions_combined_final2.transactiontypeid, '-') || ifnull(to_varchar(transactions_combined_final2.created), '-') || ifnull(to_varchar(transactions_combined_final2.createdby), '-') || ifnull(transactions_combined_final2.description, '-') || ifnull(transactions_combined_final2.sourcetable, '-') || ifnull(to_varchar(transactions_combined_final2.lastupdated), '-') || ifnull(transactions_combined_final2.carriername_org, '-') || ifnull(transactions_combined_final2.termdescription, '-') || ifnull(transactions_combined_final2.policynumberformatted, '-') || ifnull(transactions_combined_final2.carriername, '-') || ifnull(to_varchar(transactions_combined_final2.term_final),'-')) bvstg_comm_au1_policy_status_extract_cdt_ID,
