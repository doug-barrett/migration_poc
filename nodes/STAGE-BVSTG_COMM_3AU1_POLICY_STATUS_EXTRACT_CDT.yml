                   ds_bvstg_comm_policynumberformatting_allsources.carriername_mapped AS carriername,
                   CASE WHEN sourcetable != 'trandetail_ams' THEN CASE WHEN termdescription = '1 Month' THEN 1 WHEN termdescription = '3 Months' THEN 3 WHEN termdescription = '6 Months' THEN 6 WHEN termdescription = '1 Year' THEN 12 WHEN termdescription = '2 Years' THEN 24 WHEN termdescription = '3 Years' THEN 36 WHEN termdescription = '4 Years' THEN 48 END
