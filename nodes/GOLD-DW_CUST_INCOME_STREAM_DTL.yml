      join:
        joinCondition: 'FROM {{ ref(''BRONZE'', ''YD_DEIREF'') }} yd_deiref

          LEFT JOIN {{ ref(''BRONZE'', ''CP_EXLUDE_PRODUCT_KEY'') }} cp_exlude_product_key ON yd_deiref.PRODUCT_KEY = cp_exlude_product_key.PRODUCT_KEY /* Detail Outer Join */

          LEFT JOIN ( SELECT * FROM {{ ref(''BRONZE'', ''CP_DXCP1'') }} UNION ALL SELECT * FROM {{ ref(''BRONZE'', ''CP_DXCP2'') }} UNION ALL SELECT * FROM {{ ref(''BRONZE'', ''CP_DXCP3'') }} ) cp_dxcp1 ON cp_dxcp1.PADDED_CLIENT_ID = yd_deiref.EI_ID /* Detail Outer Join */

