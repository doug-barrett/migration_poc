          LEFT JOIN {{ ref(''BRONZE'', ''DW_CONTRACT'') }} dw_contract ON yd_deiref.XC1_POLICY_NUMBER = dw_contract.CONTRACT_ID /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PARTY'') }} dw_party ON yd_deiref.BI_ID = dw_party.PARTY_ID /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''INCOME_STM_RCPT1'') }} ulkp_income_stm_rcpt1 ON ulkp_income_stm_rcpt1.XC1_POLICY_NUMBER = yd_deiref.XC1_POLICY_NUMBER AND ulkp_income_stm_rcpt1.XC1_ANNUITANT_NUMBER = ''01''

