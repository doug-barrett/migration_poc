    enabledColumnTestIDs: []
    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            EXTENDED
              FROM ( -- =============================================      -- LAYER 2: AGGREGATION      -- =============================================      SELECT           agent_id,          summary_month_year,                    -- 1. TOTAL SCORE CALCULATIONS          AVG(CASE WHEN is_current_month THEN QS_TOTAL_SCORE END) AS total_mtd,          AVG(CASE WHEN is_last_month THEN QS_TOTAL_SCORE END) AS total_lm,          AVG(CASE WHEN is_r90 THEN QS_TOTAL_SCORE END) AS total_90,                    -- 2. CE SCORES          AVG(CASE WHEN is_current_month THEN CE_CATEGORY_SCORE END) AS ce_mtd,          AVG(CASE WHEN is_last_month THEN CE_CATEGORY_SCORE END) AS ce_lm,          AVG(CASE WHEN is_r90 THEN CE_CATEGORY_SCORE END) AS ce_90,                    -- 3. PA SCORES          AVG(CASE WHEN is_current_month THEN PA_CATEGORY_SCORE END) AS pa_mtd,          AVG(CASE WHEN is_last_month THEN PA_CATEGORY_SCORE END) AS pa_lm,          AVG(CASE WHEN is_r90 THEN PA_CATEGORY_SCORE END) AS pa_90,                    -- 4. RC SCORES          AVG(CASE WHEN is_current_month THEN RC_CATEGORY_SCORE END) AS rc_mtd,          AVG(CASE WHEN is_last_month THEN RC_CATEGORY_SCORE END) AS rc_lm,          AVG(CASE WHEN is_r90 THEN RC_CATEGORY_SCORE END) AS rc_90,                    -- 5. SP SCORES          AVG(CASE WHEN is_current_month THEN SP_CATEGORY_SCORE END) AS sp_mtd,          AVG(CASE WHEN is_last_month THEN SP_CATEGORY_SCORE END) AS sp_lm,          AVG(CASE WHEN is_r90 THEN SP_CATEGORY_SCORE END) AS sp_90,                    -- 6. CLOSING SUB-SCORES          AVG(CASE WHEN is_current_month THEN SP_CLOSE_SCORE END) AS close_mtd,          AVG(CASE WHEN is_last_month THEN SP_CLOSE_SCORE END) AS close_lm,          AVG(CASE WHEN is_r90 THEN SP_CLOSE_SCORE END) AS close_90,            COUNT_IF(is_last_month) AS lm_interactions                FROM (          -- =============================================          -- LAYER 1.5: ADD MONTH ASSIGNMENT FLAGS          -- =============================================          SELECT               Raw_Data.*,              Target_Months.summary_month_year,                            -- Flag: Is this record in the "current" month being summarized?              INTERACTION_DATE >= Target_Months.summary_month_year                   AND INTERACTION_DATE < DATEADD('month', 1, Target_Months.summary_month_year) AS is_current_month,                            -- Flag: Is this record in the "last" month (month before summary month)?              INTERACTION_DATE >= DATEADD('month', -1, Target_Months.summary_month_year)                  AND INTERACTION_DATE < Target_Months.summary_month_year AS is_last_month,                            -- Flag: Is this record in the rolling 90 days as of end of summary month?              INTERACTION_DATE >= DATEADD('day', -90, DATEADD('day', -1, DATEADD('month', 1, Target_Months.summary_month_year)))                  AND INTERACTION_DATE < DATEADD('month', 1, Target_Months.summary_month_year) AS is_r90                            FROM (              -- =============================================              -- LAYER 1: RAW DATA FILTER              -- =============================================              SELECT                   SC_EMPLOYEENUMBER as agent_id,                  INTERACTION_DATE,                  QS_TOTAL_SCORE,                  CE_CATEGORY_SCORE,                  PA_CATEGORY_SCORE,                  RC_CATEGORY_SCORE,                  SP_CATEGORY_SCORE,                  SP_CLOSE_SCORE              FROM DATA_LAKE.API.V_IPR_SMARTANALYTICS_QA              WHERE INTERACTION_DATE >= DATEADD('day', -120, CURRENT_DATE())  -- Need extra buffer for 90-day calc                  AND SC_EMPLOYEENUMBER IS NOT NULL          ) AS Raw_Data                    CROSS JOIN (              SELECT DATE_TRUNC('MONTH', CURRENT_DATE()) AS summary_month_year          ) AS Target_Months      ) AS Flagged_Data            GROUP BY agent_id, summary_month_year      HAVING lm_interactions > 0  )
        name: BVSTG_MYR_AGENT_PERFORMANCE_MATRIX
        noLinkRefs: []
