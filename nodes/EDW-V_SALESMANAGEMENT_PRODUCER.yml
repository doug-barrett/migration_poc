    sourceMapping:
      - aliases:
          V_SALESMANAGEMENT_PRODUCER: 94f2706d-9b0b-4922-bea3-e5fc7b0a8d74
          DS_AP1_AU_QUOTE_LASTLOGINOFFICE: 2a868454-a73a-41ea-9da1-354bbd8d13c5
          DS_AP1_TRANSACTIONSUMMARY: eb40b9b4-16a8-47be-8699-9c6c04540ac6
          DS_AMS_TRANSACTIONSUMMARY: 8e008f37-c190-498a-a875-c89efee27a0d
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('EDW','V_SALESMANAGEMENT_PRODUCER') }} AS SELECT Tr.Date AS "Date",
                   Tr.PrimaryAgentFullname AS "Producer",
                   Tr.OFFICECODE AS "Office Code",
                   Sf.OfficeName AS "OfficeName",
                   Tr.lineofbusinesstype AS "PolicyType",
                   SUM(Tr.NEWBUSINESSQUOTES) AS "NewBusinessQuotes",
                   SUM(Tr.NEWBUSINESSCOUNT) AS "NewBusinessCount",
                   SUM(Tr.RENEWALCOUNT) AS "RenewalCount",
                   SUM(Tr.PrimaryFee) AS "PrimaryFee",
                   carriername AS "Company",
                   Sf.ZipCode AS "Office_ZipCode",
                   Sf.Address AS "Office_Address",
                   Sf.districtcode AS "District",
                   Sf.districtmanagername AS "DistrictManagerName",
                   Sf.salesvp AS "SalesVP",
                   Sf.statecode AS "StateCode",
                   Sf.territorymanagername AS "TerritoryManagerName"
              FROM (
                    SELECT COUNT(1) AS NewBusinessQuotes,
                           0 AS NewBusinessCount,
                           0 AS RenewalCount,
                           0 AS PrimaryFee,
                           TO_DATE(created) AS Date,
                           fullname AS PrimaryAgentFullname,
                           OFFICECODE,
                           '' AS lineofbusinesstype,
                           '' AS carriername
                      FROM {{ ref('EDW','DS_AP1_AU_QUOTE_LASTLOGINOFFICE') }}
                     WHERE DSS_CURRENT_FLAG='Y'
                       AND YEAR(created) >= 2017
                     GROUP BY OFFICECODE,
                              fullname,
                              TO_DATE(created)
                     UNION SELECT 0 AS NewBusinessQuotes,
                           SUM(NewAutoSales) AS NewBusinessCount,
                           SUM(RenewalAutoSales) AS RenewalCount,
                           0 AS PrimaryFee,
                           TO_DATE(created) AS Date,
                           PrimaryAgentFullname,
                           BIAPrimaryAgentOffice,
                           lineofbusinesstype,
                           carriername
                      FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }}
                     WHERE DSS_CURRENT_FLAG='Y'
                       AND isLegacyTransaction = 'Native'
                       AND isVoid =0
                       AND PrimaryAgentFullname != 'CDT System'
                       AND YEAR(created) >= 2017
                     GROUP BY BIAPrimaryAgentOffice,
                              PrimaryAgentFullname,
                              TO_DATE(created),
                              PrimaryAgentFullname,
                              lineofbusinesstype,
                              carriername
                     UNION SELECT 0 AS NewBusinessQuotes,
                           0 AS NewBusinessCount,
                           0 AS RenewalCount,
                           SUM(a.Amount) AS PrimaryFee,
                           TO_DATE(a.created) AS Date,
                           b.PrimaryAgentFullname,
                           b.BIAPrimaryAgentOffice,
                           b.lineofbusinesstype,
                           b.carriername
                      FROM {{ ref('UNKNOWN','DS_AP1_AU2_TRANSACTIONITEM') }} a
                     INNER JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} b
                        ON (a.TransactionID = b.TransactionID AND a.DSS_CURRENT_FLAG='Y' AND b.DSS_CURRENT_FLAG='Y')
                     WHERE a.DSS_CURRENT_FLAG='Y'
                       AND a.isVoid =0
                       AND YEAR(a.created) >= 2017
                       AND YEAR(a.TransactionCreated)=YEAR(a.created)
                       AND MONTH(a.TransactionCreated)=MONTH(a.created)
                       AND a.isprimaryfee= 1
                       AND a.TRANSACTIONTYPE = 'New Business'
                       AND b.lineofbusinesstype IN ('Private Passenger Auto', 'Auto', 'Commercial Auto', 'Commercial Auto Policies', 'Motorcycle')
                     GROUP BY TO_DATE(a.created),
                              b.PrimaryAgentFullname,
                              b.BIAPrimaryAgentOffice,
                              b.lineofbusinesstype,
                              b.carriername
                     UNION SELECT SUM(CASE WHEN CODEDEFINITION='QuoteType' AND TranTypeCode IN ('NBS','REW') THEN 1 ELSE 0 END) AS NewBusinessQuotes,
                           SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('NBS','REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' AND PolicyType = 'Private Passenger Auto' THEN 1 ELSE 0 END) AS NewBusinessCount,
                           SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('RWL') THEN 1 ELSE 0 END) AS RenewalCount,
                           SUM(CASE WHEN CODEDEFINITION='FeeType' AND TranTypeCode IN ('NBS','REW') THEN FeeAmt ELSE 0 END)PrimaryFee,
                           TO_DATE(TransactionDate) AS Date,
                           CASE WHEN CODEDEFINITION='QuoteType' THEN Executive
                                ELSE Broker
                                 END AS BIAPrimaryAgentOffice,
                           OFFICECODE,
                           PolicyType,
                           Company
                      FROM {{ ref('EDW','DS_AMS_TRANSACTIONSUMMARY') }}
                     WHERE DSS_CURRENT_FLAG='Y'
                       AND PolicyType IN ('Private Passenger Auto','Auto','Auto Commercial Auto', 'Commercial Auto Policies', 'Motorcycle')
                       AND YEAR(TransactionDate) >= 2017
                       AND OFFICECODE IS NOT NULL
                       AND TranTypeCode IN ('NBS','REW','RWL')
                     GROUP BY TO_DATE(TransactionDate),
                              CASE WHEN CODEDEFINITION='QuoteType' THEN Executive
                                   ELSE Broker
                                    END,
                              OFFICECODE,
                              PolicyType,
                              Company
                   )Tr
             INNER JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} Sf
                ON (Tr.OFFICECODE = Sf.officecode AND sf.DSS_CURRENT_FLAG='Y')
             GROUP BY Tr.Date,
                      Tr.PrimaryAgentFullname,
                      Tr.OFFICECODE,
                      Sf.OfficeName,
                      carriername,
                      Sf.ZipCode,
                      Sf.Address,
                      Sf.districtcode,
                      Sf.districtmanagername,
                      Sf.salesvp,
                      Sf.statecode,
                      Sf.territorymanagername,
                      Tr.lineofbusinesstype
        dependencies:
          - locationName: EDW
            nodeName: DS_AMS_TRANSACTIONSUMMARY
          - locationName: EDW
            nodeName: DS_AP1_AU_QUOTE_LASTLOGINOFFICE
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: UNKNOWN
            nodeName: DS_AP1_AU2_TRANSACTIONITEM
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_AMS_TRANSACTIONSUMMARY') }}
            {{ ref('EDW','DS_AP1_AU_QUOTE_LASTLOGINOFFICE') }}
            {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }}
            {{ ref('UNKNOWN','DS_AP1_AU2_TRANSACTIONITEM') }}
            {{ ref('EDW','DS_RETAIL_OFFICE') }}
