      join:
        joinCondition: |-
          FROM {{ ref('TABLEAU', 'Account') }} "Account"
          LEFT JOIN {{ ref('TABLEAU', 'AccountHierarchy_OMNIA') }} "AccountHierarchy_OMNIA"
            ON ACCOUNT.LEVEL1FORCEID = ACCOUNTHIERARCHY_OMNIA.FORCEID
          LEFT JOIN {{ ref('TABLEAU', 'SalesTerritory') }} "SalesTerritory"
            ON ACCOUNT.TERRITORYID = SALESTERRITORY.TERRITORYID
          LEFT JOIN {{ ref('TABLEAU', 'FinancialSalesTerritory') }} "FinancialSalesTerritory"
            ON ACCOUNT.TERRITORYIDFINANCIAL = FINANCIALSALESTERRITORY.FINANCIALTERRITORYID
          LEFT JOIN {{ ref('LOAD', 'AggLevel1_ContractId_Actuals') }} "AggLevel1_ContractId_Actuals"
            ON ACCOUNT.FORCEID = AGGLEVEL1_CONTRACTID_ACTUALS.LEVEL1FORCEID
          LEFT JOIN {{ ref('TABLEAU', 'Contract') }} "Contract"
            ON AGGLEVEL1_CONTRACTID_ACTUALS.CONTRACTID = CONTRACT.CONTRACTID
          LEFT JOIN {{ ref('TABLEAU', 'Supplier') }} "Supplier"
            ON CONTRACT.SUPPLIERID = SUPPLIER.SUPPLIERID
