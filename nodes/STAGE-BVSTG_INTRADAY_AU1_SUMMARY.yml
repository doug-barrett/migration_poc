      - aliases:
          DS_PCCE_TERMINATION_CALL_AGENT_SESSION: 4e775929-6773-40a3-a0f9-20c8adfa1f05
          DS_AGENT_KEY: e03830da-869e-4c69-8cc5-0b677f38927e
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_AGENT_SESSION
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} ds_pcce_termination_call_agent_session
             INNER JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
                ON (ds_pcce_termination_call_agent_session.AGENT = ds_agent_key.CISCO_LOGINNAME)
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ds_pcce_termination_call_agent_session.AGENTOFFICE = ds_retail_office.OfficeCode
             WHERE DATE(ds_pcce_termination_call_agent_session.STARTDATETIME) >= '2019-01-01'
               AND ds_pcce_termination_call_agent_session.ISINTERNALCALL = 0
             GROUP BY ds_agent_key.EmployeeNumber ,
                      DATE(ds_pcce_termination_call_agent_session.STARTDATETIME) ,
                      HOUR(ds_pcce_termination_call_agent_session.STARTDATETIME)
        name: SRC_bvstg_intraday_au1_calls
        noLinkRefs: []
      - aliases:
          DS_INTERACTIONSUMMARY: e1751fec-5c3b-4a31-a764-d3b471a0944b
          DS_AGENT_KEY: e03830da-869e-4c69-8cc5-0b677f38927e
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: EDW
            nodeName: DS_INTERACTIONSUMMARY
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_INTERACTIONSUMMARY') }} ds_interactionsummary
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
                ON ds_interactionsummary.FIRSTLOCALUSERID = ds_agent_key.CISCO_LOGINNAME
               AND ds_agent_key.RANK_EMPLOYEENUMBER = 1
             WHERE SourceDb ='I3'
               AND DATE(STARTDATETIME) >= '2019-01-01'
               AND FIRSTAGENTOFFICE IS NOT NULL
             GROUP BY DATE(STARTDATETIME) ,
                      HOUR(STARTDATETIME) ,
                      FIRSTAGENTOFFICE ,
                      ds_agent_key.EmployeeNumber
        name: SRC_bvstg_intraday_au1_i3_calls
