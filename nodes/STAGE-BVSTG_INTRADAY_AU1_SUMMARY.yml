        dependencies:
          - locationName: EDW
            nodeName: FACT_RETAIL_SUMMARY
        join:
          joinCondition: |-
            FROM {{ ref('EDW','FACT_RETAIL_SUMMARY') }} fact_retail_summary
             WHERE DATE(fact_retail_summary.CreatedDate) >= '2019-01-01'
               AND fact_retail_summary.SourceDB IN ('AppOne','CIGH','ConfieHub')
             GROUP BY fact_retail_summary.PrimaryAgentUltipro_Broker ,
                      DATE(fact_retail_summary.CreatedDatetime) , (HOUR(fact_retail_summary.CreatedDatetime) - CASE WHEN SourceDB='CIGH' AND HOUR(fact_retail_summary.CreatedDatetime) >=2 THEN 2 ELSE 0 END) , fact_retail_summary.OfficeCode
        name: SRC_bvstg_intraday_au1_sales
        noLinkRefs: []
