            nodeName: V_PREB_INTRADAY_SALETYPE
          - locationName: UNKNOWN
            nodeName: V_PREB_INTRADAY_SALETYPE
        join:
          joinCondition: |-
            FROM {{ ref('UNKNOWN','V_PREB_INTRADAY_SALETYPE') }} v_preb_intraday_saletype
             GROUP BY PRIMARYAGENTULTIPRO_BROKER ,
                      DATE(CREATEDDATE) , (HOUR(CREATEDDATE) - CASE WHEN SourceDB='CIGH' AND HOUR(CREATEDDATE) >=2 THEN 2 ELSE 0 END) , v_preb_intraday_saletype.OfficeCode
        name: SRC_bvstg_intraday_au1_saletype
        noLinkRefs: []
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
        join:
          joinCondition: |-
            FROM (
                    SELECT coalesce(DS_POLICYSUMMARY_V2.producerid, DS_TRANSACTIONERROR_SUMMARY.ULTIPRO,DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.EMPLOYEENUMBER) ULTIPRO ,
                           coalesce(DS_POLICYSUMMARY_V2.Date,DS_TRANSACTIONERROR_SUMMARY.Created,DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.Date) Created ,
                           coalesce(DS_POLICYSUMMARY_V2.BIAPRIMARYAGENTOFFICE,DS_TRANSACTIONERROR_SUMMARY.OFFICECODE,DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.OFFICECODE) OFFICECODE ,
                           SUM(IFNULL(DS_POLICYSUMMARY_V2.Cancellation_90Days,0))Cancellation_90Days ,
                           SUM(IFNULL(DS_TRANSACTIONERROR_SUMMARY.QC_Errors,0))QC_Errors ,
                           SUM(IFNULL(DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.LOGGEDONTIME,0))LOGGEDONTIME ,
                           SUM(IFNULL(DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.NOTREADYTIME,0))NOTREADYTIME
                      FROM(
                            SELECT producerid ,
                                   DATE(CREATED) AS Date ,
                                   0 AS HOUR ,
                                   BIAPRIMARYAGENTOFFICE ,
                                   SUM(CASE WHEN IFNULL(FLAG_91_RETENTION_W_LOB,'') = 'N' THEN 1 ELSE 0 END) Cancellation_90Days
                              FROM RETAIL_PROD.SCH_EDW.DS_POLICYSUMMARY_V2
                             WHERE DATE(CREATED) >='2021-11-01'
                             GROUP BY producerid ,
                                      DATE(CREATED) ,
                                      BIAPRIMARYAGENTOFFICE
                           )DS_POLICYSUMMARY_V2
                      FULL JOIN (
                            SELECT ULTIPRO ,
                                   DATE(CREATED) Created ,
                                   0 HOUR ,
                                   OFFICECODE ,
                                   SUM(WITH_ERROR) QC_Errors
                              FROM RETAIL_PROD.SCH_EDW.DS_TRANSACTIONERROR_SUMMARY
                             WHERE DATE(CREATED) >='2021-11-01'
                               AND WITH_ERROR > 0
                             GROUP BY ULTIPRO ,
                                      DATE(CREATED) ,
                                      OFFICECODE
                           )DS_TRANSACTIONERROR_SUMMARY
                        ON DS_POLICYSUMMARY_V2.producerid = DS_TRANSACTIONERROR_SUMMARY.ULTIPRO
                       AND DS_POLICYSUMMARY_V2.Date = DS_TRANSACTIONERROR_SUMMARY.Created
                       AND DS_POLICYSUMMARY_V2.BIAPRIMARYAGENTOFFICE = DS_TRANSACTIONERROR_SUMMARY.OFFICECODE
                      FULL JOIN (
                            SELECT EMPLOYEENUMBER ,
                                   DATE(DATE) DATE , 0 HOUR ,
                                   OFFICECODE ,
                                   SUM(LOGGEDONTIME) LOGGEDONTIME ,
                                   SUM(NOTREADYTIME) NOTREADYTIME
                              FROM RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY
                             WHERE DATE(DATE) >='2021-11-01'
                             GROUP BY EMPLOYEENUMBER ,
                                      DATE(DATE) ,
                                      OFFICECODE
                           )DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY
                        ON IFNULL(DS_POLICYSUMMARY_V2.producerid, DS_TRANSACTIONERROR_SUMMARY.ULTIPRO) = DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.EMPLOYEENUMBER
                       AND IFNULL(DS_POLICYSUMMARY_V2.Date,DS_TRANSACTIONERROR_SUMMARY.Created) = DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.DATE
                       AND IFNULL(DS_POLICYSUMMARY_V2.BIAPRIMARYAGENTOFFICE,DS_TRANSACTIONERROR_SUMMARY.OFFICECODE) = DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.OFFICECODE
                     GROUP BY coalesce(DS_POLICYSUMMARY_V2.producerid, DS_TRANSACTIONERROR_SUMMARY.ULTIPRO,DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.EMPLOYEENUMBER) ,
                              coalesce(DS_POLICYSUMMARY_V2.Date,DS_TRANSACTIONERROR_SUMMARY.Created,DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.Date) ,
                              coalesce(DS_POLICYSUMMARY_V2.BIAPRIMARYAGENTOFFICE,DS_TRANSACTIONERROR_SUMMARY.OFFICECODE,DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.OFFICECODE)
                   )DS_POLICYSUMMARY_V2
        name: SRC_bvstg_intraday_au1_errors_90days
        noLinkRefs: []
