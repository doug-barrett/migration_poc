      - aliases:
          FACT_RETAIL_SUMMARY: 014973a9-ba3d-4491-93da-30364e8fec27
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: FACT_RETAIL_SUMMARY
        join:
          joinCondition: |-
            FROM {{ ref('EDW','FACT_RETAIL_SUMMARY') }} fact_retail_summary
             WHERE DATE(fact_retail_summary.CreatedDate) >= '2019-01-01'
               AND fact_retail_summary.SourceDB IN ('AppOne','CIGH','ConfieHub')
             GROUP BY fact_retail_summary.PrimaryAgentUltipro_Broker ,
                      DATE(fact_retail_summary.CreatedDatetime) , (HOUR(fact_retail_summary.CreatedDatetime) - CASE WHEN SourceDB='CIGH' AND HOUR(fact_retail_summary.CreatedDatetime) >=2 THEN 2 ELSE 0 END) , fact_retail_summary.OfficeCode
        name: SRC_bvstg_intraday_au1_sales
        noLinkRefs: []
      - aliases:
          DS_RAM_RETAIL_REPOSITORY: d29a0c5c-e296-46c4-bc55-861d60fe906d
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
             WHERE ds_ram_retail_repository.ClassificationGroup IN ('WFH Transfer','New Transfer')
               AND DATE(ds_ram_retail_repository.CreatedDate) >= '2019-01-01'
               AND ds_ram_retail_repository.SourceDB IN ('AppOne','CIGH','ConfieHub')
             GROUP BY ds_ram_retail_repository.TRANSFER_EMPLOYEENUMBER ,
                      DATE(ds_ram_retail_repository.CREATEDDATE) , (HOUR(ds_ram_retail_repository.CREATEDDATE) - CASE WHEN ds_ram_retail_repository.SourceDB='CIGH' AND HOUR(ds_ram_retail_repository.CREATEDDATE) >=2 THEN 2 ELSE 0 END)
        name: SRC_bvstg_intraday_au1_transfermade
        noLinkRefs: []
      - aliases:
