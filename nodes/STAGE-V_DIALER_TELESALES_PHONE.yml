          DS_CUSTOMERSUMMARY_V2: c5a432da-156b-460f-ba67-985b9517bedb
          BVSTG_DIALER_AU1_TELESALES: e6fa9922-4b44-4396-bf50-be33fb6c6e96
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_DIALER_TELESALES_PHONE') }} AS SELECT CUSTOMERID,
                   PHONE,
                   RANK() OVER (PARTITION BY CUSTOMERID ORDER BY ordering) Rank
              FROM (
                    SELECT CUSTOMERID,
                           HOMEPHONE PHONE,
                           1 ordering
                      FROM {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} a
                     INNER JOIN {{ ref('STAGE','BVSTG_DIALER_AU1_TELESALES') }} b
                        ON b.C_CUSTOMERID = a.CUSTOMERID
                     WHERE HOMEPHONE IS NOT NULL
                       AND SourceDB = 'AppOne'
                     UNION SELECT CUSTOMERID,
                           CELLPHONE PHONE,
                           2 ordering
                      FROM {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} a
                     INNER JOIN {{ ref('STAGE','BVSTG_DIALER_AU1_TELESALES') }} b
                        ON b.C_CUSTOMERID = a.CUSTOMERID
                     WHERE CELLPHONE IS NOT NULL
                       AND IFNULL(HOMEPHONE,'') != IFNULL(CELLPHONE,'')
                       AND SourceDB = 'AppOne'
                     UNION SELECT CUSTOMERID,
                           CONTACTPHONE PHONE,
                           3 ordering
                      FROM {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} a
                     INNER JOIN {{ ref('STAGE','BVSTG_DIALER_AU1_TELESALES') }} b
                        ON b.C_CUSTOMERID = a.CUSTOMERID
                     WHERE CONTACTPHONE IS NOT NULL
                       AND IFNULL(HOMEPHONE,'') != IFNULL(CONTACTPHONE,'')
                       AND IFNULL(CONTACTPHONE,'') != IFNULL(CELLPHONE,'')
                       AND SourceDB = 'AppOne'
                   )
        dependencies:
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
          - locationName: STAGE
            nodeName: BVSTG_DIALER_AU1_TELESALES
        join:
