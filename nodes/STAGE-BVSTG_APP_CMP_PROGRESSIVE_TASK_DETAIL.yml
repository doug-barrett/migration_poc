        join:
          joinCondition: |-
            FROM {{ ref('STAGE','DS_BVSTG_APP_CMP_PROGRESSIVE_TASK') }} DS_BVSTG_APP_CMP_PROGRESSIVE_TASK
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY DS_AP1_TRANSACTIONSUMMARY
                ON DS_AP1_TRANSACTIONSUMMARY.TRANSACTIONTYPE IN('New Business','Renewal')
               AND DS_BVSTG_APP_CMP_PROGRESSIVE_TASK.policy_number = DS_AP1_TRANSACTIONSUMMARY.policynumber
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE DS_RETAIL_OFFICE
                ON DS_AP1_TRANSACTIONSUMMARY.PRIMARYAGENTOFFICE = DS_RETAIL_OFFICE.officecode
             WHERE DS_BVSTG_APP_CMP_PROGRESSIVE_TASK.DATE <= CURRENT_DATE()
               AND DS_BVSTG_APP_CMP_PROGRESSIVE_TASK.enddate >= CURRENT_DATE() QUALIFY ROW_NUMBER() OVER (PARTITION BY DS_BVSTG_APP_CMP_PROGRESSIVE_TASK.POLICY_NUMBER ORDER BY DS_AP1_TRANSACTIONSUMMARY.CREATED DESC)=1
