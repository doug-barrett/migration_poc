    sourceMapping:
    - aliases:
        LOCATION: fc31ae84-5b0b-5e1e-b998-bb5742721756
        ADDRESS: 90cc3016-dd03-5a43-885f-e199d834b092
        CDC_SYSLOCFL: 54f949e6-bb8b-54a0-9fb6-2cc9b0efd762
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: LOCATION
        - locationName: GOLD
          nodeName: ADDRESS
        - locationName: GOLD
          nodeName: CDC_SYSLOCFL
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'CDC_SYSLOCFL') }} "CDC_SYSLOCFL"
          
          UNION
          
          SELECT  DISTINCT
          JOURNAL_TYPE,
          JOURNAL_BEGIN_DATE,
          JOURNAL_END_DATE,
          ZLLOC			  AS LOCATION_CODE,
          TRIM(ZLCMP)		  AS COMPANY_CODE,
          'E'			  AS ADDRESS_TYPE_CODE,
          COALESCE(TRIM(ZLMAIL),'') AS ADDRESS_TEXT_1,
          CAST('' AS VARCHAR(100))  AS ADDRESS_TEXT_2,
          CAST('' AS VARCHAR(50))   AS CITY_CODE,
          CAST('' AS CHAR(2)) 	  AS STATE_CODE,
          CAST('' AS VARCHAR(50))   AS POSTAL_CODE,
          CAST('' AS VARCHAR(3))	  AS COUNTRY_CODE,
          CAST(0 AS INTEGER) 	  AS AREA_CODE,
          CAST(0 AS INTEGER) 	  AS PHONE_NUM
          FROM {{ ref('GOLD', 'CDC_SYSLOCFL') }} "CDC_SYSLOCFL"
          WHERE TRIM(ZLMAIL) LIKE '_%@__%.__%'
          
          UNION
          
          SELECT  DISTINCT
          JOURNAL_TYPE,
          JOURNAL_BEGIN_DATE,
          JOURNAL_END_DATE,
          ZLLOC			 AS LOCATION_CODE,
          TRIM(ZLCMP)		 AS COMPANY_CODE,
          'T'			 AS ADDRESS_TYPE_CODE,
          CAST('' AS VARCHAR(100)) AS ADDRESS_TEXT_1,
          CAST('' AS VARCHAR(100)) AS ADDRESS_TEXT_2,
          CAST('' AS VARCHAR(50))  AS CITY_CODE,
          CAST('' AS CHAR(2)) 	 AS STATE_CODE,
          CAST('' AS VARCHAR(50))  AS POSTAL_CODE,
          CAST('' AS VARCHAR(3))	 AS COUNTRY_CODE,
          ZEROIFNULL(ZLAREA) AS AREA_CODE,
          ZEROIFNULL(ZLPHON) AS PHONE_NUM
          FROM  {{ ref('GOLD', 'CDC_SYSLOCFL') }} "CDC_SYSLOCFL"
          WHERE AREA_CODE > 99 AND PHONE_NUM > 999999 
          
          UNION
          
          SELECT  DISTINCT
          JOURNAL_TYPE,
          JOURNAL_BEGIN_DATE,
          JOURNAL_END_DATE,
          ZLLOC			 AS LOCATION_CODE,
          TRIM(ZLCMP)		 AS COMPANY_CODE,
          'F'			 AS ADDRESS_TYPE_CODE,
          CAST('' AS VARCHAR(100)) AS ADDRESS_TEXT_1,
          CAST('' AS VARCHAR(100)) AS ADDRESS_TEXT_2,
          CAST('' AS VARCHAR(50))  AS CITY_CODE,
          CAST('' AS CHAR(2)) 	 AS STATE_CODE,
          CAST('' AS VARCHAR(50))  AS POSTAL_CODE,
          CAST('' AS VARCHAR(3))	 AS COUNTRY_CODE,
          ZEROIFNULL(ZLFAXA) AS AREA_CODE,
          ZEROIFNULL(ZLFAX0) AS PHONE_NUM
          FROM  {{ ref('GOLD', 'CDC_SYSLOCFL') }} "CDC_SYSLOCFL"
          WHERE AREA_CODE > 99 AND PHONE_NUM > 999999 
          
          ) AS TEMPTABLE
          
          INNER JOIN {{ ref('GOLD', 'ADDRESS') }} "ADDRESS"
          ON   UPPER(ADDRESS.ADDRESS_TYPE_CODE) =  UPPER(TEMPTABLE.ADDRESS_TYPE_CODE)
          AND  UPPER(ADDRESS.ADDRESS_TEXT_1)  =  UPPER(TEMPTABLE.ADDRESS_TEXT_1)
          AND  UPPER(ADDRESS.ADDRESS_TEXT_2)  =  UPPER(TEMPTABLE.ADDRESS_TEXT_2)
          AND  UPPER(ADDRESS.CITY_CODE) =  UPPER(TEMPTABLE.CITY_CODE)
          AND  UPPER(ADDRESS.STATE_CODE) =  UPPER(TEMPTABLE.STATE_CODE)
          AND  UPPER(ADDRESS.POSTAL_CODE) =  UPPER(TEMPTABLE.POSTAL_CODE)
          AND ADDRESS.AREA_CODE = TEMPTABLE.AREA_CODE
          AND ADDRESS.PHONE_NUM = TEMPTABLE.PHONE_NUM
          AND  UPPER(ADDRESS.COUNTRY_CODE) =  UPPER(TEMPTABLE.COUNTRY_CODE)
          
          INNER JOIN {{ ref('GOLD', 'LOCATION') }} "LOCATION"
          ON  LOCATION.LOCATION_CODE = TEMPTABLE.LOCATION_CODE
          AND LOCATION.COMPANY_CODE = TEMPTABLE.COMPANY_CODE
          AND LOCATION.DSS_CURRENT_FLAG = 'Y'
      name: STG_LOCATION_ADDRESS
      noLinkRefs: []
