      join:
        joinCondition: "FROM {{ ref('GOLD', 'CDC_SYSLOCFL') }} \"CDC_SYSLOCFL\"\n\
          FROM {{ ref('GOLD', 'CDC_SYSLOCFL') }} \"CDC_SYSLOCFL\"\n  WHERE TRIM(ZLMAIL)\
          \ LIKE '_%@__%.__%'\n\nUNION\n\nSELECT  DISTINCT\nJOURNAL_TYPE,\nJOURNAL_BEGIN_DATE,\n\
          JOURNAL_END_DATE,\nZLLOC\t\t\t AS LOCATION_CODE,\nTRIM(ZLCMP)\t\t AS COMPANY_CODE,\n\
          'T'\t\t\t AS ADDRESS_TYPE_CODE,\nCAST('' AS VARCHAR(100)) AS ADDRESS_TEXT_1,\n\
          CAST('' AS VARCHAR(100)) AS ADDRESS_TEXT_2,\nCAST('' AS VARCHAR(50))  AS\
          \ CITY_CODE,\nCAST('' AS CHAR(2)) \t AS STATE_CODE,\nCAST('' AS VARCHAR(50))\
          \  AS POSTAL_CODE,\nCAST('' AS VARCHAR(3))\t AS COUNTRY_CODE,\nZEROIFNULL(ZLAREA)\
          \ AS AREA_CODE,\nZEROIFNULL(ZLPHON) AS PHONE_NUM\nFROM {{ ref('GOLD', 'CDC_SYSLOCFL')\
          \ }} \"CDC_SYSLOCFL\"\n  WHERE AREA_CODE > 99 AND PHONE_NUM > 999999 \n\n\
          UNION\n\nSELECT  DISTINCT\nJOURNAL_TYPE,\nJOURNAL_BEGIN_DATE,\nJOURNAL_END_DATE,\n\
          ZLLOC\t\t\t AS LOCATION_CODE,\nTRIM(ZLCMP)\t\t AS COMPANY_CODE,\n'F'\t\t\
          \t AS ADDRESS_TYPE_CODE,\nCAST('' AS VARCHAR(100)) AS ADDRESS_TEXT_1,\n\
          CAST('' AS VARCHAR(100)) AS ADDRESS_TEXT_2,\nCAST('' AS VARCHAR(50))  AS\
          \ CITY_CODE,\nCAST('' AS CHAR(2)) \t AS STATE_CODE,\nCAST('' AS VARCHAR(50))\
          \  AS POSTAL_CODE,\nCAST('' AS VARCHAR(3))\t AS COUNTRY_CODE,\nZEROIFNULL(ZLFAXA)\
          \ AS AREA_CODE,\nZEROIFNULL(ZLFAX0) AS PHONE_NUM\nFROM {{ ref('GOLD', 'CDC_SYSLOCFL')\
          \ }} \"CDC_SYSLOCFL\"\n  WHERE AREA_CODE > 99 AND PHONE_NUM > 999999 \n\n\
          ) AS TEMPTABLE\nINNER JOIN {{ ref('GOLD', 'ADDRESS') }} \"ADDRESS\"\n  ON\
          \   UPPER(\"ADDRESS\".\"ADDRESS_TYPE_CODE\") =  UPPER(\"TEMPTABLE\".\"ADDRESS_TYPE_CODE\"\
          )\nAND  UPPER(\"ADDRESS\".\"ADDRESS_TEXT_1\")  =  UPPER(\"TEMPTABLE\".\"\
          ADDRESS_TEXT_1\")\nAND  UPPER(\"ADDRESS\".\"ADDRESS_TEXT_2\")  =  UPPER(\"\
          TEMPTABLE\".\"ADDRESS_TEXT_2\")\nAND  UPPER(\"ADDRESS\".\"CITY_CODE\") =\
          \  UPPER(\"TEMPTABLE\".\"CITY_CODE\")\nAND  UPPER(\"ADDRESS\".\"STATE_CODE\"\
          ) =  UPPER(\"TEMPTABLE\".\"STATE_CODE\")\nAND  UPPER(\"ADDRESS\".\"POSTAL_CODE\"\
          ) =  UPPER(\"TEMPTABLE\".\"POSTAL_CODE\")\nAND \"ADDRESS\".\"AREA_CODE\"\
          \ = \"TEMPTABLE\".\"AREA_CODE\"\nAND \"ADDRESS\".\"PHONE_NUM\" = \"TEMPTABLE\"\
          .\"PHONE_NUM\"\nAND  UPPER(\"ADDRESS\".\"COUNTRY_CODE\") =  UPPER(\"TEMPTABLE\"\
          .\"COUNTRY_CODE\")\nINNER JOIN {{ ref('GOLD', 'LOCATION') }} \"LOCATION\"\
          \n  ON  \"LOCATION\".\"LOCATION_CODE\" = \"TEMPTABLE\".\"LOCATION_CODE\"\
          \nAND \"LOCATION\".\"COMPANY_CODE\" = \"TEMPTABLE\".\"COMPANY_CODE\"\nAND\
          \ \"LOCATION\".\"DSS_CURRENT_FLAG\" = 'Y'"
