          - columnReferences: []
            transform: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT PAYMENTID,
                           PAYMENTDATE,
                           TRANSACTIONID,
                           SITEID,
                           OFFICECODE
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_APPONEPAYMENTS_DETAIL_CURRENT
                     UNION SELECT ProductionID*-1,
                           PAYMENTDATE,
                           0,
                           SITEID,
                           OFFICECODE
                      FROM RETAIL_PROD.SCH_EDW.V_PREB_DEPOSIT_PRODUCTION
                     WHERE PAYMENTS IS NULL
                   )V_DLBV_CFA_APPONEPAYMENTS_DETAIL_CURRENT
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_PAYMENT ds_bvstg_ap1_payment
                ON ds_bvstg_ap1_payment.PaymentID = V_DLBV_CFA_APPONEPAYMENTS_DETAIL_CURRENT.PaymentID
               AND ds_bvstg_ap1_payment.ISVOID_PAYMENT = 0
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_PRODUCTION_CURRENT V_DLBV_CFA_PRODUCTION_CURRENT
                ON (V_DLBV_CFA_APPONEPAYMENTS_DETAIL_CURRENT.SiteID = V_DLBV_CFA_PRODUCTION_CURRENT.SiteID AND DATE(V_DLBV_CFA_APPONEPAYMENTS_DETAIL_CURRENT.PaymentDate) = V_DLBV_CFA_PRODUCTION_CURRENT.PaymentDate)
              LEFT JOIN RETAIL_PROD.SCH_EDW.V_PREB_DEPOSIT_PRODUCTION V_PREB_DEPOSIT_PRODUCTION
                ON V_PREB_DEPOSIT_PRODUCTION.ProductionID = V_DLBV_CFA_PRODUCTION_CURRENT.ProductionID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_BANKFILE_CURRENT V_DLBV_CFA_BANKFILE_CURRENT
                ON V_DLBV_CFA_BANKFILE_CURRENT.ProductionID = V_DLBV_CFA_PRODUCTION_CURRENT.ProductionID
             INNER JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE DS_RETAIL_OFFICE
                ON (V_DLBV_CFA_APPONEPAYMENTS_DETAIL_CURRENT.OfficeCode = DS_RETAIL_OFFICE.OfficeCode)
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY DS_AP1_TRANSACTIONSUMMARY
                ON DS_AP1_TRANSACTIONSUMMARY.transactionID = V_DLBV_CFA_APPONEPAYMENTS_DETAIL_CURRENT.transactionID
              LEFT JOIN (
                    SELECT a.FollowUpID,
                           a.ProductionID,
                           b.Qty
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_FOLLOWUP_CURRENT AS a
                     INNER JOIN (
                            SELECT ProductionID,
                                   MAX(FollowUpID) AS FollowUpID,
                                   COUNT(1) AS Qty
                              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_FOLLOWUP_CURRENT
                             GROUP BY ProductionID
                           ) AS b
                        ON a.FollowUpID = b.FollowUpID
                   ) V_DLBV_CFA_FOLLOWUP_CURRENT
                ON (V_DLBV_CFA_PRODUCTION_CURRENT.ProductionID = V_DLBV_CFA_FOLLOWUP_CURRENT.ProductionID)
              LEFT JOIN ( SELECT to_varchar(DS_RAM_RETAIL_REPOSITORY.TransactionID) TransactionID,
                   DS_BVSTG_COMM_CARRIERMAPPING.CARRIERNAME_GROUPED CARRIERNAME,
                   CASE WHEN DS_MKT_LEAD_SOURCE.LEADSOURCE IN ('Cust TimeStamp (i)','Cust TimeStamp (o)','Cust TimeStamp (u)','Cust/User (i)', 'Cust/User (o)','Cust/User (u)','Phone AppOne') THEN 'Phone'
                        WHEN DS_MKT_LEAD_SOURCE.LEADSOURCE IN ('Web', 'LMS (email)', 'LMS (Phone)')                                                                                            THEN 'Web'
                        WHEN DS_MKT_LEAD_SOURCE.LEADSOURCE = ''                                                                                                                                THEN 'Unknown'
                        ELSE NULL
                         END LEADSOURCE,
                   DS_RAM_RETAIL_REPOSITORY.CUSTOMERTYPE,
                   date(date_trunc('MONTH', DS_RAM_RETAIL_REPOSITORY.TRANSACTIONDATE)) ASOFMONTH,
                   DS_RAM_RETAIL_REPOSITORY.CUSTOMERID
              FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY DS_RAM_RETAIL_REPOSITORY
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_LEAD_SOURCE DS_MKT_LEAD_SOURCE
                ON to_varchar(DS_MKT_LEAD_SOURCE.LEADID) = to_varchar(DS_RAM_RETAIL_REPOSITORY.LEADID)
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_COMM_CARRIERMAPPING DS_BVSTG_COMM_CARRIERMAPPING
                ON DS_BVSTG_COMM_CARRIERMAPPING.CARRIERNAME = DS_RAM_RETAIL_REPOSITORY.CARRIERNAME
               AND DS_BVSTG_COMM_CARRIERMAPPING.SOURCE = 'EDW'
             WHERE DS_RAM_RETAIL_REPOSITORY.TransactionType = 'New Business'
               AND CLASSIFICATIONGROUP = 'New Business'
