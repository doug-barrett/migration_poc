                          WHEN S_AP1_ENTITYCUSTOMFIELDSVALUES.MailingState='FL' AND S_AP1_ENTITYCUSTOMFIELDSVALUES.ANSWERS='Yes' THEN 'FWYFL-HE-REF-ZDC-E-06390'
                          WHEN S_AP1_ENTITYCUSTOMFIELDSVALUES.MailingState='AZ' AND S_AP1_ENTITYCUSTOMFIELDSVALUES.ANSWERS='Yes' THEN 'FWYAZ-A-REF-ZDC-E-06427'
