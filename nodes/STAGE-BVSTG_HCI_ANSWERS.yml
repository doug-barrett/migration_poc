                          WHEN S_AP1_ENTITYCUSTOMFIELDSVALUES.MailingState='WA' AND S_AP1_ENTITYCUSTOMFIELDSVALUES.ANSWERS='No'  THEN 'FWYWA-HE-REF-ZDC-E-06393'
                          WHEN S_AP1_ENTITYCUSTOMFIELDSVALUES.MailingState='TX' AND S_AP1_ENTITYCUSTOMFIELDSVALUES.ANSWERS='No'  THEN 'FWYTX-HE-REF-ZDC-E-06392'
