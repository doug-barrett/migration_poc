        dependencies:
          - locationName: DATA_VAULT
            nodeName: S_AP1_ENTITYCUSTOMFIELDVALUE
          - locationName: DATA_VAULT
            nodeName: REF_AP1_ENTITYTYPE
          - locationName: DATA_VAULT
            nodeName: S_AP1_LEAD_MROC
          - locationName: STAGE
            nodeName: V_S_AP1_CUSTOMERADDRESS_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_ADDRESS_MROC_CURRENT
          - locationName: DATA_VAULT
            nodeName: REF_AP1_USSTATE
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT S_AP1_LEAD_MROC.LeadID ,
                   S_AP1_LEAD_MROC.Created ,
                   S_AP1_LEAD_MROC.StateCode ,
                   REF_AP1_CUSTOMFIELD.Name ,
                   s_ap1_entitycustomfieldvalue.ValueString ANSWERS ,
                   S_AP1_LEAD_MROC.CustomerID ,
                   CASE WHEN CHARINDEX('Health', DS_CUSTOMERSUMMARY_V2.FIRSTNAME) != 0 THEN LEFT(DS_CUSTOMERSUMMARY_V2.FIRSTNAME, CHARINDEX('Health', DS_CUSTOMERSUMMARY_V2.FIRSTNAME))
                        ELSE DS_CUSTOMERSUMMARY_V2.FIRSTNAME
                         END AS FIRSTNAME ,
                   CASE WHEN CHARINDEX('Health', DS_CUSTOMERSUMMARY_V2.MIDdleName) != 0 THEN LEFT(DS_CUSTOMERSUMMARY_V2.MIDDLENAME, CHARINDEX('Health', DS_CUSTOMERSUMMARY_V2.MIDDLENAME))
                        ELSE DS_CUSTOMERSUMMARY_V2.MIDDLENAME
                         END AS MIDDLENAME ,
                   CASE WHEN CHARINDEX('Health', DS_CUSTOMERSUMMARY_V2.LASTNAME) != 0 THEN LEFT(DS_CUSTOMERSUMMARY_V2.LASTNAME, CHARINDEX('Health', DS_CUSTOMERSUMMARY_V2.LASTNAME))
                        ELSE DS_CUSTOMERSUMMARY_V2.LASTNAME
                         END AS LASTNAME ,
                   COALESCE(DS_CUSTOMERSUMMARY_V2.Homephone , DS_CUSTOMERSUMMARY_V2.Cellphone , DS_CUSTOMERSUMMARY_V2.ContactPhone) AS Customer_PhoneNumber ,
                   DS_CUSTOMERSUMMARY_V2.Email ,
                   DS_CUSTOMERSUMMARY_V2.MailingZip ,
                   DS_CUSTOMERSUMMARY_V2.MailingState ,
                   s_ap1_entitycustomfieldvalue.LastUpdated ,
                   s_ap1_entitycustomfieldvalue.CreatedBy ,
                   s_ap1_entitycustomfieldvalue.LastUpdatedBy
              FROM {{ ref('DATA_VAULT','S_AP1_ENTITYCUSTOMFIELDVALUE') }} s_ap1_entitycustomfieldvalue
             INNER JOIN {{ ref('DATA_VAULT','REF_AP1_ENTITYTYPE') }} REF_AP1_ENTITYTYPE
                ON REF_AP1_ENTITYTYPE.ENTITYTYPEID = s_ap1_entitycustomfieldvalue.ENTITYTYPE
             INNER JOIN (
                    SELECT s_ap1_lead_mroc.leadID ,
                           s_ap1_lead_mroc.Created ,
                           s_ap1_lead_mroc.CustomerID ,
                           MAX(ref_ap1_usstate.EnumStringValue) AS StateCode
                      FROM (
                            SELECT *
                              FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} QUALIFY ROW_NUMBER() OVER(PARTITION BY LEADID ORDER BY DSS_VERSION DESC) = 1
                           ) s_ap1_lead_mroc
                     INNER JOIN {{ ref('STAGE','V_S_AP1_CUSTOMERADDRESS_MROC_CURRENT') }} v_s_ap1_customeraddress_mroc_current
                        ON v_s_ap1_customeraddress_mroc_current.CustomerID = s_ap1_lead_mroc.CustomerID
                     INNER JOIN {{ ref('STAGE','V_S_AP1_ADDRESS_MROC_CURRENT') }} v_s_ap1_address_mroc_current
                        ON v_s_ap1_customeraddress_mroc_current.addressid = v_s_ap1_address_mroc_current.addressid
                       AND v_s_ap1_address_mroc_current.IsRowDeleted = 0
                     INNER JOIN {{ ref('DATA_VAULT','REF_AP1_USSTATE') }} ref_ap1_usstate
                        ON ref_ap1_usstate.usstateid = v_s_ap1_address_mroc_current.stateid
                     WHERE DATE(s_ap1_lead_mroc.Created) = DATEADD(DAY, - 1, CURRENT_DATE())
                     GROUP BY s_ap1_lead_mroc.leadID,
                              s_ap1_lead_mroc.Created,
                              s_ap1_lead_mroc.CustomerID
                   ) S_AP1_LEAD_MROC
                ON S_AP1_LEAD_MROC.leadid = s_ap1_entitycustomfieldvalue.ENTITYID
             INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CUSTOMERSUMMARY_V2
                ON DS_CUSTOMERSUMMARY_V2.c
