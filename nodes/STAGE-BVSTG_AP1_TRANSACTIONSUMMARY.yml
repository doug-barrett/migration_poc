             INNER JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} AS trType1
                ON s_ap1_transaction_mroc.TransactionTypeID = trType1.CodeValueID
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_TRANSACTIONPOLICY_MROC') }} s_ap1_transactionpolicy_mroc
                ON s_ap1_transaction_mroc.TransactionID = s_ap1_transactionpolicy_mroc.TransactionID
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_POLICY_MROC') }} AS s_ap1_policy_mroc
                ON s_ap1_transactionpolicy_mroc.PolicyID = s_ap1_policy_mroc.PolicyID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ANCILLARYPRODUCT_AC ds_bvstg_ap1_ancillaryproduct_ac
                ON ds_bvstg_ap1_ancillaryproduct_ac.ap1_policyid = s_ap1_policy_mroc.policyid
