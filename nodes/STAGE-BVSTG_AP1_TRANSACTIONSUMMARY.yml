                ON s_ap1_transaction_mroc.OfficeID = v_s_ap1_office_mroc_current.OfficeID
             INNER JOIN {{ ref('STAGE','V_S_AP1_ORGANIZATION_MROC_CURRENT') }} AS v_s_ap1_organization_mroc_current
                ON v_s_ap1_office_mroc_current.OrganizationID = v_s_ap1_organization_mroc_current.OrganizationID
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} AS CoTerm
