    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BVSTG_AP1_DS_TRSUMM_REFRESH: 9f525b22-2201-4c0e-a362-53faeff43d49
          DS_BVSTG_AP1_TRANSACTION: 775b2ac0-1ddf-4911-acec-8f2e83f395a8
          BVSTG_AP1_SU_TRANSACTIONITEM: 51179621-e357-4901-8940-a0ee6b359fc0
          BVSTG_AP1_SU_PAYMENT: c6bbcc3c-9272-4017-af3c-bd0b95c4996b
          BVSTG_AP1_SU_ANCILLARY: 975d87f3-959a-4b9d-a8ff-b8ae788fadeb
          DS_BVSTG_AP1_POLICY: 28907506-6a1d-46c4-8b92-b4595ddc4fa3
          DS_BVSTG_AP1_CUSTOMER: 5060ac73-3003-4e75-ab03-1a402aa886f3
          V_S_AP1_LEAD_MROC_CURRENT: 8249a218-0c61-42f5-bfae-40ec4b2fcf53
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTION
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_POLICY
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_CUSTOMER
          - locationName: STAGE
            nodeName: V_S_AP1_LEAD_MROC_CURRENT
          - locationName: STAGE
            nodeName: BVSTG_AP1_SU_TRANSACTIONITEM
          - locationName: STAGE
            nodeName: BVSTG_AP1_SU_PAYMENT
          - locationName: STAGE
            nodeName: BVSTG_AP1_SU_ANCILLARY
          - locationName: STAGE
            nodeName: V_S_AP1_POLICY_MROC_CURRENT
          - locationName: STAGE
            nodeName: BVSTG_AP1_DS_TRSUMM_REFRESH
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT TransactionID
                      FROM {{ ref('STAGE','BVSTG_AP1_DS_TRSUMM_REFRESH') }}
                   ) bvstg_ap1_ds_trsumm_refresh
             INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTION') }} ds_bvstg_ap1_transaction
                ON ds_bvstg_ap1_transaction.transactionid = bvstg_ap1_ds_trsumm_refresh.transactionid
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_SU_TRANSACTIONITEM') }} bvstg_ap1_su_transactionitem
                ON ds_bvstg_ap1_transaction.HK_h_transaction = bvstg_ap1_su_transactionitem.HK_h_transaction
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_SU_PAYMENT') }} bvstg_ap1_su_payment
                ON ds_bvstg_ap1_transaction.transactionid = bvstg_ap1_su_payment.transactionid
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_SU_ANCILLARY') }} bvstg_ap1_su_ancillary
                ON ds_bvstg_ap1_transaction.HK_h_transaction = bvstg_ap1_su_ancillary.HK_h_transaction
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_POLICY') }} ds_bvstg_ap1_policy
                ON ds_bvstg_ap1_transaction.HK_h_transaction = ds_bvstg_ap1_policy.HK_h_transaction
               AND ds_bvstg_ap1_policy.isfirstpolicy = 1
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ANCILLARYPRODUCT_AC ds_bvstg_ap1_ancillaryproduct_ac
                ON ds_bvstg_ap1_ancillaryproduct_ac.ap1_policyid = ds_bvstg_ap1_policy.policyid
              JOIN {{ ref('STAGE','DS_BVSTG_AP1_CUSTOMER') }} ds_bvstg_ap1_customer
                ON ds_bvstg_ap1_transaction.HK_h_customer = ds_bvstg_ap1_customer.HK_h_customer
              LEFT JOIN (
                    SELECT r.TransactionID ,
                           MAX(IFNULL(IFNULL(nb1.TransactionID,nb2.TransactionID),nb3.TransactionID)) AS NBTransactionID
                      FROM {{ ref('STAGE','DS_BVSTG_AP1_POLICY') }} r
                      LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_POLICY') }} nb1
                        ON (nb1.TransactionType = 'New Business' AND r.CustomerID = nb1.CustomerID AND TO_DATE(r.FirstWritten) = TO_DATE(nb1.FirstWritten) AND r.PolicyNumber = nb1.PolicyNumber)
                      LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_POLICY') }} nb2
                        ON (nb2.TransactionType = 'New Business' AND r.CustomerID = nb2.CustomerID AND TO_DATE(r.FirstWritten) = TO_DATE(nb2.FirstWritten))
                      LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_POLICY') }} nb3
                        ON (nb3.TransactionType = 'New Business' AND r.CustomerID = nb3.CustomerID AND r.PolicyNumber = nb3.PolicyNumber)
                     WHERE r.TransactionType != 'New Business'
                       AND IFNULL(IFNULL(nb1.TransactionID,nb2.TransactionID),nb3.TransactionID) IS NOT NULL
                     GROUP BY r.TransactionID
                   ) v_s_ap1_policy_mroc_current
                ON (ds_bvstg_ap1_transaction.TransactionID = v_s_ap1_policy_mroc_current.TransactionID)
              LEFT JOIN (
                    SELECT MIN(LeadID) AS LeadId,
                           TransactionID
                      FROM {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }}
                     WHERE isrowdeleted=0
                     GROUP BY TransactionID
                   ) v_s_ap1_lead_mroc_current
