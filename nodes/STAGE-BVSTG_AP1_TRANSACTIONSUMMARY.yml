              LEFT JOIN {{ ref('DATA_VAULT','S_AP1_CUSTOMER_MROC') }} AS s_ap1_customer_mroc
                ON s_ap1_transaction_mroc.CustomerID = s_ap1_customer_mroc.CustomerID
              LEFT JOIN {{ ref('DATA_VAULT','S_AP1_POPULATION_MROC') }} AS s_ap1_population_mroc
                ON s_ap1_population_mroc.PopulationID = s_ap1_customer_mroc.PopulationID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} AS v_s_ap1_employee_mroc_current
                ON CAST(s_ap1_transaction_mroc.PrimaryProducerID AS varchar(50)) = CAST(v_s_ap1_employee_mroc_current.UserID AS varchar(50))
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} AS CoVLang
                ON s_ap1_customer_mroc.CustomerVerbalLanguageTypeID = CoVLang.CodeValueID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_PROGRAM_MROC_CURRENT') }} AS v_s_ap1_program_mroc_current
                ON v_s_ap1_program_mroc_current.ProgramID = s_ap1_policy_mroc.ProgramID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CARRIER_MROC_CURRENT') }} AS v_s_ap1_carrier_mroc_current
                ON v_s_ap1_program_mroc_current.CarrierID = v_s_ap1_carrier_mroc_current.CarrierID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_MASTERCARRIER_MROC_CURRENT') }} AS v_s_ap1_mastercarrier_mroc_current
                ON v_s_ap1_carrier_mroc_current.MasterCarrierID = v_s_ap1_mastercarrier_mroc_current.MasterCarrierID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_LINEOFBUSINESSTYPE_MROC_CURRENT') }} AS v_s_ap1_lineofbusinesstype_mroc_current
                ON s_ap1_policy_mroc.LineOfBusinessID = v_s_ap1_lineofbusinesstype_mroc_current.LineOfBusinessTypeID
               AND v_s_ap1_lineofbusinesstype_mroc_current.IsRowDeleted = 0
             INNER JOIN {{ ref('STAGE','V_S_AP1_OFFICE_MROC_CURRENT') }} AS AgentOff
                ON s_ap1_transaction_mroc.ProducerOfficeID = AgentOff.OfficeID
             WHERE (s_ap1_transaction_mroc.VoidStatusTypeID IN (831))
               AND DATE(s_ap1_transaction_mroc.Created) = DATE(CURRENT_DATE())
               AND (s_ap1_policy_mroc.IsRowDeleted = 0)
             GROUP BY s_ap1_transaction_mroc.TransactionID
