        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT SESSIONAGENTID_FINAL,
                   BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL_2.SESSIONID_FINAL,
                   AGENT,
                   SOURCE_DATA,
                   SKILLGROUPTARGETNAME_FINAL,
                   SKILL_QUEUE,
                   FINAL_CUSTOMER_ID_TO_KEEP,
                   TIME_FLAG,
                   AGENT_OFFICE_GROUPED,
                   FIRST_AGENTOFFICE_GROUPED,
                   LAST_AGENTOFFICE_GROUPED,
                   CALLTYPEDESCRIPTION,
                   FIRST_SKILLGROUP,
                   FIRST_SKILL_QUEUE,
                   SECOND_SKILLGROUP,
                   SECOND_SKILL_QUEUE,
                   LAST_SKILLGROUP,
                   LAST_SKILL_QUEUE,
                   TOTAL_AGENTS,
                   IS_ICR,
                   ICR_RESULT,
                   ANI_POPULATED,
                   FCR_Eligible_Flag,
                   Final_Skill_Queue,
                   ACTION_FINAL,
                   to_timestamp(STARTDATETIME) AS startdatetime,
                   to_timestamp(ENDDATETIME) AS enddatetime,
                   SKILLGROUP_TRANSFER_FLAG,
                   ACTION_FINAL_TO_TAKE,
                   groups_,
                   NULL AS final_transation
              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL_2
             INNER JOIN (
                    SELECT sessionid_final,
                           count(DISTINCT source_data) AS tot1
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL_2
                     GROUP BY 1
                   ) base_table
                ON base_table.sessionid_final = BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL_2.sessionid_final
               AND base_table.tot1 = 2
            UNION ALL SELECT SESSIONAGENTID_FINAL,
                   SESSIONID_FINAL,
                   AGENT,
                   SOURCE_DATA,
                   SKILLGROUPTARGETNAME_FINAL,
                   SKILL_QUEUE,
                   FINAL_CUSTOMER_ID_TO_KEEP,
                   TIME_FLAG,
                   AGENT_OFFICE_GROUPED,
                   FIRST_AGENTOFFICE_GROUPED,
                   LAST_AGENTOFFICE_GROUPED,
                   CALLTYPEDESCRIPTION,
                   FIRST_SKILLGROUP,
                   FIRST_SKILL_QUEUE,
                   SECOND_SKILLGROUP,
                   SECOND_SKILL_QUEUE,
                   LAST_SKILLGROUP,
                   LAST_SKILL_QUEUE,
                   TOTAL_AGENTS,
                   IS_ICR,
                   ICR_RESULT,
                   ANI_POPULATED,
                   FCR_Eligible_Flag,
                   Final_Skill_Queue,
                   ACTION_FINAL,
                   to_timestamp(STARTDATETIME) AS startdatetime,
                   to_timestamp(ENDDATETIME) AS enddatetime,
                   SKILLGROUP_TRANSFER_FLAG,
                   ACTION_FINAL_TO_TAKE,
                   GROUPS_,
                   final_transation
              FROM ( SELECT t1.SESSIONAGENTID AS SESSIONAGENTID_FINAL,
                   t1.SESSIONID AS SESSIONID_FINAL,
                   t1.NEW_ID,
                   t2.AGENT,
                   'Transactions' AS SOURCE_DATA,
                   t2.SKILLGROUPTARGETNAME_FINAL,
                   t2.SKILL_QUEUE,
                   t2.FINAL_CUSTOMER_ID_TO_KEEP,
                   CASE WHEN CREATEDDATE >= STARTDATETIME AND CREATEDDATE <= ENDDATETIME THEN 'During Call'
                        WHEN CREATEDDATE > ENDDATETIME                                   THEN 'After Call'
                        ELSE 'Check'
                         END AS TIME_FLAG,
                   t2.AGENT_OFFICE_GROUPED,
                   t2.FIRST_AGENTOFFICE_GROUPED,
                   t2.LAST_AGENTOFFICE_GROUPED,
                   t2.CALLTYPEDESCRIPTION,
                   t1.FIRST_SKILLGROUP,
                   t1.FIRST_SKILL_QUEUE,
                   t2.SECOND_SKILLGROUP,
                   t2.SECOND_SKILL_QUEUE,
                   t1.LAST_SKILLGROUP,
                   t1.LAST_SKILL_QUEUE,
                   t2.TOTAL_AGENTS,
                   t2.IS_ICR,
                   t2.ICR_RESULT,
                   t2.ANI_POPULATED,
                   t2.FCR_Eligible_Flag,
                   t2.Final_Skill_Queue,
                   CONCAT('Final Action : ', FINAL_TXN) AS ACTION_FINAL,
                   CREATEDDATE,
                   CASE WHEN len(left(CREATEDDATE, 23)) <> 23 THEN NULL
                        ELSE TO_TIMESTAMP(left(CREATEDDATE, 23))
                         END AS STARTDATETIME,
                   CASE WHEN len(left(CREATEDDATE, 23)) <> 23 THEN NULL
                        ELSE TO_TIMESTAMP(left(CREATEDDATE, 23))
                         END AS ENDDATETIME,
                   t3.SKILLGROUP_TRANSFER_FLAG,
                   FINAL_TXN AS ACTION_FINAL_TO_TAKE,
                   NULL AS GROUPS_,
                   FINAL_TXN AS final_transation
              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_ALL_TXN_COMBINED_AA AS t1
              LEFT JOIN (
                    SELECT DISTINCT SESSIONAGENTID AS SESSIONAGENTID_FINAL,
                           SESSIONID AS SESSIONID_FINAL,
                           AGENT,
                           SKILLGROUPTARGETNAME_FINAL,
                           SKILL_QUEUE,
                           FINAL_CUSTOMER_ID_TO_KEEP,
                           AGENT_OFFICE_GROUPED,
                           FIRST_AGENTOFFICE_GROUPED,
                           LAST_AGENTOFFICE_GROUPED,
                           CALLTYPEDESCRIPTION,
                           SECOND_SKILLGROUP,
                           SECOND_SKILL_QUEUE,
                           TOTAL_AGENTS,
                           IS_ICR,
                           ICR_RESULT,
