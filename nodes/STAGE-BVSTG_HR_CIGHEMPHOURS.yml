        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_API_UKG_WORKDETAILS_CURRENT
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.empName ,
                   DS_HR_EMPLOYEEUNIQUE.EmployeeNumber ,
                   DS_HR_EMPLOYEEUNIQUE.EmployeeName ,
                   DS_HR_EMPLOYEEUNIQUE.JobGroup ,
                   LTRIM(RTRIM(DS_HR_EMPLOYEEUNIQUE.LocationCode)) AS LocationCode ,
                   V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.wrkdWorkDate ,
                   V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.wrkdStartTime ,
                   V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.wrkdEndTime ,
                   V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.wrkdHours ,
                   V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.wrkdMinutes ,
                   V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.PayType ,
                   V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.PayCode ,
                   V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.deptName ,
                   V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.teamName
              FROM ( SELECT V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.EMPNAME,
                   DATE(V_DLBV_API_UKG_WORKSUMMARIES_CURRENT.WORKDATE) AS WRKDWORKDATE,
                   TO_TIMESTAMP(V_DLBV_API_UKG_WORKDETAILS_CURRENT.WRKSTARTTIME) AS WRKDSTARTTIME,
                   TO_TIMESTAMP(V_DLBV_API_UKG_WORKDETAILS_CURRENT.WRKENDTIME) AS WRKDENDTIME,
                   TO_NUMERIC((V_DLBV_API_UKG_WORKDETAILS_CURRENT.WRKMINS/60),10,2) AS WRKDHOURS,
                   V_DLBV_API_UKG_WORKDETAILS_CURRENT.WRKMINS AS WRKDMINUTES,
                   CASE WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.HOURTYPE,' '),' ') = 'OT1'    THEN 'Overtime'
                        WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.HOURTYPE,' '),' ') = 'OT2'    THEN 'DoubleTime'
                        WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.HOURTYPE,' '),' ') = 'PREM'   THEN 'Premium'
                        WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.HOURTYPE,' '),' ') = 'REG'    THEN 'Regular'
                        WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.HOURTYPE,' '),' ') = 'UNPAID' THEN 'Unpaid'
                         END AS PayType,
                   CASE WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'EARLY' THEN 'Arrived Early' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'LL' THEN 'Left Late' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'WRK' THEN 'Regular' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'BRV' THEN 'Bereavement' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'CLOSE' THEN 'Store Closed' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'EDO' THEN 'Earned Day Off' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'FLOAT' THEN 'Floating Holiday' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'JURY' THEN 'Jury Duty Paid' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'PAID ADMIN LEAVE' THEN 'Paid Admin Leave' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'PTO-SC' THEN 'PTO - Scheduled' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'PTO-UN' THEN 'PTO - Unscheduled' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'PTONO' THEN 'PTO - No Occurrence' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'SICK' THEN 'Sick' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'SICKCA' THEN 'Sick California' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'TRN' THEN 'Training' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'VAC' THEN 'Vacation' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'JURY_UNPD' THEN 'Jury Duty Unpaid' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'LATE' THEN 'Arrived Late' WHEN LTRIM(RTRIM(V_DLBV_API_UKG_WORKDETAILS_CURRENT.TIMECODE,' '),' ') = 'LE' THEN 'Left Early' WHEN LTR
