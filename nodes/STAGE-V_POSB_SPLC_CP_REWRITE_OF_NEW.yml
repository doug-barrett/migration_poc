        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_CP_REWRITE_OF_NEW') }} AS SELECT DISTINCT ID
              FROM(
                    SELECT DS_SPLC_POLICYTRANSACTION.ID
                      FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
                     WHERE DS_SPLC_POLICYTRANSACTION.TranType ='REW'
                     UNION SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.ID
                      FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
                     INNER JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D
                        ON DS_SPLC_POLICYTRANSACTION.CustomerID = DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.CustomerID
                       AND DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.Status = 'Cancelled'
                       AND DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.STATUSDATE >= DATE(DATEADD(DAY,-30,DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)))
                       AND DATE(DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.ReportDate) < DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)
                       AND DS_SPLC_POLICYTRANSACTION.PolicyID != DS_SPLC_POLICYTRANSACTION_NEW_OLD_C_30D.PolicyID
                     WHERE DS_SPLC_POLICYTRANSACTION.TranType ='NBS'
                   )
