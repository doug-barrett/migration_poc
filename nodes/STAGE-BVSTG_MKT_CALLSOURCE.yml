    sourceMapping:
      - aliases:
          DS_INTERACTIONSUMMARY: b3b445bf-9ae8-4dac-9d59-dd157e75b84e
          DS_MKT_CALLLOGS: 01a681ca-4641-4af7-9c45-c91cb192a2fa
          DS_MKT_CAMPAIGN: 7af8f04b-abc3-4181-a605-da78d18d31e6
          V_DLBV_API_MARCHEX_CURRENT: 912c07d8-0f40-486e-a253-90182a7ab648
          DS_MKT_CALLSOURCE: da1ac581-7d2f-4f4e-afbb-2709bf5374c7
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_INTERACTIONSUMMARY
          - locationName: EDW
            nodeName: DS_MKT_CALLLOGS
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN
          - locationName: STAGE
            nodeName: V_DLBV_API_MARCHEX_CURRENT
          - locationName: EDW
            nodeName: DS_MKT_CALLSOURCE
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_INTERACTIONSUMMARY') }} ds_interactionsummary
              LEFT JOIN {{ ref('EDW','DS_MKT_CALLLOGS') }} ds_mkt_calllogs
                ON ds_interactionsummary.interactionidkey = ds_mkt_calllogs.interactionidkey
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON CAST(ds_mkt_campaign.inboundnumber AS varchar(50)) = CAST(CASE WHEN (LEN(ds_interactionsummary.dnis_localid)) >= 10 THEN RIGHT(try_to_number(ds_interactionsummary.dnis_localid),10) WHEN (LEN(ds_interactionsummary.digitsdialed)) >= 10 THEN RIGHT(try_to_number(ds_interactionsummary.digitsdialed),10) ELSE RIGHT(try_to_number(ds_interactionsummary.dnis_localid),10) END AS varchar(50))
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_MARCHEX_CURRENT') }} v_dlbv_api_marchex_current
                ON REPLACE(v_dlbv_api_marchex_current.caller_number,'+1','') = REPLACE(ds_interactionsummary.REMOTENUMBERCALLID,'+1','')
               AND DATE(convert_timezone('UTC','America/Los_Angeles',(CAST(v_dlbv_api_marchex_current.CALL_START AS DATETIME))::timestamp_ntz)) BETWEEN DATE(ds_interactionsummary.startdatetime) AND DATE(ds_interactionsummary.startdatetime)
               AND (REPLACE(v_dlbv_api_marchex_current.forwardno,'+1','') = REPLACE(ds_interactionsummary.DNIS_LOCALID,'+1','') OR REPLACE(v_dlbv_api_marchex_current.inboundno,'+1','') = REPLACE(ds_interactionsummary.DNIS_LOCALID,'+1','') OR REPLACE(v_dlbv_api_marchex_current.forwardno,'+1','') = REPLACE(ds_interactionsummary.digitsdialed,'+1','') OR REPLACE(v_dlbv_api_marchex_current.inboundno,'+1','') = REPLACE(ds_interactionsummary.digitsdialed,'+1',''))
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign_dnis
                ON v_dlbv_api_marchex_current.INBOUNDNO = ds_mkt_campaign_dnis.inboundnumber
             WHERE COALESCE(ds_mkt_calllogs.Campaign_Id , ds_mkt_campaign.campaignid , ds_mkt_campaign_dnis.campaignid) IS NOT NULL
               AND IFNULL(ds_interactionsummary.LINEID,'') not like '%CUCM%'
               AND (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,ds_interactionsummary.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}') OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND ds_interactionsummary.DSS_CREATE_TIME > (SELECT DATEADD(HOUR,-2,MAX(DSS_UPDATE_TIME)) FROM {{ ref('EDW','DS_MKT_CALLSOURCE') }}))) QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_interactionsummary.interactionidkey ORDER BY ds_mkt_calllogs.IsNonUnique DESC,ds_mkt_calllogs.IsDailyUnique DESC,ds_mkt_calllogs.IsWeeklyUnique DESC, ds_mkt_calllogs.CallDatetime DESC) = 1
        name: BVSTG_MKT_CALLSOURCE
        noLinkRefs: []
