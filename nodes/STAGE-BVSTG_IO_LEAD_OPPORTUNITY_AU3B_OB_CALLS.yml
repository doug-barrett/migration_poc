        join:
          joinCondition: |-
            FROM (
                    SELECT a.TIMELINE_ID,
                           a.MOVED_TO_BUCKET_AT,
                           a.NEXT_MOVED_TO_BUCKET_AT,
                           a.PREVIOUS_MOVED_TO_BUCKET_AT,
                           id,
                           STARTDATETIME,
                           talktime,
                           digitsdialed,
                           DNIS,
                           ANI,
                           isinternalcall,
                           ISINBOUND,
                           ISOUTBOUND,
                           PHONE,
                           FIRST_AGENTSKILLTARGETID,
                           LAST_AGENTSKILLTARGETID,
                           LAST_AGENTNAME,
                           FIRST_AGENTNAME,
                           FIRST_AGENT,
                           LAST_AGENT,
                           LAST_AGENTOFFICE,
                           FIRST_AGENTOFFICE
                      FROM {{ ref('STAGE','BVSTG_IO_LEAD_OPPORTUNITY_AU2C_DEALS') }} a
                      JOIN RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION phone
                        ON RIGHT(phone.ANI, 10) = a.Phone
                        OR RIGHT(phone.DNIS, 10) = a.Phone
                        OR RIGHT(phone.DIGITSDIALED, 10) = a.Phone
                     WHERE DATE(STARTDATETIME) >= '2025-09-01'
                       AND IFNULL(Phone, '') != ''
                       AND ISOUTBOUND = 1
                   ) AS bvstg_io_lead_opportunity_au2c_deals
             WHERE DATE(STARTDATETIME) <= DATEADD(DAY,-1,CURRENT_DATE)
               AND STARTDATETIME >= MOVED_TO_BUCKET_AT
               AND STARTDATETIME <= IFNULL(NEXT_MOVED_TO_BUCKET_AT, CURRENT_TIMESTAMP)
             GROUP BY TIMELINE_ID
