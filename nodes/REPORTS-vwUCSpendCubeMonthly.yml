      join:
        joinCondition: |-
          FROM {{ ref('STAGE', 'StageAggUCSpend') }} "StageAggUCSpend"
          LEFT JOIN {{ ref('DIM', 'UCCampus') }} "UCCampus"
            ON STAGEAGGUCSPEND.UCCAMPUSKEY = UCCAMPUS.UCCAMPUSKEY
          LEFT JOIN {{ ref('DIM', 'UCCategoryLevel1') }} "UCCategoryLevel1"
            ON STAGEAGGUCSPEND.UCCATEGORYLEVEL1KEY = UCCATEGORYLEVEL1.UCCATEGORYLEVEL1KEY
          LEFT JOIN {{ ref('DIM', 'UCCategoryLevel2') }} "UCCategoryLevel2"
            ON STAGEAGGUCSPEND.UCCATEGORYLEVEL2KEY = UCCATEGORYLEVEL2.UCCATEGORYLEVEL2KEY
          LEFT JOIN {{ ref('DIM', 'UCCategoryLevel3') }} "UCCategoryLevel3"
            ON STAGEAGGUCSPEND.UCCATEGORYLEVEL3KEY = UCCATEGORYLEVEL3.UCCATEGORYLEVEL3KEY
          LEFT JOIN {{ ref('DIM', 'UCCategoryLevel4') }} "UCCategoryLevel4"
            ON STAGEAGGUCSPEND.UCCATEGORYLEVEL4KEY = UCCATEGORYLEVEL4.UCCATEGORYLEVEL4KEY
          LEFT JOIN {{ ref('DIM', 'UCSupplier') }} "UCSupplier"
            ON STAGEAGGUCSPEND.UCSUPPLIERKEY = UCSUPPLIER.UCSUPPLIERKEY
          LEFT JOIN {{ ref('DIM', 'UCTier1') }} "UCTier1"
            ON STAGEAGGUCSPEND.UCTIER1KEY = UCTIER1.UCTIER1KEY
          LEFT JOIN {{ ref('DIM', 'UCTier2') }} "UCTier2"
            ON STAGEAGGUCSPEND.UCTIER2KEY = UCTIER2.UCTIER2KEY
          LEFT JOIN {{ ref('DIM', 'UCTier3') }} "UCTier3"
            ON STAGEAGGUCSPEND.UCTIER3KEY = UCTIER3.UCTIER3KEY
          LEFT JOIN {{ ref('STAGE', 'StageAggOPSalesAndRevenueByContract') }} "StageAggOPSalesAndRevenueByContract"
            ON STAGEAGGUCSPEND.OPCONTRACTID = STAGEAGGOPSALESANDREVENUEBYCONTRACT.CONTRACTID AND STAGEAGGUCSPEND.UCCAMPUSKEY = STAGEAGGOPSALESANDREVENUEBYCONTRACT.UCCAMPUSKEY AND STAGEAGGUCSPEND.TRANSACTIONDATEKEY = STAGEAGGOPSALESANDREVENUEBYCONTRACT.TRANSACTIONDATEKEY
          LEFT JOIN {{ ref('DIM', 'Contract') }} "Contract"
            ON STAGEAGGUCSPEND.OPCONTRACTID = CONTRACT.CONTRACTID
          LEFT JOIN {{ ref('DIM', 'Supplier') }} "Supplier"
            ON STAGEAGGUCSPEND.OPSUPPLIERID = SUPPLIER.SUPPLIERID
          LEFT JOIN {{ ref('DIM', 'UCContractMappingStatus') }} "UCContractMappingStatus"
            ON STAGEAGGUCSPEND.OPCONTRACTMAPPINGSTATUSID = UCCONTRACTMAPPINGSTATUS.CONTRACTMAPPINGSTATUSID
          LEFT JOIN {{ ref('DIM', 'UCComponent') }} "UCComponent"
            ON STAGEAGGUCSPEND.UCCOMPONENTKEY = UCCOMPONENT.UCCOMPONENTKEY
          LEFT JOIN {{ ref('DIM', 'Solicitation') }} "Solicitation"
            ON UCCOMPONENT.SOLICITATIONSALESFORCEID = SOLICITATION.SOLICITATIONSALESFORCEID
          LEFT JOIN {{ ref('DIM', 'Opportunity') }} "Opportunity"
            ON UCCOMPONENT.OPPORTUNITYSALESFORCEID = OPPORTUNITY.OPPORTUNITYSALESFORCEID
          LEFT JOIN {{ ref('REPORTS', 'AggOPSalesAndRevenueBySupplier') }} "AggOPSalesAndRevenueBySupplier"
            ON STAGEAGGUCSPEND.UCCAMPUSKEY = AGGOPSALESANDREVENUEBYSUPPLIER.UCCAMPUSKEY AND STAGEAGGUCSPEND.OPSUPPLIERKEY = AGGOPSALESANDREVENUEBYSUPPLIER.SUPPLIERKEY AND STAGEAGGUCSPEND.TRANSACTIONDATEKEY = AGGOPSALESANDREVENUEBYSUPPLIER.TRANSACTIONDATEKEY
          LEFT JOIN {{ ref('DIM', 'UCTransactionDateWindow') }} "UCTransactionDateWindow"
            ON STAGEAGGUCSPEND.TRANSACTIONDATE = UCTRANSACTIONDATEWINDOW.TRANSACTIONDATE
