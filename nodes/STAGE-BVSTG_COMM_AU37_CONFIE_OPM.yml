          - locationName: EDW
            nodeName: DS_WECARE_OFFICE
          - locationName: STAGE
            nodeName: V_PRED_MONTHS
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT au34_confie_opm.asofmonth,
                   au34_confie_opm.POLICYSOURCE_DIMENSION,
                   au28_confie_opm_2.TJ_Comp TJ_Compensation,
                   au28_confie_opm_3.TJ_Emp TJ_Emp_Employees_OS,
                   ds_wecare_office.doi_complaint DOI_Complaints_AppOne_States,
                   au32_confie_opm_1.Terminated_emp Terminated,
                   au32_confie_opm_1.Headcount Headcount_Retail,
                   hr_salesempsummary.Tenure_LT90 Tenure_Less_Than_90_Days,
                   retail_off_1.Retail_Sales_Offices,
                   wecare6.We_Care_NV,
                   wecare6.We_Care_TX,
                   wecare6.We_Care_CA,
                   wecare6.We_Care_AZ
              FROM ((
                    SELECT asofmonth,
                           POLICYSOURCE_DIMENSION
                      FROM {{ ref('STAGE','BVSTG_COMM_AU34_CONFIE_OPM') }}
                   ) au34_confie_opm
              LEFT JOIN (
                    SELECT monthyear asofmonth,
                           'Missing/Total' PolicySource_Dimension,
                           sum(values_month) TJ_Comp
                      FROM (
                            SELECT bvstg_comm_au28_confie_opm_1.monthyear,
                                   ud2id,
                                   CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY ud2id ORDER BY monthyear)
                                        ELSE values_month
                                         END AS values_month
                              FROM (
                                    SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                           ifnull(sum(values_month),0) values_month,
                                           ud2id
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU28_CONFIE_OPM') }}
                                     WHERE ud2id ='4195278'
                                       AND accountid IN ('188','189','829')
                                       AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                                     GROUP BY ud2id,
                                              date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                                   ) bvstg_comm_au28_confie_opm_1
                           )
                     GROUP BY monthyear,
                              PolicySource_Dimension
                   )au28_confie_opm_2
                ON au34_confie_opm.asofmonth = au28_confie_opm_2.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = au28_confie_opm_2.PolicySource_Dimension
              LEFT JOIN (
                    SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) asofmonth,
                           'Missing/Total' PolicySource_Dimension,
                           ifnull(sum(values_month),0) TJ_Emp
                      FROM {{ ref('STAGE','BVSTG_COMM_AU28_CONFIE_OPM') }}
                     WHERE ud2id IN (
                            SELECT DISTINCT memberid
                              FROM "DATA_LAKE"."ONESTREAM"."V_DL_OSM_MEMBER_CURRENT"
                             WHERE lower(name) like '%mex%'
                           )
                       AND accountid IN ('374','373')
                       AND asofmonth<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                     GROUP BY date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')),
                              PolicySource_Dimension
                   )au28_confie_opm_3
                ON au34_confie_opm.asofmonth = au28_confie_opm_3.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = au28_confie_opm_3.PolicySource_Dimension
              LEFT JOIN (
                    SELECT asofmonth,
                           'NSA'PolicySource_Dimension,
                           sum(DOICOMPLAINTQTY) AS doi_complaint
                      FROM (
                            SELECT date_from_parts(yearnumber, monthnumber, 01) AS asofmonth,
                                   OfficeState,
                                   channel,
                                   DOICOMPLAINTQTY,
                                   total_score
                              FROM {{ ref('EDW','DS_WECARE_OFFICE') }}
                           )
                     WHERE channel = 'NSA'
                       AND upper(OfficeState) NOT IN ('AL','LA')
                     GROUP BY asofmonth,
                              PolicySource_Dimension
                   ) ds_wecare_office
                ON au34_confie_opm.asofmonth = ds_wecare_office.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = ds_wecare_office.PolicySource_Dimension
              LEFT JOIN (
                    SELECT to_date(min_Date) asofmonth,
                           (CASE WHEN lower(channel) IN ('nsa','appone','cigh','dnsa') THEN 'NSA' WHEN lower(channel) = ('splc') THEN 'SPLC' ELSE 'Missing/Total' END)PolicySource_Dimension,
                           count(DISTINCT CASE WHEN (date_trunc('month', officeopeneddate) <= min_date AND coalesce(date_trunc('month', officecloseddate), '2066-12-31') >= min_date) THEN officecode END) Retail_Sales_Offices
                      FROM {{ ref('STAGE','V_PRED_MONTHS') }} v_pred_months
                     CROSS JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                     WHERE v_pred_months.cal_year >= 2019
                       AND v_pred_months.min_date <= add_months(date_trunc('month', current_Date()), -1)
                       AND ds_retail_office.officeopeneddate IS NOT NULL
                       AND ds_retail_office.officetype = 'Retail'
                       AND ds_retail_office.country = 'United States'
                     GROUP BY to_date(min_Date),
                              PolicySource_Dimension
                   ) retail_off_1
                ON au34_confie_opm
        name: BVSTG_COMM_AU37_CONFIE_OPM
        noLinkRefs: []
