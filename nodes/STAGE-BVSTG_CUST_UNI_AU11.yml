        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU11
        join:
          joinCondition: |-
            EXTENDED
              FROM( WITH FEATURES AS ( SELECT CDP_CUSTOMERID,
                   CURRENT_DATE() AS UPDATED,
                   MIN(CREATED) AS FIRST_CREATED_DATE,
                   MAX(CREATED) AS LAST_CREATED_DATE,
                   DATEDIFF(DAY, MIN(CREATED),CURRENT_DATE()) DAYS_SINCE_FIRST_CREATION,
                   DATEDIFF(DAY, MAX(CREATED),CURRENT_DATE()) DAYS_SINCE_LAST_CREATION,
                   COUNT(*) AS TIMES_IN_DATASET,
                   SUM(CASE WHEN SOURCEDB = 'AppOne' THEN 1 ELSE 0 END) AS TIMES_IN_SOURCEDB_APPONE,
                   SUM(CASE WHEN SOURCEDB = 'CIGH' THEN 1 ELSE 0 END) AS TIMES_IN_SOURCEDB_CIGH,
                   SUM(CASE WHEN SOURCEDB = 'SPLC' THEN 1 ELSE 0 END) AS TIMES_IN_SOURCEDB_SPLC,
                   SUM(CASE WHEN SOURCEDB = 'Velox' THEN 1 ELSE 0 END) AS TIMES_IN_SOURCEDB_VELOX,
                   MAX(CASE WHEN FIRST_DATE = 1 THEN SOURCEDB END) AS FIRST_SOURCEDB,
                   MAX(CASE WHEN MOST_RECENT_DATE = 1 THEN SOURCEDB END) AS LAST_SOURCEDB,
                   MAX(CASE WHEN FIRST_DATE = 1 THEN CUSTOMER_STATUS END) AS FIRST_CUSTOMER_STATUS,
                   MAX(CASE WHEN MOST_RECENT_DATE = 1 THEN CUSTOMER_STATUS END) AS LAST_CUSTOMER_STATUS,
                   MAX(CASE WHEN FIRSTNAME_APPEARANCE_RANK_V2 = 1 THEN FIRSTNAME END) AS FIRSTNAME,
                   MAX(CASE WHEN LASTNAME_APPEARANCE_RANK_V2 = 1 THEN LASTNAME END) AS LASTNAME,
                   MAX(CASE WHEN DOB_APPEARANCE_RANK_V2 = 1 THEN DOB END) AS DOB,
                   MAX(CASE WHEN MAINZIP_APPEARANCE_RANK_V2 = 1 THEN MAINZIP END) AS MAINZIP,
                   MAX(CASE WHEN EMAIL_APPEARANCE_RANK_V2 = 1 THEN EMAIL END) AS EMAIL,
                   MAX(CASE WHEN PHONE_APPEARANCE_RANK_V2 = 1 THEN PHONE END) AS PHONE,
                   MAX(CASE WHEN GENDER_APPEARANCE_RANK_V2 = 1 THEN GENDER END) AS GENDER,
                   MAX(CASE WHEN MAINSTREET_APPEARANCE_RANK_V2 = 1 THEN MAINSTREET END) AS MAINSTREET,
                   MAX(CASE WHEN MAINSTATE_APPEARANCE_RANK_V2 = 1 THEN MAINSTATE END) AS MAINSTATE,
                   MAX(CASE WHEN LICENSENUMBER_APPEARANCE_RANK_V2 = 1 THEN LICENSENUMBER END) AS LICENSENUMBER
              FROM (SELECT CREATED ,
                   MOST_RECENT_DATE ,
                   FIRST_DATE ,
                   CDP_CUSTOMERID ,
                   CUSTOMERID ,
                   SOURCEDB ,
                   ISLEGACYCUSTOMER ,
                   CUSTOMER_STATUS ,
                   FIRSTNAME ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY FIRSTNAME_APPEARANCE_RANK ASC) AS FIRSTNAME_APPEARANCE_RANK_V2 ,
                   LASTNAME ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY LASTNAME_APPEARANCE_RANK ASC) AS LASTNAME_APPEARANCE_RANK_V2 ,
                   DOB ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY DOB_APPEARANCE_RANK ASC) AS DOB_APPEARANCE_RANK_V2 ,
                   MAINZIP ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY MAINZIP_APPEARANCE_RANK ASC) AS MAINZIP_APPEARANCE_RANK_V2 ,
                   EMAIL ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY EMAIL_APPEARANCE_RANK ASC) AS EMAIL_APPEARANCE_RANK_V2 ,
                   PHONE ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY PHONE_APPEARANCE_RANK ASC) AS PHONE_APPEARANCE_RANK_V2 ,
                   GENDER ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY GENDER_APPEARANCE_RANK ASC) AS GENDER_APPEARANCE_RANK_V2 ,
                   MAINSTREET ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY MAINSTREET_APPEARANCE_RANK ASC) AS MAINSTREET_APPEARANCE_RANK_V2 ,
                   MAINSTATE ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY MAINSTATE_APPEARANCE_RANK ASC) AS MAINSTATE_APPEARANCE_RANK_V2 ,
                   LICENSENUMBER ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY LICENSENUMBER_APPEARANCE_RANK ASC) AS LICENSENUMBER_APPEARANCE_RANK_V2
              FROM (SELECT CREATED ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY CREATED DESC) AS MOST_RECENT_DATE ,
                   ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY CREATED ASC) AS FIRST_DATE ,
                   CDP_CUSTOMERID ,
                   CUSTOMERID ,
                   SOURCEDB ,
                   ISLEGACYCUSTOMER ,
                   CUSTOMER_STATUS ,
                   FIRSTNAME ,
                   CASE WHEN FIRSTNAME = '' THEN NULL
                        ELSE ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY CREATED DESC)
                         END AS FIRSTNAME_APPEARANCE_RANK ,
                   LASTNAME ,
                   CASE WHEN LASTNAME = '' THEN NULL ELSE ROW_NUMBER()
