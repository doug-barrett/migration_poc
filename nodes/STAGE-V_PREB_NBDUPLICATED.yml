    sourceMapping:
      - aliases:
          V_PREB_NBDUPLICATED: 67974fb5-733d-40a9-831d-bd32ecaa3898
          DS_AP1_TRANSACTIONSUMMARY: c9014461-b3e2-471a-b720-398d60b6acff
          BVSTG_CUSTOMER_TO_REFRESH: 90b8ce37-bcd1-4ba2-bda7-cfcf723b20ac
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_NBDUPLICATED') }} AS SELECT a.TransactionID ,
                   b.CustomerID ,
                   a.policyNumber ,
                   a.effectivedate ,
                   RANK() OVER (PARTITION BY b.CustomerID,a.policyNumber ORDER BY a.effectivedate,a.TransactionID) Ranking
              FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} a
             INNER JOIN (
                    SELECT DISTINCT customerid
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                     WHERE bvstg_customer_to_refresh.SourceDb = 'AppOne'
                   ) bvstg_customer_to_refresh
                ON bvstg_customer_to_refresh.customerid = a.customerid
             INNER JOIN (
                    SELECT a1.CustomerID,
                           a1.PolicyNumber
                      FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} a1
                     INNER JOIN (
                            SELECT DISTINCT customerid
                              FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                             WHERE bvstg_customer_to_refresh.SourceDb = 'AppOne'
                           ) a2
                        ON a1.customerid = a2.customerid
                     WHERE a1.TransactionType IN ('New Business')
                       AND a1.isvoid = 0
                       AND a1.isLegacyTransaction = 'Migrated'
                     GROUP BY a1.CustomerID,
                              a1.PolicyNumber
                    HAVING count(1)>1
                   )b
                ON b.CustomerID = a.CustomerID
               AND a.PolicyNumber = b.PolicyNumber
        dependencies:
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: BVSTG_CUSTOMER_TO_REFRESH
        join:
          joinCondition: |-
