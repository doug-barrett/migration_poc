      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: CDC_ITMMASFL
        - locationName: GOLD
          nodeName: DV_ITEM
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'CDC_ITMMASFL') }} "CDC_ITMMASFL"
          	
          LEFT OUTER JOIN {{ ref('GOLD', 'DV_ITEM') }} "ITEM"
          ON CDC_ITMMASFL.IMCMP = ITEM.Company_Code
          AND CDC_ITMMASFL.IMITEM = ITEM.Item_Code
          AND CDC_ITMMASFL.IMSTKC = ITEM.Stock_Class_Code
          	
          LEFT OUTER JOIN 
          (Select COALESCE(Max(Item_id),0) as Last_Id FROM {{ ref_no_link('GOLD', 'ITEM') }} "ITEM" ) as Max_ID on 1 = 1
      name: STG_ITEM
      noLinkRefs:
        - locationName: GOLD
          nodeName: ITEM
