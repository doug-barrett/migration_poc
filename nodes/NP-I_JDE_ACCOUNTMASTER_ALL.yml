                stepCounter: "0"
            transform: CASE --INTERNAL PROFIT ADJUSTMENT   WHEN ACCOUNTLEVEL7CODE = '4491' THEN 70   --INTEREST   WHEN ACCOUNTLEVEL6CODE = '8610' THEN 80   WHEN ACCOUNTLEVEL6CODE = '4420' THEN 80  WHEN ACCOUNTLEVEL6CODE = '8641' THEN 80   --TAX   WHEN ACCOUNTLEVEL5CODE = '9000' THEN 90   --DERIVIATIVES   WHEN ACCOUNTLEVEL5CODE = '8700' THEN 60   --REVENUE EXCL SUNDRY INCOME BUT INCL CONTRACT FEES AND KPI BONUS   WHEN ACCOUNTLEVEL3CODE = '4000' AND (ACCOUNTLEVEL4CODE <> '4364' OR ACCOUNTLEVEL6CODE = '4405') THEN 11   --COST OF SALES   WHEN ACCOUNTLEVEL3CODE = '5000' THEN 12   --NET LABOUR RECOVERIES   WHEN ACCOUNTLEVEL5CODE IN ('6501','6600','6696') THEN 20   -- INCL ESTIMATORS AND PMS   --WHEN ACCOUNTLEVEL6CODE IN ('7010') THEN 20   --NET VEHICLE RECOVERIES   WHEN ACCOUNTLEVEL5CODE IN ('6700', '6789') THEN 25   --CORPORATE RECOVERIES EXCLUDING RENT, EXCLUDE FROM SUNDRY INCOME   WHEN ACCOUNTLEVEL5CODE = '4365' AND ACCOUNTLEVEL6CODE <> '4377' THEN 31   --SUNDRY INCOME   WHEN ACCOUNTLEVEL4CODE = '4364' THEN 30   --NETWORK MAINTENANCE   WHEN ACCOUNTLEVEL4CODE = '6001' THEN 40   --SUPPORT COSTS   WHEN ACCOUNTLEVEL5CODE = '7470' THEN 51   --CORPORATE ALLOCATIONS   WHEN ACCOUNTLEVEL5CODE = '7500' THEN 52   --DEPRECIATION   WHEN ACCOUNTLEVEL5CODE = '7400' THEN 53  WHEN ACCOUNTLEVEL5CODE = '7439' THEN 53   --EXPENSES   WHEN ACCOUNTLEVEL3CODE = '6000' AND ACCOUNTLEVEL5CODE NOT IN ('6501','6600','6696') AND ACCOUNTLEVEL4CODE <> '6001' THEN 50  ELSE 100 END
