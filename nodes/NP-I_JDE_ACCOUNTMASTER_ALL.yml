        description: A values that determines what section of the Financial Statement of Performance report the amount should be reported in. (e.g. Turnover, Net Labour Recoveries, Sundry Income or Expenses).
        name: SOFPREPORTSECTION
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: "0"
                stepCounter: "0"
            transform: CASE --INTERNAL PROFIT ADJUSTMENT   WHEN ACCOUNTLEVEL7CODE = '4491' THEN 'INTERNAL PROFIT ADJUSTMENT'   --INTEREST   WHEN ACCOUNTLEVEL6CODE = '8610' THEN 'INTEREST'   WHEN ACCOUNTLEVEL6CODE = '4420' THEN 'INTEREST'  WHEN ACCOUNTLEVEL6CODE = '8641' THEN 'INTEREST'   --TAX   WHEN ACCOUNTLEVEL5CODE = '9000' THEN 'TAX'   --SUPPORT COSTS   WHEN ACCOUNTLEVEL5CODE = '7470' THEN 'SUPPORT COSTS'   --CORPORATE ALLOCATIONS   WHEN ACCOUNTLEVEL5CODE = '7500' THEN 'CORPORATE ALLOCATIONS'   --DEPRECIATION   WHEN ACCOUNTLEVEL5CODE = '7400' THEN 'DEPRECIATION'  WHEN ACCOUNTLEVEL5CODE = '7439' THEN 'DEPRECIATION'   --DERIVIATIVES   WHEN ACCOUNTLEVEL5CODE = '8700' THEN 'DERIVATIVES'   WHEN ACCOUNTLEVEL3CODE IN ('4000','5000') AND ACCOUNTLEVEL4CODE <> '4364' THEN 'TURNOVER'   --FIELD STAFF   WHEN ACCOUNTLEVEL5CODE IN ('6501','6600','6696') THEN 'NET LABOUR RECOVERIES'   --ESTIMATORS AND PMS 19/3/2018 DECIDED NOT TO MOVE THESE EXPENSES FOR NOW   --WHEN ACCOUNTLEVEL6CODE = '7010' THEN 'NET LABOUR RECOVERIES'   WHEN ACCOUNTLEVEL5CODE IN ('6700', '6789') THEN 'NET VEHICLE RECOVERIES'   WHEN ACCOUNTLEVEL6CODE = '4405' THEN 'OTHER INCOME'   WHEN ACCOUNTLEVEL4CODE = '4364' THEN 'SUNDRY INCOME'   WHEN ACCOUNTLEVEL4CODE = '6001' THEN 'NETWORK MAINTENANCE'   WHEN ACCOUNTLEVEL3CODE = '6000' THEN 'EXPENSES'   ELSE 'BALANCE SHEET' END
      - appliedColumnTests: {}
        columnReference:
