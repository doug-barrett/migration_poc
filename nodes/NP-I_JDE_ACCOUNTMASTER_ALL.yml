            transform: CASE --INTERNAL PROFIT ADJUSTMENT   WHEN ACCOUNTLEVEL7CODE = '4491' THEN 12   --INTEREST   WHEN ACCOUNTLEVEL6CODE = '8610' THEN 13   WHEN ACCOUNTLEVEL6CODE = '4420' THEN 13   WHEN ACCOUNTLEVEL6CODE = '8641' THEN 13    --TAX   WHEN ACCOUNTLEVEL5CODE = '9000' THEN 14   --SUPPORT COSTS   WHEN ACCOUNTLEVEL5CODE = '7470' THEN 8   --CORPORATE ALLOCATIONS   WHEN ACCOUNTLEVEL5CODE = '7500' THEN 9   --DEPRECIATION   WHEN ACCOUNTLEVEL5CODE = '7400' THEN 10   WHEN ACCOUNTLEVEL5CODE = '7439' THEN 10   --DERIVIATIVES   WHEN ACCOUNTLEVEL5CODE = '8700' THEN 11   --TURNOVER   WHEN ACCOUNTLEVEL3CODE IN ('4000','5000') AND ACCOUNTLEVEL4CODE <> '4364' THEN 1   --NET LABOUR RECOVERIES   --FIELD STAFF   WHEN ACCOUNTLEVEL5CODE IN ('6501','6600','6696') THEN 3   --ESTIMATORS AND PMS   --WHEN ACCOUNTLEVEL6CODE = '7010' THEN 3   --NET VEHICLE RECOVERIES   WHEN ACCOUNTLEVEL5CODE IN ('6700','6789') THEN 4   --OTHER INCOME   WHEN ACCOUNTLEVEL6CODE = '4405' THEN 2   --SUNDRY INCOME   WHEN ACCOUNTLEVEL4CODE = '4364' THEN 5   --NETWORK MAINTENANCE   WHEN ACCOUNTLEVEL4CODE = '6001' THEN 6   --EXPENSES   WHEN ACCOUNTLEVEL3CODE = '6000' THEN 7  ELSE 15 END
      - appliedColumnTests: {}
