        description: Values that determines what section of the Financial reports the amount should be reported in. (Turnover, Net Labour Recoveries, Sundry Income, Expenses..). This mostly follows the chart of accounts, but we have some sections that we want to highlight in the SoFP or board reports.
        name: REPORTSECTION
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: "0"
                stepCounter: "0"
            transform: CASE --INTERNAL PROFIT ADJUSTMENT   WHEN ACCOUNTLEVEL7CODE = '4491' THEN 'INTERNAL PROFIT ADJUSTMENT'   --INTEREST   WHEN ACCOUNTLEVEL6CODE = '8610' THEN 'INTEREST'   WHEN ACCOUNTLEVEL6CODE = '4420' THEN 'INTEREST'  WHEN ACCOUNTLEVEL6CODE = '8641' THEN 'INTEREST'   --TAX   WHEN ACCOUNTLEVEL5CODE = '9000' THEN 'TAX'   --DERIVIATIVES   WHEN ACCOUNTLEVEL5CODE = '8700' THEN 'DERIVATIVES'   --REVENUE EXCLUDING SUNDRY INCOME, BUT INCLUDING CONTRACT FEES AND KPI BONUS   WHEN ACCOUNTLEVEL3CODE = '4000' AND (ACCOUNTLEVEL4CODE <> '4364' OR ACCOUNTLEVEL6CODE = '4405') THEN 'REVENUE'   WHEN ACCOUNTLEVEL3CODE = '5000' THEN 'COST OF SALES'   WHEN ACCOUNTLEVEL5CODE IN ('6501','6600','6696') THEN 'NET LABOUR RECOVERIES'   --INCLUDE ESTIMATORS AND PMS   --WHEN ACCOUNTLEVEL6CODE IN ('7010') THEN 'NET LABOUR RECOVERIES'   WHEN ACCOUNTLEVEL5CODE IN ('6700', '6789') THEN 'NET VEHICLE RECOVERIES'   --CORPORATE RECOVERIES EXCLUDING RENT, EXCLUDE FROM SUNDRY INCOME   WHEN ACCOUNTLEVEL5CODE = '4365' AND ACCOUNTLEVEL6CODE <> '4377' THEN 'CORPORATE RECOVERIES'   WHEN ACCOUNTLEVEL4CODE = '4364' THEN 'SUNDRY INCOME'   WHEN ACCOUNTLEVEL4CODE = '6001' THEN 'NETWORK MAINTENANCE'   WHEN ACCOUNTLEVEL5CODE = '7470' THEN 'SUPPORT COSTS'   WHEN ACCOUNTLEVEL5CODE = '7500' THEN 'CORPORATE ALLOCATIONS'   WHEN ACCOUNTLEVEL5CODE = '7400' THEN 'DEPRECIATION'  WHEN ACCOUNTLEVEL5CODE = '7439' THEN 'DEPRECIATION'   WHEN ACCOUNTLEVEL3CODE = '6000' AND ACCOUNTLEVEL5CODE NOT IN ('6501','6600','6696') AND ACCOUNTLEVEL4CODE <> '6001' THEN 'EXPENSES'   ELSE 'BALANCE SHEET' END
