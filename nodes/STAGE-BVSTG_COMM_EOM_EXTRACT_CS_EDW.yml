                                                                   CASE WHEN trim(TransactionType) = 'Reinstatement' THEN 1
                                                                        ELSE 0
                                                                         END AS Reinstatement_Flag_Temp,
                                                                   CASE WHEN trim(TransactionType) ='Endorsement' THEN 1
                                                                        ELSE 0
                                                                         END AS Endorsement_Flag_Temp
                                                              FROM {{ ref('STAGE','BVSTG_COMM_AU2_EOM_EXTRACT_CS') }}
                                                           )
                                                     GROUP BY PolicyNumberFormatted,
                                                              executionmonth,
                                                              carrier
                                                   )
                                           ) bvstg_comm_au2_eom_extract_cs
                                        ON ds_comm_eom_extract_cs.policynumberformatted = bvstg_comm_au2_eom_extract_cs.policynumberformatted
                                       AND ds_comm_eom_extract_cs.carrier = bvstg_comm_au2_eom_extract_cs.carrier
                                       AND ds_comm_eom_extract_cs.CutoffDate = bvstg_comm_au2_eom_extract_cs.ExecutionMonth
