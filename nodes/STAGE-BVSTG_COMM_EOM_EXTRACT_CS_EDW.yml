        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_COMM_AU4_EOM_EXTRACT_CS_EDW') }} bvstg_comm_au4_eom_extract_cs_edw
              LEFT JOIN (
                    SELECT *,
                           max(ExecutionMonth) OVER (PARTITION BY PolicyNumberFormatted, Carrier, grp1 ORDER BY CutoffDate ROWS UNBOUNDED PRECEDING) AS LastTransactionExecutionMonth,
                           max(TransactionType) OVER (PARTITION BY PolicyNumberFormatted, Carrier,grp1 ORDER BY CutoffDate ROWS UNBOUNDED PRECEDING) AS LastTransaction
                      FROM (
                            SELECT *,
                                   max(CASE WHEN TransactionType IS NOT NULL THEN CutoffDate END) OVER (PARTITION BY PolicyNumberFormatted, Carrier ORDER BY CutoffDate ROWS UNBOUNDED PRECEDING) AS grp1
                              FROM (
                                    SELECT ds_comm_eom_extract_cs.PolicyNumberFormatted,
                                           ds_comm_eom_extract_cs.Carrier,
                                           ds_comm_eom_extract_cs.CutoffDate,
                                           ExecutionMonth,
                                           TransactionType
                                      FROM {{ ref('UNKNOWN','DS_COMM_EOM_EXTRACT_CS') }} ds_comm_eom_extract_cs
                                      LEFT JOIN (
                                            SELECT DISTINCT POLICYNUMBERFORMATTED,
                                                   carrier,
                                                   executionmonth,
                                                   CASE WHEN Reinstatement_Flag = 1 THEN 'Reinstatement'
                                                        WHEN Canc_Flag_EffMonth = 1 THEN 'Cancellation'
                                                        WHEN Renewal_Flag = 1       THEN 'Renewal'
                                                        WHEN New_Business_Flag = 1  THEN 'New Business'
                                                        WHEN Endorsement_Flag = 1   THEN 'Endorsement'
                                                        ELSE 'Other'
                                                         END AS TransactionType
                                              FROM (
                                                    SELECT DISTINCT PolicyNumberFormatted,
                                                           carrier,
                                                           executionmonth,
                                                           max(Canc_Flag_Temp) Canc_Flag_EffMonth,
                                                           max(Renewal_Flag_Temp) Renewal_Flag,
                                                           max(NB_Flag_Temp) New_Business_Flag,
                                                           max(Reinstatement_Flag_Temp) Reinstatement_Flag,
                                                           max(Endorsement_Flag_Temp) Endorsement_Flag
                                                      FROM (
                                                            SELECT DISTINCT PolicyNumberFormatted,
                                                                   executionmonth,
                                                                   carrier ,
                                                                   CASE WHEN trim(TransactionType) = 'Cancellation' THEN 1
                                                                        ELSE 0
                                                                         END AS Canc_Flag_Temp,
                                                                   CASE WHEN trim(TransactionType) = 'Renewal' THEN 1
                                                                        ELSE 0
                                                                         END AS Renewal_Flag_Temp,
                                                                   CASE WHEN trim(TransactionType) = 'New Business' THEN 1
                                                                        ELSE 0
                                                                         END AS NB_Flag_Temp,
                                                                   CASE WHEN trim(TransactionType) = 'Reinstatement' THEN 1
                                                                        ELSE 0
                                                                         END AS Reinstatement_Flag_Temp,
                                                                   CASE WHEN trim(TransactionType) ='Endorsement' THEN 1
                                                                        ELSE 0
                                                                         END AS Endorsement_Flag_Temp
                                                              FROM {{ ref('STAGE','BVSTG_COMM_AU2_EOM_EXTRACT_CS') }}
                                                           )
                                                     GROUP BY PolicyNumberFormatted,
                                                              executionmonth,
                                                              carrier
                                                   )
                                           ) bvstg_comm_au2_eom_extract_cs
                                        ON ds_comm_eom_extract_cs.policynumberformatted = bvstg_comm_au2_eom_extract_cs.policynumberformatted
                                       AND ds_comm_eom_extract_cs.carrier = bvstg_comm_au2_eom_extract_cs.carrier
                                       AND ds_comm_eom_extract_cs.CutoffDate = bvstg_comm_au2_eom_extract_cs.ExecutionMonth
                                   )
                           )
                   ) bvstg_comm_au2_eom_extract_cs
                ON bvstg_comm_au4_eom_extract_cs_edw.policynumberformatted = bvstg_comm_au2_eom_extract_cs.policynumberformatted
               AND bvstg_comm_au4_eom_extract_cs_edw.carrier = bvstg_comm_au2_eom_extract_cs.carrier
               AND bvstg_comm_au4_eom_extract_cs_edw.asofmonth = bvstg_comm_au2_eom_extract_cs.cutoffdate
