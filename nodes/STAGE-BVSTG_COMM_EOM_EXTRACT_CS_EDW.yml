                                                   CASE WHEN Reinstatement_Flag = 1 THEN 'Reinstatement'
                                                        WHEN Canc_Flag_EffMonth = 1 THEN 'Cancellation'
                                                        WHEN Renewal_Flag = 1       THEN 'Renewal'
                                                        WHEN New_Business_Flag = 1  THEN 'New Business'
                                                        WHEN Endorsement_Flag = 1   THEN 'Endorsement'
                                                        ELSE 'Other'
                                                         END AS TransactionType
                                              FROM (
