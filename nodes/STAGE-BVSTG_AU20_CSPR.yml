          - locationName: STAGE
            nodeName: BVSTG_AU13_CSPR
        join:
          joinCondition: |-
            FROM (
                    SELECT OFFICECODES_MAPPED,
                           ud2id,
                           CASE WHEN ud2id IS NULL THEN 0
                                ELSE 1
                                 END IS_OS_OFFICECODE,
                           monthyear,
                           CHILD_DESCR,
                           accounts_mapped,
                           CASE WHEN month(monthyear) <> 1 THEN values_month-lag(values_month) OVER (PARTITION BY officecodes_Mapped, ud2id, CHILD_DESCR,Accounts_Mapped ORDER BY monthyear)
                                ELSE values_month
                                 END AS values_month
                      FROM (
                            SELECT DISTINCT OFFICECODES_MAPPED,
                                   ud2id,
                                   date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear,
                                   CHILD_DESCR,
                                   accounts_mapped,
                                   ifnull(sum(values_month),0) values_month
                              FROM (
                                    SELECT UD2ID,
                                           officecodes_mapped,
                                           yearid,
                                           accountid,
                                           CHILD_DESCR,
                                           accounts_mapped AS accounts_mapped_old,

                                     MONTH,
                                           Values_Month,
                                           CASE WHEN accountid IN ('2603','2604','2605','2606','2607','2608') THEN 'Advertising_OS'
                                                ELSE accounts_mapped
                                                 END AS accounts_mapped
                                      FROM (
                                            SELECT bvstg_au11_cspr.UD2ID,
                                                   bvstg_au19_cspr.officecodes_mapped,
                                                   yearid,
                                                   accountid,
                                                   bvstg_au13_cspr.CHILD_DESCR,
                                                   bvstg_au13_cspr.accounts_mapped,

                                             MONTH,
                                                   sum(ifnull(values_month,0)) AS Values_Month,

                                              FROM {{ ref('STAGE','BVSTG_AU11_CSPR') }} bvstg_au11_cspr UNPIVOT (values_month FOR MONTH IN (M1VALUE, M2VALUE, M3VALUE, M4VALUE, M5VALUE, M6VALUE, M7VALUE, M8VALUE, M9VALUE, M10VALUE, M11VALUE, M12VALUE))
                                              LEFT JOIN (
                                                    SELECT DISTINCT ud2id,
                                                           officecodes_mapped
                                                      FROM {{ ref('STAGE','BVSTG_AU19_CSPR') }}
                                                   ) bvstg_au19_cspr
                                                ON bvstg_au11_cspr.ud2id = bvstg_au19_cspr.ud2id
                                              LEFT JOIN (
                                                    SELECT DISTINCT childid,
                                                           CHILD_DESCR,
                                                           accounts_mapped
                                                      FROM {{ ref('STAGE','BVSTG_AU13_CSPR') }}
                                                   ) bvstg_au13_cspr
                                                ON bvstg_au11_cspr.accountid = bvstg_au13_cspr.childid
                                             GROUP BY bvstg_au11_cspr.UD2ID,
                                                      yearid,
                                                      accountid,

                                                MONTH,
                                                      bvstg_au19_cspr.officecodes_mapped,
                                                      bvstg_au13_cspr.CHILD_DESCR,
                                                      bvstg_au13_cspr.accounts_mapped
                                           )
                                   )
                             WHERE ud2id IN (
                                    SELECT DISTINCT ud2id
                                      FROM {{ ref('STAGE','BVSTG_AU19_CSPR') }}
                                   )
                               AND accountid IN (
                                    SELECT DISTINCT childid
                                      FROM {{ ref('STAGE','BVSTG_AU13_CSPR') }}
                                   )
                               AND monthyear <= dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                             GROUP BY OFFICECODES_MAPPED,
                                      ud2id,
                                      CHILD_DESCR,
                                      accounts_mapped,
                                      date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                           )
                   ) AS BVSTG_AU11_CSPR
             GROUP BY BVSTG_AU11_CSPR.OFFICECODES_MAPPED,
                      BVSTG_AU11_CSPR.monthyear,
                      BVSTG_AU11_CSPR.CHILD_DESCR,
                      BVSTG_AU11_CSPR.accounts_mapped
