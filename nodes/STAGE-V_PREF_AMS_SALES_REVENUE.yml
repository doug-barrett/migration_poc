    sourceMapping:
      - aliases:
          V_PREF_AMS_SALES_REVENUE: 6d408be6-83a8-4917-8885-30bdbb392004
          V_PREF_AMS_TR_SALES_REVENUE: 6680745d-7cea-4390-817f-550d33199e23
          V_PREF_AMS_TR_SALES_REVENUE_VOIDED: 8cbc1887-b6d7-46e3-829c-46a4445cbc73
          V_PRED_COMPANY: b4cf4ded-3a7e-4c72-b6db-452995d25cb7
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREF_AMS_SALES_REVENUE') }} AS SELECT CASE WHEN Date IS NULL        THEN '1904-07-03'
                        WHEN Date < '1904-07-03' THEN '1904-07-03'
                        WHEN Date > '2068-11-28' THEN '2068-11-28'
                        ELSE Date
                         END AS Date ,
                   TRIM(IFNULL(OfficeCode,'Unknown')) AS OfficeCode ,
                   IFNULL(transactiontype,'Unknown') AS TransactionType ,
                   CASE WHEN TRY_TO_NUMBER(employeenumber) IS NULL THEN IFNULL(employeenumber,'Unknown')
                        ELSE RIGHT(CONCAT('00000',employeenumber),6)
                         END AS employeenumber ,
                   IFNULL(isLegacyTransaction,'Unknown') AS isLegacyTransaction ,
                   IFNULL(companyid,'Unknown') AS Mastercarrierid ,
                   CASE WHEN transactionmethod='UNKNOWN' THEN 'Unknown'
                        ELSE IFNULL(transactionmethod,'Unknown')
                         END AS transactionmethod ,
                   TRIM(IFNULL(lineofbusinesstype,'Unknown')) AS lineofbusinesstype ,
                   IFNULL(term,'Unknown') AS term ,
                   IFNULL(CustomerID,'Unknown') AS CustomerID ,
                   IFNULL(PolicyID,'Unknown') AS PolicyID ,
                   SUM(quotes) AS quotes ,
                   SUM(leads) AS leads ,
                   SUM(paid) AS paid ,
                   SUM(reinstatements) AS reinstatements ,
                   SUM(current_premium) AS current_premium ,
                   SUM(carrier_premium) AS carrier_premium ,
                   SUM(cancelled_premium) AS cancelled_premium ,
                   SUM(reinstate_premium) AS reinstate_premium ,
                   SUM(written_premium) AS written_premium ,
                   SUM(carrier_submit_premium) AS carrier_submit_premium ,
                   SUM(voided_written_premium) AS voided_written_premium ,
                   SUM(voided_carrier_submit_premium) AS voided_carrier_submit_premium ,
                   SUM(rewrites) AS rewrites ,
                   SUM(endorsements) AS endorsements ,
                   SUM(cancellations) AS cancellations ,
                   SUM(monthly_payments) AS monthly_payments ,
                   SUM(voided_rewrites) AS voided_rewrites ,
                   SUM(voided_endorsements) AS voided_endorsements ,
                   SUM(voided_monthly_payments) AS voided_monthly_payments ,
                   SUM(new_sales) AS new_sales ,
                   SUM(new_auto_sales) AS new_auto_sales ,
                   SUM(new_non_auto_sales) AS new_non_auto_sales ,
                   SUM(new_ancillary_sales) AS new_ancillary_sales ,
                   SUM(renewal_sales) AS renewal_sales ,
                   SUM(renewal_auto_sales) AS renewal_auto_sales ,
                   SUM(renewal_non_auto_sales) AS renewal_non_auto_sales ,
                   SUM(renewal_ancillary_sales) AS renewal_ancillary_sales ,
                   0 AS voided_new_sales --SUM(voided_new_sales)
             ,
                   0 AS voided_new_auto_sales --SUM(voided_new_auto_sales)
             ,
                   0 AS voided_new_non_auto_sales --SUM(voided_new_non_auto_sales)
             ,
                   SUM(voided_new_ancillary_sales) AS voided_new_ancillary_sales ,
                   0 AS voided_renewal_sales --SUM(voided_renewal_sales)
             ,
                   0 AS voided_renewal_auto_sales --SUM(voided_renewal_auto_sales)
             ,
                   0 AS voided_renewal_non_auto_sales --SUM(voided_renewal_non_auto_sales)
             ,
                   SUM(voided_renewal_ancillary_sales) AS voided_renewal_ancillary_sales ,
                   SUM(new_fee_revenue) AS new_fee_revenue ,
                   SUM(endorsement_revenue) AS endorsement_revenue ,
                   SUM(monthly_payment_revenue) AS monthly_payment_revenue ,
                   SUM(reinstatement_revenue) AS reinstatement_revenue ,
                   SUM(documentation_revenue) AS documentation_revenue ,
                   SUM(renewal_fee_revenue) AS renewal_fee_revenue ,
                   SUM(ancillary_revenue) AS ancillary_revenue ,
                   SUM(ancillary_cost) AS ancillary_cost ,
                   SUM(voided_new_fee_revenue) AS voided_new_fee_revenue ,
                   SUM(voided_endorsement_revenue) AS voided_endorsement_revenue ,
                   SUM(voided_monthly_payment_revenue) AS voided_monthly_payment_revenue ,
                   SUM(voided_reinstatement_revenue) AS voided_reinstatement_revenue ,
                   SUM(voided_documentation_revenue) AS voided_documentation_revenue ,
                   SUM(voided_renewal_fee_revenue) AS voided_renewal_fee_revenue ,
                   SUM(voided_ancillary_revenue) AS voided_ancillary_revenue ,
                   SUM(voided_ancillary_cost) AS voided_ancillary_cost ,
                   SUM(payment_received) AS payment_received ,
                   SUM(voided_payment) AS voided_payment ,
                   SUM(credit_extended) AS credit_extended ,
                   SUM(credit_collected) AS credit_collected ,
                   SUM(refund) AS refund ,
                   SUM(goals_auto_policy_sales) AS goals_auto_policy_sales ,
                   SUM(goals_new_revenue) AS goals_new_revenue
              FROM (
                    SELECT *
                      FROM {{ ref('STAGE','V_PREF_AMS_TR_SALES_REVENUE') }}
                     UNION SELECT *
                      FROM {{ ref('STAGE','V_PREF_AMS_TR_SALES_REVENUE_VOIDED') }}
                   )Sales
              LEFT JOIN {{ ref('STAGE','V_PRED_COMPANY') }}
                ON (sales.Mastercarrierid=v_pred_company.cocode)
             GROUP BY IFNULL(transactiontype,'Unknown') ,
                      IFNULL(term,'Unknown') ,
                      IFNULL(CustomerID,'Unknown') ,
                      CASE WHEN TRY_TO_NUMBER(employeenumber) IS NULL THEN IFNULL(employeenumber,'Unknown')
                           ELSE RIGHT(CONCAT('00000',employeenumber),6)
                            END ,
                      IFNULL(isLegacyTransaction,'Unknown') ,
                      CASE WHEN Date IS NULL        THEN '1904-07-03'
                           WHEN Date < '1904-07-03' THEN '1904-07-03'
                           WHEN Date > '2068-11-28' THEN '2068-11-28'
                           ELSE Date
                            END ,
                      CASE WHEN transactionmethod='UNKNOWN' THEN 'Unknown'
                           ELSE IFNULL(transactionmethod,'Unknown')
                            END ,
                      IFNULL(companyid,'Unknown') ,
                      TRIM(IFNULL(lineofbusinesstype,'Unknown')) ,
                      TRIM(IFNULL(OfficeCode,'Unknown')) ,
                      IFNULL(PolicyID,'Unknown') ;
        dependencies:
          - locationName: STAGE
            nodeName: V_PREF_AMS_TR_SALES_REVENUE
          - locationName: STAGE
            nodeName: V_PREF_AMS_TR_SALES_REVENUE_VOIDED
          - locationName: STAGE
            nodeName: V_PRED_COMPANY
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','V_PREF_AMS_TR_SALES_REVENUE') }}
            {{ ref('STAGE','V_PREF_AMS_TR_SALES_REVENUE_VOIDED') }}
            {{ ref('STAGE','V_PRED_COMPANY') }}
