        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
             INNER JOIN (
                    SELECT DISTINCT CAL_MONTH,
                           CAL_YEAR,
                           CAL_MONTH_NO
                      FROM {{ ref('UNKNOWN','STAGE_DATE_SF') }}
                   ) STAGE_DATE_SF
                ON 1=1
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_HEAD_COUNTS') }} v_preb_wecare_head_counts
                ON v_preb_wecare_head_counts.Year|| RIGHT('0'|| v_preb_wecare_head_counts.Month,2) = CAL_MONTH
               AND v_preb_wecare_head_counts.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_DOI_COMPLAINT') }} v_preb_wecare_doi_complaint
                ON v_preb_wecare_doi_complaint.Year|| RIGHT('0'|| v_preb_wecare_doi_complaint.Month,2) = CAL_MONTH
               AND v_preb_wecare_doi_complaint.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_SALES') }} v_preb_wecare_sales
                ON v_preb_wecare_sales.Year|| RIGHT('0'|| v_preb_wecare_sales.Month,2) = CAL_MONTH
               AND v_preb_wecare_sales.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_FEE') }} v_preb_wecare_fee
                ON v_preb_wecare_fee.Year|| RIGHT('0'|| v_preb_wecare_fee.Month,2) = CAL_MONTH
               AND v_preb_wecare_fee.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_MAJOR_ERROR') }} v_preb_wecare_major_error
                ON v_preb_wecare_major_error.Year|| RIGHT('0'|| v_preb_wecare_major_error.Month,2) = CAL_MONTH
               AND v_preb_wecare_major_error.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_NPS') }} v_preb_wecare_nps
                ON v_preb_wecare_nps.Year|| RIGHT('0'|| v_preb_wecare_nps.Month,2) = CAL_MONTH
               AND v_preb_wecare_nps.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_PHENOMENALSCORE') }} v_preb_wecare_phenomenalscore
                ON v_preb_wecare_phenomenalscore.Year|| RIGHT('0'|| v_preb_wecare_phenomenalscore.Month,2) = CAL_MONTH
               AND v_preb_wecare_phenomenalscore.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_STAR_RATING') }} v_preb_wecare_star_rating
                ON v_preb_wecare_star_rating.Year|| RIGHT('0'|| v_preb_wecare_star_rating.Month,2) = CAL_MONTH
               AND v_preb_wecare_star_rating.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_STAR_RATING_SCORE') }} v_preb_wecare_star_rating_score
                ON v_preb_wecare_star_rating_score.Year|| RIGHT('0'|| v_preb_wecare_star_rating_score.Month,2) = CAL_MONTH
               AND v_preb_wecare_star_rating_score.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_POSITIVEOR') }} v_preb_wecare_positiveor
                ON v_preb_wecare_positiveor.Year|| RIGHT('0'|| v_preb_wecare_positiveor.Month,2) = CAL_MONTH
               AND v_preb_wecare_positiveor.OfficeCode = ds_retail_office.OfficeCode
             WHERE CAL_MONTH = '{{ parameters.HWM_BVSTG_Wecare }}'
               AND LEN(ds_retail_office.OfficeCode) <= 10
             ORDER BY ds_retail_office.OfficeCode
