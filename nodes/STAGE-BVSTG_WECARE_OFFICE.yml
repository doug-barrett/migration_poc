              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_DOI_COMPLAINT') }} v_preb_wecare_doi_complaint
                ON v_preb_wecare_doi_complaint.Year|| RIGHT('0'|| v_preb_wecare_doi_complaint.Month,2) = CAL_MONTH
