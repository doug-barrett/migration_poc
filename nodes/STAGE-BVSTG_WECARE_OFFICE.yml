              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_NPS') }} v_preb_wecare_nps
                ON v_preb_wecare_nps.Year|| RIGHT('0'|| v_preb_wecare_nps.Month,2) = CAL_MONTH
               AND v_preb_wecare_nps.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_PHENOMENALSCORE') }} v_preb_wecare_phenomenalscore
                ON v_preb_wecare_phenomenalscore.Year|| RIGHT('0'|| v_preb_wecare_phenomenalscore.Month,2) = CAL_MONTH
               AND v_preb_wecare_phenomenalscore.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_STAR_RATING') }} v_preb_wecare_star_rating
                ON v_preb_wecare_star_rating.Year|| RIGHT('0'|| v_preb_wecare_star_rating.Month,2) = CAL_MONTH
               AND v_preb_wecare_star_rating.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_STAR_RATING_SCORE') }} v_preb_wecare_star_rating_score
                ON v_preb_wecare_star_rating_score.Year|| RIGHT('0'|| v_preb_wecare_star_rating_score.Month,2) = CAL_MONTH
               AND v_preb_wecare_star_rating_score.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_POSITIVEOR') }} v_preb_wecare_positiveor
                ON v_preb_wecare_positiveor.Year|| RIGHT('0'|| v_preb_wecare_positiveor.Month,2) = CAL_MONTH
               AND v_preb_wecare_positiveor.OfficeCode = ds_retail_office.OfficeCode
