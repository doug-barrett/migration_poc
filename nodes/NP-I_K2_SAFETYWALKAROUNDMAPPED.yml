        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: c01440b1-0577-4b0b-a281-5e4f6890ca68
                stepCounter: ed4e6a26-6e55-417e-8e85-d6ee4f039a71
            transform: CASE --OLD CODE BUT KEEPING IN FOR NOW AS THIS WON'T AFFECT ANYTHING KW 20250826   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - AUCKLAND' THEN 'DCC905'--'DXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - CENTRAL' THEN 'KCC905'--'KXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - FIBRE' THEN 'NCC905'--'NXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - NORTHERN' THEN 'CCC905'--'CXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - NORTHLAND' THEN 'CCC905'--'CXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - SOUTHERN' THEN 'LCC905'--'LXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - TRANSMISSION' THEN 'MCC905'--'MXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CORPORATE' THEN 'AHS'--'AXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'NETWORK - ELECTRICITY' THEN 'BHS'--'BXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'NETWORK - FIBRE' THEN 'SBF905'--'SXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - LEADERSHIP TEAM' THEN 'JCC905'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - FUTURE ENERGY' THEN 'JEN905'    --NEW CODE BELOW. BUSINESS UNITS IN A AND B DON'T HAVE A 905 SUFFIX / OVERHEAD BUSINESS UNIT    ELSE RIGHT(L_K2_SAFETYWALKAROUND.BUSINESSUNIT, 3) +     CASE      WHEN LEFT(RIGHT(L_K2_SAFETYWALKAROUND.BUSINESSUNIT, 3), 1) IN ('A', 'B') THEN ''      ELSE '905'     END   --ELSE 'UNKNOWN'   END
