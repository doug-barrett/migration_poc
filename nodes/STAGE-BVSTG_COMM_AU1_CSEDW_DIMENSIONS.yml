    sourceMapping:
      - aliases:
          DS_COMM_POLICY_STATUS_EXTRACT_CS: 868cf9ba-4e95-4de0-a23d-be9e345a038c
          V_PRED_MONTHS: ae944c3a-4867-4559-b5a6-92a3211e7fa8
          DS_COMM_EOM_EXTRACT_ALLSOURCES: 2b203c3a-983b-4862-9cb4-5a58db260d09
          DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF: 638b206c-e8cc-42b6-bf13-1cd16446e04f
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_COMM_POLICY_STATUS_EXTRACT_CS
          - locationName: STAGE
            nodeName: V_PRED_MONTHS
          - locationName: EDW
            nodeName: DS_COMM_EOM_EXTRACT_ALLSOURCES
          - locationName: EDW
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF
        join:
          joinCondition: |-
            EXTENDED
              FROM( SELECT CASE WHEN ds_comm_policy_status_extract_cs.carrier = 'Kemper' THEN 'Infinity'
                        ELSE ds_comm_policy_status_extract_cs.carrier
                         END AS carrier,
                   ds_comm_policy_status_extract_cs.carrierdisplayname,
                   ds_comm_policy_status_extract_cs.cutoffdate,
                   ifnull(ds_comm_policy_status_extract_cs.AGENCYSTATE,'Missing') AS AGENCYSTATE,
                   ifnull(ds_comm_policy_status_extract_cs.CUSTOMERSTATE,'Missing') AS CUSTOMERSTATE,
                   ifnull(ds_comm_policy_status_extract_cs.BRAND,'Missing') AS BRAND,
                   sum(ds_comm_policy_status_extract_cs.cs_status) AS PIF_CS,
                   sum(ds_comm_policy_status_extract_cs.premium) AS Premium_CS
              FROM ( SELECT DISTINCT ds_comm_policy_status_extract_cs.carrier,
                   ds_comm_policy_status_extract_cs.carrierdisplayname,
                   ds_comm_policy_status_extract_cs.cutoffdate,
                   ds_comm_policy_status_extract_cs.cs_status,
                   ds_comm_policy_status_extract_cs.policynumberformatted,
                   ds_comm_policy_status_extract_cs.premium,
                   pif.AGENCYSTATE,
                   pif.CUSTOMERSTATE,
                   pif.agency AS brand
              FROM (SELECT DISTINCT ds_comm_policy_status_extract_cs_1.policynumberformatted,
                   ds_comm_policy_status_extract_cs_1.carrier,
                   CASE WHEN ds_comm_policy_status_extract_cs_1.carrier='Infinity' OR ds_comm_policy_status_extract_cs_1.carrier='Kemper' THEN 'Infinity/Kemper'
                        WHEN ds_comm_policy_status_extract_cs_1.carrier = 'Bristol West'                                                  THEN 'Bristol West/Foremost'
                        WHEN ds_comm_policy_status_extract_cs_1.carrier='Legacy'                                                         THEN 'Legacy/Nevada General'
                        WHEN lower(ds_comm_policy_status_extract_cs_1.carrier) like '%first%acceptance%'                                  THEN 'First Acceptance'
                        ELSE ds_comm_policy_status_extract_cs_1.carrier
                         END AS carrierdisplayname,
                   ds_comm_policy_status_extract_cs_1.cutoffdate,
                   premium,
                   CASE WHEN policystatus_eom = 'Active' THEN 1
                        ELSE 0
                         END AS CS_Status
              FROM (SELECT *
              FROM (SELECT DISTINCT policynumberformatted,
                   carrier
              FROM {{ ref('EDW','DS_COMM_POLICY_STATUS_EXTRACT_CS') }} --         from "RETAIL_PROD"."SCH_EDW"."DS_COMM_POLICY_STATUS_EXTRACT_CS"            ) ds_comm_policy_status_extract_cs          cross join          (select distinct to_date(min_date) cutoffdate           from {{ ref('STAGE','V_PRED_MONTHS') }}  --        from "RETAIL_PROD"."SCH_BVSTAGE"."V_PRED_MONTHS"          where min_date >= '2019-01-01' and min_date<=date_trunc('Month',add_months(current_date(),-1))) V_PRED_MONTHS)  ds_comm_policy_status_extract_cs_1  left join {{ ref('EDW','DS_COMM_POLICY_STATUS_EXTRACT_CS') }} ds_comm_policy_status_extract_cs_2         --left join "RETAIL_PROD"."SCH_EDW"."DS_COMM_POLICY_STATUS_EXTRACT_CS"  ds_comm_policy_status_extract_cs_2         on ds_comm_policy_status_extract_cs_1.carrier=ds_comm_policy_status_extract_cs_2.carrier         and ds_comm_policy_status_extract_cs_1.policynumberformatted=ds_comm_policy_status_extract_cs_2.policynumberformatted         and ds_comm_policy_status_extract_cs_1.cutoffdate=ds_comm_policy_status_extract_cs_2.cutoffdate  --where ds_comm_policy_status_extract_cs_1.carrier not in ('Key Insurance')  ) ds_comm_policy_status_extract_cs    left join  (select a.POLICYNUMBERFORMATTED,CARRIERDISPLAYNAME_OR,AGENCYSTATE,CUSTOMERSTATE,AGENCY            from               (select distinct POLICYNUMBERFORMATTED,CARRIER,AGENCYSTATE,CUSTOMERSTATE,AGENCY from       {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}  --    "RETAIL_PROD"."SCH_EDW"."DS_COMM_EOM_EXTRACT_ALLSOURCES"      ) as a               left join               (select distinct POLICYNUMBERFORMATTED,CARRIERDISPLAYNAME,CARRIERDISPLAYNAME_OR from       {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}  --    "RETAIL_PROD"."SCH_EDW"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF"      ) as b               on a.POLICYNUMBERFORMATTED=b.POLICYNUMBERFORMATTED and a.CARRIER=b.CARRIERDISPLAYNAME  ) as pif  on ds_comm_policy_status_extract_cs.P
        name: BVSTG_COMM_AU1_CSEDW_DIMENSIONS
        noLinkRefs: []
