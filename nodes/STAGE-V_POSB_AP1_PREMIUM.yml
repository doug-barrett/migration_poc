            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_AP1_PREMIUM') }} AS SELECT bvstg_ap1_au_premiumchange.PolicyID,
                   SUM(bvstg_ap1_au_premiumchange.PremiumAmount) AS CurrentPremium,
                   SUM(CASE WHEN bvstg_ap1_au_premiumchange.isWrittenPremium = 1 THEN bvstg_ap1_au_premiumchange.PremiumAmount ELSE 0 END) AS WrittenPremium
              FROM {{ ref('STAGE','BVSTG_AP1_AU_PREMIUMCHANGE') }} bvstg_ap1_au_premiumchange
             WHERE bvstg_ap1_au_premiumchange.isVoid = 0
             GROUP BY bvstg_ap1_au_premiumchange.PolicyID
