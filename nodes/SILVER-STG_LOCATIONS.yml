    sourceMapping:
    - aliases:
        SRC_LOCATIONS: 0153227e-77d3-5ef0-9cc5-687d1dbd5186
      customSQL:
        customSQL: "select a.*,b.capacity from (\nselect trim(a.Id)  as LocationId,case\
          \ when Trim(a.Number)='0' then '0000' else Trim(a.Number) end AS MarketNumber,\
          \ active as Active, a.name as LocationName\nfrom locations a\nUNION\nselect\
          \ distinct invoices.location_id as LocationId, '0000' as MarketNumber, 0\
          \ as Active, CONCAT('Undefined-', invoices.location_id) as LocationName\
          \ from invoices \nwhere invoices.location_id not in (select id from locations)\n\
          union \nselect -11 as LocationId, '0000' as MarketNumber, 0 as Active, 'Undefined'\
          \ as LocationName ) a \nleft join  \n(SELECT location_id, capacity, date\n\
          FROM (\n    SELECT *,\n           ROW_NUMBER() OVER (PARTITION BY location_id\
          \ ORDER BY date DESC) AS rn\n    FROM capacity_override\n\tWHERE date <=\
          \ LAST_DAY(CURDATE())\n) t\nWHERE rn = 1\n) b on CAST(a.LocationId AS SIGNED)\
          \ = b.location_id"
