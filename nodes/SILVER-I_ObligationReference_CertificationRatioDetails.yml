        transform: CASE   --FIRST CHECK AGAINST THE MINIMUM NUMBERS FOR A LOCATION   WHEN
          COALESCE(I_OBLIGATIONREFERENCE_CERTIFICATIONRATIOACTUAL.COMPETENCYCOUNT,0)
          < I_OBLIGATIONREFERENCE_CERTIFICATIONRATIO.MINIMUMNUMBER   THEN 0   --THEN
          CHECK AGAINST THE REQUIRED RATIO   WHEN COALESCE(I_OBLIGATIONREFERENCE_CERTIFICATIONRATIOACTUAL.COMPETENCYCOUNT,0)
          < I_OBLIGATIONREFERENCE_CERTIFICATIONRATIO.TARGETRATIO * I_OBLIGATIONREFERENCE_CERTIFICATIONRATIO.EMPLOYEECOUNT   THEN
          0   ELSE 1 END
