        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_LEADHISTORY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }} ds_bvstg_ap1_leadhistory
             INNER JOIN (
                    SELECT LeadID,
                           MAX(Created) max_created,
                           MAX(Lead_Ranking) max_Lead_Ranking
                      FROM {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }}
                     GROUP BY LeadID
                   )ds_bvstg_ap1_leadhistory_max
                ON ds_bvstg_ap1_leadhistory_max.LeadID = ds_bvstg_ap1_leadhistory.LeadID
             WHERE ds_bvstg_ap1_leadhistory.LeadID IN (
                    SELECT DISTINCT LeadID
                      FROM {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }}
                     WHERE DATE(Created)>='2021-03-01'
                   )
               AND ISLEAD = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_bvstg_ap1_leadhistory.LeadID,DATE(ds_bvstg_ap1_leadhistory.Created),ds_bvstg_ap1_leadhistory.PrimaryUserID ORDER BY ds_bvstg_ap1_leadhistory.Created,ds_bvstg_ap1_leadhistory.HistoryID)=1
        name: BVSTG_AU1_LEADHISTORY_CALLBACK
