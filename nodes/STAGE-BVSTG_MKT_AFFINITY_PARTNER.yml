        join:
          joinCondition: |-
            FROM "RETAIL_PROD"."SCH_EDW"."DS_MKT_CAMPAIGN2SALES" a
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_MKT_LEAD_SOURCE" l
                ON a.LeadId = l.LeadId
               AND l.sourcedb = 'AppOne'
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_LMS_MASTERLEAD_CURRENT b
