    - aliases:
        SRC_ITEMDETAILS: 617861e7-3215-5581-a3b6-44d17ef4964f
      customSQL:
        customSQL: "select items.id as ItemsId,items.invoice_id AS JobId,attachment_id\
          \ as AttachmentId,sale_item_id AS SaleItemId\n,items.price as Price,items.tax\
          \ as Tax,items.quantity as Quantity,list_quantity as ListQuantity,items.description\
          \ as Description,list_price as ListPrice,\ncost as Cost,cost_type as CostType,items.type\
          \ as ItemType,purchase_order_item_id as PurchaseOrderItemId, case when installed_appointment_id\
          \ is not null then 1 else 0 end as HasAppointment,\ninvoice_index AS InvoiceIndex,sourceable\
          \ as Sourceable,authorization_status as AuthorizationStatus,coalesce(invoices.account_company_id,-11)\
          \ as \"CompanyId\",\ncoalesce(invoices.location_id,-11) as \"LocationId\"\
          , \ninvoices.date as \"InvoiceDate\", IFF(a.user_id is null or a.user_id\
          \ ='','-11',a.user_id) as \"TechUsername\"\n, CONVERT_TIMEZONE('UTC', 'US/Central',\
          \ transactions.date) as TransactionDate,\nitems.sku as PartNumber, supplier\n\
          from items\nleft join invoices  on items.invoice_id = invoices.id\n LEFT\
          \ JOIN (select * from transactions\n where sequence=0 and type='invoiced'\n\
          \ )transactions on items.invoice_id = transactions.invoice_id\nleft join\
          \ appointments a on items.installed_appointment_id = a.id\nleft join purchase_order_items\
          \ poi on items.purchase_order_item_id = poi.id\nleft join purchase_orders\
          \ po on poi.purchase_order_id = po.id"
