      join:
        joinCondition: 'FROM {{ ref(''BRONZE'', ''OR_DPOLY'') }} or_dpoly

          LEFT JOIN {{ ref(''BRONZE'', ''OR_DBETR'') }} or_dbetr ON or_dpoly.UN_POL_NUM = or_dbetr.TC1_BEN_POL_NUM AND or_dpoly.UN_BEN_TYPE = or_dbetr.TC1_BEN_TYPE /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''YD_DEIREF'') }} yd_deiref ON or_dpoly.BC1_CLIENT_ID = yd_deiref.EI_ID /* Detail Outer Join */

          INNER JOIN {{ ref(''BRONZE'', ''DW_CONTRACT'') }} dw_contract ON or_dpoly.UN_POL_NUM = dw_contract.CONTRACT_ID

          LEFT JOIN {{ ref(''BRONZE'', ''OR_DBENE'') }} or_dbene ON or_dpoly.POL_NUM = or_dbene.BC1_BEN_POL_NUM AND or_dpoly.BEN_TYPE = or_dbene.BC1_BEN_TYPE /* Detail Outer Join */

          INNER JOIN {{ ref(''BRONZE'', ''YD_CLIENT_ID_XREF'') }} yd_client_id_xref ON yd_client_id_xref.EI_ID1 = or_dbene.BC1_CLIENT_ID

          LEFT JOIN {{ ref(''BRONZE'', ''DW_ASSESS'') }} lkp_dw_assess ON lkp_dw_assess.CODE = or_dbetr.o_tc1_perm_assess_code

          LEFT JOIN {{ ref(''BRONZE'', ''DW_STATE'') }} lkp_dw_state ON lkp_dw_state.CODE = or_dbetr.mas_BC1_SD_STATE_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''SMOKER_STATUS_CONVERT'') }} lkp_smoker_status_convert ON lkp_smoker_status_convert.SOURCE_SYSTEM_CODE = or_dbetr.TC1_SMOKER_ASSES_CODE AND lkp_smoker_status_convert.REF360_REFERENCE_DATA_SET = ''Smoker Status'' AND lkp_smoker_status_convert.SOURCE_PRODUCT_SYSTEM = ''OR''

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT_OPTION'') }} lkp_dw_product_option ON lkp_dw_product_option.PRODUCT_KEY = or_dbetr.PRODUCT_KEY AND lkp_dw_product_option.PRODUCT_OPTION_CODE = or_dbetr.mas_un_ben_type

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PARTY'') }} lkp_dw_party ON lkp_dw_party.PARTY_ID = or_dbetr.aa_BI_ID

          LEFT JOIN {{ ref(''BRONZE'', ''ASSESS_CONVERT'') }} lkp_assess_convert ON lkp_assess_convert.SOURCE_SYSTEM_CODE = CASE WHEN (or_dbetr.TC1_PERM_ASSESS_CODE IS NULL) THEN ''S'' ELSE or_dbetr.TC1_PERM_ASSESS_CODE END AND lkp_assess_convert.SOURCE_PRODUCT_SYSTEM = ''OR'' AND lkp_assess_convert.REF360_REFERENCE_DATA_SET = ''Assessment''

          LEFT JOIN {{ ref(''BRONZE'', ''DW_OCUPTN_CLASS'') }} lkp_dw_ocuptn_class ON lkp_dw_ocuptn_class.CODE = ''OR-''||or_dbetr.TC1_XTR_BEN_OCCUP_IND'
