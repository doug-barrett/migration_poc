               AND ifnull(v_dlbv_comm_carrierdatarepositorycomplete_current.producercode, '-') = ifnull(ds_bvstg_comm_producercodeoffice_map.producercode, '-')
               AND ifnull(v_dlbv_comm_carrierdatarepositorycomplete_current.producercode2, '-') = ifnull(ds_bvstg_comm_producercodeoffice_map.producercode2, '-')
              LEFT JOIN (
                    SELECT DISTINCT carriername,
                           carriername_grouped,
                           carrierdisplayname
                      FROM {{ ref('STAGE','DS_BVSTG_COMM_CARRIERMAPPING') }}
                     WHERE SOURCE = 'CS'
                   ) ds_bvstg_comm_carriermapping
                ON v_dlbv_comm_carrierdatarepositorycomplete_current.carrier=ds_bvstg_comm_carriermapping.carriername
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_COMM_TRANSACTIONMAPPING') }} ds_bvstg_comm_transactionmapping
                ON v_dlbv_comm_carrierdatarepositorycomplete_current.carrier = ds_bvstg_comm_transactionmapping.carrier
               AND v_dlbv_comm_carrierdatarepositorycomplete_current.transactiontype = ds_bvstg_comm_transactionmapping.transactioncode
             WHERE isdeleted = 'False'
               AND isduplicate = 'False'
               AND executionmonth <= (CASE WHEN datediff('days', current_date(), last_day(current_date())) <= 5 THEN date_trunc('month', add_months(current_date(), -1)) ELSE date_trunc('month', add_months(current_date(), -2)) END)
             GROUP BY executionmonth,
                      v_dlbv_comm_carrierdatarepositorycomplete_current.carrier,
                      carriername_grouped,
                      carrierdisplayname,
                      state,
                      branch,
                      statecode_final,
                      officecode_final
