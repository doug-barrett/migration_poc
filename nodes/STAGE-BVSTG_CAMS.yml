    sourceMapping:
      - aliases:
          V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT: 7fcf983c-e771-41c2-9a38-d61fd630419c
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT cams.* ,
                   ifnull(V_DL_COMM_LOBMAPPING_CURRENT.LOB,CAMS.Policytype_Old) Policytype,
                   row_number() OVER (PARTITION BY AGREEMENTREPOSITORYID ORDER BY ENTITYID_ENTITY_CAMS) AS rn
              FROM (SELECT DISTINCT cams.*, ----Updated to include entity related fields (Change date-: 17/08)  entityein_entity entityein_entity_cams,stateid_entity stateid_entity_cams,licensenumber_entity licensenumber_entity_cams,entityid_entity entityid_entity_cams  from  (Select  AR.AgreementRepositoryID  , IFNULL(GC.CARRIERNAME_GROUPED, AR.Carrier) as CAMS_Carrier  ,AR.MASTERCARRIERID MASTERCARRIERID_CAMS  , case when trim(AR.Standard )='' or AR.Standard  is null then null else AR.Standard  end as Standard  ,GC.CARRIERNAME_GROUPED as Mapped_Carrier  , IFNULL(AM.AgencySource, AR.Agency)        as CAMS_Agency  ,  case when (IFNULL(AM.AgencySource, AR.Agency) like '%FWY%'   OR IFNULL(AM.AgencySource, AR.Agency) like '%CACUL%'    OR IFNULL(AM.AgencySource, AR.Agency) like '%VF%'   OR IFNULL(AM.AgencySource, AR.Agency) like '%FMGA%'  OR IFNULL(AM.AgencySource, AR.Agency) like '%OASAZ%'  OR IFNULL(AM.AgencySource, AR.Agency) like '%Freeway%'                         OR IFNULL(AM.AgencySource, AR.Agency) like '%Frwy/OAS%'  OR IFNULL(AM.AgencySource, AR.Agency) like '%BAJD%') THEN 'Freeway Insurance Services America, LLC'      WHEN (IFNULL(AM.AgencySource, AR.Agency) like '%IO%'   OR IFNULL(AM.AgencySource, AR.Agency) like '%Insure One%' )THEN 'InsureOne Insurance Services America, LLC'     WHEN IFNULL(AM.AgencySource, AR.Agency) like '%SSB%' THEN 'SSB Insurance Services, Inc'    WHEN IFNULL(AM.AgencySource, AR.Agency) like '%BB%' THEN 'Buschbach'    WHEN (IFNULL(AM.AgencySource, AR.Agency) LIKE '%DC%' OR IFNULL(AM.AgencySource, AR.Agency) ='Driver''s Choice') THEN 'Driver''s Choice Insurance Services, LLC'  WHEN (IFNULL(AM.AgencySource, AR.Agency) LIKE '%AAF%' OR AM.AGENCYSTANDARD LIKE '%CIGH AFF%') THEN 'A-Affordable Insurance Agency'  WHEN (IFNULL(AM.AgencySource, AR.Agency) LIKE '%SH%') THEN 'SH'  WHEN (IFNULL(AM.AgencySource, AR.Agency) LIKE '%SPECA%') THEN 'Speedlane Insurance Services Inc'  WHEN (IFNULL(AM.AgencySource, AR.Agency) LIKE '%WSAG%') THEN 'Western Sa