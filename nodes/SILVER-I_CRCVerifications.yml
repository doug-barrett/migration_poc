      config: {}
      dataType: VARCHAR(100)
      description: Best as possible mapping to a valid work order number
      name: WorkOrder
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   --IF JUST A NUMBER, ASSUME THIS IS THE WORK ORDER NUMBER   --IT
          MUST ALSO BE SMALL ENOUGH TO FIT IN AN INTEGER FIELD   WHEN ISNUMERIC("JobNumber")
          = 1 AND LENGTH("JobNumber") < 10    THEN REPLACE(CAST("JobNumber" AS VARCHAR(100)),'.','')   --
          IF PREFIXED WITH THE WORK ORDER "Type", STRIP IT AND USE AS THE WORK ORDER
          NUMBER   WHEN LEFT(CAST("JobNumber" AS VARCHAR(100)),2) IN ('TC','TA','TF','WF')   AND
          ISNUMERIC(RIGHT(CAST("JobNumber" AS VARCHAR(100)),LENGTH(CAST("JobNumber"
          AS VARCHAR(100)))-2)) = 1    THEN REPLACE(RIGHT(CAST("JobNumber" AS VARCHAR(100)),LENGTH(CAST("JobNumber"
          AS VARCHAR(100)))-2),'.','')   -- ELSE TRY TO CONNECT TO THE WORK ORDER
          DIMENSION USING THE JOB NUMBER AS A REFERENCE FIELD   ELSE (SELECT MAX(CAST("WorkOrderNumber"
          AS VARCHAR(100))) FROM D_WORKORDER WHERE CAST("JobNumber" AS VARCHAR(100))
          = "D_WORKORDER".""ReferenceNumber"") END
