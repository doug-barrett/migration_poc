        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT *,
                   CASE WHEN dateadd(YEAR, datediff(YEAR, bvstg_comm_au3_customer_persistency_extract.DOB, bvstg_comm_au3_customer_persistency_extract.cust_start_date), bvstg_comm_au3_customer_persistency_extract.DOB) > bvstg_comm_au3_customer_persistency_extract.cust_start_date THEN datediff(YEAR, bvstg_comm_au3_customer_persistency_extract.DOB, bvstg_comm_au3_customer_persistency_extract.cust_start_date) -1
                        ELSE datediff(YEAR, bvstg_comm_au3_customer_persistency_extract.DOB, bvstg_comm_au3_customer_persistency_extract.cust_start_date)
                         END AS cust_age
              FROM (SELECT DISTINCT bvstg_comm_au3_customer_persistency_extract.customer_id,
                   CASE WHEN bvstg_comm_au3_customer_persistency_extract.cust_start_date > bvstg_comm_au1_customer_persistency_extract.min_nbs THEN bvstg_comm_au1_customer_persistency_extract.min_nbs
                        ELSE bvstg_comm_au3_customer_persistency_extract.cust_start_date
                         END AS cust_start_date,
                   bvstg_comm_au3_customer_persistency_extract.cust_end_date,
                   CASE WHEN year(CASE WHEN bvstg_comm_au3_customer_persistency_extract.cust_start_date > bvstg_comm_au1_customer_persistency_extract.min_nbs THEN bvstg_comm_au1_customer_persistency_extract.min_nbs ELSE bvstg_comm_au3_customer_persistency_extract.cust_start_date END) >= 2019 THEN 1
                        ELSE 0
                         END AS Retention,
                   bvstg_comm_au3_customer_persistency_extract.policynumberformatted,
                   bvstg_comm_au3_customer_persistency_extract.carrier,
                   bvstg_comm_au3_customer_persistency_extract.effectivedate,
                   bvstg_comm_au3_customer_persistency_extract.sourcedb,
                   bvstg_comm_au3_customer_persistency_extract.customer_type,
                   bvstg_comm_au3_customer_persistency_extract.lob_mapped,
                   CASE WHEN bvstg_comm_au3_customer_persistency_extract.statecode_mapped IS NULL OR bvstg_comm_au3_customer_persistency_extract.statecode_mapped IN ('Missing','Unknown') THEN 'Missing'
                        ELSE upper(bvstg_comm_au3_customer_persistency_extract.statecode_mapped)
                         END AS statecode_mapped,
                   to_number(bvstg_comm_au3_customer_persistency_extract.term) AS term,
                   bvstg_comm_au3_customer_persistency_extract.retail_type,
                   bvstg_comm_au3_customer_persistency_extract.cdtflagfinal,
                   bvstg_comm_au3_customer_persistency_extract.Last_Carrier,
                   bvstg_comm_au3_customer_persistency_extract.Unique_Carriers,
                   bvstg_comm_au3_customer_persistency_extract.PolicyCount,
                   ifnull(bvstg_comm_au3_customer_persistency_extract.islegacycustomer, 'Missing') islegacycustomer,
                   CASE WHEN bvstg_comm_au3_customer_persistency_extract.state IS NULL OR bvstg_comm_au3_customer_persistency_extract.state = 'Missing' THEN 'Missing'
                        ELSE upper(bvstg_comm_au3_customer_persistency_extract.state)
                         END AS state,
                   ifnull(bvstg_comm_au3_customer_persistency_extract.gender, 'Missing') gender,
                   ifnull(bvstg_comm_au3_customer_persistency_extract.cust_language, 'Missing') cust_language,
                   bvstg_comm_au3_customer_persistency_extract.dob,
                   ifnull(bvstg_comm_au3_customer_persistency_extract.leadsource, 'Missing') leadsource,
                   ifnull(bvstg_comm_au3_customer_persistency_extract.category, 'Missing') category,
