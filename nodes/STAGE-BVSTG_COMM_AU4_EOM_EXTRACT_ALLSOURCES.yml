                    SELECT DISTINCT BVSTG_COMM_AU3_EOM_EXTRACT_ALLSOURCES_ID ,
                           POLICYNUMBERFORMATTED ,
                           CARRIER ,
                           ASOFMONTH ,
                           STATUS_CS ,
                           STATUS_EDW ,
                           STATUS_CDT ,
                           RECORD_SOURCE ,
                           ISPOLICYINCS ,
                           ISPOLICYINEDW ,
                           ISPOLICYINCDT ,
                           STARTDATE_CDT ,
                           ENDDATE_CDT ,
                           DATE_NBS_TXN ,
                           LAST_TXN_CDT ,
                           LAST_TXN_DATE_CDT ,
                           LAST_TXN_LASTUPDATED_CDT ,
                           LAST_TRANSACTIONID_CDT ,
                           PAIDTYPE ,
                           ORIGINAL_PAIDTYPE ,
                           AGENCY_CS ,
                           AGENCYSTATE_CS ,
                           STARTDATE_CS ,
                           ENDDATE_CS ,
                           STARTDATE_CUTOFFPOLICY ,
                           ENDDATE_CUTOFFPOLICY ,
                           LAST_TXN_DATE_CS ,
                           LAST_TXN_CS ,
                           LAST_TXN_ID_CS ,
                           COMBINEDSTATUS_1 ,
                           COMBINEDSTATUS_2 ,
                           COMBINEDSTATUS_3 ,
                           COMBINEDSTATUS_5 ,
                           COMBINEDSOURCE_1 ,
                           COMBINEDSOURCE_2 ,
                           COMBINEDSOURCE_3 ,
                           COMBINEDSOURCE_5 ,
                           CASE WHEN COMBINEDSOURCE_1 = 'Missing' AND LAST_TXN_LASTUPDATED_CDT IS NULL AND LAST_TXN_DATE_CS IS NULL                          THEN 'Both Null'
                                WHEN COMBINEDSOURCE_1 = 'Missing' AND LAST_TXN_LASTUPDATED_CDT IS NULL                                                       THEN 'CS'
                                WHEN COMBINEDSOURCE_1 = 'Missing' AND LAST_TXN_DATE_CS IS NULL                                                               THEN 'CDT'
                                WHEN COMBINEDSOURCE_1 = 'Missing' AND date_trunc('month', LAST_TXN_DATE_CS) >= date_trunc('month', DATE (LAST_TXN_DATE_CDT)) THEN 'CS'
                                WHEN COMBINEDSOURCE_1 = 'Missing' AND date_trunc('month', LAST_TXN_DATE_CS) < date_trunc('month', DATE (LAST_TXN_DATE_CDT))  THEN 'CDT'
                                ELSE COMBINEDSOURCE_1
                                 END AS COMBINEDSOURCE_1a
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_COMM_AU3_EOM_EXTRACT_ALLSOURCES
                 UNION ALL SELECT DISTINCT NULL AS bvstg_comm_au3_eom_extract_allsources_id ,
                           policynumberformatted ,
                           carrier ,
                           add_months(max(asofmonth), 1) asofmonth ,
                           NULL status_cs ,
                           NULL status_edw ,
                           NULL status_cdt ,
                           'Manual' record_source ,
                           ispolicyincs ,
                           ispolicyinedw ,
                           ispolicyincdt ,
                           startdate_cdt ,
                           enddate_cdt ,
                           NULL date_nbs_txn ,
                           NULL last_txn_cdt ,
                           NULL last_txn_date_cdt ,
                           NULL last_txn_lastupdated_cdt ,
                           NULL LAST_TRANSACTIONID_CDT ,
                           paidtype ,
                           original_paidtype ,
                           agency_cs ,
                           agencystate_cs ,
                           startdate_cs ,
                           enddate_cs ,
                           startdate_cutoffpolicy ,
                           enddate_cutoffpolicy ,
                           NULL last_txn_date_cs ,
                           NULL last_txn_cs ,
                           NULL last_txn_id_cs ,
                           'Inactive' combinedstatus_1 ,
                           'Inactive' combinedstatus_2 ,
                           'Inactive' combinedstatus_3 ,
                           'Inactive' combinedstatus_5 ,
                           'Manual Status Input' combinedsource_1 ,
                           'Manual Status Input' combinedsource_1a ,
                           'Manual Status Input' combinedsource_2 ,
                           'Manual Status Input' combinedsource_3 ,
                           'Manual Status Input' combinedsource_5
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_COMM_AU3_EOM_EXTRACT_ALLSOURCES
                     GROUP BY policynumberformatted ,
                              carrier ,
                              ispolicyincs ,
                              ispolicyinedw ,
                              ispolicyincdt ,
                              paidtype ,
                              original_paidtype ,
                              agency_cs ,
                              agencystate_cs ,
                              startdate_cs ,
                              enddate_cs ,
                              startdate_cdt ,
                              enddate_cdt ,
                              startdate_cutoffpolicy ,
                              enddate_cutoffpolicy
                   ) bvstg_comm_au3_eom_extract_allsources
             WHERE asofmonth <= add_months(date_trunc('month', current_date()), -1)
        name: BVSTG_COMM_AU4_EOM_EXTRACT_ALLSOURCES
        noLinkRefs: []
