          - locationName: STAGE
            nodeName: V_DLBV_API_LMS_MASTERLEAD_CURRENT
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_MKT_AU2_CAMPAIGN2SALES') }} bvstg_mkt_au2_campaign2sales
             INNER JOIN (
                    SELECT ID
                      FROM {{ ref('STAGE','BVSTG_MKT_AU2_CAMPAIGN2SALES') }}
                     WHERE ID_LMS IS NULL
                     UNION SELECT MIN(ID)ID
                      FROM {{ ref('STAGE','BVSTG_MKT_AU2_CAMPAIGN2SALES') }}
                     WHERE ID_LMS IS NOT NULL
                     GROUP BY ID_LMS
                    HAVING count(1) = 1
                     UNION SELECT a.ID
                      FROM {{ ref('STAGE','BVSTG_MKT_AU2_CAMPAIGN2SALES') }} a
                      LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} b
                        ON a.leadID = b.LeadID
                     WHERE a.ID_LMS IN(
                            SELECT ID_LMS
                              FROM {{ ref('STAGE','BVSTG_MKT_AU2_CAMPAIGN2SALES') }}
                             WHERE ID_LMS IS NOT NULL
                             GROUP BY ID_LMS
                            HAVING count(1) > 1
                           ) QUALIFY ROW_NUMBER() OVER (PARTITION BY a.ID_LMS ORDER BY CASE WHEN a.LeadID IS NOT NULL THEN 1 ELSE 2 END, CASE WHEN ORIGINALORGANIZATIONCODE !='OLBT' THEN 1 ELSE 2 END, a.LEADCREATED) = 1
                   ) BVSTG_MKT_AU2_CAMPAIGN2SALES_REF
                ON BVSTG_MKT_AU2_CAMPAIGN2SALES_REF.ID = bvstg_mkt_au2_campaign2sales.ID
              LEFT JOIN (
                    SELECT ID_LMS ,
                           MIN(SaleID) SaleID ,
                           MIN(SALEDATE) SALEDATE ,
                           MIN(SALEOFFICE) SALEOFFICE ,
                           MAX(isSale) isSale ,
                           MAX(isOnlineSale) isOnlineSale ,
                           MAX(isQuote) isQuote ,
                           MIN(QuoteID) QuoteID ,
                           MIN(QuoteDate) QuoteDate ,
                           MAX(isTransfer) isTransfer ,
                           MIN(TransferID) TransferID ,
                           MIN(Transferdate) Transferdate ,
                           MAX(INBOUNDCALL) INBOUNDCALL ,
                           MAX(CAMPAIGNCALL) CAMPAIGNCALL ,
                           MAX(CAMPAIGNPHONELEAD) CAMPAIGNPHONELEAD ,
                           MAX(CAMPAIGNPHONELEADTRANSFER) CAMPAIGNPHONELEADTRANSFER ,
                           MAX(CAMPAIGNPHONELEADQUOTE) CAMPAIGNPHONELEADQUOTE ,
                           MAX(CAMPAIGNPHONELEADSALE) CAMPAIGNPHONELEADSALE ,
                           MAX(NONCAMPAIGNCALL) NONCAMPAIGNCALL ,
                           MAX(NONCAMPAIGNPHONELEAD) NONCAMPAIGNPHONELEAD ,
                           MAX(NONCAMPAIGNPHONELEADTRANSFER) NONCAMPAIGNPHONELEADTRANSFER ,
                           MAX(NONCAMPAIGNPHONELEADQUOTE) NONCAMPAIGNPHONELEADQUOTE ,
                           MAX(NONCAMPAIGNPHONELEADSALE) NONCAMPAIGNPHONELEADSALE ,
                           MAX(OUTBOUNDCALL) OUTBOUNDCALL ,
                           MAX(OUTBOUNDCALLLEAD) OUTBOUNDCALLLEAD ,
                           MAX(OUTBOUNDCALLLEADTRANSFER) OUTBOUNDCALLLEADTRANSFER ,
                           MAX(OUTBOUNDCALLLEADQUOTE) OUTBOUNDCALLLEADQUOTE ,
                           MAX(OUTBOUNDCALLLEADSALE) OUTBOUNDCALLLEADSALE ,
                           MAX(WEBFORM) WEBFORM ,
                           MAX(WEBFORMLEAD) WEBFORMLEAD ,
                           MAX(WEBFORMLEADTRANSFER) WEBFORMLEADTRANSFER ,
                           MAX(WEBFORMLEADQUOTE) WEBFORMLEADQUOTE ,
                           MAX(WEBFORMLEADSALE) WEBFORMLEADSALE ,
                           MAX(UNATTRIBUTEDLEAD) UNATTRIBUTEDLEAD ,
                           MAX(UNATTRIBUTEDLEADTRANSFER) UNATTRIBUTEDLEADTRANSFER ,
                           MAX(UNATTRIBUTEDLEADQUOTE) UNATTRIBUTEDLEADQUOTE ,
                           MAX(UNATTRIBUTEDLEADSALE) UNATTRIBUTEDLEADSALE ,
                           MAX(ISLEAD_PARTNER) ISLEAD_PARTNER
                      FROM {{ ref('STAGE','BVSTG_MKT_AU2_CAMPAIGN2SALES') }}
                     WHERE ID_LMS IS NOT NULL
                     GROUP BY ID_LMS
                    HAVING count(1) > 1
                   )BVSTG_MKT_AU2_CAMPAIGN2SALES_LMS
                ON BVSTG_MKT_AU2_CAMPAIGN2SALES_LMS.ID_LMS = bvstg_mkt_au2_campaign2sales.ID_LMS
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
                ON bvstg_mkt_au2_campaign2sales.id_lms = v_dlbv_api_lms_masterlead_current.LMS_LEAD_ID
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} DS_MKT_CAMPAIGN1
                ON v_dlbv_api_lms_masterlead_current.MEDIA_CODE = DS_MKT_CAMPAIGN1.MARCHEX_ID
               AND DS_MKT_CAMPAIGN1.MARCHEX_ID IS NOT NULL
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} DS_MKT_CAMPAIGN
                ON IFNULL(DS_MKT_CAMPAIGN1.CAMPAIGNID,bvstg_mkt_au2_campaign2sales.CAMPAIGNID) = DS_MKT_CAMPAIGN.CAMPAIGNID
              LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CUSTOMERSUMMARY_V2
                ON bvstg_mkt_au2_campaign2sales.CUSTOMERID = DS_CUSTOMERSUMMARY_V2.CUSTOMERID
               AND DS_CUSTOMERSUMMARY_V2.CUSTOMERID = 'AppOne' QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_mkt_au2_campaign2sales.id ORDER BY DS_MKT_CAMPAIGN.PROJECTSTART DESC) = 1
