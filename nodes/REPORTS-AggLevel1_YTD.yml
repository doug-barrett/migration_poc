      join:
        joinCondition: |-
          FROM {{ ref('FACT', 'SalesAndRevenue') }} "SalesAndRevenue"
          JOIN {{ ref('DIM', 'Contract') }} "Contract"
            ON SalesAndRevenue.ContractKey = Contract.ContractKey
          WHERE DATEDIFF(year,ReceiptDate,MaxReceiptDate) = 0    AND IFNULL(Sales,0) <> 0    AND IFNULL(Revenue,0) <> 0GROUP BY SalesAndRevenue.Level1ForceId
