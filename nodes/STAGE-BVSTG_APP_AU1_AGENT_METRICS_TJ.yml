        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            FROM DATA_ANALYTICS.WFM_WORKSPACE.BPO_SCANHEALTHWN_CALLS BPO_SCANHEALTHWN_CALLS
              LEFT JOIN DATA_ANALYTICS.WFM_WORKSPACE.BPO_SCANHEALTHWN_REF BPO_SCANHEALTHWN_REF
                ON BPO_SCANHEALTHWN_CALLS.ASSIGNED = BPO_SCANHEALTHWN_REF.AGENT
              LEFT JOIN (
                    SELECT BPO_SCANHEALTHWN_CALLSGENESYS.INTERVAL_START,
                           BPO_SCANHEALTHWN_REF.EMPID,
                           SUM(COALESCE(BPO_SCANHEALTHWN_CALLSGENESYS.ANSWERED, 0)) AS INBOUNDCALLS,
                           SUM(COALESCE(BPO_SCANHEALTHWN_CALLSGENESYS .HANDLE,0)) AS OUTBOUNDCALLS,
                           INBOUNDCALLS + OUTBOUNDCALLS AS CALLSGENESYS
                      FROM DATA_ANALYTICS.WFM_WORKSPACE.BPO_SCANHEALTHWN_CALLSGENESYS AS BPO_SCANHEALTHWN_CALLSGENESYS
                      LEFT JOIN DATA_ANALYTICS.WFM_WORKSPACE.BPO_SCANHEALTHWN_REF AS BPO_SCANHEALTHWN_REF
                        ON BPO_SCANHEALTHWN_CALLSGENESYS.AGENT_NAME = BPO_SCANHEALTHWN_REF.GENESYSNAME
                     GROUP BY BPO_SCANHEALTHWN_CALLSGENESYS.INTERVAL_START,
                              BPO_SCANHEALTHWN_REF.EMPID
                   ) AS CALLSGENESYS
                ON BPO_SCANHEALTHWN_CALLS.DATE || BPO_SCANHEALTHWN_REF.EMPID = CALLSGENESYS.INTERVAL_START || CALLSGENESYS.EMPID
              LEFT JOIN (
                    SELECT DBTIME.DATE,
                           DBTIME.id_number,
                           DBTIME.name,
                           SUM(CASE WHEN DBTIME.INCIDENT IN ('INC','ITR','DEF','IAC','VAC','CON','MAT','IET','IN1','FJ','FSS','BAL','COB','IGR','COD','NAC','PAT','PRT','PSG','PER','V','COM') AND DBTIME.DAY_OFF = 0 THEN 0 ELSE DBTIME.ORDINARY END) + (MAX(DBTIME.ADDITIONAL) / NULLIF(MAX(DBCOUNTER.COUNTER), 0)) + SUM(DBTIME.EXTRAS_AUTO) AS TOTAL_ORDINARY1
                      FROM DATA_ANALYTICS.WFM_WORKSPACE.TRESS_INCIDENTSOT AS DBTIME
                      LEFT JOIN (
                            SELECT DBCOUNTER.ID_NUMBER,
                                   DBCOUNTER.PAYROLL,
                                   COUNT(CASE WHEN DBCOUNTER.DAY_OFF = 0 AND DBCOUNTER.ORDINARY > 0 THEN 1 ELSE NULL END) AS COUNTER
                              FROM DATA_ANALYTICS.WFM_WORKSPACE.TRESS_INCIDENTSOT AS DBCOUNTER
                             GROUP BY DBCOUNTER.ID_NUMBER,
                                      DBCOUNTER.PAYROLL
                           ) AS DBCOUNTER
                        ON DBTIME.ID_NUMBER = DBCOUNTER.ID_NUMBER
                       AND DBTIME.PAYROLL = DBCOUNTER.PAYROLL
                     WHERE DBTIME.office_id = '7020'
                     GROUP BY DBTIME.DATE,
                              DBTIME.id_number,
                              DBTIME.name
                   ) AS TRESS_INCIDENTSOT
                ON BPO_SCANHEALTHWN_REF.EMPID = TRESS_INCIDENTSOT.id_number
               AND BPO_SCANHEALTHWN_CALLS.DATE = TRESS_INCIDENTSOT.DATE
             WHERE BPO_SCANHEALTHWN_REF.EMPID < 10100000
             GROUP BY OfficeID ,
                      BPO_SCANHEALTHWN_CALLS.DATE ,
                      BPO_SCANHEALTHWN_REF.EMPID ,
                      IFNULL(BPO_SCANHEALTHWN_REF.FULLNAME,BPO_SCANHEALTHWN_CALLS.ASSIGNED) ,
                      CALLSGENESYS.CALLSGENESYS
