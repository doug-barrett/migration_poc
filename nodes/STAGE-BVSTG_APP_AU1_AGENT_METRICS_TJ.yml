                           SUM(CASE WHEN DBTIME.INCIDENT IN ('INC','ITR','DEF','IAC','VAC','CON','MAT','IET','IN1','FJ','FSS','BAL','COB','IGR','COD','NAC','PAT','PRT','PSG','PER','V','COM') AND DBTIME.DAY_OFF = 0 THEN 0 ELSE DBTIME.ORDINARY END) + (MAX(DBTIME.ADDITIONAL) / NULLIF(MAX(DBCOUNTER.COUNTER), 0)) + SUM(DBTIME.EXTRAS_AUTO) AS TOTAL_ORDINARY1
                      FROM DATA_ANALYTICS.WFM_WORKSPACE.TRESS_INCIDENTSOT AS DBTIME
                      LEFT JOIN (
