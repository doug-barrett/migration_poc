ELECT DISTINCT TO_NUMBER(a.CustomerID) CustomerID      ,'GN Opportunities' Category      ,a.employeenumber     FROM (      SELECT a.CustomerID       ,v_dlbv_cfa_hci_agents_current.employeenumber                ,DATE(a.created) Created      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_LEAD_MROC_CURRENT a      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_EMPLOYEE_MROC_CURRENT c       ON a.PRIMARYASSISTANTID = c.userid             INNER JOIN (SELECT DISTINCT EMPLOYEENUMBER FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_HCI_AGENTS_CURRENT      --WHERE isactivehealthcare = 1    ) v_dlbv_cfa_hci_agents_current       ON c.employeenumber = v_dlbv_cfa_hci_agents_current.employeenumber             WHERE a.lineofbusinesstypeid = 423      ) a     INNER JOIN RETAIL_PROD.SCH_EDW.DS_LEAD_OPORTUNITY_CONVERSION c      ON c.employeenumber = a.employeenumber       AND c.created = DATE (a.created)       AND c.sourcedb = 'AppOne'     WHERE DATE (c.CREATED) BETWEEN '2024-01-01' AND CURRENT_DATE() -->= DATE_TRUNC('MONTH', DATEADD(MONTH, - 12, CURRENT_DATE ()))     ) v_s_ap1_lead_mroc_current         LEFT JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 ds_customersummary_v2     ON ds_customersummary_v2.CustomerID = TO_VARCHAR(v_s_ap1_lead_mroc_current.CustomerID)      AND ds_customersummary_v2.sourcedb = 'AppOne'          INNER JOIN RETAIL_PROD.SCH_EDW.DS_AGENT_KEY ds_agent_key     ON DS_AGENT_KEY.employeenumber = v_s_ap1_lead_mroc_current.employeenumber      AND ds_agent_key.RANK_EMPLOYEENUMBER = 1           INNER JOIN (SELECT DISTINCT EMPLOYEENUMBER FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_HCI_AGENTS_CURRENT    --WHERE isactivehealthcare = 1    ) v_dlbv_cfa_h
