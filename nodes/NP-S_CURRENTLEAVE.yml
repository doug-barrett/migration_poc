            transform: ISNULL(ALACCRUETOMONTHEND,0) *-- - ISNULL(BOOKEDANNUALLEAVE,0)) *  CASE   --IF THERE ARE NO HRS RECORDED, THEN USE THE EMPLOYEE'S DEFAULT RATE   WHEN ISNULL(ADPHRS,0) = 0 THEN I_EMPLOYEECURRENTPAYSEQUENCE.RATEAMOUNT   ELSE    --IF THE CALCULATED 52 WEEK RATE > DEFAULT HOURLY RATE THEN USE THE HIGHER RATE    CASE     WHEN (ADPEARN/CASE WHEN ADPHRS = 0 THEN 1 ELSE ADPHRS END) > I_EMPLOYEECURRENTPAYSEQUENCE.RATEAMOUNT       THEN (ADPEARN/CASE WHEN ADPHRS = 0 THEN 1 ELSE ADPHRS END)    --ELSE IS THE DEFAULT HOURLY RATE IS HIGHER, THEN USE THAT    ELSE I_EMPLOYEECURRENTPAYSEQUENCE.RATEAMOUNT END  END
