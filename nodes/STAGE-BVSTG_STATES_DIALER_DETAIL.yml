        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_DLBV_PCCE_DIALER_DETAIL_CURRENT') }} V_DLBV_PCCE_DIALER_DETAIL_CURRENT
             INNER JOIN (
                    SELECT *,
                           'AZ' StateCode,
                           5048 DialerCode
                      FROM {{ ref('STAGE','V_DLBV_PCCE_DL_5048_5048_CURRENT') }}
                     UNION SELECT *,
                           'TX' StateCode,
                           5051 DialerCode
                      FROM {{ ref('STAGE','V_DLBV_PCCE_DL_5051_5051_CURRENT') }}
                   ) V_DLBV_PCCE_DL_5022_5022_CURRENT
                ON V_DLBV_PCCE_DL_5022_5022_CURRENT.DialingListID = V_DLBV_PCCE_DIALER_DETAIL_CURRENT.DialingListID
               AND V_DLBV_PCCE_DL_5022_5022_CURRENT.DialerCode = V_DLBV_PCCE_DIALER_DETAIL_CURRENT.QueryRuleID
              LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
                ON DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.ID = CONCAT(V_DLBV_PCCE_DIALER_DETAIL_CURRENT.RouterCallKey,'-',V_DLBV_PCCE_DIALER_DETAIL_CURRENT.RouterCallKeyDay)
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_PCCE_AGENT') }} DS_BVSTG_PCCE_AGENT
                ON DS_BVSTG_PCCE_AGENT.PERIPHERALNUMBER = V_DLBV_PCCE_DIALER_DETAIL_CURRENT.AgentPeripheralNumber
             WHERE V_DLBV_PCCE_DIALER_DETAIL_CURRENT.QueryRuleID IN(5048,5051)
