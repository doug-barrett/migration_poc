    sourceMapping:
      - aliases:
          BVSTG_AU4_LEAD_FEATURES_GROUPED: 039fdb79-5ea3-4fa2-8f99-600215b8575d
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU4_LEAD_FEATURES_GROUPED
          - locationName: UNKNOWN
            nodeName: V_PREB_ACXIOM_GENDER
          - locationName: UNKNOWN
            nodeName: V_PREB_ACXIOM_GENERAL
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU4_LEAD_FEATURES_GROUPED') }} bvstg_au4_lead_features_grouped
             INNER JOIN (
                    SELECT BVSTG_AU4_LEAD_FEATURES_GROUPED.FIRST_GROUP_LEADID ,
                           BVSTG_AU4_LEAD_FEATURES_GROUPED.SECUENCE ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.INBOUND_CALLS) TOTAL_INBOUND_CALLS ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.INBOUND_CONVERSATION) TOTAL_INBOUND_CONVERSATION ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.INBOUND_CALLS_7DAYS) TOTAL_INBOUND_CALLS_7DAYS ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.INBOUND_CONVERSATION_7DAYS) TOTAL_INBOUND_CONVERSATION_7DAYS ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.OUTBOUND_CALLS) TOTAL_OUTBOUND_CALLS ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.OUTBOUND_CONVERSATION) TOTAL_OUTBOUND_CONVERSATION ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.OUTBOUND_CALLS_7DAYS) TOTAL_OUTBOUND_CALLS_7DAYS ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.OUTBOUND_CONVERSATION_7DAYS) TOTAL_OUTBOUND_CONVERSATION_7DAYS ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.QUOTE) TOTAL_QUOTE ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.QUOTE_7DAYS) TOTAL_QUOTE_7DAYS ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.TRANSFER) TOTAL_TRANSFER ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.TRANSFER_7DAYS) TOTAL_TRANSFER_7DAYS ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.LEADACCESSED) TOTAL_LEADACCESSED ,
                           SUM(BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.LEADACCESSED_7DAYS) TOTAL_LEADACCESSED_7DAYS
                      FROM {{ ref('STAGE','BVSTG_AU4_LEAD_FEATURES_GROUPED') }} BVSTG_AU4_LEAD_FEATURES_GROUPED
                     INNER JOIN {{ ref('STAGE','BVSTG_AU4_LEAD_FEATURES_GROUPED') }} BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS
                        ON BVSTG_AU4_LEAD_FEATURES_GROUPED.FIRST_GROUP_LEADID = BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.FIRST_GROUP_LEADID
                       AND BVSTG_AU4_LEAD_FEATURES_GROUPED.SECUENCE >= BVSTG_AU4_LEAD_FEATURES_GROUPED_TOTALS.SECUENCE
                     GROUP BY BVSTG_AU4_LEAD_FEATURES_GROUPED.FIRST_GROUP_LEADID ,
                              BVSTG_AU4_LEAD_FEATURES_GROUPED.SECUENCE
                   )bvstg_au4_lead_features_grouped_total
                ON BVSTG_AU4_LEAD_FEATURES_GROUPED.FIRST_GROUP_LEADID = bvstg_au4_lead_features_grouped_total.FIRST_GROUP_LEADID
               AND BVSTG_AU4_LEAD_FEATURES_GROUPED.SECUENCE = bvstg_au4_lead_features_grouped_total.SECUENCE
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_ACXIOM_GENDER') }} v_preb_acxiom_gender
                ON v_preb_acxiom_gender.CustomerID = bvstg_au4_lead_features_grouped.CustomerID
               AND v_preb_acxiom_gender.SourceDB = bvstg_au4_lead_features_grouped.SourceDB
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_ACXIOM_GENERAL') }} v_preb_acxiom_general
                ON v_preb_acxiom_general.CustomerID = bvstg_au4_lead_features_grouped.CustomerID
               AND v_preb_acxiom_general.SourceDB = bvstg_au4_lead_features_grouped.SourceDB
              LEFT JOIN (
                    SELECT LEADID,
                           SOURCEDB
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_MKT_LEAD_SOURCE"
                     WHERE LMS_ID IN(
                            SELECT IFNULL(b1.LMSLEADID,b2.LMSLEADID) LMSLEADID
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_AU2_GROUP_LEAD" a
                              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_TURBO_FORM_VIEW" b1
                                ON b1.AGENCYSYSTEM = 'AppOne'
                               AND a.L_LeadID = b1.APPONE_LEADID
                              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_TURBO_FORM_VIEW" b2
                                ON b2.AGENCYSYSTEM IN('CIGH','SPLC')
                               AND a.L_LeadID = b2.AMS360CUSTOMERID
                           )
                   )DS_MKT_LEAD_SOURCE_TURBO
                ON DS_MKT_LEAD_SOURCE_TURBO.LEADID = bvstg_au4_lead_features_grouped.L_LEADID
               AND DS_MKT_LEAD_SOURCE_TURBO.SourceDB = bvstg_au4_lead_features_grouped.SourceDB QUALIFY row_number() OVER (PARTITION BY bvstg_au4_lead_features_grouped.L_LeadID ORDER BY bvstg_au4_lead_features_grouped.L_LEADDATE)=1
        name: BVSTG_LEAD_FEATURES_GROUPED
        noLinkRefs: []
