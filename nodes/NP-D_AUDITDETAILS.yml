                stepCounter: e5b46b79-c90b-476c-a45a-625358eef398
            transform: |-
              CASE WHEN I_AUDITDETAILS.AUDITFORM IS NULL                                                        THEN 'UNKNOWN'
                          WHEN I_AUDITDETAILS.AUDITFORM LIKE '%ONSITE%OBSERVATION%' AND ODSSOURCESYSTEMNAME = 'NPSAFE' THEN 'ONSITE OBSERVATION'
                          ELSE 'OTHER AUDIT'
                           END
