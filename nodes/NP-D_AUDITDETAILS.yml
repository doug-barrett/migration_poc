            transform: CASE WHEN AUDITFORM IS NULL THEN 'UNKNOWN' --ENDS WITH (CRC) THIS IS THE NEW GROUPING FOR CRC AUDITS    WHEN AUDITFORM LIKE '%(CRC)' AND     ODSSOURCESYSTEMNAME = 'NPSAFE' THEN 'CRC AUDIT'    --ONSITE OBSERVATIONS ARE ALSO CRC AUDITS, THIS LINE NEEDS TO BE REMOVED WHEN THE HISTORICAL DATA HAS BEEN UPDATED    WHEN AUDITFORM LIKE '%ONSITE%OBSERVATION%' AND     ODSSOURCESYSTEMNAME = 'NPSAFE' THEN 'CRC AUDIT'    --STARTS WITH CRC CURRENT, THIS LINE NEEDS TO BE REMOVED WHEN THE HISTORICAL DATA HAS BEEN UPDATED    WHEN AUDITFORM LIKE 'CRC%' AND     ODSSOURCESYSTEMNAME = 'NPSAFE' THEN 'CRC AUDIT'    --EXACT FORM NAME, THIS LINE NEEDS TO BE REMOVED WHEN THE HISTORICAL DATA HAS BEEN UPDATED TO HAVE (CRC) AT THE END    WHEN AUDITFORM LIKE 'PERMIT AND MINOR WORKS MANAGEMENT AUDIT%' THEN 'CRC AUDIT'    ELSE 'NON-CRC AUDIT'   END
