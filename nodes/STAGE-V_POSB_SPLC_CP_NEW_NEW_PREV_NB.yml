            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_CP_NEW_NEW_PREV_NB') }} AS SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.ID
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
             INNER JOIN (
                    SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.POLICYID
                      FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
                     INNER JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION_NEW_NEW_1
                        ON DS_SPLC_POLICYTRANSACTION.CustomerID = DS_SPLC_POLICYTRANSACTION_NEW_NEW_1.CustomerID
                       AND DS_SPLC_POLICYTRANSACTION_NEW_NEW_1.TranType IN('NBS','RWL','REW')
                       AND DATE(DS_SPLC_POLICYTRANSACTION_NEW_NEW_1.ReportDate) < DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)
                       AND DS_SPLC_POLICYTRANSACTION.PolicyID != DS_SPLC_POLICYTRANSACTION_NEW_NEW_1.PolicyID
                     WHERE DS_SPLC_POLICYTRANSACTION.TranType IN('NBS','RWL','REW')
                   )DS_SPLC_POLICYTRANSACTION_POL
                ON DS_SPLC_POLICYTRANSACTION.POLICYID = DS_SPLC_POLICYTRANSACTION_POL.POLICYID
