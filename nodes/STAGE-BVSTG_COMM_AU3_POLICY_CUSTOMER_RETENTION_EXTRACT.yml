        join:
          joinCondition: |-
            FROM (SELECT DISTINCT customer_id,
                   window_counter,
                   min(customerstatus_eom) AS customer_status,
                   max(last_txn_date) AS last_txn_date_window,
                   min(first_txn_date) AS first_txn_date_window,
                   CASE WHEN max(last_txn_date) IS NOT NULL AND max(last_txn_date)>=min(cutoffdate) THEN max(last_txn_date)
                        WHEN min(last_txn_date) IS NOT NULL AND min(last_txn_date)>=min(cutoffdate) THEN min(last_txn_date)
                        ELSE datefromparts(year(max(cutoffdate)),month(max(cutoffdate)),day(max(policy_effectivedate)))
                         END AS last_txn_date_final,
                   CASE WHEN min(first_txn_date) IS NOT NULL AND min(first_txn_date)>=min(cutoffdate) THEN min(first_txn_date)
                        WHEN max(first_txn_date) IS NOT NULL AND max(first_txn_date)>=min(cutoffdate) THEN max(first_txn_date)
                        ELSE datefromparts(year(min(cutoffdate)),month(min(cutoffdate)),day(min(policy_effectivedate)))
                         END AS first_txn_date_final,
                   min(cutoffdate) AS min_start_month,
                   max(cutoffdate) AS max_start_month --from bvstg_comm_au2_policy_customer_retention_extract --------Change to PROD   from {{ ref('STAGE','BVSTG_COMM_AU2_POLICY_CUSTOMER_RETENTION_EXTRACT') }}   where customer_id IN   (select distinct customer_id    --from bvstg_comm_au2_policy_customer_retention_extract --------Change to PROD   from {{ ref('STAGE','BVSTG_COMM_AU2_POLICY_CUSTOMER_RETENTION_EXTRACT') }}   group by customer_id   having count(distinct customerstatus_eom)>1 and count(distinct policynumberformatted_old,carrier_old)>1)  ---888,109 customers   group by customer_id,window_counter) bvstg_comm_au2_policy_customer_retention_extract
