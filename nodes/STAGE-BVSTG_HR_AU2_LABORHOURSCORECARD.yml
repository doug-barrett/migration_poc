        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_HR_AU1_LABORHOURSCORECARD
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_HR_AU1_LABORHOURSCORECARD') }} bvstg_hr_au1_laborhourscorecard
              LEFT JOIN (
                    SELECT *
                      FROM RETAIL_PROD.SCH_EDW.DS_HR_EMPLOYEEUNIQUE
                     WHERE islast = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY EMPLOYEENUMBER ORDER BY DSS_UPDATE_TIME DESC)=1
                   ) ds_hr_employeeunique
                ON (bvstg_hr_au1_laborhourscorecard.EmployeeNumber = ds_hr_employeeunique.EmployeeNumber AND ds_hr_employeeunique.islast = 1)
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE ds_retail_office
                ON ((ds_retail_office.OfficeCode = IFNULL(CASE WHEN bvstg_hr_au1_laborhourscorecard.NEWPOLICIES > 0 THEN bvstg_hr_au1_laborhourscorecard.OfficeCode ELSE RTRIM(LTRIM(ds_hr_employeeunique.ModifiedLocationCode)) END,bvstg_hr_au1_laborhourscorecard.OfficeCode)) AND ds_retail_office.officecode NOT IN ('ORWAR6', 'SALRE5', 'SALRET1', 'SALRET2', 'NVR7', 'NVW1') AND ds_retail_office.country <> 'Mexico' AND ds_retail_office.salestype IN ('Brick-e-Sales', 'National Telesales', 'Telesales') AND ds_retail_office.channel = 'NSA' AND (ds_retail_office.officetype = 'Retail' OR ds_retail_office.OfficeCode='ULACAL'))
             WHERE bvstg_hr_au1_laborhourscorecard.JOBGROUP IN ('Producer','Sales Support','Store Manager','Trainee')
                OR bvstg_hr_au1_laborhourscorecard.NewPolicies > 0
             GROUP BY MD5(IFNULL(bvstg_hr_au1_laborhourscorecard.EmployeeNumber,'') || bvstg_hr_au1_laborhourscorecard.wrkdWorkDate || IFNULL(IFNULL(ds_retail_office.officecode,bvstg_hr_au1_laborhourscorecard.OfficeCode),'') || IFNULL(ds_retail_office.TerritoryManagerName,'')|| IFNULL(bvstg_hr_au1_laborhourscorecard.JOBGROUP,'') ||IFNULL(bvstg_hr_au1_laborhourscorecard.htypeName,''))
        name: BVSTG_HR_AU2_LABORHOURSCORECARD
