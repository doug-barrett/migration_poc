        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
                ON v_dlbv_api_lms_masterlead_current.LMS_LEAD_ID = ds_mkt_lead_source.LMS_ID
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current_appone_quote
                ON ds_mkt_lead_source.LEADID = v_dlbv_api_lms_masterlead_current_appone_quote.appone_quote_id
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current_lead_partner
                ON ds_mkt_lead_source.externalleadid = v_dlbv_api_lms_masterlead_current_lead_partner.lead_id_partner
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON ds_mkt_campaign.CAMPAIGNID = ds_mkt_lead_source.CAMPAIGNID
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository_activity
                ON ds_mkt_lead_source.TransferID = ds_ram_retail_repository_activity.Activityid
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                ON ds_ram_retail_repository_activity.TransactionID = ds_ram_retail_repository.TransactionID
               AND ds_ram_retail_repository.sourcedb = ds_ram_retail_repository_activity.sourcedb
               AND ds_ram_retail_repository.Label like 'New Business%'
             WHERE DATE(ds_mkt_lead_source.TRANSFERDATE) >= '2021-01-01'
               AND ds_mkt_lead_source.ISTRANSFER = 1
               AND COALESCE(v_dlbv_api_lms_masterlead_current.LEAD_GCLID, v_dlbv_api_lms_masterlead_current_appone_quote.LEAD_GCLID, v_dlbv_api_lms_masterlead_current_lead_partner.LEAD_GCLID) IS NOT NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY MD5(COALESCE(v_dlbv_api_lms_masterlead_current.LEAD_GCLID, v_dlbv_api_lms_masterlead_current_appone_quote.LEAD_GCLID, v_dlbv_api_lms_masterlead_current_lead_partner.LEAD_GCLID) || ds_mkt_lead_source.TransferDate || 'MCC Global Forms Imported - Transfers') ORDER BY ds_mkt_lead_source.TransferDate) = 1
