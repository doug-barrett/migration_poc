            EXTENDED
              FROM --- updated 2/6/2023    (    select *, ifnull(grp, 0) as Uprate_Customer_Flag    from    (    select *, max(case when grp_flag <> 0 then to_number(substr(monthsfromnbs, 2, len(monthsfromnbs))) end)                over(partition by customerid, initial_carrier order by to_number(substr(monthsfromnbs, 2, len(monthsfromnbs))) rows unbounded preceding) as grp    from    (    select *, case when monthsfromnbs = 'M1' and collected_premium > expected_premium                    then 1                    else 0                   end as grp_flag    from    (    select distinct bvstg_comm_au1_premium_persistency.customerid,            bvstg_comm_au1_premium_persistency.initial_carrier,            bvstg_comm_au1_premium_persistency.term,            bvstg_comm_au1_premium_persistency.policysource,            bvstg_comm_au1_premium_persistency.customer_type,           bvstg_comm_au1_premium_persistency.agency,            bvstg_comm_au1_premium_persistency.agencystate,            bvstg_comm_au1_premium_persistency.leadsource as leadtype,            bvstg_comm_au1_premium_persistency.lineofbusiness,            bvstg_comm_au1_premium_persistency_3.paidtype as paidtype,           bvstg_comm_au1_premium_persistency.customerstate,           bvstg_comm_au1_premium_persistency.isOnlineBinding,            bvstg_comm_au1_premium_persistency.isFranchise,            ifnull(bvstg_comm_au1_premium_persistency.TerritoryManagerName,'Missing') TerritoryManagerName,           bvstg_comm_au1_premium_persistency.startdate as startmonth,            bvstg_comm_au1_premium_persistency.asofmonth,     bvstg_comm_au1_premium_persistency.ISLEGACYTRANSACTION,           ifnull(ds_comm_customer_summary_extract.customerstatus_eom, '0') as customerstatus_eom,           concat('M', to_varchar(datediff('month', bvstg_comm_au1_premium_persistency.startdate, bvstg_comm_au1_premium_persistency.asofmonth)+1)) as monthsfromnbs,           ifnull(bvstg_comm_au1_premium_persistency_2.expected_premium, '0') as expected_premium,           ifnull(bvstg_comm_au1_premium_persistency_1.collected_premium, '0') as collected_premium    from    (    select *    from (select distinct bvstg_comm_au1_premium_persistency.customerid,        --1449451                 initial_carrier, term, policysource, customer_type, agency,                 agencystate, leadsource, lineofbusiness,                  customerstate, isOnlineBinding, isFranchise, TerritoryManagerName, ISLEGACYCUSTOMER as ISLEGACYTRANSACTION,                 startdate, max_asofmonth                 from (select distinct customerid                --from "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_COMM_AU1_PREMIUM_PERSISTENCY"                from {{ ref('STAGE','BVSTG_COMM_AU1_PREMIUM_PERSISTENCY') }}               ) bvstg_comm_au1_premium_persistency          inner join (select distinct customer_id, startdate, initial_carrier, term, policysource,                             customer_type, agency, agencystate, leadsource, lineofbusiness,                             customerstate, isOnlineBinding, isFranchise, TerritoryManagerName, ISLEGACYCUSTOMER                      --from "DATA_LAKE"."BIA_ANALYTICS"."DS_COMM_CUSTOMER_SUMMARY_EXTRACT"                      --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_CUSTOMER_SUMMARY_EXTRACT"                      from {{ ref('EDW','DS_COMM_CUSTOMER_SUMMARY_EXTRACT') }}                     ) ds_comm_customer_summary_extract           on bvstg_comm_au1_premium_persistency.customerid = ds_comm_customer_summary_extract.customer_id          left join (select customerid, max(asofmonth) as max_asofmonth                     --from "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_COMM_AU1_PREMIUM_PERSISTENCY"                     from {{ ref('STAGE','BVSTG_COMM_AU1_PREMIUM_PERSISTENCY') }}                     group by customerid                    ) bvstg_comm_au1_premium_persistency_1           on bvstg_comm_au1_premium_persistency.customerid = bvstg_comm_au1_premium_persistency_1.customerid          where ds_comm_customer_summary_extract.sta
