        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_EMPLOYEE_UPN_APPONE') }} AS SELECT DISTINCT UPN,
                   EMPLOYEENUMBER
              FROM(
                    SELECT DISTINCT lower(UPN)upn,
                           CASE WHEN LEN(EMPLOYEENUMBER) >6 THEN EMPLOYEENUMBER
                                WHEN LEN(EMPLOYEENUMBER) >2 THEN RIGHT('0000' || try_to_numeric(EMPLOYEENUMBER),6)
                                ELSE RIGHT('000' || try_to_numeric(EMPLOYEENUMBER),6)
                                 END EMPLOYEENUMBER,
                           1 AS Number,
                           b.loginname
                      FROM {{ ref('STAGE','V_DLBV_CPS_EMPLOYEESUPN_CURRENT') }} a
                      LEFT JOIN {{ ref('STAGE','V_DLBV_PCCE_PERSON_CURRENT') }} b
                        ON (lower(a.UPN) = lower(b.loginname))
                     WHERE a.DELETEDBY IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY loginname ORDER BY isactive DESC, employeenumber)=1
                     UNION SELECT DISTINCT lower(b.LoginName),
                           RIGHT('000' || try_to_numeric(a.UltiproNumber),6) EMPLOYEENUMBER,
                           3 AS Number,
                           c.loginname
                      FROM {{ ref('STAGE','V_S_BOE_TJ_EMPLOYEE_CURRENT') }} a
                     INNER JOIN {{ ref('STAGE','DS_BVSTG_PCCE_AGENT') }} b
                        ON (b.SKILLTARGETID = a.AgentSKILLTARGETID)
                      LEFT JOIN {{ ref('STAGE','V_DLBV_PCCE_PERSON_CURRENT') }} c
                        ON (lower(b.LoginName) = lower(c.loginname))
                   )UPN /*
            QUALIFY ROW_NUMBER() OVER (
                PARTITION BY EMPLOYEENUMBER
                ORDER BY Number,CASE WHEN loginname IS NOT NULL THEN 0 ELSE 1 END
            )=1
            */
