      join:
        joinCondition: "FROM (\n  SELECT DISTINCT \n     Journal_Type AS Journal_Type\n\
          \    ,Journal_Begin_Date AS Journal_Begin_Date\n    ,Journal_End_Date AS\
          \ Journal_End_Date\n    ,CMCMP AS Company_Code\n    ,CAST(CMNAME AS VARCHAR(100))\
          \ AS Party_Name \n    ,1 AS Party_Type_Code\n    ,CMCUS0 AS Customer_Account_Num\n\
          \    ,RTRIM(CAST(' ' AS VARCHAR(30))) AS Customer_Account_Char\n    ,'M'\
          \ as Address_Type_Code\n    ,CAST(CMADR1 AS VARCHAR(100)) AS Address_Line_1_Txt\n\
          \    ,CAST(CMADR2 AS VARCHAR(100)) AS Address_Line_2_Txt\n    ,CAST(CMCITY\
          \ AS VARCHAR(50) )AS City_Code\n    ,CMSTAT AS State_Code\n    ,CAST(CMZIP\
          \ AS VARCHAR(50)) AS Postal_Code\n    ,CAST(CMCNTR AS CHAR(3)) AS Country_Code\n\
          \  FROM {{ ref('GOLD', 'CDC_CUSMASFL') }} \"CDC_CUSMASFL\"\n  UNION\n  SELECT\
          \ DISTINCT \n     Journal_Type AS Journal_Type\n    ,Journal_Begin_Date\
          \ AS Journal_Begin_Date\n    ,Journal_End_Date AS Journal_End_Date\n   \
          \ ,'U1' AS Company_Code\n    ,CompetitionName AS Party_Name \n    ,5 AS\
          \ Party_Type_Code\n    ,CompetitionId AS Customer_Account_Num\n    ,RTRIM(CAST('\
          \ ' AS VARCHAR(30))) AS Customer_Account_Char\n    ,'M' as Address_Type_Code\n\
          \    ,Street AS Address_Line_1_Txt\n    ,RTRIM(CAST(' ' AS VARCHAR(1000)))\
          \ AS Address_Line_2_Txt\n    ,City AS City_Code\n    ,State AS State_Code\n\
          \    ,PostalCode AS Postal_Code\n    ,Country AS Country_Code\n  FROM {{\
          \ ref('GOLD', 'CDC_COMPETITION') }} \"CDC_COMPETITION\"\n  UNION\n  SELECT\
          \ DISTINCT \n     Journal_Type AS Journal_Type\n    ,Journal_Begin_Date\
          \ AS Journal_Begin_Date\n    ,Journal_End_Date AS Journal_End_Date\n   \
          \ ,CHCMP AS Company_Code\n    ,CHNAME AS Party_Name \n    ,2 AS Party_Type_Code\n\
          \    ,0 AS Customer_Account_Num\n    ,CAST(TRIM(CHDLST)||TRIM(CHDL0) AS\
          \ VARCHAR(30)) AS Customer_Account_Char\n    ,'M' as Address_Type_Code\n\
          \    ,RTRIM(CAST(' ' AS VARCHAR(1000))) AS Address_Line_1_Txt\n    ,RTRIM(CAST('\
          \ ' AS VARCHAR(1000))) AS Address_Line_2_Txt\n    ,CHCITY AS City_Code\n\
          \    ,CHST AS State_Code\n    ,CHZIP AS Postal_Code\n    ,RTRIM(CAST(' '\
          \ AS CHAR(3))) AS Country_Code\n  FROM {{ ref('GOLD', 'CDC_CSHCUSFL') }}\
          \ \"CDC_CSHCUSFL\"\n  UNION\n  SELECT DISTINCT \n     Journal_Type AS Journal_Type\n\
          \    ,Journal_Begin_Date AS Journal_Begin_Date\n    ,Journal_End_Date AS\
          \ Journal_End_Date\n    ,MVCMP0 AS Company_Code\n    ,MVNAME AS Party_Name\
          \ \n    ,4 AS Party_Type_Code\n    ,MVVND0 AS Customer_Account_Num\n   \
          \ ,RTRIM(CAST(' ' AS VARCHAR(30))) AS Customer_Account_Char\n    ,'M' as\
          \ Address_Type_Code\n    ,MVADDR AS Address_Line_1_Txt\n    ,MVADR2 AS Address_Line_2_Txt\n\
          \    ,MVCITY AS City_Code\n    ,MVSTTE AS State_Code\n    ,MVZPCD AS Postal_Code\n\
          \    ,MVCNTR AS Country_Code\n  FROM {{ ref('GOLD', 'CDC_IMVENDFL') }} \"\
          CDC_IMVENDFL\"\n  UNION\n  SELECT DISTINCT \n     Journal_Type AS Journal_Type\n\
          \    ,Journal_Begin_Date AS Journal_Begin_Date\n    ,Journal_End_Date AS\
          \ Journal_End_Date\n    ,ZLCMP AS Company_Code\n    ,ZLNAME AS Party_Name\
          \ \n    ,3 AS Party_Type_Code\n    ,0 AS Customer_Account_Num\n    ,ZLLOC\
          \ AS Customer_Account_Char\n    ,'M' as Address_Type_Code\n    ,ZLADR1 AS\
          \ Address_Line_1_Txt\n    ,ZLADR2 AS Address_Line_2_Txt\n    ,ZLCITY AS\
          \ City_Code\n    ,ZLST AS State_Code\n    ,ZLZIP AS Postal_Code\n    ,ZLCNTR\
          \ AS Country_Code\n  FROM {{ ref('GOLD', 'CDC_SYSLOCFL') }} \"CDC_SYSLOCFL\"\
          \n) AS TEMPTABLE"
