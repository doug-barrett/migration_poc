      join:
        joinCondition: |-
          FROM (
            SELECT DISTINCT 
               Journal_Type AS Journal_Type
              ,Journal_Begin_Date AS Journal_Begin_Date
              ,Journal_End_Date AS Journal_End_Date
              ,CMCMP AS Company_Code
              ,CAST(CMNAME AS VARCHAR(100)) AS Party_Name 
              ,1 AS Party_Type_Code
              ,CMCUS0 AS Customer_Account_Num
              ,RTRIM(CAST(' ' AS VARCHAR(30))) AS Customer_Account_Char
              ,'M' as Address_Type_Code
              ,CAST(CMADR1 AS VARCHAR(100)) AS Address_Line_1_Txt
              ,CAST(CMADR2 AS VARCHAR(100)) AS Address_Line_2_Txt
              ,CAST(CMCITY AS VARCHAR(50) )AS City_Code
              ,CMSTAT AS State_Code
              ,CAST(CMZIP AS VARCHAR(50)) AS Postal_Code
              ,CAST(CMCNTR AS CHAR(3)) AS Country_Code
            FROM {{ ref('GOLD', 'CDC_CUSMASFL') }} "CDC_CUSMASFL"
            UNION
            SELECT DISTINCT 
               Journal_Type AS Journal_Type
              ,Journal_Begin_Date AS Journal_Begin_Date
              ,Journal_End_Date AS Journal_End_Date
              ,'U1' AS Company_Code
              ,CompetitionName AS Party_Name 
              ,5 AS Party_Type_Code
              ,CompetitionId AS Customer_Account_Num
              ,RTRIM(CAST(' ' AS VARCHAR(30))) AS Customer_Account_Char
              ,'M' as Address_Type_Code
              ,Street AS Address_Line_1_Txt
              ,RTRIM(CAST(' ' AS VARCHAR(1000))) AS Address_Line_2_Txt
              ,City AS City_Code
              ,State AS State_Code
              ,PostalCode AS Postal_Code
              ,Country AS Country_Code
            FROM {{ ref('GOLD', 'CDC_COMPETITION') }} "CDC_COMPETITION"
            UNION
            SELECT DISTINCT 
               Journal_Type AS Journal_Type
              ,Journal_Begin_Date AS Journal_Begin_Date
              ,Journal_End_Date AS Journal_End_Date
              ,CHCMP AS Company_Code
              ,CHNAME AS Party_Name 
              ,2 AS Party_Type_Code
              ,0 AS Customer_Account_Num
              ,CAST(TRIM(CHDLST)||TRIM(CHDL0) AS VARCHAR(30)) AS Customer_Account_Char
              ,'M' as Address_Type_Code
              ,RTRIM(CAST(' ' AS VARCHAR(1000))) AS Address_Line_1_Txt
              ,RTRIM(CAST(' ' AS VARCHAR(1000))) AS Address_Line_2_Txt
              ,CHCITY AS City_Code
              ,CHST AS State_Code
              ,CHZIP AS Postal_Code
              ,RTRIM(CAST(' ' AS CHAR(3))) AS Country_Code
            FROM {{ ref('GOLD', 'CDC_CSHCUSFL') }} "CDC_CSHCUSFL"
            UNION
            SELECT DISTINCT 
               Journal_Type AS Journal_Type
              ,Journal_Begin_Date AS Journal_Begin_Date
              ,Journal_End_Date AS Journal_End_Date
              ,MVCMP0 AS Company_Code
              ,MVNAME AS Party_Name 
              ,4 AS Party_Type_Code
              ,MVVND0 AS Customer_Account_Num
              ,RTRIM(CAST(' ' AS VARCHAR(30))) AS Customer_Account_Char
              ,'M' as Address_Type_Code
              ,MVADDR AS Address_Line_1_Txt
              ,MVADR2 AS Address_Line_2_Txt
              ,MVCITY AS City_Code
              ,MVSTTE AS State_Code
              ,MVZPCD AS Postal_Code
              ,MVCNTR AS Country_Code
            FROM {{ ref('GOLD', 'CDC_IMVENDFL') }} "CDC_IMVENDFL"
            UNION
            SELECT DISTINCT 
               Journal_Type AS Journal_Type
              ,Journal_Begin_Date AS Journal_Begin_Date
              ,Journal_End_Date AS Journal_End_Date
              ,ZLCMP AS Company_Code
              ,ZLNAME AS Party_Name 
              ,3 AS Party_Type_Code
              ,0 AS Customer_Account_Num
              ,ZLLOC AS Customer_Account_Char
              ,'M' as Address_Type_Code
              ,ZLADR1 AS Address_Line_1_Txt
              ,ZLADR2 AS Address_Line_2_Txt
              ,ZLCITY AS City_Code
              ,ZLST AS State_Code
              ,ZLZIP AS Postal_Code
              ,ZLCNTR AS Country_Code
            FROM {{ ref('GOLD', 'CDC_SYSLOCFL') }} "CDC_SYSLOCFL"
          ) AS TEMPTABLE
