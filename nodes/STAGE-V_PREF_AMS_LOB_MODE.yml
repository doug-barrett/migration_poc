            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREF_AMS_LOB_MODE') }} AS SELECT NameLOBs,
                   CASE WHEN NameLOBs = 'AUTOP'                           THEN 1
                        WHEN IncomeGrpLOBS = 'OP'                         THEN 2
                        WHEN IncomeGrpLOBS = 'PC' AND NameLOBs != 'AUTOP' THEN 3
                        ELSE 0
                         END AS ModeID_1
              FROM {{ ref('STAGE','V_S_AMS_LOBSETUP_MROC_CURRENT') }}
             WHERE IncomeGrpLOBS IN ('OP','PC')
