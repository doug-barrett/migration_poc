        join:
          joinCondition: |-
            FROM (
                    SELECT *
                      FROM (
                            SELECT table4.monthyear,
                                   table4.accounts_mapped,
                                   ud2id,
                                   ud1id,
                                   CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY Accounts_Mapped,ud2id,ud1id ORDER BY monthyear)
                                        ELSE values_month
                                         END AS values_month,
                                   'Retail_Sales' AS sg_description
                              FROM (
                                    SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear,
                                           accounts_mapped,
                                           ifnull(sum(values_month),0) values_month,
                                           ud2id,
                                           ud1id
                                      FROM {{ ref('STAGE','BVSTG_AU14_CONFIE_OPM') }}
                                     WHERE concat(ud2id,ud1id) IN (
                                            SELECT DISTINCT concat(ud2id,ud1id)
                                              FROM {{ ref('STAGE','BVSTG_AU11_CONFIE_OPM') }}
                                             WHERE sg_description= 'Retail_Sales'
                                           )
                                       AND accountid IN (
                                            SELECT DISTINCT accountid
                                              FROM {{ ref('STAGE','BVSTG_AU6_CONFIE_OPM') }}
                                             WHERE sg_description='TotalRevenue'
                                           )
                                       AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                                     GROUP BY accounts_mapped,
                                              ud2id,
                                              ud1id,
                                              date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                                   ) table4
                           )
                 UNION ALL (
                            SELECT table6.monthyear,
                                   table6.accounts_mapped,
                                   ud2id,
                                   ud1id,
                                   CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY Accounts_Mapped,ud2id,ud1id ORDER BY monthyear)
                                        ELSE values_month
                                         END AS values_month,
                                   'SGA&IT_Revenue' AS sg_description
                              FROM (
                                    SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                           accounts_mapped,
                                           ifnull(sum(values_month),0) values_month,
                                           ud2id,
                                           ud1id
                                      FROM {{ ref('STAGE','BVSTG_AU14_CONFIE_OPM') }}
                                     WHERE concat(ud2id,ud1id) IN (
                                            SELECT DISTINCT concat(ud2id,ud1id)
                                              FROM {{ ref('STAGE','BVSTG_AU13_CONFIE_OPM') }}
                                             WHERE sg_description= 'SGA&IT_Revenue'
                                           )
                                       AND accountid IN (
                                            SELECT DISTINCT accountid
                                              FROM {{ ref('STAGE','BVSTG_AU6_CONFIE_OPM') }}
                                             WHERE sg_description='TotalRevenue'
                                           )
                                       AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                                     GROUP BY accounts_mapped,
                                              ud2id,
                                              ud1id,
                                              date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                                   ) table6
                           )
                   ) AS BVSTG_AU14_CONFIE_OPM
