    sourceMapping:
      - aliases:
          BVSTG_HR_AU1_EMPLOYEEUNIQUE: a163346b-11c7-4f56-8896-4f7da2632c25
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_HR_AU1_EMPLOYEEUNIQUE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_HR_AU1_EMPLOYEEUNIQUE') }} bvstg_hr_au1_employeeunique
              LEFT JOIN(
                    SELECT UniqueID
                      FROM {{ ref('STAGE','BVSTG_HR_AU1_EMPLOYEEUNIQUE') }}
                     WHERE CASE WHEN TermReason = 'Transferred out'           THEN 0
                                WHEN TermReason = 'DeclinedJob/Fail to start' THEN 0
                                WHEN (PointInTimeStatus = 'Terminated')       THEN 2
                                WHEN (PointInTimeStatus = 'Active')           THEN 1
                                WHEN (PointInTimeStatus = 'Leave of absence') THEN 3
                                ELSE 4
                                 END = 0
                       AND Accrual_Option IS NULL
                       AND REHIRESTATUS IS NULL
                   )bvstg_hr_au1_employeeunique_to_delete
                ON bvstg_hr_au1_employeeunique_to_delete.UniqueID = bvstg_hr_au1_employeeunique.UniqueID
             WHERE CASE WHEN bvstg_hr_au1_employeeunique.TermReason = 'Transferred out'           THEN 0
                        WHEN bvstg_hr_au1_employeeunique.TermReason = 'DeclinedJob/Fail to start' THEN 0
                        WHEN (bvstg_hr_au1_employeeunique.PointInTimeStatus = 'Terminated')       THEN 2
                        WHEN (bvstg_hr_au1_employeeunique.PointInTimeStatus = 'Active')           THEN 1
                        WHEN (bvstg_hr_au1_employeeunique.PointInTimeStatus = 'Leave of absence') THEN 3
                        ELSE 4
                         END <> 0
               AND (bvstg_hr_au1_employeeunique_to_delete.UniqueID IS NULL OR (bvstg_hr_au1_employeeunique_to_delete.UniqueID IS NOT NULL AND bvstg_hr_au1_employeeunique.Accrual_Option IS NOT NULL)) QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_hr_au1_employeeunique.UniqueId ORDER BY bvstg_hr_au1_employeeunique.DSS_CREATE_TIME DESC ,bvstg_hr_au1_employeeunique.originalhiredate,bvstg_hr_au1_employeeunique.companycode)=1
