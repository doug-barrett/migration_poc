                          WHEN (category IN ('C5','C10','C8','C26','C28')) AND ((last_txn_date_cdt IS NULL AND last_txn_cdt IS NULL) OR (ltxtexcmth IS NULL AND Lasttransactionincs IS NULL)) AND (last_txn_cdt IN ('Renewal','Endorsement','Reinstatement','New Business') OR Lasttransactionincs IN ('Renewal','Endorsement','Reinstatement','New Business','Other'))                                                                                                                                                                                                                                                                                                                                                                                              THEN 'Active'
                          WHEN (category IN ('C5','C10','C13','C17','C29','C8','C26','C16','C28')) AND ((last_txn_date_cdt IS NULL AND LAST_TXN_CDT IS NULL) AND (ltxtexcmth IS NULL AND Lasttransactionincs IS NULL))                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               THEN 'Inactive'
