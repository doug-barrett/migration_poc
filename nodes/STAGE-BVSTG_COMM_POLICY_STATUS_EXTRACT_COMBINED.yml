                          WHEN (category IN ('C5','C8','C26','C28','C10')) AND month(last_txn_date_cdt)=month(ltxtexcmth) AND year(last_txn_date_cdt)=year(ltxtexcmth) AND ((Lasttransactionincs IN ('Renewal','New Business','Endorsement','Reinstatement') AND last_txn_cdt='Other-Inactive') OR (lasttransactionincs IN ('Reinstatement','Renewal','New Business','Endorsement','Other') AND last_txn_cdt IN ('Reinstatement','Renewal','New Business','Endorsement','Other')) OR (lasttransactionincs IN ('Reinstatement','Renewal','New Business','Endorsement','Other') AND last_txn_Cdt IN ('Other-Active')))                                                                                                                                                 THEN 'Active'
                          WHEN (category IN ('C5','C13','C8','C26','C28','C10')) AND month(last_txn_date_cdt)=month(ltxtexcmth) AND year(last_txn_date_cdt)=year(ltxtexcmth) AND ((Lasttransactionincs IN ('Endorsement','Renewal','New Business') AND LAST_TXN_CDT ='Cancellation') OR (Lasttransactionincs ='Cancellation' AND last_txn_cdt ='Other-Active') OR (Lasttransactionincs IN ('Cancellation') AND last_txn_cdt IN ('Cancellation')) OR (Lasttransactionincs ='Cancellation' AND last_txn_Cdt IN ('Renewal','New Business','Endorsement','Other-Inactive')) OR (lasttransactionincs='Other' AND last_txn_cdt IN ('Cancellation','Other-Inactive')) OR (Lasttransactionincs IN ('Renewal','New Business','Endorsement') AND last_txn_cdt='Cancellation')) THEN 'Inactive'
