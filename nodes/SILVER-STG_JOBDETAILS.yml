    sourceMapping:
    - aliases:
        SRC_JOBDETAILS: d52353fe-fec6-5288-8b0c-12bd30231aef
      customSQL:
        customSQL: "WITH OrderedEvents AS\n(\n    SELECT\n        entity_id,\n   \
          \     type,\n        date,\n        SUM(CASE WHEN type = 'unhold' THEN 1\
          \ ELSE 0 END)\n            OVER\n            (\n                PARTITION\
          \ BY entity_id\n                ORDER BY date\n                ROWS BETWEEN\
          \ UNBOUNDED PRECEDING AND 1 PRECEDING\n            ) AS cycle_id\n    FROM\
          \ events\n    WHERE entity_type = 'invoice'\n      AND type IN ('hold',\
          \ 'unhold', 'invoiced', 'Invoice')      \n      order by entity_id\n   \
          \ \n),\nNormalized AS\n(\n    SELECT\n        entity_id,\n        type,\n\
          \        date,\n        COALESCE(cycle_id, 0) AS cycle_id\n    FROM OrderedEvents\n\
          ),\nCycleDates AS\n(\n    SELECT\n        entity_id,\n        cycle_id,\n\
          \        MIN(CASE WHEN type = 'hold' THEN date END) AS HoldDate,\n     \
          \   MIN(CASE WHEN type = 'unhold' THEN date END) AS UnholdDate,\n      \
          \  MIN(CASE WHEN type IN ('invoiced', 'Invoice') THEN date END) AS InvoicedDate\n\
          \    FROM Normalized\n    GROUP BY\n        entity_id,\n        cycle_id\n\
          ),\nCycleHours AS\n(\n    SELECT\n        entity_id,\n        HoldDate,\n\
          \        UnholdDate,\n        InvoicedDate,\n        CASE\n            WHEN\
          \ HoldDate IS NOT NULL AND UnholdDate IS NOT NULL\n                THEN\
          \ TIMESTAMPDIFF(MINUTE, HoldDate, UnholdDate) / 60.0\n            WHEN HoldDate\
          \ IS NOT NULL AND UnholdDate IS NULL AND InvoicedDate IS NOT NULL\n    \
          \            THEN NULL\n            WHEN HoldDate IS NOT NULL AND UnholdDate\
          \ IS NULL AND InvoicedDate IS NULL\n                 THEN TIMESTAMPDIFF(MINUTE,\
          \ HoldDate, CURRENT_TIMESTAMP) / 60.0\n            ELSE NULL\n        END\
          \ AS HoldHours,\n        CASE\n            WHEN HoldDate IS NOT NULL AND\
          \ UnholdDate IS NULL AND InvoicedDate IS NOT NULL\n                THEN\
          \ 1\n            ELSE 0\n        END AS BlankFlag\n    FROM CycleDates\n\
          \    WHERE HoldDate IS NOT NULL\n)\nselect invoices.id as Job_Id, invoices.account_deductible,\
          \ invoices.billing_profile_id, invoices.verified_parts_count, invoices.account_pid,\
          \ invoices.invoice_balance,\ninvoice_amount, invoices.invoice_discount,\
          \ invoices.invoice_tax, invoices.invoice_payment_received, invoices.processor,\
          \ invoices.carid, invoices.salesman_1_id, invoices.\nsalesman_2_id, invoices.salesman_3_id,\
          \ invoices.salesman_4_id,coalesce(comp.id,-11) as account_company_id, invoices.SalesTaxRate,\
          \ invoices.salesman_1_commission,\nsalesman_2_commission, invoices.parts_cost,\
          \ invoices.labor_cost, invoices.freight_cost, coalesce(invoices.location_id,-11)\
          \ as  location_id,invoices.pricing_profile_id, invoices.auto_tax, invoices.\n\
          billing_account_id, invoices.account_balance_due, invoices.dispatch_id,\
          \ invoices.customer_account_id,\n'-11'as \"Tech_Username\",-11 as \"Sales_Item_Id\"\
          ,invoices.date as \"Invoice_Date\",\nCONVERT_TIMEZONE('UTC', 'US/Central',\
          \ invoices.date_created) as created_date,\nCONVERT_TIMEZONE('UTC', 'US/Central',\
          \ invoices.date_wo) as Work_Order_date, \nCase when (invoices.date_wo is\
          \ not null or invoices.job_status <>'VO' ) and invoices.job_status <>'LE'\
          \ \nthen CONVERT_TIMEZONE('UTC', 'US/Central', invoices.date_created) else\
          \ null end as Quoted_Date,\n\n\nCAST(TIMESTAMPDIFF(MINUTE, WorkOrderDate,EndedDate)/60.00\
          \ as DECIMAL(12,2)) as WOEnded,\nCAST(TIMESTAMPDIFF(MINUTE,WorkOrderDate,InvoicedDate)/60.00\
          \ as DECIMAL(12,2))  as WOInvoiced,\nCAST(TIMESTAMPDIFF(MINUTE,CreatedDate,ScheduledDate)/60.00\
          \ as DECIMAL(12,2))  as CreatedSched,\nCAST(TIMESTAMPDIFF(MINUTE,WorkOrderDate,ScheduledDate)/60.00\
          \ as DECIMAL(12,2))  as SchedWO,\n\ncast(TIMESTAMPDIFF(MINUTE,CreatedDate,WorkOrderDate)/60.00\
          \  as DECIMAL(12,2))  as CreatedWO,\ncast(TIMESTAMPDIFF(MINUTE,WorkOrderDate,ScheduledDate)/60.00\
          \  as DECIMAL(12,2)) as WOSched,\ncast(TIMESTAMPDIFF(MINUTE, ScheduledDate,EndedDate)/60.00\
          \  as DECIMAL(12,2)) as SchedEnded,\ncast(TIMESTAMPDIFF(MINUTE,EndedDate,InvoicedDate)/60.00\
          \   as DECIMAL(12,2)) as EndedInvoiced,\ncast(TIMESTAMPDIFF(MINUTE,ScheduledDate,InvoicedDate)/60.00\
          \  as DECIMAL(12,2)) as SchedInvoiced,\ncast(TIMESTAMPDIFF(MINUTE,CreatedDate,EndedDate)/60.00\
          \  as DECIMAL(12,2)) as CreatedEnded,\ncast(TIMESTAMPDIFF(MINUTE,CreatedDate,InvoicedDate)/60.00\
          \  as DECIMAL(12,2))  as TotalCycleTime,\nhldTime.HoldTime\nfrom invoices\
          \  \nleft join companies comp on invoices.account_company_id = comp.id\n\
          left join \n(\nSELECT\nentity_id as JobId,\nmin(CASE\n  WHEN TYPE = 'created'\
