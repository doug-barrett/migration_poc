          \ WorkOrderDate,\n max(CASE\n  WHEN TYPE = 'ended' THEN date   else null\
          \ END)\n AS EndedDate\n,max(CASE\n  WHEN TYPE in ( 'invoiced','Invoice')\
          \ THEN date  else null END)\n AS InvoicedDate\n\nFROM events\nwhere entity_type='invoice'\n\
          GROUP BY entity_id\n)Final on invoices.id=Final.JobId\nleft join (\nSELECT\n\
          \    entity_id,\n    CAST(\n        CASE\n            WHEN MAX(BlankFlag)\
          \ = 1 THEN NULL\n            ELSE SUM(HoldHours)\n        END\n    AS DECIMAL(12,2))\
          \ AS HoldTime\nFROM CycleHours\nGROUP BY entity_id\n)hldTime on invoices.id=hldTime.entity_id"
