            transform: CASE --IF WE HAVE NOT MAPPED ALL THE POSIBLE OPTIONS FOR THE LSI BUSINESS UNIT   -- USE THE EMPLOYEE'S BUSINESS UNIT   WHEN I_K2_SAFETYWALKAROUNDMAPPED.CALCULATEDBUSINESSUNITCODE = 'UNKNOWN'    THEN I_K2_SAFETYWALKAROUNDMAPPED.EMPLOYEEBUSINESSUNITCODE   --IF THE EMPLOYEE COMPANY MATCHES THE COMPANY WHERE THE LSI HAPPENED   -- USE THE EMPLOYEE BUSINESS UNIT, IF NOT USE THE GENERIC MAPPED BUSINESS UNIT   WHEN LEFT(I_K2_SAFETYWALKAROUNDMAPPED.CALCULATEDBUSINESSUNITCODE,1)     <> LEFT(I_K2_SAFETYWALKAROUNDMAPPED.EMPLOYEEBUSINESSUNITCODE,1)    THEN I_K2_SAFETYWALKAROUNDMAPPED.CALCULATEDBUSINESSUNITCODE   ELSE I_K2_SAFETYWALKAROUNDMAPPED.EMPLOYEEBUSINESSUNITCODE  END
