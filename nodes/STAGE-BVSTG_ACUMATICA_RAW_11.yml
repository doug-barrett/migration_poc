            nodeName: DS_BVSTG_AP1_TRANSACTIONITEM
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: STAGE
            nodeName: BVSTG_ACUMATICA_TRANSACTION_MAPPING
          - locationName: STAGE
            nodeName: V_API_ACUMATICA_BRANCH
          - locationName: STAGE
            nodeName: V_API_ACUMATICA_REVENUEDESCRIPTION
          - locationName: STAGE
            nodeName: V_API_ACUMATICA_ACCOUNT
          - locationName: STAGE
            nodeName: V_API_ACUMATICA_STATECODE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONITEM') }} ds_bvstg_ap1_transactionitem
             INNER JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                ON ds_ram_retail_repository.TRANSACTIONITEMID = ds_bvstg_ap1_transactionitem.TRANSACTIONITEMID
             INNER JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ds_retail_office.OFFICECODE = ds_bvstg_ap1_transactionitem.BIATRANSACTIONOFFICE
             INNER JOIN {{ ref('STAGE','BVSTG_ACUMATICA_TRANSACTION_MAPPING') }} bvstg_acumatica_transaction_mapping
                ON IFNULL(bvstg_acumatica_transaction_mapping.TRANSACTIONTYPE,'') = IFNULL(ds_bvstg_ap1_transactionitem.TRANSACTIONTYPE,'')
               AND IFNULL(bvstg_acumatica_transaction_mapping.FEETYPE,'') = IFNULL(ds_bvstg_ap1_transactionitem.FEETYPE,'')
               AND IFNULL(bvstg_acumatica_transaction_mapping.FEENAME,'') = IFNULL(ds_bvstg_ap1_transactionitem.FEENAME,'')
               AND IFNULL(bvstg_acumatica_transaction_mapping.AP_ADDITIONALPRODUCTNAME,'') = IFNULL(ds_ram_retail_repository.AP_ADDITIONALPRODUCTNAME,'')
              LEFT JOIN {{ ref('STAGE','V_API_ACUMATICA_BRANCH') }} v_api_acumatica_branch
                ON v_api_acumatica_branch.Number = ds_retail_office.BUSINESSENTITYCODE
              LEFT JOIN {{ ref('STAGE','V_API_ACUMATICA_REVENUEDESCRIPTION') }} v_api_acumatica_revenuedescription
                ON v_api_acumatica_revenuedescription.REVENUEDESCRIPTIONID = bvstg_acumatica_transaction_mapping.REVENUETYPE
              LEFT JOIN {{ ref('STAGE','V_API_ACUMATICA_ACCOUNT') }} v_api_acumatica_account
                ON v_api_acumatica_account.REVENUEDESCRIPTIONID = v_api_acumatica_revenuedescription.REVENUEDESCRIPTIONID
               AND v_api_acumatica_account.ISVOID = CASE WHEN IFNULL(ds_bvstg_ap1_transactionitem.TRANSACTIONVOIDEDON,'1900-01-01')>=IFNULL(ds_bvstg_ap1_transactionitem.VOIDEDON,'1900-01-01') AND TO_DATE(ds_bvstg_ap1_transactionitem.TRANSACTIONVOIDEDON) BETWEEN DATE_TRUNC('month',ds_bvstg_ap1_transactionitem.CREATED) AND LAST_DAY(ds_bvstg_ap1_transactionitem.CREATED) THEN 1
                        WHEN IFNULL(ds_bvstg_ap1_transactionitem.TRANSACTIONVOIDEDON,'1900-01-01')<=IFNULL(ds_bvstg_ap1_transactionitem.VOIDEDON,'1900-01-01') AND TO_DATE(ds_bvstg_ap1_transactionitem.VOIDEDON) BETWEEN DATE_TRUNC('month',ds_bvstg_ap1_transactionitem.CREATED) AND LAST_DAY(ds_bvstg_ap1_transactionitem.CREATED)            THEN 1
                        ELSE 0
                         END
               AND v_api_acumatica_account.IsActive=TRUE
              LEFT JOIN {{ ref('STAGE','V_API_ACUMATICA_STATECODE') }} v_api_acumatica_statecode
                ON LOWER(v_api_acumatica_statecode.STATENAME) = LOWER(CASE WHEN (ds_bvstg_ap1_transactionitem.ORGANIZATIONCODE LIKE 'SSB%' OR ds_bvstg_ap1_transactionitem.ORGANIZATIONCODE LIKE 'APS1%') THEN 'California' ELSE ds_retail_office.STATE END)
             WHERE YEAR(ds_bvstg_ap1_transactionitem.CREATED)>=2021
               AND IFNULL(ds_bvstg_ap1_transactionitem.TRANSACTIONITEMID,0)>0
