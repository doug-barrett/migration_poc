      dependencies:
        - locationName: GOLD
          nodeName: ORDERS
        - locationName: GOLD
          nodeName: ORDER_LINE
        - locationName: SILVER
          nodeName: STG_ORDER_LINE
      join:
        joinCondition: |-
          From {{ ref('GOLD', 'ORDERS') }} "inner" join {{ ref('GOLD', 'ORDER_LINE') }} "ORDER_LINE" 
          on ORDER_LINE.Contract_Key = ORDERS.Contract_Key
          and ORDER_LINE.Contract_Seq_Key = ORDERS.Contract_Seq_Key 
          --and ORDERS.invoice_Order_type in ('C','E','P','F')  
          --and ORDER_LINE.Order_Line_Type_Code = 'RI'
          
          Left outer join {{ ref('GOLD', 'ORDER_LINE') }} "ORDER_LINE_F" 
          on ORDER_LINE.Contract_Key = ORDER_LINE_F.Contract_Key
          and ORDER_LINE.Contract_Seq_Key = ORDER_LINE_F.Contract_Seq_Key 
          and ORDER_LINE.Contract_Line_Key = ORDER_LINE_F.Contract_Line_Key 
          and ORDERS.invoice_Order_type = 'F'
          
          Left outer join {{ ref('GOLD', 'ORDER_LINE') }} "ORDER_LINE_P" 
          on ORDER_LINE.Contract_Key = ORDER_LINE_P.Contract_Key
          and ORDER_LINE.Contract_Seq_Key = ORDER_LINE_P.Contract_Seq_Key 
          and ORDER_LINE.Contract_Line_Key = ORDER_LINE_P.Contract_Line_Key 
          and ORDERS.invoice_Order_type = 'P'
          
          Left outer join {{ ref('GOLD', 'ORDER_LINE') }} "ORDER_LINE_E" 
          on ORDER_LINE.Contract_Key = ORDER_LINE_E.Contract_Key
          and ORDER_LINE.Contract_Seq_Key = ORDER_LINE_E.Contract_Seq_Key 
          and ORDER_LINE.Contract_Line_Key = ORDER_LINE_E.Contract_Line_Key 
          and ORDERS.invoice_Order_type = 'E'
          Where ORDERS.Contract_Key in (Select Contract_Key from {{ ref('SILVER', 'STG_ORDER_LINE') }} "STG_ORDER_LINE")
