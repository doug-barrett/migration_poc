        join:
          joinCondition: |-
            FROM (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY LeadID ORDER BY DSS_VERSION DESC)=1
                   )S_AP1_LEAD_MROC
             INNER JOIN (
                    SELECT DISTINCT customerid
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_GROUP_LEAD_TO_REFRESH') }}
                     WHERE SourceDb = 'AppOne'
                   ) bvstg_customer_group_lead_to_refresh
                ON bvstg_customer_group_lead_to_refresh.CustomerID = S_AP1_LEAD_MROC.CustomerID
             INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CUSTOMERSUMMARY_V2
                ON to_varchar(S_AP1_LEAD_MROC.CustomerID) = DS_CUSTOMERSUMMARY_V2.CustomerID
               AND DS_CUSTOMERSUMMARY_V2.SourceDB = 'AppOne'
              LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} DS_AP1_TRANSACTIONSUMMARY
                ON DS_AP1_TRANSACTIONSUMMARY.TRANSACTIONID = S_AP1_LEAD_MROC.TRANSACTIONID
