                                                        ON a.childid=b.parentid
                                                      LEFT JOIN {{ ref('STAGE','V_DLBV_OSM_RELATIONSHIP_CURRENT') }} c
                                                        ON b.childid=c.parentid
                                                   )
                                           )
                                   ) t1
