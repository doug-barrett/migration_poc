                                                     WHERE name = 'OtherExpensesOp'
                                                   ) AS description
                                              FROM (
                                                    SELECT DISTINCT childid
                                                      FROM {{ ref('STAGE','V_DLBV_OSM_RELATIONSHIP_CURRENT') }}
                                                     WHERE parentid IN (
                                                            SELECT DISTINCT memberid
                                                              FROM {{ ref('STAGE','V_DLBV_OSM_MEMBER_CURRENT') }}
                                                             WHERE name = 'OtherExpensesOp'
                                                           )
                                                     UNION SELECT DISTINCT b.childid childid
                                                      FROM (
                                                            SELECT *
                                                              FROM {{ ref('STAGE','V_DLBV_OSM_RELATIONSHIP_CURRENT') }}
                                                             WHERE parentid IN (
                                                                    SELECT DISTINCT memberid
                                                                      FROM {{ ref('STAGE','V_DLBV_OSM_MEMBER_CURRENT') }}
                                                                     WHERE name = 'OtherExpensesOp'
                                                                   )
                                                           ) a
                                                      LEFT JOIN {{ ref('STAGE','V_DLBV_OSM_RELATIONSHIP_CURRENT') }} b
                                                        ON a.childid=b.parentid
                                                     UNION SELECT DISTINCT c.childid childid
                                                      FROM (
                                                            SELECT *
                                                              FROM {{ ref('STAGE','V_DLBV_OSM_RELATIONSHIP_CURRENT') }}
                                                             WHERE parentid IN (
                                                                    SELECT DISTINCT memberid
                                                                      FROM {{ ref('STAGE','V_DLBV_OSM_MEMBER_CURRENT') }}
                                                                     WHERE name = 'OtherExpensesOp'
                                                                   )
                                                           ) a
