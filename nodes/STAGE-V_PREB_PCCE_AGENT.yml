    sourceMapping:
      - aliases:
          V_PREB_PCCE_AGENT: 97e1c9ae-3c84-4978-8fef-c097df87fce1
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE
             OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_AGENT') }} AS SELECT DISTINCT CAST(ds_hr_employeeunique.EMPLOYEENUMBER AS VARCHAR(50)) hr_EMPLOYEENUMBER,
                   CAST(v_s_ap1_employee_mroc_current.EMPLOYEENUMBER AS VARCHAR(50)) ap1_EMPLOYEENUMBER,
                   CAST(v_preb_pcce_employee_upn_appone.EMPLOYEENUMBER AS VARCHAR(50)) UPN_EMPLOYEENUMBER,
                   CAST(v_s_ams_employee_mroc_current.ShortName AS VARCHAR(50)) CIGH_EMPLOYEENUMBER,
                   ds_hr_employeeunique.EMPLOYEENAME hr_EMPLOYEENAME,
                   ds_bvstg_pcce_agent.AgentName UPN_EMPLOYEENAME,
                   v_s_ap1_employee_mroc_current.FullName ap1_EMPLOYEENAME,
                   ds_bvstg_pcce_agent.AgentName Cisco_EMPLOYEENAME,
                   v_s_ams_employee_mroc_current.LastName || ', ' || v_s_ams_employee_mroc_current.FirstName CIGH_EMPLOYEENAME,
                   ds_bvstg_pcce_agent.SkillTargetID Cisco_SkillTargetID,
                   ds_bvstg_pcce_agent.LoginName Cisco_LoginName,
                   v_s_ap1_employee_mroc_current.UserID ap1_UserID,
                   v_s_ams_employee_mroc_current.EMPCODE Cigh_EmpCode,
                   ds_sfdc_contact.OfficeCode SF_OfficeCode,
                   ds_hr_employeeunique.locationcode hr_OfficeCode,
                   v_s_ap1_employee_mroc_current.OfficeCode ap1_OfficeCode,
                   v_s_ap1_employee_mroc_current.isactive ap1_Status,
                   v_s_ams_employee_mroc_current.STATUS CIGH_Status,
                   ds_sfdc_contact.title sf_title,
                   ds_sfdc_contact.STATUS sf_Status,
                   ds_sfdc_contact.TerminationDate sf_TerminationDate,
                   CASE WHEN ds_bvstg_pcce_agent.SkillTargetID IS NULL THEN 1
                        ELSE DENSE_RANK() OVER (PARTITION BY ds_bvstg_pcce_agent.SkillTargetID ORDER BY ds_sfdc_contact.STATUS, IFNULL(v_s_ap1_employee_mroc_current.isactive, 'FALSE') DESC, CAST(ds_sfdc_contact.EMPLOYEENUMBER AS VARCHAR(50)) DESC, ds_bvstg_pcce_agent.max_startdatetime DESC)
                         END Rank_SkillTarget,
                   DENSE_RANK() OVER (PARTITION BY ds_bvstg_pcce_agent.LOGINNAME ORDER BY CASE WHEN ds_bvstg_pcce_agent.pcce_agent_skilltargetid IS NOT NULL THEN 1 ELSE 2 END, ds_bvstg_pcce_agent.max_startdatetime DESC) Rank_pcce_agent,
                   CASE WHEN v_s_ap1_employee_mroc_current.UserID IS NULL THEN 1
                        WHEN ds_bvstg_pcce_agent.SkillTargetID = '48056'  THEN 1
                        WHEN ds_bvstg_pcce_agent.SkillTargetID = '48938'  THEN 2
                        ELSE DENSE_RANK() OVER (PARTITION BY v_s_ap1_employee_mroc_current.UserID ORDER BY ds_hr_employeeunique.PointInTimeStatus, v_s_ap1_employee_mroc_current.isactive DESC)
                         END Rank_AppOneUser,
                   CASE WHEN v_s_ams_employee_mroc_current.EMPCODE IS NULL THEN 1
                        ELSE DENSE_RANK() OVER (PARTITION BY v_s_ams_employee_mroc_current.EMPCODE ORDER BY v_s_ams_employee_mroc_current.STATUS, ds_hr_employeeunique.PointInTimeStatus, v_s_ap1_employee_mroc_current.isactive DESC, ds_bvstg_pcce_agent.SkillTargetID)
                         END Rank_CIGHUser,
                   ds_sfdc_contact.EmployeeType
              FROM (
                    SELECT IFNULL(a.EMPLOYEENUMBER, CASE WHEN b.employeetype = 'Franchise' THEN b.employeenumber ELSE LEFT(b.employeenumber, 6) END) EMPLOYEENUMBER,
                           IFNULL(b.FULLNAME, a.EMPLOYEENAME) EMPLOYEENAME,
                           IFNULL(a.locationcode, b.OFFICECODE) locationcode,
                           IFNULL(a.PointInTimeStatus, b.STATUS) PointInTimeStatus,
                           IFNULL(a.isLast, 1) isLast
                      FROM RETAIL_PROD.SCH_EDW.DS_HR_EMPLOYEEUNIQUE a
                      FULL JOIN RETAIL_PROD.SCH_EDW.DS_SFDC_CONTACT b
                        ON a.EmployeeNumber = b.EmployeeNumber
                     WHERE IFNULL(a.EMPLOYEENUMBER, b.EMPLOYEENUMBER) IS NOT NULL
                   ) ds_hr_employeeunique
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_PCCE_EMPLOYEE_UPN_APPONE v_preb_pcce_employee_upn_appone
                ON (ds_hr_employeeunique.EMPLOYEENUMBER = TO_VARCHAR(v_preb_pcce_employee_upn_appone.EMPLOYEENUMBER))
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_SFDC_CONTACT ds_sfdc_contact
                ON (ds_sfdc_contact.EMPLOYEENUMBER = ds_hr_employeeunique.EMPLOYEENUMBER)
              FULL JOIN (
                    SELECT A.*,
                           b.SKILLTARGETID pcce_agent_skilltargetid,
                           c.max_startdatetime
                      FROM RETAIL_PROD.SCH_BVSTAGE.ds_bvstg_pcce_agent A
                      LEFT JOIN DATA_LAKE.CISCO_PCCE.LD_PCCE_AGENT B
                        ON A.SKILLTARGETID = B.SKILLTARGETID
                      LEFT JOIN (
                            SELECT DISTINCT agentskilltargetid,
                                   MAX(startdatetime) max_startdatetime
                              FROM RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_DETAIL
                             GROUP BY agentskilltargetid
                           ) c
                        ON c.agentskilltargetid = b.skilltargetid
                   ) ds_bvstg_pcce_agent
                ON (lower(ds_bvstg_pcce_agent.LoginName) = lower(v_preb_pcce_employee_upn_appone.upn))
              FULL JOIN (
                    SELECT DISTINCT emp.UserID,
                           emp.EmployeeNumber,
                           emp.FullName,
                           emp.firstName,
                           emp.lastname,
                           emp.email,
                           emp.PHONESYSTEMUSERID,
                           office.OfficeCode,
                           emp.isactive
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_EMPLOYEE_MROC_CURRENT emp
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PRE_AP1_OFFICE_MROC_CURRENT office
                        ON (office.OfficeID = emp.LASTLOGEDINOFFICEID AND office.isrowdeleted = 0)
                     WHERE emp.isrowdeleted = 0
                   ) v_s_ap1_employee_mroc_current
                ON (ds_hr_employeeunique.EMPLOYEENUMBER = v_s_ap1_employee_mroc_current.EMPLOYEENUMBER)
              FULL JOIN (
                    SELECT EMPCODE EMPCODE,
                           SHORTNAME,
                           STATUS,
                           LastName,
                           FirstName,
                           Email
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_AMS_EMPLOYEE_MROC_CURRENT
                     UNION SELECT EMPCODE || '-SPLC' EMPCODE,
                           SHORTNAME,
                           STATUS,
                           LastName,
                           FirstName,
                           Email
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_SPLC_EMPLOYEE_CURRENT a
                     INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_EMPLOYEE b
                        ON a.HK_H_EMPLOYEE = b.HK_H_EMPLOYEE
                   ) v_s_ams_employee_mroc_current
                ON (v_s_ams_employee_mroc_current.ShortName = COALESCE(CAST(ds_hr_employeeunique.EMPLOYEENUMBER AS VARCHAR(50)), CAST(v_preb_pcce_employee_upn_appone.EMPLOYEENUMBER AS VARCHAR(50))) OR REPLACE(v_s_ams_employee_mroc_current.email, '@freewayinsurance.com', '@freeway-insurance.com') = ds_bvstg_pcce_agent.LoginName)
             WHERE (ds_hr_employeeunique.isLast = 1 OR ds_hr_employeeunique.isLast IS NULL) ;
        dependencies:
          - locationName: EDW
            nodeName: DS_HR_EMPLOYEEUNIQUE
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_HR_EMPLOYEEUNIQUE') }}
        name: V_PREB_PCCE_AGENT
        noLinkRefs: []
