                                ON s_ap1_transaction_mroc.transactionid = s_ap1_transactionpolicy_mroc.transactionid
                               AND s_ap1_transaction_mroc.isvoid = 'FALSE'
                             WHERE (('{{ parameters.HWM_BVSTG_Cognitio_Daily_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Cognitio_Daily_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DATE(s_ap1_transaction_mroc.DSS_CREATE_TIME),DATE(CURRENT_DATE())) <= '{{ parameters.HWM_BVSTG_Cognitio_Daily_Refresh_Days }}'))
