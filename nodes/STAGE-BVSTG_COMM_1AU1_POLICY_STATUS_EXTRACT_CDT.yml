                            SELECT DISTINCT l_transactionpolicy_policy.hk_h_transactionpolicy,
                                   l_transactionpolicy_policy.hk_h_policy,
                                   s_ap1_transactionpolicy_mroc.transactionpolicyid,
                                   s_ap1_transactionpolicy_mroc.policyid,
                                   s_ap1_transaction_mroc.hk_h_transaction,
                                   cast(s_ap1_transaction_mroc.transactionid AS varchar) AS transactionid,
                                   cast(s_ap1_transaction_mroc.transactiontypeid AS varchar) AS transactiontypeid,
                                   s_ap1_transaction_mroc.transactionstatusdate,
                                   s_ap1_transaction_mroc.created,
                                   s_ap1_transaction_mroc.createdby,
                                   s_ap1_transaction_mroc.isrowdeleted,
                                   s_ap1_transaction_mroc.lastupdated
                              FROM {{ ref('DATA_VAULT','L_TRANSACTIONPOLICY_POLICY') }} l_transactionpolicy_policy
                              JOIN {{ ref('DATA_VAULT','S_AP1_TRANSACTIONPOLICY_MROC') }} s_ap1_transactionpolicy_mroc
                                ON l_transactionpolicy_policy.hk_h_transactionpolicy = s_ap1_transactionpolicy_mroc.hk_h_transactionpolicy
                              JOIN {{ ref('DATA_VAULT','S_AP1_TRANSACTION_MROC') }} s_ap1_transaction_mroc
                                ON s_ap1_transaction_mroc.transactionid = s_ap1_transactionpolicy_mroc.transactionid
                               AND s_ap1_transaction_mroc.isvoid = 'FALSE'
                             WHERE (('{{ parameters.HWM_BVSTG_Cognitio_Daily_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Cognitio_Daily_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DATE(s_ap1_transaction_mroc.DSS_CREATE_TIME),DATE(CURRENT_DATE())) <= '{{ parameters.HWM_BVSTG_Cognitio_Daily_Refresh_Days }}'))
