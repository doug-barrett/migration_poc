                        ON trandetail.hk_h_policy = ds_bvstg_comm_0au1_policy_status_extract_cdt.hk_h_policy
                      LEFT OUTER JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} codetab
                        ON trandetail.transactiontypeid = codetab.codevalueid
                   )bvstg_comm_0au1_policy_status_extract_cdt
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_TRANSACTIONSTATUSNEW') }} bvstg_ap1_au_transactionstatusnew
                ON bvstg_comm_0au1_policy_status_extract_cdt.transactionid = bvstg_ap1_au_transactionstatusnew.transactionid
