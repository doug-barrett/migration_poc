                                   s_ap1_transaction_mroc.created,
                                   s_ap1_transaction_mroc.createdby,
                                   s_ap1_transaction_mroc.isrowdeleted,
                                   s_ap1_transaction_mroc.lastupdated
                              FROM {{ ref('DATA_VAULT','L_TRANSACTIONPOLICY_POLICY') }} l_transactionpolicy_policy
                              JOIN {{ ref('DATA_VAULT','S_AP1_TRANSACTIONPOLICY_MROC') }} s_ap1_transactionpolicy_mroc
                                ON l_transactionpolicy_policy.hk_h_transactionpolicy = s_ap1_transactionpolicy_mroc.hk_h_transactionpolicy
