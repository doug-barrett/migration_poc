            FROM L_JDE_F4301_PURCHASEORDERHEADER
              LEFT OUTER JOIN L_JDE_F0101_ADDRESSBOOKMASTER
                ON L_JDE_F4301_PURCHASEORDERHEADER.PHKCOO = L_JDE_F0101_ADDRESSBOOKMASTER.ABAN8
              LEFT OUTER JOIN L_JDE_F0101_ADDRESSBOOKMASTER ADDRESSBOOKMASTER_2
                ON L_JDE_F4301_PURCHASEORDERHEADER.PHAN8 = ADDRESSBOOKMASTER_2.ABAN8
              LEFT OUTER JOIN L_JDE_F0006_BUSINESSUNITMASTER
                ON L_JDE_F4301_PURCHASEORDERHEADER.PHMCU = L_JDE_F0006_BUSINESSUNITMASTER.MCMCU --THESE BUSINESS UNITS ARE OF TYPE BP AND PL    LEFT OUTER JOIN I_JDE_DOCUMENTTYPE  ON LTRIM(RTRIM(L_JDE_F4301_PURCHASEORDERHEADER.PHDCTO)) = I_JDE_DOCUMENTTYPE.DOCUMENTTYPECODE    LEFT OUTER JOIN I_JDE_PRINTMESSAGE  ON LTRIM(RTRIM(L_JDE_F4301_PURCHASEORDERHEADER.PHINMG)) = I_JDE_PRINTMESSAGE.PRINTMESSAGECODE  LEFT OUTER JOIN I_JDE_TAXEXPLANATION  ON LTRIM(RTRIM(L_JDE_F4301_PURCHASEORDERHEADER.PHEXR1)) = I_JDE_TAXEXPLANATION.TAXEXPLANATIONCODE  LEFT OUTER JOIN I_JDE_CONDITIONSOFTRANSPORT  ON LTRIM(RTRIM(L_JDE_F4301_PURCHASEORDERHEADER.PHCOT)) = I_JDE_CONDITIONSOFTRANSPORT.CONDITIONSOFTRANSPORTCODE  LEFT OUTER JOIN I_JDE_REASON  ON LTRIM(RTRIM(L_JDE_F4301_PURCHASEORDERHEADER.PHRCD)) = I_JDE_REASON.REASONCODE  LEFT OUTER JOIN I_JDE_EVALUATEDRECEIPT  ON LTRIM(RTRIM(L_JDE_F4301_PURCHASEORDERHEADER.PHAVCH)) = I_JDE_EVALUATEDRECEIPT.EVALUATEDRECEIPTCODE  LEFT OUTER JOIN I_JDE_LANDEDCOSTRULE  ON LTRIM(RTRIM(L_JDE_F4301_PURCHASEORDERHEADER.PHPRP5)) = I_JDE_LANDEDCOSTRULE.LANDEDCOSTRULECODE  LEFT OUTER JOIN I_JDE_CURRENCYMODE  ON LTRIM(RTRIM(L_JDE_F4301_PURCHASEORDERHEADER.PHCRRM)) = I_JDE_CURRENCYMODE.CURRENCYMODECODE  LEFT JOIN {{ ref('NP','D_EMPLOYEE') }}  ON L_JDE_F4301_PURCHASEORDERHEADER.PHORBY = D_EMPLOYEE.COMPUTERLOGIN  LEFT JOIN D_EMPLOYEE EMPLOYEEBUYER   ON CASE          WHEN PHANBY = 0 THEN NULL    ELSE PHANBY       END = EMPLOYEEBUYER.JDEADDRESSBOOKNUMBER
