          DS_RETAIL_OFFICE: 581aed87-ec65-482f-aa6f-9a04a9d54476
          DS_PCCE_TERMINATION_CALL_AGENT_SESSION: 7f87fcca-2084-4933-bc16-b97046b80bfa
          DS_AGENT_KEY: 489968a6-2aa9-4c60-83b4-b001aab3e3a8
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU2_STORE_EVALUATION
          - locationName: STAGE
            nodeName: V_DLBV_BOE_SALESCALENDAR_CURRENT
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: STAGE
            nodeName: DS_BVSTG_TRANSACTION_METHOD_TYPE
          - locationName: EDW
