          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_AGENT_SESSION
          - locationName: EDW
            nodeName: DS_AGENT_KEY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_COMM_AU2_STORE_EVALUATION') }} bvstg_comm_au2_store_evaluation
              LEFT JOIN (
                    SELECT DISTINCT v_dlbv_boe_salescalendar_current.Asofmonth,
                           OFFICECODE,
                           Working_days,
                           FTE_SUM FTE_Numerator,
                           div0(FTE_Numerator,Working_days) FTE
                      FROM (
                            SELECT DISTINCT date_trunc('month',SALESDATE) asofmonth,
                                   sum(SALESDAYWEIGHT) Working_days
                              FROM {{ ref('STAGE','V_DLBV_BOE_SALESCALENDAR_CURRENT') }}
                             WHERE year(SALESDATE)>=2019
                               AND DAYOFWEEK(SALESDATE) NOT IN (6,0)
                               AND SALESDATE<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                             GROUP BY date_trunc('month',SALESDATE)
                           ) v_dlbv_boe_salescalendar_current
                      LEFT JOIN (
                            SELECT officecode,
                                   date_trunc('month',vintage) asofmonth,
                                   sum(FTE_SUM) FTE_SUM
                              FROM (
                                    SELECT OFFICECODE,
                                           vintage,
                                           count(DISTINCT PRODUCER) FTE_SUM
                                      FROM ((SELECT ds_ram_retail_repository.OFFICECODE ,DATE(TRANSACTIONDATE) AS VINTAGE ,PRIMARYAGENTULTIPRO_BROKER AS PRODUCER FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository LEFT JOIN {{ ref('STAGE','DS_BVSTG_TRANSACTION_METHOD_TYPE') }} ds_bvstg_transaction_method_type ON ds_ram_retail_repository.TRANSACTIONID=ds_bvstg_transaction_method_type.TRANSACTIONID LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office ON ds_retail_office.OfficeCode = ds_ram_retail_repository.OfficeCode WHERE 1=1 AND YEAR(ds_ram_retail_repository.CreatedDate) >= 2019 AND ds_ram_retail_repository.Label not like '%Void%' AND ds_ram_retail_repository.SourceDB <> 'ConfieHub' AND ds_ram_retail_repository.CLASSIFICATIONGROUP NOT IN ('SR-22 Fee','Agency Fee','Documentation Fee','Monthly Payments Fee','Renewal', 'New Transfer' ,'Fee Counts','Cancellation','Reinstatement','Endorsement','Endorsements (NonPrem)','ADD') AND NOT (ds_ram_retail_repository.CLASSIFICATIONGROUP ='New Quotes Auto' AND ds_ram_retail_repository.SourceDB<>'AppOne') AND (Primaryagentultipro_Broker NOT IN ('ODT TEST', 'CDT','HSACCT','STURBO')) AND ds_retail_office.OfficeType='Retail' AND ds_retail_office.Country='United States' AND CASE WHEN (ds_ram_retail_repository.CreatedDate>=ds_retail_office.officeopeneddate AND ds_ram_retail_repository.CreatedDate <ds_retail_office.officecloseddate) OR (ds_ram_retail_repository.CreatedDate>=ds_retail_office.officeopeneddate AND ds_retail_office.officecloseddate IS NULL) THEN 'Open' WHEN ds_retail_office.officecode IS NULL THEN NULL ELSE 'Closed' END ='Open') UNION ALL (SELECT DISTINCT AGENTOFFICE AS OFFICECODE ,DATE(STARTDATETIME) AS VINTAGE ,EMPLOYEENUMBER AS PRODUCER FROM {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} ds_pcce_termination_call_agent_session LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key ON CISCO_SKILLTARGETID = AGENTSKILLTARGETID LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office ON ds_pcce_termination_call_agent_session.Agentoffice=ds_retail_office.officecode WHERE JobFamily='SALES' AND ds_retail_office.OfficeType='Retail' AND ds_retail_office.Country='United States' AND CASE WHEN (STARTDATETIME>=ds_retail_office.officeopeneddate AND STARTDATETIME < ds_retail_office.officecloseddate) OR (STARTDATETIME>=ds_retail_office.officeopeneddate AND ds_retail_office.officecloseddate IS NULL) THEN 'Open' WHEN ds_retail_office.officecode IS NULL THEN NULL ELSE 'Closed' END ='Open'))
                                     WHERE DAYOFWEEK(vintage) NOT IN (6,0)
                                     GROUP BY officecode,
                                              vintage
                                   )
                             GROUP BY officecode,
                                      date_trunc('month',vintage)
                           )ds_ram_retail_repository
                        ON v_dlbv_boe_salescalendar_current.asofmonth=ds_ram_retail_repository.asofmonth
                   ) v_dlbv_boe_salescalendar_current
                ON bvstg_comm_au2_store_evaluation.asofmonth=v_dlbv_boe_salescalendar_current.asofmonth
               AND ifnull(bvstg_comm_au2_store_evaluation.officecode,'-')=ifnull(v_dlbv_boe_salescalendar_current.officecode,'-')
