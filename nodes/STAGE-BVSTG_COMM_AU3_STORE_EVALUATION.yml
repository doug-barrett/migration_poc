    sourceMapping:
      - aliases:
          BVSTG_COMM_AU2_STORE_EVALUATION: c0413660-aeef-4b49-9b7a-c9bfe1636b22
          V_DLBV_BOE_SALESCALENDAR_CURRENT: 36274d3e-dc3a-4e9b-b8c8-136b0c7df257
          DS_RAM_RETAIL_REPOSITORY: 39a9b6bb-124a-4925-91e8-c1b9157d7e95
