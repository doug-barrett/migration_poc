  description: "Fact: WarrantyDetail\n\nDAX Measures (for Semantic View):\n  - Total\
    \ Warranties:  count(WarrantyDetail[JobId])\n  - Warranties W/o No Fault:  VAR\
    \ result =     CALCULATE(         COUNT(WarrantyDetail[JobId]),         WarrantyDetail[WarrantyReason]\
