            transform: CASE --WHEN THE CUSTOMER FIELD IS SET AGAINST THE PARENT WORK ORDER --999 IS THE UNKNOWN VALUE   WHEN ISNULL(PARENTDETAILS.CUSTOMERNUMBER,999) <> 999    THEN 'J' + CONVERT(VARCHAR(14),PARENTDETAILS.CUSTOMERNUMBER)   -- NOT YET INVOICED, SO WE WON'T BE ABLE TO FIND A CUSTOMER FOR THIS YET   -- 999 IS NOT A VALID CUSTOMER SO WILL NOT CONNECT TO A DEBTOR RECORD   WHEN SUM(ISNULL(CMREVENUE,0)) = 0 THEN '999'   --251281 IS THE NORTHPOWER ADDRESS NUMBER   --THE UPDATE STATEMENT HAS A QUERY TO EXCLUDE ALL RECORDS WHERE THE EXTERNAL AMOUNT   -- IS GREATER THAN THE INTERNAL AMOUNT   --WHEN THAT HAPPENS, THEN WE WILL GO LOOK FOR THE DEBTOR THAT WAS INVOICED AGAINST THE JOB     ELSE 'J218974' END
