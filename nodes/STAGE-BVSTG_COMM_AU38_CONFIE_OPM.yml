    sourceMapping:
      - aliases:
          BVSTG_COMM_AU34_CONFIE_OPM: 7d5e508b-6b56-4b00-8fa3-7a0e25a99fe3
          BVSTG_COMM_AU33_CONFIE_OPM: bef4bf76-0a8b-4ae7-9131-32f3ad1d9cea
          DS_HR_SALESEMPLOYEESUMMARY: e988cf26-d339-47b8-896c-73c62528e1b6
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU34_CONFIE_OPM
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU33_CONFIE_OPM
          - locationName: EDW
            nodeName: DS_HR_SALESEMPLOYEESUMMARY
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT au34_confie_opm.asofmonth,
                   au34_confie_opm.POLICYSOURCE_DIMENSION,
                   bvstg_comm_au33_confie_opm.Terminated_emp_COE_TJ Terminated_US_Employee,
                   bvstg_comm_au33_confie_opm.Headcount_COR_TJ US_Employee_Count,
                   ds_hr_salesemployeesummary_1.Tenure_LT90 Tenure_Less_Than_90_Days_US_Employee,
                   tres_hierarchyview_1.Terminated_Wining_Culture_TJ_Tress Terminated_Tress_TJ,
                   tres_hierarchyview_1.Headcount_TJ_Tress Headcount_Tress_TJ,
                   tres_hierarchyview_1.Employee_Count_TJ TJ_Total_Employee_Count,
                   tres_hierarchyview_3.TJ_Employee_Count_Ops TJ_Ops_Employee_Count,
                   au12_confie_opm_2.SGA_IT_Total_Revenue Total_Revenue_SGA_IT,
                   bvstg_comm_au26_confie_opm_1.SGA_Operating_Expense Operating_Expense_SGA,
                   bvstg_comm_au33_confie_opm_2.HR_Operating_Expense Operating_Expense_HR,
                   bvstg_comm_au33_confie_opm_2.Active_EOM_US Active_EOM_HR,
                   bvstg_comm_au26_confie_opm_3.IT_Operating_Expense Operating_Expense_IT,
                   bvstg_comm_au26_confie_opm_4.OpExp Consolidated_Operating_Expense,
                   bvstg_comm_au21_confie_opm_2.Rewrite_Policies New_Rewrite_Auto_Sales,
                   au12_confie_opm_3.FEE_REVENUE_OS Fee_Revenue,
                   au12_confie_opm_3.COMMISSION_REVENUE,
                   au12_confie_opm_3.ANCILLARY_PRODUCT_REVENUE_OS Ancillary_Product_Revenue,
                   au12_confie_opm_3.OTHER_REVENUE,
                   au12_confie_opm_3.PREMIUM_FINANCE_REVENUE,
                   au12_confie_opm_3.ADJUSTING_CLAIMS_REVENUE
              FROM ((
                    SELECT asofmonth,
                           POLICYSOURCE_DIMENSION
                      FROM {{ ref('STAGE','BVSTG_COMM_AU34_CONFIE_OPM') }}
                   )au34_confie_opm
              LEFT JOIN (
                    SELECT
                     MONTH AS asofmonth,
                           'Missing/Total' PolicySource_Dimension,
                           Terminated_emp AS Terminated_emp_COE_TJ,
                           ((ifnull(active_eom,0)+ifnull(active_bom,0))/2) AS Headcount_COR_TJ
                      FROM {{ ref('STAGE','BVSTG_COMM_AU33_CONFIE_OPM') }}
                   ) bvstg_comm_au33_confie_opm
                ON au34_confie_opm.asofmonth = bvstg_comm_au33_confie_opm.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = bvstg_comm_au33_confie_opm.PolicySource_Dimension
              LEFT JOIN (
                    SELECT asofmonth,
                           PolicySource_Dimension,
                           Tenure_LT90
                      FROM (
                            SELECT date_trunc('month',to_date(EffectiveDate)) asofmonth,
                                   'Missing/Total' PolicySource_Dimension,
                                   count(DISTINCT uniqueid) Tenure_LT90
                              FROM {{ ref('EDW','DS_HR_SALESEMPLOYEESUMMARY') }}
                             WHERE POINTINTIMESTATUS ='Terminated'
                               AND POINTINTIMETENURE IN ('LT 90','LT 60','LT 45', 'LT 30')
                               AND date_trunc('month',to_date(EffectiveDate))= date_trunc('month',to_date(terminationdate))
                             GROUP BY date_trunc('month',to_date(EffectiveDate)),
                                      PolicySource_Dimension
                           )
                   ) ds_hr_salesemployeesummary_1
                ON au34_confie_opm.asofmonth = ds_hr_salesemployeesummary_1.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = ds_hr_salesemployeesummary_1.PolicySource_Dimension
              LEFT JOIN (SELECT asofmonth,
                   'Missing/Total' PolicySource_Dimension,
                   COUNT (CASE WHEN PointinTimestatus_eom = 'Terminated' THEN EmployeeNumber END) Terminated_Wining_Culture_TJ_Tress,
                   (((ifnull((COUNT (CASE WHEN PointinTimestatus_eom = 'Active' THEN EmployeeNumber END)),0)) + (ifnull((COUNT (CASE WHEN PointinTimestatus_bom = 'Active' THEN EmployeeNumber END)),0)))/2) Headcount_TJ_Tress,
                   COUNT (CASE WHEN PointinTimestatus_eom = 'Active' THEN EmployeeNumber END) Employee_Count_TJ
              FROM (SELECT v_pred_moths.min_Date asofmonth,
                   EmployeeNumber,
                   date_trunc('month', HireDate) HireMonth,
                   date_trunc('month', terminationdate) TerminationMonth,
                   CASE WHEN min_Date = date_trunc('month', terminationdate) THEN 'Terminated'
                        ELSE 'Active'
                         END AS PointInTimeStatus_EOM,
                   CASE WHEN lag(CASE WHEN min_Date = date_trunc('month', terminationdate) THEN 'Terminated' ELSE 'Active' END, 1) OVER (PARTITION BY employeenumber ORDER BY asofmonth) IS NULL AND asofmonth = date_trunc('month',hiredate) THEN 'Inactive'
                        ELSE ifnull(lag(CASE WHEN min_Date = date_trunc('month', terminationdate) THEN 'Terminated' ELSE 'Active' END, 1) OVER (PARTITION BY employeenumber ORDER BY asofmonth), 'Active')
                         END AS PointInTimeStatus_BOM
        name: BVSTG_COMM_AU38_CONFIE_OPM
        noLinkRefs: []
