    sourceMapping:
      - aliases:
          L_LOGINSTATUS_EMPLOYEE: 10c6ec65-90e3-468a-bacf-387f91918a57
          V_S_AP1_LOGINSTATUS_MROC_CURRENT: cef08632-d689-4ebd-9db6-961ad33fd745
          L_LOGINSTATUS_OFFICE: 8eaf9d0f-2014-4477-b6b8-ece0e79de133
          V_PRE_AP1_OFFICE_MROC_CURRENT: 9fca614c-54f1-4c5d-ad2e-ea96636d0128
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: DATA_VAULT
            nodeName: L_LOGINSTATUS_EMPLOYEE
          - locationName: STAGE
            nodeName: V_S_AP1_LOGINSTATUS_MROC_CURRENT
          - locationName: DATA_VAULT
            nodeName: L_LOGINSTATUS_OFFICE
          - locationName: STAGE
            nodeName: V_PRE_AP1_OFFICE_MROC_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','L_LOGINSTATUS_EMPLOYEE') }} l_loginstatus_employee
              JOIN (
                    SELECT a.HK_h_loginstatus,
                           a.userid,
                           a.loggedinofficeid,
                           a.created
                      FROM {{ ref('STAGE','V_S_AP1_LOGINSTATUS_MROC_CURRENT') }} a QUALIFY ROW_NUMBER() OVER (PARTITION BY userid,created ORDER BY created DESC) = 1
                   ) AS v_s_ap1_loginstatus_mroc_current
                ON l_loginstatus_employee.HK_h_loginstatus = v_s_ap1_loginstatus_mroc_current.HK_h_loginstatus
              JOIN {{ ref('DATA_VAULT','L_LOGINSTATUS_OFFICE') }} l_loginstatus_office
                ON l_loginstatus_employee.HK_h_loginstatus = l_loginstatus_office.HK_h_loginstatus
              JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }}
                     WHERE isrowdeleted=0
                   ) AS v_s_ap1_office_mroc_current
                ON l_loginstatus_office.HK_h_office = v_s_ap1_office_mroc_current.HK_h_office
             WHERE (('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,v_s_ap1_loginstatus_mroc_current.created,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}') OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND TO_DATE(v_s_ap1_loginstatus_mroc_current.created) = TO_DATE(CURRENT_DATE())))
        name: BVSTG_AP1_AU0_LOGINSTATUS_MROC_DEDUP
        noLinkRefs: []
