        dependencies:
          - locationName: EDW
            nodeName: DS_INACTIVE_POLICIES
        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_EDW.DS_INACTIVE_POLICIES ds_inactive_policies
             INNER JOIN (
                    SELECT ID,
                           MIN(INSERTEDDATE)StartDate,
                           MAX(INSERTEDDATE)EndDate
                      FROM RETAIL_PROD.SCH_EDW.DS_INACTIVE_POLICIES_EMAIL
                     GROUP BY ID
                   ) ds_inactive_policies_email
                ON ds_inactive_policies.ID = ds_inactive_policies_email.ID
             WHERE DATE(ds_inactive_policies.DSS_UPDATE_TIME) BETWEEN CURRENT_DATE() -3 AND CURRENT_DATE()
               AND ds_inactive_policies.Primary_Agent_Office NOT LIKE 'Z%'
