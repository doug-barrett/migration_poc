        join:
          joinCondition: |-
            EXTENDED
              FROM ((SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('NSA') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('SPLC') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('Missing/Total') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END))) V_PRED_MONTHS --------------------HR Cost per Employee     left join     (select T1.asofmonth ,      'Missing/Total' PolicySource_Dimension,      (T1.HR_num) HR_Operating_Expense,(T2.active_eom) Active_EOM_US      from      (select monthyear asofmonth,OpExp HR_num from {{ ref('STAGE','BVSTG_AU30_CONFIE_OPM') }}      where  sg_description in ('HR_Cost_Numerator')  )T1      inner join      (select month,active_eom from      (select date_trunc('month', effectivedate) Month,      count(distinct case when date_trunc('month', effectivedate)  = date_trunc('month', terminationdate)      and status_eom = 'Terminated' then uniqueid end) Terminated_emp,      count(distinct case when status_eom = 'Active' then uniqueid end) Active_EOM,      count(distinct case when status_bom = 'Active' then uniqueid end) Active_BOM      from      (select uniqueid,      date_trunc('month',to_date(EffectiveDate)) EffectiveDate,      date_trunc('month',to_date(TerminationDate)) TerminationDate,      pointintimestatus Status_EOM,      case when ISNEWHIRE = 'NewHire' then 'Inactive'      else lag(pointintimestatus, 1) over (partition by uniqueid order by effectivedate) end as Status_BOM      from RETAIL_PROD.SCH_EDW.DS_HR_SALESEMPLOYEESUMMARY      qualify row_number() over (partition by uniqueid, effectivedate order by EMPLOYEESTATUSSTARTDATE desc) = 1      ) ds_hr_salesemployeesummary      group by date_trunc('month', effectivedate)      )      )      T2      on T1.asofmonth=T2.month     ) BVSTG_AU30_CONFIE_OPM     on V_PRED_MONTHS.asofmonth = BVSTG_AU30_CONFIE_OPM.asofmonth  and V_PRED_MONTHS.PolicySource_Dimension = BVSTG_AU30_CONFIE_OPM.PolicySource_Dimension          --------------------Total Confie EBITDA Budget     left join     (select monthyear asofmonth,      'Missing/Total' PolicySource_Dimension,      OpExp from {{ ref('STAGE','BVSTG_AU31_CONFIE_OPM') }}      where sg_description= 'Total_Confie_EBITDA_Budget'      union all-------------Extarction of Budget 2021 and 2022 numbers from flat file sent by JH      select asofmonth,      'Missing/Total' PolicySource_Dimension,      Total_Confie_Operating_Expense_Budget from "DATA_LAKE"."BIA_ANALYTICS"."OPM_BUDGET_2021_2022"     ) BVSTG_AU31_CONFIE_OPM     on V_PRED_MONTHS.asofmonth = BVSTG_AU31_CONFIE_OPM.asofmonth and V_PRED_MONTHS.PolicySource_Dimension = BVSTG_AU31_CONFIE_OPM.PolicySource_Dimension          left join     (select ASOFMONTH, POLICYSOURCE_DIMENSION, RETAIN_APP_ONE_ONLY, FINANCIAL_FLEXIBILITY, GAIN, GROW_APP_ONE_ONLY, OPERATIONAL_EXCELLENCE, WINING_CULTURE, YOY_GROWTH, BUDGET_AND_REVENUE,       BUDGET_AND_EBITDA, OTHER_KPIS, RETAIL_SAL
