            transform: CONVERT(DATETIME, --IF THE FINISH TIME IS AFTER MIDNIGHT, ADD A DAY TO THE STARTING DAY  CONVERT(VARCHAR(20),CASE WHEN I_PG_EMPLOYEESHIFTS.ENDTIME >= 1440 THEN DATEADD(DAY,1,I_PG_EMPLOYEESHIFTS.CALENDARDATE) ELSE I_PG_EMPLOYEESHIFTS.CALENDARDATE END,120)  + ' '  --IF THE FINISH TIME IS AFTER MIDNIGHT, WE NEED TO REMOVE THE 24 HOURS  + CONVERT(VARCHAR(10),CASE WHEN I_PG_EMPLOYEESHIFTS.ENDTIME >= 1440 THEN I_PG_EMPLOYEESHIFTS.ENDTIME-1440 ELSE I_PG_EMPLOYEESHIFTS.ENDTIME END/60)  + ':'  + CONVERT(VARCHAR(10),I_PG_EMPLOYEESHIFTS.ENDTIME%60),120)
