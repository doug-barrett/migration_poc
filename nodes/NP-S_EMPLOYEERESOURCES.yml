        name: RESOURCEHOURS
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: fafc27f4-23a1-4757-a393-2d3fa9b0dc11
                stepCounter: 862865b5-f449-4101-8321-875af4ce079d
            transform: CASE --IF PUBLIC HOLIDAY, THEN ASSIGN ALL ROSTERED HOURS TO UNAVAILABLE   WHEN I_PG_HOLIDAYGROUP.HOLIDAYDATE IS NOT NULL    THEN 0   --IF THE EMPLOYEE HAS REQESTED LEAVE THAT COVERS THIS WHOLE DAY OR MULTIPLE DAYS   WHEN I_PG_EMPLLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_EMPLLEAVEREQUEST.ISPARTIALDAY = 0    THEN 0   --JUST IN CASE THEY SOMEHOW MANAGE TO PUT IN MULTIPLE LEAVE REQUESTS FOR MORE HOURS THAN ROSTERED    WHEN I_PG_EMPLLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_EMPLLEAVEREQUEST.UNITSREQUESTED >= I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN 0   WHEN I_PG_EMPLLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_EMPLLEAVEREQUEST.UNITSREQUESTED < I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS - I_PG_EMPLLEAVEREQUEST.UNITSREQUESTED   --IF THE LEAVE HAS NOT COME THROUGH PEOPLE CENTRAL   WHEN I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDLEAVEHOURS >= I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN 0   WHEN I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDLEAVEHOURS < I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS - I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDLEAVEHOURS   --NO LEAVE OR PUBLIC HOLIDAYS   ELSE I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS  END
      - appliedColumnTests: {}
