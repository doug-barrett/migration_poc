        name: UNAVAILABLEHOURS
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 7dbe6d6e-d3a2-428c-9866-fff6cd710373
                stepCounter: 7d7b335a-5357-49de-8da1-20ab38fa8ed1
            transform: CASE --IF PUBLIC HOLIDAY, THEN ASSIGN ALL ROSTERED HOURS TO UNAVAILABLE   WHEN I_PG_HOLIDAYGROUP.HOLIDAYDATE IS NOT NULL    THEN I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS   --IF THE EMPLOYEE HAS REQESTED LEAVE THAT COVERS THIS WHOLE DAY OR MULTIPLE DAYS   WHEN I_PG_EMPLLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_EMPLLEAVEREQUEST.ISPARTIALDAY = 0    THEN I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS   --JUST IN CASE THEY SOMEHOW MANAGE TO PUT IN MULTIPLE LEAVE REQUESTS FOR MORE HOURS THAN ROSTERED    WHEN I_PG_EMPLLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_EMPLLEAVEREQUEST.UNITSREQUESTED >= I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS   WHEN I_PG_EMPLLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_EMPLLEAVEREQUEST.UNITSREQUESTED < I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN I_PG_EMPLLEAVEREQUEST.UNITSREQUESTED   --IF THE LEAVE HAS NOT COME THROUGH PEOPLE CENTRAL   WHEN I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDLEAVEHOURS >= I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS   WHEN I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.EMPLOYEECODE IS NOT NULL AND I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDLEAVEHOURS < I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDLEAVEHOURS   --NO LEAVE OR PUBLIC HOLIDAYS   ELSE 0  END
      - appliedColumnTests: {}
