        name: PAIDHOURSTYPECODE
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: e2a6bd26-3335-44c1-8b98-3aa245bdd2ff
                stepCounter: 862865b5-f449-4101-8321-875af4ce079d
            transform: CASE --PUBLIC HOLIDAY   WHEN I_PG_HOLIDAYGROUP.HOLIDAYDATE IS NOT NULL    THEN '27'   --IF THE EMPLOYEE HAS REQESTED LEAVE THAT COVERS THIS WHOLE DAY OR MULTIPLE DAYS   -- OR MULTIPLE PARTIAL DAY REQUESTS THAT COVER THE WHOLE DAY   WHEN I_PG_EMPLLEAVEREQUEST.EMPLOYEECODE IS NOT NULL     AND (I_PG_EMPLLEAVEREQUEST.ISPARTIALDAY = 0 OR I_PG_EMPLLEAVEREQUEST.UNITSREQUESTED >= I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS)    THEN CASE     --SICK     WHEN I_PG_EMPLLEAVEREQUEST.REASONCODE = 'SICK' THEN '12'     --HOLIDAY PAY     WHEN I_PG_EMPLLEAVEREQUEST.REASONCODE IN ('HOL','LONG','XMAS','ALT') THEN '16'     --OTHER LEAVE     ELSE '14' END   --IF THERE IS NO LEAVE REQUEST, BUT LEAVE HAS BEEN PAID (VIA K2)   WHEN I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDLEAVEHOURS >= I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDHOURSTYPECODE   --PARTIAL LEAVE REQUESTS ARE SET TO CHARGEABLE TIME   ELSE '1'  END
      - appliedColumnTests: {}
        columnReference:
          columnCounter: 67e2d017-1440-45a7-97d6-06e54e44f3e0
          stepCounter: 65daa876-196a-430b-a34d-b9d806a6b262
        config: {}
        dataType: VARCHAR(12)
        defaultValue: ""
        description: For recording a leave type for a partial days leave
        name: PARTIALLEAVETYPE
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: e2a6bd26-3335-44c1-8b98-3aa245bdd2ff
                stepCounter: 862865b5-f449-4101-8321-875af4ce079d
            transform: CASE --NOT A PUBLIC HOLIDAY   WHEN I_PG_HOLIDAYGROUP.HOLIDAYDATE IS NULL   --SOME LEAVE HAS BEEN REQUESTED   AND I_PG_EMPLLEAVEREQUEST.EMPLOYEECODE IS NOT NULL   --ONLY PARTIAL LEAVE HAS BEEN REQUESTED   AND I_PG_EMPLLEAVEREQUEST.UNITSREQUESTED < I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN CASE     --SICK     WHEN I_PG_EMPLLEAVEREQUEST.REASONCODE = 'SICK' THEN '12'     --HOLIDAY PAY     WHEN I_PG_EMPLLEAVEREQUEST.REASONCODE IN ('HOL','LONG','XMAS','ALT') THEN '16'     --OTHER LEAVE     ELSE '14' END   --IF THERE IS NO LEAVE REQUEST, BUT LEAVE HAS BEEN PAID (VIA K2)   WHEN I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDLEAVEHOURS < I_PG_EMPLOYEESHIFTS.ROSTEREDHOURS    THEN I_PG_PAIDLEAVENOTTHROUGHLEAVEREQUEST.PAIDHOURSTYPECODE     --PARTIAL LEAVE REQUESTS ARE SET TO CHARGEABLE TIME   ELSE '1'  END
