      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'F_AuditQuestions') }} "F_AuditQuestions"
          LEFT JOIN {{ ref('GOLD', 'F_HealthAndSafetyInvestigation') }} "F_HealthAndSafetyInvestigation"
            ON F_AUDITQUESTIONS.D_AUDITDETAILS_KEY = F_HEALTHANDSAFETYINVESTIGATION.D_AUDITDETAILS_KEY AND F_AUDITQUESTIONS.D_AUDITQUESTION_KEY = F_HEALTHANDSAFETYINVESTIGATION.D_AUDITQUESTION_KEY AND F_HEALTHANDSAFETYINVESTIGATION.D_OBLIGATION_KEY <> -1
          LEFT JOIN {{ ref('GOLD', 'D_BusinessUnit') }} "D_BusinessUnit"
            ON COALESCE(F_HEALTHANDSAFETYINVESTIGATION.D_BUSINESSUNIT_KEY, F_AUDITQUESTIONS.D_ALTERNATEBUSINESSUNIT_KEY, F_AUDITQUESTIONS.D_BUSINESSUNIT_KEY) = D_BUSINESSUNIT.D_BUSINESSUNIT_KEY
          LEFT JOIN {{ ref('BRONZE', 'I_JDE_BusinessUnitMaster') }} "I_JDE_BusinessUnitMaster"
          --only include questions that are applicable to Legal Obligations
          WHERE F_AUDITQUESTIONS.D_OBLIGATION_KEY <> -1    GROUP BY
            D_OBLIGATION.OBLIGATIONCODE
            --, D_BUSINESSUNIT.BUSINESSUNITCODE
            , I_JDE_BUSINESSUNITMASTER.BUSINESSUNITCODE
            , I_JDE_BUSINESSUNITMASTER.BUDGETHOLDEREMPLOYEECODE
            , D_OBLIGATIONVERIFICATIONTYPE.VERIFICATIONTYPECODE
            , D_OBLIGATIONLOCATION.OBLIGATIONLOCATIONCODE
      name: I_ObligationReference_Audit
      noLinkRefs: []
