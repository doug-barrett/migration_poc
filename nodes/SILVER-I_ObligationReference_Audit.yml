    - appliedColumnTests: {}
      columnReference:
        columnCounter: bd511905-f1bf-5957-ad6d-bea46fe3e38f
        stepCounter: 31924e3e-eaa8-5074-ad88-729b119905f8
      config: {}
      dataType: NUMBER(15,2)
      description: Formula as agreed by the business and documented in the Reference
        document
      name: ComplianceRate
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN SUM(F_HEALTHANDSAFETYINVESTIGATION.OPENINVESTIGATIONCOUNT)
          >= 1   THEN 0.00     WHEN     SUM(F_AUDITQUESTIONS.NOTANSWERED + F_AUDITQUESTIONS.NOTAPPLICABLE)
          > 0     AND SUM(F_AUDITQUESTIONS.COMPLIANT) = 0     AND SUM(F_AUDITQUESTIONS.OTHERANSWER)
          = 0    AND SUM(F_AUDITQUESTIONS.NONCOMPLIANT) = 0   THEN 0.00     WHEN    SUM(F_AUDITQUESTIONS.NOTANSWERED)
          = 0     AND SUM(F_AUDITQUESTIONS.COMPLIANT) > 0     AND SUM(F_AUDITQUESTIONS.OTHERANSWER)
          = 0    AND SUM(F_AUDITQUESTIONS.NONCOMPLIANT) = 0    AND SUM(F_HEALTHANDSAFETYINVESTIGATION.OPENINVESTIGATIONCOUNT)
          = 0    THEN 1.00     ELSE CAST(SUM(  F_AUDITQUESTIONS.COMPLIANT +  -- ADD
          ANY RECTIFIED NON-COMPLIANT ITEMS INTO THE COMPLIANT NUMERATOR COUNT  CASE
          WHEN COALESCE(F_HEALTHANDSAFETYINVESTIGATION.CLOSEDINVESTIGATIONCOUNT,0)
          = F_AUDITQUESTIONS.NONCOMPLIANT THEN F_AUDITQUESTIONS.NONCOMPLIANT ELSE
          0 END  ) AS DECIMAL(15,2)) / CAST(SUM(F_AUDITQUESTIONS.COMPLIANT+F_AUDITQUESTIONS.NONCOMPLIANT+F_AUDITQUESTIONS.OTHERANSWER)
          AS DECIMAL(15,2))   --ELSE 0  END
