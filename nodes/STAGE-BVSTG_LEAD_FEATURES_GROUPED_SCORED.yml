    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_LEAD_FEATURES_GROUPED
        join:
          joinCondition: |-
            FROM "RETAIL_PROD"."SCH_EDW"."DS_LEAD_FEATURES_GROUPED" ds_lead_features_grouped
             INNER JOIN (
                    SELECT ds_dialer_telesales_score.LAST_LEADID,
                           ds_dialer_telesales_score.INSERTEDDATE,
                           ds_dialer_telesales_score.GNL_SCORE,
                           ds_dialer_telesales_score_c.No_Uploaded
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_DIALER_TELESALES_SCORE" ds_dialer_telesales_score
                     INNER JOIN (
                            SELECT LAST_LEADID,
                                   COUNT(1)No_Uploaded
                              FROM "RETAIL_PROD"."SCH_EDW"."DS_DIALER_TELESALES_SCORE"
                             WHERE InsertedDate >='2023-05-01'
                             GROUP BY LAST_LEADID
                           )ds_dialer_telesales_score_c
                        ON ds_dialer_telesales_score_c.LAST_LEADID = ds_dialer_telesales_score.LAST_LEADID
                     INNER JOIN "RETAIL_PROD"."SCH_EDW"."DS_TELESALES_DIALER_RESULT" ds_telesales_dialer_result
                        ON ds_telesales_dialer_result.CustomerID = ds_dialer_telesales_score.C_CustomerID
                       AND ds_telesales_dialer_result.InsertedDate = ds_dialer_telesales_score.InsertedDate
                     WHERE ds_dialer_telesales_score.InsertedDate >='2023-05-01' QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_dialer_telesales_score.LAST_LEADID ORDER BY ds_dialer_telesales_score.GNL_SCORE DESC)=1
                   )ds_dialer_telesales_score
                ON ds_dialer_telesales_score.LAST_LEADID = ds_lead_features_grouped.L_LEADID
        name: BVSTG_LEAD_FEATURES_GROUPED_SCORED
        noLinkRefs: []
