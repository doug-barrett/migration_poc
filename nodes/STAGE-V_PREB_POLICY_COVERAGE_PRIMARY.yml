          V_PREB_POLICY_COVERAGE_PRIMARY: 14c9e975-b30e-44fa-a6b1-9141ed6d914d
          V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT: 1d80fae9-8a37-4017-83c0-64e9cd910856
          V_S_AP1_POLICYVEHICLE_MROC_CURRENT: 35b9a1d7-3392-4409-9115-61a258435c93
          V_S_AP1_POLICYVERSION_MROC_CURRENT: 2116f500-76bb-43c1-a269-a89379c9e9c6
          V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT: 47785ee6-0a02-4712-9368-acaf696e9fdb
          V_S_AMS_COVERAGE_MROC_CURRENT: 9acd8c24-20e9-42b2-8e35-53a600dcfe04
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_POLICY_COVERAGE_PRIMARY') }} AS SELECT cast(a.policyid AS varchar(50)) policyid,
                   CAST(IFNULL(a.deductible,0) AS integer) deductible,
                   CAST(IFNULL(a.limitperperson,0) AS integer) limitperperson,
                   CAST(IFNULL(a.limitperaccident,0) AS integer) limitperaccident,
                   CAST(IFNULL(a.limittotal,0) AS integer) limittotal,
                   CASE WHEN b.hasCOMP>0 THEN 1
                        ELSE 0
                         END hasCOMP,
                   CASE WHEN c.hasColl>0 THEN 1
                        ELSE 0
                         END hasCOLL,
                   CASE WHEN d.hasLIAB>0 THEN 1
                        ELSE 0
                         END hasLIAB,
                   CASE WHEN e.hasUM>0 THEN 1
                        ELSE 0
                         END hasUM
              FROM (
                    SELECT e.policyid,
                           max(IFNULL(b.deductible,0)) deductible,
                           max(IFNULL(b.limitperperson,0)) limitperperson,
                           max(IFNULL(b.limitperaccident,0)) limitperaccident,
                           max(IFNULL(b.limittotal,0)) limittotal
                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }} b,
                           {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }} d,
                           {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }} e
                     WHERE b.policyvehicleid=d.policyvehicleid
                       AND d.policyversionid=e.policyversionid
                       AND b.isrowdeleted=0
                       AND d.isrowdeleted=0
                       AND e.isrowdeleted=0
                     GROUP BY e.policyid
                   ) a
              LEFT JOIN -- Comprehensive
            (
                    SELECT e.policyid,
                           count(1) hasCOMP
                      FROM {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }} a,
                           {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }} b,
                           {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }} d,
                           {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }} e
                     WHERE b.mastercoveragetypeid=a.mastercoveragetypeid
                       AND b.policyvehicleid=d.policyvehicleid
                       AND d.policyversionid=e.policyversionid
                       AND coveragetypecode='COMP'
                       AND a.isrowdeleted=0
                       AND b.isrowdeleted=0
                       AND d.isrowdeleted=0
                       AND e.isrowdeleted=0
                     GROUP BY e.policyid
                   ) b
                ON a.policyid=b.policyid
              LEFT JOIN -- Collision
            (
                    SELECT e.policyid,
                           count(1) hasColl
                      FROM {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }} a,
                           {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }} b,
                           {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }} d,
                           {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }} e
                     WHERE b.mastercoveragetypeid=a.mastercoveragetypeid
                       AND b.policyvehicleid=d.policyvehicleid
                       AND d.policyversionid=e.policyversionid
                       AND coveragetypecode='COLL'
                       AND a.isrowdeleted=0
                       AND b.isrowdeleted=0
                       AND d.isrowdeleted=0
                       AND e.isrowdeleted=0
                     GROUP BY e.policyid
                   ) c
                ON a.policyid=c.policyid
              LEFT JOIN -- Liability
            (
                    SELECT e.policyid,
                           count(1) hasLIAB
                      FROM {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }} a,
                           {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }} b,
                           {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }} d,
                           {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }} e
                     WHERE b.mastercoveragetypeid=a.mastercoveragetypeid
                       AND b.policyvehicleid=d.policyvehicleid
                       AND d.policyversionid=e.policyversionid
                       AND coveragetypecode IN ('PD','BI','PIP')
                       AND a.isrowdeleted=0
                       AND b.isrowdeleted=0
                       AND d.isrowdeleted=0
                       AND e.isrowdeleted=0
                     GROUP BY e.policyid
                   ) d
                ON a.policyid=d.policyid
              LEFT JOIN -- Uninsured Mortorist
            (
                    SELECT e.policyid,
                           count(1) hasUM
                      FROM {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }} a,
                           {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }} b,
                           {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }} d,
                           {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }} e
                     WHERE b.mastercoveragetypeid=a.mastercoveragetypeid
                       AND b.policyvehicleid=d.policyvehicleid
                       AND d.policyversionid=e.policyversionid
                       AND (coveragetypecode LIKE 'UM%' OR coveragetypecode LIKE 'UI%')
                       AND a.isrowdeleted=0
                       AND b.isrowdeleted=0
                       AND d.isrowdeleted=0
                       AND e.isrowdeleted=0
                     GROUP BY e.policyid
                   ) e
                ON a.policyid=e.policyid
            UNION ALL SELECT a.polid policyid,
                   CAST(IFNULL(a.deductible,0) AS integer) deductible,
                   CAST(IFNULL(a.limitperperson,0) AS integer) limitperperson,
                   CAST(IFNULL(a.limitperaccident,0) AS integer) limitperaccident,
                   CAST(IFNULL(a.limittotal,0) AS integer) limittotal,
                   CASE WHEN c.hasCOMP>0 THEN 1
                        ELSE 0
                         END hasCOMP,
                   CASE WHEN e.hasColl>0 THEN 1
                        ELSE 0
                         END hasCOLL,
                   CASE WHEN b.hasLIAB>0 THEN 1
                        ELSE 0
                         END hasLIAB,
                   CASE WHEN d.hasUM>0 THEN 1
                        ELSE 0
                         END hasUM
              FROM (
                    SELECT polid,
                           MAX(IFNULL(deduct1,0)) deductible,
                           MAX(IFNULL(limit1,0)) limitperperson,
                           MAX(IFNULL(limit2,0)) limitperaccident,
                           MAX(IFNULL(limit1,0)+IFNULL(limit2,0)) limittotal
                      FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} v_s_ams_coverage_mroc_current
                     GROUP BY polid
                   ) a
              LEFT JOIN (
                    SELECT polid,
                           count(1) hasLIAB
                      FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} v_s_ams_coverage_mroc_current
                     WHERE UPPER(COVERAGECODE) like 'PERSONAL%'
                        OR UPPER(COVERAGECODE) like 'PROPERTY%'
                        OR UPPER(COVERAGECODE) like 'MEDICAL%'
                        OR UPPER(COVERAGECODE) like 'BODILY%'
                        OR UPPER(COVERAGECODE) like 'PIP%'
                     GROUP BY polid
                   ) b
                ON a.polid=b.polid
              LEFT JOIN (
                    SELECT polid,
                           count(1) hasCOMP
                      FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} v_s_ams_coverage_mroc_current
                     WHERE UPPER(COVERAGECODE) like 'COMPREHENSIVE%'
                     GROUP BY polid
                   ) c
                ON a.polid=c.polid
              LEFT JOIN (
                    SELECT polid,
                           count(1) hasUM
                      FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} v_s_ams_coverage_mroc_current
                     WHERE UPPER(COVERAGECODE) like 'UNINSURED%'
                        OR UPPER(COVERAGECODE) like 'UNDERINSURED%'
                     GROUP BY polid
                   ) d
                ON a.polid=d.polid
              LEFT JOIN (
                    SELECT polid,
                           count(1) hasCOLL
                      FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} v_s_ams_coverage_mroc_current
                     WHERE UPPER(COVERAGECODE) like 'COLLISION%'
                     GROUP BY polid
                   ) e
                ON a.polid=e.polid
