        join:
          joinCondition: |-
            FROM {{ ref('NP','I_VECTORSTATUS_FCOM') }}
              LEFT OUTER JOIN {{ ref('NP','I_VECTORSTATUS_QCOM') }}
                ON I_VECTORSTATUS_FCOM.WORKORDERNUMBER = I_VECTORSTATUS_QCOM.WORKORDERNUMBER
               AND I_VECTORSTATUS_QCOM.ROWORDERING = 1
              LEFT JOIN D_DATE DATERANGE
                ON DATERANGE.CALENDARDATE BETWEEN CASE WHEN I_VECTORSTATUS_QCOM.STATUSCHANGEDATETIME IS NULL THEN GETDATE()
                        ELSE CONVERT(DATE, I_VECTORSTATUS_FCOM.STATUSCHANGEBUSINESSDATE)
                         END AND COALESCE(I_VECTORSTATUS_QCOM.STATUSCHANGEDATETIME, DUEDATE)
             WHERE I_VECTORSTATUS_FCOM.ROWORDERING = 1
             GROUP BY I_VECTORSTATUS_FCOM.NOTIFICATIONID ,
                      I_VECTORSTATUS_FCOM.WORKORDERNUMBER ,
                      I_VECTORSTATUS_QCOM.WORKORDERNUMBER ,
