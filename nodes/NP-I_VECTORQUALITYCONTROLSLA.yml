            transform: CASE --GET THE NUMBER OF DAYS BETWEEN DUE DATE AND FCOM STATUS    WHEN MIN(I_VECTORSTATUS_QCOM.STATUSCHANGEDATETIME) IS NULL AND     MIN(DUEDATE) > GETDATE() THEN DATEDIFF(MINUTE, GETDATE(), MIN(DUEDATE))     --REDUCE BY WEEKENDS AND PUBLICHOLIDAYS     - SUM(CASE      WHEN DATERANGE.WEEKDAYFLAG = 'N' OR       DATERANGE.NZPUBLICHOLIDAYFLAG = 'Y' THEN 1440      ELSE 0     END)    ELSE 0   END
