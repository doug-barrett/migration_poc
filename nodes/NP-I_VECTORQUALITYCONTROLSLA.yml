            transform: |-
              CASE WHEN I_VECTORSTATUS_FCOM.SALESTYPECODE = '210'
                 AND --PM AND 5 DAYS     DATEDIFF(MINUTE, MIN(I_VECTORSTATUS_FCOM.STATUSCHANGEBUSINESSDATE), MIN(I_VECTORSTATUS_QCOM.STATUSCHANGEBUSINESSDATE)) - (SUM(CASE      WHEN DATERANGE.WEEKDAYFLAG = 'N' OR       DATERANGE.NZPUBLICHOLIDAYFLAG = 'Y' THEN 1440      ELSE 0     END)) <= 7200 THEN 1    WHEN I_VECTORSTATUS_FCOM.SALESTYPECODE = '205' AND -- CM AND 10 DAYS     DATEDIFF(MINUTE, MIN(I_VECTORSTATUS_FCOM.STATUSCHANGEBUSINESSDATE), MIN(I_VECTORSTATUS_QCOM.STATUSCHANGEBUSINESSDATE)) - (SUM(CASE      WHEN DATERANGE.WEEKDAYFLAG = 'N' OR       DATERANGE.NZPUBLICHOLIDAYFLAG = 'Y' THEN 1440      ELSE 0     END)) <= 14400 THEN 1      WHEN I_VECTORSTATUS_FCOM.SALESTYPECODE = '315' AND -- AR AND 15 DAYS     DATEDIFF(MINUTE, MIN(I_VECTORSTATUS_FCOM.STATUSCHANGEBUSINESSDATE), MIN(I_VECTORSTATUS_QCOM.STATUSCHANGEBUSINESSDATE)) - (SUM(CASE      WHEN DATERANGE.WEEKDAYFLAG = 'N' OR       DATERANGE.NZPUBLICHOLIDAYFLAG = 'Y' THEN 1440      ELSE 0     END)) <= 21600 THEN 1    ELSE 0   END
      - appliedColumnTests: {}
