          - locationName: STAGE
            nodeName: BVSTG_COMM_1AU7_POLICY_PREMIUM_ALLSOURCES
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT *,
                   max(currentpremium_grp2) OVER (PARTITION BY PolicyNumberFormatted, carrier, grp3 ORDER BY asofmonth ROWS UNBOUNDED PRECEDING) AS grp3_cp,
                   min(currentpremium_grp2) OVER (PARTITION BY PolicyNumberFormatted, carrier, grp3_desc ORDER BY asofmonth DESC ROWS UNBOUNDED PRECEDING) AS grp3_desc_cp
              FROM ( SELECT *,
                   max(CASE WHEN currentpremium_grp2 IS NOT NULL THEN asofmonth END) OVER (PARTITION BY PolicyNumberFormatted, carrier ORDER BY asofmonth ROWS UNBOUNDED PRECEDING) AS grp3,
                   min(CASE WHEN currentpremium_grp2 IS NOT NULL THEN asofmonth END) OVER (PARTITION BY PolicyNumberFormatted, carrier ORDER BY asofmonth DESC ROWS UNBOUNDED PRECEDING) AS grp3_desc
              FROM ( SELECT *,
                   ifnull(currentpremium, writtenpremium_grp2) AS currentpremium_grp2
              FROM ( SELECT *,
                   CASE WHEN writtenpremium IS NULL AND (isnewbusinessmonth = 1 OR isrenewalmonth = 1) THEN asofmonth
                        ELSE grp1
                         END AS grp2,
                   CASE WHEN writtenpremium IS NOT NULL AND (isnewbusinessmonth = 0 AND isrenewalmonth = 0) THEN NULL
                        WHEN writtenpremium IS NULL AND (isnewbusinessmonth = 1 OR isrenewalmonth = 1)      THEN ifnull(grp1_wp, ifnull(grp1_desc_wp, nbs_wp))
                        ELSE writtenpremium
                         END AS writtenpremium_grp2
              FROM ( SELECT *,
                   max(writtenpremium) OVER (PARTITION BY PolicyNumberFormatted, carrier, grp1 ORDER BY asofmonth ROWS UNBOUNDED PRECEDING) AS grp1_wp,
                   min(writtenpremium) OVER (PARTITION BY PolicyNumberFormatted, carrier, grp1_desc ORDER BY asofmonth DESC ROWS UNBOUNDED PRECEDING) AS grp1_desc_wp
              FROM ( SELECT *,
                   max(CASE WHEN writtenpremium IS NOT NULL THEN asofmonth END) OVER (PARTITION BY PolicyNumberFormatted, carrier ORDER BY asofmonth ROWS UNBOUNDED PRECEDING) AS grp1,
                   min(CASE WHEN writtenpremium IS NOT NULL THEN asofmonth END) OVER (PARTITION BY PolicyNumberFormatted, carrier ORDER BY asofmonth DESC ROWS UNBOUNDED PRECEDING) AS grp1_desc
              FROM ( SELECT DISTINCT bvstg_comm_au3_policy_premium_allsources.policynumberformatted,
                   bvstg_comm_au3_policy_premium_allsources.carrier,
                   bvstg_comm_au3_policy_premium_allsources.policynumberformatted_old,
                   bvstg_comm_au3_policy_premium_allsources.carrier_old,
                   bvstg_comm_au3_policy_premium_allsources.term,
                   bvstg_comm_au3_policy_premium_allsources.isnewbusinessmonth,
                   bvstg_comm_au3_policy_premium_allsources.isrenewalmonth,
                   bvstg_comm_au3_policy_premium_allsources.newbusinesspolicyflag,
                   bvstg_comm_au3_policy_premium_allsources.asofmonth,
                   bvstg_comm_au3_policy_premium_allsources.paidtype,
                   bvstg_comm_au3_policy_premium_allsources.nbs_wp,
                   ifnull(bvstg_comm_au3_policy_premium_allsources.WrittenPremium, sum(bvstg_comm_au2_policy_status_extract_cdt.nbs_rwl_premium) OVER (PARTITION BY bvstg_comm_au3_policy_premium_allsources.policynumberformatted, bvstg_comm_au3_policy_premium_allsources.carrier, bvstg_comm_au3_policy_premium_allsources.asofmonth)) AS WrittenPremium,
                   bvstg_comm_au3_policy_premium_allsources.CurrentPremium
              FROM (
                    SELECT *
                      FROM {{ ref('STAGE','BVSTG_COMM_0AU7_POLICY_PREMIUM_ALLSOURCES') }}
                   ) bvstg_comm_au3_policy_premium_allsources
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','BVSTG_COMM_1AU7_POLICY_PREMIUM_ALLSOURCES') }}
                   ) bvstg_comm_au2_policy_status_extract_cdt
                ON bvstg_comm_au3_policy_premium_allsources.policy
        name: BVSTG_COMM_AU7_POLICY_PREMIUM_ALLSOURCES
        noLinkRefs: []
