    sourceMapping:
      - aliases:
          DS_POLICYSUMMARY_RENEWALS: ad171602-1e44-4fba-bf5b-dc1b90e44353
          DS_BVSTG_AP1_PAYMENT: fc816590-8172-439c-866d-1ddfd83bcfec
          DS_BVSTG_AP1_TRANSACTIONITEM: 046532cf-734e-4340-b2e2-9aed7c724d3d
          BVSTG_CUSTOMER_TO_REFRESH: 90b8ce37-bcd1-4ba2-bda7-cfcf723b20ac
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_PAYMENT
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_RENEWALS
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTIONITEM
          - locationName: STAGE
            nodeName: BVSTG_CUSTOMER_TO_REFRESH
        join:
          joinCondition: |-
            FROM (
                    SELECT ds_policysummary_renewals.ID,
                           DS_BVSTG_AP1_PAYMENT.TRANSACTIONID,
                           To_DATE(DS_BVSTG_AP1_PAYMENT.CREATED_TRANSACTION) AS PAYMENT_CREATED,
                           SUM(DS_BVSTG_AP1_PAYMENT.PaymentAmount) AS PAYMENT_AMOUNT
                      FROM {{ ref('EDW','DS_POLICYSUMMARY_RENEWALS') }} ds_policysummary_renewals
                     INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_PAYMENT') }} DS_BVSTG_AP1_PAYMENT
                        ON TO_VARCHAR(ds_policysummary_renewals.TransactionID) = TO_VARCHAR(DS_BVSTG_AP1_PAYMENT.TRANSACTIONID)
                     WHERE DS_BVSTG_AP1_PAYMENT.ISNSF = 0
                       AND DS_BVSTG_AP1_PAYMENT.ISRECEIVED = 1
                       AND DS_BVSTG_AP1_PAYMENT.ISVOID_PAYMENT = 0
                       AND DS_BVSTG_AP1_PAYMENT.ISROWDELETED_PAYMENT = 0
                       AND DS_BVSTG_AP1_PAYMENT.ISROWDELETED_TRANSACTION = 0
                       AND To_Date(DS_BVSTG_AP1_PAYMENT.CREATED_PAYMENT) = To_Date(DS_BVSTG_AP1_PAYMENT.CREATED_TRANSACTION)
                       AND ds_policysummary_renewals.SourceDB= 'AppOne'
                     GROUP BY ds_policysummary_renewals.ID,
                              DS_BVSTG_AP1_PAYMENT.TRANSACTIONID,
                              To_DATE(DS_BVSTG_AP1_PAYMENT.CREATED_TRANSACTION)
                   ) DS_BVSTG_AP1_PAYMENT
             INNER JOIN (
                    SELECT ds_policysummary_renewals.ID,
                           DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONID,
                           To_Date(DS_BVSTG_AP1_TRANSACTIONITEM.CREATED) AS TRANSACTIONITEM_CREATED,
                           SUM(DS_BVSTG_AP1_TRANSACTIONITEM.AMOUNT) AS TRANSACTIONITEMAMOUNT
                      FROM {{ ref('EDW','DS_POLICYSUMMARY_RENEWALS') }} ds_policysummary_renewals
                     INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONITEM') }} DS_BVSTG_AP1_TRANSACTIONITEM
                        ON TO_VARCHAR(ds_policysummary_renewals.TransactionID) = TO_VARCHAR(DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONID)
                       AND To_Date(DS_BVSTG_AP1_TRANSACTIONITEM.CREATED) = To_Date(DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONCREATED)
                       AND DS_BVSTG_AP1_TRANSACTIONITEM.ISVOID = 0
                     INNER JOIN (
                            SELECT DISTINCT customerid,
                                   SourceDB
                              FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                           ) bvstg_customer_to_refresh
                        ON TO_CHAR(bvstg_customer_to_refresh.customerid) = TO_CHAR(ds_policysummary_renewals.customerid)
                     WHERE ds_policysummary_renewals.SourceDB= 'AppOne'
                     GROUP BY ds_policysummary_renewals.ID,
                              DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONID ,
                              To_Date(DS_BVSTG_AP1_TRANSACTIONITEM.CREATED)
                   ) DS_BVSTG_AP1_TRANSACTIONITEM
                ON DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONID = DS_BVSTG_AP1_PAYMENT.TRANSACTIONID
               AND DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONITEM_CREATED = DS_BVSTG_AP1_PAYMENT.PAYMENT_CREATED
