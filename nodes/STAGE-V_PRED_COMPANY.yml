          V_S_AMS_COMPANY_MROC_CURRENT: 712dc1c0-0e80-49bb-ab77-2791b4f7683f
          V_S_AP1_MASTERCARRIER_MROC_CURRENT: 06cbe835-21cb-4312-8098-c00a3325e583
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PRED_COMPANY') }} AS SELECT MD5(CONCAT(IFNULL(cocode,'NOTAMS'),'_',IFNULL(mastercarrierid,0),'_',name)) companyid,
                   UPPER(trim(name)) name,
                   cocode,
                   cast(mastercarrierid AS varchar(50)) mastercarrierid
              FROM {{ ref('STAGE','V_S_AMS_COMPANY_MROC_CURRENT') }} a,
                   {{ ref('STAGE','V_S_AP1_MASTERCARRIER_MROC_CURRENT') }} b
             WHERE UPPER(trim(a.name))=upper(trim(b.carriername))
               AND b.isrowdeleted=0
             UNION SELECT MD5(CONCAT(cocode,'_',name)) companyid,
                   UPPER(trim(name)),
                   cocode,
                   NULL
              FROM {{ ref('STAGE','V_S_AMS_COMPANY_MROC_CURRENT') }} a
             WHERE UPPER(trim(a.name)) NOT IN (
                    SELECT upper(trim(b.carriername))
                      FROM (
                            SELECT *
                              FROM {{ ref('STAGE','V_S_AP1_MASTERCARRIER_MROC_CURRENT') }}
                             WHERE isrowdeleted=0
                           ) b
                   )
             UNION SELECT MD5(CONCAT(mastercarrierid,'_',carriername)) companyid,
                   UPPER(trim(carriername)),
                   NULL,
                   cast(mastercarrierid AS varchar(50)) mastercarrierid
              FROM {{ ref('STAGE','V_S_AP1_MASTERCARRIER_MROC_CURRENT') }} b
             WHERE UPPER(trim(b.carriername)) NOT IN (
                    SELECT upper(trim(name))
                      FROM {{ ref('STAGE','V_S_AMS_COMPANY_MROC_CURRENT') }}
                   )
        dependencies:
          - locationName: STAGE
            nodeName: V_S_AMS_COMPANY_MROC_CURRENT
          - locationName: STAGE
