          LEFT JOIN {{ ref(''BRONZE'', ''CP_PRODUCT_CONVERT'') }} lkp_cp_product_convert ON lkp_cp_product_convert.TABLE_CODE = RTRIM(cp_dqcp1.PC1_BASIC_PLAN_CODE) AND lkp_cp_product_convert.ANNUITY_TYPE_CODE = cp_dqcp1.QC1_ANNUITY_TYPE_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT'') }} lkp_dw_product ON lkp_dw_product.PRODUCT_CODE = (CASE WHEN ((lkp_cp_product_convert.PRODUCT_CODE) IS NULL) THEN RTRIM(cp_dqcp1.PC1_BASIC_PLAN_CODE) ELSE (lkp_cp_product_convert.PRODUCT_CODE) END) AND lkp_dw_product.CLASS_OF_BUSN_CODE = cp_dqcp1.PC1_CLASS_OF_BUSINESS AND lkp_dw_product.PRODUCT_SYSTEM_CODE = ''CP''

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_FEE_TYPE'') }} lkp_ref360_fee_type ON lkp_ref360_fee_type.CODE = ''CP-STDPOL''

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_FEE_TYPE'') }} lkp_ref360_fee_type_2 ON lkp_ref360_fee_type_2.CODE = ''CP-SPLPOL''

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_STATUS'') }} lkp_ref360_status ON lkp_ref360_status.CODE = LTRIM(RTRIM((CASE WHEN CASE WHEN (cp_dqcp1.PC1_POLICY_FEE_AMT IS NULL) THEN 0 ELSE cp_dqcp1.PC1_POLICY_FEE_AMT END<>0 THEN ''A'' ELSE ''C'' END)))

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_PAYMENT_METHOD'') }} lkp_ref360_payment_method ON lkp_ref360_payment_method.CODE = LTRIM(RTRIM(cp_dqcp1.PC1_METHOD_OF_PAYMENT))

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_BRANCH_CODE'') }} lkp_ref360_branch_code ON lkp_ref360_branch_code.CODE = LTRIM(RTRIM(cp_dqcp1.PC1_BRANCH_CODE))

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_CLASS_OF_BUSINESS'') }} lkp_ref360_class_of_business ON lkp_ref360_class_of_business.CODE = LTRIM(RTRIM(cp_dqcp1.PC1_CLASS_OF_BUSINESS))

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_STATUS'') }} lkp_ref360_status_2 ON lkp_ref360_status_2.CODE = LTRIM(RTRIM(cp_dqcp1.PC1_STATUS_CODE))

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_REGISTER'') }} lkp_ref360_register ON lkp_ref360_register.CODE = LTRIM(RTRIM(cp_dqcp1.PC1_REGISTER_CODE))

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_RISK_COMMISSION_TYPE'') }} lkp_ref360_risk_commission_type ON lkp_ref360_risk_commission_type.CODE = LTRIM(RTRIM(cp_dqcp1.PC1_COMM_REGIME_TYPE))

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_TFN_HELD'') }} lkp_ref360_tfn_held ON lkp_ref360_tfn_held.CODE = LTRIM(RTRIM(cp_dqcp1.pc1_tfn_ind))

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_COUNTRY_CODE'') }} lkp_ref360_country_code ON lkp_ref360_country_code.CODE = LTRIM(RTRIM((CASE WHEN cp_dqcp1.PC1_BRANCH_CODE=''3'' THEN ''NZL'' ELSE ''AUS'' END)))

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_LODGEMENT_METHOD'') }} lkp_ref360_lodgement_method ON lkp_ref360_lodgement_method.CODE = LTRIM(RTRIM(cp_dqcp1.PC1_PS_TYPE))'
