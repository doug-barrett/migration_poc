    sourceMapping:
      - aliases:
          V_PREB_CUTOFFPOLICY_SUMMARY_DAILY_V2: e508a831-5427-49f1-8f35-753238626ea4
          BVSTG_DAYS_TO_REFRESH: 9e80be6c-1cc7-42ec-83ad-db17f85860bf
          DS_POLICYSUMMARY_V2: 9a05931f-0fe2-4275-8b38-8e88eb9c6968
          BVSTG_CUSTOMER_TO_REFRESH: 90b8ce37-bcd1-4ba2-bda7-cfcf723b20ac
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_CUTOFFPOLICY_SUMMARY_DAILY_V2') }} AS SELECT MIN(bvstg_days_to_refresh.cal_Month) AS cal_Month ,
                   MIN(bvstg_days_to_refresh.cal_Month_no) AS cal_Month_no ,
                   MIN(bvstg_days_to_refresh.cal_year) AS cal_year ,
                   MIN(bvstg_days_to_refresh.Min_Date) AS StartMonthDate ,
                   bvstg_days_to_refresh.Max_Date AS CutoffDate ,
                   ds_policysummary_v2.Policyid ,
                   MAX(ds_policysummary_v2.wasmigrated) wasmigrated ,
                   MIN(ds_policysummary_v2.PolicyNumber) AS PolicyNumber ,
                   MAX(PolicyStatus) AS PolicyStatus ,
                   MIN(ds_policysummary_v2.StartDate) AS StartDate ,
                   CASE WHEN SUM(CASE WHEN ds_policysummary_v2.EndDate IS NULL THEN 1 ELSE 0 END) > 0 THEN NULL
                        ELSE MAX(EndDate)
                         END EndDate ,
                   ds_policysummary_v2.SourceDB ,
                   MAX(ds_policysummary_v2.Status_Standard) AS Status_Standard ,
                   SUM(CASE WHEN ds_policysummary_v2.graceperiod_startdate <= bvstg_days_to_refresh.max_date AND ds_policysummary_v2.graceperiod_enddate >= bvstg_days_to_refresh.min_date THEN 1 ELSE 0 END) AS grace_period
              FROM {{ ref('STAGE','BVSTG_DAYS_TO_REFRESH') }} bvstg_days_to_refresh
             INNER JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
                ON (IFNULL(ds_policysummary_v2.enddate,CURRENT_DATE()) >= bvstg_days_to_refresh.min_date AND ds_policysummary_v2.startdate<= bvstg_days_to_refresh.max_date)
                OR (ds_policysummary_v2.graceperiod_startdate <= bvstg_days_to_refresh.max_date AND ds_policysummary_v2.graceperiod_enddate >= bvstg_days_to_refresh.min_date)
             INNER JOIN (
                    SELECT DISTINCT customerid,
                           sourcedb
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                   ) bvstg_customer_to_refresh
                ON IFNULL(bvstg_customer_to_refresh.customerid,'') = IFNULL(ds_policysummary_v2.customerid,'')
               AND bvstg_customer_to_refresh.sourcedb = ds_policysummary_v2.sourcedb
             GROUP BY bvstg_days_to_refresh.Max_Date ,
                      ds_policysummary_v2.Policyid ,
                      ds_policysummary_v2.SourceDB
        dependencies:
          - locationName: STAGE
            nodeName: V_PRED_MONTHS
          - locationName: STAGE
            nodeName: BVSTG_DAYS_TO_REFRESH
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: STAGE
            nodeName: BVSTG_CUSTOMER_TO_REFRESH
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','V_PRED_MONTHS') }}
            {{ ref('STAGE','BVSTG_DAYS_TO_REFRESH') }}
            {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
            {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
        name: V_PREB_CUTOFFPOLICY_SUMMARY_DAILY_V2
        noLinkRefs: []
