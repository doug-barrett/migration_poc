              WHEN ORDER_LINE.Contract_Line_Type = 'C'  
            
               AND M3_TRANSACTION_HEADER.Order_Type_Code =  'F'
            
               AND ORDER_LINE.Order_Line_Qty = ORDER_LINE.Order_Line_Return_Qty
            
              THEN ORDER_LINE.Order_Line_Qty
            
              WHEN ORDER_LINE.Contract_Line_Type = 'C'
            
              THEN ORDER_LINE.Order_Line_Qty - ORDER_LINE.Order_Line_Return_Qty
            
              WHEN ORDER_LINE.Contract_Line_Type = 'O'
            
              THEN ORDER_LINE.Order_Line_Qty
            
              ELSE NULL
            
            END
