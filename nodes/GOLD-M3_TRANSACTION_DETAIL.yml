      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'M3_TRANSACTION_HEADER') }} "M3_TRANSACTION_HEADER"
          
          INNER JOIN {{ ref('GOLD', 'ORDER_LINE') }} "ORDER_LINE"
          ON M3_TRANSACTION_HEADER.Contract_Key = ORDER_LINE.Contract_Key
          AND M3_TRANSACTION_HEADER.Contract_Seq_Key = ORDER_LINE.Contract_Seq_Key
          AND (ORDER_LINE.Contract_Key,ORDER_LINE.Contract_Seq_Key) in (Select Contract_Key, Contract_Seq_Key from {{ ref('GOLD', 'M3_TRANSACTION_HEADER') }} "M3_TRANSACTION_HEADER")
          
          INNER JOIN {{ ref('GOLD', 'ORDER_LINE_RATES') }} "ORDER_LINE_RATES"
          ON  ORDER_LINE.Contract_Key = ORDER_LINE_RATES.Contract_Key
          AND ORDER_LINE.Contract_Seq_Key = ORDER_LINE_RATES.Contract_Seq_Key
          AND ORDER_LINE.Contract_Line_Key = ORDER_LINE_RATES.Contract_Line_Key
          
          INNER JOIN {{ ref('GOLD', 'ORDER_LINE_ITEM') }} "ORDER_LINE_ITEM"
          ON  ORDER_LINE.Contract_Key = ORDER_LINE_ITEM.Contract_Key
          AND ORDER_LINE.Contract_Seq_Key = ORDER_LINE_ITEM.Contract_Seq_Key
          AND ORDER_LINE.Contract_Line_Key = ORDER_LINE_ITEM.Contract_Line_Key
          
          INNER JOIN {{ ref('GOLD', 'ORDER_LINE_EQUIPMENT') }} "ORDER_LINE_EQUIPMENT"
          ON  ORDER_LINE.Contract_Key = ORDER_LINE_EQUIPMENT.Contract_Key
          AND ORDER_LINE.Contract_Seq_Key = ORDER_LINE_EQUIPMENT.Contract_Seq_Key
          AND ORDER_LINE.Contract_Line_Key = ORDER_LINE_EQUIPMENT.Contract_Line_Key
          
          LEFT OUTER JOIN {{ ref('GOLD', 'ORDER_LINE_DAYS') }} "ORDER_LINE_DAYS"
          ON  ORDER_LINE.Contract_Key = ORDER_LINE_DAYS.Contract_Key
          AND ORDER_LINE.Contract_Seq_Key = ORDER_LINE_DAYS.Contract_Seq_Key
          AND ORDER_LINE.Contract_Line_Key = ORDER_LINE_DAYS.Contract_Line_Key
          
          INNER JOIN {{ ref('GOLD', 'ITEM') }} "ITEM"
          ON ORDER_LINE_ITEM.Item_Id = ITEM.Item_Id
          AND ITEM.dss_current_flag = 'Y'
          
          INNER JOIN {{ ref('GOLD', 'ITEM_UOM') }} "ITEM_UOM"
          ON ORDER_LINE_ITEM.Item_Id = ITEM_UOM.Item_Id
          AND ITEM_UOM.dss_current_flag = 'Y'
          
          INNER JOIN {{ ref('GOLD', 'CV_EQUIPMENT') }} "CV_EQUIPMENT"
          ON ORDER_LINE_EQUIPMENT.Equipment_Id =  CV_EQUIPMENT.Equipment_Id
          
          LEFT OUTER JOIN {{ ref('GOLD', 'ITEM_EQPT_CLASS') }} "ITEM_EQPT_CLASS"
          ON ORDER_LINE_EQUIPMENT.Category_Code =  ITEM_EQPT_CLASS.Category_Code
          AND ORDER_LINE_EQUIPMENT.Class_Code =  ITEM_EQPT_CLASS.Class_Code 
          AND ITEM_EQPT_CLASS.dss_current_flag = 'Y'
          
          LEFT OUTER JOIN {{ ref('SILVER', 'BM_BREAKDOWN_DAYS') }} "BM_BREAKDOWN_DAYS"
          ON  ORDER_LINE.Contract_Key = BM_BREAKDOWN_DAYS.Contract_Key
          AND ORDER_LINE.Contract_Seq_Key = BM_BREAKDOWN_DAYS.Contract_Seq_Key
          AND ORDER_LINE.Contract_Line_Key = BM_BREAKDOWN_DAYS.Contract_Line_Key
          
          LEFT OUTER JOIN {{ ref('GOLD', 'BV_OPEN_SUBSTITUTION') }} "BV_OPEN_SUBSTITUTION"
          ON ORDER_LINE.Contract_Id = BV_OPEN_SUBSTITUTION.Invoice_Num
          AND ORDER_LINE.Order_Line_Num = BV_OPEN_SUBSTITUTION.Line_Num
          AND ORDER_LINE.Location_Id = BV_OPEN_SUBSTITUTION.Location_Id
          AND (ORDER_LINE.Category_Code <> BV_OPEN_SUBSTITUTION.Category_Code OR 
               ORDER_LINE.Class_Code <> BV_OPEN_SUBSTITUTION.Class_Code)
          AND ORDER_LINE.Order_Line_Type_Code = 'RI'
          AND ORDER_LINE.Contract_Line_Type = 'O'
          
          LEFT OUTER JOIN {{ ref('SILVER', 'BM_COST_RENTAL_BULK') }} "BM_COST_RENTAL_BULK"
          ON  ORDER_LINE.Contract_Key = BM_COST_RENTAL_BULK.Contract_Key
          AND ORDER_LINE.Contract_Seq_Key = BM_COST_RENTAL_BULK.Contract_Seq_Key
          AND ORDER_LINE.Contract_Line_Key = BM_COST_RENTAL_BULK.Contract_Line_Key
          
          LEFT OUTER JOIN {{ ref('GOLD', 'BV_COST_RENTAL_SERIALIZED') }} "BV_COST_RENTAL_SERIALIZED"
          ON  ORDER_LINE.Equipment_Id = BV_COST_RENTAL_SERIALIZED.Equipment_Id
            
          WHERE (ORDER_LINE.Contract_Line_Type = 'C' 
            AND M3_TRANSACTION_HEADER.Order_Type_Code IN ('O', 'E', 'C', 'Q' , 'F'))
             OR (ORDER_LINE.Contract_Line_Type = 'S' 
            AND M3_TRANSACTION_HEADER.Order_Type_Code IN ('S', 'W'))
            OR ORDER_LINE.Contract_Line_Type = 'O'
            OR ORDER_LINE.Contract_Line_Type IS NULL
          
          --  Where ITEM.dss_current_flag = 'Y' and  ITEM_UOM.dss_current_flag = 'Y' and EQUIPMENT.dss_current_flag = 'Y'
