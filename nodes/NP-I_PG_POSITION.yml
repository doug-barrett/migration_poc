            transform: --PREFIX ADDED TO ENSURE UNIQUENESS ACROSS THE THREE CODE SOURCES  CASE   WHEN ISNULL(L_PG_POSITION.XPOSGROUP,'') <> '' THEN 'G' + LEFT(L_PG_POSITION.XPOSGROUP,2)   WHEN ISNULL(L_PG_POSITION.XJOBFUNCTION,'') <> '' THEN 'J' + LEFT(L_PG_POSITION.XJOBFUNCTION,2)   ELSE 'P' + L_PG_POSITION.POSITIONCODE  END
