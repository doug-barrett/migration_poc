        description: A way to group all employees. Uses a combination of Job Function (for recoverable staff) and a group code for the positions with junior, mid and senior levels and lastly the employees' position code.
        name: POSITIONGROUPING
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: c0cfc33f-b11e-43c6-ac2e-dc5fc77f4d45
                stepCounter: c43fc08a-6624-4de7-8f23-9488922da909
            transform: |-
              CASE WHEN ISNULL(L_PG_POSITION.XPOSGROUP,'') <> ''    THEN RIGHT(L_PG_POSITION.XPOSGROUP,LEN(L_PG_POSITION.XPOSGROUP)-4)
                          WHEN ISNULL(L_PG_POSITION.XJOBFUNCTION,'') <> '' THEN RIGHT(L_PG_POSITION.XJOBFUNCTION,LEN(L_PG_POSITION.XJOBFUNCTION)-4)
