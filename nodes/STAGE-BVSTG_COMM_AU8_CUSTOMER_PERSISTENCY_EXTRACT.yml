                   first_biaprimaryagentoffice,
                   TerritoryManagerName ---from "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_COMM_AU6_CUSTOMER_PERSISTENCY_EXTRACT"           from {{ ref('STAGE','BVSTG_COMM_AU6_CUSTOMER_PERSISTENCY_EXTRACT') }}           where islegacycustomer <> 'Migrated' and to_date(cust_start_date) >= '2017-01-01'          ) bvstg_comm_au6_customer_persistency_extract      cross join           (           select distinct to_date(min_date) cutoffdate            ---from "RETAIL_PROD"."SCH_BVSTAGE"."V_PRED_MONTHS"            from {{ ref('STAGE','V_PRED_MONTHS') }}           where min_date >= '2017-01-01'          ) v_pred_months       where cutoffdate >= date_trunc('month', cust_start_date)         and cutoffdate <= add_months(date_trunc('month',current_date()),-1)         ) bvstg_comm_au6_customer_persistency_extract    left join         (select customer_id,                 asofmonth,                count(distinct case when combinedstatus_eom = 'Active' then concat(policynumberformatted,carrier) else NULL end) as active_policy_eom,                count(distinct case when combinedstatus_bom = 'Active' then concat(policynumberformatted,carrier) else NULL end) as active_policy_bom         ---from "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_COMM_AU1_CUSTOMER_PERSISTENCY_EXTRACT"          from {{ ref('STAGE','BVSTG_COMM_AU1_CUSTOMER_PERSISTENCY_EXTRACT') }}         group by customer_id, asofmonth         ) bvstg_comm_au1_customer_persistency_extract     on bvstg_comm_au6_customer_persistency_extract.customer_id = bvstg_comm_au1_customer_persistency_extract.customer_id      and bvstg_comm_au6_customer_persistency_extract.cutoffdate = bvstg_comm_au1_customer_persistency_extract.asofmonth          left join         (select customer_id,                 max(Premium_finance_flag) as Premium_finance_flag         ---from "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_COMM_AU1_CUSTOMER_PERSISTENCY_EXTRACT"          from {{ ref('STAGE','BVSTG_COMM_AU1_CUSTOMER_PERSISTENCY_EXTRACT') }}         group by customer_id         ) bvstg_comm_au1_customer_persistency_extract_1     on bvstg_comm_au6_customer_persistency_extract.customer_id = bvstg_comm_au1_customer_persistency_extract_1.customer_id                left join -- Added 4/22/2022    (select distinct            OfficeCode,           AgencyName,           statecode,           case when territorymanagername='Michael Sanchez' then 1 else 0 end as IsFranchise,brand    --- from "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE") ds_retail_office    from {{ ref('EDW','DS_RETAIL_OFFICE') }}) ds_retail_office    on bvstg_comm_au6_customer_persistency_extract.first_biaprimaryagentoffice = ds_retail_office.officecode
