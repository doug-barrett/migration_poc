        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AMS_INVOICETRANSACTION_TEMP') }} bvstg_ams_invoicetransaction_temp
             INNER JOIN {{ ref('STAGE','V_S_AMS_INVOICE_MROC_CURRENT') }} v_s_ams_invoice_mroc_current
                ON v_s_ams_invoice_mroc_current.InvId = bvstg_ams_invoicetransaction_temp.InvId
             INNER JOIN {{ ref('STAGE','V_S_AMS_SETUPBILLINGTRAN_MROC_CURRENT') }} v_s_ams_setupbillingtran_mroc_current
                ON bvstg_ams_invoicetransaction_temp.ChargeCode = v_s_ams_setupbillingtran_mroc_current.ChargeCode
             INNER JOIN {{ ref('STAGE','V_S_AMS_CUSTOMER_MROC_CURRENT') }} v_s_ams_customer_mroc_current
                ON bvstg_ams_invoicetransaction_temp.CustId = v_s_ams_customer_mroc_current.CustId
             INNER JOIN {{ ref('STAGE','V_PREF_AMS_TRANTYPECODE_MODE') }} v_pref_ams_TranTypeCode_mode
                ON v_pref_ams_TranTypeCode_mode.TransTypeCode = bvstg_ams_invoicetransaction_temp.TranType
               AND v_pref_ams_TranTypeCode_mode.ModeID IN (2,4)
             WHERE LineOfBus IS NULL
               AND (v_s_ams_setupbillingtran_mroc_current.ShortName != 'PRFAGY' AND v_s_ams_setupbillingtran_mroc_current.ShortName !='PFFC' AND v_s_ams_setupbillingtran_mroc_current.ShortName != 'PFC')
             GROUP BY v_s_ams_invoice_mroc_current.invid ,
