        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT LeadID
                      FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} s_ap1_Lead_mroc
                     WHERE (('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0 AND s_ap1_Lead_mroc.DSS_CREATE_TIME >='2018-01-01') OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,s_ap1_Lead_mroc.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}'))
                     UNION SELECT DISTINCT LeadID
                      FROM {{ ref('STAGE','V_S_AP1_APPOINTMENT_MROC_CURRENT') }} v_s_ap1_appointment_mroc_current
                     WHERE (('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0 AND v_s_ap1_appointment_mroc_current.DSS_CREATE_TIME >='2018-01-01') OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,v_s_ap1_appointment_mroc_current.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}'))
                     UNION SELECT DISTINCT LeadID
                      FROM {{ ref('STAGE','V_S_AP1_LEADBRIDGEDQUOTE_MROC_CURRENT') }} v_s_ap1_leadbridgedquote_mroc_current
                     WHERE (('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0 AND v_s_ap1_leadbridgedquote_mroc_current.DSS_CREATE_TIME >='2018-01-01') OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,v_s_ap1_leadbridgedquote_mroc_current.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}'))
                     UNION SELECT DISTINCT LeadID
                      FROM {{ ref('STAGE','V_S_AP1_LEADATTACHMENT_CURRENT') }} v_s_ap1_LeadAttachment_current
                     WHERE (('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0 AND v_s_ap1_LeadAttachment_current.DSS_CREATE_TIME >='2018-01-01') OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,v_s_ap1_LeadAttachment_current.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}'))
                     UNION SELECT DISTINCT ENTITYID LeadID
                      FROM {{ ref('DATA_VAULT','S_AP1_HISTORY_MROC') }} s_ap1_history_mroc
                     WHERE (('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0 AND s_ap1_history_mroc.DSS_CREATE_TIME >='2018-01-01') OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,s_ap1_history_mroc.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}'))
                       AND s_ap1_history_mroc.ENTITYTYPEID = 5
                       AND s_ap1_history_mroc.ENTITYFIELDID = 42
                     UNION SELECT DISTINCT LeadID
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                     WHERE label IN('Quotes Auto','Quotes Complementary','New Business Auto','New Business Complementary')
                       AND (('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0 AND DSS_CREATE_TIME >='2018-01-01') OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}'))
                   )s_ap1_Lead_mroc
