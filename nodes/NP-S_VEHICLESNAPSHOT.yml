        join:
          joinCondition: |-
            FROM {{ ref('NP','I_VEHICLESNAPSHOT') }} I_VEHICLESNAPSHOT
              LEFT OUTER JOIN [D_VEHICLE]
                ON I_VEHICLESNAPSHOT.VEHICLENUMBER = D_VEHICLE.VEHICLENUMBER
              LEFT OUTER JOIN [D_DATE]
                ON CONVERT(DATETIME, (CONVERT(VARCHAR, I_VEHICLESNAPSHOT.SNAPSHOTDATE, 112))) = D_DATE.CALENDARDATE
              LEFT OUTER JOIN [D_PERIOD]
                ON D_DATE.PERIODNUMBER = D_PERIOD.PERIODNUMBER --CHECK WHAT LAST MONTHS RECORDS WERE FOR MOVEMENT  LEFT JOIN F_VEHICLESNAPSHOT   ON D_VEHICLE.D_VEHICLE_KEY = F_VEHICLESNAPSHOT.D_VEHICLE_KEY    AND (D_PERIOD.D_PERIOD_KEY - 1) = F_VEHICLESNAPSHOT.D_PERIOD_KEY      WHERE I_VEHICLESNAPSHOT.OPERATIONALCOUNT = 1  OR I_VEHICLESNAPSHOT.PREOPERATIONALCOUNT = 1  --ONLY INCLUDE POST OPERATIONAL VEHICLES THAT WERE OPERATIONAL LAST MONTH  OR (I_VEHICLESNAPSHOT.OUTOFOPERATIONCOUNT = 1  AND F_VEHICLESNAPSHOT.OPERATIONALCOUNT = 1)
        name: S_VEHICLESNAPSHOT
