    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          DS_AP1_TRANSACTIONSUMMARY: eb40b9b4-16a8-47be-8699-9c6c04540ac6
          DS_BVSTG_AP1_TRANSACTIONITEM: 80f81938-7e6e-4863-9ea5-4321d79434f8
          DS_BVSTG_AP1_TRANSACTION: 95296926-a461-45bf-919b-1e93cca0d1ad
          DS_BVSTG_AP1_PAYMENT: 98dd5fca-4fd6-4ecd-85c3-eea74c0094f3
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTIONITEM
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTION
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_PAYMENT
          - locationName: UNKNOWN
            nodeName: STAGE_DATE_SF
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
              LEFT JOIN (
                    SELECT transactionid,
                           Sum(amount) TotalDue,
                           Sum(CASE WHEN isprimaryfee = 1 THEN amount ELSE 0 END) PrimaryFee,
                           Sum(CASE WHEN feetype = 'Carrier Premium' THEN amount ELSE 0 END) CarrierPremium,
                           Sum(CASE WHEN feetype = 'Doc. Fee' THEN amount ELSE 0 END) DocFee,
                           Sum(CASE WHEN feetype NOT IN ('Additional Product Premium', 'Carrier Premium', 'Retain Commission', 'Monthly Payment By Dealer', 'ACH Credit', 'Adjustment', 'On Account', 'Balance Due','Doc. Fee') AND isprimaryfee = 0 THEN amount ELSE 0 END) Other_Fees
                      FROM {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONITEM') }}
                     WHERE (isvoid = 0 OR (isvoid = 1 AND voidedon > '{{ parameters.HWM_BVSTG_OustandingBalance }}'))
                       AND DATE(created) <= '{{ parameters.HWM_BVSTG_OustandingBalance }}'
                     GROUP  BY transactionid
                   )ds_bvstg_ap1_transactionitem
                ON ds_ap1_transactionsummary.TransactionID = ds_bvstg_ap1_transactionitem.TransactionID
              LEFT JOIN (
                    SELECT CE.transactionid,
                           SUM(CASE WHEN DATE(created_payment) <= date(CE.ApprovedByAdminQCDate) AND PYM.IsPromiseToPay = 1 THEN PYM.PaymentAmount ELSE 0 END) QCCreditExtended,
                           SUM(CASE WHEN DATE(created_payment) = date(CE.created) AND PYM.IsReceived = 1 AND (PYM.IsNSF = 0 OR (PYM.IsNSF = 1 AND PYM.NSFOn>'{{ parameters.HWM_BVSTG_OustandingBalance }}')) THEN PYM.PaymentAmount ELSE 0 END) CollectedPOS,
                           SUM(CASE WHEN PYM.IsReceived = 1 AND (PYM.IsNSF = 0 OR (PYM.IsNSF = 1 AND PYM.NSFOn>'{{ parameters.HWM_BVSTG_OustandingBalance }}')) THEN PYM.PaymentAmount ELSE 0 END) TotalCollected,
                           MAX(IFNULL(CAST(PYM.IsExportedToCollectionAsDebt AS integer),0)) sentToCollection,
                           MIN(PYM.DateExportedToCollectionAsDebt) SentToCollectionDate,
                           SUM(CASE WHEN PYM.IsExportedToCollectionAsDebt = 1 THEN PYM.PaymentAmount ELSE 0 END) ExportedToCollection
                      FROM {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTION') }} CE
                     INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_PAYMENT') }} PYM
                        ON (CE.transactionid = PYM.transactionid)
                     WHERE PYM.ISROWDELETED_PAYMENT = 0
                       AND (PYM.isvoid_payment = 0 OR (PYM.isvoid_payment = 1 AND PYM.voidedon_payment> '{{ parameters.HWM_BVSTG_OustandingBalance }}'))
                       AND DATE(created_payment) <= '{{ parameters.HWM_BVSTG_OustandingBalance }}'
                     GROUP  BY CE.transactionid
                   )ds_bvstg_ap1_payment
                ON ds_ap1_transactionsummary.TransactionID = ds_bvstg_ap1_payment.TransactionID
             INNER JOIN {{ ref('UNKNOWN','STAGE_DATE_SF') }} STAGE_DATE_SF
                ON STAGE_DATE_SF.CALENDAR_DATE = '{{ parameters.HWM_BVSTG_OustandingBalance }}'
             WHERE (ds_ap1_transactionsummary.isvoid = 0 OR (ds_ap1_transactionsummary.isvoid = 1 AND ds_ap1_transactionsummary.voidedon> '{{ parameters.HWM_BVSTG_OustandingBalance }}'))
               AND DATE(ds_ap1_transactionsummary.created) <= '{{ parameters.HWM_BVSTG_OustandingBalance }}'
               AND ds_ap1_transactionsummary.APPROVALSTATE = 'ApprovedByAdminQC'
               AND ds_ap1_transactionsummary.isrowdeleted = 0
