        join:
          joinCondition: |-
            FROM (
                    WITH COMISSIONSANDFEES AS (
                            SELECT BL.TRANSACTIONID,
                                   BL.CUSTOMERID,
                                   BL.POLICYID,
                                   BL.TERM_IN_MONTHS,
                                   BL.STARTDATE,
                                   BL.ESTIMATE_END_DATE,
                                   DATE(FEES.CREATEDDATE) CREATEDDATE,
                                   FEES.CLASSIFICATION,
                                   FEES.LABEL,
                                   FEES.AMOUNT,
                                   FEES.COUNTER,
                                   FEES.WRITTENPREMIUMAMOUNT,
                                   FEES.CURRENTPREMIUMAMOUNT
                              FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU0_BSL') }} BL
                             INNER JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} FEES
                                ON (BL.POLICYID = FEES.POLICYID AND DATE(FEES.CREATEDDATE) >= BL.STARTDATE AND DATE(FEES.CREATEDDATE) < DATEADD(DAY, -30, ESTIMATE_END_DATE))
                             WHERE FEES.SOURCEDB = 'AppOne'
                               AND FEES.AMOUNT IS NOT NULL
                               AND FEES.AMOUNT <> 0
                             ORDER BY POLICYID,
                                      DATE(FEES.CREATEDDATE) ASC
                           ) ,
                           AGROUPATION AS (
                            SELECT TRANSACTIONID,
                                   CUSTOMERID,
                                   POLICYID ,
                                   SUM(CASE WHEN CLASSIFICATION IN ('Fee', 'Service Transactions Fee') THEN AMOUNT ELSE 0 END) AS FEE_AMOUNT
                              FROM COMISSIONSANDFEES
                             GROUP BY TRANSACTIONID,
                                      CUSTOMERID,
                                      POLICYID
                           ) SELECT TRANSACTIONID,
                           CUSTOMERID,
                           POLICYID ,
                           CASE WHEN FEE_AMOUNT < 0 THEN 0
                                ELSE FEE_AMOUNT
                                 END AS FEE_AMOUNT
                      FROM AGROUPATION
                   ) bvstg_nsa_rwl_au5_fees
        name: BVSTG_NSA_RWL_AU5_FEES
