    - aliases:
        SRC_WOLBRDFL: 78e5237f-e3cd-5ba7-ac1f-84252234aa9c
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: SRC_WOLBRDFL
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'SRC_WOLBRDFL') }} "SRC_WOLBRDFL"
           Where Aud_Time <= (Select MAX(Batch_End) FROM "DOUG_POC"."DP001"."CDC_BATCH")
          AND (Aud_Code <> 'F' or (Aud_Code is null and Aud_Type = 'RR'))
           QUALIFY RANK() 
          OVER (PARTITION BY  VLCMP, 
          VLWO0, 
          VLPRFD,                 
          VLMECH, 
          VLSEQ0, 
          VLSYSD, 
          VLSYST
          ORDER BY AUD_TIME DESC, CASE  
          WHEN Aud_Type in ('PT','PX','FI')   THEN 1 
          WHEN Aud_Type in ('UB','FB','FP','BR')  THEN 2 
          WHEN Aud_Type in ('UP','UR')               THEN 3 
          WHEN Aud_Type in ('DL' , 'FD')      THEN 4 
          WHEN Aud_Type in ('RR')              THEN 5 
           ELSE 0 END DESC) = 1
      name: CDC_WOLBRDFL
