        dependencies:
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTIONERROR
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
             INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONERROR') }} ds_bvstg_ap1_transactionerror
                ON ds_ap1_transactionsummary.TransactionId=ds_bvstg_ap1_transactionerror.TransactionId
              LEFT JOIN (
                    SELECT 'Major Error' ErrorType
                     UNION SELECT 'Minor Error' ErrorType
                   )ErrorType
                ON 1=1
             WHERE ds_ap1_transactionsummary.ApprovalState='ApprovedByAdminQC'
               AND ds_ap1_transactionsummary.isVoid=0
               AND IFNULL(LINEOFBUSINESSTYPE,'') IN ('Auto', 'Commercial Auto', 'Motorcycle','Commercial Auto Policies','Homeowner','')
               AND ds_ap1_transactionsummary.ISCORPORATEVOID=0
               AND DATE(ds_ap1_transactionsummary.CREATED)>='2020-01-01'
               AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATE(ds_ap1_transactionsummary.CREATED) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-15,DATE(CURRENT_DATE())))))))
             GROUP BY YEAR(ds_ap1_transactionsummary.CREATED),
                      Month(ds_ap1_transactionsummary.CREATED),
                      TO_CHAR(ds_ap1_transactionsummary.CREATED, 'MMMM'),
                      ds_ap1_transactionsummary.PRIMARYAGENTFULLNAME,
