                      DATE(ds_ap1_transactionsummary.CREATED),
                      ds_ap1_transactionsummary.LINEOFBUSINESSTYPE
        name: SRC_bvstg_transactionerror_summary_ap1
        noLinkRefs: []
      - aliases:
          DS_RAM_RETAIL_REPOSITORY: d29a0c5c-e296-46c4-bc55-861d60fe906d
          DS_AMS_CASE_ERROR: 0b668c5a-445c-4592-853f-b2f75fa39061
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: EDW
            nodeName: DS_AMS_CASE_ERROR
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
              LEFT JOIN {{ ref('EDW','DS_AMS_CASE_ERROR') }} ds_ams_case_error
                ON ds_ram_retail_repository.POLICYID=ds_ams_case_error.POLICYID
              LEFT JOIN (
                    SELECT 'Major Error' ErrorType
                     UNION SELECT 'Minor Error' ErrorType
                   )ErrorType
                ON 1=1
             WHERE ds_ram_retail_repository.modeid IN (12,14)
               AND ds_ram_retail_repository.SourceDB = 'CIGH'
               AND DATE(ds_ram_retail_repository.CREATEDDATE)>='2020-01-01'
               AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATE(ds_ram_retail_repository.CREATEDDATE) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-15,DATE(CURRENT_DATE())))))))
             GROUP BY YEAR(ds_ram_retail_repository.CREATEDDATE),
                      Month(ds_ram_retail_repository.CREATEDDATE),
                      TO_CHAR(ds_ram_retail_repository.CREATEDDATE, 'MMMM'),
                      ds_ram_retail_repository.PRIMARYAGENTNAME_BROKER,
                      ds_ram_retail_repository.PRIMARYAGENTULTIPRO_BROKER,
                      ds_ram_retail_repository.CLASSIFICATIONGROUP,
                      ds_ram_retail_repository.CarrierName,
                      ds_ram_retail_repository.BIAPRIMARYTRANSACTIONOFFICE,
                      DATE(ds_ram_retail_repository.CREATEDDATE),
