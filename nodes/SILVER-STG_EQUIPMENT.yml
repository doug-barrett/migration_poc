      join:
        joinCondition: "FROM {{ ref('GOLD', 'CDC_EQPMASFL') }} \"CDC_EQPMASFL\"\n  \n  LEFT OUTER JOIN {{ ref('GOLD', 'EQUIPMENT_STATUS_CODES') }} \"EQUIPMENT_STATUS_CODES\"\n  ON  CDC_EQPMASFL.EMSTAT  = EQUIPMENT_STATUS_CODES.EQUIPMENT_STATUS_CODE\n  \n  LEFT OUTER JOIN \"DOUG_POC\".\"UR\".\"DV_EQUIPMENT\" \"DV_EQUIPMENT\"\n  ON  CDC_EQPMASFL.EMCMP = DV_EQUIPMENT.Company_Code\n  AND CDC_EQPMASFL.EMEQP0 = DV_EQUIPMENT.Equipment_Code\n    \n  LEFT OUTER JOIN {{ ref('GOLD', 'DV_ITEM') }} \"DV_ITEM\"\n  ON  CDC_EQPMASFL.EMCMP = DV_ITEM.Company_Code\n  AND CDC_EQPMASFL.EMITEM = DV_ITEM.Item_Code\n  AND CDC_EQPMASFL.EMSTKC = DV_ITEM.Stock_Class_Code\n    \n  LEFT OUTER JOIN {{ ref('GOLD', 'DV_VENDOR') }} \"DV_VENDOR\"\n  ON   CDC_EQPMASFL.EMVEND = DV_VENDOR.VENDOR_CODE\n    \n  LEFT OUTER JOIN \n  (SELECT COALESCE(MAX(EQUIPMENT_ID),0) AS LAST_ID FROM \"DOUG_POC\".\"UR\".\"DV_EQUIPMENT\" ) AS MAX_ID ON 1 = 1"
