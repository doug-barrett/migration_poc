        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_AP1_AMS_TRANSACTION_SUMMARY_NB') }} AS SELECT a.CustomerID,
                   AppOne_CustomerID,
                   a.NBTransactionID,
                   a.TransactionID,
                   a.created,
                   a.PolicyID,
                   a.PolicyNumber,
                   a.carriername,
                   a.carrierpremium,
                   a.effectivedate,
                   a.expirationdate,
                   DENSE_RANK() OVER (PARTITION BY NBTransactionID ORDER BY a.effectivedate) Rank_Transfer,
                   DENSE_RANK() OVER (PARTITION BY NBTransactionID ORDER BY a.effectivedate DESC) Rank_Transfer_desc,
                   CASE WHEN Rank_Transfer = 1 THEN 'New Business'
                        ELSE a.TransactionType
                         END TransactionType,
                   a.ISLEGACYTRANSACTION,
                   a.ORGANIZATIONCODE,
                   a.BIAPRIMARYAGENTOFFICE,
                   a.FIRSTWRITTEN,
                   a.TERM,
                   a.LINEOFBUSINESSTYPE,
                   a.CURRENTPREMIUM,
                   a.WRITTENPREMIUM,
                   a.BIA_STATUS,
                   a.BIA_STATUSDATE,
                   a.BIA_EXPIRATIONDATE
              FROM(
                    SELECT t.TransactionID NBTransactionID,
                           a.TransactionID,
                           a.created,
                           a.PolicyID,
                           a.PolicyNumber,
                           a.carriername,
                           a.carrierpremium,
                           a.effectivedate,
                           a.expirationdate,
                           a.TransactionType,
                           t.AP1_CUSTOMER_CIGHID CustomerID,
                           a.CustomerID AppOne_CustomerID,
                           a.ISLEGACYTRANSACTION,
                           a.ORGANIZATIONCODE,
                           a.BIAPRIMARYAGENTOFFICE,
                           a.FIRSTWRITTEN,
                           a.TERM,
                           a.LINEOFBUSINESSTYPE,
                           a.CURRENTPREMIUM,
                           a.WRITTENPREMIUM,
                           a.BIA_STATUS,
                           a.BIA_STATUSDATE,
                           a.BIA_EXPIRATIONDATE
                      FROM RETAIL_DEV.SCH_BVSTAGE.V_POSB_AP1_AMS_TRANSACTION_SUMMARY a
                      LEFT JOIN RETAIL_DEV.SCH_BVSTAGE.V_POSB_AP1_AMS_TRANSACTION_SUMMARY t
                        ON t.CustomerID = a.CustomerID
                       AND (SPLIT_PART(a.policynumber,'-',1) = SPLIT_PART(t.policynumber,'-',1) OR (a.carriername like '%Affirmative%' AND left(a.policynumber,10) = left(t.policynumber,10)) OR (a.carriername like '%Founders%' AND right(a.policynumber,6) = right(t.policynumber,6)) OR (a.carriername like '%Unique%' AND right(a.policynumber,7) = right(t.policynumber,7)) OR ((a.carriername like '%American%' OR a.carriername like '%American Freedom%') AND right(left(a.policynumber,10),7) = right(left(t.policynumber,10),7)) OR (a.carriername like '%United%' AND left(a.policynumber,4) = left(t.policynumber,4) AND right(a.policynumber,6) = right(t.policynumber,6)) OR (a.carriername like '%USAgencies%' AND left(a.policynumber,7) = left(t.policynumber,7)) OR (a.carriername like '%National%' AND left(a.policynumber,10) = left(t.policynumber,10)) OR (a.carriername like '%Falcon%' AND left(a.policynumber,10) = left(t.policynumber,10)) OR (a.carriername like '%Traders%' AND left(a.policynumber,10) = left(t.policynumber,10)) OR (a.carriername like '%Echelon%' AND left(a.policynumber,11) = left(t.policynumber,11))) QUALIFY ROW_NUMBER() OVER (PARTITION BY a.TransactionID ORDER BY t.EffectiveDate)=1
                   )a
