    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: UNKNOWN
            nodeName: BVSTG_CDP_AU1_CUSTOMER
        join:
          joinCondition: |-
            EXTENDED
              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CDP_AU1_CUSTOMER bvstg_cdp_au1_customer
              LEFT JOIN (
                    SELECT CDP_CUSTOMERID ,
                           GENDER
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CDP_AU1_CUSTOMER bvstg_cdp_au1_customer QUALIFY ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY CASE WHEN GENDER IS NOT NULL THEN 1 ELSE 2 END ,CREATED DESC) = 1
                   ) bvstg_cdp_au1_customer_gender
                ON bvstg_cdp_au1_customer.CDP_CUSTOMERID = bvstg_cdp_au1_customer_gender.CDP_CUSTOMERID
              LEFT JOIN (
                    SELECT CDP_CUSTOMERID ,
                           DOB
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CDP_AU1_CUSTOMER bvstg_cdp_au1_customer QUALIFY ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY CASE WHEN DOB IS NOT NULL THEN 1 ELSE 2 END ,CREATED DESC) = 1
                   ) bvstg_cdp_au1_customer_dob
                ON bvstg_cdp_au1_customer.CDP_CUSTOMERID = bvstg_cdp_au1_customer_dob.CDP_CUSTOMERID
              LEFT JOIN (
                    SELECT CDP_CUSTOMERID ,
                           LICENSENUMBER
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CDP_AU1_CUSTOMER bvstg_cdp_au1_customer QUALIFY ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY CASE WHEN NULLIF(LICENSENUMBER, '') IS NOT NULL THEN 1 ELSE 2 END ,CREATED DESC) = 1
                   ) bvstg_cdp_au1_customer_ln
                ON bvstg_cdp_au1_customer.CDP_CUSTOMERID = bvstg_cdp_au1_customer_ln.CDP_CUSTOMERID
              LEFT JOIN (
                    SELECT CDP_CUSTOMERID ,
                           EMAIL
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CDP_AU1_CUSTOMER bvstg_cdp_au1_customer QUALIFY ROW_NUMBER() OVER (PARTITION BY CDP_CUSTOMERID ORDER BY CASE WHEN NULLIF(EMAIL, '') IS NOT NULL THEN 1 ELSE 2 END ,CREATED DESC) = 1
                   ) bvstg_cdp_au1_customer_email
                ON bvstg_cdp_au1_customer.CDP_CUSTOMERID = bvstg_cdp_au1_customer_email.CDP_CUSTOMERID
              LEFT JOIN (
                    SELECT bvstg_cdp_au1_customer.CDP_CUSTOMERID ,
                           b.MAINSTREET ,
                           b.MAINCITY ,
                           b.MAINSTATE ,
                           b.MAINZIP
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CDP_AU1_CUSTOMER bvstg_cdp_au1_customer
                     INNER JOIN RETAIL_DEV.SCH_BVSTAGE.V_PREB_CDP_MAIN_ADDRESS b
                        ON bvstg_cdp_au1_customer.cdp_customerid = b.cdp_customerid QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_cdp_au1_customer.CDP_CUSTOMERID ORDER BY bvstg_cdp_au1_customer.CREATED DESC) = 1
                   ) bvstg_cdp_au1_customer_main
                ON bvstg_cdp_au1_customer.CDP_CUSTOMERID = bvstg_cdp_au1_customer_main.CDP_CUSTOMERID
              LEFT JOIN (
                    SELECT bvstg_cdp_au1_customer.CDP_CUSTOMERID ,
                           b.MAILINGSTREET ,
                           b.MAILINGCITY ,
                           b.MAILINGSTATE ,
                           b.MAILINGZIP
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CDP_AU1_CUSTOMER bvstg_cdp_au1_customer
                     INNER JOIN RETAIL_DEV.SCH_BVSTAGE.V_PREB_CDP_MAILING_ADDRESS b
                        ON bvstg_cdp_au1_customer.cdp_customerid = b.cdp_customerid QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_cdp_au1_customer.CDP_CUSTOMERID ORDER BY bvstg_cdp_au1_customer.CREATED DESC) = 1
                   ) bvstg_cdp_au1_customer_mailing
                ON bvstg_cdp_au1_customer.CDP_CUSTOMERID = bvstg_cdp_au1_customer_mailing.CDP_CUSTOMERID
              LEFT JOIN (
                    SELECT bvstg_cdp_au1_customer.CDP_CUSTOMERID ,
                           b.GARAGESTREET ,
                           b.GARAGECITY ,
                           b.GARAGESTATE ,
                           b.GARAGEZIP
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CDP_AU1_CUSTOMER bvstg_cdp_au1_customer
                     INNER JOIN RETAIL_DEV.SCH_BVSTAGE.V_PREB_CDP_GARAGE_ADDRESS b
                        ON bvstg_cdp_au1_customer.cdp_customerid = b.cdp_customerid QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_cdp_au1_customer.CDP_CUSTOMERID ORDER BY bvstg_cdp_au1_customer.CREATED DESC) = 1
                   ) bvstg_cdp_au1_customer_garage
                ON bvstg_cdp_au1_customer.CDP_CUSTOMERID = bvstg_cdp_au1_customer_garage.CDP_CUSTOMERID
              LEFT JOIN ( SELECT bvstg_cdp_au1_customer.CDP_CUSTOMERID ,
                   b.QUOTESTREET ,
                   b.QUOTECITY ,
                   b.QUOTESTATE ,
                   b.QUOTEZIP
              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CDP_AU1_CUSTOMER bvstg_cdp_au1_customer
             INNER JOIN RETAIL_DEV.SCH_BVSTAGE.V_PREB_CDP_QUOTE_ADDRESS b
        name: BVSTG_CDP_AU3_CUSTOMER
        noLinkRefs: []
