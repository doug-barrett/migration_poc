          DS_AGENT_KEY: 489968a6-2aa9-4c60-83b4-b001aab3e3a8
          DS_HR_LABORHOURSCORECARD: 225ed586-a2eb-47ef-86ad-2a51acaf0327
          DS_RETAIL_OFFICE: 581aed87-ec65-482f-aa6f-9a04a9d54476
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_CFA_REVIEWS_CURRENT
          - locationName: EDW
            nodeName: DS_BVSTG_AU2_RETAIL_RFG_EXTRACT
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: STAGE
            nodeName: V_S_SPLC_POLICYTRANSACTION_CURRENT
          - locationName: DATA_VAULT
            nodeName: H_SPLC_EMPLOYEE
          - locationName: STAGE
            nodeName: V_S_SPLC_EMPLOYEE_CURRENT
          - locationName: EDW
            nodeName: DS_HR_SALESEMPLOYEESUMMARY
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: EDW
            nodeName: DS_HR_LABORHOURSCORECARD
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            EXTENDED
              FROM ( (
                    SELECT NULL ProducerNumber,
                           to_date(PostDate) Date, OfficeCode,
                           NULL AS PositiveORQty,
                           NULL AS PositiveORExpected ,
                           NULL AS StarRatingOverall,
                           NULL AS Promoter,
                           NULL AS Detractor,
                           NULL AS Total_NPS,
                           NULL AS DOIComplaintQty ,
                           NULL AS POLICYMAJORERRORNOPAY,
                           NULL AS POLICYSOLD,
                           'SPLC' AS sourcedb,
                           NULL AS StarRatingCount ,
                           NULL AS StarRatingSum,
                           NULL AS isWeCare,
                           NULL AS Total_Producers_With_Calls ,
                           'Brand' SubjectArea,
                           'Positive_Online_Reviews_Numerator' Metric,
                           count(DISTINCT reviewid) MetricValue,
                           NULL AS islegacytransaction
                      FROM {{ ref('STAGE','V_DLBV_CFA_REVIEWS_CURRENT') }}
                     WHERE to_date(PostDate)>='2021-01-01'
                       AND rating>=4
                     GROUP BY to_date(PostDate),
                              OfficeCode,
                              sourcedb
                   )
            UNION ALL (
                    SELECT NULL ProducerNumber,
                           to_date(Date) Date, OfficeCode,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           sourcedb,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           'Brand' SubjectArea,
                           'Positive_Online_Reviews_Denominator' Metric,
                           sum(counter) MetricValue,
                           islegacytransaction
                      FROM {{ ref('EDW','DS_BVSTG_AU2_RETAIL_RFG_EXTRACT') }}
                     WHERE label IN ('Sales','Renewals')
                       AND sourcedb='SPLC'
                       AND BVSTG_AU2_RETAIL_RFG_EXTRACT_ID IN (
                            SELECT DISTINCT md5(id) id
                              FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                             WHERE date(CreatedDate) >= date_trunc('year', add_months(current_date()-1, -24))
                               AND to_date(CreatedDate) <= current_date()-1
                               AND SourceDB IN ('SPLC')
                               AND label IN ('Renewal Auto', 'Renewal Complementary', 'New Business Auto', 'New Business Complementary')
                           )
                     GROUP BY OfficeCode,
                              to_date(Date),
                              sourcedb,
                              islegacytransaction
                   )
            UNION ALL (SELECT DISTINCT V_S_SPLC_EMPLOYEE_CURRENT.SHORTNAME AS EmployeeNumber,
                   Date(a.CHANGEDDATE) Date, c.officecode,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   'SPLC' sourcedb,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   'Financial Flexibility' SubjectArea,
                   'Transactions_Per_Hour_Numerator' Metric,
                   count(DISTINCT HK_H_POLICYTRANSACTION) MetricValue,
                   NULL
              FROM {{ ref('STAGE','V_S_SPLC_POLICYTRANSACTION_CURRENT') }} a
              LEFT JOIN {{ ref('DATA_VAULT','H_SPLC_EMPLOYEE') }}
                ON ifnull(trim(a.CHANGEDBY),'-')=ifnull(trim(H_SPLC_EMPLOYEE.EMPCODE),'-')
              LEFT JOIN {{ ref('STAGE','V_S_SPLC_EMPLOYEE_CURRENT') }}
                ON H_SPLC_EMPLOYEE.HK_H_EMPLOYEE = V_S_SPLC_EMPLOYEE_CURRENT.HK_H_EMPLOYEE
              LEFT JOIN (
                    SELECT EMPLOYEENUMBER,
                           jobgroup,
                           uniqueid,
                           effectivedate,
                           EmployeestatusStartDate
                      FROM {{ ref('EDW','DS_HR_SALESEMPLOYEESUMMARY') }} QUALIFY row_number() OVER (PARTITION BY EMPLOYEENUMBER ORDER BY EmployeestatusStartDate DESC,EFFECTIVEDATE DESC) = 1
                   )b
                ON ifnull(V_S_SPLC_EMPLOYEE_CURRENT.SHORTNAME,'-')=ifnull(b.EMPLOYEENUMBER,'-')
              LEFT JOIN (
                    SELECT DISTINCT EmployeeNumber,
                           employeename,
                           officecode
                      FROM {{ ref('EDW','DS_AGENT_KEY') }}
                     WHERE Rank_EmployeeNumber=1 QUALIFY row_number() OVER (PARTITION BY employeenumber ORDER BY dss_create_time) = 1
                   ) c
                ON ifnull(V_S_SPLC_EMPLOYEE_CURRENT.SHORTNAME,'-')=ifnull(c.EMPLOYEENUMBER,'-')
             WHERE (TRIM(LOWER(a.DESCRIPTION)) NOT LIKE '%dnld%' OR a.DESCRIPTION IS NULL)
               AND year(Date(a.CHANGEDDATE)) >=year(current_date()-1)-2
               AND trim(b.jobgroup) IN ('Trainee','Sales Support')
               AND ifnull(V_S_SPLC_EMPLOYEE_CURRENT.SHORTNAME,'-') IN (SELECT DISTINCT ifnull(a.EmployeeNumber,'-') EMPLOYEENUMBER
              FROM {{ ref('EDW','DS_HR_LABORHOURSCORECARD') }} a
              LEFT JOIN (
                    SELECT EMPLOYEENUMBER,
                           jobgroup,
                           uniqueid,
                           effectivedate,
                           EmployeestatusStartDate
                      FROM {{ ref('EDW','DS_HR_SALESEMPLOYEESUMMARY') }} QUALIFY row_number() OVER (PARTITION BY EMPLOYEENUMBER ORDER BY EmployeestatusStartDate DESC, EFFECTIVEDATE DESC) = 1
                   )b
                ON ifnull(a.EmployeeNumber,'-')=ifnull(b.EMPLOYEENUMBER,'-')
              LEFT JOIN (
                    SELECT DISTINCT EmployeeNumber,
                           employeename,
                           officecode
                      FROM {{ ref('EDW','DS_AGENT_KEY') }}
                     WHERE Rank_EmployeeNumber=1 QUALIFY row_number() OVER (PARTITION BY employeenumber ORDER BY dss_create_time) = 1
                   ) c
                ON ifnull(a.EmployeeNumber,'-')=ifnull(c.EMPLOYEENUMBER,'-')
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} d
                ON c.officecode=d.officecode
             WHERE year(WrkdWorkDate) >=year(current_date()-1)-2
               AND d.channel = 'SPLC'
               AND
        name: BVSTG_1AU10_RETAIL_RFG_EXTRACT
        noLinkRefs: []
