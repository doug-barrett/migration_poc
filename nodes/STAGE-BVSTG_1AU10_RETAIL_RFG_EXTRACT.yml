      - aliases:
          V_DLBV_CFA_REVIEWS_CURRENT: 4c441282-0154-4342-8ed7-b1d9feecb4fd
          DS_BVSTG_AU2_RETAIL_RFG_EXTRACT: 4bd97625-763f-4b1e-991f-bbdc58e7262c
