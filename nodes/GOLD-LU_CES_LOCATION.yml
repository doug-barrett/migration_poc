      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'CV_model_FIN_ORGANIZATION') }} "CV_model_FIN_ORGANIZATION"
          	   LEFT OUTER JOIN (
          SELECT   Distinct CV_model_FIN_ORGANIZATION.METRO,
          	   COALESCE(SUM(AMOUNT_UNITS_ACTIVITY),0) Head
          FROM {{ ref('GOLD', 'FIN_BALANCES_DTL') }} "FIN_BALANCES_DTL"
          
          LEFT OUTER JOIN {{ ref('GOLD', 'CV_model_FIN_ORGANIZATION') }} "CV_model_FIN_ORGANIZATION"
          ON FIN_BALANCES_DTL.ORG_KEY=CV_model_FIN_ORGANIZATION.ORG_KEY
          WHERE    BAL_DATE IN (
          SELECT	Calendar_Month
          FROM	"DOUG_POC"."DP001"."CV_FISCAL_MONTH"
          WHERE	Calendar_Month BETWEEN
          EXTRACT (YEAR FROM ADD_MONTHS(CURRENT_DATE - 1 ,-4)) * 100 + EXTRACT (MONTH FROM ADD_MONTHS(CURRENT_DATE - 1 ,
          	-4))
          AND EXTRACT (YEAR FROM ADD_MONTHS(CURRENT_DATE - 1 ,-1)) * 100 + EXTRACT (MONTH FROM ADD_MONTHS(CURRENT_DATE - 1 ,
          	-1)))
          AND      Detail_Account IN (99318, 99319, 99320, 99321, 99322,
          	99328)
          AND      Sub_Account BETWEEN 1 AND 5
          AND      Scenario = 'A'
          GROUP BY CV_model_FIN_ORGANIZATION.METRO
          
          ) Units
          ON CV_model_FIN_ORGANIZATION.METRO=Units.METRO
