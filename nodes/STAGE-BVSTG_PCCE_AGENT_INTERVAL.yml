        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_PCCE_AGENT_INTERVAL_CURRENT
          - locationName: STAGE
            nodeName: DS_BVSTG_PCCE_AGENT
          - locationName: STAGE
            nodeName: V_S_BOE_TJ_EMPLOYEE_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_PCCE_AGENT_SKILL_GROUP_INTERVAL_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_DLBV_PCCE_AGENT_INTERVAL_CURRENT') }} v_dlbv_pcce_agent_interval_current
              JOIN {{ ref('STAGE','DS_BVSTG_PCCE_AGENT') }} ds_bvstg_pcce_agent
                ON v_dlbv_pcce_agent_interval_current.skilltargetid = ds_bvstg_pcce_agent.skilltargetid
              LEFT JOIN {{ ref('STAGE','V_S_BOE_TJ_EMPLOYEE_CURRENT') }} v_s_boe_tj_employee_current
                ON v_s_boe_tj_employee_current.AGENTSKILLTARGETID = v_dlbv_pcce_agent_interval_current.SKILLTARGETID
              LEFT JOIN (
                    SELECT DATETIME,
                           SKILLTARGETID,
                           SUM(ABANDONRINGCALLS) AS ABANDONRINGCALLS,
                           SUM(ABANDONRINGTIME) AS ABANDONRINGTIME,
                           SUM(ABANDONHOLDCALLS) AS ABANDONHOLDCALLS,
                           SUM(AGENTOUTCALLSTIME) AS AGENTOUTCALLSTIME,
                           SUM(AGENTOUTCALLSTALKTIME) AS AGENTOUTCALLSTALKTIME,
                           SUM(AGENTOUTCALLS) AS AGENTOUTCALLS,
                           SUM(AGENTOUTCALLSONHOLD) AS AGENTOUTCALLSONHOLD,
                           SUM(AGENTOUTCALLSONHOLDTIME) AS AGENTOUTCALLSONHOLDTIME,
                           SUM(AGENTTERMINATEDCALLS) AS AGENTTERMINATEDCALLS,
                           SUM(ANSWERWAITTIME) AS ANSWERWAITTIME,
                           SUM(AVAILTIME) AS AVAILTIME,
                           SUM(BUSYOTHERTIME) AS BUSYOTHERTIME,
                           SUM(CALLSANSWERED) AS CALLSANSWERED,
                           SUM(CALLSHANDLED) AS CALLSHANDLED,
                           SUM(HANDLEDCALLSTALKTIME) AS HANDLEDCALLSTALKTIME,
                           SUM(HANDLEDCALLSTIME) AS HANDLEDCALLSTIME,
                           SUM(HOLDTIME) AS HOLDTIME,
                           SUM(INCOMINGCALLSONHOLDTIME) AS INCOMINGCALLSONHOLDTIME,
                           SUM(INCOMINGCALLSONHOLD) AS INCOMINGCALLSONHOLD,
                           SUM(INTERNALCALLSONHOLDTIME) AS INTERNALCALLSONHOLDTIME,
                           SUM(INTERNALCALLSONHOLD) AS INTERNALCALLSONHOLD,
                           SUM(INTERNALCALLSRCVDTIME) AS INTERNALCALLSRCVDTIME,
                           SUM(INTERNALCALLSRCVD) AS INTERNALCALLSRCVD,
                           SUM(INTERNALCALLSTIME) AS INTERNALCALLSTIME,
                           SUM(INTERNALCALLS) AS INTERNALCALLS,
                           SUM(LOGGEDONTIME) AS LOGGEDONTIME,
                           SUM(RESERVEDSTATETIME) AS RESERVEDSTATETIME,
                           SUM(TALKINTIME) AS TALKINTIME,
                           SUM(TALKOTHERTIME) AS TALKOTHERTIME,
                           SUM(TALKOUTTIME) AS TALKOUTTIME,
                           SUM(TRANSFERREDINCALLSTIME) AS TRANSFERREDINCALLSTIME,
                           SUM(TRANSFERREDINCALLS) AS TRANSFERREDINCALLS,
                           SUM(TRANSFERREDOUTCALLS) AS TRANSFERREDOUTCALLS,
                           SUM(WORKNOTREADYTIME) AS WORKNOTREADYTIME,
                           SUM(WORKREADYTIME) AS WORKREADYTIME
                      FROM {{ ref('STAGE','V_DLBV_PCCE_AGENT_SKILL_GROUP_INTERVAL_CURRENT') }}
                     GROUP BY DATETIME,
                              SKILLTARGETID
                   ) v_dlbv_pcce_agent_skill_group_interval_current
                ON v_dlbv_pcce_agent_skill_group_interval_current.DATETIME= v_dlbv_pcce_agent_interval_current.DATETIME
               AND v_dlbv_pcce_agent_skill_group_interval_current.SKILLTARGETID=v_dlbv_pcce_agent_interval_current.SKILLTARGETID
             WHERE 1=1
               AND (('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,v_dlbv_pcce_agent_interval_current.dss_create_time,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Cisco_Refresh_Days }}') OR ('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND TO_DATE(v_dlbv_pcce_agent_interval_current.dss_create_time) = TO_DATE(CURRENT_DATE()))) QUALIFY ROW_NUMBER() OVER (PARTITION BY v_dlbv_pcce_agent_interval_current.datetime,v_dlbv_pcce_agent_interval_current.skilltargetid ORDER BY v_dlbv_pcce_agent_interval_current.datetime,v_dlbv_pcce_agent_interval_current.skilltargetid) = 1
        name: BVSTG_PCCE_AGENT_INTERVAL
        noLinkRefs: []
