        join:
          joinCondition: |-
            FROM (SELECT ds_ram_retail_repository.PolicyNumber,
                   ds_bvstg_comm_policynumberformatting_allsources.CarrierName_EDW,
                   ds_bvstg_comm_policynumberformatting_allsources.PolicyNumberFormatted,
                   ds_bvstg_comm_policynumberformatting_allsources.CarrierName,
                   ds_bvstg_comm_policynumberformatting_allsources.Carrierdisplayname,
