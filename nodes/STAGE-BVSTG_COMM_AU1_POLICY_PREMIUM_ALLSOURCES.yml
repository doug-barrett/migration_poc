                   ds_ram_retail_repository.TransactionDate,
                   ds_ram_retail_repository.TransactionMonth,
                   ds_ram_retail_repository.writtenpremiumamount,
                   ds_ram_retail_repository.currentpremiumamount
              FROM (SELECT DISTINCT PolicyNumber,
                   CarrierName,
                   transactiondate AS transactiondate_tmz,
                   to_date(transactiondate) TransactionDate,
                   date_trunc('month', transactiondate) transactionMonth,
                   CASE WHEN CAST(CAST (WrittenPremiumAmount AS INT) AS VARCHAR)=POLICYNUMBER -- Updated calculation to exclude extremely high WP 9/26                     OR WrittenPremiumAmount >1000000 THEN  AMOUNT                       ELSE  WRITTENPREMIUMAMOUNT END AS writtenpremiumamount,                     --writtenpremiumamount,                      currentpremiumamount  //     from "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"       from {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}       where trim(PolicyNumber) <> ''             and PolicyNumber is not null             --and upper(trim(label)) like '%NEW BUSINESS%'             and label in ('New Business Auto', 'New Business Complementary')            and counter = 1            and writtenpremiumamount is not null                   and to_date(transactiondate)<= current_date()      --and sourcedb not in ('Velox','InsuredMine')        and (islegacytransaction is null or islegacytransaction <> 'Migrated')) ds_ram_retail_repository    left join         (select distinct PolicyNumber_EDW,                          CarrierName_EDW,                          PolicyNumberFormatted,                          CarrierName_Mapped CarrierName, carrierdisplayname  //       from "DATA_LAKE"."BIA_ANALYTICS"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF") ds_bvstg_comm_policynumberformatting_allsources         from {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}) ds_bvstg_comm_policynumberformatting_allsources          on ds_bvstg_comm_policynumberformatting_allsources.PolicyNumber_EDW = ds_ram_retail_repository.PolicyNumber             and ds_bvstg_comm_policynumberformatting_allsources.CarrierName_EDW = ds_ram_retail_repository.CarrierName    ) ds_ram_retail_repository      inner join (select distinct policynumberformatted, carrier  //                from "DATA_LAKE"."BIA_ANALYTICS"."DS_COMM_EOM_EXTRACT_ALLSOURCES"                  from {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}                 ) ds_comm_eom_extract_allsources           on ds_comm_eom_extract_allsources.policynumberformatted = ds_ram_retail_repository.policynumberformatted               and ds_comm_eom_extract_allsources.carrier = ds_ram_retail_repository.carrierdisplayname  qualify row_number() over (partition by ds_ram_retail_repository.policynumberformatted, ds_ram_retail_repository.carrierdisplayname                              order by ds_ram_retail_repository.transactiondate_tmz, ds_ram_retail_repository.WRITTENPREMIUMAMOUNT desc) =1
        name: BVSTG_COMM_AU1_POLICY_PREMIUM_ALLSOURCES
