        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU1_STORE_EVALUATION
          - locationName: STAGE
            nodeName: V_PRED_MONTHS
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT officecode,
                           min_month,
                           max_month,

                     MONTH
                      FROM (
                            SELECT officecode,
                                   min_month,
                                   max_month
                              FROM (
                                    SELECT DISTINCT officecode,
                                           min(asofmonth) min_month,
                                           max(asofmonth) max_month
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU1_STORE_EVALUATION') }}
                                     GROUP BY officecode
                                   )
                           )bvstg_comm_au1_store_evaluation
                      FULL OUTER JOIN (
                            SELECT DISTINCT to_date(min_date)
                             MONTH
                              FROM {{ ref('STAGE','V_PRED_MONTHS') }}
                             WHERE min_date>=dateadd(YEAR,-3,date_trunc('year',current_date()))
                               AND min_date<=date_trunc('month',current_date())
                           )
                     WHERE
                     MONTH<=max_month
                       AND
                     MONTH>=min_month
                   ) v_pred_months
              LEFT JOIN {{ ref('STAGE','BVSTG_COMM_AU1_STORE_EVALUATION') }} bvstg_comm_au1_store_evaluation
                ON bvstg_comm_au1_store_evaluation.officecode=v_pred_months.officecode
               AND bvstg_comm_au1_store_evaluation.asofmonth=v_pred_months.month
        name: BVSTG_COMM_AU2_STORE_EVALUATION
        noLinkRefs: []
