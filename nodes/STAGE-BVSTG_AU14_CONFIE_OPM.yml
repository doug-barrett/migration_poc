        join:
          joinCondition: |-
            FROM (
                    SELECT all_year.UD2ID,
                           all_year.ud1id,
                           yearid,
                           accountid,
                           accountid_mapping.accounts_mapped,

                     MONTH,
                           sum(ifnull(values_month,0)) Values_Month
                      FROM {{ ref('STAGE','BVSTG_AU11_CSPR') }} all_year UNPIVOT (values_month FOR MONTH IN (M1VALUE,M2VALUE,M3VALUE,M4VALUE,M5VALUE,M6VALUE,M7VALUE,M8VALUE,M9VALUE,M10VALUE,M11VALUE,M12VALUE))
                      LEFT JOIN (
                            SELECT DISTINCT childid,
                                   accounts_mapped
                              FROM {{ ref('STAGE','BVSTG_AU13_CSPR') }}
                           ) accountid_mapping
                        ON all_year.accountid=accountid_mapping.childid //
                     WHERE // accountid_mapping.accounts_mapped IS NOT NULL
                     GROUP BY all_year.UD2ID,
                              all_year.ud1id,
                              yearid,
                              accountid,

                        MONTH,
                              accountid_mapping.accounts_mapped
                   ) AS BVSTG_AU11_CSPR
