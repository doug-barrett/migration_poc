    sourceMapping:
      - aliases:
          V_PREB_PCCE_OPM_SCORECARD_AGENT_INTERVAL: ab9c3556-d7be-420d-ad73-4f05a433a0c8
          STAGE_INTERVALS: e5aec9dc-38f0-443e-b8d2-53ab340464ae
          DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS: 64f9ad9d-906e-46b3-8b70-a738b22b9d5c
          DS_PCCE_SKILL_PQUEUE_MAPPING: 9b261141-77ef-4b17-be8f-0d0d5d8d9668
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_OPM_SCORECARD_AGENT_INTERVAL') }} AS SELECT ds_pcce_skill_pqueue_mapping.SKILL_QUEUE AS SKILL_QUEUE ,
                   ds_pcce_skill_pqueue_mapping.LEVEL1 ,
                   ds_pcce_skill_pqueue_mapping.LEVEL2 ,
                   ds_pcce_skill_pqueue_mapping.LEVEL3 ,
                   ds_pcce_skill_pqueue_mapping.LEVEL4 ,
                   ds_pcce_skill_pqueue_mapping.LEVEL5 ,
                   ds_pcce_agent_historical_all_fields.DATETIME StartDate,
                   SUM(ds_pcce_agent_historical_all_fields.AGENTLOGGEDONTIME) - SUM(ds_pcce_agent_historical_all_fields.AGENTNOTREADY) AS ProductiveTime,
                   SUM(ds_pcce_agent_historical_all_fields.AGENTNOTREADY) AS NonProductiveTime,
                   SUM(ds_pcce_agent_historical_all_fields.AGENTAVAILTIME) AS AvailableTime,
                   SUM(ds_pcce_agent_historical_all_fields.CALLSHANDLED) AS nEnteredAcd,
                   SUM(ds_pcce_agent_historical_all_fields.CALLSANSWERED) AS nAnsweredAcd,
                   SUM(ds_pcce_agent_historical_all_fields.AACW) AS tAcw,
                   SUM(ds_pcce_agent_historical_all_fields.AGENTLOGGEDONTIME) AS AGENTLOGGEDONTIME,
                   SUM(ds_pcce_agent_historical_all_fields.HOLDTIME) + SUM(ds_pcce_agent_historical_all_fields.INCALLSONHOLDTIME) AS tHoldAcd,
                   SUM(ds_pcce_agent_historical_all_fields.ABANDRINGCALLSTIME) AS tabandonedacd,
                   SUM(ds_pcce_agent_historical_all_fields.WorkReadyTime) AS WorkReadyTime,
                   SUM(ds_pcce_agent_historical_all_fields.WorkNotReadyTime) AS WorkNotReadyTime,
                   SUM(ds_pcce_agent_historical_all_fields.AvailTime) AS AvailTime,
                   SUM(ds_pcce_agent_historical_all_fields.NotReadyTime) AS NotReadyTime,
                   SUM(ds_pcce_agent_historical_all_fields.LoggedOnTime) AS LoggedOnTime,
                   SUM(ds_pcce_agent_historical_all_fields.TALKTIME) AS TALKTIME,
                   SUM(ds_pcce_agent_historical_all_fields.talkautoouttime) AS talkautoouttime,
                   SUM(ds_pcce_agent_historical_all_fields.talkpreviewtime) AS talkpreviewtime,
                   SUM(ds_pcce_agent_historical_all_fields.talkreservetime) AS talkreservetime,
                   SUM(ds_pcce_agent_historical_all_fields.HOLDTIME) AS HOLDTIME
              FROM (
                    SELECT ds_pcce_agent_historical_all_fields.DATETIME AS d1,
                           stage_intervals.StartDate DATETIME,
                           ds_pcce_agent_historical_all_fields.Agentname Agentname,
                           ds_pcce_agent_historical_all_fields.SkillGroupName,
                           MAX(ds_pcce_agent_historical_all_fields.AGENTLOGGEDONTIME) AGENTLOGGEDONTIME,
                           MAX(ds_pcce_agent_historical_all_fields.AGENTNOTREADY) AGENTNOTREADY,
                           MAX(ds_pcce_agent_historical_all_fields.AGENTAVAILTIME) AGENTAVAILTIME,
                           MAX(ds_pcce_agent_historical_all_fields.CALLSHANDLED) CALLSHANDLED,
                           MAX(ds_pcce_agent_historical_all_fields.CALLSANSWERED) CALLSANSWERED,
                           MAX(ds_pcce_agent_historical_all_fields.AACW) AS AACW,
                           MAX(ds_pcce_agent_historical_all_fields.HOLDTIME) AS HOLDTIME,
                           MAX(ds_pcce_agent_historical_all_fields.INCALLSONHOLDTIME) AS INCALLSONHOLDTIME,
                           MAX(ds_pcce_agent_historical_all_fields.ABANDRINGCALLSTIME) AS ABANDRINGCALLSTIME,
                           MAX(ds_pcce_agent_historical_all_fields.WorkReadyTime) AS WorkReadyTime,
                           MAX(ds_pcce_agent_historical_all_fields.WorkNotReadyTime) AS WorkNotReadyTime,
                           MAX(ds_pcce_agent_historical_all_fields.AvailTime) AS AvailTime,
                           MAX(ds_pcce_agent_historical_all_fields.NotReadyTime) AS NotReadyTime,
                           MAX(ds_pcce_agent_historical_all_fields.LoggedOnTime) AS LoggedOnTime,
                           MAX(ds_pcce_agent_historical_all_fields.TALKTIME) AS TALKTIME,
                           MAX(ds_pcce_agent_historical_all_fields.talkautoouttime) AS talkautoouttime,
                           MAX(ds_pcce_agent_historical_all_fields.talkpreviewtime) AS talkpreviewtime,
                           MAX(ds_pcce_agent_historical_all_fields.talkreservetime) AS talkreservetime,
                           MIN(ds_pcce_agent_historical_all_fields.DSS_UPDATE_TIME) DSS_UPDATE_TIME
                      FROM {{ ref('STAGE','STAGE_INTERVALS') }} stage_intervals
                      LEFT JOIN {{ ref('EDW','DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS') }} ds_pcce_agent_historical_all_fields
                        ON ds_pcce_agent_historical_all_fields.DATETIME >= stage_intervals.StartDate
                       AND ds_pcce_agent_historical_all_fields.DATETIME < stage_intervals.EndDate
                     WHERE DATE(ds_pcce_agent_historical_all_fields.DATETIME)BETWEEN '2023-01-01' AND DATE(CURRENT_DATE())
                     GROUP BY ds_pcce_agent_historical_all_fields.Agentname,
                              ds_pcce_agent_historical_all_fields.SkillGroupName,
                              ds_pcce_agent_historical_all_fields.DATETIME,
                              stage_intervals.StartDate
                   ) ds_pcce_agent_historical_all_fields
             INNER JOIN (
                    SELECT DISTINCT ds_pcce_skill_pqueue_mapping.SKILL_QUEUE,
                           ds_pcce_skill_pqueue_mapping.LEVEL1,
                           ds_pcce_skill_pqueue_mapping.LEVEL2,
                           ds_pcce_skill_pqueue_mapping.LEVEL3,
                           ds_pcce_skill_pqueue_mapping.LEVEL4,
                           ds_pcce_skill_pqueue_mapping.LEVEL5,
                           ds_pcce_skill_pqueue_mapping.QueueType,
                           ds_pcce_skill_pqueue_mapping.DELETED
                      FROM {{ ref('EDW','DS_PCCE_SKILL_PQUEUE_MAPPING') }}
                   ) ds_pcce_skill_pqueue_mapping
                ON UPPER(ds_pcce_skill_pqueue_mapping.SKILL_QUEUE) = UPPER(ds_pcce_agent_historical_all_fields.SkillGroupName)
             GROUP BY ds_pcce_skill_pqueue_mapping.SKILL_QUEUE ,
                      ds_pcce_skill_pqueue_mapping.LEVEL1 ,
                      ds_pcce_skill_pqueue_mapping.LEVEL2 ,
                      ds_pcce_skill_pqueue_mapping.LEVEL3 ,
                      ds_pcce_skill_pqueue_mapping.LEVEL4 ,
                      ds_pcce_skill_pqueue_mapping.LEVEL5 ,
                      ds_pcce_agent_historical_all_fields.DATETIME
        dependencies:
          - locationName: EDW
            nodeName: DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS
          - locationName: STAGE
            nodeName: STAGE_INTERVALS
          - locationName: EDW
            nodeName: DS_PCCE_SKILL_PQUEUE_MAPPING
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS') }}
            {{ ref('STAGE','STAGE_INTERVALS') }}
