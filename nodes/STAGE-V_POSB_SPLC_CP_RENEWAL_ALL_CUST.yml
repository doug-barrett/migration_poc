        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_CP_RENEWAL_ALL_CUST') }} AS SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.ID
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
             INNER JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION_RWL
                ON DS_SPLC_POLICYTRANSACTION.CUSTOMERID= DS_SPLC_POLICYTRANSACTION_RWL.CUSTOMERID
               AND DS_SPLC_POLICYTRANSACTION_RWL.expirationdate >= DATE(DATEADD(DAY,-30,DATE(DS_SPLC_POLICYTRANSACTION.EFFECTIVEDATE)))
               AND DATE(DS_SPLC_POLICYTRANSACTION_RWL.ReportDate) < DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)
               AND IFNULL(DS_SPLC_POLICYTRANSACTION_RWL.Status,'Expired') IN('Active','Reinstated','Expired')
               AND DS_SPLC_POLICYTRANSACTION.PolicyID != DS_SPLC_POLICYTRANSACTION_RWL.PolicyID
             WHERE DS_SPLC_POLICYTRANSACTION.TranType ='RWL'
        dependencies:
