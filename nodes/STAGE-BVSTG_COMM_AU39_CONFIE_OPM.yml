          - locationName: STAGE
            nodeName: BVSTG_COMM_AU12_CONFIE_OPM
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT au34_confie_opm.asofmonth,
                   au34_confie_opm.POLICYSOURCE_DIMENSION,
                   au20_confie_opm_1.MGA_Revenue_Budget,
                   au20_confie_opm_3.MGA_Revenue_Actuals,
                   au20_confie_opm_2.Retail_Revenue_Budget,
                   au20_confie_opm_4.Total_Confie_Revenue_Budget,
                   au12_confie_opm_4.Total_Confie_Revenue_Actual Total_Confie_Revenue_Actuals,
                   au26_confie_opm_5.OpExp MGA_Operating_Expense_Budget,
                   au26_confie_opm_7.OpExp MGA_Operating_Expense_Actuals,
                   au26_confie_opm_6.OpExp Retail_Operating_Expense_Budget,
                   au26_confie_opm_8.OpExp Retail_Operating_Expense_Actuals,
                   au26_confie_opm_9.OpExp Total_Confie_Operating_Expense_Budget
              FROM ((
                    SELECT asofmonth,
                           POLICYSOURCE_DIMENSION
                      FROM {{ ref('STAGE','BVSTG_COMM_AU34_CONFIE_OPM') }}
                   )au34_confie_opm
              LEFT JOIN (
                    SELECT monthyear asofmonth,
                           'Missing/Total' PolicySource_Dimension,
                           sum(ifnull(ANCILLARY_PRODUCT_REVENUE,0) + ifnull(FEE_REVENUE,0) + ifnull(COMMISSION_REVENUE,0)+ ifnull(COMMISSION_INCOME,0)+ ifnull(OTHER_REVENUE,0)+ ifnull(ADJUSTING_CLAIMS_REVENUE,0)+ ifnull(PREMIUM_FINANCE_REVENUE,0)) AS MGA_Revenue_Budget
                      FROM {{ ref('STAGE','BVSTG_COMM_AU20_CONFIE_OPM') }}
                     WHERE sg_description= 'MGA_Revenue_Budget'
                     GROUP BY monthyear,
                              PolicySource_Dimension
                   ) au20_confie_opm_1
                ON au34_confie_opm.asofmonth = au20_confie_opm_1.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = au20_confie_opm_1.PolicySource_Dimension
              LEFT JOIN (
                    SELECT monthyear asofmonth,
                           'Missing/Total' PolicySource_Dimension,
                           sum(ifnull(ANCILLARY_PRODUCT_REVENUE,0) + ifnull(FEE_REVENUE,0) + ifnull(COMMISSION_REVENUE,0)+ ifnull(COMMISSION_INCOME,0)+ ifnull(OTHER_REVENUE,0)+ ifnull(ADJUSTING_CLAIMS_REVENUE,0)+ ifnull(PREMIUM_FINANCE_REVENUE,0)) AS Retail_Revenue_Budget
                      FROM {{ ref('STAGE','BVSTG_COMM_AU20_CONFIE_OPM') }}
                     WHERE sg_description= 'Retail_Revenue_Budget'
                     GROUP BY monthyear,
                              PolicySource_Dimension
                   ) au20_confie_opm_2
                ON au34_confie_opm.asofmonth = au20_confie_opm_2.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = au20_confie_opm_2.PolicySource_Dimension
              LEFT JOIN (
                    SELECT MONTHYEAR asofmonth,
                           'Missing/Total' PolicySource_Dimension,
                           (ifnull((sum(FEE_REVENUE)),0) + ifnull((sum(ifnull(COMMISSION_REVENUE,0)+ifnull(COMMISSION_INCOME,0))),0) + ifnull((sum(ANCILLARY_PRODUCT_REVENUE)),0) + ifnull((sum(OTHER_REVENUE)) ,0) + ifnull((sum(PREMIUM_FINANCE_REVENUE)),0) + ifnull((sum(ADJUSTING_CLAIMS_REVENUE)),0)) Total_Confie_Revenue_Actual
                      FROM {{ ref('STAGE','BVSTG_COMM_AU12_CONFIE_OPM') }}
                     WHERE sg_description = 'SGA&IT_Revenue'
                     GROUP BY asofmonth,
                              PolicySource_Dimension
                   ) au12_confie_opm_4
                ON au34_confie_opm.asofmonth = au12_confie_opm_4.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = au12_confie_opm_4.PolicySource_Dimension
              LEFT JOIN (
                    SELECT monthyear asofmonth,
                           'Missing/Total' PolicySource_Dimension,
                           sum(ifnull(ANCILLARY_PRODUCT_REVENUE,0) + ifnull(FEE_REVENUE,0) + ifnull(COMMISSION_REVENUE,0)+ ifnull(COMMISSION_INCOME,0)+ ifnull(ADJUSTING_CLAIMS_REVENUE,0)+ ifnull(OTHER_REVENUE,0)+ ifnull(PREMIUM_FINANCE_REVENUE,0)) AS MGA_Revenue_Actuals
                      FROM {{ ref('STAGE','BVSTG_COMM_AU20_CONFIE_OPM') }}
                     WHERE sg_description= 'MGA_Revenue_Actual'
                     GROUP BY monthyear,
                              PolicySource_Dimension
                   ) au20_confie_opm_3
                ON au34_confie_opm.asofmonth = au20_confie_opm_3.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = au20_confie_opm_3.PolicySource_Dimension
              LEFT JOIN (SELECT MONTHYEAR asofmonth,
                   'Missing/Total' PolicySource_Dimension,
                   (ifnull((sum(FEE_REVENUE)),0) + ifnull((sum(ifnull(COMMISSION_REVENUE,0)+ifnull(COMMISSION_INCOME,0))),0) + ifnull((sum(ANCILLARY_PRODUCT_REVENUE)),0) + ifnull((sum(OTHER_REVENUE)) ,0) + ifnull((sum(PREMIUM_FINANCE_REVENUE)),0) + ifnull((sum(ADJUSTING_CLAIMS_REVENUE)),0)) Total_Confie_Revenue_Budget
              FROM {{ ref('STAGE','BVSTG_COMM_AU20_CONFIE_OPM') }}
             WHERE sg_description = 'Total_Confie_Revenue_Budget'
             GROUP BY asofmonth,
                      PolicySource
        name: BVSTG_COMM_AU39_CONFIE_OPM
        noLinkRefs: []
