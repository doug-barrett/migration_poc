        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }} v_s_ap1_lead_mroc_current
              LEFT JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} v_s_ap1_employee_mroc_current
                ON v_s_ap1_lead_mroc_current.createdby=v_s_ap1_employee_mroc_current.userid
               AND v_s_ap1_lead_mroc_current.isrowdeleted=0
               AND v_s_ap1_lead_mroc_current.created >= '2018-01-01'
               AND v_s_ap1_employee_mroc_current.isrowdeleted=0
              LEFT JOIN {{ ref('STAGE','V_S_AP1_OFFICE_MROC_CURRENT') }} v_s_ap1_office_mroc_current
                ON v_s_ap1_employee_mroc_current.officeid=v_s_ap1_office_mroc_current.officeid
               AND v_s_ap1_office_mroc_current.isrowdeleted=0
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU2_CUSTOMER') }} bvstg_ap1_au2_customer
                ON TO_CHAR(v_s_ap1_Lead_mroc_current.customerid)=bvstg_ap1_au2_customer.customerid
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_S_AP1_PHONECALL_MROC_CURRENT') }}
                     WHERE leadid IS NOT NULL
                   ) v_s_ap1_phonecall_mroc_current
                ON v_s_ap1_phonecall_mroc_current.LeadID=v_s_ap1_Lead_mroc_current.LeadID
               AND v_s_ap1_Lead_mroc_current.Created >= v_s_ap1_phonecall_mroc_current.Created
               AND TO_DATE(v_s_ap1_Lead_mroc_current.Created)=TO_DATE(v_s_ap1_phonecall_mroc_current.Created)
              LEFT JOIN {{ ref('STAGE','V_S_AP1_INCOMINGPHONECALL_MROC_CURRENT') }} v_s_ap1_incomingphonecall_mroc_current
                ON v_s_ap1_incomingphonecall_mroc_current.CallID = v_s_ap1_phonecall_mroc_current.CallID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_MASTERLEADCAMPAIGN_MROC_CURRENT') }} v_s_ap1_masterleadcampaign_mroc_current
                ON v_s_ap1_lead_mroc_current.masterleadcampaignid = v_s_ap1_masterleadcampaign_mroc_current.masterleadcampaignid
               AND v_s_ap1_masterleadcampaign_mroc_current.ISACTIVE=TRUE
               AND v_s_ap1_masterleadcampaign_mroc_current.isrowdeleted=0
              LEFT JOIN {{ ref('UNKNOWN','V_S_MKT_CAMPAIGN_MROC_CURRENT') }} v_s_mkt_campaign_mroc_current
                ON v_s_ap1_masterleadcampaign_mroc_current.mediacode = v_s_mkt_campaign_mroc_current.marchex_id
               AND v_s_mkt_campaign_mroc_current.STATUS='1'
              LEFT JOIN (
                    SELECT x.leadid,
                           count(1) prior_leads
                      FROM (
                            SELECT l.leadid,
                                   pl.created
                              FROM {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }} l
                              LEFT JOIN (
                                    SELECT created,
                                           customerId
                                      FROM {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) pl
                                ON pl.created < l.created
                               AND pl.CustomerID= l.CustomerID
                               AND l.isrowdeleted=0
                           ) x
                     GROUP BY x.leadid
                   ) pr_leads
                ON pr_leads.leadid=v_s_ap1_lead_mroc_current.leadid
              LEFT JOIN (
                    SELECT leadid,
                           count(1) Prior_NB_Transactions
                      FROM (
                            SELECT l.leadid,
                                   pr_tr.created
                              FROM {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }} l
                              LEFT JOIN (
                                    SELECT Tr.created,
                                           Tr.CustomerID
                                      FROM {{ ref('STAGE','V_S_AP1_TRANSACTION_MROC_CURRENT') }} Tr
                                     INNER JOIN (
                                            SELECT *
                                              FROM {{ ref('STAGE','V_S_AP1_ORGANIZATIONTRANSACTIONSTATUSTYPE_MROC_CURRENT') }}
                                             WHERE isrowdeleted=0
                                           ) OrTrStTy
                                        ON (Tr.Transactionstatustypeid = OrTrStTy.Organizationtransactionstatustypeid AND OrTrStTy.Key <> 'New' AND tr.isrowdeleted=0)
                                     WHERE Tr.CreatedBy NOT IN (2,1101)
                                   ) pr_tr
                                ON pr_tr.created < l.created
                               AND pr_tr.CustomerID= l.CustomerID
                               AND l.isrowdeleted=0
                           ) x
                     GROUP BY leadid
                   ) prior_trans
                ON prior_trans.leadid=v_s_ap1_Lead_mroc_current.leadid
