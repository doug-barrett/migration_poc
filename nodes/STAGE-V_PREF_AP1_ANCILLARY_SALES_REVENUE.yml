    sourceMapping:
      - aliases:
          V_PREF_AP1_ANCILLARY_SALES_REVENUE: c38b3dfc-159f-496c-a4a1-a04f9592e251
          BVSTG_AP1_TRANSACTIONSUMMARY: 1ecf184d-2c34-4547-aff8-73851c98894b
          BVSTG_AP1_AU_ANCILLARYPRODUCT: 5288a6a7-6974-48c4-8ab1-be26881c9050
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREF_AP1_ANCILLARY_SALES_REVENUE') }} AS SELECT TransactionType ,
                   a.term ,
                   a.CustomerID ,
                   isLegacyTransaction ,
                   TO_DATE(a.created) AS Date ,
                   CASE WHEN isesign = 1 THEN 'ESIGN'
                        WHEN isezbuy = 1 THEN 'EZBUY'
                        ELSE 'Unknown'
                         END TransactionMethod ,
                   cast(Mastercarrierid AS VARCHAR(50)) Mastercarrierid ,
                   PrimaryAgentNumber AS EmployeeNumber ,
                   CASE WHEN lineofbusinesstype IS NULL OR lineofbusinesstype='' THEN 'Unknown'
                        ELSE UPPER(lineofbusinesstype)
                         END AS lineofbusinesstype ,
                   BIAPRIMARYAGENTOFFICE AS OfficeCode ,
                   CASE WHEN transactiontype IN('New Business','Renewal','Renewal Payment') THEN PolicyID
                        ELSE 0
                         END AS PolicyID ,
                   0 AS Quotes ,
                   0 AS Leads ,
                   0 AS Paid ,
                   0 AS reinstatements ,
                   0 AS current_premium ,
                   0 AS carrier_premium ,
                   0 AS cancelled_premium ,
                   0 AS reinstate_premium ,
                   0 AS written_premium ,
                   0 AS carrier_submit_premium ,
                   0 AS voided_written_premium ,
                   0 AS voided_carrier_submit_premium ,
                   0 AS rewrites ,
                   0 AS endorsements ,
                   0 AS cancellations ,
                   0 AS monthly_payments ,
                   0 AS voided_rewrites ,
                   0 AS voided_endorsements ,
                   0 AS voided_monthly_payments ,
                   0 AS new_sales ,
                   0 AS new_auto_sales ,
                   0 AS new_non_auto_sales ,
                   SUM(CASE WHEN a.transactiontype = 'New Business' THEN 1 ELSE 0 END) AS new_ancillary_sales ,
                   0 AS renewal_sales ,
                   0 AS renewal_auto_sales ,
                   0 AS renewal_non_auto_sales ,
                   SUM(CASE WHEN a.transactiontype IN ('Renewal','Renewal Payment') THEN 1 ELSE 0 END) AS renewal_ancillary_sales ,
                   0 AS voided_new_sales ,
                   0 AS voided_new_auto_sales ,
                   0 AS voided_new_non_auto_sales ,
                   0 AS voided_new_ancillary_sales ,
                   0 AS voided_renewal_sales ,
                   0 AS voided_renewal_auto_sales ,
                   0 AS voided_renewal_non_auto_sales ,
                   0 AS voided_renewal_ancillary_sales ,
                   0 AS new_fee_revenue ,
                   0 AS endorsement_revenue ,
                   0 AS monthly_payment_revenue ,
                   0 AS reinstatement_revenue ,
                   0 AS documentation_revenue ,
                   0 AS renewal_fee_revenue ,
                   SUM(b.EnteredAmount) AS ancillary_revenue ,
                   SUM(b.companycost) AS ancillary_cost ,
                   0 AS voided_new_fee_revenue ,
                   0 AS voided_endorsement_revenue ,
                   0 AS voided_monthly_payment_revenue ,
                   0 AS voided_reinstatement_revenue ,
                   0 AS voided_documentation_revenue ,
                   0 AS voided_renewal_fee_revenue ,
                   0 AS voided_ancillary_revenue ,
                   0 AS voided_ancillary_cost ,
                   0 AS payment_received ,
                   0 AS voided_payment ,
                   0 AS credit_extended ,
                   0 AS credit_collected ,
                   0 AS refund ,
                   0 AS goals_auto_policy_sales ,
                   0 AS goals_new_revenue
              FROM {{ ref('STAGE','BVSTG_AP1_TRANSACTIONSUMMARY') }} a
             INNER JOIN {{ ref('STAGE','BVSTG_AP1_AU_ANCILLARYPRODUCT') }} b
                ON (a.TransactionID = b.transactionID)
             WHERE a.Transactiontype IN ('New Business', 'Additional Products', 'Renewal Payment')
             GROUP BY a.TransactionType ,
                      a.term ,
                      a.CustomerID ,
                      a.isLegacyTransaction ,
                      TO_DATE(a.created) ,
                      CASE WHEN a.isesign = 1 THEN 'ESIGN'
                           WHEN a.isezbuy = 1 THEN 'EZBUY'
                           ELSE 'Unknown'
                            END ,
                      cast(a.Mastercarrierid AS VARCHAR(50)) ,
                      a.PrimaryAgentNumber ,
                      CASE WHEN a.lineofbusinesstype IS NULL OR a.lineofbusinesstype='' THEN 'Unknown'
                           ELSE UPPER(a.lineofbusinesstype)
                            END ,
                      a.BIAPRIMARYAGENTOFFICE ,
                      CASE WHEN a.transactiontype IN('New Business','Renewal','Renewal Payment') THEN a.PolicyID
                           ELSE 0
                            END
             UNION --Ancillary voided
             SELECT TransactionType ,
                   a.term ,
                   a.CustomerID ,
                   isLegacyTransaction ,
                   TO_DATE(VoidedOn) AS Date ,
                   CASE WHEN isesign = 1 THEN 'ESIGN'
                        WHEN isezbuy = 1 THEN 'EZBUY'
                        ELSE 'Unknown'
                         END TransactionMethod ,
                   cast(Mastercarrierid AS VARCHAR(50)) Mastercarrierid ,
                   PrimaryAgentNumber AS EmployeeNumber ,
                   CASE WHEN lineofbusinesstype IS NULL OR lineofbusinesstype='' THEN 'Unknown'
                        ELSE UPPER(lineofbusinesstype)
                         END AS lineofbusinesstype ,
                   TransactionOfficeCode AS OfficeCode ,
                   CASE WHEN transactiontype IN('New Business','Renewal','Renewal Payment') THEN PolicyID
                        ELSE 0
                         END AS PolicyID ,
                   0 AS Quotes ,
                   0 AS Leads ,
                   0 AS Paid ,
                   0 AS reinstatements ,
                   0 AS current_premium ,
                   0 AS carrier_premium ,
                   0 AS cancelled_premium ,
                   0 AS reinstate_premium ,
                   0 AS written_premium ,
                   0 AS carrier_submit_premium ,
                   0 AS voided_written_premium ,
                   0 AS carrier_submit_premium ,
                   0 AS rewrites ,
                   0 AS endorsements ,
                   0 AS cancellations ,
                   0 AS monthly_payments ,
                   0 AS voided_rewrites ,
                   0 AS voided_endorsements ,
                   0 AS voided_monthly_payments ,
                   0 AS new_sales ,
                   0 AS new_auto_sales ,
                   0 AS new_non_auto_sales ,
                   0 AS new_ancillary_sales ,
                   0 AS renewal_sales ,
                   0 AS renewal_auto_sales ,
                   0 AS renewal_non_auto_sales ,
                   0 AS renewal_ancillary_sales ,
                   0 AS voided_new_sales ,
                   0 AS voided_new_auto_sales ,
                   0 AS voided_new_non_auto_sales ,
                   SUM(CASE WHEN a.transactiontype = 'New Business' THEN 1 ELSE 0 END) AS new_ancillary_sales ,
                   0 AS voided_renewal_sales ,
                   0 AS voided_renewal_auto_sales ,
                   0 AS voided_renewal_non_auto_sales ,
                   0 AS voided_renewal_ancillary_sales ,
                   0 AS new_fee_revenue ,
                   0 AS endorsement_revenue ,
                   0 AS monthly_payment_revenue ,
                   0 AS reinstatement_revenue ,
                   0 AS documentation_revenue ,
                   0 AS renewal_fee_revenue ,
                   0 AS ancillary_revenue ,
                   0 AS ancillary_cost ,
                   0 AS voided_new_fee_revenue ,
                   0 AS voided_endorsement_revenue ,
                   0 AS voided_monthly_payment_revenue ,
                   0 AS voided_reinstatement_revenue ,
                   0 AS voided_documentation_revenue ,
                   0 AS voided_renewal_fee_revenue ,
                   SUM(b.EnteredAmount) AS ancillary_revenue ,
                   SUM(b.companycost) AS ancillary_cost ,
                   0 AS payment_received ,
                   0 AS voided_payment ,
                   0 AS credit_extended ,
                   0 AS credit_collected ,
                   0 AS refund ,
                   0 AS goals_auto_policy_sales ,
                   0 AS goals_new_revenue
              FROM {{ ref('STAGE','BVSTG_AP1_TRANSACTIONSUMMARY') }} a
             INNER JOIN {{ ref('STAGE','BVSTG_AP1_AU_ANCILLARYPRODUCT') }} b
                ON (a.TransactionID = b.transactionID)
             WHERE a.isVoid = 1
               AND a.Transactiontype IN ('New Business', 'Additional Products', 'Renewal Payment')
             GROUP BY a.TransactionType ,
                      a.term ,
                      a.CustomerID ,
                      a.isLegacyTransaction ,
                      TO_DATE(a.VoidedOn) ,
                      CASE WHEN a.isesign = 1 THEN 'ESIGN'
                           WHEN a.isezbuy = 1 THEN 'EZBUY'
                           ELSE 'Unknown'
                            END ,
                      cast(a.Mastercarrierid AS VARCHAR(50)) ,
                      a.PrimaryAgentNumber ,
                      CASE WHEN a.lineofbusinesstype IS NULL OR a.lineofbusinesstype='' THEN 'Unknown'
                           ELSE UPPER(a.lineofbusinesstype)
                            END ,
                      a.TransactionOfficeCode ,
                      CASE WHEN a.transactiontype IN('New Business','Renewal','Renewal Payment') THEN PolicyID
                           ELSE 0
                            END
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: BVSTG_AP1_AU_ANCILLARYPRODUCT
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','BVSTG_AP1_TRANSACTIONSUMMARY') }}
            {{ ref('STAGE','BVSTG_AP1_AU_ANCILLARYPRODUCT') }}
        name: V_PREF_AP1_ANCILLARY_SALES_REVENUE
        noLinkRefs: []
