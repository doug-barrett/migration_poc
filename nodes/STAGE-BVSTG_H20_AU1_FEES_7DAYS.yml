    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BVSTG_H20_LAPSE_MODEL_REFRESH: 206782f5-002f-4b74-b148-4ea350171464
          DS_RAM_RETAIL_REPOSITORY: 39a9b6bb-124a-4925-91e8-c1b9157d7e95
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: UNKNOWN
            nodeName: DS_RAM_RETAIL_REPOSITORY_T
          - locationName: STAGE
            nodeName: BVSTG_H20_LAPSE_MODEL_REFRESH
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_H20_LAPSE_MODEL_REFRESH') }} bvstg_h20_lapse_model_refresh
             INNER JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} DS_RAM_RETAIL_REPOSITORY_t
                ON DS_RAM_RETAIL_REPOSITORY_t.PolicyID = bvstg_h20_lapse_model_refresh.PolicyID
               AND DS_RAM_RETAIL_REPOSITORY_t.SourceDB = bvstg_h20_lapse_model_refresh.SourceDB
               AND DATE(DS_RAM_RETAIL_REPOSITORY_t.CREATEDDATE) BETWEEN DATE(bvstg_h20_lapse_model_refresh.STARTDATE) AND DATEADD(DAY,7,DATE(bvstg_h20_lapse_model_refresh.STARTDATE))
              LEFT JOIN (
                    SELECT ds_ram_retail_repository.policyID ,
                           left(listagg(CASE WHEN Classification IN ('Fee','Service Transactions Fee','Fee Count') THEN label ELSE NULL END, ','), 1000) AS FeeTypeslist ,
                           left(listagg(CASE WHEN Classification IN ('Fee','Service Transactions Fee','Fee Count') THEN Amount ELSE NULL END, ','), 1000) AS Amountslist ,
                           SUM(CASE WHEN Classification = 'Ancillary' THEN Counter ELSE 0 END) AS Total_Ancillary_Count ,
                           SUM(CASE WHEN Classification = 'Ancillary' THEN Amount ELSE 0 END) AS Total_Ancillary_Amt ,
                           SUM(CASE WHEN Label = 'Agency Fee' THEN Amount ELSE 0 END) AS Agency_Fee_Amt ,
                           SUM(CASE WHEN Label = 'Broker Fee' THEN Amount ELSE 0 END) AS Broker_Fee_Amt ,
                           SUM(CASE WHEN Label = 'Documentation Fee' THEN Amount ELSE 0 END) AS Documentation_Fee_Amt ,
                           SUM(CASE WHEN Label = 'Endorsements Fee' THEN Amount ELSE 0 END) AS Endorsements_Fee_Amt ,
                           SUM(CASE WHEN Label = 'Monthly Payments Fee' THEN Amount ELSE 0 END) AS Monthly_Payments_Fee_Amt ,
                           SUM(CASE WHEN Label = 'NSF Fee' THEN Amount ELSE 0 END) AS NSF_Fee_Amt ,
                           SUM(CASE WHEN Label = 'Other Revenue' THEN Amount ELSE 0 END) AS Other_Fees_Amt ,
                           SUM(CASE WHEN Label = 'Reinstatement Fee' THEN Amount ELSE 0 END) AS Reinstatement_Fee_Amt ,
                           SUM(CASE WHEN Label = 'Renewal Fee' THEN Amount ELSE 0 END) AS Renewal_Fee_Amt ,
                           SUM(CASE WHEN Classification IN ('Fee','Service Transactions Fee','Fee Count') THEN Counter ELSE 0 END) AS Total_Fee_Count ,
                           SUM(CASE WHEN Classification IN ('Fee','Service Transactions Fee') THEN Amount ELSE 0 END) AS Total_Fee_Amt ,
                           SUM(CASE WHEN Classification = 'Service Transactions Fee' THEN Amount ELSE 0 END) AS Total_ServiceTransactionsFee_Amt ,
                           SUM(CASE WHEN Label = 'DMV Fee' THEN Amount ELSE 0 END) AS DMV_Fee_Amt ,
                           SUM(CASE WHEN Label = 'MVR Fee' THEN Amount ELSE 0 END) AS MVR_Fee_Amt ,
                           SUM(CASE WHEN Label = 'Inspection Fee' THEN Amount ELSE 0 END) AS Inspection_Fee_Amt ,
                           SUM(CASE WHEN Label = 'SR-22 Fee' THEN Amount ELSE 0 END) AS SR22_Fee_Amt ,
                           SUM(CASE WHEN Label = 'SVC/Copy Fee' THEN Amount ELSE 0 END) AS SVC_Copy_Fee_Amt ,
                           SourceDB
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                     WHERE IFNULL(BiaPrimaryTransactionOffice,'') != 'JOR'
                       AND TO_DATE(CreatedDate)>'2020-01-01'
                       AND SourceDB IN ('AppOne','CIGH')
                     GROUP BY policyID,
                              sourcedb
                   ) DS_RAM_RETAIL_REPOSITORY
                ON DS_RAM_RETAIL_REPOSITORY.PolicyID = bvstg_h20_lapse_model_refresh.PolicyID
             WHERE DS_RAM_RETAIL_REPOSITORY_t.label = 'New Business Auto'
               AND DS_RAM_RETAIL_REPOSITORY_t.SourceDB IN ('AppOne','CIGH')
