        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_MKT_VALID_CALLID_B') }} AS SELECT LeadID,
                   callid,
                   TRUE isValid
              FROM (
                    SELECT LeadID,
                           CallID,
                           DATEDIFF(SECOND,CallDate,lead_Created),
                           (Rank() OVER (PARTITION BY LeadID ORDER BY DATEDIFF(SECOND,CallDate,lead_Created) DESC)) ranking
                      FROM {{ ref('STAGE','BVSTG_MKT_AU3C_LEADSOURCE') }}
                     WHERE LeadSource='Phone AppOne'
                       AND (LEFT(PhoneNumber,3) = LEFT(HomePhone,3) OR LEFT(CellPhone,3) = LEFT(PhoneNumber,3) OR LEFT(ContactPhone,3) = LEFT(PhoneNumber,3))
                       AND leadid NOT IN (
                            SELECT LeadID
                              FROM {{ ref('STAGE','V_MKT_VALID_LEADID_A') }}
                             UNION SELECT LeadID
                              FROM {{ ref('STAGE','V_MKT_VALID_CALLID_A') }}
                           )
                   )
             WHERE ranking=1
        dependencies:
