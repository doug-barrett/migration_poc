          BVSTG_COMM_AU3_POLICY_STATUS_EXTRACT_CDT: 7a47ebe3-f120-439e-8334-02427d470cc1
          V_PRED_MONTHS: ae944c3a-4867-4559-b5a6-92a3211e7fa8
          BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT: acef8403-256e-4753-830f-cb3d047d4000
        customSQL:
