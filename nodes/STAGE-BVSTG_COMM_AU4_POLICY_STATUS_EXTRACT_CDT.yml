        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU3_POLICY_STATUS_EXTRACT_CDT
          - locationName: STAGE
            nodeName: V_PRED_MONTHS
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT
        join:
          joinCondition: |-
            FROM (
                    SELECT *
                      FROM (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_COMM_AU3_POLICY_STATUS_EXTRACT_CDT') }} bvstg_comm_au3_policy_status_extract_cdt
                             WHERE year(enddate)>=2019
                           ) bvstg_comm_au3_policy_status_extract_cdt
                     CROSS JOIN (
                            SELECT DISTINCT to_date(min_date) cutoffdate_min,
                                   to_date(max_date) cutoffdate_max
                              FROM {{ ref('STAGE','V_PRED_MONTHS') }} V_PRED_MONTHS
                             WHERE CAL_YEAR >='2008'
                               AND CAL_YEAR <= year(dateadd(YEAR, 3, to_date(current_date())))
                           ) date_master
                     WHERE cutoffdate_min >= date_trunc('month', startdate)
                       AND cutoffdate_min <= date_trunc('month', enddate)
                       AND policynumberformatted IN (
                            SELECT DISTINCT policynumberformatted
                              FROM (
                                    SELECT DISTINCT policynumberformatted,
                                           carriername
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU3_POLICY_STATUS_EXTRACT_CDT') }}
                                     WHERE year(expirationdate) >= 2019
                                       AND year(expirationdate) <= year(add_months(current_date(),12))
                                   )
                           )
                   )bvstg_comm_au3_policy_status_extract_cdt
              LEFT JOIN (
                    SELECT DISTINCT policynumberformatted,
                           carriername,
                           date_trunc('month', created) CreatedMonth,
                           max(CASE WHEN transaction_group = 'Cancellation' THEN 1 ELSE 0 END) AS is_cancellation_txn,
                           max(CASE WHEN transaction_group = 'Endorsement' THEN 1 ELSE 0 END) AS is_endorsement_txn,
                           max(CASE WHEN transaction_group = 'New Business' THEN 1 ELSE 0 END) AS is_nbs_txn,
                           max(CASE WHEN transaction_group = 'Other-Active' THEN 1 ELSE 0 END) AS is_other_active_txn,
                           max(CASE WHEN transaction_group = 'Other-Inactive' THEN 1 ELSE 0 END) AS is_other_inactive_txn,
                           max(CASE WHEN transaction_group = 'Reinstatement' THEN 1 ELSE 0 END) AS is_reinstatement_txn,
                           max(CASE WHEN transaction_group = 'Renewal' THEN 1 ELSE 0 END) AS is_renewal_txn,
                           max(CASE WHEN transaction_group = 'Cancellation' THEN created ELSE NULL END) AS date_cancellation_txn,
                           max(CASE WHEN transaction_group = 'Endorsement' THEN created ELSE NULL END) AS date_endorsement_txn,
                           max(CASE WHEN transaction_group = 'New Business' THEN created ELSE NULL END) AS date_nbs_txn,
                           max(CASE WHEN transaction_group = 'Other-Active' THEN created ELSE NULL END) AS date_other_active_txn,
                           max(CASE WHEN transaction_group = 'Other-Inactive' THEN created ELSE NULL END) AS date_other_inactive_txn,
                           max(CASE WHEN transaction_group = 'Reinstatement' THEN created ELSE NULL END) AS date_reinstatement_txn,
                           max(CASE WHEN transaction_group = 'Renewal' THEN created ELSE NULL END) AS date_renewal_txn
                      FROM {{ ref('STAGE','BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT') }} bvstg_comm_au2_policy_status_extract_cdt
                     WHERE description NOT IN ('CancelPending', 'Void','Expired')
                     GROUP BY policynumberformatted,
                              carriername,
                              date_trunc('month', created)
                   ) bvstg_comm_au2_policy_status_extract_cdt
                ON bvstg_comm_au3_policy_status_extract_cdt.policynumberformatted = bvstg_comm_au2_policy_status_extract_cdt.policynumberformatted
               AND bvstg_comm_au3_policy_status_extract_cdt.carriername = bvstg_comm_au2_policy_status_extract_cdt.carriername
               AND bvstg_comm_au3_policy_status_extract_cdt.CUTOFFDATE_MIN = bvstg_comm_au2_policy_status_extract_cdt.CreatedMonth
        name: BVSTG_COMM_AU4_POLICY_STATUS_EXTRACT_CDT
