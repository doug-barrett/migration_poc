    sourceMapping:
      - aliases:
          BVSTG_COMM_AU3_POLICY_STATUS_EXTRACT_CDT: 820b55b6-ee0d-452f-a089-8562261c6b25
          V_PRED_MONTHS: f4be23cc-a2cd-4a21-aee0-6496665e99fd
          BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT: c44eab69-a38c-41b9-9c1b-d0cfc3ae7681
        customSQL:
