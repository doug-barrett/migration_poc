          - locationName: STAGE
            nodeName: BVSTG_CUSTOMER_TO_REFRESH
          - locationName: STAGE
            nodeName: V_PREB_NBDUPLICATED
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
             INNER JOIN (
                    SELECT DISTINCT customerid
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                     WHERE bvstg_customer_to_refresh.SourceDb = 'AppOne'
                   ) bvstg_customer_to_refresh
                ON TO_CHAR(bvstg_customer_to_refresh.customerid) = TO_CHAR(ds_ap1_transactionsummary.customerid)
              LEFT JOIN {{ ref('STAGE','V_PREB_NBDUPLICATED') }} v_preb_nbduplicated
                ON (TO_CHAR(ds_ap1_transactionsummary.transactionID) = TO_CHAR(v_preb_nbduplicated.transactionid))
              LEFT JOIN {{ ref('STAGE','V_PREB_NBDUPLICATED') }} v_preb_nbduplicated_nb
                ON (v_preb_nbduplicated_nb.policyNumber = ds_ap1_transactionsummary.policyNumber AND TO_CHAR(ds_ap1_transactionsummary.customerid) = TO_CHAR(v_preb_nbduplicated_nb.customerid) AND v_preb_nbduplicated_nb.ranking = 1)
              LEFT JOIN {{ ref('STAGE','V_PREB_POLICY_REVENUESUMMARY_V2') }} v_preb_policy_revenuesummary_v2
                ON (TO_CHAR(v_preb_policy_revenuesummary_v2.policyid) = TO_CHAR(ds_ap1_transactionsummary.policyid) AND ds_ap1_transactionsummary.TransactionType IN ('Renewal','Renewal Payment','New Business'))
              LEFT JOIN {{ ref('STAGE','V_PREB_CDT_POLICY_SUMMARY') }} v_preb_cdt_policy_summary
                ON TO_CHAR(v_preb_cdt_policy_summary.policyid) = TO_CHAR(ds_ap1_transactionsummary.policyid)
               AND ds_ap1_transactionsummary.TransactionType IN ('Renewal','Renewal Payment','New Business') --WHERE ds_ap1_transactionsummary.TransactionType IN ('Renewal','Renewal Payment','New Business')    WHERE ds_ap1_transactionsummary.LINEOFBUSINESSTYPE != 'Ancillary'
