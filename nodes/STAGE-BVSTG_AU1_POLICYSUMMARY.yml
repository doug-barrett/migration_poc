          V_PREB_CDT_POLICY_SUMMARY: 62147ede-9470-4154-823c-2d27a126907e
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: V_PREB_POLICY_REVENUESUMMARY_V2
          - locationName: STAGE
