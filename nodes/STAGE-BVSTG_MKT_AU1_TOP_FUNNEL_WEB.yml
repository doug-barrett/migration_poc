LeadID LEFT JOIN (  SELECT *  FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC QUALIFY ROW_NUMBER() OVER (    PARTITION BY LeadID ORDER BY DSS_VERSION DESC    ) = 1  ) s_ap1_lead_mroc_t  ON UPPER(v_dlbv_api_lms_masterlead_current.lead_id_partner) = UPPER(s_ap1_lead_mroc_t.ExternalLeadID) LEFT JOIN (  SELECT DISTINCT LeadID  FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_LEADHISTORY  WHERE USEREMPLOYEENUMBER != '0'   AND ENTITY != 'Inbound Call'  ) DS_BVSTG_AP1_LEADHISTORY  ON DS_BVSTG_AP1_LEADHISTORY.LeadID = TO_VARCHAR(IFNULL(s_ap1_lead_mroc.LeadID, s_ap1_lead_mroc_t.LeadID)) LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_CALL_CUSTOMER ds_mkt_call_customer  ON TO_VARCHAR(IFNULL(s_ap1_lead_mroc.CustomerID, s_ap1_lead_mroc_t.CustomerID)) = ds_mkt_call_customer.CustomerID   AND ds_mkt_call_customer.SOURCEDB_CUSTOMER = 'AppOne'   AND DATE (ds_mkt_call_customer.STARTDATETIME) BETWEEN v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT    AND DATEADD(DAY, 3, v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT) LEFT JOIN RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION TSS_CC  ON TSS_CC.ID = ds_mkt_call_customer.INTERACTIONIDKEY WHERE (       ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0)       OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1         AND DATEDIFF(DAY,v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Tof_Refresh_Days }}' +5       )      )         -- AND v_dlbv_api_lms_masterlead_current.ws_status <> 'duplicate'  AND v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT IS NOT NULL   GROUP BY v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT         , CASE WHEN v_dlbv_api_lms_masterlead_current.media_code LIKE '%-XM-%' THEN 'LeadGen'                 WHEN name_provider IN ('lapsed', 'referrals', 'policy review','cancel pending', 'cancel customer request', 'get covered') OR name_insurance = 'health' THEN 'Recycled'
        name: SRC_bvstg_mkt_top_funnel_web_1_cmp
        noLinkRefs: []
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN
          - locationName: STAGE
            nodeName: V_DLBV_API_LMS_MASTERLEAD_CURRENT
        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_LMS_MASTERLEAD_CURRENT v_dlbv_api_lms_masterlead_current
              LEFT JOIN (
                    SELECT *
                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC QUALIFY ROW_NUMBER() OVER (PARTITION BY LeadID ORDER BY DSS_VERSION DESC) = 1
                   )s_ap1_lead_mroc
                ON v_dlbv_api_lms_masterlead_current.lms_lead_id = s_ap1_lead_mroc.ExternalLeadID
              LEFT JOIN (
                    SELECT *
                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC QUALIFY ROW_NUMBER() OVER (PARTITION BY LeadID ORDER BY DSS_VERSION DESC) = 1
                   )s_ap1_lead_mroc_t
                ON UPPER(v_dlbv_api_lms_masterlead_current.lead_id_partner) = UPPER(s_ap1_lead_mroc_t.ExternalLeadID)
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_MKT_CONVOSOLEAD_DM_CURRENT v_dlbv_mkt_convosolead_dm_current
                ON v_dlbv_api_lms_masterlead_current.lms_lead_id = v_dlbv_mkt_convosolead_dm_current.field_2
              LEFT JOIN (
                    SELECT *
                      FROM RETAIL_PROD.SCH_EDW.DS_MKT_CONVOSOCALL_SUMARY QUALIFY ROW_NUMBER() OVER (PARTITION BY lead_id,INTERACTIONIDKEY ORDER BY IFNULL(TCONNECTED,0) DESC)=1
                   ) ds_mkt_convosocall_sumary
                ON v_dlbv_mkt_convosolead_dm_current.Lead_id = ds_mkt_convosocall_sumary.lead_id
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_CALL_CUSTOMER ds_mkt_call_customer
                ON TO_VARCHAR(IFNULL(s_ap1_lead_mroc.LeadID,s_ap1_lead_mroc_t.LeadID)) = ds_mkt_call_customer.LEADID
               AND ds_mkt_call_customer.SOURCEDB_CUSTOMER = 'AppOne'
               AND DATE(ds_mkt_call_customer.STARTDATETIME) BETWEEN IFNULL(s_ap1_lead_mroc.Created,s_ap1_lead_mroc_t.Created) AND DATEADD(DAY,3,IFNULL(s_ap1_lead_mroc.Created,s_ap1_lead_mroc_t.Created))
              LEFT JOIN (
                    SELECT *
                      FROM RETAIL_PROD.SCH_EDW.DS_MKT_CAMPAIGN QUALIFY ROW_NUMBER() OVER (PARTITION BY MARCHEX_ID ORDER BY STATUS DESC,CAMPAIGNID DESC) = 1
                   ) DS_MKT_CAMPAIGN
                ON DS_MKT_CAMPAIGN.MARCHEX_ID = v_dlbv_api_lms_masterlead_current.MEDIA_CODE
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION TSS
                ON IFNULL(ds_mkt_convosocall_sumary.INTERACTIONIDKEY,ds_mkt_call_customer.INTERACTIONIDKEY) = TSS.ID
             WHERE (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND DATEDIFF(DAY,TSS.STARTDATETIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Tof_Refresh_Days }}' +5))
               AND v_dlbv_api_lms_masterlead_current.ws_status <> 'duplicate'
               AND DATE(TSS.STARTDATETIME)IS NOT NULL
             GROUP BY DATE(TSS.STARTDATETIME) ,
                      CASE WHEN v_dlbv_api_lms_masterlead_current.media_code LIKE '%-XM-%'                                                                                        THEN 'LeadGen'
                           WHEN name_provider IN ('lapsed', 'referrals', 'policy review','cancel pending', 'cancel customer request', 'get covered') OR name_insurance = 'health' THEN 'Recycled'
                           ELSE 'Confie'
                            END ,
                      DS_MKT_CAMPAIGN.CAMPAIGNID ,
                      DS_MKT_CAMPAIGN.STATIONCAMPAIGNNAME ,
                      DS_MKT_CAMPAIGN.BUDGETMKTGSTATE ,
                      DS_MKT_CAMPAIGN.CATEGORY ,
                      DS_MKT_CAMPAIGN.SUBCATEGORY ,
                      DS_MKT_CAMPAIGN.VENDOR ,
                      v_dlbv_api_lms_masterlead_current.DELIVERY_METHOD ,
                      CASE WHEN v_dlbv_api_lms_masterlead_current.NAME_INSURANCE ='auto'   THEN 'Auto'
                           WHEN v_dlbv_api_lms_masterlead_current.NAME_INSURANCE ='health' THEN 'Health'
                           ELSE 'Other'
                            END
