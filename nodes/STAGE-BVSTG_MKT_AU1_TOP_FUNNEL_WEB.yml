LeadID LEFT JOIN (  SELECT *  FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC QUALIFY ROW_NUMBER() OVER (    PARTITION BY LeadID ORDER BY DSS_VERSION DESC    ) = 1  ) s_ap1_lead_mroc_t  ON UPPER(v_dlbv_api_lms_masterlead_current.lead_id_partner) = UPPER(s_ap1_lead_mroc_t.ExternalLeadID) LEFT JOIN (  SELECT DISTINCT LeadID  FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_LEADHISTORY  WHERE USEREMPLOYEENUMBER != '0'   AND ENTITY != 'Inbound Call'  ) DS_BVSTG_AP1_LEADHISTORY  ON DS_BVSTG_AP1_LEADHISTORY.LeadID = TO_VARCHAR(IFNULL(s_ap1_lead_mroc.LeadID, s_ap1_lead_mroc_t.LeadID)) LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_CALL_CUSTOMER ds_mkt_call_customer  ON TO_VARCHAR(IFNULL(s_ap1_lead_mroc.CustomerID, s_ap1_lead_mroc_t.CustomerID)) = ds_mkt_call_customer.CustomerID   AND ds_mkt_call_customer.SOURCEDB_CUSTOMER = 'AppOne'   AND DATE (ds_mkt_call_customer.STARTDATETIME) BETWEEN v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT    AND DATEADD(DAY, 3, v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT) LEFT JOIN RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION TSS_CC  ON TSS_CC.ID = ds_mkt_call_customer.INTERACTIONIDKEY WHERE (       ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0)       OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1         AND DATEDIFF(DAY,v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Tof_Refresh_Days }}' +5       )      )         -- AND v_dlbv_api_lms_masterlead_current.ws_status <> 'duplicate'  AND v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT IS NOT NULL   GROUP BY v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT         , CASE WHEN v_dlbv_api_lms_masterlead_current.media_code LIKE '%-XM-%' THEN 'LeadGen'                 WHEN name_provider IN ('lapsed', 'referrals', 'policy review','cancel pending', 'cancel customer request', 'get covered') OR name_insurance = 'health' THEN 'Recycled'
