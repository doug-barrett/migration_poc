            FROM RETAIL_PROD.SCH_EDW.V_MKT_C2S_SUMMARY V_MKT_C2S_SUMMARY
              LEFT JOIN (
                    SELECT CASE WHEN SourceDb = 'AppOne' THEN TransactionID
                                ELSE PolicyID
                                 END SaleID ,
                           SUM(CASE WHEN label = 'New Business Auto' THEN Counter ELSE 0 END) NewAutoPolicies ,
                           SUM(CASE WHEN customerType = 'NEW/NEW' AND CLASSIFICATIONGROUP = 'New Business' THEN 1 ELSE 0 END) AS NewNew ,
                           SUM(CASE WHEN customerType = 'OLD/NEW' AND CLASSIFICATIONGROUP = 'New Business' THEN 1 ELSE 0 END) AS NewOld ,
                           SUM(CASE WHEN customerType = 'REPLACEMENT' AND CLASSIFICATIONGROUP = 'New Business' THEN 1 ELSE 0 END) AS Rewrite ,
                           SUM(CASE WHEN customerType = 'WINBACK' AND CLASSIFICATIONGROUP = 'New Business' THEN 1 ELSE 0 END) AS WinBack
                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                     WHERE label IN ('New Business Auto', 'New Business Complementary')
                     GROUP BY CASE WHEN SourceDb = 'AppOne' THEN TransactionID
                                   ELSE PolicyID
                                    END
                   ) ds_ram_retail_repository_call
                ON (ds_ram_retail_repository_call.SaleID = V_MKT_C2S_SUMMARY.SaleID)
             WHERE V_MKT_C2S_SUMMARY.ID_LMS IS NOT NULL
               AND (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0 AND DATE(V_MKT_C2S_SUMMARY.VINTAGEDATE)>='2019-01-01') OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND DATEDIFF(DAY,V_MKT_C2S_SUMMARY.VINTAGEDATE,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}' + 15))
             GROUP BY DATE(V_MKT_C2S_SUMMARY.VINTAGEDATE) ,
                      V_MKT_C2S_SUMMARY.Campaignid ,
                      IFNULL(V_MKT_C2S_SUMMARY.Subcategory,'') ,
                      IFNULL(V_MKT_C2S_SUMMARY.BUDGETMKTGSTATE,'') ,
                      IFNULL(V_MKT_C2S_SUMMARY.Category,'') ,
                      IFNULL(V_MKT_C2S_SUMMARY.Subcategory,'') ,
                      IFNULL(V_MKT_C2S_SUMMARY.vendor,'') ,
                      IFNULL(V_MKT_C2S_SUMMARY.Brand_Name,'') ,
                      IFNULL(V_MKT_C2S_SUMMARY.delivery_method,'') ,
                      IFNULL(V_MKT_C2S_SUMMARY.Brand,'') ,
                      IFNULL(V_MKT_C2S_SUMMARY.Division,'')
