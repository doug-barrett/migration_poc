        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_S_AMS_INVOICETRANSACTION_MROC_CURRENT') }} v_s_ams_invoicetransaction_mroc_current
             INNER JOIN {{ ref('STAGE','V_PREF_AMS_TRANTYPECODE_MODE') }} v_pref_ams_TranTypeCode_mode
                ON (v_s_ams_invoicetransaction_mroc_current.TranType = v_pref_ams_TranTypeCode_mode.TransTypeCode)
             INNER JOIN {{ ref('STAGE','V_PREF_AMS_LOB_MODE') }} v_pref_ams_lob_mode
                ON (v_pref_ams_lob_mode.namelobs = v_s_ams_invoicetransaction_mroc_current.lineofbus)
             INNER JOIN {{ ref('STAGE','V_S_AMS_POLICYTRANPREMIUM_MROC_CURRENT') }} v_s_ams_policytranpremium_mroc_current
                ON (v_s_ams_policytranpremium_mroc_current.poltpid = v_s_ams_invoicetransaction_mroc_current.poltpid AND v_s_ams_policytranpremium_mroc_current.lineofbus = v_s_ams_invoicetransaction_mroc_current.lineofbus)
             INNER JOIN {{ ref('STAGE','V_S_AMS_BASICPOLINFO_MROC_CURRENT') }} v_s_ams_basicpolinfo_mroc_current
                ON v_s_ams_basicpolinfo_mroc_current.PolId = v_s_ams_policytranpremium_mroc_current.PolId
              LEFT JOIN (
                    SELECT POL.PolID,
                           PR.LineOfBus,
                           COUNT(1) AS isBilling
                      FROM {{ ref('STAGE','V_S_AMS_POLICYTRANPREMIUM_MROC_CURRENT') }} PR
                     INNER JOIN {{ ref('STAGE','V_S_AMS_BASICPOLINFO_MROC_CURRENT') }} POL
                        ON (PR.PolId= POl.PolID AND TO_DATE(PR.ENTEREDDATE) >= TO_DATE(POL.ENTEREDDATE) AND TO_DATE(PR.ENTEREDDATE) <= TO_DATE(POL.POLEXPDATE) AND PR.BilledPremium > 0)
                     GROUP BY POL.PolID,
                              PR.LineOfBus
                   )v_s_ams_policytranpremium_mroc_current_bi
                ON (v_s_ams_policytranpremium_mroc_current_bi.PolID = v_s_ams_basicpolinfo_mroc_current.PolID AND v_s_ams_policytranpremium_mroc_current_bi.LineOfBus = v_s_ams_invoicetransaction_mroc_current.lineofbus)
             INNER JOIN {{ ref('STAGE','V_S_AMS_SETUPBILLINGTRAN_MROC_CURRENT') }} v_s_ams_setupbillingtran_mroc_current
                ON v_s_ams_invoicetransaction_mroc_current.ChargeCode = v_s_ams_setupbillingtran_mroc_current.ChargeCode
             WHERE v_s_ams_invoicetransaction_mroc_current.GROSSAMT > 0
               AND v_s_ams_invoicetransaction_mroc_current.backinvtpid IS NULL
               AND v_s_ams_invoicetransaction_mroc_current.oldinvtpid IS NULL
