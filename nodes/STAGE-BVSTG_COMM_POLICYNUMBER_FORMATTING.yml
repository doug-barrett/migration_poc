        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT PolicyNumber ,
                   CarrierName_unmapped ,
                   PolicyNumberFormatted_v1 ,
                   CASE WHEN carriername_mapped = 'Kemper' AND length(trim(upper(PolicyNumber))) >= 13 THEN ltrim(right(left(trim(upper(PolicyNumber)), 13), 7), '0')
                        WHEN carriername_mapped = 'Kemper' AND length(trim(upper(PolicyNumber))) = 9   THEN ltrim(left(trim(upper(PolicyNumber)), 7), '0')
                         END AS PolicyNumberFormatted_v2 ,
                   carriername_mapped ,
                   carrierdisplayname ,
                   Term_V2 ,
                   RecordSource
              FROM ( SELECT DISTINCT policynumber ,
                   carriername_unmapped ,
                   "DATA_LAKE"."BIA_ANALYTICS".PolicyNumber_format(carriername, PolicyNumber) AS PolicyNumberFormatted_v1 ,
                   carriername carriername_mapped ,
                   carrierdisplayname ,
                   CASE WHEN term IN ('6 Months' ,'6' ,'-6')      THEN 6
                        WHEN term IN ('1 Year' ,'12' ,'-12')      THEN 12
                        WHEN term IN ('1 Month' ,'1' ,'31' ,'-1') THEN 1
                        WHEN term IN ('3 Months' ,'3' ,'-3')      THEN 3
                        ELSE NULL
                         END AS Term_v2 ,
                   RecordSource
              FROM ( SELECT DISTINCT policynumbers.policynumber ,
                   policynumbers.carriername carriername_unmapped ,
                   carriername_grouped carriername ,
                   carrierdisplayname ,
                   term ,
                   RecordSource
              FROM ( SELECT DISTINCT policynumber ,
                   carriername ,
                   term ,
                   'EDW' RecordSource
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
             UNION SELECT DISTINCT last_policynumber ,
                   carriername ,
                   term ,
                   'EDW' RecordSource
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
             WHERE last_policynumber IS NOT NULL
             UNION (
                    SELECT DISTINCT ds_cutoffpolicy_v2.policynumber ,
                           ds_policysummary_v2.carriername ,
                           ds_policysummary_v2.term ,
                           'EDW' RecordSource
                      FROM {{ ref('EDW','DS_CUTOFFPOLICY_V2') }} ds_cutoffpolicy_v2
                      LEFT JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
                        ON ds_policysummary_v2.policyid = ds_cutoffpolicy_v2.policyid
                   )
             UNION SELECT DISTINCT policynumber ,
                   carriername ,
                   term ,
                   'EDW' RecordSource
              FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
             UNION SELECT DISTINCT policynumber ,
                   carriername ,
                   term ,
                   'EDW' RecordSource
              FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }}
             UNION SELECT DISTINCT policynumber ,
                   company ,
                   term ,
                   'EDW' RecordSource
              FROM {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }}
             UNION SELECT DISTINCT policynumber ,
                   carriername ,
                   NULL term ,
                   'EDW' RecordSource
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }}
             UNION SELECT DISTINCT policynumber ,
                   carrier ,
                   NULL ,
                   'CS' RecordSource
              FROM {{ ref('STAGE','V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT') }}
             UNION SELECT DISTINCT policynumber ,
                   carriername ,
                   NULL ,
                   'AL3' RecordSource
              FROM {{ ref('STAGE','V_DLBV_AL3_BASICPOLICYINFOGROUP_CURRENT') }} v_dlbv_al3_basicpolicyinfogroup_current
              LEFT JOIN {{ ref('STAGE','V_DLBV_AL3_SWEEPLOGS_CURRENT') }} v_dlbv_al3_sweeplogs_current
                ON v_dlbv_al3_basicpolicyinfogroup_current.sweeplogid = v_dlbv_al3_sweeplogs_current.id
             UNION ( SELECT DISTINCT policynumber ,
                   CARRIER.CARRIERNAME ,
                   NULL term ,
                   'EDW' RecordSource
              FROM {{ ref('DATA_VAULT','S_AP1_POLICY_MROC') }} S_AP1_POLICY_MROC
              LEFT JOIN {{ ref('DATA_VAULT','H_PROGRAM') }} h_program
                ON S_AP1_POLICY_MROC.programid = h_program.programid
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_PROGRAM_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_h_program ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ap1_program_mroc_current
                ON h_program.HK_h_program = v_s_ap1_program_mroc_current.HK_h_program LEFT JOI
        name: BVSTG_COMM_POLICYNUMBER_FORMATTING
        noLinkRefs: []
