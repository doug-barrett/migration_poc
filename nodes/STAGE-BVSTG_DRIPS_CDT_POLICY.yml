    sourceMapping:
      - aliases:
          V_S_AP1_CDTPOLICY_CURRENT: f89f0301-4988-4a90-9f9b-76a54b8e4d02
          L_CDTPOLICY_CDTTYPE: eafda663-578c-40ed-8d4c-ed8f8f446396
          V_S_AP1_CDTTYPE_CURRENT: 49cd9ec4-721d-4f62-a851-1bff3ecf3d3c
          DS_BVSTG_AP1_POLICY: 3fa521fe-b979-412d-835b-902979c2f0d1
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_POLICY
          - locationName: STAGE
            nodeName: V_S_AP1_CDTPOLICY_CURRENT
          - locationName: DATA_VAULT
            nodeName: L_CDTPOLICY_CDTTYPE
          - locationName: STAGE
            nodeName: V_S_AP1_CDTTYPE_CURRENT
        join:
          joinCondition: |-
            FROM (
                    SELECT Customerid,
                           LastUpdated
                      FROM (
                            SELECT ROW_NUMBER() OVER (PARTITION BY PolicyID ORDER BY v_s_ap1_cdtpolicy_current.LastUpdated DESC) AS RN ,
                                   v_s_ap1_cdtpolicy_current.PolicyID ,
                                   v_s_ap1_cdtpolicy_current.Customerid ,
                                   v_s_ap1_cdtpolicy_current.LastUpdated AS LastUpdated
                              FROM {{ ref('STAGE','V_S_AP1_CDTPOLICY_CURRENT') }} v_s_ap1_cdtpolicy_current
                             INNER JOIN {{ ref('DATA_VAULT','L_CDTPOLICY_CDTTYPE') }} l_cdtpolicy_cdttype
                                ON l_cdtpolicy_cdttype.HK_H_CDTPOLICY = v_s_ap1_cdtpolicy_current.HK_H_CDTPOLICY
                             INNER JOIN {{ ref('STAGE','V_S_AP1_CDTTYPE_CURRENT') }} v_s_ap1_cdttype_current
                                ON v_s_ap1_cdttype_current.HK_H_CDTType = l_cdtpolicy_cdttype.HK_H_CDTType
                             WHERE (('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 0 AND DATE(v_s_ap1_cdtpolicy_current.LastUpdated) >= '2022-01-01') OR ('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 1 AND DATE(v_s_ap1_cdtpolicy_current.LastUpdated) = DATEADD(DAY,-1,CURRENT_DATE())))
                               AND v_s_ap1_cdttype_current.Name = 'Lapse'
                               AND v_s_ap1_cdtpolicy_current.IsRowDeleted = 0
                               AND PolicyID IS NOT NULL
                           ) a
                     WHERE RN = 1
                   ) v_s_ap1_cdtpolicy_current
             INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_POLICY') }} ds_bvstg_ap1_policy
                ON (v_s_ap1_cdtpolicy_current.customerID = ds_bvstg_ap1_policy.customerID AND ds_bvstg_ap1_policy.TransactionType IN ('New Business','Renewal', 'Reinstatement','Renewal Payment'))
             WHERE 1=1 QUALIFY ROW_NUMBER() OVER (PARTITION BY MD5(ds_bvstg_ap1_policy.TransactionID || DATE(CURRENT_DATE())) ORDER BY CASE WHEN ds_bvstg_ap1_policy.BIA_Status IN ('Active','Reinstated','Renewed') THEN 0 ELSE 1 END) = 1
        name: BVSTG_DRIPS_CDT_POLICY
        noLinkRefs: []
