name: FCT_JOBDETAILS
operation:
  config:
    postSQL: ''
    preSQL: ''
    testsEnabled: true
  database: ''
  deployEnabled: true
  description: "Fact: JobDetails\n\nDAX Measures (for Semantic View):\n  - Job Count:\
    \   COUNTROWS(JobDetails)\n  - Sales Job Count:  CALCULATE([Job Count], USERELATIONSHIP('Date'[Date],\
    \ JobDetails[CreatedDate]))\n  - Sales Head Count:  COUNTROWS(FILTER(VALUES(Jobs[SalesmanName]),\
    \ [Sales Job Count]>0))\n  - Sales Tech Head Count:  [Tech Head Count]\n  - CSR\
    \ Job Count:  CALCULATE([Job Count], Jobs[JobStatus] IN {\"Void\", \"Quote\",\
    \ \"Work Order\", \"Invoice\"}, USERELATIONSHIP('Date'[Date], Job\n  - CSR Head\
    \ Count:  COUNTROWS(FILTER(VALUES(Jobs[CSRName]), [CSR Job Count]>0))\n  - CSR\
    \ Tech Head Count:  [Tech Head Count]\n  - Dispatcher Job Count:  CALCULATE([Job\
    \ Count], Jobs[JobStatus] IN {\"Work Order\", \"Invoice\"}, USERELATIONSHIP('Date'[Date],\
    \ JobDetails[WorkOrder\n  - Dispatcher Head Count:  COUNTROWS(FILTER(VALUES(Jobs[DispatcherName]),\
    \ [Dispatcher Job Count]>0))\n  - Dispatcher Tech Head Count:  [Tech Head Count]\n\
    \  - Biller Job Count:  CALCULATE([Job Count], Jobs[JobStatus] IN {\"Invoice\"\
    }, USERELATIONSHIP('Date'[Date], JobDetails[InvoiceDate]))\n  - Biller Head Count:\
    \  COUNTROWS(FILTER(VALUES(Jobs[BillerName]), [Biller Job Count]>0))\n  - Biller\
    \ Tech Head Count:  [Tech Head Count]\n  - Tech/Sales Jobs %:  DIVIDE([Tech Job\
    \ Count], [Sales Job Count])\n  - Tech/Dispatcher Jobs %:  DIVIDE([Tech Job Count],\
    \ [Dispatcher Job Count])\n  - CSR/Sales Jobs %:  DIVIDE([CSR Job Count] , [Sales\
    \ Job Count])\n  - Dispatcher/CSR Jobs %:  DIVIDE([Dispatcher Job Count], [CSR\
    \ Job Count])\n  - Biller/Tech Jobs %:  DIVIDE([Biller Job Count], [Tech Job Count])\n\
    \  - Biller/Sales Jobs %:  DIVIDE([Biller Job Count], [Sales Job Count])\n  -\
    \ Average Sales Jobs:  DIVIDE([Sales Job Count], [Sales Head Count])\n  - Average\
    \ Sales Jobs per Tech:  DIVIDE([Sales Job Count], [Sales Tech Head Count])\n \
    \ - Average CSR Jobs:  DIVIDE([CSR Job Count], [CSR Head Count])\n  - Average\
    \ CSR Jobs per Tech:  DIVIDE([CSR Job Count], [CSR Tech Head Count])\n  - Average\
    \ Biller Jobs:  DIVIDE([Biller Job Count], [Biller Head Count])\n  - Average Biller\
    \ Jobs per Tech:  DIVIDE([Biller Job Count], [Biller Tech Head Count])\n  - Average\
    \ Daily Sales Jobs:  DIVIDE([Average Sales Jobs], CALCULATE([Working Days]))\n\
    \  - Average Daily Sales Jobs per Tech:  DIVIDE([Average Sales Jobs per Tech],\
    \ CALCULATE([Working Days]))\n  - Average Daily CSR Jobs:  DIVIDE([Average CSR\
    \ Jobs], CALCULATE([Working Days]))\n  - Average Daily CSR Jobs per Tech:  DIVIDE([Average\
    \ CSR Jobs per Tech], CALCULATE([Working Days]))\n  - Average Dispatcher Jobs:\
    \  DIVIDE([Dispatcher Job Count], [Dispatcher Head Count])\n  - Average Dispatcher\
    \ Jobs per Tech:  DIVIDE([Dispatcher Job Count], [Dispatcher Tech Head Count])\n\
    \  - Average Daily Dispatcher Jobs:  DIVIDE([Average Dispatcher Jobs], CALCULATE([Working\
    \ Days]))\n  - Average Daily Dispatcher Jobs per Tech:  DIVIDE([Average Dispatcher\
    \ Jobs per Tech], CALCULATE([Working Days]))\n  - Average Daily Biller Jobs: \
    \ DIVIDE([Average Biller Jobs], CALCULATE([Working Days]))\n  - Average Daily\
    \ Biller Jobs per Tech:  DIVIDE([Average Biller Jobs per Tech], CALCULATE([Working\
    \ Days]))\n  - Total WO To TechEnd CT:  CALCULATE(AVERAGE(JobDetails[WOEnded]),JobDetails[Woended]>1&&JobDetails[Woended]<300)\n\
    \  - Total WO To Invoiced CT:  CALCULATE(AVERAGE(JobDetails[WOInvoiced]),JobDetails[Woinvoiced]>1&&JobDetails[Woinvoiced]<300)\n\
    \  - Total Creation To Appt CT: CALCULATE( AVERAGE(JobDetails[CreatedSched]),JobDetails[Createdsched]>1&&JobDetails[Createdsched]<300)\n\
    \  - Total Appt To WO CT:  CALCULATE(AVERAGE(JobDetails[SchedWO]),JobDetails[Schedwo]>1&&JobDetails[Schedwo]<300)\
    \ \n  - Total TechEnd to Invoice CT:  CALCULATE(AVERAGE(JobDetails[EndedInvoiced]),JobDetails[Endedinvoiced]>1&&JobDetails[Endedinvoiced]<300)\n\
    \  - Total Cycle Time:  CALCULATE(AVERAGE(JobDetails[TotalCycleTime]),JobDetails[Totalcycletime]>0)\n\
    \  - Creation to WO Cycle Time: CALCULATE( AVERAGE(JobDetails[CreatedWO]),JobDetails[CreatedWO]>0)\n\
    \  - WO to Appt Cycle Time: CALCULATE( AVERAGE(JobDetails[WOSched]),JobDetails[WOSched]>0)\n\
    \  - Appt To TechEnd Cycle Time:  CALCULATE(AVERAGE(JobDetails[SchedEnded]),JobDetails[SchedEnded]>0)\n\
    \  - Appt To Invoiced Cycle Time:       CALCULATE(         AVERAGE(JobDetails[SchedInvoiced]),\
    \         JobDetails[SchedInvoiced] > 0     )\n  - TechEnd to Invoice Cycle Time:\
    \  CALCULATE(AVERAGE(JobDetails[EndedInvoiced]),JobDetails[Endedinvoiced]>0)\n\
    \  - Hold Time:  CALCULATE(AVERAGE(JobDetails[HoldTime]),JobDetails[Holdtime]>0)\n\
    \  - Ops Cycle Time:  [Total Cycle Time] - [Hold Time]\n  - Creation to TechEnd\
    \ Cycle Time: CALCULATE( AVERAGE(JobDetails[Createdended]),JobDetails[Createdended]>0)\n\
    \  - Creation to TechEnd Cycle Time (Ex Hold):  [Creation to TechEnd Cycle Time]\
    \ - [Hold Time]\n"
