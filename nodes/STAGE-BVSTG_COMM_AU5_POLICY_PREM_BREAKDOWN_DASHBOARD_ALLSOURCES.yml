          - locationName: STAGE
            nodeName: BVSTG_COMM_AU3_POLICY_PREM_BREAKDOWN_DASHBOARD_ALLSOURCES
        join:
          joinCondition: |-
            EXTENDED
              FROM( SELECT au3.carrier,
                   term,
                   policysource,
                   customer_type,
                   agency,
                   agencystate,
                   leadtype,
                   lineofbusiness,
                   paidtype,
                   CustomerState,
                   isOnlineBinding,
                   ISLEGACYTRANSACTION,
                   isFranchise,
                   TerritoryManagerName,
                   nbs_rwl_policy_flag,
                   asofmonth,
                   metric,
                   CASE WHEN bvstg_comm_au4_dashboard_extract.carrier IS NOT NULL AND asofmonth = date_trunc('month', add_months(current_date(), -1)) THEN MetricValue_Estimated
                        ELSE MetricValue_Actual
                         END AS MetricValue,
                   MetricValue_Actual,
                   MetricValue_Estimated,
                   CASE WHEN bvstg_comm_au4_dashboard_extract.carrier IS NOT NULL AND asofmonth = date_trunc('month', add_months(current_date(), -1)) THEN 1
                        ELSE 0
                         END AS IsEstimated,
                   1 AS Extract_Flag
              FROM (SELECT carrier,
                   term,
                   policysource,
                   customer_type,
                   agency,
                   agencystate,
                   leadtype,
                   lineofbusiness,
                   paidtype,
                   CustomerState,
                   isOnlineBinding,
                   ISLEGACYTRANSACTION,
                   isFranchise,
                   TerritoryManagerName,
                   nbs_rwl_policy_flag,
                   asofmonth,
                   metric,
                   sum(metricvalue_actual) AS metricvalue_actual,
                   sum(MetricValue_Estimated) AS MetricValue_Estimated
              FROM (SELECT DISTINCT ifnull(au1.carrier, au3.carrier) carrier,
                   ifnull(au1.term, au3.term) term,
                   ifnull(au1.policysource, au3.policysource) policysource,
                   ifnull(au1.customer_type, au3.customer_type) customer_type,
                   ifnull(au1.agency, au3.agency) agency,
                   ifnull(au1.agencystate, au3.agencystate) agencystate,
                   ifnull(au1.leadtype, au3.leadtype) leadtype,
                   ifnull(au1.lineofbusiness, au3.lineofbusiness) lineofbusiness,
                   ifnull(au1.paidtype, au3.paidtype) paidtype,
                   ifnull(au1.CustomerState, au3.CustomerState) CustomerState,
                   ifnull(au1.isOnlineBinding, au3.isOnlineBinding) isOnlineBinding,
                   ifnull(au1.ISLEGACYTRANSACTION, au3.ISLEGACYTRANSACTION) ISLEGACYTRANSACTION,
                   ifnull(au1.isFranchise, au3.isFranchise) isFranchise,
                   ifnull(au1.TerritoryManagerName, au3.TerritoryManagerName) TerritoryManagerName,
                   ifnull(au1.nbs_rwl_policy_flag, au3.nbs_rwl_policy_flag) nbs_rwl_policy_flag,
                   ifnull(au1.asofmonth, au3.asofmonth) asofmonth,
                   ifnull(au1.metric, au3.metric) metric,
                   ifnull(au1.metricvalue, 0) AS metricvalue_actual,
                   ifnull(au3.MetricValue, 0) AS MetricValue_Estimated
              FROM {{ ref('STAGE','BVSTG_COMM_AU1_POLICY_PREM_BREAKDOWN_DASHBOARD_ALLSOURCES') }} au1 -- from bvstg_comm_au1_policy_prem_breakdown_dashboard_allsources au1    full outer join    ((select distinct carrier, term, policysource, customer_type, agency, agencystate, leadtype, lineofbusiness,    paidtype, CustomerState, isOnlineBinding, ISLEGACYTRANSACTION, isFranchise, TerritoryManagerName, nbs_rwl_policy_flag, asofmonth,     metric, metricvalue as metricvalue     from {{ ref('STAGE','BVSTG_COMM_AU1_POLICY_PREM_BREAKDOWN_DASHBOARD_ALLSOURCES') }}    -- from bvstg_comm_au1_policy_prem_breakdown_dashboard_allsources    where asofmonth = add_months(date_trunc('month', current_date()), -1)    and metric in ('NBS_Premium', 'Premium_BOM'))     UNION    (select distinct carrier, term, policysource, customer_type, agency, agencystate, leadtype, lineofbusiness,    paidtype, CustomerState, isOnlineBinding, ISLEGACYTRANSACTION, isFranchise, TerritoryManagerName, nbs_rwl_policy_flag, asofmonth,    'Cancelled_Premium' as metric, Cancelled_Premium as metricvalue    from {{ ref('STAGE','BVSTG_COMM_AU3_POLICY_PREM_BREAKDOWN_DASHBOARD_ALLSOURCES') }} bvstg_comm_au3_policy_prem_breakdown_dashboard_allsources    -- from bvstg_comm_au3_policy_prem_breakdown_dashboard_allsources     where Cancelled_Premium <> 0)     UNION    (select distinct carrier, term, policysource, customer_type, agency, agencystate, leadtype, lineofbusiness,    paidtype, CustomerState, isOnlineBinding, ISLEGACYTRANSACTION, isFranchise, TerritoryManagerName, nbs_rwl_policy_flag, asofmonth,    'Premium_EOM' as metric, Premium_EOM as metricvalue    from {{ ref('STAGE','BVSTG_COMM_AU3_POLICY_PREM_BREAKDOWN_DASHBOARD_ALLSOURCES') }} bvstg_comm_au3_policy_prem_breakdown_dashboard_allsources    -- from bvstg_comm_au3_policy_prem_breakdown_dashboard_allsources     where Premium_EOM <> 0)
        name: BVSTG_COMM_AU5_POLICY_PREM_BREAKDOWN_DASHBOARD_ALLSOURCES
