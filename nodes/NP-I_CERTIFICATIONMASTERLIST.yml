             INNER JOIN {{ ref('NP','I_CS_CERTMASTERLIST') }}
                ON I_CS_CERTMASTERLISTMAXVERSION.CERTIFICATIONTITLE = I_CS_CERTMASTERLIST.CERTIFICATIONTITLE
               AND I_CS_CERTMASTERLISTMAXVERSION.CERTIFICATIONID = I_CS_CERTMASTERLIST.CERTIFICATIONID
            UNION ALL --FIND THE RECORDS THAT NEED TO HAVE THEIR STATUS UPDATED TO "RETIRED"  SELECT COMPETENCYCODE COMPETENCYTITLE  , COMPETENCY COMPETENCYDESCRIPTION  , COMPETENCYTYPE COMPETENCYFAMILY  , COMPETENCYGROUP COMPETENCYCATEGORY  , THEORYONLYFLAG  , 'RETIRED' [STATUS]  FROM D_COMPETENCY  WHERE COMPETENCYSTATUS <> 'RETIRED'  AND COMPETENCYCODE NOT IN (SELECT DISTINCT CERTIFICATIONTITLE FROM I_CS_CERTMASTERLISTMAXVERSION)  AND D_COMPETENCY_KEY <> 0
