    sourceMapping:
      - aliases:
          DS_POLICYSUMMARY_V2: 9a05931f-0fe2-4275-8b38-8e88eb9c6968
          DS_RAM_RETAIL_REPOSITORY: 39a9b6bb-124a-4925-91e8-c1b9157d7e95
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
        join:
          joinCondition: |-
            FROM(
                    WITH FILTERS AS (
                            SELECT DISTINCT DATE(CREATED) CREATED,
                                   TRANSACTIONID,
                                   CUSTOMERID,
                                   POLICYID,
                                   POLICYNUMBER,
                                   SOURCEDB,
                                   TERM,
                                   CARRIERNAME,
                                   CURRENTPREMIUM,
                                   WRITTENPREMIUM,
                                   DATE(FIRSTWRITTEN) FIRSTWRITTEN,
                                   BIA_STATUSDATE,
                                   EFFECTIVEDATE,
                                   BIA_EXPIRATIONDATE,
                                   EXPIRATIONDATE,
                                   LAST_TRANSACTIONID,
                                   LAST_CREATED,
                                   LAST_POLICYID,
                                   POLICYSTATUS,
                                   STATUS_STANDARD,
                                   STARTDATE,
                                   ENDDATE,
                                   POLICYTENURE,
                                   PREV_TRANSACTIONID,
                                   PREV_CARRIERNAME,
                                   PREV_TERM,
                                   PREV_WRITTENPREMIUM,
                                   PREV_STARTDATE,
                                   PREV_ENDDATE,
                                   LEADID,
                                   NEXT_TRANSACTIONID,
                                   NEXT_WRITTENPREMIUM,
                                   NEXT_STARTDATE,
                                   NEXT_ENDDATE,
                                   TERM_IN_MONTHS
                              FROM (
                                    SELECT * ,
                                           CASE WHEN TERM = '1 Year'   THEN 12
                                                WHEN TERM = '6 Months' THEN 6
                                                ELSE 0
                                                 END AS TERM_IN_MONTHS
                                      FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
                                     WHERE LINEOFBUSINESSTYPE = 'Auto'
                                       AND SOURCEDB = 'AppOne'
                                       AND TERM IN ('1 Year', '6 Months')
                                       AND biaprimaryagentoffice <> 'JOR'
                                       AND islegacytransaction <> 'Migrated'
                                   )
                             WHERE DATEADD(DAY, -30, DATEADD(MONTH, TERM_IN_MONTHS, STARTDATE)) = CURRENT_DATE()
                           ) ,
                           COLUMN_CREATION AS (
                            SELECT * ,
                                   DATEADD(MONTH, TERM_IN_MONTHS, STARTDATE) AS ESTIMATE_END_DATE ,
                                   DATEADD(DAY, -30, DATEADD(MONTH, TERM_IN_MONTHS, STARTDATE)) AS RENEWAL_DATE ,
                                   COUNT(*) OVER (PARTITION BY TRANSACTIONID) AS DUPLICATES
                              FROM FILTERS
                             WHERE (ENDDATE IS NULL OR ENDDATE > DATEADD(DAY,-60, DATEADD(MONTH, TERM_IN_MONTHS, STARTDATE)))
                           ) ,
                           REMOVE_DUPLICATES AS (
                            SELECT COLUMN_CREATION.*
                              FROM (
                                    SELECT *
                                      FROM COLUMN_CREATION
                                     WHERE DUPLICATES > 1
                                   ) COLUMN_CREATION
                             INNER JOIN (
                                    SELECT DISTINCT POLICYID,
                                           TRANSACTIONID,
                                           CUSTOMERID
                                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                                     WHERE LINEOFBUSINESSTYPE = 'Auto'
                                       AND CLASSIFICATION = 'Carrier Premium'
                                   ) RETAIL_REPOSITORY
                                ON (COLUMN_CREATION.POLICYID = RETAIL_REPOSITORY.POLICYID AND COLUMN_CREATION.TRANSACTIONID = RETAIL_REPOSITORY.TRANSACTIONID AND COLUMN_CREATION.CUSTOMERID = RETAIL_REPOSITORY.CUSTOMERID)
                           ) ,
                           DATA_UNION AS (
                            SELECT *
                              FROM REMOVE_DUPLICATES
                         UNION ALL SELECT *
                              FROM COLUMN_CREATION
                             WHERE DUPLICATES = 1
                           ) SELECT CREATED,
                           TRANSACTIONID,
                           CUSTOMERID,
                           POLICYID ,
                           POLICYNUMBER,
                           SOURCEDB,
                           TERM,
                           CARRIERNAME,
                           CURRENTPREMIUM,
                           WRITTENPREMIUM ,
                           DATE(FIRSTWRITTEN) FIRSTWRITTEN,
                           BIA_STATUSDATE,
                           EFFECTIVEDATE,
                           BIA_EXPIRATIONDATE,
                           EXPIRATIONDATE,
                           LAST_TRANSACTIONID,
                           LAST_CREATED,
                           LAST_POLICYID ,
                           POLICYSTATUS,
                           STATUS_STANDARD,
                           STARTDATE,
                           ENDDATE,
                           POLICYTENURE ,
                           PREV_TRANSACTIONID,
                           PREV_CARRIERNAME,
                           PREV_TERM,
                           PREV_WRITTENPREMIUM,
                           PREV_STARTDATE,
                           PREV_ENDDATE,
                           LEADID ,
                           NEXT_TRANSACTIONID,
                           NEXT_WRITTENPREMIUM,
                           NEXT_STARTDATE,
                           NEXT_ENDDATE,
                           TERM_IN_MONTHS ,
                           ESTIMATE_END_DATE,
                           RENEWAL_DATE ,
                           COUNT(*) OVER (PARTITION BY TRANSACTIONID) AS DUPLICATES
                      FROM DATA_UNION
                   ) DS_POLICYSUMMARY_V2
