                          WHEN ds_policysummary_v2.carriername IN ('Dairyland Auto - AZ','Dairyland Auto - IN' ,'Dairyland Auto - MI', 'Dairyland Auto - MO' , 'Dairyland Auto - NE', 'Dairyland Auto - PA' , 'Dairyland Auto - TX', 'Dairyland Auto Insurance' ,'Dairyland Cycle Insurance')                                                                                        THEN 'Dairyland Auto'
                          WHEN ds_policysummary_v2.carriername IN ('First Acceptance Ancilliary' , 'First Acceptance Insurance Company')                                                                                                                                                                                                                                             THEN 'First Acceptance Insurance'
                          WHEN ds_policysummary_v2.carriername = 'First Chicago Insurance'                                                                                                                                                                                                                                                                                           THEN 'First Chicago Insurance'
                          WHEN ds_policysummary_v2.carriername IN ('Foremost Insurance - CA', 'Foremost Insurance - MO' , 'Foremost Insurance - NJ', 'Foremost Insurance - TX' ,'Foremost Insurance Group')                                                                                                                                                                          THEN 'Foremost Insurance'
                          WHEN ds_policysummary_v2.carriername IN ('Infinity Auto Insurance', 'Infinity Insurance - CA' , 'Infinity Insurance - CO', 'Infinity Insurance - FL', 'Infinity Insurance - GA' , 'Infinity Insurance - MI', 'Infinity Insurance - PA', 'Infinity Insurance - TX')                                                                                         THEN 'Infinity Insurance'
                          WHEN ds_policysummary_v2.carriername IN ('Mendota Insurance - AZ', 'Mendota Insurance - CO' , 'Mendota Insurance - IN', 'Mendota Insurance - MS', 'Mendota Insurance - NV' , 'Mendota Insurance - TX', 'Mendota Insurance Company')                                                                                                                        THEN 'Mendota Insurance'
                          WHEN ds_policysummary_v2.carriername IN ('National General Insurance' , 'National General Insurance (GMAC) - CA')                                                                                                                                                                                                                                          THEN 'National General Insurance'
                          WHEN ds_policysummary_v2.carriername IN ('Progressive Insurance - AZ' , 'Progressive Insurance - CA', 'Progressive Insurance - CO', 'Progressive Insurance - ID' , 'Progressive Insurance - MT', 'Progressive Insurance - OR', 'Progressive Insurance - TN' , 'Progressive Insurance - TX', 'Progressive Insurance - WA', 'Progressive Insurance Company') THEN 'Progressive Insurance'
                          WHEN ds_policysummary_v2.carriername = 'Texas Ranger MGA'                                                                                                                                                                                                                                                                                                  THEN 'Texas Ranger MGA'
                          ELSE 'OTHER'
                           END
