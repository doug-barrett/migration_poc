    sourceMapping:
      - aliases:
          V_STATES_DILER_REFRESH: c593ff23-e371-42aa-b520-22adc2df35d1
          DS_DIALER_TELESALES_STATES: 7c4e8a01-b002-4131-9e0a-222cfa18e8ec
          V_DLBV_PCCE_DL_5048_5048_CURRENT: e88d9c10-4a6a-46b7-a521-d4c0b1d12694
          V_DLBV_PCCE_DL_5051_5051_CURRENT: 3355ef43-2d06-49f4-9299-54c0a79ac159
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_STATES_DILER_REFRESH') }} AS SELECT DISTINCT ds_dialer_telesales_states.C_CUSTOMERID || ' - ' || CASE WHEN ds_dialer_telesales_states.ACTIVITYTRANSFER = 1 THEN 'Transfer not Sold'
                        ELSE 'Lead not Transfer'
                         END || ' - ' || ds_dialer_telesales_states.Language CustomerID ,
                   ds_dialer_telesales_states.FIRSTNAME ,
                   ds_dialer_telesales_states.LASTNAME ,
                   ds_dialer_telesales_states.PHONE1 ,
                   ds_dialer_telesales_states.PHONE2 ,
                   ds_dialer_telesales_states.HOUR ,
                   ds_dialer_telesales_states.TIMEZONEHOURS ,
                   ds_dialer_telesales_states.TIMEZONE ,
                   ds_dialer_telesales_states.STATECODE
              FROM {{ ref('EDW','DS_DIALER_TELESALES_STATES') }} ds_dialer_telesales_states
              LEFT JOIN {{ ref('STAGE','V_DLBV_PCCE_DL_5048_5048_CURRENT') }} V_DLBV_PCCE_DL_5048_5048_CURRENT
                ON ds_dialer_telesales_states.C_CUSTOMERID = RTRIM(split_part(V_DLBV_PCCE_DL_5048_5048_CURRENT.AccountNumber, '-', 0))
               AND DATE(V_DLBV_PCCE_DL_5048_5048_CURRENT.ImportRuleDate) =CURRENT_DATE()
              LEFT JOIN {{ ref('STAGE','V_DLBV_PCCE_DL_5051_5051_CURRENT') }} V_DLBV_PCCE_DL_5051_5051_CURRENT
                ON ds_dialer_telesales_states.C_CUSTOMERID = RTRIM(split_part(V_DLBV_PCCE_DL_5051_5051_CURRENT.AccountNumber, '-', 0))
               AND DATE(V_DLBV_PCCE_DL_5051_5051_CURRENT.ImportRuleDate) =CURRENT_DATE()
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_CPS_IDNC_CURRENT" DNC
                ON ds_dialer_telesales_states.PHONE1 = DNC.PhoneNumber
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_CPS_IDNC_CURRENT" DNC1
                ON ds_dialer_telesales_states.PHONE2 = DNC1.PhoneNumber
             WHERE ds_dialer_telesales_states.INSERTEDDATE = CURRENT_DATE()
               AND ((HOUR(CURRENT_TIMESTAMP()) <= 8 AND ds_dialer_telesales_states.Hour <= 9) OR (HOUR(CURRENT_TIMESTAMP()) BETWEEN 10 AND 16 AND ds_dialer_telesales_states.Hour <= HOUR(CURRENT_TIMESTAMP())+1) OR HOUR(CURRENT_TIMESTAMP()) >= 17)
               AND V_DLBV_PCCE_DL_5048_5048_CURRENT.AccountNumber IS NULL
               AND V_DLBV_PCCE_DL_5051_5051_CURRENT.AccountNumber IS NULL
               AND DNC.PhoneNumber IS NULL
               AND DNC1.PhoneNumber IS NULL
             ORDER BY ds_dialer_telesales_states.HOUR
