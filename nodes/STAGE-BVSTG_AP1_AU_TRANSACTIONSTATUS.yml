        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','H_TRANSACTION') }} AS h_transaction
              JOIN {{ ref('DATA_VAULT','L_TRANSACTION_TRANSACTIONSTATUS') }} AS l_transaction_transactionstatus
                ON h_transaction.HK_h_transaction = l_transaction_transactionstatus.HK_h_transaction
              JOIN {{ ref('DATA_VAULT','L_ORGANIZATIONTRANSACTIONSTATUSTYPE_TRANSACTIONSTATUS') }} AS l_organizationtransactionstatustype_transactionstatus
                ON l_transaction_transactionstatus.HK_h_transactionstatus = l_organizationtransactionstatustype_transactionstatus.HK_h_transactionstatus
              JOIN {{ ref('STAGE','V_S_AP1_TRANSACTIONSTATUS_MROC_CURRENT') }} v_s_ap1_transactionstatus_mroc_current
                ON l_transaction_transactionstatus.HK_h_transactionstatus = v_s_ap1_transactionstatus_mroc_current.HK_h_transactionstatus
               AND v_s_ap1_transactionstatus_mroc_current.isrowdeleted=0
              JOIN {{ ref('STAGE','V_S_AP1_ORGANIZATIONTRANSACTIONSTATUSTYPE_MROC_CURRENT') }} v_s_ap1_organizationtransactionstatustype_mroc_current
                ON l_organizationtransactionstatustype_transactionstatus.HK_h_organizationtransactionstatustype = v_s_ap1_organizationtransactionstatustype_mroc_current.HK_h_organizationtransactionstatustype
               AND v_s_ap1_organizationtransactionstatustype_mroc_current.isrowdeleted=0
              JOIN {{ ref('STAGE','BVSTG_AP1_TRANSACTION_REFRESH') }} bvstg_ap1_transaction_refresh
                ON h_transaction.transactionid = TO_CHAR(bvstg_ap1_transaction_refresh.transactionid)
             GROUP BY h_transaction.HK_h_transaction ,
                      h_transaction.transactionID ,
                      v_s_ap1_organizationtransactionstatustype_mroc_current.Key
