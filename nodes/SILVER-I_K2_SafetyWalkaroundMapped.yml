      config: {}
      dataType: VARCHAR(15)
      description: The person doing the interaction may not be doing it for their
        Region. But as the data in the safety interaction is only captured at that
        level, the we will use the Creator's BU when they are the same, and a default
        BU when they are different.
      name: CalculatedBusinessUnitCode
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE  --OLD CODE BUT KEEPING IN FOR NOW AS THIS WON'T AFFECT ANYTHING
          KW 20250826   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING - AUCKLAND'
          THEN 'DCC905'--'DXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT = 'CONTRACTING
          - CENTRAL' THEN 'KCC905'--'KXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'CONTRACTING - FIBRE' THEN 'NCC905'--'NXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'CONTRACTING - NORTHERN' THEN 'CCC905'--'CXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'CONTRACTING - NORTHLAND' THEN 'CCC905'--'CXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'CONTRACTING - SOUTHERN' THEN 'LCC905'--'LXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'CONTRACTING - TRANSMISSION' THEN 'MCC905'--'MXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'CORPORATE' THEN 'AHS'--'AXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'NETWORK - ELECTRICITY' THEN 'BHS'--'BXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'NETWORK - FIBRE' THEN 'SBF905'--'SXX'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'CONTRACTING - LEADERSHIP TEAM' THEN 'JCC905'   WHEN L_K2_SAFETYWALKAROUND.BUSINESSUNIT
          = 'CONTRACTING - FUTURE ENERGY' THEN 'JEN905'    --NEW CODE BELOW. BUSINESS
          UNITS IN A AND B DON'T HAVE A 905 SUFFIX / OVERHEAD BUSINESS UNIT    ELSE
          RIGHT(L_K2_SAFETYWALKAROUND.BUSINESSUNIT, 3) +     CASE      WHEN LEFT(RIGHT(L_K2_SAFETYWALKAROUND.BUSINESSUNIT,
          3), 1) IN ('A', 'B') THEN ''      ELSE '905'     END   --ELSE 'UNKNOWN'   END
