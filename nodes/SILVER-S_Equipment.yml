      config: {}
      dataType: NUMBER(38,0)
      description: The value can be either 0 (still in test), 1 out of test by up
        to 30 days, or 2 out of test by more than 30 days. Any equipment that is not
        assigned will have a zero value.
      name: WarningFlag
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN "D_DUEDATE".""DueDate"" IS NULL   THEN 0   WHEN "I_EQUIPMENT".""IsAvailable""
          = 1    AND DATEDIFF(DAY,CAST(CURRENT_TIMESTAMP() AS DATE)),CAST("D_DUEDATE".""DueDate""
          AS DATE)) <= -30 THEN 2   WHEN "I_EQUIPMENT".""IsAvailable"" = 1    AND
          DATEDIFF(DAY,CAST(CURRENT_TIMESTAMP() AS DATE)),CAST("D_DUEDATE".""DueDate""
          AS DATE)) <= 0 THEN 1   ELSE 0  END
