        join:
          joinCondition: |-
            FROM (SELECT DISTINCT DS_COMM_MASTER_POLICY_EXTRACT.*,
                   bvstg_comm_au1_policy_status_extract_cdt.voidflag
              FROM (SELECT DISTINCT POLICYNUMBERFORMATTED,
                   carrier,
                   OFFICE_CODE,
                   to_date(First_written) First_written_date,
                   MOST_RECENT_EFFECTIVEDATE AS EffectiveDate,
                   MOST_RECENT_EXPIRATIONDATE AS ExpirationDate,
                   SOURCE AS SOURCE_DB,
                   CASE WHEN customer_id = concat(policynumberformatted, ' ', carrier) THEN NULL
                        ELSE customer_id
                         END AS Customer_ID -- from "RETAIL_PROD"."SCH_EDW"."DS_COMM_MASTER_POLICY_EXTRACT"      from {{ ref('EDW','DS_COMM_MASTER_POLICY_EXTRACT') }}               where OnlyIn_CDT_NotIn_CS_Flag = '1'     ) as DS_COMM_MASTER_POLICY_EXTRACT             left join      (select distinct        POLICYNUMBERFORMATTED,       case when CARRIERNAME in ('Infinity', 'Kemper') then 'Infinity/Kemper'       when CARRIERNAME in ('Bristol West') then 'Bristol West/Foremost'       when CARRIERNAME = 'Legacy' then 'Legacy/Nevada General'        else CARRIERNAME end as carriername, description,       case when DESCRIPTION= 'Void' then 'Void' end as Voidflag        --from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU1_POLICY_STATUS_EXTRACT_CDT"       FROM {{ ref('STAGE','BVSTG_COMM_AU1_POLICY_STATUS_EXTRACT_CDT') }}       where  DESCRIPTION= 'Void'     ) bvstg_comm_au1_policy_status_extract_cdt     on DS_COMM_MASTER_POLICY_EXTRACT.policynumberformatted = bvstg_comm_au1_policy_status_extract_cdt.POLICYNUMBERFORMATTED      and DS_COMM_MASTER_POLICY_EXTRACT.carrier = bvstg_comm_au1_policy_status_extract_cdt.carriername    ) as DS_COMM_MASTER_POLICY_EXTRACT           left join            (select distinct      DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.policynumberformatted,      DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.carrierdisplayname carrier,     --V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.executionmonth     --from  "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT" V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT     FROM {{ ref('STAGE','V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT') }} V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT         left join     (select distinct       PolicyNumber_CS, CarrierName_CS, PolicyNumberFormatted, CarrierDisplayName      --from "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES"      FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}     ) DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES     on DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.PolicyNumber_CS = V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.PolicyNumber     and DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.CarrierName_CS = V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.Carrier     where isdeleted = 'False' and isduplicate = 'False'    ) V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT    on DS_COMM_MASTER_POLICY_EXTRACT.POLICYNUMBERFORMATTED = V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.POLICYNUMBERFORMATTED    and DS_COMM_MASTER_POLICY_EXTRACT.CARRIER = V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.CARRIER         left join       (select distinct OFFICECODE, Brand      --from "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE") as DS_RETAIL_OFFICE    from {{ ref('EDW','DS_RETAIL_OFFICE') }}) as DS_RETAIL_OFFICE       on       DS_COMM_MASTER_POLICY_EXTRACT.OFFICE_CODE = DS_RETAIL_OFFICE.OFFICECODE
        name: BVSTG_COMM_AU1_VENN_REPORT
        noLinkRefs: []
