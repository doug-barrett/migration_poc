                      FROM {{ ref('STAGE','BVSTG_COMM_AU3_POLICY_PREMIUM_DASHBOARD_ALLSOURCES') }}
                     WHERE metric IN ('WrittenPremium', 'CurrentPremium', 'ReportingPremium', 'EarnedPremium', 'Final_Commission', 'Annualized_WP')
