                   asofmonth,
                   ISLEGACYTRANSACTION,
                   Metric,
                   sum(MetricValue_Actual) AS MetricValue_Actual,
                   sum(MetricValue_Estimated) AS MetricValue_Estimated
              FROM ( SELECT DISTINCT ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.carrier, bvstg_comm_au3_policy_premium_dashboard_allsources.carrier) carrier,
                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.term, bvstg_comm_au3_policy_premium_dashboard_allsources.term) term,
