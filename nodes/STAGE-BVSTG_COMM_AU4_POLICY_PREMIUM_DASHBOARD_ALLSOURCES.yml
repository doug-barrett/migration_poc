                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.paidtype, bvstg_comm_au3_policy_premium_dashboard_allsources.paidtype) paidtype,
                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.nbs_rwl_policy_flag, bvstg_comm_au3_policy_premium_dashboard_allsources.nbs_rwl_policy_flag) nbs_rwl_policy_flag,
                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.customerstate, bvstg_comm_au3_policy_premium_dashboard_allsources.customerstate) customerstate,
                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.isOnlineBinding, bvstg_comm_au3_policy_premium_dashboard_allsources.isOnlineBinding) isOnlineBinding,
                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.isFranchise, bvstg_comm_au3_policy_premium_dashboard_allsources.isFranchise) isFranchise,
                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.TerritoryManagerName, bvstg_comm_au3_policy_premium_dashboard_allsources.TerritoryManagerName) TerritoryManagerName,
                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.asofmonth, bvstg_comm_au3_policy_premium_dashboard_allsources.asofmonth) asofmonth,
