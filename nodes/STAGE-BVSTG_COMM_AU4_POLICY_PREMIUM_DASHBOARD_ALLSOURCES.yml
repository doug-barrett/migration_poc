        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT carrier,
                   term,
                   policysource,
                   customer_type,
                   agency,
                   agencystate,
                   leadtype,
                   lineofbusiness,
                   paidtype,
                   nbs_rwl_policy_flag,
                   customerstate,
