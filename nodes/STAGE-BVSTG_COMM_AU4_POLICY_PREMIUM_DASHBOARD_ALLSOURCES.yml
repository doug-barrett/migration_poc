                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.Metric, bvstg_comm_au3_policy_premium_dashboard_allsources.Metric) Metric,
                   ifnull(bvstg_comm_au1_policy_premium_dashboard_allsources.MetricValue, 0) AS MetricValue_Actual,
                   ifnull(bvstg_comm_au3_policy_premium_dashboard_allsources.MetricValue, 0) AS MetricValue_Estimated
              FROM {{ ref('STAGE','BVSTG_COMM_AU1_POLICY_PREMIUM_DASHBOARD_ALLSOURCES') }} bvstg_comm_au1_policy_premium_dashboard_allsources
              FULL OUTER JOIN (
                    SELECT DISTINCT carrier,
                           term,
                           policysource,
                           customer_type,
                           agency,
                           agencystate,
                           leadtype,
                           lineofbusiness,
                           paidtype,
                           nbs_rwl_policy_flag,
