      customSQL:
        customSQL: ''
      dependencies:
      - locationName: GOLD
        nodeName: SRC_EQPMASFL
      - locationName: GOLD
        nodeName: CDC_BATCH
      join:
        joinCondition: "FROM {{ ref('GOLD', 'SRC_EQPMASFL') }} \"SRC_EQPMASFL\"\n Where Aud_Time <= (Select MAX(Batch_End) FROM {{ ref('GOLD', 'CDC_BATCH') }} )\nAND Aud_Time > (Select MAX(Batch_Start) FROM {{ ref('GOLD', 'CDC_BATCH') }})\nAND (Aud_Code <> 'F' or (Aud_Code is null and Aud_Type = 'RR')) QUALIFY RANK() \nOVER (PARTITION BY  EMCMP, EMEQP0\nORDER BY AUD_TIME DESC, AUD_SEQNO DESC, CASE  \nWHEN Aud_Type in ('PT','PX','FI')\tTHEN 1 \nWHEN Aud_Type in ('UB','FB','FP','BR')\tTHEN 2 \nWHEN Aud_Type in ('UP','UR')\tTHEN 3 \nWHEN Aud_Type in ('DL','FD')\tTHEN 4 \nWHEN Aud_Type in ('RR')\t\tTHEN 5  \n ELSE 0 END DESC) = 1"
