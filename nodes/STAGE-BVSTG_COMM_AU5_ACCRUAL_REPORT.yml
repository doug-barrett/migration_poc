                              FROM {{ ref('STAGE','V_PRED_MONTHS') }}
                             CROSS JOIN (
                                    SELECT DISTINCT carriername_grouped,
                                           carrierdisplayname,
                                           statecode,
                                           branch,
                                           officecode
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU3_ACCRUAL_REPORT') }}
                                   ) bvstg_comm_au3_accrual_report
                             WHERE year(min_date) >= 2020
                               AND min_date <= current_date()-1
                           ) v_pred_months
                      LEFT JOIN {{ ref('STAGE','BVSTG_COMM_AU3_ACCRUAL_REPORT') }} bvstg_comm_au3_accrual_report
                        ON v_pred_months.asofmonth = bvstg_comm_au3_accrual_report.month
                       AND v_pred_months.carriername_grouped = bvstg_comm_au3_accrual_report.carriername_Grouped
                       AND v_pred_months.carrierdisplayname = bvstg_comm_au3_accrual_report.carrierdisplayname
                       AND v_pred_months.statecode = bvstg_comm_au3_accrual_report.statecode
                       AND v_pred_months.branch = bvstg_comm_au3_accrual_report.branch
                       AND ifnull(v_pred_months.officecode, '-') = ifnull(bvstg_comm_au3_accrual_report.officecode, '-')
                     WHERE bvstg_comm_au3_accrual_report.CarrierDisplayName NOT IN (
                            SELECT DISTINCT CarrierDisplayName
                              FROM {{ ref('STAGE','BVSTG_COMM_AU1_ACCRUAL_REPORT') }}
                           )
                   ) bvstg_comm_au3_accrual_report
