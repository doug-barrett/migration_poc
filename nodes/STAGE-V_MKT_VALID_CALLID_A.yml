        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_MKT_VALID_CALLID_A') }} AS SELECT LeadID,
                   callid,
                   TRUE isValid
              FROM (
                    SELECT LeadID,
                           CallID,
                           DATEDIFF(SECOND,CallDate,lead_Created),
                           (Rank() OVER (PARTITION BY LeadID ORDER BY DATEDIFF(SECOND,CallDate,lead_Created) DESC)) ranking
                      FROM {{ ref('STAGE','BVSTG_MKT_AU3C_LEADSOURCE') }}
                     WHERE LeadSource='Phone AppOne'
                       AND (PhoneNumber = HomePhone OR CellPhone = PhoneNumber OR ContactPhone = PhoneNumber)
                       AND leadid NOT IN (
                            SELECT LeadID
                              FROM {{ ref('STAGE','V_MKT_VALID_LEADID_A') }}
                           )
                   )
             WHERE ranking=1
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_MKT_AU3C_LEADSOURCE
          - locationName: STAGE
            nodeName: V_MKT_VALID_LEADID_A
