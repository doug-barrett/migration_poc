    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_PHONEEXECUTIONSCORE_SUMMARY
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT *,
                   (SDS_pts + Anc_pts + Ret_pts) * 100 AS PE_SCORE,
                   GREATEST(1, CEIL((SDS_pts + Anc_pts + Ret_pts) * 10)) AS PE_CISCO
              FROM ( SELECT f.*, -- Rank for ancillary revenue         RANK() OVER (PARTITION BY Statecode,DATE(StartDate), DATE(EndDate) ORDER BY ancillary_rev_per_policy DESC) AS ancillary_rank,         -- Percent rank used for ANC points         ROUND((1 - PERCENT_RANK() OVER (PARTITION BY Statecode, DATE(StartDate), DATE(EndDate) ORDER BY ancillary_rev_per_policy DESC)) * 0.2, 2) AS Anc_pts      FROM (    SELECT  --ds.HR_STATUS,         a.SalesVP    AS SalesVP,               a.DistrictManagerName AS DistrictManager,         a.OfficeCode AS OfficeCode,         a.STATECODE AS Statecode,         a.FullName AS FullName,         a.LoginName AS LoginName,         a.EmployeeNumber AS EmployeeNumber,         a.JobTitle AS JobTitle,         a.StartDate AS StartDate,         a.EndDate AS EndDate,         RO.DISTRICTCODE,         CASE WHEN CONTAINS(UPPER(RO.AGENCYNAME), 'FREEWAY')=TRUE          THEN 'Freeway' ELSE RO.AGENCYNAME END AS AGENCYNAME,         ts.Own_SameDay_SFT,         ts.Total_transfer,         ts.OwnSameDaySalesFromTransfer,         anc.ancillary_rev,         anc.NewBusiness,         anc.ancillary_rev_per_policy,         ret.M3_RETENTION_CY,         round(OwnSameDaySalesFromTransfer * 0.5, 2) AS SDS_pts,         round(CASE WHEN ret.M3_RETENTION_CY IS NULL THEN 0.5 * 0.3 ELSE ret.M3_RETENTION_CY * 0.3 END,2) AS Ret_pts     FROM "RETAIL_PROD"."SCH_EDW"."DS_PHONEEXECUTIONSCORE_SUMMARY" a     LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" RO            ON a.OfficeCode = RO.OFFICECODE     LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY" ds            ON a.employeenumber = ds.EMPLOYEENUMBER           AND ds.RANK_EMPLOYEENUMBER = 1     LEFT JOIN (     SELECT         p.employeenumber,         p.startdate,         p.enddate,  COALESCE(SUM(CASE      WHEN FL_EMPLOYEENUMBER = TR_EMPLOYEENUMBER      AND ACTIVITYTYPENAME IN (         'TSC - Quote Transfer',         'TSC - Specialty Transfer',         'TSC - Transfer Rejected')     THEN 1 ELSE 0 END), 0) AS Own_SameDay_SFT,   COALESCE(SUM(CASE      WHEN ACTIVITYTYPENAME IN (         'TSC - Quote Transfer',         'TSC - Specialty Transfer',         'TSC - Transfer Rejected')     THEN ISTRANSFER ELSE 0 END), 0) AS Total_transfer,   CASE    WHEN Total_transfer = 0 THEN 0   ELSE Own_SameDay_SFT * 1.0 / Total_transfer END AS OwnSameDaySalesFromTransfer      FROM (     SELECT DISTINCT         employeenumber,         startdate,         enddate     FROM "RETAIL_PROD"."SCH_EDW"."DS_PHONEEXECUTIONSCORE_SUMMARY"     where startdate >= '2025-01-01' ) p     LEFT JOIN RETAIL_PROD.SCH_EDW.DS_2STEP ts       ON ts.fl_employeenumber = p.employeenumber      AND ts.created BETWEEN p.startdate AND p.enddate     GROUP BY p.employeenumber, p.startdate, p.enddate ) as ts            ON a.employeenumber = ts.employeenumber           AND a.startdate = ts.startdate           AND a.enddate = ts.enddate     LEFT JOIN (SELECT p.employeenumber,                p.startdate,                p.enddate,                SUM(i."AMOUNT_POS") AS ancillary_rev,                SUM(CASE WHEN  i."LOBType" NOT IN ('Renters', 'Renters-USAG', 'Renters Liability','Motor Home (RV)') OR "LOBType" IS NULL  THEN i."TotalNewPolicy" END)                 AS NewBusiness,                COALESCE(ROUND(SUM(i."AMOUNT_POS") /   NULLIF(SUM(CASE WHEN i."LOBType" NOT IN ('Renters','Renters-USAG','Renters Liability','Motor Home (RV)')   OR i."LOBType" IS NULL THEN i."TotalNewPolicy" END),0),2),0) AS Ancillary_rev_per_policy                  FROM (     SELECT DISTINCT         employeenumber,         startdate,         enddate     FROM "RETAIL_PROD"."SCH_EDW"."DS_PHONEEXECUTIONSCORE_SUMMARY"     where startdate >= '2025-01-01' ) p                JOIN RETAIL_PROD.SCH_EDW.V_FACT_RETAIL_SUMMARY i                ON i."PrimaryAgentUltipro_Broker" = p.employeenumber
        name: BVSTG_PES_SUMMARY
        noLinkRefs: []
