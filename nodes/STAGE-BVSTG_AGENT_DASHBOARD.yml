    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            FROM (
                    SELECT PrimaryAgentUltipro_Broker AS EMPLOYEENUMBER ,
                           date(CreatedDate) AS DATE ,
                           SUM(Total_Quotes) AS Total_Quotes ,
                           SUM(New_Quotes_Auto_Count) AS NSAQuotes ,
                           SUM(NB_Auto_Count) AS NewNSA ,
                           SUM(Renewal_Auto_Count) AS RenewalNSA ,
                           SUM(Renewal_Auto_Count)+ SUM(NB_Auto_Count) AS TotalNSA ,
                           SUM(NEW_QUOTES_COMP_COUNT) AS ComplQuote ,
                           SUM(TOTALPOLICY) AS TOTALPOLICY ,
                           SUM(NB_COMP_COUNT) AS NewCompl ,
                           SUM(RENEWAL_COMP_COUNT) AS RenewalCompl ,
                           SUM(RENEWAL_COMP_COUNT) + SUM(NB_COMP_COUNT) AS TotalCompl ,
                           SUM(TOTALNEWPOLICY) AS TOTALNEWPOLICY ,
                           SUM(Total_Ancillary_Count) AS TotalAncillary ,
                           SUM(TOTAL_FEE_COUNT) AS TOTAL_FEE_COUNT ,
                           SUM(TOTAL_FEE_AMT) AS TOTAL_FEE_AMT ,
                           SUM(TOTAL_SERVICETRANSACTIONSFEE_AMT) AS TOTAL_SERVICETRANSACTIONSFEE_AMT ,
                           SUM(Endorsement_Auto_Count + Endorsement_Comp_Count) AS Endorsements
                      FROM RETAIL_PROD.SCH_EDW.FACT_RETAIL_SUMMARY
                     WHERE date(CreatedDate)>='2023-01-01'
                     GROUP BY PrimaryAgentUltipro_Broker,
                              date(CreatedDate)
                   )FACT_RETAIL_SUMMARY
              FULL JOIN (
                    SELECT DATE AS DATE,
                           EMPLOYEENUMBER AS EMPLOYEENUMBER,
                           SUM(LOGGEDONTIME) AS LOGGEDONTIME,
                           SUM(ASDR_ISINBOUNDOFFERED) AS InboundCallsOffered,
                           SUM(ASDR_ISINBOUNDANSWERED) AS InboundCallAnswered,
                           SUM(CALLSHANDLED) AS CALLSHANDLED,
                           SUM(TALKINTIME) AS TALKINTIME,
                           SUM(TALKOTHERTIME) AS TALKOTHERTIME,
                           SUM(TALKOUTTIME) AS TALKOUTTIME,
                           SUM(HOLDTIME) AS HOLDTIME,
                           SUM(ABANDONHOLDCALLS) AS ABANDONHOLDCALLS,
                           SUM(TRANSFERREDOUTCALLS) AS TRANSFERREDOUTCALLS,
                           SUM(NOTREADYTIME) AS NOTREADYTIME
                      FROM SCH_EDW.DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY
                     WHERE DATE(DATE) >= '2023-01-01'
                     GROUP BY DATE, EMPLOYEENUMBER
                   )DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY
                ON FACT_RETAIL_SUMMARY.DATE = DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.DATE
               AND FACT_RETAIL_SUMMARY.EMPLOYEENUMBER = DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.EMPLOYEENUMBER
             WHERE IFNULL(FACT_RETAIL_SUMMARY.EMPLOYEENUMBER,DS_PCCE_TERMINATION_CALL_AGENT_SUMMARY.EMPLOYEENUMBER) IS NOT NULL
        name: BVSTG_AGENT_DASHBOARD
        noLinkRefs: []
