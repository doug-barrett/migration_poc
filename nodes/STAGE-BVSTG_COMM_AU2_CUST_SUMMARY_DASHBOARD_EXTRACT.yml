        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT last_carrier ,
                   max(m1_cancellationrate) m1_cancellationrate ,
                   max(m2_cancellationrate) m2_cancellationrate ,
                   max(m3_cancellationrate) m3_cancellationrate ,
                   max(m1_renewalrate) m1_renewalrate ,
                   max(m2_renewalrate) m2_renewalrate ,
                   max(m3_renewalrate) m3_renewalrate ,
                   max(m1_pendingrenewalrate) m1_pendingrenewalrate ,
                   max(m2_pendingrenewalrate) m2_pendingrenewalrate ,
                   max(m3_pendingrenewalrate) m3_pendingrenewalrate ,
                   max(m1_reinstatementrate) m1_reinstatementrate ,
                   max(m2_reinstatementrate) m2_reinstatementrate ,
                   max(m3_reinstatementrate) m3_reinstatementrate
              FROM ( SELECT last_carrier ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 4) THEN cancellationrate
                        ELSE 0
                         END AS m1_cancellationrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 3) THEN cancellationrate
                        ELSE 0
                         END AS m2_cancellationrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 2) THEN cancellationrate
                        ELSE 0
                         END AS m3_cancellationrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 4) THEN renewalrate
                        ELSE 0
                         END AS m1_renewalrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 3) THEN renewalrate
                        ELSE 0
                         END AS m2_renewalrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 2) THEN renewalrate
                        ELSE 0
                         END AS m3_renewalrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 4) THEN pendingrenewalrate
                        ELSE 0
                         END AS m1_pendingrenewalrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 3) THEN pendingrenewalrate
                        ELSE 0
                         END AS m2_pendingrenewalrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 2) THEN pendingrenewalrate
                        ELSE 0
                         END AS m3_pendingrenewalrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 4) THEN reinstatementrate
                        ELSE 0
                         END AS m1_reinstatementrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 3) THEN reinstatementrate
                        ELSE 0
                         END AS m2_reinstatementrate ,
                   CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE ()), - 2) THEN reinstatementrate
                        ELSE 0
                         END AS m3_reinstatementrate
              FROM ( SELECT last_carrier ,
                   cutoffdate ,
                   sum(CASE WHEN metric = 'Cancelled' THEN MetricValue END) / sum(CASE WHEN metric = 'CIF_BOM' THEN MetricValue END) cancellationrate ,
                   sum(CASE WHEN metric = 'Renewals' THEN MetricValue END) / sum(CASE WHEN metric = 'Expiring_Renewals' THEN MetricValue END) renewalrate ,
                   sum(CASE WHEN metric = 'Expiring_Renewals' THEN MetricValue END) / sum(CASE WHEN metric = 'CIF_BOM' THEN MetricValue END) pendingrenewalrate ,
                   sum(CASE WHEN metric = 'Reinstated' THEN MetricValue END) / sum(CASE WHEN metric = 'CIF_BOM' THEN MetricValue END) reinstatementrate
              FROM ( SELECT last_carrier ,
                   cutoffdate ,
                   metric ,
                   sum(metricvalue) metricvalue
              FROM {{ ref('STAGE','BVSTG_COMM_AU1_CUST_SUMMARY_DASHBOARD_EXTRACT') }} bvstg_comm_au1_cust_summary_dashboard_extract -- from "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_COMM_AU1_CUST_SUMMARY_DASHBOARD_EXTRACT" bvstg_comm_au1_cust_summary_dashboard_extract      WHERE metric IN ('CIF_BOM', 'Cancelled', 'Renewals', 'Expiring_Renewals', 'Reinstated')       AND cutoffdate >= add_months(date_trunc('month', CURRENT_DATE ()), - 4)       AND cutoffdate <= add_months(date_trunc('month', CURRENT_DATE ()), - 2)      GROUP BY last_carrier       ,cutoffda
        name: BVSTG_COMM_AU2_CUST_SUMMARY_DASHBOARD_EXTRACT
