        config: {}
        dataType: VARCHAR(5000)
        defaultValue: ""
        description: ""
        name: DIALERFILTER
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN isInactive = 0                                                             THEN 'isInactive'
                          WHEN SourceDb != 'AppOne'                                                       THEN 'SourceDb'
                          WHEN DATEDIFF('DAY',bvstg_au3_inactive_policies.Status_Date,CURRENT_DATE()) > 7 THEN 'MAJOR THAN CANCEL_7_DAYS'
                          WHEN CUSTOMERSTATE IN('FL','NV','NJ','GA','NY','TN')                           THEN 'CUSTOMERSTATE'
                          WHEN PRIMARY_AGENT_OFFICE like '%SSB%'                                          THEN 'SSB'
                          WHEN Primary_Agent_Office IN ('JOR','COLT')                                     THEN 'JOR/COLT'
                          WHEN POLICYSTATUS NOT IN('Cancelled non-pay')                                  THEN 'POLICYSTATUS'
                          WHEN bvstg_au3_inactive_policies.ISCANCELREQUEST = 1                            THEN 'ISCANCELREQUEST'
                          WHEN bvstg_au3_inactive_policies.expirationdate <= CURRENT_DATE()               THEN 'expirationdate'
                          WHEN bvstg_au3_inactive_policies.isDNC_Customer = 1                             THEN 'isDNC_Customer'
