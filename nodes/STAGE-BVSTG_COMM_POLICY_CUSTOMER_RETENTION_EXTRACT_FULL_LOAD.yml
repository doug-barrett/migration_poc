            nodeName: BVSTG_COMM_AU5_POLICY_CUSTOMER_RETENTION_EXTRACT
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_COMM_AU5_POLICY_CUSTOMER_RETENTION_EXTRACT') }}
              LEFT JOIN (
                    SELECT DISTINCT policynumberformatted,
                           carrier,
                           policy_employeenumber,
                           policy_officecode,
                           policy_producer,
                           policy_nbsmonth,
                           policy_policysource,
                           policynumberformatted_old,
                           carrier_old
                      FROM {{ ref('STAGE','BVSTG_COMM_AU5_POLICY_CUSTOMER_RETENTION_EXTRACT') }} QUALIFY row_number() OVER (PARTITION BY policynumberformatted_old,carrier_old ORDER BY policy_asofmonth)=1
                   ) bvstg_comm_au4_policy_customer_retention_extract
                ON bvstg_comm_au5_policy_customer_retention_extract.policynumberformatted_old=bvstg_comm_au4_policy_customer_retention_extract.policynumberformatted_old
               AND bvstg_comm_au5_policy_customer_retention_extract.carrier_old=bvstg_comm_au4_policy_customer_retention_extract.carrier_old
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }}
                ON bvstg_comm_au4_policy_customer_retention_extract.policy_officecode=DS_RETAIL_OFFICE.officecode
             WHERE channel='NSA'
               AND officetype IN ('Retail','Call Center')
               AND cutoffdate<=date_trunc('month',add_months(CURRENT_DATE,-1))
