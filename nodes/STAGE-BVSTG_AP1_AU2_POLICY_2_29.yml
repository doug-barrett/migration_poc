        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT *
                      FROM (
                            SELECT *,
                                   RANK() OVER (PARTITION BY HK_h_transactionpolicy ORDER BY DSS_VERSION DESC) AS rankver
                              FROM {{ ref('DATA_VAULT','S_AP1_TRANSACTIONPOLICY_MROC') }}
                             WHERE DSS_CREATE_TIME<='2020-02-29'
                           )
                     WHERE rankver = 1
                   ) s_ap1_transactionpolicy_mroc_fix
              JOIN {{ ref('DATA_VAULT','H_TRANSACTION') }} h_transaction
                ON CAST(s_ap1_transactionpolicy_mroc_fix.transactionID AS VARCHAR(50))= h_transaction.transactionID
              JOIN {{ ref('DATA_VAULT','H_POLICY') }} h_policy
                ON s_ap1_transactionpolicy_mroc_fix.policyID = h_policy.policyID
              JOIN (
                    SELECT *
                      FROM (
                            SELECT *,
                                   RANK() OVER (PARTITION BY HK_h_policy ORDER BY DSS_VERSION DESC) AS rankver
                              FROM {{ ref('DATA_VAULT','S_AP1_POLICY_MROC') }}
                             WHERE DSS_CREATE_TIME<='2020-02-29'
                           )
                     WHERE rankver = 1
                   ) s_ap1_policy_mroc
                ON h_policy.policyID = s_ap1_policy_mroc.policyID
               AND s_ap1_policy_mroc.isrowdeleted=0
              JOIN (
                    SELECT *
                      FROM (
                            SELECT *,
                                   RANK() OVER (PARTITION BY TransactionID ORDER BY DSS_VERSION DESC) AS rankver
                              FROM {{ ref('DATA_VAULT','S_AP1_TRANSACTION_MROC') }}
                             WHERE DSS_CREATE_TIME<='2020-02-29'
                           )
                     WHERE rankver = 1
                   ) s_ap1_transaction_mroc
                ON h_transaction.HK_h_transaction = s_ap1_transaction_mroc.HK_h_transaction
               AND s_ap1_transaction_mroc.isrowdeleted=0
              LEFT JOIN {{ ref('DATA_VAULT','H_LINEOFBUSINESSTYPE') }} h_lineofbusinesstype
                ON s_ap1_policy_mroc.lineofbusinessid = h_lineofbusinesstype.lineofbusinesstypeid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_LINEOFBUSINESSTYPE_MROC_CURRENT') }} v_s_ap1_lineofbusinesstype_mroc_current
                ON h_lineofbusinesstype.HK_h_lineofbusinesstype = v_s_ap1_lineofbusinesstype_mroc_current.HK_h_lineofbusinesstype
               AND v_s_ap1_lineofbusinesstype_mroc_current.isrowdeleted=0
              LEFT JOIN {{ ref('DATA_VAULT','H_PROGRAM') }} h_program
                ON s_ap1_policy_mroc.programid = h_program.programid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_PROGRAM_MROC_CURRENT') }} v_s_ap1_program_mroc_current
                ON h_program.HK_h_program =v_s_ap1_program_mroc_current.HK_h_program
              LEFT JOIN {{ ref('DATA_VAULT','H_CARRIER') }} h_carrier
                ON v_s_ap1_program_mroc_current.carrierid = h_carrier.carrierid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CARRIER_MROC_CURRENT') }} v_s_ap1_carrier_mroc_current
                ON h_carrier.HK_h_carrier =v_s_ap1_carrier_mroc_current.HK_h_carrier
              LEFT JOIN {{ ref('DATA_VAULT','H_MASTERCARRIER') }} h_mastercarrier
                ON v_s_ap1_carrier_mroc_current.mastercarrierid = h_mastercarrier.mastercarrierid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_MASTERCARRIER_MROC_CURRENT') }} v_s_ap1_mastercarrier_mroc_current
                ON h_mastercarrier.HK_h_mastercarrier = v_s_ap1_mastercarrier_mroc_current.HK_h_mastercarrier
               AND v_s_ap1_mastercarrier_mroc_current.isrowdeleted=0
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue
                ON s_ap1_policy_mroc.termid = ref_ap1_codevalue.codevalueid
              LEFT JOIN {{ ref('DATA_VAULT','H_CUSTOMER') }} h_customer
                ON TO_CHAR(s_ap1_policy_mroc.customerid) = h_customer.customerid
              JOIN (
                    SELECT *
                      FROM (
                            SELECT *,
                                   rank() OVER (PARTITION BY Policyid ORDER BY DSS_VERSION DESC,DSS_LOAD_DATE DESC) AS rankver
                              FROM {{ ref('STAGE','V_S_AP1_POLICYACTUALSTATUS_MROC_CURRENT') }}
                             WHERE DSS_CREATE_TIME<='2020-02-29'
                           )
                     WHERE rankver = 1
                   ) v_s_ap1_policyactualstatus_mroc_current
