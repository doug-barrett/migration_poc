      name: CONTRACT_SEQ_TYPE_CODE
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: "CASE\n\n WHEN \"CYCLE_BILL_COUNT\"=1 AND \"RECORD_SOURCE_CODE\"='R6'\n\n  THEN 'FCB'\n\n WHEN  \"RECORD_SOURCE_CODE\"='R6' AND \"CYCLE_BILL_COUNT\">1\n\n  THEN 'CYC'\n\n WHEN (\"RECORD_SOURCE_CODE\"='R1' OR \"INVOICE_ORDER_TYPE\"='F')\n\n  THEN 'FRT'\n\n WHEN (\"RECORD_SOURCE_CODE\"='R2' OR \"INVOICE_ORDER_TYPE\"='P')\n\n  THEN 'PRT'\n\n WHEN (\"RECORD_SOURCE_CODE\"='R4' OR \"INVOICE_ORDER_TYPE\"='E')\n\n  THEN 'EXC'\n\n WHEN  \"RECORD_SOURCE_CODE\" IN ('CR','R5')\n\n  THEN 'CRE'\n\n WHEN  \"RECORD_SOURCE_CODE\"='AT'\n\n  THEN 'ATA'\n\n WHEN  \"RECORD_SOURCE_CODE\"='R7'\n\n  THEN 'RPU'\n\n WHEN  \"RECORD_SOURCE_CODE\" in ('S1','S2','W1','XC')\n\n  THEN 'ONB'\n\n WHEN  \"RECORD_SOURCE_CODE\"='XC'\n\n  THEN 'CAR'\n\n WHEN \"ORDER_TYPE_CODE\" in ('X','R') AND \"ORDER_SEQ_NUM\"=0\n\n  THEN 'PEN'\n\n WHEN \"ORDER_TYPE_CODE\" IN ('X','R','U','T','Y')\n\n   AND \"ORDER_SEQ_NUM\"=0\n\n  THEN 'CQR'\n\n WHEN \"ORDER_TYPE_CODE\"='I'\n\n  THEN 'INT'\n\n WHEN \"ORDER_TYPE_CODE\" ='O'\
          \ AND \"ORDER_SEQ_NUM\"=0\n\n  THEN 'OPE'\n\n ELSE 'UNK'\n\nEND"
