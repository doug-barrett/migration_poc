            FROM {{ ref('DATA_VAULT','S_AMS_INVOICETRANSACTION_MROC') }} s_ams_invoicetransaction_mroc_start
             INNER JOIN {{ ref('STAGE','V_S_AMS_INVOICE_MROC_CURRENT') }} v_s_ams_invoice_mroc_current_start
                ON (s_ams_invoicetransaction_mroc_start.INVID = v_s_ams_invoice_mroc_current_start.INVID)
             INNER JOIN {{ ref('DATA_VAULT','S_AMS_BASICPOLINFO_MROC') }} s_ams_basicpolinfo_mroc
                ON (v_s_ams_invoice_mroc_current_start.POLID = s_ams_basicpolinfo_mroc.PolID)
             INNER JOIN {{ ref('STAGE','V_S_AMS_INVOICE_MROC_CURRENT') }} v_s_ams_invoice_mroc_current
