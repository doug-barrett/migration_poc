      join:
        joinCondition: |-
          FROM {{ ref('LOAD', 'LoadRevenueBudgets') }} "LoadRevenueBudgets"
          LEFT JOIN {{ ref('DIM', 'Solicitation') }} "Solicitation"
            ON LoadRevenueBudgets.ContractId = Solicitation.SolicitationNumber
          LEFT JOIN {{ ref('DIM', 'Contract') }} "Contract"
            ON LoadRevenueBudgets.ContractId = Contract.ContractId
          LEFT JOIN {{ ref('DIM', 'TerritoryHistory') }} "TerritoryHistory"
            ON LoadRevenueBudgets.TerritoryId = TerritoryHistory.TerritoryId AND LoadRevenueBudgets.BudgetDate BETWEEN TerritoryHistory.TerritoryManagerStartDate AND TerritoryHistory.TerritoryManagerEndDate
          LEFT JOIN {{ ref('DIM', 'SupplierPDHistory') }} "SupplierPDHistory"
            ON Contract.SupplierKey = SupplierPDHistory.SupplierKey AND LoadRevenueBudgets.BudgetDate BETWEEN SupplierPDHistory.StartDate AND SupplierPDHistory.EndDate
          LEFT JOIN {{ ref('DIM', 'Account') }} "Account"
          LEFT JOIN {{ ref('DIM', 'DimBudgetDate') }} "DimBudgetDate"
