        join:
          joinCondition: |-
            FROM ( SELECT bvstg_comm_au1_cspredw.*,
                   v_bvstg_comm_pr_pif_premium.as_of_date,
                   v_bvstg_comm_pr_pif_premium.PIF AS PIF_PR,
                   v_bvstg_comm_pr_pif_premium.Premium AS Premium_PR,
                   ds_comm_summary_dashboard_extract.PIF_EDW,
                   ds_comm_policy_premium_dashboard_allsources.Reporting_Premium
              FROM {{ ref('STAGE','BVSTG_COMM_AU1_CSPREDW') }} bvstg_comm_au1_cspredw --from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU1_CSPREDW" bvstg_comm_au_cspredw  left join {{ ref('UNKNOWN','V_BVSTG_COMM_PR_PIF_PREMIUM') }} v_bvstg_comm_pr_pif_premium  --left join "RETAIL_PROD"."SCH_BVSTAGE"."V_BVSTG_COMM_PR_PIF_PREMIUM" v_bvstg_comm_pr_pif_premium   on bvstg_comm_au1_cspredw.carrier=v_bvstg_comm_pr_pif_premium.carrier               and bvstg_comm_au1_cspredw.cutoffdate = v_bvstg_comm_pr_pif_premium.as_of_date  left join (    select asofmonth cutoffdate, Carrier,      sum(metricvalue) as PIF_EDW    from (select asofmonth, case when carrier = 'Infinity/Kemper' then 'Infinity'       when carrier = 'Bristol West/Foremost'then 'Bristol West'       when carrier='Legacy/Nevada General' then 'Legacy'       when Carrier like 'Bluefire%' then 'Bluefire'      else carrier end as Carrier,metricvalue from {{ ref('EDW','DS_COMM_SUMMARY_DASHBOARD_EXTRACT') }} where metric ='PIF_EOM') DS_COMM_SUMMARY_DASHBOARD_EXTRACT        group by asofmonth,carrier) ds_comm_summary_dashboard_extract  on bvstg_comm_au1_cspredw.carrier=ds_comm_summary_dashboard_extract.carrier and bvstg_comm_au1_cspredw.cutoffdate=ds_comm_summary_dashboard_extract.cutoffdate  left join (     select  asofmonth, Carrier,sum(metricvalue) as Reporting_Premium               from (select asofmonth, case when carrier = 'Infinity/Kemper' then 'Infinity'       when carrier = 'Bristol West/Foremost'then 'Bristol West'       when carrier='Legacy/Nevada General' then 'Legacy'       when Carrier like 'Bluefire%' then 'Bluefire'      else carrier end as Carrier,metricvalue from {{ ref('EDW','DS_COMM_POLICY_PREMIUM_DASHBOARD_ALLSOURCES') }} where metric='ReportingPremium') DS_COMM_POLICY_PREMIUM_DASHBOARD_ALLSOURCES        group by carrier,asofmonth     order by carrier,asofmonth)  ds_comm_policy_premium_dashboard_allsources  on bvstg_comm_au1_cspredw.carrier=ds_comm_policy_premium_dashboard_allsources.carrier and    bvstg_comm_au1_cspredw.cutoffdate=ds_comm_policy_premium_dashboard_allsources.asofmonth) bvstg_comm_au1_cspredw  where as_of_date is not null
