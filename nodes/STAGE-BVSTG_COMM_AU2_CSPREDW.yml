        join:
          joinCondition: |-
            FROM ( SELECT bvstg_comm_au1_cspredw.*,
                   v_bvstg_comm_pr_pif_premium.as_of_date,
                   v_bvstg_comm_pr_pif_premium.PIF AS PIF_PR,
                   v_bvstg_comm_pr_pif_premium.Premium AS Premium_PR,
