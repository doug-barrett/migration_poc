        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_TABLEAU_AU4
        join:
          joinCondition: |-
            EXTENDED
              FROM ( WITH T1 AS (
                    SELECT DS_NSA_RWL_NSA_APP.*,
                           NSA_MODEL.MODEL_INSERTED_DATE,
                           NSA_MODEL.CARRIER_UNION,
                           CASE WHEN NSA_MODEL.CARRIER_UNION = 'Progressive Insurance' THEN 'Progressive'
                                ELSE 'Other'
                                 END AS FLAG_PROGRESSIVE,
                           NSA_MODEL.PROBS,
                           CASE WHEN NSA_MODEL.PROBS IS NULL THEN 'NOT_SCORED'
                                ELSE 'SCORED'
                                 END AS FLAG_SCORED,
                           NSA_MODEL.DECILE,
                           NSA_MODEL.DECILE_LABEL,
                           MR_EXTRACT.DECILE AS MR_DECILE,
                           MR_EXTRACT.INSERTEDDATE AS MR_INSERTEDDATE,
                           MR_EXTRACT.FLAG_MODEL,
                           CASE WHEN MR_EXTRACT.INSERTEDDATE IS NOT NULL THEN 'INSERTED'
                                ELSE 'NOT_INSERTED'
                                 END AS FLAG_MR_INSERTED,
                           CASE WHEN NSA_MODEL.DECILE IS NULL AND MR_EXTRACT.INSERTEDDATE IS NULL THEN 'NOT_EVALUATED_AND_NOT_INSERTED'
                                ELSE 'CONTINUE'
                                 END AS FLAG_CONTINUE,
                           CASE WHEN NSA_MODEL.DECILE IS NULL AND MR_EXTRACT.INSERTEDDATE IS NOT NULL THEN 'NOT_SCORED'
                                ELSE 'CONTINUE'
                                 END AS FLAG_NOT_SCORED_BUT_SEND
                      FROM (
                            SELECT ID,
                                   ROWTYPE,
                                   TRANSACTIONID,
                                   CUSTOMERID,
                                   TRANSACTIONTYPE,
                                   SALEDATE,
                                   EFFECTIVEDATE,
                                   BIA_EXPIRATIONDATE,
                                   BIA_STATUSDATE,
                                   INSERTED_DATE,
                                   CALL_FROM
                              FROM RETAIL_DEV.SCH_EDW.DS_NSA_RWL_NSA_APP
                             WHERE 1=1
                               AND ROWTYPE <> 'NBS'
                               AND TRANSACTIONTYPE = 'New Business'
                           ) DS_NSA_RWL_NSA_APP
                      LEFT JOIN (
                            SELECT INSERTED_DATE AS MODEL_INSERTED_DATE,
                                   TRANSACTIONID,
                                   CUSTOMERID,
                                   CARRIER_UNION,
                                   ROUND(RENEWALPROBABILITY,2)*100 AS PROBS,
                                   DECILE,
                                   DECILE_LABEL
                              FROM RETAIL_PROD.SCH_EDW.DS_NSA_RENEWAL_ZERO_MODEL_HISTORY
                           ) NSA_MODEL
                        ON (DS_NSA_RWL_NSA_APP.TRANSACTIONID = NSA_MODEL.TRANSACTIONID)
                      LEFT JOIN (
                            SELECT ID,
                                   TRANSACTIONID,
                                   DECILE,
                                   INSERTEDDATE,
                                   FLAG_MODEL
                              FROM DATA_ANALYTICS.DS_FEATURE_REPO.NB_NSA_RWL_FOLLOWUP_EXTRACT
                             WHERE ROWTYPE <> 'NBS'
                           ) MR_EXTRACT
                        ON (DS_NSA_RWL_NSA_APP.ID = MR_EXTRACT.ID)
                     ORDER BY DS_NSA_RWL_NSA_APP.CUSTOMERID ASC
                   ) ,
                   T2 AS (
                    SELECT *
                      FROM T1
                     WHERE (FLAG_MODEL = 'VERSION_02' OR FLAG_MODEL IS NULL)
                       AND FLAG_CONTINUE = 'CONTINUE'
                       AND CALL_FROM >= '2026-02-05'
                     ORDER BY BIA_EXPIRATIONDATE ASC
                   ) ,
                   EXACT_RENEWALS AS (
                    SELECT BL.TRANSACTIONID,
                           BL.CUSTOMERID,
                           BL.SALEDATE ,
                           MAX(CASE WHEN COUNTER IS NULL THEN 0 ELSE 1 END) AS TARGET_RAM ,
                           MAX(CASE WHEN COUNTER IS NULL THEN 'Not Renewed' ELSE RR.CLASSIFICATIONGROUP END) NEXT_POLICY_STATUS_RAM ,
                           MAX(CREATEDDATE) AS MOST_RECENT_CHANGE
                      FROM T2 BL
                      LEFT JOIN (
                            SELECT DISTINCT TRANSACTIONID,
                                   NBTRANSACTIONID,
                                   CUSTOMERID,
                                   DATE(CREATEDDATE) AS CREATEDDATE,
                                   CLASSIFICATIONGROUP,
                                   1 AS COUNTER
                              FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                             WHERE 1 = 1
                               AND LINEOFBUSINESSTYPE = 'Auto'
                               AND SOURCEDB = 'AppOne'
                               AND CLASSIFICATION = 'Carrier Premium'
                               AND CLASSIFICATIONGROUP IN ('New Business', 'Renewal')
                           ) RR
                        ON (BL.CUSTOMERID = RR.CUSTOMERID AND DATE(RR.CREATEDDATE) > BL.SALEDATE AND BL.TRANSACTIONID = RR.NBTRANSACTIONID)
                     GROUP BY BL.TRANSACTIONID,
                              BL.CUSTOMERID,
                              BL.SALEDATE
                     ORDER BY BL.CUSTOMERID ASC
                   ) ,
                   NEW_BUSINESS AS ( SELECT A.TRANSACTIONID,
                   A.CUSTOMERID,
                   A.SALEDATE ,
                   MAX(CASE WHEN RR.COUNTER IS NULL THEN 0 ELSE 1 END) AS TARGET_RAM ,
                   MAX(CASE WHEN RR.COUNTER IS NULL THEN 'Not Renewed' ELSE RR.CLASSIFICATIONGROUP END) NEXT_POLICY_STATUS_RAM ,
                   MAX(CREATEDDATE) AS MOST_RECENT_CHANGE
              FROM (
                    SELECT *
                      FROM EXACT_RENEWALS
                     WHERE TARGET_RAM = 0
                   ) A
              LEFT JOIN (
                    SELECT DISTINCT TRANSACTIONID,
                           NBTRANSACTIONID,
                           CUSTOMERID,
                           DATE(CREATEDDATE) AS CREATEDDATE,
                           CLASSIFICATIONGROUP,
                           1 AS COUNTER
                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                     WHERE 1 = 1
                       AND NBTRANSACTIONID IS NULL
                       AND LINEOFBUSINESSTYPE = 'Auto'
                       AND SOURCEDB = 'AppOne'
                       AND CLASSIFICATION = 'Carrier Premium'
                       AND CLASSIFICATIONGROUP IN ('New Business')
                   ) RR
                ON (A.CUSTOMERID = RR.CUSTOMERID
               AND DATE(RR.CREATEDDATE)
        name: BVSTG_NSA_RWL_TABLEAU_AU4
        noLinkRefs: []
