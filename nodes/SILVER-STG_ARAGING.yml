    - aliases:
        SRC_ARAGING: 0a2419b3-046a-5f8a-a1f7-933dce19ab80
      customSQL:
        customSQL: "select \n\tMonthEnd as PeriodDate\n\t,id as JobId\n\t, company_id\
          \ as CompanyId\n\t,   date as InvoiceDate\n\t, DueDate\n\t, ARAmount\n\t\
          ,OverDuedays as ExactDaysOverdue,\ncase when OverDuedays IS null and date\
          \ is null then '90+'\n     when OverDuedays<=0 then '000'\n\t when OverDuedays>0\
          \ and OverDuedays<=14  then '000-014'\n\t when OverDuedays>14 and OverDuedays<=30\
          \  then '015-030'\n\t When OverDuedays>30 and OverDuedays<=60 then '031-060'\n\
          \t when OverDuedays>60 and OverDuedays<=90 then '061-090'\n         when\
          \ OverDuedays>90 and OverDuedays<=120 then '091-120'\n\t else '120+' end\
          \ as AROverdueDays,LocationId ,'-11' as ItemId,'-11' as TechUsername\nfrom\
          \ \n   (select Dates.MonthEnd,id\n\t\t\t, company_id\n\t\t\t,  date\n\t\t\
          \t, DueDate\n\t\t\t, parent_company_id\n\t\t\t, ARAmount\n\t\t\t, EndDate\n\
          \t\t\t, TransactionDate \n\t\t\t,\ncase when MonthEnd = last_day(curdate())\
          \ then DATEDIFF(curdate(),DueDate) else DATEDIFF(MonthEnd,DueDate) end AS\
          \ OverDuedays,LocationId\n\t from (\nSelect distinct last_day(date) as MonthEnd\
          \  \nfrom transactions\nWHERE date IS NOT NULL) Dates\ncross join\n( \n\
          select f.*\n,Coalesce(Date_Add(invoices.date,INTERVAL companies.terms Day\
          \ ),invoices.date) as DueDate,\ncompanies.id AS company_id,\nParent.id AS\
          \ parent_company_id,\ncompanies.terms,\ninvoices.date AS date,\ninvoices.location_id\
          \ as LocationId\nfrom (select d.id,d.amount as ARAmount,d.TransactionDate,Min(e.TransactionDate)\
          \ as EndDate\nfrom \n(select b.id,  sum(c.Amount) as amount,last_day(b.TransactionDate)\
          \ as TransactionDate\nfrom \n(select   id,Last_day(a.TransactionDate) as\
          \ TransactionDate,SUM(amount) as Amount \nfrom (\nSELECT\ntransactions.invoice_id\
          \ AS id,\ntransactions.type ,\ntransactions.status,\nCASE\nWHEN transactions.type\
          \ IN ('invoiced', 'void') THEN transactions.invoice_amount + transactions.invoice_tax\n\
          ELSE transactions.amount * -1\nEND AS amount,\ntransactions.date AS TransactionDate\
          \ \nFROM\ntransactions  \nwhere transactions.date<=DATE_ADD(curdate(), INTERVAL\
          \ 1 Day)\n)a\ngroup by Last_day(a.TransactionDate),id\n)b \njoin \n    \
          \ (select   id,Last_day(a.TransactionDate) as TransactionDate,SUM(amount)\
          \ as Amount \n\t\tfrom (\n\t\tSELECT\n\t\ttransactions.invoice_id AS id,\n\
          \t\ttransactions.type ,\n\t\ttransactions.status,\n\t\tCASE\n\t\tWHEN transactions.type\
          \ IN ('invoiced', 'void') THEN transactions.invoice_amount + transactions.invoice_tax\n\
          \t\tELSE transactions.amount * -1\n\t\tEND AS amount,\n\t\ttransactions.date\
          \  as TransactionDate\n\t\tFROM\n\t\ttransactions \n \t\twhere transactions.date<=DATE_ADD(curdate(),\
          \ INTERVAL 1 Day)\n\t\t)a\n\t\tgroup by Last_day(a.TransactionDate),id\n\
          \t\t) AS c on  b.id = c.id and last_day(b.TransactionDate) >=last_day(c.TransactionDate)\
          \  \n\t\t group by b.id,last_day(b.TransactionDate))d\n\nleft join   (\n\
          \              select b.id,  sum(c.Amount) as amount,last_day(b.TransactionDate)\
          \ as TransactionDate\nfrom \n(select   id,Last_day(a.TransactionDate) as\
          \ TransactionDate,SUM(amount) as Amount \nfrom (\nSELECT\ntransactions.invoice_id\
          \ AS id,\ntransactions.type ,\ntransactions.status,\nCASE\nWHEN transactions.type\
          \ IN ('invoiced', 'void') THEN transactions.invoice_amount + transactions.invoice_tax\n\
          ELSE transactions.amount * -1\nEND AS amount,\ntransactions.date AS TransactionDate\
          \ \nFROM\ntransactions  \nwhere transactions.date<=DATE_ADD(curdate(), INTERVAL\
          \ 1 Day)\n)a\ngroup by Last_day(a.TransactionDate),id\n)b \njoin \n    \
          \ (select   id,Last_day(a.TransactionDate) as TransactionDate,SUM(amount)\
          \ as Amount \n\t\tfrom (\n\t\tSELECT\n\t\ttransactions.invoice_id AS id,\n\
          \t\ttransactions.type ,\n\t\ttransactions.status,\n\t\tCASE\n\t\tWHEN transactions.type\
          \ IN ('invoiced', 'void') THEN transactions.invoice_amount + transactions.invoice_tax\n\
          \t\tELSE transactions.amount * -1\n\t\tEND AS amount,\n\t\ttransactions.date\
          \ AS TransactionDate \n\t\tFROM\n\t\ttransactions  \n\t\twhere transactions.date<=DATE_ADD(curdate(),\
          \ INTERVAL 1 Day)\n\t\t)a\n\t\tgroup by Last_day(a.TransactionDate),id\n\
          \t\t) AS c on  b.id = c.id and last_day(b.TransactionDate) >=last_day(c.TransactionDate)\
          \  \n\t\t group by b.id,last_day(b.TransactionDate)) e   on  d.id = e.id\
          \ and last_day(d.TransactionDate)<last_day(e.TransactionDate)\n\t\t group\
          \ by  d.id,d.amount,d.TransactionDate\n\t\t )f \nINNER JOIN invoices ON\
          \ invoices.id=f.id \nINNER JOIN companies ON companies.id=invoices.account_company_id\n\
          LEFT JOIN companies Parent ON companies.parent_company_id=Parent.id\n)StageData)Final\n\
          where (case \n\t\t\twhen EndDate is not null and MonthEnd between TransactionDate\
          \ and last_day(date_add(last_day( EndDate),INTERVAL -1 MONTH)) then 1 \n\
          \            when EndDate is null and  MonthEnd>=TransactionDate then 1\
          \ else 0 end)=1 and ARAmount<>'0.00'"
