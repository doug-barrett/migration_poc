    testsEnabled: true
  database: ''
  deployEnabled: true
  description: |
    Fact: TransactionDetails

    DAX Measures (for Semantic View):
      - Total Net Sales: sum(TransactionDetails[InvoiceAmount])
      - Total Cost:  CALCULATE(sumx(ItemDetails,ItemDetails[Cost]*ItemDetails[Quantity]),USERELATIONSHIP(ItemDetails[TransactionDate],'Date'
      - Total Gross Profit: [Total Net Sales]-[Total Cost]
      - Gross Profit %: MAX(DIVIDE([Total Gross Profit],[Total Net Sales],-1), -1)
      - Invoiced Count:  sum('TransactionDetails'[InvoicedCount])
      - CAG Severity Price:  DIVIDE([Total Net Sales],[CAG Severity Price Job Count])
      - CAG Severity Price Job Count:  CALCULATE(sum('TransactionDetails'[InvoicedCount]),TransactionDetails[InvoiceAmount]<>0)
      - CAG Severity Cost Job Count:  CALCULATE(DISTINCTCOUNT(ItemDetails[JobId]),ItemDetails[LineCost]<>0)
      - CAG Severity Cost:  DIVIDE([Total Cost],[CAG Severity Cost Job Count])
      - Calibration %:  DIVIDE ([Calibration Severity Price Job Count],[CAG Severity Price Job Count])
