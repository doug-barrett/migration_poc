        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AGENT_NUMBER_AU1
        join:
          joinCondition: |-
            EXTENDED
              FROM ( WITH ALL_EMPLOYEE_TIMELINES AS (
                    SELECT DISTINCT (AGENT_NAME), CASE WHEN AGENT_NAME = 'Guelmy Guadalupe Torres-Olivares' THEN 'guelmy torres olivares'
                                WHEN AGENT_NAME = 'Jorge Cacho-Sousa'                THEN 'jorge cacho sousa'
                                ELSE LOWER(REPLACE(AGENT_NAME, ' (BI&A)', ''))
                                 END AS KEY_AGENT_TL,
                           LOWER(SPLIT_PART(AGENT_NAME, ' ', 1)) AS FIRSTNAME,
                           MIN(DATE (CREATEAT)) AS FIRST_CREATEDATE,
                           MAX(DATE (CREATEAT)) AS MAX_CREATEDATE
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_INSUREDMINE_TIMELINES_CURRENT
                     GROUP BY 1
                   ),
                   VIEW_UNION AS (
                    SELECT A.*,
                           B.EMPLOYEENAME,
                           B.EMPLOYEENUMBER,
                           DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(A.KEY_AGENT_TL, LOWER(B.EMPLOYEENAME)) SCORE,
                           COUNT(*) OVER (PARTITION BY A.AGENT_NAME) AS DUPLICATED
                      FROM (
                            SELECT *
                              FROM ALL_EMPLOYEE_TIMELINES
                             WHERE LENGTH(AGENT_NAME) <> LENGTH(FIRSTNAME)
                               AND AGENT_NAME NOT IN ('David Jackson', 'David M Jackson', 'Jose Duran')
                           ) A
                      LEFT JOIN (
                            SELECT DISTINCT EMPLOYEENAME,
                                   EMPLOYEENUMBER,
                                   LOWER(SPLIT_PART(EMPLOYEENAME, ' ', 1)) AS FIRSTNAME
                              FROM RETAIL_PROD.SCH_BVSTAGE.V_PREB_IM_PRIMARY_AGENT_TM
                             WHERE EMPLOYEENUMBER IS NOT NULL
                           ) B
                        ON (A.FIRSTNAME = B.FIRSTNAME)
                     WHERE DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(A.KEY_AGENT_TL, LOWER(B.EMPLOYEENAME)) = 100
                   ),
                   TJ_EMPLOYEE AS (
                    SELECT C.*,
                           D.EMPLOYEENAME,
                           D.EMPLOYEENUMBER,
                           DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(C.KEY_AGENT_TL, D.KEY_AGENT_TL) SCORE,
                           COUNT(*) OVER (PARTITION BY C.AGENT_NAME) AS DUPLICATED
                      FROM (
                            SELECT *
                              FROM ALL_EMPLOYEE_TIMELINES
                             WHERE AGENT_NAME NOT IN (
                                    SELECT DISTINCT AGENT_NAME
                                      FROM VIEW_UNION
                                   )
                               AND LENGTH(AGENT_NAME) <> LENGTH(FIRSTNAME)
                               AND AGENT_NAME NOT IN ('David Jackson', 'David M Jackson', 'Jose Duran')
                           ) C
                      LEFT JOIN (
                            SELECT FULLNAME AS EMPLOYEENAME,
                                   LOWER(FULLNAME) AS KEY_AGENT_TL,
                                   LOWER(FIRSTNAME) AS FIRSTNAME,
                                   CAST(ULTIPRONUMBER AS VARCHAR) AS EMPLOYEENUMBER
                              FROM RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT
                           ) D
                        ON (C.FIRSTNAME = D.FIRSTNAME)
                     WHERE DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(C.KEY_AGENT_TL, D.KEY_AGENT_TL) = 100
                   ),
                   AGENT_KEY AS (
                    SELECT E.*,
                           F.EMPLOYEENAME,
                           F.EMPLOYEENUMBER,
                           DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(E.KEY_AGENT_TL, F.KEY_AGENT) SCORE,
                           COUNT(*) OVER (PARTITION BY E.AGENT_NAME) AS DUPLICATED
                      FROM (
                            SELECT *
                              FROM ALL_EMPLOYEE_TIMELINES
                             WHERE AGENT_NAME NOT IN (
                                    SELECT DISTINCT AGENT_NAME
                                      FROM VIEW_UNION
                                 UNION ALL SELECT DISTINCT AGENT_NAME
                                      FROM TJ_EMPLOYEE
                                   )
                               AND LENGTH(AGENT_NAME) <> LENGTH(FIRSTNAME)
                               AND AGENT_NAME NOT IN ('David Jackson', 'David M Jackson', 'Jose Duran')
                           ) E
                      LEFT JOIN (
                            SELECT DISTINCT EMPLOYEENAME,
                                   LOWER(REPLACE(EMPLOYEENAME, '-', ' ')) AS KEY_AGENT,
                                   LOWER(SPLIT_PART(EMPLOYEENAME, ' ', 1)) AS FIRSTNAME,
                                   EMPLOYEENUMBER
                              FROM RETAIL_PROD.SCH_EDW.DS_AGENT_KEY
                             WHERE EMPLOYEENUMBER IS NOT NULL
                               AND EMPLOYEENUMBER NOT IN ('N/A', 'ADMIN', '000Pending', '000PENDING', '000pending', '')
                               AND EMPLOYEENAME NOT IN ('Jose Ortiz', 'Luis Rodriguez')
                               AND EMPLOYEENAME IS NOT NULL
                               AND CISCO_LOGINNAME IS NOT NULL
                               AND HR_STATUS = 'Active'
                               AND TERMINATIONDATE IS NULL
                               AND RANK_EMPLOYEENUMBER = 1
                           ) F
                        ON (E.FIRSTNAME = F.FIRSTNAME)
                     WHERE DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(E.KEY_AGENT_TL, F.KEY_AGENT) = 100
                   ),
                   AGENT_UNIFICATION AS ( SELECT T1.AGENT_NAME,
                   H.EMPLOYEENAME,
                   H.EMPLOYEENUMBER,
                   COUNT(*) OVER (PARTITION BY T1.AGENT_NAME) AS DUPLICATED
              FROM ALL_EMPLOY
