      sourceColumnReferences:
      - columnReferences: []
        transform: CASE  WHEN SUBSTRING(L_QP_AUDIT.TITLE, 1,4) LIKE '%[0-9]%'   THEN
          'UNKNOWN'  WHEN SUBSTRING(L_QP_AUDIT.TITLE, 1,3) LIKE '%-%'   THEN 'UNKNOWN'  WHEN
