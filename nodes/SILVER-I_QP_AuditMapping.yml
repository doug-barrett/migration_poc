          SUBSTRING(L_QP_AUDIT.TITLE, 1,4 )='PWC'    THEN 'UNKNOWN'  WHEN SUBSTRING(L_QP_AUDIT.TITLE,
          4,1 )= ' '    THEN SUBSTRING(L_QP_AUDIT.TITLE, 1,3 )  ELSE 'UNKNOWN'  END
