        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} S_AP1_LEAD_MROC
             INNER JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} DS_AP1_TRANSACTIONSUMMARY
                ON DS_AP1_TRANSACTIONSUMMARY.LeadID = S_AP1_LEAD_MROC.LeadID
             INNER JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} V_S_AP1_EMPLOYEE_MROC_CURRENT
                ON (S_AP1_LEAD_MROC.CreatedBy = V_S_AP1_EMPLOYEE_MROC_CURRENT.Userid AND V_S_AP1_EMPLOYEE_MROC_CURRENT.isActive=1)
              LEFT JOIN {{ ref('STAGE','V_DLBV_CFA_HCI_AGENTS_CURRENT') }} v_dlbv_cfa_hci_agents_current
                ON v_dlbv_cfa_hci_agents_current.EmployeeNumber = V_S_AP1_EMPLOYEE_MROC_CURRENT.EmployeeNumber
               AND v_dlbv_cfa_hci_agents_current.ISACTIVEHEALTHCARE = 1
             INNER JOIN {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} V_S_AP1_OFFICE_MROC_CURRENT
                ON V_S_AP1_OFFICE_MROC_CURRENT.OfficeID = V_S_AP1_EMPLOYEE_MROC_CURRENT.LastLogedInOfficeID
             INNER JOIN (
                    SELECT OfficeCode,
                           LOCATIONSTATUS OfficeStatus,
                           OfficeType OfficeTypeId,
                           SalesVP,
                           stateCode,
                           DistrictManagerName,
                           DISTRICTEMPLOYEEID DistrictManagerUltiproNumber,
                           BRANCHMANAGERNAME OfficeManagerName,
                           BRANCHMANAGEREMPLOYEEID OfficeManagerEmployeeNum
                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                     WHERE StateCode IN ('TX','CA','WA','FL','AZ')
                       AND LOCATIONSTATUS = 'Open'
                       AND officecode != 'HCIBP'
                       AND OfficeTypeId IN ('Health Care Office','Retail')
                   )DS_RETAIL_OFFICE
                ON DS_RETAIL_OFFICE.OfficeCode = V_S_AP1_OFFICE_MROC_CURRENT.OfficeCode
             WHERE S_AP1_LEAD_MROC.isRowDeleted = 0
               AND S_AP1_LEAD_MROC.LineOfBusinessTypeID = 423
               AND DS_AP1_TRANSACTIONSUMMARY.isVoid=0
               AND DS_AP1_TRANSACTIONSUMMARY.isCorporateVoID=0
               AND DS_AP1_TRANSACTIONSUMMARY.Transactiontype='New Business'
               AND v_dlbv_cfa_hci_agents_current.UserID IS NULL
               AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATE(DS_AP1_TRANSACTIONSUMMARY.CREATED) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE())))))))
             GROUP BY V_S_AP1_EMPLOYEE_MROC_CURRENT.FullName ,
                      V_S_AP1_EMPLOYEE_MROC_CURRENT.employeeNumber ,
                      CAST(DS_AP1_TRANSACTIONSUMMARY.CREATED AS date)
