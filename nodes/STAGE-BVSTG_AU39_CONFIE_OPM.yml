        join:
          joinCondition: |-
            EXTENDED
              FROM ((SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('NSA') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('SPLC') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('Missing/Total') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END))) V_PRED_MONTHS --------------------IT as a % of Revenue  left join  (select monthyear asofmonth,  'Missing/Total' PolicySource_Dimension,  sum(OpExp) IT_Operating_Expense from {{ ref('STAGE','BVSTG_AU30_CONFIE_OPM') }}  where  sg_description in ('IT_0035', 'IT_0044' , 'IT_0049') group by monthyear,PolicySource_Dimension  ) BVSTG_AU30_CONFIE_OPM  on  V_PRED_MONTHS.asofmonth = BVSTG_AU30_CONFIE_OPM.asofmonth   and V_PRED_MONTHS.PolicySource_Dimension = BVSTG_AU30_CONFIE_OPM.PolicySource_Dimension    -------------------------------------------------------------------------Wining Culture (Corporate & Tijuana)  --------------------Employee Turnover - Monthly Retail  left join  (select month as asofmonth,  'Missing/Total' PolicySource_Dimension,  Terminated_emp as Terminated_emp_COE_TJ,  ((ifnull(active_eom,0)+ifnull(active_bom,0))/2) as Headcount_COR_TJ  from  (select date_trunc('month', effectivedate) Month,  count(distinct case when date_trunc('month', effectivedate)  = date_trunc('month', terminationdate)  and status_eom = 'Terminated' then uniqueid end) Terminated_emp,  count(distinct case when status_eom = 'Active' then uniqueid end) Active_EOM,  count(distinct case when status_bom = 'Active' then uniqueid end) Active_BOM  from  (select uniqueid,  date_trunc('month',to_date(EffectiveDate)) EffectiveDate,  date_trunc('month',to_date(TerminationDate)) TerminationDate,  pointintimestatus Status_EOM,  case when ISNEWHIRE = 'NewHire' then 'Inactive'  else lag(pointintimestatus, 1) over (partition by uniqueid order by effectivedate) end as Status_BOM  from "RETAIL_PROD"."SCH_EDW"."DS_HR_SALESEMPLOYEESUMMARY"  qualify row_number() over (partition by uniqueid, effectivedate order by EMPLOYEESTATUSSTARTDATE desc) = 1  ) ds_hr_salesemployeesummary  group by date_trunc('month', effectivedate)  )  ) DS_HR_SALESEMPLOYEESUMMARY  on  V_PRED_MONTHS.asofmonth = DS_HR_SALESEMPLOYEESUMMARY.asofmonth and V_PRED_MONTHS.PolicySource_Dimension = DS_HR_SALESEMPLOYEESUMMARY.PolicySource_Dimension      --------------------Employee Count - All  left join   (select effectivedate as asofmonth, 'Missing/Total' PolicySource_Dimension,  count(distinct case when empactive = 1 then concat end) as Active_EOM  from  (select distinct date.my_date, emp.monthcreated, emp.nextmonthcreated, CONCAT(my_date,employeenumber) as CONCAT,  Month(my_date) MONTHNUMBER, my_date as EFFECTIVEDATE, emp.COMPANYCODE as COMPANYCODE,  emp.companyname as COMPANY, CONCAT(SUPERVISORFIRSTNAME,' ',SUPERVISORLASTNAME) AS SUPERVISORNAME,  employeenumber AS EMPLOYEENUMBER, concat(firstname, ' ', lastname) AS EMPLOYEENAME,  emp.JOBCODE, emp.TITLE as JOBTITLE, UPPER(trim(emp.JOBGROUP)) AS JOBGROUP, emp.JOBFAMILYC
        name: BVSTG_AU39_CONFIE_OPM
        noLinkRefs: []
