        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: EDW
            nodeName: DS_AMS_TRANSACTIONDETAIL
          - locationName: EDW
            nodeName: DS_SPLC_POLICYTRANSACTION
          - locationName: STAGE
            nodeName: V_DLBV_AL3_BASICPOLICYINFOGROUP_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_AL3_SWEEPLOGS_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_MASTERCARRIER_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT
        join:
          joinCondition: |-
            FROM (
                    SELECT CarrierName,
                           coalesce("DATA_LAKE"."BIA_ANALYTICS".Carrier_Mapping(CarrierName), initcap(CarrierName)) CarrierName_Grouped,
                           CASE WHEN "DATA_LAKE"."BIA_ANALYTICS".Carrier_Mapping(CarrierName) IS NULL THEN 0
                                ELSE 1
                                 END AS IsMappedFlag,
                           SOURCE
                      FROM (
                            SELECT DISTINCT carriername,
                                   'EDW' SOURCE
                              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
                             UNION SELECT DISTINCT carriername,
                                   'EDW' SOURCE
                              FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                             UNION SELECT DISTINCT carriername,
                                   'EDW' SOURCE
                              FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }}
                             UNION SELECT DISTINCT Company,
                                   'EDW' SOURCE
                              FROM {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }}
                             UNION SELECT DISTINCT CarrierName,
                                   'EDW'SOURCE
                              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }}
                             UNION SELECT DISTINCT carriername,
                                   'AL3' SOURCE
                              FROM {{ ref('STAGE','V_DLBV_AL3_BASICPOLICYINFOGROUP_CURRENT') }} bpol
                              LEFT JOIN {{ ref('STAGE','V_DLBV_AL3_SWEEPLOGS_CURRENT') }} slop
                                ON bpol.sweeplogid = slop.id
                             UNION SELECT DISTINCT carriername,
                                   'EDW' SOURCE
                              FROM {{ ref('STAGE','V_S_AP1_MASTERCARRIER_MROC_CURRENT') }}
                             UNION SELECT DISTINCT carrier,
                                   'CS' SOURCE
                              FROM {{ ref('STAGE','V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT') }}
                             UNION SELECT DISTINCT b.carriername,
                                   'Agreement Repository' SOURCE
                              FROM "DATA_LAKE"."MAGUIRE"."V_DL_COMM_AGREEMENTREPOSITORY_CURRENT" a
                              LEFT JOIN"DATA_LAKE"."MAGUIRE"."V_DL_COMM_MASTERCARRIER_CURRENT" b
                                ON a.mastercarrierid = b.mastercarrierid
                           )
                   ) v_dlbv_comm_carrierdatarepositorycomplete_current
