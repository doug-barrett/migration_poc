        nodeName: SRC_CUSJOBFL
      join:
        joinCondition: "FROM {{ ref('GOLD', 'SRC_CUSJOBFL') }} \"SRC_CUSJOBFL\"\n\
          \ Where AUD_TIME <= (Select MAX(BATCH_END) FROM {{ ref('SILVER', 'CDC_BATCH') }} )\nAND AUD_TIME > (Select MAX(BATCH_START) FROM {{ ref('SILVER', 'CDC_BATCH') }})\nAND (AUD_CODE <> 'F' or (AUD_CODE is null and\
          \ AUD_TYPE = 'RR')) QUALIFY RANK() \nOVER (PARTITION BY  CJCMP, CJCUS0,\
          \ CJJOB0 \nORDER BY AUD_TIME DESC, AUD_SEQNO DESC, CASE  \nWHEN AUD_TYPE\
          \ in ('PT','PX','FI')\tTHEN 1 \nWHEN AUD_TYPE in ('UB','FB','FP','BR')\t\
          THEN 2 \nWHEN AUD_TYPE in ('UP','UR')\tTHEN 3 \nWHEN AUD_TYPE in ('DL','FD')\t\
          THEN 4 \nWHEN AUD_TYPE in ('RR')\t\tTHEN 5 \n ELSE 0 END DESC) = 1"
