        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_H20_LAPSE_MODEL_REFRESH') }} bvstg_h20_lapse_model_refresh
             INNER JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
                ON cast(bvstg_h20_lapse_model_refresh.policyid AS varchar(60)) = ds_policysummary_v2.policyid
              LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} ds_customersummary_v2
                ON cast(ds_customersummary_v2.customerkey AS varchar(60)) = ds_policysummary_v2.customerkey
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON cast(ds_retail_office.officecode AS varchar(60)) = ds_policysummary_v2.biaprimaryagentoffice
              LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                ON cast(ds_ap1_transactionsummary.transactionid AS varchar(60)) = ds_policysummary_v2.transactionid
               AND ds_policysummary_v2.sourcedb = 'AppOne'
              LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source
                ON cast(ds_mkt_lead_source.leadid AS varchar(60)) = IFNULL(ds_ap1_transactionsummary.leadid, ds_policysummary_v2.customerno)
               AND ds_policysummary_v2.sourcedb = ds_mkt_lead_source.sourcedb
               AND ds_mkt_lead_source.sourcedb IN ('AppOne', 'CIGH')
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON cast(ds_mkt_campaign.campaignid AS varchar(60)) = ds_mkt_lead_source.campaignid --created views:  LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_CDT_7DAYS') }} bvstg_h20_au1_cdt_7days     on cast(bvstg_h20_au1_cdt_7days.policyid as varchar(60))  = ds_policysummary_v2.policyid      LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_CARRIERPREMIUM_7DAYS') }} bvstg_h20_au1_carrierpremium_7days     on cast(bvstg_h20_au1_carrierpremium_7days.transactionid as varchar(60)) = ds_policysummary_v2.transactionid  LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_FEES_7DAYS') }} bvstg_h20_au1_fees_7days     on cast(bvstg_h20_au1_fees_7days.policyid as varchar(60)) = ds_policysummary_v2.policyid  LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_PAYMENTS_7DAYS') }} bvstg_h20_au1_payments_7days     on (cast(bvstg_h20_au1_payments_7days.policyid as varchar(60)) = ds_policysummary_v2.policyid)       LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_DRIVERS_7DAYS') }} bvstg_h20_au1_drivers_7days     on cast(bvstg_h20_au1_drivers_7days.policyid as varchar(60)) = ds_policysummary_v2.policyid  LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_VEHICLE_7DAYS') }} bvstg_h20_au1_vehicle_7days     on cast(bvstg_h20_au1_vehicle_7days.policyid as varchar(60)) = ds_policysummary_v2.policyid      LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_PREMIUMCHANGE_7DAYS') }}  bvstg_h20_au1_premiumchange_7days     on cast(bvstg_h20_au1_premiumchange_7days.policyid as varchar(60)) = ds_policysummary_v2.policyid  LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_CALLS_7DAYS') }} bvstg_h20_au1_calls_7days     on cast(bvstg_h20_au1_calls_7days.customerid as varchar(60)) = ds_policysummary_v2.customerid  LEFT JOIN {{ ref('UNKNOWN','V_PREB_H20_ACXIOM') }} v_preb_h20_acxiom     on cast(v_preb_h20_acxiom.customerid as varchar(60)) = ds_customersummary_v2.customerid               AND v_preb_h20_acxiom.sourcedb IN ('AppOne', 'CIGH')  LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_LIABILITY_7DAYS') }} bvstg_h20_au1_liability_7days     on cast(bvstg_h20_au1_liability_7days.policyid as varchar(60)) = ds_policysummary_v2.policyid  LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_CREDIT_EXTENDED') }} bvstg_h20_au1_credit_extended     on bvstg_h20_au1_credit_extended.TRANSACTIONID = bvstg_h20_lapse_model_refresh.TransactionID    LEFT JOIN {{ ref('STAGE','BVSTG_H20_AU1_CDRC_7DAYS') }} bvstg_h20_au1_cdrc_7days             ON bvstg_h20_au1_cdrc_7days.policyID = ds_policysummary_v2.policyid      LEFT JOIN ( select carriername, carriername_grouped          from RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_COMM_CARRIERMAPPING QUALIFY ROW_NUMBER() OVER (                  PARTITION BY carriername  ORDER BY carriername_grouped              ) = 1            ) DS_BVSTG_COMM_CARRIERMAPPING       ON DS_BVSTG_COMM_CARRIERMAPPING.carriername = ds_policysummary_v2.carriername  LEFT JOIN (          select carrier, MIN(NEWPERCENTAGE) mincomm, MAX(NEWPERCENTAGE) maxcomm
