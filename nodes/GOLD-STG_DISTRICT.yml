      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'CDC_SYSDSTFL') }} "CDC_SYSDSTFL"
          
          LEFT OUTER JOIN {{ ref('GOLD', 'DV_DISTRICT') }} "DV_DISTRICT"
            ON CDC_SYSDSTFL.ZKCMP = DV_DISTRICT.Company_Code
            AND CDC_SYSDSTFL.ZKDIST = DV_DISTRICT.District_Code
          
          LEFT OUTER JOIN 
          (SELECT 
            COALESCE(MAX(District_id),0) AS Last_District_Id 
            FROM "DOUG_POC"."DP001"."DISTRICT" 
          ) AS AGG_DISTRICT 
            ON 1 = 1
          
          LEFT OUTER JOIN {{ ref_no_link('GOLD', 'CV_EMPLOYEE') }} "CV_EMPLOYEE" 
            ON UPPER(CDC_SYSDSTFL.ZKUSER) = UPPER(CV_EMPLOYEE.Rentalman_User_ID) 
            AND ZKUSER <> ''
