            transform: "--AS THESE ARE ALL VALID INVENTORY ITEMS, WILL LEAVE THE DATA LINKED TO IT.  I_JDE_WORKORDERPARTSLIST.ITEMCODE  --CASE   -- FIA   -- AS THE ITEM CODE USED FOR FIA IS DIFFERENT BETWEEN TEST AND PRODUCTION   --  WE WILL USE THE SECOND ITEM CODE = FIA   -- PROD: ITEM CODE = 11647, TEST: ITEM CODE = 11121  -- WHEN I_JDE_WORKORDERPARTSLIST.ITEMCODE2 = 'FIA'    --EXTERNAL INCOME, NOT APPLICABLE  --  THEN -1   --VOUCHER, NOT APPLICABLE   --LABOUR, PLANT, MATERIALS, OTHER OR WASP VOUCHER  -- WHEN I_JDE_WORKORDERPARTSLIST.ITEMCODE IN (11424,11425,11426,11427,749352)  --  THEN -1   --UNSPECIFIED ITEM, UNKNOWN  -- WHEN I_JDE_WORKORDERPARTSLIST.ITEMCODE = 749353  --  THEN 0    --EVERYTHING ELSE SHOULD BE A VALID STOCK ITEM  --ELSE I_JDE_WORKORDERPARTSLIST.ITEMCODE END"
