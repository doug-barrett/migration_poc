            transform: --CHANGED QUERY TO EXCLUDE ALL UR LINE TYPES  -- THE FIA LINES ARE A SUBSET OF THIS  --NO UR LINES TYPES HAVE COST AMOUNTS AGAINST THEM  -- SO THIS CHANGE WILL MAKE NO MATERIAL DIFFERENCE.  CASE  --REMOVE CAPACITY COST   WHEN LTRIM(RTRIM(IMPRP8)) = 'NCC' THEN 0    WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TC'    --AND I_JDE_WORKORDERPARTSLIST.ITEMCODE2 <> 'FIA'    AND I_JDE_WORKORDERPARTSLIST.LINETYPE <> 'UR'   THEN I_JDE_WORKORDERPARTSLIST.AMOUNT   WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TA' AND TAROLLED = 'NO'    --AND I_JDE_WORKORDERPARTSLIST.ITEMCODE2 <> 'FIA'    AND I_JDE_WORKORDERPARTSLIST.LINETYPE <> 'UR'   THEN I_JDE_WORKORDERPARTSLIST.AMOUNT   ELSE 0  END  * I_JDE_WORKORDERPARTSLIST.UNITSORDERED
      - appliedColumnTests: {}
