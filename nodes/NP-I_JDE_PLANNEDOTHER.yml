        name: PLANNEDREVENUE
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 45c6d23c-244b-4759-9219-142c7cd55756
                stepCounter: 80205762-13c6-43e5-a662-70c4f5e6755a
            transform: --PLANNED REVENUE WILL ONLY EXIST AT TA LEVEL EVEN WHEN ROLLED UP,   --03/11/2020 CW ALSO REMOVED ADDITIONAL CODE THAT WAS COMMENTED OUT FOR EASE OF READING  CASE      WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TA' AND     I_JDE_WORKORDERPARTSLIST.ITEMCODE2 = 'FIA' THEN CONVERT(NUMERIC(15, 2), L_JDE_F31171_PARTSLISTEXTENSION.WSEBILL) / 100        WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TA'-- AND TAROLLED = 'NO'     AND I_JDE_WORKORDERPARTSLIST.LINETYPE IN ('UR', 'J')  THEN CONVERT(NUMERIC(15, 2), L_JDE_F31171_PARTSLISTEXTENSION.WSEBILL) / 100  --NETWORK CAPACITY CHARGE REVERSED  WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TA' AND     LTRIM(RTRIM(IMPRP8)) = 'NCC'     THEN (I_JDE_WORKORDERPARTSLIST.AMOUNT * -1) * I_JDE_WORKORDERPARTSLIST.UNITSORDERED      ELSE 0   END
      - appliedColumnTests: {}
