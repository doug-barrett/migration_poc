            transform: "CASE WHEN LTRIM(RTRIM(IMPRP8)) = 'NCC' THEN '4511' --CAPACITY CHARGE    -- FIA   -- AS THE ITEM CODE USED FOR FIA IS DIFFERENT BETWEEN TEST AND PRODUCTION   --  WE WILL USE THE SECOND ITEM CODE = FIA   -- PROD: ITEM CODE = 11647, TEST: ITEM CODE = 11121   WHEN I_JDE_WORKORDERPARTSLIST.ITEMCODE2 = 'FIA'    --EXTERNAL INCOME    THEN '4510'   --FOR FIXED PRICED WORK, THERE MAY NOT BE AN FIA LINE ITEM, JUST THE UR LINE ITEM   --WHEN I_JDE_WORKORDERPARTSLIST.LINETYPE = 'UR'   WHEN I_JDE_WORKORDERPARTSLIST.LINETYPE IN ('UR', 'J')    --AND ISNULL(L_JDE_F31171_PARTSLISTEXTENSION.WSMTHPR,'') = 'F'    --EXTERNAL INCOME    THEN '4510'   --STOCKED ITEMS - ALL EXCEPT NON-STOCK   WHEN ISNULL(D_INVENTORY.STOCKINGTYPECODE,'N') <> 'N'    THEN '5072'   --SPECIAL CASE WHILE ESTIMATING FROM WASP   -- UNSPECIFIED ITEM, INTERFACE CAN'T FIND THE STOCK ITEM, BUT IT SHOULD STILL BE MATERIALS   WHEN I_JDE_WORKORDERPARTSLIST.ITEMCODE = 749353    --STORE ISSUES    THEN '5072'   --SPECIAL CASE TO SPLIT OUT THE TYPES OF SUBCONTRACTORS:   WHEN I_JDE_WORKORDERPARTSLIST.ITEMCODE = 749276    --SUBCONTRACTORS - CIVIL    THEN '5093'   WHEN I_JDE_WORKORDERPARTSLIST.ITEMCODE = 749277    --SUBCONTRACTORS - TRAFFIC MANAGEMENT    THEN '5095'   -- ALL OTHER TYPES OF SUBCONTRACTORS   WHEN D_INVENTORY.ITEMCATEGORYCODE IN ('901','903','906')    --SUBCONTRACTORS - GENERAL    THEN '5092'   --ALL OTHER NON STOCK ITEMS WILL BE MATERIALS PURCHASES   ELSE '5074' END"
