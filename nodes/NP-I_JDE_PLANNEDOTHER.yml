            transform: CASE --REMOVE CAPACITY QUANTITY FOR TC ONLY    WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TC' AND     LTRIM(RTRIM(IMPRP8)) = 'NCC' THEN 0       WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TC' AND    --LABOUR, PLANT, MATERIALS, OTHER AND WASP VOUCHERS     I_JDE_WORKORDERPARTSLIST.ITEMCODE NOT IN (11424, 11425, 11426, 11427, 749352) AND     I_JDE_WORKORDERPARTSLIST.LINETYPE NOT IN ('J', 'UR') THEN I_JDE_WORKORDERPARTSLIST.UNITSORDERED    WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TA' AND     (I_JDE_WORKORDERPARTSLIST.LINETYPE IN ('UR', 'J') OR     --INCLUDE NORTHERN CAPACITY CHARGE WITH REVENUE QUANTITY     LTRIM(RTRIM(IMPRP8)) = 'NCC') THEN I_JDE_WORKORDERPARTSLIST.UNITSORDERED      WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TA' AND     TAROLLED = 'NO' AND    --LABOUR, PLANT, MATERIALS, OTHER AND WASP VOUCHERS     I_JDE_WORKORDERPARTSLIST.ITEMCODE NOT IN (11424, 11425, 11426, 11427, 749352) THEN I_JDE_WORKORDERPARTSLIST.UNITSORDERED    WHEN I_PLANNEDTASTATUS.WORKORDERTYPECODE = 'TA' AND     TAROLLED = 'YES' THEN 0    ELSE 0   END
