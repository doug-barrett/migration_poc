      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'EQUIPMENT') }} "EQUIPMENT"
          INNER JOIN {{ ref('GOLD', 'ITEM_EQPT_CLASS') }} "ITEM_EQPT_CLASS"
          ON  EQUIPMENT.Category_Code =  ITEM_EQPT_CLASS.Category_Code
          AND EQUIPMENT.Class_Code = ITEM_EQPT_CLASS.Class_Code
          AND ITEM_EQPT_CLASS.Bulk_Item_Ind <>  'Y'
          WHERE EQUIPMENT.Company_Code =  'U1'
            AND EQUIPMENT.Equipment_Type_Code <>  'N'
