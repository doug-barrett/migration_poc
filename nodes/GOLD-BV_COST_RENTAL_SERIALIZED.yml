            AND	EQUIPMENT.Equipment_Status_Code <>  'T'||'V'||'J'||'M'||'S'||'C'
            AND	EQUIPMENT.Category_Code >  99
            AND	EQUIPMENT.dss_current_flag = 'Y' 
            AND ITEM_EQPT_CLASS.dss_current_flag = 'Y'
