      nullable: true
      sourceColumnReferences:
        - columnReferences: []
          transform: |-
            CASE
            
              WHEN EQUIPMENT.Depreciation_Months IS NOT NULL
            
                AND EQUIPMENT.Depreciation_Months <>  0
            
              THEN (EQUIPMENT.Equipment_Cost_Amt * 0.9 )/(EQUIPMENT.Depreciation_Months * 30)
            
              ELSE EQUIPMENT.Equipment_Cost_Amt * 0.9
            
            END
