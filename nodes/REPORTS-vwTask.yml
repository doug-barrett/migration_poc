          \ 'Account') }} \"Account\"\n  ON \"Task\".\"AccountKey\" = \"Account\"\
          .\"AccountKey\"\nLEFT JOIN {{ ref('DIM', 'SalesTerritory') }} \"SalesTerritory\"\
          \n  ON \"Account\".\"SalesTerritoryKey\" = \"SalesTerritory\".\"SalesTerritoryKey\"\
          \nLEFT JOIN {{ ref('DIM', 'Contract') }} \"Contract\"\n  ON \"Task\".\"\
          ContractKey\" = \"Contract\".\"ContractKey\"\nLEFT JOIN {{ ref('DIM', 'Opportunity')\
