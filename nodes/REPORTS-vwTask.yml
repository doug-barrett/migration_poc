          .\"OpportunityKey\"\nLEFT JOIN {{ ref('DIM', 'Campaign') }} \"Campaign\"\
          \n  ON \"Task\".\"CampaignKey\" = \"Campaign\".\"CampaignKey\"\nLEFT JOIN\
          \ {{ ref('DIM', 'Solicitation') }} \"Solicitation\"\n  ON \"Task\".\"SolicitationKey\"\
          \ = \"Solicitation\".\"SolicitationKey\"\nLEFT JOIN {{ ref('DIM', 'Contact')\
          \ }} \"Contact\"\n  ON \"Task\".\"DimContactKey\" = \"Contact\".\"DimContactKey\"\
          \nLEFT JOIN {{ ref('DIM', 'Lead') }} \"Lead\"\n  ON \"Task\".\"LeadKey\"\
          \ = \"Lead\".\"LeadKey\"\nLEFT JOIN {{ ref('DIM', 'Supplier') }} \"Supplier\"\
