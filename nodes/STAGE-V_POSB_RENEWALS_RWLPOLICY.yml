        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_RENEWALS_RWLPOLICY') }} AS SELECT policyid,
                   id,
                   nbpolicyid,
                   policynumber,
                   policyeffectivedate,
                   policyexpirationdate,
                   status,
                   statusdate,
                   company,
                   customeraccountnumber,
                   transactiondate,
                   'Renewal' AS RenewalDisposition,
                   policytype
              FROM {{ ref('STAGE','V_POSB_RENEWALS_NBPOLICY') }}
             WHERE nbpolicyid IS NOT NULL
             UNION SELECT a.policyid,
                   a.id,
                   a.rwlpolicyid,
                   a.policynumber,
                   a.policyeffectivedate,
                   policyexpirationdate,
                   a.status,
                   a.statusdate,
                   a.company,
                   a.customeraccountnumber,
                   a.transactiondate,
                   CASE WHEN a.policyid = a.rwlpolicyid THEN 'Rewrite'
                        ELSE 'Renewal'
                         END AS RenewalDisposition,
                   policytype
              FROM {{ ref('STAGE','BVSTG_AMS_RENEWALS_NBPOLICY_EMPTY') }} a
