            FROM (
                    SELECT policyID
                      FROM {{ ref('STAGE','BVSTG_H20_LAPSE_MODEL_REFRESH') }}
                     WHERE sourcedb = 'AppOne'
                   ) bvstg_h20_lapse_model_refresh
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_POLICYVERSION_MROC') }} s_ap1_policyversion_mroc
                ON TO_VARCHAR(s_ap1_policyversion_mroc.policyid) = bvstg_h20_lapse_model_refresh.policyid
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_POLICYVEHICLE_MROC') }} s_ap1_policyvehicle_mroc
                ON s_ap1_policyvehicle_mroc.PolicyVersionID = s_ap1_policyversion_mroc.PolicyVersionID
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_POLICYVEHICLECOVERAGE_MROC') }} s_ap1_policyvehiclecoverage_mroc
                ON s_ap1_policyvehiclecoverage_mroc.PolicyVehicleID = s_ap1_policyvehicle_mroc.PolicyVehicleID
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_MASTERCOVERAGETYPE_MROC') }} s_ap1_mastercoveragetype_mroc
                ON s_ap1_policyvehiclecoverage_mroc.MasterCoverageTypeID = s_ap1_mastercoveragetype_mroc.MasterCoverageTypeID
             WHERE 1=1 QUALIFY ROW_NUMBER() OVER (PARTITION BY s_ap1_policyversion_mroc.PolicyID ORDER BY s_ap1_policyvehiclecoverage_mroc.DSS_VERSION DESC, s_ap1_policyvehicle_mroc.DSS_VERSION DESC, s_ap1_policyversion_mroc.DSS_VERSION DESC) = 1
