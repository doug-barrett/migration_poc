            FROM {{ ref('STAGE','BVSTG_COMM_AU2_CUSTOMER_PERSISTENCY_EXTRACT') }} bvstg_comm_au2_customer_persistency_extract
              LEFT JOIN (SELECT policynumberformatted,
                   carrierdisplayname,
