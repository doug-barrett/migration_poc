                                   ifnull(SUM(CampaignCall),0) + ifnull(SUM(WebForm),0) AS mdcf_Total,
                                   ifnull(SUM(CampaignPhoneLead),0) + ifnull(SUM(WebFormLead),0) AS mdcf_Lead,
                                   ifnull(SUM(CampaignPhoneLeadTransfer),0) + ifnull(SUM(WebFormLeadTransfer),0) AS mdcf_LeadTransferred,
                                   ifnull(SUM(CampaignPhoneLeadQuote),0) + ifnull(SUM(WebFormLeadQuote),0) AS mdcf_LeadQuoted,
                                   ifnull(SUM(CampaignPhoneLeadSale),0) + ifnull(SUM(WebFormLeadSale),0) AS mdcf_LeadSold
                              FROM {{ ref('EDW','DS_MKT_CAMPAIGN2SALES') }}
                             WHERE VintageDate >= '2019-01-01'
