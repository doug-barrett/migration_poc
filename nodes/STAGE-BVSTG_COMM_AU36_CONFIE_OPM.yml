              FROM ((
                    SELECT asofmonth,
                           POLICYSOURCE_DIMENSION
                      FROM {{ ref('STAGE','BVSTG_COMM_AU34_CONFIE_OPM') }}
                   ) au34_confie_opm
              LEFT JOIN (
                    SELECT date_trunc('month',to_date(StoreOpenDate)) Asofmonth,
                           sourcedb PolicySource_Dimension,
                           count(DISTINCT OfficeCode) AS new_organic_store
                      FROM {{ ref('STAGE','BVSTG_COMM_AU31_CONFIE_OPM') }}
                     WHERE lower(officestatusdetail) = 'organic'
                     GROUP BY date_trunc('month',to_date(StoreOpenDate)),
                              PolicySource_Dimension
                   ) au31_confie_opm
                ON au34_confie_opm.asofmonth = au31_confie_opm.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = au31_confie_opm.PolicySource_Dimension
