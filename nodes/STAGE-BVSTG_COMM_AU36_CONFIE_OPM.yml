                           count(DISTINCT statecode) AS locations_acquired_retail
                      FROM {{ ref('STAGE','BVSTG_COMM_AU31_CONFIE_OPM') }}
                     WHERE lower(officetype) = 'retail'
                     GROUP BY date_trunc('month',to_date(StoreOpenDate)),
                              PolicySource_Dimension
                   ) au31_confie_opm_1
                ON au34_confie_opm.asofmonth = au31_confie_opm_1.asofmonth
               AND au34_confie_opm.PolicySource_Dimension = au31_confie_opm_1.PolicySource_Dimension
              LEFT JOIN (
                    SELECT *
                      FROM (
                            SELECT date_trunc('month',to_date(vintagedate)) Asofmonth,
