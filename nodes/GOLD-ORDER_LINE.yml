      sourceColumnReferences:
      - columnReferences: []
        transform: "Case \n\n WHEN  \"STG_ORDER_LINE\".\"CONTRACT_LINE_KEY\" = '00000ZZ000'\n\n  THEN 1\n\n\n\n WHEN  \"STG_ORDER_LINE\".\"ORDER_LINE_TYPE_CODE\" = 'RI' \n\n   and \"ORDERS\".\"INVOICE_ORDER_TYPE\" = 'C' and \"ORDERS\".\"ORDER_TYPE_CODE\" = 'O'\n\n  THEN \"STG_ORDER_LINE\".\"ORDER_LINE_QTY\" - \"STG_ORDER_LINE\".\"ORDER_LINE_RETURN_QTY\"\n\n\n\n WHEN  \"STG_ORDER_LINE\".\"ORDER_LINE_TYPE_CODE\" = 'RI' \n\n   and \"ORDERS\".\"ORDER_TYPE_CODE\" = 'C'\n\n  THEN \"STG_ORDER_LINE\".\"ORDER_LINE_QTY\" - \"STG_ORDER_LINE\".\"ORDER_LINE_RETURN_QTY\"\n\n\n\n WHEN  \"STG_ORDER_LINE\".\"ORDER_LINE_TYPE_CODE\" = 'RI' \n\n   and \"ORDERS\".\"INVOICE_ORDER_TYPE\" = 'O'\n\n  THEN \"STG_ORDER_LINE\".\"ORDER_LINE_QTY\"\n\n \n\n WHEN  \"STG_ORDER_LINE\".\"ORDER_LINE_TYPE_CODE\" = 'RI' \n\n  THEN \"STG_ORDER_LINE\".\"ORDER_LINE_RETURN_QTY\"\n\n\n\n WHEN  \"STG_ORDER_LINE\".\"UNIT_OF_MEASURE_CODE\" = \"ITEM_UOM\".\"UOM_CODE\"\n\n   OR  \"STG_ORDER_LINE\".\"UNIT_OF_MEASURE_CODE\" = ''\n\n  THEN\
          \ \"STG_ORDER_LINE\".\"ORDER_LINE_QTY\" \n\n\n\n WHEN  \"STG_ORDER_LINE\".\"UNIT_OF_MEASURE_CODE\" = \"ITEM_UOM\".\"UOM_CODE2\"\n\n  THEN \"STG_ORDER_LINE\".\"ORDER_LINE_QTY\" * UOM_Conversion_Factor_Qty2\n\n\n\n WHEN  \"STG_ORDER_LINE\".\"UNIT_OF_MEASURE_CODE\" = \"ITEM_UOM\".\"UOM_CODE3\"\n\n  THEN \"STG_ORDER_LINE\".\"ORDER_LINE_QTY\" * UOM_Conversion_Factor_Qty3\n\n\n\n ELSE  \"STG_ORDER_LINE\".\"ORDER_LINE_QTY\"\n\nEND"
