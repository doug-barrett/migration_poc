      customSQL:
        customSQL: ''
      dependencies:
      - locationName: SILVER
        nodeName: STG_ORDER_LINE
      - locationName: GOLD
        nodeName: ORDERS
      - locationName: GOLD
        nodeName: ITEM_UOM
      - locationName: BRONZE
        nodeName: _ITEM_UOM
      - locationName: GOLD
        nodeName: STG_CLOSED_ORDER_LINE
      join:
        joinCondition: "FROM \"UR_DEVELOPMENT\".\"GOLD\".\"ORDER_LINE\" \"ORDER_LINE\"\n  WHERE \"TGT\".\"CONTRACT_KEY\" = \"STG_CLOSED_ORDER_LINE\".\"COMPANY_CODE\"\n|| \"STG_CLOSED_ORDER_LINE\".\"INVOICE_NUM\"\nAND \"TGT\".\"ORDER_LINE_NUM\" = \"STG_CLOSED_ORDER_LINE\".\"ORDER_LINE_NUM\"\nUPDATE tgt\nFROM {{ ref_no_link('GOLD', 'ORDER_LINE') }} tgt\n, {{ ref('GOLD', 'STG_CLOSED_ORDER_LINE') }} \"STG_CLOSED_ORDER_LINE\"\nWHERE tgt.Contract_Key = STG_CLOSED_ORDER_LINE.Company_Code\n|| STG_CLOSED_ORDER_LINE.Invoice_Num\nAND tgt.Order_Line_Num = STG_CLOSED_ORDER_LINE.Order_Line_Num FROM {{ ref('SILVER', 'STG_ORDER_LINE') }} \"STG_ORDER_LINE\"\n\nJOIN {{ ref('GOLD', 'ORDERS') }} \"ORDERS\" \n  On ORDERS.Contract_Key = STG_ORDER_LINE.Contract_Key\n And ORDERS.Contract_Seq_Key = STG_ORDER_LINE.Contract_Seq_Key\n\nLEFT OUTER JOIN {{ ref('GOLD', 'ITEM_UOM') }} \"ITEM_UOM\"\n  On STG_ORDER_LINE.Item_Id = ITEM_UOM.Item_Id\n   And ORDERS.Reporting_Date\n      BETWEEN ITEM_UOM.Effective_Begin_Date\
          \  AND ITEM_UOM.Effective_End_Date\n\nWhere STG_ORDER_LINE.Journal_Type in (1,3,5)\nQUALIFY RANK() \nOVER (PARTITION BY STG_ORDER_LINE.Contract_Key, STG_ORDER_LINE.Contract_Seq_Key, STG_ORDER_LINE.Contract_Line_Key \nORDER BY STG_ORDER_LINE.Source_Table_Rank Desc) = 1"
      name: ORDER_LINE
