    - appliedColumnTests: {}
      columnReference:
        columnCounter: 33713243-c104-51d7-b1a8-e7b4358ac9cf
        stepCounter: 393671f2-5cb3-59c1-ad44-1abc6b90ac27
      config: {}
      dataType: VARCHAR(200)
      description: 'One of three values: Audit, Incident or Other'
      name: Source
      nullable: false
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE  --IF FROM AN AUDIT, THEN THE AUDIT ID WILL BE POPULATED  WHEN
          "L_QP_INCIDENT".""AuditID"" IS NOT NULL THEN 'AUDIT'  --IF FROM AN INCIDENT,
          THEN THERE WILL BE AN ASSOCIATED RECORD IN THIS TABLE0  WHEN "L_QP_XOCCURRENCEINCIDENTSTAGENONCONFORMANCE".""NonConformanceID""
          IS NOT NULL THEN 'INCIDENT'  ELSE 'OTHER'  END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 337620c0-c513-5932-a104-434e61494700
        stepCounter: 393671f2-5cb3-59c1-ad44-1abc6b90ac27
      config: {}
      dataType: VARCHAR(200)
      description: 'One of three values: On Time, Overdue or In Jeopardy'
      name: Timeliness
      nullable: false
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE  --THERE ARE DIFFERENT CALCULATIONS DEPENDING ON WHETHER OR
          NOT THE "Action" IS CLOSED  WHEN "ClosedDate" IS NOT NULL THEN   CASE    WHEN
          "ClosedDate" < COALESCE("TargetDate",DATEADD(DAY,1,"ClosedDate")) THEN 'ON
          TIME'    ELSE 'OVERDUE' END  ELSE   CASE    WHEN DATEDIFF(DAY,CURRENT_TIMESTAMP(),COALESCE("TargetDate","RaisedDate"))
          > 10 THEN 'ON TIME'    WHEN DATEDIFF(DAY,CURRENT_TIMESTAMP(),COALESCE("TargetDate","RaisedDate"))
          BETWEEN 0 AND 10 THEN 'IN JEOPARDY'    ELSE 'OVERDUE' END  END
