                           1 IsFoundInAppOneTransaction
                      FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                      LEFT JOIN (
                            SELECT DISTINCT policynumber_edw,
                                   carriername_edw,
                                   policynumberformatted,
                                   carriername_mapped
                              FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}
