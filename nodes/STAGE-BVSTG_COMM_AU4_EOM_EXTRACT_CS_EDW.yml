                        ON ds_ap1_transactionsummary.policynumber = ds_bvstg_comm_policynumberformatting_allsources.policynumber_EDW
                       AND ds_ap1_transactionsummary.CarrierName = ds_bvstg_comm_policynumberformatting_allsources.CarrierName_EDW
                     WHERE trim(PolicyNumber) <> ''
                       AND PolicyNumber IS NOT NULL
                   ) ds_ap1_transactionsummary
                ON ds_ap1_transactionsummary.policynumberformatted = bvstg_comm_au3_eom_extract_cs_edw.policynumberformatted
               AND ds_ap1_transactionsummary.carriername = bvstg_comm_au3_eom_extract_cs_edw.carrier
              LEFT JOIN (SELECT DISTINCT PolicyNumberFormatted,
                   CarrierName_Mapped CarrierName,
                   1 IsFoundInAMSTransaction
              FROM {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} ds_ams_transactiondetail
              LEFT JOIN (SELECT DISTINCT policynumber_edw,
                   carriername_edw,
                   policynumberformatted,
                   carriername_mapped
