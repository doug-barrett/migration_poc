              FROM {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS_EDW') }} bvstg_comm_au3_eom_extract_cs_edw
              LEFT JOIN (
                    SELECT DISTINCT policynumberformatted,
                           carrier,
