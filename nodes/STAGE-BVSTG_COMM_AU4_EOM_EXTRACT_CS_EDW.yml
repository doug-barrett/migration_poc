                                              FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}
                                           ) ds_bvstg_comm_policynumberformatting_allsources
                                        ON ds_bvstg_comm_policynumberformatting_allsources.policynumber_al3 = v_dlbv_al3_basicpolicyinfogroup_current.policynumber
                                       AND ds_bvstg_comm_policynumberformatting_allsources.CarrierName_AL3 = v_dlbv_al3_sweeplogs_current.CarrierName
                                   ) v_dlbv_al3_basicpolicyinfogroup_current
                              LEFT JOIN {{ ref('STAGE','V_DLBV_AL3_BASICINSUREDINFOEXTENSIONGROUP_CURRENT') }} v_dlbv_al3_basicinsuredinfoextensiongroup_current
                                ON v_dlbv_al3_basicpolicyinfogroup_current.sweeplogid = v_dlbv_al3_basicinsuredinfoextensiongroup_current.sweeplogid
                           )
                     WHERE LatestRecord = 1
                   ) v_dlbv_al3_basicinsuredinfoextensiongroup_current
                ON v_dlbv_al3_basicinsuredinfoextensiongroup_current.policynumberformatted = bvstg_comm_au3_eom_extract_cs_edw.policynumberformatted
               AND v_dlbv_al3_basicinsuredinfoextensiongroup_current.carrier = bvstg_comm_au3_eom_extract_cs_edw.carrier
              LEFT JOIN (
