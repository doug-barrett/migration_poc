                                   v_dlbv_al3_basicpolicyinfogroup_current.carrier,
                                   v_dlbv_al3_basicinsuredinfoextensiongroup_current.stateprovinceabbreviation,
                                   Row_number() OVER(PARTITION BY policynumberformatted ORDER BY v_dlbv_al3_basicinsuredinfoextensiongroup_current.CreatedDate DESC) LatestRecord
                              FROM (
                                    SELECT DISTINCT policynumberformatted,
                                           CarrierName_Mapped Carrier,
                                           sweeplogid,
                                           to_timestamp_ntz(v_dlbv_al3_basicpolicyinfogroup_current.CreatedDate) CreatedDate
                                      FROM {{ ref('STAGE','V_DLBV_AL3_BASICPOLICYINFOGROUP_CURRENT') }} v_dlbv_al3_basicpolicyinfogroup_current
