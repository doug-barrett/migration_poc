        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AP1_CUSTOMER_REFRESH') }} bvstg_ap1_customer_refresh
              JOIN {{ ref('DATA_VAULT','H_CUSTOMER') }} h_customer
                ON h_customer.customerid = TO_CHAR(bvstg_ap1_customer_refresh.customerid)
              JOIN {{ ref('DATA_VAULT','L_CUSTOMER_PHONE') }} l_customer_phone
                ON h_customer.HK_h_customer = l_customer_phone.HK_h_customer
              JOIN {{ ref('STAGE','V_S_AP1_PHONE_MROC_CURRENT') }} v_s_ap1_phone_mroc_current
                ON l_customer_phone.HK_h_phone = v_s_ap1_phone_mroc_current.HK_h_phone
             WHERE v_s_ap1_phone_mroc_current.isrowdeleted = 0
               AND v_s_ap1_phone_mroc_current.phonetypeid IN (618,619,620)
             GROUP BY h_customer.customerid,
                      h_customer.HK_h_customer,
                      CASE WHEN phonetypeid = 618 THEN 'Home Phone'
                           WHEN phonetypeid = 619 THEN 'Cell Phone'
                           WHEN phonetypeid = 620 THEN 'Contact Phone'
                            END
