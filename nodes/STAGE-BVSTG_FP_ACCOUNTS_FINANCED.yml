        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','V_DLBV_FP_ACCOUNTS') }} V_DLBV_FP_ACCOUNTS
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_POLICYFINANCINGACTIVATIONRESULT') }} QUALIFY ROW_NUMBER () OVER(PARTITION BY HK_H_POLICYFINANCINGACTIVATIONRESULT ORDER BY DSS_VERSION DESC) = 1
                   )S_AP1_POLICYFINANCINGACTIVATIONRESULT
                ON S_AP1_POLICYFINANCINGACTIVATIONRESULT.ACCOUNTNUMBER = V_DLBV_FP_ACCOUNTS.AccountNumber
               AND S_AP1_POLICYFINANCINGACTIVATIONRESULT.ACCOUNTID = V_DLBV_FP_ACCOUNTS.ID
              LEFT JOIN {{ ref('STAGE','V_DLBV_FP_INSURED') }} V_DLBV_FP_INSURED
                ON V_DLBV_FP_INSURED.ID = V_DLBV_FP_ACCOUNTS.InsuredID
             INNER JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} DS_AP1_TRANSACTIONSUMMARY
                ON DS_AP1_TRANSACTIONSUMMARY.policyid = S_AP1_POLICYFINANCINGACTIVATIONRESULT.POLICYID
              LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CUSTOMERSUMMARY_V2
                ON DS_CUSTOMERSUMMARY_V2.CustomerID = DS_AP1_TRANSACTIONSUMMARY.CustomerID
               AND DS_CUSTOMERSUMMARY_V2.sourcedb = 'AppOne' -- INNER JOIN {{ ref('STAGE','V_DLBV_FP_ACCOUNTINSURANCEPOLICIES') }} V_DLBV_FP_ACCOUNTINSURANCEPOLICIES ON V_DLBV_FP_ACCOUNTS.ID = V_DLBV_FP_ACCOUNTINSURANCEPOLICIES.AccountID  -- INNER JOIN {{ ref('STAGE','V_DLBV_FP_ACCOUNTCALCULATEDPAYMENTINFO') }} V_DLBV_FP_ACCOUNTCALCULATEDPAYMENTINFO ON V_DLBV_FP_ACCOUNTCALCULATEDPAYMENTINFO.AccountID = V_DLBV_FP_ACCOUNTS.ID    LEFT JOIN {{ ref('STAGE','V_DLBV_FP_ACCOUNTADDONPRODUCT') }} V_DLBV_FP_ACCOUNTADDONPRODUCT ON V_DLBV_FP_ACCOUNTS.ID = V_DLBV_FP_ACCOUNTADDONPRODUCT.AccountID  LEFT JOIN (   SELECT ACCOUNTADDONPRODUCT.AccountID    ,ADDONPRODUCT.NAME    ,(TOTALPRICE - SINGLEINSTALLMENTAMOUNT) PolicyAmountFinanced    ,ACCOUNTADDONPRODUCT.ID productID   FROM {{ ref('STAGE','V_DLBV_FP_ADDONPRODUCT') }} ADDONPRODUCT   INNER JOIN {{ ref('STAGE','V_DLBV_FP_ACCOUNTADDONPRODUCT') }} ACCOUNTADDONPRODUCT ON ACCOUNTADDONPRODUCT.addonproductid = ADDONPRODUCT.ID    AND ADDONPRODUCT.NAME IS NOT NULL   LEFT JOIN {{ ref('STAGE','V_DLBV_FP_ADDONPRODUCTPAYMENTINFO') }} PY ON ACCOUNTADDONPRODUCT.ID = PY.ACCOUNTADDONPRODUCTID QUALIFY ROW_NUMBER() OVER (     PARTITION BY ACCOUNTADDONPRODUCT.AccountID     ,ACCOUNTADDONPRODUCT.ID ORDER BY ACCOUNTADDONPRODUCT.EFFECTIVEDATE     ) = 1   ) V_DLBV_FP_ADDONPRODUCT ON V_DLBV_FP_ACCOUNTADDONPRODUCT.AccountID = V_DLBV_FP_ADDONPRODUCT.AccountID     LEFT JOIN (   SELECT a.ACCOUNTID    ,SUM(CASE       WHEN c.DESCRIPTION = 'Return Premium'       THEN b.Amount      END) Return_Premium_Adj    ,SUM(CASE       WHEN c.DESCRIPTION = 'Installment'       THEN b.Amount      END) Installment_Mtly_Amount   FROM {{ ref('STAGE','V_DLBV_FP_RECEIPT') }} a   INNER JOIN {{ ref('STAGE','V_DLBV_FP_RECEIPTDETAIL') }} b ON a.ID = b.RECEIPTID   INNER JOIN (    SELECT DISTINCT ID     ,CONSTANTNAME     ,DESCRIPTION    FROM {{ ref('STAGE','V_DLBV_FP_STATICRECEIPTTYPE') }}    ) c ON a.RECEIPTTYPE = c.ID   GROUP BY a.ACCOUNTID   ) V_DLBV_FP_RECEIPT ON V_DLBV_FP_ACCOUNTS.ID = V_DLBV_FP_RECEIPT.ACCOUNTID     LEFT JOIN {{ ref('STAGE','V_DLBV_FP_STATICACCOUNTSUBSTATUSTYPE') }} V_DLBV_FP_STATICACCOUNTSUBSTATUSTYPE ON V_DLBV_FP_STATICACCOUNTSUBSTATUSTYPE.ID = V_DLBV_FP_ACCOUNTS.SUBSTATUSCODE  LEFT JOIN {{ ref('STAGE','V_DLBV_FP_STATICACCOUNTSTATUSTYPE') }} V_DLBV_FP_STATICACCOUNTSTATUSTYPE ON V_DLBV_FP_STATICACCOUNTSTATUSTYPE.ID = V_DLBV_FP_ACCOUNTS.CURSTATUSCODE  LEFT JOIN {{ ref('DATA_VAULT','S_AMS_BASICPOLINFO_MROC') }} s_ams_basicpolinfo_mroc ON SPLIT_PART(s_ams_basicpolinfo_mroc.DESCRIPTIONBPOL, '#', 2) = S_AP1_POLICYFINANCINGACTIVATIONRESULT.ACCOUNTNUMBER   AND s_ams_basicpolinfo_mroc.DESCRIPTIONBPOL IS NOT NULL  LEFT JOIN {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} ds_ams_transactiondetail ON ds_ams_transactiondetail.PolicyID = s_ams_basicpolinfo_mroc.polid   AND ds_ams_transactiondetail.ModeID IN (    12    ,14    )  LEFT JOIN {{ ref('DATA_VAULT','S_AP1_TRANSACTIONPOLICY_MROC') }} S_AP1_TRANSACTIONPOLICY_MROC ON S_AP1_TRANSACTIONPOLICY_MROC.POLICYID = S_AP1_POLICYFINANCINGACTIVATIONRESULT.POLICYID   AND S_AP1_TRANSACTIONPOLICY_MROC.isrowdeleted = FALSE  LEFT JOIN (   SELECT *   FROM {{ ref('DATA_VAULT','S_AP1_TRANSACTION_MROC') }}    QUALIFY ROW_NUMBER()
