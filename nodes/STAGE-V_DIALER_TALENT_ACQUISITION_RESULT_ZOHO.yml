        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_DIALER_TALENT_ACQUISITION_RESULT_ZOHO') }} AS SELECT V_DLBV_PCCE_DIALER_DETAIL_CURRENT.RECOVERYKEY PK ,
                   V_DLBV_PCCE_DIALER_DETAIL_CURRENT.CALLDURATION Call_Duration ,
                   ROUND(V_DLBV_PCCE_DIALER_DETAIL_CURRENT.CALLDURATION/1000) Call_Suration_Sec ,
                   V_DLBV_PCCE_PERSON_CURRENT.LOGINNAME Call_Owner ,
                   V_DLBV_PCCE_DIALER_DETAIL_CURRENT.WrapupData Call_Result ,
                   V_DLBV_PCCE_DIALER_DETAIL_CURRENT.DATETIME Call_Start_Time ,
                   'ZR_' || V_DLBV_PCCE_DL_5025_5025_CURRENT.AccountNumber || '_CAND' AS Contact_Name ,
                   CASE V_DLBV_PCCE_DIALER_DETAIL_CURRENT.CallResult
                        WHEN '0'                                     THEN 'Dialer has not yet attempted to contact that customer record'
                        WHEN '2'                                     THEN 'Error condition while dialing'
                        WHEN '3'                                     THEN 'Number reported not in service by network'
                        WHEN '4'                                     THEN 'No ringback from network when dial attempted'
                        WHEN '5'                                     THEN 'Operator intercept returned from network when dial attempted'
                        WHEN '6'                                     THEN 'No dial tone when dialer port went off hook'
                        WHEN '7'                                     THEN 'Number reported as invalid by the network'
                        WHEN '8'                                     THEN 'Customer phone did not answer'
                        WHEN '9'                                     THEN 'Customer phone was busy'
                        WHEN '10'                                    THEN 'Customer answered and was connected to agent'
                        WHEN '11'                                    THEN 'Fax machine detected'
                        WHEN '12'                                    THEN 'Answering machine detected'
                        WHEN '13'                                    THEN 'Dialer stopped dialing customer due to lack of agents or network stopped dialing before it was complete'
                        WHEN '14'                                    THEN 'Customer requested callback'
                        WHEN '15'                                    THEN 'Answering machine requested callback'
                        WHEN '16'                                    THEN 'Call was abandoned by the dialer due to lack of agents'
                        WHEN '17'                                    THEN 'Failed to reserve agent for personal callback.'
                        WHEN '18'                                    THEN 'Agent rejected a preview call or personal callback call.'
                        WHEN '19'                                    THEN 'Agent rejected a preview call with the close option.'
                        WHEN '20'                                    THEN 'Customer has been abandoned to an IVR'
                        WHEN '21'                                    THEN 'Customer dropped call within configured abandoned time'
                        WHEN '22'                                    THEN 'Mostly used with TDM switches - network answering machine, such as a network voicemail'
                        WHEN '23'                                    THEN 'Number successfully contacted but wrong number'
                        WHEN '24'                                    THEN 'Number successfully contacted but reached the wrong person'
                        WHEN '25'                                    THEN '1 The campaign is disabled. 2 The outbound percentage for the campaign skill group is set to zero in an admin script. 3 With personal callback in certain situations.'
                        WHEN '26'                                    THEN 'The number was on the do not call list'
                        WHEN '27'                                    THEN 'Call disconnected by the carrier or the network while ringing'
                        WHEN '28'                                    THEN 'Dead air or low voice volume call'
                        WHEN '29'                                    THEN 'SIP message received from dialer is not supported by voice gateway.'
                        WHEN '30'                                    THEN 'SIP message received from dialer is not authorized by voice gateway.'
                        WHEN '31'                                    THEN 'Invalid sip message sent by dialer to voice gateway.'
                        WHEN '32'                                    THEN 'Call cancelled because the dialer lost connection with the Campaign Manager.'
                        WHEN '33'                                    THEN 'Agent timed-out accepting preview or personal callback call.'
                        ELSE 'Unknown'
                         END || ' - ' || CASE V_DLBV_PCCE_DIALER_DETAIL_CURRENT.CallStatusZone1
                        WHEN 'A'                                          THEN 'Active'
                        WHEN 'B'                                          THEN 'Callback'
                        WHEN 'C'                                          THEN 'Closed'
                        WHEN 'D'                                          THEN 'Dialed'
                        WHEN 'F'                                          THEN 'Fax Machine'
                        WHEN 'L'                                          THEN 'Not Allocated'
                        WHEN 'J'                                          THEN 'Agent rejected'
                        WHEN 'M'                                          THEN 'Maximum number of attempts has been reached'
                        WHEN 'P'                                          THEN 'Pending'
                        WHEN 'R'                                          THEN 'Retry'
                        WHEN 'S'                                          THEN 'callback was requested'
                        WHEN 'U'                                          THEN 'Unknown'
                        WHEN 'X'                                          THEN 'agent is not available'
                        ELSE 'Unknown'
                         END AS Description ,
                   'Dialer Call Disposition' Subject
              FROM {{ ref('STAGE','V_DLBV_PCCE_DIALER_DETAIL_CURRENT') }} V_DLBV_PCCE_DIALER_DETAIL_CURRENT
              LEFT JOIN {{ ref('STAGE','V_DLBV_PCCE_AGENT_CURRENT') }} V_DLBV_PCCE_AGENT_CURRENT
                ON V_DLBV_PCCE_AGENT_CURRENT.PERIPHERALNUMBER = V_DLBV_PCCE_DIALER_DETAIL_CURRENT.AGENTPERIPHERALNUMBER
              LEFT JOIN {{ ref('STAGE','V_DLBV_PCCE_PERSON_CURRENT') }} V_DLBV_PCCE_PERSON_CURRENT
                ON V_DLBV_PCCE_PERSON_CURRENT.PERSONID = V_DLBV_PCCE_AGENT_CURRENT.PERSONID
             INNER JOIN {{ ref('STAGE','V_DLBV_PCCE_DL_5025_5025_CURRENT') }} V_DLBV_PCCE_DL_5025_5025_CURRENT
                ON V_DLBV_PCCE_DL_5025_5025_CURRENT.DialingListID = V_DLBV_PCCE_DIALER_DETAIL_CURRENT.DialingListID
             WHERE V_DLBV_PCCE_DIALER_DETAIL_CURRENT.QueryRuleID=5025
             ORDER BY V_DLBV_PCCE_DIALER_DETAIL_CURRENT.DATETIME
