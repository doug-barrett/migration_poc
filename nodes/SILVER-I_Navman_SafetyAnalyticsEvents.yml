          FROM {{ ref('BRONZE', 'L_Navman_SafetyAnalyticsEvents') }} "L_Navman_SafetyAnalyticsEvents"
          LEFT JOIN {{ ref('SILVER', 'I_SafetyAnalyticsEventsMapping') }} "I_SafetyAnalyticsEventsMapping"
            ON L_NAVMAN_SAFETYANALYTICSEVENTS.EVENTTYPEID = I_SAFETYANALYTICSEVENTSMAPPING.EVENTTYPEID AND L_NAVMAN_SAFETYANALYTICSEVENTS.VEHICLEID = I_SAFETYANALYTICSEVENTSMAPPING.VEHICLEID AND L_NAVMAN_SAFETYANALYTICSEVENTS.EVENTDATETIME = I_SAFETYANALYTICSEVENTSMAPPING.EVENTDATETIME
          LEFT JOIN {{ ref('SILVER', 'I_Navman_Vehicle_Hist') }} "I_Navman_Vehicle_Hist"
            ON L_NAVMAN_SAFETYANALYTICSEVENTS.VEHICLEID = I_NAVMAN_VEHICLE_HIST.ID
          LEFT JOIN {{ ref('SILVER', 'I_Navman_Driver_Hist') }} "I_Navman_Driver_Hist"
            ON L_NAVMAN_SAFETYANALYTICSEVENTS.DRIVERID = I_NAVMAN_DRIVER_HIST.ID
          LEFT JOIN {{ ref('GOLD', 'D_Vehicle') }} "D_Vehicle"
            ON I_NAVMAN_VEHICLE_HIST.REGISTRATION = D_VEHICLE.REGISTRATION
          WHERE [L_NAVMAN_SAFETYANALYTICSEVENTS].EVENTTYPEID = 6  --ONLY WANT JDE ASSETS AS THERE ARE DUPLICATES
