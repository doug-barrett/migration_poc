        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_MKT_CALL_WEEKLY') }} AS SELECT a.call_id,
                   a.isWeeklyUnique,
                   a.caller_number,
                   a.brandid,
                   a.Call_Start,
                   b.year_number,
                   b.Week_Number
              FROM {{ ref('STAGE','BVSTG_MKT_AU1B_CALL_LOG_CARS') }} a
             INNER JOIN {{ ref('STAGE','V_MKT_WEEKNUM') }} b
                ON year(a.INITIATEDDATETIME) = b.Year_Number
               AND week(a.INITIATEDDATETIME) = b.Week_Number
             WHERE a.isNonUnique = 1
               AND ifnull(a.caller_number,'')<>''
