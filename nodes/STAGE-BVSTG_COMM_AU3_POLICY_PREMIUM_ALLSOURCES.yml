          - locationName: EDW
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT ds_comm_eom_extract_allsources.policynumberformatted,
                   ds_comm_eom_extract_allsources.carrier,
                   ds_comm_eom_extract_allsources.policynumberformatted_old,
                   ds_comm_eom_extract_allsources.carrier_old,
                   ds_comm_eom_extract_allsources.term,
                   ds_comm_eom_extract_allsources.nbsmonth,
                   ds_comm_eom_extract_allsources.isnewbusinessmonth,
                   ds_comm_eom_extract_allsources.isrenewalmonth,
                   ds_comm_eom_extract_allsources.newbusinesspolicyflag,
                   ds_comm_eom_extract_allsources.asofmonth,
                   ifnull(ds_comm_eom_extract_allsources.paidtype, 'As Written') AS paidtype,
                   CASE WHEN ds_comm_eom_extract_allsources.ispolicyin_cdrc = 1 AND bvstg_comm_au3_eom_extract_cs.paidtypefinal <> 'As Earned'                                                        THEN bvstg_comm_au3_eom_extract_cs.premium
                        WHEN ds_comm_eom_extract_allsources.ispolicyin_cdrc = 1 AND ds_comm_eom_extract_allsources.isrenewalmonth = 1 AND bvstg_comm_au3_eom_extract_cs_1.paidtypefinal = 'As Earned' THEN bvstg_comm_au3_eom_extract_cs_1.premium * bvstg_comm_au3_eom_extract_cs_1.term
                        ELSE NULL
                         END AS WrittenPremium
              FROM (
                    SELECT ds_comm_eom_extract_allsources.policynumberformatted,
                           ds_comm_eom_extract_allsources.carrier,
                           ds_comm_eom_extract_allsources.policynumberformatted_old,
                           ds_comm_eom_extract_allsources.carrier_old,
                           ds_comm_eom_extract_allsources.term,
                           ds_comm_eom_extract_allsources.nbsmonth,
                           ds_comm_eom_extract_allsources.isnewbusinessmonth,
                           ds_comm_eom_extract_allsources.isrenewalmonth,
                           ds_comm_eom_extract_allsources.newbusinesspolicyflag,
                           ds_comm_eom_extract_allsources.asofmonth,
                           ifnull(ds_comm_eom_extract_allsources.paidtype, bvstg_comm_au3_eom_extract_cs.paidtypefinal) AS paidtype,
                           CASE WHEN bvstg_comm_au3_eom_extract_cs.policynumberformatted IS NOT NULL THEN 1
                                ELSE 0
                                 END AS ispolicyin_cdrc //
                      FROM "DATA_LAKE"."BIA_ANALYTICS"."DS_COMM_EOM_EXTRACT_ALLSOURCES" ds_comm_eom_extract_allsources
                      FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }} ds_comm_eom_extract_allsources
                      LEFT JOIN (
                            SELECT bvstg_comm_au3_eom_extract_cs.policynumberformatted,
                                   DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF.carrierdisplayname,
                                   bvstg_comm_au3_eom_extract_cs.paidtypefinal //
                              FROM "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_COMM_AU3_EOM_EXTRACT_CS"
                              FROM {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }} //
                              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF"
                              LEFT JOIN {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}
                                ON BVSTG_COMM_AU3_EOM_EXTRACT_CS.policynumberformatted=DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF.policynumberformatted
                               AND BVSTG_COMM_AU3_EOM_EXTRACT_CS.carrierdisplayname=DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF.carrierdisplayname_or
                           ) bvstg_comm_au3_eom_extract_cs
                        ON ds_comm_eom_extract_allsources.policynumberformatted_old = bvstg_comm_au3_eom_extract_cs.policynumberformatted
                       AND ds_comm_eom_extract_allsources.carrier_old = bvstg_comm_au3_eom_extract_cs.carrierdisplayname
                   ) ds_comm_eom_extract_allsources
              LEFT JOIN ( SELECT policynumberformatted,
                   carrierdisplayname,
                   executionmonth,
                   term,
                   paidtypefinal,
                   max(premium) premium
              FROM (SELECT bvstg_comm_au3_eom_extract_cs.policynumberformatted,
                   DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF.carrierdisplayname,
                   bvstg_comm_au3_eom_extract_cs.executionmonth,
                   bvstg_comm_au3_eom_extract_cs.term,
                   bvstg_comm_au3_eom_extract_cs.paidtypefinal,
                   bvstg_comm_au3_eom_extract_cs.premium,
                   bvstg_comm_au3_eom_extract_cs.source_table,
                   bvstg_comm_au3_eom_extract_cs.transactiontype //
              FROM "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_COMM_AU3
