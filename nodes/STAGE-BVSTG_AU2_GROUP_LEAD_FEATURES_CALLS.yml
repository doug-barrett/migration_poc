        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU2_GROUP_LEAD
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
        join:
          joinCondition: |-
            FROM(
                    SELECT FIRST_GROUP_LEADID ,
                           MAX(C_CustomerID) C_CustomerID ,
                           MIN(DATE(FIRST_GROUP_LEADID_LEADDATE)) min_date ,
                           MAX(DATE(COALESCE(BVSTG_AU2_GROUP_LEAD.SaleDate, CURRENT_DATE()))) max_date ,
                           MAX(SourceDB) SourceDB ,
                           SUM(CASE WHEN IFNULL(SALE_LEADID,'')!= L_LEADID THEN 1 ELSE 0 END) NUMBER_OF_LEADS
                      FROM {{ ref('STAGE','BVSTG_AU2_GROUP_LEAD') }}
                     WHERE DATE(FIRST_GROUP_LEADID_LEADDATE) != DATE(IFNULL(SALEDATE,CURRENT_DATE()))
                     GROUP BY FIRST_GROUP_LEADID
                   )BVSTG_AU2_GROUP_LEAD
             INNER JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} DS_MKT_CALL_CUSTOMER
                ON DS_MKT_CALL_CUSTOMER.CustomerID = BVSTG_AU2_GROUP_LEAD.C_CustomerID
               AND DS_MKT_CALL_CUSTOMER.SOURCEDB_CUSTOMER = BVSTG_AU2_GROUP_LEAD.SOURCEDB
               AND DATE(DS_MKT_CALL_CUSTOMER.STARTDATETIME) > min_date
               AND DATE(DS_MKT_CALL_CUSTOMER.STARTDATETIME) < max_date
             GROUP BY FIRST_GROUP_LEADID
        name: BVSTG_AU2_GROUP_LEAD_FEATURES_CALLS
