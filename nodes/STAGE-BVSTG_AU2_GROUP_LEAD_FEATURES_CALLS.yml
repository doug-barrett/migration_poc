    sourceMapping:
      - aliases:
          BVSTG_AU2_GROUP_LEAD: f885e7fa-3f60-4661-a067-a278e04b8a2b
          DS_MKT_CALL_CUSTOMER: a1eb4560-c80e-4133-a2d9-f6a82026093c
        customSQL:
