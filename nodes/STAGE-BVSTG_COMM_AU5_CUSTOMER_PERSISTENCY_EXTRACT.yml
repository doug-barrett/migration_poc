cy_match_first as customerid,customer_type_policy_match_first as customer_type,    LineOFBusinessType_Policy_Match_First as LineOFBusinessType,leadid_Policy_Match_First as leadid,ProducerID_Policy_Match_First as ProducerID,    MatchType_Policy_Match_First as MatchType,islegacytransaction_Policy_Match_First as islegacytransaction      -- from "RETAIL_PROD"."SCH_
