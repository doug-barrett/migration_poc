                   GL.GROUP_LEADID,
                   CASE WHEN GLS.L_LEADID IS NOT NULL THEN GL.SALE_TRANSACTIONID
                         END L_TRANSACTIONID,
                   CASE WHEN GLS.L_LEADID IS NOT NULL THEN GL.SALEDATE
                         END L_SALEDATE,
                   GL.SALE_TRANSACTIONID,
                   DATE(GL.SALEDATE) SALEDATE,
                   GL.CUSTOMER_LEAD_TYPE,
                   GL.C_CUSTOMERFULLNAME,
                   GL.C_ISLEGACY,
                   C.CATEGORY,
                   C.SUBCATEGORY,
                   C.VENDOR,
                   C.PRODUCTTYPE,
                   C.PLACEMENTLEVEL,
                   CASE WHEN C_ISLEGACY = 'Migrated' AND CUSTOMER_LEAD_TYPE = 'PROSPECT' THEN 1
                        ELSE 0
                         END MIGRATED_PROSPECT,
                   CASE WHEN C_ISLEGACY = 'Migrated' AND CUSTOMER_LEAD_TYPE = 'WINBACK' THEN 1
                        ELSE 0
                         END MIGRATED_EXISTING_CUSTOMER,
                   CASE WHEN C_ISLEGACY = 'Native' AND CUSTOMER_LEAD_TYPE = 'PROSPECT' THEN 1
                        ELSE 0
                         END NATIVE_PROSPECT,
                   CASE WHEN C_ISLEGACY = 'Native' AND CUSTOMER_LEAD_TYPE = 'WINBACK' THEN 1
                        ELSE 0
                         END NATIVE_EXISTING_CUSTOMER,
                   CASE WHEN LEADSOURCE IN ('Cust TimeStamp (i)','Cust TimeStamp (o)','Cust TimeStamp (u)','Cust/User (i)','Cust/User (o)','Cust/User (u)','Phone AppOne') THEN 1
                        ELSE 0
                         END NO_OF_LEAD_SOURCE_PHONE,
                   CASE WHEN LEADSOURCE IN ('Web','LMS (email)','LMS (Phone)') THEN 1
                        ELSE 0
                         END NO_OF_LEAD_SOURCE_WEB,
                   CASE WHEN LEADSOURCE = '' THEN 1
                        ELSE 0
                         END NO_OF_LEAD_SOURCE_WALKIN,
                   CASE WHEN LS.LEADSOURCENAME_SYSTEM LIKE '%Step%' THEN 1
                        ELSE 0
                         END NO_OF_SOUCE_SYSTEM_2STEP,
                   CASE WHEN LS.LEADSOURCENAME_SYSTEM NOT LIKE '%Step%' THEN 1
                        ELSE 0
                         END NO_OF_SOUCESYSTEM_VFOTHERS
              FROM {{ ref('STAGE','BVSTG_AU2_GROUP_LEAD') }} GL
              LEFT JOIN (
                    SELECT L_LEADID
                      FROM {{ ref('STAGE','BVSTG_AU2_GROUP_LEAD') }}
                     WHERE DATE(IFNULL(SALEDATE,'2000-01-01')) != DATE(L_LEADDATE) QUALIFY ROW_NUMBER() OVER (PARTITION BY FIRST_GROUP_LEADID ORDER BY L_LEADDATE DESC) = 1
                   ) GLS
                ON GL.L_LEADID = GLS.L_LEADID
             INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} CS
                ON CS.CustomerID = GL.C_CUSTOMERID
               AND CS.SOURCEDB = GL.SOURCEDB
              LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} LS
                ON CASE WHEN GL.SourceDb ='CIGH' THEN CS.CUSTOMERNO
                        ELSE GL.L_LEADID
                         END = LS.LEADID
               AND GL.SourceDb = LS.SourceDb
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} C
                ON LS.CAMPAIGNID=C.CAMPAIGNID
              LEFT JOIN (
                    SELECT a.L_LEADID,
                           DENSE_RANK() OVER (PARTITION BY a.FIRST_GROUP_LEADID ORDER BY a.L_LEADDATE) Rank_Start
                      FROM(
                            SELECT L_LEADID,
                                   C_CUSTOMERID,
                                   FIRST_GROUP_LEADID,
                                   DATE(L_LEADDATE)L_LEADDATE
                              FROM {{ ref('STAGE','BVSTG_AU2_GROUP_LEAD') }}
                             WHERE DATE(IFNULL(SALEDATE,'2000-01-01')) != DATE(L_LEADDATE) QUALIFY ROW_NUMBER() OVER (PARTITION BY C_CUSTOMERID,FIRST_GROUP_LEADID,DATE(L_LEADDATE) ORDER BY L_LEADDATE DESC) = 1
                           )a
                   ) GL_Start
                ON GL.L_LEADID = GL_Start.L_LEADID
             WHERE DATE(IFNULL(GL.SALEDATE,'2000-01-01')) != DATE(GL.L_LEADDATE) QUALIFY ROW_NUMBER() OVER (PARTITION BY GL.C_CUSTOMERID,FIRST_GROUP_LEADID,DATE(GL.L_LEADDATE) ORDER BY GL.L_LEADDATE DESC) = 1
