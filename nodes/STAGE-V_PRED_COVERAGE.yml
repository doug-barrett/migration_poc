          V_S_AP1_POLICYVERSION_MROC_CURRENT: 2116f500-76bb-43c1-a269-a89379c9e9c6
          V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT: 47785ee6-0a02-4712-9368-acaf696e9fdb
          V_S_AMS_COVERAGE_MROC_CURRENT: 9acd8c24-20e9-42b2-8e35-53a600dcfe04
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PRED_COVERAGE') }} AS SELECT cast(deductible AS integer) deductible,
                   cast(limitperperson AS integer) limitperperson,
                   cast(limitperaccident AS integer) limitperaccident,
                   cast(limittotal AS integer) limittotal,
                   hasCOMP,
                   hasCOLL,
                   hasLIAB,
                   hasUM
              FROM (
                    SELECT a.deductible,
                           a.limitperperson,
                           a.limitperaccident,
                           a.limittotal,
                           CASE WHEN b.hasCOMP>0 THEN 1
                                ELSE 0
                                 END hasCOMP,
                           CASE WHEN c.hasColl>0 THEN 1
                                ELSE 0
                                 END hasCOLL,
                           CASE WHEN d.hasLIAB>0 THEN 1
                                ELSE 0
                                 END hasLIAB,
                           CASE WHEN e.hasUM>0 THEN 1
                                ELSE 0
                                 END hasUM
                      FROM (
                            SELECT e.policyid,
                                   max(IFNULL(b.deductible,0)) deductible,
                                   max(IFNULL(b.limitperperson,0)) limitperperson,
                                   max(IFNULL(b.limitperaccident,0)) limitperaccident,
                                   max(IFNULL(b.limittotal,0)) limittotal
                              FROM (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) b,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) d,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) e
                             WHERE b.policyvehicleid=d.policyvehicleid
                               AND d.policyversionid=e.policyversionid
                             GROUP BY e.policyid
                           ) a
                      LEFT JOIN -- Comprehensive
            (
                            SELECT e.policyid,
                                   count(1) hasCOMP
                              FROM (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) a,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) b,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) d,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) e
                             WHERE b.mastercoveragetypeid=a.mastercoveragetypeid
                               AND b.policyvehicleid=d.policyvehicleid
                               AND d.policyversionid=e.policyversionid
                               AND coveragetypecode='COMP'
                             GROUP BY e.policyid
                           ) b
                        ON a.policyid=b.policyid
                      LEFT JOIN -- Collision
            (
                            SELECT e.policyid,
                                   count(1) hasColl
                              FROM (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) a,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) b,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) d,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) e
                             WHERE b.mastercoveragetypeid=a.mastercoveragetypeid
                               AND b.policyvehicleid=d.policyvehicleid
                               AND d.policyversionid=e.policyversionid
                               AND coveragetypecode='COLL'
                             GROUP BY e.policyid
                           ) c
                        ON a.policyid=c.policyid
                      LEFT JOIN -- Liability
            (
                            SELECT e.policyid,
                                   count(1) hasLIAB
                              FROM (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) a,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) b,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) d,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) e
                             WHERE b.mastercoveragetypeid=a.mastercoveragetypeid
                               AND b.policyvehicleid=d.policyvehicleid
                               AND d.policyversionid=e.policyversionid
                               AND coveragetypecode IN ('PD','BI','PIP')
                             GROUP BY e.policyid
                           ) d
                        ON a.policyid=d.policyid
                      LEFT JOIN -- Uninsured Mortorist
            (
                            SELECT e.policyid,
                                   count(1) hasUM
                              FROM (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) a,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) b,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) d,
                                   (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }}
                                     WHERE isrowdeleted=0
                                   ) e
                             WHERE b.mastercoveragetypeid=a.mastercoveragetypeid
                               AND b.policyvehicleid=d.policyvehicleid
                               AND d.policyversionid=e.policyversionid
                               AND (coveragetypecode LIKE 'UM%' OR coveragetypecode LIKE 'UI%')
                             GROUP BY e.policyid
                           ) e
                        ON a.policyid=e.policyid
                     UNION SELECT a.deductible,
                           a.limitperperson,
                           a.limitperaccident,
                           a.limittotal,
                           CASE WHEN c.hasCOMP>0 THEN 1
                                ELSE 0
                                 END hasCOMP,
                           CASE WHEN d.hasCOLL>0 THEN 1
                                ELSE 0
                                 END hasCOLL,
                           CASE WHEN b.hasLIAB>0 THEN 1
                                ELSE 0
                                 END hasLIAB,
                           CASE WHEN e.hasUM>0 THEN 1
                                ELSE 0
                                 END hasUM
                      FROM (
                            SELECT polid,
                                   MAX(IFNULL(deduct1,0)) deductible,
                                   MAX(IFNULL(limit1,0)) limitperperson,
                                   MAX(IFNULL(limit2,0)) limitperaccident,
                                   MAX(IFNULL(limit1,0)+IFNULL(limit2,0)) limittotal
                              FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} s_ams_coverage_mroc_current
                             GROUP BY polid
                           ) a
                      LEFT JOIN (
                            SELECT polid,
                                   count(1) hasLIAB
                              FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} s_ams_coverage_mroc_current
                             WHERE UPPER(COVERAGECODE) like 'PERSONAL%'
                                OR UPPER(COVERAGECODE) like 'PROPERTY%'
                                OR UPPER(COVERAGECODE) like 'MEDICAL%'
                                OR UPPER(COVERAGECODE) like 'BODILY%'
                                OR UPPER(COVERAGECODE) like 'PIP%'
                             GROUP BY polid
                           ) b
                        ON a.polid=b.polid
                      LEFT JOIN (
                            SELECT polid,
                                   count(1) hasCOMP
                              FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} s_ams_coverage_mroc_current
                             WHERE UPPER(COVERAGECODE) like 'COMPREHENSIVE%'
                             GROUP BY polid
                           ) c
                        ON a.polid=c.polid
                      LEFT JOIN (
                            SELECT polid,
                                   count(1) hasCOLL
                              FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} s_ams_coverage_mroc_current
                             WHERE UPPER(COVERAGECODE) like 'COLLISION%'
                             GROUP BY polid
                           ) d
                        ON a.polid=d.polid
                      LEFT JOIN (
                            SELECT polid,
                                   count(1) hasUM
                              FROM {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} s_ams_coverage_mroc_current
                             WHERE UPPER(COVERAGECODE) like 'UNINSURED%'
                                OR UPPER(COVERAGECODE) like 'UNDERINSURED%'
                             GROUP BY polid
                           ) e
                        ON a.polid=e.polid
                   ) ;
        dependencies:
          - locationName: STAGE
            nodeName: V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_POLICYVEHICLE_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_POLICYVERSION_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AMS_COVERAGE_MROC_CURRENT
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','V_S_AP1_POLICYVEHICLECOVERAGE_MROC_CURRENT') }}
            {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }}
            {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }}
            {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }}
            {{ ref('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }}
        name: V_PRED_COVERAGE
        noLinkRefs: []
