          - locationName: EDW
            nodeName: DS_SPLC_POLICYTRANSACTION
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
        join:
          joinCondition: |-
            FROM (
                    SELECT bvstg_comm_au1_venn_report.*,
                           CASE WHEN DS_COMM_EOM_EXTRACT_ALLSOURCES.policynumberformatted IS NOT NULL THEN 'morethanonecarrier'
                                 END AS morethanonecarrierflag //
                      FROM bvstg_comm_au1_venn_report
                      FROM {{ ref('STAGE','BVSTG_COMM_AU1_VENN_REPORT') }}
                      LEFT JOIN //MASTERTABLE3 (
                            SELECT bvstg_comm_au1_venn_report.policynumberformatted //
                              FROM bvstg_comm_au1_venn_report AS bvstg_comm_au1_venn_report
                              FROM {{ ref('STAGE','BVSTG_COMM_AU1_VENN_REPORT') }} AS bvstg_comm_au1_venn_report
                              LEFT JOIN //"RETAIL_PROD"."SCH_EDW"."DS_COMM_EOM_EXTRACT_ALLSOURCES" AS DS_COMM_EOM_EXTRACT_ALLSOURCES {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }} AS DS_COMM_EOM_EXTRACT_ALLSOURCES
                                ON bvstg_comm_au1_venn_report.policynumberformatted = DS_COMM_EOM_EXTRACT_ALLSOURCES.policynumberformatted
                             GROUP BY bvstg_comm_au1_venn_report.policynumberformatted
                            HAVING count(DISTINCT DS_COMM_EOM_EXTRACT_ALLSOURCES.carrier) > 1
                           ) DS_COMM_EOM_EXTRACT_ALLSOURCES
                        ON bvstg_comm_au1_venn_report.policynumberformatted=DS_COMM_EOM_EXTRACT_ALLSOURCES.policynumberformatted
                   ) bvstg_comm_au1_venn_report
              LEFT JOIN (
                    SELECT DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.policynumberformatted,
                           DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.CarrierDisplayName carrier //
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_SPLC_POLICYTRANSACTION" AS DS_SPLC_POLICYTRANSACTION
                      FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} AS DS_SPLC_POLICYTRANSACTION
                      LEFT JOIN (
                            SELECT DISTINCT PolicyNumber_EDW,
                                   CarrierName_EDW,
                                   PolicyNumberFormatted,
                                   CarrierDisplayName //
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES"
                              FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}
                           ) DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
                        ON DS_SPLC_POLICYTRANSACTION.policynumber = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.PolicyNumber_EDW
                       AND DS_SPLC_POLICYTRANSACTION.carriername = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.carriername_Edw
                   )DS_SPLC_POLICYTRANSACTION
                ON bvstg_comm_au1_venn_report.policynumberformatted = DS_SPLC_POLICYTRANSACTION.policynumberformatted
               AND bvstg_comm_au1_venn_report.carrier = DS_SPLC_POLICYTRANSACTION.carrier
