      join:
        joinCondition: "FROM {{ ref('GOLD', 'SRC_USRBIOFL') }} \"SRC_USRBIOFL\" \n\nLEFT OUTER JOIN {{ ref_no_link('GOLD', 'LOCATION') }} \"LOCATION\"\nON   SRC_USRBIOFL.UILOC = LOCATION.Location_Code\nAND SRC_USRBIOFL.UICMP = LOCATION.Company_Code\nAND LOCATION.dss_current_flag = 'Y' \n    \nLEFT OUTER JOIN {{ ref('GOLD', 'ADDRESS') }} \"ADDRESS\"\nON   UPPER(SRC_USRBIOFL.UICMP) = UPPER(ADDRESS.COMPANY_CODE)\nAND ADDRESS.ADDRESS_TYPE_CODE = 'E'\nAND UPPER(SRC_USRBIOFL.UIMAIL) = UPPER(ADDRESS.ADDRESS_TEXT_1)\n\nWhere Aud_Time <= (Select MAX(Batch_End) from {{ ref('GOLD', 'CDC_BATCH') }} )\nAND Aud_Time > (Select DATEADD(day, -1, MAX(Batch_Start)) from {{ ref('GOLD', 'CDC_BATCH') }})\nAND (Aud_Code <> 'F' or (Aud_Code is null and Aud_Type = 'RR'))\n\nQUALIFY RANK() \nOVER (PARTITION BY COALESCE(UICMP,''), COALESCE(UIUSER,'')\n --UICMP, UIUSER\nORDER BY Aud_Time DESC, CASE  \nWHEN Aud_Type in ('PT','PX','FI')\tTHEN 1 \nWHEN Aud_Type in ('UB','FB','FP','BR')\tTHEN 2 \nWHEN Aud_Type in ('UP','UR')\t\
          THEN 3 \nWHEN Aud_Type in ('DL','FD')\tTHEN 4 \nWHEN Aud_Type in ('RR')\t\tTHEN 5 \nELSE 0 END DESC) = 1"
      name: ETL_USER_BIO
      noLinkRefs:
      - locationName: GOLD
        nodeName: LOCATION
