    sourceMapping:
    - aliases:
        SRC_JOBS: 237a2db0-4d09-500c-9a00-2d07d9b42e30
      customSQL:
        customSQL: "select invoices.*,CONCAT(CSR.fname,' ',CSR.lname) AS Csr_Name,CSR.external_id\
          \ as CSR_Teammate_Id, CONCAT(Dispatcher.fname,' ',Dispatcher.lname) as Dispatcher_Name,Dispatcher.external_id\
          \ as Dispatcher_Teammate_Id, \nCONCAT(Biller.fname,' ',Biller.lname) as\
          \ Biller_Name,Biller.external_id as Biller_Teammate_Id,\nCONCAT(Salesman.fname,'\
          \ ',Salesman.lname) as Salesman_Name,Salesman.external_id as Salesman_Teammate_Id,\n\
          Case when job_status ='LE' THEN 'Lead'\n     WHEN job_status ='QO' THEN\
          \ 'Quote'\n     WHEN job_status ='WO' THEN 'Work Order'\n     WHEN job_status\
          \ ='IN' THEN 'Invoice'\n     WHEN job_status ='CL' THEN 'Archived'\n   \
          \  WHEN job_status ='VO' THEN 'Void'\n     else 'Other' end As Job_Status,\n\
          Case When invoice_status ='AC' Then 'Accepted'\n     when invoice_status\
          \ ='AK' Then 'Acknowledged'\n     when invoice_status ='NS' Then 'Not Sent'\n\
          \     when invoice_status ='VO' Then 'Void'\n     when invoice_status ='SE'\
          \ Then 'Sent'\n     when invoice_status ='RJ' Then 'Rejected'\n     else\
          \ 'Other' END AS Invoice_Status,\npricing_profiles.name as Pricing_Profile,Concat(customer_fname,'\
          \ ',customer_surname) as Customer_Name,\nbilling_account_id, campaign, source,\
          \ referrer\nfrom invoices\nLEFT JOIN users CSR ON invoices.salesman_1_id=CSR.employee_number\n\
          LEFT JOIN users Dispatcher ON invoices.salesman_2_id=Dispatcher.employee_number\n\
          LEFT JOIN users Biller ON invoices.salesman_3_id=Biller.employee_number\n\
          LEFT JOIN users Salesman ON invoices.salesman_4_id=Salesman.employee_number\n\
          LEFT JOIN pricing_profiles  on pricing_profiles.id = invoices.pricing_profile_id\n\
          ;COMMIT ;"
