        join:
          joinCondition: |-
            FROM (
                    SELECT *
                      FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU0_BSL') }}
                   ) BVSTG_NSA_RWL_AU0_BSL
              LEFT JOIN (
                    SELECT LEADID,
                           CUSTOMERID,
                           LEADSOURCENAME_SYSTEM,
                           OFFICECODE,
                           AREACODE,
                           LEADCREATED,
                           LEADSOURCE,
                           CAMPAIGNID ,
                           CASE WHEN LEADSOURCE IN ('Cust TimeStamp (i)', 'Cust TimeStamp (o)', 'Cust TimeStamp (u)', 'Cust/User (i)', 'Cust/User (o)', 'Cust/User (u)', 'Phone AppOne') THEN 'Phone'
                                WHEN LEADSOURCE IN ('Web', 'LMS (email)', 'LMS (Phone)') AND (ISQUOTE + ISSALE + ISTRANSFER) > 0                                                         THEN 'Qualifed Web'
                                WHEN LEADSOURCE IN ('Web', 'LMS (email)', 'LMS (Phone)')                                                                                                 THEN 'UnQualifed Web'
                                WHEN CAMPAIGNID IS NOT NULL                                                                                                                              THEN 'Phone'
                                ELSE 'Walk-in'
                                 END AS LEAD_TYPE ,
                           CASE WHEN CAMPAIGNID IS NULL THEN 0
                                ELSE 1
                                 END AS CAMPAINGID_FLAG
                      FROM {{ ref('EDW','DS_MKT_LEAD_SOURCE') }}
                     WHERE sourcedb = 'AppOne'
                   ) DS_MKT_LEAD_SOURCE
                ON (BVSTG_NSA_RWL_AU0_BSL.customerid = DS_MKT_LEAD_SOURCE.customerid AND BVSTG_NSA_RWL_AU0_BSL.leadid = DS_MKT_LEAD_SOURCE.leadid)
