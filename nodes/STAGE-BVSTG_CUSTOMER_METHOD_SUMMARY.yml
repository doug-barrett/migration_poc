        join:
          joinCondition: |-
            FROM(
                    SELECT DATE(CUSTOMER_CREATED) Date , 'Prospect' Interaction ,
                           PROSPECTMETHOD SOURCE ,
                           COUNT(1) Count_CustomerID ,
                           SourceDB
                      FROM {{ ref('EDW','DS_CUSTOMER_METHOD') }}
                     WHERE ISPROSPECT = 1
                     GROUP BY PROSPECTMETHOD ,
                              DATE(CUSTOMER_CREATED) ,
                              SourceDB
                     UNION SELECT DATE(CUSTOMER_CREATED) Date ,'Quoted' Interaction ,
                           QUOTEDMETHOD SOURCE ,
                           COUNT(1) Count_CustomerID ,
                           SourceDB
                      FROM {{ ref('EDW','DS_CUSTOMER_METHOD') }}
                     WHERE ISQUOTED = 1
                     GROUP BY QUOTEDMETHOD ,
                              DATE(CUSTOMER_CREATED) ,
                              SourceDB
                     UNION SELECT DATE(CUSTOMER_CREATED) Date ,'Completed' Interaction ,
                           COMPLETEDMETHOD SOURCE ,
                           COUNT(1) Count_CustomerID ,
                           SourceDB
                      FROM {{ ref('EDW','DS_CUSTOMER_METHOD') }}
                     WHERE ISCOMPLETED = 1
                     GROUP BY COMPLETEDMETHOD ,
                              DATE(CUSTOMER_CREATED) ,
                              SourceDB
                     UNION SELECT DATE(CUSTOMER_CREATED) Date ,'Converted' Interaction ,
                           CONVERTEDMETHOD SOURCE ,
                           COUNT(1) Count_CustomerID ,
                           SourceDB
                      FROM {{ ref('EDW','DS_CUSTOMER_METHOD') }}
                     WHERE ISCONVERTED = 1
                     GROUP BY CONVERTEDMETHOD ,
                              DATE(CUSTOMER_CREATED) ,
                              SourceDB
                   ) ds_customer_method
