    sourceMapping:
      - aliases:
          V_QACOM_REPORT_DATA: f7c961af-659f-4729-b53b-bd6a2aa21af6
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_QACOM_REPORT_DATA') }} AS SELECT a.Carrier AS Carrier,
                   a.TRANSACTIONTYPE AS TRANSACTIONTYPE,
                   IFNULL(e.TRANSTYPEMAPPING,c.TRANSTYPEMAPPING) AS TRANSTYPEMAPPING,
                   a.ExecutionMonth AS ExecutionMonth,
                   a.FILECOMPLETEPATH AS FILECOMPLETEPATH,
                   a.Premium AS Premium,
                   a.ACTUALCOMMISSION AS ACTUALCOMMISSION,
                   a.CarrierDataRepositoryCompleteID AS CarrierDataRepositoryCompleteID,
                   a.ProducerCode AS ProducerCode,
                   a.Agency AS Agency,
                   a.PolicyNumber AS PolicyNumber,
                   a.State AS State,
                   a.ProducerCode2,
                   a.OfficeCode,
                   a.EffectiveDate,
                   a.IsStandard,
                   a.LOB,
                   a.FeeAmount,
                   a.TaxAmount,
                   a.CashRecDisb,
                   a.DueInsured,
                   a.TotalNetAmt,
                   a.StatementDate,
                   a.ValidatedDate,
                   a.ExecutionCode,
                   a.CreatedBy,
                   a.CreatedOn,
                   a.UpdatedBy,
                   a.UpdatedOn,
                   a.PolicyCommissionID,
                   a.TransactionDate,
                   a.ReconciledDate,
                   a.DataServicesValidated,
                   a.Code,
                   a.Program,
                   a.Term,
                   a.MasterCarrierID,
                   a.MGA,
                   a.IsDeleted,
                   a.IsDuplicate
              FROM "RETAIL_DEV"."SCH_BVSTAGE"."V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT" a
              LEFT OUTER JOIN "DATA_LAKE"."MAGUIRE"."V_DL_COMM_TRANSTYPEMAPPINGCDRC_CURRENT" d
                ON (a.MASTERCARRIERID=d.MASTERCARRIERID AND a.TRANSACTIONTYPE = d.TRANSTYPEMAPPINGCDRC AND d.ISACTIVE='True')
              LEFT JOIN "DATA_LAKE"."MAGUIRE"."V_DL_COMM_TRANSTYPEMAPPING_CURRENT" e
                ON (d.TRANSTYPEMAPPINGID=e.TRANSTYPEMAPPINGID AND e.ISACTIVE='True')
              LEFT OUTER JOIN "DATA_LAKE"."MAGUIRE"."V_DL_COMM_TRANSTYPEMAPPINGCDRC_CURRENT" b
                ON (a.TRANSACTIONTYPE = b.TRANSTYPEMAPPINGCDRC AND b.MASTERCARRIERID=0 AND b.ISACTIVE='True')
              LEFT JOIN "DATA_LAKE"."MAGUIRE"."V_DL_COMM_TRANSTYPEMAPPING_CURRENT" c
                ON (b.TRANSTYPEMAPPINGID=c.TRANSTYPEMAPPINGID AND c.ISACTIVE='True')
             WHERE a."ISDUPLICATE"='False'
               AND a.ISDELETED='False'
               AND a.ExecutionMonth >= '2020-01-01'
