          - locationName: STAGE
            nodeName: V_DLBV_CFA_HCI_AGENTS_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_CFA_HCI_COMPENSATION_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONITEM') }} ds_bvstg_ap1_transactionitem
             INNER JOIN {{ ref('STAGE','V_DLBV_CFA_HCI_AGENTS_CURRENT') }} v_dlbv_cfa_hci_agents_current
                ON ds_bvstg_ap1_transactionitem.ULTIPROCREATEDBY = v_dlbv_cfa_hci_agents_current.EMPLOYEENUMBER
               AND v_dlbv_cfa_hci_agents_current.ISACTIVEHEALTHCARE = 1
             INNER JOIN {{ ref('STAGE','V_DLBV_CFA_HCI_COMPENSATION_CURRENT') }} v_dlbv_cfa_hci_compensation_current
                ON v_dlbv_cfa_hci_agents_current.COMPENSATIONID = v_dlbv_cfa_hci_compensation_current.COMPENSATIONID
             WHERE ds_bvstg_ap1_transactionitem.BIATRANSACTIONOFFICE = 'HCIBP'
               AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATE(ds_bvstg_ap1_transactionitem.created) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE())))))))
             GROUP BY v_dlbv_cfa_hci_agents_current.EMPLOYEENAME,
                      v_dlbv_cfa_hci_agents_current.EMPLOYEENUMBER,
                      v_dlbv_cfa_hci_agents_current.USERROLE,
                      DATE(ds_bvstg_ap1_transactionitem.created),
                      v_dlbv_cfa_hci_compensation_current.SALE,
                      v_dlbv_cfa_hci_compensation_current.PAYMENTCOLLECTED
        name: BVSTG_HCI_PAYROLL
