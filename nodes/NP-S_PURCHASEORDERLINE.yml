        customSQL:
          customSQL: ""
        dependencies:
          - locationName: NP
            nodeName: D_BUSINESSUNIT
          - locationName: NP
            nodeName: D_SUPPLIERITEM
          - locationName: NP
            nodeName: L_JDE_F4101_ITEMMASTER
          - locationName: NP
            nodeName: I_SUPPLIERCATALOGUEQUANTITYRANGE
        join:
          joinCondition: |-
            FROM I_JDE_PURCHASEORDERLINE
              LEFT OUTER JOIN I_PG_EMPLOYEE
                ON I_JDE_PURCHASEORDERLINE.USERID = I_PG_EMPLOYEE.COMPUTERLOGIN --DML 20/9/2021 HAVE CREATED A VIEW WITH UNIQUE RECORDS TO JOIN TO INSTEAD OF THIS TABLE   --   LEFT OUTER JOIN {{ ref('NP','D_SUPPLIERITEM') }}   --   ON I_JDE_PURCHASEORDERLINE.SUPPLIERCODE = D_SUPPLIERITEM.SUPPLIERCODE   --   AND I_JDE_PURCHASEORDERLINE.SHORTITEMNUMBER = D_SUPPLIERITEM.SHORTITEMNUMBER   --   AND ISNULL(D_SUPPLIERITEM.EFFECTIVEDATE, GETDATE()-10000) <= I_JDE_PURCHASEORDERLINE.REQUESTEDDATE   --   AND ISNULL(D_SUPPLIERITEM.EXPIREDDATE, GETDATE()+10000) >= I_JDE_PURCHASEORDERLINE.REQUESTEDDATE   --   AND SUPPLIERITEMSTATUS <> 'DELETED'    --FOLLOWING JOINS MOVED FROM WORKING TABLE TO MAKE IT FASTER TO PROCESS IN THE FIN TRANS JOB.    LEFT OUTER JOIN {{ ref('NP','L_JDE_F4101_ITEMMASTER') }}  ON I_JDE_PURCHASEORDERLINE.SHORTITEMNUMBER = L_JDE_F4101_ITEMMASTER.IMITM  LEFT OUTER JOIN {{ ref('NP','I_SUPPLIERCATALOGUEQUANTITYRANGE') }}        ON I_JDE_PURCHASEORDERLINE.SUPPLIERCODE = I_SUPPLIERCATALOGUEQUANTITYRANGE.SUPPLIERCODE       AND I_JDE_PURCHASEORDERLINE.SHORTITEMNUMBER = I_SUPPLIERCATALOGUEQUANTITYRANGE.SHORTITEMNUMBER    AND  I_JDE_PURCHASEORDERLINE.PRIMARYUNITOFMEASURECODE = I_SUPPLIERCATALOGUEQUANTITYRANGE.UNITOFMEASURECODE       AND I_JDE_PURCHASEORDERLINE.POORDERDATE BETWEEN I_SUPPLIERCATALOGUEQUANTITYRANGE.EFFECTIVEDATE AND ISNULL(I_SUPPLIERCATALOGUEQUANTITYRANGE.EXPIREDDATE,'31-DEC-2999')       AND I_JDE_PURCHASEORDERLINE.ORIGINALORDERQUANTITY BETWEEN TRANSACTIONQUANTITYFROM AND TRANSACTIONQUANTITYTO      AND      I_SUPPLIERCATALOGUEQUANTITYRANGE.BUSINESSUNITCODE =      CASE       WHEN IMPPLV = 2 THEN I_JDE_PURCHASEORDERLINE.BRANCHPLANTCODE       ELSE ''      END      LEFT OUTER JOIN I_BMPLOADPERIOD      ON I_JDE_PURCHASEORDERLINE.POORDERDATE -- PO DATE         BETWEEN I_BMPLOADPERIOD.FIRSTDAYOFPERIOD AND I_BMPLOADPERIOD.LASTDAYOFPERIOD      LEFT OUTER JOIN I_PREFERREDSUPPLIER      ON I_JDE_PURCHASEORDERLINE.SHORTITEMNUMBER = I_PREFERREDSUPPLIER.ITEMNUMBER      --THIS IS NOT THE FINANCIAL BUSINESS UNIT, BUT THE BP AND PL ONES      AND I_JDE_PURCHASEORDERLINE.BRANCHPLANTCODE = I_PREFERREDSUPPLIER.BUSINESSUNITCODE      LEFT OUTER JOIN L_JDE_F0006_BUSINESSUNITMASTER    ON I_JDE_PURCHASEORDERLINE.BRANCHPLANTCODE = LTRIM(RTRIM(L_JDE_F0006_BUSINESSUNITMASTER.MCMCU))      --CONNECT TO CONVERSION TABLE TO GET PRIMARY UOM CONVERSION    LEFT JOIN I_JDE_ITEMTRANSACTIONPRIMARYUOMCONVERSIONFACTOR       ON I_JDE_ITEMTRANSACTIONPRIMARYUOMCONVERSIONFACTOR.SHORTITEMNUMBER = I_JDE_PURCHASEORDERLINE.SHORTITEMNUMBER    --  AND I_JDE_PRIMARYUNITOFMEASURE.PRIMARYUNITOFMEASURECODE = I_JDE_ITEMTRANSACTIONPRIMARYUOMCONVERSIONFACTOR.PRIMARYUNITOFMEASURECODE      AND I_JDE_PURCHASEORDERLINE.PRIMARYUNITOFMEASURECODE = I_JDE_ITEMTRANSACTIONPRIMARYUOMCONVERSIONFACTOR.PRIMARYUNITOFMEASURECODE    --  AND I_JDE_PURCHASINGUNITOFMEASURE.PURCHASINGUNITOFMEASURECODE = TRANSACTIONUNITOFMEASURECODE      AND I_JDE_PURCHASEORDERLINE.PURCHASINGUNITOFMEASURECODE = TRANSACTIONUNITOFMEASURECODE      LEFT OUTER JOIN I_JDE_PURCHASEORDERRECEIVER       ON I_JDE_PURCHASEORDERLINE.COMPANYCODE = I_JDE_PURCHASEORDERRECEIVER.COMPANYCODE     AND CONVERT(INTEGER,I_JDE_PURCHASEORDERLINE.PURCHASEORDERNUMBER) = I_JDE_PURCHASEORDERRECEIVER.PURCHASEORDERNUMBER     AND I_JDE_PURCHASEORDERLINE.PURCHASEORDERTYPECODE = I_JDE_PURCHASEORDERRECEIVER.ORDERTYPE     -- IN PREVIOUS CODE, LINE NUMBER HAS BEEN DIVIDED BY 1000, BUT THE SAME CALCULATION HAS BEEN APPLIED TO THE PO RECEIVER TABLE     AND I_JDE_PURCHASEORDERLINE.LINENUMBER * 1000 = I_JDE_PURCHASEORDERRECEIVER.PURCHASEORDERLINEID    --NEED TO JOIN TO DISTRIBUTED LINE    AND I_JDE_PURCHASEORDERLINE.DISTRIBUTIONLINENUMBER = ISNULL(I_JDE_PURCHASEORDERRECEIVER.DISTRIBUTIONLINEID, 0)
        name: S_PURCHASEORDERLINE
        noLinkRefs: []
