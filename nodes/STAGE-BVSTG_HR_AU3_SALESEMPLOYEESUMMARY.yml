    sourceMapping:
      - aliases:
          BVSTG_HR_AU2_SALESEMPLOYEESUMMARY: eae80b18-7f46-4ed1-ba84-3e97f90d51f3
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_HR_AU2_SALESEMPLOYEESUMMARY
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT e.EMPLOYEENUMBER,
                           e.companycode,
                           d.LAST_DATE_OF_MONTH AS EFFECTIVEDATE
                      FROM (
                            SELECT LAST_DAY(DATEADD(DAY, SEQ4(), '2010-01-01')) AS LAST_DATE_OF_MONTH
                              FROM TABLE(GENERATOR(ROWCOUNT => 365.25 * (YEAR(CURRENT_DATE) - 2010 + 1)))
                             WHERE LAST_DAY(DATEADD(DAY, SEQ4(), '2010-01-01')) <= LAST_DAY(DATEADD(MONTH, 1, CURRENT_DATE))
                             GROUP BY LAST_DAY(DATEADD(DAY, SEQ4(), '2010-01-01'))
                           ) AS d
                      JOIN (
                            SELECT EMPLOYEENUMBER,
                                   Companycode,
                                   MIN(EFFECTIVEDATE) AS MIN_EFFECTIVEDATE,
                                   MAX(EFFECTIVEDATE) AS MAX_EFFECTIVEDATE
                              FROM (
                                    SELECT *,
                                           POINTINTIMESTATUS AS STATUS_EOM,
                                           CASE WHEN IsNewHire = 'NewHire' THEN 'Inactive'
                                                ELSE LAG(POINTINTIMESTATUS, 1) OVER (PARTITION BY EMPLOYEENUMBER ORDER BY EFFECTIVEDATE)
                                                 END AS STATUS_BOM,
                                           lead(EFFECTIVEDATE) OVER (PARTITION BY EMPLOYEENUMBER, Companycode ORDER BY EFFECTIVEDATE) AS next_date
                                      FROM {{ ref('STAGE','BVSTG_HR_AU2_SALESEMPLOYEESUMMARY') }}
                                   )
                             GROUP BY EMPLOYEENUMBER,
                                      Companycode
                           ) AS e
                        ON d.LAST_DATE_OF_MONTH >= e.MIN_EFFECTIVEDATE
                     INNER JOIN (
                            SELECT EMPLOYEENUMBER,
                                   Companycode,
                                   STATUS_EOM
                              FROM (
                                    SELECT *,
                                           POINTINTIMESTATUS AS STATUS_EOM,
                                           CASE WHEN IsNewHire = 'NewHire' THEN 'Inactive'
                                                ELSE LAG(POINTINTIMESTATUS, 1) OVER (PARTITION BY EMPLOYEENUMBER ORDER BY EFFECTIVEDATE)
                                                 END AS STATUS_BOM,
                                           lead(EFFECTIVEDATE) OVER (PARTITION BY EMPLOYEENUMBER, Companycode ORDER BY EFFECTIVEDATE) AS next_date
                                      FROM {{ ref('STAGE','BVSTG_HR_AU2_SALESEMPLOYEESUMMARY') }}
                                   ) QUALIFY row_number() OVER (PARTITION BY employeenumber,companycode ORDER BY EFFECTIVEDATE DESC)=1
                           ) AS e1
                        ON e1.employeenumber = e.employeenumber
                       AND e1.companycode=e.companycode
                       AND e1.STATUS_EOM='Active'
                 UNION ALL SELECT e.EMPLOYEENUMBER,
                           e.companycode,
                           d.LAST_DATE_OF_MONTH AS EFFECTIVEDATE
                      FROM (
                            SELECT LAST_DAY(DATEADD(DAY, SEQ4(), '2010-01-01')) AS LAST_DATE_OF_MONTH
                              FROM TABLE(GENERATOR(ROWCOUNT => 365.25 * (YEAR(CURRENT_DATE) - 2010 + 1)))
                             WHERE LAST_DAY(DATEADD(DAY, SEQ4(), '2010-01-01')) <= LAST_DAY(DATEADD(MONTH, 1, CURRENT_DATE))
                             GROUP BY LAST_DAY(DATEADD(DAY, SEQ4(), '2010-01-01'))
                           ) d
                      JOIN (
                            SELECT EMPLOYEENUMBER,
                                   Companycode,
                                   MIN(EFFECTIVEDATE) AS MIN_EFFECTIVEDATE,
                                   MAX(EFFECTIVEDATE) AS MAX_EFFECTIVEDATE
                              FROM (
                                    SELECT *,
                                           POINTINTIMESTATUS AS STATUS_EOM,
                                           CASE WHEN IsNewHire = 'NewHire' THEN 'Inactive'
                                                ELSE LAG(POINTINTIMESTATUS, 1) OVER (PARTITION BY EMPLOYEENUMBER ORDER BY EFFECTIVEDATE)
                                                 END AS STATUS_BOM,
                                           lead(EFFECTIVEDATE) OVER (PARTITION BY EMPLOYEENUMBER, Companycode ORDER BY EFFECTIVEDATE) AS next_date
                                      FROM {{ ref('STAGE','BVSTG_HR_AU2_SALESEMPLOYEESUMMARY') }}
                                   )
                             GROUP BY EMPLOYEENUMBER,
                                      Companycode
                           ) AS e
                        ON d.LAST_DATE_OF_MONTH BETWEEN e.MIN_EFFECTIVEDATE AND e.MAX_EFFECTIVEDATE
                     INNER JOIN (
                            SELECT EMPLOYEENUMBER,
                                   Companycode,
                                   STATUS_EOM
                              FROM (
                                    SELECT *,
                                           POINTINTIMESTATUS AS STATUS_EOM,
                                           CASE WHEN IsNewHire = 'NewHire' THEN 'Inactive'
                                                ELSE LAG(POINTINTIMESTATUS, 1) OVER (PARTITION BY EMPLOYEENUMBER ORDER BY EFFECTIVEDATE)
                                                 END AS STATUS_BOM,
                                           lead(EFFECTIVEDATE) OVER (PARTITION BY EMPLOYEENUMBER, Companycode ORDER BY EFFECTIVEDATE) AS next_date
                                      FROM {{ ref('STAGE','BVSTG_HR_AU2_SALESEMPLOYEESUMMARY') }}
                                   ) QUALIFY row_number() OVER (PARTITION BY employeenumber,companycode ORDER BY EFFECTIVEDATE DESC)=1
                           ) AS e1
                        ON e1.employeenumber = e.employeenumber
                       AND e1.companycode=e.companycode
                       AND e1.STATUS_EOM='Terminated'
                   ) AS BVSTG_HR_AU1_SALESEMPLOYEESUMMARY
              LEFT JOIN (
                    SELECT *,
                           POINTINTIMESTATUS AS STATUS_EOM,
                           CASE WHEN IsNewHire = 'NewHire' THEN 'Inactive'
                                ELSE LAG(POINTINTIMESTATUS, 1) OVER (PARTITION BY EMPLOYEENUMBER ORDER BY EFFECTIVEDATE)
                                 END AS STATUS_BOM,
                           lead(EFFECTIVEDATE) OVER (PARTITION BY EMPLOYEENUMBER, Companycode ORDER BY EFFECTIVEDATE) AS next_date
                      FROM {{ ref('STAGE','BVSTG_HR_AU2_SALESEMPLOYEESUMMARY') }}
                   ) AS BVSTG_HR_AU2_SALESEMPLOYEESUMMARY
                ON BVSTG_HR_AU1_SALESEMPLOYEESUMMARY.EFF
