        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: --INCLUDE RECORDS BEFORE THE FIRST TIME THE STATUS IS 'EX' - WORK ORDER CREATED.  CASE WHEN I_ESTIMATESTATUSCHANGE_40.EFFECTIVEFROMROWNUMBER <=           (SELECT    ST.EFFECTIVEFROMROWNUMBER   FROM I_ESTIMATESTATUSCHANGE_40 AS ST   WHERE ST.ESTIMATESTATUSCODE = 'EX'   AND ST.STATUSROWNUMBER = 1   AND ST.ESTIMATEID = I_ESTIMATESTATUSCHANGE_40.ESTIMATEID)  --FIRST TIME A THE ESTIMATE IS IN A STATUS  AND I_ESTIMATESTATUSCHANGE_40.STATUSROWNUMBER = 1      THEN 1 ELSE 0 END
      - appliedColumnTests: {}
        columnReference:
          columnCounter: bb458ec1-9563-4347-bde3-51f145ff1a89
