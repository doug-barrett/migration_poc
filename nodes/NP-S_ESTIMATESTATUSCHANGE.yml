        config: {}
        dataType: INT
        defaultValue: ""
        description: Include = 1 Exclude = 0
        name: INCLUDEEXCLUDE2
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: CASE -- CHECK IF THE CURRENT ROW'S EFFECTIVEFROMROWNUMBER IS LESS THAN OR EQUAL TO THE ROW OF THE FIRST 'EX' STATUS      WHEN I_ESTIMATESTATUSCHANGE_40.EFFECTIVEFROMROWNUMBER <=           COALESCE(              -- FIND THE MINIMUM EFFECTIVEFROMROWNUMBER WHERE THE STATUS IS 'EX' FOR THE GIVEN ESTIMATEID              (SELECT MIN(ST.EFFECTIVEFROMROWNUMBER)               FROM I_ESTIMATESTATUSCHANGE_40 AS ST               WHERE ST.ESTIMATESTATUSCODE = 'EX'                 AND ST.STATUSROWNUMBER = 1                 AND ST.ESTIMATEID = I_ESTIMATESTATUSCHANGE_40.ESTIMATEID),                            -- IF NO 'EX' RECORD EXISTS, FIND THE MAXIMUM EFFECTIVEFROMROWNUMBER FOR THE ESTIMATEID TO INCLUDE ALL RECORDS              (SELECT MAX(EF.EFFECTIVEFROMROWNUMBER)               FROM I_ESTIMATESTATUSCHANGE_40 AS EF               WHERE EF.ESTIMATEID = I_ESTIMATESTATUSCHANGE_40.ESTIMATEID)          )      THEN 1  -- INCLUDE THIS RECORD IF IT IS BEFORE THE FIRST 'EX' STATUS, OR IF THERE IS NO 'EX' STATUS      ELSE 0  -- EXCLUDE THIS RECORD OTHERWISE  END
