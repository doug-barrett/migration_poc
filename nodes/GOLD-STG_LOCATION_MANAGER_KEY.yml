      dependencies:
        - locationName: GOLD
          nodeName: CDC_SYSLOCFL
      join:
        joinCondition: |-
          FROM 
           (SELECT ZLCMP AS COMPANY_CODE, 
                           ZLMGR AS MANAGER_NAME, 
                           MAX(JOURNAL_TYPE) AS JOURNAL_TYPE
            FROM     {{ ref('GOLD', 'CDC_SYSLOCFL') }} "CDC_SYSLOCFL"
            GROUP BY 1,2) AS DISTINCT_SYSLOCFL
          
          LEFT OUTER JOIN "DOUG_POC"."DP001"."LOCATION_MANAGER_KEY"
          
          ON    DISTINCT_SYSLOCFL.COMPANY_CODE = LOCATION_MANAGER_KEY.COMPANY_CODE
          AND  DISTINCT_SYSLOCFL.MANAGER_NAME= LOCATION_MANAGER_KEY.MANAGER_NAME
          -- AND  LOCATION_MANAGER.DSS_CURRENT_FLAG IN ('Y', 'P')
          
          LEFT OUTER JOIN 
          (SELECT COALESCE(MAX(MANAGER_ID),0) AS LAST_MANAGER_ID FROM "DOUG_POC"."DP001"."LOCATION_MANAGER_KEY" ) AS NEXTVALUE_MANAGER_ID
          ON 1 = 1
