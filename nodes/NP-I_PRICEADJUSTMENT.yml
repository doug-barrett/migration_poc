        join:
          joinCondition: |-
            FROM {{ ref('NP','L_JDE_F4070_PRICEADJUSTMENTSCHEDULE') }}
              FULL OUTER JOIN {{ ref('NP','I_PRICEADJDATERANGES') }}
                ON LTRIM(RTRIM(L_JDE_F4070_PRICEADJUSTMENTSCHEDULE.SNAST)) = I_PRICEADJDATERANGES.PRICEADJUSTMENTCODE
               AND DBO.NP_FUNC_JDEDATETOJULIAN(SNEXDJ) > DATEEFFECTIVE
               AND DBO.NP_FUNC_JDEDATETOJULIAN(SNEFTJ) < DATEEXPIRED
              LEFT OUTER JOIN [L_JDE_F4072_PRICEADJUSTMENTDETAIL]
                ON PRICEADJUSTMENTCODE = L_JDE_F4072_PRICEADJUSTMENTDETAIL.ADAST
               AND DBO.NP_FUNC_JDEDATETOJULIAN(ADEXDJ) > DATEEFFECTIVE
               AND DBO.NP_FUNC_JDEDATETOJULIAN(ADEFTJ) < DATEEXPIRED
              LEFT OUTER JOIN {{ ref('NP','L_JDE_F40943_ORDERGROUPKEYIDMASTERFILE') }}
                ON L_JDE_F4072_PRICEADJUSTMENTDETAIL.ADOGID = L_JDE_F40943_ORDERGROUPKEYIDMASTERFILE.OKOGID
              LEFT OUTER JOIN {{ ref('NP','I_JDE_ADJUSTMENTSCHEDULE') }}
                ON LTRIM(RTRIM(L_JDE_F4070_PRICEADJUSTMENTSCHEDULE.SNASN)) = I_JDE_ADJUSTMENTSCHEDULE.ADJUSTMENTSCHEDULECODE
              LEFT OUTER JOIN {{ ref('NP','I_JDE_ADJUSTMENTNAME') }}
                ON PRICEADJUSTMENTCODE = I_JDE_ADJUSTMENTNAME.ADJUSTMENTCODE
