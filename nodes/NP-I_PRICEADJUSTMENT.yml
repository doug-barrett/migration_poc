        name: ITEMGROUP
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN PRICEADJUSTMENTCODE= 'ESUB'                                                        THEN 'SUBCONTRACTORS'
                          WHEN (LABOURTYPECODE IS NOT NULL AND OVERTIMEFACTOR = 1) OR PRICEADJUSTMENTCODE= 'ELAB' THEN 'LABOUR'
                          WHEN (LABOURTYPECODE IS NOT NULL AND OVERTIMEFACTOR > 1) OR PRICEADJUSTMENTCODE= 'ELAB' THEN 'LABOUR (OVERTIME)'
                          WHEN I_JDE_PLANTTYPES.PLANTTYPECODE IS NOT NULL OR PRICEADJUSTMENTCODE= 'EPLT'          THEN 'PLANT'
                          WHEN PRICEADJUSTMENTCODE= 'ESUB'                                                        THEN 'SUBCONTRACTORS'
                          WHEN PRICEADJUSTMENTCODE= 'EOTH'                                                        THEN 'OTHER'
                          WHEN SHORTITEMNUMBER <> 0 OR PRICEADJUSTMENTCODE= 'EMAT'                                THEN 'MATERIALS'
                          WHEN SHORTITEMNUMBER = 0 OR PRICEADJUSTMENTCODE= 'EMAT'                                 THEN 'MATERIALS'
                          ELSE 'MATERIALS'
                           END
