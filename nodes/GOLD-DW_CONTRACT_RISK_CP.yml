        joinCondition: '-- FROM CP_DBCP1 (source node not generated)

          LEFT JOIN {{ ref(''BRONZE'', ''DW_CONTRACT'') }} dw_contract ON /* TODO join key (Joiner) */ 1=1

          LEFT JOIN {{ ref(''SILVER'', ''CP_DPCP1'') }} cp_dpcp1 ON /* TODO join key (Joiner) */ 1=1

          LEFT JOIN {{ ref(''SILVER'', ''CP_DPCP2'') }} cp_dpcp2 ON /* TODO join key (Joiner) */ 1=1

          LEFT JOIN {{ ref(''SILVER'', ''CP_DPCP3'') }} cp_dpcp3 ON /* TODO join key (Joiner) */ 1=1

          LEFT JOIN {{ ref(''BRONZE'', ''YD_DEIREF'') }} yd_deiref ON /* TODO join key (Joiner) */ 1=1

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PARTY'') }} dw_party ON dw_party.PARTY_ID = cp_dbcp1.REF_BI_ID

          LEFT JOIN {{ ref(''BRONZE'', ''DWSA_FREQ_CONVERT'') }} dwsa_freq_convert ON dwsa_freq_convert.SOURCE_SYSTEM_CODE = cp_dbcp1.FREQ_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_STATE'') }} ref360_state ON ref360_state.CODE = cp_dbcp1.BC1_SDUTY_STATE_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT_OPTION'') }} dw_product_option ON dw_product_option.PRODUCT_KEY = cp_dbcp1.PRODUCT_KEY AND dw_product_option.PRODUCT_OPTION_CODE = cp_dbcp1.BC1_PLAN_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''CLOSE_TYPE'') }} close_type ON close_type.CLOSE_TYPE_CODE = cp_dbcp1.BC1_COVERAGE_STATUS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''IMPAIRMENT'') }} impairment ON impairment.PRODUCT_SYSTEM_CODE = cp_dbcp1.BC1_IMPAIRMENT_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''SMOKER_STATUS_CONVERT'') }} smoker_status_convert ON smoker_status_convert.SOURCE_SYSTEM_CODE = cp_dbcp1.BC1_SMOKER_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''ASSESS_CONVERT'') }} assess_convert ON assess_convert.SOURCE_SYSTEM_CODE = cp_dbcp1.TC1_PERM_ASSESS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_ASSESS'') }} dw_assess ON dw_assess.CODE = cp_dbcp1.AC_ASSESS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_OCUPTN_CLASS'') }} dw_ocuptn_class ON dw_ocuptn_class.CODE = cp_dbcp1.BC1_OCCUPATION_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''STATUS_CONVERT'') }} status_convert ON status_convert.SOURCE_SYSTEM_CODE = cp_dbcp1.BC1_COVERAGE_STATUS_CODE'
