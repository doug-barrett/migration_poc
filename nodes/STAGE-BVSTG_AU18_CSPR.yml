    sourceMapping:
      - aliases:
          BVSTG_AU17_CSPR: 31ff003c-2060-46b5-ab98-a320299dc6f0
          V_DLBV_OSM_RELATIONSHIP_CURRENT: d0ff5487-0256-482e-8f8b-eb1718384786
          V_DLBV_OSM_MEMBER_CURRENT: dd70a2ba-0013-4f94-96ba-482a4e6cd1d3
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU17_CSPR
          - locationName: STAGE
            nodeName: V_DLBV_OSM_RELATIONSHIP_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_OSM_MEMBER_CURRENT
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT *,
                   CASE WHEN lower(CHILD_DESC) like 'national%telesale%' THEN 'NTS'
                        WHEN length(SPLIT_PART(CHILD_NAME,'_',0))=2      THEN (SPLIT_PART(CHILD_NAME,'_',0))
                        WHEN SPLIT_PART(CHILD_NAME,'_',0)='TEX'          THEN 'TX'
                        WHEN SPLIT_PART(CHILD_NAME,'_',0)='MASS'         THEN 'MA'
                        WHEN SPLIT_PART(CHILD_NAME,'_',0)='ExpLink'      THEN 'ExpLk'
                        WHEN SPLIT_PART(CHILD_NAME,'_',0)='OLB'          THEN 'OLB'
                        WHEN STATENAME IS NOT NULL                       THEN STATEABBREV
                        WHEN P1_STATENAME IS NOT NULL                    THEN P1_STATEABBREV
                        WHEN P2_STATENAME IS NOT NULL                    THEN P2_STATEABBREV
                        WHEN P3_STATENAME IS NOT NULL                    THEN P3_STATEABBREV
                        WHEN P4_STATENAME IS NOT NULL                    THEN P4_STATEABBREV
                        WHEN SPLIT_PART(p1_NAME,'_',0)='TEX'             THEN 'TX'
                        WHEN SPLIT_PART(p2_NAME,'_',0)='TEX'             THEN 'TX'
                        WHEN SPLIT_PART(p3_NAME,'_',0)='TEX'             THEN 'TX'
                        WHEN SPLIT_PART(p4_NAME,'_',0)='TEX'             THEN 'TX'
                        WHEN SPLIT_PART(p5_NAME,'_',0)='TEX'             THEN 'TX'
                        WHEN SPLIT_PART(P1_NAME,'_',0)='TEX'             THEN 'TX'
                        WHEN length(SPLIT_PART(CHILD_DESC,' ',0))=2      THEN SPLIT_PART(CHILD_DESC,' ',0)
                        WHEN length(SPLIT_PART(p1_NAME,'_',0))=2         THEN (SPLIT_PART(p1_NAME,'_',0))
                        WHEN length(SPLIT_PART(p2_NAME,'_',0))=2         THEN (SPLIT_PART(p2_NAME,'_',0))
                        WHEN length(SPLIT_PART(p3_NAME,'_',0))=2         THEN (SPLIT_PART(p3_NAME,'_',0))
                        WHEN length(SPLIT_PART(p4_NAME,'_',0))=2         THEN (SPLIT_PART(p4_NAME,'_',0))
                        WHEN length(SPLIT_PART(p5_NAME,'_',0))=2         THEN (SPLIT_PART(p5_NAME,'_',0))
                        ELSE NULL
                         END state,
                   CASE WHEN SPLIT_PART(CHILD_NAME,'_',0)='ExpLink'  THEN 'ExpLk'
                        WHEN contains(CHILD_name,'NSA')              THEN 'NSA'
                        WHEN contains(CHILD_name,'STD')              THEN 'SPLC'
                        WHEN lower(CHILD_desc) like '%non%standard%' THEN 'NSA'
                        WHEN lower(CHILD_desc) like '%standard%'     THEN 'SPLC'
                        WHEN contains(p1_name,'NSA')                 THEN 'NSA'
                        WHEN contains(p1_name,'CIGH')                THEN 'NSA'
                        WHEN contains(p1_name,'STD')                 THEN 'SPLC'
                        WHEN lower(p1_desc) like '%non%standard%'    THEN 'NSA'
                        WHEN lower(p1_desc) like '%standard%'        THEN 'SPLC'
                        WHEN contains(p2_name,'NSA')                 THEN 'NSA'
                        WHEN contains(p2_name,'STD')                 THEN 'SPLC'
                        WHEN lower(p2_desc) like '%non%standard%'    THEN 'NSA'
                        WHEN lower(p2_desc) like '%standard%'        THEN 'SPLC'
                        WHEN contains(p3_name,'NSA')                 THEN 'NSA'
                        WHEN contains(p3_name,'STD')                 THEN 'SPLC'
                        WHEN lower(p3_desc) like '%non%standard%'    THEN 'NSA'
                        WHEN lower(p3_desc) like '%standard%'        THEN 'SPLC'
                        WHEN contains(p4_name,'NSA')                 THEN 'NSA'
                        WHEN contains(p4_name,'STD')                 THEN 'SPLC'
                        WHEN lower(p4_desc) like '%non%standard%'    THEN 'NSA'
                        WHEN lower(p4_desc) like '%standard%'        THEN 'SPLC'
                        WHEN contains(p5_name,'NSA')                 THEN 'NSA'
                        WHEN contains(p5_name,'STD')                 THEN 'SPLC'
                        WHEN lower(p5_desc) like '%non%standard%'    THEN 'NSA'
                        WHEN lower(p5_desc) like '%standard%'        THEN 'SPLC'
                        WHEN contains(p2_desc,'STD')                 THEN 'SPLC'
                        ELSE NULL
                         END Channel
              FROM (SELECT bvstg_au17_cspr.*,
                   v_dlbv_osm_relationship_current.p5_id,
                   v_dlbv_osm_relationship_current.p5_Desc,
                   v_dlbv_osm_relationship_current.P5_name
              FROM (
                    SELECT *
                      FROM {{ ref('STAGE','BVSTG_AU17_CSPR') }}
                   ) bvstg_au17_cspr
              LEFT JOIN (
                    SELECT T1.p4_id,
                           M1.name p4_name,
                           M1.description p4_Desc,
                           T1.p5_id,
                           M0.description p5_Desc,
                           M0.name P5_name
                      FROM (
                            SELECT DISTINCT childid p4_id,
                                   parentid p5_id
                              FROM {{ ref('STAGE','V_DLBV_OSM_RELATIONSHIP_CURRENT') }}
                             WHERE childid IN (
                                    SELECT DISTINCT p4_id
                                      FROM {{ ref('STAGE','BVSTG_AU17_CSPR') }}
                                   )
                           )T1
