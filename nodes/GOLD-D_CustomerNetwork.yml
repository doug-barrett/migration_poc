      config: {}
      dataType: VARCHAR(200)
      description: This attribute holds the name of Networks for which we can calculate
        TRIFR. All other Networks are grouped into "Other".  In order to do this,
        we need to record both employee and contractor hours by this Network. Currently
        we can only do this for Northpower Network, Northpower Fibre, Vector, Wellington
        Electricity and Transpower.
      name: TRIFRNetworks
      nullable: false
      sourceColumnReferences:
      - columnReferences: []
        transform: -- NETWORKS OF INTEREST  CASE WHEN I_NPS_CUSTOMERNETWORK.CUSTOMERNETWORKCODE
          IN (17,20,21,23,27)  -- 17 VECTOR, 20 TRANSPOWER, 21 NORTHPOWER NETWORK,
          23 WELLINGTON ELECTRICITY, 27 NORTHPOWER FIBRE   THEN      I_NPS_CUSTOMERNETWORK.CUSTOMERNETWORK   --
          REPORT THE DESCRIPTION AS OTHER IF NOT ONE OF THE ONES WE CAN CALCULATE
          THE TRIFR FOR   ELSE 'OTHER'  END
