        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_S_AMS_COVERAGE_MROC_CURRENT') }} COMMENT='Template version:1.0.1' (hk_h_coverage, polid, lobid, coverageid, effdate, status, expdate, sortno, attachid, attachtype, coveragecode, iscoverage, isblanket, parentcovid, fulltermprem, formno, formdate, limit1, limit2, limit3, deduct1, deduct2, deduct3, deducttype1, deducttype2, deducttype3, sloboption1, sloboption2, netchange, coinpercent, appliesto, isstatutory, modtype, numof, insertseqno, descrcov, typeofcode, step, changedby, changeddate, entereddate, dss_change_hash, dss_record_source, dss_load_date, dss_start_date, dss_version, dss_create_time) AS SELECT S_AMS_COVERAGE.HK_H_COVERAGE,
                   h_coverage.POLID,
                   h_coverage.LOBID,
                   h_coverage.COVERAGEID,
                   h_coverage.EFFDATE,
                   S_AMS_COVERAGE.STATUS,
                   S_AMS_COVERAGE.EXPDATE,
                   S_AMS_COVERAGE.SORTNO,
                   S_AMS_COVERAGE.ATTACHID,
                   S_AMS_COVERAGE.ATTACHTYPE,
                   S_AMS_COVERAGE.COVERAGECODE,
                   S_AMS_COVERAGE.ISCOVERAGE,
                   S_AMS_COVERAGE.ISBLANKET,
                   S_AMS_COVERAGE.PARENTCOVID,
                   S_AMS_COVERAGE.FULLTERMPREM,
                   S_AMS_COVERAGE.FORMNO,
                   S_AMS_COVERAGE.FORMDATE,
                   S_AMS_COVERAGE.LIMIT1,
                   S_AMS_COVERAGE.LIMIT2,
                   S_AMS_COVERAGE.LIMIT3,
                   S_AMS_COVERAGE.DEDUCT1,
                   S_AMS_COVERAGE.DEDUCT2,
                   S_AMS_COVERAGE.DEDUCT3,
                   S_AMS_COVERAGE.DEDUCTTYPE1,
                   S_AMS_COVERAGE.DEDUCTTYPE2,
                   S_AMS_COVERAGE.DEDUCTTYPE3,
                   S_AMS_COVERAGE.SLOBOPTION1,
                   S_AMS_COVERAGE.SLOBOPTION2,
                   S_AMS_COVERAGE.NETCHANGE,
                   S_AMS_COVERAGE.COINPERCENT,
                   S_AMS_COVERAGE.APPLIESTO,
                   S_AMS_COVERAGE.ISSTATUTORY,
                   S_AMS_COVERAGE.MODTYPE,
                   S_AMS_COVERAGE.NUMOF,
                   S_AMS_COVERAGE.INSERTSEQNO,
                   S_AMS_COVERAGE.DESCRCOV,
                   S_AMS_COVERAGE.TYPEOFCODE,
                   S_AMS_COVERAGE.STEP,
                   S_AMS_COVERAGE.CHANGEDBY,
                   S_AMS_COVERAGE.CHANGEDDATE,
                   S_AMS_COVERAGE.ENTEREDDATE,
                   S_AMS_COVERAGE.DSS_CHANGE_HASH,
                   S_AMS_COVERAGE.DSS_RECORD_SOURCE,
                   S_AMS_COVERAGE.DSS_LOAD_DATE,
                   S_AMS_COVERAGE.DSS_START_DATE,
                   S_AMS_COVERAGE.DSS_VERSION,
                   S_AMS_COVERAGE.DSS_CREATE_TIME
              FROM {{ ref('DATA_VAULT','S_AMS_COVERAGE') }} AS s_ams_coverage
             INNER JOIN (
                    SELECT hk_h_coverage,
                           dss_start_date,
                           LEAD(dss_start_date, 1) OVER (PARTITION BY hk_h_coverage ORDER BY dss_start_date) AS last_start_date
                      FROM {{ ref('DATA_VAULT','S_AMS_COVERAGE') }}
                   ) sub
                ON s_ams_coverage.hk_h_coverage = sub.hk_h_coverage
               AND s_ams_coverage.dss_start_date = sub.dss_start_date
             INNER JOIN {{ ref('DATA_VAULT','H_COVERAGE') }} h_coverage
                ON h_coverage.hk_h_coverage = s_ams_coverage.hk_h_coverage
             WHERE sub.last_start_date IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY s_ams_coverage.hk_h_coverage ORDER BY s_ams_coverage.dss_start_date) = 1
