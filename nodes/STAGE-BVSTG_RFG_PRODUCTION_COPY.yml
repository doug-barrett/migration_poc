    enabledColumnTestIDs: []
    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_AGENT_SESSION
          - locationName: STAGE
            nodeName: V_DLBV_TRES_USERSHIERARCHYHISTORY_CURRENT
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT IFNULL(V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.EMPLOYEENUMBER,ALVARIA_ADHERENCE.EMP_ID) EMPLOYEENUMBER,
                           IFNULL(V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.date,ALVARIA_ADHERENCE.NOM_DATE) DATE , NULL SKILLGROUPTARGETNAME,
                           NULL calls_handled,
                           NULL totaltalktime,
                           NULL totalHandleTime,
                           V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.PaidTime,
                           V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.ProductiveTime,
                           V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.NotReadyTime,
                           ALVARIA_ADHERENCE.time_in_adh,
                           ALVARIA_ADHERENCE.tim_out_of_adh
                      FROM(
                            SELECT EMPLOYEENUMBER,
                                   s.date,
                                   sum(S.PaidTime) PaidTime,
                                   sum(S.ProductiveTime) ProductiveTime ,
                                   sum(S.NotReadyTime) NotReadyTime
                              FROM (
                                    SELECT DS_AGENT_KEY.EMPLOYEENUMBER,
                                           DATE(V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.datetime) Date , SUM(CASE WHEN V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.event = 2 THEN (DATEDIFF(MINUTE,LOGINDATETIME, DATETIME)/60) ELSE 0 END) PaidTime,
                                           SUM(CASE WHEN V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.event = 2 THEN (DATEDIFF(MINUTE,LOGINDATETIME, DATETIME)/60) ELSE 0 END) -SUM(CASE WHEN V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.event = 3 THEN Duration ELSE 0 END / 3600.0) AS ProductiveTime,
                                           SUM(CASE WHEN V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.event = 3 THEN Duration ELSE 0 END / 3600.0) AS NotReadyTime
                                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_AGENT_EVENT_DETAIL_CURRENT V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT
                                     INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_REASON_CODE_CURRENT V_DL_PCCE_REASON_CODE_CURRENT
                                        ON V_DL_PCCE_REASON_CODE_CURRENT.reasoncode = V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.reasoncode
                                      LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AGENT_KEY DS_AGENT_KEY
                                        ON V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.SkillTargetID = DS_AGENT_KEY.cisco_skilltargetid
                                     GROUP BY DS_AGENT_KEY.EMPLOYEENUMBER,
                                              DATE(V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.datetime)
                                   ) s
                             GROUP BY EMPLOYEENUMBER,
                                      s.date
                           )V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT
                      FULL JOIN (
                            SELECT EMP_ID,
                                   NOM_DATE,
                                   SUM(IN_ADH_DURATION) time_in_adh,
                                   SUM(OUT_ADH_SCHED) tim_out_of_adh
                              FROM DATA_ANALYTICS.WFM_WORKSPACE.ALVARIA_ADHERENCE
                             GROUP BY EMP_ID,
                                      NOM_DATE
                           )ALVARIA_ADHERENCE
                        ON V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.EMPLOYEENUMBER = ALVARIA_ADHERENCE.EMP_ID
                       AND V_DL_PCCE_AGENT_EVENT_DETAIL_CURRENT.Date = ALVARIA_ADHERENCE.NOM_DATE
                     UNION SELECT DS_AGENT_KEY.EMPLOYEENUMBER,
                           DATE(DS_PCCE_TERMINATION_CALL_AGENT_SESSION.STARTDATETIME) date , DS_PCCE_TERMINATION_CALL_AGENT_SESSION.SKILLGROUPTARGETNAME,
                           SUM(DS_PCCE_TERMINATION_CALL_AGENT_SESSION.ISANSWERCALL) calls_handled,
                           SUM(DS_PCCE_TERMINATION_CALL_AGENT_SESSION.TALKTIME) totaltalktime,
                           SUM(TALKTIME+HOLDTIME+WORKTIME) totalHandleTime,
                           NULL PaidTime,
                           NULL ProductiveTime,
                           NULL NotReadyTime,
                           NULL time_in_adh,
                           NULL tim_out_of_adh
                      FROM RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_AGENT_SESSION DS_PCCE_TERMINATION_CALL_AGENT_SESSION
                      LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AGENT_KEY DS_AGENT_KEY
                        ON DS_PCCE_TERMINATION_CALL_AGENT_SESSION.AGENTSKILLTARGETID = DS_AGENT_KEY.cisco_skilltargetid
                     WHERE DS_PCCE_TERMINATION_CALL_AGENT_SESSION.ISINBOUND = 1
                       AND DS_PCCE_TERMINATION_CALL_AGENT_SESSION.ISINTERNALCALL = 0
                     GROUP BY DATE(DS_PCCE_TERMINATION_CALL_AGENT_SESSION.STARTDATETIME) ,
                              DS_PCCE_TERMINATION_CALL_AGENT_SESSION.SKILLGROUPTARGETNAME,
                              DS_AGENT_KEY.EMPLOYEENUMBER
                   )DS_PCCE_TERMINATION_CALL_AGENT_SESSION
              LEFT JOIN ( SELECT V_DLBV_TRES_USERSHIERARCHYHISTORY_CURRENT.EmployeeNumber,
                   V_DLBV_TRES_USERSHIERARCHYHISTORY_CURRENT.HireDate ,
                   V_DLBV_TRES_USERSHIERARCHYHISTORY_CURRENT.FullName,
                   V_DLBV_TRES_USERSHIERARCHYHISTORY_CURRENT.SUPERVISORID,
                   V_S_BOE_TJ_EMPLOYEE_CURRENT_S.FullName SUPERVISOR,
                   V_DLBV_TRES_USERSHIERARCHYHISTORY_CURRENT.MANAGERID,
                   V_S_BOE_TJ_EMPLOYEE_CURRENT_M.FullName MANAGER,
                   V_DLBV_TRES_USERSHIERARCHYHISTORY_CURRENT.DIRECTORID,
                   V_S_BOE_TJ_EMPLOYEE_CURRENT_D.FullName DIRECTOR,
                   V_DLBV_TRES_USERSHIERARCHYHISTORY_CURRENT.OFFICEID,
                   V_DLBV_TRES_OFFICE_CURRENT.OFFICENAME OFFICE,
                   ADM_OFFICE_TYPE.OFFICETYPE,
                   V_DLBV_TRES_USERSHIERARCHYHISTORY_CURRENT.DEPARTMENTID,
                   V_DLBV_TRES_DEPARTMENT_CURRENT.DEPA
        name: SRC_bvstg_rfg_production_copy_1
        noLinkRefs: []
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT V_DLBV_PCCE_ROUTER_QUEUE_INTERVAL_CURRENT.STARTDATE DATE, V_DLBV_PCCE_ROUTER_QUEUE_INTERVAL_CURRENT.Level5,
                   V_DLBV_TRES_OFFICE_CURRENT.OfficeID,
                   STAGE_DATE_SF.CAL_YEAR,
                   STAGE_DATE_SF.cal_week_in_year,
                   DATE_TRUNC('week', DATE(V_DLBV_PCCE_ROUTER_QUEUE_INTERVAL_CURRENT.STARTDATE)) week_start ,
                   SUM(QUEUE_CALLS) CALLSHANDLED,
                   SUM(CALLWAIT_TIME) SERVICELEVELCALLS,
                   SUM(TotalAbandon) CALLSABANACD,
                   SUM(ANSWERWAITTIME) ANSWERWAITTIME ,
                   SUM(totalHandleTime)totalHandleTime
              FROM (
                    SELECT *
                      FROM(
                            SELECT Cast(S.DateTime AS Date) AS STARTDATE,
                                   DS_PCCE_SKILL_PQUEUE_MAPPING.Level5,
                                   DS_PCCE_SKILL_PQUEUE_MAPPING.Level3,
                                   SUM(R.CallsHandled) + SUM(IFNULL(R.CallsAbandQ, 0)) + SUM(IFNULL(R.CallsAbandToAgent, 0)) AS QUEUE_CALLS,
                                   SUM(IFNULL(R.ServiceLevelCalls, 0)) AS CALLWAIT_TIME,
                                   SUM(S.AWT) AS AnswerWaitTime,
                                   SUM(IFNULL(R.CallsAbandQ, 0)) + SUM(IFNULL(R.CallsAbandToAgent, 0)) AS TotalAbandon,
                                   SUM(S.HCT) AS totalHandleTime
                              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_ROUTER_QUEUE_INTERVAL_CURRENT R
                             INNER JOIN (
                                    SELECT PrecisionQueueID,
                                           DateTime,
                                           SUM(IFNULL(HandledCallsTime, 0)) AS HCT,
                                           SUM(IFNULL(AnswerWaitTime, 0)) AS AWT
                                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_SKILL_GROUP_INTERVAL_CURRENT
                                     GROUP BY PrecisionQueueID,
                                              DateTime
                                   ) S
                                ON R.DateTime = S.DateTime
                             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_PRECISION_QUEUE_CURRENT PQ
                                ON PQ.PrecisionQueueID = S.PrecisionQueueID
                               AND PQ.PrecisionQueueID = R.PrecisionQueueID
                             INNER JOIN (
                                    SELECT DISTINCT LEVEL5,
                                           LEVEL3
                                      FROM RETAIL_DEV.SCH_EDW.DS_PCCE_SKILL_PQUEUE_MAPPING
                                     WHERE LEVEL1 = 'TJSSC'
                                   ) DS_PCCE_SKILL_PQUEUE_MAPPING
                                ON DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL5 = PQ.EnterpriseName
                             WHERE (R.CallsHandled + R.CallsAbandQ + R.CallsAbandToAgent + R.ServiceLevelCalls) <> 0
                             GROUP BY DS_PCCE_SKILL_PQUEUE_MAPPING.Level5,
                                      Cast(S.DateTime AS Date),
                                      DS_PCCE_SKILL_PQUEUE_MAPPING.Level3
                             UNION SELECT CAST(Sgi.DateTime AS date) AS STARTDATE,
                                   DS_PCCE_SKILL_PQUEUE_MAPPING.Level5,
                                   DS_PCCE_SKILL_PQUEUE_MAPPING.Level3,
                                   SUM(SGI.CallsHandled) + SUM(SGI.RouterCallsAbandQ) + SUM(SGI.RouterCallsAbandToAgent) AS QUEUE_CALLS,
                                   SUM(SGI.ServiceLevelCalls) AS SVCLVLANSWERED_CALLS,
                                   SUM(SGI.AnswerWaitTime) AS CALLWAIT_TIME,
                                   SUM(SGI.RouterCallsAbandQ) + SUM(SGI.RouterCallsAbandToAgent) AS TotalAbandon,
                                   SUM(SGI.HandledCallsTime) AS totalHandleTime
                              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_SKILL_GROUP_INTERVAL_CURRENT SGI
                             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_SKILL_GROUP_CURRENT SG
                                ON SGI.SkillTargetID = SG.SkillTargetID
                             INNER JOIN (
                                    SELECT DISTINCT LEVEL5,
                                           LEVEL3
                                      FROM RETAIL_DEV.SCH_EDW.DS_PCCE_SKILL_PQUEUE_MAPPING
                                     WHERE LEVEL1 = 'TJSSC'
                                   ) DS_PCCE_SKILL_PQUEUE_MAPPING
                                ON DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL5 = SG.EnterpriseName
                             WHERE (SGI.CallsHandled+SGI.RouterCallsAbandQ+SGI.RouterCallsAbandToAgent+SGI.ServiceLevelCalls)<>0
                             GROUP BY CAST(Sgi.DateTime AS date),
                                      DS_PCCE_SKILL_PQUEUE_MAPPING.Level5,
                                      DS_PCCE_SKILL_PQUEUE_MAPPING.Level3
                           )a QUALIFY ROW_NUMBER() OVER (PARTITION BY a.STARTDATE,a.Level5 ORDER BY a.STARTDATE,a.Level5)=1
                   )V_DLBV_PCCE_ROUTER_QUEUE_INTERVAL_CURRENT
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_TRES_OFFICE_CURRENT V_DLBV_TRES_OFFICE_CURRENT
                ON V_DLBV_PCCE_ROUTER_QUEUE_INTERVAL_CURRENT.Level3 = V_DLBV_TRES_OFFICE_CURRENT.officename
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.STAGE_DATE_SF STAGE_DATE_SF
                ON DATE(STAGE_DATE_SF.calendar_date) = DATE(V_DLBV_PCCE_ROUTER_QUEUE_INTERVAL_CURRENT.STARTDATE)
             GROUP BY V_DLBV_PCCE_ROUTER_QUEUE_INTERVAL_CURRENT.STARTDATE,
                      V_DLBV_PCCE_ROUTER_QUEUE_INTE
        name: SRC_bvstg_rfg_production_copy_2
        noLinkRefs: []
