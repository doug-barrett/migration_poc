        join:
          joinCondition: |-
            FROM (
                    SELECT *
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT
                     WHERE POLICYSTATUSDATE >= DATEADD(DAY,-10,CURRENT_DATE())
                       AND ((SYSTEMNAME = 'C81') OR (SYSTEMNAME = 'C64' AND CURRENT_DATE()>= '2025-07-14') OR (SYSTEMNAME = 'C49' AND CURRENT_DATE()>= '2025-07-21') OR (SYSTEMNAME like '%Stonewood%' AND CURRENT_DATE()>= '2025-07-28') OR (SYSTEMNAME = '%Aggr%' AND CURRENT_DATE()>= '2025-08-04')) QUALIFY ROW_NUMBER() OVER (PARTITION BY V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.POLICY_ID ORDER BY POLICYSTATUSDATE DESC)=1
                   ) V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_MKT_TIMEZONES_STATE V_DLBV_MKT_TIMEZONES_STATE
                ON V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.STATE = V_DLBV_MKT_TIMEZONES_STATE.StateCode
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_MKT_TIMEZONES V_DLBV_MKT_TIMEZONES
                ON V_DLBV_MKT_TIMEZONES.TIMEZONENAME = V_DLBV_MKT_TIMEZONES_STATE.TIMEZONE
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_DIALER_BLUE_FIRE ds_dialer_blue_fire
                ON ds_dialer_blue_fire.id = MD5(V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.PRIMARYKEY || V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.POLICYSTATUSDATE)
             WHERE V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.POLICYSTATUS = 'Cancelled'
               AND ds_dialer_blue_fire.ID IS NULL
        name: SRC_bvstg_dialer_blue_fire_1_insert
        noLinkRefs: []
      - aliases:
          DS_DIALER_BLUE_FIRE: 0e6c30e0-6944-4766-b95b-c7d961c5eb93
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_DIALER_BLUE_FIRE
        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('EDW','DS_DIALER_BLUE_FIRE') }} ds_dialer_blue_fire
             INNER JOIN( SELECT DS_DIALER_BLUE_FIRE.ID,
                   CASE WHEN V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.POLICYSTATUS = 'Reinstated' THEN 1
                        ELSE 0
                         END isSave,
                   CASE WHEN V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.POLICYSTATUS = 'Reinstated' THEN DATE(V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.POLICYSTATUSDATE)
                        ELSE NULL
                         END SaveDate,
                   CASE WHEN V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.POLICYSTATUS = 'Reinstated' THEN CURRENT_DATE()
                        ELSE NULL
                         END Activity_SAVE_DATE,
                   IFNULL(IFNULL(Dialer_Max_Talktime_C,Dialer_Max_Talktime_H),0) Dialer_Max_Talktime,
                   IFNULL(CELLPHONE.CONTACTS_C,HOMEPHONE.CONTACTS_H) Dialer_Contact_days_m,
                   IFNULL(IFNULL(CELLPHONE.CALLS_C,HOMEPHONE.CALLS_H),0) CALLS,
                   IFNULL(IFNULL(CELLPHONE.CONVERSATION_C,HOMEPHONE.CONVERSATION_H),0) CONVERSATION,
                   V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.POLICYSTATUS,
                   DATE(DS_DIALER_BLUE_FIRE.POLICYSTATUSDATE)POLICYSTATUSDATE,
                   CASE WHEN CONVERSATION = 0 AND IFNULL(Dialer_Contact_days_m,0) < 3 AND isSave = 0 AND DATE(DS_DIALER_BLUE_FIRE.POLICYSTATUSDATE) >= DATEADD(DAY,-10,CURRENT_DATE()) AND V_DLBV_IA_REINSTATEMENTCALLQUEUE_CURRENT.POLICYSTATUS = 'Cancelled' THEN 1
                        ELSE 0
                         END isDIALER,
                   IFNULL(IFNULL(BAA_DL_5052_5052_C.First_Dialer_Uploaded,BAA_DL_5052_5052_H.First_Dialer_Uploaded),DS_DIALER_BLUE_FIRE.First_Dialer_Uploaded) First_Dialer_Uploaded,
                   IFNULL(IFNULL(BAA_DL_5052_5052_C.Last_Dialer_Uploaded,BAA_DL_5052_5052_H.Last_Dialer_Uploaded),DS_DIALER_BLUE_FIRE.Last_Dialer_Uploaded) Last_Dialer_Uploaded,
                   IFNULL(IFNULL(BAA_DL_5052_5052_C.Dialer_Uploaded,BAA_DL_5052_5052_H.Dialer_Uploaded),DS_DIALER_BLUE_FIRE.Dialer_Uploaded) Dialer_Uploaded,
                   CONVERSATION = 0,
                   IFNULL(Dialer_Contact_days_m,0) < 3,
                   isSave = 0,
