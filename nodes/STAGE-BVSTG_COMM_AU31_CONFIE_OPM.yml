        dependencies:
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT ifnull(ds_retail_office.OFFICECODE, ds_ram_retail_repository_2.OfficeCode) OfficeCode,
                           (CASE WHEN lower(ds_ram_retail_repository_2.sourcedb)='splc' THEN 'SPLC' WHEN lower(ds_ram_retail_repository_2.sourcedb) IN ('cigh','appone','nsa','dnsa') THEN 'NSA' ELSE 'Missing/Total' END) sourcedb,
                           ifnull(StoreOpenDate_RR, OfficeOpenedDate) StoreOpenDate,
                           CASE WHEN LocationSTatus like 'Closed%'         THEN 'Closed'
                                WHEN LocationStatus IN ('Open', 'Pending') THEN 'Open'
                                WHEN LocationStatus = 'Dark'               THEN 'Dark'
                                 END AS LocationStatus,
                           CASE WHEN lower(officestatusdetail) = 'acquisition' THEN officestatusdetail
                                ELSE 'Organic'
                                 END AS officestatusdetail,
                           officetype,
                           statecode
                      FROM (
                            SELECT DISTINCT OfficeCode,
                                   min(to_date(createddate)) StoreOpenDate_RR,
                                   sourcedb
                              FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                             WHERE counter =1
                             GROUP BY officecode,
                                      sourcedb
                           ) ds_ram_retail_repository_2
                      FULL JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                        ON ds_ram_retail_repository_2.officecode = ds_retail_office.officecode
                     WHERE lower(LocationStatus) = 'open'
                       AND StoreOpenDate >= '2019-01-01'
                       AND StoreOpenDate < current_date()
                   )ds_ram_retail_repository
