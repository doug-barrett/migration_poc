            transform: CASE --IF JUST A NUMBER, ASSUME THIS IS THE WORK ORDER NUMBER   --IT MUST ALSO BE SMALL ENOUGH TO FIT IN AN INTEGER FIELD   WHEN ISNUMERIC(JOBNUMBER) = 1 AND LEN(JOBNUMBER) < 10    THEN REPLACE(CONVERT(VARCHAR(100),JOBNUMBER),'.','')   -- IF PREFIXED WITH THE WORK ORDER TYPE, STRIP IT AND USE AS THE WORK ORDER NUMBER   WHEN LEFT(CONVERT(VARCHAR(100),JOBNUMBER),2) IN ('TC','TA','TF','WF')   AND ISNUMERIC(RIGHT(CONVERT(VARCHAR(100),JOBNUMBER),LEN(CONVERT(VARCHAR(100),JOBNUMBER))-2)) = 1    THEN REPLACE(RIGHT(CONVERT(VARCHAR(100),JOBNUMBER),LEN(CONVERT(VARCHAR(100),JOBNUMBER))-2),'.','')   -- ELSE TRY TO CONNECT TO THE WORK ORDER DIMENSION USING THE JOB NUMBER AS A REFERENCE FIELD   ELSE (SELECT MAX(CONVERT(VARCHAR(100),WORKORDERNUMBER)) FROM D_WORKORDER WHERE CONVERT(VARCHAR(100),JOBNUMBER) = D_WORKORDER.REFERENCENUMBER) END
