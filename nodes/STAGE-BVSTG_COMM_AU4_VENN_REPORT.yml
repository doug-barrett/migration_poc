        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_COMM_AU3_VENN_REPORT') }} bvstg_comm_au3_venn_report
              LEFT JOIN (SELECT DISTINCT policynumberformatted,
                   carrier,
                   startdate_cdt,
                   enddate_cdt,
                   LAST_TXN_DATE_CDT, --listed out columns         LAST_TXN_CDT, ispolicyinedw, ispolicyincdt     --from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU3_MASTER_POLICY_EXTRACT"          --replaced with AU3 master policy table     FROM {{ ref('STAGE','BVSTG_COMM_AU3_MASTER_POLICY_EXTRACT') }}     qualify row_number() over (partition by policynumberformatted,carrier order by asofmonth desc)=1     ) BVSTG_COMM_AU2_EOM_EXTRACT_ALLSOURCES    on bvstg_comm_au3_venn_report.policynumberformatted = BVSTG_COMM_AU2_EOM_EXTRACT_ALLSOURCES.policynumberformatted   and bvstg_comm_au3_venn_report.carrier = BVSTG_COMM_AU2_EOM_EXTRACT_ALLSOURCES.carrier    left join    (select distinct policynumberformatted, CarrierDisplayName Carrier, policynumber_edw, carriername_edw     --from "RETAIL_PROD"."SCH_EDW"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF"       --used _BF table     FROM {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}     where policynumber_edw is not null     qualify row_number() over (partition by policynumberformatted, CarrierDisplayName order by dss_create_time desc) =1    ) DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES   on bvstg_comm_au3_venn_report.policynumberformatted = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.policynumberformatted   and bvstg_comm_au3_venn_report.carrier = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.carrier
