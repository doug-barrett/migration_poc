        name: SEGMENTFLAG
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN VOIDFLAG IS NOT NULL                THEN 'Void NSA Policies'
                          WHEN CORRECTIONATRENEWALFLAG IS NOT NULL THEN 'Policy Number Correction'
                          WHEN LATENCYFLAG IS NOT NULL             THEN 'Latent Policies'
                          WHEN MORETHANONECARRIERFLAG IS NOT NULL  THEN 'Data Entry Errors'
                          WHEN INVALIDFLAG IS NOT NULL             THEN 'Invalid SPLC Policies'
                          WHEN NOPREMIUMFLAG IS NOT NULL           THEN '$0/Null Premium'
                          ELSE (CASE WHEN bvstg_comm_au3_venn_report.Carrier IN ('Western General','Freedom General') THEN 'Descoped Carrier' WHEN bvstg_comm_au3_venn_report.Carrier ='National General' AND bvstg_comm_au3_venn_report.Policynumberformatted like 'INT%' THEN 'Non-Comissionable Policies' WHEN (DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.Carriername_edw like 'Alliance United%') OR (bvstg_comm_au3_venn_report.Carrier IN ('Dairyland','Progressive') AND to_date(LAST_TXN_DATE_CDT)>to_date(Expirationdate)) THEN 'Book Migration' WHEN bvstg_comm_au3_venn_report.policynumberformatted like 'NRDE%' THEN 'Other Ancillary Product' ELSE'Unknown' END)
                           END
