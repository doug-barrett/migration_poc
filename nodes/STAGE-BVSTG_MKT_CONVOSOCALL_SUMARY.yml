            FROM {{ ref('STAGE','V_DLBV_MKT_CONVOSOCALL_DM_CURRENT') }} v_dlbv_mkt_convosocall_dm_current
              LEFT JOIN {{ ref('EDW','DS_INTERACTIONSUMMARY') }} ds_interactionsummary
                ON (try_to_number(v_dlbv_mkt_convosocall_dm_current.PHONE_NUMBER)=try_to_number(RIGHT(ds_interactionsummary.REMOTENUMBERCALLID,10)) AND v_dlbv_mkt_convosocall_dm_current.CALL_DATE BETWEEN DATEADD(minutes,-10,ds_interactionsummary.STARTDATETIME) AND DATEADD(minutes,10,ds_interactionsummary.STARTDATETIME) AND v_dlbv_mkt_convosocall_dm_current.Status_Name = 'Conversational AI Transfer' AND ds_interactionsummary.DIRECTION = 1)
