        dependencies:
          - locationName: STAGE
            nodeName: STAGE_DATE_SF
          - locationName: UNKNOWN
            nodeName: STAGE_DATE_SF
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTIONITEM
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: STAGE
            nodeName: V_API_ACUMATICA_BRANCH
          - locationName: STAGE
            nodeName: V_API_ACUMATICA_STATECODE
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_ANCILLARYPRODUCT
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT MIN(DATE(CALENDAR_DATE))min_date,
                           MAX(DATE(CALENDAR_DATE))max_date,
                           MAX(CAL_MONTH)YEAR_MONTH
                      FROM {{ ref('UNKNOWN','STAGE_DATE_SF') }}
                     WHERE CAL_MONTH = '{{ parameters.HWM_BVSTG_Acumatica }}'
                   )STAGE_DATE_SF
             INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONITEM') }} DS_BVSTG_AP1_TRANSACTIONITEM
                ON 1=1
             INNER JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} DS_AP1_TRANSACTIONSUMMARY
                ON DS_AP1_TRANSACTIONSUMMARY.TransactionID = DS_BVSTG_AP1_TRANSACTIONITEM.TransactionID
               AND IFNULL(DS_AP1_TRANSACTIONSUMMARY.HK_H_TRANSACTION,'') != ''
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE
                ON DS_RETAIL_OFFICE.officecode = CASE WHEN DS_RETAIL_OFFICE.BusinessEntityCode IS NULL AND (DS_AP1_TRANSACTIONSUMMARY.OrganizationCode like '%SSB%' OR DS_AP1_TRANSACTIONSUMMARY.OrganizationCode = 'APS1') THEN DS_AP1_TRANSACTIONSUMMARY.BIAPRIMARYAGENTOFFICE
                        WHEN DS_AP1_TRANSACTIONSUMMARY.BIAPRIMARYAGENTOFFICE = 'CORP-SSB'                                                                                                     THEN DS_AP1_TRANSACTIONSUMMARY.TRANSACTIONOFFICECODE
                        ELSE DS_AP1_TRANSACTIONSUMMARY.BIAPRIMARYAGENTOFFICE
                         END
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE_SO
                ON DS_RETAIL_OFFICE_SO.officecode = DS_AP1_TRANSACTIONSUMMARY.TRANSACTIONOFFICECODE
               AND DS_RETAIL_OFFICE_SO.CORPORATEOFFICENUMBER > 0
              LEFT JOIN {{ ref('STAGE','V_API_ACUMATICA_BRANCH') }} V_API_ACUMATICA_BRANCH
                ON V_API_ACUMATICA_BRANCH.Number = DS_RETAIL_OFFICE.BusinessEntityCode
               AND DS_AP1_TRANSACTIONSUMMARY.OrganizationCode NOT IN('ACCIL','ACCAL')
              LEFT JOIN {{ ref('STAGE','V_API_ACUMATICA_STATECODE') }} V_API_ACUMATICA_STATECODE
                ON TRIM(UPPER(V_API_ACUMATICA_STATECODE.StateName)) = TRIM(UPPER(IFNULL(DS_RETAIL_OFFICE.state,DS_RETAIL_OFFICE_SO.state)))
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_ANCILLARYPRODUCT') }} DS_BVSTG_AP1_ANCILLARYPRODUCT
                ON DS_BVSTG_AP1_TRANSACTIONITEM.ADDITIONALPRODUCTSALEID = DS_BVSTG_AP1_ANCILLARYPRODUCT.ADDITIONALPRODUCTSALEID
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONITEM') }} DS_BVSTG_AP1_TRANSACTIONITEM_AP
                ON DS_BVSTG_AP1_TRANSACTIONITEM_AP.transactionitemid = DS_BVSTG_AP1_TRANSACTIONITEM.CreditedTransactionItemID
               AND DS_BVSTG_AP1_TRANSACTIONITEM_AP.FeeType='Additional Product Premium'
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_ANCILLARYPRODUCT') }} DS_BVSTG_AP1_ANCILLARYPRODUCT_AP
                ON DS_BVSTG_AP1_TRANSACTIONITEM_AP.ADDITIONALPRODUCTSALEID = DS_BVSTG_AP1_ANCILLARYPRODUCT_AP.ADDITIONALPRODUCTSALEID
               AND DS_BVSTG_AP1_ANCILLARYPRODUCT_AP.AdditionalProductName IS NOT NULL
              LEFT JOIN (
                    SELECT c.TRANSACTIONITEMID,
                           a.companycost,
                           a.ADDITIONALPRODUCTNAME
                      FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ANCILLARYPRODUCT_AC a
                     INNER JOIN RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY b
                        ON a.ap1_policyid = b.PolicyID
                     INNER JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_TRANSACTIONITEM c
                        ON b.transactionid = c.transactionid
                     WHERE c.FEETYPE='Additional Product Premium'
                   )DS_BVSTG_AP1_ANCILLARYPRODUCT_AC
                ON DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONITEMID = DS_BVSTG_AP1_ANCILLARYPRODUCT_AC.TRANSACTIONITEMID
              LEFT JOIN (
                    SELECT ProgramID
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_PROGRAM_MROC_CURRENT
                     WHERE onlinesalecode IN ('17620','17770','17773','17776','17779')
                   )PR
                ON PR.ProgramID = DS_AP1_TRANSACTIONSUMMARY.ProgramID
              LEFT JOIN( SELECT DISTINCT c.transactionid,
                   a.cost,
                   a.Name
              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_AC_SUBSCRIPTIONTRANSACTIONPRODUCT_CURRENT a
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_POLICY_MROC_CURRENT b
                ON b.publicid = UPPER(a.policyid)
             INNER JOIN RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY c
                ON b.Poli
