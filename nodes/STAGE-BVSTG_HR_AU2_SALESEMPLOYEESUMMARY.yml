                          WHEN isNewHireStatus = 1 AND isLeaveOfAbsenceStatus = 1                                                                                         THEN 'New Hire & LOA'
                          WHEN isActiveStatus = 1                                                                                                                         THEN 'Active'
                          WHEN isTerminatedStatus = 1                                                                                                                     THEN 'Terminated'
                          WHEN isLeaveOfAbsenceStatus = 1                                                                                                                 THEN 'LOA'
