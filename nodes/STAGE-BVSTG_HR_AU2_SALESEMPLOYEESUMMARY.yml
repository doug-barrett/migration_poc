              CASE WHEN ReHireStatus = 'RH' AND MONTH(LastHireDate)=MONTH(EffectiveDate) AND YEAR(LastHireDate)=YEAR(EffectiveDate) AND isActiveStatus = 1         THEN 'New Hire & Active'
                          WHEN ReHireStatus = 'RH' AND MONTH(LastHireDate)=MONTH(EffectiveDate) AND YEAR(LastHireDate)=YEAR(EffectiveDate) AND isTerminatedStatus = 1     THEN 'New Hire & Terminated'
                          WHEN ReHireStatus = 'RH' AND MONTH(LastHireDate)=MONTH(EffectiveDate) AND YEAR(LastHireDate)=YEAR(EffectiveDate) AND isLeaveOfAbsenceStatus = 1 THEN 'New Hire & LOA'
