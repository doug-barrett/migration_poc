                        WHEN cs.H_37106_1 = 'O' THEN '$130,000 - $134,999'
                        WHEN cs.H_37106_1 = 'P' THEN '$135,000 - $139,999'
                        WHEN cs.H_37106_1 = 'Q' THEN '$140,000 - $144,999'
                        WHEN cs.H_37106_1 = 'R' THEN '$145,000 - $149,999'
                        WHEN cs.H_37106_1 = 'S' THEN '$150,000 - $159,999'
                        WHEN cs.H_37106_1 = 'T' THEN '$160,000 - $169,999'
                        WHEN cs.H_37106_1 = 'U' THEN '$170,000 - $174,999'
                        WHEN cs.H_37106_1 = 'V' THEN '$175,000 - $189,999'
                        WHEN cs.H_37106_1 = 'W' THEN '$190,000 - $199,999'
                        WHEN cs.H_37106_1 = 'X' THEN '$200,000 - $224,999'
                        WHEN cs.H_37106_1 = 'Y' THEN '$225,000 - $249,999'
                        WHEN cs.H_37106_1 = 'Z' THEN '$250,000 or More'
                         END AS Advantage_Target_Narrow_Band_Income_3,
                   CASE WHEN cs.H_40101_1 = '00' THEN 'Unknown'
                        WHEN cs.H_40101_1 = '01' THEN 'Physician/Dentist'
                        WHEN cs.H_40101_1 = '02' THEN 'Health Care'
                        WHEN cs.H_40101_1 = '03' THEN 'Lawyers/Judges'
                        WHEN cs.H_40101_1 = '05' THEN 'Professional/Technical'
                        WHEN cs.H_40101_1 = '06' THEN 'Management'
                        WHEN cs.H_40101_1 = '07' THEN 'Teacher Educator'
                        WHEN cs.H_40101_1 = '08' THEN 'Sales/Marketing'
                        WHEN cs.H_40101_1 = '09' THEN 'Clerical/Service Worker'
                        WHEN cs.H_40101_1 = '10' THEN 'Tradesman/Machine Oper / Laborer'
                        WHEN cs.H_40101_1 = '11' THEN 'Farmer'
                        WHEN cs.H_40101_1 = '12' THEN 'Student'
                        WHEN cs.H_40101_1 = '13' THEN 'Homemaker'
                        WHEN cs.H_40101_1 = '14' THEN 'Retired'
                        WHEN cs.H_40101_1 = '15' THEN 'Federal Employee'
                        WHEN cs.H_40101_1 = '16' THEN 'Federal Employee Retired'
                        WHEN cs.H_40101_1 = '17' THEN 'Military'
                        WHEN cs.H_40101_1 = '18' THEN 'Military Retired'
                        WHEN cs.H_40101_1 = '19' THEN 'Other'
                        WHEN cs.H_40101_1 = '20' THEN 'Business Owner'
                         END AS Occupation,
                   CASE WHEN cs.SES_ASIAN != ''    THEN 'Asian'
                        WHEN cs.SES_BLACK != ''    THEN 'Black'
                        WHEN cs.SES_HISPANIC != '' THEN 'Hispanic'
                        WHEN cs.SES_WHITE != ''    THEN 'White'
                         END AS Ethnicity,
                   CASE WHEN cs.HISPANICCULTURE = 'HA1' THEN ' Americanizado. English dominant (nearly no Spanish)'
                        WHEN cs.HISPANICCULTURE = 'HA2' THEN ' Nueva Latina. English preferred (some Spanish)'
                        WHEN cs.HISPANICCULTURE = 'HA3' THEN ' Bi-Cultural Hispanic. Bilingual (equal or nearly)'
                        WHEN cs.HISPANICCULTURE = 'HA4' THEN ' Hispano. Spanish preferred (some English)'
                        WHEN cs.HISPANICCULTURE = 'HA5' THEN ' Latinoamericana. Spanish dominant (nearly no English)'
                         END AS Individualized_Hispanicity_Segment,
                   cs.*
              FROM "DATA_LAKE"."BIA_ANALYTICS"."CLARITAS_DEMOGRAPHIC_DATA" cs
