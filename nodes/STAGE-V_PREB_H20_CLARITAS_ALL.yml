                        WHEN cs.H_37106_1 = 'G' THEN '$90,000 - $94,999'
                        WHEN cs.H_37106_1 = 'H' THEN '$95,000 - $99,999'
                        WHEN cs.H_37106_1 = 'I' THEN '$100,000 - $104,999'
                        WHEN cs.H_37106_1 = 'J' THEN '$105,000 - $109,999'
                        WHEN cs.H_37106_1 = 'K' THEN '$110,000 - $114,999'
                        WHEN cs.H_37106_1 = 'L' THEN '$115,000 - $119,999'
                        WHEN cs.H_37106_1 = 'M' THEN '$120,000 - $124,999'
