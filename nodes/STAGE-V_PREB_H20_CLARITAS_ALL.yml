        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_H20_CLARITAS_ALL') }} AS SELECT CASE WHEN cs.H_37004_2 = 'S' THEN ' Household specific (Advantage)'
                        WHEN cs.H_37004_2 = 'H' THEN ' Household inferred (Advantage)'
                        WHEN cs.H_37004_2 = 'A' THEN ' Area Inferred (Advantage PLUS)'
                         END AS Advantage_Indicator,
                   CASE WHEN cs.H_37004_1 = '1' THEN 'Definite Renter'
                        WHEN cs.H_37004_1 = '2' THEN 'Probable Renter'
                        WHEN cs.H_37004_1 = '3' THEN 'Probable Owner'
                        WHEN cs.H_37004_1 = '4' THEN 'Definite Owner'
                         END AS Advantage_Home_Owner,
                   CASE WHEN cs.H_37106_1 = '0' THEN 'Less than $14,999'
                        WHEN cs.H_37106_1 = '1' THEN '$15,000 - $19,999'
                        WHEN cs.H_37106_1 = '2' THEN '$20,000 - $24,999'
                        WHEN cs.H_37106_1 = '3' THEN '$25,000 - $29,999'
                        WHEN cs.H_37106_1 = '4' THEN '$30,000 - $34,999'
                        WHEN cs.H_37106_1 = '5' THEN '$35,000 - $39,999'
                        WHEN cs.H_37106_1 = '6' THEN '$40,000 - $44,999'
                        WHEN cs.H_37106_1 = '7' THEN '$45,000 - $49,999'
                        WHEN cs.H_37106_1 = '8' THEN '$50,000 - $54,999'
                        WHEN cs.H_37106_1 = '9' THEN '$55,000 - $59,999'
                        WHEN cs.H_37106_1 = 'A' THEN '$60,000 - $64,999'
                        WHEN cs.H_37106_1 = 'B' THEN '$65,000 - $69,999'
                        WHEN cs.H_37106_1 = 'C' THEN '$70,000 - $74,999'
