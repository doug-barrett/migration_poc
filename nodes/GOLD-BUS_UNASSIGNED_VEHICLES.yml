      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'CV_EQUIPMENT') }} "CV_EQUIPMENT"
          LEFT JOIN {{ ref('GOLD', 'CV_EQUIPMENT_DRIVER') }} "CV_EQUIPMENT_DRIVER"
             ON CV_EQUIPMENT.Equipment_Id = CV_EQUIPMENT_DRIVER.Equipment_Id
          LEFT JOIN {{ ref('GOLD', 'CV_VEHICLE_DRIVER_EXCEPTION') }} "CV_VEHICLE_DRIVER_EXCEPTION" 
             ON CV_EQUIPMENT_DRIVER.Employee_Id = CV_VEHICLE_DRIVER_EXCEPTION.Employee_Id
          INNER JOIN {{ ref('GOLD', 'CV_M_EQUIPMENT_DAILY_FACT') }} "CV_M_EQUIPMENT_DAILY_FACT" 
            ON CV_EQUIPMENT.Equipment_Id = CV_M_EQUIPMENT_DAILY_FACT.Equipment_Id
          INNER JOIN {{ ref('GOLD', 'CV_M3_FIN_ORGANIZATION') }} "CV_M3_FIN_ORGANIZATION" 
             ON CV_M_EQUIPMENT_DAILY_FACT.Current_Lawson_Account_Id = CV_M3_FIN_ORGANIZATION.Org_Key
          INNER JOIN {{ ref('GOLD', 'BUS_LOCATION') }} "BUS_LOCATION" 
             ON CV_M_EQUIPMENT_DAILY_FACT.Current_Location_Id = BUS_LOCATION.Location_Id
          INNER JOIN {{ ref('GOLD', 'BUS_ITEM_EQPT_CLASS') }} "BUS_ITEM_EQPT_CLASS" 
             ON CV_EQUIPMENT.Category_Code = BUS_ITEM_EQPT_CLASS.Category_Code
             AND CV_EQUIPMENT.Class_Code = BUS_ITEM_EQPT_CLASS.Class_Code
          LEFT JOIN {{ ref('GOLD', 'BUS_EMPLOYEE') }} "BUS_EMPLOYEE" 
             ON CV_EQUIPMENT_DRIVER.Employee_Id = BUS_EMPLOYEE.Employee_Id
             AND BUS_EMPLOYEE.HR_Status = 'A'
          LEFT JOIN {{ ref('GOLD', 'LU_VEHICLE_ASSIGN_REASON') }} "LU_VEHICLE_ASSIGN_REASON" 
             ON CV_EQUIPMENT_DRIVER.Store_Unassigned_Code = LU_VEHICLE_ASSIGN_REASON.Vehicle_Assignment_Code
          	AND LU_VEHICLE_ASSIGN_REASON.Reason_Status <> 'D'
          LEFT JOIN {{ ref('GOLD', 'CV_EQUIPMENT_LEASE_DETAIL') }} "CV_EQUIPMENT_LEASE_DETAIL" 
             ON CV_EQUIPMENT_DRIVER.Equipment_Id = CV_EQUIPMENT_LEASE_DETAIL.Equipment_Id
          	AND CV_EQUIPMENT_LEASE_DETAIL.Lease_Status = 'A'
          LEFT JOIN {{ ref('GOLD', 'CV_EMPLOYEE_JOB_CODES') }} "CV_EMPLOYEE_JOB_CODES" 
             ON BUS_EMPLOYEE.Job_Code = CV_EMPLOYEE_JOB_CODES.Job_Code
          WHERE CV_M_EQUIPMENT_DAILY_FACT.Equipment_Status_Code NOT IN (
          		'S'
          		,'J'
          		,'T'
          		,'V'
          		,'M'
          		,'H'
          		)
                          AND CV_M_EQUIPMENT_DAILY_FACT.Equipment_Type_Code NOT IN ('C','E')
          	AND CV_M_EQUIPMENT_DAILY_FACT.Equipment_Active_Status_Code <> 'D'
          	AND CV_M_EQUIPMENT_DAILY_FACT.Category_Code IN (
          		061
          		,062
          		)
          	AND CV_M_EQUIPMENT_DAILY_FACT.Inventory_Date = CURRENT_DATE - 1
