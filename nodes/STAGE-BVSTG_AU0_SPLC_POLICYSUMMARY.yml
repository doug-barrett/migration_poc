        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} ds_splc_policytransaction
             INNER JOIN (
                    SELECT DISTINCT customerid
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                     WHERE bvstg_customer_to_refresh.SourceDb = 'SPLC'
                   ) bvstg_customer_to_refresh
