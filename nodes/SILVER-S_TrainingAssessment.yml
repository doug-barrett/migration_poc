        columnCounter: 41c2d31f-c996-5b2c-b63c-2f38a963a440
        stepCounter: 6e725e7e-c0af-514f-a021-0bf3e6f0964e
      config: {}
      dataType: NUMBER(38,0)
      description: The number of compliant items that have been observed. This includes
        ratings of 2 or 3.
      name: CompliantObservationsCount
      nullable: true
      sourceColumnReferences:
