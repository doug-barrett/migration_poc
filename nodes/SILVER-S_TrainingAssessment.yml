      join:
        joinCondition: |-
          FROM {{ ref('SILVER', 'I_CS_ObservationSummary') }} "I_CS_ObservationSummary"
          LEFT JOIN {{ ref('SILVER', 'I_CS_TheoryOverallStatus') }} "I_CS_TheoryOverallStatus"
            ON I_CS_OBSERVATIONSUMMARY.THEORYCOMPETENCYCODE = I_CS_THEORYOVERALLSTATUS.COMPETENCYCODE AND I_CS_OBSERVATIONSUMMARY.EMPLOYEECODE = I_CS_THEORYOVERALLSTATUS.EMPLOYEECODE
          LEFT JOIN {{ ref('SILVER', 'S_PracticalObservation') }} "S_PracticalObservation"
            ON I_CS_OBSERVATIONSUMMARY.COMPETENCYCODE = S_PRACTICALOBSERVATION.ASSOCIATEDCOMPETENCYCODE AND I_CS_OBSERVATIONSUMMARY.EMPLOYEECODE = S_PRACTICALOBSERVATION.EMPLOYEECODE
          GROUP BY I_CS_OBSERVATIONSUMMARY.EMPLOYEECODE  , I_CS_OBSERVATIONSUMMARY.COMPETENCYCODE  , I_CS_OBSERVATIONSUMMARY.WTCEXPIRYDATE  , I_CS_OBSERVATIONSUMMARY.WTCSTATUS  , D_EMPLOYEE.D_EMPLOYEE_KEY  , D_EMPLOYEE.BUSINESSUNITCODE  , D_BUSINESSUNIT.D_BUSINESSUNIT_KEY  , D_CRCCOMPETENCY.D_CRCCOMPETENCY_KEY  , D_CRCCOMPETENCY.THEORYONLYFLAG
