    - appliedColumnTests: {}
      columnReference:
        columnCounter: aace7ba8-e112-5d98-9b6d-25a2b266229b
        stepCounter: 6e725e7e-c0af-514f-a021-0bf3e6f0964e
      config: {}
      dataType: NUMBER(38,0)
      description: The number of items with a missing rating.
      name: NotAssessedObservationsCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: SUM("S_PRACTICALOBSERVATION".""NotAssessedCount"")
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 886112a7-2021-5c2c-ac5d-826613cf13b5
        stepCounter: 6e725e7e-c0af-514f-a021-0bf3e6f0964e
      config: {}
      dataType: NUMBER(38,0)
      description: The number of items that have been assummed to be complient based
        on completed status, but no rating has been entered.
      name: AssummedCompliantObservationCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: SUM("S_PRACTICALOBSERVATION".""AssummedCompliantCount"")
    - appliedColumnTests: {}
      columnReference:
        columnCounter: bd52ae17-af1a-5d20-b72e-c9aeb3a8f1ef
        stepCounter: 6e725e7e-c0af-514f-a021-0bf3e6f0964e
      config: {}
      dataType: NUMBER(38,0)
      description: If there are any Non_Compliant Observations, then the WTC as a
        whole is deemed non-compliant.
      name: NonCompliantCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN "D_CRCCOMPETENCY".""TheoryOnlyFlag"" = 'THEORY ONLY'    AND
          MIN("I_CS_THEORYOVERALLSTATUS"."RESULT") = 0   THEN 1   WHEN "D_CRCCOMPETENCY".""TheoryOnlyFlag""
          <> 'THEORY ONLY'    AND SUM("S_PRACTICALOBSERVATION".""NonCompliantCount"")
          >= 1   THEN 1   ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: d8d38787-b956-5dc1-ae0a-0baff631ba76
        stepCounter: 6e725e7e-c0af-514f-a021-0bf3e6f0964e
      config: {}
      dataType: NUMBER(38,0)
      description: If all the Observations are compliant, then the Employee is deemed
        to hold this competency.
      name: CompliantCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN "D_CRCCOMPETENCY".""TheoryOnlyFlag"" = 'THEORY ONLY'     AND
          MIN("I_CS_THEORYOVERALLSTATUS"."RESULT") = 1   THEN 1   --WHEN THEY HAVE
          DONE THE OBSERVATIONS AND FOUND NO NON-CONFORMANCES   -- AND THERE ARE NO
          MISSING ASSESSMENTS   WHEN "D_CRCCOMPETENCY".""TheoryOnlyFlag"" <> 'THEORY
          ONLY'     AND SUM("S_PRACTICALOBSERVATION".""ObservationItemCount"") > 0     AND
          SUM("S_PRACTICALOBSERVATION".""NonCompliantCount"") = 0     AND SUM("S_PRACTICALOBSERVATION".""NotAssessedCount"")
          = 0   THEN 1   ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: bfec1b88-05bc-5d4f-a960-6cfde669f6bb
        stepCounter: 6e725e7e-c0af-514f-a021-0bf3e6f0964e
      config: {}
      dataType: NUMBER(38,0)
      description: If all the Observations are compliant, then the Employee is deemed
        to hold this competency, but these WTCs contain observations where the rating
        is blank, but the assessor has completed the observation record.
      name: AssummedCompliantCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   --WHEN THEY HAVE DONE THE OBSERVATIONS AND FOUND NO NON-CONFORMANCES   --
          AND THERE ARE NO MISSING ASSESSMENTS   WHEN "D_CRCCOMPETENCY".""TheoryOnlyFlag""
          <> 'THEORY ONLY'     AND SUM("S_PRACTICALOBSERVATION".""ObservationItemCount"")
          > 0     AND SUM("S_PRACTICALOBSERVATION".""AssummedCompliantCount"") > 0     AND
          SUM("S_PRACTICALOBSERVATION".""NonCompliantCount"") = 0     AND SUM("S_PRACTICALOBSERVATION".""NotAssessedCount"")
          = 0   THEN 1   ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 2ff14e3c-ae55-5a4a-a498-66ab2d9a073e
        stepCounter: 6e725e7e-c0af-514f-a021-0bf3e6f0964e
      config: {}
      dataType: NUMBER(38,0)
      description: There are no assessments recorded for this employee for this WTC
      name: NotStartedCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   --IF THERE ARE NO THEORY RESULTS AT ALL    WHEN "D_CRCCOMPETENCY".""TheoryOnlyFlag""
          = 'THEORY ONLY'     AND SUM("I_CS_THEORYOVERALLSTATUS"."RESULT") IS NULL
          THEN 1   --WHEN THEY HAVE DONE THE OBSERVATIONS AND FOUND NO NON-CONFORMANCES    WHEN
          "D_CRCCOMPETENCY".""TheoryOnlyFlag"" <> 'THEORY ONLY'     AND SUM(COALESCE("S_PRACTICALOBSERVATION".""ObservationItemCount"",0))
          = 0   THEN 1   --WHEN NONE OF THE OBSERVATIONS HAVE A "Rating" AGAINST THEM    WHEN
          "D_CRCCOMPETENCY".""TheoryOnlyFlag"" <> 'THEORY ONLY'     AND SUM("S_PRACTICALOBSERVATION".""ObservationItemCount"")
          = SUM("S_PRACTICALOBSERVATION".""NotAssessedCount"")   THEN 1   ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: b9b58338-a217-5303-b7de-edc6d1ceeebc
        stepCounter: 6e725e7e-c0af-514f-a021-0bf3e6f0964e
      config: {}
      dataType: NUMBER(38,0)
      description: The number of assessments that have been started, but are not yet
        complete, but there are no non-complient observations as yet.
      name: StartedCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN D_CRCCOMPETENCY.THEORYONLYFLAG <> 'THEORY ONLY'   --WHEN
          THEY HAVE DONE THE OBSERVATIONS   AND SUM(S_PRACTICALOBSERVATION.OBSERVATIONITEMCOUNT)
          > 0   --WHEN AT LEAST ONE OF THE TASKS HAVE SUCCESSFULLY BEEN OBSERVED   --
          EVEN IF THEY ONLY HAVE 1 OBSERVATION AND IT'S NOT YET ASSESSED   -- WE STILL
          WANT THIS COUNTED AS "STARTED"   AND SUM(S_PRACTICALOBSERVATION.COMPLIANTCOUNT)
          > 0   -- THERE ARE STILL SOME OUTSTANDING TO COMPLETE   AND SUM(S_PRACTICALOBSERVATION.NOTASSESSEDCOUNT)
          > 0   --AND NOTHING HAS YET FAILED   AND SUM(S_PRACTICALOBSERVATION.NONCOMPLIANTCOUNT)
          = 0   THEN 1   ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 7688acae-bd8a-5b52-bfdc-eaa7d56d6b6c
        stepCounter: 6e725e7e-c0af-514f-a021-0bf3e6f0964e
      config: {}
      dataType: NUMBER(38,0)
      description: The number of assessments that still need to be completed. These
        include both the started and not started assessments.
      name: NotAssessedCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN "D_CRCCOMPETENCY".""TheoryOnlyFlag"" <> 'THEORY ONLY'   --WHEN
          THEY HAVE DONE THE OBSERVATIONS   AND SUM("S_PRACTICALOBSERVATION".""ObservationItemCount"")
          > 0   -- THERE ARE STILL SOME OUTSTANDING TO COMPLETE   AND SUM("S_PRACTICALOBSERVATION".""NotAssessedCount"")
          > 0   --AND NOTHING HAS YET FAILED   AND SUM("S_PRACTICALOBSERVATION".""NonCompliantCount"")
          = 0   THEN 1   ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 6ef86093-c38e-559c-8403-61986184237a
