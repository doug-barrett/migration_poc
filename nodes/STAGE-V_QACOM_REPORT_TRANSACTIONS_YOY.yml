    sourceMapping:
      - aliases:
          V_QACOM_REPORT_TRANSACTIONS_YOY: c2da3916-a9da-41c1-9e12-ce27ccd1f47a
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_QACOM_REPORT_TRANSACTIONS_YOY') }} AS SELECT IFNULL(t1.TRANSACTIONTYPE, t2.TRANSACTIONTYPE) AS TRANSACTIONTYPE,
                   t2.TRANSACTIONCOUNT AS "Last year Tran",
                   t1.TRANSACTIONCOUNT AS "Current year Tran",
                   (t1.TRANSACTIONCOUNT + t2.TRANSACTIONCOUNT) AS "Total Tran",
                   to_Number(t2.TRANSACTIONCOUNT/tt2.TRANSACTIONCOUNT, 10, 4) AS "Last Year %",
                   to_Number(t1.TRANSACTIONCOUNT/tt1.TRANSACTIONCOUNT, 10, 4) AS "This Year %",
                   to_Number((t1.TRANSACTIONCOUNT + t2.TRANSACTIONCOUNT) / (tt1.TRANSACTIONCOUNT + tt2.TRANSACTIONCOUNT), 10, 4) AS "Total %",
                   t2.ACTUALCOMMISSION AS "Last year comm",
                   t1.ACTUALCOMMISSION AS "This year comm",
                   (t1.ACTUALCOMMISSION + t2.ACTUALCOMMISSION) AS "Total Comm",
                   t1.Carrier,
                   t1.ExecutionYear
              FROM (
                    SELECT ExecutionYear,
                           Carrier,
                           TRANSACTIONTYPE,
                           sum(TRANSACTIONCOUNT) AS TRANSACTIONCOUNT,
                           sum(ACTUALCOMMISSION) AS ACTUALCOMMISSION
                      FROM "RETAIL_DEV"."SCH_BVSTAGE"."V_QACOM_TRANSACTION_COUNTS"
                     GROUP BY TRANSACTIONTYPE,
                              ExecutionYear,
                              Carrier
                   ) t1
              LEFT JOIN (
                    SELECT ExecutionYear,
                           Carrier,
                           TRANSACTIONTYPE,
                           sum(TRANSACTIONCOUNT) AS TRANSACTIONCOUNT,
                           sum(ACTUALCOMMISSION) AS ACTUALCOMMISSION
                      FROM "RETAIL_DEV"."SCH_BVSTAGE"."V_QACOM_TRANSACTION_COUNTS"
                     GROUP BY TRANSACTIONTYPE,
                              ExecutionYear,
                              Carrier
                   ) t2
                ON t1.Carrier = t2.Carrier
               AND t1.TRANSACTIONTYPE = t2.TRANSACTIONTYPE
               AND t2.ExecutionYear = t1.ExecutionYear - 1
              LEFT JOIN (
                    SELECT ExecutionYear,
                           Carrier,
                           sum(TRANSACTIONCOUNT) AS TRANSACTIONCOUNT,
                           sum(ACTUALCOMMISSION) AS ACTUALCOMMISSION
                      FROM "RETAIL_DEV"."SCH_BVSTAGE"."V_QACOM_TRANSACTION_COUNTS"
                     GROUP BY ExecutionYear,
                              Carrier
                   ) tt1
                ON t1.Carrier = tt1.Carrier
               AND t1.ExecutionYear = tt1.ExecutionYear
              LEFT JOIN (
                    SELECT ExecutionYear,
                           Carrier,
                           sum(TRANSACTIONCOUNT) AS TRANSACTIONCOUNT,
                           sum(ACTUALCOMMISSION) AS ACTUALCOMMISSION
                      FROM "RETAIL_DEV"."SCH_BVSTAGE"."V_QACOM_TRANSACTION_COUNTS"
                     GROUP BY ExecutionYear,
                              Carrier
                   ) tt2
                ON t2.Carrier = tt2.Carrier
               AND t2.ExecutionYear = tt2.ExecutionYear
