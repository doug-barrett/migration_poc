                      FROM {{ ref('STAGE','BVSTG_IO_GNL_AU1_DEALS') }} AU1_DEALS
                      JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} tss
                        ON (RIGHT(tss.digitsdialed, 10) = AU1_DEALS.Phone OR RIGHT(tss.DNIS, 10) = AU1_DEALS.Phone OR RIGHT(tss.ANI, 10) = AU1_DEALS.Phone)
                     WHERE IFNULL(Phone, '') != ''
                       AND tss.ISOUTBOUND = 1
                   ) BVSTG_IO_GNL_AU1_DEALS
             GROUP BY BVSTG_IO_GNL_AU1_DEALS.DEAL_ID
