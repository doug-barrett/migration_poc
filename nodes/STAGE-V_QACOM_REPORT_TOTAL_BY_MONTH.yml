        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_QACOM_REPORT_TOTAL_BY_MONTH') }} AS SELECT V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.Carrier,
                   V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.ExecutionMonth,
                   sum(V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.PREMIUM) AS PREMIUM_SUM,
                   sum(V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.ACTUALCOMMISSION) AS COMMISSION_SUM
              FROM "RETAIL_DEV"."SCH_BVSTAGE"."V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT" V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT
             WHERE V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.IsDeleted = 'False'
             GROUP BY V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.ExecutionMonth,
                      V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.Carrier
             ORDER BY V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.ExecutionMonth DESC
