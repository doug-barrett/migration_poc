        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_CISCO_CUSTOMERACTIVE30DAYS') }} AS SELECT DISTINCT Phone,
                   CUSTOMERNO,
                   FULLNAME,
                   OFFICECODE,
                   OFFICESTATUS,
                   AGENCYCODE,
                   Status,
                   SourceDB,
                   State
              FROM {{ ref('STAGE','BVSTG_PCCE_CUSTOMERACTIVE30DAYS') }}
             WHERE phone IS NOT NULL
               AND phone NOT IN ('0000000000','1234567890','1111111111' ,'2222222222','3333333333','4444444444' ,'5555555555','6666666666','7777777777' ,'8888888888','9999999999')
               AND phone NOT LIKE '1%'
               AND phone NOT LIKE '0%'
