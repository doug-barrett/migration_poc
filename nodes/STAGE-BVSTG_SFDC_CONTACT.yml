        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_DLBV_SFDC_EMPLOYEES_CURRENT') }} v_dlbv_sfdc_employees_current
              LEFT JOIN {{ ref('STAGE','V_DLBV_CFI_EMPLOYEETITLE_CURRENT') }} V_DLBV_CFI_EMPLOYEETITLE_CURRENT
                ON v_dlbv_sfdc_employees_current.TITLE = V_DLBV_CFI_EMPLOYEETITLE_CURRENT.EMPLOYEETITLEID
              LEFT JOIN {{ ref('STAGE','V_DLBV_SFDC_EMPLOYEES_CURRENT') }} v_dlbv_sfdc_employees_current_Report
                ON v_dlbv_sfdc_employees_current_Report.EMPLOYEEID = v_dlbv_sfdc_employees_current.reportstoemployeeid
              LEFT JOIN {{ ref('STAGE','V_DLBV_SFDC_EMPLOYEETYPE_CURRENT') }} V_DLBV_SFDC_EMPLOYEETYPE_CURRENT
                ON V_DLBV_SFDC_EMPLOYEETYPE_CURRENT.EMPLOYEETYPEID = V_DLBV_SFDC_EMPLOYEES_CURRENT.EMPLOYEETYPEID
              LEFT JOIN {{ ref('STAGE','V_DLBV_SFDC_EMPLOYEESTATUS_CURRENT') }} V_DLBV_SFDC_EMPLOYEESTATUS_CURRENT
                ON V_DLBV_SFDC_EMPLOYEESTATUS_CURRENT.EMPLOYEESTATUSID = v_dlbv_sfdc_employees_current.STATUSID
             WHERE TRY_TO_NUMERIC(TRIM(v_dlbv_sfdc_employees_current.EMPLOYEENUMBER, '?')) IS NOT NULL QUALIFY ROW_NUMBER() OVER(PARTITION BY v_dlbv_sfdc_employees_current.EMPLOYEENUMBER ORDER BY CASE WHEN IFNULL(V_DLBV_SFDC_EMPLOYEES_CURRENT.OFFICECODE,'')!='' THEN 1 ELSE 2 END, CASE WHEN V_DLBV_SFDC_EMPLOYEESTATUS_CURRENT.employeestatusname like '%On Leave%' THEN 'On Leave' WHEN V_DLBV_SFDC_EMPLOYEESTATUS_CURRENT.employeestatusname like '%Active%' THEN 'Active' WHEN V_DLBV_SFDC_EMPLOYEESTATUS_CURRENT.employeestatusname like '%New Hire%' THEN 'New Hire' ELSE V_DLBV_SFDC_EMPLOYEESTATUS_CURRENT.employeestatusname END, v_dlbv_sfdc_employees_current.dss_update_time DESC, v_dlbv_sfdc_employees_current.DSS_LOAD_DATE DESC,V_DLBV_SFDC_EMPLOYEES_CURRENT.hiredate DESC) = 1
