                   WRITTENPREMIUM_GROUPED
              FROM (SELECT DISTINCT *,
                   CASE WHEN limitperpersonclean = '25000'
               AND limitperaccidentclean = '50000' THEN '25/50' WHEN limitperpersonclean = '50000'
               AND limitperaccidentclean = '100000' THEN '50/100' WHEN limitperpersonclean = '15000'
               AND limitperaccidentclean = '30000' THEN '15/30' WHEN limitperpersonclean = '30000'
               AND limitperaccidentclean = '60000' THEN '30/60' WHEN limitperpersonclean = '20000'
