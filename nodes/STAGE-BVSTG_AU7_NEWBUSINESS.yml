                   TOTALFEES_GROUPED,
                   WRITTENPREMIUM_GROUPED
              FROM (
                    SELECT DISTINCT *
                      FROM {{ ref('STAGE','BVSTG_AU5_NEWBUSINESS') }}
                     WHERE policyid NOT IN (
                            SELECT DISTINCT policyid
                              FROM {{ ref('STAGE','BVSTG_AU5_NEWBUSINESS') }}
