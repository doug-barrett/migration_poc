              LEFT JOIN {{ ref('NP','L_JDE_F15017_LEASEMASTERDETAIL') }} L_JDE_F15017_LEASEMASTERDETAIL
                ON L_JDE_F1501B_LEASEMASTERHEADER.NEDOCO = L_JDE_F15017_LEASEMASTERDETAIL.NWDOCO
               AND L_JDE_F1501B_LEASEMASTERHEADER.NELSVR = L_JDE_F15017_LEASEMASTERDETAIL.NWLSVR
              LEFT JOIN {{ ref('NP','I_JDE_VEHICLE_10') }} I_JDE_VEHICLE_10
                ON L_JDE_F15017_LEASEMASTERDETAIL.NWNUMB = I_JDE_VEHICLE_10.ASSETNUMBER
              LEFT JOIN {{ ref('NP','I_LEASEAMORTIZATIONSCHEDULE') }} I_LEASEAMORTIZATIONSCHEDULE
                ON L_JDE_F1501B_LEASEMASTERHEADER.NEDOCO = I_LEASEAMORTIZATIONSCHEDULE.LEASEDOCUMENTNUMBER
               AND L_JDE_F15017_LEASEMASTERDETAIL.NWNUMB = I_LEASEAMORTIZATIONSCHEDULE.ASSETNUMBER --NEED TO JOIN TO 2 DAYS BEFORE TO ACCOMMODATE FOR SNAPSHOT CUT OFF DATE    AND EOMONTH(SCHEDULEBEGINDATE) = EOMONTH(CONVERT(DATE, DATEADD(DAY, -2, GETDATE())))
