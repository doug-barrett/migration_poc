      dataType: VARCHAR
      description: "TASK IS RELATED TO WHICH ENTITY. USES BELOW FORMULA.\n\n\t   CASE\
        \ ISNULL(LEFT(COALESCE([TASK].[WHATID], [TASK].[WHOID]), 3), 'XXX')\n\t\t\
        \   WHEN '006' THEN 'OPPORTUNITY'\n\t\t   WHEN '0XB' THEN 'LISTEMAIL'\n\t\t\
        \   WHEN '701' THEN 'CAMPAIGN'\n\t\t   WHEN '800' THEN 'CONTRACT'\n\t\t  \
        \ WHEN 'A0V' THEN 'MEMBER_ENGAGEMENT_PROFILE'\n\t\t   WHEN 'A0M' THEN 'SOLICITATION'\n\
        \t\t   WHEN '001' THEN 'ACCOUNT'\n\t\t   WHEN 'A08' THEN 'BOOTH_STAFFING'\n\
        \t\t   WHEN '00Q' THEN 'LEAD'\n\t\t   WHEN '003' THEN 'CONTACT'\n\t\t   WHEN\
        \ 'XXX' THEN NULL\n\t\t   ELSE 'UNKNOWN'\n\t   END AS [RELATED_TO]"
