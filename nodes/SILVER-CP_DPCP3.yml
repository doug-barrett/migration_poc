          LEFT JOIN {{ ref(''BRONZE'', ''REF360_CLASS_OF_BUSINESS'') }} ref360_class_of_business ON ref360_class_of_business.CODE = cp_dqcp1.CLASS_OF_BUSN_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_REGISTER'') }} ref360_register ON ref360_register.CODE = cp_dqcp1.REGISTER_CODE

