          LEFT JOIN {{ ref(''BRONZE'', ''REF360_COUNTRY_CODE'') }} ref360_country_code ON ref360_country_code.CODE = cp_dqcp1.COUNTRY_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_LODGEMENT_METHOD'') }} ref360_lodgement_method ON ref360_lodgement_method.CODE = cp_dqcp1.LDGMNT_METHOD_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''CP_PRODUCT_CONVERT'') }} cp_product_convert ON cp_product_convert.TABLE_CODE = cp_dqcp1.BASIC_PLAN_CODE AND cp_product_convert.ANNUITY_TYPE_CODE = cp_dqcp1.ANNUITY_TYPE_CODE

