    sourceMapping:
      - aliases:
          V_PREB_CUTOFFPOLICY_SUMMARY_V2: 56a40fc3-8c2d-4a24-a4aa-15159872082a
          BVSTG_MONTHS_TO_REFRESH: e21cb88f-ba6c-4539-b99b-b6b165b74e58
          DS_POLICYSUMMARY_V2: 9a05931f-0fe2-4275-8b38-8e88eb9c6968
          BVSTG_CUSTOMER_TO_REFRESH: 90b8ce37-bcd1-4ba2-bda7-cfcf723b20ac
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_CUTOFFPOLICY_SUMMARY_V2') }} AS SELECT bvstg_months_to_refresh.cal_Month ,
                   bvstg_months_to_refresh.cal_Month_no ,
                   bvstg_months_to_refresh.cal_year ,
                   MIN(bvstg_months_to_refresh.Min_Date) AS StartMonthDate ,
                   MAX(bvstg_months_to_refresh.Max_Date) AS CutoffDate ,
                   ds_policysummary_v2.Policyid ,
                   MAX(ds_policysummary_v2.wasmigrated) wasmigrated ,
                   MIN(ds_policysummary_v2.PolicyNumber) AS PolicyNumber ,
                   MAX(PolicyStatus) AS PolicyStatus ,
                   MIN(ds_policysummary_v2.StartDate) AS StartDate ,
                   CASE WHEN SUM(CASE WHEN ds_policysummary_v2.EndDate IS NULL THEN 1 ELSE 0 END) > 0 THEN NULL
                        ELSE MAX(EndDate)
                         END EndDate ,
                   ds_policysummary_v2.SourceDB ,
                   MAX(ds_policysummary_v2.Status_Standard) AS Status_Standard ,
                   SUM(CASE WHEN ds_policysummary_v2.graceperiod_startdate <= bvstg_months_to_refresh.max_date AND ds_policysummary_v2.graceperiod_enddate >= bvstg_months_to_refresh.min_date THEN 1 ELSE 0 END) AS grace_period
              FROM {{ ref('STAGE','BVSTG_MONTHS_TO_REFRESH') }} bvstg_months_to_refresh
             INNER JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
                ON (IFNULL(ds_policysummary_v2.enddate,CURRENT_DATE()) >= bvstg_months_to_refresh.min_date AND ds_policysummary_v2.startdate<= bvstg_months_to_refresh.max_date)
                OR (ds_policysummary_v2.graceperiod_startdate <= bvstg_months_to_refresh.max_date AND ds_policysummary_v2.graceperiod_enddate >= bvstg_months_to_refresh.min_date)
             INNER JOIN (
                    SELECT DISTINCT customerid,
                           sourcedb
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                   ) bvstg_customer_to_refresh
                ON IFNULL(bvstg_customer_to_refresh.customerid,'') = IFNULL(ds_policysummary_v2.customerid,'')
               AND bvstg_customer_to_refresh.sourcedb = ds_policysummary_v2.sourcedb
             GROUP BY bvstg_months_to_refresh.cal_Month ,
                      bvstg_months_to_refresh.cal_Month_no ,
                      bvstg_months_to_refresh.cal_year ,
                      ds_policysummary_v2.Policyid ,
                      ds_policysummary_v2.SourceDB
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_MONTHS_TO_REFRESH
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: STAGE
            nodeName: BVSTG_CUSTOMER_TO_REFRESH
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','BVSTG_MONTHS_TO_REFRESH') }}
            {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
            {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
        name: V_PREB_CUTOFFPOLICY_SUMMARY_V2
        noLinkRefs: []
