        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_MONTHLY_PREM_STATE') }} AS SELECT State ,
                   CASE WHEN SINGLE_CAR_FLAG = 1 THEN 'Single'
                        ELSE 'Multple'
                         END Vehicle ,
                   COUNT(1) Counts ,
                   MEDIAN(MONTHLYWRITTENPREMIUM) MedianMWP ,
                   AVG(MONTHLYWRITTENPREMIUM) AverageMWP ,
                   STDDEV(MONTHLYWRITTENPREMIUM) StdevMWP
              FROM {{ ref('STAGE','BVSTG_MONTHLY_PREMIUM') }}
             WHERE CREATEDDATE >= CURRENT_DATE -90
               AND State NOT IN('DC','Missing')
             GROUP BY State ,
                      CASE WHEN SINGLE_CAR_FLAG = 1 THEN 'Single'
                           ELSE 'Multple'
                            END
