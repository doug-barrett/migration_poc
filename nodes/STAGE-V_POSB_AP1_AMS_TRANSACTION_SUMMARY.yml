        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_AP1_AMS_TRANSACTION_SUMMARY') }} AS SELECT a.*,
                   c.AP1_CUSTOMER_CIGHID
              FROM RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY a
             INNER JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 c
                ON a.CustomerID = c.CustomerID
              LEFT JOIN (
                    SELECT DISTINCT t.TransactionID
                      FROM RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY t
                      LEFT JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 c
                        ON t.CustomerID = c.CustomerID
                     INNER JOIN RETAIL_PROD.SCH_EDW.DS_POLICYSUMMARY_V2 a
                        ON c.AP1_CUSTOMER_CIGHID = a.CustomerID
                       AND (IFNULL(a.last_policynumber,a.policynumber) = t.policynumber OR (a.carriername like '%Affirmative%' AND left(IFNULL(a.last_policynumber,a.policynumber),10) = left(t.policynumber,10)) OR (a.carriername like '%Founders%' AND right(IFNULL(a.last_policynumber,a.policynumber),6) = right(t.policynumber,6)) OR (a.carriername like '%Unique%' AND right(IFNULL(a.last_policynumber,a.policynumber),7) = right(t.policynumber,7)) OR ((a.carriername like '%American%' OR a.carriername like '%American Freedom%') AND right(left(IFNULL(a.last_policynumber,a.policynumber),10),7) = right(left(t.policynumber,10),7)) OR (a.carriername like '%United%' AND left(IFNULL(a.last_policynumber,a.policynumber),4) = left(t.policynumber,4) AND right(IFNULL(a.last_policynumber,a.policynumber),6) = right(t.policynumber,6)) OR (a.carriername like '%USAgencies%' AND left(IFNULL(a.last_policynumber,a.policynumber),7) = left(t.policynumber,7)) OR (a.carriername like '%National%' AND left(IFNULL(a.last_policynumber,a.policynumber),10) = left(t.policynumber,10)) OR (a.carriername like '%Falcon%' AND left(IFNULL(a.last_policynumber,a.policynumber),10) = left(t.policynumber,10)) OR (a.carriername like '%Traders%' AND left(IFNULL(a.last_policynumber,a.policynumber),10) = left(t.policynumber,10)) OR (a.carriername like '%Echelon%' AND left(IFNULL(a.last_policynumber,a.policynumber),11) = left(t.policynumber,11)))
                     WHERE t.NBTRANSACTIONID IS NULL
                       AND t.TRANSACTIONTYPE = 'Renewal'
                       AND c.AP1_CUSTOMER_CIGHID IS NOT NULL
                   ) b
                ON a.TransactionID = b.TransactionID
             WHERE a.NBTRANSACTIONID IS NULL
               AND a.TRANSACTIONTYPE = 'Renewal'
               AND c.AP1_CUSTOMER_CIGHID IS NOT NULL
               AND b.TransactionID IS NULL
               AND a.organizationcode IN('USAAL','USALA','FWYIL')
               AND a.isVoid = 0
               AND a.isRowdeleted = 0
        dependencies: []
