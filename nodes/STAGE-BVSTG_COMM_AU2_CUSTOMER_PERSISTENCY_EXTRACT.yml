                   bvstg_comm_0au2_customer_persistency_extract_1.AgencyName AS agencyname1,
                   bvstg_comm_0au2_customer_persistency_extract_1.TerritoryManagerName AS TerritoryManagerName1
              FROM {{ ref('STAGE','BVSTG_COMM_0AU2_CUSTOMER_PERSISTENCY_EXTRACT') }} bvstg_comm_0au2_customer_persistency_extract -- from bvstg_comm_0au2_customer_persistency_extract   left join    (SELECT DISTINCT POLICYNUMBERFORMATTED, CARRIERDISPLAYNAME,STATECODE,AgencyName,TerritoryManagerName ,customerid        from       (SELECT DISTINCT POLICYNUMBERFORMATTED, CARRIERDISPLAYNAME,STATECODE,AgencyName,TerritoryManagerName ,customerid,          row_number() over (partition by policynumberformatted, CARRIERDISPLAYNAME                            order by effectivedate,created,customerid) AS R         FROM         (SELECT POLICYNUMBERFORMATTED, CARRIERDISPLAYNAME, EFFECTIVEDATE,CREATED,CUSTOMERID,STATECODE,              AgencyName,TerritoryManagerName       from {{ ref('STAGE','BVSTG_COMM_0AU2_CUSTOMER_PERSISTENCY_EXTRACT') }}          -- from bvstg_comm_0au2_customer_persistency_extract      WHERE STATECODE IS NOT NULL        )        )     where R=1      ) bvstg_comm_0au2_customer_persistency_extract_1  on bvstg_comm_0au2_customer_persistency_extract.POLICYNUMBERFORMATTED=bvstg_comm_0au2_customer_persistency_extract_1.POLICYNUMBERFORMATTED  and bvstg_comm_0au2_customer_persistency_extract.CARRIERDISPLAYNAME=bvstg_comm_0au2_customer_persistency_extract_1.CARRIERDISPLAYNAME  and bvstg_comm_0au2_customer_persistency_extract.customerid=bvstg_comm_0au2_customer_persistency_extract_1.customerid     ) ds_policysummary_v2         left join       -- "RETAIL_PROD"."SCH_BVSTAGE"."V_BVSTG_COMM_LOB_MAPPING" v_bvstg_comm_lob_mapping      {{ ref('STAGE','V_BVSTG_COMM_LOB_MAPPING') }} v_bvstg_comm_lob_mapping          on ds_policysummary_v2.lineofbusinesstype = v_bvstg_comm_lob_mapping.lob     where customerid is not null
        name: BVSTG_COMM_AU2_CUSTOMER_PERSISTENCY_EXTRACT
        noLinkRefs: []
