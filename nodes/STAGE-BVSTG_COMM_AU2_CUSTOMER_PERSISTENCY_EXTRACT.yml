                   ifnull(ds_ram_retail_repository.OnlineBinding, 0) IsOnlineBinding,
                   ifnull(ds_ram_retail_repository1.Premium_finance_flag, 0) Premium_finance_flag
              FROM (SELECT DISTINCT ds_policysummary_v2.policynumberformatted,
                   ds_policysummary_v2.carrierdisplayname AS carriername,
                   customerid,
                   effectivedate,
                   created,
                   sourcedb,
                   customer_type,
                   leadtype,
                   CASE WHEN v_bvstg_comm_lob_mapping.lob_mapped IS NULL OR trim(v_bvstg_comm_lob_mapping.lob_mapped) = '' THEN 'Missing'
                        ELSE v_bvstg_comm_lob_mapping.lob_mapped
                         END AS lob_mapped,
                   ds_policysummary_v2.agencyname1 AS agencyname,
                   ds_policysummary_v2.statecode1 AS statecode,
                   source_table,
                   islegacytransaction,
                   bia_Statusdate,
                   expirationdate,
                   producerid,
                   producer,
