    sourceMapping:
    - aliases:
        CV_FISCALCALENDAR: a389b91c-7e9f-5aba-8f87-dbc28b448aa3
        CV_LU_CURRENCY_TYPE: 4d4bf976-6875-595c-9243-cfc4ced45a37
        CV_CURRENCY_SPOT_RATE: 4c1534ce-e7e3-52eb-a6ab-dc1c12120516
        HV_OPEN_ORDER_LINE_HIST: 4d279a5d-9e5d-55ab-a947-218f445bad48
        CV_M_LOCATION: 891a503a-7199-5681-8d27-0b540ae1115d
        CV_M_OPEN_ORDER_HIST: 400be038-eccd-516f-9cb4-60b111a2ed22
        CV_M_CUSTOMER: 7eec5229-c442-57bc-ad42-a176a0706d49
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: CV_FISCALCALENDAR
        - locationName: GOLD
          nodeName: CV_LU_CURRENCY_TYPE
        - locationName: GOLD
          nodeName: CV_CURRENCY_SPOT_RATE
        - locationName: GOLD
          nodeName: HV_OPEN_ORDER_LINE_HIST
        - locationName: GOLD
          nodeName: CV_M_LOCATION
        - locationName: GOLD
          nodeName: CV_M_OPEN_ORDER_HIST
        - locationName: GOLD
          nodeName: CV_M_CUSTOMER
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'HV_OPEN_ORDER_LINE_HIST') }} "HV_OPEN_ORDER_LINE_HIST"
           
          INNER JOIN {{ ref('GOLD', 'CV_FISCALCALENDAR') }} "CV_FISCALCALENDAR" 
          ON CV_FISCALCALENDAR.CALENDAR_DATE BETWEEN HV_OPEN_ORDER_LINE_HIST.EFFECTIVE_BEGIN_DATE AND HV_OPEN_ORDER_LINE_HIST.EFFECTIVE_END_DATE
          
          INNER JOIN (SELECT Company_Code, Contract_Id, Order_Line_Num, MAX(Effective_End_Date) AS Max_End_Date  
           FROM {{ ref('GOLD', 'HV_OPEN_ORDER_LINE_HIST') }} "HV_OPEN_ORDER_LINE_HIST" GROUP BY Company_Code, Contract_Id, Order_Line_Num)  OPEN_ORDER_LINE_MAX
           ON   HV_OPEN_ORDER_LINE_HIST.Company_Code = OPEN_ORDER_LINE_MAX.Company_Code 
           AND HV_OPEN_ORDER_LINE_HIST.Contract_Id = OPEN_ORDER_LINE_MAX.Contract_Id 
           AND HV_OPEN_ORDER_LINE_HIST.Order_Line_Num = OPEN_ORDER_LINE_MAX.Order_Line_Num
          
           
          INNER JOIN {{ ref('GOLD', 'CV_M_OPEN_ORDER_HIST') }} "CV_M_OPEN_ORDER_HIST"
          ON   HV_OPEN_ORDER_LINE_HIST.CONTRACT_ID = CV_M_OPEN_ORDER_HIST.CONTRACT_ID
          AND CV_FISCALCALENDAR.CALENDAR_DATE BETWEEN CV_M_OPEN_ORDER_HIST.EFFECTIVE_BEGIN_DATE AND CV_M_OPEN_ORDER_HIST.EFFECTIVE_END_DATE
            
          INNER JOIN {{ ref('GOLD', 'CV_M_LOCATION') }} "CV_M_LOCATION"
          ON CV_M_OPEN_ORDER_HIST.LOCATION_ID = CV_M_LOCATION.LOCATION_ID
            
          INNER JOIN {{ ref('GOLD', 'CV_M_CUSTOMER') }} "CV_M_CUSTOMER"
          ON CV_M_OPEN_ORDER_HIST.PARTY_ID = CV_M_CUSTOMER.PARTY_ID
            
          INNER JOIN {{ ref('GOLD', 'CV_CURRENCY_SPOT_RATE') }} "CV_CURRENCY_SPOT_RATE" 
          ON CV_FISCALCALENDAR.CALENDAR_MONTH = CV_CURRENCY_SPOT_RATE.REPORTING_MONTH 
          AND HV_OPEN_ORDER_LINE_HIST.CURRENCY_CODE = CV_CURRENCY_SPOT_RATE.FROM_CURRENCY_CODE
          
          INNER JOIN {{ ref('GOLD', 'CV_LU_CURRENCY_TYPE') }} "CV_LU_CURRENCY_TYPE" 
           ON CV_CURRENCY_SPOT_RATE.TO_CURRENCY_CODE = CV_LU_CURRENCY_TYPE.CURRENCY_CODE
           
          WHERE CV_CURRENCY_SPOT_RATE.CURRENCY_CONVERSION_TYPE_CODE IN ('C','H')
