      - aliases:
          V_S_AMS_CUSTOMER_MROC_CURRENT: d1ccf0ba-7fed-4b66-9f75-f72be0ab3eba
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_S_AMS_CUSTOMER_MROC_CURRENT
        join:
          joinCondition: |-
            FROM (
                    SELECT MD5(UPPER(REPLACE(REPLACE(CONCAT(IFNULL(firstname,''),' ',IFNULL(lastname,''))|| CONCAT(IFNULL(addr1,''),IFNULL(city,''),IFNULL(State,''),IFNULL(zipcode,'')),' ',''),',',''))) AS CustomerID ,
