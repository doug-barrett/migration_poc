                           CAST(custno AS varchar(50)) AS customerno ,
                           'Unknown' AS customertype ,
                           'Unknown' AS CustomerStatus ,
                           UPPER(IFNULL(firstname,'Unknown')) AS firstname ,
                           UPPER(IFNULL(midname,'Unknown')) AS middlename ,
                           UPPER(IFNULL(lastname,'Unknown')) AS lastname ,
                           UPPER(IFNULL(CONCAT(firstname,' ',lastname),'Unknown')) AS FullName ,
                           UPPER(IFNULL(sex,'Unknown')) AS Gender ,
                           'CIGH' AS organizationname ,
                           'CIGH' AS organizationcode ,
                           '' AS Documentlanguagetype ,
                           '' AS Verballanguagetype ,
                           TO_DATE(dob) AS dob ,
                           '' AS licensenumber ,
                           email ,
                           '' AS isemaildeclined ,
                           UPPER(IFNULL(addr1,'Unknown')) AS Street ,
                           UPPER(IFNULL(City,'Unknown')) AS City ,
                           UPPER(IFNULL(State,'Unknown')) AS State ,
                           UPPER(IFNULL(zipcode,'Unknown')) AS zip ,
