      - locationName: GOLD
        nodeName: D_ObligationLocation
      - locationName: GOLD
        nodeName: D_Employee
      join:
        joinCondition: |-
          FROM {{ ref('SILVER', 'I_SHP_ObligationReference') }} "I_SHP_ObligationReference"
          LEFT JOIN {{ ref('SILVER', 'I_SHP_SharepointListItem') }} "I_SHP_SharepointListItem"
            ON I_SHP_OBLIGATIONREFERENCE.LINKEDDOCUMENT = I_SHP_SHAREPOINTLISTITEM.LISTLINK
          LEFT JOIN {{ ref('GOLD', 'D_ObligationLocation') }} "D_ObligationLocation"
            ON D_OBLIGATIONLOCATION.OBLIGATIONLOCATION = I_SHP_SHAREPOINTLISTITEM.DEPOT
          LEFT JOIN {{ ref('GOLD', 'D_Employee') }} "D_Employee"
            ON EMAIL = I_SHP_SHAREPOINTLISTITEM.RESPONSIBLEPERSON
          WHERE I_SHP_OBLIGATIONREFERENCE.VERIFICATIONTYPE = 'SHAREPOINT LIST'  AND I_SHP_OBLIGATIONREFERENCE.SCOPE = 'DEPOT'
