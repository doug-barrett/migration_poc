        join:
          joinCondition: |-
            FROM {{ ref('NP','F_INVENTORYTRANSACTION') }} F_INVENTORYTRANSACTION
              LEFT JOIN {{ ref('NP','D_BUSINESSUNIT') }} D_BUSINESSUNIT
                ON F_INVENTORYTRANSACTION.D_BUSINESSUNIT_KEY = D_BUSINESSUNIT.D_BUSINESSUNIT_KEY
              LEFT JOIN {{ ref('NP','D_INVENTORY') }} D_INVENTORY
                ON F_INVENTORYTRANSACTION.D_INVENTORY_KEY = D_INVENTORY.D_INVENTORY_KEY
              LEFT JOIN {{ ref('NP','D_BRANCHPLANT') }} D_BRANCHPLANT
                ON F_INVENTORYTRANSACTION.D_BRANCHPLANT_KEY = D_BRANCHPLANT.D_BRANCHPLANT_KEY
              LEFT JOIN {{ ref('NP','D_DATE') }} D_DATE
                ON F_INVENTORYTRANSACTION.D_DATE_KEY = D_DATE.D_DATE_KEY
              LEFT JOIN {{ ref('NP','D_DOCUMENTTYPE') }} D_DOCUMENTTYPE
                ON F_INVENTORYTRANSACTION.D_DOCUMENTTYPE_KEY = D_DOCUMENTTYPE.D_DOCUMENTTYPE_KEY
             GROUP BY F_INVENTORYTRANSACTION.D_INVENTORY_KEY ,
                      F_INVENTORYTRANSACTION.D_BRANCHPLANT_KEY ,
                      F_INVENTORYTRANSACTION.D_BUSINESSUNIT_KEY ,
                      D_BUSINESSUNIT.BUSINESSUNITCODE ,
