    sourceMapping:
    - aliases:
        SRC_RASUSCFL: 17dc315e-1a04-5c06-bf0f-5c06d1945960
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: SRC_RASUSCFL
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'SRC_RASUSCFL') }} "SRC_RASUSCFL"
          
          WHERE N0CMP = 'U1'
              AND Aud_Time <= (SELECT MAX(Batch_End) FROM "DOUG_POC"."DP001"."CDC_BATCH")
              AND Aud_Time > (SELECT MAX(Batch_Start) FROM "DOUG_POC"."DP001"."CDC_BATCH")
              AND (Aud_Code <> 'F' OR (Aud_Code IS NULL AND Aud_Type = 'RR'))
          
          QUALIFY RANK() 
              OVER (PARTITION BY  N0CMP, N0SUS0
              ORDER BY AUD_TIME DESC, AUD_SEQNO DESC, CASE  
              WHEN Aud_Type in ('PT','PX','FI')      THEN 1 
              WHEN Aud_Type in ('UB','FB','FP','BR') THEN 2 
              WHEN Aud_Type in ('UP','UR')           THEN 3 
              WHEN Aud_Type in ('DL','FD')           THEN 4 
              WHEN Aud_Type in ('RR')                THEN 5  
              ELSE 0 END DESC) = 1
      name: ETL_SUSPEND_ORDER
