        config: {}
        dataType: NUMERIC(15,2)
        defaultValue: ""
        description: Count of values already recorded against the parent TC work order number. (In case the incremental load doesn't have it all coming through at the same time.
        name: EXISTINGPLANNEDCOSTS
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 056ac6dc-d90b-4c82-ae95-87857b3653f2
                stepCounter: 1668f4eb-9eec-4efd-8272-e999903f12f5
            transform: --ONLY LOOKING AT COSTS ON THE OFF CHANCE THAT THE COSTS AND REVENUE CANCEL EACH OTHER OUT  ISNULL(  (SELECT SUM(PLANNEDLABOUR + PLANNEDPLANT + PLANNEDMATERIALS + PLANNEDSUBCONTRACTORS)   FROM F_WORKORDERCOMPARISON   WHERE PARENTWORKORDER.D_WORKORDER_KEY = F_WORKORDERCOMPARISON.D_WORKORDER_KEY   AND PARENTWORKORDER.WORKORDERTYPECODE = 'TC')  ,0)
      - appliedColumnTests: {}
        columnReference:
          columnCounter: e265ae06-c30f-4d50-a056-a630b54a5e0c
          stepCounter: 2277bb36-7139-4601-a0af-fcd7755c9aa3
        config: {}
        dataType: VARCHAR(15)
        defaultValue: ""
        description: Indicates if the estimates for the TA work orders have been rolled up to their parent TC yet. Valid values are Yes or No.
        name: TAROLLED
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: --THIS IS THE SAME CODE AS FOR THE PREVIOUS THREE FIELDS  CASE   -- WE ONLY WANT TO BE PUTTING TA VALUES IN THE UNLOCKED FIELDS IF   --  THEY ARE PART OF THE CORRECT WORK ORDER HIERARCHY WITH A TC PARENT.   -- MIGHT JUST BE TESTING DATA, BUT THERE ARE A LOT OF WORK ORDERS WITH   --  INCORRECT HIERARCHIES AT THE MOMENT.   WHEN I_JDE_CURRENTPLANNEDWORKORDERS.WORKORDERTYPECODE <> 'TA' THEN 'YES'  --WHEN A PARENTED BY ITSELF IT HAS NOT BEEN ROLLED SHOULD ONLY HAVE TA'S PARENTED BY ITSELF WHEN NOT PACKAGED  WHEN I_JDE_CURRENTPLANNEDWORKORDERS.WORKORDERNUMBER = PARENTWORKORDER.PARENTWORKORDERNUMBER THEN 'NO'  WHEN PARENTWORKORDER.WORKORDERTYPECODE <> 'TC' THEN 'YES'   --ALWAYS USE THE PARENT TC VALUES IF IT IS NOT AT THE WORK ORDER CREATED STATUS   WHEN PARENTWORKORDER.WORKORDERSTATUSCODE <> 'FA' THEN 'YES'   --NO RECORDS FOR THE TC IN THE CURRENT LABOUR AND PLANT ESTIMATES   WHEN 0 <> (SELECT COUNT(*)              FROM I_JDE_WORKORDERROUTING              WHERE D_WORKORDER.PARENTWORKORDERNUMBER = I_JDE_WORKORDERROUTING.WORKORDERNUMBER              AND PARENTWORKORDER.WORKORDERTYPECODE = 'TC')   THEN 'YES'   --NO RECORDS FOR THE TC IN THE CURRENT MATERIALS AND OTHER ESTIMATES   WHEN 0 <> (SELECT COUNT(*)              FROM I_JDE_WORKORDERPARTSLIST              WHERE CONVERT(VARCHAR(24),D_WORKORDER.PARENTWORKORDERNUMBER) = I_JDE_WORKORDERPARTSLIST.WORKORDERNUMBER              AND PARENTWORKORDER.WORKORDERTYPECODE = 'TC')   THEN 'YES'   --NO RECORDS FOR THE TC FROM THE PREVIOUSLY LOADED DATASETS   --ONLY LOOKING AT COSTS ON THE OFF CHANCE THAT THE COSTS AND REVENUE CANCEL EACH OTHER OUT   WHEN 0 <> ISNULL(       (SELECT SUM(PLANNEDLABOUR + PLANNEDPLANT + PLANNEDMATERIALS + PLANNEDSUBCONTRACTORS)        FROM F_WORKORDERCOMPARISON        WHERE PARENTWORKORDER.D_WORKORDER_KEY = F_WORKORDERCOMPARISON.D_WORKORDER_KEY        AND PARENTWORKORDER.WORKORDERTYPECODE = 'TC')             ,0)   THEN 'YES'   ELSE 'NO' END
      - appliedColumnTests: {}
