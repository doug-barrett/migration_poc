      description: Use the Employee Business Unit for all PreWork Checks, for all
        others use the Business Unit of the work order if it can be identified, otherwise
        the business unit of the person doing the onsite observation.
      name: WorkOrderBusinessUnitCode
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE  --USE THE EMPLOYEE "business" "unit" FOR ALL PRE WORK RECORDS   WHEN
          "I_CRCVERIFICATIONMERGE".""VerificationType"" = 'PRE WORK CHECK'    THEN
          "TargetsBusinessUnitCode"  --USE THE "business" "unit" OF THE WORK ORDER
          IF WE CAN LINK TO THE WORK ORDER   WHEN COALESCE("D_WORKORDER".""BusinessUnitCode"",'UNKNOWN')
          = 'UNKNOWN'    THEN "TargetsBusinessUnitCode"   ELSE "D_WORKORDER".""BusinessUnitCode""  END
