          LEFT JOIN {{ ref('GOLD', 'D_CRCPreworkAction') }} "D_CRCPreworkAction"
            ON "I_CRCVerificationMerge"."Actions" = "D_CRCPreworkAction"."Action"
          LEFT JOIN {{ ref('GOLD', 'D_CRCPreworkOutcome') }} "D_CRCPreworkOutcome"
            ON "I_CRCVerificationMerge"."Outcome" = "D_CRCPreworkOutcome"."Outcome"
          LEFT JOIN {{ ref('GOLD', 'D_VerificationType') }} "D_VerificationType"
            ON "I_CRCVerificationMerge"."VerificationType" = "D_VerificationType"."VerificationType" AND "I_CRCVerificationMerge"."VerificationSubject" = "D_VerificationType"."VerificationSubject"
