          columnCounter: '11'
        transform: 'CASE 		WHEN ICPORFSL = ''unknown'' THEN 0 		WHEN LEFT(ICPORFSL, 3) = ''000'' AND 			ISNUMERIC(RIGHT(LEFT(D_SALESFORCELOCATIONS.ICPORFSL, 10), 6)) = 1 THEN RIGHT(LEFT(D_SALESFORCELOCATIONS.ICPORFSL, 10), 6) 		ELSE 0 	END'
