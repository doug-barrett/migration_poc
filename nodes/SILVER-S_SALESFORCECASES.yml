      - name: CASESCOUNT
        dataType: NUMBER(38,0)
        description: Cases Count
        columnReference:
          stepCounter: '1'
          columnCounter: '23'
        transform: '--EXCLUDING DELETED RECORDS FROM THE TOTAL COUNT CASE 		WHEN ISDELETED = ''True'' THEN 0 		ELSE 1 	END'
      - name: CASESCLOSEDCOUNT
        dataType: NUMBER(38,0)
        description: Cases Closed Count
        columnReference:
          stepCounter: '1'
          columnCounter: '24'
        transform: 'CASE 		WHEN ISCLOSED = ''True'' AND 			I_SALESFORCECASES.ISDELETED = ''False'' THEN 1 		ELSE 0 	END'
      - name: CASESOPENCOUNT
        dataType: NUMBER(38,0)
        description: Cases Open Count
        columnReference:
          stepCounter: '1'
          columnCounter: '25'
        transform: 'CASE 		WHEN ISCLOSED = ''False'' AND 			I_SALESFORCECASES.ISDELETED = ''False'' THEN 1 		ELSE 0 	END'
      - name: CASESTOTALLOAD
        dataType: DECIMAL(15,2)
        description: Cases Total Load
        columnReference:
          stepCounter: '1'
