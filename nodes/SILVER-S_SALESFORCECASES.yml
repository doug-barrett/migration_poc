    insertStrategy: INSERT
  metadata:
    sourceMapping:
      - name: source1
        join:
          joinCondition: 'FROM {{ ref(''SILVER'', ''I_SALESFORCECASES'') }}
LEFT JOIN {{ ref(''SILVER'', ''D_SALESFORCECASEDETAILS'') }} "D_SALESFORCECASEDETAILS"
    ON I_SALESFORCECASES.CASECODE = D_SALESFORCECASEDETAILS.CASECODE
LEFT JOIN {{ ref(''SILVER'', ''D_SALESFORCELOCATIONS'') }} "D_SALESFORCELOCATIONS"
    ON I_SALESFORCECASES.LOCATIONCODE = D_SALESFORCELOCATIONS.LOCATIONCODE
LEFT JOIN {{ ref(''SILVER'', ''D_SALESFORCERECORDTYPES'') }} "D_SALESFORCERECORDTYPES"
    ON I_SALESFORCECASES.RECORDTYPECODE = D_SALESFORCERECORDTYPES.RECORDTYPECODE
LEFT JOIN {{ ref(''SILVER'', ''D_DATE'') }} "D_DATE"
    ON I_SALESFORCECASES.CREATEDDATE = D_DATE.CALENDARDATE
LEFT JOIN {{ ref(''SILVER'', ''D_ICP'') }} "D_ICP"
    ON D_SALESFORCELOCATIONS.ICPORFSL = D_ICP.INSTALL
LEFT JOIN {{ ref(''SILVER'', ''D_SALESFORCEGENERATION'') }} "D_SALESFORCEGENERATION"
    ON I_SALESFORCECASES.GENERATIONTYPE = D_SALESFORCEGENERATION.GENERATIONTYPE AND I_SALESFORCECASES.ENERGYSTORAGETYPE = D_SALESFORCEGENERATION.ENERGYSTORAGETYPE
LEFT JOIN {{ ref(''SILVER'', ''D_SALESFORCEFEEDBACK'') }} "D_SALESFORCEFEEDBACK"
    ON I_SALESFORCECASES.FEEDBACKAREA = D_SALESFORCEFEEDBACK.FEEDBACKAREA AND I_SALESFORCECASES.TYPEOFCOMPLAINT = D_SALESFORCEFEEDBACK.TYPEOFCOMPLAINT
LEFT JOIN {{ ref(''SILVER'', ''D_CLOSEDDATE'') }} "D_CLOSEDDATE"
    ON I_SALESFORCECASES.CLOSEDDATE = D_CLOSEDDATE.CLOSEDDATE
WHERE LATESTRECORDNUMBER = 1'
        dependencies:
