        transform: '"I_SALESFORCECASES"."TOTALLOAD"'
      - name: CASESTOTALLOTS
        dataType: DECIMAL(15,2)
        description: Cases Total Lots
        columnReference:
          stepCounter: '1'
          columnCounter: '27'
        transform: '--NEED TO COUNT AS ONE WHEN RECORD TYPE IS  SUBDIVISION CASE CASE 		WHEN TOTALLOTS = 0 AND 			RECORDTYPE = ''Subdivision Application'' THEN 1 		ELSE TOTALLOTS 	END'
      - name: CASESCAPACITYCHARGELOAD
