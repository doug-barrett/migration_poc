            transform: |-
              /*
              CASE

              WHEN v_api_acumatica_mapping.AccountingRevenueType = 27
                  AND bvstg_au1_acumatica.StateCode IN (4,13,32,35)
                THEN 26

                WHEN v_api_acumatica_mapping.AccountingRevenueType IN (34)
                  AND bvstg_au1_acumatica.StateCode IN (4,13,32,35)
                  AND bvstg_au1_acumatica.Branch IN(424,509)
                THEN 35

                WHEN bvstg_au1_acumatica.Agency = 'OASAZ'
                  AND bvstg_au1_acumatica.AdditionalProductName = 'AZ - MVR Certified'
                  AND bvstg_au1_acumatica.Branch = 424
                THEN 20

                WHEN v_api_acumatica_mapping.AccountingRevenueType IN (28,34)
                  AND bvstg_au1_acumatica.StateCode IN (32,35)
                  AND bvstg_au1_acumatica.Branch = 424
                THEN 35


                WHEN bvstg_au1_acumatica.AdditionalProductName = 'AZ - MVR Certified'
                  AND bvstg_au1_acumatica.Branch = 509
                THEN 11
                WHEN v_api_acumatica_revenuedescription.RevenueDescriptionID in (2,4,6,7,25,26,28,34)
                  AND bvstg_au1_acumatica.Branch in (500,450)
                THEN 35
                WHEN v_api_acumatica_revenuedescription.ReportingAllocation not in ('Ancillary Revenue','Retain Commission')
                  AND bvstg_au1_acumatica.Branch in (424,507)
                  AND bvstg_au1_acumatica.StateCode in (32,35)
                THEN 35
                WHEN v_api_acumatica_revenuedescription.RevenueDescriptionID = 6
                  AND bvstg_au1_acumatica.Branch = 506
                  AND bvstg_au1_acumatica.StateCode in (18,41)
                THEN 35
                WHEN v_api_acumatica_revenuedescription.RevenueDescriptionID in (26,2,4,6)
                  AND bvstg_au1_acumatica.Branch = 507
                  AND bvstg_au1_acumatica.StateCode in (47)
                THEN 35

              ELSE v_api_acumatica_mapping.AccountingRevenueType
              END
              */ v_api_acumatica_mapping.AccountingRevenueType
