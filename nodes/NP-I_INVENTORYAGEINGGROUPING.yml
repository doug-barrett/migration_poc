            transform: |-
              CASE WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 30  THEN 1
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 60  THEN 2
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 90  THEN 3
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 120 THEN 4
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 150 THEN 5
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 180 THEN 6
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 210 THEN 7
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 240 THEN 8
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 270 THEN 9
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 300 THEN 10
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 330 THEN 11
                          WHEN DATEDIFF(DAY, CALENDARDATE, GETDATE()) < 360 THEN 12
                          ELSE 13
                           END AGEINGGROUPSORT
