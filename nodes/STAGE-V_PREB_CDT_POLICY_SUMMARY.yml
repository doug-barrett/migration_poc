    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          V_PREB_CDT_POLICY_SUMMARY: e4667208-8cb5-474a-a3a7-ff769c6b9ceb
          V_PREB_CDT_POLICY: 1fea6d87-c2fe-4f48-b322-762cd5f955a1
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_CDT_POLICY_SUMMARY') }} AS SELECT v_preb_cdt_policy.Policyid ,
                   COUNT(1) AS CountCDT ,
                   SUM(CASE WHEN v_preb_cdt_policy.Status IN ('NewBusinessLiabilityOnly','NewBusinessCompCollOnly','NewBusinessLiabilityCompColl') THEN 1 ELSE 0 END) AS NewBusiness ,
                   SUM(CASE WHEN v_preb_cdt_policy.Status='Endorsement' THEN 1 ELSE 0 END) AS Endorsement ,
                   SUM(CASE WHEN v_preb_cdt_policy.Status='NonRenewal' THEN 1 ELSE 0 END) AS NonRenewal ,
                   SUM(CASE WHEN v_preb_cdt_policy.Status='Rewrite' THEN 1 ELSE 0 END) AS Rewrite ,
                   SUM(CASE WHEN v_preb_cdt_policy.Status='Renewal' THEN 1 ELSE 0 END) AS Renewal ,
                   SUM(CASE WHEN v_preb_cdt_policy.Status='RenewalOffer' THEN 1 ELSE 0 END) AS RenewalOffer ,
                   SUM(CASE WHEN v_preb_cdt_policy.Status='Reinstatement' THEN 1 ELSE 0 END) AS Reinstatement ,
                   SUM(CASE WHEN v_preb_cdt_policy.Status='CancelPending' THEN 1 ELSE 0 END) AS CancelPending ,
                   SUM(CASE WHEN v_preb_cdt_policy.Status IN('CancelInsuredRequest','Lapse') THEN 1 ELSE 0 END) AS Cancelled ,
                   MAX(v_preb_cdt_policy_last.status) AS Last_cdt ,
                   MAX(v_preb_cdt_policy_last.StatusDate) AS Last_cdtEffectiveDate ,
                   MAX(v_preb_cdt_policy_last.created) AS Last_cdt_createdDate ,
                   MAX(v_preb_cdt_policy_status.status) AS Last_cdt_Status ,
                   MAX(v_preb_cdt_policy_status.StatusDate) AS Last_cdt_Statusdate
              FROM {{ ref('STAGE','V_PREB_CDT_POLICY') }} v_preb_cdt_policy
              LEFT JOIN {{ ref('STAGE','V_PREB_CDT_POLICY') }} v_preb_cdt_policy_last
                ON (v_preb_cdt_policy.policyid = v_preb_cdt_policy_last.policyid AND v_preb_cdt_policy_last.seqno = 1)
              LEFT JOIN {{ ref('STAGE','V_PREB_CDT_POLICY') }} v_preb_cdt_policy_status
                ON (v_preb_cdt_policy.policyid = v_preb_cdt_policy_status.policyid AND v_preb_cdt_policy_status.seqno_status = 1)
             GROUP BY v_preb_cdt_policy.Policyid
        dependencies:
          - locationName: STAGE
            nodeName: V_PREB_CDT_POLICY
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
