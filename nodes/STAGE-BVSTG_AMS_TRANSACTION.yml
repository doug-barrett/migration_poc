        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_AMS_AU3_BASICPOL_INFO') }} bvstg_ams_au3_BasicPol_info
             INNER JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AMS_CUSTOMER_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_AMS_CUSTOMER ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_customer_mroc_current
                ON bvstg_ams_au3_BasicPol_info.CustId = v_s_ams_customer_mroc_current.CustId
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AMS_GLDIVISION_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_GLDIVISION ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_gldivision_mroc_current
                ON bvstg_ams_au3_BasicPol_info.GLDivCode = v_s_ams_gldivision_mroc_current.GLDivCode
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AMS_GLBRANCH_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_GLBRANCH ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_glbranch_mroc_current
                ON bvstg_ams_au3_BasicPol_info.GLBrnchCode = v_s_ams_glbranch_mroc_current.GLBrnchCode
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AMS_GLGROUP_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_GLGROUP ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_glgroup_mroc_current
                ON v_s_ams_customer_mroc_current.GLGrpCode = v_s_ams_glgroup_mroc_current.GLGrpCode
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AMS_GLDEPARTMENT_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_GLDEPARTMENT ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_gldepartment_mroc_current
                ON v_s_ams_customer_mroc_current.GLDeptCode = v_s_ams_gldepartment_mroc_current.GLDeptCode
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AMS_LOBSETUP_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_LOBSETUP ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_lobsetup_mroc_current
                ON bvstg_ams_au3_BasicPol_info.PolicyType = v_s_ams_lobsetup_mroc_current.NameLOBS
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AMS_EMPLOYEE_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_EMPLOYEE ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_employee_mroc_current
                ON bvstg_ams_au3_BasicPol_info.ExecCode = v_s_ams_employee_mroc_current.EmpCode
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AMS_EMPLOYEE_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_EMPLOYEE ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_employee_mroc_current_EnteredBy
                ON bvstg_ams_au3_BasicPol_info.EntByID = v_s_ams_employee_mroc_current_EnteredBy.EmpCode
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AMS_TRANSACTION_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_AMS_TRANSACTION ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_transaction_mroc_current
                ON bvstg_ams_au3_BasicPol_info.TranId = v_s_ams_transaction_mroc_current.TranId
              LEFT JOIN (
