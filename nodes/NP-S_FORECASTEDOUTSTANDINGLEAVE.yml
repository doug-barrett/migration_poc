          joinCondition: |-
            FROM {{ ref('NP','I_BMPLOADPERIOD') }}
              LEFT OUTER JOIN {{ ref('NP','I_OUTSTANDINGLEAVE') }}
                ON I_BMPLOADPERIOD.BMPLOADPERIODNO >= I_OUTSTANDINGLEAVE.PERIODNUMBER
              LEFT OUTER JOIN {{ ref('NP','I_PG_EMPLOYEE') }}
                ON I_OUTSTANDINGLEAVE.EMPLOYEECODE = I_PG_EMPLOYEE.EMPLOYEECODE
              LEFT OUTER JOIN {{ ref('NP','I_EMPLOYEEACCRUEDLEAVE') }}
                ON I_BMPLOADPERIOD.BMPLOADPERIODNO >= I_EMPLOYEEACCRUEDLEAVE.BMPLOADPERIODNO
               AND I_OUTSTANDINGLEAVE.EMPLOYEECODE = I_EMPLOYEEACCRUEDLEAVE.EMPLOYEECODE
               AND I_OUTSTANDINGLEAVE.LEAVETYPECODE = I_EMPLOYEEACCRUEDLEAVE.LEAVETYPECODE
              LEFT OUTER JOIN {{ ref('NP','I_PG_EMPLLEAVEUNPROCESSEDGROUPED') }}
                ON I_BMPLOADPERIOD.BMPLOADPERIODNO = I_PG_EMPLLEAVEUNPROCESSEDGROUPED.PERIODNUMBER
               AND I_OUTSTANDINGLEAVE.EMPLOYEECODE = I_PG_EMPLLEAVEUNPROCESSEDGROUPED.EMPLOYEECODE
               AND I_OUTSTANDINGLEAVE.LEAVETYPECODE = I_PG_EMPLLEAVEUNPROCESSEDGROUPED.LEAVETYPECODE
