                ON I_BMPLOADPERIOD.BMPLOADPERIODNO = I_PG_EMPLLEAVEUNPROCESSEDGROUPED.PERIODNUMBER
               AND I_OUTSTANDINGLEAVE.EMPLOYEECODE = I_PG_EMPLLEAVEUNPROCESSEDGROUPED.EMPLOYEECODE
               AND I_OUTSTANDINGLEAVE.LEAVETYPECODE = I_PG_EMPLLEAVEUNPROCESSEDGROUPED.LEAVETYPECODE
