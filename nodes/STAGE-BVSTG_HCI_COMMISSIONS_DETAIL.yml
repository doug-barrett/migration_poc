             WHERE --DATE(ds_ram_retail_repository.createddate) >= DATEADD(MONTH,-1,DATEADD(DAY,1,last_day(DATEADD(day,-5,DATE(CURRENT_DATE()))))) and   DATE(ds_ram_retail_repository.createddate) >='2025-10-15'       and   ds_ram_retail_repository.carriername='PPO Plans'        AND ds_ram_retail_repository.sourcedb = 'AppOne'
