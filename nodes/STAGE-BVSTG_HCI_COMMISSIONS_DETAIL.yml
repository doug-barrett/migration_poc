        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_TRANSACTIONITEM ds_bvstg_ap1_transactionitem
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_HCI_AGENTS_CURRENT v_dlbv_cfa_hci_agents_current
                ON ds_bvstg_ap1_transactionitem.ULTIPROCREATEDBY = v_dlbv_cfa_hci_agents_current.EMPLOYEENUMBER
               AND v_dlbv_cfa_hci_agents_current.ISACTIVEHEALTHCARE = 1
             INNER JOIN RETAIL_PROD.SCH_EDW.DS_AGENT_KEY ag
                ON v_dlbv_cfa_hci_agents_current.EMPLOYEENUMBER =ag.employeenumber
               AND ag.rank_employeenumber=1
             INNER JOIN DATA_LAKE.BIA_ANALYTICS.HCI_COMPENSATION_NEW_PLAN TYPE
                ON 1=1
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE Office
                ON ag.OfficeCode = Office.OfficeCode
              LEFT JOIN (
                    SELECT OfficeCode,
                           EMPLOYEENUMBER,
                           EMPLOYEENAME
                      FROM RETAIL_PROD.SCH_EDW.DS_AGENT_KEY
                     WHERE JOBTITLE IN('Store Manager','Branch Manager')
                       AND HR_Status IN('Active','Rehire','New Hire')
                       AND rank_employeenumber=1 QUALIFY ROW_NUMBER() OVER (PARTITION BY OfficeCode ORDER BY EMPLOYEENUMBER) = 1
                   )StoreM
                ON ag.OfficeCode = StoreM.OfficeCode
             INNER JOIN RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY ds_ram_retail_repository
                ON ds_ram_retail_repository.transactionid = ds_bvstg_ap1_transactionitem.transactionid
             WHERE lower(ds_ram_retail_repository.lineofbusinesstype) like '%health%' --ds_bvstg_ap1_transactionitem.BIATRANSACTIONOFFICE = 'HCIBP'     and DATE(ds_bvstg_ap1_transactionitem.created) >='2025-10-15'  /*              AND (           ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0)           OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1             AND DATE(ds_bvstg_ap1_transactionitem.created) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(day,-5,DATE(CURRENT_DATE())))))                   )             )  */          AND ds_bvstg_ap1_transactionitem.DESCRIPTION ='Down Payment to Carrier'          and ds_bvstg_ap1_transactionitem.isvoid=0          and ds_ram_retail_repository.carriername !='PPO Plans'
        name: SRC_bvstg_hci_commissions_detail_1
        noLinkRefs: []
      - aliases:
