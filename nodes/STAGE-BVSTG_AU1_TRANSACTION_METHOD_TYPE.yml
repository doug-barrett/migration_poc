                          WHEN DS_BVSTG_AP1_PAYMENT.PAYMENTNAME = 'Cash'                                                                         THEN 'Store'
                          WHEN V_S_AP1_ROLE_MROC_CURRENT.USERID IS NOT NULL                                                                      THEN 'Phone'
                          WHEN DS_RAM_RETAIL_REPOSITORY.ENTBYID = '24'                                                                           THEN 'CDT System'
                          WHEN S_AP1_TRANSACTIONSTATUS_MROC.TransactionID IS NOT NULL                                                            THEN 'Store'
                          ELSE 'Store'
                           END
          - columnReferences: []
            transform: |-
