        config: {}
        dataType: VARCHAR(70)
        defaultValue: ""
        description: ""
        name: METHOD_TYPE
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN DS_RAM_RETAIL_REPOSITORY.ORGANIZATIONCODE IN ('OLBT', 'ODT', 'OLBA') OR PRIMARYAGENTNAME_BROKER = 'Turbo SVC_Web' THEN 'Online (Turbo)'
                          WHEN DS_RAM_RETAIL_REPOSITORY.ORGANIZATIONCODE LIKE ('%SSB%')                                                          THEN 'Phone (SSB)'
                          WHEN DS_RAM_RETAIL_REPOSITORY.ORGANIZATIONCODE IN ('INOW', 'ADMIN')                                                    THEN 'Phone (BackOffice)'
                          WHEN DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY IS NOT NULL                                                                 THEN 'Phone (Call Customer)'
                          WHEN DS_RETAIL_OFFICE.OFFICETYPE = 'Health Care Office'                                                                THEN 'Phone (HealthCare)'
                          WHEN DS_BVSTG_AP1_PAYMENT.PAYMENTNAME = 'Cash'                                                                         THEN 'Store (Cash)'
                          WHEN V_S_AP1_ROLE_MROC_CURRENT.USERID IS NOT NULL                                                                      THEN 'Phone (Role)'
                          WHEN DS_RAM_RETAIL_REPOSITORY.ENTBYID = '24'                                                                           THEN 'CDT System'
                          WHEN S_AP1_TRANSACTIONSTATUS_MROC.TransactionID IS NOT NULL                                                            THEN 'Store (ScanSystem)'
                          ELSE 'Store (Null)'
                           END
          - columnReferences: []
            transform: |-
              CASE WHEN V_DLBV_OSW_POLICYSALESLOG_CURRENT.SaleTypeName IS NOT NULL THEN V_DLBV_OSW_POLICYSALESLOG_CURRENT.SaleTypeName || ' - One Source Log'
                          WHEN ds_mkt_call_customer.CustomerID IS NOT NULL                THEN 'Phone (Call Customer)'
                          WHEN DS_AMS_TRANSACTIONDETAIL.PolicyID IS NOT NULL              THEN 'Store (Cash)'
                          ELSE 'Store (Null)'
                           END
          - columnReferences: []
            transform: 'NULL'
