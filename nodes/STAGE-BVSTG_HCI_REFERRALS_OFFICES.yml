    sourceMapping:
      - aliases:
          DS_RETAIL_OFFICE: 581aed87-ec65-482f-aa6f-9a04a9d54476
          V_PRE_AP1_OFFICE_MROC_CURRENT: e5ce8509-9088-4d01-a29e-88b15f985c43
          V_S_AP1_LEAD_MROC_CURRENT: 8249a218-0c61-42f5-bfae-40ec4b2fcf53
          DS_BVSTG_AP1_TRANSACTION: 775b2ac0-1ddf-4911-acec-8f2e83f395a8
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: STAGE
            nodeName: V_PRE_AP1_OFFICE_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_LEAD_MROC_CURRENT
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTION
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
             INNER JOIN "DATA_LAKE"."BIA_ANALYTICS"."HCI_OFFICE_GOALS" hci_office_goals
                ON hci_office_goals.OFFICECODE = ds_retail_office.OFFICECODE
             INNER JOIN {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} v_s_ap1_office_mroc_current
                ON v_s_ap1_office_mroc_current.OFFICECODE = ds_retail_office.OFFICECODE
              LEFT JOIN {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }} v_s_ap1_lead_mroc_current
                ON v_s_ap1_office_mroc_current.OFFICEID = v_s_ap1_lead_mroc_current.OFFICEID
               AND v_s_ap1_lead_mroc_current.ISROWDELETED = FALSE
               AND v_s_ap1_lead_mroc_current.LINEOFBUSINESSTYPEID = 423
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTION') }} ds_bvstg_ap1_transaction
                ON ds_bvstg_ap1_transaction.TRANSACTIONID = v_s_ap1_lead_mroc_current.TRANSACTIONID
             WHERE ds_retail_office.LOCATIONSTATUS = 'Open'
               AND ds_retail_office.OFFICETYPE IN ('Health Care Office', 'Retail', 'Web Office')
               AND (ds_retail_office.SalesVP IN ('Brian Lebeck', 'Michael Hatfield', 'Tara Scott', 'Tony Haraguchi','Steven Petrus') OR ds_retail_office.OfficeCode = 'HCIBP')
               AND v_s_ap1_lead_mroc_current.created IS NOT NULL
               AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND TO_DATE(v_s_ap1_lead_mroc_current.CREATED) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE())))))))
             GROUP BY ds_retail_office.SALESVP,
                      ds_retail_office.DISTRICTMANAGERNAME,
                      ds_retail_office.OFFICECODE,
                      TO_DATE(v_s_ap1_lead_mroc_current.CREATED),
                      hci_office_goals.LEADGOAL ,
                      hci_office_goals.SALEGOAL
        name: BVSTG_HCI_REFERRALS_OFFICES
        noLinkRefs: []
