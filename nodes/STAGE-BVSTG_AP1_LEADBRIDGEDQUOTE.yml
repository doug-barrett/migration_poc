             WHERE v_s_ap1_leadbridgedquote_mroc_current.CreatedBy!=1147 --AND DATE(v_s_ap1_leadbridgedquote_mroc_current.created) BETWEEN '2020-08-01' AND '2020-08-01'   QUALIFY ROW_NUMBER() OVER (PARTITION BY v_s_ap1_leadbridgedquote_mroc_current.LEADBRIDGEDQUOTEID             ORDER BY                                     CASE WHEN v_s_ap1_mastercarrier_mroc_current.ProgramITCCode IS NOT NULL THEN 1 ELSE 0 END,                                          ds_bvstg_ap1_loginstatus.created DESC,                                          ds_bvstg_ap1_loginstatus.userid,                                          ds_bvstg_ap1_loginstatus.OfficeCode             )=1
