        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_S_AP1_LEADBRIDGEDQUOTE_MROC_CURRENT') }} v_s_ap1_leadbridgedquote_mroc_current
             INNER JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} v_s_ap1_employee_mroc_current
                ON v_s_ap1_employee_mroc_current.UserID = v_s_ap1_leadbridgedquote_mroc_current.CreatedBy
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_LOGINSTATUS') }} ds_bvstg_ap1_loginstatus
                ON ds_bvstg_ap1_loginstatus.created >= Dateadd(DAY, -60,v_s_ap1_leadbridgedquote_mroc_current.Created)
               AND (ds_bvstg_ap1_loginstatus.created <= v_s_ap1_leadbridgedquote_mroc_current.Created)
               AND (ds_bvstg_ap1_loginstatus.userid = v_s_ap1_leadbridgedquote_mroc_current.CreatedBy)
             INNER JOIN {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} v_s_ap1_office_mroc_current
                ON v_s_ap1_office_mroc_current.OfficeCode = ds_bvstg_ap1_loginstatus.OfficeCode
             INNER JOIN {{ ref('STAGE','V_S_AP1_ORGANIZATION_MROC_CURRENT') }} v_s_ap1_organization_mroc_current
                ON (v_s_ap1_organization_mroc_current.OrganizationID = v_s_ap1_office_mroc_current.OrganizationID)
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."ACCORDITCQUOTE" accorditcquote
                ON (accorditcquote.BRIDGEDQUOTEID = v_s_ap1_leadbridgedquote_mroc_current.BRIDGEDQUOTEID)
              LEFT JOIN (
