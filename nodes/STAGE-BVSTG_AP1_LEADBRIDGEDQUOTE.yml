                       AND v_s_ap1_mastercarrier_mroc_current.ISROWDELETED = FALSE
                   )v_s_ap1_mastercarrier_mroc_current
                ON REPLACE(v_s_ap1_mastercarrier_mroc_current.ProgramITCCode,'-','') = REPLACE(accorditcquote.itc_companyid || accorditcquote.itc_programid,'-','')
