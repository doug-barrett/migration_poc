                           v_s_ap1_mastercarrier_mroc_current.mastercarrierid,
                           v_s_ap1_mastercarrier_mroc_current.carriername
                      FROM {{ ref('STAGE','V_S_AP1_PROGRAM_MROC_CURRENT') }} v_s_ap1_program_mroc_current
                      JOIN {{ ref('STAGE','V_S_AP1_CARRIER_MROC_CURRENT') }} v_s_ap1_carrier_mroc_current
                        ON v_s_ap1_program_mroc_current.carrierid = v_s_ap1_carrier_mroc_current.carrierid
                      JOIN {{ ref('STAGE','V_S_AP1_MASTERCARRIER_MROC_CURRENT') }} v_s_ap1_mastercarrier_mroc_current
                        ON v_s_ap1_carrier_mroc_current.mastercarrierid = v_s_ap1_mastercarrier_mroc_current.mastercarrierid
                     WHERE v_s_ap1_program_mroc_current.ISROWDELETED = FALSE
                       AND v_s_ap1_program_mroc_current.isActive = TRUE
