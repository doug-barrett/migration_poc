        dependencies:
          - locationName: EDW
            nodeName: DS_INTERACTIONSUMMARY
        join:
          joinCondition: |-
            EXTENDED
              FROM RETAIL_PROD.SCH_EDW.DS_INTERACTIONSUMMARY ds_interactionsummary
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_CALLSOURCE ds_mkt_callsource
                ON ds_interactionsummary.interactionidkey = ds_mkt_callsource.interactionidkey
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_LEAD_SOURCE ds_mkt_lead_source
                ON ds_interactionsummary.interactionidkey = SPLIT_PART(ds_mkt_lead_source.CallID, '-', 1) || '-' || SPLIT_PART(ds_mkt_lead_source.CallID, '-', 2)
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_LMS_MASTERLEAD_CURRENT v_dlbv_api_lms_masterlead_current
                ON v_dlbv_api_lms_masterlead_current.lms_lead_id = ds_mkt_lead_source.LMS_ID
              LEFT JOIN (
                    SELECT S_AP1_LEAD_MROC.LEADID ,
                           S_AP1_LEAD_MROC.LEADSTATUSTYPEID
                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC s_ap1_lead_mroc QUALIFY ROW_NUMBER() OVER (PARTITION BY S_AP1_LEAD_MROC.leadid ORDER BY dss_version DESC) = 1
                   ) s_ap1_lead_mroc
                ON s_ap1_lead_mroc.leadid = ds_mkt_lead_source.leadid
              LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEADSTATUSTYPE_MROC s_ap1_leadstatustype_mroc
                ON s_ap1_leadstatustype_mroc.leadstatustypeid = s_ap1_lead_mroc.leadstatustypeid
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION ds_pcce_termination_call_summary_session
                ON ds_pcce_termination_call_summary_session.id = ds_interactionsummary.interactionidkey
              LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_PHONECALL_MROC s_ap1_phonecall_mroc
                ON (CASE WHEN s_ap1_phonecall_mroc.callid LIKE '%-%' THEN split_part(s_ap1_phonecall_mroc.callid, '-', 1) || '-' || SPLIT_PART(s_ap1_phonecall_mroc.callid, '-', 2) ELSE s_ap1_phonecall_mroc.callid END) = ds_interactionsummary.interactionidkey
              LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_PHONECALL_MROC s_ap1_phonecall_mroc_1
                ON SPLIT_PART(s_ap1_phonecall_mroc_1.CallID, '-', 1) || '-' || SPLIT_PART(s_ap1_phonecall_mroc_1.CallID, '-', 2) = ds_interactionsummary.interactionidkey
              LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_PHONECALLDISPOSITION s_ap1_phonecalldisposition
                ON (IFNULL(s_ap1_phonecall_mroc.phonecallid, s_ap1_phonecall_mroc_1.phonecallid) = s_ap1_phonecalldisposition.phonecallid AND IFNULL(DATE (s_ap1_phonecall_mroc.created), DATE (s_ap1_phonecall_mroc_1.created)) = DATE (s_ap1_phonecalldisposition.created))
              LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.H_PHONECALLTYPE h_phonecalltype
                ON (h_phonecalltype.phonecalltypeid = s_ap1_phonecalldisposition.phonecalltypeid)
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_PHONECALLTYPE_CURRENT v_s_ap1_phonecalltype_current
                ON (v_s_ap1_phonecalltype_current.HK_H_PHONECALLTYPE = h_phonecalltype.HK_H_PHONECALLTYPE)
              LEFT JOIN (
                    SELECT interactionidkey ,
                           CustomerID ,
                           EMAIL ,
                           SOURCEDB_CUSTOMER
                      FROM RETAIL_PROD.SCH_EDW.DS_MKT_CALL_CUSTOMER QUALIFY ROW_NUMBER() OVER (PARTITION BY interactionidkey ORDER BY created DESC) = 1
                   ) ds_mkt_call_customer
                ON (ds_mkt_call_customer.interactionidkey = ds_interactionsummary.interactionidkey AND ds_mkt_lead_source.SourceDB = ds_mkt_call_customer.SOURCEDB_CUSTOMER)
             WHERE (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND DATEDIFF(DAY,ds_interactionsummary.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}'+15) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND DATEDIFF(DAY,ds_mkt_lead_source.DSS_UPDATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}'+15)) QUALIFY ROW_NUMBER() OVER (
            PARTITION BY CASE WHEN ds_mkt_lead_source.LeadID IS NOT NULL THEN ds_mkt_lead_source.LeadID
                        ELSE ds_interactionsummary.interactionidkey
                         END
             ORDER BY CASE WHEN ds_mkt_lead_source.LeadID IS NOT NULL THEN 1
                           ELSE 2
                            END,
                      CASE WHEN ds_mkt_lead_source.isSale=1     THEN 1
                           WHEN ds_mkt_lead_source.isTransfer=1 THEN 2
                           WHEN ds_mkt_lead_source.isQuote=1    THEN 3
                           ELSE 4
                            END,
                      v_
