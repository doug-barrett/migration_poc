    sourceMapping:
      - aliases:
          BVSTG_AU23_CSPR: 399b8f5e-f717-49c5-894e-6aaf8f1577cd
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU23_CSPR
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM (
                    SELECT bvstg_au23_cspr.*,
                           CASE WHEN bvstg_au23_cspr.OFFICECODE_OLD IS NULL THEN NULL
                                ELSE ifnull(ds_retail_office.active_officecode, bvstg_au23_cspr.OFFICECODE_OLD)
                                 END officecode
                      FROM (
                            SELECT *,
                                   CASE WHEN split_part(division,'_',2) IN ('NSA','DNSA','Dealer Service') THEN concat(concat(split_part(division,'_',1),'_'),'NSA')
                                        ELSE division
                                         END division_new
                              FROM {{ ref('STAGE','BVSTG_AU23_CSPR') }} bvstg_au23_cspr
                           ) bvstg_au23_cspr
                      LEFT JOIN (
                            SELECT DISTINCT officecode,
                                   active_officerelatedtoofficestatusdetails AS active_officecode
                              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                           ) ds_retail_office
                        ON bvstg_au23_cspr.OFFICECODE_old = ds_retail_office.Officecode
                   ) bvstg_au23_cspr
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                   ) ds_retail_office
                ON bvstg_au23_cspr.officecode = ds_retail_office.officecode
