      join:
        joinCondition: |-
          FROM {{ ref('OPC', 'OPC_Account') }} "OPC_Account"
          LEFT JOIN {{ ref('DIM', 'AccountGeography') }} "AccountGeography"
            ON OPC_Account.ForceId = AccountGeography.ForceId
          LEFT JOIN {{ ref('DIM', 'Sector') }} "Sector"
            ON OPC_Account.SectorKey = Sector.SectorKey
          LEFT JOIN {{ ref('OPC', 'OPC_vwAggForceIdUsageStats_All') }} "OPC_vwAggForceIdUsageStats_All"
            ON OPC_Account.ForceId = OPC_vwAggForceIdUsageStats_All.ForceId
          LEFT JOIN {{ ref('OPC', 'OPC_vwAggLevel1ForceIdUsageStats_Lifetime_Contacts') }} "OPC_vwAggLevel1ForceIdUsageStats_Lifetime_Contacts"
            ON OPC_Account.ForceId = OPC_vwAggLevel1ForceIdUsageStats_Lifetime_Contacts.ForceId
          LEFT JOIN {{ ref('OPC', 'OPC_AggForceId_LTM') }} "OPC_AggForceId_LTM"
            ON OPC_Account.ForceId = OPC_AggForceId_LTM.ForceId
          LEFT JOIN {{ ref('OPC', 'OPC_AggForceId_PY_LTM') }} "OPC_AggForceId_PY_LTM"
