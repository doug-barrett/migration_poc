    sourceMapping:
      - aliases:
          DS_AP1_TRANSACTIONSUMMARY: eb40b9b4-16a8-47be-8699-9c6c04540ac6
          S_AP1_ACTIVITY_MROC: f75f903c-33e9-4d3b-9201-e920921ecbf2
          H_ACTIVITYTYPE: b33265bf-7da1-413b-ad59-bc76a1636500
          S_AP1_ACTIVITYTYPE: e3598a9e-aa16-448a-9501-0ae88c7ece0c
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: DATA_VAULT
            nodeName: S_AP1_ACTIVITY_MROC
          - locationName: DATA_VAULT
            nodeName: H_ACTIVITYTYPE
          - locationName: DATA_VAULT
            nodeName: S_AP1_ACTIVITYTYPE
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
             INNER JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_ACTIVITY_MROC') }}
                     WHERE 1=1 QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_ACTIVITY ORDER BY DSS_VERSION DESC)=1
                   ) s_ap1_activity_mroc
                ON (ds_ap1_transactionsummary.TransactionID = s_ap1_activity_mroc.TransactionID)
             INNER JOIN {{ ref('DATA_VAULT','H_ACTIVITYTYPE') }} h_activitytype
                ON s_ap1_activity_mroc.activitytypeid = h_activitytype.activitytypeid
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_ACTIVITYTYPE') }} s_ap1_activitytype
                ON h_activitytype.HK_H_ACTIVITYTYPE = s_ap1_activitytype.HK_H_ACTIVITYTYPE
             WHERE ds_ap1_transactionsummary.isVoid=0
               AND s_ap1_activitytype.activitytypename IN ('QC - QC Mistake', 'QC - Mistake', 'QC - Dispute Request', 'QC - Dispute Request Approved', 'QC - Dispute Request Denied', 'QC - Dispute QC Error (First Dispute)', 'QC - Dispute QC Error (Second/Final Dispute)', 'QC - System Issues', 'QC - Exception', 'QC - Sales Exception (VP Approval)', 'QC - Second Review (Sup Only)', 'QC - System Issues (All) Exception')
               AND DATE(s_ap1_activity_mroc.CREATED)>='2020-01-01'
               AND ds_ap1_transactionsummary.ISCORPORATEVOID=0
             GROUP BY ds_ap1_transactionsummary.transactionID ,
                      ds_ap1_transactionsummary.BIAPRIMARYAGENTOFFICE ,
                      YEAR(s_ap1_activity_mroc.CREATED) ,
                      Month(s_ap1_activity_mroc.CREATED) ,
                      TO_CHAR(s_ap1_activity_mroc.CREATED, 'MMMM') ,
                      ds_ap1_transactionsummary.TransactionType ,
                      ds_ap1_transactionsummary.PRIMARYAGENTFULLNAME ,
                      ds_ap1_transactionsummary.lineofbusinesstype
        name: BVSTG_AP1_TRANSACTIONERROR_DISPUTES
        noLinkRefs: []
