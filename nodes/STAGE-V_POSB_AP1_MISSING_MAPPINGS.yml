        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_AP1_MISSING_MAPPINGS') }} AS SELECT a.* ,
                   CLASSIFICATIONGROUP,
                   FEEREVENUE
              FROM (
                    SELECT DISTINCT c.TRANSACTIONTYPE,
                           d.feetype,
                           d.feename,
                           a.ADDITIONALPRODUCTNAME
                      FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ANCILLARYPRODUCT_AC a
                     INNER JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_POLICY b
                        ON a.ap1_policyid = b.policyid
                     INNER JOIN RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY c
                        ON b.policyid = c.policyid
                     INNER JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_TRANSACTIONITEM d
                        ON c.transactionid = d.transactionid
                     WHERE c.TRANSACTIONTYPE = 'New Business'
                   )a
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_REPORTING_MAPPING b
                ON a.TRANSACTIONTYPE =b.TRANSACTIONTYPE
               AND a.feetype=b.feetype
               AND a.feename =b.feename
               AND a.ADDITIONALPRODUCTNAME = b.ADDITIONALPRODUCTNAME
             WHERE b.CLASSIFICATIONGROUP IS NULL
               AND a.feetype NOT IN('Carrier Premium','Non-Broker Fee')
        dependencies:
          - locationName: STAGE
            nodeName: V_S_AP1_ACTIVITY_MROC_CURRENT
