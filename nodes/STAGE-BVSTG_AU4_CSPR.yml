      - aliases:
          DS_RAM_RETAIL_REPOSITORY: d29a0c5c-e296-46c4-bc55-861d60fe906d
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM (
                    SELECT a.DATE,
                           a.EMPLOYEE,
                           b.ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS AS OFFICECODE,
                           a.WORKED_DAYS
                      FROM (
                            SELECT DATE, EMPLOYEE,
                                   OFFICECODE,
                                   WORKED_DAYS
                              FROM (
                                    SELECT date_trunc('month', DATE) AS DATE,
                                           EMPLOYEE,
                                           OFFICECODE,
                                           sum(Transactions) AS Transactions,
                                           count(*) AS Worked_days
                                      FROM (
                                            SELECT DATE, EMPLOYEE,
                                                   OFFICECODE,
                                                   count(*) AS Transactions
                                              FROM (
                                                    SELECT to_date(CREATEDDATE) AS DATE,
                                                           ifnull(PRIMARYAGENTULTIPRO_BROKER, '-') AS EMPLOYEE,
                                                           OFFICECODE
                                                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                                                     WHERE YEAR(CreatedDate) >= 2021
                                                       AND Label NOT LIKE '%Void%'
                                                       AND SourceDB <> 'ConfieHub'
                                                       AND CLASSIFICATIONGROUP NOT IN ('SR-22 Fee', 'Agency Fee', 'Documentation Fee', 'Monthly Payments Fee', 'Renewal', 'New Transfer', 'Fee Counts', 'Cancellation', 'Reinstatement', 'Endorsement', 'Endorsements (NonPrem)', 'ADD')
                                                       AND NOT (CLASSIFICATIONGROUP = 'New Quotes Auto' AND SourceDB <> 'AppOne')
                                                       AND (PRIMARYAGENTULTIPRO_BROKER NOT IN ('ODT TEST', 'CDT', 'HSACCT', 'STURBO'))
                                                   )
                                             GROUP BY DATE, EMPLOYEE,
                                                   OFFICECODE QUALIFY rank() OVER (PARTITION BY DATE, EMPLOYEE ORDER BY officecode IS NULL, Transactions DESC) = 1
                                           )
                                     GROUP BY 1,
                                              2,
                                              3
                                   )
                             WHERE officecode IS NOT NULL
                           ) a
                      LEFT JOIN (
                            SELECT DISTINCT OFFICECODE,
                                   ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS
                              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                           ) AS b
                        ON a.OFFICECODE = b.OFFICECODE
                   ) DS_RAM_RETAIL_REPOSITORY
             GROUP BY DS_RAM_RETAIL_REPOSITORY.DATE,
                      DS_RAM_RETAIL_REPOSITORY.EMPLOYEE,
                      DS_RAM_RETAIL_REPOSITORY.OFFICECODE
