      join:
        joinCondition: |-
          FROM {{ ref('DIM', 'Task') }} "Task"
          LEFT JOIN {{ ref('DIM', 'Account') }} "Account"
            ON Task.AccountKey = Account.AccountKey
          LEFT JOIN {{ ref('DIM', 'SalesTerritory') }} "SalesTerritory"
            ON Account.SalesTerritoryKey = SalesTerritory.SalesTerritoryKey
          LEFT JOIN {{ ref('DIM', 'Contract') }} "Contract"
            ON Task.ContractKey = Contract.ContractKey
          LEFT JOIN {{ ref('DIM', 'Opportunity') }} "Opportunity"
            ON Task.OpportunityKey = Opportunity.OpportunityKey
          LEFT JOIN {{ ref('DIM', 'Campaign') }} "Campaign"
            ON Task.CampaignKey = Campaign.CampaignKey
          LEFT JOIN {{ ref('DIM', 'Solicitation') }} "Solicitation"
            ON Task.SolicitationKey = Solicitation.SolicitationKey
          LEFT JOIN {{ ref('DIM', 'Contact') }} "Contact"
            ON Task.DimContactKey = Contact.DimContactKey
          LEFT JOIN {{ ref('DIM', 'Lead') }} "Lead"
            ON Task.LeadKey = Lead.LeadKey
          LEFT JOIN {{ ref('DIM', 'Supplier') }} "Supplier"
            ON Contact.AccountSalesforceId = Supplier.SalesforceId
          LEFT JOIN {{ ref('DIM', 'VoiceCall') }} "VoiceCall"
            ON Task.VoiceCallKey = VoiceCall.VoiceCallKey
          LEFT JOIN {{ ref('DIM', 'Sector') }} "Sector"
            ON Account.SectorKey = Sector.SectorKey
          LEFT JOIN {{ ref('DIM', 'AccountHierarchy') }} "AccountHierarchy"
            ON Account.AccountHierarchyKey = AccountHierarchy.AccountHierarchyKey
          where Task.SD_Type is not null
