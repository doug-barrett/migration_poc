              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue_ge
                ON ref_ap1_codevalue_ge.codevalueid = s_ap1_cdtpolicydriver.gender
             WHERE 1=1 --s_ap1_cdtpolicy.CREATED >= '2021-06-01'        QUALIFY ROW_NUMBER() OVER (                PARTITION BY h_cdtpolicy.cdtpolicyID,h_cdtpolicy.cdtpolicyID,           s_ap1_cdtpolicydriver.HK_H_CDTPOLICYDRIVER,                             s_ap1_cdtpolicy.ENDORSEMENTEFFECTIVEDATE                 ORDER BY s_ap1_cdtpolicydriver.dss_version desc,        s_ap1_cdtpolicydriver.dss_version desc,      s_ap1_cdtpolicy.ENDORSEMENTEFFECTIVEDATE                ) = 1
