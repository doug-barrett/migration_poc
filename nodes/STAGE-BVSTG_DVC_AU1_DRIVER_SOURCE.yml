          - locationName: EDW
            nodeName: REF_AP1_CODEVALUE
          - locationName: STAGE
            nodeName: BVSTG_DVC_POLICY_REFRESH
        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','S_AP1_POLICYDRIVER_MROC') }} s_ap1_policydriver_mroc
              JOIN {{ ref('DATA_VAULT','S_AP1_POLICYVERSION_MROC') }} s_ap1_policyversion_mroc
                ON s_ap1_policydriver_mroc.policyversionid = s_ap1_policyversion_mroc.policyversionid
               AND s_ap1_policyversion_mroc.IsRowDeleted=0
              JOIN {{ ref('STAGE','BVSTG_DVC_POLICY_REFRESH') }} bvstg_dvc_policy_refresh
                ON bvstg_dvc_policy_refresh.PolicyID = s_ap1_policyversion_mroc.PolicyID
               AND bvstg_dvc_policy_refresh.SourceDB = 'AppOne'
              JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue
                ON ref_ap1_codevalue.codevalueid = s_ap1_policydriver_mroc.driverrelationshiptypeid
              JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue_st
                ON ref_ap1_codevalue_st.codevalueid = s_ap1_policydriver_mroc.licensestateid
              JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue_ma
                ON ref_ap1_codevalue_ma.codevalueid = s_ap1_policydriver_mroc.maritalstatusid
              JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue_ge
                ON ref_ap1_codevalue_ge.codevalueid = s_ap1_policydriver_mroc.gender
             WHERE 1=1 --s_ap1_policyversion_mroc.Created >= '2019-01-01'      QUALIFY ROW_NUMBER() OVER (              PARTITION BY s_ap1_policydriver_mroc.policydriverid,         s_ap1_policyversion_mroc.policyversionid               ORDER BY s_ap1_policydriver_mroc.dss_version desc,         s_ap1_policyversion_mroc.dss_version desc              ) = 1
