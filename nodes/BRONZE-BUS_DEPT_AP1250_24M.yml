            nodeName: BUS_FISCAL_DAY_PERIOD_FULL
        join:
          joinCondition: |-
            FROM {{ ref('UNKNOWN','CV_SRC_DBAPAPD') }} CV_SRC_DBAPAPD
             INNER JOIN {{ ref('UNKNOWN','CV_SRC_DBAPAPI') }} CV_SRC_DBAPAPI
                ON CV_SRC_DBAPAPD.COMPANY=CV_SRC_DBAPAPI.COMPANY
               AND CV_SRC_DBAPAPD.VENDOR=CV_SRC_DBAPAPI.VENDOR
               AND CV_SRC_DBAPAPD.INVOICE=CV_SRC_DBAPAPI.INVOICE
               AND CV_SRC_DBAPAPD.SUFFIX=CV_SRC_DBAPAPI.SUFFIX
               AND CV_SRC_DBAPAPD.CANCEL_SEQ=CV_SRC_DBAPAPI.CANCEL_SEQ
             INNER JOIN {{ ref('UNKNOWN','CV_SRC_DBIFGDT') }} CV_SRC_DBIFGDT
                ON CV_SRC_DBAPAPD.DIS_ACCOUNT = CV_SRC_DBIFGDT.ACCOUNT_NUM
               AND CV_SRC_DBAPAPD.DIS_SUB_ACCT = CV_SRC_DBIFGDT.SUB_ACCOUNT
             INNER JOIN {{ ref('UNKNOWN','CV_SRC_DBAPVEN') }} CV_SRC_DBAPVEN
                ON CV_SRC_DBAPAPD.VENDOR = CV_SRC_DBAPVEN.VENDOR
              LEFT OUTER JOIN {{ ref('UNKNOWN','CV_SRC_CATLINK') }} CV_SRC_CATLINK
                ON CV_SRC_DBAPAPD.VENDOR = CV_SRC_CATLINK.VENDOR
               AND CV_SRC_DBAPAPD.INVOICE = CV_SRC_CATLINK.INVOICE
             WHERE CV_SRC_DBAPAPD.DISTRIB_DATE >= (
                    SELECT MIN(CALENDAR_DATE)
                      FROM {{ ref('UNKNOWN','BUS_FISCAL_DAY_PERIOD_FULL') }}
                     WHERE PERIOD_DESCRIPTION = 'TTM/LYTTM'
                       AND CP_CODE IN ('C','P')
                       AND EFFECTIVE_DATE = (CURRENT_DATE - 1)
                   )
               AND CV_SRC_DBAPVEN.VENDOR_GROUP = 'UR'
