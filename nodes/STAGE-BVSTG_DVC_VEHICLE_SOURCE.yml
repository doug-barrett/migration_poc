        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_DVC_AU1_VEHICLE_SOURCE') }} bvstg_dvc_au1_vehicle_source
              LEFT JOIN (
                    SELECT PolicyID
                      FROM {{ ref('STAGE','BVSTG_DVC_AU1_VEHICLE_SOURCE') }}
                     GROUP BY PolicyID
                    HAVING COUNT(DISTINCT RefreshType) > 1
                   ) bvstg_dvc_au1_vehicle_source_AppOne
                ON bvstg_dvc_au1_vehicle_source.PolicyID = bvstg_dvc_au1_vehicle_source_AppOne.PolicyID
               AND bvstg_dvc_au1_vehicle_source.RefreshType = 'AppOneDB'
             WHERE bvstg_dvc_au1_vehicle_source_AppOne.PolicyID IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_dvc_au1_vehicle_source.policyid,bvstg_dvc_au1_vehicle_source.Ranking ORDER BY CASE WHEN bvstg_dvc_au1_vehicle_source.status = 'Active' THEN 1 ELSE 2 END,bvstg_dvc_au1_vehicle_source.effectivedate DESC)=1
