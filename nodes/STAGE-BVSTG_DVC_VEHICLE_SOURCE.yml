        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_DVC_AU1_VEHICLE_SOURCE') }} bvstg_dvc_au1_vehicle_source
              LEFT JOIN (
                    SELECT PolicyID
                      FROM {{ ref('STAGE','BVSTG_DVC_AU1_VEHICLE_SOURCE') }}
                     GROUP BY PolicyID
                    HAVING COUNT(DISTINCT RefreshType) > 1
                   ) bvstg_dvc_au1_vehicle_source_AppOne
                ON bvstg_dvc_au1_vehicle_source.PolicyID = bvstg_dvc_au1_vehicle_source_AppOne.PolicyID
