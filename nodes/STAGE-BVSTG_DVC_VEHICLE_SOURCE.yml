             WHERE bvstg_dvc_au1_vehicle_source_AppOne.PolicyID IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_dvc_au1_vehicle_source.policyid,bvstg_dvc_au1_vehicle_source.Ranking ORDER BY CASE WHEN bvstg_dvc_au1_vehicle_source.status = 'Active' THEN 1 ELSE 2 END,bvstg_dvc_au1_vehicle_source.effectivedate DESC)=1
