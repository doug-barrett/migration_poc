        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_API_INSUREDMINE_DEAL_CURRENT
        join:
          joinCondition: |-
            FROM (
                    SELECT DEAL_ID ,
                           B.STARTDATETIME AS CREATEAT ,
                           CASE WHEN SUM(CASE WHEN ISOUTBOUND = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISOUTBOUND ,
                           CASE WHEN SUM(CASE WHEN ISOUTBOUND = 1 AND ISOFFEREDCALL = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISOUTBOUND_ATTEMP ,
                           CASE WHEN SUM(CASE WHEN ISOUTBOUND = 1 AND TALKTIME > 90 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISOUTBOUND_90SEC ,
                           CASE WHEN SUM(CASE WHEN ISINBOUND = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISINBOUND ,
                           CASE WHEN SUM(CASE WHEN ISINBOUND = 1 AND ISOFFEREDCALL = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISINBOUND_ATTEMP ,
                           CASE WHEN SUM(CASE WHEN ISINBOUND = 1 AND ISANSWERCALL = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISINBOUND_ANSWERED ,
                           CASE WHEN SUM(CASE WHEN (ISINBOUND = 1 OR ISOUTBOUND = 1) THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISCONNECTED_CALL ,
                           SUM(CASE WHEN B.ISINBOUND = 1 THEN 1 ELSE 0 END) TOTALINBOUND ,
                           SUM(CASE WHEN B.ISOUTBOUND = 1 THEN 1 ELSE 0 END) TOTALOUTBOUND
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_INSUREDMINE_DEAL_CURRENT A
                      LEFT JOIN (
                            SELECT DISTINCT T1.SESSIONID,
                                   CONVERT_TIMEZONE('UTC',T1.STARTDATETIME) STARTDATETIME,
                                   CASE WHEN ANI_NEW IS NOT NULL THEN ANI_NEW
                                        ELSE RIGHT(T1.ANI, 10)
                                         END AS ANI,
                                   RIGHT(T1.DIGITSDIALED, 10) AS DIGITSDIALED,
                                   ISOUTBOUND,
                                   ISOFFEREDCALL,
                                   ISINBOUND,
                                   ISANSWERCALL,
                                   TALKTIME,
                                   ISINTERNALCALL
                              FROM RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_AGENT_SESSION T1
                              LEFT JOIN (
                                    SELECT DISTINCT SESSIONID,
                                           RIGHT(T1.ANI, 10) ANI_NEW
                                      FROM RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_AGENT_SESSION T1
                                     WHERE RIGHT(T1.ANI, 10) IS NOT NULL
                                       AND SESSIONID IN (
                                            SELECT DISTINCT SESSIONID
                                              FROM RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_AGENT_SESSION T1
                                             GROUP BY SESSIONID
                                            HAVING COUNT(DISTINCT IFNULL(RIGHT(T1.ANI, 10),'-'))>1
                                               AND COUNT(DISTINCT RIGHT(T1.ANI, 10))=1
                                           )
                                   ) T2
                                ON T1.SESSIONID=T2.SESSIONID
                           ) B
                        ON COALESCE(RIGHT(B.ANI, 10),RIGHT(B.DIGITSDIALED, 10)) = A.PHONE
                       AND CAST(B.STARTDATETIME AS TIMESTAMP_NTZ(9)) BETWEEN CREATION_DATE AND IFNULL(DATE(WON_LOST_DATE)+ INTERVAL '1 DAY', DATE(CONVERT_TIMEZONE('UTC',CURRENT_DATE ())))
                     WHERE IFNULL(PHONE, '') != ''
                       AND ISINTERNALCALL = 0
                     GROUP BY DEAL_ID,
                              B.STARTDATETIME
                   ) V_DLBV_API_INSUREDMINE_DEAL_CURRENT
