    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID
        join:
          joinCondition: |-
            FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID
             INNER JOIN (
                    SELECT DISTINCT *
                      FROM (
                            SELECT DISTINCT *,
                                   md5(ifnull(policyid,'-') || ifnull(transactionid,'-') || ifnull(policynumber,'-') || ifnull(carriername,'-') || ifnull(primaryagentultipro_broker,'-') || ifnull(ram_retail_cisco_loginname,'-') || ifnull(customerid,'-') || ifnull(to_varchar(createddate),'-') || ifnull(to_varchar(transactiondate),'-') || ifnull(leadid,'-') || ifnull(FINAL_TXN,'-')) AS new_id
                              FROM (
                                    SELECT DISTINCT id,
                                           policyid,
                                           transactionid,
                                           policynumber,
                                           carriername,
                                           primaryagentultipro_broker,
                                           customerid,
                                           createddate,
                                           transactiondate,
                                           leadid,
                                           CASE WHEN label IN ('New Business Auto','New Business Complementary') AND counter=1 AND (islegacytransaction <>'Migrated' OR islegacytransaction IS NULL) THEN 'NBS'
                                                WHEN label IN ('Renewal Auto','Renewal Complementary') AND counter=1 AND (islegacytransaction <>'Migrated' OR islegacytransaction IS NULL)           THEN 'Renewal'
                                                WHEN classification = 'New Quotes'                                                                                                                   THEN 'Quotes'
                                                WHEN classification IN ('Fee','Service Transactions Fee')                                                                                            THEN 'Fee'
                                                WHEN classification = 'Ancillary'                                                                                                                    THEN 'Ancillary'
                                                WHEN classification = 'New Transfer'                                                                                                                 THEN 'New Transfer'
                                                WHEN UPPER(trim(transactiontype))='ENDORSEMENT'                                                                                                      THEN 'Endorsement'
                                                WHEN UPPER(trim(transactiontype))='CANCELLATION REQUEST'                                                                                             THEN 'Cancellation'
                                                WHEN UPPER(trim(transactiontype))='REINSTATEMENT'                                                                                                    THEN 'Reinstatement'
                                                ELSE concat(ifnull(label,'NULL'),'_',ifnull(classification,'NULL'),'_',ifnull(transactiontype,'NULL'))
                                                 END AS FINAL_TXN,
                                           DS_AGENT_KEY.cisco_loginname AS ram_retail_cisco_loginname
                                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                                      LEFT JOIN (
                                            SELECT DISTINCT cisco_loginname,
                                                   EmployeeNumber
                                              FROM RETAIL_PROD.SCH_EDW.DS_AGENT_KEY
                                             WHERE Rank_EmployeeNumber=1 QUALIFY row_number() OVER (PARTITION BY employeenumber ORDER BY dss_create_time) = 1
                                           ) DS_AGENT_KEY
                                        ON ifnull(trim(DS_RAM_RETAIL_REPOSITORY.primaryagentultipro_broker),'-')=ifnull(trim(DS_AGENT_KEY.EMPLOYEENUMBER),'-')
                                     WHERE CreatedDate >= '2024-10-01'
                                       AND CreatedDate<=current_date()
                                       AND sourcedb='AppOne'
                                   )
                           )
                     WHERE customerid IS NOT NULL
                       AND ram_retail_cisco_loginname IS NOT NULL
                       AND transactionid IS NOT NULL
                   ) AS DS_RAM_RETAIL_REPOSITORY
                ON trim(lower(DS_RAM_RETAIL_REPOSITORY.ram_retail_cisco_loginname))=trim(lower(BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID.agent))
               AND trim(lower(DS_RAM_RETAIL_REPOSITORY.customerid))=trim(lower(BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID.final_customer_id_to_keep))
               AND trim(DS_RAM_RETAIL_REPOSITORY.transactionid)=trim(BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID.las_transactionid)
               AND to_date(DS_RAM_RETAIL_REPOSITORY.createddate)=to_date(BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID.last_transactiondate)
             WHERE final_customer_id_to_keep IS NOT NULL
               AND final_customer_id_to_keep <> ani
               AND las_transactionid IS NOT NULL
               AND last_transactiondate IS NOT NULL
        name: BVSTG_PMKT_AU4_MAPPED_1_AA_FINAL
        noLinkRefs: []
