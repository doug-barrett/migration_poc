    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTIONITEM
        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_TRANSACTIONITEM ds_bvstg_ap1_transactionitem
             INNER JOIN RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY ds_ap1_transactionsummary
                ON ds_ap1_transactionsummary.TransactionID = ds_bvstg_ap1_transactionitem.TransactionID
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_POLICY ds_bvstg_ap1_policy
                ON ds_ap1_transactionsummary.PolicyID = ds_bvstg_ap1_policy.PolicyID
               AND ds_bvstg_ap1_policy.TRANSACTIONTYPE IN('New Business', 'Renewal')
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY ds_ap1_transactionsummary_NB_RWL
                ON ds_ap1_transactionsummary_NB_RWL.TransactionID = ds_bvstg_ap1_policy.TransactionID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_LOGINSTATUS ds_bvstg_ap1_loginstatus
                ON ds_bvstg_ap1_loginstatus.USERID = ds_bvstg_ap1_transactionitem.createdBy
               AND ds_bvstg_ap1_loginstatus.CREATED <= ds_bvstg_ap1_transactionitem.Created
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PRE_AP1_OFFICE_MROC_CURRENT v_s_ap1_office_mroc_current
                ON v_s_ap1_office_mroc_current.OfficeID = ds_bvstg_ap1_loginstatus.LOGGEDINOFFICEID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_ORGANIZATION_MROC_CURRENT v_s_ap1_organization_mroc_current
                ON v_s_ap1_organization_mroc_current.organizationID = v_s_ap1_office_mroc_current.organizationID
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE ds_retail_office
                ON ds_retail_office.officeCode = ds_ap1_transactionsummary_NB_RWL.BIAPRIMARYAGENTOFFICE
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AGENT_KEY DS_AGENT_KEY
                ON DS_AGENT_KEY.AP1_USERID = ds_bvstg_ap1_loginstatus.USERID
             WHERE /*(     ( DAYOFMONTH(DATE(CURRENT_DATE())) <= 3      AND DATE(ds_bvstg_ap1_transactionitem.created) BETWEEN TO_DATE(DATEADD(MONTH,-1,date_trunc('MONTH',CURRENT_DATE()))) AND last_day(CURRENT_DATE())     )     OR      ( DAYOFMONTH(DATE(CURRENT_DATE())) > 3      AND DATE(ds_bvstg_ap1_transactionitem.created) BETWEEN TO_DATE(date_trunc('MONTH',CURRENT_DATE())) AND last_day(CURRENT_DATE())     )       )    AND */ DATE(ds_bvstg_ap1_transactionitem.created) BETWEEN '2024-04-01' AND '2024-06-30'
               AND ds_bvstg_ap1_transactionitem.codedefinition = 'FeeType'
               AND ds_bvstg_ap1_transactionitem.isvoid = 0 QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_bvstg_ap1_transactionitem.transactionitemID ORDER BY ds_bvstg_ap1_loginstatus.CREATED DESC) = 1
        name: BVSTG_AP1_CUSTOMERSERVICEFEES_ALLORGS
        noLinkRefs: []
