        join:
          joinCondition: |-
            FROM(
                    WITH TABLE_UNION AS (
                            SELECT A.POLICYID,
                                   A.TRANSACTIONID,
                                   A.STARTDATE,
                                   A.ESTIMATE_END_DATE,
                                   DATEADD(MONTH, -1, A.ESTIMATE_END_DATE) AS EED_30D_B,
                                   B.POLICYVERSIONID,
                                   DATE(C.LASTUPDATED) AS LASTUPDATED,
                                   C.VIN,
                                   C.VEHICLEYEAR,
                                   CASE WHEN LENGTH(TO_VARCHAR(C.VEHICLEYEAR)) > 4 THEN TO_NUMBER(LEFT(TO_VARCHAR(C.VEHICLEYEAR), 4))
                                        ELSE C.VEHICLEYEAR
                                         END AS VEHICLEYEAR_F,
                                   CASE WHEN C.VEHICLEYEAR IS NULL                                                                                           THEN NULL
                                        WHEN LENGTH(TO_VARCHAR(C.VEHICLEYEAR)) > 4 AND TO_NUMBER(LEFT(TO_VARCHAR(C.VEHICLEYEAR), 4)) - YEAR(A.STARTDATE) > 1 THEN NULL
                                        WHEN LENGTH(TO_VARCHAR(C.VEHICLEYEAR)) <= 4 AND C.VEHICLEYEAR - YEAR(A.STARTDATE) > 1                                THEN NULL
                                        WHEN LENGTH(TO_VARCHAR(C.VEHICLEYEAR)) > 4 AND TO_NUMBER(LEFT(TO_VARCHAR(C.VEHICLEYEAR), 4)) >= YEAR(A.STARTDATE)    THEN 0
                                        WHEN LENGTH(TO_VARCHAR(C.VEHICLEYEAR)) > 4 AND TO_NUMBER(LEFT(TO_VARCHAR(C.VEHICLEYEAR), 4)) < YEAR(A.STARTDATE)     THEN YEAR(A.STARTDATE) - TO_NUMBER(LEFT(TO_VARCHAR(C.VEHICLEYEAR), 4))
                                        WHEN LENGTH(TO_VARCHAR(C.VEHICLEYEAR)) <= 4 AND C.VEHICLEYEAR >= YEAR(A.STARTDATE)                                   THEN 0
                                        ELSE YEAR(A.STARTDATE) - C.VEHICLEYEAR
                                         END AS VEHICLE_AGE
                              FROM (
                                    SELECT *
                                      FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU0_BSL') }}
                                   ) A
                             INNER JOIN (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }}
                                   ) B
                                ON (A.POLICYID = B.POLICYID)
                             INNER JOIN (
                                    SELECT *
                                      FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }}
                                   ) C
                                ON (B.POLICYVERSIONID = C.POLICYVERSIONID AND DATE(C.LASTUPDATED) >= A.STARTDATE AND DATE(C.LASTUPDATED) < DATEADD(MONTH, -1, A.ESTIMATE_END_DATE))
                           ) ,
                           REMOVE_DUPLICATES AS (
                            SELECT DISTINCT POLICYID,
                                   TRANSACTIONID,
                                   VEHICLE_AGE,
                                   VIN,
                                   YEAR(STARTDATE) AS YEAR_START
                              FROM TABLE_UNION
                           ) ,
                           SUMMARY_TABLE AS (
                            SELECT POLICYID,
                                   TRANSACTIONID ,
                                   COUNT(*) AS VINCOUNT ,
                                   TRUNC(AVG(VEHICLE_AGE)) AS AGE_VEHICLE_AVG
                              FROM REMOVE_DUPLICATES
                             GROUP BY POLICYID,
                                      TRANSACTIONID
                           ) SELECT *
                      FROM SUMMARY_TABLE
                   ) bvstg_nsa_rwl_au3_vincount
