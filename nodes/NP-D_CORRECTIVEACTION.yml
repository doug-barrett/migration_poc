            transform: CASE --IF FROM AN AUDIT, THEN THE AUDIT ID WILL BE POPULATED  WHEN L_QP_INCIDENT.AUDITID IS NOT NULL THEN 'AUDIT'  --IF FROM AN INCIDENT, THEN THERE WILL BE AN ASSOCIATED RECORD IN THIS TABLE0  WHEN L_QP_XOCCURRENCEINCIDENTSTAGENONCONFORMANCE.NONCONFORMANCEID IS NOT NULL THEN 'INCIDENT'  ELSE 'OTHER'  END
