            transform: CASE --THERE ARE DIFFERENT CALCULATIONS DEPENDING ON WHETHER OR NOT THE ACTION IS CLOSED  WHEN CLOSEDDATE IS NOT NULL THEN   CASE    WHEN CLOSEDDATE < ISNULL(TARGETDATE,DATEADD(DAY,1,CLOSEDDATE)) THEN 'ON TIME'    ELSE 'OVERDUE' END  ELSE   CASE    WHEN DATEDIFF(DAY,GETDATE(),ISNULL(TARGETDATE,RAISEDDATE)) > 10 THEN 'ON TIME'    WHEN DATEDIFF(DAY,GETDATE(),ISNULL(TARGETDATE,RAISEDDATE)) BETWEEN 0 AND 10 THEN 'IN JEOPARDY'    ELSE 'OVERDUE' END  END
