        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT bvstg_comm_au6_store_evaluation.ud2id,
                   bvstg_comm_au6_store_evaluation.ud2id_description ,
                   v_dl_osm_member_current.name ,
                   ltrim(ifnull(nullif(split_part(v_dl_osm_member_current.name,'_',2),''),v_dl_osm_member_current.name),'0') Corporate_number ,
                   CASE WHEN bvstg_comm_au6_store_evaluation.ud2id_description like '(%)%' THEN replace(split_part(bvstg_comm_au6_store_evaluation.ud2id_description,')',1),'(')
                         END Officecode_ud2id ,
                   ds_retail_office.Officecode officecode_corporate ,
                   ds_retail_office_3.officecode Officecode_SimilarName ,
                   ds_retail_office_2.Officecode officecode_officename ,
                   ifnull(CASE WHEN bvstg_comm_au6_store_evaluation.ud2id_description like '(%)%' THEN replace(split_part(bvstg_comm_au6_store_evaluation.ud2id_description,')',1),'(') END, ifnull(ds_retail_office.Officecode, ifnull(ds_retail_office_2.Officecode, ifnull(ds_retail_office_3.officecode,ifnull(v_bvstg_comm_os_officecodes.officecode, CASE WHEN lower(bvstg_comm_au6_store_evaluation.ud2id_description) like '%house%' THEN 'House' WHEN lower(bvstg_comm_au6_store_evaluation.ud2id_description) like '%admin%' THEN 'Admin' WHEN lower(bvstg_comm_au6_store_evaluation.ud2id_description) like '%online binding%' OR lower(ud2id_description) like '%web dep%'THEN 'OLB' WHEN lower(bvstg_comm_au6_store_evaluation.ud2id_description) like '%call%center%' THEN 'Call-Center' END))))) Officecodes_mapped ,
                   (CASE WHEN bvstg_comm_au6_store_evaluation.ud2id_description like '(%)%' THEN 1 WHEN ds_retail_office.Officecode IS NOT NULL THEN 2 WHEN ds_retail_office_2.Officecode IS NOT NULL THEN 3 WHEN ds_retail_office_3.Officecode IS NOT NULL THEN 4 WHEN v_bvstg_comm_os_officecodes.officecode IS NOT NULL THEN 5 WHEN lower(ud2id_description) like '%house%' THEN 1 WHEN lower(ud2id_description) like '%admin%' THEN 1 WHEN lower(ud2id_description) like '%online binding%' OR lower(ud2id_description) like '%web dep%'THEN 1 WHEN lower(ud2id_description) like '%call%center%' THEN 1 END) prefrence_order
              FROM {{ ref('STAGE','BVSTG_COMM_AU6_STORE_EVALUATION') }} bvstg_comm_au6_store_evaluation
              LEFT JOIN "DATA_LAKE"."ONESTREAM"."V_DL_OSM_MEMBER_CURRENT" v_dl_osm_member_current
                ON bvstg_comm_au6_store_evaluation.ud2id=v_dl_osm_member_current.memberid
              LEFT JOIN (
                    SELECT CORPORATEOFFICENUMBER,
                           OFFICECODE
                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                     WHERE CORPORATEOFFICENUMBER IN (
                            SELECT CORPORATEOFFICENUMBER
                              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                             GROUP BY CORPORATEOFFICENUMBER
                            HAVING count(*)=1
                           )
                   ) ds_retail_office
                ON ltrim(ifnull(nullif(split_part(v_dl_osm_member_current.name,'_',2),''),v_dl_osm_member_current.name),'0')=ds_retail_office.CORPORATEOFFICENUMBER
              LEFT JOIN (
                    SELECT OFFICENAME,
                           OFFICECODE
                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                     WHERE OFFICENAME IN (
                            SELECT OFFICENAME
                              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                             GROUP BY OFFICENAME
                            HAVING count(*)=1
                           )
                   ) ds_retail_office_2
                ON lower(ds_retail_office_2.officename)=lower(bvstg_comm_au6_store_evaluation.ud2id_description)
               AND ud2id_description IS NOT NULL
               AND len(ud2id_description)>1
              LEFT JOIN (SELECT DISTINCT ud2id,
                   OFFICECODE
              FROM {{ ref('STAGE','BVSTG_COMM_AU6_STORE_EVALUATION') }}
              LEFT JOIN (
                    SELECT DISTINCT OFFICENAME,
                           OFFICECODE
                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                     WHERE OFFICENAME IN (
                            SELECT OFFICENAME
                              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                             GROUP BY OFFICENAME
                            HAVING count(*)=1
                           )
                   ) ds_retail_office_3
                ON (((contains(lower(ud2id_description), lower(ds_retail_office_3.Officename))
                OR co
