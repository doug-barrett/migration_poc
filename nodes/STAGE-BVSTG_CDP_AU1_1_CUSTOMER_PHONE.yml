    sourceMapping:
      - aliases:
          DS_BVSTG_CDP_CUSTOMER: 476b9563-f300-4208-95c9-b519fd4a2cf9
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
          - locationName: EDW
            nodeName: DS_BVSTG_CDP_CUSTOMER
        join:
          joinCondition: |-
            FROM (
                    SELECT firstname ,
                           homephone PHONE ,
                           customerid ,
                           created
                      FROM RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 ds_customersummary_v2
                     WHERE sourcedb = 'AppOne'
                       AND FIRSTNAME IS NOT NULL
                       AND homephone IS NOT NULL
                     UNION SELECT firstname ,
                           cellphone ,
                           customerid ,
                           created
                      FROM RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 ds_customersummary_v2
                     WHERE sourcedb = 'AppOne'
                       AND FIRSTNAME IS NOT NULL
                       AND cellphone IS NOT NULL
                     UNION SELECT firstname ,
                           contactphone ,
                           customerid ,
                           created
                      FROM RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 ds_customersummary_v2
                     WHERE sourcedb = 'AppOne'
                       AND FIRSTNAME IS NOT NULL
                       AND contactphone IS NOT NULL
                   ) ds_customersummary_v2
              LEFT JOIN (
                    SELECT CASE WHEN COUNT(ds_bvstg_cdp_customer.cdp_customerid) > 1 THEN 1
                                ELSE 0
                                 END ISDUP_CUST_PHONE ,
                           ds_bvstg_cdp_customer.cdp_customerid
                      FROM RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 ds_customersummary_v2
                     INNER JOIN {{ ref('EDW','DS_BVSTG_CDP_CUSTOMER') }} ds_bvstg_cdp_customer
                        ON ds_customersummary_v2.customerid = ds_bvstg_cdp_customer.customerid
                     WHERE ds_bvstg_cdp_customer.cdp_cust_type = 'firstname_phone'
                     GROUP BY ds_bvstg_cdp_customer.cdp_customerid
                   ) ds_bvstg_cdp_customer_flag
                ON MD5(firstname || phone) = ds_bvstg_cdp_customer_flag.cdp_customerid
             INNER JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 ds_customersummary_v2_phone
                ON ds_customersummary_v2_phone.customerid = ds_customersummary_v2.customerid
             WHERE ds_customersummary_v2_phone.sourcedb = 'AppOne'
               AND YEAR(ds_customersummary_v2_phone.Created) >= '2024'
