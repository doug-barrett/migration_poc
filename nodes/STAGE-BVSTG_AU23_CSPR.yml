                   div0((Total_Revenue-Total_Operating_Expenses),Total_Operating_Expenses) Margin_Yield ,
                   (Total_Revenue-Total_Operating_Expenses)-(REVISED_REVENUE-(ifnull(RENT_EXPENSE,0)+ifnull(UTILITIES,0)+Modelled_compensation)) AS change_in_EBITDA ,
                   (REVISED_REVENUE-(ifnull(Total_Operating_Expenses,0)-ifnull(compensation,0)+ifnull(Modelled_compensation,0))) Revised_EBITDA
              FROM (SELECT DISTINCT table1.ASOFMONTH,
