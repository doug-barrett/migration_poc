      join:
        joinCondition: "FROM {{ ref('GOLD', 'CV_ORDER_LINE') }} \"CV_ORDER_LINE\"\n\
          INNER JOIN {{ ref('GOLD', 'CV_WORK_ORDER') }} \"CV_WORK_ORDER\"\n   ON CV_ORDER_LINE.Equipment_Id\
          \ = CV_WORK_ORDER.Equipment_Id\nINNER JOIN {{ ref('GOLD', 'CV_WO_LABOR_DETAIL')\
          \ }} \"CV_WO_LABOR_DETAIL\"\n   ON CV_WORK_ORDER.Work_Order_Num = CV_WO_LABOR_DETAIL.Work_Order_Num\n\
          \   AND CV_WORK_ORDER.Company_Code = CV_WO_LABOR_DETAIL.Company_Code WHERE\
          \ CV_ORDER_LINE.Rental_Out_Date IS NOT NULL\n    AND CV_ORDER_LINE.Equipment_Id\
          \ <> 0\n    AND CV_ORDER_LINE.Rental_Out_Date BETWEEN CURRENT_DATE - 30\
          \ AND CURRENT_DATE\n    AND CV_ORDER_LINE.Rental_Out_Date >= CV_WO_LABOR_DETAIL.Performed_Date\n\
          \    AND   NOT EXISTS (SELECT NULL\n                    FROM   {{ ref('GOLD',\
          \ 'PRIOR_WORK_ORDER_NUM') }} \"PRIOR_WORK_ORDER_NUM\"\n                \
          \    WHERE  PRIOR_WORK_ORDER_NUM.Contract_Key = CV_ORDER_LINE.Contract_Key\n\
          \                    AND    PRIOR_WORK_ORDER_NUM.Contract_Seq_Key = CV_ORDER_LINE.Contract_Seq_Key\n\
          \                    AND    PRIOR_WORK_ORDER_NUM.Contract_Line_Key = CV_ORDER_LINE.Contract_Line_Key\n\
          \  )\nQUALIFY ROW_NUMBER()\n  OVER (PARTITION BY CV_ORDER_LINE.Contract_Key,\
          \ CV_ORDER_LINE.Contract_Seq_Key, CV_ORDER_LINE.Contract_Line_Key, CV_ORDER_LINE.Equipment_Id\n\
          \  ORDER BY CV_WO_LABOR_DETAIL.Performed_Date DESC, CV_WORK_ORDER.Work_Order_Num\
          \ DESC) = 1"
