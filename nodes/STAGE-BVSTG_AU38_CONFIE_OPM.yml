M  from  (select uniqueid,  date_trunc('month',to_date(EffectiveDate)) EffectiveDate,  date_trunc('month',to_date(TerminationDate)) TerminationDate,  pointintimestatus Status_EOM,  case when ISNEWHIRE = 'NewHire' then 'Inactive'  else lag(pointintimestatus, 1) over (partition by uniqueid order by effectivedate) end as Status_BOM  from "RETAIL_PROD"."SCH_EDW"."DS_HR_SALESEMPLOYEESUMMARY"  where lower(jobfamily) ='sales'  qualify row_number() over (partition by uniqueid, effectivedate order by EMPLOYEESTATUSSTARTDATE desc) = 1) ds_hr_salesemployeesummary  group by date_trunc('month', effectivedate)  )  ) DS_HR_SALESEMPLOYEESUMMARY  on  V_PRED_MONTHS.asofmonth = DS_HR_SALESEMPLOYEESUMMARY.asofmonth and V_PRED_MONTHS.PolicySource_Dimension = DS_HR_SALESEMPLOYEESUMMARY.PolicySource_Dimension    -----------We care  left join  (select PositiveORQty.asofmonth,  PositiveORQty.PolicySource_Dimension,  max(case when upper(PositiveORQty.officestate)='AZ' then    (ifnull(PositiveORQty.Positive_OR_Point,0)+  ifnull(Star_Rating_Point.Star_Rating_Point,0) +  (ifnull(NPS.AVG_NPS,0)) +  ifnull(R_Major_Error.R_Major_Error_Point_Retail_Office,0) +  ifnull(DOI_Complaint.AVG_DOI_Complaint,0)) end) We_Care_AZ,  max(case when upper(PositiveORQty.officestate)='TX' then    (ifnull(PositiveORQty.Positive_OR_Point,0)+  ifnull(Star_Rating_Point.Star_Rating_Point,0) +  (ifnull(NPS.AVG_NPS,0)) +  ifnull(R_Major_Error.R_Major_Error_Point_Retail_Office,0) +  ifnull(DOI_Complaint.AVG_DOI_Complaint,0)) end) We_Care_TX,  max(case when upper(PositiveORQty.officestate)='CA' then    (ifnull(PositiveORQty.Positive_OR_Point,0)+  ifnull(Star_Rating_Point.Star_Rating_Point,0) +  (ifnull(NPS.AVG_NPS,0)) +  ifnull(R_Major_Error.R_Major_Error_Point_Retail_Office,0) +  ifnull(DOI_Complaint.AVG_DOI_Complaint,0)) end) We_Care_CA,  max(case when upper(PositiveORQty.officestate)='NV' then    (ifnull(PositiveORQty.Positive_OR_Point,0)+  ifnull(Star_Rating_Point.Star_Rating_Point,0) +  (ifnull(NPS.AVG_NPS,
