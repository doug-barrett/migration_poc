      join:
        joinCondition: "FROM\n(SELECT \n   ORDER_LINE.Contract_Key,\n   ORDER_LINE.Contract_Seq_Key,\n\
          \   ORDER_LINE.Contract_Line_Key,\n   ORDER_LINE.Location_Id,\n   MIN(ORDER_LINE.Rental_Out_Date)\
          \ AS Min_Rental_Date,\n   MIN(WORK_ORDER.Open_Date)  AS Min_Open_Date\n\
          \ FROM {{ ref('GOLD', 'ORDER_LINE') }} \"ORDER_LINE\"\n\n INNER JOIN {{\
          \ ref('GOLD', 'WORK_ORDER') }} \"WORK_ORDER\"\n   ON  ORDER_LINE.Contract_Id\
          \ = WORK_ORDER.Contract_Id\n   AND ORDER_LINE.Equipment_Id = WORK_ORDER.EQUIPMENT_ID\n\
          \   AND ORDER_LINE.Equipment_Id IS NOT NULL\n   AND WORK_ORDER.Equipment_Id\
          \ IS NOT NULL\n   AND WORK_ORDER.Bill_Customer_or_Location_Code =  'L'\n\
          \   AND WORK_ORDER.Equipment_Type_code =  'O'\n   AND WORK_ORDER.Reason_Code\
          \ =  '10'\n   AND WORK_ORDER.Work_Order_Status_Code  IN ('O','C')\n   AND\
          \ WORK_ORDER.Service_Call_Ind =  'Y'\n GROUP BY 1, 2, 3, 4 ) WORK_ORDER\n\
          \n LEFT OUTER JOIN {{ ref('GOLD', 'LOCATION_HOURS_FORECAST') }} \"LOCATION_HOURS_FORECAST\"\
          \n   ON  LOCATION_HOURS_FORECAST.Location_Id = WORK_ORDER.Location_Id\n\
          \   AND LOCATION_HOURS_FORECAST.Calendar_Date \n       BETWEEN WORK_ORDER.Min_Rental_Date\
          \ \n           AND WORK_ORDER.Min_Open_Date\n GROUP BY 1,2,3"
