    sourceMapping:
      - aliases:
          BVSTG_COMM_AU3_EOM_EXTRACT_CS: 7d0b9a49-9202-47fd-9166-611eecede631
          V_PRED_MONTHS: ae944c3a-4867-4559-b5a6-92a3211e7fa8
        customSQL:
