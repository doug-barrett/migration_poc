        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU3_EOM_EXTRACT_CS
          - locationName: STAGE
            nodeName: V_PRED_MONTHS
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT bvstg_comm_au3_eom_extract_cs.PolicyNumberFormatted,
                           bvstg_comm_au3_eom_extract_cs.Carrier,
                           bvstg_comm_au3_eom_extract_cs.carrierdisplayname,
                           bvstg_comm_au3_eom_extract_cs.agency_mapped,
                           bvstg_comm_au3_eom_extract_cs.statecode_mapped,
                           bvstg_comm_au3_eom_extract_cs.paidtype,
                           bvstg_comm_au3_eom_extract_cs.paidtypefinal,
                           bvstg_comm_au3_eom_extract_cs.producercode,
                           bvstg_comm_au3_eom_extract_cs.CS_CALCULATION_LOGIC,
                           bvstg_comm_au3_eom_extract_cs.lastest_cspolicynumberformatted,
                           bvstg_comm_au3_eom_extract_cs.StartDate,
                           bvstg_comm_au3_eom_extract_cs.EndDate2,
                           bvstg_comm_au3_eom_extract_cs.Enddate3,
                           bvstg_comm_au3_eom_extract_cs.Term,
                           dateadd(MONTH, bvstg_comm_au3_eom_extract_cs.term, bvstg_comm_au3_eom_extract_cs.NbsRenewalDate) EndDate4,
                           CASE WHEN NbsRenewalDate IS NOT NULL AND enddate2 >= enddate3 AND enddate2 >= dateadd(MONTH, term, bvstg_comm_au3_eom_extract_cs.NbsRenewalDate)                                                           THEN enddate2
                                WHEN NbsRenewalDate IS NOT NULL AND enddate3 >= enddate2 AND enddate3 >= dateadd(MONTH, term, bvstg_comm_au3_eom_extract_cs.NbsRenewalDate)                                                           THEN enddate3
                                WHEN NbsRenewalDate IS NOT NULL AND dateadd(MONTH, term, bvstg_comm_au3_eom_extract_cs.NbsRenewalDate) >= enddate2 AND dateadd(MONTH, term, bvstg_comm_au3_eom_extract_cs.NbsRenewalDate) >= enddate3 THEN dateadd(MONTH, term, bvstg_comm_au3_eom_extract_cs.NbsRenewalDate)
                                WHEN NbsRenewalDate IS NULL AND enddate2 >= enddate3                                                                                                                                                  THEN enddate2
                                ELSE enddate3
                                 END AS enddate
                      FROM (
                            SELECT bvstg_comm_au3_eom_extract_cs.*,
                                   bvstg_comm_au3_eom_extract_cs_1.NbsRenewalDate
                              FROM (
                                    SELECT DISTINCT PolicyNumberFormatted,
                                           carrier,
                                           term,
                                           carrierdisplayname,
                                           agency_mapped,
                                           statecode_mapped,
                                           paidtype,
                                           paidtypefinal,
                                           producercode,
                                           CS_CALCULATION_LOGIC,
                                           lastest_cspolicynumberformatted,
                                           to_date(min(executionmonth)) startdate,
                                           to_date(dateadd(MONTH, term, min(executionmonth))) enddate2,
                                           to_date(max(executionmonth)) enddate3
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }}
                                     WHERE paidtypefinal = 'As Written'
                                     GROUP BY PolicyNumberFormatted,
                                              carrier,
                                              term,
                                              carrierdisplayname,
                                              agency_mapped,
                                              statecode_mapped,
                                              paidtype,
                                              paidtypefinal,
                                              producercode,
                                              CS_CALCULATION_LOGIC,
                                              lastest_cspolicynumberformatted
                                   ) bvstg_comm_au3_eom_extract_cs
                              LEFT JOIN (
                                    SELECT PolicyNumberFormatted,
                                           Carrier,
                                           to_date(max(executionmonth)) NbsRenewalDate
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }}
                                     WHERE transactiontype IN ('New Business', 'Renewal')
                                       AND paidtypefinal = 'As Written'
                                     GROUP BY PolicyNumberFormatted,
                                              Carrier
                                   ) bvstg_comm_au3_eom_extract_cs_1
                                ON bvstg_comm_au3_eom_extract_cs.PolicyNumberFormatted = bvstg_comm_au3_eom_extract_cs_1.PolicyNumberFormatted
                               AND bvstg_comm_au3_eom_extract_cs.Carrier = bvstg_comm_au3_eom_extract_cs_1.Carrier
                           ) bvstg_comm_au3_eom_extract_cs
                   ) bvstg_comm_au3_eom_extract_cs
             CROSS JOIN (
                    SELECT DISTINCT to_date(min_date) cutoffdate
                      FROM {{ ref('STAGE','V_PRED_MONTHS') }}
                     WHERE min_date >= '2016-01-01'
                   ) v_pred_months
             WHERE cutoffdate >= date_trunc('month', startdate)
               AND cutoffdate <= enddate
        name: BVSTG_COMM_AU4_EOM_EXTRACT_CS
        noLinkRefs: []
