    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          V_PREB_PCCE_INTERACTIONSUMMARY_GROUP: 9fa290ca-70c3-408b-bf4b-4a9be7aafdb5
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_INTERACTIONSUMMARY_GROUP') }} AS SELECT CASE WHEN bvstg_pcce_au1_interactionsummary.RouterCallKey = 0 THEN (RECOVERYKEY ||'-3')
                        ELSE ROUTERCALLKEY || '-'||ROUTERCALLKEYDAY
                         END AS ID,
                   MAX(bvstg_pcce_au1_interactionsummary.STARTDATETIME) STARTDATETIME,
                   MIN(CASE WHEN RANK_STARTDATETIME = 1 THEN RECOVERYKEY ELSE NULL END) RECOVERYKEY,
                   MAX(bvstg_pcce_au1_interactionsummary.RouterCallKeyDay) RouterCallKeyDay,
                   MAX(bvstg_pcce_au1_interactionsummary.RouterCallKey) RouterCallKey,
                   MAX(SkillGroupTargetName) CALLTYPENAME,
                   MAX(CASE WHEN RANK_STARTDATETIME = 1 AND DNIS IS NOT NULL THEN DNIS ELSE NULL END) DNIS,
                   MAX(CASE WHEN RANK_STARTDATETIME = 1 AND ANI IS NOT NULL THEN ANI ELSE NULL END) ANI,
                   MAX(CASE WHEN RANK_STARTDATETIME = 1 AND DIGITSDIALED IS NOT NULL THEN DIGITSDIALED ELSE NULL END) DIGITSDIALED,
                   MAX(CASE WHEN rank_WorkgroupAssigned = 1 THEN SkillGroupTargetName ELSE NULL END) FirstAssignedWorkGroup,
                   MAX(CASE WHEN rank_WorkgroupAssigneddesc = 1 THEN SkillGroupTargetName ELSE NULL END) LastAssignedWorkGroup,
                   MAX(CASE WHEN RANK_AGENTASSIGNED = 1 THEN AgentOffice ELSE NULL END) FirstAgentOffice,
                   MAX(CASE WHEN RANK_AGENTASSIGNEDDESC = 1 THEN AgentOffice ELSE NULL END) LastAgentOffice,
                   MAX(CASE WHEN RANK_AGENTASSIGNED = 1 THEN CALLDISPOSITIONNAME ELSE NULL END) CallNote,
                   MAX(bvstg_pcce_au1_interactionsummary.TIMEZONE) TIMEZONE,
                   MAX(bvstg_pcce_au1_interactionsummary.ENDDATETIME) EndDateTime,
                   MAX(CASE WHEN RANK_AGENTASSIGNED = 1 THEN AGENTNAME ELSE NULL END) FirstLocalUserName,
                   MAX(CASE WHEN RANK_AGENTASSIGNED = 1 THEN AGENT ELSE NULL END) FirstLocalUserID,
                   MAX(CASE WHEN RANK_AGENTASSIGNED = 1 THEN agentskilltargetid ELSE NULL END) FirstAgentSkillTargetID,
                   MAX(CASE WHEN RANK_AGENTASSIGNEDDESC = 1 THEN AGENTNAME ELSE NULL END) LastLocalUserName,
                   MAX(CASE WHEN RANK_AGENTASSIGNEDDESC = 1 THEN AGENT ELSE NULL END) LastLocalUserID,
                   MAX(CASE WHEN RANK_AGENTASSIGNEDDESC = 1 THEN agentskilltargetid ELSE NULL END) LastAgentSkillTargetID,
                   MIN(CALLTYPEREPORTINGDATETIME) Interval, SUM(bvstg_pcce_au1_interactionsummary.Duration) tDuration,
                   SUM(bvstg_pcce_au1_interactionsummary.TalkTime) tConnected,
                   SUM(bvstg_pcce_au1_interactionsummary.HoldTime) tHeld,
                   SUM(bvstg_pcce_au1_interactionsummary.LocalQTime) AS tQueueWait,
                   SUM(bvstg_pcce_au1_interactionsummary.RingTime) AS tAlert,
                   SUM(bvstg_pcce_au1_interactionsummary.talktime) AS talktime,
                   CASE WHEN MAX(CASE WHEN bvstg_pcce_au1_interactionsummary.PERIPHERALCALLTYPE IN (9,10) THEN 1 ELSE 0 END) = 1 THEN 'Outbound'
                        ELSE 'Inbound'
                         END Direction,
                   'External' ConnectionType,
                   CASE WHEN SUM(bvstg_pcce_au1_interactionsummary.TalkTime) > 0 THEN 'Answered'
                        ELSE 'Abandon'
                         END CallDisposition
              FROM {{ ref('UNKNOWN','BVSTG_PCCE_AU1_INTERACTIONSUMMARY') }} bvstg_pcce_au1_interactionsummary
             GROUP BY CASE WHEN bvstg_pcce_au1_interactionsummary.RouterCallKey = 0 THEN (RECOVERYKEY ||'-3')
                           ELSE ROUTERCALLKEY || '-'||ROUTERCALLKEYDAY
                            END
