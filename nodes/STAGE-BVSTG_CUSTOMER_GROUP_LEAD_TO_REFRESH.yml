        join:
          joinCondition: |-
            FROM (
                    SELECT TO_VARCHAR(S_AP1_LEAD_MROC.customerid) AS customerid ,
                           'AppOne' AS SourceDB
                      FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} S_AP1_LEAD_MROC
                     WHERE S_AP1_LEAD_MROC.customerid IS NOT NULL
                       AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,S_AP1_LEAD_MROC.dss_create_time,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mapping_Refresh_Days }}'))
                     UNION SELECT CustomerID ,
                           SourceDB
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                     WHERE customerid IS NOT NULL
                       AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DSS_UPDATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mapping_Refresh_Days }}'))
                     GROUP BY CustomerID ,
                              SourceDB
                     UNION SELECT CustomerID ,
                           SourceDB
                      FROM {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }}
                     WHERE customerid IS NOT NULL
                       AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DSS_UPDATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mapping_Refresh_Days }}'))
                     GROUP BY CustomerID ,
                              SourceDB
                     UNION SELECT CustomerID ,
                           SOURCEDB_CUSTOMER SourceDB
                      FROM {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }}
                     WHERE customerid IS NOT NULL
                       AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DSS_UPDATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mapping_Refresh_Days }}'))
                     GROUP BY CustomerID ,
