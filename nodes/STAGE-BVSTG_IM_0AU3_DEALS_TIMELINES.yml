    sourceMapping:
      - aliases:
          V_DLBV_BOE_SALESCALENDAR_CURRENT: 7b43243c-99cb-4fd8-be93-b03d0143084f
          BVSTG_IM_0AU2_DEALS_TIMELINES: 2ff32f68-af4f-4b45-9429-f9ff08a30bb3
          V_DLBV_API_INSUREDMINE_DEAL_CURRENT: 67fe024a-515f-4af5-a8a8-3afbe79769fd
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_IM_0AU2_DEALS_TIMELINES
          - locationName: STAGE
            nodeName: V_DLBV_BOE_SALESCALENDAR_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_API_INSUREDMINE_DEAL_CURRENT
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_TIMELINES_WON
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_TIMELINES_SOLD
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_TIMELINES_LOST
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_TIMELINES_QUOTE
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_DEALS
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_CALL
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_HISTORY_PIPELINE
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_RENEWALS
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_PRIMARY_AGENT
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_PRIMARY_AGENT_TM
          - locationName: UNKNOWN
            nodeName: V_PREB_IM_HIST_SESSION_OUTBOUND
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT *
                      FROM {{ ref('STAGE','V_DLBV_BOE_SALESCALENDAR_CURRENT') }}
                     WHERE SALESDATE >= '11/1/2022'
                       AND SALESDATE < CURRENT_DATE
                   ) v_dlbv_boe_salescalendar_current
              LEFT JOIN {{ ref('STAGE','BVSTG_IM_0AU2_DEALS_TIMELINES') }} bvstg_im_0au2_deals_timelines
                ON DATE (bvstg_im_0au2_deals_timelines.CREATEAT) = v_dlbv_boe_salescalendar_current.SALESDATE
              LEFT JOIN (
                    SELECT *,
                           TRIM(LPAD(TO_CHAR(EMPLOYEE_CODE), 6, '0')) employeenumber,
                           TRIM(LPAD(TO_CHAR(IFNULL(PRIMARY_EMPLOYEE_CODE, EMPLOYEE_CODE)), 6, '0')) primary_employee_code_blended
                      FROM {{ ref('STAGE','V_DLBV_API_INSUREDMINE_DEAL_CURRENT') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY DEAL_ID ORDER BY DSS_CREATE_TIME DESC, LAST_UPDATED_DATE DESC) = 1
                   ) v_dlbv_api_insuredmine_deal_current
                ON bvstg_im_0au2_deals_timelines.DEAL_ID = v_dlbv_api_insuredmine_deal_current.DEAL_ID
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_TIMELINES_WON') }} v_preb_im_timelines_won
                ON v_preb_im_timelines_won.timeline_id = bvstg_im_0au2_deals_timelines.timeline_id
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_TIMELINES_SOLD') }} v_preb_im_timelines_sold
                ON v_preb_im_timelines_sold.timeline_id = bvstg_im_0au2_deals_timelines.timeline_id
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_TIMELINES_LOST') }} v_preb_im_timelines_lost
                ON v_preb_im_timelines_lost.timeline_id = bvstg_im_0au2_deals_timelines.timeline_id
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_TIMELINES_QUOTE') }} v_preb_im_timelines_quote
                ON v_preb_im_timelines_quote.timeline_id = bvstg_im_0au2_deals_timelines.timeline_id
              LEFT JOIN (
                    SELECT DISTINCT deal_id,
                           1 deal_created,
                           customerno,
                           customerid
                      FROM {{ ref('UNKNOWN','V_PREB_IM_DEALS') }}
                     WHERE customerno IS NOT NULL
                   ) v_preb_im_deals
                ON bvstg_im_0au2_deals_timelines.DEAL_ID = v_preb_im_deals.DEAL_ID
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_CALL') }} v_preb_im_call
                ON bvstg_im_0au2_deals_timelines.deal_id = v_preb_im_call.deal_id
               AND v_dlbv_boe_salescalendar_current.SALESDATE = DATE (v_preb_im_call.DATE)
              LEFT JOIN (
                    SELECT deal_id,
                           DATE (won_lost_date) AS won_lost_date
                      FROM {{ ref('STAGE','V_DLBV_API_INSUREDMINE_DEAL_CURRENT') }}
                     WHERE won_lost_date IS NOT NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY DEAL_ID ORDER BY DSS_CREATE_TIME DESC, LAST_UPDATED_DATE DESC) = 1
                   ) v_dlbv_api_insuredmine_deal_current_rnwl
                ON v_dlbv_api_insuredmine_deal_current_rnwl.deal_id = bvstg_im_0au2_deals_timelines.deal_id
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('UNKNOWN','V_PREB_IM_HISTORY_PIPELINE') }}
                     WHERE history_pipeline IS NOT NULL
                       AND history_pipeline NOT IN ('QC Completed', 'QC Intake', 'Pilot intake', 'Pilot Completed')
                   ) v_preb_im_history_pipeline
                ON bvstg_im_0au2_deals_timelines.deal_id = v_preb_im_history_pipeline.deal_id
               AND (DATE (bvstg_im_0au2_deals_timelines.createat) >= DATE (v_preb_im_history_pipeline.startdate) AND DATE (bvstg_im_0au2_deals_timelines.createat) <= DATE (v_preb_im_history_pipeline.enddate))
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_RENEWALS') }} v_preb_im_renewals
                ON bvstg_im_0au2_deals_timelines.deal_id = v_preb_im_renewals.deal_id
               AND v_dlbv_boe_salescalendar_current.SALESDATE = DATE (v_preb_im_renewals.due_date)
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_PRIMARY_AGENT') }} v_preb_im_primary_agent
                ON bvstg_im_0au2_deals_timelines.deal_id = v_preb_im_primary_agent.deal_id
               AND TO_VARCHAR(v_dlbv_api_insuredmine_deal_current.primary_employee_code_blended) = v_preb_im_primary_agent.employeenumber
               AND (DATE (bvstg_im_0au2_deals_timelines.createat) >= DATE (v_preb_im_primary_agent.startdate) AND DATE (bvstg_im_0au2_deals_timelines.createat) <= DATE (IFNULL(v_preb_im_primary_agent.enddate, CURRENT_DATE)))
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_PRIMARY_AGENT_TM') }} v_preb_im_primary_agent_tm
                ON v_preb_im_primary_agent_tm.timeline_id = bvstg_im_0au2_deals_timelines.timeline_id
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_HIST_SESSION_OUTBOUND') }} v_preb_im_hist_session_outbound
                ON v_preb_im_hist_session_outbound.deal_id = bvstg_im_0au2_deals_timelin
