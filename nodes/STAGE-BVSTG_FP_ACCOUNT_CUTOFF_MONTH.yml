    sourceMapping:
      - aliases:
          V_DLBV_FP_ACCOUNTSTATUSHISTORY: 999973e0-2be0-428b-a0dd-8f54627471fc
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: STAGE_DATE_SF
          - locationName: STAGE
            nodeName: V_DLBV_FP_ACCOUNTSTATUSHISTORY
          - locationName: UNKNOWN
            nodeName: V_PREB_FP_PAIDINFULL
        join:
          joinCondition: |-
            EXTENDED
              FROM(
                    SELECT ACCH.ACCOUNTID ,
                           MIN(DS_FP_ACCOUNTS_FINANCED.EffectiveDate) AS EffectiveDate ,
                           MIN(DS_FP_ACCOUNTS_FINANCED.ExpirationDate) AS ExpirationDate ,
                           DATEDIFF(MONTH,MIN(DS_FP_ACCOUNTS_FINANCED.EffectiveDate),MIN(DS_FP_ACCOUNTS_FINANCED.ExpirationDate)) Term ,
                           CASE WHEN MAX(ACCH_SE.DATECREATED) > MIN(DS_FP_ACCOUNTS_FINANCED.ExpirationDate) THEN DATEADD(MONTH,Term,MIN(DS_FP_ACCOUNTS_FINANCED.ExpirationDate))
                                ELSE MIN(DS_FP_ACCOUNTS_FINANCED.ExpirationDate)
                                 END BIA_ExpirationDate ,
                           CASE WHEN MIN(ACCH.DATECREATED) < MIN(DS_FP_ACCOUNTS_FINANCED.EffectiveDate) THEN MIN(ACCH.DATECREATED)
                                ELSE MIN(DS_FP_ACCOUNTS_FINANCED.EffectiveDate)
                                 END AS StartDate ,
                           CASE WHEN MIN(ACCH_SE.STATUSCODE) IN (1,4) AND BIA_ExpirationDate > DATE(CURRENT_DATE()) THEN NULL
                                WHEN MIN(ACCH_SE.STATUSCODE) IN (1,4) AND BIA_ExpirationDate < DATE(CURRENT_DATE()) THEN BIA_ExpirationDate
                                ELSE MIN(ACCH_SE.DATECREATED)
                                 END EndDate ,
                           CASE WHEN MIN(ACCH_SE.STATUSCODE) IN (1,4) AND BIA_ExpirationDate > DATE(CURRENT_DATE()) THEN 'Active'
                                WHEN MIN(ACCH_SE.STATUSCODE) IN (1,4) AND BIA_ExpirationDate < DATE(CURRENT_DATE()) THEN 'Expired'
                                WHEN MIN(ACCH_SE.STATUSCODE) = 11                                                   THEN 'FlatCancel'
                                ELSE 'Cancelled'
                                 END Status ,
                           MAX(ACCH_SE.DATECREATED) AS StatusDate ,
                           MIN(ACCH_SE.STATUSCODE) StatusNumber ,
                           LAST_DAY(StartDate) last_day_StartDate ,
                           LAST_DAY(EndDate) last_day_EndDate
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_FP_ACCOUNTSTATUSHISTORY ACCH
                     INNER JOIN (
                            SELECT ACCOUNTID,
                                   DATECREATED,
                                   STATUSCODE
                              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_FP_ACCOUNTSTATUSHISTORY QUALIFY ROW_NUMBER() OVER (PARTITION BY ACCOUNTID ORDER BY DATECREATED, CASE WHEN STATUSCODE IN (1,4) THEN 1 ELSE 2 END) = 1
                           )ACCH_SE
                        ON ACCH_SE.ACCOUNTID = ACCH.ACCOUNTID
                      LEFT JOIN (
                            SELECT ACCOUNTID,
                                   MIN(EffectiveDate)EffectiveDate,
                                   MAX(ExpirationDate)ExpirationDate
                              FROM RETAIL_PROD.SCH_EDW.DS_FP_ACCOUNTS_FINANCED
                             GROUP BY ACCOUNTID
                           ) DS_FP_ACCOUNTS_FINANCED
                        ON DS_FP_ACCOUNTS_FINANCED.ACCOUNTID = ACCH.ACCOUNTID
                     GROUP BY ACCH.ACCOUNTID
                   ) V_DLBV_FP_ACCOUNTSTATUSHISTORY_RANGE
             INNER JOIN (
                    SELECT CAL_YEAR ,
                           CAL_MONTH_NO ,
                           MAX(DATE(CALENDAR_DATE)) Last_Calendar_Date ,
                           MIN(DATE(CALENDAR_DATE)) First_Calendar_Date
                      FROM RETAIL_PROD.SCH_BVSTAGE.STAGE_DATE_SF
                     GROUP BY CAL_YEAR ,
                              CAL_MONTH_NO
                   ) STAGE_DATE_SF
                ON STAGE_DATE_SF.Last_Calendar_Date BETWEEN V_DLBV_FP_ACCOUNTSTATUSHISTORY_RANGE.last_day_StartDate AND IFNULL(V_DLBV_FP_ACCOUNTSTATUSHISTORY_RANGE.last_day_EndDate,CURRENT_DATE())
              LEFT JOIN {{ ref('STAGE','V_DLBV_FP_ACCOUNTSTATUSHISTORY') }} V_DLBV_FP_ACCOUNTSTATUSHISTORY
                ON V_DLBV_FP_ACCOUNTSTATUSHISTORY.ACCOUNTID = V_DLBV_FP_ACCOUNTSTATUSHISTORY_RANGE.ACCOUNTID
               AND DATE (V_DLBV_FP_ACCOUNTSTATUSHISTORY.DATECREATED) <= STAGE_DATE_SF.Last_Calendar_Date
              LEFT JOIN {{ ref('STAGE','V_DLBV_FP_ACCOUNTSTATUSHISTORY') }} V_DLBV_FP_ACCOUNTSTATUSHISTORY_INTCANC
                ON V_DLBV_FP_ACCOUNTSTATUSHISTORY_INTCANC.ACCOUNTID = V_DLBV_FP_ACCOUNTSTATUSHISTORY_RANGE.ACCOUNTID
               AND DATE (V_DLBV_FP_ACCOUNTSTATUSHISTORY_INTCANC.DATECREATED) <= STAGE_DATE_SF.Last_Calendar_Date
               AND DATE (V_DLBV_FP_ACCOUNTSTATUSHISTORY_INTCANC.DATECREATED) >= STAGE_DATE_SF.First_Calendar_Date
               AND V_DLBV_FP_ACCOUNTSTATUSHISTORY_INTCANC.STATUSCODE = 4
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_FP_PAIDINFULL') }} v_preb_fp_paidinfull
                ON v_preb_fp_paidinfull.accountid = V_DLBV_FP_ACCOUNTSTATUSHISTORY.accountid QUALIFY ROW_NUMBER() OVER (
            PARTITION BY V_DLBV_FP_ACCOUNTSTATUSHISTORY_Range.A
        name: BVSTG_FP_ACCOUNT_CUTOFF_MONTH
        noLinkRefs: []
