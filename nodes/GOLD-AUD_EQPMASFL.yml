        EQUIPMENT_HISTORY: bf1cf309-da44-5c27-a06d-dac20595014d
      customSQL:
        customSQL: ''
      dependencies:
      - locationName: BRONZE
        nodeName: EQPMASFL
      - locationName: GOLD
        nodeName: EQUIPMENT
      - locationName: GOLD
        nodeName: LOCATION
      - locationName: GOLD
        nodeName: DV_PARTY
      - locationName: GOLD
        nodeName: CDC_BATCH
      - locationName: GOLD
        nodeName: EQUIPMENT_HISTORY
      - locationName: BRONZE
        nodeName: LOCATION1
      join:
        joinCondition: "FROM {{ ref('BRONZE', 'EQPMASFL') }} \"EQPMASFL\"\nINNER JOIN {{ ref('GOLD', 'EQUIPMENT') }} \"EQUIPMENT\"\nON EQPMASFL.EMCMP =  EQUIPMENT.Company_Code \nAND EQPMASFL.EMEQP0 =  EQUIPMENT.Equipment_Code\nAND  EQUIPMENT.dss_current_flag = 'Y'\n\nLEFT OUTER JOIN {{ ref('GOLD', 'LOCATION') }} \"LOCATION\"\nON Case When  EQPMASFL.EMCMP in ('RC','RA') \nThen 'U1' Else EQPMASFL.EMCMP End  = LOCATION.Company_Code\nAND EQPMASFL.EMCLOC = LOCATION.Location_Code\nAND LOCATION.dss_current_flag = 'Y'\n\nLEFT OUTER JOIN {{ ref('GOLD', 'LOCATION') }} \"LOCATION\"1\nON Case When  EQPMASFL.EMCMP in ('RC','RA') \nThen 'U1' Else EQPMASFL.EMCMP End  = LOCATION1.Company_Code\nAND EQPMASFL.EMALOC = LOCATION1.Location_Code\nAND LOCATION1.dss_current_flag = 'Y'\n\nLEFT OUTER JOIN {{ ref('GOLD', 'DV_PARTY') }} \"DV_PARTY\"\nON Case When  EQPMASFL.EMCMP in ('RC','RA') \nThen 'U1' Else EQPMASFL.EMCMP End  = DV_PARTY.Company_Code\nAND EQPMASFL.EMCUS0=DV_PARTY.Customer_Account_Num\nAND EQPMASFL.EMCUS0\
          \ IS NOT NULL\nAND DV_PARTY.Party_Type_Code =1\n\nWhere EMSTAT not in ('1','2')\nAND Aud_Type NOT IN ('UB', 'BR')\nand Aud_Time <= (Select MAX(Batch_End) FROM {{ ref('GOLD', 'CDC_BATCH') }} )\nand Aud_Time > (\n  SELECT COALESCE(MAX(Effective_Begin_Date), DATE '1111-11-11' ) \n    FROM {{ ref('GOLD', 'EQUIPMENT_HISTORY') }}\n)"
      name: AUD_EQPMASFL
      noLinkRefs: []
