                          WHEN WinBack_Flag = 1                                                                                                                   THEN CASE WHEN TRANTYPE IN ('REW', 'NBS') THEN 'WinBack' WHEN TRANTYPE IN ('BPC', 'PCH', 'PAB', 'POL', 'BND') THEN 'WinBack Policy Change' WHEN TRANTYPE = 'XLC' THEN 'WinBack Cancellation' WHEN TRANTYPE = 'REI' THEN 'WinBack Reinstatement' WHEN TRANTYPE IN ('RWX', 'NRA') THEN 'WinBack Non Renewal' WHEN TRANTYPE IN ('ARR', 'RWR', 'RIX', 'BRW', 'SYR', 'RWL', 'SYN', 'RNR') THEN 'WinBack First Renewal 6M' END
                          WHEN Replacement_Flag = 1                                                                                                               THEN CASE WHEN TRANTYPE IN ('REW', 'NBS') THEN 'Replacement Policy' WHEN TRANTYPE IN ('BPC', 'PCH', 'PAB', 'POL', 'BND') THEN 'Replacement Policy Policy Change' WHEN TRANTYPE = 'XLC' THEN 'Replacement Policy Cancellation' WHEN TRANTYPE = 'REI' THEN 'Replacement Policy Reinstatement' WHEN TRANTYPE IN ('RWX', 'NRA') THEN 'Replacement Policy Non Renewal' WHEN TRANTYPE IN ('ARR', 'RWR', 'RIX', 'BRW', 'SYR', 'RWL', 'SYN', 'RNR') THEN 'Replacement Policy First Renewal 6M' END
