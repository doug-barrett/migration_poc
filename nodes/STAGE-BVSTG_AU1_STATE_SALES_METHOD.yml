        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_CUSTOMER') }} ds_bvstg_ap1_customer
                ON ds_ram_retail_repository.CustomerID = ds_bvstg_ap1_customer.CustomerID
              LEFT JOIN {{ ref('DATA_VAULT','S_AMS_CUSTOMER_MROC') }} s_ams_customer_mroc
                ON ds_ram_retail_repository.CustomerID = s_ams_customer_mroc.CustID
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
                ON ds_agent_key.EmployeeNumber = ds_ram_retail_repository.PRIMARYAGENTULTIPRO_BROKER
               AND ds_agent_key.RANK_EMPLOYEENUMBER = 1
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key_secundary
                ON ds_agent_key.EmployeeNumber = ds_ram_retail_repository.SECONDARYAGENTULTIPRO
               AND ds_agent_key.RANK_EMPLOYEENUMBER = 1
              LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} ds_pcce_termination_call_agent_session
                ON ds_bvstg_ap1_customer.HomePhone = REPLACE(ds_pcce_termination_call_agent_session.ANI,'+1','')
               AND ds_pcce_termination_call_agent_session.ENDDATETIME BETWEEN dateadd(HOUR,-2,ds_ram_retail_repository.CREATEDDATE) AND dateadd(HOUR,2, ds_ram_retail_repository.CREATEDDATE)
               AND (ds_pcce_termination_call_agent_session.Agent = ds_agent_key.CISCO_LOGINNAME OR ds_pcce_termination_call_agent_session.Agent = ds_agent_key_secundary.CISCO_LOGINNAME)
              LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} ds_pcce_termination_call_agent_session_cellphone
                ON IFNULL(ds_bvstg_ap1_customer.CellPhone,'') != IFNULL(ds_bvstg_ap1_customer.HomePhone,'')
               AND ds_bvstg_ap1_customer.CellPhone = REPLACE(ds_pcce_termination_call_agent_session_cellphone.ANI,'+1','')
               AND ds_pcce_termination_call_agent_session_cellphone.ENDDATETIME BETWEEN dateadd(HOUR,-2,ds_ram_retail_repository.CREATEDDATE) AND dateadd(HOUR,2, ds_ram_retail_repository.CREATEDDATE)
               AND (ds_pcce_termination_call_agent_session_cellphone.Agent = ds_agent_key.CISCO_LOGINNAME OR ds_pcce_termination_call_agent_session_cellphone.Agent = ds_agent_key_secundary.CISCO_LOGINNAME)
              LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} ds_pcce_termination_call_agent_session_cigh
                ON COALESCE(s_ams_customer_mroc.ResFullPhone,s_ams_customer_mroc.BusFullPhone,s_ams_customer_mroc.MarineFullPhone, s_ams_customer_mroc.OtherFullPhone,s_ams_customer_mroc.PagerFullPhone,s_ams_customer_mroc.FaxFullPhone) = REPLACE(ds_pcce_termination_call_agent_session_cigh.ANI,'+1','')
               AND ds_pcce_termination_call_agent_session_cigh.ENDDATETIME BETWEEN dateadd(HOUR,-2,ds_ram_retail_repository.CREATEDDATE) AND dateadd(HOUR,2, ds_ram_retail_repository.CREATEDDATE)
               AND (ds_pcce_termination_call_agent_session_cigh.Agent = ds_agent_key.CISCO_LOGINNAME OR ds_pcce_termination_call_agent_session_cigh.Agent = ds_agent_key_secundary.CISCO_LOGINNAME)
              LEFT JOIN {{ ref('STAGE','V_S_AP1_APPOINTMENT_MROC_CURRENT') }} v_s_ap1_appointment_mroc_current
                ON v_s_ap1_appointment_mroc_current.LeadID = ds_ram_retail_repository.LeadID
               AND date(v_s_ap1_appointment_mroc_current.DATETIMEUTC) =date(ds_ram_retail_repository.CREATEDDATE)
              LEFT JOIN {{ ref('STAGE','V_S_AP1_APPOINTMENTSTATUSTYPE_MROC_CURRENT') }} v_s_ap1_appointmentstatustype_mroc_current
                ON v_s_ap1_appointmentstatustype_mroc_current.AppointmentStatusTypeID = v_s_ap1_appointment_mroc_current.AppointmentStatusTypeID
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ds_ram_retail_repository.OFFICECODE=ds_retail_office.OFFICECODE
             WHERE date(ds_ram_retail_repository.CREATEDDATE) BETWEEN '2021-05-01' AND '2021-05-18'
               AND ds_ram_retail_repository.CLASSIFICATIONGROUP='New Business'
               AND SOURCEDB IN ('AppOne','CIGH') QUALIFY ROW_NUMBER() OVER (
            PARTITION BY ds_ram_retail_repo
