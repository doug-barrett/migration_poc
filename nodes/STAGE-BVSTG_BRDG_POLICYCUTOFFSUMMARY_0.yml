      - aliases:
          BVSTG_AP1_TRANSACTIONSUMMARY: 1ecf184d-2c34-4547-aff8-73851c98894b
          BVSTG_AP1_AU_PREMIUMCHANGE: d89492b1-1251-4279-862d-71844f83b4bc
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: BVSTG_AP1_AU_PREMIUMCHANGE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AP1_TRANSACTIONSUMMARY') }} bvstg_ap1_transactionsummary
              LEFT JOIN (
                    SELECT TransactionID AS Last_TransactionID ,
                           NBTransactionID ,
                           PolicyNumber AS Last_PolicyNumber ,
                           Effectivedate AS Last_Effectivedate ,
                           BIA_ExpirationDate AS Last_ExpirationDate ,
                           BIA_Status AS Last_Status ,
                           BIA_StatusDate AS Last_StatusDate ,
                           RANK() OVER (PARTITION BY NBTransactionID ORDER BY CASE WHEN Status IN ('Active','Reinstated','Pending cancel non-pay','Pending cancel UW') THEN 1 ELSE 2 END,effectivedate DESC,TransactionID) AS Ranking
                      FROM {{ ref('STAGE','BVSTG_AP1_TRANSACTIONSUMMARY') }}
                     WHERE TransactionType = 'Renewal'
                   )bvstg_ap1_transactionsummary_renwals
                ON (bvstg_ap1_transactionsummary.TransactionID = bvstg_ap1_transactionsummary_renwals.NBTransactionID AND bvstg_ap1_transactionsummary_renwals.Ranking = 1)
              LEFT JOIN (
                    SELECT PolicyID ,
                           SUM(PREMIUMAMOUNT) AS PremiumAmount ,
                           SUM(CASE WHEN isWrittenPremium = 1 THEN PREMIUMAMOUNT ELSE 0 END) AS WrittenPremium
                      FROM {{ ref('STAGE','BVSTG_AP1_AU_PREMIUMCHANGE') }}
                     GROUP BY PolicyID
                   )bvstg_ap1_au_premiumchange
                ON (bvstg_ap1_au_premiumchange.PolicyID = bvstg_ap1_transactionsummary.PolicyID)
             WHERE bvstg_ap1_transactionsummary.TransactionType='New Business'
               AND bvstg_ap1_transactionsummary.isVoid = 0
               AND bvstg_ap1_transactionsummary.isCorporateVoid = 0
               AND bvstg_ap1_transactionsummary.CarrierName not like '%Nation Safe Drivers%'
        name: SRC_bvstg_brdg_policycutoffsummary_2
