    sourceMapping:
      - aliases:
          BVSTG_AP1_TRANSACTIONSUMMARY: b923700f-2327-4297-9daa-42eeaf8bf344
          BVSTG_AP1_AU_PREMIUMCHANGE: 240baaf3-d74d-4c97-af57-7a68e2a257c1
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: BVSTG_AP1_AU_PREMIUMCHANGE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AP1_TRANSACTIONSUMMARY') }} bvstg_ap1_transactionsummary
              LEFT JOIN (
                    SELECT TransactionID AS Last_TransactionID ,
                           NBTransactionID ,
                           PolicyNumber AS Last_PolicyNumber ,
                           Effectivedate AS Last_Effectivedate ,
                           BIA_ExpirationDate AS Last_ExpirationDate ,
                           BIA_Status AS Last_Status ,
                           BIA_StatusDate AS Last_StatusDate ,
                           RANK() OVER (PARTITION BY NBTransactionID ORDER BY CASE WHEN Status IN ('Active','Reinstated','Pending cancel non-pay','Pending cancel UW') THEN 1 ELSE 2 END,effectivedate DESC,TransactionID) AS Ranking
                      FROM {{ ref('STAGE','BVSTG_AP1_TRANSACTIONSUMMARY') }}
                     WHERE TransactionType = 'Renewal'
                   )bvstg_ap1_transactionsummary_renwals
                ON (bvstg_ap1_transactionsummary.TransactionID = bvstg_ap1_transactionsummary_renwals.NBTransactionID AND bvstg_ap1_transactionsummary_renwals.Ranking = 1)
              LEFT JOIN (
                    SELECT PolicyID ,
                           SUM(PREMIUMAMOUNT) AS PremiumAmount ,
                           SUM(CASE WHEN isWrittenPremium = 1 THEN PREMIUMAMOUNT ELSE 0 END) AS WrittenPremium
                      FROM {{ ref('STAGE','BVSTG_AP1_AU_PREMIUMCHANGE') }}
                     GROUP BY PolicyID
                   )bvstg_ap1_au_premiumchange
                ON (bvstg_ap1_au_premiumchange.PolicyID = bvstg_ap1_transactionsummary.PolicyID)
             WHERE bvstg_ap1_transactionsummary.TransactionType='New Business'
               AND bvstg_ap1_transactionsummary.isVoid = 0
               AND bvstg_ap1_transactionsummary.isCorporateVoid = 0
               AND bvstg_ap1_transactionsummary.CarrierName not like '%Nation Safe Drivers%'
        name: SRC_bvstg_brdg_policycutoffsummary_2
        noLinkRefs: []
      - aliases:
          DS_AMS_TRANSACTIONDETAIL: 4936a3c8-0f74-4387-9efa-a5a8cec1fedb
          BVSTG_AMS_RENEWALS_NBPOLICY_EMPTY: 56165de0-041d-47b8-b177-d7d75ebd83ba
          V_POSB_RENEWALS_RWLPOLICY: 943df2a8-1435-4ac7-8e93-d2c55163d868
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_AMS_TRANSACTIONDETAIL
          - locationName: STAGE
            nodeName: BVSTG_AMS_RENEWALS_NBPOLICY_EMPTY
          - locationName: UNKNOWN
            nodeName: V_POSB_AMS_STATUSDATE
          - locationName: STAGE
            nodeName: V_POSB_RENEWALS_RWLPOLICY
        join:
          joinCondition: |-
            FROM (
                    SELECT id
                      FROM {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }}
                     WHERE modeid IN (12,32)
                     UNION SELECT MIN(b.id) AS id
                      FROM {{ ref('STAGE','BVSTG_AMS_RENEWALS_NBPOLICY_EMPTY') }} a
                     INNER JOIN {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} b
                        ON b.PolicyID = a.RWLPolicyID
                       AND b.modeid = 14
                     GROUP BY a.RWLPolicyID
                   )AS bvstg_ams_renewals_nbpolicy_empty
             INNER JOIN {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} ds_ams_transactiondetail
                ON (bvstg_ams_renewals_nbpolicy_empty.id = ds_ams_transactiondetail.id)
              LEFT JOIN {{ ref('UNKNOWN','V_POSB_AMS_STATUSDATE') }} v_posb_ams_statusdate
                ON (ds_ams_transactiondetail.PolicyId = v_posb_ams_statusdate.PolicyID)
              LEFT JOIN (
                    SELECT PolicyID AS Last_PolicyID ,
                           NBPolicyID ,
                           PolicyNumber AS Last_PolicyNumber ,
                           PolicyEffectiveDate AS Last_PolicyEffectiveDate ,
                           PolicyExpirationDate AS Last_PolicyExpirationDate ,
                           Status AS Last_Status ,
                           StatusDate AS Last_StatusDate ,
                           RANK() OVER (PARTITION BY NBPolicyID ORDER BY CASE WHEN Status IN ('Active') THEN 1 ELSE 2 END,PolicyEffectiveDate DESC,PolicyID) AS Ranking
                      FROM {{ ref('STAGE','V_POSB_RENEWALS_RWLPOLICY') }}
                   )v_posb_renewals_rwlpolicy
                ON (ds_ams_transactiondetail.PolicyID = v_posb_renewals_rwlpolicy.NBPolicyID AND v_posb_renewals_rwlpolicy.Ranking = 1)
