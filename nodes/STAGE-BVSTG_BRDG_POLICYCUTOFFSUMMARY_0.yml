          BVSTG_AMS_RENEWALS_NBPOLICY_EMPTY: a620f478-062f-4c19-8a96-96207aa51413
          V_POSB_RENEWALS_RWLPOLICY: ecfa1f24-622e-43dd-86d2-c5ee689b28f8
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_AMS_TRANSACTIONDETAIL
          - locationName: STAGE
            nodeName: BVSTG_AMS_RENEWALS_NBPOLICY_EMPTY
          - locationName: UNKNOWN
            nodeName: V_POSB_AMS_STATUSDATE
          - locationName: STAGE
            nodeName: V_POSB_RENEWALS_RWLPOLICY
        join:
          joinCondition: |-
            FROM (
                    SELECT id
                      FROM {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }}
                     WHERE modeid IN (12,32)
                     UNION SELECT MIN(b.id) AS id
                      FROM {{ ref('STAGE','BVSTG_AMS_RENEWALS_NBPOLICY_EMPTY') }} a
                     INNER JOIN {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} b
                        ON b.PolicyID = a.RWLPolicyID
                       AND b.modeid = 14
                     GROUP BY a.RWLPolicyID
                   )AS bvstg_ams_renewals_nbpolicy_empty
             INNER JOIN {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} ds_ams_transactiondetail
                ON (bvstg_ams_renewals_nbpolicy_empty.id = ds_ams_transactiondetail.id)
              LEFT JOIN {{ ref('UNKNOWN','V_POSB_AMS_STATUSDATE') }} v_posb_ams_statusdate
                ON (ds_ams_transactiondetail.PolicyId = v_posb_ams_statusdate.PolicyID)
              LEFT JOIN (
                    SELECT PolicyID AS Last_PolicyID ,
                           NBPolicyID ,
                           PolicyNumber AS Last_PolicyNumber ,
                           PolicyEffectiveDate AS Last_PolicyEffectiveDate ,
                           PolicyExpirationDate AS Last_PolicyExpirationDate ,
                           Status AS Last_Status ,
                           StatusDate AS Last_StatusDate ,
                           RANK() OVER (PARTITION BY NBPolicyID ORDER BY CASE WHEN Status IN ('Active') THEN 1 ELSE 2 END,PolicyEffectiveDate DESC,PolicyID) AS Ranking
                      FROM {{ ref('STAGE','V_POSB_RENEWALS_RWLPOLICY') }}
                   )v_posb_renewals_rwlpolicy
                ON (ds_ams_transactiondetail.PolicyID = v_posb_renewals_rwlpolicy.NBPolicyID AND v_posb_renewals_rwlpolicy.Ranking = 1)
