        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DEAL_ID ,
                   ID AS TIMELINE_ID ,
                   'ISCREATED' AS ACTIVITY ,
                   CAST(CREATION_DATE AS Timestamp_NTZ(9)) AS TIMESTAMP ,
                   'IM_DEALS' AS SOURCE_DB ,
                   NULL AS TIMELINETYPE,
                   'Not Available' AS PRIMARY_AGENT ,
                   'Not Available' AS TIMELINEAGENT
              FROM RETAIL_PROD.SCH_EDW.DS_IM_DEALS
            UNION ALL SELECT DEAL_ID ,
                   TIMELINE_ID ,
                   'ISQUOTED' ,
                   CAST(CREATEAT AS Timestamp_NTZ(9)) AS TIMESTAMP ,
                   'INSURED_MINE' AS SOURCE_DB ,
                   TIMELINETYPE ,
                   PRIMARY_AGENT ,
                   TIMELINEAGENT
              FROM RETAIL_PROD.SCH_EDW.DS_IM_DEALS_TIMELINES
             WHERE ISQUOTED = 1
            UNION ALL SELECT DEAL_ID ,
                   TIMELINE_ID ,
                   'ISSOLD' ,
                   CAST(CREATEAT AS Timestamp_NTZ(9)) AS TIMESTAMP ,
                   'INSURED_MINE' AS SOURCE_DB ,
                   TIMELINETYPE ,
                   PRIMARY_AGENT ,
                   TIMELINEAGENT
              FROM RETAIL_PROD.SCH_EDW.DS_IM_DEALS_TIMELINES
             WHERE ISSOLD = 1
            UNION ALL SELECT DEAL_ID ,
                   TIMELINE_ID ,
                   'SMS' AS ACTIVITY ,
                   CAST(CREATEAT AS Timestamp_NTZ(9)) AS TIMESTAMP ,
                   'INSURED_MINE' AS SOURCE_DB ,
                   TIMELINETYPE ,
                   PRIMARY_AGENT ,
                   TIMELINEAGENT
              FROM RETAIL_PROD.SCH_EDW.DS_IM_DEALS_TIMELINES
             WHERE TIMELINETYPE ='sms'
            UNION ALL SELECT DEAL_ID ,
                   TIMELINE_ID ,
                   'EMAIL'AS ACTIVITY ,
                   CAST(CREATEAT AS Timestamp_NTZ(9)) AS TIMESTAMP ,
                   'INSURED_MINE' AS SOURCE_DB ,
                   TIMELINETYPE ,
                   PRIMARY_AGENT ,
                   TIMELINEAGENT
              FROM RETAIL_PROD.SCH_EDW.DS_IM_DEALS_TIMELINES
             WHERE TIMELINETYPE ='email'
            UNION ALL SELECT DEAL_ID ,
                   TIMELINE_ID ,
                   ACTIVITY_NAME AS ACTIVITY ,
                   CAST(CREATEAT AS Timestamp_NTZ(9)) AS TIMESTAMP ,
                   'INSURED_MINE' AS SOURCE_DB ,
                   TIMELINETYPE ,
                   PRIMARY_AGENT ,
                   TIMELINEAGENT
              FROM ( SELECT DEAL_ID,
                   TIMELINE_ID,
                   CREATEAT,
                   TIMELINETYPE,
                   PRIMARY_AGENT,
                   TIMELINEAGENT,
                   CASE WHEN ACTIVITY_TYPE IN ('ISWON', 'ISLOST') THEN ACTIVITY_TYPE
                        WHEN ACTIVITY_TYPE = 'Quote_Won'          THEN CONCAT('Quote_Won_', ROW_NUMBER() OVER (PARTITION BY DEAL_ID, ACTIVITY_TYPE ORDER BY CREATEAT,TIMELINE_ID))
                        WHEN ACTIVITY_TYPE = 'Quote_Lost'         THEN CONCAT('Quote_Lost_', ROW_NUMBER() OVER (PARTITION BY DEAL_ID, ACTIVITY_TYPE ORDER BY CREATEAT,TIMELINE_ID))
                         END AS ACTIVITY_NAME
              FROM ( SELECT wle.DEAL_ID,
                   wle.CREATEAT,
                   wle.TIMELINE_ID,
                   wle.PRIMARY_AGENT,
                   wle.TIMELINEAGENT,
                   CASE WHEN ROW_NUMBER() OVER (PARTITION BY wle.DEAL_ID ORDER BY wle.CREATEAT DESC,wle.TIMELINE_ID DESC) = 1 AND wle.BASE_ACTIVITY = wle.FINAL_OUTCOME THEN wle.FINAL_OUTCOME
                        WHEN wle.BASE_ACTIVITY = 'ISWON'                                                                                                                THEN 'Quote_Won'
                        WHEN wle.BASE_ACTIVITY = 'ISLOST'                                                                                                               THEN 'Quote_Lost'
                         END AS ACTIVITY_TYPE,
                   dt.TIMELINETYPE
              FROM ( SELECT wle.DEAL_ID,
                   wle.CREATEAT,
                   wle.BASE_ACTIVITY,
                   wle.TIMELINE_ID,
                   wle.PRIMARY_AGENT,
                   wle.TIMELINEAGENT,
                   lo.MAX_OUTCOME_TIME,
                   lo.FINAL_OUTCOME,
                   LAG(wle.BASE_ACTIVITY) OVER (PARTITION BY wle.DEAL_ID ORDER BY wle.CREATEAT) AS prev_activity,
                   LEAD(wle.BASE_ACTIVITY) OVER (PARTITION BY wle.DEAL_ID ORDER BY wle.CREATEAT) AS next_activity
              FROM (
                    SELECT DEAL_ID,
                           CREATEAT,
                           TIMELINE_ID,
                           PRIMARY_AGENT,
                           TIMELINEAGENT,
                           CASE WHEN ISWON = 1  THEN 'ISWON'
                                WHEN ISLOST = 1 THEN 'ISLOST'
                                ELSE NULL
                                 END AS BASE_ACTIVITY
                      FROM RETAIL_PROD.SCH_EDW.DS_IM_DEALS_TIMELINES
                     WHERE ISWON = 1
                        OR ISLOST = 1
                   ) wle
              LEFT JOIN ( SELECT TIMELINE_ID,
                   DEAL_ID,
                   CREATEAT AS MAX_OUTCOME_TIME,
                   BASE_ACTIVITY AS FINAL_OUTCOME,
                   PRIMARY_AGENT,
                   TIMELINEAGENT
              FROM ( SELECT DEAL_ID,
                   CREATEAT,
                   BASE_ACTIVITY,
                   TIMELINE_ID,
                   PRIMARY_AGENT,
                   TIMELINEAGENT,
                   ROW_NUMBER() OVER (PARTITION BY DEAL_ID ORDER BY CREATEAT DESC,TIMELINE_ID DESC) AS rn
              FROM ( SELECT
