        join:
          joinCondition: |-
            FROM (SELECT *,
                   1 IsPolicyinCS
              FROM (
                    SELECT BVSTG_COMM_POLICY_STATUS_EXTRACT_CS_ID,
                           a.POLICYNUMBERFORMATTED,
                           CARRIER,
                           b.CARRIERDISPLAYNAME,
                           AGENCY,
                           STATECODE,
                           ORIGINAL_PAIDTYPE,
                           PRODUCERCODE,
                           CS_CALCULATION_LOGIC,
                           CSPOLICYNUMBERFORMATTED,
                           CUTOFFDATE,
                           TERM,
                           STARTDATE,
                           ENDDATE,
                           PREMIUM,
                           NEG_PREMIUM_FLAG,
                           CANC_FLAG_EXECMONTH,
                           RENEWAL_FLAG_EXECMONTH,
                           NEW_BUSINESS_FLAG_EXECMONTH,
                           REINSTATEMENT_FLAG_EXECMONTH,
                           ENDORSEMENT_FLAG_EXECMONTH,
                           LATESTNBSRWLPREMIUM,
                           NBSMONTH,
                           ISRENEWALMONTH,
                           MAXEXECUTIONMONTH,
                           POLICYSTATUS_EOM,
                           PAIDTYPE,
                           LASTTRANSACTIONEXECUTIONMONTH,
                           LASTTRANSACTION,
                           LASTCDRCID,
                           TXN_SOURCE_TABLE
                      FROM {{ ref('EDW','DS_COMM_POLICY_STATUS_EXTRACT_CS') }} a
                      LEFT JOIN {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }} b
                        ON a.POLICYNUMBERFORMATTED = b.POLICYNUMBERFORMATTED
                       AND a.CARRIERDISPLAYNAME=b.CARRIERDISPLAYNAME_or
                   ) DS_COMM_POLICY_STATUS_EXTRACT_CS
             WHERE carrier NOT IN ('Nation Safe Drivers', 'Great South Direct Services')
               AND cutoffdate >= '2019-01-01'
               AND cutoffdate <= add_months(date_trunc('month', current_date()),-1) QUALIFY row_number() OVER (PARTITION BY policynumberformatted, carrierdisplayname, cutoffdate ORDER BY policystatus_eom ASC) = 1 --Updated 2/21  ) ds_comm_policy_status_extract_cs   full outer join      (select PolicyNumberFormatted, CarrierName, StartMonthDate, StartDate_CutoffPolicy, EndDate_CutoffPolicy, Active_EOM, 1 IsPolicyInEDW  from   (select distinct ds_bvstg_comm_policynumberformatting_allsources.PolicyNumberFormatted,                  ds_cutoffpolicy_v2.StartMonthDate,                   case when ds_cutoffpolicy_v2.Active_EOM = 1 then 'Active'                       else 'Inactive' end as Active_EOM,                  grace_period,                  ds_cutoffpolicy_v2.StartDate StartDate_CutoffPolicy,                  ds_cutoffpolicy_v2.EndDate EndDate_CutoffPolicy,                  Carrierdisplayname CarrierName,                    row_number() over (partition by ds_bvstg_comm_policynumberformatting_allsources.PolicyNumberFormatted,                                                  Carrierdisplayname,                                                  ds_cutoffpolicy_v2.StartMonthDate                                    order by Active_EOM desc) Row_No      from  {{ ref('EDW','DS_CUTOFFPOLICY_V2') }} ds_cutoffpolicy_v2         left join         (select distinct policyid, carriername         from {{ ref('EDW','DS_POLICYSUMMARY_V2') }}         where sourcedb not in ('Velox','InsuredMine')          ) ds_policysummary_v2          on ds_cutoffpolicy_v2.policyid = ds_policysummary_v2.policyid        left join         (select distinct PolicyNumber_EDW, CarrierName_EDW, PolicyNumberFormatted, CarrierName_Mapped,Carrierdisplayname         from {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}        ) ds_bvstg_comm_policynumberformatting_allsources       -- Change          on ds_bvstg_comm_policynumberformatting_allsources .PolicyNumber_EDW = ds_cutoffpolicy_v2.PolicyNumber              and ds_bvstg_comm_policynumberformatting_allsources .CarrierName_EDW = ds_policysummary_v2.CarrierName      where StartMonthDate >= '2019-01-01' and StartMonthDate <= add_months(date_trunc('month', current_date()),-1))  where row_no = 1 and policynumberformatted is not null and trim(policynumberformatted) not in ('','-', '1', 'NEEDED VOIVED')     and trim(upper(policynumberformatted)) not like '%DO NOT USE%'     and trim(upper(policynumberformatted)) not like '%TAKE%'     and carriername not in ('Nation Safe Drivers', 'Great South Direct Services') and grace_period = 0     and StartDate_CutoffPolicy is not null) ds_cutoffpolicy_v2   on ds_comm_policy_status_extract_cs.policynumberformatted = ds_cutoffpolicy_v2.policynumberformatted   and ds_comm_policy_status_extract_cs.cutoffdate = ds_cutoffpolicy_v2.StartMonthDate  and ds_comm_policy_status_extract_cs.CarrierDisplayName = ds_cutoffpolicy_v2.CarrierName
        name: BVSTG_COMM_AU1_EOM_EXTRACT_ALLSOURCES
        noLinkRefs: []
