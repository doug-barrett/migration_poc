                    SELECT coalesce(ASOFMONTH, ENDDATE) AS ASOFMONTH,
                           coalesce(bvstg_au3_cspr.OFFICECODE, bvstg_au6_cspr.OFFICECODE) AS OFFICECODE,
                           WORKING_DAYS,
                           FTE_NUMERATOR,
                           bvstg_au3_cspr.FTE,
                           TOTAL_STORE_ACTIVITY,
                           CALLS_QUOTES,
                           WORKING_DAYS_STORE_ACTIVITY,
                           CASE WHEN coalesce(ASOFMONTH, ENDDATE) < '2023-01-01' THEN bvstg_au3_cspr.FTE
                                WHEN coalesce(ASOFMONTH,ENDDATE)>= '2023-01-01'  THEN ifnull(bvstg_au6_cspr.FTE, bvstg_au3_cspr.FTE)
                                ELSE bvstg_au3_cspr.FTE
                                 END AS FTE_NEW
                      FROM (
                            SELECT *,
                                   WORKING_DAYS*8 AS Total_working_hrs
                              FROM {{ ref('STAGE','BVSTG_AU3_CSPR') }}
                           ) bvstg_au3_cspr
                      FULL OUTER JOIN (
                            SELECT ENDDATE,
                                   OFFICECODE,
                                   sum(metricvalue) AS FTE
                              FROM (
                                    SELECT enddate,
                                           officecode,
                                           metricvalue
                                      FROM {{ ref('STAGE','BVSTG_AU6_CSPR') }}
                                     WHERE metric = 'fte'
                                 UNION ALL SELECT ENDDATE,

                                  LOCATION,
                                           FTE
                                      FROM {{ ref('STAGE','BVSTG_AU7_CSPR') }}
                                   )
                             GROUP BY ENDDATE,
                                      OFFICECODE
                           ) bvstg_au6_cspr
                        ON bvstg_au3_cspr.OFFICECODE = bvstg_au6_cspr.OFFICECODE
                       AND bvstg_au3_cspr.ASOFMONTH = bvstg_au6_cspr.ENDDATE
                   ) bvstg_au3_cspr
                ON bvstg_au2_cspr.asofmonth = bvstg_au3_cspr.asofmonth
               AND ifnull(bvstg_au2_cspr.officecode,'-') = ifnull(bvstg_au3_cspr.officecode,'-')
