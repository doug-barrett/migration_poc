    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_TABLEAU_AU2
        join:
          joinCondition: |-
            EXTENDED
              FROM( WITH T1 AS (
                    SELECT A.*,
                           B.TARGET_RAM AS TARGET_FEATURE,
                           B.NEXT_POLICY_STATUS_RAM
                      FROM DATA_ANALYTICS.DS_FEATURE_REPO.NB_NSA_RWL_FOLLOWUP_EXTRACT A
                      LEFT JOIN RETAIL_DEV.SCH_BVSTAGE.bvstg_nsa_rwl_tableau_au1 B
                        ON (A.TRANSACTIONID = B.TRANSACTIONID AND A.CUSTOMERID = B.CUSTOMERID AND A.EFFECTIVEDATE = B.EFFECTIVEDATE)
                   ) ,
                   T2 AS (
                    SELECT A.* ,
                           CASE WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 95 THEN '01:[95.0 - 100.0]'
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 92 THEN '02:[92.0 - 94.0]'
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 88 THEN '03:[88.0 - 91.0]'
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 82 THEN '04:[82.0 - 87.0]'
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 77 THEN '05:[77.0 - 81.0]'
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 71 THEN '06:[71.0 - 76.0]'
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 68 THEN '07:[68.0 - 70.0]'
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 63 THEN '08:[63.0 - 67.0]'
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 56 THEN '09:[56.0 - 62.0]'
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 0  THEN '10:[0.0 - 55.0]'
                                ELSE B.DECILE_LABEL
                                 END AS FLAG_DECILE ,
                           CASE WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 95 THEN 1
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 92 THEN 2
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 88 THEN 3
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 82 THEN 4
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 77 THEN 5
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 71 THEN 6
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 68 THEN 7
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 63 THEN 8
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 56 THEN 9
                                WHEN A.INSERTEDDATE < '2026-02-05' AND A.DECILE >= 0  THEN 10
                                ELSE B.DECILE
                                 END AS NUM_DECILE
                      FROM T1 A
                      LEFT JOIN RETAIL_PROD.SCH_EDW.DS_NSA_RENEWAL_ZERO_SCORE B
                        ON (A.TRANSACTIONID = B.TRANSACTIONID AND A.INSERTEDDATE >= '2026-02-05')
                   ) ,
                   T3 AS (
                    SELECT DISTINCT TRANSACTIONID,
                           CUSTOMERID ,
                           CASE WHEN CARRIERNAME IN ('Progressive Insurance - AK','Progressive Insurance - AL','Progressive Insurance - AR' ,'Progressive Insurance - AZ','Progressive Insurance - CA','Progressive Insurance - CO','Progressive Insurance - CT' ,'Progressive Insurance - DC','Progressive Insurance - DE','Progressive Insurance - FL','Progressive Insurance - GA' ,'Progressive Insurance - HI','Progressive Insurance - IA','Progressive Insurance - ID','Progressive Insurance - IL' ,'Progressive Insurance - IN','Progressive Insurance - KS','Progressive Insurance - KY','Progressive Insurance - LA' ,'Progressive Insurance - MD','Progressive Insurance - MI','Progressive Insurance - MN','Progressive Insurance - MO' ,'Progressive Insurance - MS','Progressive Insurance - MT','Progressive Insurance - NC','Progressive Insurance - ND' ,'Progressive Insurance - NE','Progressive Insurance - NH','Progressive Insurance - NJ','Progressive Insurance - NM' ,'Progressive Insurance - NV','Progressive Insurance - NY','Progressive Insurance - OH','Progressive Insurance - OK' ,'Progressive Insurance - OR','Progressive Insurance - PA','Progressive Insurance - RI','Progressive Insurance - SC' ,'Progressive Insurance - SD','Progressive Insurance - TN','Progressive Insurance - TX','Progressive Insurance - UT' ,'Progressive Insurance - VA','Progressive Insurance - WA','Progressive Insurance - WI','Progressive Insurance - WV' ,'Progressive Insurance - WY','Progressive Insurance Company') THEN 'Progressive'
                                ELSE CARRIERNAME
                                 END AS CARRIERNAME
                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                     WHERE CARRIERNAME IS NOT NULL
                   ) SELECT A.* ,
