        join:
          joinCondition: |-
            FROM (
                    SELECT CM.FIRST_GROUP_LEADID ,
                           CM.FIRST_GROUP_LEAD_CREATEDDATE ,
                           CM.CUSTOMERID ,
                           CM.CUSTOMER_CREATED ,
                           CM.SOURCEDB ,
                           CM.SALE_TRANSACTIONID ,
                           CM.SALEDATE ,
                           CASE WHEN CM.RANK_ISCONVERTED = 1 AND TM.Method IS NOT NULL THEN TM.Date
                                ELSE CM.CREATED
                                 END CREATED ,
                           CASE WHEN CM.RANK_ISCONVERTED = 1 AND TM.Method IS NOT NULL THEN TM.Method
                                ELSE CM.METHOD
                                 END METHOD ,
                           CM.RANK_ISLEAD ,
                           CM.RANK_ISQUOTE ,
                           CM.RANK_ISCOMPLETED ,
                           CM.RANK_ISCONVERTED ,
                           CM.ProspectMethod
                      FROM {{ ref('STAGE','BVSTG_AU1_CUSTOMER_METHOD') }} CM
                      LEFT JOIN {{ ref('STAGE','DS_BVSTG_TRANSACTION_METHOD_TYPE') }} TM
                        ON CM.SALE_TRANSACTIONID = TM.TransactionID
                       AND CM.SOURCEDB = TM.sourceDB
                       AND RANK_ISCONVERTED = 1
                     WHERE (Rank_isconverted = 1 OR Rank_isLead = 1 OR Rank_isQuote = 1 OR Rank_isCompleted = 1)
                   )bvstg_au1_customer_method
             GROUP BY CustomerID
