    sourceMapping:
      - aliases:
          DS_COMM_POLICY_PREMIUM_ALLSOURCES: b393fce6-1f40-435e-9e93-c59973177502
          DS_COMM_EOM_EXTRACT_ALLSOURCES: 2b203c3a-983b-4862-9cb4-5a58db260d09
        customSQL:
