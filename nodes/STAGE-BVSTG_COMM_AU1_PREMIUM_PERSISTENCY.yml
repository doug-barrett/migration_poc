    sourceMapping:
      - aliases:
          DS_COMM_POLICY_PREMIUM_ALLSOURCES: 8ec53d7f-c85f-4ec0-8acf-a6c98a76af6c
          DS_COMM_EOM_EXTRACT_ALLSOURCES: 4b167131-73f4-442b-9d87-46ebf7c92976
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_COMM_POLICY_PREMIUM_ALLSOURCES
          - locationName: EDW
            nodeName: DS_COMM_EOM_EXTRACT_ALLSOURCES
        join:
          joinCondition: |-
            FROM ( SELECT *,
                   ifnull(grp, 0) AS Uprate_Policy_Flag
              FROM ( SELECT *,
                   max(CASE WHEN grp_flag <> 0 THEN to_number(substr(monthsfromnbs, 2, len(monthsfromnbs))) END) over(PARTITION BY policynumberformatted, carrier ORDER BY to_number(substr(monthsfromnbs, 2, len(monthsfromnbs))) ROWS UNBOUNDED PRECEDING) AS grp
              FROM ( SELECT *,
                   CASE WHEN monthsfromnbs = 'M1' AND collected_premium > expected_premium THEN 1
                        ELSE 0
                         END AS grp_flag
              FROM ( SELECT DISTINCT ds_comm_policy_premium_allsources.policynumberformatted,
                   ds_comm_policy_premium_allsources.carrier,
                   ds_comm_eom_extract_allsources.customerid,
                   term,
                   policysource,
                   customer_type,
                   agency,
                   agencystate,
                   leadtype,
                   lineofbusiness,
                   paidtype,
                   customerstate,
                   isOnlineBinding,
                   ifnull(isFranchise,0) isFranchise,
                   ifnull(TerritoryManagerName,'Missing') TerritoryManagerName,
                   nbsmonth,
                   asofmonth,
                   ISLEGACYTRANSACTION,
                   combinedstatus_eom,
                   concat('M', to_varchar(datediff('month', nbsmonth, asofmonth)+1)) AS monthsfromnbs,
                   CASE WHEN paidtype = 'As Written' THEN to_number(ifnull(nbs_premium, 0), 20, 2)
                        ELSE to_number((ifnull(nbs_premium, 0)/term), 20, 2)
                         END AS expected_premium,
                   CASE WHEN paidtype = 'As Written' THEN to_number(ifnull(currentpremium, 0), 20, 2)
                        ELSE to_number(ifnull(reportingpremium, 0), 20, 2)
                         END AS collected_premium --from "DATA_LAKE"."BIA_ANALYTICS"."DS_COMM_POLICY_PREMIUM_ALLSOURCES"    --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_POLICY_PREMIUM_ALLSOURCES" ds_comm_policy_premium_allsources    from {{ ref('EDW','DS_COMM_POLICY_PREMIUM_ALLSOURCES') }} ds_comm_policy_premium_allsources    left join (select distinct policynumberformatted, carrier, customerid               --from DS_COMM_EOM_EXTRACT_ALLSOURCES) ds_comm_eom_extract_allsources               --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_EOM_EXTRACT_ALLSOURCES") ds_comm_eom_extract_allsources               from {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}) ds_comm_eom_extract_allsources      on ds_comm_policy_premium_allsources.policynumberformatted = ds_comm_eom_extract_allsources.policynumberformatted      and ds_comm_policy_premium_allsources.carrier = ds_comm_eom_extract_allsources.carrier    where year(nbsmonth) >= 2019    )))) ds_comm_policy_premium_allsources
        name: BVSTG_COMM_AU1_PREMIUM_PERSISTENCY
        noLinkRefs: []
