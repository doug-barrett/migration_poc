    sourceMapping:
    - aliases:
        SRC_EMLSDTFL: 63b18adb-8ae9-5a6c-885b-df7217b9a660
        DV_EQUIPMENT: f2ab5d1b-fae3-5bad-9058-1a74830979ae
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: SRC_EMLSDTFL
        - locationName: GOLD
          nodeName: DV_EQUIPMENT
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'SRC_EMLSDTFL') }} "SRC_EMLSDTFL"
          
          LEFT OUTER JOIN {{ ref('GOLD', 'DV_EQUIPMENT') }} "DV_EQUIPMENT"
          ON  SRC_EMLSDTFL.LDCMP  = DV_EQUIPMENT.Company_Code
          AND SRC_EMLSDTFL.LDEQP0 = DV_EQUIPMENT.Equipment_Code WHERE Aud_Time <= (SELECT MAX(Batch_End) FROM "DOUG_POC"."DP001"."CDC_BATCH" )
            AND Aud_Time > (SELECT MAX(Batch_Start) FROM "DOUG_POC"."DP001"."CDC_BATCH")
            AND (Aud_Code <> 'F' OR (Aud_Code IS NULL AND Aud_Type = 'RR'))
          
          QUALIFY RANK()
          OVER (PARTITION BY  Aud_CNTRRN
          ORDER BY Aud_Time DESC, CASE
          WHEN Aud_Type in ('PT','PX','FI')	THEN 1
          WHEN Aud_Type in ('UB','FB','FP','BR')	THEN 2
          WHEN Aud_Type in ('UP','UR')	THEN 3
          WHEN Aud_Type in ('DL','FD')	THEN 4
          WHEN Aud_Type in ('RR')		THEN 5
          ELSE 0 END DESC) = 1
      name: ETL_EQUIPMENT_LEASE_DETAIL
      noLinkRefs: []
