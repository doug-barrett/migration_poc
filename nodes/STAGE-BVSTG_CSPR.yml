    sourceMapping:
      - aliases:
          BVSTG_AU33_CSPR: 962208d0-0a8d-4db9-95bf-a6057ba64143
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU33_CSPR
        join:
          joinCondition: |-
            FROM (
                    SELECT ASOFMONTH,
                           OFFICECODE_OLD,
                           ANCILLARY_PRODUCT_REVENUE_EDW,
                           FEE_REVENUE_EDW,
                           TOTALNEWPOLICY,
                           PROD_CATEGORY,
                           RENEWALS,
                           PIF,
                           PHONE,
                           INSTORESALE,
                           STORE_TRANSACTIONS_EXCLUDING_SALES,
                           PHONE_TRANSACTIONS_EXCLUDING_SALES,
                           TOTAL_TRANSACTIONS,
                           CALLS_QUOTES,
                           TOTAL_STORE_ACTIVITY,
                           WORKING_DAYS_STORE_ACTIVITY,
                           WORKING_DAYS,
                           FTE_NUMERATOR,
                           FTE_OLD,
                           FTE,
                           VINTAGE,
                           COMMISSION_CDRC,
                           PREMIUM_CDRC,
                           IS_EDW_OFFICECODE,
                           IS_CDRC_OFFICECODE,
                           IS_OS_OFFICECODE,
                           OFFICECODES_MAPPED_OS,
                           MONTHYEAR_OS,
                           ADVERTISING,
                           ADVERTISING_OS,
                           ANCILLARY_INCOME,
                           COMMISSIONS,
                           COMPENSATION,
                           FEE_INCOME,
                           FRANCHISE_REVENUE,
                           INTEREST_INCOME,
                           OFFICE_EXPENSES,
                           CASE WHEN A.OTHER_EXPENSES <> 0 THEN SUM(CASE WHEN A.ACCOUNTS_MAPPED = 'Other Expenses' THEN CORRECTED_VALUES_MONTH_NEW ELSE 0 END) OVER (PARTITION BY A.ASOFMONTH, A.OFFICECODE_OLD)
                                ELSE A.OTHER_EXPENSES
                                 END AS OTHER_EXPENSES,
                           OTHER_REVENUE,
                           PREMIUM_FINANCE_REVENUE,
                           PROFESSIONAL_FEES,
                           RENT_EXPENSE,
                           TRAVEL_ENTERTAINMENT,
                           UTILITIES,
                           COMPENSATION_NEW,
                           TOTAL_REVENUE,
                           REVISED_REVENUE,
                           CODES,
                           BASE_COMP_PER_EMPLOYEE,
                           VARIABLE_PER_POLICY,
                           VARIABLE_PER_RENEWAL,
                           TAX_OF_SALES_COMP,
                           BENEFITS_OF_SALES_COMP,
                           LICENSE_FEE_PER_EMPLOYEE,
                           MODELLED_COMPENSATION,
                           PAYROLL_TAX,
                           TOTAL_OPERATING_EXPENSES,
                           REVISED_EXPENSE,
                           GROSS_MARGIN,
                           UPDATEDATE_UTC,
                           EBITDA,
                           MARGIN_YIELD,
                           CHANGE_IN_EBITDA,
                           REVISED_EBITDA,
                           DIVISION,
                           OFFICECODE,
                           HISTORICOFFICESTATUS,
                           OFFICECLOSEDDATE,
                           LOCATIONSTATUS,
                           OFFICENAME,
                           OFFICETYPE,
                           STATECODE,
                           GEOLOCATIONLATITUDE,
                           GEOLOCATIONLONGITUDE,
                           ADDRESS,
                           CHANNEL,
                           SALESTYPE,
                           DISTRICTMANAGERNAME,
                           SALESVP,
                           TERRITORYMANAGERNAME,
                           OFFICEOPENEDDATE,
                           AREACODE,
                           YEAR_NUMBER,
                           MONTH_NUMBER,
                           STATE,
                           LEADSFROMPRODUCER,
                           TRANSFERS,
                           SALES,
                           QUOTES,
                           ACCOUNTS_MAPPED,
                           CHILD_ACCOUNTS,
                           VALUES_MONTH,
                           COUNTRY,
                           CHANNEL_1,
                           ENTITYNAME,
                           VALUES_MONTH_NEW,
                           TOTAL_PIF_MONTH,
                           EXPECTED_MVR_MONTH,
                           CORRECTED_VALUES_MONTH_NEW
                      FROM (
                            SELECT A.*,
                                   B.TOTAL_PIF_MONTH,
                                   ROUND(C.TOTAL_MVR_2025 * (B.TOTAL_PIF_MONTH / D.TOTAL_PIF),0) AS EXPECTED_MVR_MONTH,
                                   CASE WHEN YEAR(A.ASOFMONTH) = 2025 AND A.ACCOUNTS_MAPPED = 'Other Expenses' AND A.CHILD_ACCOUNTS = 'Cost_of_DMV_MVR_Reports' THEN SUM(ROUND(CASE WHEN B.TOTAL_PIF_MONTH = 0 THEN 0 ELSE (A.PIF / B.TOTAL_PIF_MONTH) * (C.TOTAL_MVR_2025 * (B.TOTAL_PIF_MONTH / D.TOTAL_PIF)) END, 2)) OVER (PARTITION BY A.ASOFMONTH, A.OFFICECODE_OLD)
                                        ELSE A.VALUES_MONTH_NEW
                                         END AS CORRECTED_VALUES_MONTH_NEW
                              FROM {{ ref('STAGE','BVSTG_AU33_CSPR') }} AS A
                              LEFT JOIN (
                                    SELECT A.ASOFMONTH,
                                           SUM(A.PIF) AS TOTAL_PIF_MONTH
                                      FROM {{ ref('STAGE','BVSTG_AU33_CSPR') }} A
                                     WHERE YEAR(A.ASOFMONTH) = 2025
                                       AND EXISTS (
                                            SELECT 1
                                              FROM {{ ref('STAGE','BVSTG_AU33_CSPR') }} B
                                             WHERE B.OFFICECODE_OLD = A.OFFICECODE_OLD
                                               AND B.ASOFMONTH = A.ASOFMONTH
                                               AND B.CHILD_ACCOUNTS = 'Cost_of_DMV_MVR_Reports'
                                           )
                                     GROUP BY A.ASOFMONTH
                                   ) AS B
                                ON A.ASOFMONTH = B.ASOFMONTH
                             CROSS JOIN (
                                    SELECT ROUND(SUM(VALUES_MONTH_NEW),0) AS TOTAL_MVR_2025
                                      FROM {{ ref('STAGE','BVSTG_AU33_CSPR') }}
                                     WHERE YEAR(ASOFMONTH) = 2025
                                       AND ACCOUNTS_MAPPED = 'Other Expenses'
                                       AND CHILD_ACCOUNTS = 'Cost_of_DMV_MVR_Reports'
                                   ) AS C
                             CROSS JOIN (
                                    SELECT SUM(A.PIF) AS TOTAL_PIF
                                      FROM {{ ref('STAGE','BVSTG_AU33_CSPR') }} A
                                     WHERE YEAR(A.ASOFMONTH) = 2025
                                       AND EXISTS (
                                            SELECT 1
                                              FROM {{ ref('STAGE','BVSTG_AU33_CSPR') }} B
                                             WHERE B.OFFICECODE_OLD = A.OFFICECODE_OLD
                                               AND B.ASOFMONTH = A.ASOFMONTH
                                               AND B.CHILD_ACCOUNTS = 'Cost_of_DMV_MVR_Reports'
                                           )
                                   ) AS D
                           ) AS A
                   ) AS BVSTG_AU33_CSPR
