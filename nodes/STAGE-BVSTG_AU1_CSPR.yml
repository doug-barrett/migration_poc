          - locationName: STAGE
            nodeName: BVSTG_0AU1_CSPR
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM (
                    SELECT bvstg_0au1_cspr.asofmonth,
                           ifnull(retail_office.ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS, bvstg_0au1_cspr.officecode) officecode,
                           retail_office1.OfficeName,
                           retail_office1.OfficeType,
                           CASE WHEN (retail_office1.StateCode = 'BC' OR retail_office1.OfficeCode= 'COLT' OR CONTAINS(retail_office1.OfficeCode,'SSB') AND retail_office1.OfficeCode!='GESSB' OR retail_office1.SALESTYPE ='National Telesales') THEN 'NTS'
                                ELSE retail_office1.StateCode
                                 END AS StateCode,
                           retail_office1.GEOLOCATIONLATITUDE,
                           retail_office1.GEOLOCATIONLONGITUDE,
                           retail_office1.ADDRESS,
                           retail_office1.Channel,
                           retail_office1.Salestype,
                           retail_office1.DISTRICTMANAGERNAME,
                           retail_office1.SALESVP,
                           retail_office1.TERRITORYMANAGERNAME,
                           retail_office1.OFFICEOPENEDDATE,
                           retail_office1.officecloseddate,
                           CASE WHEN ((last_day(bvstg_0au1_cspr.asofmonth)>=retail_office1.officeopeneddate AND bvstg_0au1_cspr.asofmonth < retail_office1.officecloseddate) OR last_day(bvstg_0au1_cspr.asofmonth)>=retail_office1.officeopeneddate AND retail_office1.officecloseddate IS NULL) THEN 'Open'
                                WHEN retail_office1.officecode IS NULL                                                                                                                                                                                                                            THEN NULL
                                ELSE 'Closed'
                                 END HistoricOfficeStatus,
                           sum(bvstg_0au1_cspr.Total_Ancillary_Amount) Total_Ancillary_Amount,
                           sum(bvstg_0au1_cspr.Total_Fee_Amount) Total_Fee_Amount,
                           sum(bvstg_0au1_cspr.TOTALNEWPOLICY) TOTALNEWPOLICY,
                           sum(bvstg_0au1_cspr.PIF) PIF,
                           sum(bvstg_0au1_cspr.renewals) renewals,
                           sum(bvstg_0au1_cspr.Phone) Phone,
                           sum(bvstg_0au1_cspr.INSTORESALE) INSTORESALE,
                           sum(bvstg_0au1_cspr.STORE_TRANSACTIONS_EXCLUDING_SALES) STORE_TRANSACTIONS_EXCLUDING_SALES,
                           sum(bvstg_0au1_cspr.PHONE_TRANSACTIONS_EXCLUDING_SALES) PHONE_TRANSACTIONS_EXCLUDING_SALES,
                           sum(bvstg_0au1_cspr.TOTAL_TRANSACTIONS) TOTAL_TRANSACTIONS
                      FROM (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_0AU1_CSPR') }}
                           ) bvstg_0au1_cspr
                      LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} retail_office
                        ON bvstg_0au1_cspr.Officecode = retail_office.officecode
                      LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} retail_office1
                        ON ifnull(retail_office.ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS, bvstg_0au1_cspr.officecode) = retail_office1.officecode
                     GROUP BY bvstg_0au1_cspr.asofmonth,
                              ifnull(retail_office.ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS, bvstg_0au1_cspr.officecode),
                              retail_office1.OfficeName,
                              retail_office1.OfficeType,
                              CASE WHEN (retail_office1.StateCode = 'BC' OR retail_office1.OfficeCode= 'COLT' OR CONTAINS(retail_office1.OfficeCode,'SSB') AND retail_office1.OfficeCode!='GESSB' OR retail_office1.SALESTYPE ='National Telesales') THEN 'NTS'
                                   ELSE retail_office1.StateCode
                                    END,
                              retail_office1.GEOLOCATIONLATITUDE,
                              retail_office1.GEOLOCATIONLONGITUDE,
                              retail_office1.ADDRESS,
                              retail_office1.Channel,
                              retail_office1.Salestype,
                              retail_office1.DISTRICTMANAGERNAME,
                              retail_office1.SALESVP,
                              retail_office1.TERRITORYMANAGERNAME,
                              retail_office1.OFFICEOPENEDDATE,
                              retail_office1.officecloseddate,
                              CASE WHEN ((last_day(bvstg_0au1_cspr.asofmonth)>=retail_office1.officeopeneddate AND bvstg_0au1_cspr.asofmonth < retail_office1.officecloseddate) OR last_day(bvstg_0au1_cspr.asofmonth)>=retail_office1.officeopeneddate AND retail_office1.officecloseddate IS NULL) THEN 'Open'
                                   WHEN retail_office1.officecode IS NULL                                                                                                                                                                                                                            THEN NULL
                                   ELSE 'Closed'
                                    END
                   ) bvstg_0au1_cspr
