      customSQL:
        customSQL: ''
      dependencies:
      - locationName: GOLD
        nodeName: CDC_RAODETFL
      - locationName: GOLD
        nodeName: EQUIPMENT
      - locationName: GOLD
        nodeName: ITEM
      - locationName: GOLD
        nodeName: LOCATION
      - locationName: GOLD
        nodeName: ITEM_EQPT_CLASS
      join:
        joinCondition: 'FROM {{ ref(''GOLD'', ''CDC_RAODETFL'') }} "CDC_RAODETFL"


          LEFT OUTER JOIN {{ ref(''GOLD'', ''EQUIPMENT'') }} "EQUIPMENT"

          ON CDC_RAODETFL.RDCMP = EQUIPMENT.Company_Code

          AND CDC_RAODETFL.Equipment_Code = EQUIPMENT.Equipment_Code

          AND EQUIPMENT.dss_current_flag = ''Y''


          LEFT OUTER JOIN {{ ref(''GOLD'', ''ITEM'') }} "ITEM"

          ON CDC_RAODETFL.RDCMP = ITEM.Company_Code

          AND CDC_RAODETFL.Item_Code = ITEM.Item_Code

          AND CDC_RAODETFL.Stock_Class_Code = ITEM.Stock_Class_Code

          AND ITEM.dss_current_flag = ''Y''


          LEFT OUTER JOIN {{ ref(''GOLD'', ''LOCATION'') }} "LOCATION"

          ON CDC_RAODETFL.RDCMP = LOCATION.Company_Code

          AND CDC_RAODETFL.RDLOC = LOCATION.Location_Code

          AND LOCATION.dss_current_flag = ''Y''


          LEFT OUTER JOIN {{ ref(''GOLD'', ''ITEM_EQPT_CLASS'') }} "ITEM_EQPT_CLASS"

          ON  CDC_RAODETFL.RDCATG = ITEM_EQPT_CLASS.CATEGORY_CODE

          AND CDC_RAODETFL.RDCLAS = ITEM_EQPT_CLASS.CLASS_CODE

          AND ITEM_EQPT_CLASS.DSS_CURRENT_FLAG = ''Y'''
