                         END AS PolicyStatus_EOM
              FROM (SELECT *,
                   max(CASE WHEN CASE WHEN ChangedStatus_v1 IS NULL THEN PolicyStatus ELSE ChangedStatus_v1 END IS NOT NULL THEN CutoffDate END) OVER (PARTITION BY PolicyNumberFormatted, carrier ORDER BY CutoffDate ROWS UNBOUNDED PRECEDING) AS grp2,
