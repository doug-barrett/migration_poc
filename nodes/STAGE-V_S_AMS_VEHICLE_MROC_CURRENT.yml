    sourceMapping:
      - aliases:
          V_S_AMS_VEHICLE_MROC_CURRENT: 52e50954-7bee-45db-87cc-98d1e945624a
          S_AMS_VEHICLE: 4e4f23dc-7539-4b33-bca5-e43352e14bf5
          H_VEHICLE: d556a467-d8dd-4786-848b-417ca9a8abad
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_S_AMS_VEHICLE_MROC_CURRENT') }} COMMENT='Template version:1.0.1' (hk_h_vehicle, polid, vehid, lobid, effdate, status, vehicleno, covehicleno, vehyear, make, model, bodytype, vin, hp, cc, purchasedate, costnew, symbol, agegroup, colsymbol, compsymbol, territory, registerstate, isnew, milesoneway, noofdays, vehusage, performance, odometer, garaged, milesannual, CLASS, isdamage, isbumper, ismulticar, isleased, iscarpool, isnonowned, totalprem, misc1, misc2, misc3, recovery, antilocktype, airbagtype, antithefttype, antitheftcredit, passrestraint, leaseddate, noofweeks, licenseplatenoveh, changedby, changeddate, entereddate, dss_change_hash, dss_record_source, dss_load_date, dss_start_date, dss_version, dss_create_time) AS SELECT S_AMS_VEHICLE.HK_H_VEHICLE,
                   h_vehicle.POLID,
                   h_vehicle.VEHID,
                   h_vehicle.LOBID,
                   h_vehicle.EFFDATE,
                   S_AMS_VEHICLE.STATUS,
                   S_AMS_VEHICLE.VEHICLENO,
                   S_AMS_VEHICLE.COVEHICLENO,
                   S_AMS_VEHICLE.VEHYEAR,
                   S_AMS_VEHICLE.MAKE,
                   S_AMS_VEHICLE.MODEL,
                   S_AMS_VEHICLE.BODYTYPE,
                   S_AMS_VEHICLE.VIN,
                   S_AMS_VEHICLE.HP,
                   S_AMS_VEHICLE.CC,
                   S_AMS_VEHICLE.PURCHASEDATE,
                   S_AMS_VEHICLE.COSTNEW,
                   S_AMS_VEHICLE.SYMBOL,
                   S_AMS_VEHICLE.AGEGROUP,
                   S_AMS_VEHICLE.COLSYMBOL,
                   S_AMS_VEHICLE.COMPSYMBOL,
                   S_AMS_VEHICLE.TERRITORY,
                   S_AMS_VEHICLE.REGISTERSTATE,
                   S_AMS_VEHICLE.ISNEW,
                   S_AMS_VEHICLE.MILESONEWAY,
                   S_AMS_VEHICLE.NOOFDAYS,
                   S_AMS_VEHICLE.VEHUSAGE,
                   S_AMS_VEHICLE.PERFORMANCE,
                   S_AMS_VEHICLE.ODOMETER,
                   S_AMS_VEHICLE.GARAGED,
                   S_AMS_VEHICLE.MILESANNUAL,
                   S_AMS_VEHICLE.CLASS,
                   S_AMS_VEHICLE.ISDAMAGE,
                   S_AMS_VEHICLE.ISBUMPER,
                   S_AMS_VEHICLE.ISMULTICAR,
                   S_AMS_VEHICLE.ISLEASED,
                   S_AMS_VEHICLE.ISCARPOOL,
                   S_AMS_VEHICLE.ISNONOWNED,
                   S_AMS_VEHICLE.TOTALPREM,
                   S_AMS_VEHICLE.MISC1,
                   S_AMS_VEHICLE.MISC2,
                   S_AMS_VEHICLE.MISC3,
                   S_AMS_VEHICLE.RECOVERY,
                   S_AMS_VEHICLE.ANTILOCKTYPE,
                   S_AMS_VEHICLE.AIRBAGTYPE,
                   S_AMS_VEHICLE.ANTITHEFTTYPE,
                   S_AMS_VEHICLE.ANTITHEFTCREDIT,
                   S_AMS_VEHICLE.PASSRESTRAINT,
                   S_AMS_VEHICLE.LEASEDDATE,
                   S_AMS_VEHICLE.NOOFWEEKS,
                   S_AMS_VEHICLE.LICENSEPLATENOVEH,
                   S_AMS_VEHICLE.CHANGEDBY,
                   S_AMS_VEHICLE.CHANGEDDATE,
                   S_AMS_VEHICLE.ENTEREDDATE,
                   S_AMS_VEHICLE.DSS_CHANGE_HASH,
                   S_AMS_VEHICLE.DSS_RECORD_SOURCE,
                   S_AMS_VEHICLE.DSS_LOAD_DATE,
                   S_AMS_VEHICLE.DSS_START_DATE,
                   S_AMS_VEHICLE.DSS_VERSION,
                   S_AMS_VEHICLE.DSS_CREATE_TIME
              FROM {{ ref('DATA_VAULT','S_AMS_VEHICLE') }} AS s_ams_vehicle
             INNER JOIN (
                    SELECT hk_h_vehicle,
                           dss_start_date,
                           LEAD(dss_start_date, 1) OVER (PARTITION BY hk_h_vehicle ORDER BY dss_start_date) AS last_start_date
                      FROM {{ ref('DATA_VAULT','S_AMS_VEHICLE') }}
                   ) sub
                ON s_ams_vehicle.hk_h_vehicle = sub.hk_h_vehicle
               AND s_ams_vehicle.dss_start_date = sub.dss_start_date
             INNER JOIN {{ ref('DATA_VAULT','H_VEHICLE') }} h_vehicle
                ON h_vehicle.hk_h_vehicle = s_ams_vehicle.hk_h_vehicle
             WHERE sub.last_start_date IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY s_ams_vehicle.hk_h_vehicle ORDER BY s_ams_vehicle.dss_start_date) = 1
