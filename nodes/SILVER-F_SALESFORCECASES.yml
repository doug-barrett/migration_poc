LEFT JOIN {{ ref(''SILVER'', ''D_DATE'') }} "D_DATE"
    ON S_SALESFORCECASES.CREATEDDATE = D_DATE.CALENDARDATE
LEFT JOIN {{ ref(''SILVER'', ''D_ICP'') }} "D_ICP"
    ON S_SALESFORCECASES.ICPORFSL = D_ICP.INSTALL
LEFT JOIN {{ ref(''SILVER'', ''D_SALESFORCEFEEDBACK'') }} "D_SALESFORCEFEEDBACK"
    ON S_SALESFORCECASES.FEEDBACKAREA = D_SALESFORCEFEEDBACK.FEEDBACKAREA AND S_SALESFORCECASES.TYPEOFCOMPLAINT = D_SALESFORCEFEEDBACK.TYPEOFCOMPLAINT
LEFT JOIN {{ ref(''SILVER'', ''D_SALESFORCEGENERATION'') }} "D_SALESFORCEGENERATION"
    ON S_SALESFORCECASES.GENERATIONTYPE = D_SALESFORCEGENERATION.GENERATIONTYPE AND S_SALESFORCECASES.ENERGYSTORAGETYPE = D_SALESFORCEGENERATION.ENERGYSTORAGETYPE
LEFT JOIN {{ ref(''SILVER'', ''D_CLOSEDDATE'') }} "D_CLOSEDDATE"
    ON S_SALESFORCECASES.CLOSEDDATE = D_CLOSEDDATE.CLOSEDDATE'
