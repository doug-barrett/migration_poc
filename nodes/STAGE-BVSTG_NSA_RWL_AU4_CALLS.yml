          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
        join:
          joinCondition: |-
            FROM (
                    WITH CALL_HISTORY AS (
                            SELECT BASE_LINE.CUSTOMERID,
                                   BASE_LINE.TRANSACTIONID,
                                   BASE_LINE.STARTDATE,
                                   BASE_LINE.TERM_IN_MONTHS ,
                                   BASE_LINE.ESTIMATE_END_DATE ,
                                   MKT_ID.INTERACTIONIDKEY ,
                                   MKT_ID.DIRECTION
                              FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU0_BSL') }} BASE_LINE
                              LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} MKT_ID
                                ON (BASE_LINE.CUSTOMERID = MKT_ID.CUSTOMERID AND BASE_LINE.SOURCEDB = MKT_ID.SOURCEDB_CUSTOMER AND DATE(MKT_ID.STARTDATETIME) >= BASE_LINE.STARTDATE AND DATE(MKT_ID.STARTDATETIME) < DATEADD(DAY, -30, BASE_LINE.ESTIMATE_END_DATE))
                           ) ,
                           FULL_HISTORY AS (
                            SELECT CALL_HISTORY.CUSTOMERID ,
                                   CALL_HISTORY.TRANSACTIONID ,
                                   CALL_HISTORY.STARTDATE ,
                                   CALL_HISTORY.ESTIMATE_END_DATE ,
                                   CALL_HISTORY.DIRECTION ,
                                   CALL_HISTORY.TERM_IN_MONTHS ,
                                   CALL_SUMMARY.*
                              FROM CALL_HISTORY CALL_HISTORY
                             INNER JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} CALL_SUMMARY
                                ON (CALL_HISTORY.INTERACTIONIDKEY = CALL_SUMMARY.ID)
                           ) ,
                           FEATURE_CREATION AS (
                            SELECT CUSTOMERID ,
                                   TRANSACTIONID ,
                                   TERM_IN_MONTHS ,
                                   ESTIMATE_END_DATE ,
                                   STARTDATE ,
                                   DATEDIFF(DAY, MAX(DATE(STARTDATETIME)), DATEADD(DAY, -30, ESTIMATE_END_DATE)) AS DAYS_SINCE_LAST_CALL ,
                                   DATEDIFF(DAY, MAX(CASE WHEN ISINBOUND = 1 THEN DATE(STARTDATETIME) END), DATEADD(DAY, -30, ESTIMATE_END_DATE)) AS DAYS_SINCE_LAST_INBOUND ,
                                   DATEDIFF(DAY, MAX(CASE WHEN ISOUTBOUND = 1 THEN DATE(STARTDATETIME) END), DATEADD(DAY, -30, ESTIMATE_END_DATE)) AS DAYS_SINCE_LAST_OUTBOUND ,
                                   SUM(CASE WHEN DATE(STARTDATETIME) <= DATEADD(MONTH, 1, STARTDATE) AND TALKTIME > 180 THEN TALKTIME ELSE 0 END) TOTAL_TALKTIME_GREATER_THAN_3MIN_FIRSTMONTH ,
                                   SUM(CASE WHEN ISANSWERCALL = 1 AND TALKTIME > 180 THEN TALKTIME ELSE 0 END) AS TOTAL_ANSWER_TALKTIME_GREATER_THAN_3_MIN_30D_BEF_END
                              FROM FULL_HISTORY
                             GROUP BY CUSTOMERID,
                                      TRANSACTIONID,
                                      TERM_IN_MONTHS,
                                      ESTIMATE_END_DATE,
                                      STARTDATE
                           ) SELECT CUSTOMERID ,
                           TRANSACTIONID ,
                           DAYS_SINCE_LAST_CALL ,
                           DAYS_SINCE_LAST_INBOUND ,
                           DAYS_SINCE_LAST_OUTBOUND ,
                           CASE WHEN TOTAL_ANSWER_TALKTIME_GREATER_THAN_3_MIN_30D_BEF_END = 0 THEN 0
                                ELSE TOTAL_TALKTIME_GREATER_THAN_3MIN_FIRSTMONTH/TOTAL_ANSWER_TALKTIME_GREATER_THAN_3_MIN_30D_BEF_END
                                 END AS RATIO_ANS_EFFEC_TALKTIME_AT_FIRSTMONTH
                      FROM FEATURE_CREATION
                   ) bvstg_nsa_rwl_au4_calls
