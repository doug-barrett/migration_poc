                           a.ENTITY,
                           a.CREATED,
                           TO_VARCHAR(a.CustomerID) CustomerID,
                           b.TransactionID,
                           c.Created TransactionDate
                      FROM {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }} a
                      LEFT JOIN (
                            SELECT leadid,
                                   TransactionID
                              FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }}
                             WHERE TransactionID IS NOT NULL QUALIFY row_number() OVER (PARTITION BY leadid ORDER BY dss_version DESC)=1
                           ) b
                        ON a.LeadID = TO_VARCHAR(b.LeadID)
                      LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} c
                        ON c.TransactionID = b.TransactionID
                     WHERE ENTITY IN('New Sale','Lead','New Quote','Transfer')
                     UNION SELECT TO_VARCHAR(b.LeadID),
                           'Status',
                           a.BIA_STATUSDATE Created,
                           TO_VARCHAR(a.CustomerID),
                           a.TransactionID,
                           a.Created TransactionDate
                      FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} a
                      LEFT JOIN (
                            SELECT leadid,
                                   TransactionID
                              FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }}
                             WHERE TransactionID IS NOT NULL QUALIFY row_number() OVER (PARTITION BY leadid ORDER BY dss_version DESC)=1
                           ) b
                        ON a.TransactionID = b.TransactionID
                     WHERE a.isVoid = 0
                       AND a.isrowdeleted = 0
                     UNION SELECT TO_VARCHAR(b.LeadID),
                           'Transaction',
                           a.CREATED Created,
                           TO_VARCHAR(a.CustomerID),
                           a.TransactionID,
                           a.Created TransactionDate
                      FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} a
                      LEFT JOIN (
                            SELECT leadid,
                                   TransactionID
                              FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }}
                             WHERE TransactionID IS NOT NULL QUALIFY row_number() OVER (PARTITION BY leadid ORDER BY dss_version DESC)=1
                           ) b
                        ON a.TransactionID = b.TransactionID
                     WHERE a.isVoid = 0
                       AND a.isrowdeleted = 0
                     UNION SELECT TO_VARCHAR(c.LeadID),
                           'TransactionItem',
                           a.CREATED Created,
                           TO_VARCHAR(b.CustomerID),
                           b.TransactionID,
                           b.Created TransactionDate
                      FROM {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONITEM') }} a
                     INNER JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} b
                        ON a.TransactionID = b.TransactionID
                       AND b.isVoid = 0
                       AND b.isrowdeleted = 0
                      LEFT JOIN (
                            SELECT leadid,
                                   TransactionID
                              FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }}
                             WHERE TransactionID IS NOT NULL QUALIFY row_number() OVER (PARTITION BY leadid ORDER BY dss_version DESC)=1
                           ) c
                        ON b.TransactionID = c.TransactionID
                     WHERE a.isVoid = 0
                       AND a.isrowdeleted = 0
                     UNION SELECT '' LeadID,
                           'Activity',
                           Created,
                           TO_VARCHAR(CustomerID),
                           TransactionID,
                           NULL
                      FROM (
                            SELECT *
                              FROM {{ ref('DATA_VAULT','S_AP1_ACTIVITY_MROC') }}
                             WHERE CustomerID IS NOT NULL QUALIFY row_number() OVER (PARTITION BY activityid ORDER BY dss_version DESC)=1
                           )
                     UNION SELECT TO_VARCHAR(b.LeadID),
                           'InactivePolicy',
                           a1.CREATED Created,
                           TO_VARCHAR(a.CustomerID),
                           a.TransactionID,
                           a1.STOP_EMAILDATE TransactionDate
                      FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} a
                     INNER JOIN {{ ref('EDW','DS_INACTIVE_POLICIES') }} a1
                        ON a.PolicyID = a1.PolicyID
                      LEFT JOIN (
                            SELECT leadid,
                                   TransactionID
                              FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }}
                             WHERE TransactionID IS NOT NULL QUALIFY row_number() OVER (PARTITION BY leadid ORDER BY dss_version DESC)=1
                           ) b
                        ON a.TransactionID = b.TransactionID
                     WHERE a.isVoid = 0
                       AND a.isrowdeleted = 0
                       AND a1.ISPRODUCER_ACTIVE = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY a1.PolicyID ORDER BY a1.STOP_EMAILDATE DESC)=1
                   ) DS_BVSTG_AP1_LEADHISTORY
                ON TO_VARCHAR(bvstg_mkt_au1_call_customer.CustomerID) =TO_VARCHAR(DS_BVSTG_AP1_LEADHISTORY.CustomerID)
               AND DS_BVSTG_AP1_LEADHISTORY.CREATED <= DATEADD(HOUR,1,bvstg_mkt_au1_call_customer.STARTDATETIME)
               AND bvstg_mkt_au1_call_customer.SOURCEDB_CUSTOMER = 'AppOne' --AND DATE(DS_BVSTG_AP1_LEADHISTORY.CREATED)> DATEADD(DAY,-365,DATE(bvstg_mkt_au1_call_customer.STARTDATETIME))   LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CUS
