      join:
        joinCondition: 'FROM {{ ref(''GOLD'', ''CV_LOCATION'') }} "CV_LOCATION"


          INNER JOIN {{ ref(''GOLD'', ''CV_LOCATION_STATUS_HIST'') }} "CV_LOCATION_STATUS_HIST"

          ON CV_LOCATION.Location_Id = CV_LOCATION_STATUS_HIST.Location_Id

          AND CV_LOCATION.company_code = ''U1''


          INNER JOIN {{ ref(''GOLD'', ''CV_REGION'') }} "CV_REGION"

          ON CV_LOCATION.Analysis_Region_Id = CV_REGION.Region_Id


          INNER JOIN {{ ref(''GOLD'', ''CV_REGION'') }} "CV_REGION1"

          ON CV_LOCATION.Inventory_Region_Id = CV_REGION1.Region_Id


          INNER JOIN {{ ref(''GOLD'', ''CV_DISTRICT'') }} "CV_DISTRICT"

          ON CV_LOCATION.District_id = CV_DISTRICT.District_Id


          LEFT OUTER JOIN {{ ref(''GOLD'', ''CV_MARKET'') }} "CV_MARKET"

          ON CV_LOCATION.Market_id = CV_MARKET.Market_Id

          AND CV_MARKET.Market_Type_Code = ''R''


          LEFT OUTER JOIN {{ ref(''GOLD'', ''CV_TRADE_AREA'') }} "CV_TRADE_AREA"

          ON CV_LOCATION.Trade_Area_Id = CV_TRADE_AREA.Trade_Area_Id


          LEFT OUTER JOIN {{ ref(''GOLD'', ''CV_LOCATION_MANAGER'') }} "CV_LOCATION_MANAGER"

          ON CV_LOCATION.Location_Id = CV_LOCATION_MANAGER.Location_Id'
