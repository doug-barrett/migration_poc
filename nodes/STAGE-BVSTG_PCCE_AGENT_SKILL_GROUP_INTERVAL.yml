                   {{ ref('STAGE','V_DLBV_PCCE_PERSON_CURRENT') }} v_dlbv_pcce_person_current
             WHERE v_dlbv_pcce_skill_group_current.SkillTargetID = v_dlbv_pcce_agent_skill_group_interval_current.SkillGroupSkillTargetID
               AND v_dlbv_pcce_skill_group_current.MRDomainID = v_dlbv_pcce_media_routing_domain_current.MRDomainID
               AND (v_dlbv_pcce_skill_group_current.SkillTargetID NOT IN (SELECT BaseSkillTargetID FROM {{ ref('STAGE','V_DLBV_PCCE_SKILL_GROUP_CURRENT') }} WHERE (Priority > 0) AND (Deleted <> 'Y')))
               AND v_dlbv_pcce_agent_current.SkillTargetID=v_dlbv_pcce_agent_skill_group_interval_current.SkillTargetID
               AND v_dlbv_pcce_agent_current.PersonID = v_dlbv_pcce_person_current.PersonID
               AND (('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,v_dlbv_pcce_skill_group_current.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Cisco_Refresh_Days }}') OR ('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND DATE(v_dlbv_pcce_skill_group_current.DSS_CREATE_TIME) >= DATE(CURRENT_DATE())))
             GROUP BY v_dlbv_pcce_media_routing_domain_current.EnterpriseName,
