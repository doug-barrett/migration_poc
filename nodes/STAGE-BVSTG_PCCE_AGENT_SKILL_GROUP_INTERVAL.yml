        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_DLBV_PCCE_SKILL_GROUP_CURRENT') }} v_dlbv_pcce_skill_group_current,
                   {{ ref('STAGE','V_DLBV_PCCE_AGENT_SKILL_GROUP_INTERVAL_CURRENT') }} v_dlbv_pcce_agent_skill_group_interval_current,
                   {{ ref('STAGE','V_DLBV_PCCE_MEDIA_ROUTING_DOMAIN_CURRENT') }} v_dlbv_pcce_media_routing_domain_current,
