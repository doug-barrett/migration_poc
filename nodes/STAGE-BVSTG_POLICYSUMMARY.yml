        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU2_POLICYSUMMARY
          - locationName: UNKNOWN
            nodeName: V_POSB_POLICYSUMMARY_PREV
          - locationName: UNKNOWN
            nodeName: V_POSB_POLICYSUMMARY_NEXT
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
          - locationName: EDW
            nodeName: DS_COMM_MASTER_POLICY_EXTRACT
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_CUSTOMER
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU2_POLICYSUMMARY') }} bvstg_au2_policysummary
              LEFT JOIN {{ ref('UNKNOWN','V_POSB_POLICYSUMMARY_PREV') }} bvstg_au2_policysummary_prev
                ON bvstg_au2_policysummary.policyID = bvstg_au2_policysummary_prev.PolicyID
              LEFT JOIN {{ ref('UNKNOWN','V_POSB_POLICYSUMMARY_NEXT') }} bvstg_au2_policysummary_next
                ON bvstg_au2_policysummary.policyID = bvstg_au2_policysummary_next.PolicyID
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }} DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
                ON bvstg_au2_policysummary.PolicyNumber = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.POLICYNUMBER_EDW
               AND bvstg_au2_policysummary.CARRIERNAME = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.CARRIERNAME_EDW
              LEFT JOIN {{ ref('EDW','DS_COMM_MASTER_POLICY_EXTRACT') }} DS_COMM_MASTER_POLICY_EXTRACT
                ON DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.POLICYNUMBERFORMATTED = DS_COMM_MASTER_POLICY_EXTRACT.POLICYNUMBERFORMATTED
               AND DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.CARRIERDISPLAYNAME = DS_COMM_MASTER_POLICY_EXTRACT.CARRIER
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_CUSTOMER') }} ds_bvstg_ap1_customer
                ON bvstg_au2_policysummary.Customerid = TO_VARCHAR(ds_bvstg_ap1_customer.CustomerID)
               AND LEN(IFNULL(ds_bvstg_ap1_customer.AP1_CUSTOMER_CIGHID,'')) > 12
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 DS_CUSTOMERSUMMARY_V2_cigh
                ON DS_CUSTOMERSUMMARY_V2_cigh.CustomerID = IFNULL(ds_bvstg_ap1_customer.AP1_CUSTOMER_CIGHID,'')
               AND DS_CUSTOMERSUMMARY_V2_cigh.SourceDB = 'CIGH'
             WHERE bvstg_au2_policysummary.policyid IS NOT NULL
               AND bvstg_au2_policysummary.isvoid=0
               AND bvstg_au2_policysummary.ISROWDELETED=0
               AND bvstg_au2_policysummary.ISCORPORATEVOID=0 QUALIFY ROW_NUMBER() OVER (PARTITION BY IFNULL(DS_CUSTOMERSUMMARY_V2_cigh.SourceDB,bvstg_au2_policysummary.SourceDB), IFNULL(DS_CUSTOMERSUMMARY_V2_cigh.Customerno,bvstg_au2_policysummary.Customerno), CASE WHEN bvstg_au2_policysummary.ISLEGACYTRANSACTION='Native' THEN bvstg_au2_policysummary.PolicyID ELSE bvstg_au2_policysummary.PolicyNumber END ORDER BY CASE WHEN bvstg_au2_policysummary.status_standard='Active' THEN 1 ELSE 2 END) = 1
