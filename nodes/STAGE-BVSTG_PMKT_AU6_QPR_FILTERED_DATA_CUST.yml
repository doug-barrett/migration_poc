        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL
        join:
          joinCondition: |-
            FROM ( SELECT inner_base.*,
                   SUM(inner_base.call_duration) OVER (PARTITION BY inner_base.customers) / NULLIF(inner_base.total_calls, 0) AS avg_call_duration,
                   SUM(inner_base.gap_between_call) OVER (PARTITION BY inner_base.customers) / NULLIF(inner_base.total_calls - 1, 0) AS avg_gap_between_calls,
                   SUM(inner_base.total_transfers_event) OVER (PARTITION BY inner_base.customers) AS total_transfers,
                   SUM(inner_base.total_transfers_event) OVER (PARTITION BY inner_base.customers) / NULLIF(inner_base.total_calls, 0) AS avg_transfer_per_call
              FROM ( SELECT t2.*,
                   DENSE_RANK() OVER (PARTITION BY t2.final_customer_id_to_keep ORDER BY t2.startdatetime, t2.sessionid_final) AS call_number,
                   COUNT(DISTINCT t2.sessionid_final) OVER (PARTITION BY t2.final_customer_id_to_keep) AS total_calls,
                   COUNT(DISTINCT t2.sessionagentid_final) OVER (PARTITION BY t2.final_customer_id_to_keep, t2.sessionid_final) - 1 AS total_transfers_event, -- Step 6: Duration logic (Calculated per session)             CASE                  WHEN t2.source_data = 'cisco'                  THEN DATEDIFF('seconds', MIN(t2.startdatetime) OVER (PARTITION BY t2.sessionid_final), MAX(t2.enddatetime) OVER (PARTITION BY t2.sessionid_final)) / 60                  ELSE 0              END AS call_duration,             CASE                  WHEN (LOWER(t2.action_final_to_take) LIKE '%incoming%' OR LOWER(t2.action_final_to_take) LIKE '%outgoing%')                 THEN DATEDIFF('seconds', t2.startdatetime, LEAD(t2.startdatetime) OVER (PARTITION BY t2.customers ORDER BY t2.startdatetime)) / 60                  ELSE NULL              END AS gap_between_call         FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL t2         WHERE t2.SOURCE_DATA <> 'app one'     ) inner_base ) BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL LEFT JOIN RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID     ON BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL.sessionid_final = BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID.sessionid LEFT JOIN (    SELECT DISTINCT sessionid_final, SECOND_SKILLGROUP, SECOND_SKILL_QUEUE, LAST_SKILLGROUP, LAST_SKILL_QUEUE     FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL    ) bvstg_pmkt_au5_qpr_pm     ON BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL.sessionid_final = bvstg_pmkt_au5_qpr_pm.sessionid_final
