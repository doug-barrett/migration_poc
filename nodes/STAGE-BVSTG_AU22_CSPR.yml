        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU21_CSPR
          - locationName: STAGE
            nodeName: BVSTG_AU6_CSPR
          - locationName: STAGE
            nodeName: BVSTG_AU5_CSPR
          - locationName: STAGE
            nodeName: BVSTG_AU4_CSPR
          - locationName: STAGE
            nodeName: V_DLBV_API_UKG_EMPLOYEEPAYSTATEMENTS_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_API_UKG_JOBS_CURRENT
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU21_CSPR') }} bvstg_au21_cspr
              LEFT JOIN (
                    SELECT ENDDATE,
                           OFFICECODE,
                           sum(GROSSWAGESCURRENT) AS GROSSWAGESCURRENT
                      FROM (
                            SELECT ENDDATE,
                                   OFFICECODE,
                                   METRICVALUE AS GROSSWAGESCURRENT
                              FROM {{ ref('STAGE','BVSTG_AU6_CSPR') }}
                             WHERE metric = 'compensation'
                         UNION ALL SELECT ENDDATE,
                                   ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS AS OFFICECODE,
                                   sum(GROSSWAGESCURRENT) AS GROSSWAGESCURRENT
                              FROM (
                                    SELECT ENDDATE,
                                           EMPLOYEENUMBER,

                                  LOCATION,
                                           sum(GROSSWAGESCURRENT) AS GROSSWAGESCURRENT
                                      FROM (
                                            SELECT bvstg_au5_cspr.*,
                                                   JOB,

                                          LOCATION,
                                                   GROSSWAGESCURRENT
                                              FROM (
                                                    SELECT DISTINCT ENDDATE,
                                                           EMPLOYEENUMBER
                                                      FROM (
                                                            SELECT enddate,
                                                                   EMPLOYEENUMBER,
                                                                   CASE WHEN bvstg_au4_cspr.EMPLOYEE IS NOT NULL THEN 1
                                                                        ELSE 0
                                                                         END AS Flag
                                                              FROM (
                                                                    SELECT DISTINCT enddate,
                                                                           EMPLOYEENUMBER
                                                                      FROM {{ ref('STAGE','BVSTG_AU5_CSPR') }}
                                                                     WHERE metric = 'compensation'
                                                                   ) bvstg_au5_cspr
                                                              LEFT JOIN (
                                                                    SELECT DISTINCT date, employee
                                                                      FROM {{ ref('STAGE','BVSTG_AU4_CSPR') }}
                                                                   ) bvstg_au4_cspr
                                                                ON bvstg_au5_cspr.enddate = bvstg_au4_cspr.date
                                                               AND bvstg_au5_cspr.EMPLOYEENUMBER = bvstg_au4_cspr.employee
                                                           )
                                                     WHERE ENDDATE BETWEEN '2023-01-01' AND (CASE WHEN DAY(CURRENT_DATE()) <= 14 THEN DATEADD(MONTH, -2, CURRENT_DATE()) ELSE DATEADD(MONTH, -1, CURRENT_DATE()) END)
                                                       AND flag = 0
                                                   ) bvstg_au5_cspr
                                              LEFT JOIN (
                                                    SELECT date_trunc(MONTH,to_date(PERIODENDDATE)) AS ENDDATE,
                                                           EMPLOYEENUMBER,
                                                           JOB,

                                                  LOCATION,
                                                           sum(GROSSWAGESCURRENT) AS GROSSWAGESCURRENT
                                                      FROM {{ ref('STAGE','V_DLBV_API_UKG_EMPLOYEEPAYSTATEMENTS_CURRENT') }}
                                                     GROUP BY 1,
                                                              2,
                                                              3,
                                                              4
                                                   ) v_dlbv_api_ukg_employeepaystatements_current
                                                ON bvstg_au5_cspr.ENDDATE = v_dlbv_api_ukg_employeepaystatements_current.ENDDATE
                                               AND bvstg_au5_cspr.EMPLOYEENUMBER = v_dlbv_api_ukg_employeepaystatements_current.EMPLOYEENUMBER
                                           ) bvstg_au5_cspr
                                      LEFT JOIN (
                                            SELECT DISTINCT JOBCODE,
                                                   JOBFAMILY
                                              FROM {{ ref('STAGE','V_DLBV_API_UKG_JOBS_CURRENT') }}
                                           ) v_dlbv_api_ukg_jobs_current
                                        ON bvstg_au5_cspr.JOB = v_dlbv_api_ukg_jobs_current.JOBCODE
                                     WHERE lower(JOBFAMILY) = 'sales'
                                     GROUP BY 1,
                                              2,
                                              3
                                   ) bvstg_au5_cspr
                              LEFT JOIN (
                                    SELECT DISTINCT officecode,
                                           CASE WHEN lower(agencyname) like '%acceptance%' THEN 'Acceptance'
                                                ELSE channel
                                                 END AS channel_1,
                                           statecode,
                                           SALESTYPE,
                                           agencyname,
                                           ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS
                                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                                   ) ds_retail_office
                                ON bvstg_au5_cspr.location = ds_retail_office.officecode
                             WHERE CHANNEL_1 = 'NSA'
                               AND SALESTYPE = 'Brick-e-Sales'
                               AND lower(AGENCYNAME) not like '%velox%'
                               AND lower(STATECODE) <> 'nts'
                             GROUP BY 1,
                                      2
                           )
                     GROUP BY ENDDATE,
                              OFFICECODE
                   ) bvstg_au5_cspr
                ON bvstg_au21_cspr.OFFICECODES_MAPPED = bvstg_au5_cspr.OFFICECODE
               AND bvstg_au21_cspr.MONTHYEAR = bvstg_au5_cspr.ENDDATE
