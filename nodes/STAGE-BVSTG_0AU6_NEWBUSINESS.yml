                   IS_CAMPAIGN_FLAG,
                   TOTALFEES_GROUPED,
                   WRITTENPREMIUM_GROUPED
              FROM (SELECT DISTINCT RAM_RETAIL_ID,
                   policynumberformatted,
                   policyid,
