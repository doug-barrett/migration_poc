                   TOTALFEES_GROUPED,
                   WRITTENPREMIUM_GROUPED
              FROM (
                    SELECT DISTINCT *,
                           CASE WHEN type_of_coverage = 'Missing Coverage' THEN 'Missing Coverage'
                                ELSE 'Other'
                                 END AS Coverage_Type_Limits
                      FROM (
                            SELECT DISTINCT *,
                                   NULL Distinct_Limit_Type
                              FROM {{ ref('STAGE','BVSTG_AU5_NEWBUSINESS') }}
                             WHERE policyid NOT IN (
                                    SELECT DISTINCT policyid
                                      FROM {{ ref('STAGE','BVSTG_AU5_NEWBUSINESS') }}
                                     WHERE (fc_flag = 1 AND coveragetype IN ('BI','PD'))
                                        OR liabilityonlyflag = 1
                                   )
                           )
                   ) bvstg_au5_newbusiness
