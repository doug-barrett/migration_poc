                   NULL Coll_Deductible,
                   NULL Comp_deductible,
                   'Coverage_Type_Limits' Coverage_Flag,
                   isrowdeleted,
                   concatenated_id,
                   agencyname,
                   PAYMENT_MODE,
                   PYMRECEIVED_CASH_GROUPED,
                   PYMRECEIVED_CREDITCARD_GROUPED,
