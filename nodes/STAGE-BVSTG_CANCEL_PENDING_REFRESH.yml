          joinCondition: |-
            FROM {{ ref('EDW','DS_CANCEL_PENDING') }} ds_cancel_pending
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_MKT_CALL_CUSTOMER" DS_MKT_CALL_CUSTOMER
                ON ds_cancel_pending.CustomerID = DS_MKT_CALL_CUSTOMER.CustomerID
               AND DS_MKT_CALL_CUSTOMER.SOURCEDB_CUSTOMER = 'AppOne'
               AND DS_MKT_CALL_CUSTOMER.TCONNECTED >= 10
               AND DS_MKT_CALL_CUSTOMER.STARTDATETIME >= CURRENT_DATE() - 90
             WHERE ds_cancel_pending.ISDIALER = TRUE
               AND ds_cancel_pending.TIMEZONEBIAS IS NOT NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_cancel_pending.CustomerID ORDER BY DS_MKT_CALL_CUSTOMER.STARTDATETIME DESC)=1
