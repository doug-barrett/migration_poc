          - locationName: NP
            nodeName: D_ARAGEINGSNAPSHOT
          - locationName: NP
            nodeName: D_ARAGEING
          - locationName: NP
            nodeName: D_SNAPSHOTPERIOD_VIEW
        join:
          joinCondition: |-
            FROM F_ARTRANSACTIONS
             INNER JOIN D_DEBTOR
                ON F_ARTRANSACTIONS.D_DEBTOR_KEY = D_DEBTOR.D_DEBTOR_KEY
             INNER JOIN D_ARAGEING
                ON F_ARTRANSACTIONS.D_ARAGEING_KEY = D_ARAGEING.D_ARAGEING_KEY
             INNER JOIN D_PERIOD
                ON F_ARTRANSACTIONS.D_PERIOD_KEY = D_PERIOD.D_PERIOD_KEY
             INNER JOIN D_AGEINGBRACKETS
                ON F_ARTRANSACTIONS.D_AGEINGBRACKETS_KEY = D_AGEINGBRACKETS.D_AGEINGBRACKETS_KEY
              LEFT OUTER JOIN {{ ref('NP','D_ARAGEINGSNAPSHOT') }}
                ON CASE WHEN D_ARAGEING.AGEING = 'CLOSED'  THEN 'CURRENT'
                        WHEN D_ARAGEING.AGEING = 'UNKNOWN' THEN D_AGEINGBRACKETS.AGEING180DAYS
                        ELSE D_ARAGEING.AGEING
                         END = D_ARAGEINGSNAPSHOT.AGEING
              LEFT OUTER JOIN {{ ref('NP','D_SNAPSHOTPERIOD_VIEW') }}
                ON (SELECT PERIODNUMBER
              FROM D_PERIOD --SET IT TO THE DAY BEFORE SO ACCOMMODATE FOR PROCESSING THE DAY AFTER  --TRANSACTIONS WILL ONLY CREATE IF THE PERIOD IS PRIOR TO OR EQUAL TO SNAPSHOT PERIOD    WHERE CONVERT(DATE, DATEADD(DAY, -1, GETDATE())) BETWEEN FIRSTDAYOFPERIOD AND LASTDAYOFPERIOD) = D_SNAPSHOTPERIOD_VIEW.PERIODNUMBER  WHERE   --CHANGES MADE TO AGEING BRACKETS - CHANGE THIS TO USE BOTH OLD AND NEW AGEING BRACKETS D_ARAGEING CAN BE REMOVED WHEN OLD AGEING RETIRED  (D_ARAGEING.AGEINGGROUP IN ('CURRENT', 'OVERDUE')  OR D_AGEINGBRACKETS.AGEINGGROUP IN ('CURRENT', 'OVERDUE'))  --EXCLUDE FUTURE DATED DATA FROM SNAPSHOT  AND D_SNAPSHOTPERIOD_VIEW.PERIODNUMBER >= D_PERIOD.PERIODNUMBER
        name: src_S_ARTransactions_SS_1
        noLinkRefs: []
      - aliases:
          F_ARTRANSACTIONS: f06aa052-4e85-466b-bef9-6f07fcf2613b
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: NP
            nodeName: F_ARTRANSACTIONS
        join:
          joinCondition: |-
            FROM {{ ref('NP','F_ARTRANSACTIONS') }} F_ARTRANSACTIONS
             INNER JOIN D_DEBTOR
                ON F_ARTRANSACTIONS.D_DEBTOR_KEY = D_DEBTOR.D_DEBTOR_KEY
             INNER JOIN D_ARAGEING
                ON F_ARTRANSACTIONS.D_ARAGEING_KEY = D_ARAGEING.D_ARAGEING_KEY
             INNER JOIN D_PERIOD
                ON F_ARTRANSACTIONS.D_PERIOD_KEY = D_PERIOD.D_PERIOD_KEY
             INNER JOIN D_AGEINGBRACKETS
                ON F_ARTRANSACTIONS.D_AGEINGBRACKETS_KEY = D_AGEINGBRACKETS.D_AGEINGBRACKETS_KEY
              LEFT OUTER JOIN [D_ARAGEINGSNAPSHOT]
                ON CASE WHEN D_ARAGEING.AGEING = 'CLOSED'  THEN 'CURRENT'
                        WHEN D_ARAGEING.AGEING = 'UNKNOWN' THEN D_AGEINGBRACKETS.AGEING180DAYS
                        ELSE D_ARAGEING.AGEING
                         END = D_ARAGEINGSNAPSHOT.AGEING
              LEFT OUTER JOIN [D_SNAPSHOTPERIOD_VIEW]
                ON (
                    SELECT PERIODNUMBER
                      FROM D_PERIOD
                     WHERE CONVERT(DATE, DATEADD(DAY, -1, GETDATE())) BETWEEN FIRSTDAYOFPERIOD AND LASTDAYOFPERIOD
                   ) = D_SNAPSHOTPERIOD_VIEW.PERIODNUMBER
              LEFT JOIN D_CLOSEDDATE
                ON F_ARTRANSACTIONS.D_CLOSEDDATE_KEY = D_CLOSEDDATE.D_CLOSEDDATE_KEY
             WHERE TRANSACTIONID IN (
                    SELECT I_ARTRANSSUMMARISED.TRANSACTIONID
                      FROM I_ARTRANSSUMMARISED
                      LEFT JOIN I_ARTRANSSUMMARISED_SS
                        ON I_ARTRANSSUMMARISED.TRANSACTIONID = I_ARTRANSSUMMARISED_SS.TRANSACTIONID
                     WHERE I_ARTRANSSUMMARISED.OUTSTANDINGAMOUNT <> I_ARTRANSSUMMARISED_SS.OUTSTANDINGAMOUNT
                   ) --BELOW CODE IT TO ACCOUNT FOR INVOICES CREATED OR RECEIPTED IN THE NEXT PERIOD WHEN THE PRIOR PERIOD IS STILL OPEN  --EXCLUDE NEW INVOICES CREATED IN THE NEXT PERIOD  AND D_SNAPSHOTPERIOD_VIEW.PERIODNUMBER >= D_PERIOD.PERIODNUMBER    --DON'T UPDATE RECEIPTED INVOICES THAT HAVE A CLOSED DATE IN THE NEXT SNAPSHOT PERIOD  AND CLOSEDDATE <= EOMONTH(D_SNAPSHOTPERIOD_VIEW.FIRSTDAYOFPERIOD)  --EXCLUDE RECORDS THAT ARE PARTIAL UPDATES, THESE WILL BE CAPTURED IN FIRST TABLE  AND F_ARTRANSACTIONS.OUTSTANDINGAMOUNT = 0
        name: src_S_ARTransactions_SS_2
        noLinkRefs: []
