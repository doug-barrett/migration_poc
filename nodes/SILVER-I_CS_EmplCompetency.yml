        transform: --WE'RE NOT INTERESTED IN THE TIME OF CERTIFICATION  CASE WHEN
          "L_CS_USERCOMPETENCY"."CERTIFICATIONPERIODEXPIRYDATE" <> ''  THEN   CAST(LEFT("L_CS_USERCOMPETENCY"."CERTIFICATIONPERIODEXPIRYDATE"
          AS DATETIME),103)  ELSE  --SET THE EXPIRY DATE TO THE DATE THAT IT SHOULD
          HAVE BEEN REQUIRED  --LATER WE SET ANYTHING WITHIN 90 DAYS TO BE EXCLUDED
          FROM REPORTING  -- AS IT CAN TAKE THIS LONG TO GET THE PRACTICAL ASSESSMENTS
          COMPLETED  CASE   --WHEN A PL OR CRC COMPETENCY, USE THEIR START DATE UNLESS
          THEY HAVE BEEN HERE FROM THE START OF THE ROLL OUT   WHEN "D_COMPETENCY"."COMPETENCYGROUP"
          IN ('PRACTICING LICENSE','LIVE ELECTRICITY COMPETENCIES')   THEN CASE WHEN
          "D_EMPLOYEE"."STARTDATE" < '2020-04-01' THEN '2020-04-01' ELSE "StartDate"
          END   --WHEN ANOTHER "Competency", THEN USE THE DATE ASSIGNED IN THE "Training"
          "Module"   ELSE CAST(LEFT("L_CS_USERCOMPETENCY".""CertificationPeriodDueDate""
          AS DATETIME),103)   END  END
