        join:
          joinCondition: |-
            EXTENDED
              FROM ( (
                    SELECT table1.monthyear,
                           table1.accounts_mapped,
                           ud2id,
                           ud1id,
                           CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY Accounts_Mapped,ud2id,ud1id ORDER BY monthyear)
                                ELSE values_month
                                 END AS values_month,
                           'Retail_Revenue_Budget' AS sg_description
                      FROM (
                            SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                   accounts_mapped,
                                   ifnull(sum(values_month),0) values_month,
                                   ud2id,
                                   ud1id
                              FROM {{ ref('STAGE','BVSTG_AU27_CONFIE_OPM') }}
                             WHERE concat(ud2id,ud1id) IN (
                                    SELECT DISTINCT concat(ud2id,ud1id)
                                      FROM {{ ref('STAGE','BVSTG_AU18_CONFIE_OPM') }}
                                     WHERE sg_description= 'Retail_Revenue_Budget'
                                   )
                               AND accountid IN (
                                    SELECT DISTINCT accountid
                                      FROM {{ ref('STAGE','BVSTG_AU7_CONFIE_OPM') }}
                                     WHERE sg_description='TotalRevenue'
                                   )
                               AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                             GROUP BY accounts_mapped,
                                      ud2id,
                                      ud1id,
                                      date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                           ) table1
                   )
            UNION ALL (
                    SELECT table2.monthyear,
                           table2.accounts_mapped,
                           ud2id,
                           ud1id,
                           CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY Accounts_Mapped,ud2id,ud1id ORDER BY monthyear)
                                ELSE values_month
                                 END AS values_month,
                           'MGA_Revenue_Budget' AS sg_description
                      FROM (
                            SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                   accounts_mapped,
