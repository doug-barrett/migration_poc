        join:
          joinCondition: |-
            EXTENDED
              FROM ((
                    SELECT monthyear,
                           sum(values_month) OpExp,
                           sg_description
                      FROM (
                            SELECT bvstg_au9.monthyear,
                                   ud2id,
                                   CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY ud2id ORDER BY monthyear)
                                        ELSE values_month
                                         END AS values_month,
                                   'TotalOPExp' AS sg_description
                              FROM (
                                    SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                           ifnull(sum(values_month),0) values_month,
                                           ud2id
                                      FROM (
                                            SELECT UD2ID,
                                                   UD1ID,
                                                   yearid,
                                                   accountid,

                                             MONTH,
                                                   sum(ifnull(values_month,0)) Values_Month
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU6_STORE_EVALUATION') }} UNPIVOT (values_month FOR MONTH IN (M1VALUE,M2VALUE,M3VALUE,M4VALUE,M5VALUE,M6VALUE, M7VALUE,M8VALUE,M9VALUE,M10VALUE,M11VALUE,M12VALUE))
                                             GROUP BY UD2ID,
                                                      UD1ID,
                                                      yearid,
                                                      accountid,

                                                MONTH
                                           )
                                     WHERE ud2id IN (
                                            SELECT DISTINCT ud2id
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU9_CONFIE_OPM') }}
                                             WHERE sg_description= 'Retail_Sales'
                                           )
                                       AND accountid IN (
                                            SELECT DISTINCT accountid
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU22_CONFIE_OPM') }}
                                             WHERE sg_description ='TotalOpExp'
                                           )
                                       AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                                     GROUP BY ud2id,
                                              date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                                   ) bvstg_au9
                           )
                     GROUP BY monthyear,
                              sg_description
                   )
            UNION ALL (
                    SELECT monthyear,
                           sum(values_month) OpExp,
                           sg_description
                      FROM (
                            SELECT bvstg_au9_2.monthyear,
                                   ud2id,
                                   CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY ud2id ORDER BY monthyear)
                                        ELSE values_month
                                         END AS values_month,
                                   'IT_0044' AS sg_description
                              FROM (
                                    SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                           ifnull(sum(values_month),0) values_month,
                                           ud2id
                                      FROM (
                                            SELECT UD2ID,
                                                   UD1ID,
                                                   yearid,
                                                   accountid,

                                             MONTH,
                                                   sum(ifnull(values_month,0)) Values_Month
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU6_STORE_EVALUATION') }} UNPIVOT (values_month FOR MONTH IN (M1VALUE,M2VALUE,M3VALUE,M4VALUE,M5VALUE,M6VALUE, M7VALUE,M8VALUE,M9VALUE,M10VALUE,M11VALUE,M12VALUE))
                                             GROUP BY UD2ID,
                                                      UD1ID,
                                                      yearid,
                                                      accountid,

                                                MONTH
                                           )
                                     WHERE concat(ud2id,ud1id) IN (
                                            SELECT DISTINCT concat(ud2id,ud1id)
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU9_CONFIE_OPM') }}
                                             WHERE sg_description= 'IT_0044'
                                           )
                                       AND accountid IN (
                                            SELECT DISTINCT accountid
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU22_CONFIE_OPM') }}
                                             WHERE sg_description ='TotalOpExp'
                                           )
                                       AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                                     GROUP BY ud2id,
                                              date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                                   ) bvstg_au9_2
                           )
                     GROUP BY monthyear,
                              sg_description
                   )
            UNION ALL (SELECT monthyear,
                   sum(values_month) OpExp,
                   sg_description
              FROM ( SELECT bvstg_au9_3.monthyear,
                   ud2id,
                   CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY ud2id ORDER BY monthyear)
                        ELSE values_month
                         END AS values_month,
                   'IT_0049' AS sg_description
              FROM ( SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                   ifnull(sum(values_month),0) values_month,
                   ud2id
              FROM (SELECT UD2ID,
                   UD1ID,
                   yearid,
                   accountid,

             MONTH,
                   sum(ifnull(values_month,0)) Values_Month
