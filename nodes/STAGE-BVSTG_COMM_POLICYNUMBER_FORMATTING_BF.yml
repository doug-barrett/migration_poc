    sourceMapping:
      - aliases:
          DS_POLICYSUMMARY_V2: 23ba684a-5671-4cfa-9e5f-11f1386d24b3
          DS_CUTOFFPOLICY_V2: e4dcdb03-6b1c-406e-8376-f8cb3860c4ba
