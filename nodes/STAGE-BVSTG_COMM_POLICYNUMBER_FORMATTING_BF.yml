    sourceMapping:
      - aliases:
          DS_POLICYSUMMARY_V2: 9a05931f-0fe2-4275-8b38-8e88eb9c6968
          DS_CUTOFFPOLICY_V2: 5a1fd833-ace3-4f2d-8b67-9ee0046cb1dc
