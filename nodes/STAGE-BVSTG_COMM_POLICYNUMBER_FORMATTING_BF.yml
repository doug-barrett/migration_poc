        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT PolicyNumber,
                   CarrierName_unmapped,
                   PolicyNumberFormatted_v1,
                   CASE WHEN carriername_mapped = 'Kemper' AND length(trim(upper(PolicyNumber)))>=13 THEN ltrim(right(left(trim(upper(PolicyNumber)), 13),7), '0')
                        WHEN carriername_mapped = 'Kemper'AND length(trim(upper(PolicyNumber))) = 9 THEN ltrim(left(trim(upper(PolicyNumber)),7), '0')
                         END AS PolicyNumberFormatted_v2,
                   carriername_mapped,
                   carriername_mapped_or,
                   carrierdisplayname,
                   carrierdisplayname_or,
                   Term_V2,
                   RecordSource
              FROM ( SELECT DISTINCT policynumber ,
                   carriername_unmapped ,
                   "DATA_LAKE"."BIA_ANALYTICS".PolicyNumber_format(CASE WHEN left(upper(trim(Policynumber)),4) IN ('TXOP','AZEP','MSEP','ALEP') THEN 'Bluefire Ignite' WHEN carriername='Bluefire' THEN 'Bluefire Legacy' ELSE carriername END,PolicyNumber) AS PolicyNumberFormatted_v1 ,
                   CASE WHEN left(upper(trim(Policynumber)),4) IN ('TXOP','AZEP','MSEP','ALEP') THEN 'Bluefire Ignite'
                        WHEN carriername='Bluefire'                                             THEN 'Bluefire Legacy'
                        ELSE carriername
                         END AS carriername_mapped ,
                   carriername AS carriername_mapped_or ,
                   CASE WHEN left(upper(trim(Policynumber)),4) IN ('TXOP','AZEP','MSEP','ALEP') THEN 'Bluefire Ignite'
                        WHEN carrierdisplayname='Bluefire'                                      THEN 'Bluefire Legacy'
                        ELSE carrierdisplayname
                         END AS carrierdisplayname ,
                   carrierdisplayname AS carrierdisplayname_or ,
                   CASE WHEN term IN ('6 Months', '6', '-6')      THEN 6
                        WHEN term IN ('1 Year', '12', '-12')      THEN 12
                        WHEN term IN ('1 Month', '1', '31', '-1') THEN 1
                        WHEN term IN ('3 Months', '3', '-3')      THEN 3
                        ELSE NULL
                         END AS Term_v2 ,
                   RecordSource
              FROM ( SELECT DISTINCT policynumbers.policynumber,
                   policynumbers.carriername carriername_unmapped,
                   carriername_grouped carriername,
                   carrierdisplayname,
                   term,
                   RecordSource
              FROM ( SELECT DISTINCT policynumber,
                   carriername,
                   term,
                   'EDW' RecordSource
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} --FROM "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2"                              UNION         SELECT DISTINCT last_policynumber, carriername, term, 'EDW' RecordSource          FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }}       --FROM "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2"                      WHERE last_policynumber is not null           UNION         (          SELECT DISTINCT ds_cutoffpolicy_v2.policynumber, ds_policysummary_v2.carriername, ds_policysummary_v2.term,                         'EDW' RecordSource                        FROM  {{ ref('EDW','DS_CUTOFFPOLICY_V2') }}          --FROM "RETAIL_PROD"."SCH_EDW"."DS_CUTOFFPOLICY_V2"                        ds_cutoffpolicy_v2          LEFT JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2        --LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2" ds_policysummary_v2          ON ds_policysummary_v2.policyid = ds_cutoffpolicy_v2.policyid            )          UNION         SELECT DISTINCT policynumber, carriername, term, 'EDW' RecordSource        --FROM "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"         FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}                              UNION                             SELECT DISTINCT policynumber, carriername, term, 'EDW' RecordSource          FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }}       --FROM "RETAIL_PROD"."SCH_EDW"."DS_AP1_TRANSACTIONSUMMARY"                              UNION                             SELECT DISTINCT policynumber, company, term, 'EDW' RecordSource          FROM
        name: BVSTG_COMM_POLICYNUMBER_FORMATTING_BF
