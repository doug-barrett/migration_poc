    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
        join:
          joinCondition: |-
            EXTENDED
              FROM(SELECT DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.POLICYNUMBERFORMATTED,
                   pol.policyiD,
                   pol.ORGANIZATIONCODE,
                   IFNULL(b.EFFECTIVEDATE, pol.effectivedate) AS EFFECTIVEDATE ,
                   last_effectivedate,
                   b.effectivedate CDRC_effectivedate,
                   pol.POLICYSTATUS,
                   pol.CUSTOMERID,
                   b.MASTERCARRIERID,
                   DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.CARRIERNAME_MAPPED ,
                   DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.CARRIERDISPLAYNAME,
                   b.PRODUCERCODE_CDRC,
                   b.PRODUCERCODE2_CDRC,
                   b.POLICYNUMBER_CDRC,
                   b.CARRIERNAME_CDRC,
                   b.POLICYNUMBER_AL3,
                   b.CARRIERNAME_AL3 ,
                   b.DELETEDCONTRACTNUMBERSEE1MHG18,
                   b.CONTRACTNUMBER,
                   b.REMARKTEXT,
                   b.PRODUCERCODE_AL3,
                   NULLIF(IFNULL(ds_al3_sweeplogs.PRODUCERCODEFINAL, b.PRODUCERCODE_FINAL), '') AS PRODUCERCODE_FINAL ,
                   CASE WHEN NULLIF(IFNULL(ds_al3_sweeplogs.PRODUCERCODEFINAL, b.PRODUCERCODE_FINAL), '') IS NOT NULL THEN 1
                        ELSE 0
                         END AS HAS_PRODUCERCODE,
                   CASE WHEN S_AP1_ENTITYCUSTOMFIELDVALUE.entityid IS NOT NULL THEN 1
                        ELSE 0
                         END AS HAS_APPONEPRODUCERCODE,
                   S_AP1_ENTITYCUSTOMFIELDVALUE.APPONE_PRODUCERCODE
              FROM RETAIL_PROD.SCH_EDW.DS_POLICYSUMMARY_V2 pol
              LEFT JOIN (
                    SELECT DISTINCT policynumber_Edw,
                           carriername_edw,
                           policynumberformatted,
                           carriername_mapped ,
                           carrierdisplayname
                      FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
                   ) DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
                ON DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.policynumber_Edw = pol.policynumber
               AND DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.carriername_Edw = pol.carriername
              LEFT JOIN ( SELECT IFNULL(v_dlbv_comm_carrierdatarepositorycomplete_current.policynumberformatted, a.PolicyNumberFormatted) policynumberformatted,
                   IFNULL(v_dlbv_comm_carrierdatarepositorycomplete_current.carriername_mapped, a.CarrierName_Mapped) carriername_mapped,
                   IFNULl(v_dlbv_comm_carrierdatarepositorycomplete_current.carrierdisplayname, a.CarrierDisplayName) carrierdisplayname,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.producercode_cdrc,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.producercode2_cdrc ,
                   COALESCE(a.policyeffectivedate,a.cdtpolicy_policyeffectivedate,a.effectivedate, a.al3_effectivedate,v_dlbv_comm_carrierdatarepositorycomplete_current.effectivedate_cdrc) effectivedate,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.mastercarrierid,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.policynumber policynumber_cdrc ,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.carrier carriername_cdrc,
                   a.policynumber policynumber_al3,
                   a.carriername carriername_al3,
                   a.DeletedContractNumberSee1MHG18 ,
                   a.Contractnumber,
                   a.remarktext,
                   a.ProducerCode_al3,
                   COALESCE(producercode_Cdrc, producercode2_Cdrc, ProducerCode_al3) ProducerCode_Final
              FROM ( SELECT DISTINCT v_dlbv_comm_carrierdatarepositorycomplete_current.mastercarrierid ,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.policynumber,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.carrier,
                   ds_bvstg_comm_policynumberformatting_allsources.policynumberformatted ,
                   ds_bvstg_comm_policynumberformatting_allsources.carriername_mapped,
                   ds_bvstg_comm_policynumberformatting_allsources.carrierdisplayname,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.producercode producercode_cdrc ,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.producercode2 producercode2_cdrc,
                   DATE(TRY_TO_TIMESTAMP(v_dlbv_comm_carrierdatarepositorycomplete_current.effectivedate,'MON DD YYYY HH12:MIAM')) effectivedate_cdrc
              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT v_dlbv_comm_carrierdatarepositorycomplete_current
              LEFT JOIN (
                    SELECT DISTINCT policynumber_cs,
                           carriername_cs ,
                           policynumberformatted,
                           carriername_mapped,
                           carrierdisplayname
                      FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
                   ) ds_bvstg_comm_policynumberformatting_allsources
                ON ds_bvstg_comm_policynumberformatting_allsources.policynumber_cs = v_dlbv_comm_carrierdatarepositorycomplete_current.policynumber
               AND ds_bvstg_comm_policynumberformatting_allsources.carriername_cs = v_dlbv_comm_carrierdata
        name: SRC_bvstg_producercode_attribution_1_cdrc
        noLinkRefs: []
