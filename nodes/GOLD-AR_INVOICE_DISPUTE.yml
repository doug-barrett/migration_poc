      dependencies:
      - locationName: GOLD
        nodeName: STG_AR_INVOICE_DISPUTE
      join:
        joinCondition: 'FROM {{ ref(''GOLD'', ''STG_AR_INVOICE_DISPUTE'') }} "STG_AR_INVOICE_DISPUTE"

          WHERE AR_INVOICE_DISPUTE.company_code = STG_AR_INVOICE_DISPUTE.Company_Code

          AND AR_INVOICE_DISPUTE.contract_id = STG_AR_INVOICE_DISPUTE.Contract_Id

          AND AR_INVOICE_DISPUTE.invoice_seq_num = STG_AR_INVOICE_DISPUTE.Invoice_Seq_Num

          AND AR_INVOICE_DISPUTE.seq_num = STG_AR_INVOICE_DISPUTE.Seq_Num

          AND AR_INVOICE_DISPUTE.party_id = STG_AR_INVOICE_DISPUTE.Party_Id

          AND (AR_INVOICE_DISPUTE.party_type_code <> STG_AR_INVOICE_DISPUTE.Party_Type_Code

          OR AR_INVOICE_DISPUTE.disputed_amt <> STG_AR_INVOICE_DISPUTE.Disputed_Amt

          OR AR_INVOICE_DISPUTE.disputed_date <> STG_AR_INVOICE_DISPUTE.Disputed_Date

          OR AR_INVOICE_DISPUTE.disputed_time <> STG_AR_INVOICE_DISPUTE.Disputed_Time

          OR AR_INVOICE_DISPUTE.disputed_user <> STG_AR_INVOICE_DISPUTE.Disputed_User

          OR AR_INVOICE_DISPUTE.disputed_reason <> STG_AR_INVOICE_DISPUTE.Disputed_Reason

          OR AR_INVOICE_DISPUTE.resolved_date <> STG_AR_INVOICE_DISPUTE.Resolved_Date

          OR AR_INVOICE_DISPUTE.resolved_time <> STG_AR_INVOICE_DISPUTE.Resolved_Time

          OR AR_INVOICE_DISPUTE.resolved_user <> STG_AR_INVOICE_DISPUTE.Resolved_User

          OR AR_INVOICE_DISPUTE.last_system_maintenance_time <> STG_AR_INVOICE_DISPUTE.Last_System_Maintenance_Time

          OR AR_INVOICE_DISPUTE.resolved_code <> STG_AR_INVOICE_DISPUTE.Resolved_Code

          OR AR_INVOICE_DISPUTE.dispute_type <> STG_AR_INVOICE_DISPUTE.Dispute_Type

          ) FROM {{ ref(''GOLD'', ''STG_AR_INVOICE_DISPUTE'') }} "STG_AR_INVOICE_DISPUTE"

          Where Journal_Type in (1,3,5)

          AND PARTY_ID > 0'
