          Then Coalesce(CUSTOMER_JOB.Job_Location_Address_Id,


          CASH_CUSTOMER_SHIP.Mailing_Address_Id,


          PARTY_ADDRESS.Address_Id,


          LOCATION_ADDRESS.Address_Id)


          Else LOCATION_ADDRESS.Address_Id


          End'
