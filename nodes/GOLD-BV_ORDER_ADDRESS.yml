      dependencies:
      - locationName: GOLD
        nodeName: ORDERS
      - locationName: GOLD
        nodeName: ORDER_PARTY
      - locationName: GOLD
        nodeName: ORDER_PARTY_JOB
      - locationName: GOLD
        nodeName: CUSTOMER_JOB
      - locationName: GOLD
        nodeName: CASH_CUSTOMER_SHIP
      - locationName: GOLD
        nodeName: PARTY_ADDRESS
      - locationName: GOLD
        nodeName: LOCATION_ADDRESS
      - locationName: SILVER
        nodeName: STG_ORDERS
      join:
        joinCondition: "FROM {{ ref('SILVER', 'STG_ORDERS') }} \"ORDERS\"\n\nJOIN\
          \ {{ ref('GOLD', 'ORDER_PARTY') }} \"ORDER_PARTY\"\nON ORDERS.Contract_Key\
          \ = ORDER_PARTY.Contract_Key\nAND ORDERS.Contract_Seq_Key = ORDER_PARTY.Contract_Seq_Key\n\
          \nJOIN {{ ref('GOLD', 'ORDER_PARTY_JOB') }} \"ORDER_PARTY_JOB\"\nON ORDERS.Contract_Key\
          \ = ORDER_PARTY_JOB.Contract_Key\nAND ORDERS.Contract_Seq_Key = ORDER_PARTY_JOB.Contract_Seq_Key\n\
          \nJOIN {{ ref('GOLD', 'LOCATION_ADDRESS') }} \"LOCATION_ADDRESS\"\nON ORDERS.Location_Id\
          \ = LOCATION_ADDRESS.Location_Id\nAND LOCATION_ADDRESS.dss_current_flag\
          \ = 'Y'\nand LOCATION_ADDRESS.Address_Type_Code = 'M'\nAnd LOCATION_ADDRESS.Primary_Ind\
          \ = 'Y'\n\nLEFT OUTER JOIN {{ ref('GOLD', 'CASH_CUSTOMER_SHIP') }} \"CASH_CUSTOMER_SHIP\"\
          \nON  ORDERS.Company_Code = CASH_CUSTOMER_SHIP.Company_Code\nAND ORDERS.Contract_Id\
          \ = CASH_CUSTOMER_SHIP.Contract_Id\nAND ORDERS.Party_Id = CASH_CUSTOMER_SHIP.Party_Id\n\
          \nLEFT OUTER JOIN {{ ref('GOLD', 'CUSTOMER_JOB') }} \"CUSTOMER_JOB\"  \n\
          ON ORDER_PARTY_JOB.Job_Id = CUSTOMER_JOB.Job_Id\nAnd CUSTOMER_JOB.dss_current_flag\
          \ = 'Y'\n\nLEFT OUTER JOIN {{ ref('GOLD', 'PARTY_ADDRESS') }} \"PARTY_ADDRESS\"\
          \  \nON ORDER_PARTY.Party_Id = PARTY_ADDRESS.Party_Id\nAnd ORDER_PARTY.Party_Type_Code\
          \ = PARTY_ADDRESS.Party_Type_Code\nAnd PARTY_ADDRESS.dss_current_flag =\
          \ 'Y' \nand PARTY_ADDRESS.Address_Type_Code = 'M'\nAnd PARTY_ADDRESS.Primary_Ind\
          \ = 'Y'\nWhere ORDERS.Journal_Type in (1,3,5)\n\nQUALIFY RANK()\nOVER (PARTITION\
          \ BY ORDERS.Contract_Key, ORDERS.Contract_Seq_Key\nORDER BY ORDERS.Source_Table_Rank\
          \ Desc) = 1"
