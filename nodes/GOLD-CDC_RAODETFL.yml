          \ RDTYPE, RDSEQ0 \nORDER BY AUD_TIME DESC, AUD_SEQNO DESC, CASE  \nWHEN\
          \ AUD_TYPE in ('PT','PX','FI')\tTHEN 1 \nWHEN AUD_TYPE in ('UB','FB','FP','BR')\t\
