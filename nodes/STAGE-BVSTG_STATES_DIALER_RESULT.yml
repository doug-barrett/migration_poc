            EXTENDED
              FROM (
                    SELECT *,
                           'AZ' StateCode,
                           5048 DialerCode
                      FROM {{ ref('STAGE','V_DLBV_PCCE_DL_5048_5048_CURRENT') }}
                     UNION SELECT *,
                           'TX' StateCode,
                           5051 DialerCode
                      FROM {{ ref('STAGE','V_DLBV_PCCE_DL_5051_5051_CURRENT') }}
                   ) V_DLBV_PCCE_DL_5022_5022_CURRENT
              LEFT JOIN (
                    SELECT detail.DialingListID ,
                           detail.QueryRuleID ,
                           MIN(calls.FIRST_AGENTNAME) FIRST_AGENTNAME ,
                           MIN(calls.FIRST_AGENTOFFICE) FIRST_AGENTOFFICE ,
                           MIN(DS_AGENT_KEY.EmployeeNumber) CallEmployeeNumber ,
                           MAX(calls.DURATION) DURATION ,
                           MAX(calls.RINGTIME) RINGTIME ,
                           MAX(calls.TALKTIME) TALKTIME ,
                           MAX(calls.WORKTIME) WORKTIME ,
                           MAX(TO_NUMBER(detail.PREVIEWTIME/1000)) PREVIEWTIME ,
                           COUNT(1) calls ,
                           MIN(calls.STARTDATETIME) STARTDATETIME ,
                           MAX(detail.datetime) datetime ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'A' THEN 1 ELSE 0 END) Active ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'B' THEN 1 ELSE 0 END) Callback ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'C' THEN 1 ELSE 0 END) Closed ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'D' THEN 1 ELSE 0 END) Dialed ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'F' THEN 1 ELSE 0 END) Fax_Machine ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'L' THEN 1 ELSE 0 END) Not_Allocated ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'J' THEN 1 ELSE 0 END) Agent_rejected ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'M' THEN 1 ELSE 0 END) Max_num_attempts_reached ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'P' THEN 1 ELSE 0 END) Pending ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'R' THEN 1 ELSE 0 END) Retry ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'S' THEN 1 ELSE 0 END) callback_was_requested ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'U' THEN 1 ELSE 0 END) UNKNOWN ,
                           SUM(CASE detail.CallStatusZone1 WHEN 'X' THEN 1 ELSE 0 END) agent_is_not_available
                      FROM {{ ref('STAGE','V_DLBV_PCCE_DIALER_DETAIL_CURRENT') }} detail
                      LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} calls
                        ON calls.ID = CONCAT(detail.RouterCallKey,'-',detail.RouterCallKeyDay)
                      LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY" DS_AGENT_KEY
                        ON DS_AGENT_KEY.CISCO_SKILLTARGETID = calls.FIRST_AGENTSKILLTARGETID
                     WHERE detail.QueryRuleID IN(5048,5051)
                     GROUP BY detail.DialingListID ,
                              detail.QueryRuleID
                   ) V_DLBV_PCCE_DIALER_DETAIL_CURRENT
                ON V_DLBV_PCCE_DL_5022_5022_CURRENT.DialingListID = V_DLBV_PCCE_DIALER_DETAIL_CURRENT.DialingListID
               AND V_DLBV_PCCE_DL_5022_5022_CURRENT.DialerCode = V_DLBV_PCCE_DIALER_DETAIL_CURRENT.QueryRuleID
              LEFT JOIN ( SELECT b.DialingListID ,
                   a.callresult AS last_CallResult ,
                   CASE a.CallResult WHEN '0' THEN 'Dialer has not yet attempted to contact that customer record' WHEN '2' THEN 'Error condition while dialing' WHEN '3' THEN 'Number reported not in service by network' WHEN '4' THEN 'No ringback from network when dial attempted' WHEN '5' THEN 'Operator intercept returned from network when dial attempted' WHEN '6' THEN 'No dial tone when dialer port went off hook' WHEN '7' THEN 'Number reported as invalid by the network' WHEN '8' THEN 'Customer phone did not answer' WHEN '9' THEN 'Customer phone was busy' WHEN '10' THEN 'Customer answered and was connected to agent' WHEN '11' THEN 'Fax machine detected' WHEN '12' THEN 'Answering machine detected' WHEN '13' THEN 'Dialer stopped dialing customer due to lack of agents or network stopped dialing before it was complete' WHEN '14' THEN 'Customer requested callback' WHEN '15' THEN 'Answering machine requested callback' WHEN '16' THEN 'Call was abandoned by the dialer due to lack of agents' WHEN '17' THEN 'Failed TO reserve agent
               FOR persona
        name: BVSTG_STATES_DIALER_RESULT
        noLinkRefs: []
