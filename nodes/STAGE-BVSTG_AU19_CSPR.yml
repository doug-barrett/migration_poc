        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT a.ud2id,
                           a.ud2id_description,
                           a.NAME,
                           CASE WHEN a.ud2id='4196073' THEN 'SALRET3'
                                WHEN a.ud2id='4195999' THEN 'FFSTP2'
                                WHEN a.ud2id='4194966' THEN 'FFWPB2'
                                WHEN a.ud2id='4195517' THEN 'Admin_CA_NSA'
                                WHEN a.ud2id='4195168' THEN 'Admin_CA_NSA'
                                WHEN a.ud2id='4195536' THEN 'Admin_TX_NSA'
                                WHEN a.ud2id='4195351' THEN 'Admin_TX_NSA'
                                WHEN a.ud2id='4195844' THEN 'ExpLk'
                                WHEN a.ud2id='4195998' THEN 'FFTAM2'
                                WHEN a.ud2id='4196059' THEN 'FFKIS2'
                                WHEN a.ud2id='4195717' THEN 'TCRP4'
                                WHEN a.ud2id='4196082' THEN 'FFORL2'
                                WHEN a.ud2id='4196074' THEN 'SALRET4'
                                WHEN a.ud2id='4194976' THEN 'FFMIA2'
                                WHEN a.ud2id='4194433' THEN 'BEAU'
                                WHEN a.ud2id='4195067' THEN 'FRED'
                                WHEN a.ud2id='4196454' THEN 'FFBOY1'
                                WHEN a.ud2id='4195755' THEN 'FAIRF'
                                WHEN a.ud2id='4195042' THEN 'BLOC'
                                WHEN a.ud2id='4195689' THEN NULL
                                WHEN a.ud2id='4195775' THEN NULL
                                WHEN a.ud2id='4195624' THEN '_TX_'
                                WHEN a.ud2id='4195621' THEN '_CA_'
                                WHEN a.ud2id='4196012' THEN '_IL_'
                                ELSE a.Officce_Code_Final
                                 END AS officecodes_mapped
                      FROM (
                            SELECT ud2id,
                                   ud2id_description,
                                   name,
                                   bvstg_au15_cspr.officecodes_mapped,
                                   ifnull(ds_retail_office.active_officerelatedtoofficestatusdetails, bvstg_au15_cspr.officce_code_final) officce_code_final
                              FROM {{ ref('STAGE','BVSTG_AU15_CSPR') }} bvstg_au15_cspr
                              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                                ON bvstg_au15_cspr.officce_code_final = ds_retail_office.officecode
                           ) a
                   ) AS bvstg_au15_cspr
              LEFT JOIN (
                    SELECT bvstg_au18_cspr.childid,
                           CASE WHEN bvstg_au15_cspr.ud2id_description like 'AITN_%' THEN split_part(bvstg_au15_cspr.name,'_',2)
                                ELSE bvstg_au18_cspr.state
                                 END AS state,
                           bvstg_au18_cspr.channel
                      FROM (
                            SELECT childid,
                                   CASE WHEN state = 'BP' THEN 'TX'
                                        ELSE state
                                         END AS state,
                                   channel
                              FROM {{ ref('STAGE','BVSTG_AU18_CSPR') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY CHILDID ORDER BY state ASC, channel ASC) = 1
                           ) bvstg_au18_cspr
                      LEFT JOIN {{ ref('STAGE','BVSTG_AU15_CSPR') }} bvstg_au15_cspr
                        ON bvstg_au18_cspr.childid = bvstg_au15_cspr.ud2id
                   ) AS bvstg_au18_cspr
                ON bvstg_au15_cspr.ud2id = bvstg_au18_cspr.childid
