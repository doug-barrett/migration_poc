      - locationName: BRONZE
        nodeName: L_NPS_yDepartment
      - locationName: GOLD
        nodeName: D_BusinessUnit
      join:
        joinCondition: |-
          FROM {{ ref('BRONZE', 'L_NPS_Audit') }} "L_NPS_Audit"
          FROM {{ ref('BRONZE', 'L_NPS_AuditChecklist') }} "L_NPS_AuditChecklist"
          LEFT JOIN {{ ref('BRONZE', 'L_NPS_yAuditCategory') }} "L_NPS_yAuditCategory"
            ON L_NPS_AUDIT.AUDITCATEGORYID = L_NPS_YAUDITCATEGORY.ID
          LEFT JOIN {{ ref('BRONZE', 'L_NPS_xAuditor') }} "L_NPS_xAuditor"
            ON L_NPS_AUDIT.ID = L_NPS_XAUDITOR.AUDITID AND L_NPS_XAUDITOR.ISLEADAUDITOR = 1
          LEFT JOIN {{ ref('BRONZE', 'L_NPS_Person') }} "L_NPS_Person"
            ON L_NPS_XAUDITOR.PERSONID = L_NPS_PERSON.ID
          LEFT JOIN {{ ref('BRONZE', 'L_NPS_yDepartment') }} "L_NPS_yDepartment"
            ON L_NPS_PERSON.DEPARTMENTID = L_NPS_YDEPARTMENT.ID
          LEFT JOIN {{ ref('GOLD', 'D_BusinessUnit') }} "D_BusinessUnit"
            ON ( L_NPS_YDEPARTMENT.NAME LIKE '[A-Z0-9][A-Z0-9][A-Z0-9] %' AND LEN(D_BUSINESSUNIT.BUSINESSUNITCODE) = 3 AND LEFT(L_NPS_YDEPARTMENT.NAME,3) = D_BUSINESSUNIT.BUSINESSUNITCODE ) OR ( L_NPS_YDEPARTMENT.NAME LIKE '[A-Z0-9][A-Z0-9][A-Z0-9] %' AND LEN(D_BUSINESSUNIT.BUSINESSUNITCODE) = 6 AND LEFT(L_NPS_YDEPARTMENT.NAME,3) + '905' = D_BUSINESSUNIT.BUSINESSUNITCODE )
          GROUP BY AUDITID              ) MAXCHECKLIST     ON L_NPS_AUDIT.ID = MAXCHECKLIST.AUDITID
      name: I_NPS_Audit
      noLinkRefs: []
