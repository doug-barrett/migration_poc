              LEFT JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2_lob
                ON v_preb_policy_91_days_retention.CustomerID = ds_policysummary_v2_lob.CustomerID
               AND v_preb_policy_91_days_retention.SourceDB = ds_policysummary_v2_lob.SourceDB
               AND ds_policysummary_v2_lob.StartDate <= v_preb_policy_91_days_retention.Day_91st
               AND IFNULL(ds_policysummary_v2_lob.EndDate,'2040-01-01') >= v_preb_policy_91_days_retention.Day_91st
               AND ds_policysummary_v2_lob.LineOfBusinessType >= v_preb_policy_91_days_retention.LineOfBusinessType QUALIFY ROW_NUMBER() OVER (PARTITION BY v_preb_policy_91_days_retention.policyID ORDER BY CASE WHEN v_preb_policy_91_days_retention.policyID IS NOT NULL THEN 1 ELSE 2 END, CASE WHEN ds_policysummary_v2_lob.policyID IS NOT NULL THEN 1 ELSE 2 END)=1
