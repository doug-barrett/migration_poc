        join:
          joinCondition: |-
            FROM {{ ref('UNKNOWN','I_RGST_ICPLIST') }} I_RGST_ICPLIST
              LEFT OUTER JOIN {{ ref('UNKNOWN','I_EWHG_ICPDETAILS') }} I_EWHG_ICPDETAILS
                ON I_RGST_ICPLIST.INSTALL = I_EWHG_ICPDETAILS.INSTALL
              LEFT OUTER JOIN {{ ref('UNKNOWN','I_GIS_ICPSTORMFAULTAREA') }} I_GIS_ICPSTORMFAULTAREA
                ON I_RGST_ICPLIST.ICP = I_GIS_ICPSTORMFAULTAREA.DICP_NUMBER
               AND I_GIS_ICPSTORMFAULTAREA.RECORDNUMBER = 1
              LEFT OUTER JOIN {{ ref('UNKNOWN','S_ICPUSAGE12MONTH') }} S_ICPUSAGE12MONTH
                ON I_RGST_ICPLIST.INSTALL = S_ICPUSAGE12MONTH.INSTALL
              LEFT OUTER JOIN {{ ref('UNKNOWN','L_REF_ICPSTATICDATA') }} L_REF_ICPSTATICDATA
                ON I_RGST_ICPLIST.INSTALL = L_REF_ICPSTATICDATA.INSTALL
              LEFT OUTER JOIN {{ ref('UNKNOWN','I_GIS_ICPNETWORKTOPOLOGY') }} I_GIS_ICPNETWORKTOPOLOGY
                ON I_RGST_ICPLIST.ICP = I_GIS_ICPNETWORKTOPOLOGY.ICP --LEFT OUTER JOIN {{ ref('UNKNOWN','D_NPDISTRIBUTIONSUBSTATION') }}  -- ON I_GIS_ICPNETWORKTOPOLOGY.DSUBLOCALID = D_NPDISTRIBUTIONSUBSTATION.LOCALID    LEFT OUTER JOIN {{ ref('UNKNOWN','I_GIS_ICPCOORDINATES') }} I_GIS_ICPCOORDINATES   ON I_RGST_ICPLIST.ICP  = I_GIS_ICPCOORDINATES.ICPNUMBER    LEFT OUTER JOIN {{ ref('UNKNOWN','L_GIS_ICPURBANRURAL') }} L_GIS_ICPURBANRURAL   ON I_RGST_ICPLIST.ICP  = L_GIS_ICPURBANRURAL.DICP_NUMBER    LEFT OUTER JOIN {{ ref('UNKNOWN','L_GIS_ICPAREAUNIT') }} L_GIS_ICPAREAUNIT   ON I_RGST_ICPLIST.ICP = L_GIS_ICPAREAUNIT.DICP_NUMBER  LEFT OUTER JOIN {{ ref('UNKNOWN','L_GIS_ICPCOUNCIL') }} L_GIS_ICPCOUNCIL         ON I_RGST_ICPLIST.ICP = L_GIS_ICPCOUNCIL.DICP_NUMBER    LEFT OUTER JOIN {{ ref('UNKNOWN','I_GIS_ICPEIEP4') }} I_GIS_ICPEIEP4   ON I_RGST_ICPLIST.INSTALL = I_GIS_ICPEIEP4.INSTALL        AND I_GIS_ICPEIEP4.RECORDNUMBER = 1    LEFT OUTER JOIN {{ ref('UNKNOWN','I_GIS_ICPADDITIONAL') }} I_GIS_ICPADDITIONAL   ON I_RGST_ICPLIST.ICP = I_GIS_ICPADDITIONAL.ICP    LEFT OUTER JOIN {{ ref('UNKNOWN','I_ICPLATESTCHANGES') }} AS EARLIESTNEWSTATUSDATE   ON I_RGST_ICPLIST.ICP = EARLIESTNEWSTATUSDATE.ICP    AND EARLIESTNEWSTATUSDATE.ATTRIBUTECHANGED = 'REGISTRY STATUS'    AND EARLIESTNEWSTATUSDATE.SORTORDERNEWSTATUS = 1    LEFT OUTER JOIN {{ ref('UNKNOWN','I_ICPLATESTCHANGES') }} AS PRICECATEGORYEFFECTIVEDATE   ON I_RGST_ICPLIST.ICP = PRICECATEGORYEFFECTIVEDATE.ICP    AND PRICECATEGORYEFFECTIVEDATE.ATTRIBUTECHANGED = 'PRICE CATEGORY'    AND PRICECATEGORYEFFECTIVEDATE.SORTORDER = 1    LEFT OUTER JOIN {{ ref('UNKNOWN','I_ICPLATESTCHANGES') }} AS REGISTRYSTATUSDATE   ON I_RGST_ICPLIST.ICP = REGISTRYSTATUSDATE.ICP    AND REGISTRYSTATUSDATE.ATTRIBUTECHANGED = 'REGISTRY STATUS'    AND REGISTRYSTATUSDATE.SORTORDER = 1    LEFT OUTER JOIN {{ ref('UNKNOWN','I_ICPLATESTCHANGES') }} AS RETAILERSTARTDATE   ON I_RGST_ICPLIST.ICP = RETAILERSTARTDATE.ICP    AND RETAILERSTARTDATE.ATTRIBUTECHANGED = 'RETAILER'    AND RETAILERSTARTDATE.SORTORDER = 1    LEFT OUTER JOIN {{ ref('UNKNOWN','I_ICPLATESTCHANGES') }} AS METERCONTRACTCOMPANYDATE   ON I_RGST_ICPLIST.ICP = METERCONTRACTCOMPANYDATE.ICP    AND METERCONTRACTCOMPANYDATE.ATTRIBUTECHANGED = 'METER CONTRACT COMPANY'    AND METERCONTRACTCOMPANYDATE.SORTORDER = 1    LEFT OUTER JOIN {{ ref('UNKNOWN','I_ICPLATESTCHANGES') }} AS EARLIESTACTIVESTATUSDATE   ON I_RGST_ICPLIST.ICP = EARLIESTACTIVESTATUSDATE.ICP    AND EARLIESTACTIVESTATUSDATE.ATTRIBUTECHANGED = 'REGISTRY STATUS'    AND EARLIESTACTIVESTATUSDATE.SORTORDERACTIVESTATUS = 1  LEFT OUTER JOIN {{ ref('UNKNOWN','L_GIS_ICPPARCEL') }} AS L_GIS_ICPPARCEL         ON I_RGST_ICPLIST.ICP = L_GIS_ICPPARCEL.DICP_NUMBER
