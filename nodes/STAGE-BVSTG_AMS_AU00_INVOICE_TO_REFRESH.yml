        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','S_AMS_INVOICETRANSACTION_MROC') }} s_ams_invoicetransaction_mroc
              LEFT JOIN (
                    SELECT DISTINCT h_invoice.INVID,
                           s_ams_basicpolinfo_mroc.POLID
                      FROM {{ ref('DATA_VAULT','S_AMS_INVOICETRANSACTION_MROC') }} s_ams_invoicetransaction_mroc_start
                     INNER JOIN {{ ref('DATA_VAULT','H_INVOICE') }} h_invoice_start
                        ON (h_invoice_start.INVID = s_ams_invoicetransaction_mroc_start.INVID)
                     INNER JOIN {{ ref('DATA_VAULT','S_AMS_INVOICE') }} v_s_ams_invoice_mroc_current_start
                        ON (h_invoice_start.HK_H_INVOICE = v_s_ams_invoice_mroc_current_start.HK_H_INVOICE)
                     INNER JOIN {{ ref('DATA_VAULT','S_AMS_BASICPOLINFO_MROC') }} s_ams_basicpolinfo_mroc
                        ON (v_s_ams_invoice_mroc_current_start.POLID = s_ams_basicpolinfo_mroc.PolID)
                     INNER JOIN {{ ref('DATA_VAULT','S_AMS_INVOICE') }} v_s_ams_invoice_mroc_current
                        ON (v_s_ams_invoice_mroc_current.POLID = s_ams_basicpolinfo_mroc.POLID)
                     INNER JOIN {{ ref('DATA_VAULT','H_INVOICE') }} h_invoice
                        ON (h_invoice.HK_H_INVOICE = v_s_ams_invoice_mroc_current.HK_H_INVOICE)
                     WHERE (('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,s_ams_invoicetransaction_mroc_start.EnteredDate,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_CIGH_Refresh_Days }}') OR ('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND TO_DATE(s_ams_invoicetransaction_mroc_start.EnteredDate) = TO_DATE(CURRENT_DATE()))) QUALIFY ROW_NUMBER() OVER (PARTITION BY h_invoice.INVID ORDER BY s_ams_basicpolinfo_mroc.DSS_VERSION DESC) = 1
                   )s_ams_invoicetransaction_mroc_start
                ON (s_ams_invoicetransaction_mroc.INVID = s_ams_invoicetransaction_mroc_start.INVID)
             WHERE (('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 1 AND (s_ams_invoicetransaction_mroc_start.INVID IS NOT NULL OR DATE(s_ams_invoicetransaction_mroc.EnteredDate) BETWEEN DATEADD(DAY,-'{{ parameters.HWM_BVSTG_CIGH_Refresh_Days }}', TO_DATE(CURRENT_DATE())) AND TO_DATE(CURRENT_DATE())))) QUALIFY ROW_NUMBER() OVER (PARTITION BY s_ams_invoicetransaction_mroc.hk_h_invoicetransaction ORDER BY s_ams_invoicetransaction_mroc.DSS_VERSION DESC) = 1
