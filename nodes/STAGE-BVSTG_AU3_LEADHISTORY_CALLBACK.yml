        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU2_LEADHISTORY_CALLBACK') }} bvstg_au2_leadhistory_callback
              LEFT JOIN (
                    SELECT a.HistoryID,
                           COUNT(DISTINCT b.HistoryID) Quotes,
                           COUNT(DISTINCT c.HistoryID) transfers,
                           COUNT(DISTINCT CASE WHEN d.direction =1 THEN d.InteractionIDKey ELSE NULL END) calls_inbound,
                           COUNT(DISTINCT CASE WHEN d.direction =2 THEN d.InteractionIDKey ELSE NULL END) calls_Outbound
                      FROM {{ ref('STAGE','BVSTG_AU2_LEADHISTORY_CALLBACK') }} a
                      LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }} b
                        ON b.LeadID = a.LeadID
                       AND b.isquote = 1
                       AND b.Lead_Ranking >= CASE WHEN a.Reasign_Ranking = 1 THEN 1
                                ELSE a.Start_Ranking
                                 END
                       AND b.Lead_Ranking < CASE WHEN a.End_Ranking IS NULL THEN 1000
                                ELSE a.End_Ranking
                                 END
                      LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }} c
                        ON c.LeadID = a.LeadID
                       AND c.isTransfer = 1
                       AND c.Lead_Ranking >= CASE WHEN a.Reasign_Ranking = 1 THEN 1
                                ELSE a.Start_Ranking
                                 END
                       AND c.Lead_Ranking < CASE WHEN a.End_Ranking IS NULL THEN 1000
                                ELSE a.End_Ranking
                                 END
                      LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} d
                        ON d.CustomerID = a.CustomerID
                       AND d.SOURCEDB_CUSTOMER = 'AppOne'
                       AND d.STARTDATETIME >= a.Start_date
                       AND d.STARTDATETIME < a.End_date
                     GROUP BY a.HistoryID
                   )bvstg_au2_leadhistory_callback_gorups
                ON (bvstg_au2_leadhistory_callback.HistoryID = bvstg_au2_leadhistory_callback_gorups.HistoryID)
              LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} ds_mkt_call_customer
                ON ds_mkt_call_customer.CustomerID = bvstg_au2_leadhistory_callback.CustomerID
               AND ds_mkt_call_customer.STARTDATETIME >= bvstg_au2_leadhistory_callback.Start_date
               AND ds_mkt_call_customer.STARTDATETIME < bvstg_au2_leadhistory_callback.End_date
             WHERE 1=1 QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_au2_leadhistory_callback.HistoryID ORDER BY ds_mkt_call_customer.STARTDATETIME)=1
