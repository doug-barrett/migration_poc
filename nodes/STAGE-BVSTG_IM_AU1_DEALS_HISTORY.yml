        dependencies: []
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT TL.DEAL_ID ,
                   A.lead_id ,
                   imb.ID PIPELINE_ID ,
                   IFNULL(HP.HISTORY_PIPELINE,imb.deal_pipeline) dealpipeline ,
                   C.type_of_business AS TypeOfBusiness ,
                   C.category AS LineOfBusiness ,
                   TL.CREATEAT ,
                   WEEKDAY ,
                   SALESDAYWEIGHT ,
                   WEEK ,
                   PYSALESDATE ,
                   A.DSS_UPDATE_TIME ,
                   A.PRIMARY_SOURCE ,
                   A.SECONDARY_SOURCE ,
                   IFNULL(PA.HISTORY_PRIMARY_AGENT,TM.FINAL_EMPLOYEENAME) PRIMARY_AGENT ,
                   A.RISK_STATE ,
                   A.CUSTOMER_STATE ,
                   LOB.REPORTBYLOB LOB ,
                   IFNULL(LOB.AMSDESCRIPTION, TYPE_OF_BUSINESS) TYPE_OF_BUSINESS ,
                   LOC.OFFICECODE OFFICECODE_POLICY ,
                   EMP.OFFICECODE OFFICECODE_PRIMARYAGENT ,
                   IFNULL(PA.EMPLOYEENUMBER,TM.FINAL_EMPLOYEENUMBER) EMPLOYEENUMBER_PRIMARYAGENT ,
                   A.EMPLOYEE_CODE ,
                   A.PRIMARY_EMPLOYEE_CB ,
                   RWL.LABEL ,
                   D.CustomerNo ,
                   D.CustomerID ,
                   TL.ISTOPIPELINE ,
                   TL.ISREASSIGNED ,
                   TL.ISTOBUCKET ,
                   IFNULL(QUOTE.ISQUOTED, 0) AS ISQUOTED ,
                   CALL.UNIQUE_CONNECTIONS ,
                   TL.ISPROGRESSWINBACK ,
                   TL.ISSUBMITTINGRENEWAL ,
                   TL.ISRENEWALREPLACED ,
                   TL.ISRENEWALREVIEWED ,
                   TL.ISRENEWALRENEWED ,
                   CASE WHEN LOWER(C.STATUS) = 'won' AND DEAL.WON_LOST_DATE IS NOT NULL THEN 1
                        ELSE 0
                         END ISRENEWALWON ,
                   CASE WHEN DATE (A.CREATION_DATE) = DATE.SALESDATE OR TL.ISCREATED = 1 THEN 1
                        ELSE 0
                         END ISCREATED ,
                   CASE WHEN DATE (RWL.DUE_DATE) = DATE.SALESDATE THEN 1
                        ELSE 0
                         END ISDUE ,
                   C.POLICY_NUMBER ,
                   IFNULL(SOLD.ISSOLD,0) AS ISSOLD ,
                   IFNULL(WON.ISWON,0) AS ISWON ,
                   IFNULL(LOST.ISLOST,0) AS ISLOST ,
                   CASE WHEN (D.DEAL_CREATED = 1 OR TL.ISTOPIPELINE = 1 OR TL.ISREASSIGNED = 1 OR QUOTE.ISQUOTED = 1 OR IFNULL(CALL.UNIQUE_CONNECTIONS,0) = 1) AND LOWER(HP.HISTORY_PIPELINE) = 'new business' THEN 1
                        ELSE 0
                         END NB_OPPORTUNITIES ,
                   CASE WHEN (D.DEAL_CREATED = 1 OR TL.ISTOPIPELINE = 1 OR TL.ISREASSIGNED = 1 OR QUOTE.ISQUOTED = 1 OR IFNULL(CALL.UNIQUE_CONNECTIONS,0) = 1) AND LOWER(HP.HISTORY_PIPELINE) = 'cross sell' THEN 1
                        ELSE 0
                         END CS_OPPORTUNITIES ,
                   CASE WHEN (D.DEAL_CREATED = 1 OR TL.ISTOPIPELINE = 1 OR TL.ISREASSIGNED = 1 OR QUOTE.ISQUOTED = 1 OR IFNULL(CALL.UNIQUE_CONNECTIONS,0) = 1) AND LOWER(HP.HISTORY_PIPELINE) = 'winback' THEN 1
                        ELSE 0
                         END WB_OPPORTUNITIES ,
                   CASE WHEN QUOTE.ISQUOTED = 1 AND LOWER(HP.HISTORY_PIPELINE) = 'new business' THEN 1
                        ELSE 0
                         END NB_TOTAL_QUOTES ,
                   CASE WHEN QUOTE.ISQUOTED = 1 AND LOWER(HP.HISTORY_PIPELINE) = 'cross sell' THEN 1
                        ELSE 0
                         END CS_TOTAL_QUOTES ,
                   CASE WHEN QUOTE.ISQUOTED = 1 AND LOWER(HP.HISTORY_PIPELINE) = 'renewal' THEN 1
                        ELSE 0
                         END RWL_TOTAL_QUOTES ,
                   CASE WHEN QUOTE.ISQUOTED = 1 AND LOWER(HP.HISTORY_PIPELINE) = 'winback' THEN 1
                        ELSE 0
                         END WB_TOTAL_QUOTES ,
                   CASE WHEN LOWER(HP.HISTORY_PIPELINE) = 'new business' AND IFNULL(SOLD.ISSOLD,0) = 1 THEN 1
                        ELSE 0
                         END NB_DEALS_SOLD ,
                   CASE WHEN LOWER(HP.HISTORY_PIPELINE) = 'cross sell' AND IFNULL(SOLD.ISSOLD,0) = 1 THEN 1
                        ELSE 0
                         END CS_DEALS_SOLD ,
                   CASE WHEN LOWER(HP.HISTORY_PIPELINE) = 'renewal' AND IFNULL(SOLD.ISSOLD,0) = 1 THEN 1
                        ELSE 0
                         END RWL_DEALS_SOLD ,
                   CASE WHEN LOWER(HP.HISTORY_PIPELINE) = 'winback' AND IFNULL(SOLD.ISSOLD,0) = 1 THEN 1
                        ELSE 0
                         END WB_DEALS_SOLD ,
                   CASE WHEN LOWER(HP.HISTORY_PIPELINE) = 'new business' AND IFNULL(WON.ISWON,0) = 1 THEN 1
                        ELSE 0
                         END NB_DEALS_WON ,
                   CASE WHEN LOWER(HP.HISTORY_PIPELINE) = 'cross sell' AND IFNULL(WON.ISWON,0) = 1 THEN 1
                        ELSE 0
                         END CS_DEALS_WON ,
                   CASE WHEN LOWER(HP.HISTORY_PIPELINE) = 'renewal' AND IFNULL(WON.ISWON,0) = 1 THEN 1
                        ELSE 0
                         END RWL_DEALS_WON ,
                   CASE WHEN LOWER(HP.HISTORY_PIPELINE) = 'winback' AND IFNULL(WON.ISWON,0) = 1 THEN 1
                        ELSE 0
                         END WB_DEALS_WON ,
                   CASE WHEN TL.ISPROGRESSWINBACK = 1 AND LOWER(HP.HISTORY_PIPELINE) = 'winback' THEN 1
                        ELSE 0
                         END WB_IN_PROGRESS ,
                   IFNULL(RWL.RWL_LAPSED_POLICIES,0) LAPSED_POLICIES ,
                   IFNULL(CL.WON,0) WON ,
                   IFNULL(RWL.RWL_OPPORTUNITIES,0) RWL_OPPORTUNITIES ,
                   IFNULL(RWL.RWL_REPLACED,0) RWL_REPLACED ,
                   IFNULL(RWL.RWL_SUBMITTING_RENEWAL,0) RWL_SUBMITTING_RENEWAL ,
                   IFNULL(RWL.RWL_REVIEWED,0) RWL_REVIEWED ,
                   IFNULL(RWL.RWL_RENEWED,0) RWL_RENEWED ,
                   IFNULL(RWL.RWL_RENEWALS_WON,
                   0
