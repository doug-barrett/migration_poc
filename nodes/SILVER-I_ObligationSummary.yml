          FROM {{ ref('BRONZE', 'F_QMSControlledDocumentReview') }} "F_QMSControlledDocumentReview"
          JOIN {{ ref('GOLD', 'D_Obligation') }} "D_Obligation"
            ON F_QMSCONTROLLEDDOCUMENTREVIEW.D_OBLIGATION_KEY = D_OBLIGATION.D_OBLIGATION_KEY
          JOIN {{ ref('GOLD', 'D_BusinessUnit') }} "D_BusinessUnit"
            ON F_QMSCONTROLLEDDOCUMENTREVIEW.D_BUSINESSUNIT_KEY = D_BUSINESSUNIT.D_BUSINESSUNIT_KEY
          JOIN {{ ref('GOLD', 'D_Employee') }} "D_Employee"
            ON F_QMSCONTROLLEDDOCUMENTREVIEW.D_EMPLOYEE_KEY = D_EMPLOYEE.D_EMPLOYEE_KEY
