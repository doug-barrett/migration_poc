          - locationName: NP
            nodeName: L_PG_EMPLOYEEHISTORY
          - locationName: NP
            nodeName: I_PG_LASTSTANDARDPAY
          - locationName: NP
            nodeName: I_BMPLOADPERIOD
        join:
          joinCondition: |-
            FROM {{ ref('NP','I_OUTSTANDINGLEAVE') }}
              LEFT OUTER JOIN {{ ref('NP','I_PG_EMPLOYEE') }}
                ON I_OUTSTANDINGLEAVE.EMPLOYEECODE = I_PG_EMPLOYEE.EMPLOYEECODE
              LEFT OUTER JOIN {{ ref('NP','L_PG_EMPLOYEEHISTORY') }}
                ON I_OUTSTANDINGLEAVE.EMPLOYEECODE = L_PG_EMPLOYEEHISTORY.EMPLOYEECODE
               AND I_OUTSTANDINGLEAVE.PAYSEQUENCE = L_PG_EMPLOYEEHISTORY.PAYSEQUENCE
              LEFT OUTER JOIN {{ ref('NP','I_PG_LASTSTANDARDPAY') }}
                ON I_PG_EMPLOYEE.PAYPERIODCODE = I_PG_LASTSTANDARDPAY.PAYPERIODCODE
              LEFT OUTER JOIN {{ ref('NP','I_BMPLOADPERIOD') }}
                ON MONTH(I_PG_EMPLOYEE.ALENDDATE) = I_BMPLOADPERIOD.CALENDARMONTH
               AND YEAR(I_PG_EMPLOYEE.ALENDDATE) = I_BMPLOADPERIOD.CALENDARYEAR
             WHERE LEAVETYPECODE = 'AL'
