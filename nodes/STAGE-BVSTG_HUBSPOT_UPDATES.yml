        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_FP_ACCOUNTS
          - locationName: DATA_VAULT
            nodeName: S_AMS_BASICPOLINFO_MROC
          - locationName: DATA_VAULT
            nodeName: S_AMS_GLDEPARTMENT_MROC
          - locationName: DATA_VAULT
            nodeName: S_AMS_COMPANY_MROC
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
          - locationName: STAGE
            nodeName: V_DLBV_FP_ACCOUNTCALCULATEDPAYMENTINFO
          - locationName: STAGE
            nodeName: V_DLBV_FP_INSURED
          - locationName: STAGE
            nodeName: V_DLBV_FP_ACCOUNTADDONPRODUCT
          - locationName: STAGE
            nodeName: V_DLBV_FP_ADDONPRODUCTPAYMENTINFO
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT LEFT(CASE WHEN LOWER(i.Email) IN ('na.na@gmail.com', 'na@gmail.com', 'noemail@gmail.com', 'noemail@na.com', 'na@na.com') THEN LOWER(REGEXP_REPLACE((i.id || substring(i.Name, 1, NULLIF(CHARINDEX(' ', i.Name) - 1, - 1)) || substring(i.Name, CHARINDEX(' ', i.Name) + 1, len(i.Name)) || '@noemail.com'), ' ')) WHEN LOWER(i.Email) NOT LIKE '%@%' THEN LOWER(REGEXP_REPLACE((i.id || substring(i.Name, 1, NULLIF(CHARINDEX(' ', i.Name) - 1, - 1)) || substring(i.Name, CHARINDEX(' ', i.Name) + 1, len(i.Name)) || '@noemail.com'), ' ')) ELSE LOWER(i.Email) END, 100) AS Email ,
                   a.polid AS SaleID ,
                   a.polid AS POLICYID ,
                   CASE WHEN CURSTATUSCODE IN ('1', '4') THEN 'closedwon'
                        ELSE '1579740'
                         END AS DEALSTAGE ,
                   CASE WHEN a.poltypelob = 'Private Passenger Auto' THEN 'default'
                        ELSE a.poltypelob
                         END AS PipeLine ,
                   CASE WHEN IFNULL(v_posb_splc_status.STATUS, v_preb_hubspot_status_ams.STATUS) IN ('Active', 'Reinstated') AND CURRENT_DATE () > a.POLEXPDATE THEN 'Expired'
                        ELSE IFNULL(v_posb_splc_status.STATUS, v_preb_hubspot_status_ams.STATUS)
                         END AS Policy_Status ,
                   DATEDIFF(SECOND, TO_TIMESTAMP('1970-01-01'), TO_TIMESTAMP(a.POLEFFDATE)) * 1000 AS policy_status_date ,
                   DATEDIFF(SECOND, TO_TIMESTAMP('1970-01-01'), TO_TIMESTAMP(a.POLEXPDATE)) * 1000 AS Policy_Expiration_Date ,
                   NULL STARTDATE ,
                   DATE (IFNULL(a.POLEFFDATE, a.POLEXPDATE)) STATUSDATE ,
                   NULL ENDDATE ,
                   0 AS ISAutoPay ,
                   0 AS ISMissingApplication ,
                   0 AS IsMissingPremiumPayment ,
                   TRUE IsPremiumFinanced ,
                   a.AccountNumber ,
                   a.CancellationDate AS CancelDate ,
                   acpi.TotalAmountDue ,
                   IFNULL(pi.CurrentAmountDue, 0) + IFNULL(acpi.TotalAmountDue, 0) AS AmountDue ,
                   CAST(NULL AS DATE) AS PayToDate ,
                   'Premium Finance' AS PayType ,
                   CurStatusCode ,
                   NextPaymentDueDate
              FROM (
                    SELECT DISTINCT CS.CUSTOMERNO CustomerID ,
                           'AMS' SOURCEDB ,
                           CurStatusCode ,
                           OriginationState ,
                           ID ,
                           InsuredID ,
                           polid ,
                           polno ,
                           SHORTPOLNO ,
                           poltypelob ,
                           S_AMS_BASICPOLINFO_MROC.STATUS ,
                           S_AMS_BASICPOLINFO_MROC.entereddate ,
                           cs.dob ,
                           cs.middlename ,
                           cs.gender ,
                           POLEFFDATE ,
                           POLEXPDATE ,
                           EFFECTIVEDATE ,
                           NextPaymentDueDate ,
                           AccountNumber ,
                           CancellationDate ,
                           isfinanced ,
                           S_AMS_GLDEPARTMENT_MROC.NAME Office ,
                           S_AMS_COMPANY_MROC.name CarrierName
                      FROM {{ ref('STAGE','V_DLBV_FP_ACCOUNTS') }} V_DLBV_FP_ACCOUNTS
                     INNER JOIN (
                            SELECT *
                              FROM {{ ref('DATA_VAULT','S_AMS_BASICPOLINFO_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY POLID ORDER BY DSS_VERSION DESC) = 1
                           ) S_AMS_BASICPOLINFO_MROC
                        ON TO_VARCHAR(V_DLBV_FP_ACCOUNTS.ID) = TO_VARCHAR(SPLIT_PART(DESCRIPTIONBPOL, '-', 2))
                     INNER JOIN {{ ref('DATA_VAULT','S_AMS_GLDEPARTMENT_MROC') }} S_AMS_GLDEPARTMENT_MROC
                        ON S_AMS_BASICPOLINFO_MROC.gldeptcode = S_AMS_GLDEPARTMENT_MROC.gldeptcode
                     INNER JOIN {{ ref('DATA_VAULT','S_AMS_COMPANY_MROC') }} S_AMS_COMPANY_MROC
                        ON S_AMS_BASICPOLINFO_MROC.cocode = S_AMS_COMPANY_MROC.cocode
                     INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} CS
                        ON CS.CUSTOMERID = S_AMS_BASICPOLINFO_MROC.CUSTID
                       AND CS.SourceDB = 'CIGH'
                     WHERE V_DLBV_FP_ACCOUNTS.dss_record_source LIKE '%AMS%'
                   ) a
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_DLBV_FP_ACCOUNTCALCULATEDPAYMENTINFO') }}
                     WHERE dss_record_source LIKE '%AMS%' QUALIFY ROW_NUMBER() OVER (PARTITION BY AccountID ORDER BY lastupdate DESC) = 1
                   ) acpi
                ON acpi.AccountID = a.ID
             INNER JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_DLBV_FP_INSURED') }}
                     WHERE dss_record_source LIKE '%AMS%'
                   ) i
                ON i.ID = a.InsuredID
             INNER JOIN ( SELECT SUM(appi.CurrentAmountDue) CurrentAmountDue ,
                   aap.AccountID
              FROM {{ ref('STAGE','V_DLBV_FP_ACCOUNTADDONPRODUCT') }} aap
             INNER JOIN {{ ref('STAGE','V_DLBV_FP_ADDONPRODUCTPAYMENTINFO') }} appi
                ON appi.AccountAddonProductID = aap.ID
               AND appi.dss_record_source LIKE '%AMS%'
               AND aap.dss_record_source LIKE '%AMS%'
             GROUP BY aap.Acco
