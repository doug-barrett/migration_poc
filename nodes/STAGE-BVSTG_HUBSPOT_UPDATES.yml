        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source
             INNER JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
                ON ds_policysummary_v2.TransactionID = ds_mkt_lead_source.SaleID
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                ON ds_policysummary_v2.transactionid = ds_ram_retail_repository.transactionid
               AND ds_policysummary_v2.sourcedb = ds_ram_retail_repository.sourcedb
               AND ds_ram_retail_repository.sourcedb = 'AppOne'
               AND ds_ram_retail_repository.CLASSIFICATIONGROUP IN ('New Business')
              LEFT JOIN (
                    SELECT MAX(TERM) TERM ,
                           additional_product_name ,
                           company_cost
                      FROM {{ ref('UNKNOWN','V_PREB_ANCILLARIES_MAPPING') }}
                     GROUP BY additional_product_name ,
                              company_cost
                   ) ADDITIONAL_PRODUCT_CATEGORY
                ON DS_RAM_RETAIL_REPOSITORY.AP_ADDITIONALPRODUCTNAME = ADDITIONAL_PRODUCT_CATEGORY.additional_product_name
               AND CEIL(DS_RAM_RETAIL_REPOSITORY.AP_PO_COMPANYCOST) = CEIL(ADDITIONAL_PRODUCT_CATEGORY.company_cost)
               AND DS_RAM_RETAIL_REPOSITORY.term = ADDITIONAL_PRODUCT_CATEGORY.TERM
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
                ON ds_mkt_lead_source.LMS_ID = v_dlbv_api_lms_masterlead_current.LMS_LEAD_ID
              LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} ds_customersummary_v2
                ON ds_customersummary_v2.Customerno = ds_mkt_lead_source.CustomerID
               AND ds_customersummary_v2.SourceDB = ds_mkt_lead_source.SourceDB
              LEFT JOIN {{ ref('UNKNOWN','V_API_HUBSPOT_PAYMENTREMINDERS') }} v_api_hubspot_paymentreminders
                ON TO_VARCHAR(v_api_hubspot_paymentreminders.TransactionID) = ds_policysummary_v2.TransactionID
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_ACTIVITY_2STEP') }} ds_bvstg_ap1_activity_2step_missing_app
                ON TO_VARCHAR(ds_bvstg_ap1_activity_2step_missing_app.TransactionID) = ds_mkt_lead_source.SaleID
               AND ds_bvstg_ap1_activity_2step_missing_app.ACTIVITYTYPENAME IN ('CS - Mailroom - E-mail missing application')
               AND ds_bvstg_ap1_activity_2step_missing_app.TransactionID IS NOT NULL
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_ACTIVITY_2STEP') }} ds_bvstg_ap1_activity_2step_missing_pay
                ON TO_VARCHAR(ds_bvstg_ap1_activity_2step_missing_pay.TransactionID) = ds_mkt_lead_source.SaleID
               AND ds_bvstg_ap1_activity_2step_missing_pay.ACTIVITYTYPENAME IN ('Mailroom - E-mail missing premium payment')
               AND ds_bvstg_ap1_activity_2step_missing_pay.TransactionID IS NOT NULL
              LEFT JOIN {{ ref('EDW','DS_H2O_RWL_POLICYSUMMARY') }} AS DS_H2O_RWL_POLICYSUMMARY
                ON DS_POLICYSUMMARY_V2.PolicyID = DS_H2O_RWL_POLICYSUMMARY.S_POLICY_ID
              LEFT JOIN {{ ref('STAGE','DS_RENEWAL_ZERO_OUTPUT') }} AS DS_RENEWAL_ZERO_OUTPUT
                ON DS_H2O_RWL_POLICYSUMMARY.W_ID = DS_RENEWAL_ZERO_OUTPUT.W_ID
              LEFT JOIN DATA_LAKE.BIA_ANALYTICS.API_OB_HUBSPOT_DEALS api_ob_hubspot_deals
                ON api_ob_hubspot_deals.dealpk = md5(CASE WHEN ds_mkt_lead_source.isSale = 1 AND IFNULL(ds_customersummary_v2.Email, v_dlbv_api_lms_masterlead_current.CLIENT_EMAIL) NOT LIKE '%@%' THEN ds_mkt_lead_source.leadid || ds_customersummary_v2.FirstName || ds_customersummary_v2.LastName || '@noemail.com' ELSE IFNULL(ds_customersummary_v2.Email, v_dlbv_api_lms_masterlead_current.CLIENT_EMAIL) END || ds_mkt_lead_source.SaleID)
             WHERE ('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 0 AND DATE(ds_policysummary_v2.ENDDATE) >='2018-01-01' OR ('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 1 AND (DATEDIFF(DAY,DATE(ds_policysummary_v2.ENDDATE),CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}' OR ds_ram_retail_repository.bia_expirationdate BETWEEN CURRENT_DATE() AND CURRENT_DATE() +30)))
               AND (CASE WHEN ds_mkt_lead_source.isSale = 1
               AND IFNULL(ds_customersummary_v2.Email, v_dlbv_api_lms_masterlead_current.CLIENT_EMAIL) NOT LIKE '%@%' THEN ds_mkt_lead_source.leadid || ds_customersummary_v2.FirstName || ds_customersummary_v2.LastName || '@noemail.com' ELSE IFNULL(ds_customersummary_v2.Email,
