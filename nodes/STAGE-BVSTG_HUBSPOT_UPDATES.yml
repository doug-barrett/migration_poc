                ON TO_VARCHAR(ds_bvstg_ap1_activity_2step_missing_pay.TransactionID) = DS_HUBSPOT_DEALS.SaleID
               AND ds_bvstg_ap1_activity_2step_missing_pay.ACTIVITYTYPENAME IN ('Mailroom - E-mail missing premium payment')
               AND ds_bvstg_ap1_activity_2step_missing_pay.TransactionID IS NOT NULL
              LEFT JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
                ON ds_policysummary_v2.TransactionID = DS_HUBSPOT_DEALS.SaleID
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                ON ds_policysummary_v2.transactionid = ds_ram_retail_repository.transactionid
               AND ds_policysummary_v2.sourcedb = ds_ram_retail_repository.sourcedb
               AND ds_ram_retail_repository.sourcedb = 'AppOne'
              LEFT JOIN (
                    SELECT MAX(TERM) TERM ,
                           additional_product_name ,
                           company_cost
                      FROM {{ ref('UNKNOWN','V_PREB_ANCILLARIES_MAPPING') }}
                     GROUP BY additional_product_name ,
                              company_cost
                   ) ADDITIONAL_PRODUCT_CATEGORY
                ON DS_RAM_RETAIL_REPOSITORY.AP_ADDITIONALPRODUCTNAME = ADDITIONAL_PRODUCT_CATEGORY.additional_product_name
               AND CEIL(DS_RAM_RETAIL_REPOSITORY.AP_PO_COMPANYCOST) = CEIL(ADDITIONAL_PRODUCT_CATEGORY.company_cost)
               AND DS_RAM_RETAIL_REPOSITORY.term = ADDITIONAL_PRODUCT_CATEGORY.TERM
              LEFT JOIN {{ ref('EDW','DS_H2O_RWL_POLICYSUMMARY') }} AS DS_H2O_RWL_POLICYSUMMARY
                ON DS_POLICYSUMMARY_V2.PolicyID = DS_H2O_RWL_POLICYSUMMARY.S_POLICY_ID
              LEFT JOIN {{ ref('STAGE','DS_RENEWAL_ZERO_OUTPUT') }} AS DS_RENEWAL_ZERO_OUTPUT
                ON DS_H2O_RWL_POLICYSUMMARY.W_ID = DS_RENEWAL_ZERO_OUTPUT.W_ID
              LEFT JOIN DATA_LAKE.BIA_ANALYTICS.API_OB_HUBSPOT_DEALS api_ob_hubspot_deals
                ON api_ob_hubspot_deals.dealpk = DS_HUBSPOT_DEALS.dealpk
             WHERE DS_HUBSPOT_DEALS.SaleID IS NOT NULL
               AND (('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 0 AND DATE(ds_bvstg_ap1_activity_2step_missing_app.CREATED) >='2018-01-01' OR ('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DATE(ds_bvstg_ap1_activity_2step_missing_app.CREATED),CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}')) OR ('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 0 AND DATE(ds_bvstg_ap1_activity_2step_missing_pay.CREATED) >='2018-01-01' OR ('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DATE(ds_bvstg_ap1_activity_2step_missing_pay.CREATED),CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}')))
