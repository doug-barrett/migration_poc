                stepCounter: 7876c381-d0a7-4118-bb34-868b3fc43c98
            transform: |-
              CASE WHEN I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE LIKE 'WTOU-%' THEN REPLACE(I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE, 'WTOU-', '')
                          WHEN I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE LIKE 'CTOU-%' THEN REPLACE(I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE, 'CTOU-', '')
                          WHEN I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE LIKE 'DM1-%'  THEN REPLACE(I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE, 'DM1-', '')
                          WHEN I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE LIKE 'DM3-%'  THEN REPLACE(I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE, 'DM3-', '')
                          WHEN I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE LIKE 'KTOU-%' THEN REPLACE(I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE, 'KTOU-', '')
                          WHEN I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE LIKE 'ND1-%'  THEN REPLACE(I_EIEP_RETAILERBILLING.PRICECOMPONENTCODE, 'ND1-', '')
