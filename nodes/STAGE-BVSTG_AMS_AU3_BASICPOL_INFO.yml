                           CASE WHEN count(*)> 1 THEN 1
                                ELSE 0
                                 END AS Consolidated,
                           MAX(t.InvId) AS InvId,
                           MAX(t.InvTPId) AS InvTPId,
                           MAX(invtp.BackInvTPId) AS BackInvTPId,
                           MAX(invtp.OldInvTPId) AS OldInvTPId,
                           t.ModeID
                      FROM {{ ref('STAGE','BVSTG_AMS_AU2_INVOICE') }} t
                     INNER JOIN {{ ref('STAGE','V_S_AMS_INVOICETRANSACTION_MROC_CURRENT') }} invtp
                        ON invtp.InvTPId = t.InvTPId
                     GROUP BY t.PolId ,
                              invtp.CustId ,
                              TO_DATE(invtp.EnteredDate) ,
                              invtp.TranType ,
                              invtp.LineOfBus ,
                              t.ModeID
                   ) bvstg_ams_au2_invoice
             INNER JOIN {{ ref('STAGE','V_S_AMS_BASICPOLINFO_MROC_CURRENT') }} v_s_ams_basicpolinfo_mroc_current
                ON v_s_ams_basicpolinfo_mroc_current.PolId = bvstg_ams_au2_invoice.PolId QUALIFY ROW_NUMBER() OVER (PARTITION BY CASE WHEN bvstg_ams_au2_invoice.ModeID IN (12,14,32,34) THEN MD5(bvstg_ams_au2_invoice.polid || '-' || CAST(bvstg_ams_au2_invoice.ModeID AS varchar(10))) ELSE MD5(bvstg_ams_au2_invoice.invtpid || '-' || bvstg_ams_au2_invoice.invid) END ORDER BY bvstg_ams_au2_invoice.entereddate)=1
