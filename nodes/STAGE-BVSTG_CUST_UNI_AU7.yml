        join:
          joinCondition: |-
            EXTENDED
              FROM ( WITH SELECTION AS (
                    SELECT A.* ,
                           CASE WHEN A.VALID_FIRSTNAME <> '' AND A.VALID_PHONE <> ''                                 THEN 1
                                WHEN A.VALID_LASTNAME <> '' AND A.VALID_PHONE <> ''                                  THEN 1
                                WHEN A.VALID_FIRSTNAME <> '' AND A.VALID_EMAIL <> ''                                 THEN 1
                                WHEN A.VALID_LASTNAME <> '' AND A.VALID_EMAIL <> ''                                  THEN 1
                                WHEN A.VALID_FIRSTNAME <> '' AND A.VALID_DOB <> '1111-11-11' AND VALID_MAINZIP <> '' THEN 1
                                WHEN A.VALID_PHONE <> '' AND A.VALID_EMAIL <> ''                                     THEN 1
                                ELSE 0
                                 END AS FLAG_CONTINUE
                      FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }} A
                      LEFT JOIN (
                            SELECT PRIMARY_KEY
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU3') }}
                         UNION ALL SELECT PRIMARY_KEY
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU4') }}
                         UNION ALL SELECT PRIMARY_KEY
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU5') }}
                         UNION ALL SELECT PRIMARY_KEY
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU6') }}
                           ) B
                        ON (A.PRIMARY_KEY = B.PRIMARY_KEY)
                     WHERE B.PRIMARY_KEY IS NULL
                   ) ,
                   DEDUP_NAME_PHONE AS(
                    SELECT A.CREATED,
                           A.END_MONTH,
                           A.CUSTOMERID,
                           A.PRIMARY_KEY,
                           A.SOURCEDB,
                           A.ISLEGACYCUSTOMER,
                           A.CUSTOMER_STATUS ,
                           A.VALID_FIRSTNAME AS FIRSTNAME ,
                           A.VALID_LASTNAME AS LASTNAME ,
                           A.VALID_DOB AS DOB ,
                           A.VALID_MAINZIP AS MAINZIP ,
                           A.VALID_EMAIL AS EMAIL ,
                           A.VALID_PHONE AS PHONE ,
                           A.GENDER,
                           A.MAINSTREET,
                           A.MAINSTATE,
                           A.LICENSENUMBER,
                           A.NON_NULL_FIELD_COUNT,
                           A.KEY_NAME_DOB_EMAIL_PHONE,
                           A.DUPLICATE_KEY ,
                           B.CDP_CUSTOMERID,
                           B.CLUSTER_KEY ,
                           100 AS FUZZY_SCORE ,
                           'DUPLICATE_NAME_PHONE' AS FUZZ_SCORE_KEY
                      FROM (
                            SELECT *
                              FROM SELECTION
                             WHERE FLAG_KEY_WO_INFO = 'key_name_phone'
                           ) A
                     INNER JOIN (
                            SELECT DISTINCT FIRSTNAME,
                                   PHONE,
                                   CDP_CUSTOMERID,
                                   CLUSTER_KEY
                              FROM {{ ref('EDW','DS_CUSTOMER_UNIFICATION_MASTER') }}
                             WHERE CDP_CUSTOMERID <> ''
                               AND FIRSTNAME <> ''
                               AND PHONE <> ''
                           ) B
                        ON (A.VALID_FIRSTNAME = B.FIRSTNAME AND A.VALID_PHONE = B.PHONE)
                   ) ,
                   DEDUP_NAME_EMAIL AS (
                    SELECT A.CREATED,
                           A.END_MONTH,
                           A.CUSTOMERID,
                           A.PRIMARY_KEY,
                           A.SOURCEDB,
                           A.ISLEGACYCUSTOMER,
                           A.CUSTOMER_STATUS ,
                           A.VALID_FIRSTNAME AS FIRSTNAME ,
                           A.VALID_LASTNAME AS LASTNAME ,
                           A.VALID_DOB AS DOB ,
                           A.VALID_MAINZIP AS MAINZIP ,
                           A.VALID_EMAIL AS EMAIL ,
                           A.VALID_PHONE AS PHONE ,
                           A.GENDER,
                           A.MAINSTREET,
                           A.MAINSTATE,
                           A.LICENSENUMBER,
                           A.NON_NULL_FIELD_COUNT,
                           A.KEY_NAME_DOB_EMAIL_PHONE,
                           A.DUPLICATE_KEY ,
                           B.CDP_CUSTOMERID,
                           B.CLUSTER_KEY ,
                           100 AS FUZZY_SCORE ,
                           'DUPLICATE_NAME_EMAIL' AS FUZZ_SCORE_KEY
                      FROM (
                            SELECT *
                              FROM SELECTION
                             WHERE FLAG_KEY_WO_INFO = 'key_name_email'
                           ) A
                     INNER JOIN (
                            SELECT DISTINCT FIRSTNAME,
                                   EMAIL,
                                   CDP_CUSTOMERID,
                                   CLUSTER_KEY
                              FROM {{ ref('EDW','DS_CUSTOMER_UNIFICATION_MASTER') }}
                             WHERE CDP_CUSTOMERID <> ''
                               AND FIRSTNAME <> ''
                               AND EMAIL <> ''
                           ) B
                        ON (A.VALID_FIRSTNAME = B.FIRSTNAME AND A.VALID_EMAIL = B.EMAIL)
                   ) ,
                   DEDUP_NAME_DOB_ZIP AS ( SELECT A.CREATED,
                   A.END_MONTH,
                   A.CUSTOMERID,
                   A.PRIMARY_KEY,
                   A.SOURCEDB,
                   A.ISLEGACYCUSTOMER,
                   A.CUSTOMER_STATUS ,
                   A.VALID_FIRSTNAME AS FIRSTNAME ,
                   A.VALID_LASTNAME AS LASTNAME ,
                   A.VALID_DOB AS DOB ,
                   A.VALID_MAINZIP AS MAINZIP ,
                   A.VALID_EMAIL AS EMAIL ,
                   A.VALID_PHONE AS PHONE ,
                   A.GENDER,
                   A.MAINSTREET,
                   A.MAINSTATE,
                   A.LICENSENUMBER,
                   A.NON_NULL_FIELD_COUNT,
                   A.KEY_NAME_DOB_EMAIL_PHONE,
                   A.DUPLICATE_KEY ,
                   B.CDP_CUSTOMERID,
                   B.CLUSTER_KEY ,
                   100 AS FUZZY_SCORE ,
                   'DUPLICATE_NAME_DOB_ZIP' AS FUZZ_SCORE_KEY
              FROM (
                    SELECT *
                      FROM SELECTION
                     WHERE FLAG_KEY_WO_INFO = 'key_name_dob_zip'
                   ) A
             INNER JOIN (SELECT DISTINCT FIRSTNAME,
                   DOB,
                   MAINZIP,
                   CDP_CUSTOMERID,
                   CLUSTER_KEY
