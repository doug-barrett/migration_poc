    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BVSTG_CUST_UNI_AU9: a36e72cf-3259-44a1-9107-3a467c5b9a05
          DS_POLICYSUMMARY_V2: 9a05931f-0fe2-4275-8b38-8e88eb9c6968
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU13
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU9
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
        join:
          joinCondition: |-
            EXTENDED
              FROM( WITH POLICY_DATA AS (
                    SELECT A.CDP_CUSTOMERID ,
                           A.CREATED,
                           A.CUSTOMERID,
                           B.POLICYID,
                           ROW_NUMBER() OVER(PARTITION BY A.CDP_CUSTOMERID ORDER BY B.STARTDATE DESC, POLICYID DESC) RN_POLICY_DESC,
                           ROW_NUMBER() OVER(PARTITION BY A.CDP_CUSTOMERID ORDER BY B.STARTDATE ASC, POLICYID DESC) RN_POLICY_ASC,
                           B.TRANSACTIONID,
                           B.TERM,
                           B.CURRENTPREMIUM,
                           B.WRITTENPREMIUM,
                           B.POLICYSTATUS,
                           B.STARTDATE,
                           B.ENDDATE,
                           B.POLICYTENURE,
                           CONCAT(A.FIRSTNAME, A.LASTNAME) AS FULLNAME ,
                           B.CUSTOMERNAME
                      FROM (
                            SELECT *
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU9') }}
                           ) A
                     INNER JOIN (
                            SELECT *
                              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
                           ) B
                        ON (A.CUSTOMERID = B.CUSTOMERID AND A.SOURCEDB = B.SOURCEDB)
                     ORDER BY B.STARTDATE
                   ) ,
                   GROPING AS ( SELECT CDP_CUSTOMERID ,
                   COUNT(*) AS NUMBER_OF_POLICIES ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN POLICYID ELSE '' END) AS FIRST_POLICYID ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN TRANSACTIONID ELSE '' END) AS FIRST_TRANSACTIONID ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN CUSTOMERID ELSE '' END) AS FIRST_CUSTOMERID ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN TERM ELSE '' END) AS FIRST_TERM ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN CURRENTPREMIUM ELSE 0 END) AS FIRST_CURRENTPREMIUM ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN WRITTENPREMIUM ELSE 0 END) AS FIRST_WRITTENPREMIUM ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN POLICYSTATUS ELSE '' END) AS FIRST_POLICYSTATUS ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN STARTDATE ELSE NULL END) AS FIRST_STARTDATE ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN ENDDATE ELSE NULL END) AS FIRST_ENDDATE ,
                   MAX(CASE WHEN RN_POLICY_ASC = 1 THEN POLICYTENURE ELSE 0 END) AS FIRST_POLICYTENURE ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN POLICYID ELSE '' END) AS PREV_LAST_POLICYID ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN TRANSACTIONID ELSE '' END) AS PREV_LAST_TRANSACTIONID ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN CUSTOMERID ELSE '' END) AS PREV_LAST_CUSTOMERID ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN TERM ELSE '' END) AS PREV_LAST_TERM ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN CURRENTPREMIUM ELSE 0 END) AS PREV_LAST_CURRENTPREMIUM ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN WRITTENPREMIUM ELSE 0 END) AS PREV_LAST_WRITTENPREMIUM ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN POLICYSTATUS ELSE '' END) AS PREV_LAST_POLICYSTATUS ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN STARTDATE ELSE NULL END) AS PREV_LAST_STARTDATE ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN ENDDATE ELSE NULL END) AS PREV_LAST_ENDDATE ,
                   MAX(CASE WHEN RN_POLICY_DESC = 2 THEN POLICYTENURE ELSE 0 END) AS PREV_LAST_POLICYTENURE ,
