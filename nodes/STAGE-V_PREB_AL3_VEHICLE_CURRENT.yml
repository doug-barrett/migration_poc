    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          V_PREB_AL3_VEHICLE_CURRENT: b7bd7166-92ed-4805-afc9-dd72f68cd763
          DS_AL3_VEHICLE: 72fbd5e6-c2ea-4f49-bf48-80b8078dc3e1
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_AL3_VEHICLE_CURRENT') }} AS SELECT ds_al3_vehicle.hk_h_sweeplogs ,
                   ds_al3_vehicle.hk_h_vehiclegroup ,
                   ds_al3_vehicle.id ,
                   ds_al3_vehicle.createddate ,
                   ds_al3_vehicle.al3_effectivedate ,
                   ds_al3_vehicle.transactionsequencenumber ,
                   ds_al3_vehicle.policynumber ,
                   ds_al3_vehicle.policyeffectivedate ,
                   ds_al3_vehicle.policyexpirationdate ,
                   ds_al3_vehicle.customerid ,
                   ds_al3_vehicle.policyid ,
                   ds_al3_vehicle.companyvehiclenumber ,
                   ds_al3_vehicle.agencyvehiclenumber ,
                   ds_al3_vehicle.vehicleyear ,
                   ds_al3_vehicle.vehiclemake ,
                   ds_al3_vehicle.vehiclemodel ,
                   ds_al3_vehicle.vehiclebodytypecode ,
                   ds_al3_vehicle.vin ,
                   ds_al3_vehicle.vehicleregistrationstate ,
                   ds_al3_vehicle.ratingterritory ,
                   ds_al3_vehicle.costnew ,
                   ds_al3_vehicle.newcarindicator ,
                   ds_al3_vehicle.vehiclealteredindicator ,
                   ds_al3_vehicle.valueofalterations ,
                   ds_al3_vehicle.vehiclelength ,
                   ds_al3_vehicle.garaginglocationnumbercurrent ,
                   ds_al3_vehicle.totalvehiclefulltermamount ,
                   ds_al3_vehicle.totalvehiclenetchangeamount ,
                   ds_al3_vehicle.vehicletype
              FROM {{ ref('EDW','DS_AL3_VEHICLE') }} ds_al3_vehicle
             INNER JOIN (
                    SELECT DISTINCT u.policyid,
                           u.id,
                           RANK() OVER (PARTITION BY u.policyid ORDER BY u.al3_effectivedate DESC,u.TRANSACTIONSEQUENCENUMBER DESC,u.id DESC) Ranking
                      FROM {{ ref('EDW','DS_AL3_VEHICLE') }} u
                   )uniqueid
                ON (ds_al3_vehicle.policyid = uniqueid.policyid AND ds_al3_vehicle.id = uniqueid.id AND uniqueid.Ranking = 1)
        dependencies:
          - locationName: EDW
            nodeName: DS_AL3_VEHICLE
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_AL3_VEHICLE') }}
        name: V_PREB_AL3_VEHICLE_CURRENT
