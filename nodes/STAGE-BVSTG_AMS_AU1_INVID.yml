                ON bvstg_ams_invoicetransaction_temp.ChargeCode = v_s_ams_setupbillingtran_mroc_current.ChargeCode
             INNER JOIN {{ ref('STAGE','V_PREF_AMS_LOB_MODE') }} v_pref_ams_lob_mode
                ON v_pref_ams_lob_mode.namelobs = bvstg_ams_invoicetransaction_temp.LineOfBus
             WHERE bvstg_ams_invoicetransaction_temp.TRANTYPE = v_s_ams_policytransaction_mroc_current.TranType
