        dependencies:
          - locationName: UNKNOWN
            nodeName: MEDIACODE_MAPPING
        join:
          joinCondition: |-
            FROM "RETAIL_PROD"."SCH_DATA_VAULT"."S_AP1_CDTPOLICY" s_ap1_cdtpolicy
              LEFT JOIN "RETAIL_PROD"."SCH_DATA_VAULT"."L_CDTPOLICY_CDTTYPE" l_cdtpolicy_cdttype
                ON s_ap1_cdtpolicy.hk_h_cdtpolicy = l_cdtpolicy_cdttype.hk_h_cdtpolicy
              LEFT JOIN "RETAIL_PROD"."SCH_DATA_VAULT"."S_AP1_CDTTYPE" s_ap1_cdttype
                ON l_cdtpolicy_cdttype.hk_h_cdttype = s_ap1_cdttype.hk_h_cdttype
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."LAPSE_MODEL_EMAILS_SENT" LAPSE_MODEL_EMAILS_SENT
                ON LAPSE_MODEL_EMAILS_SENT.PolicyID = TO_VARCHAR(s_ap1_cdtpolicy.PolicyID)
             INNER JOIN "RETAIL_PROD"."SCH_EDW"."DS_AP1_TRANSACTIONSUMMARY" ds_ap1_transactionsummary
                ON TO_VARCHAR(ds_ap1_transactionsummary.PolicyID) = TO_VARCHAR(s_ap1_cdtpolicy.PolicyID)
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_CUSTOMERSUMMARY_V2" ds_customersummary_v2
                ON ds_customersummary_v2.CustomerID = TO_VARCHAR(ds_ap1_transactionsummary.CustomerID)
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_S_AP1_OFFICE_MROC_CURRENT" v_s_ap1_office_mroc_current
                ON v_s_ap1_office_mroc_current.OfficeCode = ds_ap1_transactionsummary.BIAPRIMARYAGENTOFFICE
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_S_AP1_ORGANIZATION_MROC_CURRENT" v_s_ap1_organization_mroc_current
                ON v_s_ap1_organization_mroc_current.OrganizationID = v_s_ap1_office_mroc_current.OrganizationID
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."MEDIACODE_MAPPING" MediaCode_Mapping
                ON CASE WHEN v_s_ap1_organization_mroc_current.code LIKE 'SSB%' THEN 'SSBNA'
                        ELSE v_s_ap1_organization_mroc_current.code
                         END = MediaCode_Mapping.Brand
               AND s_ap1_cdttype.Name = MediaCode_Mapping.PolicyStatus
              LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."ZIPCODEOFFICE_MAPPING" ZipCodeOffice_Mapping
                ON ZipCodeOffice_Mapping.AppOne_OfficeCode = v_s_ap1_office_mroc_current.OfficeCode
             WHERE DATE(s_ap1_cdtpolicy.CREATED) = '2021-08-23'
               AND s_ap1_cdttype.Name IN ('Lapse', 'CancelInsuredRequest')
               AND s_ap1_cdtpolicy.policyid IS NOT NULL
               AND CASE WHEN v_s_ap1_organization_mroc_current.code LIKE 'SSB%' THEN 'SSBNA'
                        ELSE v_s_ap1_organization_mroc_current.code
                         END IN ('FWYCA','CACUL','FWYFL','BAJD','FWYSN','FWYTX','FMGA','FWYAZ','OASAZ', 'FWYNM','FWYNV','FWYKS','IOKS','FWYMO','IOMO','FWYSC','VFWA','VFWAG','VFBR','VFOR','FWYID','FWYCO', 'FWYMA','FWYNJ','FWYNY','FWYTN','FWYGA','FWYWI','SHAGA','FWYNAT', 'SSBNA', 'FWYIN')
               AND IFNULL(IFNULL(CASE WHEN LEN(s_ap1_cdtpolicy.PolicyHolderPhone1)<10 THEN NULL ELSE s_ap1_cdtpolicy.PolicyHolderPhone1 END,ds_customersummary_v2.HOMEPHONE),ds_customersummary_v2.CELLPHONE) IS NOT NULL
               AND LAPSE_MODEL_EMAILS_SENT.PolicyID IS NULL
               AND MediaCode_Mapping.MediaCode IS NOT NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY s_ap1_cdtpolicy.HK_H_CDTPOLICY ORDER BY s_ap1_cdtpolicy.DSS_VERSION DESC)=1
        name: BVSTG_MAGUIRE_CANCELLATIONS_1
        noLinkRefs: []
