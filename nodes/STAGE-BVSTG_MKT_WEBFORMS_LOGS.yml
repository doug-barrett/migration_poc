          - locationName: STAGE
            nodeName: V_S_MKT_BROADCAST_CALENDAR_CURRENT
          - locationName: EDW
            nodeName: DS_MKT_WEBFORMS_LOGS
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON v_dlbv_api_lms_masterlead_current.media_code = ds_mkt_campaign.mediacode
              LEFT JOIN {{ ref('STAGE','V_S_MKT_BROADCAST_CALENDAR_CURRENT') }} v_s_mkt_broadcast_calendar_current
                ON v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT = v_s_mkt_broadcast_calendar_current.date
             WHERE (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT >= DATE_TRUNC(WEEK, DATEADD(DAY,-'{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}',CURRENT_DATE()) ::DATE)) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT > (SELECT DATEADD(HOUR,-2,MAX(DSS_UPDATE_TIME)) FROM {{ ref('EDW','DS_MKT_WEBFORMS_LOGS') }}))) QUALIFY ROW_NUMBER() OVER (PARTITION BY v_dlbv_api_lms_masterlead_current.LMS_LEAD_ID ORDER BY v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT) = 1
