    sourceMapping:
      - aliases:
          BVSTG_COMM_AU6_STORE_EVALUATION: a5996bd8-56d0-4828-b4b5-d4100341a294
          DS_BVSTG_UD2ID_MAPPING: aacf1566-86e1-4038-94a1-70894dbdb193
          DS_BVSTG_ACCOUNTID_MAPPING: 4b77ee81-42ed-4276-8af5-1755f1735d8b
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU6_STORE_EVALUATION
          - locationName: STAGE
            nodeName: DS_BVSTG_UD2ID_MAPPING
          - locationName: STAGE
            nodeName: DS_BVSTG_ACCOUNTID_MAPPING
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT OFFICECODES_MAPPED,
                   IS_OS_OFFICECODE,
                   MONTHYEAR,
                   ifnull(Advertising,0) Advertising,
                   ifnull(Legal_Professional_Fees,0) Legal_Professional_Fees,
                   ifnull(Computer_Supplies,0) Computer_Supplies,
                   ifnull(Office_Supplies,0) Office_Supplies,
                   ifnull(Small_Equipment_Purchases,0) Small_Equipment_Purchases,
                   ifnull(All_Other_Expenses,0) All_Other_Expenses,
                   ifnull(Compensation,0)Compensation,
                   ifnull(Driving_Records,0)Driving_Records,
                   ifnull(Fee_Revenue,0)Fee_Revenue,
                   ifnull(Occupancy_Utils_Maint_Security,0)Occupancy_Utils_Maint_Security,
                   ifnull(Commission_Policy_Issuance_Costs,0) Commission_Policy_Issuance_Costs,
                   ifnull(Travel_Entertainment,0)Travel_Entertainment,
                   ifnull(Insurance,0) Insurance,
                   ifnull(Bad_Debt,0)Bad_Debt,
                   ifnull(Premium_Finance_Revenue,0)Premium_Finance_Revenue,
                   ifnull(Ancillary_Product_Revenue,0)Ancillary_Product_Revenue,
                   ifnull(Commission_Revenue,0)Commission_Revenue,
                   ifnull(Commission_Income,0) Commission_Income,
                   ifnull(Postage_Printing_Supplies, 0)Postage_Printing_Supplies,
                   ifnull(Earned_Premium_Direct_Assumed_Ceded,0)Earned_Premium_Direct_Assumed_Ceded,
                   ifnull(Telephone,0) Telephone,
                   ifnull(Other_Revenue,0)Other_Revenue,
                   ifnull(Bank_Credit_Card_Fees,0)Bank_Credit_Card_Fees,
                   ifnull(Adjusting_Claims_Revenue,0)Adjusting_Claims_Revenue
              FROM ( SELECT DISTINCT bvstg_comm_au6_store_evaluation.officecodes_mapped,
                   max(bvstg_comm_au6_store_evaluation.IS_OS_OFFICECODE) IS_OS_OFFICECODE,
                   bvstg_comm_au6_store_evaluation.monthyear,
                   bvstg_comm_au6_store_evaluation.accounts_mapped,
                   sum(bvstg_comm_au6_store_evaluation.values_month) values_month
              FROM( SELECT DISTINCT officecodes_mapped,
                   ud2id,
                   CASE WHEN ud2id IS NULL THEN 0
                        ELSE 1
                         END IS_OS_OFFICECODE,
                   monthyear,
                   accounts_mapped,
                   CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY officecodes_Mapped,ud2id,Accounts_Mapped ORDER BY monthyear)
                        ELSE values_month
                         END AS values_month
              FROM (
                    SELECT DISTINCT officecodes_mapped,
                           ud2id,
                           date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                           accounts_mapped,
                           ifnull(sum(values_month),0) values_month
                      FROM (
                            SELECT bvstg_comm_au6_store_evaluation.UD2ID,
                                   ds_bvstg_ud2id_mapping.officecodes_mapped,
                                   bvstg_comm_au6_store_evaluation.yearid,
                                   bvstg_comm_au6_store_evaluation.accountid,
                                   ds_bvstg_accountid_mapping.accounts_mapped,

                             MONTH,
                                   sum(ifnull(values_month,0)) Values_Month
                              FROM {{ ref('STAGE','BVSTG_COMM_AU6_STORE_EVALUATION') }} bvstg_comm_au6_store_evaluation UNPIVOT (values_month FOR MONTH IN (M1VALUE,M2VALUE,M3VALUE,M4VALUE,M5VALUE,M6VALUE, M7VALUE,M8VALUE,M9VALUE,M10VALUE,M11VALUE,M12VALUE))
                              LEFT JOIN (
                                    SELECT DISTINCT ud2id,
                                           officecodes_mapped
                                      FROM {{ ref('STAGE','DS_BVSTG_UD2ID_MAPPING') }}
                                   ) ds_bvstg_ud2id_mapping
                                ON bvstg_comm_au6_store_evaluation.ud2id=ds_bvstg_ud2id_mapping.ud2id
                              LEFT JOIN (
                                    SELECT DISTINCT childid,
                                           accounts_mapped
                                      FROM {{ ref('STAGE','DS_BVSTG_ACCOUNTID_MAPPING') }}
                                   ) ds_bvstg_accountid_mapping
                                ON bvstg_comm_au6_store_evaluation.accountid=DS_BVSTG_ACCOUNTID_MAPPING.childid
                             WHERE bvstg_comm_au6_store_evaluation.ud2id IN (
                                    SELECT DISTINCT ud2id
                                      FROM {{ ref('STAGE','DS_BVSTG_UD2ID_MAPPING') }}
                                   )
                               AND bvstg_comm_au6_store_evaluation.accountid IN (
                                    SELECT DISTINCT childid
                                      FROM {{ ref('STAGE','DS_BVSTG_ACCOUNTID_MAPPING') }}
                                   )
                             GROUP BY bvstg_comm_au6_store_evaluation.UD2ID,
                                      bvstg_comm_au6_store_evaluation.yearid,
                                      bvstg_comm_au6_store_evaluation.accountid,

                                MONTH,
                                      ds_bvstg_ud2id_mapping.officecodes_mapped,
                                      ds_bvstg_accountid_mapping.accounts_mapped
                           ) bvstg_comm_au6_store_evaluation
                     WHERE date(concat(bvstg_comm_au6_store_evaluation.yearid,'-',replace(replace(bvstg_comm_au6_store_evaluation.month,'M'),'VALUE'),'-01'))<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                     GROUP BY OFFICECODES_MAPPED,
                              ud2id,
                              accounts_mapped,
                              date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                   ) bv
        name: BVSTG_COMM_AU9_STORE_EVALUATION
        noLinkRefs: []
