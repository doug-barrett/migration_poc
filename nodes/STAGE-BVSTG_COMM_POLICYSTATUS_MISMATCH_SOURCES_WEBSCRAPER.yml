    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          DS_COMM_POLICY_STATUS_EXTRACT_COMBINED: 27dd84d6-2e3b-4cc8-8d8f-ff5613539387
          DS_POLICYSUMMARY_V2: 23ba684a-5671-4cfa-9e5f-11f1386d24b3
          DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES: 62e4c62e-c5fa-4abb-8a26-a5acaccb175b
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_COMM_POLICY_STATUS_EXTRACT_COMBINED
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT ds_comm_policy_status_extract_combined_id AS bvstg_comm_policystatus_mismatch_sources_webscraper_id,
                           policynumberformatted,
                           CASE WHEN ispolicyincs = 1 THEN carrier_cs
                                ELSE CASE WHEN ispolicyincdt_2 = 1 THEN carrier_cdt ELSE carrier_edw END
                                 END AS carrier,
                           producercode,
                           asofmonth,
                           status_cs,
                           lasttransactionincs,
                           lasttransactionexecutionmonth,
                           lastexecutionmonth,
                           ispolicyincs,
                           agencystate,
                           islegacytransaction,
                           term AS term_cs,
                           mincutoffdate AS startdate_cs,
                           maxcutoffdate AS enddate_cs,
                           status_edw,
                           ispolicyinedw,
                           status_cdt,
                           last_txn_cdt,
                           last_txn_date_cdt,
                           last_txn_lastupdated_cdt,
                           ispolicyincdt_2 AS ispolicyincdt,
                           startdate AS startdate_cdt,
                           enddate AS enddate_cdt,
                           last_txn_date_cdt AS createdon,
                           last_txn_lastupdated_cdt AS updatedon
                      FROM {{ ref('EDW','DS_COMM_POLICY_STATUS_EXTRACT_COMBINED') }}
                     WHERE not(status_cs = 'Active' AND status_edw = 'Active' AND status_cdt = 'Active')
                       AND not(status_cs = 'Inactive' AND status_edw = 'Inactive' AND status_cdt = 'Inactive')
                   ) ds_comm_policy_status_extract_combined
              LEFT JOIN (
                    SELECT DISTINCT policynumberformatted,
                           sourcedb,
                           policynumber,
                           carriername_edw,
                           customerno,
                           customername,
                           biaprimaryagentoffice,
                           organizationcode
                      FROM (
                            SELECT DISTINCT row_number() OVER (PARTITION BY ds_bvstg_comm_policynumberformatting_allsources.policynumberformatted ORDER BY ds_policysummary_v2.created DESC) AS rank,
                                   policynumberformatted,
                                   sourcedb,
                                   policynumber,
                                   carriername_edw,
                                   ds_policysummary_v2.created,
                                   customerno,
                                   customername,
                                   biaprimaryagentoffice,
                                   organizationcode
                              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
                             INNER JOIN (
                                    SELECT DISTINCT policynumber_edw,
                                           carriername_edw,
                                           policynumberformatted,
                                           carriername_mapped
                                      FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}
                                   ) ds_bvstg_comm_policynumberformatting_allsources
                                ON ds_policysummary_v2.policynumber = ds_bvstg_comm_policynumberformatting_allsources.policynumber_edw
                               AND ds_policysummary_v2.carriername = ds_bvstg_comm_policynumberformatting_allsources.carriername_edw
                           )
                     WHERE rank = 1
                   ) ds_policysummary_v2
                ON ds_comm_policy_status_extract_combined.policynumberformatted = ds_policysummary_v2.policynumberformatted
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ds_retail_office.officecode = ds_policysummary_v2.biaprimaryagentoffice
        name: BVSTG_COMM_POLICYSTATUS_MISMATCH_SOURCES_WEBSCRAPER
        noLinkRefs: []
