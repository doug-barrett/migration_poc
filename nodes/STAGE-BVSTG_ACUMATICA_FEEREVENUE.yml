    sourceMapping:
      - aliases:
          DS_BVSTG_AP1_TRANSACTIONITEM: 046532cf-734e-4340-b2e2-9aed7c724d3d
          DS_RAM_RETAIL_REPOSITORY: 39a9b6bb-124a-4925-91e8-c1b9157d7e95
