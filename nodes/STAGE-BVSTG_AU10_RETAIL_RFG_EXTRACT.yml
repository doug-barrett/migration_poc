            nodeName: DS_BVSTG_AU2_RETAIL_RFG_EXTRACT
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
        join:
          joinCondition: |-
            EXTENDED
              FROM ((
                    SELECT Customerstate,
                           ProducerNumber,Date,OfficeCode,
                           PositiveORQty,
                           PositiveORExpected,
                           StarRatingOverall,
                           Promoter,
                           Detractor,
                           Total_NPS,
                           DOIComplaintQty,
                           POLICYMAJORERRORNOPAY,
                           POLICYSOLD,
                           sourcedb,
                           StarRatingCount,
                           StarRatingSum,
                           CS_ComplaintsSatisfaction,
                           isWeCare,
                           NULL Total_Producers_With_Calls,
                           SubjectArea,
                           Metric,
                           MetricValue,
                           NULL AS islegacytransaction
                      FROM {{ ref('STAGE','BVSTG_2AU10_RETAIL_RFG_EXTRACT') }}
                   )
            UNION ALL (
                    SELECT Customerstate,
                           ProducerNumber,Date,OfficeCode,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           sourcedb,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           SubjectArea,
                           Metric,
                           MetricValue,
                           islegacytransaction
                      FROM {{ ref('STAGE','BVSTG_0AU10_RETAIL_RFG_EXTRACT') }}
                   )
            UNION ALL (
                    SELECT Customerstate,
                           ProducerNumber,
                           to_date(Date),
                           OfficeCode,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           sourcedb,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           'Gain',
                           'New_Policy_Sales',
                           sum(counter),
                           islegacytransaction
                      FROM {{ ref('EDW','DS_BVSTG_AU2_RETAIL_RFG_EXTRACT') }}
                     WHERE label = 'Sales'
                       AND (islegacytransaction<>'Migrated' OR islegacytransaction IS NULL)
                     GROUP BY Customerstate,
                              ProducerNumber,
                              OfficeCode,
                              to_date(Date),
                              sourcedb,
                              islegacytransaction
                   )
            UNION ALL (
                    SELECT NULL,
                           ProducerNumber,
                           to_date(Date),
                           OfficeCode,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           sourcedb,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           'Gain',
                           'New_Policy_Sales_NewCustomer',
                           sum(counter),
                           islegacytransaction
                      FROM (
                            SELECT DISTINCT ProducerNumber,
                                   to_date(Date) date, OfficeCode,
                                   sourcedb,
                                   counter,
                                   customerid,
                                   islegacytransaction
                              FROM {{ ref('EDW','DS_BVSTG_AU2_RETAIL_RFG_EXTRACT') }}
                             WHERE label='Sales'
                               AND sourcedb='SPLC'
                               AND BVSTG_AU2_RETAIL_RFG_EXTRACT_ID IN (
                                    SELECT DISTINCT md5(id) id
                                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                                     WHERE date(CreatedDate) >= date_trunc('year', add_months(current_date()-1, -24))
                                       AND to_date(CreatedDate) <= current_date()-1
                                       AND SourceDB IN ('SPLC')
                                       AND label IN ('New Business Auto', 'New Business Complementary')
                                   )
                           ) new_policy
                     INNER JOIN (
                            SELECT DISTINCT customerid
                              FROM {{ ref('EDW','DS_BVSTG_AU2_RETAIL_RFG_EXTRACT') }}
                             WHERE label='Sales'
                               AND lower(customertype)='new/new'
                               AND counter=1
                               AND sourcedb='SPLC'
                               AND BVSTG_AU2_RETAIL_RFG_EXTRACT_ID IN (
                                    SELECT DISTINCT md5(id) id
                                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                                     WHERE date(CreatedDate) >= date_trunc('year', add_months(current_date()-1, -24))
                                       AND to_date(CreatedDate) <= current_date()-1
                                       AND SourceDB IN ('SPLC')
                                       AND label IN ('New Business Auto', 'New Business Complementary')
                                       AND lower(customertype)='new/new'
                                       AND counter=1
                                   )
                           ) new_customer
                        ON ifnull(new_policy.customerid,'-') = ifnull(new_customer.customerid,'-')
                     GROUP BY ProducerNumber,
                              OfficeCode,
                              to_date(Date),
                              sourcedb,
                              islegacytransaction
                   )
            UNION ALL (
                    SELECT NULL,
                           ProducerNumber,
                           to_date(Date),
                           OfficeCode,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL ,
                           sourcedb,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           NULL,
                           'Gain',
                           'New_Customers_Sold',
                           count(DISTINCT customerid),
                           islegacytransaction
                      FROM {{ ref('EDW','DS_BVSTG_AU2_RETAIL_RFG_EXTRACT') }}
                     WHERE label = 'Sales'
                       AND lower(customertype)='new/new'
                       AND counter=1
                       AND sourcedb='SPLC'
                       AND BVSTG_AU2_RETAIL_RFG_EXTRACT_ID IN (
                            SELECT DISTINCT md5(id) id
                              FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                             WHERE date(CreatedDate) >= date_trunc('year', add_months(current_date()-1, -24))
                               AND to_date(CreatedDate) <= current_date()-1
                               AND SourceDB IN ('SPLC')
                               AND label IN ('New Business Auto', 'New Business Complementary')
                               AND counter=1
                               AND lower(customertype)='new/new'
                           )
                     GROUP BY ProducerNumber,
                              OfficeCode,
                              to_date(Date),
                              sourcedb,
                              islegacytransaction
                   )
            UNION ALL (SELECT Customerstate,
                   ProducerNumber,
                   to_date(Date),
                   OfficeCode,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   sourcedb,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   NULL,
                   'Gain',
                   'Quotes',
                   sum(counter),
                   islegacytransaction
              FROM {{ ref('EDW','DS_BVSTG_AU2_RETAIL_RFG_EXTRACT') }}
             WHERE label IN ('Quotes', 'DummyQuote')
             GROUP BY Customerstate,
                      ProducerNumber,
                      OfficeCode,
                      to_date(Date),
                      sourcedb
