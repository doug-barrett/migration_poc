          BVSTG_AMS_AU3_BASICPOL_INFO: 4ac33edd-a349-4566-a88d-6d7712acdaf8
          V_S_AMS_LOBSETUP_MROC_CURRENT: 9febbf53-7f12-4357-b1bf-99a207022cb7
