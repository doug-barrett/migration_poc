          BVSTG_AMS_AU3_BASICPOL_INFO: 1ad8f9e0-3c95-4fc3-be6d-542153f7eca9
          V_S_AMS_LOBSETUP_MROC_CURRENT: 4557f350-c0f9-4c0c-81ba-cff8d26f7e22
          V_S_AMS_INVOICETRANSACTION_MROC_CURRENT: 938836a4-90fb-4417-84fc-e7b20315b5a9
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_AMS_STATUS') }} AS SELECT polid,
                   CASE WHEN Modeid IN (13,33)       THEN 'Cancelled'
                        WHEN Modeid IN (12,14,32,34) THEN 'Active'
                        WHEN Modeid IN (15,35)       THEN 'Reinstated'
                        ELSE 'Active'
                         END AS Status,
                   TO_DATE(bvstg_ams_au3_basicpol_info.entereddate) AS StatusDate,
                   v_s_ams_lobsetup_mroc_current.descriptionlobs policytype
              FROM {{ ref('STAGE','BVSTG_AMS_AU3_BASICPOL_INFO') }} bvstg_ams_au3_basicpol_info
              LEFT JOIN {{ ref('STAGE','V_S_AMS_LOBSETUP_MROC_CURRENT') }} v_s_ams_lobsetup_mroc_current
                ON bvstg_ams_au3_BasicPol_info.PolicyType = v_s_ams_lobsetup_mroc_current.NameLOBS
              LEFT JOIN {{ ref('STAGE','V_S_AMS_INVOICETRANSACTION_MROC_CURRENT') }} v_s_ams_invoicetransaction_mroc_current
                ON (v_s_ams_invoicetransaction_mroc_current.invtpid = bvstg_ams_au3_BasicPol_info.invtpid)
             WHERE ModeID IN (12,13,14,15,32,33,34,35) QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_ams_au3_basicpol_info.polid,v_s_ams_lobsetup_mroc_current.descriptionlobs ORDER BY bvstg_ams_au3_basicpol_info.entereddate DESC, v_s_ams_invoicetransaction_mroc_current.entereddate DESC, bvstg_ams_au3_basicpol_info.modeid DESC,id) = 1
