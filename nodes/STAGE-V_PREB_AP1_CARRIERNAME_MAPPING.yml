        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_AP1_CARRIERNAME_MAPPING') }} AS SELECT DISTINCT mastercarrier.CARRIERNAME,
                   IFNULL(ap1_carriername_mapping.GROUPINGCARRIERNAME,mastercarrier.CARRIERNAME) AS GROUPINGCARRIERNAME
              FROM (
                    SELECT CARRIERNAME
                      FROM {{ ref('STAGE','V_S_AP1_MASTERCARRIER_MROC_CURRENT') }}
                     UNION SELECT Name
                      FROM {{ ref('STAGE','V_S_AMS_COMPANY_MROC_CURRENT') }}
                   )mastercarrier
              LEFT JOIN (
                    SELECT CARRIERNAME,
                           MIN(CARRIERNAME_GROUPED)GROUPINGCARRIERNAME
                      FROM "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_CARRIERMAPPING"
                     WHERE SOURCE = 'EDW'
                     GROUP BY CARRIERNAME
                   )ap1_carriername_mapping
                ON mastercarrier.CARRIERNAME= ap1_carriername_mapping.CARRIERNAME
        dependencies:
