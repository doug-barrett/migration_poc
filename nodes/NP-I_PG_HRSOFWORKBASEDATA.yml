        name: WORKEDBETWEEN10AND4
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: fbd20f9d-b3f6-4379-9957-0ccbf4e97925
                stepCounter: 8175faa3-6c64-4e3f-a571-e152a897ef4b
            transform: --IF THERE ARE ANY TIMEBANDS BETWEEN THESE TIMES, THEN THERE WILL BE A RECORD  -- IN THIS SOURCE TABLE  MAX(CASE WHEN I_PG_HRSWRKED10AND4.EMPLOYEECODE IS NULL THEN 0 ELSE 1 END)
      - appliedColumnTests: {}
        columnReference:
          columnCounter: ae64c5b1-d64b-4134-8407-57df7bbd3fb7
          stepCounter: 00a82270-16ed-4fe3-bc88-13472bb35391
        config: {}
        dataType: NUMERIC(9,2)
        defaultValue: ""
        description: Number of hours paid to employees when they have been stood down for Fatigue reasons. This does not include the contractual 9 Hour break not worked allowances.
        name: STANDDOWNHOURS
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 5fb1af0c-1c85-4c42-848d-655791f66c50
                stepCounter: 7d71235d-4395-4505-9c53-439b59c11f87
            transform: SUM(CASE WHEN PAIDHOURSTYPECODE = 'ZSTAND' --FATIGUE   THEN F_PRODUCTIVITY.PRODUCTIVITYPAIDHOURS   ELSE 0  END)
      - appliedColumnTests: {}
        columnReference:
          columnCounter: c64dfc79-5c05-4acb-8559-63722ec7f59a
          stepCounter: 00a82270-16ed-4fe3-bc88-13472bb35391
        config: {}
        dataType: NUMERIC(9,2)
        defaultValue: ""
        description: Hours paid to employees who have worked excessive hours (as determined by their contract - they must have a 9 hour break before commensing work) and been stood down.
        name: BREAKNOTWORKEDHOURS
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 4376a427-2e42-4692-9e43-8f16b5cf45f1
                stepCounter: 76286e7e-543e-4b75-90b2-908b7cf43663
            transform: SUM(CASE WHEN ALLOWANCECODE IN ('001B','001H') --9 HOURS BREAK NOT WORKED, DISCRETIONARY STAND DOWN   THEN F_PRODUCTIVITY.PRODUCTIVITYPAIDHOURS   ELSE 0  END)
      - appliedColumnTests: {}
