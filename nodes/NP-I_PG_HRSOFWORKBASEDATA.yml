      - appliedColumnTests: {}
        columnReference:
          columnCounter: c031bd48-d22e-4efa-8889-c34302f8a9c3
          stepCounter: 81fe9af7-4805-4151-a6b8-391097d92633
        config: {}
        dataType: INTEGER
        defaultValue: ""
