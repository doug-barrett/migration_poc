      - appliedColumnTests: {}
        columnReference:
          columnCounter: 1dd82080-bc02-485b-86e0-78d3596e9bb2
          stepCounter: 672e51cb-5ec7-4a51-87ba-e2aa00db70d6
        config: {}
        dataType: NUMERIC(9,2)
        defaultValue: ""
        description: Work related hours for employees (both paid and unpaid) during which work related injuries or illnesses would be considered recordable.
        name: EXPOSUREHOURS
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: acf6f17c-ce9c-4cd2-8549-36312b8d6e7d
                stepCounter: 1e53fe9a-7ec2-4f6a-9bab-f6f4812ea86e
            transform: SUM(ISNULL(F_PRODUCTIVITY.PRODUCTIVITYEXPOSUREHOURS,0)) --NO TIMESHEET YET, BUT IS A WORK DAY, ASSUME 8 HOURS  + SUM(CASE         WHEN D_DATE.CALENDARDATE > ISNULL(I_PG_LASTDAYWORKED.DATE,'1900-01-01')         AND WEEKDAYFLAG = 'Y'         AND ISNULL(PAIDHOURSCATEGORY,'') <> 'LEAVE'         THEN 8 ELSE 0 END)
      - appliedColumnTests: {}
        columnReference:
          columnCounter: fcc8f75b-d7d1-47ee-bcd1-ac6dd2ac7a5f
          stepCounter: 672e51cb-5ec7-4a51-87ba-e2aa00db70d6
        config: {}
        dataType: INTEGER
        defaultValue: ""
        description: Boolean field indicating if the employee worked this day (On standby counts has having worked whether or not they get called in).
        name: WORKED
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: cc6fdccc-1617-415a-95c2-48d341077bd9
                stepCounter: 44a96185-af1e-4619-9cc3-0ec48770c3bc
            transform: --THE EMPLOYEE WORKED, OR WAS ON STANDBY OR THE TIMESHEET HASN'T BEEN ENTERED YET AND ITS A MONDAY TO FRIDAY  -- WE CAN ASSUME THE WORKED MONDAY TO FRIDAY AS THOSE RECORDS WILL ALSO BE TAGGED AS MISSING TIMESHEETS AND THE  -- USER WILL BE ABLE TO SEE THAT THE DATA IS AN ESTIMATE  CASE   --WORKED   WHEN SUM(PRODUCTIVITYEXPOSUREHOURS) <> 0   --ON STANDBY   OR I_PG_STANDBYSALL.QUANTITY > 0   --NO TIMESHEET YET, BUT IS A WORK DAY   OR (D_DATE.CALENDARDATE > ISNULL(I_PG_LASTDAYWORKED.DATE,'1900-01-01') AND WEEKDAYFLAG = 'Y' AND MAX(ISNULL(PAIDHOURSCATEGORY,'')) <> 'LEAVE')  THEN 1 ELSE 0 END
      - appliedColumnTests: {}
        columnReference:
          columnCounter: 07e84687-8b49-4642-bd60-51dde2de7d09
          stepCounter: 672e51cb-5ec7-4a51-87ba-e2aa00db70d6
        config: {}
        dataType: INTEGER
        defaultValue: ""
        description: Boolean field indicating if the employee worked through a nine (or 12) hour break.
        name: BREAKWORKED
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: f4cee9f6-ee81-4b04-a1ae-c6e4d1b0b153
                stepCounter: 925727a0-4193-4b25-91a7-9491c9652c95
            transform: MAX(CASE --LIST OF ALLOWANCES THAT PAY WHEN AN EMPLOYEE WORKS THROUGH THEIR CONTRACTED   -- 9 HOUR BREAK.       WHEN ALLOWANCECODE IN ('001A','001A1','ZWA.005','001D','001F')       THEN 1 ELSE 0 END)
      - appliedColumnTests: {}
        columnReference:
          columnCounter: a2dd190a-a416-4224-8b75-1e3793a19f58
          stepCounter: 672e51cb-5ec7-4a51-87ba-e2aa00db70d6
        config: {}
        dataType: INTEGER
        defaultValue: ""
        description: Boolean field indicating if we have a timesheet for the employee or where we can assume that they are not going to submit a timesheet. E.g. weekend prior to days that we already have a timesheet for.
        name: TIMESHEETENTERED
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: cc6fdccc-1617-415a-95c2-48d341077bd9
                stepCounter: 44a96185-af1e-4619-9cc3-0ec48770c3bc
            transform: CASE --WEEKEND AND WE HAVE LATER TIMESHEETS FOR MONDAY ONWARDS THEREFORE ASSUME THEY DID NOT WORK THE WEEKEND   WHEN WEEKENDFLAG = 'Y' AND ISNULL(I_PG_LASTDAYWORKED.DATE,'1900-01-01') >= D_DATE.CALENDARDATE THEN 1   --WEEKEND AND WE HAVE A TIMESHEET   WHEN WEEKENDFLAG = 'Y' AND MAX(CASE WHEN F_PRODUCTIVITY.D_EMPLOYEE_KEY IS NOT NULL THEN 1 ELSE 0 END) = 1 THEN 1   --WE ARE TRYING TO EXCLUDE DAYS WHERE THEY HAVE ENTERED A TIMESHEET FOR OVERTIME   -- BUT HAVE NOT ENTERED THEIR ORDINARY TIME TIMESHEET AS YET   WHEN SUM(F_PRODUCTIVITY.PRODUCTIVITYPAIDHOURS) >= 8 THEN 1   -- IN CASE THERE ARE WEIRD PAYMENTS, ASSUME THEY HAVE A TIMESHEET AND HAVE WORKED NO HOURS   WHEN SUM(F_PRODUCTIVITY.PRODUCTIVITYPAIDHOURS) = 0 THEN 1  ELSE 0 END
      - appliedColumnTests: {}
