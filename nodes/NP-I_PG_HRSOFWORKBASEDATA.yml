                stepCounter: 89c55ebe-52f2-4a5c-845d-7ccb924a43d4
            transform: ""
      - appliedColumnTests: {}
        columnReference:
          columnCounter: 6157b64f-7d96-4f04-b5c6-ce8bfe148b2d
          stepCounter: dd67543b-990b-43f3-8e97-022f9096949f
        config: {}
        dataType: INTEGER
