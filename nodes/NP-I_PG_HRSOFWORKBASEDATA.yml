                stepCounter: 9ed7e334-f397-45a5-916c-ec299f6c0208
            transform: SUM(CASE WHEN PAIDHOURSTYPECODE = 'ZSTAND' --FATIGUE   THEN F_PRODUCTIVITY.PRODUCTIVITYPAIDHOURS   ELSE 0  END)
      - appliedColumnTests: {}
        columnReference:
          columnCounter: b2c0a3a5-5719-423f-9961-b446090ecdcd
          stepCounter: 672e51cb-5ec7-4a51-87ba-e2aa00db70d6
        config: {}
        dataType: NUMERIC(9,2)
        defaultValue: ""
        description: Hours paid to employees who have worked excessive hours (as determined by their contract - they must have a 9 hour break before commensing work) and been stood down.
