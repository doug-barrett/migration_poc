            FROM {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
              LEFT JOIN {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }} v_s_ap1_lead_mroc_current
                ON (v_dlbv_api_lms_masterlead_current.appone_quote_id = v_s_ap1_lead_mroc_current.leadid OR v_dlbv_api_lms_masterlead_current.lead_id_partner = v_s_ap1_lead_mroc_current.externalleadid)
