    sourceMapping:
      - aliases:
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_PREB_SFDC_SPLC_HIERARCHY
          - locationName: UNKNOWN
            nodeName: V_PREB_SFDC_SPLC_HIERARCHY
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM (
                    SELECT 0 ISBACKOFHOUSE ,
                           a.CHANNEL ,
                           a.EMPLOYEERECORDID ,
                           a.EMPLOYEENUMBER ,
                           a.EMPLOYEEFULLNAME ,
                           a.EMPLOYEEUPN ,
                           a.EMPLOYEESTATUS ,
                           a.EMPLOYEEOFFICECODE ,
                           a.HIERARCHYRECORDID ,
                           a.HIERARCHYNAME ,
                           a.REPORTSTITLE ,
                           a.REPORTSTOOFFICECODE ,
                           a.PRESIDENT_NAME ,
                           a.VICEPRESIDENT_NAME ,
                           a.DIRECTOR_NAME ,
                           a.DISTRICTMANAGER_NAME ,
                           a.TEAMMANAGER_NAME ,
                           a.PRESIDENT_EMPNUMBER ,
                           a.VICEPRESIDENT_EMPNUMBER ,
                           a.DIRECTOR_EMPNUMBER ,
                           a.DISTRICTMANAGER_EMPNUMBER ,
                           a.TEAMMANAGER_EMPNUMBER ,
                           b.STATECODE STATE_FOR_REPORTING ,
                           b.STATECODE EMPLOYEESTATE ,
                           'CONFIEIQ' SOURCE
                      FROM {{ ref('UNKNOWN','V_PREB_SFDC_SPLC_HIERARCHY') }} a
                      LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} b
                        ON a.REPORTSTOOFFICECODE = b.OfficeCode
                     UNION SELECT a.ISBACKOFHOUSE ,
                           'SPLC' CHANNEL ,
                           '0' EMPLOYEERECORDID ,
                           a.EMPLOYEENUMBER ,
                           a.EMPLOYEEFULLNAME ,
                           a.UPN ,
                           a.STATUS ,
                           '' EMPLOYEEOFFICECODE ,
                           NULL HIERARCHYRECORDID ,
                           '' HIERARCHYNAME ,
                           '' REPORTSTITLE ,
                           '' REPORTSTOOFFICECODE ,
                           a.PRESIDENT ,
                           a.VICEPRESIDENT ,
                           a.DIRECTOR ,
                           a.DISTRICTMANAGER ,
                           a.TEAMMANAGER ,
                           a.PRESIDENTNUMBER ,
                           a.VICEPRESIDENTNUMBER ,
                           a.DIRECTORNUMBER ,
                           a.DISTRICTMANAGERNUMBER ,
                           a.TEAMMANAGERNUMBER ,
                           a.STATE_REPORT_TO ,
                           a.EMPLOYEESTATE ,
                           'DATALAKE' SOURCE
                      FROM DATA_LAKE.BIA_ANALYTICS.SPLC_EMPLOYEE_HIERARCHY a
                      LEFT JOIN RETAIL_DEV.SCH_BVSTAGE.V_PREB_SFDC_SPLC_HIERARCHY b
                        ON a.EMPLOYEENUMBER = b.EMPLOYEENUMBER
                     WHERE b.EMPLOYEENUMBER IS NULL
                   ) v_preb_sfdc_splc_hierarchy QUALIFY ROW_NUMBER() OVER (PARTITION BY v_preb_sfdc_splc_hierarchy.EMPLOYEENUMBER ORDER BY CASE WHEN SOURCE = 'CONFIEIQ' THEN 1 ELSE 2 END)=1
