                      FROM (
                            SELECT ds_splc_policytransaction.*
                              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} ds_splc_policytransaction
                             WHERE (('{{ parameters.HWM_BVSTG_Cognitio_Daily_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Cognitio_Daily_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DATE(ds_splc_policytransaction.DSS_UPDATE_TIME),DATE(CURRENT_DATE())) <= '{{ parameters.HWM_BVSTG_Cognitio_Daily_Refresh_Days }}'))
                           ) ds_splc_policytransaction
                      LEFT JOIN {{ ref('STAGE','DS_BVSTG_COMM_AMS_TRANSACTIONMAPPING') }} ds_bvstg_comm_ams_transactionmapping
                        ON ds_splc_policytransaction.trantype= ds_bvstg_comm_ams_transactionmapping.trantypecode
