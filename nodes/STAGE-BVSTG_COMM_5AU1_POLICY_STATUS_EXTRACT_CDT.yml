                   ) ds_bvstg_comm_policynumberformatting_allsources
                ON ds_splc_policytransaction.policynumber = ds_bvstg_comm_policynumberformatting_allsources.policynumber_edw
               AND ds_splc_policytransaction.carriername_org = ds_bvstg_comm_policynumberformatting_allsources.carriername_edw
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_COMM_TERMCLEANING') }} ds_bvstg_comm_termcleaning
                ON ds_bvstg_comm_termcleaning.policynumberformatted = ds_bvstg_comm_policynumberformatting_allsources.policynumberformatted
               AND ds_bvstg_comm_termcleaning.carriername_mapped = ds_bvstg_comm_policynumberformatting_allsources.carriername_mapped
