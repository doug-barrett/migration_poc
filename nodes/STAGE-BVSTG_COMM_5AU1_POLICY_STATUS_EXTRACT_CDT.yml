               AND ds_splc_policytransaction.carriername_org = ds_bvstg_comm_policynumberformatting_allsources.carriername_edw
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_COMM_TERMCLEANING') }} ds_bvstg_comm_termcleaning
