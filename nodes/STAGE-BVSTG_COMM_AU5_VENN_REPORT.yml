        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_COMM_AU4_VENN_REPORT') }} bvstg_comm_au4_venn_report
              LEFT JOIN (
                    SELECT DISTINCT v_dlbv_al3_sweeplogs_current.*,
                           DL_AL3_MESSAGEHEADERGROUP.Producercode,
                           DL_AL3_MESSAGEHEADERGROUP.Contractnumber,
                           policynumberformatted d_policynumberformatted,
                           DL_AL3_REMARKSGROUP.remarktext,
                           carrierdisplayname,
                           CASE WHEN carrierdisplayname IN ('Hallmark','Gainsco','Legacy','Venture','Bluefire Ignite','Bluefire Legacy','Aspire','Dairyland','Key Insurance','Pearl Holding', 'Empower','Links','Founders','Mendota','Producers National','Southern General / Insurance House', 'The Philadelphia Contributionship','Traders','Warrior Invictus','Legacy/Nevada General','American Freedom') THEN DL_AL3_MESSAGEHEADERGROUP.createddate
