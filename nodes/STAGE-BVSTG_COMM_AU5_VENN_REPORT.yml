        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU4_VENN_REPORT
          - locationName: STAGE
            nodeName: V_DLBV_AL3_BASICPOLICYINFOGROUP_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_AL3_SWEEPLOGS_CURRENT
