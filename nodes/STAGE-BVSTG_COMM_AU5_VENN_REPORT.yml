        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_COMM_AU4_VENN_REPORT') }} bvstg_comm_au4_venn_report
              LEFT JOIN (
                    SELECT DISTINCT v_dlbv_al3_sweeplogs_current.*,
                           DL_AL3_MESSAGEHEADERGROUP.Producercode,
                           DL_AL3_MESSAGEHEADERGROUP.Contractnumber,
                           policynumberformatted d_policynumberformatted,
                           DL_AL3_REMARKSGROUP.remarktext,
                           carrierdisplayname,
                           CASE WHEN carrierdisplayname IN ('Hallmark','Gainsco','Legacy','Venture','Bluefire Ignite','Bluefire Legacy','Aspire','Dairyland','Key Insurance','Pearl Holding', 'Empower','Links','Founders','Mendota','Producers National','Southern General / Insurance House', 'The Philadelphia Contributionship','Traders','Warrior Invictus','Legacy/Nevada General','American Freedom') THEN DL_AL3_MESSAGEHEADERGROUP.createddate
                                WHEN carrierdisplayname='National General'                                                                                                                                                                                                                                                                                                                                   THEN DL_AL3_REMARKSGROUP.createddate
                                ELSE v_dlbv_al3_sweeplogs_current.createddate
                                 END AS Created_date
                      FROM (
                            SELECT DISTINCT V_DLBV_AL3_BASICPOLICYINFOGROUP_CURRENT.*,
                                   carriername //
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_AL3_BASICPOLICYINFOGROUP_CURRENT" v_dlbv_al3_basicpolicyinfogroup_current
                              FROM {{ ref('STAGE','V_DLBV_AL3_BASICPOLICYINFOGROUP_CURRENT') }}
                              LEFT JOIN //"RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_AL3_SWEEPLOGS_CURRENT" v_dlbv_al3_sweeplogs_current {{ ref('STAGE','V_DLBV_AL3_SWEEPLOGS_CURRENT') }} v_dlbv_al3_sweeplogs_current
                                ON v_dlbv_al3_basicpolicyinfogroup_current.sweeplogid = v_dlbv_al3_sweeplogs_current.id
                           ) v_dlbv_al3_sweeplogs_current
                      LEFT JOIN (
                            SELECT DISTINCT sweeplogid,
                                   ltrim(upper(trim(DeletedContractNumberSee1MHG18)),'0') AS Producercode,
                                   ContractNumber,
                                   createddate //
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_AL3_MESSAGEHEADERGROUP_CURRENT"
                              FROM {{ ref('STAGE','V_DLBV_AL3_MESSAGEHEADERGROUP_CURRENT') }}
                           ) DL_AL3_MESSAGEHEADERGROUP
                        ON v_dlbv_al3_sweeplogs_current.sweeplogid = DL_AL3_MESSAGEHEADERGROUP.sweeplogid
                      LEFT JOIN (
                            SELECT DISTINCT sweeplogid,
                                   substring(REMARKSTExt,12) remarktext,
                                   createddate //
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_AL3_REMARKSGROUP_CURRENT"
                              FROM {{ ref('STAGE','V_DLBV_AL3_REMARKSGROUP_CURRENT') }}
                             WHERE upper(REMARKSTEXT) like 'AGENCY CODE%'
                           ) DL_AL3_REMARKSGROUP
                        ON v_dlbv_al3_sweeplogs_current.sweeplogid = DL_AL3_REMARKSGROUP.sweeplogid
                      LEFT JOIN (
                            SELECT DISTINCT policynumber_al3,
                                   carriername_al3,
                                   policynumberformatted,
                                   carrierdisplayname //
                              FROM "RETAIL_PROD.SCH_EDW.DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF"
                              FROM {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}
                           ) DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
                        ON v_dlbv_al3_sweeplogs_current.policynumber = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.policynumber_al3
                       AND v_dlbv_al3_sweeplogs_current.carriername = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.carriername_al3
                   ) v_dlbv_al3_basicpolicyinfogroup_current
                ON bvstg_comm_au4_venn_report.policynumberformatted=v_dlbv_al3_basicpolicyinfogroup_current.d_policynumberformatted
               AND bvstg_comm_au4_venn_report.carrier=v_dlbv_al3_basicpolicyinfogroup_current.carrierdisplayname QUALIFY row_number() OVER (PARTITION BY policynumberformatted,carrier ORDER BY created_date DESC)=1
