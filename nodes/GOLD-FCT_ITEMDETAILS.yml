    Part\")\n  - Labor Line Severity Price Count:  CALCULATE(COUNT(ItemDetails[JobId]),ItemDetails[CostType]=\"\
    Labor\",ItemDetails[LineAmount]<>0,not(ItemDetails[SaleItemId\n  - Calibration\
    \ Line Severity Price Count:  CALCULATE(COUNT(ItemDetails[JobId]),ItemDetails[SaleItemId]\
    \ in {600,601,602,603,604,605,606,1139,1140,1141},ItemDetails\n  - Freight Severity\
