    \  CALCULATE(AVERAGE(ItemDetails[LineAmount]),ItemDetails[CostType]=\"Part\",ItemDetails[LineAmount]<>0)\n\
    \  - Labor Line Severity Price:  CALCULATE(AVERAGE(ItemDetails[LineAmount]),ItemDetails[CostType]=\"\
    Labor\",ItemDetails[LineAmount]<>0,not(ItemDetails[Sal\n  - Calibration Line Severity\
