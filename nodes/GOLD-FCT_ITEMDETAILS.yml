    Freight\",ItemDetails[LineAmount]<>0)\n  - Parts Severity Price Job Count:  CALCULATE(DISTINCTCOUNT(ItemDetails[JobId]),ItemDetails[LineAmount]<>0,ItemDetails[CostType]=\"\
    Part\")\n  - Labor Severity Price Job Count:  CALCULATE(DISTINCTCOUNT(ItemDetails[JobId]),ItemDetails[CostType]=\"\
    Labor\",ItemDetails[LineAmount]<>0,not(ItemDetails[Sa\n  - Calibration Severity\
