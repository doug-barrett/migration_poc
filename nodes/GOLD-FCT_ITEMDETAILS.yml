    Freight\")\n  - Freight Line Severity Price Count: CALCULATE(COUNT(ItemDetails[JobId]),ItemDetails[LineAmount]<>0,ItemDetails[CostType]=\"\
    Freight\")\n  - Labor Severity Cost:  DIVIDE(CALCULATE(sum(ItemDetails[LineCost]),ItemDetails[CostType]=\"\
    Labor\",not(ItemDetails[SaleItemId] in {600,601,602,6\n  - Parts Severity Cost:\
    \  divide(CALCULATE(sum(ItemDetails[LineCost]),ItemDetails[CostType]=\"Part\"\
    ),CALCULATE(DISTINCTCOUNT(ItemDetails[JobId]),I\n  - Calibration Severity Cost:\
    \ DIVIDE( CALCULATE(sum(ItemDetails[LineCost]),ItemDetails[SaleItemId] in {600,601,602,603,604,605,606,1139,1140,1141}),CA\n\
    \  - Freight Severity Cost: divide( CALCULATE(sum(ItemDetails[LineCost]),ItemDetails[CostType]=\"\
