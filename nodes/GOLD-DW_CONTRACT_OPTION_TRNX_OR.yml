          LEFT JOIN {{ ref(''BRONZE'', ''DW_TRNX_TYPE'') }} dw_trnx_type ON dw_trnx_type.SOURCE_TRNX_TYPE_CODE = or_dcash.CSH_CASH_CAUSE AND dw_trnx_type.BUSN_LINE = or_dcash.CSH_PROD_CATEGORY

