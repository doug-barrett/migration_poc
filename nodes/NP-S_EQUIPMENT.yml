        name: DAYSTOEXPIRY
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN I_EQUIPMENT.ISAVAILABLE = 1 AND D_DUEDATE.DUEDATE IS NULL THEN -1
