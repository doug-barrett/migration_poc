        name: WARNINGFLAG
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN D_DUEDATE.DUEDATE IS NULL                                                                                    THEN 0
                          WHEN I_EQUIPMENT.ISAVAILABLE = 1 AND DATEDIFF(DAY,CONVERT(DATE,GETDATE()),CONVERT(DATE,D_DUEDATE.DUEDATE)) <= -30 THEN 2
