        config: {}
        dataType: 'INTEGER '
        defaultValue: ""
        description: The value can be either 0 (still in test), 1 out of test by up to 30 days, or 2 out of test by more than 30 days. Any equipment that is not assigned will have a zero value.
        name: WARNINGFLAG
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN D_DUEDATE.DUEDATE IS NULL                                                                                    THEN 0
                          WHEN I_EQUIPMENT.ISAVAILABLE = 1 AND DATEDIFF(DAY,CONVERT(DATE,GETDATE()),CONVERT(DATE,D_DUEDATE.DUEDATE)) <= -30 THEN 2
