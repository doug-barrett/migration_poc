    sourceMapping:
      - aliases:
          DS_COMM_POLICY_STATUS_EXTRACT_CS_WRITTEN: d80871f6-6535-4bef-aff4-80ef1823fd9f
          DS_COMM_POLICY_STATUS_EXTRACT_CS_EARNED: 19f6fb3b-bf6d-4fe0-8aaf-5c3e4f021465
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_COMM_POLICY_STATUS_EXTRACT_CS_WRITTEN
          - locationName: EDW
            nodeName: DS_COMM_POLICY_STATUS_EXTRACT_CS_EARNED
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT ds_comm_policy_status_extract_cs_written.*,
                   max(ds_comm_policy_status_extract_cs_written.executionmonth) OVER (PARTITION BY ds_comm_policy_status_extract_cs_written.PolicyNumberFormatted, ds_comm_policy_status_extract_cs_written.carrier, ds_comm_policy_status_extract_cs_written.grp2 ORDER BY ds_comm_policy_status_extract_cs_written.cutoffdate ROWS UNBOUNDED PRECEDING) AS LastTransactionExecutionMonth,
                   max(ds_comm_policy_status_extract_cs_written.TransactionType) OVER (PARTITION BY ds_comm_policy_status_extract_cs_written.PolicyNumberFormatted, ds_comm_policy_status_extract_cs_written.carrier,ds_comm_policy_status_extract_cs_written.grp2 ORDER BY ds_comm_policy_status_extract_cs_written.cutoffdate ROWS UNBOUNDED PRECEDING) AS LastTransaction,
                   max(ds_comm_policy_status_extract_cs_written.CarrierDataRepositoryCompleteID) OVER (PARTITION BY ds_comm_policy_status_extract_cs_written.PolicyNumberFormatted, ds_comm_policy_status_extract_cs_written.carrier,ds_comm_policy_status_extract_cs_written.grp2 ORDER BY ds_comm_policy_status_extract_cs_written.cutoffdate ROWS UNBOUNDED PRECEDING) AS LastCDRCID,
                   max(ds_comm_policy_status_extract_cs_written.Source_Table) OVER (PARTITION BY ds_comm_policy_status_extract_cs_written.PolicyNumberFormatted, ds_comm_policy_status_extract_cs_written.carrier,ds_comm_policy_status_extract_cs_written.grp2 ORDER BY ds_comm_policy_status_extract_cs_written.cutoffdate ROWS UNBOUNDED PRECEDING) AS Txn_Source_Table
              FROM ( SELECT ds_comm_policy_status_extract_cs_written.*,
                   max(CASE WHEN TransactionType IS NOT NULL THEN CutoffDate END) OVER (PARTITION BY PolicyNumberFormatted, carrier ORDER BY cutoffdate ROWS UNBOUNDED PRECEDING) AS grp2
              FROM (SELECT ds_comm_policy_status_extract_cs_written.*,
                   bvstg_comm_au2_eom_extract_cs.ExecutionMonth,
                   bvstg_comm_au2_eom_extract_cs.TransactionType,
                   bvstg_comm_au2_eom_extract_cs.CarrierDataRepositoryCompleteID,
                   bvstg_comm_au2_eom_extract_cs.Source_Table
              FROM ( SELECT POLICYNUMBERFORMATTED,
                   CARRIER,
                   CARRIERDISPLAYNAME,
                   AGENCY_MAPPED,
                   STATECODE_MAPPED,
                   ORIGINAL_PAIDTYPE,
                   PRODUCERCODE,
                   CS_CALCULATION_LOGIC,
                   LASTEST_CSPOLICYNUMBERFORMATTED,
                   CUTOFFDATE,
                   TERM,
                   STARTDATE,
                   ENDDATE,
                   PREMIUM,
                   NEG_PREMIUM_FLAG,
                   CANC_FLAG_EXECMONTH,
                   RENEWAL_FLAG_EXECMONTH,
                   NEW_BUSINESS_FLAG_EXECMONTH,
                   REINSTATEMENT_FLAG_EXECMONTH,
                   ENDORSEMENT_FLAG_EXECMONTH,
                   LATESTNBSRWLPREMIUM,
                   NBSMONTH,
