        join:
          joinCondition: |-
            FROM ( SELECT DISTINCT bvstg_comm_au7_eom_extract_cs.PolicyNumberFormatted,
                   bvstg_comm_au7_eom_extract_cs.carrier,
                   bvstg_comm_au7_eom_extract_cs.carrierdisplayname,
                   bvstg_comm_au7_eom_extract_cs.agency_mapped,
                   bvstg_comm_au7_eom_extract_cs.statecode_mapped,
                   bvstg_comm_au7_eom_extract_cs.paidtype,
                   bvstg_comm_au7_eom_extract_cs.paidtypefinal,
                   bvstg_comm_au7_eom_extract_cs.producercode,
                   bvstg_comm_au7_eom_extract_cs.CS_CALCULATION_LOGIC,
                   bvstg_comm_au7_eom_extract_cs.lastest_cspolicynumberformatted,
                   bvstg_comm_au7_eom_extract_cs.cutoffdate,
                   bvstg_comm_au7_eom_extract_cs.Term,
                   bvstg_comm_au7_eom_extract_cs.NBSmonth,
                   bvstg_comm_au7_eom_extract_cs.StartDate,
                   bvstg_comm_au7_eom_extract_cs.EndDate,
                   bvstg_comm_au3_eom_extract_cs.Premium,
                   CASE WHEN mod(datediff('months', NBSMonth, cutoffdate), bvstg_comm_au7_eom_extract_cs.term) = 0 AND NBSMonth <> cutoffdate THEN 1
                        WHEN mod(datediff('months', NBSMonth, cutoffdate), bvstg_comm_au7_eom_extract_cs.term) <> 0                           THEN 0
                        WHEN NBSMonth = cutoffdate                                                                                            THEN 0
                         END AS IsRenewalMonth,
                   bvstg_comm_au3_eom_extract_cs_1.MaxExecutionMonth,
                   NULL NEG_PREMIUM_FLAG,
                   NULL Canc_Flag_Execmonth,
                   NULL Renewal_Flag_Execmonth,
                   NULL New_Business_Flag_Execmonth,
                   NULL Reinstatement_Flag_Execmonth,
                   NULL Endorsement_Flag_Execmonth,
                   NULL LatestNBSRWLPremium,
                   bvstg_comm_au7_eom_extract_cs.avg_monthly_premium
              FROM {{ ref('STAGE','BVSTG_COMM_AU7_EOM_EXTRACT_CS') }}
              LEFT JOIN (
                    SELECT policynumberformatted,
                           carrier,
                           to_date(executionmonth) executionmonth,
                           term,
                           sum(Premium) Premium
                      FROM {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }}
                     WHERE paidtypefinal = 'As Earned'
                     GROUP BY policynumberformatted,
                              carrier,
                              to_date(executionmonth),
                              term
                   ) bvstg_comm_au3_eom_extract_cs
                ON bvstg_comm_au7_eom_extract_cs.policynumberformatted = bvstg_comm_au3_eom_extract_cs.policynumberformatted
               AND bvstg_comm_au7_eom_extract_cs.Carrier = bvstg_comm_au3_eom_extract_cs.Carrier
               AND bvstg_comm_au7_eom_extract_cs.CutOffDate = bvstg_comm_au3_eom_extract_cs.ExecutionMonth
              LEFT JOIN -------- Updated code 1/17 to correct status for Bluefire Texas when no data is available for current month   (select carrier, MaxExecutionMonth from    (select carrier_unmapped, carrier, max(to_date(executionmonth)) MaxExecutionMonth    from {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }}    where source_table = 'CDRC' --and carrier_unmapped<>'All Star General'  group by carrier_unmapped, carrier)  qualify row_number() over (partition by carrier order by MaxExecutionMonth asc) = 1)    bvstg_comm_au3_eom_extract_cs_1    on bvstg_comm_au3_eom_extract_cs_1.carrier = bvstg_comm_au7_eom_extract_cs.carrier  ) bvstg_comm_au7_eom_extract_cs
        name: BVSTG_COMM_AU8_EOM_EXTRACT_CS
