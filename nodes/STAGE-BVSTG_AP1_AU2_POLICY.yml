        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_AP1_AU0_TRANSACTIONPOLICY_FIX') }} bvstg_ap1_au0_transactionpolicy_fix
              JOIN {{ ref('DATA_VAULT','H_TRANSACTION') }} h_transaction
                ON bvstg_ap1_au0_transactionpolicy_fix.HK_h_transaction = h_transaction.HK_h_transaction
              JOIN {{ ref('DATA_VAULT','H_POLICY') }} h_policy
                ON bvstg_ap1_au0_transactionpolicy_fix.HK_h_policy = h_policy.HK_h_policy
              JOIN ((SELECT * FROM {{ ref('DATA_VAULT','S_AP1_POLICY_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY hk_h_policy ORDER BY dss_start_date DESC) = 1)) v_s_ap1_policy_mroc_current
                ON h_policy.HK_h_policy = v_s_ap1_policy_mroc_current.HK_h_policy
               AND v_s_ap1_policy_mroc_current.isrowdeleted = 0
              JOIN {{ ref('STAGE','BVSTG_AP1_POLICY_REFRESH') }} bvstg_ap1_policy_refresh
                ON bvstg_ap1_policy_refresh.policyid = h_policy.policyid
              JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_TRANSACTION_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY hk_h_transaction ORDER BY dss_start_date DESC) = 1
                   ) v_s_ap1_transaction_mroc_current
                ON h_transaction.HK_h_transaction = v_s_ap1_transaction_mroc_current.HK_h_transaction
               AND v_s_ap1_transaction_mroc_current.isrowdeleted = 0
              LEFT JOIN {{ ref('DATA_VAULT','H_LINEOFBUSINESSTYPE') }} h_lineofbusinesstype
                ON v_s_ap1_policy_mroc_current.lineofbusinessid = h_lineofbusinesstype.lineofbusinesstypeid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_LINEOFBUSINESSTYPE_MROC_CURRENT') }} v_s_ap1_lineofbusinesstype_mroc_current
                ON h_lineofbusinesstype.HK_h_lineofbusinesstype = v_s_ap1_lineofbusinesstype_mroc_current.HK_h_lineofbusinesstype
               AND v_s_ap1_lineofbusinesstype_mroc_current.isrowdeleted = 0
              LEFT JOIN {{ ref('DATA_VAULT','H_PROGRAM') }} h_program
                ON v_s_ap1_policy_mroc_current.programid = h_program.programid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_PROGRAM_MROC_CURRENT') }} v_s_ap1_program_mroc_current
                ON h_program.HK_h_program = v_s_ap1_program_mroc_current.HK_h_program
              LEFT JOIN {{ ref('DATA_VAULT','H_CARRIER') }} h_carrier
                ON v_s_ap1_program_mroc_current.carrierid = h_carrier.carrierid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CARRIER_MROC_CURRENT') }} v_s_ap1_carrier_mroc_current
                ON h_carrier.HK_h_carrier = v_s_ap1_carrier_mroc_current.HK_h_carrier
              LEFT JOIN {{ ref('DATA_VAULT','H_MASTERCARRIER') }} h_mastercarrier
                ON v_s_ap1_carrier_mroc_current.mastercarrierid = h_mastercarrier.mastercarrierid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_MASTERCARRIER_MROC_CURRENT') }} v_s_ap1_mastercarrier_mroc_current
                ON h_mastercarrier.HK_h_mastercarrier = v_s_ap1_mastercarrier_mroc_current.HK_h_mastercarrier
               AND v_s_ap1_mastercarrier_mroc_current.isrowdeleted = 0
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue
                ON v_s_ap1_policy_mroc_current.termid = ref_ap1_codevalue.codevalueid
