        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT bvstg_au1_newbusiness.*,
                   policydriverid,
                   abs(datediff(YEAR,DOB,CreatedDate)) Driver_Age,
                   ifnull(Driver_gender,'Unknown') Driver_gender,
                   count(DISTINCT policynumberformatted, Carrier, policydriverid) OVER (PARTITION BY policynumberformatted, Carrier) Drivers_Count,
                   l_policydriver_policyversion.isrowdeleted,
                   l_policydriver_policyversion.isexcluded --from "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_AU1_NEWBUSINESS" bvstg_au1_newbusiness  from {{ ref('STAGE','BVSTG_AU1_NEWBUSINESS') }} bvstg_au1_newbusiness  left join  (  select distinct policyid_char as policyid, policydriverid, DOB, SourceDB,  case when gender='543' then 'M'       when gender='544' then 'F'       else 'Unknown' end as Driver_Gender,  'False' as isrowdeleted,  'False' as isexcluded  from (select *, cast(policyid as varchar) as policyid_char   --from RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_POLICYVERSION_MROC_CURRENT   FROM {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }}  where isrowdeleted = 'False' and POLICYVERSIONSTATUSID=1) pv  inner join    (select distinct  policyversionid,cast(policydriverid as varchar) policydriverid,            DOB, created, lastupdated, isrowdeleted,             'AppOne' SourceDB, isexcluded, gender  --from RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_POLICYDRIVER_MROC_CURRENT  from {{ ref('STAGE','V_S_AP1_POLICYDRIVER_MROC_CURRENT') }}                         where isrowdeleted = 'False' and isexcluded='False' and  (dob is null or (len(ltrim(year(dob),0))=4 and dob<=current_date-1))) p  on pv.policyversionid=p.policyversionid  --left join RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_TRANSACTION_MROC_CURRENT tm  LEFT JOIN {{ ref('STAGE','V_S_AP1_TRANSACTION_MROC_CURRENT') }} tm  on pv.TRANSACTIONID=tm.TRANSACTIONID  --left join RETAIL_PROD.SCH_DATA_VAULT.REF_AP1_TRANSACTIONTYPE tty  left join {{ ref('DATA_VAULT','REF_AP1_TRANSACTIONTYPE') }} tty    ON tty.TransactionTypeId = tm.TransactionTypeID  --left join RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_POLICY_MROC_CURRENT pm  left join {{ ref('STAGE','V_S_AP1_POLICY_MROC_CURRENT') }} pm    ON pv.policyid = pm.PolicyID  --left join RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_LINEOFBUSINESSTYPE_MROC_CURRENT lob  left join {{ ref('STAGE','V_S_AP1_LINEOFBUSINESSTYPE_MROC_CURRENT') }} lob    ON lob.LineOfBusinessTypeID = pm.LineOfBusinessID    where tty.EnumStringValue = 'New Business'    AND lob.name = 'Auto'    UNION    select distinct PolicyID, PolicyDriverID, DOB,'SPLC' SourceDB,  case when sex = 'M' then 'M'       when sex = 'F' then 'F'       else 'Unknown' end as Driver_Gender,  'False' isrowdeleted,  'False' isexcluded  from   (select distinct hk_h_driver, cast(polid as varchar) PolicyID, cast(DRVID as varchar) PolicyDriverID, effdate                                   -- from "RETAIL_PROD"."SCH_DATA_VAULT"."H_SPLC_DRIVER") h_splc_driver   from {{ ref('DATA_VAULT','H_SPLC_DRIVER') }}) h_splc_driver  inner join   (select distinct hk_h_driver, to_date(DOB) DOB, to_number(driverno) driverno, upper(sex) sex    --from "RETAIL_PROD"."SCH_DATA_VAULT"."S_SPLC_DRIVER"   from {{ ref('DATA_VAULT','S_SPLC_DRIVER') }}   where to_date(dob) is null or (to_date(dob)<=current_date-1 and len(ltrim(year(dob),0))=4)) s_splc_driver     ---------Change added to remove irrelevant DOB (13/01/2023)   on h_splc_driver.hk_h_driver = s_splc_driver.hk_h_driver  qualify row_number() over (partition by policyid, policydriverid order by to_timestamp_ntz(effdate),dob,driverno,driver_gender) = 1   -----Change Added on (13/01/2023)    UNION    select distinct PolicyID, PolicyDriverID, DOB, 'CIGH' SourceDB,  case when sex = 'M' then 'M'       when sex = 'F' then 'F'       else 'Unknown' end as Driver_Gender,  'False' isrowdeleted,  'False' isexcluded  from   (select distinct hk_h_driver, cast(polid as varchar) PolicyID, cast(DRVID as varchar) PolicyDriverID, EFFDATE   --from "RETAIL_PROD"."SCH_DATA_VAULT"."H_DRIVER") h_driver   from {{ ref('DATA_VAULT','H_DRIVER') }}) h_driver  inner join   (select distinct hk_h_driver, to_date(DOB) DOB, to_number(driverno) driverno, upper(sex) sex   --from "RETAIL_PROD".
