        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_S_AMS_BASICPOLINFO_MROC_CURRENT') }} v_s_ams_basicpolinfo_mroc_current
             INNER JOIN {{ ref('STAGE','V_S_AMS_POLICYTRANPREMIUM_MROC_CURRENT') }} v_s_ams_POLICYTRANPREMIUM_mroc_current
                ON v_s_ams_basicpolinfo_mroc_current.POLID = v_s_ams_POLICYTRANPREMIUM_mroc_current.POLID
             INNER JOIN {{ ref('STAGE','V_S_AMS_POLICYTRANSACTION_MROC_CURRENT') }} v_s_ams_policytransaction_mroc_current
                ON v_s_ams_basicpolinfo_mroc_current.POLID = v_s_ams_policytransaction_mroc_current.POLID
               AND TO_DATE(v_s_ams_policytransaction_mroc_current.EFFDATE) >= TO_DATE(v_s_ams_basicpolinfo_mroc_current.POLEFFDATE)
               AND TO_DATE(v_s_ams_policytransaction_mroc_current.EFFDATE) <= TO_DATE(v_s_ams_basicpolinfo_mroc_current.POLEXPDATE)
              LEFT JOIN {{ ref('STAGE','V_S_AMS_INVOICE_MROC_CURRENT') }} v_s_ams_invoice_mroc_current
                ON v_s_ams_invoice_mroc_current.POLID = v_s_ams_basicpolinfo_mroc_current.POLID
               AND TO_DATE(v_s_ams_invoice_mroc_current.ENTEREDDATE) = (
                    SELECT MIN(TO_DATE(ENTEREDDATE))
                      FROM {{ ref('STAGE','V_S_AMS_INVOICE_MROC_CURRENT') }}
                     WHERE polid = v_s_ams_basicpolinfo_mroc_current.POLID
                   )
              LEFT JOIN {{ ref('STAGE','V_S_AMS_INVOICETRANSACTION_MROC_CURRENT') }} v_s_ams_invoicetransaction_mroc_current
                ON v_s_ams_invoicetransaction_mroc_current.INVID = v_s_ams_invoice_mroc_current.INVID
               AND TO_DATE(v_s_ams_invoicetransaction_mroc_current.ENTEREDDATE) = (
                    SELECT MIN(TO_DATE(ENTEREDDATE))
                      FROM {{ ref('STAGE','V_S_AMS_INVOICETRANSACTION_MROC_CURRENT') }}
                     WHERE invid = v_s_ams_invoice_mroc_current.INVID
                   )
             INNER JOIN {{ ref('STAGE','V_S_AMS_SETUPBILLINGTRAN_MROC_CURRENT') }} v_s_ams_SetupBillingTran_mroc_current
                ON v_s_ams_invoicetransaction_mroc_current.ChargeCode = v_s_ams_SetupBillingTran_mroc_current.ChargeCode
              LEFT JOIN {{ ref('STAGE','V_S_AMS_CASHRECEIPTDETAIL_MROC_CURRENT') }} v_s_ams_CASHRECEIPTDETAIL_mroc_current
                ON v_s_ams_CASHRECEIPTDETAIL_mroc_current.ReceivedFromId = v_s_ams_basicpolinfo_mroc_current.CustId
             WHERE v_s_ams_POLICYTRANPREMIUM_mroc_current.BILLEDPREMIUM > 0
               AND v_s_ams_invoicetransaction_mroc_current.TRANTYPE = v_s_ams_policytransaction_mroc_current.TranType
               AND v_s_ams_invoicetransaction_mroc_current.GROSSAMT > 0
               AND v_s_ams_invoicetransaction_mroc_current.backinvtpid IS NULL
               AND v_s_ams_invoicetransaction_mroc_current.oldinvtpid IS NULL
               AND v_s_ams_invoicetransaction_mroc_current.LINEOFBUS = v_s_ams_POLICYTRANPREMIUM_mroc_current.LINEOFBUS
               AND v_s_ams_SetupBillingTran_mroc_current.ShortName != 'PRFAGY'
               AND v_s_ams_policytransaction_mroc_current.TranType IN ('NBS','NBQ','RWL','RWQ','RIX','REW')
               AND v_s_ams_invoicetransaction_mroc_current.LineOfBus IN('AUTOP')
             GROUP BY v_s_ams_invoicetransaction_mroc_current.invtpid ,
                      v_s_ams_invoice_mroc_current.invid
