          - locationName: STAGE
            nodeName: V_S_AP1_LEADDRIVER_CURRENT
          - locationName: DATA_VAULT
            nodeName: S_AP1_LEAD_MROC
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_MKT_AU1_CAMPAIGN2SALES') }} bvstg_mkt_au1_campaign2sales
              LEFT JOIN {{ ref('STAGE','V_S_MKT_BROADCAST_CALENDAR_CURRENT') }} v_s_mkt_broadcast_calendar_current
                ON bvstg_mkt_au1_campaign2sales.VintageDate = v_s_mkt_broadcast_calendar_current.DATE
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON bvstg_mkt_au1_campaign2sales.CampaignID = ds_mkt_campaign.campaignid
              LEFT JOIN {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} s_ap1_lead_mroc
                ON bvstg_mkt_au1_campaign2sales.leadid = TO_VARCHAR(s_ap1_lead_mroc.LeadiD)
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
                ON v_dlbv_api_lms_masterlead_current.LMS_LEAD_ID = bvstg_mkt_au1_campaign2sales.ID_LMS /*V_DLBV_API_LMS_MASTERLEAD_CURRENT.LEAD_ID_PARTNER = s_ap1_lead_mroc.ExternalLeadID    AND s_ap1_lead_mroc.ExternalLeadID IS NOT NULL    AND bvstg_mkt_au1_campaign2sales.id_lms IS NULL  */
              LEFT JOIN (
                    SELECT LeadID ,
                           COUNT(1) No_Drivers
                      FROM {{ ref('STAGE','V_S_AP1_LEADDRIVER_CURRENT') }}
                     WHERE isrowdeleted = 'False'
                     GROUP BY LeadID
                   ) v_s_ap1_leaddriver_current
                ON v_s_ap1_leaddriver_current.LeadID = s_ap1_lead_mroc.LeadID QUALIFY ROW_NUMBER() OVER (
            PARTITION BY bvstg_mkt_au1_campaign2sales.id || '-' || bvstg_mkt_au1_campaign2sales.RefreshType
             ORDER BY --CASE WHEN bvstg_mkt_au1_campaign2sales.interactionidkey IS NOT NULL THEN 1 ELSE 2 END,  CASE WHEN bvstg_mkt_au1_campaign2sales.isSale=1 THEN 1   WHEN bvstg_mkt_au1_campaign2sales.isTransfer=1 THEN 2   WHEN bvstg_mkt_au1_campaign2sales.isQuote=1 THEN 3   WHEN bvstg_mkt_au1_campaign2sales.id_lms IS NOT NULL THEN 4        ELSE 5 END,                          bvstg_mkt_au1_campaign2sales.VintageDate) = 1
        name: SRC_bvstg_mkt_au2_campaign2sales_1_refresh
        noLinkRefs: []
      - aliases:
          DS_MKT_CAMPAIGN2SALES: ff5e2145-d1d1-4198-9b06-3b0cdf344822
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN2SALES
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_MKT_CAMPAIGN2SALES') }} ds_mkt_campaign2sales
             INNER JOIN(
                    SELECT a.ID
                      FROM {{ ref('EDW','DS_MKT_CAMPAIGN2SALES') }} a
                     INNER JOIN(
                            SELECT ID_LMS
                              FROM {{ ref('EDW','DS_MKT_CAMPAIGN2SALES') }}
                             WHERE ID_LMS IS NOT NULL
                             GROUP BY ID_LMS
                            HAVING count(1)>1
                           )b
                        ON a.ID_LMS =b.ID_LMS QUALIFY ROW_NUMBER() OVER (PARTITION BY a.ID_LMS ORDER BY CASE WHEN a.ISSALE= 1 THEN 1 WHEN a.ISTRANSFER=1 THEN 2 WHEN a.ISQUOTE=1 THEN 3 ELSE 4 END DESC, a.LEADCREATED DESC)=1
                     UNION SELECT a.ID
                      FROM {{ ref('EDW','DS_MKT_CAMPAIGN2SALES') }} a
                     INNER JOIN(
                            SELECT INTERACTIONIDKEY
                              FROM {{ ref('EDW','DS_MKT_CAMPAIGN2SALES') }}
                             WHERE INTERACTIONIDKEY IS NOT NULL
                             GROUP BY INTERACTIONIDKEY
                            HAVING count(1)>1
                           )b
                        ON a.INTERACTIONIDKEY =b.INTERACTIONIDKEY QUALIFY ROW_NUMBER() OVER (PARTITION BY a.INTERACTIONIDKEY ORDER BY CASE WHEN a.ISSALE= 1 THEN 1 WHEN a.ISTRANSFER=1 THEN 2 WHEN a.ISQUOTE=1 THEN 3 WHEN a.LEADID IS NOT NULL THEN 4 ELSE 5 END DESC, a.LEADCREATED DESC)=1
                   )ds_mkt_campaign2sales_delete
                ON ds_mkt_campaign2sales.id = ds_mkt_campaign2sales_delete.id
        name: SRC_bvstg_mkt_au2_campaign2sales_2_removeid
