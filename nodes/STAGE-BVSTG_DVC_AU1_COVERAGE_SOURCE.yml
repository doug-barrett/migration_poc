        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','S_AP1_POLICYVERSION_MROC') }} s_ap1_policyversion_mroc
             INNER JOIN {{ ref('STAGE','BVSTG_DVC_POLICY_REFRESH') }} bvstg_dvc_policy_refresh
                ON bvstg_dvc_policy_refresh.PolicyID = s_ap1_policyversion_mroc.PolicyID
               AND bvstg_dvc_policy_refresh.SourceDB = 'AppOne'
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_POLICYVEHICLE_MROC') }} s_ap1_policyvehicle_mroc
                ON s_ap1_policyvehicle_mroc.PolicyVersionID=s_ap1_policyversion_mroc.PolicyVersionID
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_POLICYVEHICLECOVERAGE_MROC') }} s_ap1_policyvehiclecoverage_mroc
                ON s_ap1_policyvehiclecoverage_mroc.PolicyVehicleID=s_ap1_policyvehicle_mroc.PolicyVehicleID
             INNER JOIN {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }} v_s_ap1_mastercoveragetype_mroc_current
                ON s_ap1_policyvehiclecoverage_mroc.MasterCoverageTypeID = v_s_ap1_mastercoveragetype_mroc_current.MasterCoverageTypeID
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_MASTERCOVERAGELIMIT_MROC_CURRENT v_s_ap1_mastercoveragelimit_mroc_current
                ON s_ap1_policyvehiclecoverage_mroc.MasterCoverageLimitID = v_s_ap1_mastercoveragelimit_mroc_current.MasterCoverageLimitID
             WHERE 1=1 --s_ap1_policyversion_mroc.created >= '2019-01-01'  QUALIFY ROW_NUMBER() OVER (                PARTITION BY s_ap1_policyvehiclecoverage_mroc.policyvehiclecoverageid,           s_ap1_policyversion_mroc.policyversionid                 ORDER BY s_ap1_policyvehiclecoverage_mroc.dss_version desc,           s_ap1_policyversion_mroc.dss_version desc                ) = 1
