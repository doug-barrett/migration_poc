          - locationName: STAGE
            nodeName: BVSTG_DVC_POLICY_REFRESH
        join:
          joinCondition: |-
            FROM (
                    SELECT A.cdtpolicyID
                      FROM {{ ref('DATA_VAULT','H_CDTPOLICY') }} A
                     INNER JOIN {{ ref('DATA_VAULT','S_AP1_CDTPOLICY') }} B
                        ON A.HK_H_CDTPOLICY = B.HK_H_CDTPOLICY QUALIFY ROW_NUMBER() OVER (PARTITION BY B.PolicyID ORDER BY A.cdtpolicyID DESC) = 1
                   ) cdtpolicy
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_CDTPOLICYVEHICLE') }} s_ap1_cdtpolicyvehicle
                ON s_ap1_cdtpolicyvehicle.cdtpolicyID = cdtpolicy.cdtpolicyID
             INNER JOIN {{ ref('DATA_VAULT','H_CDTPOLICYVEHICLE') }} h_cdtpolicyvehicle
                ON h_cdtpolicyvehicle.hk_h_cdtpolicyvehicle = s_ap1_cdtpolicyvehicle.hk_h_cdtpolicyvehicle
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_CDTPOLICYVEHICLECOVERAGE') }} s_ap1_cdtpolicyvehiclecoverage
                ON s_ap1_cdtpolicyvehiclecoverage.cdtpolicyvehicleid = h_cdtpolicyvehicle.cdtpolicyvehicleid
             INNER JOIN {{ ref('DATA_VAULT','H_CDTPOLICYVEHICLECOVERAGE') }} h_cdtpolicyvehiclecoverage
                ON h_cdtpolicyvehiclecoverage.hk_h_cdtpolicyvehiclecoverage = s_ap1_cdtpolicyvehiclecoverage.hk_h_cdtpolicyvehiclecoverage
              LEFT JOIN {{ ref('STAGE','V_S_AP1_MASTERCOVERAGETYPE_MROC_CURRENT') }} v_s_ap1_mastercoveragetype_mroc_current
                ON v_s_ap1_mastercoveragetype_mroc_current.MasterCoverageTypeID = s_ap1_cdtpolicyvehiclecoverage.MasterCoverageTypeID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_MASTERCOVERAGELIMIT_MROC_CURRENT v_s_ap1_mastercoveragelimit_mroc_current
                ON v_s_ap1_mastercoveragelimit_mroc_current.MasterCoverageLimitID = s_ap1_cdtpolicyvehiclecoverage.MasterCoverageLimitID
             INNER JOIN {{ ref('DATA_VAULT','H_CDTPOLICY') }} h_cdtpolicy
                ON s_ap1_cdtpolicyvehicle.cdtpolicyID = h_cdtpolicy.cdtpolicyID
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_CDTPOLICY') }} s_ap1_cdtpolicy
                ON h_cdtpolicy.HK_H_CDTPOLICY = s_ap1_cdtpolicy.HK_H_CDTPOLICY
             INNER JOIN {{ ref('STAGE','BVSTG_DVC_POLICY_REFRESH') }} bvstg_dvc_policy_refresh
                ON bvstg_dvc_policy_refresh.PolicyID = s_ap1_cdtpolicy.PolicyID
               AND bvstg_dvc_policy_refresh.SourceDB = 'CDT'
             WHERE 1 = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY h_cdtpolicy.cdtpolicyID, s_ap1_cdtpolicyvehiclecoverage.hk_h_cdtpolicyvehiclecoverage, s_ap1_cdtpolicy.ENDORSEMENTEFFECTIVEDATE ORDER BY s_ap1_cdtpolicy.dss_version DESC, s_ap1_cdtpolicyvehicle.dss_version DESC, s_ap1_cdtpolicy.ENDORSEMENTEFFECTIVEDATE) = 1
