        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_MKT_AU0_CALL_CUSTOMER') }} bvstg_mkt_au0_call_customer
             INNER JOIN (
                    SELECT CustomerID,
                           Phone,
                           'AppOne' SourceDB
                      FROM {{ ref('STAGE','BVSTG_PHONE_CUSTOMER_CURRENT') }}
                     UNION SELECT CustomerID,
                           Phone,
                           SourceDB
                      FROM {{ ref('EDW','DS_PHONE_CUSTOMER') }}
                     WHERE SourceDB !='AppOne'
                   ) ds_phone_customer
                ON RIGHT(CASE WHEN bvstg_mkt_au0_call_customer.direction = 2 THEN bvstg_mkt_au0_call_customer.digitsdialed ELSE bvstg_mkt_au0_call_customer.remotenumbercallid END,10) = ds_phone_customer.Phone
             INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} ds_customersummary_v2
                ON ds_customersummary_v2.CustomerID = ds_phone_customer.CustomerID
               AND ds_customersummary_v2.SourceDB = ds_phone_customer.SourceDB
              LEFT JOIN {{ ref('EDW','DS_MKT_CALLSOURCE') }} ds_mkt_callsource
                ON (ds_mkt_callsource.interactionidkey = bvstg_mkt_au0_call_customer.interactionidkey)/*  WHERE bvstg_mkt_au0_call_customer.SourceDB ='CUCM'  */ QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_mkt_au0_call_customer.interactionidkey , ds_phone_customer.CustomerID , ds_phone_customer.SourceDB ORDER BY bvstg_mkt_au0_call_customer.startdatetime DESC)=1
