          - locationName: STAGE
            nodeName: BVSTG_AU14_CSPR
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT bvstg_au14_cspr.ud2id,
                           bvstg_au14_cspr.ud2id_description,
                           bvstg_au14_cspr.Name,
                           ifnull(bvstg_au14_cspr.officecodes, bvstg_au14_cspr_1.OFFICECODE_SIMILARNAME) officecodes_mapped,
                           CASE WHEN ds_retail_office.active_office IS NOT NULL                                                                       THEN ds_retail_office.active_office
                                WHEN (ifnull(bvstg_au14_cspr.officecodes, bvstg_au14_cspr_1.OFFICECODE_SIMILARNAME)) = ds_retail_office.active_office THEN ifnull(bvstg_au14_cspr.officecodes, bvstg_au14_cspr_1.OFFICECODE_SIMILARNAME)
                                WHEN ds_retail_office.active_office IS NULL                                                                           THEN ifnull(bvstg_au14_cspr.officecodes, bvstg_au14_cspr_1.OFFICECODE_SIMILARNAME)
                                ELSE ds_retail_office.active_office
                                 END Officce_Code_Final
                      FROM {{ ref('STAGE','BVSTG_AU14_CSPR') }} BVSTG_AU14_CSPR
                      LEFT JOIN (
                            SELECT DISTINCT bvstg_au14_cspr.*,
                                   officecode Officecode_SimilarName,
                                   officename
                              FROM {{ ref('STAGE','BVSTG_AU14_CSPR') }} BVSTG_AU14_CSPR
                              LEFT JOIN (
                                    SELECT DISTINCT OFFICENAME,
                                           OFFICECODE
                                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                                     WHERE OFFICENAME IN (
                                            SELECT OFFICENAME
                                              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                                             GROUP BY OFFICENAME
                                            HAVING count(*)=1
                                           )
                                   ) DS_RETAIL_OFFICE
                                ON (((contains(lower(ud2id_description), lower(DS_RETAIL_OFFICE.Officename)) OR contains(lower(DS_RETAIL_OFFICE.Officename),lower(ud2id_description))) = 'TRUE') AND ud2id_description IS NOT NULL AND len(ud2id_description) > 1 AND ud2id IN (SELECT ud2id FROM {{ ref('STAGE','BVSTG_AU14_CSPR') }} LEFT JOIN (SELECT OFFICENAME,OFFICECODE FROM {{ ref('EDW','DS_RETAIL_OFFICE') }} WHERE OFFICENAME IN (SELECT OFFICENAME FROM {{ ref('EDW','DS_RETAIL_OFFICE') }} GROUP BY OFFICENAME HAVING count(*)=1)) DS_RETAIL_OFFICE ON (((contains(lower(ud2id_description), lower(DS_RETAIL_OFFICE.Officename)) OR contains(lower(DS_RETAIL_OFFICE.Officename),lower(ud2id_description)))='TRUE') AND ud2id_description IS NOT NULL AND len(ud2id_description) > 1) GROUP BY ud2id HAVING count(DISTINCT officecode) = 1))
                           ) bvstg_au14_cspr_1
                        ON bvstg_au14_cspr.ud2id = bvstg_au14_cspr_1.ud2id
                      LEFT JOIN (
                            SELECT DISTINCT officecode,
                                   active_officerelatedtoofficestatusdetails active_office
                              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }} QUALIFY row_number() OVER (PARTITION BY corporateofficenumber ORDER BY isactive DESC,ifnull(officecloseddate,'2050-12-31') DESC, officeopeneddate DESC) = 1
                           ) DS_RETAIL_OFFICE
                        ON ifnull(lower(bvstg_au14_cspr.OFFICECODES),'-') = ifnull(lower(ds_retail_office.OFFICECODE),'-')
                   ) AS bvstg_au14_cspr
