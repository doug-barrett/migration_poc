        join:
          joinCondition: |-
            EXTENDED
              FROM ((SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('NSA') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('SPLC') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('Missing/Total') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END))) V_PRED_MONTHS -------------------------------------------------------------------------Financial Flexibility and Grow(Ancillary Revenue),Operational Excellence(Marketing Expense)  -------------------- Retail Sales  left join   (select A.asofmonth,(case when lower(DS_RETAIL_OFFICE.channel)='splc' then 'SPLC'  when lower(DS_RETAIL_OFFICE.channel) in ('cigh','appone','nsa','dnsa') then 'NSA'  else 'Missing/Total' end) PolicySource_Dimension,sum(A.Retail_sales) Retail_sales  from  (( select distinct ud2id,  monthyear asofmonth,  sum(ifnull(values_month,0)) as Retail_sales  from {{ ref('STAGE','BVSTG_AU15_CONFIE_OPM') }}  where sg_description= 'Retail_Sales'  group by asofmonth,ud2id) A  left join (select * from {{ ref('STAGE','BVSTG_AU19_CSPR') }}  qualify row_number() over (partition by ud2id order by officecodes_mapped) = 1  )  OS_RETAIL_OFFICECODE_MAPPING  on A.ud2id=OS_RETAIL_OFFICECODE_MAPPING.ud2id  left join  "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" DS_RETAIL_OFFICE  on ifnull(OS_RETAIL_OFFICECODE_MAPPING.officecodes_mapped,'-')=ifnull(DS_RETAIL_OFFICE.OFFICECODE,'-'))  group by  A.asofmonth,PolicySource_Dimension  ) BVSTG_AU15_CONFIE_OPM  on V_PRED_MONTHS.asofmonth = BVSTG_AU15_CONFIE_OPM.asofmonth and V_PRED_MONTHS.PolicySource_Dimension = BVSTG_AU15_CONFIE_OPM.PolicySource_Dimension      --------------------Opreating Expenses, Retail EBITDA, EBITDA Margin, Revenue per Policy, Opreating Expenses per Policy, EBITDA per Policy,Retail Compensation Expense  left join  (select  asofmonth,(case when lower(channel)='splc' then 'SPLC'  when lower(channel) in ('cigh','appone','nsa','dnsa') then 'NSA'  else 'Missing/Total' end) PolicySource_Dimension,  to_number((sum(ifnull(ANCILLARY_INCOME,0))+sum(ifnull(FEE_INCOME,0))+sum(ifnull(COMMISSIONS,0))+sum(ifnull(INTEREST_INCOME,0))+  sum(ifnull(FRANCHISE_REVENUE,0))+sum(ifnull(OTHER_REVENUE,0))+sum(ifnull(PREMIUM_FINANCE_REVENUE,0))), 20, 4) as revenue,  to_number(sum(COMPENSATION),20, 2) as retail_compensation_expense,  to_number(sum(ANCILLARY_INCOME),20, 2) as ancillary_revenue,  to_number(sum(ADVERTISING), 20, 2) as marketing_expenses  from {{ ref('EDW','DS_CSPR') }}  group by asofmonth,PolicySource_Dimension  ) DS_CSPR  on V_PRED_MONTHS.asofmonth = DS_CSPR.asofmonth and V_PRED_MONTHS.PolicySource_Dimension = DS_CSPR.PolicySource_Dimension      left join  (select asofmonth,PolicySource_Dimension,sum(Total_Operating_Expense) Total_Operating_Expense  from  (select A.monthyear asofmonth,sum(A.Total_Operating_Expense) Total_Operating_Expense,  (case when lower(DS_RETAIL_OFFICE.channel)='splc' then 'SPLC'  when lower(DS_RETAIL_OFFICE.channel) in ('cigh','appone','nsa','dnsa') then 'NSA'  else 'Missing/Total' end)
        name: BVSTG_AU35_CONFIE_OPM
        noLinkRefs: []
