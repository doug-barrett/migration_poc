      join:
        joinCondition: 'FROM {{ ref(''BRONZE'', ''DS_DCONT'') }} ds_dcont

          LEFT JOIN {{ ref(''BRONZE'', ''DS_DRISK'') }} ds_drisk ON ds_dcont.DDIFF_DIS_POL_NUM = ds_drisk.DIS_POL_NUM /* Detail Outer Join */

          INNER JOIN {{ ref(''BRONZE'', ''DW_CONTRACT'') }} dw_contract ON ds_dcont.DCONT_DDIFF_DIS_POL_NUM = dw_contract.CONTRACT_ID

          LEFT JOIN {{ ref(''BRONZE'', ''YD_DEIREF'') }} yd_deiref ON yd_deiref.EI_ID = ds_dcont.EI_ID AND yd_deiref.EI_TY = ds_dcont.EI_TY

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PARTY'') }} dw_party ON dw_party.PARTY_ID = ds_dcont.BI_ID

          LEFT JOIN {{ ref(''BRONZE'', ''DW_OCUPTN_CLASS'') }} dw_ocuptn_class ON dw_ocuptn_class.CODE = ds_dcont.OCUPTN_CLASS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''SMOKER_STATUS_CONVERT'') }} smoker_status_convert ON smoker_status_convert.SOURCE_SYSTEM_CODE = ds_dcont.SMOKER_IND

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_WAITING_PERIOD'') }} risk_waiting_period ON risk_waiting_period.CODE = ds_dcont.RISK_WAIT_PERIOD_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''FREQ'') }} freq ON freq.SOURCE_SYSTEM_CODE = ds_dcont.PAYT_FREQ

          LEFT JOIN {{ ref(''BRONZE'', ''DW_STATE'') }} dw_state ON dw_state.CODE = ds_dcont.STATE_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT_OPTION'') }} dw_product_option ON dw_product_option.PRODUCT_KEY = ds_dcont.PRODUCT_KEY

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC'') }} risk_disc ON risk_disc.CONTRACT_RISK_KEY = ds_dcont.CONTRACT_RISK_KEY AND risk_disc.DISC_TYPE_CODE = ds_dcont.DISC_TYPE_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC_EXPIRY_DATE'') }} risk_disc_expiry_date ON risk_disc_expiry_date.CONTRACT_RISK_KEY = ds_dcont.CONTRACT_RISK_KEY

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC1'') }} risk_disc1 ON risk_disc1.CONTRACT_RISK_KEY = ds_dcont.CONTRACT_RISK_KEY AND risk_disc1.DISC_TYPE_CODE = ds_dcont.DISC_TYPE_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''CLAM'') }} clam ON clam.DIS_POL_NUM = ds_dcont.DIS_POL_NUM'
