      join:
        joinCondition: 'FROM {{ ref(''BRONZE'', ''DS_DCONT'') }} ds_dcont

          LEFT JOIN {{ ref(''BRONZE'', ''DS_DPREM'') }} ds_dprem ON ds_dcont.DCONT_DIS_POL_NUM = ds_dprem.DIS_POL_NUM /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''DS_DRISK'') }} ds_drisk ON ds_dcont.DDIFF_DIS_POL_NUM = ds_drisk.DIS_POL_NUM /* Detail Outer Join */

          INNER JOIN {{ ref(''BRONZE'', ''DW_CONTRACT'') }} dw_contract ON ds_dcont.DCONT_DDIFF_DIS_POL_NUM = dw_contract.CONTRACT_ID

          LEFT JOIN {{ ref(''BRONZE'', ''MRV_IICS_MT_DS_DRISK_DW_CONTRACT_RISK_V'') }} mrv_iics_mt_ds_drisk_dw_contract_risk_v ON ds_dcont.DIS_POL_NUM = mrv_iics_mt_ds_drisk_dw_contract_risk_v.CONTRACT_ID /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''INTERFACE_LOG'') }} interface_log ON /* MANUAL REVIEW: no Joiner key in export for this source (wired via expression lookup, or unused) */ 1=1

          LEFT JOIN {{ ref(''BRONZE'', ''YD_DEIREF'') }} lkp_yd_deiref ON lkp_yd_deiref.EI_ID = (''00''||RPAD(ds_dcont.drisk_LI_CLIENT_KEY,14,''0'')) AND lkp_yd_deiref.EI_TY = ''DIS''

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PARTY'') }} lkp_dw_party ON lkp_dw_party.PARTY_ID = (lkp_yd_deiref.BI_ID)

          LEFT JOIN {{ ref(''BRONZE'', ''DW_OCUPTN_CLASS'') }} lkp_dw_ocuptn_class ON lkp_dw_ocuptn_class.CODE = ''DS-''||ds_dcont.drisk_OCCUP_GROUP

          LEFT JOIN {{ ref(''BRONZE'', ''SMOKER_STATUS_CONVERT'') }} lkp_smoker_status_convert ON lkp_smoker_status_convert.SOURCE_SYSTEM_CODE = ds_dcont.drisk_SMOKER_IND

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_WAITING_PERIOD'') }} lkp_risk_waiting_period ON lkp_risk_waiting_period.CODE = ds_dcont.drisk_wait_perd

          LEFT JOIN {{ ref(''BRONZE'', ''FREQ'') }} lkp_freq ON lkp_freq.SOURCE_SYSTEM_CODE = ds_dcont.drisk_dcont_PAYT_FREQ

          LEFT JOIN {{ ref(''BRONZE'', ''DW_STATE'') }} lkp_dw_state ON lkp_dw_state.CODE = ds_dcont.drisk_sduty_state_code

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT_OPTION'') }} lkp_dw_product_option ON lkp_dw_product_option.PRODUCT_KEY = ds_dcont.PRODUCT_KEY

          LEFT JOIN {{ ref(''BRONZE'', ''CLAM'') }} lkp_clam ON lkp_clam.DIS_POL_NUM = ds_dcont.drisk_dcont_ddiff_DIS_POL_NUM

          LEFT JOIN {{ ref(''BRONZE'', ''DW_OCUPTN_CLASS'') }} lkp_dw_ocuptn_class_2 ON lkp_dw_ocuptn_class_2.CODE = ''DS-''||ds_dcont.occup_group

          LEFT JOIN {{ ref(''BRONZE'', ''SMOKER_STATUS_CONVERT'') }} lkp_smoker_status_convert_2 ON lkp_smoker_status_convert_2.SOURCE_SYSTEM_CODE = ds_dcont.smoker_ind

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_WAITING_PERIOD'') }} lkp_risk_waiting_period_2 ON lkp_risk_waiting_period_2.CODE = ds_dcont.wait_perd

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC'') }} lkp_risk_disc ON lkp_risk_disc.CONTRACT_RISK_KEY = ds_dcont.tgt_contract_risk_key AND lkp_risk_disc.DISC_TYPE_CODE = ''CONTSIZE''

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC'') }} lkp_risk_disc_2 ON lkp_risk_disc_2.CONTRACT_RISK_KEY = ds_dcont.tgt_contract_risk_key AND lkp_risk_disc_2.DISC_TYPE_CODE = ''PERM''

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC'') }} lkp_risk_disc_3 ON lkp_risk_disc_3.CONTRACT_RISK_KEY = ds_dcont.tgt_contract_risk_key AND lkp_risk_disc_3.DISC_TYPE_CODE = ''TEMP''

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC_EXPIRY_DATE'') }} lkp_risk_disc_expiry_date ON lkp_risk_disc_expiry_date.CONTRACT_RISK_KEY = ds_dcont.tgt_contract_risk_key

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC'') }} lkp_risk_disc_4 ON lkp_risk_disc_4.CONTRACT_RISK_KEY = ds_dcont.tgt_contract_risk_key AND lkp_risk_disc_4.DISC_TYPE_CODE = ''ONHLD''

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC'') }} lkp_risk_disc_5 ON lkp_risk_disc_5.CONTRACT_RISK_KEY = ds_dcont.tgt_contract_risk_key AND lkp_risk_disc_5.DISC_TYPE_CODE = ''INDMNTY''

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC'') }} lkp_risk_disc_6 ON lkp_risk_disc_6.CONTRACT_RISK_KEY = ds_dcont.tgt_contract_risk_key AND lkp_risk_disc_6.DISC_TYPE_CODE = ''AIDSEXCL''

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_DISC1'') }} lkp_risk_disc1 ON lkp_risk_disc1.CONTRACT_RISK_KEY = ds_dcont.o_contract_risk_key AND lkp_risk_disc1.DISC_TYPE_CODE = ''CONTSIZE'''
