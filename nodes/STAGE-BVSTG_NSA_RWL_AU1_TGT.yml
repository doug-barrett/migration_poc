            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_AU0_BSL
        join:
          joinCondition: |-
            FROM(
                    WITH NEXT_TRANSACTION AS (
                            SELECT B.TRANSACTIONID,
                                   B.CUSTOMERID,
                                   A.CLASSIFICATIONGROUP,
                                   1 AS COUNTER,
                                   ROW_NUMBER() OVER(PARTITION BY A.CUSTOMERID ORDER BY A.CREATEDDATE ASC) AS NEXT_TRANSACTION
                              FROM (
                                    SELECT DISTINCT TRANSACTIONID,
                                           NBTRANSACTIONID,
                                           CUSTOMERID,
                                           DATE(CREATEDDATE) AS CREATEDDATE,
                                           CLASSIFICATIONGROUP,
                                           1 AS COUNTER
                                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                                     WHERE 1=1
                                       AND CLASSIFICATION = 'Carrier Premium'
                                       AND LINEOFBUSINESSTYPE = 'Auto'
                                       AND SOURCEDB = 'AppOne'
                                       AND CLASSIFICATIONGROUP IN ('New Business','Renewal')
                                   ) A
                             INNER JOIN (
                                    SELECT *
                                      FROM {{ ref('STAGE','BVSTG_NSA_RWL_AU0_BSL') }}
                                   ) B
                                ON (A.CUSTOMERID = B.CUSTOMERID AND DATE(A.CREATEDDATE) > B.STARTDATE)
                           ) ,
                           GROUPING_DATE AS (
                            SELECT TRANSACTIONID,
                                   CUSTOMERID ,
                                   CASE WHEN SUM(COUNTER) >= 1 THEN 1
                                        ELSE 0
                                         END AS STATUS_TARGET_INSERTED_DATE ,
                                   MAX(CASE WHEN NEXT_TRANSACTION = 1 THEN CLASSIFICATIONGROUP ELSE NULL END) AS NEXT_TRANSACTION_INSERTED_DATE
                              FROM NEXT_TRANSACTION
                             GROUP BY TRANSACTIONID,
                                      CUSTOMERID
                           ) SELECT *
                      FROM GROUPING_DATE
                   ) bvstg_nsa_rwl_au1_tgt
        name: BVSTG_NSA_RWL_AU1_TGT
