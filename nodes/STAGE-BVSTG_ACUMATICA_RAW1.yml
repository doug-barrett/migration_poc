             INNER JOIN {{ ref('STAGE','V_API_ACUMATICA_REVENUEDESCRIPTION') }} v_api_acumatica_revenuedescription
                ON v_api_acumatica_revenuedescription.RevenueDescriptionID = bvstg_au2_acumatica.RevenueDescriptionID
             INNER JOIN {{ ref('STAGE','V_API_ACUMATICA_ACCOUNT') }} v_api_acumatica_account
                ON v_api_acumatica_account.RevenueDescriptionID = bvstg_au2_acumatica.RevenueDescriptionID
               AND v_api_acumatica_account.isActive=1
               AND v_api_acumatica_account.isVoid = bvstg_au2_acumatica.isVoid
               AND LOWER(v_api_acumatica_account.Type) not like '%fix%'
             WHERE bvstg_au2_acumatica.RevenueDescriptionID IS NOT NULL
