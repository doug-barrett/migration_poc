            EXTENDED
              FROM ( SELECT LEFT(CASE WHEN LOWER(i.Email) IN ('na.na@gmail.com', 'na@gmail.com', 'noemail@gmail.com', 'noemail@na.com', 'na@na.com') THEN LOWER(REGEXP_REPLACE((i.id || substring(i.Name, 1, NULLIF(CHARINDEX(' ', i.Name) - 1, - 1)) || substring(i.Name, CHARINDEX(' ', i.Name) + 1, len(i.Name)) || '@noemail.com'), ' ')) WHEN LOWER(i.Email) NOT LIKE '%@%' THEN LOWER(REGEXP_REPLACE((i.id || substring(i.Name, 1, NULLIF(CHARINDEX(' ', i.Name) - 1, - 1)) || substring(i.Name, CHARINDEX(' ', i.Name) + 1, len(i.Name)) || '@noemail.com'), ' ')) ELSE LOWER(i.Email) END, 100) AS Email ,
                   a.InsuredID AS LeadID ,
                   a.CustomerID ,
                   a.polid AS SaleID ,
                   a.EnteredDate AS SaleDate ,
                   DATEDIFF(SECOND, TO_TIMESTAMP('1970-01-01'), TO_TIMESTAMP(i.lastmodifieddate)) * 1000 AS Lead_Created_Date ,
                   DATEDIFF(SECOND, TO_TIMESTAMP('1970-01-01'), TO_TIMESTAMP(a.EnteredDate)) * 1000 AS CloseDate ,
                   a.polno AS PolicyNumber ,
                   CASE WHEN DATEDIFF(DAY, b.inception, b.expiration) BETWEEN 27 AND 32   THEN '1 Month'
                        WHEN DATEDIFF(DAY, b.inception, b.expiration) BETWEEN 55 AND 65   THEN '2 Months'
                        WHEN DATEDIFF(DAY, b.inception, b.expiration) BETWEEN 85 AND 95   THEN '3 Months'
                        WHEN DATEDIFF(DAY, b.inception, b.expiration) BETWEEN 175 AND 185 THEN '6 Months'
                        WHEN DATEDIFF(DAY, b.inception, b.expiration) BETWEEN 360 AND 367 THEN '1 Year'
                        WHEN DATEDIFF(DAY, b.inception, b.expiration) BETWEEN 368 AND 715 THEN '2 Years'
                        ELSE b.coveragetype
                         END Policy_Term ,
                   CASE WHEN a.poltypelob = 'Private Passenger Auto' THEN 'Auto'
                        ELSE a.poltypelob
                         END AS Line_Of_Business ,
                   a.carriername AS Carrier_Name ,
                   CASE WHEN split_part(accountnumber, '-', 1) IN ('LA', 'AL') THEN 'USAgencies'
                        ELSE 'Freeway'
                         END AS Organization_Agency ,
                   CASE WHEN a.poltypelob = 'Private Passenger Auto' THEN 'Auto'
                        ELSE a.poltypelob
                         END || '-' || a.polno AS DealName ,
                   CASE WHEN a.poltypelob = 'Private Passenger Auto' THEN 'Auto'
                        ELSE a.poltypelob
                         END || '-' || a.SHORTPOLNO AS RawDealName ,
                   CASE WHEN CURSTATUSCODE IN ('1', '4') THEN 'closedwon'
