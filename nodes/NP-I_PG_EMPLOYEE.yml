        config: {}
        dataType: VARCHAR(60)
        defaultValue: ""
        description: 'This is a way to group our employees into a hierarchy, possible values are:   Directors, ELT (Executive Leadership Team), SMT (Senior Management Team), Manager, Employee.'
        name: MANAGEMENTLEVEL
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 39a7f726-964b-4027-8339-4508317dc1bb
                stepCounter: e65d00f1-4487-4c70-a252-6eb1343a94bc
            transform: -- THE DIRECTORS ARE AN INDEPENDENT MANAGEMENT LEVEL  -- THE CE IS PART OF THE ELT    -- THOSE REPORTING TO THE CE ARE ALSO IN THE ELT, WITH THE EXCEPTION OF ANY PEA - PERSONNAL EXECUTIVE ASSITANTS  -- THOSE REPORTING TO THE ELT (BUT NOT THOSE IN THE ELT REPORTING TO THE CE)  -- ARE PART OF THE SMT   -- ANYONE ELSE WITH DIRECT REPORTS IS A MANGER  -- THE REMAINDER HAVE NO DIRECT REPROTS    CASE -- EXCLUDE TEMINATED EMPLOYEES       WHEN I_PG_EMPLOYEEPRE.TERMINATED != 0 THEN 'TERMINATED'       -- THE DIRECTORS ARE AN INDEPENDANT LEVEL       WHEN I_PG_POSITION.POSITIONGROUPINGCODE = 'PDT' THEN 'DIRECTOR'       -- THE CE IS PART OF THE ELT       WHEN I_PG_EMPLOYEEPRE.EMPLOYEECODE = CHIEFEXECUTIVE.EMPLOYEECODE THEN 'ELT'       -- EXECUTIVE ASSISTANTS ARE NOT PART OF THE ELT       WHEN I_PG_EMPLOYEEPRE.POSITIONCODE = 'EA' THEN 'EMPLOYEE'       -- ANYONE REPORTING TO THE CE IS PART OF THE ELT EXCLUDE WHEN ELT LEVEL HAS OPEN POSITION       WHEN I_PG_EMPLOYEEPRE.MANAGERCODE = CHIEFEXECUTIVE.EMPLOYEECODE AND ISNULL(I_PEOPLEBOARDDATA.MANAGERNAME, '') <> 'OPEN POSITION'  THEN 'ELT'       -- THE REMAINING LEVELS ARE DERIVED FROM THE POSITION OF THE DIRECT MANAGER       WHEN MANAGER.MANAGEMENTLEVEL = 'ELT' THEN 'SMT'       -- ANYONE ELSE WITH ANY DIRECT REPORTS IS A MANAGER       WHEN DIRECTREPORTS.MANAGERCODE IS NOT NULL THEN 'MANAGER'       -- OTHERWISE       ELSE 'EMPLOYEE'  END
