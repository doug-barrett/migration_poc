    sourceMapping:
      - aliases:
          L_SHP_LOCATIONADDRESSDETAIL: 49422c0c-1116-4f9c-ba65-556d19f44183
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: NP
            nodeName: I_PG_EMPLOYEEPRE
          - locationName: NP
            nodeName: L_SHP_LOCATIONADDRESSDETAIL
        join:
          joinCondition: |-
            EXTENDEDFROM I_PG_EMPLOYEEPRE
              LEFT OUTER JOIN I_PG_POSITION
                ON I_PG_EMPLOYEEPRE.POSITIONCODE = I_PG_POSITION.POSITIONCODE
               AND I_PG_EMPLOYEEPRE.ODSSOURCESYSTEMNAME = I_PG_POSITION.ODSSOURCESYSTEMNAME --LEFT OUTER JOIN I_PG_RECOVERYRATES  -- ON LEFT(I_PG_POSITION.XJOBFUNCTION,2) = I_PG_RECOVERYRATES.JOBFUNCTION  -- AND I_PG_EMPLOYEEPRE.COSTCENTRECODE LIKE I_PG_RECOVERYRATES.COSTCENTRE  LEFT OUTER JOIN I_PG_EMPLOYEETOMANAGER  ON I_PG_EMPLOYEEPRE.EMPLOYEECODE = I_PG_EMPLOYEETOMANAGER.EMPLOYEECODE  LEFT OUTER JOIN L_PG_LOCATION  ON I_PG_EMPLOYEEPRE.LOCATIONCODE = L_PG_LOCATION.LOCATIONCODE  LEFT OUTER JOIN {{ ref('NP','L_SHP_LOCATIONADDRESSDETAIL') }} L_SHP_LOCATIONADDRESSDETAIL  ON L_PG_LOCATION.LOCATIONCODE = L_SHP_LOCATIONADDRESSDETAIL.LOCATIONCODE  LEFT OUTER JOIN L_REF_ADACCTS  ON I_PG_EMPLOYEEPRE.EMPLOYEECODE = L_REF_ADACCTS.EMPLOYEEID  LEFT OUTER JOIN I_PG_EMPLOYEESTATUS  ON I_PG_EMPLOYEEPRE.EMPLOYEESTATUSCODE = I_PG_EMPLOYEESTATUS.EMPLOYEESTATUSCODE  AND I_PG_EMPLOYEEPRE.ODSSOURCESYSTEMNAME = I_PG_EMPLOYEESTATUS.ODSSOURCESYSTEMNAME  LEFT OUTER JOIN I_PG_PAYPERIOD  ON I_PG_EMPLOYEEPRE.PAYPERIODCODE = I_PG_PAYPERIOD.PAYPERIODCODE  AND I_PG_EMPLOYEEPRE.ODSSOURCESYSTEMNAME = I_PG_PAYPERIOD.ODSSOURCESYSTEMNAME  LEFT OUTER JOIN L_PG_AWARD  ON I_PG_EMPLOYEEPRE.AWARDCODE = L_PG_AWARD.AWARDCODE  LEFT OUTER JOIN L_PG_ALTABLE  ON I_PG_EMPLOYEEPRE.ALTABLECODE = L_PG_ALTABLE.ALTABLECODE      --FIND JDE COST CENTRE IF STILL USING OLD F1 COST CENTRE  --LEFT OUTER JOIN I_JDE_COSTCENTRE_MAP F1 ON I_PG_EMPLOYEEPRE.COSTCENTRECODE = F1.F1COSTCENTRE   --LEFT OUTER JOIN L_REF_JDEMAPF1COSTCENTRE F1 ON I_PG_EMPLOYEEPRE.COSTCENTRECODE = F1.F1_CC_CODE     --FIND F1 COST CENTRE IF CONVERTED TO JDE COST CENTRE  --LEFT OUTER JOIN I_JDE_COSTCENTRE_MAP JDE ON I_PG_EMPLOYEEPRE.COSTCENTRECODE = JDE.JDECOSTCENTRE     --LEFT OUTER JOIN I_DEPARTMENT ON ISNULL(JDE.F1COSTCENTRE,I_PG_EMPLOYEEPRE.COSTCENTRECODE) = I_DEPARTMENT.COSTCENTRE    LEFT OUTER JOIN I_JDE_BUSINESSUNITMASTER  --  ON ISNULL(F1.JDECOSTCENTRE,I_PG_EMPLOYEEPRE.COSTCENTRECODE)    ON I_PG_EMPLOYEEPRE.COSTCENTRECODE    --CORPORATE AND NETWOR