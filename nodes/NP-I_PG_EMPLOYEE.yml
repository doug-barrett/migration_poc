        dependencies:
          - locationName: NP
            nodeName: I_PG_EMPLOYEEPRE
          - locationName: NP
            nodeName: L_SHP_LOCATIONADDRESSDETAIL
        join:
          joinCondition: |-
            EXTENDEDFROM I_PG_EMPLOYEEPRE
              LEFT OUTER JOIN I_PG_POSITION
                ON I_PG_EMPLOYEEPRE.POSITIONCODE = I_PG_POSITION.POSITIONCODE
               AND I_PG_EMPLOYEEPRE.ODSSOURCESYSTEMNAME = I_PG_POSITION.ODSSOURCESYSTEMNAME --LEFT OUTER JOIN I_PG_RECOVERYRATES  -- ON LEFT(I_PG_POSITION.XJOBFUNCTION,2) = I_PG_RECOVERYRATES.JOBFUNCTION  -- AND I_PG_EMPLOYEEPRE.COSTCENTRECODE LIKE I_PG_RECOVERYRATES.COSTCENTRE  LEFT OUTER JOIN I_PG_EMPLOYEETOMANAGER  ON I_PG_EMPLOYEEPRE.EMPLOYEECODE = I_PG_EMPLOYEETOMANAGER.EMPLOYEECODE  LEFT OUTER JOIN L_PG_LOCATION  ON I_PG_EMPLOYEEPRE.LOCATIONCODE = L_PG_LOCATION.LOCATIONCODE  LEFT OUTER JOIN {{ ref('NP','L_SHP_LOCATIONADDRESSDETAIL') }} L_SHP_LOCATIONADDRESSDETAIL  ON L_PG_LOCATION.LOCATIONCODE = L_SHP_LOCATIONADDRESSDETAIL.LOCATIONCODE  LEFT OUTER JOIN L_REF_ADACCTS  ON I_PG_EMPLOYEEPRE.EMPLOYEECODE = L_REF_ADACCTS.EMPLOYEEID  LEFT OUTER JOIN I_PG_EMPLOYEESTATUS  ON I_PG_EMPLOYEEPRE.EMPLOYEESTATUSCODE = I_PG_EMPLOYEESTATUS.EMPLOYEESTATUSCODE  AND I_PG_EMPLOYEEPRE.ODSSOURCESYSTEMNAME = I_PG_EMPLOYEESTATUS.ODSSOURCESYSTEMNAME  LEFT OUTER JOIN I_PG_PAYPERIOD  ON I_PG_EMPLOYEEPRE.PAYPERIODCODE = I_PG_PAYPERIOD.PAYPERIODCODE  AND I_PG_EMPLOYEEPRE.ODSSOURCESYSTEMNAME = I_PG_PAYPERIOD.ODSSOURCESYSTEMNAME  LEFT OUTER JOIN L_PG_AWARD  ON I_PG_EMPLOYEEPRE.AWARDCODE = L_PG_AWARD.AWARDCODE  LEFT OUTER JOIN L_PG_ALTABLE  ON I_PG_EMPLOYEEPRE.ALTABLECODE = L_PG_ALTABLE.ALTABLECODE      --FIND JDE COST CENTRE IF STILL USING OLD F1 COST CENTRE  --LEFT OUTER JOIN I_JDE_COSTCENTRE_MAP F1 ON I_PG_EMPLOYEEPRE.COSTCENTRECODE = F1.F1COSTCENTRE   --LEFT OUTER JOIN L_REF_JDEMAPF1COSTCENTRE F1 ON I_PG_EMPLOYEEPRE.COSTCENTRECODE = F1.F1_CC_CODE     --FIND F1 COST CENTRE IF CONVERTED TO JDE COST CENTRE  --LEFT OUTER JOIN I_JDE_COSTCENTRE_MAP JDE ON I_PG_EMPLOYEEPRE.COSTCENTRECODE = JDE.JDECOSTCENTRE     --LEFT OUTER JOIN I_DEPARTMENT ON ISNULL(JDE.F1COSTCENTRE,I_PG_EMPLOYEEPRE.COSTCENTRECODE) = I_DEPARTMENT.COSTCENTRE    LEFT OUTER JOIN I_JDE_BUSINESSUNITMASTER  --  ON ISNULL(F1.JDECOSTCENTRE,I_PG_EMPLOYEEPRE.COSTCENTRECODE)    ON I_PG_EMPLOYEEPRE.COSTCENTRECODE    --CORPORATE AND NETWORK ARE THREE DIGIT BUSINESS UNIT    -- 6/5/2016 TIM HAS ALSO MADE NORTHPOWER SOLUTIONS USE THREE DIGIT BUSINESS UNITS    + CASE WHEN LEFT(I_PG_EMPLOYEEPRE.COSTCENTRECODE,1) IN ('A','B','O') THEN ''            ELSE '905'      END = I_JDE_BUSINESSUNITMASTER.BUSINESSUNITCODE    LEFT OUTER JOIN I_JDE_LABOURRECOVERYRATES   ON I_JDE_BUSINESSUNITMASTER.LABOURGROUPINGCODE = I_JDE_LABOURRECOVERYRATES.UNIONCODE   AND LEFT(I_PG_POSITION.XJOBFUNCTION,2) = I_JDE_LABOURRECOVERYRATES.JOBJUNCTIONCODE   AND GETDATE() BETWEEN I_JDE_LABOURRECOVERYRATES.EFFECTIVESTART AND I_JDE_LABOURRECOVERYRATES.EFFECTIVEEND    LEFT OUTER JOIN I_JDE_EMPLOYEE  ON I_PG_EMPLOYEEPRE.EMPLOYEECODE = I_JDE_EMPLOYEE.EMPLOYEECODE    LEFT OUTER JOIN I_PG_ETHNICITY  ON I_PG_EMPLOYEEPRE.ETHNICITYCODE = I_PG_ETHNICITY.ETHNICITYCODE  AND I_PG_EMPLOYEEPRE.ODSSOURCESYSTEMNAME = I_PG_ETHNICITY.ODSSOURCESYSTEMNAME    LEFT OUTER JOIN [I_PG_CONTRACT]  ON I_PG_EMPLOYEEPRE.CONTRACTCODE = I_PG_CONTRACT.CONTRACTCODE  AND I_PG_EMPLOYEEPRE.ODSSOURCESYSTEMNAME = I_PG_CONTRACT.ODSSOURCESYSTEMNAME    LEFT OUTER JOIN D_EMPLOYEE MANAGER     ON I_PG_EMPLOYEETOMANAGER.MANAGERCODE = MANAGER.EMPLOYEECODE    LEFT OUTER JOIN ( SELECT MANAGERCODE, COUNT(1) AS NUMBEROFDIRECTREPORTS                     FROM I_PG_EMPLOYEETOMANAGER                    GROUP BY MANAGERCODE                  ) DIRECTREPORTS     ON I_PG_EMPLOYEEPRE.EMPLOYEECODE = DIRECTREPORTS.MANAGERCODE  LEFT OUTER JOIN L_PG_TERMREASON     ON I_PG_EMPLOYEEPRE.TERMREASONCODE = L_PG_TERMREASON.TERMREASONCODE  LEFT JOIN I_EMPLOYEEELTLEVEL     ON I_PG_EMPLOYEEPRE.EMPLOYEECODE = I_EMPLOYEEELTLEVEL.EMPLOYEECODE  LEFT JOIN I_PEOPLEBOARDDATA                ON I_JDE_EMPLOYEE.EMPLOYEECODE = I_PEOPLEBOARDDATA.EMPLOYEECODE      -- THE CE IS A SPECIAL CASE AND WE NEED THEIR EMPLOYEECODE  ,( SELECT EMPLOYEECODE     FROM I_PG_EMPLOYEEPRE     WHERE POSITIONCODE = 'CE'       AND TERMINA
        name: I_PG_EMPLOYEE
