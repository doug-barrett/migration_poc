          - locationName: NP
            nodeName: D_OBLIGATIONLOCATION
        join:
          joinCondition: |-
            FROM {{ ref('NP','F_AUDITQUESTIONS') }} F_AUDITQUESTIONS
              LEFT OUTER JOIN {{ ref('NP','F_HEALTHANDSAFETYINVESTIGATION') }} F_HEALTHANDSAFETYINVESTIGATION
                ON F_AUDITQUESTIONS.D_AUDITDETAILS_KEY = F_HEALTHANDSAFETYINVESTIGATION.D_AUDITDETAILS_KEY
               AND F_AUDITQUESTIONS.D_AUDITQUESTION_KEY = F_HEALTHANDSAFETYINVESTIGATION.D_AUDITQUESTION_KEY
               AND F_HEALTHANDSAFETYINVESTIGATION.D_OBLIGATION_KEY <> -1
              LEFT OUTER JOIN {{ ref('NP','D_BUSINESSUNIT') }} D_BUSINESSUNIT
                ON COALESCE(F_HEALTHANDSAFETYINVESTIGATION.D_BUSINESSUNIT_KEY, F_AUDITQUESTIONS.D_ALTERNATEBUSINESSUNIT_KEY, F_AUDITQUESTIONS.D_BUSINESSUNIT_KEY) = D_BUSINESSUNIT.D_BUSINESSUNIT_KEY
              LEFT OUTER JOIN {{ ref('NP','I_JDE_BUSINESSUNITMASTER') }} I_JDE_BUSINESSUNITMASTER --  ON D_BUSINESSUNIT.BUSINESSUNITCODE = I_JDE_BUSINESSUNITMASTER.BUSINESSUNITCODE  ON D_BUSINESSUNIT.COSTCENTRECODE + CASE WHEN LEN(D_BUSINESSUNIT.BUSINESSUNITCODE) = 6 THEN '905' ELSE '' END = I_JDE_BUSINESSUNITMASTER.BUSINESSUNITCODE  LEFT OUTER JOIN {{ ref('NP','D_AUDITDETAILS') }} D_AUDITDETAILS   ON F_AUDITQUESTIONS.D_AUDITDETAILS_KEY = D_AUDITDETAILS.D_AUDITDETAILS_KEY  LEFT OUTER JOIN {{ ref('NP','D_OBLIGATION') }} D_OBLIGATION   ON F_AUDITQUESTIONS.D_OBLIGATION_KEY = D_OBLIGATION.D_OBLIGATION_KEY  LEFT OUTER JOIN {{ ref('NP','D_OBLIGATIONVERIFICATIONTYPE') }} D_OBLIGATIONVERIFICATIONTYPE   ON F_AUDITQUESTIONS.D_OBLIGATIONVERIFICATI_KEY = D_OBLIGATIONVERIFICATIONTYPE.D_OBLIGATIONVERIFICATI_KEY  LEFT OUTER JOIN {{ ref('NP','D_OBLIGATIONLOCATION') }} D_OBLIGATIONLOCATION   ON F_AUDITQUESTIONS.D_OBLIGATIONLOCATION_KEY = D_OBLIGATIONLOCATION.D_OBLIGATIONLOCATION_KEY    --ONLY INCLUDE QUESTIONS THAT ARE APPLICABLE TO LEGAL OBLIGATIONS  WHERE F_AUDITQUESTIONS.D_OBLIGATION_KEY <> -1    GROUP BY     D_OBLIGATION.OBLIGATIONCODE  --, D_BUSINESSUNIT.BUSINESSUNITCODE  , I_JDE_BUSINESSUNITMASTER.BUSINESSUNITCODE  , I_JDE_BUSINESSUNITMASTER.BUDGETHOLDEREMPLOYEECODE  , D_OBLIGATIONVERIFICATIONTYPE.VERIFICATIONTYPECODE  , D_OBLIGATIONLOCATION.OBLIGATIONLOCATIONCODE
        name: I_OBLIGATIONREFERENCE_AUDIT
