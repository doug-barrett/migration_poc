        dependencies:
          - locationName: NP
            nodeName: F_AUDITQUESTIONS
          - locationName: NP
            nodeName: F_HEALTHANDSAFETYINVESTIGATION
          - locationName: NP
            nodeName: D_BUSINESSUNIT
          - locationName: NP
            nodeName: I_JDE_BUSINESSUNITMASTER
          - locationName: NP
