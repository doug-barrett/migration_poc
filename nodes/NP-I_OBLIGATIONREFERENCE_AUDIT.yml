          - columnReferences:
              - columnCounter: 21769a1e-67ff-4e5b-a449-09e987c66f41
                stepCounter: 88a84599-1bf9-49c3-bf65-d053645d2c4f
            transform: |-
              CASE WHEN SUM(F_HEALTHANDSAFETYINVESTIGATION.OPENINVESTIGATIONCOUNT) >= 1 THEN 0.00 WHEN SUM(F_AUDITQUESTIONS.NOTANSWERED + F_AUDITQUESTIONS.NOTAPPLICABLE) > 0
                 AND SUM(F_AUDITQUESTIONS.COMPLIANT) = 0
                 AND SUM(F_AUDITQUESTIONS.OTHERANSWER) = 0
                 AND SUM(F_AUDITQUESTIONS.NONCOMPLIANT) = 0 THEN 0.00 WHEN SUM(F_AUDITQUESTIONS.NOTANSWERED) = 0
                 AND SUM(F_AUDITQUESTIONS.COMPLIANT) > 0
                 AND SUM(F_AUDITQUESTIONS.OTHERANSWER) = 0
                 AND SUM(F_AUDITQUESTIONS.NONCOMPLIANT) = 0
                 AND SUM(F_HEALTHANDSAFETYINVESTIGATION.OPENINVESTIGATIONCOUNT) = 0 THEN 1.00 ELSE CAST(SUM( F_AUDITQUESTIONS.COMPLIANT + -- ADD ANY RECTIFIED NON-COMPLIANT ITEMS INTO THE COMPLIANT NUMERATOR COUNT  CASE WHEN ISNULL(F_HEALTHANDSAFETYINVESTIGATION.CLOSEDINVESTIGATIONCOUNT,0) = F_AUDITQUESTIONS.NONCOMPLIANT THEN F_AUDITQUESTIONS.NONCOMPLIANT ELSE 0 END  ) AS DECIMAL(15,2)) / CAST(SUM(F_AUDITQUESTIONS.COMPLIANT+F_AUDITQUESTIONS.NONCOMPLIANT+F_AUDITQUESTIONS.OTHERANSWER) AS DECIMAL(15,2))   --ELSE 0  END
