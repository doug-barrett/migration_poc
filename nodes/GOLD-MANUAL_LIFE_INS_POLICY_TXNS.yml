          LEFT JOIN {{ ref(''BRONZE'', ''MRV_DW_CLAIM_V'') }} mrv_dw_claim_v ON mrv_dw_claim_benefit_contract_risk_assoc_v.CLAIM_KEY = mrv_dw_claim_v.CLAIM_KEY /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''MRV_DW_CLAIM_VRBL_V'') }} mrv_dw_claim_vrbl_v ON mrv_dw_contract_assoc_vrbl_v.FINAL_CLAIM_KEY = mrv_dw_claim_vrbl_v.VRBL_CLAIM_KEY /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''MRV_DW_PRODUCT_V'') }} mrv_dw_product_v ON mrv_dw_claim_vrbl_v.PRODUCT_KEY = mrv_dw_product_v.PRODUCT_KEY /* Detail Outer Join */

