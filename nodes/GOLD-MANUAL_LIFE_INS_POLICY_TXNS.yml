          LEFT JOIN {{ ref(''BRONZE'', ''MULTIGAAP_REF_GROUP_DIMENSION_MAP_V'') }} multigaap_ref_group_dimension_map_v ON multigaap_contract_coverage_vrbl.GROUP_CODE_DIRECT = multigaap_ref_group_dimension_map_v.GRP_DIM_DIR_GROUP_CODE /* Detail Outer Join */

