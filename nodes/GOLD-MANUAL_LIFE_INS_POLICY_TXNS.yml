          LEFT JOIN {{ ref(''BRONZE'', ''MULTIGAAP_CONTRACT_COVERAGE'') }} multigaap_contract_coverage ON multigaap_contract_coverage.CONTRACT_KEY = multigaap_contract_coverage_risk_reln.CONTRACT_KEY AND multigaap_contract_coverage.CONTRACT_COVERAGE_KEY = multigaap_contract_coverage_risk_reln.CONTRACT_COVERAGE_KEY /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''MULTIGAAP_CONTRACT_CURR_V'') }} multigaap_contract_curr_v ON multigaap_contract_curr_v.CONTRACT_KEY = multigaap_contract_coverage.CONTRACT_KEY AND multigaap_contract_curr_v.COVERAGE_ID = multigaap_contract_coverage.COVERAGE_ID /* Detail Outer Join */

