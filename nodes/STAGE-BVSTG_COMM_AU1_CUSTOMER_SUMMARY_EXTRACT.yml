   group by ds_comm_eom_extract_allsources.customerid,                   ds_comm_eom_extract_allsources.asofmonth,                   ifnull(bvstg_comm_au1_customer_persistency_extract.bompolicycount,0))ds_comm_eom_extract_allsources
