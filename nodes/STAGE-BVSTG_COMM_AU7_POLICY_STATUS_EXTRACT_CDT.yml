    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BVSTG_COMM_AU6_POLICY_STATUS_EXTRACT_CDT: b4bf15b9-51b6-4a70-b7e7-93f9758f6338
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU6_POLICY_STATUS_EXTRACT_CDT
        join:
          joinCondition: |-
            FROM (SELECT *,
                   CASE WHEN max_txn IN ('Cancellation', 'Other-Inactive')                                                                             THEN 'Inactive'
                        WHEN max_txn IN ('Reinstatement','Endorsement', 'New Business','Renewal', 'Other-Active') AND expirationdate >= cutoffdate_max THEN 'Active'
                        ELSE NULL
                         END AS policystatus_eom_temp
              FROM (SELECT CASE WHEN transactionid IS NOT NULL THEN transactionid
                        ELSE lag(transactionid) IGNORE nulls OVER (PARTITION BY bvstg_comm_au6_policy_status_extract_cdt.policynumberformatted,carriername ORDER BY cutoffdate_min)
                         END AS last_transactionid_cdt,
                   CASE WHEN max_txn IS NOT NULL THEN max_txn
                        ELSE lag(max_txn) IGNORE nulls OVER (PARTITION BY bvstg_comm_au6_policy_status_extract_cdt.policynumberformatted,carriername ORDER BY cutoffdate_min)
                         END AS last_txn_cdt,
                   CASE WHEN max_txn_date IS NOT NULL THEN max_txn_date
                        ELSE lag(max_txn_date) IGNORE nulls OVER (PARTITION BY bvstg_comm_au6_policy_status_extract_cdt.policynumberformatted,carriername ORDER BY cutoffdate_min)
                         END AS last_txn_date_cdt,
                   CASE WHEN max_txn_lastupdated IS NOT NULL THEN max_txn_lastupdated
                        ELSE lag(max_txn_lastupdated) IGNORE nulls OVER (PARTITION BY bvstg_comm_au6_policy_status_extract_cdt.policynumberformatted,carriername ORDER BY cutoffdate_min)
                         END AS Last_txn_lastupdated_cdt,
                   CASE WHEN min_txn_final IS NOT NULL THEN min_txn_final
                        ELSE lag(min_txn_final) IGNORE nulls OVER (PARTITION BY bvstg_comm_au6_policy_status_extract_cdt.policynumberformatted,carriername ORDER BY cutoffdate_min)
                         END AS first_txn_cdt,
                   CASE WHEN min_txn_date_final IS NOT NULL THEN min_txn_date_final
                        ELSE lag(min_txn_date_final) IGNORE nulls OVER (PARTITION BY bvstg_comm_au6_policy_status_extract_cdt.policynumberformatted,carriername ORDER BY cutoffdate_min)
