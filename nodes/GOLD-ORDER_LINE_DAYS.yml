      config: {}
      dataType: DATE
      description: ""
      name: RENTAL_END_DATE
      nullable: true
      sourceColumnReferences:
        - columnReferences: []
          transform: |-
            CASE
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'O'
            
                           THEN DATE '9999-12-31'
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'C'
            
                           THEN
            
                             CASE
            
                               WHEN Forward_Exchange_Date < Cycle_Billed_To
            
                               THEN Forward_Exchange_Date
            
                               WHEN Forward_Full_Return_Date < Cycle_Billed_To
            
                               THEN Forward_Full_Return_Date
            
                               WHEN Forward_Partial_Return_Date < Cycle_Billed_To
            
                               THEN Forward_Partial_Return_Date
            
                               ELSE COALESCE(Cycle_Billed_To, Return_Date)
            
                             END
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'E'
            
                           THEN Exchange_Date
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'P'
            
                           THEN COALESCE(Partial_Return_Date, Return_Date)
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'F'
            
                            THEN COALESCE(Full_Return_Date, Return_Date)
            
                         END
