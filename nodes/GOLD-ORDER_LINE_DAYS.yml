      config: {}
      dataType: DATE
      description: ""
      name: RENTAL_START_DATE
      nullable: true
      sourceColumnReferences:
        - columnReferences: []
          transform: |-
            CASE
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'O'
            
                           THEN COALESCE(Back_Exchange_Date, Billed_To_Date, Rental_Out_Date)
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'C'
            
                           THEN COALESCE(Back_Partial_Return_Date, Back_Exchange_Date, Cycle_Billed_From, Rental_Out_Date)
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'E'
            
                           THEN 
            
                             CASE
            
                               WHEN Cycle_Billed_To IS NULL
            
                                 AND Rental_Out_Date < Exchange_Date
            
                               THEN Rental_Out_Date
            
                               ELSE Exchange_Date
            
                             END
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'P'
            
                           THEN 
            
                             CASE
            
                               WHEN Partial_Return_Date < Cycle_Billed_To
            
                               THEN Partial_Return_Date
            
                               ELSE COALESCE(Cycle_Billed_To, Rental_Out_Date)
            
                             END
            
                           WHEN STG_ORDER_LINE_DAYS.Invoice_Order_Type = 'F'
            
                           THEN 
            
                             CASE
            
                               WHEN Full_Return_Date < Cycle_Billed_To
            
                               THEN Full_Return_Date
            
                               ELSE COALESCE(Cycle_Billed_To, Rental_Out_Date)
            
                             END
            
                         END
