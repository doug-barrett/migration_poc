            nodeName: DS_AP1_TRANSACTIONSUMMARY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_PREB_CDT_POLICY') }} v_preb_cdt_policy
             INNER JOIN {{ ref('STAGE','BVSTG_H20_LAPSE_MODEL_REFRESH') }} ds_policysummary_v2_inner
                ON v_preb_cdt_policy.policyid = ds_policysummary_v2_inner.policyid
               AND DATE(v_preb_cdt_policy.created) BETWEEN DATE(ds_policysummary_v2_inner.STARTDATE) AND DATEADD(DAY, 7, DATE(ds_policysummary_v2_inner.STARTDATE))
               AND ds_policysummary_v2_inner.sourcedb = 'AppOne'
             INNER JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                ON v_preb_cdt_policy.policyid = ds_ap1_transactionsummary.policyid
               AND DATE(v_preb_cdt_policy.created) BETWEEN DATE(ds_ap1_transactionsummary.created) AND DATEADD(DAY, 7, DATE(ds_ap1_transactionsummary.created))
             WHERE ds_ap1_transactionsummary.TransactionType IN ('New Business')
               AND ds_ap1_transactionsummary.isvoid = 0
               AND ds_ap1_transactionsummary.ISCORPORATEVOID = 0
               AND ds_ap1_transactionsummary.ISROWDELETED = 0
               AND v_preb_cdt_policy.SeqNo_Status_asc != 1000
             GROUP BY v_preb_cdt_policy.PolicyID,
                      sourcedb
