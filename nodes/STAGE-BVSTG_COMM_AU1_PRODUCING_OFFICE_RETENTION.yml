                   round((ifnull(round(M13_Retention_Numerator_CY/M13_Retention_Denominator_CY*100,1),0)-ifnull(round(M13_Retention_Numerator_PY/M13_Retention_Denominator_PY*100,1),0))/ ifnull(round(M13_Retention_Numerator_PY/M13_Retention_Denominator_PY*100,1),round(M13_Retention_Numerator_CY/M13_Retention_Denominator_CY*100,1))*100,1) m13_yoy_improvement,
