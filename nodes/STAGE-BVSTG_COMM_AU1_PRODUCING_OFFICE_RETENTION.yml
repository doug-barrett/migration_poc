              FROM(
                    SELECT DISTINCT officecode,date,metric,
                           metricvalue,
                           officestate,
                           policysource,
                           sum(CASE WHEN metric='Producing_Office_M3_Retention_CY' THEN numerator_cy END) OVER (PARTITION BY officecode,date) M3_Retention_Numerator_CY,
                           sum(CASE WHEN metric='Producing_Office_M3_Retention_CY' THEN denominator_cy END) OVER (PARTITION BY officecode,date) M3_Retention_Denominator_CY,
