                      FROM {{ ref('STAGE','BVSTG_COMM_AU0_PRODUCING_OFFICE_RETENTION') }}
                   ) cy
              FULL OUTER JOIN(SELECT DISTINCT officecode,date,metric,
                   metricvalue,
                   officestate,
