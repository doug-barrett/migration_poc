                   round(M7_Retention_Numerator_CY/M7_Retention_Denominator_CY,3) M7_Retention_CY,
                   round(M7_Retention_Numerator_PY/M7_Retention_Denominator_PY,3) M7_Retention_PY,
                   round(M13_Retention_Numerator_CY/M13_Retention_Denominator_CY,3) M13_Retention_CY,
                   round(M13_Retention_Numerator_PY/M13_Retention_Denominator_PY,3) M13_Retention_PY,
                   round((ifnull(round(M3_Retention_Numerator_CY/M3_Retention_Denominator_CY*100,1),0)-ifnull(round(M3_Retention_Numerator_PY/M3_Retention_Denominator_PY*100,1),0))/ ifnull(round(M3_Retention_Numerator_PY/M3_Retention_Denominator_PY*100,1),round(M3_Retention_Numerator_CY/M3_Retention_Denominator_CY*100,1))*100,1) m3_yoy_improvement,
                   round((ifnull(round(M7_Retention_Numerator_CY/M7_Retention_Denominator_CY*100,1),0)-ifnull(round(M7_Retention_Numerator_PY/M7_Retention_Denominator_PY*100,1),0))/ ifnull(round(M7_Retention_Numerator_PY/M7_Retention_Denominator_PY*100,1),round(M7_Retention_Numerator_CY/M7_Retention_Denominator_CY*100,1))*100,1) m7_yoy_improvement,
                   round((ifnull(round(M13_Retention_Numerator_CY/M13_Retention_Denominator_CY*100,1),0)-ifnull(round(M13_Retention_Numerator_PY/M13_Retention_Denominator_PY*100,1),0))/ ifnull(round(M13_Retention_Numerator_PY/M13_Retention_Denominator_PY*100,1),round(M13_Retention_Numerator_CY/M13_Retention_Denominator_CY*100,1))*100,1) m13_yoy_improvement,
                   M3_Retention_Numerator_CY,
                   M3_Retention_Denominator_CY,
                   M7_Retention_Numerator_CY,
                   M7_Retention_Denominator_CY,
                   M13_Retention_Numerator_CY,
                   M13_Retention_Denominator_CY,
                   M3_Retention_Numerator_PY,
