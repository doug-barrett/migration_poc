    sourceMapping:
      - aliases:
          DS_BVSTG_AP1_LEADHISTORY: 73807470-8bea-455c-a2ec-94fd3d08e77b
          DS_AGENT_KEY: 489968a6-2aa9-4c60-83b4-b001aab3e3a8
          DS_MKT_CALL_CUSTOMER: b9bec5bd-83fe-4758-95ec-851f723f90ef
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_LEADHISTORY
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT ds_bvstg_ap1_leadhistory.HistoryID ,
                           ds_bvstg_ap1_leadhistory.LEADID ,
                           ds_bvstg_ap1_leadhistory.PRIMARYUSERID ,
                           ds_bvstg_ap1_leadhistory.UserFullName ,
                           ds_bvstg_ap1_leadhistory.CustomerID ,
                           ds_agent_key.EmployeeNumber USEREMPLOYEENUMBER ,
                           ds_agent_key.CISCO_LOGINNAME ,
                           ds_bvstg_ap1_leadhistory.Date Created ,
                           ds_bvstg_ap1_leadhistory.CREATED AS min_Range ,
                           CASE WHEN DATEDIFF(MINUTE,ds_bvstg_ap1_leadhistory.CREATED,ds_bvstg_ap1_leadhistory_max.CREATED) > 480 THEN DATEADD(HOUR,4,ds_bvstg_ap1_leadhistory.CREATED)
                                ELSE IFNULL(ds_bvstg_ap1_leadhistory_max.CREATED,DATEADD(HOUR,4,ds_bvstg_ap1_leadhistory.CREATED))
                                 END max_Range ,
                           DATEDIFF(MINUTE,ds_bvstg_ap1_leadhistory.CREATED,CASE WHEN DATEDIFF(MINUTE,ds_bvstg_ap1_leadhistory.CREATED,ds_bvstg_ap1_leadhistory_max.CREATED) > 480 THEN DATEADD(HOUR,4,ds_bvstg_ap1_leadhistory.CREATED) ELSE IFNULL(ds_bvstg_ap1_leadhistory_max.CREATED,DATEADD(HOUR,4,ds_bvstg_ap1_leadhistory.CREATED)) END) DateDiff_minutes
                      FROM (
                            SELECT LEADID,
                                   PRIMARYUSERID,
                                   DATE(CREATED) Date,MIN(CREATED)CREATED,
                                   MAX(UserFullName)UserFullName,
                                   MAX(CustomerID)CustomerID,
                                   MIN(HistoryID) HistoryID
                              FROM {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }}
                             WHERE (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0 AND Created>='2020-01-01') OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,DATE(Created),DATE(CURRENT_DATE())) <= '{{ parameters.HWM_BVSTG_Mapping_Refresh_Days }}'))
                               AND PRIMARYUSERID !='1147'
                             GROUP BY LEADID,
                                      PRIMARYUSERID,
                                      DATE(CREATED)
                           )ds_bvstg_ap1_leadhistory
                      LEFT JOIN (
                            SELECT LEADID,
                                   CREATED
                              FROM {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }}
                             WHERE (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0 AND Created>='2020-01-01') OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,DATE(Created),DATE(CURRENT_DATE())) <= '{{ parameters.HWM_BVSTG_Mapping_Refresh_Days }}'))
                               AND STATUSNAME IN ('* Dead Lead','R-A','Sold')
                             ORDER BY CREATED
                           )ds_bvstg_ap1_leadhistory_max
                        ON ds_bvstg_ap1_leadhistory.LeadID = ds_bvstg_ap1_leadhistory_max.LeadID
                       AND ds_bvstg_ap1_leadhistory_max.CREATED > ds_bvstg_ap1_leadhistory.CREATED
                      LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} AK1
                        ON ds_bvstg_ap1_leadhistory.PRIMARYUSERID = AK1.AP1_USERID
                      LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
                        ON ds_agent_key.EMPLOYEENUMBER = AK1.EMPLOYEENUMBER
                       AND ds_agent_key.CISCO_LOGINNAME IS NOT NULL
                       AND ds_agent_key.RANK_EMPLOYEENUMBER = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_bvstg_ap1_leadhistory.LEADID,ds_bvstg_ap1_leadhistory.PRIMARYUSERID,ds_bvstg_ap1_leadhistory.Date ORDER BY ds_bvstg_ap1_leadhistory_max.CREATED)=1
                   )ds_bvstg_ap1_leadhistory
             INNER JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} ds_mkt_call_customer
                ON ds_mkt_call_customer.CustomerID = ds_bvstg_ap1_leadhistory.CUstomerID
               AND DS_MKT_CALL_CUSTOMER.SOURCEDB_CUSTOMER = 'AppOne'
               AND ds_mkt_call_customer.StartDateTime BETWEEN DATEADD(MINUTE,-10,ds_bvstg_ap1_leadhistory.min_Range) AND DATEADD(MINUTE,+10,ds_bvstg_ap1_leadhistory.max_Range)
               AND ds_mkt_call_customer.DIRECTION = 2
               AND LOWER(SPLIT_PART(ds_mkt_call_customer.FIRSTLOCALUSERID,'@',0))=LOWER(SPLIT_PART(ds_bvstg_ap1_leadhistory.CISCO_LOGINNAME,'@',0))
              LEFT JOIN [TABLEOWNER].[DS_PCCE_TERMINATION_CALL_SUMMARY_SESS
        name: BVSTG_AP1_LEADHISTORY_OUTBOUND
        noLinkRefs: []
