        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL
        join:
          joinCondition: |-
            FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL
             INNER JOIN (
                    SELECT DISTINCT FINAL_CUSTOMER_ID_TO_KEEP
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL
                     WHERE TIME_FLAG LIKE '%Incoming call%'
                   ) AS bvstg_pmkt_au4_final_table_pm
                ON BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL.FINAL_CUSTOMER_ID_TO_KEEP = bvstg_pmkt_au4_final_table_pm.FINAL_CUSTOMER_ID_TO_KEEP
              LEFT JOIN (
                    SELECT SESSIONID_FINAL
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL
                     WHERE SESSIONID_FINAL IN (
                            SELECT DISTINCT SESSIONID_FINAL
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL
                             WHERE ACTION_FINAL = 'Transfer'
                           )
                     GROUP BY SESSIONID_FINAL
                    HAVING COUNT(DISTINCT SKILLGROUPTARGETNAME_FINAL) > 1
                   ) AS bvstg_pmkt_au4_base_table_pm
                ON BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL.SESSIONID_FINAL = bvstg_pmkt_au4_base_table_pm.SESSIONID_FINAL
              LEFT JOIN (
                    SELECT DISTINCT SESSIONAGENTID_FINAL,
                           ROW_NUMBER() OVER (PARTITION BY SESSIONID_FINAL ORDER BY STARTDATETIME) AS AGENT_NUMBER
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL
                     WHERE (LOWER(ACTION_FINAL) LIKE '%_incoming%' OR LOWER(ACTION_FINAL) LIKE 'transfer%' OR LOWER(ACTION_FINAL) LIKE '%_outgoing%')
                   ) AS bvstg_pmkt_au4_action_log_table_consolidated_final
                ON BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL.SESSIONAGENTID_FINAL = bvstg_pmkt_au4_action_log_table_consolidated_final.SESSIONAGENTID_FINAL
        name: BVSTG_PMKT_AU4_BASE_TABLE_PM_FINAL_2
        noLinkRefs: []
