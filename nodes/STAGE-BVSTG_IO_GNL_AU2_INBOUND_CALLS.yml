        join:
          joinCondition: |-
            FROM (
                    SELECT AU1_DEALS.DEAL_ID,
                           CONVERT_TIMEZONE('UTC', 'America/Los_Angeles', AU1_DEALS.CREATION_DATE) DEAL_CREATION_DATE,
                           WON_LOST_DATE,
                           iswon,
                           issold,
                           sold_Date,
                           tcss.id,
                           tcss.STARTDATETIME,
                           tcss.talktime,
                           tcss.ISINBOUND,
                           tcss.iscampaign,
                           tcss.campaignid,
                           digitsdialed,
                           AU1_DEALS.Phone,
                           tcss.DNIS,
                           tcss.ANI
                      FROM {{ ref('STAGE','BVSTG_IO_GNL_AU1_DEALS') }} AU1_DEALS
                      JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} tcss
                        ON RIGHT(tcss.ANI, 10) = AU1_DEALS.Phone
                     WHERE IFNULL(Phone, '') != ''
                       AND isinternalcall = 0
                       AND tcss.ISINBOUND = 1
                   ) BVSTG_IO_GNL_AU1_DEALS
             WHERE STARTDATETIME >= DATEADD('day', -1, DEAL_CREATION_DATE)
               AND STARTDATETIME <= COALESCE(SOLD_DATE, DATEADD('day', 1, WON_LOST_DATE), current_timestamp())
             GROUP BY BVSTG_IO_GNL_AU1_DEALS.DEAL_ID
