          BVSTG_NSA_RWL_AU3_VINCOUNT: 9bdce402-ae1d-45d4-af36-242e2986cf46
          BVSTG_NSA_RWL_AU4_CALLS: eb349c14-09f0-4779-b036-15e110178650
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_AU8_DATASET
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_AU0_BSL
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_AU1_TGT
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_AU2_PREM_FEAT
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_AU3_VINCOUNT
          - locationName: STAGE
            nodeName: BVSTG_NSA_RWL_AU4_CALLS
        join:
          joinCondition: |-
            EXTENDED
              FROM( WITH JOINED_DATA AS ( SELECT BSL.*,
                   CASE WHEN TGT.STATUS_TARGET_INSERTED_DATE IS NULL THEN 0
                        ELSE TGT.STATUS_TARGET_INSERTED_DATE
                         END AS STATUS_TARGET_INSERTED_DATE,
                   CASE WHEN TGT.NEXT_TRANSACTION_INSERTED_DATE IS NULL THEN 'NOT_RENEWED'
                        ELSE TGT.NEXT_TRANSACTION_INSERTED_DATE
                         END AS NEXT_TRANSACTION_INSERTED_DATE,
                   CASE WHEN BSL.CARRIER_UNION IN ('Infinity Insurance', 'National General Insurance','Foremost Insurance') THEN 1
                        ELSE 0
                         END AS FLAG_CARRIERNAME_A,
                   CASE WHEN BSL.CARRIER_UNION IN ('Progressive Insurance','First Acceptance Insurance','Dairyland Auto') THEN 1
                        ELSE 0
                         END AS FLAG_CARRIERNAME_B,
                   CASE WHEN BSL.CARRIER_UNION IN ('Bluefire Insurance','Mendota Insurance', 'OTHER') THEN 1
                        ELSE 0
                         END AS FLAG_CARRIERNAME_C,
                   CASE WHEN BSL.CARRIER_UNION IN ('First Chicago Insurance','Texas Ranger MGA','Aspire General Insurance Services','Assurance America','Bridger Insurance') THEN 1
                        ELSE 0
                         END AS FLAG_CARRIERNAME_D,
                   PREMIUM.DAYS_TO_LAST_ADJUSTMENT,
                   CASE WHEN PREMIUM.INITIAL_PREMIUM_NORM IS NULL THEN 0
                        ELSE PREMIUM.INITIAL_PREMIUM_NORM
                         END AS INITIAL_PREMIUM_NORM,
                   CASE WHEN PREMIUM.COUNT_TOTAL_ADJUSTMENTS_30D_BEFORE_END IS NULL THEN 0
                        ELSE PREMIUM.COUNT_TOTAL_ADJUSTMENTS_30D_BEFORE_END
                         END AS COUNT_TOTAL_ADJUSTMENTS_30D_BEFORE_END,
                   CASE WHEN PREMIUM.STDDEV_ADJUSTMENT_AMOUNT_30D_BEFORE_END IS NULL THEN 0
                        ELSE PREMIUM.STDDEV_ADJUSTMENT_AMOUNT_30D_BEFORE_END
                         END AS STDDEV_ADJUSTMENT_AMOUNT_30D_BEFORE_END,
                   CASE WHEN PREMIUM.TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END_NORM IS NULL THEN 0
                        ELSE PREMIUM.TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END_NORM
                         END AS TOTAL_ADJUSTMENT_AMOUNT_30D_BEFORE_END_NORM,
                   VIN.VINCOUNT,
                   CASE WHEN VIN.AGE_VEHICLE_AVG IS NULL THEN 0
                        ELSE VIN.AGE_VEHICLE_AVG
                         END AS AGE_VEHICLE_AVG,
                   CALLS.DAYS_SINCE_LAST_OUTBOUND,
                   CASE WHEN CALLS.DAYS_SINCE_LAST_CALL IS NULL                         THEN 1
                        WHEN CALLS.DAYS_SINCE_LAST_CALL = CALLS.DAYS_SINCE_LAST_INBOUND THEN 1
                        ELSE 0
                         END AS FLAG_LAST_CALL,
                   CASE WHEN FEE.FEE_AMOUNT IS NULL THEN 0
                        ELSE FEE.FEE_AMOUNT
