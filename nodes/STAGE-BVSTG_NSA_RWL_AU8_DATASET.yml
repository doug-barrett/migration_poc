    sourceMapping:
      - aliases:
          BVSTG_NSA_RWL_AU0_BSL: 0ba656cb-34d5-4986-b255-6055716b0770
          BVSTG_NSA_RWL_AU1_TGT: 64f668cc-5100-41d8-9ee5-87f625b91573
