    sourceMapping:
      - aliases:
          V_PREB_PCCE_OPM_QUEUE_SKILL_INTERVAL_BK: 085960d2-f000-44ed-8e82-2680ea56f25f
          STAGE_INTERVALS: e5aec9dc-38f0-443e-b8d2-53ab340464ae
          DS_PCCE_QUEUE_SKILL_GROUP_INTERVAL: 02dc0236-afcf-49b0-9d73-35c28100cb08
          DS_OPM_LOB_QUEUE_MAPPING: 1915302e-d633-4ce2-a63f-6f11d5840da8
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_OPM_QUEUE_SKILL_INTERVAL_BK') }} AS SELECT ds_opm_lob_queue_mapping.Group_Name,
                   stage_intervals.StartDate StartDate,
                   SUM(ds_pcce_queue_skill_group_interval.AnswerWaitTime) AS AnswerWaitTime,
                   SUM(ds_pcce_queue_skill_group_interval.CallsAnswered) AS CallsAnswered,
                   SUM(ds_pcce_queue_skill_group_interval.talkTime) AS talkTime,
                   SUM(ds_pcce_queue_skill_group_interval.HoldTime) AS HoldTime,
                   SUM(ds_pcce_queue_skill_group_interval.callsoffered) AS CallsOfferedRouted,
                   SUM(ds_pcce_queue_skill_group_interval.RouterCallsAbandQ) +SUM(ds_pcce_queue_skill_group_interval.RouterCallsAbandToAgent) AS RouterCallsAbandQ,
                   SUM(ds_pcce_queue_skill_group_interval.ServiceLevelCalls) AS ServiceLevelCalls,
                   CASE min(IFNULL(ServiceLevelType,0))
                        WHEN 1                          THEN (CASE WHEN (sum(IFNULL(ServiceLevelCallsOffered,0)) - sum(IFNULL(RouterCallsDequeued,0)) - sum(IFNULL(RouterCallsAbandDequeued,0)) - sum(IFNULL(ServiceLevelCallsAband,0))) <= 0 THEN 0 ELSE sum(IFNULL(ServiceLevelCalls,0)) * 1.0 / NULLIF((sum(IFNULL(ServiceLevelCallsOffered,0)) - sum(IFNULL(RouterCallsDequeued,0)) - sum(IFNULL(RouterCallsAbandDequeued,0)) - sum(IFNULL(ServiceLevelCallsAband,0))),0) END)
                        WHEN 2                          THEN (CASE WHEN (sum(IFNULL(ServiceLevelCallsOffered,0)) - sum(IFNULL(RouterCallsDequeued,0)) - sum(IFNULL(RouterCallsAbandDequeued,0))) <= 0 THEN 0 ELSE sum(IFNULL(ServiceLevelCalls,0)) * 1.0 / NULLIF((sum(IFNULL(ServiceLevelCallsOffered,0)) - sum(IFNULL(RouterCallsDequeued,0)) - sum(IFNULL(RouterCallsAbandDequeued,0))),0)END)
                        WHEN 3                          THEN (CASE WHEN (sum(IFNULL(ServiceLevelCallsOffered,0)) - sum(IFNULL(RouterCallsDequeued,0)) - sum(IFNULL(RouterCallsAbandDequeued,0))) <= 0 THEN 0 ELSE (sum(IFNULL(ServiceLevelCalls,0)) + sum(IFNULL(ServiceLevelCallsAband,0))) * 1.0 / NULLIF((sum(IFNULL(ServiceLevelCallsOffered,0)) - sum(IFNULL(RouterCallsDequeued,0)) - sum(IFNULL(RouterCallsAbandDequeued,0))),0)END)
                        ELSE 0
                         END AS servicelLevel,
                   0 AS OverflowOut,
                   sum(IFNULL(ds_pcce_queue_skill_group_interval.TalkTime,0)) / NULLIF(sum(IFNULL(ds_pcce_queue_skill_group_interval.CallsHandled,0)),0) AS aat,
                   sum(IFNULL(ds_pcce_queue_skill_group_interval.handledcallstime,0)) / NULLIF(SUM(ds_pcce_queue_skill_group_interval.CallsAnswered),0) AS aht,
                   sum(ds_pcce_queue_skill_group_interval.AnswerWaitTime) / NULLIF(sum(ds_pcce_queue_skill_group_interval.CallsAnswered),0) AS asa,
                   MAX(ds_pcce_queue_skill_group_interval.RouterMaxCallWaitTime) AS lwt,
                   (SUM(IFNULL(ds_pcce_queue_skill_group_interval.RouterCallsAbandQ, 0))+SUM(IFNULL(ds_pcce_queue_skill_group_interval.RouterCallsAbandToAgent,0))) AS CallsAbanACD,
                   (SUM(IFNULL(ds_pcce_queue_skill_group_interval.CallsHandled, 0)) + SUM(IFNULL(ds_pcce_queue_skill_group_interval.RouterCallsAbandQ, 0)) + SUM(IFNULL(ds_pcce_queue_skill_group_interval.RouterError, 0)) + SUM(IFNULL(ds_pcce_queue_skill_group_interval.RouterCallsDequeued, 0)) + SUM(IFNULL(ds_pcce_queue_skill_group_interval.RouterCallsAbandToAgent, 0)) + SUM(IFNULL(ds_pcce_queue_skill_group_interval.RedirectNoAnsCalls, 0))) AS CallsHandledACD,
                   SUM(CASE WHEN IFNULL(ServiceLevelType,0) = 0 THEN 0 WHEN IFNULL(ServiceLevelType,0) = 1 THEN IFNULL(ServiceLevelCalls,0) WHEN IFNULL(ServiceLevelType,0) = 2 THEN IFNULL(ServiceLevelCalls,0) WHEN IFNULL(ServiceLevelType,0) = 3 THEN IFNULL(ServiceLevelCalls,0)+IFNULL(ServiceLevelCallsAband,0) ELSE 0 END) N_Answered_Acd_Svc_Lvl,
                   SUM(CASE WHEN IFNULL(ServiceLevelType,0) = 0 THEN 0 WHEN IFNULL(ServiceLevelType,0) = 1 THEN IFNULL(ServiceLevelCallsOffered,0) - IFNULL(RouterCallsDequeued,0) - IFNULL(RouterCallsAbandDequeued,0) - IFNULL(ServiceLevelCallsAband,0) WHEN IFNULL(ServiceLevelType,0) = 2 THEN IFNULL(ServiceLevelCallsOffered,0) - IFNULL(RouterCallsDequeued,0) - IFNULL(RouterCallsAbandDequeued,0) WHEN IFNULL(ServiceLevelType,0) = 3 THEN IFNULL(ServiceLevelCallsOffered,0) - IFNULL(RouterCallsDequeued,0) - IFNULL(RouterCallsAbandDequeued,0) ELSE 0 END) N_Entered_Acd,
                   sum(IFNULL(ds_pcce_queue_skill_group_interval.HandledCallsTime,0)) AS HandledCallsTime,
                   SUM(WorkReadyTime) WorkReadyTime,
                   SUM(WorkNotReadyTime)WorkNotReadyTime,
                   SUM(availtime)availabletime,
                   SUM(notreadytime)notreadytime,
                   SUM(loggedontime)loggedontime,
                   MIN(ds_pcce_queue_skill_group_interval.DSS_UPDATE_TIME) DSS_UPDATE_TIME
              FROM {{ ref('STAGE','STAGE_INTERVALS') }} stage_intervals
              LEFT JOIN {{ ref('EDW','DS_PCCE_QUEUE_SKILL_GROUP_INTERVAL') }} ds_pcce_queue_skill_group_interval
                ON ds_pcce_queue_skill_group_interval.Interval >= stage_intervals.StartDate
               AND ds_pcce_queue_skill_group_interval.Interval < stage_intervals.EndDate
             INNER JOIN {{ ref('EDW','DS_OPM_LOB_QUEUE_MAPPING') }} ds_opm_lob_queue_mapping
                ON (ds_pcce_queue_skill_group_interval.FullName = ds_opm_lob_queue_mapping.Queue_Name AND ds_opm_lob_queue_mapping.isActive = 1 AND ds_opm_lob_queue_mapping.QueueType = 'Skill')
             WHERE DATE(stage_intervals.StartDate)>='2020-08-15'
             GROUP BY ds_opm_lob_queue_mapping.Group_Name,
                      stage_intervals.StartDate
             ORDER BY stage_intervals.StartDate
        dependencies:
          - locationName: EDW
            nodeName: DS_OPM_LOB_QUEUE_MAPPING
          - locationName: STAGE
            nodeName: STAGE_INTERVALS
          - locationName: EDW
            nodeName: DS_PCCE_QUEUE_SKILL_GROUP_INTERVAL
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_OPM_LOB_QUEUE_MAPPING') }}
            {{ ref('STAGE','STAGE_INTERVALS') }}
            {{ ref('EDW','DS_PCCE_QUEUE_SKILL_GROUP_INTERVAL') }}
