                   round(cy."'M13_Retention_CY'",3) AS M13_Retention_CY,
                   round(py."'M13_Retention_CY'",3) AS M13_Retention_PY,
                   round((ifnull(round(cy."'M3_Retention_CY'"*100, 1), 0) - ifnull(round(py."'M3_Retention_CY'"*100, 1), 0))/ ifnull(round(py."'M3_Retention_CY'"*100,1),round(cy."'M3_Retention_CY'"*100,1)) * 100, 1) m3_yoy_improvement,
                   round((ifnull(round(cy."'M7_Retention_CY'"*100,1),0)-ifnull(round(py."'M7_Retention_CY'"*100,1),0))/ ifnull(round(py."'M7_Retention_CY'"*100,1),round(cy."'M7_Retention_CY'"*100,1))*100,1) m7_yoy_improvement,
                   round((ifnull(round(cy."'M13_Retention_CY'"*100,1),0)-ifnull(round(py."'M13_Retention_CY'"*100,1),0))/ ifnull(round(py."'M13_Retention_CY'"*100,1),round(cy."'M13_Retention_CY'"*100,1))*100,1) m13_yoy_improvement,
                   M3_Retention_Numerator_CY,
