        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AMS_AU00_INVOICE_TO_REFRESH') }} v_s_ams_invoicetransaction_mroc_current
             INNER JOIN {{ ref('STAGE','V_PREF_AMS_TRANTYPECODE_MODE') }} v_pref_ams_TranTypeCode_mode
                ON (v_s_ams_invoicetransaction_mroc_current.TranType = v_pref_ams_TranTypeCode_mode.TransTypeCode)
             INNER JOIN {{ ref('STAGE','V_PREF_AMS_LOB_MODE') }} v_pref_ams_lob_mode
                ON (v_pref_ams_lob_mode.namelobs = v_s_ams_invoicetransaction_mroc_current.lineofbus)
             INNER JOIN {{ ref('DATA_VAULT','S_AMS_POLICYTRANPREMIUM_MROC') }} v_s_ams_policytranpremium_mroc_current
                ON (v_s_ams_policytranpremium_mroc_current.poltpid = v_s_ams_invoicetransaction_mroc_current.poltpid AND v_s_ams_policytranpremium_mroc_current.lineofbus = v_s_ams_invoicetransaction_mroc_current.lineofbus)
             INNER JOIN {{ ref('DATA_VAULT','S_AMS_BASICPOLINFO_MROC') }} v_s_ams_basicpolinfo_mroc_current
                ON v_s_ams_basicpolinfo_mroc_current.PolId = v_s_ams_policytranpremium_mroc_current.PolId
              LEFT JOIN {{ ref('STAGE','V_PREB_AMS_AU0_PREMIUM') }} v_preb_ams_au0_premium
                ON (v_preb_ams_au0_premium.PolID = v_s_ams_basicpolinfo_mroc_current.PolID AND v_preb_ams_au0_premium.LineOfBus = v_s_ams_invoicetransaction_mroc_current.lineofbus)
             INNER JOIN {{ ref('DATA_VAULT','S_AMS_SETUPBILLINGTRAN_MROC') }} v_s_ams_setupbillingtran_mroc_current
                ON v_s_ams_invoicetransaction_mroc_current.ChargeCode = v_s_ams_setupbillingtran_mroc_current.ChargeCode
             WHERE v_s_ams_invoicetransaction_mroc_current.GROSSAMT > 0
               AND v_s_ams_invoicetransaction_mroc_current.backinvtpid IS NULL
               AND v_s_ams_invoicetransaction_mroc_current.oldinvtpid IS NULL
               AND v_s_ams_setupbillingtran_mroc_current.ShortName != 'PRFAGY'
               AND v_pref_ams_TranTypeCode_mode.ModeID IN (2,4)
               AND ( ('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 0)
                OR ('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}')
                OR ('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 1
               AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' --AND TO_DATE(v_s_ams_invoicetransaction_mroc_current.EnteredDate) = TO_DATE(CURRENT_DATE())    --AND v_s_ams_invoicetransaction_mroc_current.lineofbus = 'AUTOP'   )     )       QUALIFY ROW_NUMBER() OVER (       PARTITION BY v_s_ams_invoicetransaction_mroc_current.hk_h_invoicetransaction,        v_s_ams_policytranpremium_mroc_current.HK_H_POLICYTRANPREMIUM        ORDER BY v_s_ams_invoicetransaction_mroc_current.hk_h_invoicetransaction,        v_s_ams_policytranpremium_mroc_current.DSS_VERSION desc)=1
