        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_RENEWALS
          - locationName: STAGE
            nodeName: V_PREB_CDT_POLICY
          - locationName: STAGE
            nodeName: BVSTG_CUSTOMER_TO_REFRESH
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_PREB_CDT_POLICY') }} v_preb_cdt_policy
             INNER JOIN {{ ref('EDW','DS_POLICYSUMMARY_RENEWALS') }} ds_policysummary_renewals
                ON TO_VARCHAR(v_preb_cdt_policy.policyid) = TO_VARCHAR(ds_policysummary_renewals.Source_policyid)
               AND DATE(v_preb_cdt_policy.created) <= ds_policysummary_renewals.renewal_start_period
               AND ds_policysummary_renewals.SourceDB = 'AppOne'
             INNER JOIN (
                    SELECT DISTINCT customerid,
                           SourceDB
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                   ) bvstg_customer_to_refresh
                ON TO_CHAR(bvstg_customer_to_refresh.customerid) = TO_CHAR(ds_policysummary_renewals.customerid)
               AND bvstg_customer_to_refresh.SourceDB = ds_policysummary_renewals.SourceDB
             INNER JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                ON v_preb_cdt_policy.policyid = ds_ap1_transactionsummary.policyid
               AND DATE(v_preb_cdt_policy.created) <= ds_policysummary_renewals.renewal_start_period
             WHERE ds_ap1_transactionsummary.TransactionType IN ('New Business')
               AND ds_ap1_transactionsummary.isvoid = 0
               AND ds_ap1_transactionsummary.ISCORPORATEVOID = 0
               AND ds_ap1_transactionsummary.ISROWDELETED = 0
               AND v_preb_cdt_policy.SeqNo_Status_asc != 1000
             GROUP BY ds_policysummary_renewals.ID
