    sourceMapping:
      - aliases:
          DS_MKT_CALLLOGS: 259616fa-a3e4-42bc-8241-ee6c1bd21955
          DS_MKT_WEBFORMS_LOGS: 796f0520-2c6c-4afc-ae12-a063910086bd
          V_S_MKT_CAMPAIGN_COST_CURRENT: c586f27d-4d3b-4003-b3be-67f2cbfbfa18
          V_S_MKT_BROADCAST_CALENDAR_CURRENT: a13ba7a8-909e-4ba8-a37a-057e9eccbd63
          V_S_MKT_DMA_CURRENT: bc31017c-0218-42e6-9c09-ac646c8a9f3d
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_S_MKT_CAMPAIGN_COST_CURRENT
          - locationName: EDW
            nodeName: DS_MKT_CALLLOGS
          - locationName: EDW
            nodeName: DS_MKT_WEBFORMS_LOGS
          - locationName: STAGE
            nodeName: V_S_MKT_BROADCAST_CALENDAR_CURRENT
          - locationName: STAGE
            nodeName: V_S_MKT_DMA_CURRENT
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT Broadcast_Year ,
                           Broadcast_Week ,
                           StationCampaignName ,
                           Campaign_Brand_Name Brand_Name ,
                           Campaign_Source ,
                           Campaign_DMAIdentifier ,
                           SUM(IsWeeklyUnique) WeeklyUniqueCalls ,
                           SUM(CASE WHEN call_status IN ('SYSTEM CONNECT', 'ANSWER') THEN IsWeeklyUnique ELSE 0 END) WeeklyUniqueConnectedCalls ,
                           0 WeeklyUniqueWebForms ,
                           0 Cost_By_Week ,
                           'T_CallLogs' sourcename
                      FROM {{ ref('EDW','DS_MKT_CALLLOGS') }}
                     WHERE (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND Broadcast_Year >= YEAR(DATEADD(DAY,-15,CURRENT_DATE()))))
                     GROUP BY Broadcast_Year ,
                              Broadcast_Week ,
                              StationCampaignName ,
                              Campaign_Brand_Name ,
                              Campaign_Source ,
                              Campaign_DMAIdentifier
                     UNION SELECT Broadcast_Year ,
                           Broadcast_Week ,
                           StationCampaignName ,
                           Campaign_Brand_Name Brand_Name ,
                           Campaign_Source ,
                           Campaign_DMAIdentifier ,
                           0 WeeklyUniqueCalls ,
                           0 WeeklyUniqueConnectedCalls ,
                           SUM(IsWeeklyUnique) WeeklyUniqueWebForms ,
                           0 Cost_By_Week ,
                           'T_Webforms' Sourcename
                      FROM {{ ref('EDW','DS_MKT_WEBFORMS_LOGS') }}
                     WHERE (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND Broadcast_Year >= YEAR(DATEADD(DAY,-15,CURRENT_DATE()))))
                     GROUP BY Broadcast_Year ,
                              Broadcast_Week ,
                              StationCampaignName ,
                              Campaign_Brand_Name ,
                              Campaign_Source ,
                              Campaign_DMAIdentifier
                     UNION SELECT Year_Number Broadcast_Year,
                           Week_Number Broadcast_Week,
                           Station_CampaignName StationCampaignName,
                           BrandName Campaign_Brand_Name,
                           SourceName Campaign_Source,
                           MarketName Campaign_DMAIdentifier,
                           0 WeeklyUniqueCalls,
                           0 WeeklyUniqueConnectedCalls,
                           0 WeeklyUniqueWebForms,
                           SUM(Cost_By_Week) Cost_By_Week,
                           'T_Expenses' sourcename
                      FROM {{ ref('STAGE','V_S_MKT_CAMPAIGN_COST_CURRENT') }}
                     WHERE (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND Year_Number >= YEAR(DATEADD(DAY,-15,CURRENT_DATE()))))
                     GROUP BY Year_Number,
                              Week_Number,
                              Station_CampaignName,
                              BrandName,
                              SourceName,
                              MarketName
                   )v_s_mkt_campaign_cost_current
              LEFT JOIN (
                    SELECT MIN(Date) AS StartDate,
                           MAX(Date) AS EndDate,
                           Week_Number,
                           Month_Number,
                           TO_CHAR(to_date(Year_Number || '-' || Month_Number || '-01'), 'MMMM') Month_Name,
                           Qtr_Number,
                           Year_Number
                      FROM {{ ref('STAGE','V_S_MKT_BROADCAST_CALENDAR_CURRENT') }}
                     GROUP BY Year_Number,
                              Qtr_Number,
                              Month_Number,
                              Week_Number
                   ) v_s_mkt_broadcast_calendar_current
                ON (v_s_mkt_campaign_cost_current.Broadcast_Year = v_s_mkt_broadcast_calendar_current.year_number AND v_s_mkt_campaign_cost_current.Broadcast_Week = v_s_mkt_broadcast_calendar_current.week_number)
              LEFT JOIN {{ ref('STAGE','V_S_MKT_DMA_CURRENT') }} v_s_mkt_dma_current
                ON v_s_mkt_campaign_cost_current.Campaign_DMAIdentifier = v_s_mkt_dma_current.Identifier
             GROUP BY v_s_mkt_campaign_cost_current.Broadcast_Year ,
                      v_s_mkt_campaign_cost_current.Broadcast_Week ,
                      v_s_mkt_broadcast_calendar_current.Month_Number ,
                      v_s_mkt_broadcast_calendar_curr
        name: BVSTG_MKT_MEDIA_MIX
        noLinkRefs: []
