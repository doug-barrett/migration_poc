      dependencies:
        - locationName: GOLD
          nodeName: ADDRESS
      join:
        joinCondition: |-
          FROM (
          Select
           Company_Code as Company_Code,
           Address_Type_Code as Address_Type_Code,
           Address_Line_1_Txt as Address_Text_1,
           Address_Line_2_Txt as Address_Text_2,
           City_Code as City_Code,
           State_Code as State_Code,
           Postal_Code as Postal_Code,
           Cast( 0 as integer) as Area_Code,
           cast( 0 as integer) as Phone_Num,
           Country_Code as Country_Code
           From [WRK_ADDRESS_MAIL]
           WHERE Company_Code = 'U1'
           
           Union
           
           Select 
           Company_Code,
           Address_Type_Code,
           Email_Address,
           ' ', ' ',' ',' ',0,0,' '
           From [WRK_ADDRESS_EMAIL]
           WHERE Company_Code = 'U1'
           
           UNION
           
           Select
           Company_Code,
           Address_Type, ' ',' ',' ',' ',' ',
           Area_Code,
           Phone_Num, ' '
           From [WRK_ADDRESS_TELEPHONE]
           WHERE Company_Code = 'U1'
           ) as TempTable
           
           LEFT OUTER JOIN [ADDRESS] ADDRESS
           ON  ADDRESS.Address_Type_Code = TempTable.Address_Type_Code
           AND ADDRESS.Address_Text_1 = TempTable.Address_Text_1
           AND ADDRESS.Address_Text_2 = TempTable.Address_Text_2
           AND ADDRESS.City_Code = TempTable.City_Code
           AND ADDRESS.State_Code = TempTable.State_Code
           AND ADDRESS.Postal_Code = TempTable.Postal_Code
           AND ADDRESS.Area_Code = TempTable.Area_Code
           AND ADDRESS.Phone_Num = TempTable.Phone_Num
           AND ADDRESS.Country_Code = TempTable.Country_Code
           AND ADDRESS.Company_Code = TempTable.Company_Code
           
           LEFT OUTER JOIN 
           (Select COALESCE(Max(Address_id),0) as Last_Id 
            from   [ADDRESS] ) as Max_ID 
           ON 1 = 1
