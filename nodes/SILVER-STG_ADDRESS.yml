      join:
        joinCondition: "FROM (\nSelect\n Company_Code as Company_Code,\n Address_Type_Code\
          \ as Address_Type_Code,\n Address_Line_1_Txt as Address_Text_1,\n Address_Line_2_Txt\
          \ as Address_Text_2,\n City_Code as City_Code,\n State_Code as State_Code,\n\
          \ Postal_Code as Postal_Code,\n Cast( 0 as integer) as Area_Code,\n cast(\
          \ 0 as integer) as Phone_Num,\n Country_Code as Country_Code\n From [WRK_ADDRESS_MAIL]\n\
          \ WHERE Company_Code = 'U1'\n \n Union\n \n Select \n Company_Code,\n Address_Type_Code,\n\
          \ Email_Address,\n ' ', ' ',' ',' ',0,0,' '\n From [WRK_ADDRESS_EMAIL]\n\
          \ WHERE Company_Code = 'U1'\n \n UNION\n \n Select\n Company_Code,\n Address_Type,\
          \ ' ',' ',' ',' ',' ',\n Area_Code,\n Phone_Num, ' '\n From [WRK_ADDRESS_TELEPHONE]\n\
          \ WHERE Company_Code = 'U1'\n ) as TempTable\n \n LEFT OUTER JOIN {{ ref_no_link('GOLD',\
          \ 'ADDRESS') }} \"ADDRESS\"\n ON  ADDRESS.Address_Type_Code = TempTable.Address_Type_Code\n\
          \ AND ADDRESS.Address_Text_1 = TempTable.Address_Text_1\n AND ADDRESS.Address_Text_2\
          \ = TempTable.Address_Text_2\n AND ADDRESS.City_Code = TempTable.City_Code\n\
          \ AND ADDRESS.State_Code = TempTable.State_Code\n AND ADDRESS.Postal_Code\
          \ = TempTable.Postal_Code\n AND ADDRESS.Area_Code = TempTable.Area_Code\n\
          \ AND ADDRESS.Phone_Num = TempTable.Phone_Num\n AND ADDRESS.Country_Code\
          \ = TempTable.Country_Code\n AND ADDRESS.Company_Code = TempTable.Company_Code\n\
          \ \n LEFT OUTER JOIN \n  (Select COALESCE(Max(Address_id),0) as Last_Id\
          \ \n   from   {{ ref_no_link('GOLD', 'ADDRESS') }} ) as Max_ID \n ON 1 =\
          \ 1"
