        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT DISTINCT Calendar.Asofmonth,
                           OFFICECODE,
                           Working_days,
                           FTE_SUM FTE_Numerator,
                           FTE_Numerator / Working_days FTE
                      FROM (
                            SELECT DISTINCT date_trunc('month', SALESDATE) asofmonth,
                                   sum(SALESDAYWEIGHT) Working_days
                              FROM {{ ref('STAGE','V_DLBV_BOE_SALESCALENDAR_CURRENT') }}
                             WHERE year(SALESDATE) >= 2021
                               AND DAYOFWEEK(SALESDATE) NOT IN (6, 0)
                               AND SALESDATE <= dateadd('day', - 1, date_trunc('month', CURRENT_DATE))
                             GROUP BY date_trunc('month', SALESDATE)
                           ) calendar
                      LEFT JOIN (
                            SELECT officecode,
                                   date_trunc('month', vintage) asofmonth,
                                   sum(FTE_SUM) FTE_SUM
                              FROM (
                                    SELECT OFFICECODE,
                                           vintage,
                                           count(DISTINCT PRODUCER) FTE_SUM
                                      FROM ((SELECT A.OFFICECODE, DATE (TRANSACTIONDATE) AS VINTAGE, PRIMARYAGENTULTIPRO_BROKER AS PRODUCER FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} A LEFT JOIN {{ ref('STAGE','DS_BVSTG_TRANSACTION_METHOD_TYPE') }} MP ON A.TRANSACTIONID = MP.TRANSACTIONID LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} B ON B.OfficeCode = A.OfficeCode WHERE 1 = 1 AND YEAR(A.CreatedDate) >= 2021 AND A.Label NOT LIKE '%Void%' AND A.SourceDB <> 'ConfieHub' AND A.CLASSIFICATIONGROUP NOT IN ('SR-22 Fee', 'Agency Fee', 'Documentation Fee', 'Monthly Payments Fee', 'Renewal', 'New Transfer', 'Fee Counts', 'Cancellation', 'Reinstatement', 'Endorsement', 'Endorsements (NonPrem)', 'ADD') AND NOT (A.CLASSIFICATIONGROUP = 'New Quotes Auto' AND A.SourceDB <> 'AppOne') AND (Primaryagentultipro_Broker NOT IN ('ODT TEST', 'CDT', 'HSACCT', 'STURBO')) AND B.OfficeType = 'Retail' AND B.Country = 'United States' AND CASE WHEN (A.CreatedDate >= B.officeopeneddate AND A.CreatedDate < B.officecloseddate) OR (A.CreatedDate >= B.officeopeneddate AND B.officecloseddate IS NULL) THEN 'Open' WHEN B.officecode IS NULL THEN NULL ELSE 'Closed' END = 'Open') UNION ALL (SELECT DISTINCT AGENTOFFICE AS OFFICECODE, DATE (STARTDATETIME) AS VINTAGE, EMPLOYEENUMBER AS PRODUCER FROM {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} A LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} B ON CISCO_SKILLTARGETID = AGENTSKILLTARGETID LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} C ON A.Agentoffice = c.officecode WHERE JobFamily = 'SALES' AND C.OfficeType = 'Retail' AND C.Country = 'United States' AND CASE WHEN (STARTDATETIME >= C.officeopeneddate AND STARTDATETIME < C.officecloseddate) OR (STARTDATETIME >= C.officeopeneddate AND C.officecloseddate IS NULL) THEN 'Open' WHEN C.officecode IS NULL THEN NULL ELSE 'Closed' END = 'Open'))
                                     WHERE DAYOFWEEK(vintage) NOT IN (6, 0)
                                     GROUP BY officecode,
                                              vintage
                                   )
                             GROUP BY officecode,
                                      date_trunc('month', vintage)
                           ) FTE
                        ON calendar.asofmonth = fte.asofmonth
                   ) V_DLBV_BOE_SALESCALENDAR_CURRENT
              FULL OUTER JOIN ( SELECT date_trunc('month', SALESDATE) asofmonth,
                   OFFICECODE,
                   sum(transactions) Total_Store_Activity,
                   sum(Calls_Quotes) Calls_Quotes,
                   sum(CASE WHEN transactions > 0 THEN SALESDAYWEIGHT END) Working_Days_Store_Activity,
                   sum(SALESDAYWEIGHT) working_days
              FROM ( ( SELECT DISTINCT SALESDATE,
                   SALESDAYWEIGHT
              FROM {{ ref('STAGE','V_DLBV_BOE_SALESCALENDAR_CURRENT') }}
             WHERE year(SALESDATE) >= 2021
               AND DAYOFWEEK(SALESDATE) NOT IN (6, 0)
