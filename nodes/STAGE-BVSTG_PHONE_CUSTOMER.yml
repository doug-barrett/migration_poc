    sourceMapping:
      - aliases:
          BVSTG_AP1_CUSTOMER_REFRESH: e1a00289-44b3-474b-85e0-78530ef8c867
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: DATA_VAULT
            nodeName: S_AP1_PHONE_MROC
          - locationName: DATA_VAULT
            nodeName: S_AP1_CUSTOMERPHONE_MROC
          - locationName: STAGE
            nodeName: BVSTG_AP1_CUSTOMER_REFRESH
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AP1_CUSTOMER_REFRESH') }} bvstg_ap1_customer_refresh
             INNER JOIN (
                    SELECT *
                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_CUSTOMERPHONE_MROC QUALIFY ROW_NUMBER() OVER (PARTITION BY CustomerPhoneID ORDER BY DSS_VERSION DESC) = 1
                   ) S_AP1_CUSTOMERPHONE_MROC
                ON bvstg_ap1_customer_refresh.Customerid = TO_VARCHAR(S_AP1_CUSTOMERPHONE_MROC.CustomerID)
             INNER JOIN (
                    SELECT *
                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_PHONE_MROC QUALIFY ROW_NUMBER() OVER (PARTITION BY PhoneID ORDER BY DSS_VERSION DESC) = 1
                   ) S_AP1_PHONE_MROC
                ON S_AP1_CUSTOMERPHONE_MROC.phoneid = S_AP1_PHONE_MROC.phoneid
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE DS_RETAIL_OFFICE
                ON REPLACE(REPLACE(REPLACE(REPLACE(DS_RETAIL_OFFICE.phone, '('), ')'), '-'), ' ', '') = S_AP1_PHONE_MROC.Value
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_INTELEPEER_TF_DID_INVENTORY v_preb_intelepeer_tf_did_inventory
                ON v_preb_intelepeer_tf_did_inventory.PhoneNumber = S_AP1_PHONE_MROC.Value
             WHERE S_AP1_PHONE_MROC.IsRowDeleted = 0
               AND LEN(S_AP1_PHONE_MROC.Value) = 10
               AND DS_RETAIL_OFFICE.phone IS NULL
               AND v_preb_intelepeer_tf_did_inventory.phonenumber IS NULL
               AND TRY_TO_NUMERIC(S_AP1_PHONE_MROC.Value) IS NOT NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY TO_VARCHAR(S_AP1_CUSTOMERPHONE_MROC.CustomerID),S_AP1_PHONE_MROC.Value ORDER BY S_AP1_PHONE_MROC.LastUpdated DESC) = 1
        name: SRC_bvstg_phone_customer_ap1_1
        noLinkRefs: []
      - aliases:
          S_AMS_CUSTOMER_MROC: 8c8b4904-9c5e-450b-95d7-4fec86917540
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: DATA_VAULT
            nodeName: S_AMS_CUSTOMER_MROC
        join:
          joinCondition: FROM {{ ref('DATA_VAULT','S_AMS_CUSTOMER_MROC') }}
        name: SRC_bvstg_phone_customer_cigh_2
        noLinkRefs: []
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: DATA_VAULT
            nodeName: H_SPLC_CUSTOMER
        join:
          joinCondition: |-
            FROM (
                    SELECT CustomerID ,
                           PhoneNumber ,
                           PhoneType ,
                           Entereddate
                      FROM (
                            SELECT a.CUSTID CustomerID ,
                                   b.ResFullPhone PhoneNumber ,
                                   b.Entereddate ,
                                   'Res' AS PhoneType
                              FROM RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_CUSTOMER a
                             INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_SPLC_CUSTOMER b
                                ON a.HK_H_CUSTOMER = b.HK_H_CUSTOMER
                             WHERE b.ResFullPhone IS NOT NULL
                             UNION SELECT a.CUSTID ,
                                   b.BusFullPhone ,
                                   b.Entereddate ,
                                   'Bus' AS PhoneType
                              FROM RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_CUSTOMER a
                             INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_SPLC_CUSTOMER b
                                ON a.HK_H_CUSTOMER = b.HK_H_CUSTOMER
                             WHERE b.BusFullPhone IS NOT NULL
                             UNION SELECT a.CUSTID ,
                                   b.FaxFullPhone ,
                                   b.Entereddate ,
                                   'Fax' AS PhoneType
                              FROM RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_CUSTOMER a
                             INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_SPLC_CUSTOMER b
                                ON a.HK_H_CUSTOMER = b.HK_H_CUSTOMER
                             WHERE b.FaxFullPhone IS NOT NULL
                             UNION SELECT a.CUSTID ,
                                   b.MarineFullPhone ,
                                   b.Entereddate ,
                                   'Marine' AS PhoneType
                              FROM RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_CUSTOMER a
                             INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_SPLC_CUSTOMER b
                                ON a.HK_H_CUSTOMER = b.HK_H_CUSTOMER
                             WHERE b.MarineFullPhone IS NOT NULL
                             UNION SELECT a.CUSTID ,
                                   b.PagerFullPhone ,
                                   b.Entereddate ,
                                   'Pager' AS PhoneType
                              FROM RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_CUSTOMER a
                             INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_SPLC_CUSTOMER b
                                ON a.HK_H_CUSTOMER = b.HK_H_CUSTOMER
                             WHERE b.PagerFullPhone IS NOT NULL
                             UNION SELECT a.CUSTID ,
                                   b.OtherFullPhone ,
                                   b.Entereddate ,
                                   'Other' AS PhoneType
                              FROM RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_CUSTOMER a
                             INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_SPLC_CUSTOMER b
                                ON a.HK_H_CUSTOMER = b.HK_H_CUSTOMER
                             WHERE b.OtherFullPhone IS NOT NULL
                           ) a QUALIFY ROW_NUMBER() OVER (PARTITION BY CustomerID ORDER BY Entereddate DESC) = 1
                   ) H_SPLC_CUSTOMER
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE DS_RETAIL_OFFICE
                ON REPLACE(REPLACE(REPLACE(REPLACE(DS_RETAIL_OFFICE.phone, '('), ')'), '-'), ' ', '') = H_SPLC_CUSTOMER.PhoneNumber
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_INTELEPEER_TF_DID_INVENTORY v_preb_intelepeer_tf_did_inventory
                ON v_preb_intelepeer_tf_did_inventory.PhoneNumber = H_SPLC_CUSTOMER.PhoneNumber
             WHERE DS_RETAIL_OFFICE.phone IS NULL
               AND v_preb_intelepeer_tf_did_inventory.phonenumber IS NULL
               AND TRY_TO_NUMERIC(H_SPLC_CUSTOMER.phonenumber) IS NOT NULL
        name: SRC_bvstg_phone_customer_splc_3
        noLinkRefs: []
