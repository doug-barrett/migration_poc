    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          V_PREB_BLENDED_IN_OUTBOUND: ec2db873-a7ca-42b3-8a82-b23ec086492d
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_BLENDED_IN_OUTBOUND') }} AS SELECT NBTRANSACTIONID ,
                   TRANSACTIONID ,
                   TRANSACTIONTYPE ,
                   POLICYID ,
                   POLICYNUMBER ,
                   CUSTOMERID ,
                   CUSTOMERNAME ,
                   FIRSTNAME ,
                   LASTNAME ,
                   CustomerState ,
                   SourceDB ,
                   CASE WHEN Orders like '1%' THEN Cust_HOMEPHONE
                        WHEN Orders like '2%' THEN Cust_CELLPHONE
                        WHEN Orders like '3'  THEN Cust_CONTACTPHONE
                         END Phone1 ,
                   CASE WHEN Qty_Phone_Numbers > 1 THEN CASE WHEN Orders like '12%' THEN Cust_CELLPHONE WHEN Orders like '13' THEN Cust_CONTACTPHONE WHEN Orders like '23' THEN Cust_CONTACTPHONE END
                        ELSE ''
                         END Phone2 ,
                   CASE WHEN Qty_Phone_Numbers > 2 THEN Cust_CONTACTPHONE
                        ELSE ''
                         END Phone3 ,
                   Qty_Phone_Numbers ,
                   Cust_HOMEPHONE AS HOMEPHONE ,
                   Cust_CELLPHONE AS CELLPHONE ,
                   Cust_CONTACTPHONE AS CONTACTPHONE ,
                   POLICYSTATUS ,
                   STATUSDATE ,
                   EFFECTIVEDATE ,
                   EXPIRATIONDATE ,
                   BIAPrimaryAgentOffice ,
                   PRODUCERFULLNAME ,
                   PRODUCERID ,
                   V_DLBV_MKT_TIMEZONES_STATE.TimeZone ,
                   V_DLBV_MKT_TIMEZONES.timezonehours ,
                   V_DLBV_MKT_TIMEZONES.timezonehours * 60 AS TIMEZONEBIAS
              FROM (
                    SELECT NBTRANSACTIONID ,
                           MAX(IFNULL(ds_policysummary_v2.LAST_TRANSACTIONID,ds_policysummary_v2.NBTRANSACTIONID)) TRANSACTIONID ,
                           MAX(IFNULL(ds_policysummary_v2.LAST_TRANSACTIONTYPE,ds_policysummary_v2.TRANSACTIONTYPE)) TRANSACTIONTYPE ,
                           IFNULL(ds_policysummary_v2.Last_POLICYID,ds_policysummary_v2.POLICYID)POLICYID ,
                           MAX(IFNULL(ds_policysummary_v2.Last_POLICYNUMBER,ds_policysummary_v2.POLICYNUMBER)) POLICYNUMBER ,
                           MAX(ds_policysummary_v2.CUSTOMERID) CUSTOMERID ,
                           MAX(CASE WHEN ds_policysummary_v2.SOURCEDB ='AppOne' THEN IFNULL(ds_bvstg_ap1_customer.FIRSTNAME,'') WHEN ds_policysummary_v2.SOURCEDB ='CIGH' THEN IFNULL(DS_CustomerSummary_v2.FIRSTNAME,'') ELSE '' END) FIRSTNAME ,
                           MAX(CASE WHEN ds_policysummary_v2.SOURCEDB ='AppOne' THEN IFNULL(ds_bvstg_ap1_customer.LASTNAME,'') WHEN ds_policysummary_v2.SOURCEDB ='CIGH' THEN IFNULL(DS_CustomerSummary_v2.LASTNAME,'') ELSE '' END) LASTNAME ,
                           MAX(CASE WHEN ds_policysummary_v2.SOURCEDB ='AppOne' THEN coalesce(ds_bvstg_ap1_customer.MAINSTATE,ds_bvstg_ap1_customer.MAILINGSTATE,ds_bvstg_ap1_customer.GARAGESTATE) WHEN ds_policysummary_v2.SOURCEDB ='CIGH' THEN coalesce(DS_CustomerSummary_v2.MAINSTATE,DS_CustomerSummary_v2.MAILINGSTATE,DS_CustomerSummary_v2.GARAGESTATE) ELSE '' END) CustomerState ,
                           MAX(ds_policysummary_v2.SourceDB) SourceDB ,
                           MAX(CASE WHEN ds_policysummary_v2.SOURCEDB ='AppOne' THEN IFNULL(ds_bvstg_ap1_customer.HOMEPHONE,'') WHEN ds_policysummary_v2.SOURCEDB ='CIGH' THEN IFNULL(DS_CustomerSummary_v2.HOMEPHONE,'') ELSE '' END) T_HOMEPHONE ,
                           MAX(CASE WHEN ds_policysummary_v2.SOURCEDB ='AppOne' THEN IFNULL(ds_bvstg_ap1_customer.CELLPHONE,'') WHEN ds_policysummary_v2.SOURCEDB ='CIGH' THEN IFNULL(DS_CustomerSummary_v2.CELLPHONE,'') ELSE '' END) T_CELLPHONE ,
                           MAX(CASE WHEN ds_policysummary_v2.SOURCEDB ='AppOne' THEN IFNULL(ds_bvstg_ap1_customer.CONTACTPHONE,'') WHEN ds_policysummary_v2.SOURCEDB ='CIGH' THEN IFNULL(DS_CustomerSummary_v2.CONTACTPHONE,'') ELSE '' END) T_CONTACTPHONE ,
                           CASE WHEN T_HOMEPHONE != '' THEN '1'
                                ELSE ''
                                 END || CASE WHEN T_HOMEPHONE != T_CELLPHONE AND T_CELLPHONE != '' THEN '2'
                                ELSE ''
                                 END || CASE WHEN T_CONTACTPHONE != T_HOMEPHONE AND T_CONTACTPHONE != T_CELLPHONE AND T_CONTACTPHONE != '' THEN '3'
                                ELSE ''
                                 END Orders ,
                           CASE WHEN T_HOMEPHONE != '' THEN 1
                                ELSE 0
                                 END + CASE WHEN T_HOMEPHONE != T_CELLPHONE AND T_CELLPHONE != '' THEN 1
                                ELSE 0
                                 END + CASE WHEN T_CONTACTPHONE != T_HOMEPHONE AND T_CONTACTPHONE != T_CELLPHONE AND T_CONTACTPHONE != '' THEN 1
                                ELSE 0
                                 END Qty_Phone_Numbers ,
                           T_HOMEPHONE Cust_HOMEPHONE ,
                           CASE WHEN T_HOMEPHONE != T_CELLPHONE THEN T_CELLPHONE
                                ELSE ''
                                 END Cust_CELLPHONE ,
                           CASE WHEN T_CONTACTPHONE != T_HOMEPHONE AND T_CONTACTPHONE != T_CELLPHONE THEN T_CONTACTPHONE
                                ELSE ''
                                 END Cust_CONTACTPHONE ,
                           MAX(ds_policysummary_v2.POLICYSTATUS) POLICYSTATUS ,
                           MAX(ds_policysummary_v2.CUSTOMERNAME) CUSTOMERNAME ,
                           ds_policysummary_v2.ENDDATE AS STATUSDATE ,
                           MAX(IFNULL(ds_policysummary_v2.Last_EFFECTIVEDATE,ds_policysummary_v2.EFFECTIVEDATE)) EFFECTIVEDATE ,
                           MAX(IFNULL(ds_policysummary_v2.Last_EXPIRATIONDATE,ds_policysummary_v2.EXPIRATIONDATE)) EXPIRATIONDATE ,
                           MAX(ds_policysummary_v2.BIAPRIMARYAGENTOFFICE) BIAPrimaryAgentOffice ,
                           MAX(ds_policysummary_v2.PRODUCERFULLNAME) PRODUCERFULLNAME ,
                           MAX(ds_policysummary_v2.PRODUCERID) PRODUCERID
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2" ds_policysummary_v2
                      LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_CUSTOMER" ds_bvstg_ap1_customer
                        ON ds_policysummary_v2.CUSTOMERNO = ds_bvstg_ap1_customer.CustomerID
                       AND ds_policysummary_v2.CUSTOMERNO = 'AppOne'
                      LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_CUSTOMERSUMMARY_V2" DS_CustomerSummary_v2
                        ON ds_policysummary_v2.CUSTOMERID = DS_CustomerSummary_v2.CustomerID
                       AND DS_CustomerSummary_v2.SourceDB = 'CIGH'
                     WHERE ds_policysummary_v2.SOURCEDB IN ('AppOne','CIGH')
                       AND ds_policysummary_v2.ENDDATE>DATEADD('DAY',-60,CURRENT_DATE())
                       AND ds_policysummary_v2.ENDDATE <= CURRENT_DATE()
                       AND ds_policysummary_v2.BIAPRIMARYAGENTOFFICE != 'JOR'
                       AND ds_policysummary_v2.PRODUCERID != 'TEST'
                       AND STATUS_STANDARD ='Inactive'
                       AND ds_policysummary_v2.POLICYSTATUS like '%Cancelled%'
                       AND ds_policysummary_v2.TERM IN ('6 Months','1 Year','6','12')
                       AND ds_policysummary_v2.NEXT_TRANSACTIONID IS NULL
                       AND IFNULL(ds_policysummary_v2.Last_EXPIRATIONDATE,ds_policysummary_v2.EXPIRATIONDATE) > DATE(CURRENT_DATE())
                     GROUP BY NBTRANSACTIONID ,
                              IFNULL(ds_policysummary_v2.Last_POLICYID,ds_policysummary_v2.POLICYID) ,
                              ds_policysummary_v2.ENDDATE
                   )Contacts
              LEFT JOIN "RETAIL_DEV"."SCH_BVSTAGE"."V_DLBV_MKT_TIMEZONES_STATE" V_DLBV_MKT_TIMEZONES_STATE
                ON V_DLBV_MKT_TIMEZONES_STATE.StateCode = Contacts.CustomerState
              LEFT JOIN "RETAIL_DEV"."SCH_BVSTAGE"."V_DLBV_MKT_TIMEZONES" V_DLBV_MKT_TIMEZONES
                ON V_DLBV_MKT_TIMEZONES.timezonename = V_DLBV_MKT_TIMEZONES_STATE.TimeZone
             WHERE Qty_Phone_Numbers > 0 QUALIFY ROW_NUMBER() OVER (PARTITION BY TRANSACTIONID ORDER BY POLICYSTATUS DESC)=1
        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_POLICYSUMMARY_V2') }}
        name: V_PREB_BLENDED_IN_OUTBOUND
        noLinkRefs: []
