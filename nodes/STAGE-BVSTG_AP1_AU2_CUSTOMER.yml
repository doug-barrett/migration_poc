        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_AP1_CUSTOMER_REFRESH') }} bvstg_ap1_customer_refresh
              JOIN {{ ref('DATA_VAULT','H_CUSTOMER') }} h_customer
                ON h_customer.customerid = TO_CHAR(bvstg_ap1_customer_refresh.customerid)
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CUSTOMER_MROC_CURRENT') }} v_s_ap1_customer_mroc_current
                ON h_customer.HK_h_customer = v_s_ap1_customer_mroc_current.HK_h_customer
               AND v_s_ap1_customer_mroc_current.isrowdeleted = 0
              LEFT JOIN {{ ref('STAGE','V_S_AP1_POPULATION_MROC_CURRENT') }} v_s_ap1_population_mroc_current
                ON v_s_ap1_customer_mroc_current.populationid = v_s_ap1_population_mroc_current.populationid
               AND v_s_ap1_population_mroc_current.isrowdeleted = 0
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_CUSTOMERADDRESS') }} bvstg_ap1_au_CustomerAddress
                ON (h_customer.HK_h_customer = bvstg_ap1_au_CustomerAddress.HK_h_customer AND bvstg_ap1_au_CustomerAddress.addresstype = 'Mailing Address')
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_CUSTOMERADDRESS') }} bvstg_ap1_au_CustomerAddress_g
                ON (h_customer.HK_h_customer = bvstg_ap1_au_CustomerAddress_g.HK_h_customer AND bvstg_ap1_au_CustomerAddress_g.addresstype = 'Garage Address')
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_CUSTOMERADDRESS') }} bvstg_ap1_au_CustomerAddress_q
                ON h_customer.HK_h_customer = bvstg_ap1_au_CustomerAddress_q.HK_h_customer
               AND bvstg_ap1_au_CustomerAddress_q.addresstype = 'Quote Garaging Address'
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_CUSTOMERGENDER') }} bvstg_ap1_au_CustomerGender
                ON h_customer.HK_h_customer = bvstg_ap1_au_CustomerGender.HK_h_customer
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_CUSTOMERPHONE') }} bvstg_ap1_au_CustomerPhone
                ON (h_customer.HK_h_customer = bvstg_ap1_au_CustomerPhone.HK_h_customer AND bvstg_ap1_au_CustomerPhone.phonetype = 'Contact Phone')
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_CUSTOMERPHONE') }} bvstg_ap1_au_CustomerPhone_h
                ON (h_customer.HK_h_customer = bvstg_ap1_au_CustomerPhone_h.HK_h_customer AND bvstg_ap1_au_CustomerPhone_h.phonetype = 'Home Phone')
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_CUSTOMERPHONE') }} bvstg_ap1_au_CustomerPhone_c
                ON (h_customer.HK_h_customer = bvstg_ap1_au_CustomerPhone_c.HK_h_customer AND bvstg_ap1_au_CustomerPhone_c.phonetype = 'Cell Phone')
              LEFT JOIN {{ ref('DATA_VAULT','H_ORGANIZATION') }} h_organization
                ON v_s_ap1_customer_mroc_current.organizationid = h_organization.organizationid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_ORGANIZATION_MROC_CURRENT') }} v_s_ap1_organization_mroc_current
                ON h_organization.HK_h_organization = v_s_ap1_organization_mroc_current.HK_h_organization
               AND v_s_ap1_organization_mroc_current.isrowdeleted = 0
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_CUSTOMERADDRESS') }} bvstg_ap1_au_CustomerAddress_main
                ON (h_customer.HK_h_customer = bvstg_ap1_au_CustomerAddress_main.HK_h_customer AND bvstg_ap1_au_CustomerAddress_main.ismainaddress = '1')
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue
                ON v_s_ap1_customer_mroc_current.statusId = ref_ap1_codevalue.codevalueid
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_custtype
                ON v_s_ap1_customer_mroc_current.CustomerTypeId = ref_ap1_custtype.codevalueid
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_custDocumentLanguageType
                ON v_s_ap1_customer_mroc_current.CustomerDocumentLanguageTypeId = ref_ap1_custDocumentLanguageType.codevalueid
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_custVerbalLanguageType
                ON v_s_ap1_customer_mroc_current.CustomerVerbalLanguageTypeId = ref_ap1_custVerbalLanguageType.codevalueid
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_DATAMIGRATION_V2') }} v_preb_datamigration_v2
                ON (TO_VARCHAR(v_preb_datamigration_v2.AppOneID) = h_customer.customerid AND v_preb_datamigration_v2.migrationtype = 'Customer')
              LEFT JOIN ( SELECT a.DATAMIGRATIONID ,
                   b.SOURCEDATABASENAME ,
                   c.PROJECTNAME ,
                   DATE (b.datamigrationdateend) MIGRATIONDATE
              FROM {{ ref('DATA_VAULT','H_DATAMIGRATION') }} a
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_DATAMIGRATION') }} b
                ON a.hk_h_datamigration = b.hk_h_datamigration
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_MIGRATIONPROJECT') }} c
                ON c.middata
