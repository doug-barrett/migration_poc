    sourceMapping:
      - aliases:
          V_PREB_ACXIOM_INPUT_DATA: 5c009e2a-5a02-428a-8334-2389ab7766b4
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_ACXIOM_INPUT_DATA') }} AS SELECT DATE(DS_CUSTOMERSUMMARY_V2.CREATED) Date , DS_CUSTOMERSUMMARY_V2.CustomerID ,
                   DS_CUSTOMERSUMMARY_V2.SOURCEDB ,
                   DS_CUSTOMERSUMMARY_V2.FIRSTNAME ,
                   DS_CUSTOMERSUMMARY_V2.LASTNAME ,
                   coalesce(DS_CUSTOMERSUMMARY_V2.MAINSTREET,DS_CUSTOMERSUMMARY_V2.MAILINGSTREET) MAINSTREET ,
                   coalesce(DS_CUSTOMERSUMMARY_V2.MAINCITY,DS_CUSTOMERSUMMARY_V2.MAILINGCITY) MAINCITY ,
                   LEFT(coalesce(DS_CUSTOMERSUMMARY_V2.MAINSTATE,DS_CUSTOMERSUMMARY_V2.MAILINGSTATE),20) MAINSTATE ,
                   coalesce(DS_CUSTOMERSUMMARY_V2.MAINZIP,DS_CUSTOMERSUMMARY_V2.MAILINGZIP) MAINZIP ,
                   coalesce(DS_CUSTOMERSUMMARY_V2.HOMEPHONE,DS_CUSTOMERSUMMARY_V2.CELLPHONE,DS_CUSTOMERSUMMARY_V2.CONTACTPHONE) PHONE ,
                   DS_CUSTOMERSUMMARY_V2.EMAIL ,
                   DS_CUSTOMERSUMMARY_V2_MISSING.DataType
              FROM "RETAIL_PROD"."SCH_EDW"."DS_CUSTOMERSUMMARY_V2" DS_CUSTOMERSUMMARY_V2
             INNER JOIN(
                    --All the missing customer for this year
             SELECT DS_CUSTOMERSUMMARY_V2.CUSTOMERID ,
                           DS_CUSTOMERSUMMARY_V2.SourceDB ,
                           CASE WHEN CUSTOMER_STATUS ='AdditionalProduct Active' THEN 'Active'
                                WHEN CUSTOMER_STATUS ='Inactive'                 THEN 'Cancelled/Expired'
                                ELSE CUSTOMER_STATUS
                                 END DataType
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_CUSTOMERSUMMARY_V2" DS_CUSTOMERSUMMARY_V2
                      LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_ACXIOM_DATA" V_ACXIOM_DATA
                        ON V_ACXIOM_DATA.CUSTOMERID = DS_CUSTOMERSUMMARY_V2.CUSTOMERID
                       AND V_ACXIOM_DATA.SOURCEDB = DS_CUSTOMERSUMMARY_V2.SOURCEDB
                     WHERE V_ACXIOM_DATA.CustomerID IS NULL
                       AND DATE(CREATED) >='2022-01-01'
                       AND DATE(CREATED) <= CURRENT_DATE()
                     UNION --All the Reactived Customer created in previus years
             SELECT DS_CUSTOMERSUMMARY_V2.CustomerID ,
                           DS_CUSTOMERSUMMARY_V2.SourceDB ,
                           'Active' DataType
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2" DS_POLICYSUMMARY_V2
                     INNER JOIN "RETAIL_PROD"."SCH_EDW"."DS_CUSTOMERSUMMARY_V2" DS_CUSTOMERSUMMARY_V2
                        ON DS_POLICYSUMMARY_V2.CUSTOMERID = DS_CUSTOMERSUMMARY_V2.CUSTOMERID
                       AND DS_POLICYSUMMARY_V2.SOURCEDB = DS_CUSTOMERSUMMARY_V2.SOURCEDB
                       AND DATE(DS_CUSTOMERSUMMARY_V2.CREATED) <'2022-01-01'
                      LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_ACXIOM_DATA" V_ACXIOM_DATA
                        ON V_ACXIOM_DATA.CUSTOMERID = DS_CUSTOMERSUMMARY_V2.CUSTOMERID
                       AND V_ACXIOM_DATA.SOURCEDB = DS_CUSTOMERSUMMARY_V2.SOURCEDB
                     WHERE V_ACXIOM_DATA.CustomerID IS NULL
                       AND DATE(DS_POLICYSUMMARY_V2.STARTDATE) >='2022-01-01'
                       AND DATE(DS_POLICYSUMMARY_V2.STARTDATE) <= CURRENT_DATE()
                     UNION --All the Cancelled Customers created in previus years
             SELECT DS_CUSTOMERSUMMARY_V2.CustomerID ,
                           DS_CUSTOMERSUMMARY_V2.SourceDB ,
                           'Cancelled/Expired' DataType
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2" DS_POLICYSUMMARY_V2
                     INNER JOIN "RETAIL_PROD"."SCH_EDW"."DS_CUSTOMERSUMMARY_V2" DS_CUSTOMERSUMMARY_V2
                        ON DS_POLICYSUMMARY_V2.CUSTOMERID = DS_CUSTOMERSUMMARY_V2.CUSTOMERID
                       AND DS_POLICYSUMMARY_V2.SOURCEDB = DS_CUSTOMERSUMMARY_V2.SOURCEDB
                       AND DATE(DS_CUSTOMERSUMMARY_V2.CREATED) <'2022-01-01'
                      LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_ACXIOM_DATA" V_ACXIOM_DATA
                        ON V_ACXIOM_DATA.CUSTOMERID = DS_CUSTOMERSUMMARY_V2.CUSTOMERID
                       AND V_ACXIOM_DATA.SOURCEDB = DS_CUSTOMERSUMMARY_V2.SOURCEDB
                     WHERE V_ACXIOM_DATA.CustomerID IS NULL
                       AND DATE(DS_POLICYSUMMARY_V2.ENDDATE) >='2022-01-01'
                       AND DATE(DS_POLICYSUMMARY_V2.ENDDATE) <= CURRENT_DATE()
                   )DS_CUSTOMERSUMMARY_V2_MISSING
                ON DS_CUSTOMERSUMMARY_V2_MISSING.CUSTOMERID = DS_CUSTOMERSUMMARY_V2.CUSTOMERID
               AND DS_CUSTOMERSUMMARY_V2_MISSING.SOURCEDB = DS_CUSTOMERSUMMARY_V2.SOURCEDB
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_ACXIOM_DATA" V_ACXIOM_DATA
                ON V_ACXIOM_DATA.CUSTOMERID = DS_CUSTOMERSUMMARY_V2.CUSTOMERID
               AND V_ACXIOM_DATA.SOURCEDB = DS_CUSTOMERSUMMARY_V2.SOURCEDB
             WHERE V_ACXIOM_DATA.CUSTOMERID IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY DS_CUSTOMERSUMMARY_V2.CUSTOMERID,DS_CUSTOMERSUMMARY_V2.SOURCEDB ORDER BY DS_CUSTOMERSUMMARY_V2.CREATED DESC)=1
        dependencies:
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }}
        name: V_PREB_ACXIOM_INPUT_DATA
        noLinkRefs: []
