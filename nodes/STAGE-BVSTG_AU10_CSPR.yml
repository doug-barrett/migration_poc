          DS_RETAIL_OFFICE: 581aed87-ec65-482f-aa6f-9a04a9d54476
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU8_CSPR
          - locationName: STAGE
            nodeName: BVSTG_AU9_CSPR
          - locationName: STAGE
            nodeName: V_PRED_MONTHS
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU6_ACCRUAL_REPORT
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_AU7_ACCRUAL_REPORT
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU8_CSPR') }} AS BVSTG_AU8_CSPR
              FULL JOIN (
                    SELECT asofmonth,
                           ifnull(ds_retail_office.ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS, bvstg_au9_cspr.officecode) officecode,
                           sum(Commission) Commission,
                           sum(Premium) Premium
                      FROM (
                            SELECT ifnull(bvstg_au9_cspr.asofmonth, v_pred_months.asofmonth) asofmonth,
                                   ifnull(bvstg_au9_cspr.officecode, v_pred_months.officecode) officecode,
                                   ifnull(bvstg_au9_cspr.Commission, 0) Commission,
                                   ifnull(bvstg_au9_cspr.Premium, 0) Premium
                              FROM (
                                    SELECT DISTINCT officecode_final AS officecode,

                                     MONTH AS asofmonth
                                      FROM (
                                            SELECT officecode_final,
                                                   min_month,
                                                   max_month
                                              FROM (
                                                    SELECT DISTINCT officecode_final,
                                                           min(executionmonth) min_month,
                                                           max(executionmonth) max_month
                                                      FROM {{ ref('STAGE','BVSTG_AU9_CSPR') }}
                                                     GROUP BY officecode_final
                                                   )
                                           ) bvstg_au9_cspr
                                     CROSS JOIN (
                                            SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR, CAL_MONTH_NO, 1)
                                             MONTH
                                              FROM {{ ref('STAGE','V_PRED_MONTHS') }}
                                             WHERE CAL_YEAR >= 2021
                                               AND (CASE WHEN day(CURRENT_DATE ()) < 15 THEN DATE_FROM_PARTS(CAL_YEAR, CAL_MONTH_NO, 1) <= dateadd(MONTH, - 2, date_trunc('month', CURRENT_DATE ())) ELSE DATE_FROM_PARTS(CAL_YEAR, CAL_MONTH_NO, 1) <= dateadd(MONTH, - 1, date_trunc('month', CURRENT_DATE ())) END)
                                           ) v_pred_months
                                   ) v_pred_months
                              LEFT JOIN (
                                    SELECT asofmonth,
                                           officecode,
                                           sum(actualcommission) AS commission,
                                           sum(premium) AS premium
                                      FROM (
                                            SELECT executionmonth AS asofmonth,
                                                   officecode_final AS officecode,
                                                   actualcommission,
                                                   premium
                                              FROM {{ ref('STAGE','BVSTG_AU9_CSPR') }}
                                         UNION ALL SELECT asofmonth,
                                                   officecode,
                                                   ACTUAL_COMMISSION,
                                                   TOTAL_PREMIUM
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU6_ACCRUAL_REPORT') }}
                                         UNION ALL SELECT asofmonth,
                                                   officecode,
                                                   ACTUAL_COMMISSION,
                                                   TOTAL_PREMIUM
                                              FROM {{ ref('STAGE','DS_BVSTG_COMM_AU7_ACCRUAL_REPORT') }}
                                           )
                                     GROUP BY asofmonth,
                                              officecode
                                   ) bvstg_au9_cspr
                                ON V_PRED_MONTHS.asofmonth = bvstg_au9_cspr.asofmonth
                               AND V_PRED_MONTHS.officecode = bvstg_au9_cspr.officecode
                           ) bvstg_au9_cspr
                      LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE
                        ON ifnull(lower(bvstg_au9_cspr.OFFICECODE), '-') = ifnull(lower(ds_retail_office.OFFICECODE), '-')
                     GROUP BY asofmonth,
                              ifnull(ds_retail_office.ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS, bvstg_au9_cspr.officecode)
                   ) BVSTG_AU9_CSPR
                ON ifnull(BVSTG_AU8_CSPR.OFFICECODE, '-') = ifnull(BVSTG_AU9_CSPR.OFFICECODE, '-')
               AND BVSTG_AU8_CSPR.ASOFMONTH = BVSTG_AU9_CSPR.ASOFMONTH
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE
                ON ifnull(lower(BVSTG_AU9_CSPR.OFFICECODE), '-') = ifnull(lower(DS_RETAIL_OFFICE.OFFICECODE), '-')
