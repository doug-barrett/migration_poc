      description: REVENUE TYPE (MOSTLY USED AS INPUT TO PREPARE NEXT YEAR'S BUDGET)
      name: REVENUE_TYPE
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: "CASE--UC\n\\N    --WHEN BUYER=UC AND PPA=UC, THEN \"SOLICITATION\"\
          \n\\N    WHEN ACCOUNTHIERARCHY_OMNIA.LEVEL1FORCEID IN(4052007,4052114,4052124,4052141,4052148,4052176,4052197,4052232,4052381,4055673,4057670)\n\
          \\N     AND ZEROIFNULL(CONTRACT.PPA_LEVEL_1_FORCEID) IN(4055673) \n\\N \
          \   THEN 'UC SOLICITATION'\n\\N    --WHEN BUYER=UC AND PPA<>UC, THEN \"\
          ADOPTION\"\n\\N    WHEN ACCOUNTHIERARCHY_OMNIA.LEVEL1FORCEID IN(4052007,4052114,4052124,4052141,4052148,4052176,4052197,4052232,4052381,4055673,4057670)\n\
          \\N     AND ZEROIFNULL(CONTRACT.PPA_LEVEL_1_FORCEID) NOT IN(4055673) \n\\\
          N    THEN 'UC ADOPTION'\n\\N    --WHEN BUYER<>UC AND PPA=UC, THEN \"SYNDICATION\"\
          \n\\N    WHEN ACCOUNTHIERARCHY_OMNIA.LEVEL1FORCEID NOT IN(4052007,4052114,4052124,4052141,4052148,4052176,4052197,4052232,4052381,4055673,4057670)\n\
          \\N     AND ZEROIFNULL(CONTRACT.PPA_LEVEL_1_FORCEID) IN(4055673) \n\\N \
          \   THEN 'UC SYNDICATION'\n\\N    --\n\\N    ELSE\n\\N        CASE \n\\\
          N            WHEN SALESTERRITORY.TERRITORYGROUPNAME LIKE '%ISO%PUBLIC%'\
          \  THEN 'ISO PUBLIC'\n\\N            WHEN SALESTERRITORY.TERRITORYGROUPNAME\
          \ LIKE '%ISO%PRIVATE%' THEN 'ISO PRIVATE'\n\\N            ELSE SALESTERRITORY.TERRITORYDIVISIONNAME\n\
          \\N        END\n\\NEND"
