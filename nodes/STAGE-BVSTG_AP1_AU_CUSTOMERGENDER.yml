        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT S_AP1_CUSTOMER_MROC.HK_h_customer AS HK_h_customer ,
                   S_AP1_CUSTOMER_MROC.customerid AS customerid ,
                   REF_AP1_CODEVALUE.codevalue AS Gender ,
                   IFNULL(S_AP1_LEADDRIVER.isexcluded,'False') isexcluded ,
                   CASE WHEN LOWER(S_AP1_CUSTOMER_MROC.CUSTOMERFORMATTEDNAME) like '%' || LOWER(S_AP1_LEADDRIVER.FIRSTNAME) || '%' AND LOWER(S_AP1_CUSTOMER_MROC.CUSTOMERFORMATTEDNAME) like '%' || LOWER(S_AP1_LEADDRIVER.LASTNAME) || '%' THEN 1
                        ELSE 2
                         END is_Match
              FROM {{ ref('STAGE','BVSTG_AP1_CUSTOMER_REFRESH') }} BVSTG_AP1_CUSTOMER_REFRESH
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_CUSTOMER_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_CUSTOMER ORDER BY dss_start_date DESC) = 1
                   ) S_AP1_CUSTOMER_MROC
                ON S_AP1_CUSTOMER_MROC.CUSTOMERID = BVSTG_AP1_CUSTOMER_REFRESH.CUSTOMERID
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY hk_h_lead ORDER BY dss_start_date DESC) = 1
                   ) S_AP1_LEAD_MROC
                ON S_AP1_CUSTOMER_MROC.CUSTOMERID = S_AP1_LEAD_MROC.CUSTOMERID
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_LEADDRIVER') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY hk_h_leaddriver ORDER BY dss_start_date DESC) = 1
                   ) S_AP1_LEADDRIVER
                ON S_AP1_LEAD_MROC.LeadID = S_AP1_LEADDRIVER.LeadID
               AND S_AP1_LEADDRIVER.isrowdeleted='False'
               AND IFNULL(S_AP1_LEADDRIVER.isexcluded,'False')= 'False'
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} REF_AP1_CODEVALUE
                ON REF_AP1_CODEVALUE.codevalueid = S_AP1_LEADDRIVER.gender QUALIFY ROW_NUMBER() OVER (PARTITION BY BVSTG_AP1_CUSTOMER_REFRESH.CustomerID ORDER BY CASE WHEN IFNULL(REF_AP1_CODEVALUE.CODEVALUE,'') IN('M','F') THEN 1 ELSE 2 END, CASE WHEN LOWER(S_AP1_CUSTOMER_MROC.CUSTOMERFORMATTEDNAME) like '%' || LOWER(S_AP1_LEADDRIVER.FIRSTNAME) || '%' THEN 1 ELSE 2 END, CASE WHEN LOWER(S_AP1_CUSTOMER_MROC.CUSTOMERFORMATTEDNAME) like '%' || LOWER(S_AP1_LEADDRIVER.LASTNAME) || '%' THEN 1 ELSE 2 END) = 1
             UNION SELECT DISTINCT S_AP1_CUSTOMER_MROC.HK_h_customer AS HK_h_customer ,
                   S_AP1_CUSTOMER_MROC.customerid AS customerid ,
                   REF_AP1_CODEVALUE.codevalue AS Gender ,
                   S_AP1_POLICYDRIVER_MROC.isexcluded AS isexcluded ,
                   CASE WHEN LOWER(S_AP1_CUSTOMER_MROC.CUSTOMERFORMATTEDNAME) like '%' || LOWER(S_AP1_POLICYDRIVER_MROC.FIRSTNAME) || '%' AND LOWER(S_AP1_CUSTOMER_MROC.CUSTOMERFORMATTEDNAME) like '%' || LOWER(S_AP1_POLICYDRIVER_MROC.LASTNAME) || '%' THEN 1
                        ELSE 2
                         END is_Match
              FROM {{ ref('STAGE','BVSTG_AP1_CUSTOMER_REFRESH') }} BVSTG_AP1_CUSTOMER_REFRESH
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_CUSTOMER_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_CUSTOMER ORDER BY dss_start_date DESC) = 1
                   ) S_AP1_CUSTOMER_MROC
                ON S_AP1_CUSTOMER_MROC.CUSTOMERID = BVSTG_AP1_CUSTOMER_REFRESH.CUSTOMERID
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_TRANSACTION_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY hk_h_transaction ORDER BY dss_start_date DESC) = 1
                   ) S_AP1_TRANSACTION_MROC
                ON S_AP1_CUSTOMER_MROC.CUSTOMERID = S_AP1_TRANSACTION_MROC.CUSTOMERID
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_POLICYVERSION_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY hk_h_POLICYVERSION ORDER BY dss_start_date DESC) = 1
                   ) S_AP1_POLICYVERSION_MROC
                ON S_AP1_POLICYVERSION_MROC.TRANSACTIONID = S_AP1_TRANSACTION_MROC.TRANSACTIONID
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','S_AP1_POLICYDRIVER_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY hk_h_POLICYDRIVER ORDER BY dss_start_date DESC) = 1
                   ) S_AP1_POLICYDRIVER_MROC
                ON S_AP1_POLICYVERSION_MROC.POLICYVERSIONID = S_AP1_POLICYDRIVER_MROC.POLICYVERSIONID
               AND S_AP1_POLICYDRIVER_MROC.isrowdeleted=0
