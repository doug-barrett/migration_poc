        nodeName: REGION_A
      - locationName: BRONZE
        nodeName: REGION_I
      - locationName: BRONZE
        nodeName: MARKET_S
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'CDC_SYSLOCFL') }} "CDC_SYSLOCFL"
          LEFT JOIN {{ ref('GOLD', 'DV_LOCATION') }} "DV_LOCATION"
            ON   "CDC_SYSLOCFL"."ZLCMP" = "DV_LOCATION"."COMPANY_CODE"
          AND "CDC_SYSLOCFL"."ZLLOC" = "DV_LOCATION"."LOCATION_CODE"
          LEFT JOIN {{ ref('GOLD', 'REGION') }} "REGION"
            ON   "CDC_SYSLOCFL"."ZLCMP" = "REGION_A"."COMPANY_CODE"
          AND "CDC_SYSLOCFL"."ZLARGN" = "REGION_A"."REGION_CODE"
          AND "REGION_A"."DSS_CURRENT_FLAG" = 'Y'
          LEFT JOIN {{ ref('GOLD', 'REGION') }} "REGION_I"
            ON   "CDC_SYSLOCFL"."ZLCMP" = "REGION_I"."COMPANY_CODE"
          AND "CDC_SYSLOCFL"."ZLIRGN" = "REGION_I"."REGION_CODE"
          AND "REGION_I"."DSS_CURRENT_FLAG" = 'Y'
          LEFT JOIN {{ ref('GOLD', 'MARKET') }} "MARKET"
            ON   "CDC_SYSLOCFL"."ZLCMP" = "MARKET"."COMPANY_CODE"
          AND "CDC_SYSLOCFL"."ZLMRKT" = "MARKET"."MARKET_CODE"
          AND "MARKET"."DSS_CURRENT_FLAG" = 'Y'
          AND "MARKET"."MARKET_TYPE_CODE" = 'R'
          LEFT JOIN {{ ref('GOLD', 'MARKET') }} "MARKET_S"
            ON   "CDC_SYSLOCFL"."ZLCMP" = "MARKET_S"."COMPANY_CODE"
          AND "CDC_SYSLOCFL"."ZLMRKT" = "MARKET_S"."MARKET_CODE"
          AND "MARKET_S"."DSS_CURRENT_FLAG" = 'Y'
          AND "MARKET_S"."MARKET_TYPE_CODE" = 'S'
          LEFT JOIN {{ ref('GOLD', 'DISTRICT') }} "DISTRICT"
            ON   "CDC_SYSLOCFL"."ZLCMP" = "DISTRICT"."COMPANY_CODE"
          AND "CDC_SYSLOCFL"."ZLDIST" = "DISTRICT"."DISTRICT_CODE"
