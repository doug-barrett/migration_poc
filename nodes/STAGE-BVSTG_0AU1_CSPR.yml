    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          DS_RAM_RETAIL_REPOSITORY: d29a0c5c-e296-46c4-bc55-861d60fe906d
          DS_COMM_EOM_EXTRACT_ALLSOURCES: 4b167131-73f4-442b-9d87-46ebf7c92976
          BVSTG_COMM_AU4_DASHBOARD_EXTRACT: c6e8cb8a-0fa0-4a8e-94aa-538c609c0659
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: EDW
            nodeName: DS_COMM_EOM_EXTRACT_ALLSOURCES
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU4_DASHBOARD_EXTRACT
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT ifnull(ram_retail.asofmonth,allsource.asofmonth) AsofMonth,
                   ifnull(ram_retail.Officecode, allsource.Officecode) Officecode,
                   Total_Ancillary_Amount,
                   Total_Fee_Amount,
                   TOTALNEWPOLICY,
                   PIF,
                   renewals
              FROM (
                    SELECT date_trunc('month',date(createddate)) asofmonth,
                           officecode,
                           SUM(CASE WHEN Classification = 'Ancillary' THEN Amount ELSE 0 END) Total_Ancillary_Amount,
                           SUM(CASE WHEN Classification IN ('Fee','Service Transactions Fee') THEN Amount ELSE 0 END) Total_Fee_Amount,
                           SUM(CASE WHEN (Label IN ('New Business Auto','New Business Complementary') AND (islegacytransaction IS NULL OR islegacytransaction <> 'Migrated')) THEN COUNTER ELSE 0 END) TOTALNEWPOLICY
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                     GROUP BY date_trunc('month',date(createddate)),
                              officecode
                   ) ram_retail
              FULL JOIN (SELECT ds_comm_eom_extract_allsources.OfficeCode,
                   ds_comm_eom_extract_allsources.AsofMonth,
                   sum(ifnull(ds_comm_eom_extract_allsources.PIF,0)) PIF,
                   sum(ifnull(ds_comm_eom_extract_allsources.renewals,0)) renewals
              FROM (SELECT *
              FROM (
                    SELECT officecode,
                           producer,
                           asofmonth,
                           policysource,
                           lineofbusiness,
                           carrier,
                           count(DISTINCT policynumberformatted, carrier) PIF,
                           sum(isrenewalmonth) renewals
                      FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}
                     WHERE combinedstatus_eom = 'Active'
                       AND (asofmonth <> date_trunc('month', add_months(current_date(), -1)) OR carrier NOT IN (SELECT DISTINCT carrier FROM {{ ref('STAGE','BVSTG_COMM_AU4_DASHBOARD_EXTRACT') }}))
                     GROUP BY officecode,
                              producer,
                              asofmonth,
                              policysource,
                              lineofbusiness,
                              carrier
                   )
            UNION ALL (SELECT OfficeCode,
                   Producer,
                   AsofMonth,
                   PolicySource,
                   LineOfBusiness,
                   ds_comm_eom_extract_allsources.Carrier,
                   ifnull(BOM + NBS - round(BOM * CancellationRate_MovingAverage) - round(BOM * PendingRenewalRate_MovingAverage) + round(round(BOM * PendingRenewalRate_MovingAverage)*RenewalRAte_MovingAverage) + round(BOM * ReinstatementRate_MovingAverage), 0) PIF,
                   round(round(BOM * PendingRenewalRate_MovingAverage)*RenewalRAte_MovingAverage) renewals
              FROM (SELECT ifnull(a.officecode, b.officecode) OfficeCode,
                   ifnull(a.producer, b.producer) producer,
                   ifnull(a.asofmonth, b.nbsmonth) asofmonth,
                   ifnull(a.policysource, b.policysource) policysource,
                   ifnull(a.lineofbusiness, b.lineofbusiness) LineOfBusiness,
                   ifnull(a.carrier, b.carrier) Carrier,
                   ifnull(BOM, 0) BOM,
                   ifnull(NBS,0) NBS
              FROM (
                    SELECT officecode,
                           producer,
                           asofmonth,
                           policysource,
                           lineofbusiness,
                           carrier,
                           count(DISTINCT policynumberformatted, carrier) BOM
                      FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}
                     WHERE combinedstatus_bom = 'Active'
                       AND asofmonth = date_trunc('month', add_months(current_date(), -1))
                       AND carrier IN (
                            SELECT DISTINCT carrier
                              FROM {{ ref('STAGE','BVSTG_COMM_AU4_DASHBOARD_EXTRACT') }}
                           )
                     GROUP BY officecode,
                              producer,
                              asofmonth,
                              policysource,
                              lineofbusiness,
                              carrier
                   ) a
              FULL OUTER JOIN (
                    SELECT officecode,
                           producer,
                           nbsmonth,
                           policysource,
                           lineofbusiness,
                           carrier,
                           count(DISTINCT policynumberformatted, carrier) NBS
                      FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}
                     WHERE nbsmonth = date_trunc('month', add_months(current_date(), -1))
                       AND carrier IN (
                            SELECT DISTINCT carrier
                              FROM {{ ref('STAGE','BVSTG_COMM_AU4_DASHBOARD_EXTRACT') }}
                           )
                     GROUP BY officecode,
                              producer,
                              nbsmonth,
                              policysource,
                              lineofbusiness,
                              carrier
                   ) b
                ON ifnull(a.officecode, '-') = ifnull(b.officecode, '-')
               AND ifnull(a.producer, '-') = ifnull(b.producer, '-')
               AND a.asofmonth = b.nbsmonth
               AND a.policysource = b.policysource
               AND a.lineofbusiness = b.lineofbusiness
               AND a.carr
