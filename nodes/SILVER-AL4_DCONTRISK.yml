      join:
        joinCondition: '-- FROM AL4_DCONTRISK (source node not generated)

          LEFT JOIN {{ ref(''BRONZE'', ''DW_CONTRACT'') }} dw_contract ON /* TODO join key (Joiner) */ 1=1

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PARTY'') }} dw_party ON dw_party.PARTY_ID = al4_dcontrisk.PARTY_ID AND dw_party.PRODUCT_SYSTEM_CODE = al4_dcontrisk.PRODUCT_SYSTEM_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_CLOSE_TYPE'') }} dw_close_type ON dw_close_type.CLOSE_TYPE_CODE = al4_dcontrisk.PAS_CLOSE_TYPE_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''SMOKER_STATUS_CODE'') }} smoker_status_code ON smoker_status_code.SMOKER_STATUS_CODE = al4_dcontrisk.SMOKER_STATUS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_STATUS_CODE'') }} risk_status_code ON risk_status_code.RISK_STATUS_CODE = al4_dcontrisk.RISK_STATUS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''FREQ_CODE'') }} freq_code ON freq_code.FREQ_CODE = al4_dcontrisk.FREQ_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''OCUPTN_CLASS'') }} ocuptn_class ON ocuptn_class.OCUPTN_CLASS_CODE = al4_dcontrisk.OCUPTN_CLASS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT_OPTION'') }} dw_product_option ON dw_product_option.PRODUCT_KEY = al4_dcontrisk.PRODUCT_KEY AND dw_product_option.PRODUCT_OPTION_CODE = al4_dcontrisk.RISK_OPTION_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''BENEFIT_PERIOD'') }} benefit_period ON benefit_period.CODESC_CODE = al4_dcontrisk.BENEFIT_PERIOD

          LEFT JOIN {{ ref(''BRONZE'', ''RISK_CMSN_CODE'') }} risk_cmsn_code ON risk_cmsn_code.CODESC_CODE = al4_dcontrisk.RISK_CMSN_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_REINSURANCE_TYPE'') }} dw_reinsurance_type ON dw_reinsurance_type.REINSURANCE_TYPE_CODE = al4_dcontrisk.REINSURANCE_TYPE_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''ASSESS_CODE'') }} assess_code ON assess_code.ASSESS_CODE = al4_dcontrisk.ASSESS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''INDEX_REFUSAL_FLG'') }} index_refusal_flg ON index_refusal_flg.CODESC_CODE = al4_dcontrisk.INDEX_REFUSAL_FLG

          LEFT JOIN {{ ref(''BRONZE'', ''PREMIUM_STATUS'') }} premium_status ON premium_status.CODESC_CODE = al4_dcontrisk.PREMIUM_STATUS

          LEFT JOIN {{ ref(''BRONZE'', ''CAMPAIGN_CODE'') }} campaign_code ON campaign_code.CODESC_CODE = al4_dcontrisk.CAMPAIGN_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''SPECIAL_EVENTS_CODE'') }} special_events_code ON special_events_code.CODESC_CODE = al4_dcontrisk.SPECIAL_EVENTS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_REINS_ARRNGMT_CODE'') }} dw_reins_arrngmt_code ON dw_reins_arrngmt_code.REINS_ARRANGEMENT_CODE = al4_dcontrisk.REINS_ARRNGMT_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''PENDULUM_LEVEL'') }} pendulum_level ON pendulum_level.CODESC_CODE = al4_dcontrisk.PENDULUM_LEVEL

          LEFT JOIN {{ ref(''BRONZE'', ''DW_TPD_PAYOUT_OPTION'') }} dw_tpd_payout_option ON dw_tpd_payout_option.CODESC_CODE = al4_dcontrisk.TPD_PAYOUT_OPTION

          LEFT JOIN {{ ref(''BRONZE'', ''DW_TPD_DEFN_TYPE'') }} dw_tpd_defn_type ON dw_tpd_defn_type.CODE = al4_dcontrisk.TPD_DEFN_TYPE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_INDMNTY_TYPE'') }} dw_indmnty_type ON dw_indmnty_type.CODESC_CODE = al4_dcontrisk.INDMNTY_TYPE_CODE'
