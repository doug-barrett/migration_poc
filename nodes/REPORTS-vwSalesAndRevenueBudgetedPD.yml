      dependencies:
      - locationName: FACT
        nodeName: RevenueBudgetPD
      - locationName: DIM
        nodeName: RevenueBudgetPDDetail
      - locationName: DIM
        nodeName: DimReceiptDate
      - locationName: DIM
        nodeName: Contract
      - locationName: DIM
        nodeName: Supplier
      - locationName: FACT
        nodeName: SalesAndRevenue
      - locationName: DIM
        nodeName: Solicitation
      join:
        joinCondition: |-
          FROM {{ ref('FACT', 'RevenueBudgetPD') }} "RevenueBudgetPD"
          LEFT JOIN {{ ref('DIM', 'RevenueBudgetPDDetail') }} "RevenueBudgetPDDetail"
            ON RevenueBudgetPD.RevenueBudgetPDDetailKey = RevenueBudgetPDDetail.RevenueBudgetPDDetailKey
          LEFT JOIN {{ ref('DIM', 'DimReceiptDate') }} "DimReceiptDate"
            ON DimReceiptDate.ReceiptDateKey = RevenueBudgetPD.BudgetDateKey
          LEFT JOIN {{ ref('DIM', 'Contract') }} "Contract"
            ON Contract.ContractKey = RevenueBudgetPD.ContractKey
          LEFT JOIN {{ ref('DIM', 'Supplier') }} "Supplier"
            ON Supplier.SupplierKey = Contract.SupplierKey --
          LEFT JOIN {{ ref('FACT', 'SalesAndRevenue') }} "SalesAndRevenue"
            ON RevenueBudgetPD.ContractKey = SalesAndRevenue.ContractKey AND RevenueBudgetPD.BudgetDateKey = SalesAndRevenue.ReceiptDateKey
          LEFT JOIN {{ ref('DIM', 'Solicitation') }} "Solicitation"
            ON RevenueBudgetPD.ContractId = Solicitation.SolicitationNumber
          WHERE  SalesAndRevenue.ContractKey IS NULL
