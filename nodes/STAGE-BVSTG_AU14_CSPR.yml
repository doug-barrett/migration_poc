        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU11_CSPR
          - locationName: STAGE
            nodeName: V_DLBV_OSM_MEMBER_CURRENT
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: STAGE
            nodeName: BVSTG_AU12_CSPR
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT ud2id,
                   ud2id_description,
                   name,
                   CASE WHEN transformation_required = 'yes' THEN corporateofficenumber_name
                        ELSE Corporate_number
                         END AS Corporate_number,
                   Officecode_ud2id,
                   CASE WHEN transformation_required = 'yes' THEN ds_retail_office.officecode
                        ELSE bvstg_au11_cspr.officecode_corporate
                         END AS officecode_corporate,
                   officecode_officename,
                   CASE WHEN transformation_required = 'yes' THEN ds_retail_office.officecode
                        ELSE bvstg_au11_cspr.Officecodes
                         END AS Officecodes,
                   CASE WHEN transformation_required = 'yes' AND ds_retail_office.officecode IS NOT NULL THEN '2'
                        ELSE bvstg_au11_cspr.prefrence_order
                         END AS prefrence_order
              FROM (
                    SELECT *,
                           CASE WHEN OFFICECODE_UD2ID IS NULL AND OFFICECODES IS NULL THEN 'yes'
                                ELSE 'no'
                                 END AS transformation_required,
                           REGEXP_SUBSTR(NAME, '\\d+$') AS corporateofficenumber_name
                      FROM (
                            SELECT DISTINCT ud2id,
                                   ud2id_description,
                                   member.name ,
                                   ifnull(nullif((split_part(split_part(replace(UD2ID_DESCRIPTION,' - ','-'),'-',2),' ',1)),''), (ifnull(nullif(ltrim(ifnull(nullif(split_part(member.name,'_',2),' '),member.name),'0'),''),member.name))) AS Corporate_number ,
                                   CASE WHEN ud2id_description like '(%)%' THEN replace(split_part(ud2id_description,')',1),'(')
                                         END Officecode_ud2id ,
                                   DS_RETAIL_OFFICE.Officecode officecode_corporate ,
                                   DS_RETAIL_OFFICE_v2.Officecode officecode_officename ,
                                   ifnull(CASE WHEN ud2id_description like '(%)%' THEN nullif(replace(split_part(ud2id_description,')',1),'('),'') END, ifnull(DS_RETAIL_OFFICE.Officecode, ifnull(DS_RETAIL_OFFICE_v2.Officecode, CASE WHEN lower(ud2id_description) like '%online binding%' OR lower(ud2id_description) like '%web dep%'THEN 'OLB' WHEN lower(ud2id_description) like '%house%' THEN 'House' WHEN lower(ud2id_description) like '%admin%' THEN 'Admin' WHEN lower(ud2id_description) like '%call%center%' THEN 'Call-Center' END))) Officecodes ,
                                   CASE WHEN ud2id_description like '(%)%'                                                                 THEN 1
                                        WHEN DS_RETAIL_OFFICE.Officecode IS NOT NULL                                                       THEN 2
                                        WHEN DS_RETAIL_OFFICE_v2.Officecode IS NOT NULL                                                    THEN 3
                                        WHEN lower(ud2id_description) like '%house%'                                                       THEN 1
                                        WHEN lower(ud2id_description) like '%admin%'                                                       THEN 1
                                        WHEN lower(ud2id_description) like '%online binding%' OR lower(ud2id_description) like '%web dep%'THEN 1
                                        WHEN lower(ud2id_description) like '%call%center%'                                                 THEN 1
                                         END prefrence_order
                              FROM {{ ref('STAGE','BVSTG_AU11_CSPR') }} bvstg_au11_cspr
                              LEFT JOIN {{ ref('STAGE','V_DLBV_OSM_MEMBER_CURRENT') }} member
                                ON bvstg_au11_cspr.ud2id = member.memberid
                              LEFT JOIN (
                                    SELECT CORPORATEOFFICENUMBER,
                                           OFFICECODE
                                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                                     WHERE CORPORATEOFFICENUMBER NOT IN (
                                            SELECT CORPORATEOFFICENUMBER
                                              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                                             WHERE LOCATIONSTATUS='Open'
                                             GROUP BY CORPORATEOFFICENUMBER
                                            HAVING count(*) <> 1
                                           ) QUALIFY row_number() OVER (PARTITION BY corporateofficenumber ORDER BY isactive DESC, ifnull(officecloseddate,'2050-12-31') DESC, officeopeneddate DESC) = 1
                                   ) DS_RETAIL_OFFICE
                                ON ltrim(ifnull(nullif(split_part(member.name,'_',2),''),member.name),'0') = ltrim(DS_RETAIL_OFFICE.CORPORATEOFFICENUMBER,0)
                              LEFT JOIN (
                                    SELECT OFFICENAME,
                                           OFFICECODE
                                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                                   ) DS_RETAIL_OFFICE_v2
                                ON lower(DS_RETAIL_OFFICE_v2.officename) = lower(bvstg_au11_cspr.ud2id_description)
                               AND ud2id_description IS NOT NULL
                               AND len(ud2id_description) > 1
                             WHERE ud2id IN (
                                    SELECT DISTINCT ID
                                      FROM {{ ref('STAGE','BVSTG_AU12_CSPR') }}
                                     WHERE METRIC = 'UD2ID'
                                   )
                           )
                   ) bvstg_au11_cspr
              LEFT JOIN (
                    SELECT DISTINCT corporateofficenumber,
                           officecode
                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                     WHERE corporateofficenumber NOT IN ('0')
                   ) ds_retail_office
                ON ltrim(bvstg_au11_cspr.corporateofficenumber_name,'0')
        name: BVSTG_AU14_CSPR
        noLinkRefs: []
