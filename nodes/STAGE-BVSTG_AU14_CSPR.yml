    sourceMapping:
      - aliases:
          BVSTG_AU11_CSPR: e09d3343-71f2-4910-a2dd-113c42442f47
          V_DLBV_OSM_MEMBER_CURRENT: dd70a2ba-0013-4f94-96ba-482a4e6cd1d3
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
          BVSTG_AU12_CSPR: dc13c0d3-8c9c-4cec-9438-f94bd0af0a0a
        customSQL:
