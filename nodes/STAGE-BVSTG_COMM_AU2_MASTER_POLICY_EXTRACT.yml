        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT policynumberformatted,
                   carrierdisplayname,
                   effectivedate,
                   expirationdate,
                   premium AS last_premium,
                   term,
                   policytype,
                   state,
                   departmentname
              FROM (SELECT ds_splc_policytransaction.policynumber,
                   ds_splc_policytransaction.carriername,
                   ds_splc_policytransaction.effectivedate,
                   max(ifnull(ds_splc_policytransaction.expirationdate,date('1900-01-01'))) OVER (PARTITION BY ds_bvstg_comm_policynumberformatting_allsources.POLICYNUMBERFORMATTED, ds_bvstg_comm_policynumberformatting_allsources.carrierdisplayname) expirationdate,
                   ds_splc_policytransaction.transactiondate,
                   ds_splc_policytransaction.trantype,
                   ds_splc_policytransaction.premium,
                   ds_splc_policytransaction.policytype,
                   ds_bvstg_comm_policynumberformatting_allsources.policynumberformatted,
                   ds_bvstg_comm_policynumberformatting_allsources.carrierdisplayname,
                   ds_bvstg_comm_termcleaning.term,
                   ds_bvstg_comm_wherescape_transaction_group.transation_group_v2 AS transation_group,
                   ds_splc_policytransaction.state,
                   ds_splc_policytransaction.departmentname --from "RETAIL_PROD"."SCH_EDW"."DS_SPLC_POLICYTRANSACTION" ds_splc_policytransaction          from {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION                left join           (select distinct      policynumber_edw, carriername_edw, policynumberformatted, carriername_mapped, carrierdisplayname           --from "RETAIL_PROD"."SCH_EDW"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF") ds_bvstg_comm_policynumberformatting_allsources       from {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}) ds_bvstg_comm_policynumberformatting_allsources           on ds_bvstg_comm_policynumberformatting_allsources.policynumber_edw =  ds_splc_policytransaction.policynumber           and ds_bvstg_comm_policynumberformatting_allsources.carriername_edw =  ds_splc_policytransaction.carriername                --left join "RETAIL_PROD"."SCH_EDW"."DS_BVSTG_COMM_TERMCLEANING_BF" ds_bvstg_comm_termcleaning           left join {{ ref('EDW','DS_BVSTG_COMM_TERMCLEANING_BF') }} ds_bvstg_comm_termcleaning           on ds_bvstg_comm_policynumberformatting_allsources.policynumberformatted= ds_bvstg_comm_termcleaning.policynumberformatted           and ds_bvstg_comm_policynumberformatting_allsources.carriername_mapped= ds_bvstg_comm_termcleaning.carriername_mapped                    --left join "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_WHERESCAPE_TRANSACTION_GROUP" ds_bvstg_comm_wherescape_transaction_group           left join {{ ref('STAGE','DS_BVSTG_COMM_WHERESCAPE_TRANSACTION_GROUP') }} ds_bvstg_comm_wherescape_transaction_group           on ds_splc_policytransaction.trantype = ds_bvstg_comm_wherescape_transaction_group.trantypecode           and ds_bvstg_comm_wherescape_transaction_group.sourcetable = 'splc_policytran'                 where ds_bvstg_comm_wherescape_transaction_group.transation_group_v2 in ('Renewal','New Business')          ) as splc_policy_v0       where transation_group = 'Renewal' and policynumberformatted is not null                     --added condition 12/11/2023       qualify row_number() over (partition by  policynumberformatted, carrierdisplayname order by effectivedate desc, transactiondate desc)=1      ) as ds_splc_policytransaction         left join      (select     policynumberformatted,carrierdisplayname, premium as first_premium, case when effectivedate <= transactiondate then effectivedate else transactiondate end as first_record_date       from          (select       ds_splc_policytransaction.policynumber,           ds_splc_policytransaction.carriername,           ds_splc_policytransaction.effectivedate,           ds_splc_policytransaction.expirationdate,           ds_splc_policytransaction.transactiondate,           ds_splc_policytransaction.trantype,           ds_splc_policytransaction.premium,
        name: BVSTG_COMM_AU2_MASTER_POLICY_EXTRACT
