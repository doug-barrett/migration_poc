        join:
          joinCondition: |-
            FROM ( SELECT DISTINCT final_CUSTOMER_ID,
                   CUSTOMER_MAPPING,
                   term_latest,
                   term_latest_flag,
                   term_old,
                   term_old_flag,
                   t1.INITIAL_CARRIER,
                   t1.AGENCYSTATE,
                   t1.Agency,
                   t1.CUSTOMERSTATE,
                   t1.POLICYSOURCE,
                   t1.ISLEGACYCUSTOMER,
                   t1.LEADSOURCE,
                   t1.LINEOFBUSINESS,
                   t1.OFFICENAME,
                   t1.Premium_finance_flag,
                   current_month,
                   prior_month ,
                   ifnull(current_month,dateadd('year',1,PRIOR_MONTH)) CURRENT_MONTH_1,
                   ifnull(prior_month,dateadd('year',-1,current_month)) prior_month_1,
                   ifnull (term_latest, term_old) AS TERM_LATEST_1,
                   CASE WHEN CUSTOMER_MAPPING IN ('Lapsed')
               AND t2.CANCELLEDFLAG = 1 THEN 'Cancelled' WHEN CUSTOMER_MAPPING IN ('Lapsed') THEN 'Expired' -- Check      when CUSTOMER_MAPPING in ('New_Business_Prior_Month') and REINSTATEDFLAG=1 then 'Reinstated'      when CUSTOMER_MAPPING in ('New_Business_Prior_Month') and REINSTATEDFLAG_NBSPRIOR=1 then 'Reinstated'      when CUSTOMER_MAPPING in ('New_Business_Prior_Month') then 'New_Business_Prior_Month'      else CUSTOMER_MAPPING end as CUSTOMER_MAPPING_FINAL,     CIF_BOM, CIF_EOM          --from BVSTG_COMM_CUSTOMER_MAPPING as t1     from {{ ref('STAGE','BVSTG_COMM_CUSTOMER_MAPPING') }} as t1               left join (      select a.CUSTOMER_ID,a.CUTOFFDATE,a.CANCELLEDFLAG,dateadd('month',-1,min(ifnull(b.CUTOFFDATE,current_date()))) max_date       from       (select Distinct CUSTOMER_ID,CUTOFFDATE,CANCELLEDFLAG       -- from "DATA_LAKE"."BIA_ANALYTICS"."DS_COMM_CUSTOMER_SUMMARY_EXTRACT_UPD2"      from {{ ref('EDW','DS_COMM_CUSTOMER_SUMMARY_EXTRACT_UPD2') }}      where CANCELLEDFLAG=1) a      left join      (select distinct CUSTOMER_ID,CUTOFFDATE       -- from "DATA_LAKE"."BIA_ANALYTICS"."DS_COMM_CUSTOMER_SUMMARY_EXTRACT_UPD2"       from {{ ref('EDW','DS_COMM_CUSTOMER_SUMMARY_EXTRACT_UPD2') }}      where CUSTOMERSTATUS_EOM = 1) b            on a.CUSTOMER_ID=b.CUSTOMER_ID and a.CUTOFFDATE<=b.CUTOFFDATE       group by 1,2,3      ) as T2               on t2.customer_id = t1.final_CUSTOMER_ID     and T2. CUTOFFDATE between prior_month_1 and CURRENT_MONTH_1      and t2.Max_date<=CURRENT_MONTH_1               left join        (       select Distinct CUSTOMER_ID , CUTOFFDATE ,REINSTATEDFLAG        -- from "DATA_LAKE"."BIA_ANALYTICS"."DS_COMM_CUSTOMER_SUMMARY_EXTRACT_UPD2"       from {{ ref('EDW','DS_COMM_CUSTOMER_SUMMARY_EXTRACT_UPD2') }}       where REINSTATEDFLAG=1        qualify row_number() over (partition by CUSTOMER_ID order by CUTOFFDATE desc) = 1        ) as T3          on T3.customer_id = t1.final_CUSTOMER_ID     and T3.CUTOFFDATE between prior_month_1 and CURRENT_MONTH_1               left join            (      select Distinct CUSTOMER_ID , min(CUTOFFDATE) min_CUTOFFDATE,1 REINSTATEDFLAG_NBSPRIOR       -- from "DATA_LAKE"."BIA_ANALYTICS"."DS_COMM_CUSTOMER_SUMMARY_EXTRACT_UPD2"      from {{ ref('EDW','DS_COMM_CUSTOMER_SUMMARY_EXTRACT_UPD2') }}       group by 1      ) as T4     on T4.customer_id = t1.final_CUSTOMER_ID     and T4.min_CUTOFFDATE < prior_month_1                  ) BVSTG_COMM_CUSTOMER_MAPPING
        name: BVSTG_COMM_AU1_WATERFALL
        noLinkRefs: []
