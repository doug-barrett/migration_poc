    sourceMapping:
      - aliases:
          BVSTG_COMM_AU2_EOM_EXTRACT_CS: 6fbb7e18-1bf5-468e-a905-cbc7eb344df3
          DS_POLICYSUMMARY_V2: 23ba684a-5671-4cfa-9e5f-11f1386d24b3
          DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES: 62e4c62e-c5fa-4abb-8a26-a5acaccb175b
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU2_EOM_EXTRACT_CS
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT bvstg_comm_au2_eom_extract_cs.*,
                   bvstg_comm_au2_eom_extract_cs_1.paidtype_1,
                   bvstg_comm_au2_eom_extract_cs_2.last_cspolicynumberformatted
              FROM (
                    SELECT CARRIERDATAREPOSITORYCOMPLETEID,
                           CARRIER_UNMAPPED,
                           CSPOLICYNUMBER,
                           CSPOLICYNUMBERFORMATTED,
                           CARRIER,
                           CARRIERDISPLAYNAME,
                           EFFECTIVEDATE,
                           EXECUTIONMONTH,
                           PREMIUM,
                           ACTUALCOMMISSION,
                           TRANSACTIONCODE,
                           TRANSACTIONTYPE,
                           AGENCY,
                           STATE,
                           LOB,
                           PRODUCERCODE,
                           POLICYNUMBERFORMATTED,
                           TERM,
                           AGENCY_MAPPED,
                           STATECODE_MAPPED,
                           PAIDTYPE,
                           NBSRWLFLAG,
                           CS_CALCULATION_LOGIC,
                           SOURCE_TABLE
                      FROM {{ ref('STAGE','BVSTG_COMM_AU2_EOM_EXTRACT_CS') }}
                   ) bvstg_comm_au2_eom_extract_cs
              LEFT JOIN (SELECT *,
                   CASE WHEN WrittenPremium IS NOT NULL AND MonthlyPremium >= 0.5*WrittenPremium THEN 'As Written'
                        WHEN WrittenPremium IS NULL AND MonthlyPremium >= 500                    THEN 'As Written'
                        ELSE 'As Earned'
                         END AS PaidType_1
              FROM (SELECT bvstg_comm_au2_eom_extract_cs.*,
                   ds_policysummary_v2.WrittenPremium
              FROM (
                    SELECT policynumberformatted,
                           carrier,
                           sum(premium) MonthlyPremium
                      FROM (
                            SELECT *
                              FROM (
                                    SELECT *
                                      FROM (
                                            SELECT CARRIER_UNMAPPED,
                                                   CSPOLICYNUMBER,
                                                   CSPOLICYNUMBERFORMATTED,
                                                   CARRIER,
                                                   CARRIERDISPLAYNAME,
                                                   EFFECTIVEDATE,
                                                   EXECUTIONMONTH,
                                                   PREMIUM,
                                                   ACTUALCOMMISSION,
                                                   TRANSACTIONCODE,
                                                   TRANSACTIONTYPE,
                                                   AGENCY,
                                                   STATE,
                                                   LOB,
                                                   PRODUCERCODE,
                                                   POLICYNUMBERFORMATTED,
                                                   TERM,
                                                   AGENCY_MAPPED,
                                                   STATECODE_MAPPED,
                                                   PAIDTYPE,
                                                   NBSRWLFLAG,
                                                   CS_CALCULATION_LOGIC,
                                                   SOURCE_TABLE,
                                                   1 sortorder
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU2_EOM_EXTRACT_CS') }}
                                             WHERE NbsRwlFlag = 1
                                               AND paidtype = 'As Collected'
                                               AND Source_Table = 'CDRC' QUALIFY rank() OVER (PARTITION BY policynumberformatted, carrier ORDER BY executionmonth) = 1
                                           )
                                     UNION (
                                            SELECT CARRIER_UNMAPPED,
                                                   CSPOLICYNUMBER,
                                                   CSPOLICYNUMBERFORMATTED,
                                                   CARRIER,
                                                   CARRIERDISPLAYNAME,
                                                   EFFECTIVEDATE,
                                                   EXECUTIONMONTH,
                                                   PREMIUM,
                                                   ACTUALCOMMISSION,
                                                   TRANSACTIONCODE,
                                                   TRANSACTIONTYPE,
                                                   AGENCY,
                                                   STATE,
                                                   LOB,
                                                   PRODUCERCODE,
                                                   POLICYNUMBERFORMATTED,
                                                   TERM,
                                                   AGENCY_MAPPED,
                                                   STATECODE_MAPPED,
                                                   PAIDTYPE,
                                                   NBSRWLFLAG,
                                                   CS_CALCULATION_LOGIC,
                                                   SOURCE_TABLE,
                                                   2 sortorder
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU2_EOM_EXTRACT_CS') }}
                                             WHERE paidtype = 'As Collected'
                                               AND Source_Table = 'CDRC' QUALIFY rank() OVER (PARTITION BY policynumberformatted, carrier ORDER BY executionmonth) = 1
                                           )
                                   ) QUALIFY rank() OVER (PARTITION BY policynumberformatted, carrier ORDER BY sortorder) = 1
                           )
                     GROUP BY policynumberformatted,
                              carrier
                   ) bvstg_comm_au2_eom_extract_cs
              LEFT JOIN (SELECT DISTINCT ds_bvstg_comm_policynumberformatting_allsources.PolicyNumberFormatted PolicyNumberFormatted,
                   ds_bvstg_comm_policynumberformatting_allsources.CarrierName_Mapped CarrierName,
                   coalesce(CASE WHEN WrittenPremium > 1 THEN WrittenPremium ELSE NULL END,Last_WrittenPremium, CurrentPremium, Last_CurrentPremium) WrittenPremium
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
              LEFT JOIN (
                    SELECT DISTINCT PolicyNumber_EDW,
                           CarrierName_EDW,
                           PolicyNumberFormatted,
                           CarrierName_Mapped
