        name: SRC_bvstg_balance_scorecard_2_forecast
        noLinkRefs: []
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_OPM_SCORECARD_CURRENT ds_balance_scorecard
             INNER JOIN (
                    SELECT DISTINCT officeid,
                           officename
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT
                   ) offID
                ON lower(offID.OfficeID) = lower(ds_balance_scorecard.OfficeID)
             INNER JOIN (
                    SELECT DISTINCT QUEUETYPE,
                           LEVEL1,
                           LEVEL2,
                           LEVEL3,
                           LEVEL4
                      FROM RETAIL_DEV.SCH_EDW.DS_PCCE_SKILL_PQUEUE_MAPPING
                     WHERE DELETED = 0
                   ) DS_PCCE_SKILL_PQUEUE_MAPPING
                ON offID.OfficeName = DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL4
              LEFT JOIN (
                    SELECT b.officeid,
                           a.AU_FECHA,
                           sum(a.AU_HORAS) AU_HORAS,
                           sum(a.AU_JORNADA) AU_JORNADA
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_TRES_AUSENCIA_CURRENT a
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT b
                        ON a.cb_codigo = b.employeenumber
                     WHERE (AU_HORAS > 0 OR REPLACE(AU_TIPO, ' ', '') != '')
                     GROUP BY b.officeid,
                              a.AU_FECHA
                   ) v_dlbv_tres_ausencia_current
                ON date(v_dlbv_tres_ausencia_current.AU_FECHA) = date(ds_balance_scorecard.DATE)
               AND v_dlbv_tres_ausencia_current.officeid = offID.officeid
              LEFT JOIN (
                    SELECT b.officeid,
                           date(a.START_TIME) START_TIME,
                           (SUM(CASE WHEN ACTIVITY NOT IN ('gone home') THEN DURATION ELSE 0 END)) / 3600.00 AS STAFFHOURS
                      FROM RETAIL_PROD.SCH_EDW.DS_PCCE_AGENT_ACTIVITY a
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT b
                        ON a.AGENT_SKILLTARGETID = b.agentskilltargetid
                     GROUP BY b.officeid,
                              date(a.START_TIME)
                   ) ds_pcce_agent_activity
                ON date(ds_pcce_agent_activity.START_TIME) = date(ds_balance_scorecard.DATE)
               AND ds_pcce_agent_activity.officeid = offID.officeid
