    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_PCCE_SKILL_GROUP_INTERVAL_CURRENT
        join:
          joinCondition: |-
            EXTENDED
              FROM( SELECT INTERVAL.STARTDATE AS STARTDATE,
                   DS_PCCE_SKILL_PQUEUE_MAPPING.SKILL_QUEUE,
                   'PRECISION' QUEUETYPE,
                   DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL1,
                   DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL2,
                   DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL3,
                   DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL4,
                   DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL5,
                   SUM(SERVICELEVELCALLSOFFERED) CALLSHANDLEDACD,
                   (SUM(CALLSABANDTOAGENT) + SUM(CALLSABANDQ)) AS ROUTERCALLSABANDQ,
                   0 CallsHandled,
                   SUM(CALLSHANDLED) CALLSANSWERED,
                   (SUM(CALLSABANDTOAGENT) + SUM(CALLSABANDQ)) AS CallsAbanACD,
                   sum(IFNULL(HandledCallsTime,0)) AS HandledCallsTime,
                   sum(IFNULL(HOLDTIME,0)) AS HOLDTIME,
                   CASE min(ServiceLevelType)
                        WHEN 1                THEN sum(IFNULL(ServiceLevelCalls,0))
                        WHEN 2                THEN sum(IFNULL(ServiceLevelCalls,0))
                        WHEN 3                THEN sum(IFNULL(ServiceLevelCalls,0)) + sum(IFNULL(ServiceLevelCallsAband,0))
                        ELSE 0
                         END AS N_Answered_Acd_Svc_Lvl,
                   CASE min(ServiceLevelType)
                        WHEN 1                THEN SUM(ServiceLevelCallsOffered) - SUM(SERVICELEVELCALLSABAND) - SUM(CallsDequeued) - SUM(CallsAbandDequeued)
                        WHEN 2                THEN SUM(ServiceLevelCallsOffered) - SUM(CallsDequeued) - SUM(CallsAbandDequeued)
                        WHEN 3                THEN SUM(ServiceLevelCallsOffered) - SUM(CallsDequeued) - SUM(CallsAbandDequeued)
                        ELSE 0
                         END AS N_Entered_Acd,
                   sum(IFNULL(ANSWERWAITTIME,0)) AS ANSWERWAITTIME,
                   SUM(PRODUCTIVETIME) AS PRODUCTIVETIME,
                   SUM(NONPRODUCTIVETIME) AS NONPRODUCTIVETIME,
                   sum(IFNULL(LOGGEDONTIME,0)) AS LOGGEDONTIME,
                   sum(IFNULL(AvailTime,0)) AS AvailTime,
                   MAX(maxcallwaittime) lwt,
                   SUM(handledcallstime) TALKTIME,
                   SUM(SERVICELEVELCALLSOFFERED) Callsofferedrouted,
                   sum(IFNULL(NOTREADYTIME,0)) AS NOTREADYTIME
              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_ROUTER_QUEUE_INTERVAL_CURRENT R
             INNER JOIN (
                    SELECT PrecisionQueueID,
                           DateTime,
                           SUM(IFNULL(HandledCallsTime, 0)) AS HandledCallsTime,
                           SUM(IFNULL(holdtime, 0)) AS holdtime,
                           SUM(IFNULL(ANSWERWAITTIME, 0)) AS ANSWERWAITTIME,
                           SUM(IFNULL(AvailTime, 0)) AS AvailTime,
                           SUM(IFNULL(LOGGEDONTIME, 0)) AS LOGGEDONTIME,
                           SUM(IFNULL(NOTREADYTIME, 0)) AS NOTREADYTIME
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_SKILL_GROUP_INTERVAL_CURRENT
                     GROUP BY PrecisionQueueID,
                              DateTime
                   ) S
                ON R.DateTime = S.DateTime
               AND S.PrecisionQueueID = R.PrecisionQueueID
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_PRECISION_QUEUE_CURRENT PQ
                ON PQ.PrecisionQueueID = S.PrecisionQueueID
             INNER JOIN (
                    SELECT DISTINCT SKILL_QUEUE,
                           QUEUETYPE,
                           LEVEL1,
                           LEVEL2,
                           LEVEL3,
                           LEVEL4,
                           LEVEL5
                      FROM RETAIL_DEV.SCH_EDW.DS_PCCE_SKILL_PQUEUE_MAPPING
                     WHERE DELETED = 0
                   ) DS_PCCE_SKILL_PQUEUE_MAPPING
                ON DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL5 = PQ.EnterpriseName
              LEFT JOIN (
                    SELECT SkillGroupName,
                           DATETIME,
                           SUM(AGENTLOGGEDONTIME) - SUM(AGENTNOTREADY) AS ProductiveTime,
                           SUM(AGENTNOTREADY) AS NonProductiveTime
                      FROM RETAIL_PROD.SCH_EDW.DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS
                     GROUP BY SkillGroupName,
                              DATETIME
                   ) HF
                ON HF.SkillGroupName = DS_PCCE_SKILL_PQUEUE_MAPPING.LEVEL5
               AND S.DateTime = HF.DATETIME
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.STAGE_INTERVALS INTERVAL
                ON INTERVAL.STARTDATE <= S.DateTime
               AND INTERVAL.ENDDATE > S.DateTime
             WHERE (R.CallsHandled + R.CallsAbandQ + R.CallsAbandToAgent + R.ServiceLevelCalls) <> 0
               AND Cast(S.DateTime AS Date) >= '2023-01-01'
             GROUP BY INTERVAL.STARTDATE,
                      DS_PCCE_SKILL_PQUEUE_MA
        name: SRC_bvstg_balance_scorecard_1_metrics
        noLinkRefs: []
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_OPM_FORECASTED_BY_LOB_CURRENT
        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_OPM_FORECASTED_BY_LOB_CURRENT
