          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_ACTIVITY_2STEP
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM (
                    SELECT * ,
                           ROW_NUMBER() OVER (PARTITION BY customerid ,TO_DATE(created) ORDER BY created DESC) AS rn
                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_ACTIVITY_MROC
                     WHERE activitytypeid IN (1647 ,1648 ,1649 ,1650 ,1651 ,1652 ,1530 ,1609 ,1709)
                   ) S_AP1_ACTIVITY_MROC
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_CALL_CUSTOMER DS_MKT_CALL_CUSTOMER
                ON to_varchar(S_AP1_ACTIVITY_MROC.customerid) = to_varchar(DS_MKT_CALL_CUSTOMER.customerid)
               AND to_date(S_AP1_ACTIVITY_MROC.created) = to_date(DS_MKT_CALL_CUSTOMER.startdatetime) --check this              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 DS_CUSTOMERSUMMARY_V2    ON to_varchar(S_AP1_ACTIVITY_MROC.customerid) = to_varchar(DS_CUSTOMERSUMMARY_V2.customerid)          LEFT JOIN (    SELECT ACTIVITYID AS STEP2_ACTIVITYID     ,ACTIVITYTYPENAME AS STEP2_ACTIVITYTYPENAME    FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ACTIVITY_2STEP    ) DS_BVSTG_AP1_ACTIVITY_2STEP    ON DS_BVSTG_AP1_ACTIVITY_2STEP.STEP2_ACTIVITYID = S_AP1_ACTIVITY_MROC.ACTIVITYID          FULL JOIN (    SELECT a.LEADID AS Lead_id     ,TO_DATE(a.created) AS LeadCreatedDate     ,a.customerid AS leadcustomerid     ,b.LEADSOURCENAME_SYSTEM     ,b.SOURCEDB     ,B.OFFICECODE     ,B.LEADSOURCE     ,B.ISQUOTE     ,B.QUOTEID     ,B.ISSALE     ,B.ISTRANSFER     ,B.LEADCREATEDBYULTIPRO     ,B.LEADCREATEDBYFULLNAME     ,B.LEADCREATED    FROM (     SELECT *     FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC           QUALIFY ROW_NUMBER() OVER (       PARTITION BY leadid ORDER BY dss_version DESC       ) = 1     ) a    LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_LEAD_SOURCE b     ON a.leadid = to_varchar(b.leadid)    WHERE a.lineofbusinesstypeid = 423    ) S_AP1_LEAD_MROC    ON to_varchar(S_AP1_ACTIVITY_MROC.customerid) = to_varchar(S_AP1_LEAD_MROC.leadcustomerid)     AND to_date(S_AP1_ACTIVITY_MROC.created) = to_date(S_AP1_LEAD_MROC.LeadCreatedDate) --check        LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AGENT_KEY ds_agent_key       ON DS_AGENT_KEY.ap1_userid= TO_VARCHAR(S_AP1_ACTIVITY_MROC.FOLLOWUPBYUSERID)           LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_HCI_AGENTS_CURRENT v_dlbv_cfa_hci_agents_current --hci       ON v_dlbv_cfa_hci_agents_current.employeenumber = to_varchar(ds_agent_key.employeenumber)           LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT v_s_boe_tj_employee_current  --tj       ON v_s_boe_tj_employee_current.ultipronumber = to_varchar(ds_agent_key.employeenumber)             LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE ds_retail_office       ON ds_retail_office.officecode = ds_agent_key.officecode WHERE DATE(S_AP1_ACTIVITY_MROC.created) BETWEEN '2024-01-01' AND CURRENT_DATE() -->= DATE_TRUNC('MONTH', DATEADD(MONTH, - 24, CURRENT_DATE))                                QUALIFY ROW_NUMBER() OVER (       PARTITION BY S_AP1_ACTIVITY_MROC.activityid       , S_AP1_ACTIVITY_MROC.Created               ORDER BY CASE          WHEN S_AP1_ACTIVITY_MROC.customerId IS NOT NULL          THEN 1         ELSE 2         END        , CASE          WHEN DATE (DS_MKT_CALL_CUSTOMER.created) < DATE (S_AP1_ACTIVITY_MROC.created)          THEN 1         ELSE 2         END        , DS_MKT_CALL_CUSTOMER.created DESC        , S_AP1_ACTIVITY_MROC.Created       ) = 1
        name: SRC_bvstg_hci_activities_1
        noLinkRefs: []
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT a.customerid ,
                           a.transactionid ,
                           a.transactionitemid ,
                           a.classificationgroup ,
                           a.label ,
                           DATE (a.createddate) AS repocreateddate ,
                           a.primaryagentultipro_broker ,
                           a.primaryagentname_broker ,
                           a.carriername ,
                           a.programname ,
                           a.policynumber ,
                           a.customertype ,
                           a.customerstate ,
                           a.activityid AS RAM_ACTIVITY_ID ,
                           a.OfficeCode
                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY a
                     WHERE a.lineofbusinesstype LIKE '%Health Care%'
                       AND a.isvoid = 'False'
                       AND a.label = 'New Business Complementary'
                   ) DS_RAM_RETAIL_REPOSITORY
             WHERE DATE (DS_RAM_RETAIL_REPOSITORY.repocreateddate) BETWEEN '2024-01-01' AND CURRENT_DATE() -->= DATE_TRUNC('MONTH', DATEADD(MONTH, - 24, CURRENT_DATE))   QUALIFY ROW_NUMBER() OVER (   PARTITION BY DS_RAM_RETAIL_REPOSITORY.transactionid ORDER BY CASE      WHEN DS_RAM_RETAIL_REPOSITORY.customerId IS NOT NULL      THEN 1     ELSE 2     END    ,DS_RAM_RETAIL_REPOSITORY.repocreateddate DESC   ) = 1
        name: SRC_bvstg_hci_sales_2
        noLinkRefs: []
