    sourceMapping:
      - aliases:
          BVSTG_APP_AU1_AGENT_METRICS: 6dce6e10-5fc7-462b-9a75-112ebf3aa98c
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_APP_AU1_AGENT_METRICS
        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_APP_AU1_AGENT_METRICS') }} bvstg_app_au1_agent_metrics
              LEFT JOIN (
                    SELECT CREATED,
                           EMPLOYEENUMBER,
                           OFFICECODE ,
                           SUM(TOTALPOLICIES) TOTALPOLICIES ,
                           SUM(TRANSFERS) TRANSFERS ,
                           SUM(SALEFROMTRANSFER) SALEFROMTRANSFER ,
                           SUM(SALEFROMPRODUCER) SALEFROMPRODUCER ,
                           SUM(SALEFROMNEXTOPP) SALEFROMNEXTOPP ,
                           SUM(QUOTEFROMPRODUCER)QUOTEFROMPRODUCER
                      FROM RETAIL_PROD.SCH_EDW.DS_LEAD_OPORTUNITY_CONVERSION a
                     GROUP BY CREATED,
                              EMPLOYEENUMBER,
                              OFFICECODE
                   )DS_LEAD_OPORTUNITY_CONVERSION
                ON DATE(bvstg_app_au1_agent_metrics.DATE) = DATE(DS_LEAD_OPORTUNITY_CONVERSION.CREATED)
               AND bvstg_app_au1_agent_metrics.employeenumber = DS_LEAD_OPORTUNITY_CONVERSION.employeenumber
               AND bvstg_app_au1_agent_metrics.OfficeCode = DS_LEAD_OPORTUNITY_CONVERSION.OfficeCode
              LEFT JOIN(
                    SELECT CREATED,
                           ULTIPRO,
                           OFFICECODE,
                           SUM(SALES) SALES,
                           SUM(WITH_ERROR)WITH_ERROR,
                           SUM(WITH_ERROR_REVISED)WITH_ERROR_REVISED
                      FROM RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONERROR_SUMMARY a
                     WHERE ERRORTYPE='Major Error'
                       AND TRANSACTIONTYPE = 'New Business'
                     GROUP BY CREATED,
                              ULTIPRO,
                              OFFICECODE
                   )DS_AP1_TRANSACTIONERROR_SUMMARY
                ON DATE(bvstg_app_au1_agent_metrics.DATE) = DATE(DS_AP1_TRANSACTIONERROR_SUMMARY.CREATED)
               AND bvstg_app_au1_agent_metrics.employeenumber = DS_AP1_TRANSACTIONERROR_SUMMARY.ULTIPRO
               AND bvstg_app_au1_agent_metrics.OfficeCode = DS_AP1_TRANSACTIONERROR_SUMMARY.OfficeCode
              LEFT JOIN(
                    SELECT DATE(CREATEDDATE)DATE,primaryagentultipro_broker EmployeeNumber,
                           BIAPRIMARYTRANSACTIONOFFICE OfficeCode ,
                           SUM(CASE WHEN FEENAME LIKE '%Auto Club' AND AP_ADDITIONALPRODUCTCATEGORY LIKE '% Auto Club' THEN 1 ELSE 0 END) FWY_ACC_Auto_Club_Sales ,
                           SUM(CASE WHEN isrenw_enrollment = 1 THEN 1 ELSE 0 END) Ancillary_Subscription_Auto_Enrollment ,
                           COUNT(1)Total_Ancillaries_AC
                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                     WHERE CLASSIFICATION = 'Ancillary'
                       AND EMPLOYEENUMBER != '0'
                       AND isvoid = 0
                       AND COUNTER =1
                     GROUP BY DATE(CREATEDDATE),
                              primaryagentultipro_broker,
                              BIAPRIMARYTRANSACTIONOFFICE
                   )DS_RAM_RETAIL_REPOSITORY_ANC
                ON DATE(bvstg_app_au1_agent_metrics.DATE) = DATE(DS_RAM_RETAIL_REPOSITORY_ANC.DATE)
               AND bvstg_app_au1_agent_metrics.employeenumber = DS_RAM_RETAIL_REPOSITORY_ANC.EmployeeNumber
               AND bvstg_app_au1_agent_metrics.OfficeCode = DS_RAM_RETAIL_REPOSITORY_ANC.OfficeCode
              LEFT JOIN(
                    SELECT DATE(CREATEDDATE)DATE,FOLLOWUP_EMPLOYEENUMBER EmployeeNumber,
                           FOLLOWUP_OFFICECODE OfficeCode ,
                           COUNT(1)Rejected_Transfer
                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                     WHERE activitytypename like '%TSC ? Transfer Rejected%'
                     GROUP BY DATE(CREATEDDATE),
                              FOLLOWUP_EMPLOYEENUMBER,
                              FOLLOWUP_OFFICECODE
                   )DS_RAM_RETAIL_REPOSITORY_REJ
                ON DATE(bvstg_app_au1_agent_metrics.DATE) = DATE(DS_RAM_RETAIL_REPOSITORY_REJ.DATE)
               AND bvstg_app_au1_agent_metrics.employeenumber = DS_RAM_RETAIL_REPOSITORY_REJ.EmployeeNumber
               AND bvstg_app_au1_agent_metrics.OfficeCode = DS_RAM_RETAIL_REPOSITORY_REJ.OfficeCode
              LEFT JOIN (
                    SELECT DATE(ifnull(r.PostDate,current_date()))Date, o.OfficeCode,
                           SUM(CASE WHEN TRY_TO_NUMBER(r.reviewid) >0 THEN 1 ELSE 0 END)Positive_Review
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" o
                      LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_CFA_REVIEWS_CURRENT" r
                        ON r.OFFICECODE=o.OFFICECODE
                       AND r.PostDate>='2024-01-01'
                     WHERE o.SALESTYPE IN ('Brick-e-Sales','Telesales')
                       AND o.CHANNEL NOT IN ('SPLC')
                       AND o.OFFICETYPE!='Franchise'
                       AND o.OfficeCode NOT IN ('SALRE5','ORWAR6','NVR7','ABCDE','VWXYZ','SALRET2')
                       AND o.ISACTIVE =1
                       AND Rating>=4
                     GROUP BY ifnull(r.PostDate,current_date()),
                              o.OfficeCode
                   ) V_DLBV_CFA_REVIEWS_CURRENTLEFT
                ON V_DLBV_CFA_REVIEWS_CURRENTLEFT.Date = bvstg_app_au1_agent_metrics.date
               AND V_DLBV_CFA_REVIEWS_CURRENTLEFT.OfficeCode = bvstg_app_au1_agent_metrics.officecode
               AND IFNULL(bvstg_app_au1_agent_metrics.employeenumber,'')='' LEFT
        name: BVSTG_APP_AGENT_METRICS
        noLinkRefs: []
