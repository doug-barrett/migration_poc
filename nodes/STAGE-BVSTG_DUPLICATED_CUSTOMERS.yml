        dependencies:
          - locationName: UNKNOWN
            nodeName: V_PREB_DIALER_CUSTOMER_DUP
        join:
          joinCondition: |-
            FROM {{ ref('UNKNOWN','V_PREB_DIALER_CUSTOMER_DUP') }} v_preb_dialer_customer_dup
              LEFT JOIN (
                    SELECT a.CustomerID,
                           b.Value
                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_CUSTOMERPHONE_MROC a
                     INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_PHONE_MROC b
                        ON a.PhoneID = b.PhoneID
                     WHERE b.isrowdeleted = FALSE QUALIFY ROW_NUMBER() OVER(PARTITION BY a.CUSTOMERID ORDER BY b.dss_version DESC) = 1
                   ) s_ap1_customerphone_mroc
                ON s_ap1_customerphone_mroc.CUstomeriD = v_preb_dialer_customer_dup.CustomerID
              LEFT JOIN RETAIL_PROD.SCH_EDW.V_PREB_DATAMIGRATION_V2 v_preb_datamigration_v2
                ON (TO_VARCHAR(v_preb_datamigration_v2.AppOneID) = v_preb_dialer_customer_dup.customerid AND v_preb_datamigration_v2.migrationtype = 'Customer')
