          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_COMM_AMS_TRANSACTIONMAPPING') }} AS SELECT DISTINCT ams_transactioncode_mapping.TranTypeCode AS amsTransactionMappingID ,
                   ams_transactioncode_mapping.TranTypeCode AS TranTypeCode ,
                   ams_transactioncode_mapping.Tran_Description AS Tran_Description ,
                   CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS DSS_CREATE_TIME ,
                   CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS DSS_UPDATE_TIME
              FROM (
                    SELECT 'NBS' TranTypeCode,
                           'New Business' Tran_Description
                     UNION SELECT NULL,
                           'Missing'
