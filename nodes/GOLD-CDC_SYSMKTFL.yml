      dataType: NUMBER(38,0)
      description: 'Journal Conversion Transformation
1 = Insert
2 = Update Before
3 = Update 
4 = Delete
5 = Refresh'
      name: JOURNAL_TYPE
      nullable: true
      sourceColumnReferences:
        - columnReferences: []
          transform: |-
            CASE 
            
             WHEN Aud_Type in ('PT','PX','FI') 
            
              THEN 1 
            
             WHEN Aud_Type in ('UB','FB','FP','BR') 
            
              THEN 2 
            
             WHEN Aud_Type in ('UP','UR') 
            
              THEN 3 
            
             WHEN Aud_Type in ('DL' , 'FD') 
            
              THEN 4 
            
             WHEN Aud_Type in ('RR') 
            
              THEN 5 
            
             ELSE NULL 
            
            END
