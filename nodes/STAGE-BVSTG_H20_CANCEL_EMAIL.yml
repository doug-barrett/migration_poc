    sourceMapping:
      - aliases:
          V_H20_CANCEL_EMAIL: cadd00d1-b913-4108-ae9a-6c2012bd7ef5
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_H20_CANCEL_EMAIL
        join:
          joinCondition: FROM {{ ref('STAGE','V_H20_CANCEL_EMAIL') }} v_h20_cancel_email
        name: SRC_bvstg_h20_cancel_email_1_refresh
        noLinkRefs: []
      - aliases:
          DS_H20_CANCEL_EMAIL: a70767f2-8600-42c9-8110-9271110776a7
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: DS_H20_CANCEL_EMAIL
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','DS_H20_CANCEL_EMAIL') }} ds_h20_cancel_email
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2" ds_policysummary_v2
                ON ds_h20_cancel_email.policyID = ds_policysummary_v2.PolicyID
               AND ds_policysummary_v2.SourceDB IN ('AppOne','CIGH')
               AND ds_policysummary_v2.STATUS_STANDARD = 'Active'
              LEFT JOIN (
                    SELECT CUSTOMERID,
                           TRANSACTIONID,
                           POLICYSTATUS,
                           IFNULL(LAST_BIA_STATUSDATE,BIA_STATUSDATE) StatusDate,
                           CREATED Status_Created,
                           PolicyID,
                           LAST_CDT_CREATEDDATE
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2"
                     WHERE STATUS_STANDARD = 'Active'
                       AND SourceDB IN ('AppOne','CIGH') QUALIFY ROW_NUMBER() OVER (PARTITION BY CUSTOMERID ORDER BY IFNULL(LAST_BIA_STATUSDATE,BIA_STATUSDATE) DESC)=1
                   )ds_policysummary_v2_active
                ON (ds_h20_cancel_email.Customerno = ds_policysummary_v2_active.CustomerID AND ds_h20_cancel_email.PolicyID != ds_policysummary_v2_active.PolicyID)
              LEFT JOIN (
                    SELECT POLICYID,
                           ID
                      FROM(
                            SELECT DENSE_RANK() OVER (PARTITION BY POLICYNUMBER ORDER BY STATUS_DATE DESC,ID) Part,
                                   POLICYID,
                                   ID,
                                   POLICYNUMBER
                              FROM "RETAIL_PROD"."SCH_DSCI"."DS_H20_CANCEL_EMAIL"
                             WHERE POLICYNUMBER IN (
                                    SELECT POLICYNUMBER
                                      FROM "RETAIL_PROD"."SCH_DSCI"."DS_H20_CANCEL_EMAIL"
                                     WHERE STATUS_DATE > DATEADD('DAY',-60,CURRENT_DATE)
                                       AND ISREADY = 1
                                     GROUP BY POLICYNUMBER
                                    HAVING count(1)>1
                                   )
                           )a
                     WHERE Part > 1
                   )ds_h20_cancel_email_ponDup
                ON ds_h20_cancel_email_ponDup.ID = ds_h20_cancel_email.ID
             WHERE (IFNULL(IFNULL(ds_policysummary_v2.TRANSACTIONID,ds_policysummary_v2_active.TRANSACTIONID),ds_h20_cancel_email_ponDup.POLICYID) IS NOT NULL
                OR (ds_h20_cancel_email.STATUS_DATE < DATEADD('DAY',-60,CURRENT_DATE) --AND ISREADY = 1    )        )
        name: SRC_bvstg_h20_cancel_email_2_remove
        noLinkRefs: []
