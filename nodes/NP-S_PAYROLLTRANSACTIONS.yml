        description: 'Based on a number of factors (mainly the business unit), the Customer Code is hard coded to ones of the following Networks:  Northpower Network (code 13)  Vector (code 2)  Wellington Electricity (code 24)  Transpower (3)  All other data is assigned to the Unknown dimension (code 0)'
