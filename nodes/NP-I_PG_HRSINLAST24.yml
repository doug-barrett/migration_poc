        name: MINUTESINLAST24HRS
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: "0"
                stepCounter: "0"
            transform: SUM((ISNULL(PREV.ENDTIME,0) - ISNULL(PREV.BREAKAMOUNT,0)) --IF THE FIRST TIMEBAND IS ON A PREVIOUS DAY, THEN WE ONLY WANT TO LOOK  -- BACK A MAXIMUM OF 24 HOURS, NOT NESESARILY TO THE START TIME OF THE FIRST TIMEBAND   - CASE      WHEN PREV.DATE <> L_PG_CURRENTACTUALTIMEBAND.DATE      AND PREV.STARTTIME < L_PG_CURRENTACTUALTIMEBAND.ENDTIME     THEN L_PG_CURRENTACTUALTIMEBAND.ENDTIME     ELSE ISNULL(PREV.STARTTIME,0)     END)
      - appliedColumnTests: {}
