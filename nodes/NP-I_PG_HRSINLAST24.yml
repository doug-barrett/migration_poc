        config: {}
        dataType: INTEGER
        defaultValue: ""
        description: There can be multiple timebands per employee per day. We only want the one with the maximum worked hours in the last 24, so we will order by this and the record we want will be the 1st one.
        name: ROWNUMBER
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: f7ea9fcf-6ad7-447c-a55e-9fcf7b53dc54
                stepCounter: 1ac2076f-bf83-4f9b-8104-cbb150122fed
            transform: |-
              ROW_NUMBER() OVER (
              PARTITION BY L_PG_CURRENTACTUALTIMEBAND.EMPLOYEECODE,
                     L_PG_CURRENTACTUALTIMEBAND.DATE
               ORDER BY SUM((ISNULL(PREV.ENDTIME,0) - ISNULL(PREV.BREAKAMOUNT,0)) --IF THE FIRST TIMEBAND IS ON A PREVIOUS DAY, THEN WE ONLY WANT TO LOOK  -- BACK A MAXIMUM OF 24 HOURS, NOT NESESARILY TO THE START TIME OF THE FIRST TIMEBAND   - CASE      WHEN PREV.DATE <> L_PG_CURRENTACTUALTIMEBAND.DATE      AND PREV.STARTTIME < L_PG_CURRENTACTUALTIMEBAND.ENDTIME     THEN L_PG_CURRENTACTUALTIMEBAND.ENDTIME     ELSE ISNULL(PREV.STARTTIME,0)     END)   DESC)
