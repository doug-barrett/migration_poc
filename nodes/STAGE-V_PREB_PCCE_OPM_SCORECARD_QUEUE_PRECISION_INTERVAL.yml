    sourceMapping:
      - aliases:
          V_PREB_PCCE_OPM_SCORECARD_QUEUE_PRECISION_INTERVAL: ea561b22-5a06-42e2-b1b2-3d9eb13f0a60
          STAGE_INTERVALS: 8c82a45f-8483-4a5e-81d7-5daf10693c5b
          BVSTG_PCCE_QUEUE_PRECISION_INTERVAL: 5d8772be-b537-4bc9-a099-ba1e8db8312c
          DS_PCCE_SKILL_PQUEUE_MAPPING: 85b6a3ec-67f8-4678-8274-70bcfeaca47e
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_OPM_SCORECARD_QUEUE_PRECISION_INTERVAL') }} AS SELECT SKILL_QUEUE,
                   LEVEL1 ,
                   LEVEL2 ,
                   LEVEL3,
                   LEVEL4,
                   LEVEL5 ,
                   StartDate ,
                   SUM(ANSWERWAITTIME) AS ANSWERWAITTIME ,
                   SUM(CALLSANSWERED) AS CALLSANSWERED ,
                   SUM(TALKTIME) AS TALKTIME ,
                   SUM(HOLDTIME) AS HOLDTIME ,
                   SUM(CALLSOFFEREDROUTED) AS CALLSOFFEREDROUTED ,
                   SUM(ROUTERCALLSABANDQ) AS ROUTERCALLSABANDQ ,
                   SUM(SERVICELEVELCALLS) AS SERVICELEVELCALLS ,
                   SUM(AAT) AS AAT ,
                   SUM(AHT) AS AHT ,
                   SUM(ASA) AS ASA ,
                   MAX(LWT) AS LWT ,
                   SUM(CALLSABANACD) AS CALLSABANACD ,
                   SUM(CALLSHANDLEDACD) AS CALLSHANDLEDACD ,
                   SUM(N_Answered_Acd_Svc_Lvl) AS N_Answered_Acd_Svc_Lvl ,
                   SUM(N_Entered_Acd) AS N_Entered_Acd ,
                   SUM(HANDLEDCALLSTIME) AS HANDLEDCALLSTIME ,
                   SUM(CALLSDEQUEUED) AS CALLSDEQUEUED ,
                   SUM(CALLSABANDDEQUEUED) AS CALLSABANDDEQUEUED ,
                   SUM(SERVICELEVELCALLSABAND) AS SERVICELEVELCALLSABAND ,
                   SUM(TALKOUTTIME) AS TALKOUTTIME ,
                   SUM(TALKINTIME) AS TALKINTIME ,
                   SUM(TALKOTHERTIME) AS TALKOTHERTIME ,
                   SUM(AVAILTIME) AS AVAILTIME ,
                   SUM(NOTREADYTIME) AS NOTREADYTIME ,
                   SUM(LOGGEDONTIME) AS LOGGEDONTIME ,
                   MIN(DSS_UPDATE_TIME) DSS_UPDATE_TIME ,
                   ServiceLevelType
              FROM (
                    SELECT ds_pcce_skill_pqueue_mapping.SKILL_QUEUE,
                           ds_pcce_skill_pqueue_mapping.LEVEL1,
                           ds_pcce_skill_pqueue_mapping.LEVEL2,
                           ds_pcce_skill_pqueue_mapping.LEVEL3,
                           ds_pcce_skill_pqueue_mapping.LEVEL4,
                           ds_pcce_skill_pqueue_mapping.LEVEL5,
                           stage_intervals.StartDate,
                           SUM(bvstg_pcce_queue_precision_interval.ANSWERWAITTIME) ANSWERWAITTIME,
                           SUM(bvstg_pcce_queue_precision_interval.CALLSHANDLED) CALLSANSWERED,
                           SUM(bvstg_pcce_queue_precision_interval.handledcallstime) TALKTIME,
                           SUM(bvstg_pcce_queue_precision_interval.HOLDTIME) HOLDTIME,
                           SUM(bvstg_pcce_queue_precision_interval.SERVICELEVELCALLSOFFERED) AS CALLSOFFEREDROUTED,
                           (SUM(bvstg_pcce_queue_precision_interval.CALLSABANDTOAGENT) + SUM(bvstg_pcce_queue_precision_interval.CALLSABANDQ)) AS ROUTERCALLSABANDQ,
                           SUM(SERVICELEVELCALLS) SERVICELEVELCALLS,
                           sum(bvstg_pcce_queue_precision_interval.TalkTime) / NULLIF(sum(bvstg_pcce_queue_precision_interval.CallsHandled),0) AS aat,
                           sum(bvstg_pcce_queue_precision_interval.AVGHANDLEDCALLSTALKTIME) / NULLIF(sum(bvstg_pcce_queue_precision_interval.CallsHandled),0) AS aht,
                           sum(bvstg_pcce_queue_precision_interval.AnswerWaitTime) / NULLIF(sum(bvstg_pcce_queue_precision_interval.CallsAnswered),0) AS asa,
                           MAX(bvstg_pcce_queue_precision_interval.maxcallwaittime) lwt,
                           (SUM(bvstg_pcce_queue_precision_interval.CALLSABANDTOAGENT) + SUM(bvstg_pcce_queue_precision_interval.CALLSABANDQ)) AS CallsAbanACD,
                           SUM(bvstg_pcce_queue_precision_interval.SERVICELEVELCALLSOFFERED) AS CallsHandledACD,
                           sum(IFNULL(bvstg_pcce_queue_precision_interval.HandledCallsTime,0)) AS HandledCallsTime,
                           sum(IFNULL(CallsDequeued,0)) AS CallsDequeued,
                           sum(IFNULL(CallsAbandDequeued,0)) AS CallsAbandDequeued,
                           sum(IFNULL(ServiceLevelCallsAband,0)) AS ServiceLevelCallsAband,
                           SUM(IFNULL(bvstg_pcce_queue_precision_interval.TalkOutTime,0)) AS TalkOutTime,
                           SUM(IFNULL(bvstg_pcce_queue_precision_interval.TalkInTime,0)) AS TalkInTime,
                           SUM(IFNULL(bvstg_pcce_queue_precision_interval.TalkOtherTime,0)) AS TalkOtherTime,
                           SUM(IFNULL(bvstg_pcce_queue_precision_interval.AvailTime,0)) AS AvailTime,
                           ServiceLevelType AS ServiceLevelType ,
                           CASE min(ServiceLevelType)
                                WHEN 1                THEN sum(IFNULL(ServiceLevelCalls,0))
                                WHEN 2                THEN sum(IFNULL(ServiceLevelCalls,0))
                                WHEN 3                THEN sum(IFNULL(ServiceLevelCalls,0)) + sum(IFNULL(ServiceLevelCallsAband,0))
                                ELSE 0
                                 END AS N_Answered_Acd_Svc_Lvl ,
                           CASE min(ServiceLevelType)
                                WHEN 1                THEN SUM(ServiceLevelCallsOffered) - SUM(SERVICELEVELCALLSABAND) - SUM(CallsDequeued) - SUM(CallsAbandDequeued)
                                WHEN 2                THEN SUM(ServiceLevelCallsOffered) - SUM(CallsDequeued) - SUM(CallsAbandDequeued)
                                WHEN 3                THEN SUM(ServiceLevelCallsOffered) - SUM(CallsDequeued) - SUM(CallsAbandDequeued)
                                ELSE 0
                                 END AS N_Entered_Acd ,
                           SUM(bvstg_pcce_queue_precision_interval.NOTREADYTIME) AS NOTREADYTIME ,
                           SUM(bvstg_pcce_queue_precision_interval.LOGGEDONTIME) AS LOGGEDONTIME ,
                           MIN(bvstg_pcce_queue_precision_interval.DSS_UPDATE_TIME) DSS_UPDATE_TIME
                      FROM {{ ref('STAGE','STAGE_INTERVALS') }} stage_intervals
                      LEFT JOIN {{ ref('STAGE','BVSTG_PCCE_QUEUE_PRECISION_INTERVAL') }} bvstg_pcce_queue_precision_interval
                        ON bvstg_pcce_queue_precision_interval.Interval >= stage_intervals.StartDate
                       AND bvstg_pcce_queue_precision_interval.Interval < stage_intervals.EndDate
                      LEFT JOIN (
                            SELECT DISTINCT ds_pcce_skill_pqueue_mapping.SKILL_QUEUE,
                                   ds_pcce_skill_pqueue_mapping.LEVEL1,
                                   ds_pcce_skill_pqueue_mapping.LEVEL2,
                                   ds_pcce_skill_pqueue_mapping.LEVEL3,
                                   ds_pcce_skill_pqueue_mapping.LEVEL4,
                                   ds_pcce_skill_pqueue_mapping.LEVEL5,
                                   ds_pcce_skill_pqueue_mapping.QueueType,
                                   ds_pcce_skill_pqueue_mapping.DELETED
                              FROM {{ ref('EDW','DS_PCCE_SKILL_PQUEUE_MAPPING') }}
                           ) ds_pcce_skill_pqueue_mapping
                        ON (bvstg_pcce_queue_precision_interval.FullName = ds_pcce_skill_pqueue_mapping.SKILL_QUEUE AND ds_pcce_skill_pqueue_mapping.DELETED = 0 AND ds_pcce_skill_pqueue_mapping.QueueType = 'PRECISION')
                     WHERE DATE(stage_intervals.StartDate) BETWEEN (
                            SELECT MIN(interval)
                              FROM {{ ref('STAGE','BVSTG_PCCE_QUEUE_PRECISION_INTERVAL') }}
                           ) AND (
                            SELECT MAX(interval)
                              FROM {{ ref('STAGE','BVSTG_PCCE_QUEUE_PRECISION_INTERVAL') }}
                           )
                     GROUP BY stage_intervals.StartDate,
                              ds_pcce_skill_pqueue_mapping.SKILL_QUEUE,
                              ds_pcce_skill_pqueue_mapping.LEVEL1,
                              ds_pcce_skill_pqueue_mapping.LEVEL2,
                              ds_pcce_skill_pqueue_mapping.LEVEL3,
                              ds_pcce_skill_pqueue_mapping.LEVEL4,
                              ds_pcce_skill_pqueue_mapping.LEVEL5,
                              ServiceLevelType
                   )bvstg_pcce_queue_precision_interval
             GROUP BY SKILL_QUEUE,
                      StartDate,
                      LEVEL1,
                      LEVEL2,
                      LEVEL3,
                      LEVEL4,
                      LEVEL5,
                      ServiceLevelType
        dependencies:
          - locationName: EDW
            nodeName: DS_OPM_LOB_QUEUE_MAPPING
          - locationName: STAGE
            nodeName: STAGE_INTERVALS
          - locationName: STAGE
            nodeName: BVSTG_PCCE_QUEUE_PRECISION_INTERVAL
          - locationName: EDW
            nodeName: DS_PCCE_SKILL_PQUEUE_MAPPING
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_OPM_LOB_QUEUE_MAPPING') }}
            {{ ref('STAGE','STAGE_INTERVALS') }}
            {{ ref('STAGE','BVSTG_PCCE_QUEUE_PRECISION_INTERVAL') }}
            {{ ref('EDW','DS_PCCE_SKILL_PQUEUE_MAPPING') }}
        name: V_PREB_PCCE_OPM_SCORECARD_QUEUE_PRECISION_INTERVAL
        noLinkRefs: []
