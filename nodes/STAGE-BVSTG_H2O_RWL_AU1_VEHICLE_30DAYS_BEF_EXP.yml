        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_S_AP1_POLICYVEHICLE_MROC_CURRENT') }} v_s_ap1_policyvehicle_mroc_current
             INNER JOIN {{ ref('STAGE','V_S_AP1_POLICYVERSION_MROC_CURRENT') }} v_s_ap1_policyversion_mroc_current
                ON v_s_ap1_policyvehicle_mroc_current.policyversionId = v_s_ap1_policyversion_mroc_current.policyversionId
             INNER JOIN {{ ref('EDW','DS_POLICYSUMMARY_RENEWALS') }} ds_policysummary_renewals
                ON TO_VARCHAR(v_s_ap1_policyversion_mroc_current.policyid) = TO_VARCHAR(ds_policysummary_renewals.Source_policyid)
               AND v_s_ap1_policyversion_mroc_current.EFFECTIVEDATE <= ds_policysummary_renewals.renewal_start_period
               AND ds_policysummary_renewals.SourceDB = 'AppOne'
             INNER JOIN (
                    SELECT DISTINCT customerid,
                           SOURCEDB
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                   ) bvstg_customer_to_refresh
                ON TO_CHAR(bvstg_customer_to_refresh.customerid) = TO_CHAR(ds_policysummary_renewals.customerid)
               AND bvstg_customer_to_refresh.SourceDB = 'AppOne'
             GROUP BY ds_policysummary_renewals.ID
