    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_PREB_SKILL_PRECISION_QUEUE
        join:
          joinCondition: |-
            FROM RETAIL_DEV.SCH_BVSTAGE.V_PREB_SKILL_PRECISION_QUEUE v_preb_skill_precision_queue
              LEFT JOIN (
                    SELECT PRECISIONQUEUEID , INTERVAL , SUM(loggedontime) - SUM(notreadytime) AS productivetime ,
                           SUM(notreadytime) AS nonproductivetime ,
                           MAX(RouterMaxCallWaitTime) AS lwt
                      FROM RETAIL_DEV.SCH_BVSTAGE.V_PREB_SKILL_PRECISION_QUEUE
                     GROUP BY INTERVAL, precisionqueueid
                   ) v_preb_skill_precision_queue_productive
                ON v_preb_skill_precision_queue_productive.PRECISIONQUEUEID = v_preb_skill_precision_queue.precisionqueueid
               AND v_preb_skill_precision_queue_productive.interval = v_preb_skill_precision_queue.interval
              LEFT JOIN DATA_LAKE.CISCO_PCCE.DL_PCCE_ROUTER_QUEUE_INTERVAL dl_pcce_router_queue_interval
                ON v_preb_skill_precision_queue.PRECISIONQUEUEID = dl_pcce_router_queue_interval.PRECISIONQUEUEID
               AND v_preb_skill_precision_queue.INTERVAL = dl_pcce_router_queue_interval.datetime
              LEFT JOIN RETAIL_DEV.SCH_EDW.DS_OPM_LOB_QUEUE_MAPPING ds_opm_lob_queue_mapping
                ON v_preb_skill_precision_queue.FullName=ds_opm_lob_queue_mapping.queue_name
              LEFT JOIN (
                    SELECT officecode,
                           officename,
                           state,
                           statecode,
                           districtcode,
                           districtmanagername,
                           salesvp,
                           areacode ,
                           areamanagername,
                           territorycode,
                           territorymanagername
                      FROM RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE
                     GROUP BY officecode,
                              officename,
                              state,
                              statecode,
                              districtcode,
                              districtmanagername,
                              salesvp,
                              areacode ,
                              areamanagername,
                              territorycode,
                              territorymanagername
                   )ds_retail_office
                ON CASE WHEN ds_opm_lob_queue_mapping.group_name='Office'   THEN ds_retail_office.officecode
                        WHEN ds_opm_lob_queue_mapping.group_name='District' THEN ds_retail_office.DISTRICTCODE
                        WHEN ds_opm_lob_queue_mapping.group_name='Area'     THEN ds_retail_office.AREACODE
                        ELSE ds_opm_lob_queue_mapping.group_name
                         END = ds_opm_lob_queue_mapping.RETAILMAP
             WHERE (('{{ parameters.HWM_BVSTG_Cisco_Refresh_flag }}' = 0 AND DATE(v_preb_skill_precision_queue.Interval)>= '2020-01-01') OR ('{{ parameters.HWM_BVSTG_Cisco_Refresh_flag }}' = 1 AND DATEDIFF(DAY,DATE(v_preb_skill_precision_queue.Interval), CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Cisco_Refresh_Days }}')) QUALIFY ROW_NUMBER() OVER (PARTITION BY v_preb_skill_precision_queue.Interval, v_preb_skill_precision_queue.FullName, v_preb_skill_precision_queue.QueueType, v_preb_skill_precision_queue.PRECISIONQUEUEID ORDER BY v_preb_skill_precision_queue.Interval)=1
        name: BVSTG_PCCE_SKILL_PRECISION_QUEUE
        noLinkRefs: []
