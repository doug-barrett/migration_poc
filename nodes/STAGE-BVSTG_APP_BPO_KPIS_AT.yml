              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_S_BOE_TJ_EMPLOYEE_CURRENT" V_S_BOE_TJ_EMPLOYEE_CURRENT
                ON BPO_SCRAMSALES_REF.ID_EMP = V_S_BOE_TJ_EMPLOYEE_CURRENT.EMPLOYEENUMBER
             WHERE BPO_SCRAMSALES_REF.ID_EMP IS NOT NULL
             GROUP BY DATE(BPO_SCRAMSALES_CALLS.DATE) ,
                      V_S_BOE_TJ_EMPLOYEE_CURRENT.FULLNAME ,
                      BPO_SCRAMSALES_REF.ID_EMP
