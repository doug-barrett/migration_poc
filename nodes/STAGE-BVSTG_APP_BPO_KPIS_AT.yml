        name: SRC_bvstg_app_bpo_kpis_at_AFI_TR
        noLinkRefs: []
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            FROM DATA_ANALYTICS.WFM_WORKSPACE.BPO_SCANHEALTHWN_CALLS AS BPO_SCANHEALTHWN_CALLS
              LEFT JOIN DATA_ANALYTICS.WFM_WORKSPACE.BPO_SCANHEALTHWN_REF AS BPO_SCANHEALTHWN_REF
                ON BPO_SCANHEALTHWN_CALLS.ASSIGNED = BPO_SCANHEALTHWN_REF.AGENT
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_S_BOE_TJ_EMPLOYEE_CURRENT" AS V_S_BOE_TJ_EMPLOYEE_CURRENT
                ON BPO_SCANHEALTHWN_REF.EMPID = V_S_BOE_TJ_EMPLOYEE_CURRENT.EMPLOYEENUMBER
              LEFT JOIN (
                    SELECT DATE(BPO_SCANHEALTHWN_CALLSGENESYS.INTERVAL_START) AS DATE,
                           BPO_SCANHEALTHWN_REF.EMPID,
                           SUM(COALESCE(BPO_SCANHEALTHWN_CALLSGENESYS.ANSWERED, 0) + COALESCE(BPO_SCANHEALTHWN_CALLSGENESYS.HANDLE, 0)) AS TOTALCALLS
                      FROM DATA_ANALYTICS.WFM_WORKSPACE.BPO_SCANHEALTHWN_CALLSGENESYS BPO_SCANHEALTHWN_CALLSGENESYS
                      LEFT JOIN DATA_ANALYTICS.WFM_WORKSPACE.BPO_SCANHEALTHWN_REF BPO_SCANHEALTHWN_REF
                        ON BPO_SCANHEALTHWN_CALLSGENESYS.AGENT_NAME = BPO_SCANHEALTHWN_REF.GENESYSNAME
                     WHERE BPO_SCANHEALTHWN_REF.EMPID IS NOT NULL
                     GROUP BY DATE(BPO_SCANHEALTHWN_CALLSGENESYS.INTERVAL_START),
                              BPO_SCANHEALTHWN_REF.EMPID
                   ) AS CALLS
                ON BPO_SCANHEALTHWN_REF.EMPID = CALLS.EMPID
               AND DATE(BPO_SCANHEALTHWN_CALLS.DATE) = CALLS.DATE
             WHERE BPO_SCANHEALTHWN_REF.EMPID IS NOT NULL
               AND V_S_BOE_TJ_EMPLOYEE_CURRENT.FULLNAME IS NOT NULL
               AND DATE(BPO_SCANHEALTHWN_CALLS.DATE) >= '2025-10-01'
             GROUP BY DATE(BPO_SCANHEALTHWN_CALLS.DATE),
                      BPO_SCANHEALTHWN_REF.EMPID,
                      V_S_BOE_TJ_EMPLOYEE_CURRENT.FULLNAME
