        join:
          joinCondition: |-
            FROM "DATA_ANALYTICS"."WFM_WORKSPACE"."BPO_AFI_DAILY" BPO_AFI_DAILY
              LEFT JOIN DATA_ANALYTICS.WFM_WORKSPACE.BPO_AFI_REF BPO_AFI_REF
                ON BPO_AFI_DAILY.AGENT = BPO_AFI_REF.AFI_NAME
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_S_BOE_TJ_EMPLOYEE_CURRENT" V_S_BOE_TJ_EMPLOYEE_CURRENT
                ON BPO_AFI_REF.EmpID = V_S_BOE_TJ_EMPLOYEE_CURRENT.EMPLOYEENUMBER
             WHERE BPO_AFI_REF.EmpID IS NOT NULL
             GROUP BY OfficeID ,
                      DATE(BPO_AFI_DAILY.Date) ,
                      BPO_AFI_REF.EmpID ,
                      IFNULL(V_S_BOE_TJ_EMPLOYEE_CURRENT.FULLNAME,BPO_AFI_DAILY.AGENT) ,
