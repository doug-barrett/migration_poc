            nodeName: BVSTG_AU1_CSPR
        join:
          joinCondition: |-
            FROM (
                    SELECT bvstg_au1_cspr.OFFICECODE,
                           bvstg_au1_cspr.MONTH,
                           Total_Ancillary_Amount,
                           Total_Fee_Amount,
                           TOTALNEWPOLICY,
                           Prod_Category,
                           OfficeName,
                           OfficeType,
                           StateCode,
                           GEOLOCATIONLATITUDE,
                           GEOLOCATIONLONGITUDE,
                           ADDRESS,
                           CHANNEL,
                           Salestype,
                           DISTRICTMANAGERNAME,
                           SALESVP,
                           TERRITORYMANAGERNAME,
                           OFFICEOPENEDDATE,
                           officecloseddate,
                           Renewals,
                           PIF,
                           HistoricOfficeStatus,
                           Phone,
                           InStoreSale,
                           Store_Transactions_Excluding_Sales,
                           Phone_Transactions_Excluding_Sales,
                           Total_Transactions
                      FROM (
                            SELECT DISTINCT officecode,
                                   min_month,
                                   max_month,

                             MONTH
                              FROM (
                                    SELECT officecode,
                                           min(asofmonth) min_month,
                                           max(asofmonth) max_month //
                                      FROM bvstg_au1_cspr
                                      FROM {{ ref('STAGE','BVSTG_AU1_CSPR') }}
                                     GROUP BY officecode
                                   )
                              FULL JOIN (
                                    SELECT date_trunc('month', MY_DATE)
                                     MONTH
                                      FROM (
                                            SELECT DATEADD(DAY, SEQ4(), DATEADD(YY, -6, CAST(CONCAT('1/1/', YEAR(DATEADD(DD, -1, GETDATE()))) AS DATE))) AS MY_DATE
                                              FROM TABLE(GENERATOR(ROWCOUNT => 7 * 365.25))
                                           )
                                   ) DT
                             WHERE
                             MONTH <= max_month
                               AND
                             MONTH >= min_month
                           ) bvstg_au1_cspr
                      LEFT JOIN // bvstg_au1_cspr bvstg_au1_cspr1 {{ ref('STAGE','BVSTG_AU1_CSPR') }} bvstg_au1_cspr1
                        ON ifnull(bvstg_au1_cspr1.officecode, '-') = ifnull(bvstg_au1_cspr.officecode, '-')
                       AND bvstg_au1_cspr1.asofmonth = bvstg_au1_cspr.month
                   ) bvstg_au1_cspr
