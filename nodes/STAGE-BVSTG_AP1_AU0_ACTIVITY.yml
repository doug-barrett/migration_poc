        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_ACTIVITY_MROC s_ap1_activity_mroc
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ACTIVITY_NOTE ds_bvstg_ap1_activity_note
                ON ds_bvstg_ap1_activity_note.HK_h_activity = s_ap1_activity_mroc.HK_h_activity
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_LOGINSTATUS ds_bvstg_ap1_loginstatus
                ON ds_bvstg_ap1_loginstatus.userid = s_ap1_activity_mroc.CreatedBy
               AND ds_bvstg_ap1_loginstatus.created >= DATEADD(DAY, - 30, s_ap1_activity_mroc.Created)
               AND ds_bvstg_ap1_loginstatus.created < s_ap1_activity_mroc.Created
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_LOGINSTATUS ds_bvstg_ap1_loginstatus_fl
                ON ds_bvstg_ap1_loginstatus_fl.userid = s_ap1_activity_mroc.followupbyuserid
               AND ds_bvstg_ap1_loginstatus_fl.created >= DATEADD(DAY, - 30, s_ap1_activity_mroc.Created)
               AND ds_bvstg_ap1_loginstatus_fl.created < s_ap1_activity_mroc.Created
              LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC s_ap1_lead_mroc
                ON (s_ap1_activity_mroc.customerid = s_ap1_lead_mroc.customerid AND s_ap1_activity_mroc.created > s_ap1_lead_mroc.created)
             INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.H_ACTIVITYTYPE H_ACTIVITYTYPE
                ON s_ap1_activity_mroc.activitytypeid = H_ACTIVITYTYPE.activitytypeid
             INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_ACTIVITYTYPE S_AP1_ACTIVITYTYPE
                ON H_ACTIVITYTYPE.HK_H_ACTIVITYTYPE = S_AP1_ACTIVITYTYPE.HK_H_ACTIVITYTYPE
             WHERE s_ap1_activity_mroc.activitytypeid IN (1645, 1508, 1509, 1510, 1511, 1542, 1400, 1401, 1402, 1403, 1558, 1559, 1556, 1557, 1574, 1638, 1639, 1640, 1637, 1641, 1457, 1467, 1495, 1496, 1497, 1307, 1523, 1545, 1546, 1222, 1244, 1226, 1245, 1246, 1247, 1570, 1584, 1584, 1585, 1636, 1587, 1569, 1619, 1575, 1617, 1576, 1576, 1613, 1543, 1612, 1620, 1621, 1621, 1560, 1618, 1618, 1560, 1555, 1551, 1674, 1673, 1563, 1675, 1676, 1304, 1305, 1308, 1320, 1415, 1487, 1493, 1498, 1527, 1528, 1529, 1532, 1540, 1550, 1581, 1704, 1710, 1306, 1303, 1374, 1530, 1609, 1647, 1648, 1649, 1650, 1651, 1652, 1708, 1709, 1686, 1623, 1625, 1669, 1687, 1688, 1689, 1690, 1663, 1626, 1627, 1601, 1691, 1599, 1666, 1600, 5, 1332, 1692, 1693, 1695, 1694, 1696, 1697, 1698, 1665, 1661, 1699, 1701, 1672, 1700, 1630, 1616, 1361, 1359, 1360, 1358, 1702, 1703, 1634, 1635, 1307, 1260, 1521, 1298, 1724, 1458, 1459, 1722)
               AND (((SELECT COUNT(1) FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ACTIVITY_2STEP) > 0 AND s_ap1_activity_mroc.lastupdated >= DATEADD(HOUR, - 3, (SELECT MAX(created) FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ACTIVITY_2STEP))) OR ((SELECT COUNT(1) FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ACTIVITY_2STEP) = 0 AND TO_DATE(s_ap1_activity_mroc.created) >= '2013-01-01')) QUALIFY ROW_NUMBER() OVER (
            PARTITION BY s_ap1_activity_mroc.hk_h_activity
             ORDER BY --s_ap1_activity_mroc.DSS_VERSION desc,    s_ap1_lead_mroc.created DESC    ,ds_bvstg_ap1_loginstatus.created DESC    ,ds_bvstg_ap1_loginstatus_fl.created DESC   ) = 1
