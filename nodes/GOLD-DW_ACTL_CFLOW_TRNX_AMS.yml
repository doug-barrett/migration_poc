          LEFT JOIN {{ ref(''BRONZE'', ''MRV_REF360_PRODUCT_IFRS_OPTION_TYPE_MAPPING_CURR_V'') }} mrv_ref360_product_ifrs_option_type_mapping_curr_v ON mrv_dw_contract_risk_v.CODE = mrv_ref360_product_ifrs_option_type_mapping_curr_v.PRODUCT_CODE AND mrv_dw_contract_risk_v.COUNTRY_CODE = mrv_ref360_product_ifrs_option_type_mapping_curr_v.COUNTRY_CODE /* Detail Outer Join */

