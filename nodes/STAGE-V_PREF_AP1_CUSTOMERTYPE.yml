    sourceMapping:
      - aliases:
          V_PREF_AP1_CUSTOMERTYPE: de61607e-e9a7-40c0-bed3-b88bb7fd0284
          BVSTG_BRDG_POLICYCUTOFFSUMMARY_0: 28ef28c8-d4ce-4395-88de-0a9cbb58de38
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREF_AP1_CUSTOMERTYPE') }} AS SELECT DISTINCT bvstg_brdg_policycutoffsummary_0.TransactionID ,
                   bvstg_brdg_policycutoffsummary_0.CustomerID ,
                   bvstg_brdg_policycutoffsummary_0.CustomerType ,
                   bvstg_brdg_policycutoffsummary_0.StartDate ,
                   bvstg_brdg_policycutoffsummary_0.EndDate ,
                   bvstg_brdg_policycutoffsummary_0.StatusStandard ,
                   bvstg_brdg_policycutoffsummary_0.BIA_StatusDate ,
                   bvstg_brdg_policycutoffsummary_0.PolicyID
              FROM (
                    SELECT CAST(bvstg_brdg_policycutoffsummary.TransactionID AS VARCHAR(250)) AS TransactionID ,
                           bvstg_brdg_policycutoffsummary.CustomerID ,
                           bvstg_brdg_policycutoffsummary.StartDate ,
                           bvstg_brdg_policycutoffsummary.EndDate ,
                           bvstg_brdg_policycutoffsummary.StatusStandard ,
                           bvstg_brdg_policycutoffsummary.BIA_StatusDate ,
                           bvstg_brdg_policycutoffsummary.PolicyID ,
                           CASE WHEN IFNULL(CB.Created,RW.Created) IS NULL THEN 'New'
                                WHEN RW.Created IS NOT NULL                THEN 'Rewrite'
                                ELSE 'WinBack'
                                 END AS CustomerType ,
                           CASE WHEN CB.TransactionID IS NULL THEN 0
                                ELSE RANK() OVER (PARTITION BY bvstg_brdg_policycutoffsummary.TransactionID ORDER BY CB.Created DESC, CB.TransactionID)
                                 END AS Ranking1 ,
                           CASE WHEN RW.TransactionID IS NULL THEN 0
                                ELSE RANK() OVER (PARTITION BY bvstg_brdg_policycutoffsummary.TransactionID ORDER BY RW.Created DESC, RW.TransactionID)
                                 END AS Ranking2
                      FROM {{ ref('STAGE','BVSTG_BRDG_POLICYCUTOFFSUMMARY_0') }} bvstg_brdg_policycutoffsummary
                      LEFT JOIN {{ ref('STAGE','BVSTG_BRDG_POLICYCUTOFFSUMMARY_0') }} CB
                        ON (CB.CustomerID = bvstg_brdg_policycutoffsummary.CustomerID AND CB.Created < bvstg_brdg_policycutoffsummary.created AND CB.EndDate < TO_DATE(bvstg_brdg_policycutoffsummary.Created))
                      LEFT JOIN {{ ref('STAGE','BVSTG_BRDG_POLICYCUTOFFSUMMARY_0') }} RW
                        ON (RW.CustomerID = bvstg_brdg_policycutoffsummary.CustomerID AND RW.Created < bvstg_brdg_policycutoffsummary.created AND (RW.EndDate IS NULL OR RW.EndDate >= TO_DATE(bvstg_brdg_policycutoffsummary.Created)))
                   )AS bvstg_brdg_policycutoffsummary_0
             WHERE (CustomerType = 'New')
                OR (CustomerType = 'Rewrite' AND Ranking2 = 1)
                OR (CustomerType = 'WinBack' AND Ranking1 = 1)
             ORDER BY StartDate
