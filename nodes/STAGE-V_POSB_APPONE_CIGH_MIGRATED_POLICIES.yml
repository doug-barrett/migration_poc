        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_APPONE_CIGH_MIGRATED_POLICIES') }} AS SELECT ds_policysummary_v2.PolicyID CIGH_PolicyID ,
                   ds_policysummary_v2_appone.PolicyID AppOne_PolicyID ,
                   ds_customersummary_v2.AFW_CUSTOMER_LEGACYID CIGH_CustomerID ,
                   ds_customersummary_v2.CustomerID AppOneCustomerID
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
             INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} ds_customersummary_v2
                ON ds_policysummary_v2.CustomerID = ds_customersummary_v2.AFW_CUSTOMER_LEGACYID
             INNER JOIN (
                    SELECT DISTINCT POLICYNUMBER_EDW,
                           CARRIERNAME_EDW,
                           POLICYNUMBERFORMATTED
                      FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}
                   ) ds_bvstg_comm_policynumberformatting_allsources
                ON ds_policysummary_v2.PolicyNumber = ds_bvstg_comm_policynumberformatting_allsources.POLICYNUMBER_EDW
               AND ds_policysummary_v2.CarrierName = ds_bvstg_comm_policynumberformatting_allsources.CARRIERNAME_EDW
             INNER JOIN (
                    SELECT DISTINCT POLICYNUMBER_EDW,
                           CARRIERNAME_EDW,
                           POLICYNUMBERFORMATTED
                      FROM "DATA_LAKE"."BIA_ANALYTICS"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES"
                   ) ds_bvstg_comm_policynumberformatting_allsources_appone
                ON ds_bvstg_comm_policynumberformatting_allsources.POLICYNUMBERFORMATTED = ds_bvstg_comm_policynumberformatting_allsources_appone.POLICYNUMBERFORMATTED
               AND ds_bvstg_comm_policynumberformatting_allsources.CARRIERNAME_EDW = ds_bvstg_comm_policynumberformatting_allsources_appone.CARRIERNAME_EDW
             INNER JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2_appone
                ON ds_policysummary_v2_appone.SourceDb='AppOne'
               AND ds_policysummary_v2_appone.ISLEGACYTRANSACTION = 'Migrated'
               AND ds_policysummary_v2_appone.CustomerID = ds_customersummary_v2.CustomerID
               AND ds_bvstg_comm_policynumberformatting_allsources_appone.POLICYNUMBER_EDW = ds_policysummary_v2_appone.PolicyNumber
             WHERE ds_policysummary_v2.SourceDb='CIGH' QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_policysummary_v2.PolicyID,ds_customersummary_v2.CustomerID ORDER BY CASE WHEN ds_policysummary_v2.PolicyNumber = ds_policysummary_v2_appone.PolicyNumber THEN 1 WHEN ds_policysummary_v2.Created = ds_policysummary_v2_appone.Created THEN 2 ELSE 3 END,ds_policysummary_v2_appone.Created)=1
        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
