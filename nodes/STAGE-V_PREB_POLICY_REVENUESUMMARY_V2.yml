    sourceMapping:
      - aliases:
          V_PREB_POLICY_REVENUESUMMARY_V2: b0f260f6-92b3-4176-a0b3-1b39da5ca36d
          DS_RAM_RETAIL_REPOSITORY: d29a0c5c-e296-46c4-bc55-861d60fe906d
          BVSTG_CUSTOMER_TO_REFRESH: 7cbd0921-faef-4eb6-bdf6-f95f09598096
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_POLICY_REVENUESUMMARY_V2') }} AS SELECT v_preb_ap1_cigh_policysummary.policyID ,
                   SUM(Ancillary_Amount) Ancillary_Amount ,
                   SUM(Fee_Amount) Fee_Amount ,
                   SUM(ServiceTransactionsFee_Amount) ServiceTransactionsFee_Amount ,
                   SUM(Ancillary_Count) Ancillary_Count ,
                   SUM(Fee_Count) Fee_Count ,
                   SUM(ServiceTransactionsFee_Count) ServiceTransactionsFee_Count
              FROM (
                    SELECT IFNULL(ds_ram_retail_repository.policyID,'0') AS policyID,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Ancillary' THEN ds_ram_retail_repository.Amount ELSE 0 END) AS Ancillary_Amount,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Fee' THEN ds_ram_retail_repository.Amount ELSE 0 END) AS Fee_Amount,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Service Transactions Fee' THEN ds_ram_retail_repository.Amount ELSE 0 END) AS ServiceTransactionsFee_Amount,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Ancillary' THEN ds_ram_retail_repository.Counter ELSE 0 END) AS Ancillary_Count,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Fee' THEN ds_ram_retail_repository.Counter ELSE 0 END) AS Fee_Count,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Service Transactions Fee' THEN ds_ram_retail_repository.Counter ELSE 0 END) AS ServiceTransactionsFee_Count
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                     INNER JOIN (
                            SELECT DISTINCT customerid,
                                   sourcedb
                              FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                           ) bvstg_customer_to_refresh
                        ON IFNULL(bvstg_customer_to_refresh.customerid,'') = IFNULL(ds_ram_retail_repository.customerid,'')
                       AND bvstg_customer_to_refresh.sourcedb = ds_ram_retail_repository.sourcedb
                     WHERE (ds_ram_retail_repository.RefreshType IN('AppOne Revenue','CIGH Ancillary','CIGH Fee','SPLC Fee','SPLC Ancillary') OR (ds_ram_retail_repository.RefreshType ='CIGHTransaction' AND ds_ram_retail_repository.classification IN ('Fee Count','Ancillary')))
                       AND ds_ram_retail_repository.isVoid = 0
                     GROUP BY IFNULL(ds_ram_retail_repository.policyID,'0')
                     UNION SELECT IFNULL(v_preb_ap1_cigh_policysummary.cigh_policyid,'0') AS policyID,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Ancillary' THEN ds_ram_retail_repository.Amount ELSE 0 END) AS Ancillary_Amount,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Fee' THEN ds_ram_retail_repository.Amount ELSE 0 END) AS Fee_Amount,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Service Transactions Fee' THEN ds_ram_retail_repository.Amount ELSE 0 END) AS ServiceTransactionsFee_Amount,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Ancillary' THEN ds_ram_retail_repository.Counter ELSE 0 END) AS Ancillary_Count,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Fee' THEN ds_ram_retail_repository.Counter ELSE 0 END) AS Fee_Count,
                           SUM(CASE WHEN ds_ram_retail_repository.classification='Service Transactions Fee' THEN ds_ram_retail_repository.Counter ELSE 0 END) AS ServiceTransactionsFee_Count
                      FROM {{ ref('UNKNOWN','V_PREB_AP1_CIGH_POLICYSUMMARY') }} v_preb_ap1_cigh_policysummary
                     INNER JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                        ON ds_ram_retail_repository.transactionid = TO_VARCHAR(v_preb_ap1_cigh_policysummary.ap1_transactionid)
                     WHERE (ds_ram_retail_repository.RefreshType IN('AppOne Revenue','CIGH Ancillary','CIGH Fee','SPLC Fee','SPLC Ancillary') OR (ds_ram_retail_repository.RefreshType ='CIGHTransaction' AND ds_ram_retail_repository.classification IN ('Fee Count','Ancillary')))
                       AND ds_ram_retail_repository.isVoid = 0
                     GROUP BY IFNULL(v_preb_ap1_cigh_policysummary.cigh_policyid,'0')
                   ) v_preb_ap1_cigh_policysummary
             GROUP BY v_preb_ap1_cigh_policysummary.policyID
