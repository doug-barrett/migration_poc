    sourceMapping:
      - aliases:
          V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT: b11dac85-5a8b-4318-bf68-54d6f620e57e
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT CDRC.*,
                   CASE WHEN ds_retail_office.TERRITORYMANAGERNAME='Michael Sanchez' THEN 'True'
                        ELSE 'False'
                         END AS ISFRANCHISE_FINAL,
                   DS_RETAIL_OFFICE.DISTRICTCODE AS DISTRICT,
                   DS_RETAIL_OFFICE.OFFICETYPE,
                   DS_RETAIL_OFFICE.statecode,
                   DS_RETAIL_OFFICE.agencyname agencyname_retail_office,
                   DS_RETAIL_OFFICE.Entityid Entityid_entity_cdrc,
                   DS_RETAIL_OFFICE.Entityname Entityname_entity_cdrc
              FROM (SELECT V_CDRC.*,
                   ifnull(office_fp_latest, office_lp_latest) PolicySummary_officecode,
                   PCO_MAP.OFFICE_PM PolicyBridge_MAtch_Officecode,
                   CASE WHEN V_CDRC.policynumberformatted IS NULL OR V_CDRC.policynumberformatted IN ('NULL','0','') OR V_CDRC.policynumberformatted like '9999999%' OR V_CDRC.policynumberformatted like '100000000%' THEN ifnull(PCO_MAP.OFFICE_CAMS, PCO_MAP.OFFICE_PM)
                        ELSE ifnull(Officecode_Policy_Match_Latest, ifnull(PCO_MAP.OFFICE_CAMS, PCO_MAP.OFFICE_PM))
                         END AS OfficeCode_Final
              FROM (SELECT *
              FROM (SELECT ISFRANCHISE ISFRANCHISE_CDRC,
                   a.CARRIERDATAREPOSITORYCOMPLETEID,
                   a.MASTERCARRIERID,
                   a.CARRIER,
                   a.carriername_mapped carriername_mapped_policynumber_formated,
                   GC.CARRIERNAME_GROUPED,
                   a.STATE AS STATE_CDRC,
                   a.AGENCY,
                   Agency.AGENCYNAME AS AGENCYMAPPING,
                   Agency.STATE AS AGENCYSTATE,
                   a.PRODUCERCODE,
                   a.PRODUCERCODE2,
                   IFNULL(a.OFFICECODE,BIAPRIMARYAGENTOFFICE) AS OFFICECODE_CDRC,
                   a.POLICYNUMBER,
                   IFNULL(a.POLICYNUMBERFORMATTED,POL.POLICYNUMBERFORMATTED) AS POLICYNUMBERFORMATTED,
                   a.ISSTANDARD,
                   IFNULL(d.TRANSTYPEMAPPINGID, b.TRANSTYPEMAPPINGID) AS TRANSTYPEMAPPINGID,
                   IFNULL(e.TRANSTYPEMAPPING,c.TRANSTYPEMAPPING) AS TRANSTYPEMAPPING123,
                   CASE WHEN POLICYNUMBER IS NULL OR POLICYNUMBER='NULL' OR POLICYNUMBER='' OR TRANSTYPEMAPPING123 IS NULL THEN 'Non-Policy Transaction'
                        ELSE 'Policy Transaction'
                         END POLICYTRANSACTIONFLAG,
                   Pol.LINEOFBUSINESSTYPE AS POLICYSUMMARY_LOB,
                   a.LOB AS CDRC_LOB,
                   CASE WHEN (IFNULL(a.LOB,Pol.LINEOFBUSINESSTYPE) IS NULL OR TRIM(IFNULL(a.LOB,Pol.LINEOFBUSINESSTYPE))='' OR TRIM(IFNULL(a.LOB,Pol.LINEOFBUSINESSTYPE))='Unknown') AND POLICYTRANSACTIONFLAG='Policy Transaction' THEN 'Auto'
                        ELSE IFNULL(a.LOB,Pol.LINEOFBUSINESSTYPE)
                         END AS LOB,
                   a.PREMIUM,
                   a.ACTUALCOMMISSIONPCT,
                   a.ACTUALCOMMISSION,
                   a.FEEAMOUNT,
                   a.TAXAMOUNT,
                   a.CASHRECDISB,
                   a.DUEINSURED,
                   a.TOTALNETAMT,
                   a.STATEMENTDATE,
                   a.VALIDATEDDATE,
                   a.FILECOMPLETEPATH,
                   a.EXECUTIONCODE,
                   a.EXECUTIONMONTH,
                   a.POLICYCOMMISSIONID,
                   a.TRANSACTIONDATE,
                   a.CODE,
                   a.TERM,
                   a.TRANSACTIONTYPE AS CDRCTransaction,
                   a.ISDUPLICATE,
                   a.isdeleted,
                   CASE WHEN IFNULL(IFNULL(a.EFFECTIVEDATE,a.TRANSACTIONDATE),PSEFFECTIVEDATE) IS NULL OR IFNULL(IFNULL(a.EFFECTIVEDATE,a.TRANSACTIONDATE),PSEFFECTIVEDATE)=DATE('1900-01-01') THEN current_date()
                        ELSE IFNULL(IFNULL(a.EFFECTIVEDATE,a.TRANSACTIONDATE),PSEFFECTIVEDATE)
                         END AS EffectiveDate,
                   IFNULL(a.EXPIRATIONDATE,Pol.EXPIRATIONDATE) AS ExpirationDate,
                   ROW_NUMBER() OVER (PARTITION BY a.CARRIERDATAREPOSITORYCOMPLETEID ORDER BY IFNULL(a.EXPIRATIONDATE,IFNULL(Pol.EXPIRATIONDATE,'1900-01-01')) DESC) AS RowNum
              FROM (SELECT V_CDRC.*,
                   ds_bvstg_comm_policynumberformatting_allsources.policynumberformatted,
                   ds_bvstg_comm_policynumberformatting_allsources.carriername_mapped,

              FROM {{ ref('STAGE','V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT') }} V_CDRC -- from RETAIL_PROD.SCH_BVSTAGE.V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT V_CDRC       left join        (select distinct policynumber_cs, carriername_cs, policynumberformatted, carriername_mapped        from [TABL
        name: BVSTG_CDRC
        noLinkRefs: []
