              LEFT OUTER JOIN {{ ref('NP','I_NPS_INVESTIGATIONEVENTCOUNT') }} I_NPS_INVESTIGATIONEVENTCOUNT
                ON I_HEALTHANDSAFETYINVESTIGATION.INVESTIGATIONCODE = I_NPS_INVESTIGATIONEVENTCOUNT.INVESTIGATIONID
               AND I_HEALTHANDSAFETYINVESTIGATION.ODSSOURCESYSTEM = I_NPS_INVESTIGATIONEVENTCOUNT.ODSSOURCESYSTEM --CHANGE HOW INVESTIGATIONS ARE COUNTED KW/CW  LEFT OUTER JOIN {{ ref('NP','L_NPS_OCCURRENCEINCIDENTSTAGE') }} L_NPS_OCCURRENCEINCIDENTSTAGE   ON I_HEALTHANDSAFETYINVESTIGATION.INVESTIGATIONCODE = INCIDENTID AND STAGETYPEID = 1  LEFT OUTER JOIN {{ ref('NP','I_AUDITQUESTIONMAPPING') }} I_AUDITQUESTIONMAPPING   ON I_AUDITQUESTIONMAPPING.OCCURRENCEINCIDENTID = I_HEALTHANDSAFETYINVESTIGATION.INVESTIGATIONCODE  LEFT OUTER JOIN {{ ref('NP','I_SHP_OBLIGATIONREFERENCE') }} I_SHP_OBLIGATIONREFERENCE   ON CONVERT(VARCHAR(15),I_AUDITQUESTIONMAPPING.QUESTIONCODE) = I_SHP_OBLIGATIONREFERENCE.QUESTIONNUMBER   AND I_SHP_OBLIGATIONREFERENCE.QUESTIONNUMBERUNIQUE = 1      WHERE STAGETYPEID IS NOT NULL OR I_HEALTHANDSAFETYINVESTIGATION.ODSSOURCESYSTEM = 'QPULSE'  --WHERE INVESTIGATIONFLAG = 'TRUE'  --NON CONFORMANCES (THESE ARE LINKED TO AN AUDIT AND WE NOW WANT TO INCLUDE THEM) AUDIT CODES ARE TRANSFORMED TO NOT APPLICABLE WHEN THE INVESTIGATION DOESN'T COME FROM AN AUDIT.  OR (I_HEALTHANDSAFETYINVESTIGATION.AUDITCODE != 'NOT APPLICABLE' AND I_HEALTHANDSAFETYINVESTIGATION.ODSSOURCESYSTEM = 'NPSAFE' AND I_HEALTHANDSAFETYINVESTIGATION.CREATEDDATE >= '01/04/2022')
