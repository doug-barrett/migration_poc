        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','H_INTERACTIONSUMMARY') }} h_interactionsummary
              JOIN {{ ref('DATA_VAULT','S_I3_INTERACTIONSUMMARY') }} s_i3_interactionsummary
                ON h_interactionsummary.hk_h_interactionsummary = s_i3_interactionsummary.hk_h_interactionsummary
              LEFT JOIN {{ ref('STAGE','V_S_MKT_I3STATIONOFFICE_CURRENT') }} v_s_mkt_i3stationoffice_current
                ON IFNULL(try_to_numeric(s_i3_interactionsummary.laststationid),0) BETWEEN v_s_mkt_i3stationoffice_current.StationStart AND StationEnd
               AND v_s_mkt_i3stationoffice_current.ISACTIVE= 'True'
             WHERE s_i3_interactionsummary.connectiontype = 1
               AND convert_timezone('UTC','America/Los_Angeles', s_i3_interactionsummary.InitiatedDateTimeUTC::timestamp_ntz) >= '2019-01-01'
               AND (('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,s_i3_interactionsummary.dss_create_time,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Cisco_Refresh_Days }}') OR ('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND TO_DATE(s_i3_interactionsummary.dss_create_time) = TO_DATE(CURRENT_DATE()))) QUALIFY ROW_NUMBER() OVER (PARTITION BY h_interactionsummary.interactionidkey ORDER BY s_i3_interactionsummary.InitiatedDateTimeUTC) = 1
