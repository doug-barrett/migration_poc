               AND (ds_pcce_termination_call_summary_session.isInbound = 1 OR ds_pcce_termination_call_summary_session.isOutbound = 1)
               AND ISINTERNALCALL = 0
               AND (('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,ds_pcce_termination_call_summary_session.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Cisco_Refresh_Days }}') OR ('{{ parameters.HWM_BVSTG_Cisco_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND TO_DATE(ds_pcce_termination_call_summary_session.DSS_CREATE_TIME) = TO_DATE(CURRENT_DATE()))) QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_pcce_termination_call_summary_session.id ORDER BY ds_pcce_termination_call_summary_session.StartDateTime) = 1
