          LEFT JOIN {{ ref(''BRONZE'', ''MRV_DW_CONTRACT_RISK_V'') }} mrv_dw_contract_risk_v ON mrv_dw_contract_risk_v.RISK_PRODUCT_OPTION_KEY = mrv_dw_product_option_v.PO_PRODUCT_OPTION_KEY /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''MRV_DW_CONTRACT_V'') }} mrv_dw_contract_v ON mrv_dw_contract_v.CONTRACT_KEY = mrv_dw_contract_risk_v.RISK_CONTRACT_KEY AND mrv_dw_contract_v.PRODUCT_SYSTEM_CODE = mrv_dw_contract_risk_v.RISK_PRODUCT_SYSTEM_CODE /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''MRV_REF360_IFRS_OPTION_TYPE_CURR_V'') }} mrv_ref360_ifrs_option_type_curr_v ON mrv_ref360_product_ifrs_curr_v.PO2_IFRS_OPTION_TYPE_CODE = mrv_ref360_ifrs_option_type_curr_v.OPT_CODE /* Detail Outer Join */

