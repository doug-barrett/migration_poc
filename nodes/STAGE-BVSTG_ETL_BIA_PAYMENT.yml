              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_EMPLOYEE_MROC_CURRENT v_s_ap1_employee_mroc_current_payment
                ON v_s_ap1_employee_mroc_current_payment.userid = v_s_ap1_payment_mroc_current.createdby
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_PAYMENTCREDITCARD_MROC_CURRENT v_s_ap1_paymentcreditcard_mroc_current
                ON v_s_ap1_paymentcreditcard_mroc_current.paymentcreditcardid = v_s_ap1_payment_mroc_current.paymentcreditcardid
              LEFT JOIN (
                    SELECT DISTINCT PAYMENTID ,
                           MAX(Depositid) DEPOSITID ,
                           MAX(Paymentdetail) PAYMENTDETAIL ,
                           SUM(Amount) DEPOSITAMOUNT
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_DEPOSITDETAIL_MROC_CURRENT
                     WHERE isvoid = FALSE
                       AND isrowdeleted = FALSE
                     GROUP BY paymentid
                   ) s_ap1_depositdetail_mroc
                ON s_ap1_depositdetail_mroc.paymentid = v_s_ap1_payment_mroc_current.paymentid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_TRANSACTION ds_bvstg_ap1_transaction
                ON ds_bvstg_ap1_transaction.transactionid = ds_bvstg_ap1_payment.transactionid
              LEFT JOIN (
                    SELECT DISTINCT a.TRANSACTIONID ,
                           a.CREATED ,
                           a.PRODUCEROFFICEID ,
                           a.PRIMARYPRODUCERID ,
                           a.TRANSACTIONSTATUSTYPEID ,
                           a.OFFICEID
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_TRANSACTION_MROC_CURRENT a
                   ) v_s_ap1_transaction_mroc_current
                ON v_s_ap1_transaction_mroc_current.TransactionID = ds_bvstg_ap1_transaction.TransactionID
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_ORGANIZATIONTRANSACTIONSTATUSTYPE_MROC_CURRENT v_s_ap1_organizationtransactionstatustype_mroc_current
                ON v_s_ap1_transaction_mroc_current.TRANSACTIONSTATUSTYPEID = v_s_ap1_organizationtransactionstatustype_mroc_current.ORGANIZATIONTRANSACTIONSTATUSTYPEID
               AND v_s_ap1_organizationtransactionstatustype_mroc_current.KEY <> 'New'
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE ds_retail_office
                ON ds_retail_office.officecode = ds_bvstg_ap1_transaction.transactionofficecode
              LEFT JOIN (
                    SELECT TRANSACTIONID ,
                           MAX(userid) USERID ,
                           MAX(created) ISSPLITCREATED
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_TRANSACTIONPRODUCER_MROC_CURRENT
                     WHERE isrowdeleted = 0
                     GROUP BY transactionid
                   ) v_s_ap1_transactionproducer_mroc_current
                ON v_s_ap1_transactionproducer_mroc_current.transactionid = ds_bvstg_ap1_transaction.transactionid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_EMPLOYEE_MROC_CURRENT v_s_ap1_employee_mroc_current
                ON v_s_ap1_employee_mroc_current.userid = v_s_ap1_transactionproducer_mroc_current.userid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_EMPLOYEE_MROC_CURRENT v_s_ap1_employee_mroc_current_void
                ON v_s_ap1_employee_mroc_current_void.userid = v_s_ap1_payment_mroc_current.voidedby
             WHERE v_s_ap1_payment_mroc_current.isrowdeleted = 0 /*AND   ( DATE(v_s_ap1_payment_mroc_current.created) BETWEEN DATEADD(DAY,-1,CURRENT_DATE())     AND CURRENT_DATE()    OR DATE(v_s_ap1_payment_mroc_current.LastUpdated) BETWEEN DATEADD(DAY,-1,CURRENT_DATE())     AND CURRENT_DATE()    OR DATE( s_ap1_paymentreceipt_mroc.created) BETWEEN DATEADD(DAY,-1,CURRENT_DATE())     AND CURRENT_DATE()    OR DATE(s_ap1_paymentreceipt_mroc.LastUpdated) BETWEEN DATEADD(DAY,-1,CURRENT_DATE())     AND CURRENT_DATE()    OR DATE(ds_bvstg_ap1_transaction.created) BETWEEN DATEADD(DAY,-1,CURRENT_DATE())     AND CURRENT_DATE()       OR DATE(ds_bvstg_ap1_transaction.dss_update_time) BETWEEN DATEADD(DAY,-1,CURRENT_DATE())     AND CURRENT_DATE()  )  */
