        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU2_POLICYSUMMARY
        join:
          joinCondition: |-
            FROM(
                    SELECT DISTINCT bvstg_au2_policysummary.transactionid AS transactionid ,
                           bvstg_au2_policysummary.created AS created ,
                           bvstg_au2_policysummary.NBTransactionID AS NBTransactionID ,
                           CASE WHEN bvstg_au2_policysummary_prev.TransactionID IS NULL                                                                                                                                      THEN 'NEW/NEW'
                                WHEN bvstg_au2_policysummary_prev.Status_Standard ='Active'                                                                                                                                  THEN 'REPLACEMENT'
                                WHEN DATEADD(DAY,30,bvstg_au2_policysummary_prev.EndDate) >=bvstg_au2_policysummary.StartDate                                                                                                THEN 'REPLACEMENT'
                                WHEN DATEADD(DAY,30,bvstg_au2_policysummary_prev.EndDate) < bvstg_au2_policysummary.StartDate AND DATEADD(DAY,365,bvstg_au2_policysummary_prev.EndDate) >= bvstg_au2_policysummary.StartDate THEN 'WINBACK'
                                ELSE 'OLD/NEW'
                                 END AS customer_type
                      FROM {{ ref('STAGE','BVSTG_AU2_POLICYSUMMARY') }} bvstg_au2_policysummary
                      LEFT JOIN {{ ref('STAGE','BVSTG_AU2_POLICYSUMMARY') }} bvstg_au2_policysummary_prev
                        ON (bvstg_au2_policysummary.CustomerID = bvstg_au2_policysummary_prev.CustomerID AND bvstg_au2_policysummary_prev.Startdate < bvstg_au2_policysummary.StartDate AND bvstg_au2_policysummary_prev.TransactionType='New Business')
                     WHERE bvstg_au2_policysummary.SourceDB NOT IN('SPLC') QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_au2_policysummary.transactionid ORDER BY CASE WHEN bvstg_au2_policysummary.status_standard='Active' THEN 1 ELSE 2 END, CASE WHEN bvstg_au2_policysummary_prev.status_standard='Active' THEN 1 ELSE 2 END, CASE WHEN bvstg_au2_policysummary_prev.status_standard='Active' OR bvstg_au2_policysummary_prev.EndDate > bvstg_au2_policysummary.StartDate THEN bvstg_au2_policysummary.StartDate ELSE bvstg_au2_policysummary_prev.EndDate END DESC, bvstg_au2_policysummary_prev.StartDate DESC, bvstg_au2_policysummary.policyid, bvstg_au2_policysummary.PolicyNumber, bvstg_au2_policysummary.Customerno, bvstg_au2_policysummary.EndDate, bvstg_au2_policysummary.PolicyStatus) = 1
                     UNION SELECT DISTINCT bvstg_au2_policysummary.transactionid AS transactionid ,
                           bvstg_au2_policysummary.created AS created ,
                           bvstg_au2_policysummary.NBTransactionID AS NBTransactionID ,
                           CASE WHEN NEW_NEW = 1                            THEN 'NEW/NEW'
                                WHEN NEW_OLD = 1 OR CROSS_SELL_EXISTING = 1 THEN 'OLD/NEW'
                                WHEN REPLACEMENT_FLAG = 1                   THEN 'REPLACEMENT'
                                WHEN WINBACK_FLAG = 1                       THEN 'WINBACK'
                                WHEN RENEWAL_ALL_CUSTOMERS = 1              THEN 'RENEWAL'
                                WHEN ANCILLARY_ALL_CUSTOMERS = 1            THEN 'ANCILLARY'
                                 END customer_type
                      FROM RETAIL_PROD.SCH_BVSTAGE.BVSTG_AU2_POLICYSUMMARY bvstg_au2_policysummary
                     INNER JOIN (
                            SELECT PolicyID,
                                   REPLACEMENT_FLAG,
                                   WINBACK_FLAG,
                                   NEW_OLD,
                                   NEW_NEW,
                                   CROSS_SELL_EXISTING,
                                   RENEWAL_ALL_CUSTOMERS,
                                   ANCILLARY_ALL_CUSTOMERS
                              FROM RETAIL_PROD.SCH_EDW.DS_SPLC_COMISSION_RATE QUALIFY ROW_NUMBER() OVER (PARTITION BY PolicyID ORDER BY NEW_NEW DESC,NEW_OLD DESC,REPLACEMENT_FLAG DESC,REPLACEMENT_FLAG DESC,CROSS_SELL_EXISTING DESC,RENEWAL_ALL_CUSTOMERS DESC,ANCILLARY_ALL_CUSTOMERS DESC) = 1
                           ) DS_SPLC_COMISSION_RATE
                        ON bvstg_au2_policysummary.policyid = DS_SPLC_COMISSION_RATE.policyid
                     WHERE bvstg_au2_policysummary.SourceDB IN('SPLC')
                   )bvstg_au2_policysummary
