          DS_SPLC_POLICYTRANSACTION: 51e265a9-c257-4e55-bc0b-eeea8fcb6ad0
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_CP_NEW_OLD_ACTIVE_POS') }} AS SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.ID
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
             INNER JOIN (
                    SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.POLICYID
                      FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
                     INNER JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION_NEW_OLD_ACT
                        ON DS_SPLC_POLICYTRANSACTION.CustomerID = DS_SPLC_POLICYTRANSACTION_NEW_OLD_ACT.CustomerID
                       AND DS_SPLC_POLICYTRANSACTION_NEW_OLD_ACT.TranType IN('NBS','RWL','REW')
                       AND (DS_SPLC_POLICYTRANSACTION_NEW_OLD_ACT.Status IN('Active','Reinstated') OR (DS_SPLC_POLICYTRANSACTION_NEW_OLD_ACT.Status IN('Expired','Cancelled') AND DS_SPLC_POLICYTRANSACTION_NEW_OLD_ACT.StatusDate = DS_SPLC_POLICYTRANSACTION.EFFECTIVEDATE))
                       AND DATE(DS_SPLC_POLICYTRANSACTION_NEW_OLD_ACT.ReportDate) <= DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)
                       AND DS_SPLC_POLICYTRANSACTION.ID != DS_SPLC_POLICYTRANSACTION_NEW_OLD_ACT.ID
                       AND DS_SPLC_POLICYTRANSACTION.PolicyID != DS_SPLC_POLICYTRANSACTION_NEW_OLD_ACT.PolicyID
                     WHERE DS_SPLC_POLICYTRANSACTION.TranType IN('NBS','RWL','REW')
                   )DS_SPLC_POLICYTRANSACTION_POL
                ON DS_SPLC_POLICYTRANSACTION.POLICYID = DS_SPLC_POLICYTRANSACTION_POL.POLICYID
        dependencies:
