        joinCondition: "FROM {{ ref('GOLD', 'SRC_CUSMASFL') }} \"SRC_CUSMASFL\"\nLEFT OUTER JOIN {{ ref('GOLD', 'CV_PARTY') }} \"CV_PARTY\"\nON   SRC_CUSMASFL.CMCMP = CV_PARTY.COMPANY_CODE\nAND  SRC_CUSMASFL.CMCUS0 = CV_PARTY.CUSTOMER_ACCOUNT_NUM\nAND  CV_PARTY.PARTY_TYPE_CODE = 1\n\n Where SRC_CUSMASFL.Aud_Time <= (Select MAX(Batch_End)   from {{ ref('GOLD', 'CDC_BATCH') }})\n AND    SRC_CUSMASFL.Aud_Time >   (Select MAX(Batch_Start)  from {{ ref('GOLD', 'CDC_BATCH') }})\n AND   (SRC_CUSMASFL.Aud_Code <> 'F' or (SRC_CUSMASFL.Aud_Code is null and SRC_CUSMASFL.Aud_Type = 'RR'))\n\n QUALIFY RANK() \n OVER (PARTITION BY  SRC_CUSMASFL.CMCMP, SRC_CUSMASFL.CMCUS0\n ORDER BY SRC_CUSMASFL.AUD_TIME DESC, SRC_CUSMASFL.AUD_SEQNO DESC, CASE  \n WHEN SRC_CUSMASFL.Aud_Type in ('PT','PX','FI')\tTHEN 1 \n WHEN SRC_CUSMASFL.Aud_Type in ('UB','FB','FP','BR')\tTHEN 2 \n WHEN SRC_CUSMASFL.Aud_Type in ('UP','UR')\tTHEN 3 \n WHEN SRC_CUSMASFL.Aud_Type in ('DL','FD')\tTHEN 4 \n WHEN SRC_CUSMASFL.Aud_Type in ('RR')\t\
