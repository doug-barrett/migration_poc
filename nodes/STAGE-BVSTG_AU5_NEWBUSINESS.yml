                   CASE WHEN (v_bvstg_coverage_limits_mapping.limitperpersonclean IS NULL AND v_bvstg_coverage_limits_mapping.limitperaccidentclean IS NULL AND v_bvstg_coverage_limits_mapping_1.limittotalclean IS NULL) OR (v_bvstg_coverage_limits_mapping.limitperpersonclean = '0' AND v_bvstg_coverage_limits_mapping.limitperaccidentclean = '0' AND v_bvstg_coverage_limits_mapping_1.limittotalclean = '0') OR (v_bvstg_coverage_limits_mapping.limitperpersonclean = 'Discrepancy' AND v_bvstg_coverage_limits_mapping.limitperaccidentclean = 'Discrepancy') OR (v_bvstg_coverage_limits_mapping_1.limittotalclean = 'Discrepancy') THEN 'Missing'
                        WHEN (v_bvstg_coverage_statelimits_mapping.bilimitperperson = v_bvstg_coverage_limits_mapping.limitperpersonclean AND v_bvstg_coverage_statelimits_mapping.bilimitperaccident = v_bvstg_coverage_limits_mapping.limitperaccidentclean) OR (v_bvstg_coverage_statelimits_mapping.pdperaccident = v_bvstg_coverage_limits_mapping_1.limittotalclean)                                                                                                                                                                                                                                                                      THEN 'Minimum Limits'
