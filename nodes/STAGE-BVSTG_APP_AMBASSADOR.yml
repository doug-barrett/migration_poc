        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT top 1 TO_VARCHAR(Tress.UserID) UserID ,
                   Tress.ORG ,
                   TO_VARCHAR(Tress.ULTIPRONUMBER) ULTIPRONUMBER ,
                   TO_VARCHAR(Tress.EMPLOYEENUMBER) EMPLOYEENUMBER ,
                   UPPER(REPLACE(REPLACE(REPLACE(Tress.FIRSTNAME,'?','Ñ'),'Ã'),'Ñ')) FIRSTNAME ,
                   UPPER(REPLACE(REPLACE(REPLACE(Tress.LastName,'?','Ñ'),'Ã'),'Ñ')) LastName ,
                   UPPER(REPLACE(REPLACE(REPLACE(Tress.FullName,'?','Ñ'),'Ã'),'Ñ')) FullName ,
                   Tress.UserI3 UserName ,
                   UPN.UPN CISCO_LOGINNAME ,
                   'CONFIE' COMPANYCODE ,
                   Tress.HIREDATE ORIGINALHIREDATE ,
                   Tress.HIREDATE HIRE_DATE ,
                   Tress.ENDDATE TerminationDate ,
                   Tress.STATUS ,
                   Tress.POSITIONNAME ,
                   Tress.POSITIONNAME JOBFAMILY ,
                   UPN.ULTIPROEMAILADDRESS ,
                   TO_VARCHAR(Tress.OfficeID) CORPORATEOFFICENUMBER ,
                   Tress.OFFICENAME OFFICECODE ,
                   Tress.OFFICENAME ,
                   'Tijuana' CITY ,
                   'Baja California' STATE ,
                   'BC' STATECODE ,
                   Tress.DEPARTMENTNAME ,
                   TO_VARCHAR(Tress.DepartmentID) AreaCode ,
                   CASE WHEN sup.supervisorid IS NOT NULL THEN CASE WHEN LEN(sup.supervisorid) > 6 THEN RIGHT('00000' || sup.supervisorid,10) ELSE RIGHT('0000' || sup.supervisorid,6) END
                        ELSE TO_VARCHAR(tress.supervisorid)
                         END supervisorid ,
                   CASE WHEN sup.supervisorid IS NOT NULL THEN 'US'
                        ELSE 'TJ'
                         END SupOrg ,
                   tress.supervisor ,
                   TO_VARCHAR(IFNULL(man.managerid,tress.managerid)) managerid ,
                   CASE WHEN man.managerid IS NOT NULL THEN 'US'
                        ELSE 'TJ'
                         END ManOrg ,
                   tress.manager ,
                   TO_VARCHAR(IFNULL(dir.directorid,tress.managerid)) directorid ,
                   CASE WHEN dir.directorid IS NOT NULL THEN 'US'
                        ELSE 'TJ'
                         END DirOrg ,
                   tress.director ,
                   '' REGIONCODE ,
                   '' REGIONEMPLOYEEID ,
                   '' REGIONMANAGERNAME ,
                   '' TERRITORYCODE ,
                   '' TERRITORYEMPLOYEEID ,
                   '' TERRITORYMANAGERNAME ,
                   CASE WHEN sup.supervisorid IS NOT NULL THEN CASE WHEN LEN(sup.supervisorid) > 6 THEN RIGHT('00000' || sup.supervisorid,10) ELSE RIGHT('0000' || sup.supervisorid,6) END
                        ELSE TO_VARCHAR(tress.supervisorid)
                         END ReportTo ,
                   tress.supervisor ReportToName ,
                   CASE WHEN sup.supervisorid IS NOT NULL THEN 'US'
                        ELSE 'TJ'
                         END ReportToOrg ,
                   Tress.WORKINGON ,
                   Tress.WORKINGPLACE ,
                   Tress.EMPLOYEESYSTEM ,
                   TO_VARCHAR(Tress.AGENTSKILLTARGETID) AGENTSKILLTARGETID ,
                   '' LICENSE_STATUS ,
                   tress.DEPARTMENTID
              FROM RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT Tress
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CPS_EMPLOYEESUPN_CURRENT UPN
                ON TO_VARCHAR(Tress.ULTIPRONUMBER) = TO_VARCHAR(UPN.employeenumber)
              LEFT JOIN(
                    SELECT DISTINCT a.UserID,
                           (CAST(b.employeenumber AS number(18,0)) * -1) SupervisorID
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT a
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT b
                        ON a.supervisorid = b.UserID
                       AND CAST(b.employeenumber AS number(18,0)) < 0
                     WHERE a.ORG = 'TJ'
                   )sup
                ON TO_VARCHAR(Tress.UserID) = TO_VARCHAR(sup.UserID)
              LEFT JOIN(
                    SELECT DISTINCT a.UserID,
                           (CAST(b.employeenumber AS number(18,0)) * -1) ManagerID
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT a
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT b
                        ON a.managerid = b.UserID
                       AND CAST(b.employeenumber AS number(18,0)) < 0
                     WHERE a.ORG = 'TJ'
                   )Man
