              FROM RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT Tress
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CPS_EMPLOYEESUPN_CURRENT UPN
                ON TO_VARCHAR(Tress.ULTIPRONUMBER) = TO_VARCHAR(UPN.employeenumber)
              LEFT JOIN(
                    SELECT DISTINCT a.UserID,
                           (CAST(b.employeenumber AS number(18,0)) * -1) SupervisorID
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT a
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT b
                        ON a.supervisorid = b.UserID
                       AND CAST(b.employeenumber AS number(18,0)) < 0
                     WHERE a.ORG = 'TJ'
                   )sup
                ON TO_VARCHAR(Tress.UserID) = TO_VARCHAR(sup.UserID)
              LEFT JOIN(
                    SELECT DISTINCT a.UserID,
                           (CAST(b.employeenumber AS number(18,0)) * -1) ManagerID
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT a
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT b
                        ON a.managerid = b.UserID
                       AND CAST(b.employeenumber AS number(18,0)) < 0
                     WHERE a.ORG = 'TJ'
                   )Man
