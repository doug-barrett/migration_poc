                   UPN.ULTIPROEMAILADDRESS ,
                   TO_VARCHAR(Tress.OfficeID) CORPORATEOFFICENUMBER ,
                   Tress.OFFICENAME OFFICECODE ,
                   Tress.OFFICENAME ,
                   'Tijuana' CITY ,
                   'Baja California' STATE ,
                   'BC' STATECODE ,
                   Tress.DEPARTMENTNAME ,
                   TO_VARCHAR(Tress.DepartmentID) AreaCode ,
                   CASE WHEN sup.supervisorid IS NOT NULL THEN CASE WHEN LEN(sup.supervisorid) > 6 THEN RIGHT('00000' || sup.supervisorid,10) ELSE RIGHT('0000' || sup.supervisorid,6) END
                        ELSE TO_VARCHAR(tress.supervisorid)
                         END supervisorid ,
                   CASE WHEN sup.supervisorid IS NOT NULL THEN 'US'
                        ELSE 'TJ'
                         END SupOrg ,
                   tress.supervisor ,
                   TO_VARCHAR(IFNULL(man.managerid,tress.managerid)) managerid ,
                   CASE WHEN man.managerid IS NOT NULL THEN 'US'
                        ELSE 'TJ'
                         END ManOrg ,
                   tress.manager ,
                   TO_VARCHAR(IFNULL(dir.directorid,tress.managerid)) directorid ,
                   CASE WHEN dir.directorid IS NOT NULL THEN 'US'
                        ELSE 'TJ'
                         END DirOrg ,
                   tress.director ,
                   '' REGIONCODE ,
                   '' REGIONEMPLOYEEID ,
                   '' REGIONMANAGERNAME ,
                   '' TERRITORYCODE ,
                   '' TERRITORYEMPLOYEEID ,
                   '' TERRITORYMANAGERNAME ,
                   CASE WHEN sup.supervisorid IS NOT NULL THEN CASE WHEN LEN(sup.supervisorid) > 6 THEN RIGHT('00000' || sup.supervisorid,10) ELSE RIGHT('0000' || sup.supervisorid,6) END
                        ELSE TO_VARCHAR(tress.supervisorid)
                         END ReportTo ,
                   tress.supervisor ReportToName ,
                   CASE WHEN sup.supervisorid IS NOT NULL THEN 'US'
                        ELSE 'TJ'
                         END ReportToOrg ,
                   Tress.WORKINGON ,
