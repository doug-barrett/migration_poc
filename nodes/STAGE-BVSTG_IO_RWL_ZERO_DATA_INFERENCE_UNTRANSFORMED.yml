        join:
          joinCondition: |-
            FROM (
                    SELECT a.TIMELINE_ID,
                           a.DEAL_ID,
                           a.MOVED_TO_BUCKET_AT,
                           a.NEXT_MOVED_TO_BUCKET_AT,
                           b.TIMELINE_ID AS contacts_TIMELINE_ID,
                           CONVERT_TIMEZONE('America/Los_Angeles', createat)::TIMESTAMP_NTZ contacts_STARTDATETIME,
                           TIMELINE_TYPE contacts_TIMELINETYPE,
                           b.TIMELINE_INFO contacts_TIMELINEINFO,
                           b.AGENT_NAME contacts_TIMELINEAGENT
                      FROM {{ ref('STAGE','BVSTG_IO_LEAD_OPPORTUNITY_AU2C_DEALS') }} a
                      JOIN DATA_LAKE.API.dl_api_insuredmine_timelines b
                        ON a.deal_id = b.deal_id
                     WHERE TIMELINE_TYPE IN ('sms', 'email', 'notes')
                       AND b.dss_current_flag = 'Y'
                   ) bvstg_io_lead_opportunity_au2c_deals
             WHERE contacts_STARTDATETIME >= MOVED_TO_BUCKET_AT
               AND contacts_STARTDATETIME <= COALESCE(NEXT_MOVED_TO_BUCKET_AT, current_timestamp())
             GROUP BY TIMELINE_ID
        name: BVSTG_IO_RWL_ZERO_DATA_INFERENCE_UNTRANSFORMED
