        join:
          joinCondition: |-
            FROM {{ ref('NP','I_PG_EMPLOYEE') }} I_PG_EMPLOYEE
              LEFT OUTER JOIN {{ ref('NP','I_PG_EMPLOYEE') }} EMPLOYEE
                ON I_PG_EMPLOYEE.EMPLOYEECODE = EMPLOYEE.CORRECTMANAGERCODE --CURRENT EMPLOYEES   AND EMPLOYEE.TERMINATED = 0   -- DO NOT COUNT CONTRACTORS   AND ISNULL(EMPLOYEE.PAYPERIODCODE,'NP') NOT IN ('NP','MD')    --CURRENT EMPLOYEES  WHERE I_PG_EMPLOYEE.TERMINATED = 0  --EXCLUDE CONTRACTORS UNLESS THEY HAVE PEOPLE REPORTING TO THEM  AND (ISNULL(I_PG_EMPLOYEE.PAYPERIODCODE,'NP') NOT IN ('NP','MD') OR I_PG_EMPLOYEE.EMPLOYEECODE IN (SELECT DISTINCT CORRECTMANAGERCODE FROM I_PG_EMPLOYEE WHERE TERMINATED = 0))  --EXCLUDE ANYONE WHO HAS NOT STARTED YET, NOTE JOB RUNS AFTER MIDNIGHT  AND CONVERT(DATE,I_PG_EMPLOYEE.STARTDATE) <= CONVERT(DATE,GETDATE())  --AT SOME STAGE WE NEED TO SIMPLIFY WHEN OUR SNAPSHOT IS TAKEN SO WE CAN DEFINITELY GET THE SNAPSHOT AS AT THE EVENING OF THE LAST DAY OF THE MONTH  --THE ACTUAL JOB RUNS AFTER MIDNIGHT AND SHOULD CONTINUE TO DO SO, SO SNAPSHOT WILL ALWAYS BE TAKEN AT THE BEGINNING OF THE MONTH  -- THIS CLAUSE WILL ENSURE THE JOB DOES NOT FAIL FOR THE MAJORITY OF THE MONTH  -- BUT DURING THE SNAPSHOT LOCKING IN PERIOD, IF THERE ARE ISSUES, IT WILL FAIL AND WE CAN CHECK WITH PAYROLL AS TO THE CORRECT STATE  AND (DAY(GETDATE()) <= 3 OR CONVERT(DATE,ISNULL(I_PG_EMPLOYEE.PLANNEDTERMINATIONDATE, GETDATE())) >= CONVERT(DATE,GETDATE()))  GROUP BY I_PG_EMPLOYEE.EMPLOYEECODE, I_PG_EMPLOYEE.CORRECTMANAGERCODE
        name: I_EMPLOYEEDIRECTREPORTS
