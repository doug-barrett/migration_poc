        join:
          joinCondition: |-
            EXTENDED
              FROM ((
                    SELECT bvstg_comm_au_confie_opm.monthyear,
                           bvstg_comm_au_confie_opm.accounts_mapped,
                           ud2id,
                           ud1id,
                           CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY Accounts_Mapped,ud2id,ud1id ORDER BY monthyear)
                                ELSE values_month
                                 END AS values_month,
                           'IT_0044' AS sg_description
                      FROM (
                            SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                   accounts_mapped,
                                   ifnull(sum(values_month),0) values_month,
                                   ud2id,
                                   ud1id
                              FROM {{ ref('STAGE','BVSTG_COMM_AU10_CONFIE_OPM') }}
                             WHERE concat(ud2id,ud1id) IN (
                                    SELECT DISTINCT concat(ud2id,ud1id)
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU9_CONFIE_OPM') }}
                                     WHERE sg_description= 'IT_0044'
                                   )
                               AND accountid IN (
                                    SELECT DISTINCT childid
                                      FROM {{ ref('STAGE','DS_BVSTG_ACCOUNTID_MAPPING') }}
                                   )
                               AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                             GROUP BY accounts_mapped,
                                      ud2id,
                                      ud1id,
                                      date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                           ) bvstg_comm_au_confie_opm
                   )
            UNION ALL (
                    SELECT bvstg_comm_au2_confie_opm.monthyear,
                           bvstg_comm_au2_confie_opm.accounts_mapped,
                           ud2id,
                           ud1id,
                           CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY Accounts_Mapped,ud2id,ud1id ORDER BY monthyear)
                                ELSE values_month
                                 END AS values_month,
                           'IT_0049' AS sg_description
                      FROM (
                            SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                   accounts_mapped,
                                   ifnull(sum(values_month),0) values_month,
                                   ud2id,
                                   ud1id
                              FROM {{ ref('STAGE','BVSTG_COMM_AU10_CONFIE_OPM') }}
                             WHERE concat(ud2id,ud1id) IN (
                                    SELECT DISTINCT concat(ud2id,ud1id)
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU9_CONFIE_OPM') }}
                                     WHERE sg_description= 'IT_0049'
                                   )
                               AND accountid IN (
                                    SELECT DISTINCT childid
                                      FROM {{ ref('STAGE','DS_BVSTG_ACCOUNTID_MAPPING') }}
                                   )
                               AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                             GROUP BY accounts_mapped,
                                      ud2id,
                                      ud1id,
                                      date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                           ) bvstg_comm_au2_confie_opm
                   )
            UNION ALL (
                    SELECT bvstg_comm_au3_confie_opm.monthyear,
                           bvstg_comm_au3_confie_opm.accounts_mapped,
                           ud2id,
                           ud1id,
                           CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY Accounts_Mapped,ud2id,ud1id ORDER BY monthyear)
                                ELSE values_month
                                 END AS values_month,
                           'IT_0035' AS sg_description
                      FROM (
                            SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                   accounts_mapped,
                                   ifnull(sum(values_month),0) values_month,
                                   ud2id,
                                   ud1id
                              FROM {{ ref('STAGE','BVSTG_COMM_AU10_CONFIE_OPM') }}
                             WHERE concat(ud2id,ud1id) IN (
                                    SELECT DISTINCT concat(ud2id,ud1id)
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU9_CONFIE_OPM') }}
                                     WHERE sg_description= 'IT_0035'
                                   )
                               AND accountid IN (
                                    SELECT DISTINCT childid
                                      FROM {{ ref('STAGE','DS_BVSTG_ACCOUNTID_MAPPING') }}
                                   )
                               AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                             GROUP BY accounts_mapped,
                                      ud2id,
                                      ud1id,
                                      date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                           ) bvstg_comm_au3_confie_opm
                   )
            UNION ALL ( SELECT bvstg_comm_au4_confie_opm.monthyear,
                   bvstg_comm_au4_confie_opm.accounts_mapped,
