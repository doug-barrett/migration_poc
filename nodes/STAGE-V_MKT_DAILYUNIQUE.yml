        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_MKT_DAILYUNIQUE') }} AS SELECT DISTINCT a.call_id,
                   1 isDailyUnique
              FROM (
                    SELECT call_id,
                           (RANK() OVER (PARTITION BY caller_number,TO_DATE(Call_Start) ORDER BY Call_Start)) isDailyUnique
                      FROM {{ ref('STAGE','BVSTG_MKT_AU1B_CALL_LOG_CARS') }}
                     WHERE isNonUnique = 1
                       AND ifnull(caller_number,'')<>''
                   )a
             WHERE a.isDailyUnique = 1
               AND a.call_id NOT IN (
                    SELECT b.call_id
                      FROM (
                            SELECT call_id,
                                   RANK() OVER(PARTITION BY TO_DATE(Call_Start),caller_Number ORDER BY CASE WHEN Call_Status IN('ANSWER','SYSTEM CONNECT') THEN 1 ELSE 2 END, Call_Start, call_id) Ranking
                              FROM {{ ref('STAGE','BVSTG_MKT_AU1B_CALL_LOG_CARS') }}
                           ) b
                     WHERE b.Ranking>1
                   )
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_MKT_AU1B_CALL_LOG_CARS
