                           DSS_LOAD_DATE ,
                           DSS_RECORD_SOURCE
                      FROM {{ ref('DATA_VAULT','REF_AP1_GENDER') }}
                     UNION SELECT PAYMENTTYPEID CODEVALUEID ,
                           CURRENT_DATE() CREATED ,
                           1 CREATEDBY ,
                           CURRENT_DATE() LASTUPDATED ,
                           1 LASTUPDATEDBY ,
                           CASE WHEN ISROWDELETED = 'TRUE' THEN 1
