                           DSS_LOAD_DATE ,
                           DSS_RECORD_SOURCE
                      FROM {{ ref('DATA_VAULT','REF_AP1_CUSTOMERVERBALLANGUAGETYPE') }}
                     UNION SELECT FEETYPEID CODEVALUEID ,
