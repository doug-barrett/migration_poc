                           1 LASTUPDATEDBY ,
                           0 ISROWDELETED ,
                           49 CODEDEFINITIONID ,
                           CODE ,
                           ENUMSTRINGVALUE CODEVALUE ,
                           ENUMSTRINGVALUE CODEDESCRIPTION ,
                           DSS_LOAD_DATE ,
                           DSS_RECORD_SOURCE
                      FROM {{ ref('DATA_VAULT','REF_AP1_CUSTOMERDOCUMENTLANGUAGETYPE') }}
                     UNION SELECT CUSTOMERSTATUSID CODEVALUEID ,
                           CURRENT_DATE() CREATED ,
