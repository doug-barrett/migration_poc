                           CURRENT_DATE() LASTUPDATED ,
                           1 LASTUPDATEDBY ,
                           CASE WHEN ISROWDELETED = 'TRUE' THEN 1
                                ELSE 0
                                 END ISROWDELETED ,
                           6 CODEDEFINITIONID ,
                           CODE ,
