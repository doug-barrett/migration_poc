        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_AP1_CODEVALUE') }} AS SELECT DISTINCT CODEVALUEID,
                   CREATED,
                   CREATEDBY,
                   LASTUPDATED,
                   LASTUPDATEDBY,
                   ISROWDELETED,
                   CODEDEFINITIONID,
                   CODE,
                   CODEVALUE,
                   CODEDESCRIPTION,
                   DSS_LOAD_DATE,
                   DSS_RECORD_SOURCE
              FROM(
                    SELECT ADDITIONALPRODUCTTYPEID CODEVALUEID ,
                           CURRENT_DATE() CREATED ,
                           1 CREATEDBY ,
                           CURRENT_DATE() LASTUPDATED ,
                           1 LASTUPDATEDBY ,
                           0 ISROWDELETED ,
                           43 CODEDEFINITIONID ,
                           CODE ,
                           ENUMSTRINGVALUE CODEVALUE ,
                           ENUMSTRINGVALUE CODEDESCRIPTION ,
                           DSS_LOAD_DATE ,
                           DSS_RECORD_SOURCE
                      FROM {{ ref('DATA_VAULT','REF_AP1_ADDITIONALPRODUCTTYPE') }}
                     UNION SELECT ADDRESSTYPEID CODEVALUEID ,
                           CURRENT_DATE() CREATED ,
                           1 CREATEDBY ,
                           CURRENT_DATE() LASTUPDATED ,
                           1 LASTUPDATEDBY ,
                           0 ISROWDELETED ,
                           10 CODEDEFINITIONID ,
                           CODE ,
                           ENUMSTRINGVALUE CODEVALUE ,
                           ENUMSTRINGVALUE CODEDESCRIPTION ,
                           DSS_LOAD_DATE ,
