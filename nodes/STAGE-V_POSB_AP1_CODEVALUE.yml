                           DSS_LOAD_DATE ,
                           DSS_RECORD_SOURCE
                      FROM {{ ref('DATA_VAULT','REF_AP1_USSTATE') }}
                     UNION SELECT CODEVALUEID ,
                           CREATED ,
                           CREATEDBY ,
                           LASTUPDATED ,
                           LASTUPDATEDBY ,
                           CASE WHEN ISROWDELETED = 'TRUE' THEN 1
                                ELSE 0
                                 END ISROWDELETED ,
                           CODEDEFINITIONID ,
                           CODE ,
                           CODEVALUE ,
                           CODEDESCRIPTION ,
                           DSS_LOAD_DATE ,
                           DSS_RECORD_SOURCE
                      FROM {{ ref('LOAD','V_AP1_CODEVALUE') }}
                     WHERE CODEDEFINITIONID NOT IN (1,2,5,6,10,13,14,17,21,28,33,43,48,49)
                   )codevalue QUALIFY ROW_NUMBER() OVER (PARTITION BY CODEVALUEID ORDER BY DSS_LOAD_DATE)=1
