        - locationName: GOLD
          nodeName: SRC_EMPLOYEE_Load
        - locationName: GOLD
          nodeName: CV_LOCATION
        - locationName: GOLD
          nodeName: CV_USER_BIO
      join:
        joinCondition: |-
          FROM (
              SELECT TRIM(SRC_EMPLOYEE_Load.JOBCODE) AS Job_Code
              , SUBSTRING(SRC_EMPLOYEE_Load.JOBTITLEDESCR, 1, 30) AS Job_Description 
              , COUNT(SRC_EMPLOYEE_Load.EMPLID) AS EMPLID_CNT
          FROM {{ ref('GOLD', 'SRC_EMPLOYEE_Load') }} "SRC_EMPLOYEE_Load"
          
          LEFT OUTER JOIN {{ ref('GOLD', 'CV_LOCATION') }} "CV_LOCATION"
          ON SRC_EMPLOYEE_Load.WORKLOCATION = CV_LOCATION.Location_Code
          AND CV_LOCATION.Company_Code = 'U1'
          
          LEFT OUTER JOIN {{ ref('GOLD', 'CV_USER_BIO') }} "CV_USER_BIO"
          ON CV_USER_BIO.Payroll_Employee = '0000'||SRC_EMPLOYEE_Load.EMPLID
          
          WHERE SRC_EMPLOYEE_Load.HRSTATUS = 'A'
          AND SRC_EMPLOYEE_Load.JOBCODE IS NOT NULL
          
          GROUP BY 1,2) EMPL_JOB_CODES
          QUALIFY ROW_NUMBER () 
                  OVER(PARTITION BY EMPL_JOB_CODES.Job_Code 
                       ORDER BY EMPL_JOB_CODES.EMPLID_CNT DESC
                      )=1
      name: STG_EMPLOYEE_JOB_CODES
