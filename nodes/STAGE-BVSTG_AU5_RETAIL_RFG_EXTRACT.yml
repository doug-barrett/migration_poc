        join:
          joinCondition: |-
            FROM (SELECT *
              FROM (SELECT Customerstate,
                   officecode,
                   employeenumber AS producer,
                   asofmonth,
                   policysource,
                   lineofbusiness,
                   carrier,
                   count(DISTINCT policynumberformatted, carrier) PIF
              FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }} --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_EOM_EXTRACT_ALLSOURCES"    where combinedstatus_eom = 'Active' and policysource in ('AppOne', 'CIGH','SPLC') and AgencyState <> 'Unknown'    and (asofmonth <> date_trunc('month', add_months(current_date(), -1))          or carrier not in (select distinct carrier       from {{ ref('STAGE','BVSTG_COMM_AU4_DASHBOARD_EXTRACT') }}      --from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU4_DASHBOARD_EXTRACT"      ))    group by Customerstate,officecode, employeenumber, asofmonth, policysource, lineofbusiness, carrier)    union all    (select Customerstate,OfficeCode, Producer, AsofMonth, PolicySource, LineOfBusiness, ds_comm_eom_extract_allsources.Carrier,            ifnull(BOM + NBS - round(BOM * CancellationRate_MovingAverage) - round(BOM * PendingRenewalRate_MovingAverage)            + round(round(BOM * PendingRenewalRate_MovingAverage)*RenewalRAte_MovingAverage)  + round(BOM * ReinstatementRate_MovingAverage), 0) PIF    from    (select     ifnull(a.Customerstate, b.Customerstate) Customerstate,    ifnull(a.officecode, b.officecode) OfficeCode,           ifnull(a.employeenumber, b.employeenumber) producer,           ifnull(a.asofmonth, b.nbsmonth) asofmonth,           ifnull(a.policysource, b.policysource) policysource,           ifnull(a.lineofbusiness, b.lineofbusiness) LineOfBusiness,           ifnull(a.carrier, b.carrier) Carrier,           ifnull(BOM, 0) BOM,           ifnull(NBS,0) NBS    from    (select Customerstate,officecode, employeenumber, asofmonth, policysource, lineofbusiness,            carrier, count(distinct policynumberformatted, carrier) BOM    from {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}    --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_EOM_EXTRACT_ALLSOURCES"    where combinedstatus_bom = 'Active' and policysource in ('AppOne', 'CIGH','SPLC')     and asofmonth = date_trunc('month', add_months(current_date(), -1))     and carrier  in (select distinct carrier     from {{ ref('STAGE','BVSTG_COMM_AU4_DASHBOARD_EXTRACT') }}    --from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU4_DASHBOARD_EXTRACT"    )    group by Customerstate,officecode, employeenumber, asofmonth, policysource, lineofbusiness, carrier) a    full outer join    (select Customerstate,officecode, employeenumber, nbsmonth, policysource, lineofbusiness,            carrier, count(distinct policynumberformatted, carrier) NBS    from {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}    --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_EOM_EXTRACT_ALLSOURCES"    where nbsmonth =  date_trunc('month', add_months(current_date(), -1)) and policysource in ('AppOne', 'CIGH','SPLC')     and carrier  in (select distinct carrier                      from {{ ref('STAGE','BVSTG_COMM_AU4_DASHBOARD_EXTRACT') }})         --from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU4_DASHBOARD_EXTRACT")    group by Customerstate,officecode, employeenumber, nbsmonth, policysource, lineofbusiness, carrier) b    on ifnull(a.Customerstate, '-') = ifnull(b.Customerstate, '-')    and ifnull(a.officecode, '-') = ifnull(b.officecode, '-')    and ifnull(a.employeenumber, '-') = ifnull(b.employeenumber, '-')     and a.asofmonth = b.nbsmonth     and a.policysource = b.policysource    and a.lineofbusiness = b.lineofbusiness and a.carrier = b.carrier    ) ds_comm_eom_extract_allsources    left join {{ ref('STAGE','BVSTG_COMM_AU2_DASHBOARD_EXTRACT') }} bvstg_comm_au2_dashboard_extract    --left join "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU2_DASHBOARD_EXTRACT" bvstg_comm_au2_dashboard_extract    on bvstg_comm_au2_dashboard_extract.carrier = ds_comm_eom_extract_allsources.carrier)) ds_comm_eom_extract_allsources
        name: BVSTG_AU5_RETAIL_RFG_EXTRACT
        noLinkRefs: []
