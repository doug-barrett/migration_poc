        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT date(DATE_TRUNC('month',DATEADD(DAY,-22,CURRENT_DATE()))) AS StartDate,
                   PL.TRANSACTIONID AS TRANSACTIONID,
                   PL.POLICYID AS POLICYID,
                   date(DATE_TRUNC('month', PL.STARTDATE)) AS CREATED,
                   DATE(DATEADD('month', -15, STARTDATE)) AS PriorCreated,
                   PL.NBTRANSACTIONID AS NBTRANSACTIONID,
                   PL.CUSTOMERID AS CUSTOMERID,
                   PL.ORGANIZATIONCODE AS ORGANIZATIONCODE,
                   PL.BIAPRIMARYAGENTOFFICE AS BIAPRIMARYAGENTOFFICE,
                   PL.POLICYNUMBER AS POLICYNUMBER,
                   PL.FLAG_91_RETENTION_WO_LOB AS FLAG_91_RETENTION_WO_LOB,
                   PL.FLAG_91_RETENTION_W_LOB AS FLAG_91_RETENTION_W_LOB,
                   SQL2.EMPLOYEENUMBER AS EMPLOYEENUMBER,
                   SQL2.EMPLOYEENAME AS EMPLOYEENAME,
                   SQL2.HR_STATUS AS HR_STATUS,
                   SQL2.JOBTITLE AS JOBTITLE,
                   SQL2.ASSIGNED_OFFICE AS ASSIGNED_OFFICE,
                   SQL2.TERMINATIONDATE AS TERMINATIONDATE,
                   DS_RETAIL_OFFICE.OFFICECODE AS OFFICECODE,
                   DS_RETAIL_OFFICE.DISTRICTCODE AS DISTRICTCODE,
                   DS_RETAIL_OFFICE.SALESDM AS DISTRICTMANAGERNAME,
                   PL.isPolicy,
                   CASE WHEN PL.ORGANIZATIONCODE = 'ODT' OR PL.ORGANIZATIONCODE = 'OLBT' OR CONTAINS(SQL2.EMPLOYEENUMBER, 'Turbo')                                                                     THEN 'ODT'
                        WHEN DS_RETAIL_OFFICE.OFFICE_STATE = 'BC' OR DS_RETAIL_OFFICE.OFFICE_STATE = 'COLT' OR CONTAINS(DS_RETAIL_OFFICE.OFFICECODE, 'SSB') AND DS_RETAIL_OFFICE.OFFICECODE != 'GESSB' THEN 'NTS'
                        ELSE DS_RETAIL_OFFICE.OFFICE_STATE
                         END AS Office_State,
                   CASE WHEN DS_RETAIL_OFFICE.OFFICE_STATE = 'TX' AND (SQL1.CARRIERDISPLAYNAME = 'Warrior Invictus' OR SQL1.CARRIERDISPLAYNAME = 'Amwins' OR SQL1.CARRIERDISPLAYNAME = 'Gainsco') THEN 1
                         END AS Excluded_Comp_Carrier,
                   SQL3.EMPLOYEENUMBER AS EMPLOYEENUMBER_SQL3,
                   SQL3.UPN AS UPN,
                   SQL3.FULLNAME AS FULLNAME_SQL3,
                   SQL3.MODIFIEDLOCATIONCODE AS MODIFIEDLOCATIONCODE,
                   SQL3.JOBGROUP AS JOBGROUP,
                   SQL3.STATUSFILTER AS STATUSFILTER,
                   SQL1.CARRIERDISPLAYNAME AS CARRIERDISPLAYNAME,
                   DM.DMT,
                   RETENTIONINCENTIVE_PRODUCERSBYMONTH.RCPlanName
              FROM (
                    SELECT PRODUCERID,
                           CARRIERNAME,
                           TransactionID,
                           STARTDATE,
                           LINEOFBUSINESSTYPE,
                           ISLEGACYTRANSACTION,
                           BIAPRIMARYAGENTOFFICE,
                           PolicyID,
                           NBTRANSACTIONID,
                           CUSTOMERID,
                           ORGANIZATIONCODE,
                           POLICYNUMBER ,
                           FLAG_91_RETENTION_WO_LOB,
                           FLAG_91_RETENTION_W_LOB,
                           SOURCEDB,
                           1 isPolicy
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2"
                     WHERE date(DATE_TRUNC('month',STARTDATE)) = DATEADD(MONTH, -3, date(DATE_TRUNC('month',DATEADD(DAY,-22,CURRENT_DATE()))))
                     UNION SELECT PRODUCERID,
                           CARRIERNAME,
                           TransactionID,
                           STARTDATE,
                           LINEOFBUSINESSTYPE,
                           ISLEGACYTRANSACTION,
                           BIAPRIMARYAGENTOFFICE,
                           PolicyID,
                           NBTRANSACTIONID,
                           CUSTOMERID,
                           ORGANIZATIONCODE,
                           POLICYNUMBER ,
                           FLAG_91_RETENTION_WO_LOB,
                           FLAG_91_RETENTION_W_LOB,
                           SOURCEDB,
                           1 isPolicy
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2"
                     WHERE date(DATE_TRUNC('month',STARTDATE)) = DATEADD(MONTH, -15, date(DATE_TRUNC('month',DATEADD(DAY,-22,CURRENT_DATE()))))
                     UNION SELECT EMPLOYEENUMBER,
                           '',
                           '',
                           DATEADD(MONTH, -3, date(DATE_TRUNC('month',DATEADD(DAY,-22,CURRENT_DATE())))),
                           'Auto',
                           'Native',
                           OfficeCode,
                           EMPLOYEENUMBER,
                           '',
                           '',
                           '',
                           '',
                           '',
                           '',
                           'AppOne',
                           0
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY"
                     WHERE EmployeeNumber NOT IN (
