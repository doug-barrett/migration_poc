                          WHEN Comp_90Day_Cancellation_Improvement >=.2                                                                                                   THEN 'Tier 2 Eligible'
                          WHEN Comp_90Day_Cancellation_Improvement >=.1                                                                                                   THEN 'Tier 1 Eligible'
                          ELSE 'Not Eligible'
                           END
