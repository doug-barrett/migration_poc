                          WHEN ds_policysummary_v2.PolicyID IS NOT NULL                                                                                                                                     THEN IFNULL(ds_policysummary_v2.LAST_BIA_STATUSDATE,ds_policysummary_v2.BIA_STATUSDATE)
                          WHEN ds_policysummary_v2_c.PolicyID IS NOT NULL AND ds_policysummary_v2_c.StartDate < bvstg_au1_inactive_policies.Status_Date                                                     THEN IFNULL(ds_policysummary_v2_c.LAST_BIA_STATUSDATE,ds_policysummary_v2_c.BIA_STATUSDATE)
                          WHEN ds_policysummary_v2_c.PolicyID IS NOT NULL AND ds_policysummary_v2_c.StartDate >= bvstg_au1_inactive_policies.Status_Date                                                    THEN IFNULL(ds_policysummary_v2_c.LAST_BIA_STATUSDATE,ds_policysummary_v2.BIA_STATUSDATE)
                          WHEN DATEDIFF(DAY,CURRENT_DATE(),bvstg_au1_inactive_policies.Status_Date) > 30 AND bvstg_au1_inactive_policies.PolicyStatus like '%Cancelled%'                                    THEN DATEADD(DAY,30,bvstg_au1_inactive_policies.Status_Date)
                          WHEN DATEDIFF(DAY,CURRENT_DATE(),bvstg_au1_inactive_policies.Status_Date) > 30 AND bvstg_au1_inactive_policies.PolicyStatus IN ('Expired','Non-renewed UW','Renewed','Rewritten') THEN DATEADD(DAY,30,bvstg_au1_inactive_policies.Status_Date)
