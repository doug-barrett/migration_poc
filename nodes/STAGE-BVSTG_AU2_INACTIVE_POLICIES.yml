        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN rank() OVER (PARTITION BY bvstg_au1_inactive_policies.PolicyID ORDER BY bvstg_au1_inactive_policies.Status_Date DESC) > 1                                                    THEN 'Cancelled Policy Changed the StatusDate'
                          WHEN bvstg_au1_inactive_policies.PolicyStatus ='Void'                                                                                                                             THEN 'Policy Voided Status'
                          WHEN ds_policysummary_v2.PolicyID IS NOT NULL AND bvstg_au1_inactive_policies.effectivedate = bvstg_au1_inactive_policies.original_effectivedate                                  THEN 'The Policy was reactived using the same New Business policy (Same effeciveDate)'
                          WHEN ds_policysummary_v2.PolicyID IS NOT NULL AND bvstg_au1_inactive_policies.effectivedate != bvstg_au1_inactive_policies.original_effectivedate                                 THEN 'The Policy was reactived using the same New Business policy (Different Effectivedate)'
                          WHEN ds_policysummary_v2_c.PolicyID IS NOT NULL AND ds_policysummary_v2_c.StartDate < bvstg_au1_inactive_policies.Status_Date                                                     THEN 'The Customer is Active using an old policy'
                          WHEN ds_policysummary_v2_c.PolicyID IS NOT NULL AND ds_policysummary_v2_c.StartDate >= bvstg_au1_inactive_policies.Status_Date                                                    THEN 'The Customer is Active using an new policy'
                          WHEN DATEDIFF(DAY,CURRENT_DATE(),bvstg_au1_inactive_policies.Status_Date) > 30 AND bvstg_au1_inactive_policies.PolicyStatus like '%Cancelled%'                                    THEN 'Is not possible reinstate because past 30 days'
                          WHEN DATEDIFF(DAY,CURRENT_DATE(),bvstg_au1_inactive_policies.Status_Date) > 30 AND bvstg_au1_inactive_policies.PolicyStatus IN ('Expired','Non-renewed UW','Renewed','Rewritten') THEN 'Is not possible Renew because past 30 days'
                          ELSE NULL
                           END
