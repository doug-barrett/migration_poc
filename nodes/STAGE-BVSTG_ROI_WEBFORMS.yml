          V_DLBV_API_LMS_MASTERLEAD_CURRENT: 60fc74ae-da83-41a6-b31f-3ac2c1989a08
          DS_AP1_TRANSACTIONSUMMARY: c9014461-b3e2-471a-b720-398d60b6acff
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_API_LMS_MASTERLEAD_CURRENT
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN2SALES
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_MKT_CAMPAIGN2SALES') }} ds_mkt_campaign2sales
              JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
                ON ds_mkt_campaign2sales.ID_LMS = v_dlbv_api_lms_masterlead_current.lms_lead_id
              LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                ON ds_mkt_campaign2sales.SALEID = TO_VARCHAR(ds_ap1_transactionsummary.Transactionid)
             WHERE ds_mkt_campaign2sales.BudgetMktgState IN ('MO','WA','NY')
               AND (('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 0 AND DATE(ds_mkt_campaign2sales.DSS_CREATE_TIME) = DATEADD(DAY,-1,CURRENT_DATE())) OR ('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 1 AND DATE(ds_mkt_campaign2sales.DSS_CREATE_TIME) = DATEADD(DAY,-1,CURRENT_DATE())))
               AND ds_mkt_campaign2sales.ContactType = 'WebForm'
               AND ds_mkt_campaign2sales.SourceSystem = 'AppOne'
               AND ds_mkt_campaign2sales.Vendor IN ('Google','Website')
               AND v_dlbv_api_lms_masterlead_current.gc_id <> '' QUALIFY ROW_NUMBER() OVER (PARTITION BY v_dlbv_api_lms_masterlead_current.gc_id, CASE WHEN ds_mkt_campaign2sales.WebFormLeadSale = 1 THEN 'Sale' WHEN ds_mkt_campaign2sales.WebFormLeadQuote = 1 THEN 'Quote' WHEN ds_mkt_campaign2sales.WebFormLead = 1 THEN 'Lead' ELSE 'Web' END ORDER BY ds_mkt_campaign2sales.VintageDate DESC)=1
        name: BVSTG_ROI_WEBFORMS
        noLinkRefs: []
