    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_IM_DEALS
          - locationName: STAGE
            nodeName: V_DLBV_MKT_TIMEZONES
          - locationName: STAGE
            nodeName: V_DLBV_MKT_TIMEZONES_STATE
          - locationName: STAGE
            nodeName: V_S_SPLC_CUSTOMER_CURRENT
        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_EDW.DS_IM_DEALS ds_im_deals
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_IM_TIMELINES_SOLD v_preb_im_timelines_sold
                ON ds_im_deals.DEAL_ID = v_preb_im_timelines_sold.DEAL_ID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_SPLC_CUSTOMER_CURRENT v_s_splc_customer_current
                ON ds_im_deals.ams_id = v_s_splc_customer_current.CUSTNO
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_INSUREDMINE_DEAL_LABEL_CURRENT insuredmine_deal_label_current
                ON ds_im_deals.DEAL_ID = insuredmine_deal_label_current.DEAL_ID
               AND insuredmine_deal_label_current.RUNDATE >= ds_im_deals.CREATION_DATE
              LEFT JOIN RETAIL_prod.SCH_BVSTAGE.V_DLBV_API_INSUREDMINE_DEAL_CURRENT v_dlbv_api_insuredmine_deal_current
                ON ds_im_deals.DEAL_ID = v_dlbv_api_insuredmine_deal_current.DEAL_ID
              LEFT JOIN retail_prod.SCH_BVSTAGE.V_DLBV_CPS_IDNC_CURRENT v_dlbv_cps_idnc_current
                ON RIGHT(REGEXP_REPLACE(DS_IM_DEALS.PHONE, '[^0-9]', ''), 10) = RIGHT(REGEXP_REPLACE(v_dlbv_cps_idnc_current.PHONENUMBER, '[^0-9]', ''), 10)
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_MKT_TIMEZONES_STATE v_dlbv_mkt_timezones_state
                ON v_s_splc_customer_current.STATE = v_dlbv_mkt_timezones_state.STATECODE
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_MKT_TIMEZONES v_dlbv_mkt_timezones
                ON v_dlbv_mkt_timezones.timezonename = V_DLBV_MKT_TIMEZONES_STATE.timezone
             WHERE CONVERT_TIMEZONE('UTC', 'America/Los_Angeles', ds_im_deals.CREATION_DATE) >= '2025-01-01'
               AND lower(ds_im_deals.ORIGINAL_PIPELINE) = 'winback'
               AND ds_im_deals.ISWON = 0
               AND ds_im_deals.ISSOLD = 0
               AND insuredmine_deal_label_current.label = 'Cancelled'
               AND v_dlbv_cps_idnc_current.PHONENUMBER IS NULL QUALIFY ROW_NUMBER() OVER(PARTITION BY ds_im_deals.DEAL_ID, v_s_splc_customer_current.CUSTNO ORDER BY v_s_splc_customer_current.DSS_VERSION DESC) = 1
