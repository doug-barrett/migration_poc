        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_MKT_WEEKLYUNIQUE') }} AS SELECT DISTINCT a.call_id,
                   1 isWeeklyUnique
              FROM {{ ref('STAGE','V_MKT_CALL_WEEKLY') }} a
             INNER JOIN(
                    SELECT call_id
                      FROM(
                            SELECT call_id ,
                                   (RANK() OVER (PARTITION BY caller_number, Brandid, Year_Number,Week_Number ORDER BY call_Id)) isWeeklyUnique
                              FROM {{ ref('STAGE','V_MKT_CALL_WEEKLY') }}
                           )a
                     WHERE isWeeklyUnique = 1
                   )b
                ON (a.call_id = b.call_id)
