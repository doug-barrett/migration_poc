  description: "Source: MYSQL_CALIBER\n\nNative SQL:\nSelect distinct trim(a.user_id)\
    \ as TechUsername, u.fname as Fname, u.lname as Lname, r.role_name TechnicianRoleName,\
    \ u.active as Active,\ncase when LOCATE('.ADAS',u.employee_number) > 0 THEN 'ADAS'\n\
    \     when u.type is null then 'Invalid'\n\t else u.type End as Type,\nu.External_Id\
    \ as TechTeammateId\nfrom appointments a\nleft join users u on trim(a.user_id)\
    \ = u.employee_number\nleft join roles r on u.role_id = r.id\nwhere trim(a.user_id)\
    \ is not null and trim(a.user_id) <> ''"
