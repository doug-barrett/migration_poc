        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_COLLECTIONS_ASSIGNED_QUERY') }} bvstg_collections_assigned_query
             INNER JOIN {{ ref('STAGE','BVSTG_COLLECTIONS_CALL_ACCOUNT') }} bvstg_collections_call_account
                ON bvstg_collections_assigned_query.batchid = bvstg_collections_call_account.batchid
               AND bvstg_collections_call_account.CALL_DATE >= bvstg_collections_assigned_query.BATCH_ASSIGNED_DATE
              LEFT JOIN (
                    SELECT DISTINCT *
                      FROM DATA_LAKE.BIA_ANALYTICS.V_BVSTG_COLLECTED_BY_ROLES
                   ) V_BVSTG_COLLECTED_BY_ROLES
                ON V_BVSTG_COLLECTED_BY_ROLES.ID = bvstg_collections_assigned_query.ID
               AND DATE (V_BVSTG_COLLECTED_BY_ROLES.CREATED_PAYMENT) = bvstg_collections_call_account.call_date
              LEFT JOIN {{ ref('STAGE','BVSTG_COLLECTIONS_CUSTOMER_PHONE') }} bvstg_collections_customer_phone
                ON bvstg_collections_assigned_query.customerid = bvstg_collections_customer_phone.customerid
             WHERE V_BVSTG_COLLECTED_BY_ROLES.ID IS NULL
