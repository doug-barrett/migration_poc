    - appliedColumnTests: {}
      columnReference:
        columnCounter: a15817ea-a08d-5d6a-af73-cca2dce76ed3
        stepCounter: adad0333-5c17-536a-bb0a-e599ecc26ea7
      config: {}
      dataType: VARCHAR(25)
      description: A way to identify specific Audit types, currenly only Onsite Observations.
        This is currently hardcoded in the data warehouse, not read from the source
        systems.
      name: AuditType
      nullable: false
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN "I_AUDITDETAILS".""AuditForm"" IS NULL THEN 'UNKNOWN'   WHEN
          "I_AUDITDETAILS".""AuditForm"" LIKE '%ONSITE%OBSERVATION%'    AND "ODSSourceSystemName"
          = 'NPSAFE'    THEN 'ONSITE OBSERVATION'   ELSE 'OTHER AUDIT'  END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 57d8bba3-8291-529a-a27a-8cea654c4795
        stepCounter: adad0333-5c17-536a-bb0a-e599ecc26ea7
      config: {}
      dataType: VARCHAR(25)
      description: A way to identify Group CRC Audits and Non-CRC Audits. This grouping
        is needed to group both CRC Audits and Onsite Observations as both are a CRC
        Audit Type. Hardcoded in the data warehouse.
      name: AuditGroup
      nullable: false
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE    WHEN "AuditForm" IS NULL THEN 'UNKNOWN'    --ENDS WITH
          (CRC) THIS IS THE NEW GROUPING FOR CRC AUDITS    WHEN "AuditForm" LIKE '%(CRC)'
          AND     "ODSSourceSystemName" = 'NPSAFE' THEN 'CRC AUDIT'    --ONSITE OBSERVATIONS
          ARE ALSO CRC AUDITS, THIS LINE NEEDS TO BE REMOVED WHEN THE HISTORICAL DATA
          HAS BEEN "updated"    WHEN "AuditForm" LIKE '%ONSITE%OBSERVATION%' AND     "ODSSourceSystemName"
          = 'NPSAFE' THEN 'CRC AUDIT'    --STARTS WITH CRC CURRENT, THIS LINE NEEDS
          TO BE REMOVED WHEN THE HISTORICAL DATA HAS BEEN "updated"    WHEN "AuditForm"
          LIKE 'CRC%' AND     "ODSSourceSystemName" = 'NPSAFE' THEN 'CRC AUDIT'    --EXACT
          FORM "name", THIS LINE NEEDS TO BE REMOVED WHEN THE HISTORICAL DATA HAS
          BEEN "updated" TO HAVE (CRC) AT THE END    WHEN "AuditForm" LIKE 'PERMIT
          AND MINOR WORKS MANAGEMENT AUDIT%' THEN 'CRC AUDIT'    ELSE 'NON-CRC AUDIT'   END
