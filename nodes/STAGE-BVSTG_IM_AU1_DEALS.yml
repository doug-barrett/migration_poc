              LEFT JOIN {{ ref('STAGE','V_DLBV_API_INSUREDMINE_DEAL_LABEL_CURRENT') }} v_dlbv_api_insuredmine_deal_label_current
                ON v_dlbv_api_insuredmine_deal_current.DEAL_ID = v_dlbv_api_insuredmine_deal_label_current.DEAL_ID
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_INSUREDMINE_DEAL_QUOTE_CURRENT') }} v_dlbv_api_insuredmine_deal_quote_current
