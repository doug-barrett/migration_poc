               AND v_preb_im_nb_polid.nbcarriername = v_dlbv_api_insuredmine_deal_quote_current.carrier
              LEFT JOIN (
                    SELECT DISTINCT TC.DEAL_ID ,
                           CASE WHEN LOWER(TIMELINE_INFO) LIKE '%marked as won%' THEN 1
