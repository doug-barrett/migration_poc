              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ds_agent_key.OfficeCode = ds_retail_office.OfficeCode
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_IM_NB_POLID') }} v_preb_im_nb_polid
