    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_PMKT_AU2_ATLAS_ACTIONS
        join:
          joinCondition: |-
            FROM (
                    SELECT *,
                           COUNT(sessionid) OVER (PARTITION BY cisco_login_name ORDER BY activity_time) AS grouper_sessionid_final,
                           COUNT(phonenumber) OVER (PARTITION BY cisco_login_name ORDER BY activity_time) AS grouper_phonenumber_final,
                           COUNT(customerid_parameters) OVER (PARTITION BY cisco_login_name ORDER BY activity_time) AS grouper_customerid_parameters_final,
                           COUNT(customerid_parameters_2) OVER (PARTITION BY cisco_login_name ORDER BY activity_time) AS grouper_customerid_parameters_2_final,
                           COUNT(leadid) OVER (PARTITION BY cisco_login_name ORDER BY activity_time) AS grouper_leadid_final
                      FROM (
                            SELECT l.*,
                                   CASE WHEN l.callid IS NOT NULL                         THEN LEFT(l.callid, LEN(l.callid) - 2)
                                        WHEN l.callid IS NULL AND c.sessionid IS NOT NULL THEN c.sessionid
                                        ELSE NULL
                                         END AS sessionid
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ATLAS_ACTIONS l
                              LEFT JOIN RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ALL_CALLS_WITH_NUMBER c
                                ON l.phonenumber = c.phonenumber
                               AND l.cisco_login_name = c.agent
                               AND TO_DATE(l.activity_time) = c.date
                               AND l.activity_time BETWEEN c.startdatetime AND c.lead_startdatetime
                               AND l.callid IS NULL
                           )
                   ) BVSTG_PMKT_AU2_ATLAS_ACTIONS
        name: BVSTG_PMKT_AU2_FINAL_TABLE_WITH_ACTIONS
