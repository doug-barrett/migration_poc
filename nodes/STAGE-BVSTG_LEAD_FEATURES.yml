        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU2_LEAD_FEATURES_GROUPED') }} bvstg_au2_lead_features_grouped
              LEFT JOIN (
                    SELECT DATE(CALENDAR_DATE)DATE
                      FROM "RETAIL_PROD"."SCH_BVSTAGE"."STAGE_DATE_SF"
                     WHERE CALENDAR_DATE BETWEEN '2000-01-01' AND CURRENT_DATE() - 1
                     ORDER BY CALENDAR_DATE
                   )STAGE_DATE_SF
                ON 1=1
              LEFT JOIN {{ ref('STAGE','BVSTG_AU2_LEAD_FEATURES_TRANSFER') }} bvstg_au2_lead_features_transfer
                ON bvstg_au2_lead_features_transfer.FIRST_GROUP_LEADID = bvstg_au2_lead_features_grouped.FIRST_GROUP_LEADID
               AND STAGE_DATE_SF.DATE = DATE(bvstg_au2_lead_features_transfer.L_LEADDATE)
              LEFT JOIN {{ ref('STAGE','BVSTG_AU2_LEAD_FEATURES_SOURCE') }} bvstg_au2_lead_features_source
                ON bvstg_au2_lead_features_grouped.FIRST_GROUP_LEADID = bvstg_au2_lead_features_source.FIRST_GROUP_LEADID
               AND STAGE_DATE_SF.DATE = bvstg_au2_lead_features_source.Date
              LEFT JOIN {{ ref('STAGE','BVSTG_AU2_LEAD_FEATURES_HISTORY') }} bvstg_au2_lead_features_history
                ON bvstg_au2_lead_features_grouped.FIRST_GROUP_LEADID = bvstg_au2_lead_features_history.FIRST_GROUP_LEADID
               AND STAGE_DATE_SF.DATE = DATE(bvstg_au2_lead_features_history.Date)
              LEFT JOIN {{ ref('STAGE','BVSTG_AU2_LEAD_FEATURES_CATEGORY') }} bvstg_au2_lead_features_category
                ON bvstg_au2_lead_features_grouped.FIRST_GROUP_LEADID = bvstg_au2_lead_features_category.FIRST_GROUP_LEADID
               AND bvstg_au2_lead_features_category.RANKING = 1
              LEFT JOIN {{ ref('STAGE','BVSTG_AU2_LEAD_FEATURES_SUBCATEGORY') }} bvstg_au2_lead_features_subcategory
                ON bvstg_au2_lead_features_grouped.FIRST_GROUP_LEADID = bvstg_au2_lead_features_subcategory.FIRST_GROUP_LEADID
               AND bvstg_au2_lead_features_subcategory.RANKING = 1
              LEFT JOIN {{ ref('STAGE','BVSTG_AU2_LEAD_FEATURES_VENDOR') }} bvstg_au2_lead_features_vendor
                ON bvstg_au2_lead_features_grouped.FIRST_GROUP_LEADID = bvstg_au2_lead_features_vendor.FIRST_GROUP_LEADID
               AND bvstg_au2_lead_features_vendor.RANKING = 1
              LEFT JOIN {{ ref('STAGE','BVSTG_AU2_LEAD_FEATURES_CALLS') }} bvstg_au2_lead_features_calls
                ON bvstg_au2_lead_features_grouped.FIRST_GROUP_LEADID = bvstg_au2_lead_features_calls.FIRST_GROUP_LEADID
               AND STAGE_DATE_SF.DATE = DATE(bvstg_au2_lead_features_calls.Date)
             WHERE (COALESCE(DATE(bvstg_au2_lead_features_transfer.L_LEADDATE) ,bvstg_au2_lead_features_history.Date ,bvstg_au2_lead_features_source.Date ,bvstg_au2_lead_features_calls.Date) IS NOT NULL OR bvstg_au2_lead_features_grouped.FIRST_GROUP_LEAD_CREATED_DATE = STAGE_DATE_SF.DATE) -- AND bvstg_au2_lead_features_grouped.C_CUSTOMERID = '8782648'
