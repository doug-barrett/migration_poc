            nodeName: V_PREB_AP1_ERROR_FULL_PAY
        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','S_AP1_TRANSACTION_MROC') }} s_ap1_transaction_mroc
             INNER JOIN {{ ref('STAGE','V_S_AP1_ORGANIZATIONTRANSACTIONSTATUSTYPE_MROC_CURRENT') }} v_s_ap1_organizationtransactionstatustype_mroc_current
                ON v_s_ap1_organizationtransactionstatustype_mroc_current.organizationtransactionstatustypeid = s_ap1_transaction_mroc.transactionstatustypeid
               AND v_s_ap1_organizationtransactionstatustype_mroc_current.key != 'New'
              LEFT JOIN {{ ref('DATA_VAULT','S_AP1_TRANSACTIONSTATUS_MROC') }} s_ap1_transactionstatus_mroc
                ON s_ap1_transactionstatus_mroc.TransactionID = s_ap1_transaction_mroc.TransactionID
               AND s_ap1_transactionstatus_mroc.transactionstatustypeid = v_s_ap1_organizationtransactionstatustype_mroc_current.organizationtransactionstatustypeid
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue
                ON ref_ap1_codevalue.codevalueid = s_ap1_transactionstatus_mroc.transactionclassificationid
             INNER JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue_trtype
                ON ref_ap1_codevalue_trtype.codevalueid = s_ap1_transaction_mroc.TransactionTypeID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_TRANSTATUSCLASSREASON_CURRENT') }} v_s_ap1_transtatusclassreason_current
                ON v_s_ap1_transtatusclassreason_current.transactionstatusid = s_ap1_transactionstatus_mroc.transactionstatusid
              LEFT JOIN {{ ref('DATA_VAULT','H_ORGCLASSIFICATIONREASON') }} h_ORGCLASSIFICATIONREASON
                ON v_s_ap1_transtatusclassreason_current.organizationclassificationreasonid = h_ORGCLASSIFICATIONREASON.organizationclassificationreasonid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_ORGCLASSIFICATIONREASON_CURRENT') }} v_s_ap1_orgclassificationreason_current
                ON h_ORGCLASSIFICATIONREASON.HK_H_ORGCLASSIFICATIONREASON = v_s_ap1_orgclassificationreason_current.HK_H_ORGCLASSIFICATIONREASON
              LEFT JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue_error
                ON ref_ap1_codevalue_error.codevalueid = v_s_ap1_orgclassificationreason_current.classificationtypeid
              LEFT JOIN {{ ref('DATA_VAULT','H_CLASSIFICATIONREASON') }} h_classificationreason
                ON h_classificationreason.classificationreasonid = v_s_ap1_orgclassificationreason_current.classificationreasonid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CLASSIFICATIONREASON_CURRENT') }} v_s_ap1_classificationreason_current
                ON v_s_ap1_classificationreason_current.HK_H_CLASSIFICATIONREASON = h_classificationreason.HK_H_CLASSIFICATIONREASON
              LEFT JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} v_s_ap1_employee_mroc_current
                ON s_ap1_transactionstatus_mroc.USERID = v_s_ap1_employee_mroc_current.USERID
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_AP1_ERROR_FULL_PAY') }} v_preb_ap1_error_full_pay
                ON v_preb_ap1_error_full_pay.TransactionID = s_ap1_transaction_mroc.TransactionID
             WHERE 1=1
               AND (('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATE(s_ap1_transaction_mroc.CREATED) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE()))))))) QUALIFY ROW_NUMBER() OVER (PARTITION BY s_ap1_transaction_mroc.TransactionID ,s_ap1_transactionstatus_mroc.TransactionStatusID ,h_ORGCLASSIFICATIONREASON.organizationclassificationreasonid ORDER BY v_s_ap1_organizationtransactionstatustype_mroc_current.STEPORDER DESC, s_ap1_transactionstatus_mroc.created DESC, s_ap1_transactionstatus_mroc.LASTUPDATED DESC)=1
