          LEFT JOIN {{ ref(''BRONZE'', ''DW_CONTRACT'') }} dw_contract ON cp_dcaah.CSHO_POLICY_NUMBER = dw_contract.CONTRACT_ID /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT_OPTION'') }} dw_product_option ON dw_product_option.PRODUCT_KEY = cp_dcaah.PRODUCT_KEY AND dw_product_option.PRODUCT_OPTION_CODE = cp_dcaah.INVEST_OPT_CODE

