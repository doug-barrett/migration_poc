        join:
          joinCondition: |-
            EXTENDED
              FROM( SELECT CASE WHEN ds_comm_policy_status_extract_cs.carrier = 'Kemper' THEN 'Infinity'
                        ELSE ds_comm_policy_status_extract_cs.carrier
                         END AS carrier,
                   ds_comm_policy_status_extract_cs.carrierdisplayname,
                   ds_comm_policy_status_extract_cs.cutoffdate,
                   sum(ds_comm_policy_status_extract_cs.cs_status) AS PIF_CS,
                   sum(ds_comm_policy_status_extract_cs.premium) AS Premium_CS
              FROM ( SELECT DISTINCT ds_comm_policy_status_extract_cs.carrier,
                   ds_comm_policy_status_extract_cs.carrierdisplayname,
                   ds_comm_policy_status_extract_cs.cutoffdate,
                   ds_comm_policy_status_extract_cs.cs_status,
                   ds_comm_policy_status_extract_cs.policynumberformatted,
                   ds_comm_policy_status_extract_cs.premium
              FROM (SELECT DISTINCT ds_comm_policy_status_extract_cs_1.policynumberformatted,
                   ds_comm_policy_status_extract_cs_1.carrier,
                   CASE WHEN ds_comm_policy_status_extract_cs_1.carrier='Infinity' OR ds_comm_policy_status_extract_cs_1.carrier='Kemper' THEN 'Infinity/Kemper'
                        WHEN ds_comm_policy_status_extract_cs_1.carrier = 'Bristol West'                                                  THEN 'Bristol West/Foremost'
                        WHEN ds_comm_policy_status_extract_cs_1.carrier='Legacy'                                                         THEN 'Legacy/Nevada General'
                        ELSE ds_comm_policy_status_extract_cs_1.carrier
                         END AS carrierdisplayname,
                   ds_comm_policy_status_extract_cs_1.cutoffdate,
                   premium,
                   CASE WHEN policystatus_eom = 'Active' THEN 1
                        ELSE 0
                         END AS CS_Status,
                   (
                    SELECT max(dss_create_time)
                      FROM {{ ref('EDW','DS_COMM_POLICY_STATUS_EXTRACT_CS') }}
                   ) AS dss_create_time --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_POLICY_STATUS_EXTRACT_CS") as dss_create_time  from (select * from    (select distinct policynumberformatted,carrier     from {{ ref('EDW','DS_COMM_POLICY_STATUS_EXTRACT_CS') }}      --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_POLICY_STATUS_EXTRACT_CS"      --where carrier <> 'Key Insurance'     ) ds_comm_policy_status_extract_cs    cross join    (select distinct to_date(min_date) cutoffdate     from {{ ref('STAGE','V_PRED_MONTHS') }}    --from "RETAIL_PROD"."SCH_BVSTAGE"."V_PRED_MONTHS"    where min_date >= '2019-01-01' and min_date<=date_trunc('Month',add_months(current_date(),-1))) V_PRED_MONTHS)  ds_comm_policy_status_extract_cs_1  left join {{ ref('EDW','DS_COMM_POLICY_STATUS_EXTRACT_CS') }} ds_comm_policy_status_extract_cs_2  --left join "RETAIL_PROD"."SCH_EDW"."DS_COMM_POLICY_STATUS_EXTRACT_CS"  ds_comm_policy_status_extract_cs_2  on ds_comm_policy_status_extract_cs_1.carrier=ds_comm_policy_status_extract_cs_2.carrier    and ds_comm_policy_status_extract_cs_1.policynumberformatted=ds_comm_policy_status_extract_cs_2.policynumberformatted    and ds_comm_policy_status_extract_cs_1.cutoffdate=ds_comm_policy_status_extract_cs_2.cutoffdate  --where ds_comm_policy_status_extract_cs_1.carrier not in ('Key Insurance')  ) ds_comm_policy_status_extract_cs  where ds_comm_policy_status_extract_cs.policynumberformatted <> 'PENDING'    and ds_comm_policy_status_extract_cs.carrier in                       (select distinct DS_BVSTG_COMM_CARRIERMAPPING.carrier        --from "RETAIL_PROD"."SCH_BVSTAGE"."V_BVSTG_COMM_PR_PIF_PREMIUM" V_BVSTG_COMM_PR_PIF_PREMIUM       from {{ ref('UNKNOWN','V_BVSTG_COMM_PR_PIF_PREMIUM') }} V_BVSTG_COMM_PR_PIF_PREMIUM       inner join        (select distinct DS_BVSTG_COMM_CARRIERMAPPING.carriername_grouped carrier       --from "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT" V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT       from {{ ref('STAGE','V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT') }} V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT       --left join "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_CARRIERMAPPING" DS_BVSTG_COMM_CARRIERMAPPING       left join {{ ref('STAGE','DS_BVSTG_COMM_CARRIERMAPPING') }} DS_BVSTG_COMM_CARRIERMAPPING       on V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT.carrier = DS_BVSTG_COMM_CARRIERMAPPING.carriername) DS_BVSTG_COMM_CARRIERMAPPING       on DS_BVSTG_COMM_CARRIERMAPPING.carrier=V_BVSTG_COMM_PR_PIF_PREMIUM.carr
