    sourceMapping:
      - aliases:
          V_PREB_API_OB_HUBSPOT_ALL_LEADS: 4c801094-5ab7-43af-b9b6-181577250693
          V_DLBV_API_LMS_MASTERLEAD_CURRENT: c162a5d3-8185-40fd-afd2-98729188894f
          DS_MKT_LEAD_SOURCE: 0aaa279e-0731-4ba4-882c-75dc6cf7d3c9
          DS_CUSTOMERSUMMARY_V2: c5a432da-156b-460f-ba67-985b9517bedb
          DS_MKT_CAMPAIGN: 6db20009-e5c5-4a63-9950-65a73fc49802
          V_S_AP1_LEAD_MROC_CURRENT: 378c735c-f683-4f03-a1dc-2767b68dc0ed
          V_S_AP1_LINEOFBUSINESSTYPE_MROC_CURRENT: 1d363097-eb7f-4148-ba26-0cca003bb32d
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_API_OB_HUBSPOT_ALL_LEADS') }} AS SELECT COALESCE(ds_mkt_lead_source.leadid,ds_mkt_lead_source_quote.leadid,ds_mkt_lead_source_partner.leadid, v_dlbv_api_lms_masterlead_current.APPONE_QUOTE_ID) AS lead_id ,
                   DATE(COALESCE(ds_mkt_lead_source.LeadCreated,ds_mkt_lead_source_quote.LeadCreated,ds_mkt_lead_source_partner.LeadCreated, v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT)) AS Lead_Date ,
                   DATEDIFF(SECOND,TO_TIMESTAMP('1970-01-01'),TO_TIMESTAMP(DATE(COALESCE(ds_mkt_lead_source.LeadCreated,ds_mkt_lead_source_quote.LeadCreated,ds_mkt_lead_source_partner.LeadCreated, v_dlbv_api_lms_masterlead_current.LEAD_CREATED_AT))))*1000 AS lead_created_date ,
                   IFNULL(ds_mkt_campaign.CampaignID, ds_mkt_campaign_lms.CampaignID) AS Campaign_ID ,
                   IFNULL(v_dlbv_api_lms_masterlead_current.media_code, ds_mkt_campaign.mediacode) AS Media_Code ,
                   COALESCE(ds_mkt_campaign.brand_Name, ds_mkt_campaign_lms.brand_Name) AS Brand ,
                   IFNULL(ds_mkt_campaign.StationCampaignName, ds_mkt_campaign_lms.StationCampaignName) AS station_campainame ,
                   IFNULL(ds_mkt_campaign.Source_Name, ds_mkt_campaign_lms.Source_Name) AS Source_Name ,
                   IFNULL(ds_mkt_campaign.Category, ds_mkt_campaign_lms.Category) AS marketing_category ,
                   IFNULL(ds_mkt_campaign.SubCategory, ds_mkt_campaign_lms.SubCategory) AS marketing_subcategory ,
                   IFNULL(ds_mkt_campaign.Vendor, ds_mkt_campaign_lms.Vendor) AS marketing_vendor ,
                   CASE WHEN v_dlbv_api_lms_masterlead_current.client_communications_consent IN ('true','yes') THEN 'yes'
                        WHEN v_dlbv_api_lms_masterlead_current.client_communications_consent IN ('false','no') THEN 'no'
                        ELSE 'NA'
                         END AS communication_consent_api_only ,
                   COALESCE(ds_mkt_lead_source.CustomerID,ds_mkt_lead_source_quote.CustomerID,ds_mkt_lead_source_partner.CustomerID) AS customer_id ,
                   LEFT(IFNULL(ds_customersummary_v2.FirstName, v_dlbv_api_lms_masterlead_current.CLIENT_FIRST_NAME),100) AS firstname ,
                   LEFT(IFNULL(ds_customersummary_v2.LastName, v_dlbv_api_lms_masterlead_current.CLIENT_LAST_NAME),100) AS middle_name ,
                   LEFT(IFNULL(ds_customersummary_v2.LastName, v_dlbv_api_lms_masterlead_current.CLIENT_LAST_NAME),100) AS lastname ,
                   COALESCE(ds_mkt_lead_source.Email,ds_mkt_lead_source_quote.Email,ds_mkt_lead_source_partner.Email, v_dlbv_api_lms_masterlead_current.CLIENT_EMAIL) Email ,
                   DATE(COALESCE(ds_mkt_lead_source.Dob,ds_mkt_lead_source_quote.Dob,ds_mkt_lead_source_partner.Dob, v_dlbv_api_lms_masterlead_current.client_birthdate)) AS date_of_birth ,
                   DATEDIFF(SECOND,TO_TIMESTAMP('1970-01-01'),TO_TIMESTAMP(DATE(COALESCE(ds_mkt_lead_source.Dob,ds_mkt_lead_source_quote.Dob,ds_mkt_lead_source_partner.Dob, v_dlbv_api_lms_masterlead_current.client_birthdate))))*1000 AS birth_date ,
                   LEFT(COALESCE(ds_customersummary_v2.MailingStreet,ds_customersummary_v2.QuoteStreet,ds_customersummary_v2.GarageStreet,v_dlbv_api_lms_masterlead_current.client_current_residence),200) AS address ,
                   COALESCE(ds_customersummary_v2.MailingCity,ds_customersummary_v2.QuoteCity,ds_customersummary_v2.GarageCity,v_dlbv_api_lms_masterlead_current.City) AS City ,
                   COALESCE(TO_VARCHAR(ds_customersummary_v2.MailingZip),TO_VARCHAR(ds_customersummary_v2.QuoteZip),TO_VARCHAR(ds_customersummary_v2.GarageZip), TO_VARCHAR(v_dlbv_api_lms_masterlead_current.ZIP_CODE)) AS Zip ,
                   COALESCE(ds_customersummary_v2.MailingState,ds_customersummary_v2.QuoteState,ds_customersummary_v2.GarageState,v_dlbv_api_lms_masterlead_current.State) AS State ,
                   COALESCE(ds_customersummary_v2.HOMEPHONE, v_dlbv_api_lms_masterlead_current.CLIENT_PRIMARY_NUMBER, ds_customersummary_v2.CELLPHONE, v_dlbv_api_lms_masterlead_current.CLIENT_MOBILE_NUMBER, ds_customersummary_v2.CONTACTPHONE) AS phone ,
                   COALESCE(ds_customersummary_v2.CELLPHONE, v_dlbv_api_lms_masterlead_current.CLIENT_MOBILE_NUMBER) AS mobilephone ,
                   COALESCE(ds_customersummary_v2.Gender, v_dlbv_api_lms_masterlead_current.client_gender) AS Gender ,
                   v_dlbv_api_lms_masterlead_current.name_insurance ,
                   CAST(v_dlbv_api_lms_masterlead_current.lead_created_at AS datetime) AS LMS_CreatedDate ,
                   CASE WHEN COALESCE(ds_mkt_lead_source.SourceDB,ds_mkt_lead_source_quote.SourceDB,ds_mkt_lead_source_partner.SourceDB) = 'AppOne' THEN 'AppOne'
                        WHEN COALESCE(ds_mkt_lead_source.SourceDB,ds_mkt_lead_source_quote.SourceDB,ds_mkt_lead_source_partner.SourceDB) = 'CIGH'   THEN 'AMS'
                        ELSE'LMS'
                         END AS source_system ,
                   IFNULL(v_s_ap1_lineofbusinesstype_mroc_current.Name, v_dlbv_api_lms_masterlead_current.name_insurance) AS line_of_business
              FROM {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
              FULL OUTER JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source
                ON v_dlbv_api_lms_masterlead_current.LMS_LEAD_ID = ds_mkt_lead_source.LMS_ID
               AND ds_mkt_lead_source.LeadID NOT LIKE '%-%'
              LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source_quote
                ON ds_mkt_lead_source_quote.LEADID = v_dlbv_api_lms_masterlead_current.appone_quote_id
               AND ds_mkt_lead_source_quote.LeadID NOT LIKE '%-%'
              LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source_partner
                ON ds_mkt_lead_source_partner.externalleadid = v_dlbv_api_lms_masterlead_current.lead_id_partner
               AND ds_mkt_lead_source_partner.LeadID NOT LIKE '%-%'
              LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} ds_customersummary_v2
                ON ds_customersummary_v2.Customerno = coalesce(ds_mkt_lead_source.CustomerID,ds_mkt_lead_source_quote.CustomerID,ds_mkt_lead_source_partner.CustomerID)
               AND ds_customersummary_v2.SourceDB = coalesce(ds_mkt_lead_source.SourceDB,ds_mkt_lead_source_quote.SourceDB,ds_mkt_lead_source_partner.SourceDB)
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON ds_mkt_campaign.CampaignID = COALESCE(ds_mkt_lead_source.CampaignID,ds_mkt_lead_source_quote.CampaignID,ds_mkt_lead_source_partner.CampaignID)
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign_lms
                ON ds_mkt_campaign_lms.MEDIACODE = v_dlbv_api_lms_masterlead_current.MEDIA_CODE
               AND ds_mkt_campaign_lms.STATUS = 1
              LEFT JOIN {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }} v_s_ap1_lead_mroc_current
                ON TO_VARCHAR(v_s_ap1_lead_mroc_current.LeadID) = COALESCE(ds_mkt_lead_source.leadid,ds_mkt_lead_source_quote.leadid,ds_mkt_lead_source_partner.leadid, v_dlbv_api_lms_masterlead_current.APPONE_QUOTE_ID)
              LEFT JOIN {{ ref('STAGE','V_S_AP1_LINEOFBUSINESSTYPE_MROC_CURRENT') }} v_s_ap1_lineofbusinesstype_mroc_current
                ON v_s_ap1_lineofbusinesstype_mroc_current.LINEOFBUSINESSTYPEID = v_s_ap1_lead_mroc_current.LINEOFBUSINESSTYPEID
             WHERE COALESCE(ds_mkt_lead_source.leadid,ds_mkt_lead_source_quote.leadid,ds_mkt_lead_source_partner.leadid, v_dlbv_api_lms_masterlead_current.APPONE_QUOTE_ID) not like '%-%'
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_API_LMS_MASTERLEAD_CURRENT
          - locationName: EDW
            nodeName: DS_MKT_LEAD_SOURCE
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN
          - locationName: STAGE
            nodeName: V_S_AP1_LEAD_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_LINEOFBUSINESSTYPE_MROC_CURRENT
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }}
            {{ ref('EDW','DS_MKT_LEAD_SOURCE') }}
            {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }}
            {{ ref('EDW','DS_MKT_CAMPAIGN') }}
            {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }}
            {{ ref('STAGE','V_S_AP1_LINEOFBUSINESSTYPE_MROC_CURRENT') }}
