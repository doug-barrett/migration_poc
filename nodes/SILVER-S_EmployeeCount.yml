      config: {}
      dataType: VARCHAR(80)
      description: Length Of Service
      name: LengthOfService
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE     WHEN CAST(2 AS DECIMAL(10), CAST(2 AS DECIMAL(10), DATEDIFF(MONTH,
          I_EMPLOYEECOUNT_HIST.STARTDATE, MONTHDATE)) / 12) < .6 THEN 'LESS THAN 6
          MONTHS'     WHEN CAST(2 AS DECIMAL(10), CAST(2 AS DECIMAL(10), DATEDIFF(MONTH,
          I_EMPLOYEECOUNT_HIST.STARTDATE, MONTHDATE)) / 12) < 2 THEN '6 MONTHS - 2
          YEARS'     WHEN CAST(2 AS DECIMAL(10), CAST(2 AS DECIMAL(10), DATEDIFF(MONTH,
          I_EMPLOYEECOUNT_HIST.STARTDATE, MONTHDATE)) / 12) < 5 THEN '2 - 5 YEARS'     ELSE
          'MORE THAN 5 YEARS'    END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 9f8f115e-ff7a-5c8c-9eec-e65d749c8a61
        stepCounter: a9b565df-357f-553a-aa6e-b2b2fb8bc266
      config: {}
      dataType: VARCHAR(80)
      description: Age Group 5 Years
      name: AgeGroup5Years
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE     WHEN CAST(2 AS DECIMAL(10), CAST(2 AS DECIMAL(10), DATEDIFF(MONTH,
          BIRTHDATE, MONTHDATE)) / 12) < 20 THEN '< 20'     WHEN CAST(2 AS DECIMAL(10),
          CAST(2 AS DECIMAL(10), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 25
          THEN '20 - 24'     WHEN CAST(2 AS DECIMAL(10), CAST(2 AS DECIMAL(10), DATEDIFF(MONTH,
          BIRTHDATE, MONTHDATE)) / 12) < 30 THEN '25 - 29'     WHEN CAST(2 AS DECIMAL(10),
          CAST(2 AS DECIMAL(10), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 35
          THEN '30 - 34'     WHEN CAST(2 AS DECIMAL(10), CAST(2 AS DECIMAL(10), DATEDIFF(MONTH,
          BIRTHDATE, MONTHDATE)) / 12) < 40 THEN '35 - 39'     WHEN CAST(2 AS DECIMAL(10),
          CAST(2 AS DECIMAL(10), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 45
          THEN '40 - 44'     WHEN CAST(2 AS DECIMAL(10), CAST(2 AS DECIMAL(10), DATEDIFF(MONTH,
          BIRTHDATE, MONTHDATE)) / 12) < 50 THEN '45 - 49'     WHEN CAST(2 AS DECIMAL(10),
          CAST(2 AS DECIMAL(10), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 55
          THEN '50 - 54'     WHEN CAST(2 AS DECIMAL(10), CAST(2 AS DECIMAL(10), DATEDIFF(MONTH,
          BIRTHDATE, MONTHDATE)) / 12) < 60 THEN '55 - 59'     WHEN CAST(2 AS DECIMAL(10),
          CAST(2 AS DECIMAL(10), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 65
          THEN '60 - 64'     WHEN CAST(2 AS DECIMAL(10), CAST(2 AS DECIMAL(10), DATEDIFF(MONTH,
          BIRTHDATE, MONTHDATE)) / 12) < 100 THEN '65+'     ELSE 'UNKNOWN'    END
