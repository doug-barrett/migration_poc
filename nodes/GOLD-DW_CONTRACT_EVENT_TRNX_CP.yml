          LEFT JOIN {{ ref(''BRONZE'', ''DW_CONTRACT'') }} dw_contract ON cp_dcaah.CSHO_POLICY_NUMBER = dw_contract.CONTRACT_ID /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT_OPTION'') }} dw_product_option ON dw_product_option.PRODUCT_KEY = cp_dcaah.PRODUCT_KEY AND dw_product_option.PRODUCT_OPTION_CODE = cp_dcaah.INVEST_OPT_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_CODE_CONVERT'') }} ref360_code_convert ON ref360_code_convert.SOURCE_SYSTEM_CODE = cp_dcaah.CASH_SRCE_ID AND ref360_code_convert.SOURCE_PRODUCT_SYSTEM = cp_dcaah.SRC_SYSTEM_CODE AND ref360_code_convert.REF360_REFERENCE_DATA_SET = cp_dcaah.REF360_DATA_SET

          LEFT JOIN {{ ref(''BRONZE'', ''CP_CASH_CAUSE_CONVERT'') }} cp_cash_cause_convert ON cp_cash_cause_convert.CASH_CAUSE = cp_dcaah.CSHO_CASH_CAUSE

