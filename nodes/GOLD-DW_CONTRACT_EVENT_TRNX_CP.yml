          LEFT JOIN {{ ref(''BRONZE'', ''DW_EVENT_TYPE'') }} dw_event_type ON dw_event_type.EVENT_TYPE_CODE = cp_dcaah.EVENT_TYPE_CODE AND dw_event_type.SOURCE_SYSTEM_CODE = cp_dcaah.SRC_SYS_CODE AND dw_event_type.EVENT_TYPE_GROUP_CODE = cp_dcaah.EVENT_TYPE_GROUP_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''DW_TRNX_TYPE'') }} dw_trnx_type ON dw_trnx_type.SOURCE_SYSTEM_CODE = cp_dcaah.SRC_SYSTEM_CODE AND dw_trnx_type.SOURCE_TRNX_TYPE_CODE = cp_dcaah.CSH_CASH_CAUSE'
