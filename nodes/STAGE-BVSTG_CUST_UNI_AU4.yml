    sourceMapping:
      - aliases:
          BVSTG_CUST_UNI_AU1: 7c1d4c2c-55e4-4a97-a865-4308624e6e20
          BVSTG_CUST_UNI_AU3: 34bcd370-2a8c-4591-b9b5-63a581fc7e40
          DS_CUSTOMER_UNIFICATION_MASTER: ab04cdaa-0302-4849-a6a3-9490589070f6
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU4
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU1
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU3
          - locationName: EDW
            nodeName: DS_CUSTOMER_UNIFICATION_MASTER
        join:
          joinCondition: |-
            FROM(
                    WITH FUZZ_MATCH_NAME_DOB_ZIP_PHONE AS (
                            SELECT C.*,
                                   D.CLUSTER_KEY,
                                   D.CDP_CUSTOMERID ,
                                   DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(C.KEY_NAME_DOB_EMAIL_PHONE, D.CLUSTER_KEY) FUZZY_SCORE
                              FROM (
                                    SELECT A.PRIMARY_KEY,
                                           A.VALID_FIRSTNAME,
                                           A.KEY_NAME_DOB_EMAIL_PHONE
                                      FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }} A
                                      LEFT JOIN {{ ref('STAGE','BVSTG_CUST_UNI_AU3') }} B
                                        ON (A.PRIMARY_KEY = B.PRIMARY_KEY)
                                     WHERE B.PRIMARY_KEY IS NULL
                                       AND A.VALID_FIRSTNAME <> ''
                                       AND VALID_DOB <> '1111-11-11'
                                       AND VALID_EMAIL <> ''
                                       AND VALID_PHONE <> ''
                                   ) C
                             INNER JOIN (
                                    SELECT DISTINCT FIRSTNAME,
                                           CDP_CUSTOMERID,
                                           CLUSTER_KEY
                                      FROM {{ ref('EDW','DS_CUSTOMER_UNIFICATION_MASTER') }}
                                     WHERE CDP_CUSTOMERID <> ''
                                       AND FIRSTNAME <> ''
                                       AND PHONE <> ''
                                       AND EMAIL <> ''
                                       AND DOB <> '1111-11-11'
                                   ) D
                                ON (C.VALID_FIRSTNAME = D.FIRSTNAME)
                             WHERE DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(C.KEY_NAME_DOB_EMAIL_PHONE, D.CLUSTER_KEY) >= 85 QUALIFY ROW_NUMBER() OVER(PARTITION BY C.PRIMARY_KEY, C.VALID_FIRSTNAME ORDER BY DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(C.KEY_NAME_DOB_EMAIL_PHONE, D.CLUSTER_KEY) DESC) = 1
                           ) ,
                           UNIFICATION AS (
                            SELECT BL.CREATED,
                                   BL.END_MONTH,
                                   BL.CUSTOMERID,
                                   BL.PRIMARY_KEY,
                                   BL.SOURCEDB,
                                   BL.ISLEGACYCUSTOMER,
                                   BL.CUSTOMER_STATUS ,
                                   BL.VALID_FIRSTNAME AS FIRSTNAME ,
                                   BL.VALID_LASTNAME AS LASTNAME ,
                                   BL.VALID_DOB AS DOB ,
                                   BL.VALID_MAINZIP AS MAINZIP ,
                                   BL.VALID_EMAIL AS EMAIL ,
                                   BL.VALID_PHONE AS PHONE ,
                                   BL.GENDER,
                                   BL.MAINSTREET,
                                   BL.MAINSTATE,
                                   BL.LICENSENUMBER,
                                   BL.NON_NULL_FIELD_COUNT,
                                   BL.KEY_NAME_DOB_EMAIL_PHONE,
                                   BL.DUPLICATE_KEY ,
                                   FUZZ.CDP_CUSTOMERID ,
                                   FUZZ.CLUSTER_KEY ,
                                   FUZZ.FUZZY_SCORE ,
                                   'FUZZ_NAME_DOB_PHONE_EMAIL' AS FUZZ_SCORE_KEY
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }} BL
                             INNER JOIN FUZZ_MATCH_NAME_DOB_ZIP_PHONE FUZZ
                                ON (BL.PRIMARY_KEY = FUZZ.PRIMARY_KEY)
                           ) ,
                           DUPLICATED_RECORDS AS (
                            SELECT I.CREATED,
                                   I.END_MONTH,
                                   I.CUSTOMERID,
                                   I.PRIMARY_KEY,
                                   I.SOURCEDB,
                                   I.ISLEGACYCUSTOMER,
                                   I.CUSTOMER_STATUS ,
                                   I.VALID_FIRSTNAME AS FIRSTNAME ,
                                   I.VALID_LASTNAME AS LASTNAME ,
                                   I.VALID_DOB AS DOB ,
                                   I.VALID_MAINZIP AS MAINZIP ,
                                   I.VALID_EMAIL AS EMAIL ,
                                   I.VALID_PHONE AS PHONE ,
                                   I.GENDER,
                                   I.MAINSTREET,
                                   I.MAINSTATE,
                                   I.LICENSENUMBER,
                                   I.NON_NULL_FIELD_COUNT,
                                   I.KEY_NAME_DOB_EMAIL_PHONE,
                                   I.DUPLICATE_KEY ,
                                   K.CDP_CUSTOMERID,
                                   K.CLUSTER_KEY ,
                                   100 AS FUZZY_SCORE ,
                                   'DUPLICATE_RECORD' AS FUZZ_SCORE_KEY
                              FROM (
                                    SELECT *
                                      FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }}
                                     WHERE DUPLICATE_KEY <> 'none_duplicate'
                                       AND PRIMARY_KEY NOT IN (
                                            SELECT PRIMARY_KEY
                                              FROM UNIFICATION
                                         UNION ALL SELECT PRIMARY_KEY
                                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU3') }}
                                           )
                                   ) I
                             INNER JOIN (
                                    SELECT DISTINCT DUPLICATE_KEY,
                                           CDP_CUSTOMERID,
                                           CLUSTER_KEY
                                      FROM UNIFICATION
                                   ) K
                                ON (I.DUPLICATE_KEY = K.DUPLICATE_KEY)
                           ) SELECT *
                      FROM UNIFICATION
                 UNION ALL SELECT *
                      FROM DUPLICATED_RECORDS
                   ) bvstg_cust_uni_au4
