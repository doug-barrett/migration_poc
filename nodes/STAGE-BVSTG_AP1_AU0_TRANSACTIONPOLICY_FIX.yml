        dependencies:
          - locationName: STAGE
            nodeName: V_S_AP1_TRANSACTIONPOLICY_MROC_CURRENT
          - locationName: STAGE
            nodeName: BVSTG_AP1_POLICY_REFRESH
        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_DATA_VAULT.H_TRANSACTION h_transaction
              JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_TRANSACTION_MROC_CURRENT v_s_ap1_transaction_mroc_current
                ON h_transaction.HK_h_transaction = v_s_ap1_transaction_mroc_current.HK_h_transaction
               AND v_s_ap1_transaction_mroc_current.isrowdeleted=0
              JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_AP1_TRANSACTIONPOLICY_MROC_CURRENT v_s_ap1_transactionpolicy_mroc_current
                ON h_transaction.transactionid = TO_CHAR(v_s_ap1_transactionpolicy_mroc_current.transactionid)
               AND v_s_ap1_transactionpolicy_mroc_current.isrowdeleted=0
              JOIN RETAIL_PROD.SCH_DATA_VAULT.H_POLICY h_policy
                ON h_policy.policyid = v_s_ap1_transactionpolicy_mroc_current.policyid --JOIN {{ ref('STAGE','BVSTG_AP1_POLICY_REFRESH') }} bvstg_ap1_policy_refresh    --   ON bvstg_ap1_policy_refresh.policyid = v_s_ap1_transactionpolicy_mroc_current.policyid
