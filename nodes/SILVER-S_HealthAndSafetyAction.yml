      config: {}
      dataType: NUMBER(38,0)
      description: Number of Actions not completed on time or if not yet completed
        are already past their target date. Actions without targets are not counted.
      name: OverdueActionCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   --NO TARGET   --WHEN I_HEALTHANDSAFETYACTION.TARGETDATE
          IS NULL THEN 0   --OPEN AND ALREADY OVERDUE   --WHEN I_HEALTHANDSAFETYACTION.CLOSEDDATE
          IS NULL   -- AND I_HEALTHANDSAFETYACTION.CANSTARTDATE IS NOT NULL   -- AND
          I_HEALTHANDSAFETYACTION.TARGETDATE < CURRENT_TIMESTAMP() THEN 1   --CLOSED
          AFTER DUE DATE   --WHEN I_HEALTHANDSAFETYACTION.CLOSEDDATE IS NOT NULL   --
          AND I_HEALTHANDSAFETYACTION.TARGETDATE < I_HEALTHANDSAFETYACTION.CLOSEDDATE
          THEN 1  WHEN I_HEALTHANDSAFETYACTION.ACTIONTIMELINESS = 'OVERDUE' THEN 1  ELSE
          0 END
