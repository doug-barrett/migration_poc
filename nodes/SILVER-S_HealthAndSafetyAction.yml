      description: Count of the number of actions recorded in the QPulse and NPSafe
        systems that are still open
      name: OpenActionCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE  -- WHEN I_HEALTHANDSAFETYACTION.CLOSEDDATE IS NULL  --  AND
          I_HEALTHANDSAFETYACTION.CANSTARTDATE IS NOT NULL   WHEN I_HEALTHANDSAFETYACTION.ACTIONSTATUS
          = 'OPEN'  THEN 1 ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 2f3a758b-1780-557b-aeee-a74a3fc03d29
        stepCounter: f6685ecc-a140-57d2-ae5d-d5b4c0eeb53c
      config: {}
      dataType: NUMBER(38,0)
      description: Number of actions that have not had their Ready To Start field
        set.
      name: NotYetStartedActionCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE  --STILL OPEN  -- WHEN I_HEALTHANDSAFETYACTION.CLOSEDDATE
          IS NULL  -- BUT NO CAN START DATE  --  AND I_HEALTHANDSAFETYACTION.CANSTARTDATE
          IS NULL   WHEN I_HEALTHANDSAFETYACTION.ACTIONSTATUS = 'NOT READY'  THEN
          1 ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 79b1da4b-d691-58db-84a0-e45e882e0c17
        stepCounter: f6685ecc-a140-57d2-ae5d-d5b4c0eeb53c
      config: {}
      dataType: NUMBER(38,0)
      description: Number of Actions completed on time or if not yet completed are
        not past their target date. Actions without target dates are not counted.
      name: OnTimeActionCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   --NO TARGET   --WHEN I_HEALTHANDSAFETYACTION.TARGETDATE
          IS NULL THEN 0   --OPEN BUT NOT DUE YET   --WHEN I_HEALTHANDSAFETYACTION.CLOSEDDATE
          IS NULL   -- AND I_HEALTHANDSAFETYACTION.CANSTARTDATE IS NOT NULL   -- AND
          I_HEALTHANDSAFETYACTION.TARGETDATE >= CURRENT_TIMESTAMP() THEN 1   --CLOSED
          ON OR BEFORE DUE DATE   --WHEN I_HEALTHANDSAFETYACTION.CLOSEDDATE IS NOT
          NULL   -- AND I_HEALTHANDSAFETYACTION.TARGETDATE >= I_HEALTHANDSAFETYACTION.CLOSEDDATE
          THEN 1  WHEN I_HEALTHANDSAFETYACTION.ACTIONTIMELINESS = 'ONTIME' THEN 1  ELSE
          0 END
