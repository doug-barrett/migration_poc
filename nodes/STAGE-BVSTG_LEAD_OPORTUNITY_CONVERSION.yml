                   IFNULL(COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.isQuote = 1 AND ds_bvstg_ap1_leadhistory.LeadType = 'Call Back' AND ds_bvstg_ap1_leadhistory.WASTRANSFER = 0 THEN DATE (ds_bvstg_ap1_leadhistory.Created) || ds_bvstg_ap1_leadhistory.LeadID || ds_bvstg_ap1_leadhistory.PRIMARYUSERID ELSE NULL END), 0) AS QuoteFromNextOpp ,
                   IFNULL(COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.issale = 1 AND ds_bvstg_ap1_leadhistory.LeadType = 'Call Back' AND ds_bvstg_ap1_leadhistory.WASTRANSFER = 0 THEN DATE (ds_bvstg_ap1_leadhistory.Created) || ds_bvstg_ap1_leadhistory.LeadID || ds_bvstg_ap1_leadhistory.PRIMARYUSERID ELSE NULL END), 0) AS SaleFromNextOpp ,
