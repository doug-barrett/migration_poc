                      FROM (
                            SELECT LEADID ,
                                   LOB
                              FROM (
                                    SELECT l.leadid ,
                                           lob.name LOB
                                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC l
                                      LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LINEOFBUSINESSTYPE_MROC lob
                                        ON l.lineofbusinesstypeid = lob.lineofbusinesstypeid QUALIFY ROW_NUMBER() OVER (PARTITION BY l.leadid ORDER BY l.dss_version DESC) = 1
                                   )
                           ) s_ap1_lead_mroc_lob
                      LEFT JOIN (
                            SELECT leadid ,
                                   lineofbusinesstype AS lob
                              FROM retail_prod.sch_edw.ds_ram_retail_repository
                             WHERE classificationgroup = 'New Business'
                               AND sourcedb = 'AppOne'
                           ) ds_ram_retail_repository_lob
                        ON s_ap1_lead_mroc_lob.leadid = ds_ram_retail_repository_lob.leadid
                   ) ,
                   CS_CTE AS (
                    SELECT CUSTOMERID ,
                           COALESCE(QUOTESTATE, MAILINGSTATE, GARAGESTATE, MAINSTATE) AS CUSTOMER_STATE
