        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_LEADHISTORY
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
        join:
          joinCondition: |-
            EXTENDED
              FROM ( WITH S_AP1_LEAD_MROC_CTE AS (
                    SELECT s_ap1_lead_mroc_lob.LEADID ,
                           IFNULL(ds_ram_retail_repository_lob.LOB, s_ap1_lead_mroc_lob.lob) LOB
                      FROM (
                            SELECT LEADID ,
                                   LOB
                              FROM (
                                    SELECT l.leadid ,
                                           lob.name LOB
                                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC l
                                      LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LINEOFBUSINESSTYPE_MROC lob
                                        ON l.lineofbusinesstypeid = lob.lineofbusinesstypeid QUALIFY ROW_NUMBER() OVER (PARTITION BY l.leadid ORDER BY l.dss_version DESC) = 1
                                   )
                           ) s_ap1_lead_mroc_lob
                      LEFT JOIN (
                            SELECT leadid ,
                                   lineofbusinesstype AS lob
                              FROM retail_prod.sch_edw.ds_ram_retail_repository
                             WHERE classificationgroup = 'New Business'
                               AND sourcedb = 'AppOne'
                           ) ds_ram_retail_repository_lob
                        ON s_ap1_lead_mroc_lob.leadid = ds_ram_retail_repository_lob.leadid
                   ) ,
                   CS_CTE AS (
                    SELECT CUSTOMERID ,
                           COALESCE(QUOTESTATE, MAILINGSTATE, GARAGESTATE, MAINSTATE) AS CUSTOMER_STATE
                      FROM RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2
                     WHERE sourcedb = 'AppOne'
                   ) SELECT DATE (ds_bvstg_ap1_leadhistory.Created) AS CreatedDate ,
                   ds_bvstg_ap1_leadhistory.UserEmployeeNumber AS EmployeeNumber ,
                   ds_bvstg_ap1_leadhistory.OfficeCode ,
                   S_AP1_LEAD_MROC.LOB AS LEAD_LOB ,
                   CS.CUSTOMER_STATE ,
                   MAX(USERFULLNAME) AS USERFULLNAME ,
                   SUM(ds_bvstg_ap1_leadhistory.isTransfer) AS Transfers ,
                   IFNULL(COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.isQuote = 1 AND ds_bvstg_ap1_leadhistory.wasTransfer = 1 THEN DATE (ds_bvstg_ap1_leadhistory.Created) || ds_bvstg_ap1_leadhistory.LeadID || ds_bvstg_ap1_leadhistory.PRIMARYUSERID ELSE NULL END), 0) AS QuotesFromTransfer ,
                   COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.isTransfer = 1 AND ds_bvstg_ap1_leadhistory.TransactionID IS NOT NULL AND DATE (ds_bvstg_ap1_leadhistory.Transactioncreated) = DATE (ds_bvstg_ap1_leadhistory.Created) THEN ds_bvstg_ap1_leadhistory.HistoryID ELSE NULL END) AS SaleSameDayFromTransfer ,
                   COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.isTransfer = 1 AND ds_bvstg_ap1_leadhistory.TransactionID IS NOT NULL THEN ds_bvstg_ap1_leadhistory.HistoryID ELSE NULL END) AS SaleFromTransfer ,
                   IFNULL(COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.isLead = 1 AND ds_bvstg_ap1_leadhistory.LeadType = 'Call Back' AND ds_bvstg_ap1_leadhistory.WASTRANSFER = 0 THEN DATE (ds_bvstg_ap1_leadhistory.Created) || ds_bvstg_ap1_leadhistory.LeadID || ds_bvstg_ap1_leadhistory.PRIMARYUSERID ELSE NULL END), 0) AS LeadsNextOpp ,
                   IFNULL(COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.isQuote = 1 AND ds_bvstg_ap1_leadhistory.LeadType = 'Call Back' AND ds_bvstg_ap1_leadhistory.WASTRANSFER = 0 THEN DATE (ds_bvstg_ap1_leadhistory.Created) || ds_bvstg_ap1_leadhistory.LeadID || ds_bvstg_ap1_leadhistory.PRIMARYUSERID ELSE NULL END), 0) AS QuoteFromNextOpp ,
                   IFNULL(COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.issale = 1 AND ds_bvstg_ap1_leadhistory.LeadType = 'Call Back' AND ds_bvstg_ap1_leadhistory.WASTRANSFER = 0 THEN DATE (ds_bvstg_ap1_leadhistory.Created) || ds_bvstg_ap1_leadhistory.LeadID || ds_bvstg_ap1_leadhistory.PRIMARYUSERID ELSE NULL END), 0) AS SaleFromNextOpp ,
                   IFNULL(COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.isLead = 1 AND ds_bvstg_ap1_leadhistory.CreatedLeadType = 'Producer' AND ds_bvstg_ap1_leadhistory.LeadType = 'New Lead' THEN DATE (ds_bvstg_ap1_leadhistory.Created) || ds_bvstg_ap1_leadhistory.LeadID || ds_bvstg_ap1_leadhistory.PRIMARYUSERID ELSE NULL END), 0) AS LeadsFromProducer ,
                   IFNULL(COUNT(DISTINCT CASE WHEN ds_bvstg_ap1_leadhistory.isQuote = 1
               AND ds_bvstg_ap1_leadhistory.CreatedLeadType = 'Producer'
               AND ds_bvstg_ap1_leadhist
