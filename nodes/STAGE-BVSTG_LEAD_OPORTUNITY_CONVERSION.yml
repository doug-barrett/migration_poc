          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT REP.DATE,
                           AK.EMPLOYEENUMBER,
                           AK.EMPLOYEENAME,
                           AK.OFficeCode,
                           AK.jobtitle
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY" AK
                     INNER JOIN (
                            SELECT DATE(CREATEDDATE) DATE,PRIMARYAGENTULTIPRO_BROKER EMPLOYEENUMBER
                              FROM "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"
                             WHERE LABEL IN('Quotes Auto','Quotes Complementary','New Business Auto','New Business Complementary')
                               AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0 AND DATE(CREATEDDATE) >= '2019-01-01') OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATE(CREATEDDATE) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE())))))))
                               AND SourceDB = 'CIGH'
                             GROUP BY DATE(CREATEDDATE),
                                      PRIMARYAGENTULTIPRO_BROKER
                             UNION SELECT DATE(a.CREATEDDATE),
                                   a.FOLLOWUP_EMPLOYEENUMBER
                              FROM "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY" a
                             WHERE (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0 AND DATE(a.CREATEDDATE) >= '2019-01-01') OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATE(a.CREATEDDATE) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE())))))))
                               AND a.SourceDB = 'ConfieHub'
                               AND LEN(a.CustomerID)>15
                             GROUP BY DATE(CREATEDDATE),
                                      FOLLOWUP_EMPLOYEENUMBER
                           )REP
                        ON AK.EMPLOYEENUMBER = REP.EMPLOYEENUMBER
                       AND AK.RANK_EMPLOYEENUMBER = 1
                     GROUP BY REP.DATE,
                              AK.EMPLOYEENUMBER,
                              AK.EMPLOYEENAME,
                              AK.OFficeCode,
                              AK.jobtitle
                   )DS_AGENT_KEY
              LEFT JOIN(
                    SELECT DATE(C.CREATED)Date,AK.EMPLOYEENUMBER,
                           COUNT(1)LeadsFromProducer
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_CUSTOMERSUMMARY_V2" C
                     INNER JOIN "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY" AK
                        ON C.CREATEDBY = AK.CIGH_USERID
                     INNER JOIN "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" RO
                        ON AK.OfficeCode = RO.OfficeCode
                       AND RO.BUSINESSENTITYNAME = 'USAgencies Retail'
                       AND AK.HR_STATUS !='Terminated'
                     WHERE C.SourceDb='CIGH'
                       AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0 AND DATE(C.CREATED) >= '2019-01-01') OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATE(C.CREATED) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE())))))))
                     GROUP BY DATE(C.CREATED),
                              AK.EMPLOYEENUMBER
                   )DS_CUSTOMERSUMMARY_V2
                ON DS_CUSTOMERSUMMARY_V2.Date = DS_AGENT_KEY.DATE
               AND DS_CUSTOMERSUMMARY_V2.EMPLOYEENUMBER = DS_AGENT_KEY.EMPLOYEENUMBER
              LEFT JOIN( SELECT a.FOLLOWUP_EMPLOYEENUMBER EMPLOYEENUMBER,
                   DATE(a.CREATEDDATE)DATE ,COUNT(DISTINCT a.ID) Transfers ,
                   COUNT(DISTINCT CASE WHEN a.NBTRANSACTIONID IS NOT NULL AND DATE(a.CREATEDDATE) = DATE(a.TRANSACTIONDATE) THEN a.ID END) SaleSameDayFromTransfer ,
                   COUNT(DISTINCT CASE WHEN a.NBTRANSACTIONID IS NOT NULL THEN a.ID END) SalefromTransfer ,
                   COUNT(DISTINCT CASE WHEN c.ID IS NOT NULL THEN a.ID END) QuotesfromTransfer
              FROM "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY" a
             INNER JOIN "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" b
                ON a.FOLLOWUP_OFFICECODE = b.OfficeCode
               AND b.BUSINESSENTITYNAME = 'USAgencies Retail'
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY" c
                ON a.CustomerID = c.CustomerID
               AND a.SourceDB = c.SourceDB
               AND c. LABEL IN('Quotes Auto','Quotes Complementary')
               AND DATE(a.CREATEDDATE) = DATE(c.CREATEDDATE)
             WHERE ( ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0 AND DATE(a.CREATEDDATE) >= '2019-01-01')
                OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1
               AND DATE(a.CREATEDDATE) >= DATEADD(
             MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',
                   DATEADD(DAY,
                   1,
                   last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE()))
