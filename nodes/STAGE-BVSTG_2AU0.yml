                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.REASONCODE
              FROM (SELECT BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.*,
                   CASE WHEN rehire_start_date_final.employeeid IS NOT NULL AND BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.LASTHIREDATE > BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.ORIGINALHIREDATE THEN 'RH'
                        ELSE NULL
                         END AS rehirestatus
              FROM {{ ref('STAGE','BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY') }}
              LEFT JOIN (
