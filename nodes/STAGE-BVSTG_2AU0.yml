        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.DATETIMECREATED,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.JOBEFFECTIVEDATE,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.month_created,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.companyid,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.companycode,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.companyname,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.PAYGROUPCODE,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.paygroup,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.supervisorfirstname,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.supervisorlastname,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.supervisorname,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.employeenumber,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.employeeid,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.firstname,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.lastname,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.empname AS empname,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.employeename,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.age AS age,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.gender AS gender,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.ethnicity AS ethnicity,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.jobcode,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.jobtitle,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.jobfamilycode,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.jobfamily,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.originalhiredate,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.lasthiredate,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.dateinjob,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.Terminationdate,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.EmployeeStatusStartDate,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.EMPLOYEESTATUS AS employmentstatus,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.terminationreasoncode,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.terminationreason,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.terminationtypecode,
                   NULL AS terminationtype,
                   NULL AS hiresource,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.locationcode,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.Location,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.State,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.SalesVicePresidentName,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.DistrictManagerName,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.District,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.orglevel1code,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.org1level,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.orglevel2code,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.org2level,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.orglevel3code,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.org3level,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.orglevel4code,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.org4level,
                   NULL AS accrual_option,
                   NULL AS available_balance,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.EmployeeTypeCode,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.rehirestatus,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.REASONCODE
              FROM (SELECT BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.*,
                   CASE WHEN rehire_start_date_final.employeeid IS NOT NULL AND BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.LASTHIREDATE > BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.ORIGINALHIREDATE THEN 'RH'
                        ELSE NULL
                         END AS rehirestatus
              FROM {{ ref('STAGE','BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY') }}
              LEFT JOIN (
                    SELECT DISTINCT employeeid,
                           companyid,
                           min(DATETIMECREATED) AS min_term_date
                      FROM (
                            SELECT *,
                                   CASE WHEN terminationreason NOT IN ('DeclinedJob/Fail to start','Transferred out') AND employeestatus IN ('Terminated') THEN 1
                                        ELSE 0
                                         END AS termination_reason_eligible
                              FROM {{ ref('STAGE','BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY') }}
                           )
                     WHERE termination_reason_eligible = 1
                     GROUP BY 1,
                              2
                   ) AS rehire_start_date_final
                ON BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.employeeid = rehire_start_date_final.employeeid
               AND -- BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.companyid = rehire_start_date_final.companyid and         BVSTG_HR_1AU0_SALESEMPLOYEESUMMAR
