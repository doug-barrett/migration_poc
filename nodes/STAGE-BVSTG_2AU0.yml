                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.jobcode,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.jobtitle,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.jobfamilycode,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.jobfamily,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.originalhiredate,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.lasthiredate,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.dateinjob,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.Terminationdate,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.EmployeeStatusStartDate,
