                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.supervisorlastname,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.supervisorname,
                   BVSTG_HR_1AU0_SALESEMPLOYEESUMMARY.employeenumber,
