          LEFT OUTER JOIN {{ ref('GOLD', 'LOCATION') }} "LOCATION"
           ON   CDC_WOLBRDFL.VLLOC = LOCATION.Location_Code
           AND CDC_WOLBRDFL.VLCMP = LOCATION.Company_Code
