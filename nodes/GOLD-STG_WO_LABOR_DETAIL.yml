          LEFT OUTER JOIN {{ ref('GOLD', 'EQUIPMENT') }} "EQUIPMENT"
          ON   CDC_WOLBRDFL.VLCMP = EQUIPMENT.COMPANY_CODE
          AND  CDC_WOLBRDFL.VLEQP0 = EQUIPMENT.EQUIPMENT_CODE
