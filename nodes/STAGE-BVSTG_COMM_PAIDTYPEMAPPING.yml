                          WHEN v_dlbv_comm_carrierdatarepositorycomplete_current.carriername_grouped = 'Amwins'                                                                                                                                      THEN 'L3'
                          WHEN v_dlbv_comm_carrierdatarepositorycomplete_current.carriername_grouped = 'American Freedom'                                                                                                                            THEN 'L6'
                          WHEN v_dlbv_comm_carrierdatarepositorycomplete_current.carriername_Grouped IN ('Gainsco', 'Empower', 'Bluefire', 'Safeway', 'Key Insurance', 'American Access', 'Primero', 'Bristol West', 'Legacy', 'Producers National') THEN 'L5'
                          WHEN v_dlbv_comm_carrierdatarepositorycomplete_current.carriername_grouped = 'Assurance America'                                                                                                                           THEN 'L7'
                          WHEN v_dlbv_comm_carrierdatarepositorycomplete_current.paidtype_final IN ('As Earned', 'As Collected')                                                                                                                     THEN 'L4'
                           END
