          V_DLBV_API_UKG_EMPLOYEEPAYSTATEMENTS_CURRENT: 714f38b5-7b0d-4318-bea7-99b6be93123b
          V_DLBV_API_UKG_WORKSUMMARIES_CURRENT: 63cc659c-8e2e-4837-91cf-ecc62eda422c
          V_DLBV_API_UKG_JOBS_CURRENT: 69cc2861-11af-44d2-b65d-def6e5a12f3d
          V_DLBV_UHR_JOBGROUPMAP_CURRENT: dd39378a-7b15-4200-90a7-298e08fce15b
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_API_UKG_EMPLOYEEPAYSTATEMENTS_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_API_UKG_WORKSUMMARIES_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_API_UKG_JOBS_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_UHR_JOBGROUPMAP_CURRENT
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT T1.EMPLOYEENUMBER,
                           T1.ENDDATE,
                           'fte' AS metric,
                           WRKHRS AS metricvalue
                      FROM (
                            SELECT EMPLOYEENUMBER,
                                   ENDDATE,
                                   sum(ROUND(WRKMINS / 60, 1)) AS WRKHRS
                              FROM (
                                    SELECT DISTINCT EMPLOYEENUMBER,

                                    CONCAT (EMPLOYEENUMBER, '-', COMPANYIDENTIFIER) AS EMPNAME,
                                           date_trunc(MONTH, to_date(PERIODENDDATE)) AS ENDDATE
                                      FROM {{ ref('STAGE','V_DLBV_API_UKG_EMPLOYEEPAYSTATEMENTS_CURRENT') }}
                                   ) AS a
                              LEFT JOIN (
                                    SELECT EMPNAME,
                                           date_trunc('month', to_date(WORKDATE)) AS WORKDATE,
                                           sum(WRKMINS) AS WRKMINS
                                      FROM {{ ref('STAGE','V_DLBV_API_UKG_WORKSUMMARIES_CURRENT') }}
                                     GROUP BY 1,
                                              2
                                   ) AS b
                                ON a.EMPNAME = b.EMPNAME
                               AND a.ENDDATE = b.WORKDATE
                             GROUP BY 1,
                                      2
                           ) AS T1
                     RIGHT JOIN (
                            SELECT *
                              FROM (
                                    SELECT *
                                      FROM (
                                            SELECT DISTINCT EMPLOYEENUMBER,
                                                   date_trunc(MONTH, to_date(PERIODENDDATE)) AS ENDDATE,
                                                   JOB
                                              FROM {{ ref('STAGE','V_DLBV_API_UKG_EMPLOYEEPAYSTATEMENTS_CURRENT') }}
                                           ) AS a
                                      LEFT JOIN (
                                            SELECT DISTINCT JOBCODE,
                                                   TITLE
                                              FROM {{ ref('STAGE','V_DLBV_API_UKG_JOBS_CURRENT') }}
                                           ) AS b
                                        ON a.JOB = b.JOBCODE
                                     WHERE TITLE NOT IN ('VP, Sales', 'VP, Finance', 'Claims Staff Counsel', 'Sr Mgr, Franchise Sales', 'Sr Gen Mgr Natl Telesale', 'Sr Dir, Sales', 'Sr Dir, Nat Tele (SPLC)', 'SVP, Head of Operations', 'Managing Insurance Agent', 'Managing Ins Agent II', 'Gen Mgr, Natl Telesales', 'District Sales Mgr', 'Dir, Regional Sales', 'Dir, Marketing', 'Dir, Healthcare Sales')
                                       AND TITLE NOT LIKE 'Dir,%'
                                   ) AS a
                              LEFT JOIN (
                                    SELECT DISTINCT JOBCODE,
                                           trim(JOBGROUP) AS JOBGROUP
                                      FROM {{ ref('STAGE','V_DLBV_UHR_JOBGROUPMAP_CURRENT') }}
                                   ) AS b
                                ON a.JOB = b.JOBCODE
                             WHERE JOBGROUP IN ('Producer', 'Trainee', 'Store Manager')
                           ) AS T2
                        ON T1.EMPLOYEENUMBER = T2.EMPLOYEENUMBER
                       AND T1.ENDDATE = T2.ENDDATE
                     WHERE WRKHRS IS NOT NULL
                     UNION SELECT EMPLOYEENUMBER,
                           ENDDATE,
                           'compensation' AS metric,
                           sum(GROSSWAGESCURRENT) AS metricvalue
                      FROM (
                            SELECT EMPLOYEENUMBER,
                                   date_trunc(MONTH, ENDDATE) AS ENDDATE,
                                   JOB,
                                   GROSSWAGESCURRENT
                              FROM (
                                    SELECT EMPLOYEENUMBER,
                                           to_date(PERIODENDDATE) AS ENDDATE,
                                           JOB,
                                           sum(GROSSWAGESCURRENT) AS GROSSWAGESCURRENT
                                      FROM {{ ref('STAGE','V_DLBV_API_UKG_EMPLOYEEPAYSTATEMENTS_CURRENT') }}
                                     GROUP BY 1,
                                              2,
                                              3
                                   ) v_dlbv_api_ukg_employeepaystatements_current
                              LEFT JOIN (
                                    SELECT DISTINCT JOBCODE,
                                           TITLE
                                      FROM {{ ref('STAGE','V_DLBV_API_UKG_JOBS_CURRENT') }}
                                   ) v_dlbv_api_ukg_jobs_current
                                ON v_dlbv_api_ukg_employeepaystatements_current.JOB = v_dlbv_api_ukg_jobs_current.JOBCODE
                             WHERE TITLE NOT IN ('VP, Sales', 'VP, Finance', 'Claims Staff Counsel', 'SVP, Head of Operations', 'Managing Insurance Agent', 'District Sales Mgr', 'Sr Mgr, Franchise Sales', 'Sr Gen Mgr Natl Telesale', 'Sr Dir, Sales', 'Sr Dir, Nat Tele (SPLC)', 'Managing Ins Agent II', 'Gen Mgr, Natl Telesales', 'Dir, Regional Sales', 'Dir, Marketing', 'Dir, Healthcare Sales')
                               AND TITLE NOT LIKE 'Dir,%'
                           ) v_dlbv_api_ukg_employeepaystatements_current
                      LEFT JOIN (
                            SELECT DISTINCT JOBCODE,
                                   trim(JOBGROUP) AS JOBGROUP
                              FROM {{ ref('STAGE','V_DLBV_UHR_JOBGROUPMAP_CURRENT') }}
                           ) v_dlbv_uhr_jobgroupmap_current
                        ON v_dlbv_api_ukg_employeepaystatements_current.JOB = v_dlbv_uhr_jobgroupmap_current.JOBCODE
                     WHERE JOBGROUP IN ('Producer', 'Trainee', 'Store Manager')
                     GROUP BY 1,
                              2
                   ) AS V_DLBV_API_UKG_EMPLOYEEPAYSTATEMENTS_CURRENT
