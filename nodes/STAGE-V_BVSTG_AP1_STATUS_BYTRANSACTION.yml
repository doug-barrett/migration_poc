        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_BVSTG_AP1_STATUS_BYTRANSACTION') }} AS SELECT PolicyID,
                   Created,
                   TransactionType,
                   Status
              FROM (
                    SELECT PolicyID,
                           Created,
                           TransactionType,
                           CASE WHEN TRANSACTIONTYPE IN ('Endorsement','Additional Products','Reinstatement','Renewal Payment','Submitted Documents','Company Payment') THEN 'Active'
                                ELSE 'Cancelled'
                                 END AS Status,
                           RANK() OVER (PARTITION BY PolicyID ORDER BY Created DESC,TransactionID DESC) AS Ranking
                      FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }}
                     WHERE created > '2020-01-01'
                       AND TRANSACTIONTYPE IN ('Cancellation Request','Endorsement','Additional Products','Reinstatement','Renewal Payment','Submitted Documents','Company Payment')
                   )a
             WHERE Ranking =1
