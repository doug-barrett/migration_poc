            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREF_AP1_GOALS_SALES_REVENUE') }} AS SELECT 'Goal' AS TransactionType ,
                   'Unknown' term ,
                   MD5('Unknown') AS CustomerID ,
                   'Native' AS isLegacyTransaction ,
                   TO_DATE(a.salesdate) AS Date ,
                   'Unknown' AS TransactionMethod ,
                   'Unknown' AS Mastercarrierid ,
                   'XXXXXX' EmployeeNumber ,
                   'Unknown' AS lineofbusinesstype ,
                   a.OfficeCode ,
                   0 AS PolicyID ,
                   0 AS Quotes ,
                   0 AS leads ,
                   0 AS paid ,
