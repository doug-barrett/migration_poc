                   0 AS voided_renewal_ancillary_sales ,
                   0 AS new_fee_revenue ,
                   0 AS endorsement_revenue ,
                   0 AS monthly_payment_revenue ,
                   0 AS reinstatement_revenue ,
                   0 AS documentation_revenue ,
                   0 AS renewal_fee_revenue ,
                   0 AS ancillary_revenue ,
                   0 AS ancillary_cost ,
                   0 AS voided_new_fee_revenue ,
                   0 AS voided_endorsement_revenue ,
                   0 AS voided_monthly_payment_revenue ,
                   0 AS voided_reinstatement_revenue ,
                   0 AS voided_documentation_revenue ,
                   0 AS voided_renewal_fee_revenue ,
                   0 AS voided_ancillary_revenue ,
                   0 AS voided_ancillary_cost ,
                   0 AS payment_received ,
                   0 AS voided_payment ,
                   0 AS credit_extended ,
                   0 AS credit_collected ,
                   0 AS refund ,
                   SUM(a.new_auto_policy_sales) AS goals_auto_policy_sales ,
                   SUM(a.total_primary_fee) AS goals_new_revenue
              FROM {{ ref('STAGE','BVSTG_BOE_AU_GOALS_OFFICEDATE') }} a
              JOIN {{ ref('STAGE','BVSTG_RETAIL_OFFICE') }} b
                ON (a.OfficeCode = b.officecode)
             GROUP BY TO_DATE(a.salesdate) ,
                      a.OfficeCode
