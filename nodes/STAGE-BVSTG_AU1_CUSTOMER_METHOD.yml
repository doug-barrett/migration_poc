            FROM {{ ref('STAGE','BVSTG_CUSTOMER_GROUP_LEAD_TO_REFRESH') }} bvstg_customer_group_lead_to_refresh
             INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} ds_customersummary_v2
                ON bvstg_customer_group_lead_to_refresh.CustomerID = ds_customersummary_v2.CustomerID
               AND ds_customersummary_v2.SourceDB = 'CIGH'
              LEFT JOIN (
                    SELECT CUSTOMERID ,
                           CREATEDDATE ,
                           CUSTOMERNO ,
                           CASE WHEN CLASSIFICATION = 'New Quotes'        THEN 'Quote'
                                WHEN CLASSIFICATIONGROUP = 'New Business' THEN 'NewBusiness'
                                 END EntityType ,
                           PolicyID ,
                           CASE WHEN CLASSIFICATION = 'New Quotes' THEN 1
                                ELSE 0
                                 END Rank_isQuote ,
                           CASE WHEN CLASSIFICATION = 'New Quotes' THEN 1
                                ELSE 0
                                 END Rank_isCompleted ,
                           CASE WHEN CLASSIFICATIONGROUP = 'New Business' THEN 1
                                ELSE 0
                                 END Rank_isconverted ,
                           0 Rank_isLead
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                     WHERE SourceDB = 'CIGH'
                       AND CLASSIFICATIONGROUP IN ('New Quotes Auto' ,'New Quotes Complementary' ,'New Business')
                       AND CREATEDDATE >= '2019-01-01' QUALIFY ROW_NUMBER() OVER (PARTITION BY CUSTOMERID ,CLASSIFICATION ORDER BY CREATEDDATE) = 1
                     UNION SELECT CUSTOMERID ,
                           CREATED ,
                           CUSTOMERNO ,
                           'NewLead' EntityType ,
                           NULL PolicyID ,
                           0 Rank_isQuote ,
                           0 Rank_isCompleted ,
                           0 Rank_isconverted ,
                           1 Rank_isLead
                      FROM {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }}
                     WHERE SOURCEDB = 'CIGH'
                       AND CREATED >= '2019-01-01'
                   ) DS_RAM_RETAIL_REPOSITORY
                ON DS_RAM_RETAIL_REPOSITORY.CustomerID = ds_customersummary_v2.CustomerID
              LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} ds_mkt_call_customer
                ON ds_mkt_call_customer.CustomerID = ds_customersummary_v2.CUSTOMERID
               AND ds_mkt_call_customer.STARTDATETIME BETWEEN DATEADD(HOUR, - 1, DS_RAM_RETAIL_REPOSITORY.CREATEDDATE) AND DATEADD(HOUR, + 1, DS_RAM_RETAIL_REPOSITORY.CREATEDDATE)
              LEFT JOIN (
                    SELECT DISTINCT POLICYID ,
                           DATE (TRANSACTIONDATE) TRANSACTIONDATE
                      FROM {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }}
                     WHERE ModeID = 51
                       AND RECEIPTTYPE = 'Cash'
                       AND POLICYID IS NOT NULL
                       AND TRANSACTIONDATE >= '2019-01-01'
                   ) DS_AMS_TRANSACTIONDETAIL
                ON DS_RAM_RETAIL_REPOSITORY.PolicyID = DS_AMS_TRANSACTIONDETAIL.PolicyID
               AND DATE (DS_RAM_RETAIL_REPOSITORY.CREATEDDATE) = DS_AMS_TRANSACTIONDETAIL.TRANSACTIONDATE
              LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} ds_mkt_call_customer_prospect
                ON ds_mkt_call_customer_prospect.CustomerID = ds_customersummary_v2.CUSTOMERID
               AND ds_mkt_call_customer_prospect.STARTDATETIME BETWEEN DATEADD(HOUR, - 1, ds_customersummary_v2.CREATED) AND DATEADD(HOUR, + 1, ds_customersummary_v2.CREATED)
              LEFT JOIN (
                    SELECT b.CustomerID cid ,
                           ROW_NUMBER() OVER (PARTITION BY b.CUSTOMERID ,b.SOURCEDB ORDER BY a.LEADCREATED ASC) ROWN ,
                           a.*
                      FROM {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} a
                     INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} b
                        ON TRIM(b.CUSTOMERNO) = TRIM(a.CUSTOMERID)
                       AND b.SOURCEDB = a.SOURCEDB
                   ) DS_MKT_LEAD_SOURCE
                ON TRIM(ds_customersummary_v2.CustomerID) = TRIM(DS_MKT_LEAD_SOURCE.cid)
               AND DS_MKT_LEAD_SOURCE.SourceDB = ds_customersummary_v2.SOURCEDB
               AND DS_MKT_LEAD_SOURCE.ROWN = 1
             WHERE ds_customersummary_v2.SourceDb ='CIGH'
