        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_CUSTOMER_GROUP_LEAD_TO_REFRESH') }} bvstg_customer_group_lead_to_refresh
             INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} ds_customersummary_v2
                ON bvstg_customer_group_lead_to_refresh.CustomerID = ds_customersummary_v2.CustomerID
               AND bvstg_customer_group_lead_to_refresh.SourceDB = 'AppOne'
              LEFT JOIN (
                    SELECT CustomerID ,
                           LeadID ,
                           Created ,
                           EXTERNALLEADID ,
                           CreatedBy
                      FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY CustomerID ORDER BY CREATED) = 1
                   ) S_AP1_LEAD_MROC
                ON ds_customersummary_v2.CustomerID = TO_VARCHAR(S_AP1_LEAD_MROC.CustomerID)
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
                ON v_dlbv_api_lms_masterlead_current.LMS_LEAD_ID = S_AP1_LEAD_MROC.ExternalLeadID
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current_lead_partner
                ON S_AP1_LEAD_MROC.externalleadid = v_dlbv_api_lms_masterlead_current_lead_partner.lead_id_partner
              LEFT JOIN (
                    SELECT LeadID ,
                           Created ,
                           CustomerID ,
                           DENSE_RANK() OVER (PARTITION BY CustomerID ORDER BY Created) Lead_Rank
                      FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY CustomerID ,LeadID ORDER BY DSS_VERSION DESC) = 1
                   ) S_AP1_LEAD_MROC_ALL
                ON ds_customersummary_v2.CustomerID = S_AP1_LEAD_MROC_ALL.CustomerID
              LEFT JOIN (
                    SELECT LeadID ,
                           Created ,
                           CreatedBy ,
                           CASE WHEN ISOUTGOINGBRIDGE = 0 THEN 1
                                ELSE 0
                                 END isQuote ,
                           CASE WHEN ISOUTGOINGBRIDGE = 1 THEN 1
                                ELSE 0
                                 END isCompleted ,
                           'AppOne' SourceSystem
                      FROM (
                            SELECT DISTINCT LeadID ,
                                   ISOUTGOINGBRIDGE ,
                                   Created ,
                                   CreatedBy
                              FROM {{ ref('DATA_VAULT','S_AP1_LEADBRIDGEDQUOTE_MROC') }}
                             WHERE LEADBRIDGEDQUOTETYPEID = 4 QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_LEADBRIDGEDQUOTE ORDER BY DSS_VERSION DESC) = 1
                           ) a
                     UNION SELECT V_DL_TBAI_SALESKEYS_CURRENT.APPONEINTERNALLEADID AS LeadID ,
                           V_DL_TBAI_FORMEVENT_CURRENT.EVENTTIME Created ,
                           0 CreatedBy ,
                           CASE WHEN formname LIKE 'Result - Online Quotes%' THEN 1
                                ELSE 0
                                 END AS isQuote ,
                           CASE WHEN formname = 'Show My Quote' THEN 1
                                ELSE 0
                                 END AS isCompleted ,
                           'Turbo' SourceSystem
                      FROM {{ ref('STAGE','V_DLBV_TBAI_FORMEVENT_CURRENT') }} V_DL_TBAI_FORMEVENT_CURRENT
                      LEFT JOIN {{ ref('STAGE','V_DLBV_TBAI_SALESKEYS_CURRENT') }} V_DL_TBAI_SALESKEYS_CURRENT
                        ON V_DL_TBAI_FORMEVENT_CURRENT.sessionid = V_DL_TBAI_SALESKEYS_CURRENT.sessionid
                     WHERE IFNULL(LEADID, 0) != 0
                       AND (formname = 'Show My Quote' OR formname LIKE 'Result - Online Quotes%')
                   ) ds_bvstg_ap1_leadhistory
                ON ds_bvstg_ap1_leadhistory.LeadID = TO_VARCHAR(S_AP1_LEAD_MROC_ALL.LeadID)
              LEFT JOIN (
                    SELECT LeadID ,
                           ExternalLeadID
                      FROM {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }}
                     WHERE ExternalLeadID IS NOT NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY LeadID ORDER BY DSS_VERSION DESC) = 1
                   ) s_ap1_lead_mroc_e
                ON s_ap1_lead_mroc_e.LeadID = ds_bvstg_ap1_leadhistory.LeadID
              LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} ds_mkt_call_customer
                ON ds_mkt_call_customer.CustomerID = ds_customersummary_v2.CUSTOMERID
               AND DS_MKT_CALL_CUSTOMER.SOURCEDB_CUSTOMER = ds_customersummary_v2.SOURCEDB
               AND ds_mkt_call_customer.STARTDATETIME BETWEEN DATEADD(HOUR, - 1, ds_bvstg_ap1_leadhistory.CREATED) AND DATEADD(HOUR, + 1, ds_bvstg_ap1_leadhistory.CREATED)
              LEFT JOIN (
                    SELECT CustomerID ,
                           TransactionID ,
                           CreatedDate ,
                           BIAPRIMARYTRANSACTIONOFFICE OfficeCode ,
                           ORGANIZATIONCODE
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                     WHERE Label IN ('New Business Auto' ,'New Business Complementary')
                       AND SourceDB = 'AppOne' QUALIFY ROW_NUMBER() OVER (PARTITION BY CustomerID ORDER BY CreatedDate) = 1
                   ) DS_RAM_RETAIL_REPOSITORY
                ON DS_RAM_RETAIL_REPOSITORY.CustomerID = ds_customersummary_v2.CUSTOMERID
