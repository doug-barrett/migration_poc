        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_TBAI_FORMEVENT_CURRENT
        join:
          joinCondition: |-
            FROM(
                    SELECT FE.SESSIONID,
                           FE.STEPNO,
                           FE.FORMNAME,
                           FE.EVENTID,
                           FE.EVENTTYPE,
                           FE.EVENTTIME,
                           FE.FIELD,
                           FE.VALUE,
                           FE.carriername,
                           FE.province,
                           FE.city,
                           FE.zip,
                           FE.producer,
                           FE.language,
                           FE.contacttype
                      FROM {{ ref('STAGE','V_DLBV_TBAI_FORMEVENT_CURRENT') }} FE
                     INNER JOIN (
                            SELECT SESSIONID,
                                   MAX(EVENTTIME)EVENTTIME
                              FROM {{ ref('STAGE','V_DLBV_TBAI_FORMEVENT_CURRENT') }}
                             WHERE FORMNAME = 'Turbo Entry Page'
                               AND EventID = '1'
                             GROUP BY SESSIONID
                           )FEG
                        ON FE.SESSIONID = FEG.SESSIONID
                       AND FE.EVENTTIME >= FEG.EVENTTIME QUALIFY ROW_NUMBER() OVER (PARTITION BY FE.SESSIONID,FE.STEPNO,FE.FORMNAME,FE.EVENTID,FE.EVENTTYPE ORDER BY FE.EVENTTIME DESC) = 1
                     UNION SELECT FE.SESSIONID,
                           FE.STEPNO,
                           FE.FORMNAME,
                           FE.EVENTID,
                           FE.EVENTTYPE,
                           FE.EVENTTIME,
                           FE.FIELD,
                           FE.VALUE,
                           FE.carriername,
                           FE.province,
                           FE.city,
                           FE.zip,
                           FE.producer,
                           FE.language,
                           FE.contacttype
                      FROM {{ ref('STAGE','V_DLBV_TBAI_FORMEVENT_CURRENT') }} FE
                      LEFT JOIN (
                            SELECT DISTINCT SESSIONID
                              FROM {{ ref('STAGE','V_DLBV_TBAI_FORMEVENT_CURRENT') }}
                             WHERE FORMNAME = 'Turbo Entry Page'
                               AND EventID = '1'
                           )FEG
                        ON FE.SESSIONID = FEG.SESSIONID
                     WHERE FEG.SESSIONID IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY FE.SESSIONID,FE.STEPNO,FE.FORMNAME,FE.EVENTID,FE.EVENTTYPE ORDER BY FE.EVENTTIME DESC) = 1
                   )V_DLBV_TBAI_FORMEVENT_CURRENT
