        dependencies:
          - locationName: EDW
            nodeName: DS_PCCE_OUTBOUNDCALLS
          - locationName: EDW
            nodeName: DS_AGENT_KEY
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_PCCE_OUTBOUNDCALLS') }} ds_pcce_outboundcalls
              LEFT JOIN (
                    SELECT DISTINCT cisco_loginname,
                           EmployeeNumber
                      FROM {{ ref('EDW','DS_AGENT_KEY') }}
                     WHERE Rank_EmployeeNumber=1 QUALIFY row_number() OVER (PARTITION BY employeenumber ORDER BY dss_create_time) = 1
                   ) ds_agent_key
                ON ds_pcce_outboundcalls.UserID = ds_agent_key.cisco_loginname
             WHERE ds_pcce_outboundcalls.CallDirection = 'Outbound'
               AND YEAR(ds_pcce_outboundcalls.CallStart) >= 2019
               AND isconnected = 1
               AND ds_pcce_outboundcalls.OfficeCode IS NOT NULL
               AND UserId IS NOT NULL
               AND officecode NOT IN ('ZTESTOF', 'ZTEST')
               AND (('{{ parameters.HWM_BVSTG_Cognitio_RFG_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Cognitio_RFG_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DATE(dss_update_time),DATE(CURRENT_DATE())) <= '{{ parameters.HWM_BVSTG_cognitio_RFG_Refresh_Days }}'))
