      dataType: NUMBER(38,0)
      description: |-
        Journal Conversion Transformation
        1= Insert
        2 = Update Before
        3 = Update
        4 = Delete
        5 = Refresh
      name: Journal_Type
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: "CASE \n\n WHEN Aud_Type in ('PT','PX','FI') \n\n  THEN 1 \n\n\
          \ WHEN Aud_Type in ('UB','FB','FP','BR') \n\n  THEN 2 \n\n WHEN Aud_Type\
          \ in ('UP','UR') \n\n  THEN 3 \n\n WHEN Aud_Type in ('DL' , 'FD') \n\n \
          \ THEN 4 \n\n WHEN Aud_Type in ('RR') \n\n  THEN 5 \n\n ELSE NULL \n\nEND"
