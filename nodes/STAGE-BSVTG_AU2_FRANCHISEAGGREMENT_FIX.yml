        join:
          joinCondition: |-
            FROM (SELECT * ,
                   ROUND(CASE WHEN premium = 0 THEN DIV0(actualcommission,(actualcommissionpct/100)) ELSE premium END,2) AS premium_db ,
                   ROUND(CASE WHEN newbusinesspolicyflag = 'New Policy' THEN newpercentagefranchise WHEN newbusinesspolicyflag = 'Renewed Policy' THEN renewpercentagefranchise END,2) AS commission_percentage_db ,
                   ROUND(CASE WHEN actualcommission = 0 THEN 0 WHEN ifnull(premium,0)=0 THEN (1- CASE WHEN newbusinesspolicyflag = 'New Policy' THEN newpercentagefranchise/100 WHEN newbusinesspolicyflag = 'Renewed Policy' THEN renewpercentagefranchise/100 END) * actualcommission ELSE (CASE WHEN premium = 0 THEN DIV0(actualcommission,(actualcommissionpct/100)) ELSE premium END) * (CASE WHEN newbusinesspolicyflag = 'New Policy' THEN newpercentagefranchise/100 WHEN newbusinesspolicyflag = 'Renewed Policy' THEN renewpercentagefranchise/100 END) END,2) AS commission_amount_db -- from RETAIL_PROD.SCH_EDW.DS_COMM_FRANCHISEAGGREMENT  from {{ ref('EDW','DS_COMM_FRANCHISEAGGREMENT') }}  ) ds_comm_franchiseaggrement
