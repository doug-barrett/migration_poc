      join:
        joinCondition: "FROM {{ ref('GOLD', 'SRC_CSHSHPFL') }} \"SRC_CSHSHPFL\"\n\
          \ Where Aud_Time <= (Select MAX(Batch_End) FROM \"DOUG_POC\".\"DP001\".\"\
          CDC_BATCH\" )\nAND Aud_Time > (Select MAX(Batch_Start) FROM \"DOUG_POC\"\
          .\"DP001\".\"CDC_BATCH\")\nAND (Aud_Code <> 'F' or (Aud_Code is null and\
          \ Aud_Type = 'RR')) QUALIFY RANK() \nOVER (PARTITION BY  CSCMP, CSCON0,\
          \ CSDLST, CSDL0\nORDER BY AUD_TIME DESC, AUD_SEQNO DESC, CASE  \nWHEN Aud_Type\
          \ in ('PT','PX','FI')\tTHEN 1 \nWHEN Aud_Type in ('UB','FB','FP','BR')\t\
          THEN 2 \nWHEN Aud_Type in ('UP','UR')\tTHEN 3 \nWHEN Aud_Type in ('DL','FD')\t\
