        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU2_GROUP_LEAD') }} BVSTG_AU2_GROUP_LEAD
              LEFT JOIN {{ ref('STAGE','BVSTG_AU2_GROUP_LEAD') }} BVSTG_AU2_GROUP_LEAD_NEXT
                ON BVSTG_AU2_GROUP_LEAD.C_CUSTOMERID = BVSTG_AU2_GROUP_LEAD_NEXT.C_CUSTOMERID
