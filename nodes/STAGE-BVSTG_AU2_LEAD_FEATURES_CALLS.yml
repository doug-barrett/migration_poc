               AND DS_MKT_CALL_CUSTOMER.SOURCEDB_CUSTOMER = BVSTG_AU2_GROUP_LEAD.SOURCEDB
               AND DATE(DS_MKT_CALL_CUSTOMER.STARTDATETIME) >= BVSTG_AU2_GROUP_LEAD.L_LEADDATE
               AND DATE(DS_MKT_CALL_CUSTOMER.STARTDATETIME) < DATE(coalesce(BVSTG_AU2_GROUP_LEAD.L_SALEDATE,BVSTG_AU2_GROUP_LEAD.L_LEADDATE,CURRENT_DATE()))
