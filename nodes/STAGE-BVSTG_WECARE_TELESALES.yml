          - locationName: UNKNOWN
            nodeName: V_PREB_WECARE_CS_COMPLAINT_PRODUCER
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_AGENT_KEY') }} DS_AGENT_KEY
             INNER JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON DS_AGENT_KEY.officecode=ds_retail_office.officecode
             INNER JOIN (
                    SELECT DISTINCT CAL_MONTH,
                           CAL_YEAR,
                           CAL_MONTH_NO
                      FROM {{ ref('UNKNOWN','STAGE_DATE_SF') }}
                   ) STAGE_DATE_SF
                ON 1=1
             INNER JOIN {{ ref('UNKNOWN','V_PREB_WECARE_SALES_PRODUCER') }} v_preb_wecare_sales_producer
                ON v_preb_wecare_sales_producer.Year|| RIGHT('0'|| v_preb_wecare_sales_producer.Month,2) =CAL_MONTH
               AND TO_VARCHAR(DS_AGENT_KEY.EmployeeNumber) = TO_VARCHAR(v_preb_wecare_sales_producer.EMPLOYEENUMBER)
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_MAJOR_ERROR_PRODUCER') }} v_preb_wecare_major_error
                ON v_preb_wecare_major_error.Year|| RIGHT('0'|| v_preb_wecare_major_error.Month,2) = CAL_MONTH
               AND TO_VARCHAR(v_preb_wecare_major_error.EmployeeNumber) = TO_VARCHAR(DS_AGENT_KEY.EmployeeNumber)
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_NPS_PRODUCER') }} v_preb_wecare_nps_producer
                ON v_preb_wecare_nps_producer.Year|| RIGHT('0'|| v_preb_wecare_nps_producer.Month,2) = CAL_MONTH
               AND TO_VARCHAR(v_preb_wecare_nps_producer.EmployeeNumber) = TO_VARCHAR(DS_AGENT_KEY.EmployeeNumber)
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_DOI_COMPLAINT_PRODUCER') }} v_preb_wecare_doi_complaint_producer
                ON v_preb_wecare_doi_complaint_producer.Year|| RIGHT('0'|| v_preb_wecare_doi_complaint_producer.Month,2) = CAL_MONTH
               AND TO_VARCHAR(v_preb_wecare_doi_complaint_producer.EmployeeNumber) = TO_VARCHAR(DS_AGENT_KEY.EmployeeNumber)
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_WECARE_CS_COMPLAINT_PRODUCER') }} v_preb_wecare_cs_complaint_producer
                ON v_preb_wecare_cs_complaint_producer.Year|| RIGHT('0'|| v_preb_wecare_cs_complaint_producer.Month,2) = CAL_MONTH
               AND TO_VARCHAR(v_preb_wecare_cs_complaint_producer.EmployeeNumber) = TO_VARCHAR(DS_AGENT_KEY.EmployeeNumber)
             WHERE CAL_MONTH = '{{ parameters.HWM_BVSTG_Wecare }}'
               AND LEN(ds_retail_office.OfficeCode) <= 10
               AND DS_AGENT_KEY.RANK_EMPLOYEENUMBER=1
               AND DS_AGENT_KEY.EMPLOYEENUMBER !='Pending'
               AND (DS_AGENT_KEY.OFFICECODE like '%SSB%' OR DS_AGENT_KEY.OFFICECODE='COLT') QUALIFY ROW_NUMBER() OVER (PARTITION BY CAL_MONTH || ifnull(DS_AGENT_KEY.EmployeeNumber,'-') ORDER BY ds_retail_office.OfficeCode)=1
             ORDER BY ds_retail_office.OfficeCode
        name: BVSTG_WECARE_TELESALES
        noLinkRefs: []
