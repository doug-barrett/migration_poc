    sourceMapping:
      - aliases:
          DS_MKT_LEAD_SOURCE: 0aaa279e-0731-4ba4-882c-75dc6cf7d3c9
          DS_MKT_CAMPAIGN: 6db20009-e5c5-4a63-9950-65a73fc49802
          DS_BVSTG_AP1_LEADHISTORY: 44e18710-0e1e-45ca-98f0-65ef8e735c2e
          V_S_AP1_EMPLOYEE_MROC_CURRENT: 14a4261f-e5fe-4808-952a-74163c678002
          DS_AGENT_KEY: e03830da-869e-4c69-8cc5-0b677f38927e
          DS_PCCE_OUTBOUNDCALLS: 6a6133fd-d7d3-496d-9605-0c0a46bc772a
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_MKT_LEAD_SOURCE
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_LEADHISTORY
          - locationName: STAGE
            nodeName: V_S_AP1_EMPLOYEE_MROC_CURRENT
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: EDW
            nodeName: DS_PCCE_OUTBOUNDCALLS
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON ds_mkt_campaign.CampaignID = ds_mkt_lead_source.CampaignID
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }} ds_bvstg_ap1_leadhistory
                ON ds_bvstg_ap1_leadhistory.LeadID = ds_mkt_lead_source.LeadID
               AND ds_bvstg_ap1_leadhistory.StatusName IN ('New', 'Reassigned')
              LEFT JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} v_s_ap1_employee_mroc_current
                ON v_s_ap1_employee_mroc_current.USERID = ds_bvstg_ap1_leadhistory.PrimaryUserID
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
                ON ds_agent_key.AP1_USERID = ds_bvstg_ap1_leadhistory.PrimaryUserID
              LEFT JOIN {{ ref('EDW','DS_PCCE_OUTBOUNDCALLS') }} ds_pcce_outboundcalls
                ON ds_agent_key.CISCO_LOGINNAME = ds_pcce_outboundcalls.UserID
               AND (RIGHT(ds_pcce_outboundcalls.DIALEDNUMBER,10) = ds_mkt_lead_source.HomePhone OR RIGHT(ds_pcce_outboundcalls.DIALEDNUMBER,10) = ds_mkt_lead_source.CellPhone OR RIGHT(ds_pcce_outboundcalls.DIALEDNUMBER,10) = ds_mkt_lead_source.ContactPhone)
               AND DATE(ds_mkt_lead_source.LeadCreated) = DATE(CALLSTART)
             WHERE (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0 AND DATE(ds_mkt_lead_source.LeadCreated) >= '2020-01-01') OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}' AND DATEDIFF(DAY,DATE(ds_mkt_lead_source.LeadCreated),DATE(CURRENT_DATE())) <= '{{ parameters.HWM_BVSTG_Mapping_Refresh_Days }}') OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND HOUR(current_timestamp()) > '{{ parameters.HWM_BVSTG_Hour }}' AND TO_DATE(ds_mkt_lead_source.LeadCreated) = TO_DATE(CURRENT_DATE())))
               AND ds_mkt_lead_source.SourceDB = 'AppOne'
               AND ds_mkt_campaign.vendor = 'Maguire' QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_mkt_lead_source.LeadID ORDER BY CASE WHEN ds_bvstg_ap1_leadhistory.PrimaryUserID != 1147 THEN 0 ELSE 1 END, ds_bvstg_ap1_leadhistory.Created)=1
        name: BVSTG_MAGUIRE_CANCELLATIONS
        noLinkRefs: []
