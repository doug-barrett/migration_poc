        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT to_DATE(V_S_SPLC_SUSPENSE_CURRENT.DUEDATE) DATE , V_S_SPLC_EMPLOYEE_CURRENT.SHORTNAME AS EMPLOYEENUMBER ,
                   DS_AGENT_KEY.OFFICECODE AS OFFICECODE ,
                   sum(
                    SELECT CASE WHEN V_S_SPLC_SUSPENSE_CURRENT.STATUS=2 AND IFNULL(to_date(V_S_SPLC_SUSPENSE_CURRENT.COMPLETEDDATE), CURRENT_DATE)<=V_S_SPLC_SUSPENSE_CURRENT.DUEDATE THEN 1
                                ELSE 0
                                 END
                   ) COMPLETED ,
                   sum(1) AS TOTALTASKS ,
                   'Tasks' AS Part ,
                   NULL AS RFF_Numerator,
                   NULL AS RFF_Denominator
              FROM --"RETAIL_PROD"."SCH_BVSTAGE"."V_S_SPLC_SUSPENSE_CURRENT"  {{ ref('STAGE','V_S_SPLC_SUSPENSE_CURRENT') }} V_S_SPLC_SUSPENSE_CURRENT  LEFT JOIN  --"RETAIL_PROD"."SCH_DATA_VAULT"."H_SPLC_EMPLOYEE"   {{ ref('DATA_VAULT','H_SPLC_EMPLOYEE') }} H_SPLC_EMPLOYEE  ON ifnull(trim(V_S_SPLC_SUSPENSE_CURRENT.SUSPTOEMPCODE),'-')=ifnull(trim(H_SPLC_EMPLOYEE.EMPCODE),'-')     LEFT JOIN  --"RETAIL_PROD"."SCH_BVSTAGE"."V_S_SPLC_EMPLOYEE_CURRENT"  {{ ref('STAGE','V_S_SPLC_EMPLOYEE_CURRENT') }} V_S_SPLC_EMPLOYEE_CURRENT  ON H_SPLC_EMPLOYEE.HK_H_EMPLOYEE = V_S_SPLC_EMPLOYEE_CURRENT.HK_H_EMPLOYEE  LEFT JOIN  (select distinct cisco_loginname, EmployeeNumber,Officecode   from  {{ ref('EDW','DS_AGENT_KEY') }} DS_AGENT_KEY  --"RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY"                  where Rank_EmployeeNumber=1                  qualify row_number() over (partition by employeenumber order by dss_create_time) = 1)  DS_AGENT_KEY   ON ifnull(trim(V_S_SPLC_EMPLOYEE_CURRENT.SHORTNAME),'-')=ifnull(trim(DS_AGENT_KEY.EMPLOYEENUMBER),'-')  where year(to_date(V_S_SPLC_SUSPENSE_CURRENT.duedate))>=year(current_date-1)-2     and to_date(V_S_SPLC_SUSPENSE_CURRENT.duedate)<=current_date()-1 and officecode is not null  group by to_DATE(V_S_SPLC_SUSPENSE_CURRENT.DUEDATE)   , V_S_SPLC_EMPLOYEE_CURRENT.SHORTNAME   , DS_AGENT_KEY.OFFICECODE   union all   select startdatetime,employeenumber,officecode,null ,null , 'RFF' As Part,  case when sum(Valid_likelihood_to_recommend_Survey)=0 then 0 else  (sum(likelihood_to_recommend_Count_Promoters)-sum(likelihood_to_recommend_Count_Detractors)) end as RFF_Numerator,  sum(Valid_likelihood_to_recommend_Survey) as RFF_Denominator     from     (select  startdatetime,month,officecode,  employeenumber,    SUM(CASE WHEN (QUESTIONNUMBER=3 and startdatetime<'2025-09-11  14:00:00') or (QUESTIONNUMBER=1 and startdatetime>='2025-09-11  14:00:00')   THEN TO_NUMBER(CASE WHEN LENGTH(QUESTIONRESULT)>1 OR QUESTIONRESULT IS NULL  THEN 0 ELSE 1 END) ELSE 0 END) AS Valid_likelihood_to_recommend_Survey,    SUM(CASE WHEN (QUESTIONNUMBER=3 and startdatetime<'2025-09-11  14:00:00') or (QUESTIONNUMBER=1 and startdatetime>='2025-09-11  14:00:00')   THEN TO_NUMBER(CASE WHEN LENGTH(QUESTIONRESULT)=1 AND QUESTIONRESULT  IN (8,9) THEN 1 ELSE 0 END) ELSE 0 END) AS likelihood_to_recommend_Count_Promoters ,    SUM(CASE WHEN (QUESTIONNUMBER=3 and startdatetime<'2025-09-11  14:00:00') or (QUESTIONNUMBER=1 and startdatetime>='2025-09-11  14:00:00')   THEN TO_NUMBER(CASE WHEN LENGTH(QUESTIONRESULT)=1 AND QUESTIONRESULT  IN (5,6,7) THEN 1 ELSE 0 END) ELSE 0 END) AS likelihood_to_recommend_Count_Passivers ,  SUM(CASE WHEN (QUESTIONNUMBER=3 and startdatetime<'2025-09-11  14:00:00') or (QUESTIONNUMBER=1 and startdatetime>='2025-09-11  14:00:00')   THEN TO_NUMBER(CASE WHEN LENGTH(QUESTIONRESULT)=1 AND QUESTIONRESULT  IN (0,1,2,3,4) THEN 1 ELSE 0 END) ELSE 0 END) AS likelihood_to_recommend_Count_Detractors     from    (SELECT distinct month(summary.startdatetime) AS month,Date(summary.startdatetime) AS startdatetime ,summary.callguid as summary_callguid,  agentkey.officecode,summary.agentskilltargetid,summary.routercallkey,  summary.routercallkeyday,  agentkey.company,   agentkey.EMPLOYEENAME,  agentkey.cisco_skilltargetid,agentkey.EMPLOYEENUMBER,  questionnumber,answerrange,questiontext,questionresult  ,(trim(employeeunique.companycode)||trim(employeeunique.paygroupcode)||trim(employeeunique.jobcode)) as jobgroupid  ,jobgroupmap.jobgroupid jobgroupid1  ,jobgroupmap.jobgroup  --FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCS_SUMMARY_CURRENT summary
        name: BVSTG_0AU4_RETAIL_RFG_EXTRACT
