    sourceMapping:
      - aliases:
          DS_INTERACTIONSUMMARY: b3b445bf-9ae8-4dac-9d59-dd157e75b84e
          DS_MKT_CALLSOURCE: da1ac581-7d2f-4f4e-afbb-2709bf5374c7
          DS_MKT_LEAD_SOURCE: 11ed51b7-3963-4bf2-81b7-ee9ae173436d
          S_AP1_PHONECALL_MROC: 5a737ac1-eb9e-483a-8484-0d694a3f2c97
          S_AP1_PHONECALLDISPOSITION: 8838e6f1-597f-4f59-9784-697c05aba1c0
          H_PHONECALLTYPE: 8bf6404a-22be-451a-927d-e8f0e85e328d
          V_S_AP1_PHONECALLTYPE_CURRENT: 908b9f5e-829a-48b4-8a0b-e112486ba1a3
          DS_MKT_CALL_CUSTOMER: b9bec5bd-83fe-4758-95ec-851f723f90ef
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_INTERACTIONSUMMARY
          - locationName: STAGE
            nodeName: V_S_AP1_PHONECALLTYPE_CURRENT
          - locationName: STAGE
            nodeName: BVSTG_MKT_CALLSOURCE
          - locationName: EDW
            nodeName: DS_MKT_LEAD_SOURCE
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
          - locationName: EDW
            nodeName: DS_MKT_CALLSOURCE
          - locationName: DATA_VAULT
            nodeName: S_AP1_PHONECALL_MROC
          - locationName: DATA_VAULT
            nodeName: S_AP1_PHONECALLDISPOSITION
          - locationName: DATA_VAULT
            nodeName: H_PHONECALLTYPE
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_INTERACTIONSUMMARY') }} ds_interactionsummary
              LEFT JOIN {{ ref('EDW','DS_MKT_CALLSOURCE') }} ds_mkt_callsource
                ON ds_interactionsummary.interactionidkey = ds_mkt_callsource.interactionidkey
              LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source
                ON ds_interactionsummary.interactionidkey = ds_mkt_lead_source.CallID
              LEFT JOIN {{ ref('DATA_VAULT','S_AP1_PHONECALL_MROC') }} s_ap1_phonecall_mroc ON(CASE WHEN s_ap1_phonecall_mroc.callid like '%-%' THEN split_part(s_ap1_phonecall_mroc.callid,'-',2)||'-'||split_part(s_ap1_phonecall_mroc.callid,'-',1) ELSE s_ap1_phonecall_mroc.callid END) = ds_interactionsummary.interactionidkey
              LEFT JOIN {{ ref('DATA_VAULT','S_AP1_PHONECALL_MROC') }} s_ap1_phonecall_mroc_1
                ON s_ap1_phonecall_mroc_1.callid = ds_interactionsummary.interactionidkey
              LEFT JOIN {{ ref('DATA_VAULT','S_AP1_PHONECALLDISPOSITION') }} s_ap1_phonecalldisposition
                ON (IFNULL(s_ap1_phonecall_mroc.phonecallid,s_ap1_phonecall_mroc_1.phonecallid) = s_ap1_phonecalldisposition.phonecallid AND IFNULL(DATE(s_ap1_phonecall_mroc.created),DATE(s_ap1_phonecall_mroc_1.created)) = DATE(s_ap1_phonecalldisposition.created))
              LEFT JOIN {{ ref('DATA_VAULT','H_PHONECALLTYPE') }} h_phonecalltype
                ON (h_phonecalltype.phonecalltypeid = s_ap1_phonecalldisposition.phonecalltypeid)
              LEFT JOIN {{ ref('STAGE','V_S_AP1_PHONECALLTYPE_CURRENT') }} v_s_ap1_phonecalltype_current
                ON (v_s_ap1_phonecalltype_current.HK_H_PHONECALLTYPE = h_phonecalltype.HK_H_PHONECALLTYPE)
              LEFT JOIN (
                    SELECT interactionidkey,
                           CustomerID,
                           EMAIL
                      FROM {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY interactionidkey ORDER BY created DESC)=1
