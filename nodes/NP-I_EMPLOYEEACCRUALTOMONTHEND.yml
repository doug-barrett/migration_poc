            transform: CASE --ONLY START ACCRUING IF PAST MONTH END REPORTING PERIODS   WHEN DAY(PERIODEND) <= 14 THEN 0   ELSE   --NUMBER OF DAYS FROM PERIOD END TO MONTH END   DATEDIFF(DAY,PERIODEND,EOMONTH(PERIODEND))   -- TIMES THE AMOUNT ACCRUED PER PAY DIVIDED BY THE NUMBER OF DAYS IN THE PERIOD   * (ALACCRUEDPERPAY / (DATEDIFF(DAY,PERIODSTART, PERIODEND) + 1))   END
