        description: When we are past the month end processing (I have chosen the 14th as month close in January is late) work out the number of days from period close to month end and apportion the amount accrued per pay over this.
        name: ALACCRUETOMONTHEND
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: a5d4666e-5f3e-4e35-aee5-7ebcb616f492
                stepCounter: c58baed1-7397-43ca-b214-642a19620c3f
            transform: CASE --ONLY START ACCRUING IF PAST MONTH END REPORTING PERIODS   WHEN DAY(PERIODEND) <= 14 THEN 0   ELSE   --NUMBER OF DAYS FROM PERIOD END TO MONTH END   DATEDIFF(DAY,PERIODEND,EOMONTH(PERIODEND))   -- TIMES THE AMOUNT ACCRUED PER PAY DIVIDED BY THE NUMBER OF DAYS IN THE PERIOD   * (ALACCRUEDPERPAY / (DATEDIFF(DAY,PERIODSTART, PERIODEND) + 1))   END
