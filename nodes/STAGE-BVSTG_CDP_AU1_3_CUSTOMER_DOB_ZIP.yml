        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_BVSTG_CDP_CUSTOMER_EMAIL') }} ds_bvstg_cdp_customer_email
             INNER JOIN {{ ref('EDW','DS_BVSTG_CDP_CUSTOMER') }} ds_bvstg_cdp_customer
                ON ds_bvstg_cdp_customer_email.customerid = ds_bvstg_cdp_customer.customerid
               AND ds_bvstg_cdp_customer.cdp_cust_type = 'firstname_dob_zip'
              LEFT JOIN (
                    SELECT CASE WHEN COUNT(ds_bvstg_cdp_customer.cdp_customerid) > 1 THEN 1
                                ELSE 0
                                 END ISDUP_CUST_DOB_ZIP ,
                           ds_bvstg_cdp_customer.cdp_customerid
                      FROM {{ ref('EDW','DS_BVSTG_CDP_CUSTOMER_EMAIL') }} ds_bvstg_cdp_customer_email
                     INNER JOIN {{ ref('EDW','DS_BVSTG_CDP_CUSTOMER') }} ds_bvstg_cdp_customer
                        ON ds_bvstg_cdp_customer_email.customerid = ds_bvstg_cdp_customer.customerid
                     WHERE ds_bvstg_cdp_customer.cdp_cust_type = 'firstname_dob_zip'
                     GROUP BY ds_bvstg_cdp_customer.cdp_customerid
                   ) ds_bvstg_cdp_customer_flag
                ON ds_bvstg_cdp_customer.cdp_customerid = ds_bvstg_cdp_customer_flag.cdp_customerid
             INNER JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 ds_customersummary_v2_dobzip
                ON ds_customersummary_v2_dobzip.customerid = ds_customersummary_v2.customerid
             WHERE ds_bvstg_cdp_customer_email.sourcedb = 'AppOne'
