    sourceMapping:
    - aliases:
        CDC_RAPLHDFL: 95ec01a4-46a0-54ca-ba1d-dd7af4c3abbc
        DV_PARTY: 34cbfe43-0feb-57cb-9e9f-1d8d3238f854
        CUSTOMER_JOB: 9e36d1be-5998-5e03-bc79-da2580cd99d4
        DV_LOCATION: fdd7bb98-8fc4-5715-a7a1-5cd1906c5ab9
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: CDC_RAPLHDFL
        - locationName: GOLD
          nodeName: DV_PARTY
        - locationName: GOLD
          nodeName: CUSTOMER_JOB
        - locationName: GOLD
          nodeName: DV_LOCATION
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'CDC_RAPLHDFL') }} "CDC_RAPLHDFL"
          
          LEFT OUTER JOIN {{ ref('GOLD', 'DV_LOCATION') }} "DV_LOCATION"
          ON   CDC_RAPLHDFL.ROCMP = DV_LOCATION.Company_Code
          AND CDC_RAPLHDFL.ROLOC = DV_LOCATION.Location_Code
          
          LEFT OUTER JOIN {{ ref('GOLD', 'DV_LOCATION') }} "DV_LOCATION1"
          ON   CDC_RAPLHDFL.ROCMP = DV_LOCATION1.Company_Code
          AND CDC_RAPLHDFL.ROREFL = DV_LOCATION1.Location_Code
          
          LEFT OUTER JOIN {{ ref('GOLD', 'DV_LOCATION') }} "DV_LOCATION2"
          ON   CDC_RAPLHDFL.ROCMP = DV_LOCATION2.Company_Code
          AND CDC_RAPLHDFL.ROSCNL = DV_LOCATION2.Location_Code
          
          LEFT OUTER JOIN {{ ref('GOLD', 'DV_PARTY') }} "DV_PARTY"
          ON   CDC_RAPLHDFL.ROCMP = DV_PARTY.Company_Code
          AND CDC_RAPLHDFL.Customer_Account_Num = DV_PARTY.Customer_Account_Num
          AND CDC_RAPLHDFL.Customer_Account_Char = DV_PARTY.Customer_Account_Char
          AND DV_PARTY.Party_Type_Code in (1,2)
          
          LEFT OUTER JOIN {{ ref('GOLD', 'CUSTOMER_JOB') }} "CUSTOMER_JOB"
          ON CDC_RAPLHDFL.ROCMP = CUSTOMER_JOB.Company_Code
          AND CDC_RAPLHDFL.ROJOB0 = CUSTOMER_JOB.Job_Num
          AND DV_PARTY.Party_Id = CUSTOMER_JOB.Party_Id
          AND CUSTOMER_JOB.dss_current_flag = 'Y'
