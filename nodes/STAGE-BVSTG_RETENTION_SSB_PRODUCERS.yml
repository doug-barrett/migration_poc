        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
              LEFT JOIN (
                    SELECT sales.TransactionID ,
                           MIN(ds_pcce_termination_call_summary_session.STARTDATETIME) FIRSTOB ,
                           MAX(ds_pcce_termination_call_summary_session.STARTDATETIME) LASTOB ,
                           ds_pcce_termination_call_summary_session.duration ,
                           ds_pcce_termination_call_summary_session.isoutbound ,
                           ds_pcce_termination_call_summary_session.STARTDATETIME ,
                           ds_pcce_termination_call_summary_session.ENDDATETIME ,
                           COUNT(DISTINCT ds_pcce_termination_call_detail.SessionID) OutboundCalls_7_14
                      FROM (
                            SELECT DISTINCT SESSIONID
                              FROM {{ ref('EDW','DS_PCCE_TERMINATION_CALL_DETAIL') }}
                           ) ds_pcce_termination_call_detail
                      LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} ds_pcce_termination_call_summary_session
                        ON ds_pcce_termination_call_summary_session.id = ds_pcce_termination_call_detail.sessionid
                      LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} ds_mkt_call_customer
                        ON ds_mkt_call_customer.INTERACTIONIDKEY = ds_pcce_termination_call_detail.sessionid
                      LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} sales
                        ON sales.customerid = ds_mkt_call_customer.CustomerID
                      LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} age
                        ON sales.PRIMARYAGENTULTIPRO_BROKER = age.EmployeeNumber
                     WHERE ds_pcce_termination_call_summary_session.isoutbound = 1
                       AND ds_pcce_termination_call_summary_session.duration > 0
                       AND ds_pcce_termination_call_summary_session.first_agentskilltargetid = age.cisco_skilltargetid
                       AND DATE (ds_pcce_termination_call_summary_session.STARTDATETIME) BETWEEN DATE (DATEADD(DAY, 7, sales.CREATEDDATE)) AND DATE (DATEADD(DAY, 21, sales.CREATEDDATE))
                     GROUP BY sales.TransactionID ,
                              ds_pcce_termination_call_summary_session.duration ,
                              ds_pcce_termination_call_summary_session.isoutbound ,
                              ds_pcce_termination_call_summary_session.STARTDATETIME ,
                              ds_pcce_termination_call_summary_session.ENDDATETIME
                   ) calls
                ON calls.TransactionID = ds_ram_retail_repository.TransactionID
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE
                ON DS_RETAIL_OFFICE.OFFICECODE = ds_ram_retail_repository.officecode
              LEFT JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} PS
                ON PS.TransactionID = ds_ram_retail_repository.TransactionID
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} DS_AGENT_KEY
                ON ds_ram_retail_repository.primaryagentultipro_broker = DS_AGENT_KEY.EmployeeNumber
               AND rank_employeenumber=1
             WHERE ds_ram_retail_repository.label IN ('New Business Auto' ,'New Business Complementary')
               AND date(DATE_TRUNC('month',ds_ram_retail_repository.CREATEDDATE)) = DATEADD(MONTH, -3, date(DATE_TRUNC('month',DATEADD(DAY,-10,CURRENT_DATE()))))
               AND DS_RETAIL_OFFICE.SALESVP ='Josue Gurrola'
               AND DAY(CURRENT_DATE()) BETWEEN 3 AND 10
             GROUP BY ds_ram_retail_repository.OFFICECODE ,
                      DS_AGENT_KEY.EMPLOYEENAME ,
                      DS_RETAIL_OFFICE.SALESVP ,
                      DS_RETAIL_OFFICE.districtmanagername ,
                      ds_ram_retail_repository.primaryagentultipro_broker
