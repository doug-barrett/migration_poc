      - columnReferences: []
        transform: CASE    WHEN OBSERVATIONCHECKLIST LIKE 'TPLE015%' THEN 'TPLE15'    --
          TPLE15 WAS INCORRECTLY SETUP AS TPLE015 AND CHRISTO IS UNABLE TO CHANGE   --  THIS
          ON EXISTING ASSESSMENTS - NEW ASSESSMENTS SHOULD COME THROUGH CORRECTLY    WHEN
          CHARINDEX(' - ', OBSERVATIONCHECKLIST) > 0 THEN LEFT(OBSERVATIONCHECKLIST,
          CHARINDEX(' - ', OBSERVATIONCHECKLIST) - 1)    WHEN CHARINDEX(' | ', OBSERVATIONCHECKLIST)
          > 0 THEN LEFT(OBSERVATIONCHECKLIST, CHARINDEX(' | ', OBSERVATIONCHECKLIST)
          - 1)    ELSE OBSERVATIONCHECKLIST  END
