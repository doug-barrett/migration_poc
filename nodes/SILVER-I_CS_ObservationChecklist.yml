      config: {}
      dataType: VARCHAR(50)
      description: If the status matches with the assessment results, then the record
        is deemed "OK" otherwise it describes what is not matching so it can be sorted.
      name: ValidationIssues
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN OBSERVATIONCHECKLISTSTATUS = 'COMPLETE' AND ROUND(TARGETRATING,0)
          = ROUND(OBSERVATIONCOMPETENCYITEMRATING,0)   THEN 'OK'   WHEN OBSERVATIONCHECKLISTSTATUS
          <> 'COMPLETE' AND ROUND(TARGETRATING,0) = ROUND(OBSERVATIONCOMPETENCYITEMRATING,0)   THEN
          'NOT COMPLETED'   WHEN OBSERVATIONCHECKLISTSTATUS = 'COMPLETE' AND ROUND(TARGETRATING,0)
          <> ROUND(OBSERVATIONCOMPETENCYITEMRATING,0)   THEN 'COMPLETED BUT NOT COMPETENT'   WHEN
          OBSERVATIONCHECKLISTSTATUS <> 'COMPLETE' AND ROUND(TARGETRATING,0) <> ROUND(OBSERVATIONCOMPETENCYITEMRATING,0)   THEN
          'OK'  ELSE 'UNKNOWN'  END
