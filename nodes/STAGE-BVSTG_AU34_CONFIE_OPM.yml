    sourceMapping:
      - aliases:
          DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES: bbefdff5-8807-4f76-8c8f-d524897d6fdd
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT date_trunc('month', date) AS asofmonth,
                   (CASE WHEN lower(channel) IN ('cigh','appone','nsa','dnsa') THEN 'NSA' WHEN lower(channel) IN ('splc') THEN 'SPLC' ELSE 'Missing/Total' END)PolicySource_Dimension,
                   sum(CASE WHEN customer_type= 'NEW/NEW' THEN counter END) NEW_NEW,
                   sum(CASE WHEN customer_type= 'REPLACEMENT' THEN counter END) REPLACEMENT,
                   sum(CASE WHEN customer_type= 'OLD/NEW' THEN counter END) OLD_NEW,
                   sum(CASE WHEN customer_type= 'Missing' THEN counter END) Missing,
                   sum(CASE WHEN customer_type= 'WINBACK' THEN counter END) WINBACK
              FROM (SELECT DISTINCT coalesce(ds_ram_retail_repository_1.leadid, concat(policynumberformatted, '-', carrier), transactionid) LeadID,
                   ds_ram_retail_repository_1.Customer_Type,
                   ds_ram_retail_repository_1.Date,
                   ds_ram_retail_repository_1.Quotes,
                   ifnull(ds_ram_retail_repository_1.Label, 'Transfer') Label,
                   ds_ram_retail_repository_1.PolicyNumberFormatted,
                   ds_ram_retail_repository_1.Carrier,
                   ds_ram_retail_repository_1.TransactionID,
                   ds_ram_retail_repository_1.Counter,
                   ds_ram_retail_repository_1.Channel
              FROM ((SELECT A.leadid,
                   A.Customer_Type,
                   A.Date,
                   A.Quotes,
                   A.Label,
                   A.PolicyNumberFormatted,
                   A.Carrier,
                   A.TransactionID,
                   A.Counter,
                   COALESCE(B.Channel,ifnull(A.sourcedb,'Missing')) Channel
              FROM ((SELECT leadid,
                   ifnull(customertype, 'Missing') AS Customer_Type,
                   to_date(CreatedDate) Date, count(DISTINCT id) Quotes,
                   'Quotes' AS Label,
                   NULL PolicyNumberFormatted,
                   NULL Carrier,
                   NULL TransactionID,
                   NULL Counter,
                   sourcedb,
                   officecode
              FROM "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY" //
              FROM "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"
             WHERE year(CreatedDate) >= 2021
               AND to_date(CreatedDate) <= current_date()-1
               AND (islegacytransaction IS NULL OR islegacytransaction <> 'Migrated')
               AND counter = 1
               AND classification = 'New Quotes' --(Quotes)    group by leadid,officecode, ifnull(customertype, 'Missing'), to_date(CreatedDate), 'Quotes', NULL, NULL, NULL, NULL,NULL,sourcedb) A    left join "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" B  // left join "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" B    on A.officecode = B.officecode)    )      union all    select  LeadID, Customer_Type, Date,  Quotes, Label,    PolicyNumberFormatted,  Carrier, TransactionID, Counter, COALESCE(ds_retail_office.Channel,ifnull(ds_ram_retail_repository.sourcedb,'Missing')) Channel    from    (select LeadID, Customer_Type, CreatedDate Date, 0 Quotes, 'Sales' Label,    PolicyNumberFormatted, CarrierDisplayName Carrier, TransactionID, Counter, OfficeCode,SourceDB    from    (select distinct policynumber, carriername, to_date(CreatedDate) CreatedDate, SourceDB, LeadID, transactionid,    Counter, ifnull(customertype, 'Missing') as Customer_Type, OfficeCode  from "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"  //   from "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"    where year(CreatedDate) >= 2021 and to_date(CreatedDate) <= current_date() -1    and (islegacytransaction is null or islegacytransaction <> 'Migrated')    and counter = 1 and label in ('New Business Auto', 'New Business Complementary')    ) ds_ram_retail_repository_2    left join    (select distinct policynumber_Edw, carriername_Edw, policynumberformatted, carrierdisplayname  from "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES"  // from {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}    ) ds_bvstg_comm_policynumberformatting_allsources    on ds_bvstg_comm_policynumberformatting_allsources.policynumber_edw = ds_ram_retail_repository_2.policynumber    and ifnull(ds_bvstg_comm_policynumberformatting_allsources.carriername_edw, '-') = ifnull(ds_ram_retail_repository_2.carriername, '-')    ) ds_ram_retail_repository  left join "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" ds_retail_office  //   left join "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" DS_RETAIL_OFFICE    on ds_ram_retail_repository.officecode = ds_retail_office.officecode)
        name: BVSTG_AU34_CONFIE_OPM
