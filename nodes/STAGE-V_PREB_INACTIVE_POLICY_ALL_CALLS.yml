    sourceMapping:
      - aliases:
          V_PREB_INACTIVE_POLICY_ALL_CALLS: 4fe0d3c1-5034-4944-88ca-30f842502422
          BVSTG_AU2_INACTIVE_POLICIES: 80bee4c1-2398-4e5c-bbeb-0dd7b4b55477
          DS_MKT_CALL_CUSTOMER_ALL: f73f23ad-67dd-471b-a405-93d80e5cd684
          DS_PCCE_TERMINATION_CALL_AGENT_SESSION: 7f87fcca-2084-4933-bc16-b97046b80bfa
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_INACTIVE_POLICY_ALL_CALLS') }} AS SELECT CNL.id ,
                   MAX(CC.STARTDATETIME) Latest_all_attempt ,
                   MAX(CASE WHEN TCA.TALKTIME > 10 THEN CC.STARTDATETIME ELSE NULL END) Latest_all_Connect ,
                   COUNT(DISTINCT TCA.SessionID) all_Calls_attempt ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME > 10 THEN TCA.SessionID ELSE NULL END) all_Calls_contact ,
                   MAX(CASE WHEN TCA.AGENTOFFICE = CNL.AGENTOFFICECODE THEN CC.STARTDATETIME ELSE NULL END) Latest_Office_Attempt ,
                   MAX(CASE WHEN TCA.TALKTIME > 10 AND TCA.AGENTOFFICE = CNL.AGENTOFFICECODE THEN CC.STARTDATETIME ELSE NULL END) Latest_Office_Connect ,
                   COUNT(DISTINCT CASE WHEN TCA.AGENTOFFICE = CNL.AGENTOFFICECODE THEN TCA.SessionID ELSE NULL END) Office_Calls_attempt ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME > 10 AND TCA.AGENTOFFICE = CNL.AGENTOFFICECODE THEN TCA.SessionID ELSE NULL END) Office_Calls_contact ,
                   MAX(CASE WHEN TCA.AGENTOFFICE = 'CUSTOMER SERVICE' THEN CC.STARTDATETIME ELSE NULL END) Latest_CS_Attempt ,
                   MAX(CASE WHEN TCA.TALKTIME > 10 AND TCA.AGENTOFFICE = 'CUSTOMER SERVICE' THEN CC.STARTDATETIME ELSE NULL END) Latest_CS_Connect ,
                   COUNT(DISTINCT CASE WHEN TCA.AGENTOFFICE = 'CUSTOMER SERVICE' THEN TCA.SessionID ELSE NULL END) CS_Calls_attempt ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME > 10 AND TCA.AGENTOFFICE = 'CUSTOMER SERVICE' THEN TCA.SessionID ELSE NULL END) CS_Calls_contact ,
                   MAX(CASE WHEN TCA.AGENT = CNL.CISCO_LOGINNAME THEN CC.STARTDATETIME ELSE NULL END) Latest_Producer_attempt ,
                   MAX(CASE WHEN TCA.TALKTIME > 10 AND TCA.AGENT = CNL.CISCO_LOGINNAME THEN CC.STARTDATETIME ELSE NULL END) Latest_Producer_contact ,
                   COUNT(DISTINCT CASE WHEN TCA.AGENT = CNL.CISCO_LOGINNAME THEN TCA.SessionID ELSE NULL END) Producer_Calls_attempt ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME > 10 AND TCA.AGENT = CNL.CISCO_LOGINNAME THEN TCA.SessionID ELSE NULL END) Producer_Calls_contact ,
                   MAX(CASE WHEN TCA.ISINBOUND = 1 THEN CC.STARTDATETIME ELSE NULL END) Latest_Inbound_attempt ,
                   MAX(CASE WHEN TCA.TALKTIME > 10 AND TCA.ISINBOUND = 1 THEN CC.STARTDATETIME ELSE NULL END) Latest_Inbound_contact ,
                   COUNT(DISTINCT CASE WHEN TCA.ISINBOUND = 1 THEN TCA.SessionID ELSE NULL END) Inbound_Calls_attempt ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME > 10 AND TCA.ISINBOUND = 1 THEN TCA.SessionID ELSE NULL END) Inbound_Calls_contact ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME >= 0 AND TCA.ISINBOUND = 1 THEN TCA.SessionID ELSE NULL END) Inbound_0 ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME >= 10 AND TCA.ISINBOUND = 1 THEN TCA.SessionID ELSE NULL END) Inbound_10 ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME >= 30 AND TCA.ISINBOUND = 1 THEN TCA.SessionID ELSE NULL END) Inbound_30 ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME >= 90 AND TCA.ISINBOUND = 1 THEN TCA.SessionID ELSE NULL END) Inbound_90 ,
                   MAX(CASE WHEN TCA.ISOUTBOUND = 1 THEN CC.STARTDATETIME ELSE NULL END) Latest_Outbound_attempt ,
                   MAX(CASE WHEN TCA.TALKTIME > 10 AND TCA.ISOUTBOUND = 1 THEN CC.STARTDATETIME ELSE NULL END) Latest_Outbound_contact ,
                   COUNT(DISTINCT CASE WHEN TCA.ISOUTBOUND = 1 THEN TCA.SessionID ELSE NULL END) Outbound_Calls_attempt ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME > 10 AND TCA.ISOUTBOUND = 1 THEN TCA.SessionID ELSE NULL END) Outbound_Calls_contact ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME >= 0 AND TCA.ISOUTBOUND = 1 THEN TCA.SessionID ELSE NULL END) Outbound_0 ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME >= 10 AND TCA.ISOUTBOUND = 1 THEN TCA.SessionID ELSE NULL END) Outbound_10 ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME >= 30 AND TCA.ISOUTBOUND = 1 THEN TCA.SessionID ELSE NULL END) Outbound_30 ,
                   COUNT(DISTINCT CASE WHEN TCA.TALKTIME >= 90 AND TCA.ISOUTBOUND = 1 THEN TCA.SessionID ELSE NULL END) Outbound_90
              FROM {{ ref('STAGE','BVSTG_AU2_INACTIVE_POLICIES') }} CNL
             INNER JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER_ALL') }} CC
                ON CNL.CustomerID = CC.CustomerID
               AND CC.SOURCEDB_CUSTOMER = CNL.SOURCEDB
               AND CC.ENDDATETIME > CNL.Status_Date
               AND DATE(CC.ENDDATETIME) <= DATE(IFNULL(CNL.Activity_Save_Date,CURRENT_DATE()))
             INNER JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} TCA
                ON TCA.SESSIONID=CC.INTERACTIONIDKEY
             GROUP BY CNL.id
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_ACUMATICA_NULLS
          - locationName: STAGE
            nodeName: BVSTG_AU2_INACTIVE_POLICIES
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER_ALL
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_AGENT_SESSION
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','BVSTG_ACUMATICA_NULLS') }}
            {{ ref('STAGE','BVSTG_AU2_INACTIVE_POLICIES') }}
            {{ ref('EDW','DS_MKT_CALL_CUSTOMER_ALL') }}
            {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }}
        name: V_PREB_INACTIVE_POLICY_ALL_CALLS
        noLinkRefs: []
