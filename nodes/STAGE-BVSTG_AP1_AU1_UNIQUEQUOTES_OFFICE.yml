        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AP1_AU0_QUOTES
          - locationName: DATA_VAULT
            nodeName: L_LEADBRIDGEDQUOTE_EMPLOYEE
          - locationName: STAGE
            nodeName: V_S_AP1_EMPLOYEE_MROC_CURRENT
          - locationName: STAGE
            nodeName: BVSTG_AP1_AU0_LOGINSTATUS_MROC_DEDUP
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AP1_AU0_QUOTES') }} bvstg_ap1_au0_quotes
              JOIN {{ ref('DATA_VAULT','L_LEADBRIDGEDQUOTE_EMPLOYEE') }} l_leadbridgedquote_employee
                ON bvstg_ap1_au0_quotes.hk_h_leadbridgedquote = l_leadbridgedquote_employee.HK_h_leadbridgedquote
              JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} v_s_ap1_employee_mroc_current
                ON l_leadbridgedquote_employee.HK_h_employee = v_s_ap1_employee_mroc_current.hk_h_employee
               AND v_s_ap1_employee_mroc_current.isrowdeleted=0
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU0_LOGINSTATUS_MROC_DEDUP') }} bvstg_ap1_au0_loginstatus_mroc_dedup
                ON v_s_ap1_employee_mroc_current.userid = bvstg_ap1_au0_loginstatus_mroc_dedup.userid
               AND bvstg_ap1_au0_loginstatus_mroc_dedup.created >= dateadd(DAY, -120,bvstg_ap1_au0_quotes.created)
               AND bvstg_ap1_au0_loginstatus_mroc_dedup.created <= bvstg_ap1_au0_quotes.created QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_ap1_au0_quotes.HK_H_LEADBRIDGEDQUOTE ORDER BY bvstg_ap1_au0_loginstatus_mroc_dedup.created DESC, HK_L_LOGINSTATUS_EMPLOYEE,bvstg_ap1_au0_loginstatus_mroc_dedup.OfficeCode)=1
        name: BVSTG_AP1_AU1_UNIQUEQUOTES_OFFICE
        noLinkRefs: []
