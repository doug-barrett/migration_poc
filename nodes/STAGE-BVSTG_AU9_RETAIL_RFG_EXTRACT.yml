                   1 isWeCare,
                   'Brand' SubjectArea,
                   'We_Care_Metrics' Metric,
                   NULL MetricValue
              FROM {{ ref('EDW','DS_WECARE_OFFICE') }} -- from RETAIL_PROD.SCH_EDW.DS_WECARE_OFFICE    where isWeCare = 1    group by to_date(Concat(YEARNUMBER,'-',MONTHNUMBER,'-01')) , OfficeCode    )       union all    (select null,EMPLOYEENUMBER,    to_date(Concat(YEARNUMBER,'-',MONTHNUMBER,'-01')),OfficeCode,null,null,null,sum(NPS_PROMOTER),sum(NPS_DETRACTOR),    sum(NPS),sum(DOIComplaintQty),sum(POLICYMAJORERRORNOPAY),sum(POLICYSOLD),null,null,null,sum(CS_COMPLAINTSSATISFACTION),1 isWeCare,    'Brand','We_Care_Metrics_NTS',null    from {{ ref('EDW','DS_WECARE_TELESALES') }}    -- from RETAIL_PROD.SCH_EDW.DS_WECARE_TELESALES    where isWeCare = 1    group by EMPLOYEENUMBER,to_date(Concat(YEARNUMBER,'-',MONTHNUMBER,'-01')),OfficeCode    )    union all    (select null,ProducerNumber,Created,OfficeCode,null,null,null,null,null,null,null,null,null,'AppOne',null,null,null,null,'Brand','Without_Error_Numerator',    sum(case when errortype = 'Major Error' then sales end)-sum(with_error)    from {{ ref('EDW','DS_BVSTG_AU4_RETAIL_RFG_EXTRACT') }}    -- from RETAIL_PROD.SCH_EDW.DS_BVSTG_AU4_RETAIL_RFG_EXTRACT    where isrowdeleted=0 and to_date(Created) >= date_trunc('year', add_months(current_date()-1, -24))    group by ProducerNumber,Created,OfficeCode)    union all    (select null,ProducerNumber,Created,OfficeCode,null,null,null,null,null,    null,null,null,null,'AppOne',null,null,null,null,    'Brand','Without_Error_Denominator',    sum(case when errortype = 'Major Error' then sales end)    from {{ ref('EDW','DS_BVSTG_AU4_RETAIL_RFG_EXTRACT') }}    -- from RETAIL_PROD.SCH_EDW.DS_BVSTG_AU4_RETAIL_RFG_EXTRACT    where isrowdeleted=0 and to_date(Created) >= date_trunc('year', add_months(current_date()-1, -24))    group by ProducerNumber,Created,OfficeCode)    union all          (select null, EmployeeNumber, WrkdWorkDate, OfficeCode, null, null , null, null, null,    null, null, null, null, null, null , null , null , null,    'Financial Flexibility',  'LaborHours_Numerator', sum(WRKDHOURS)    from {{ ref('EDW','DS_HR_LABORHOURSCORECARD') }}    -- from RETAIL_PROD.SCH_EDW.DS_HR_LABORHOURSCORECARD    where year(WrkdWorkDate) >= year(current_date()-1)-2    group by EmployeeNumber, WrkdWorkDate, OfficeCode)      union all      (select null,EmployeeNumber, WrkdWorkDate, OfficeCode, null, null , null, null, null,    null, null, null, null, null, null , null , null , null,    'Financial Flexibility',  'LaborHours_Denominator', sum(NewPolicies)    from {{ ref('EDW','DS_HR_LABORHOURSCORECARD') }}    -- from RETAIL_PROD.SCH_EDW.DS_HR_LABORHOURSCORECARD    where year(WrkdWorkDate) >= year(current_date()-1)-2    group by EmployeeNumber, WrkdWorkDate, OfficeCode)    union all    (select NULL, ProducerNumber, TO_DATE(EffectiveDate), OfficeCode,   NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL,  'Winning Culture', 'Terminated', COUNT(DISTINCT UniqueID)  from  (select distinct * ,  datediff('month',effectivedate,lag(effectivedate) over (partition by uniqueid,officecode order by effectivedate)) month_diff  -- FROM RETAIL_PROD.SCH_BVSTAGE.BVSTG_AU6_RETAIL_RFG_EXTRACT  FROM {{ ref('STAGE','BVSTG_AU6_RETAIL_RFG_EXTRACT') }}  where status_eom='Terminated' and effectivedate>=terminationdate   )  where month_diff<-1 or month_diff is null  GROUP BY ProducerNumber, TO_DATE(EffectiveDate), OfficeCode)
