        join:
          joinCondition: |-
            EXTENDED
              FROM ((SELECT NULL Customerstate,
                   NULL ProducerNumber,
                   to_date(Concat(YEARNUMBER,'-',MONTHNUMBER,'-01')) Date, OfficeCode,
                   sum(PositiveORQty) PositiveORQty,
                   sum(PositiveORExpected) PositiveORExpected,
                   sum(STARRATINGOVERALL) STARRATINGOVERALL,
                   sum(Promoter) Promoter,
                   sum(Detractor) Detractor,
                   sum(Total_NPS) Total_NPS,
                   sum(DOIComplaintQty) DOIComplaintQty,
                   sum(POLICYMAJORERRORNOPAY) POLICYMAJORERRORNOPAY,
