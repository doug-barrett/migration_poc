    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_EDW.DS_RETAIL_RFG_EXTRACT DS_RETAIL_RFG_EXTRACT
              LEFT JOIN (
                    SELECT DISTINCT date AS date_ob,
                           officecode AS officecode_ob,
                           employeenumber AS employeenumber_ob,
                           Total_Producers_With_Calls AS Total_Producers_With_Calls_ob,
                           (sum(CASE WHEN metric='Outbound_Connected_calls' THEN metricvalue END) OVER (PARTITION BY date,total_producers_with_calls)/ count(DISTINCT CASE WHEN metric='Outbound_Connected_calls' THEN total_producers_with_calls END) OVER (PARTITION BY date,total_producers_with_calls)) /(CASE WHEN min(CASE WHEN metric='Outbound_Connected_calls' THEN SALESDAYWEIGHT_CREATED END) OVER (PARTITION BY date)=0 THEN NULL ELSE min(CASE WHEN metric='Outbound_Connected_calls' THEN SALESDAYWEIGHT_CREATED END) OVER (PARTITION BY date) END) AS metricvalue
                      FROM RETAIL_PROD.SCH_EDW.DS_RETAIL_RFG_EXTRACT
                     WHERE metric='Outbound_Connected_calls'
                   ) OUTBOUND_CALLS
                ON DS_RETAIL_RFG_EXTRACT.date=OUTBOUND_CALLS.date_ob
               AND ifnull(DS_RETAIL_RFG_EXTRACT.officecode,'-')=ifnull(OUTBOUND_CALLS.officecode_ob,'-')
               AND ifnull(DS_RETAIL_RFG_EXTRACT.employeenumber,'-')=ifnull(OUTBOUND_CALLS.employeenumber_ob,'-')
               AND ifnull(DS_RETAIL_RFG_EXTRACT.Total_Producers_With_Calls,'-')=ifnull(OUTBOUND_CALLS.Total_Producers_With_Calls_ob,'-')
               AND DS_RETAIL_RFG_EXTRACT.metric='Outbound_Connected_calls'
              LEFT JOIN (
                    SELECT DISTINCT EmployeeNumber,
                           officecode
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY"
                     WHERE Rank_EmployeeNumber=1 QUALIFY row_number() OVER (PARTITION BY employeenumber ORDER BY dss_create_time) = 1
                   ) DS_AGENT_KEY
                ON DS_RETAIL_RFG_EXTRACT.EMPLOYEENUMBER = DS_AGENT_KEY.EMPLOYEENUMBER
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE DS_RETAIL_OFFICE
                ON DS_RETAIL_OFFICE.OFFICECODE = DS_RETAIL_RFG_EXTRACT.OFFICECODE
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE DS_RETAIL_OFFICE_AG
                ON DS_RETAIL_OFFICE_AG.OFFICECODE = DS_AGENT_KEY.OFFICECODE
             WHERE DS_RETAIL_RFG_EXTRACT.DATE BETWEEN '2020-01-01' AND GETDATE()
               AND DS_RETAIL_RFG_EXTRACT.METRIC IN ('Phenomenal_Score_Numerator',
                   'Phenomenal_Score_Denominator',
                   'Inbound_Answered',
                   'Inbound_Offered',
                   'Outbound_Connected_calls',
                   'Agent_Not_Ready_Time',
                   'Agent_Logged_On_Time',
                   'We_Care_Metrics',
                   'We_Care_Metrics_NTS',
                   'Without_Error_Numerator',
                   'Without_Error_Denominator',
                   'LaborHours_Numerator',
                   'LaborHours_Denominator',
                   'WrittenPremium',
                   'WrittenPremium_SPLC',
                   'Total_Ancillary',
                   'Total_Fee',
                   'Active_BOM',
                   'Active_EOM',
                   'Terminated',
                   'New_Policy_Sales',
                   'New_Policy_Sales_SPLC',
                   'Homeowners_New_Policies',
                   'Quotes',
                   'Same_Day_Transfer_Sale_Numerator',
                   'Same_Day_Transfer_Sale_Denominator',
                   'New_Policy_Sales_NewCustomer',
                   'New_Customers_Sold',
                   'New_Deals_Quoted',
                   'New_Business_Deals',
                   'New_Deals_Sold',
                   'TotalWrittenPremium',
                   'Cross_Sell_WrittenPremium',
                   'Completed_Tasks',
                   'Total_Tasks',
                   'PIF_EOM',
                   '90DayCustomer_Numerator',
                   '90DayCustomer_Denominator',
                   'Retention_Numerator',
                   'Retention_Denominator',
                   'Retention_Numerator_13',
