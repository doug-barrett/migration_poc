        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT bvstg_comm_au1_employee_retention.*,
                   CASE WHEN (m3_tier='Not Qualified' AND m3_retention_cy IS NULL AND m3_retention_py IS NULL) OR m3_tier='PY Not Null; CY Null' THEN NULL
                        WHEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.score IS NOT NULL                                                            THEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.score
                        ELSE 0
                         END AS m3_score_old,
                   CASE WHEN (m7_tier='Not Qualified' AND m7_retention_cy IS NULL AND m7_retention_py IS NULL) OR m7_tier='PY Not Null; CY Null' THEN NULL
                        WHEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.score IS NOT NULL                                                            THEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.score
                        ELSE 0
                         END AS m7_score_old,
                   CASE WHEN (m13_tier='Not Qualified' AND m13_retention_cy IS NULL AND m13_retention_py IS NULL) OR m13_tier='PY Not Null; CY Null' THEN NULL
                        WHEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13.score IS NOT NULL                                                               THEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13.score
                        ELSE 0
                         END AS m13_score_old,
                   CASE WHEN m3_score_old IS NULL AND m7_score_old IS NULL AND m13_score_old IS NULL                                                                                                                               THEN NULL
                        WHEN officestate ='NTS'                                                                                                                                                                                    THEN CASE WHEN (m3_retention_py IS NULL) AND (m3_retention_cy IS NOT NULL) AND m3_tier='M3_Tier 1' THEN (m3_score_old+1) ELSE ifnull(m3_score_old,0) END
                        WHEN (m3_retention_py IS NULL AND m7_retention_py IS NULL AND m13_retention_py IS NULL) AND (m3_retention_cy IS NOT NULL AND m7_retention_cy IS NULL AND m13_retention_cy IS NULL) AND m3_tier='M3_Tier 1' THEN (m3_score_old + 1)
                        ELSE ifnull(m3_score_old,0) + ifnull(m7_score_old,0) + ifnull(m13_score_old,0)
                         END AS retention_score_old,
                   m3_tier_score + m3_yoy_score AS m3_Score_new,
                   m7_tier_score + m7_yoy_score AS m7_Score_new,
                   m13_tier_score + m13_yoy_score AS m13_Score_new,
                   CASE WHEN m3_score_new IS NULL AND m7_score_new IS NULL AND m13_score_new IS NULL THEN NULL
                        ELSE ifnull(m3_score_new,0) + ifnull(m7_score_new,0) + ifnull(m13_score_new,0)
                         END AS retention_score_new,
                   CASE WHEN date <'2025-12-01' THEN m3_score_old
                        ELSE m3_score_new
                         END AS m3_score,
                   CASE WHEN date <'2025-12-01' THEN m7_score_old
                        ELSE m7_score_new
                         END AS m7_score,
                   CASE WHEN date <'2025-12-01' THEN m13_score_old
                        ELSE m13_score_new
                         END AS m13_score,
                   CASE WHEN date <'2025-12-01' THEN retention_score_old
                        ELSE retention_score_new
                         END AS retention_score
              FROM {{ ref('STAGE','BVSTG_COMM_AU1_EMPLOYEE_RETENTION') }} --from bvstg_comm_au1_employee_retention_combined as bvstg_comm_au1_employee_retention  left join   (  select distinct *   from {{ ref('STAGE','V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT') }}  --from "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT"  where isrowdeleted=0  qualify row_number() over (partition by retention_type,tier,start_month order by record_insertion_timestamp desc,lastupdateddate desc)=1  ) AS V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3  on concat(trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.retention_type),'_',trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.tier)) = bvstg_comm_au1_employee_retention.m3_tier  and bvstg_comm_au1_employee_retention.date between V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.start_month and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.end_month  and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.retention_type like ('%M3%')  left join (  select distinct *   from {{ ref('STAGE','V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT') }}  --from "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT"  where isrowdeleted=0  qualify row_number() over (partition by retention_type,tier,start_month order by record_insertion_timestamp desc,lastupdateddate desc)=1  ) AS V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7  on concat(trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.retention_type),'_',trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.tier))=bvstg_comm_au1_employee_retention.m7_tier  and bvstg_comm_au1_employee_retention.date between V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.start_month and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.end_
