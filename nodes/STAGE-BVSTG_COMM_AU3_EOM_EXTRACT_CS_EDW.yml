    sourceMapping:
      - aliases:
          BVSTG_COMM_AU2_EOM_EXTRACT_CS_EDW: 81bca90b-afd5-4088-82c2-56670ace77c6
          DS_POLICYSUMMARY_V2: 23ba684a-5671-4cfa-9e5f-11f1386d24b3
          DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES: 62e4c62e-c5fa-4abb-8a26-a5acaccb175b
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU2_EOM_EXTRACT_CS_EDW
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT bvstg_comm_au2_eom_extract_cs_edw.*,
                   CASE WHEN ds_policysummary_v2.SourceDB = 'SPLC' THEN 1
                        ELSE 0
                         END AS IsSPLCPolicy,
                   CASE WHEN ds_policysummary_v2.SourceDB <> 'SPLC' AND ds_policysummary_v2.SourceDB IS NOT NULL THEN 1
                        ELSE 0
                         END AS IsInPolSummaryPolicy,
                   CASE WHEN ds_policysummary_v2.SourceDB IS NULL AND IsFoundinPolicyCoPolicy IS NULL THEN 0
                        ELSE 1
                         END AS IsPolicyInEDW,
                   CASE WHEN ds_bvstg_comm_termcleaning.Term IS NULL AND bvstg_comm_au2_eom_extract_cs_edw.Carrier IN ('Legacy', 'Gainsco', 'Links', 'Assurance America', 'Pearl Holding', 'Hallmark', 'Producers National', 'Traders', 'Connect', 'Venture', 'Empower', 'Key Insurance', 'Progressive', 'Dairyland')     THEN 6
                        WHEN ds_bvstg_comm_termcleaning.Term IS NULL AND bvstg_comm_au2_eom_extract_cs_edw.Carrier NOT IN ('Legacy', 'Gainsco', 'Links', 'Assurance America', 'Pearl Holding', 'Hallmark', 'Producers National', 'Traders', 'Connect', 'Venture', 'Empower', 'Key Insurance', 'Progressive', 'Dairyland') THEN 12
                        ELSE ds_bvstg_comm_termcleaning.Term
                         END AS Term,
                   ds_policysummary_v2.IsLegacyTransaction,
                   ds_policysummary_v2.CurrentPremium,
                   ds_policysummary_v2.WrittenPremium,
                   ds_policysummary_v2.Customer_Type,
                   ds_policysummary_v2.StartDate StartDate_EDW,
                   ds_policysummary_v2.EndDate EndDate_EDW,
                   ds_policysummary_v2.EffectiveDate,
                   ds_policysummary_v2.ExpirationDate,
                   CASE WHEN ds_policysummary_v2_carrier.policywithmultiplecarrier_edw IS NULL THEN 0
                        ELSE policywithmultiplecarrier_edw
                         END AS policywithmultiplecarrier_edw,
                   ds_customersummary_v2.Email CustomerEmail_EDW,
                   ds_customersummary_v2.MainState CustomerState_EDW
              FROM {{ ref('STAGE','BVSTG_COMM_AU2_EOM_EXTRACT_CS_EDW') }} bvstg_comm_au2_eom_extract_cs_edw
              LEFT JOIN (SELECT *
              FROM (SELECT *,
                   Row_number() OVER(PARTITION BY PolicyNumberformatted, CarrierName ORDER BY Created DESC) LatestRecord
              FROM (SELECT DISTINCT policynumberformatted,
                   carriername,
                   customerno,
                   islegacytransaction,
                   sourcedb,
                   currentpremium,
                   writtenpremium,
                   customer_type,
                   startdate,
                   enddate,
                   effectivedate,
                   expirationdate,
                   last_expirationdate,
                   Created,
                   SourceTable
              FROM (SELECT DISTINCT policynumberformatted,
                   carriername_mapped carriername,
                   customerno,
                   islegacytransaction,
                   sourcedb,
                   currentpremium,
                   writtenpremium,
                   customer_type,
                   startdate,
                   enddate,
                   effectivedate,
                   expirationdate,
                   last_expirationdate,
                   Created,
                   'PolicySummary' SourceTable
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
              LEFT JOIN (
                    SELECT DISTINCT PolicyNumber_EDW,
                           CarrierName_EDW,
                           PolicyNumberFormatted,
                           CarrierName_Mapped
