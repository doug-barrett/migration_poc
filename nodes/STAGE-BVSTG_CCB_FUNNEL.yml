        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_DETAIL
          - locationName: STAGE
            nodeName: V_DLBV_CVP_CALLBACKQUEUE_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_CVP_CALLBACK_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_CVP_CALLBACKEVENT_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_CVP_QUEUEREF_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_CVP_EVENTTYPEREF_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_CVP_CAUSEREF_CURRENT
        join:
          joinCondition: |-
            FROM (
                    SELECT ID ,
                           DATE (TCDS.STARTDATETIME) AS call_Date ,
                           TCDS.FIRST_AGENTNAME ,
                           TCDS.FIRST_AGENTOFFICE ,
                           CASE WHEN CCB.SESSIONID IS NOT NULL THEN (CASE WHEN CCB.CBC_EVENTTYPE IS NOT NULL THEN 'CCB Accepted' WHEN CCB.CBC_EVENTTYPE IS NULL AND CCBR.VARIABLE9 IS NOT NULL THEN 'CCB Rejected' ELSE 'Not CCB' END)
                                ELSE 'N/A'
                                 END AS Opportunity_Note ,
                           CASE WHEN TCDS.FIRST_AGENTNAME IS NOT NULL THEN 1
                                ELSE 0
                                 END AS Assign_Skillgroup ,
                           CASE WHEN CCB.SESSIONID IS NOT NULL THEN (CASE WHEN Assign_Skillgroup = 1 AND CCB.CBC_CAUSE IN ('Connected' ,'No Event') THEN 'Agent Handled' WHEN Assign_Skillgroup = 0 AND CCB.CBC_CAUSE IN ('Connected' ,'No Event') THEN 'No Agent Handled' ELSE 'Not Connected to Customer' END)
                                ELSE 'N/A'
                                 END AS Resolution ,
                           1 AS inbound_counter ,
                           CASE WHEN CCB.SESSIONID IS NOT NULL THEN 1
                                ELSE 0
                                 END AS IsCCB_flag ,
                           CASE WHEN CCB.SESSIONID IS NULL THEN 1
                                ELSE 0
                                 END AS IsNotCCB_flag ,
                           CCB.*
                      FROM {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} TCDS
                      LEFT JOIN (
                            SELECT DISTINCT TCD.SESSIONID ,
                                   CBQ.QUEUEID ,
                                   CBQ.SURROGATEID ,
                                   CBC.EVENTTYPEID ,
                                   CBC.CAUSEID ,
                                   TCD.VARIABLE9 AS VAR9_FROM_TCD ,
                                   EREF.EVENTTYPE CBC_EVENTTYPE ,
                                   CASE WHEN CREF.CAUSE IS NULL THEN 'No Event'
                                        ELSE CREF.CAUSE
                                         END AS CBC_CAUSE
                              FROM {{ ref('EDW','DS_PCCE_TERMINATION_CALL_DETAIL') }} TCD
                              JOIN {{ ref('STAGE','V_DLBV_CVP_CALLBACKQUEUE_CURRENT') }} CBQ
                                ON CBQ.CALLGUID = TCD.CALLGUID
                               AND CBQ.TO_BE_DELETED = 'N'
                              LEFT JOIN {{ ref('STAGE','V_DLBV_CVP_CALLBACK_CURRENT') }} CBC
                                ON CBQ.SURROGATEID = CBC.SURROGATEID
                              LEFT JOIN {{ ref('STAGE','V_DLBV_CVP_CALLBACKEVENT_CURRENT') }} CBE
                                ON CBC.SURROGATEID = CBE.SURROGATEID
                               AND CBE.TO_BE_DELETED = 'N'
                              LEFT JOIN {{ ref('STAGE','V_DLBV_CVP_QUEUEREF_CURRENT') }} QREF
                                ON CBQ.QUEUEID = QREF.QUEUEID
                               AND QREF.TO_BE_DELETED = 'N'
                              LEFT JOIN {{ ref('STAGE','V_DLBV_CVP_EVENTTYPEREF_CURRENT') }} EREF
                                ON CBC.EVENTTYPEID = EREF.EVENTTYPEID
                               AND EREF.TO_BE_DELETED = 'N'
                              LEFT JOIN {{ ref('STAGE','V_DLBV_CVP_CAUSEREF_CURRENT') }} CREF
                                ON CBC.CAUSEID = CREF.CAUSEID
                               AND CREF.TO_BE_DELETED = 'N' QUALIFY ROW_NUMBER() OVER (PARTITION BY TCD.SESSIONID ORDER BY TCD.ENDDATETIME DESC) = 1
                           ) CCB
                        ON TCDS.ID = CCB.SESSIONID
                      LEFT JOIN (
                            SELECT DISTINCT TCD.SESSIONID ,
                                   VARIABLE9
                              FROM {{ ref('EDW','DS_PCCE_TERMINATION_CALL_DETAIL') }} TCD
                             WHERE VARIABLE9 LIKE '%CCB%' QUALIFY ROW_NUMBER() OVER (PARTITION BY TCD.SESSIONID ORDER BY TCD.ENDDATETIME DESC) = 1
                           ) CCBR
                        ON TCDS.ID = CCBR.SESSIONID
                   ) DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
             WHERE DATE(DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.call_Date) BETWEEN DATE('2022-08-01') AND DATE(Dateadd(DAY, -1, Getdate()))
             GROUP BY DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.call_Date,
                      DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.FIRST_AGENTOFFICE,
                      DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.Opportunity_Note,
                      DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.Resolution,
                      DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.CBC_EVENTTYPE,
                      DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.CBC_CAUSE
        name: BVSTG_CCB_FUNNEL
        noLinkRefs: []
