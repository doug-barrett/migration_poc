        joinCondition: "FROM {{ ref('GOLD', 'SRC_EQPRFBFL') }} \"SRC_EQPRFBFL\"\n\nLEFT OUTER JOIN {{ ref('GOLD', 'ID_EQUIPMENT') }} \"ID_EQUIPMENT\"\nON \"SRC_EQPRFBFL\".\"QRCMP\" = \"ID_EQUIPMENT\".\"COMPANY_CODE\"\nAND \"SRC_EQPRFBFL\".\"QREQP0\" = \"ID_EQUIPMENT\".\"EQUIPMENT_CODE\"\n\nINNER JOIN IDENTIFIER('\"WS_MIGRATION\".\"GOLD\".ETL_BATCH') on 1=1\n \nWhere/*  \"BATCH_PERIOD\" \"OVERLAPS\" (\"AUD_TIME\",NULL)\nAND*/ (\"AUD_CODE\" <> 'F' or (\"AUD_CODE\" is null and \"AUD_TYPE\" = 'RR'))\n \"QUALIFY\" \"RANK\"() \n\"OVER\" (\"PARTITION\" BY \"QRCMP\", \"QREQP0\"\n,Case When \"REBUILD_TABLE\" = 'Y' Then \"CAST\"(\"AUD_TIME\" as date) Else NULL End \nORDER BY \"AUD_TIME\" \"DESC\", \"AUD_SEQNO\" \"DESC\", CASE  \nWHEN \"AUD_TYPE\" in ('PT','PX','FI')\tTHEN 1 \nWHEN \"AUD_TYPE\" in ('UB','FB','FP','BR')\tTHEN 2 \nWHEN \"AUD_TYPE\" in ('UP','UR')\tTHEN 3 \nWHEN \"AUD_TYPE\" in ('DL','FD')\tTHEN 4 \nWHEN \"AUD_TYPE\" in ('RR')\t\tTHEN 5\n ELSE 0 END \"DESC\") = 1"
