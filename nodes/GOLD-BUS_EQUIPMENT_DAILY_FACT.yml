      config: {}
      dataType: VARCHAR(27)
      description: ''
      name: EQUIP_STATUS_CAT_DESC
      nullable: false
      sourceColumnReferences:
      - columnReferences: []
        transform: "CASE \n\n WHEN (Equipment_Status_Code IN ('O','P') \n\n AND  Suspend_Contract_Id\
          \ IS NULL) THEN 'On Rent' \n\n\t\n\n WHEN Equipment_Active_Status_Code <>\
          \ 'D' \n\n AND  Category_Code > 99 \n\n AND  Equipment_Type_Code IN ('R','S')\
          \ \n\n AND  Equipment_Status_Code IN ('A','L','I','K') THEN 'Available for\
          \ Rent' \n\n\n\n WHEN Equipment_Active_Status_Code <> 'D' \n\n AND  Category_Code\
          \ > 99 \n\n AND  Equipment_Type_Code IN ('R','S') \n\n AND  Equipment_Status_Code\
          \ IN ('U','X') THEN 'Not Picked Up' \n\n\t\n\n WHEN Equipment_Active_Status_Code\
          \ <> 'D' \n\n AND  Category_Code > 99 \n\n AND  Equipment_Type_Code IN ('R','S')\
          \ \n\n AND  Equipment_Status_Code IN ('Z','Q','D','N','H') THEN 'Not Repaired'\
          \ \n\n\t\n\n WHEN Equipment_Active_Status_Code <> 'D' \n\n AND  Category_Code\
          \ > 99 \n\n AND  Equipment_Type_Code IN ('R','S') \n\n AND  Equipment_Status_Code\
          \ = 'R' THEN 'Not Inspected'\n\n\t\n\n WHEN Equipment_Active_Status_Code\
          \ <> 'D' \n\n AND  Category_Code > 99 \n\n AND  Equipment_Type_Code IN ('R','S')\
          \ \n\n AND  (Equipment_Status_Code = 'F' \n\n   OR (Equipment_Status_Code\
          \ IN ('O','P') \n\n     AND Suspend_Contract_Id IS NOT NULL)) THEN 'Not\
          \ On Site' \n\n\t\n\n WHEN Equipment_Active_Status_Code <> 'D' \n\n AND\
          \  Category_Code > 99 \n\n AND  Equipment_Type_Code IN ('R','S') \n\n AND\
          \  Equipment_Status_Code NOT IN ('M','T','S','J','V') THEN 'Serialized -\
          \ Unknown Status'\n\n\t\n\n ELSE 'Unknown' \n\nEND"
