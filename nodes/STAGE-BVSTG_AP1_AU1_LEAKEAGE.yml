    sourceMapping:
      - aliases:
          DS_AP1_TRANSACTIONSUMMARY: eb40b9b4-16a8-47be-8699-9c6c04540ac6
          DS_BVSTG_AP1_PAYMENT: 98dd5fca-4fd6-4ecd-85c3-eea74c0094f3
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_PAYMENT
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
              LEFT JOIN (
                    SELECT a.TransactionID ,
                           SUM(CASE WHEN DATE(b.created_payment) > DATE(b.CREATED_TRANSACTION) AND DATE(b.created_payment) < DATE(IFNULL(a.senttocollectiondate,CURRENT_DATE())) THEN b.paymentamount ELSE 0 END) AS collectedpriorassign ,
                           SUM(CASE WHEN DATE(b.created_payment) >= DATE(IFNULL(a.senttocollectiondate,CURRENT_DATE())) THEN b.paymentamount ELSE 0 END) AS CollectedAfterAssign
                      FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} a
                     INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_PAYMENT') }} b
                        ON (a.TransactionID = b.TransactionID)
                     WHERE isvoid_payment = 0
                       AND isrowdeleted_payment= 0
                       AND isrowdeleted_transaction= 0
                       AND Isreceived = 1
                       AND Isnsf = 0
                     GROUP BY a.TransactionID
                   ) ds_bvstg_ap1_payment
                ON ds_ap1_transactionsummary.TransactionID = ds_bvstg_ap1_payment.TransactionID
             WHERE ds_ap1_transactionsummary.Transactiontype = 'New Business'
               AND ds_ap1_transactionsummary.IsVoid = 0
               AND ds_ap1_transactionsummary.created >= '2020-01-01'
               AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0 AND ds_ap1_transactionsummary.created >= '2020-01-01') OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,DATE(ds_ap1_transactionsummary.DSS_UPDATE_TIME),CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mapping_Refresh_Days }}'))
        name: BVSTG_AP1_AU1_LEAKEAGE
