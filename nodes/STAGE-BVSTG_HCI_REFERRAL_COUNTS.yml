          - locationName: STAGE
            nodeName: V_DLBV_CFA_HCI_AGENTS_CURRENT
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }} DS_BVSTG_AP1_LEADHISTORY
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} S_AP1_LEAD_MROC
                ON DS_BVSTG_AP1_LEADHISTORY.LeadID = TO_VARCHAR(S_AP1_LEAD_MROC.LeadID)
             INNER JOIN {{ ref('DATA_VAULT','H_LEADSOURCE') }} H_LEADSOURCE
                ON H_LEADSOURCE.LEADSOURCEID = S_AP1_LEAD_MROC.LEADSOURCEID
             INNER JOIN {{ ref('DATA_VAULT','S_AP1_LEADSOURCE') }} S_AP1_LEADSOURCE
                ON S_AP1_LEADSOURCE.HK_H_LEADSOURCE = H_LEADSOURCE.HK_H_LEADSOURCE
               AND S_AP1_LEADSOURCE.LEADSOURCETYPEID = 11
               AND S_AP1_LEADSOURCE.ISACTIVE = 'True'
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} DS_AGENT_KEY
                ON DS_BVSTG_AP1_LEADHISTORY.USEREMPLOYEENUMBER = DS_AGENT_KEY.EmployeeNumber
               AND DS_AGENT_KEY.RANK_EMPLOYEENUMBER = 1
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE
                ON DS_RETAIL_OFFICE.OfficeCode = DS_AGENT_KEY.OfficeCode
             INNER JOIN {{ ref('STAGE','V_DLBV_CFA_HCI_AGENTS_CURRENT') }} v_dlbv_cfa_hci_agents_current
                ON DS_BVSTG_AP1_LEADHISTORY.USEREMPLOYEENUMBER = v_dlbv_cfa_hci_agents_current.EMPLOYEENUMBER
               AND v_dlbv_cfa_hci_agents_current.ISACTIVEHEALTHCARE = 1
              LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} DS_AP1_TRANSACTIONSUMMARY
                ON DS_BVSTG_AP1_LEADHISTORY.LeadID = DS_AP1_TRANSACTIONSUMMARY.LeadID
               AND DS_AP1_TRANSACTIONSUMMARY.BIAPRIMARYAGENTOFFICE = 'HCIBP'
             WHERE DATE(DS_BVSTG_AP1_LEADHISTORY.Created) >= '2021-12-01'
               AND (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATE(DS_BVSTG_AP1_LEADHISTORY.Created) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE())))))))
             GROUP BY DS_BVSTG_AP1_LEADHISTORY.USERFULLNAME ,
                      DS_BVSTG_AP1_LEADHISTORY.USEREMPLOYEENUMBER ,
                      DS_AGENT_KEY.OfficeCode ,
                      ds_retail_office.DistrictManagerName ,
                      TO_DATE(DS_BVSTG_AP1_LEADHISTORY.Created)
        name: BVSTG_HCI_REFERRAL_COUNTS
        noLinkRefs: []
