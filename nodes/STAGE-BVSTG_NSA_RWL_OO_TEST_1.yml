        join:
          joinCondition: |-
            EXTENDED
              FROM( WITH FILTERS AS ( SELECT DISTINCT DATE(CREATED) CREATED,
                   LAST_DAY(CREATED) END_OF_MONTH,
                   TRANSACTIONID,
                   NBTRANSACTIONID,
                   CUSTOMERID,
                   POLICYID,
                   POLICYNUMBER,
                   SOURCEDB,
                   TERM,
                   CARRIERNAME,
                   CURRENTPREMIUM,
                   WRITTENPREMIUM,
                   DATE(FIRSTWRITTEN) FIRSTWRITTEN,
                   BIA_STATUSDATE,
                   EFFECTIVEDATE,
                   BIA_EXPIRATIONDATE,
                   EXPIRATIONDATE,
                   LAST_TRANSACTIONID,
                   LAST_CREATED,
                   LAST_POLICYID,
                   POLICYSTATUS,
                   STATUS_STANDARD,
                   STARTDATE,
                   ENDDATE,
                   POLICYTENURE,
                   PREV_TRANSACTIONID,
                   PREV_CARRIERNAME,
                   PREV_TERM,
                   PREV_WRITTENPREMIUM,
                   PREV_STARTDATE,
                   PREV_ENDDATE,
                   LEADID,
                   NEXT_TRANSACTIONID,
                   NEXT_WRITTENPREMIUM,
                   NEXT_STARTDATE,
                   NEXT_ENDDATE,
                   TERM_IN_MONTHS
              FROM (
                    SELECT * ,
                           CASE WHEN TERM = '1 Year'   THEN 12
                                WHEN TERM = '6 Months' THEN 6
                                ELSE 0
                                 END AS TERM_IN_MONTHS
                      FROM RETAIL_PROD.SCH_EDW.DS_POLICYSUMMARY_V2
                     WHERE LINEOFBUSINESSTYPE = 'Auto'
                       AND SOURCEDB = 'AppOne'
                       AND DATE(CREATED) >= '2024-11-01'
                       AND DATE(CREATED) <= DATEADD(YEAR, -1, CURRENT_DATE)
                       AND TERM IN ('1 Year', '6 Months')
                       AND biaprimaryagentoffice <> 'JOR'
                       AND islegacytransaction <> 'Migrated'
                   ) --WHERE DATEADD(DAY, -30, DATEADD(MONTH, TERM_IN_MONTHS, STARTDATE)) = CURRENT_DATE) )     , COLUMN_CREATION AS (     SELECT *     , DATEADD(MONTH, TERM_IN_MONTHS, STARTDATE) AS ESTIMATE_END_DATE     , DATEADD(DAY, -30, DATEADD(MONTH, TERM_IN_MONTHS, STARTDATE)) AS RENEWAL_DATE     , COUNT(*) OVER (PARTITION BY TRANSACTIONID) AS DUPLICATES     FROM FILTERS     WHERE (ENDDATE IS NULL OR ENDDATE > DATEADD(DAY,-60, DATEADD(MONTH, TERM_IN_MONTHS, STARTDATE))))     , REMOVE_DUPLICATES AS (         SELECT COLUMN_CREATION.*         FROM              (SELECT *              FROM COLUMN_CREATION             WHERE DUPLICATES > 1) COLUMN_CREATION             INNER JOIN              (SELECT DISTINCT POLICYID, TRANSACTIONID, CUSTOMERID             FROM  RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY             WHERE LINEOFBUSINESSTYPE = 'Auto' AND CLASSIFICATION = 'Carrier Premium') RETAIL_REPOSITORY             ON (COLUMN_CREATION.POLICYID = RETAIL_REPOSITORY.POLICYID               AND COLUMN_CREATION.TRANSACTIONID = RETAIL_REPOSITORY.TRANSACTIONID              AND COLUMN_CREATION.CUSTOMERID = RETAIL_REPOSITORY.CUSTOMERID))             , DATA_UNION AS (              SELECT * FROM REMOVE_DUPLICATES             UNION ALL              SELECT * FROM COLUMN_CREATION WHERE DUPLICATES = 1)                 , TARGET_CREATION AS (                  SELECT DATA_UNION.CUSTOMERID, DATA_UNION.TRANSACTIONID                 , CASE                      WHEN SUM(RR.COUNTER) >= 1 THEN 1 ELSE 0 END AS TARGET                     FROM                     (SELECT * FROM DATA_UNION) DATA_UNION                     LEFT JOIN                      (SELECT DISTINCT TRANSACTIONID,  CUSTOMERID, CREATEDDATE, 1 AS COUNTER                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY                      WHERE CLASSIFICATION = 'Carrier Premium'                       AND LINEOFBUSINESSTYPE = 'Auto'                      AND SOURCEDB = 'AppOne'                      AND CLASSIFICATIONGROUP <> 'Cancellation') RR                      ON (DATA_UNION.CUSTOMERID = RR.CUSTOMERID                       AND DATE(RR.CREATEDDATE) > DATA_UNION.CREATED)                     GROUP BY DATA_UNION.CUSTOMERID, DATA_UNION.TRANSACTIONID)                         , JOIN_TARGET AS (                          SELECT DATA_UNION.*, TARGET_CREATION.TARGET                         FROM DATA_UNION DATA_UNION                         LEFT JOIN TARGET_CREATION TARGET_CREATION                         ON (DATA_UNION.CUSTOMERID = TARGET_CREATION.CUSTOMERID                         AND DATA_UNION.TRANSACTIONID = TARGET_CREATION.TRANSACTIONID))                         SELECT CREATED, TRANSACTIONID, CUSTOMERID, POLICYID, SOURCEDB, LEADID, STARTDATE, ENDDATE                         ,TERM_IN_MONTHS ,ESTIMATE_END_DATE                         , TARGET                         , CASE                             WHEN TARGET = 1 T
