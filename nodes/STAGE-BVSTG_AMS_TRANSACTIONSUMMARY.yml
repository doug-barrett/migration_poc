        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_AMS_POLICYID') }} bvstg_ams_policyid
              LEFT JOIN {{ ref('STAGE','V_S_AMS_BASICPOLINFO_MROC_CURRENT') }} v_s_ams_basicpolinfo_mroc_current
                ON bvstg_ams_policyid.HK_h_basicpolinfo = v_s_ams_basicpolinfo_mroc_current.HK_h_basicpolinfo
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_S_AMS_CUSTOMER_MROC_CURRENT') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY custid ORDER BY DSS_VERSION DESC)=1
                   ) v_s_ams_customer_mroc_current
                ON v_s_ams_customer_mroc_current.custid = v_s_ams_basicpolinfo_mroc_current.custid
              LEFT  JOIN(
                    SELECT *
                      FROM {{ ref('STAGE','V_S_AMS_GLGROUP_MROC_CURRENT') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY GLGrpCode ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_glgroup_mroc_current
                ON v_s_ams_customer_mroc_current.GLGrpCode = v_s_ams_glgroup_mroc_current.GLGrpCode
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_S_AMS_COMPANY_MROC_CURRENT') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY cocode ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_company_mroc_current
                ON v_s_ams_basicpolinfo_mroc_current.cocode = v_s_ams_company_mroc_current.cocode
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_S_AMS_BROKER_MROC_CURRENT') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY brokercode ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_broker_mroc_current
                ON v_s_ams_broker_mroc_current.brokercode = v_s_ams_basicpolinfo_mroc_current.brokercode
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_S_AMS_GLDEPARTMENT_MROC_CURRENT') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY gldeptcode ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_gldepartment_mroc_current
                ON v_s_ams_gldepartment_mroc_current.gldeptcode = v_s_ams_basicpolinfo_mroc_current.gldeptcode
              LEFT JOIN {{ ref('STAGE','V_S_BOE_RETAIL_LOCATION_MROC_CURRENT') }} v_s_boe_retail_location_mroc_current
                ON v_s_boe_retail_location_mroc_current.PolicyDepartment= v_s_ams_gldepartment_mroc_current.name
              LEFT JOIN {{ ref('DATA_VAULT','H_EMPLOYEE') }} h_employee
                ON TO_CHAR(bvstg_ams_policyid.ChangedBy) = h_employee.employeeid
              LEFT JOIN {{ ref('STAGE','V_S_AMS_EMPLOYEE_MROC_CURRENT') }} v_s_ams_employee_mroc_current
                ON (h_employee.HK_h_employee = v_s_ams_employee_mroc_current.HK_h_employee)
              LEFT JOIN {{ ref('DATA_VAULT','H_EMPLOYEE') }} h_employee_execcode
                ON v_s_ams_basicpolinfo_mroc_current.execcode = h_employee_execcode.employeeid
              LEFT JOIN {{ ref('STAGE','V_S_AMS_EMPLOYEE_MROC_CURRENT') }} v_s_ams_employee_mroc_execcode_current
                ON (h_employee_execcode.HK_h_employee = v_s_ams_employee_mroc_execcode_current.HK_h_employee)
              LEFT JOIN {{ ref('DATA_VAULT','H_LOBSETUP') }} h_lobsetup
                ON bvstg_ams_policyid.LineOfBus = h_lobsetup.namelobs
              LEFT JOIN {{ ref('STAGE','V_S_AMS_LOBSETUP_MROC_CURRENT') }} v_s_ams_lobsetup_mroc_current
                ON (h_lobsetup.HK_h_lobsetup = v_s_ams_lobsetup_mroc_current.HK_h_lobsetup)
              LEFT JOIN {{ ref('STAGE','BVSTG_AMS_AU1_PREMIUM') }} BVSTG_AMS_AU1_PREMIUM
                ON bvstg_ams_policyid.HK_h_basicpolinfo = BVSTG_AMS_AU1_PREMIUM.HK_h_basicpolinfo
              LEFT JOIN {{ ref('STAGE','BVSTG_AMS_AU0_VOID_INVOICETRANSACTION') }} AS bvstg_ams_au0_void_invoicetransaction
                ON (bvstg_ams_au0_void_invoicetransaction.HK_h_invoicetransaction = bvstg_ams_policyid.HK_h_invoicetransaction)
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','V_S_AMS_PRCODE_MROC_CURRENT') }}
                     WHERE AttrCode like 'PF%' QUALIFY ROW_NUMBER() OVER (PARTITION BY Code ORDER BY DSS_VERSION DESC) = 1
                   ) v_s_ams_prcode_mroc_current
                ON v_s_ams_basicpolinfo_mroc
