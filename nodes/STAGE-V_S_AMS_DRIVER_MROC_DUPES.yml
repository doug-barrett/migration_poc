    sourceMapping:
      - aliases:
          V_S_AMS_DRIVER_MROC_DUPES: 9baa3be3-9d2e-4fb3-b020-de0cb195f6b1
          S_AMS_DRIVER: 69f5fc5e-e44b-4983-bbe6-09799f0f8185
          H_DRIVER: 707f8991-02c9-4694-8597-541c6b5a1873
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_S_AMS_DRIVER_MROC_DUPES') }} COMMENT='Template version:1.0.0' (hk_h_driver, polid, lobid, drvid, effdate, status, driverno, firstname, midname, lastname, sex, license, licensestate, married, relation, occupation, dob, licensedate, defdrvdate, isstudentover, isdrvtrain, isgoodstudent, employer, addr1, addr2, city, state, zip, yearemployed, ssn, yearlicensed, licenseclass, isdeferred, othlicensedate, unlicenseexclude, isgooddriver, ismaturedriver, changedby, changeddate, entereddate, dss_change_hash_ams_driver_mroc, dss_record_source, dss_load_date, dss_start_date, dss_version, dss_create_time, duperank) AS SELECT S_AMS_DRIVER.HK_H_DRIVER,
                   h_driver.POLID,
                   h_driver.LOBID,
                   h_driver.DRVID,
                   h_driver.EFFDATE,
                   S_AMS_DRIVER.STATUS,
                   S_AMS_DRIVER.DRIVERNO,
                   S_AMS_DRIVER.FIRSTNAME,
                   S_AMS_DRIVER.MIDNAME,
                   S_AMS_DRIVER.LASTNAME,
                   S_AMS_DRIVER.SEX,
                   S_AMS_DRIVER.LICENSE,
                   S_AMS_DRIVER.LICENSESTATE,
                   S_AMS_DRIVER.MARRIED,
                   S_AMS_DRIVER.RELATION,
                   S_AMS_DRIVER.OCCUPATION,
                   S_AMS_DRIVER.DOB,
                   S_AMS_DRIVER.LICENSEDATE,
                   S_AMS_DRIVER.DEFDRVDATE,
                   S_AMS_DRIVER.ISSTUDENTOVER,
                   S_AMS_DRIVER.ISDRVTRAIN,
                   S_AMS_DRIVER.ISGOODSTUDENT,
                   S_AMS_DRIVER.EMPLOYER,
                   S_AMS_DRIVER.ADDR1,
                   S_AMS_DRIVER.ADDR2,
                   S_AMS_DRIVER.CITY,
                   S_AMS_DRIVER.STATE,
                   S_AMS_DRIVER.ZIP,
                   S_AMS_DRIVER.YEAREMPLOYED,
                   S_AMS_DRIVER.SSN,
                   S_AMS_DRIVER.YEARLICENSED,
                   S_AMS_DRIVER.LICENSECLASS,
                   S_AMS_DRIVER.ISDEFERRED,
                   S_AMS_DRIVER.OTHLICENSEDATE,
                   S_AMS_DRIVER.UNLICENSEEXCLUDE,
                   S_AMS_DRIVER.ISGOODDRIVER,
                   S_AMS_DRIVER.ISMATUREDRIVER,
                   S_AMS_DRIVER.CHANGEDBY,
                   S_AMS_DRIVER.CHANGEDDATE,
                   S_AMS_DRIVER.ENTEREDDATE,
                   S_AMS_DRIVER.DSS_CHANGE_HASH,
                   S_AMS_DRIVER.DSS_RECORD_SOURCE,
                   S_AMS_DRIVER.DSS_LOAD_DATE,
                   S_AMS_DRIVER.DSS_START_DATE,
                   S_AMS_DRIVER.DSS_VERSION,
                   S_AMS_DRIVER.DSS_CREATE_TIME,
                   S_AMS_DRIVER.DupeRank
              FROM (
                    SELECT S_AMS_DRIVER.* ,
                           ROW_NUMBER() OVER (PARTITION BY S_AMS_DRIVER.hk_h_driver ORDER BY S_AMS_DRIVER.dss_start_date) AS DupeRank
                      FROM {{ ref('DATA_VAULT','S_AMS_DRIVER') }} AS S_AMS_DRIVER
                     INNER JOIN (
                            SELECT hk_h_driver,
                                   dss_start_date,
                                   LEAD(dss_start_date, 1) OVER (PARTITION BY hk_h_driver ORDER BY dss_start_date) AS last_start_date
                              FROM {{ ref('DATA_VAULT','S_AMS_DRIVER') }}
                             GROUP BY hk_h_driver,
                                      dss_start_date
                            HAVING COUNT(*) > 1
                           ) sub
                        ON S_AMS_DRIVER.hk_h_driver = sub.hk_h_driver
                       AND S_AMS_DRIVER.dss_start_date = sub.dss_start_date
                     WHERE sub.last_start_date IS NULL
                   ) AS S_AMS_DRIVER
             INNER JOIN {{ ref('DATA_VAULT','H_DRIVER') }} h_driver
                ON h_driver.hk_h_driver = s_ams_driver.hk_h_driver
        dependencies:
          - locationName: DATA_VAULT
            nodeName: S_AMS_DRIVER
          - locationName: DATA_VAULT
            nodeName: H_DRIVER
