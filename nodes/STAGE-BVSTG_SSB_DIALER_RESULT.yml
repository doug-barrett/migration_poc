    sourceMapping:
      - aliases:
          V_DLBV_PCCE_DL_5050_5050_CURRENT: a9f64de7-d2fc-4baa-911b-0cd5cad12222
          V_DLBV_PCCE_DIALER_DETAIL_CURRENT: b0283133-cfa7-4d73-8128-913ee10bcf46
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_PCCE_DL_5050_5050_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_PCCE_DIALER_DETAIL_CURRENT
        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','V_DLBV_PCCE_DL_5050_5050_CURRENT') }} V_DLBV_PCCE_DL_5050_5050_CURRENT
              LEFT JOIN (
                    SELECT Created,
                           customerid,
                           HOMEPHONE
                      FROM(
                            SELECT DATE(a.created)Created,
                                   a.customerid,
                                   HOMEPHONE
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_ACTIVITY_2STEP" a
                             INNER JOIN "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_CUSTOMER" b
                                ON a.customerid = b.customerid
                             WHERE b.HOMEPHONE IS NOT NULL
                               AND a.activitytypeid IN (1551,1555,1560)
                             UNION SELECT DATE(a.created),
                                   a.customerid,
                                   CONTACTPHONE
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_ACTIVITY_2STEP" a
                             INNER JOIN "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_CUSTOMER" b
                                ON a.customerid = b.customerid
                             WHERE b.CONTACTPHONE IS NOT NULL
                               AND a.activitytypeid IN (1551,1555,1560)
                             UNION SELECT DATE(a.created),
                                   a.customerid,
                                   CELLPHONE
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_ACTIVITY_2STEP" a
                             INNER JOIN "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_CUSTOMER" b
                                ON a.customerid = b.customerid
                             WHERE b.CELLPHONE IS NOT NULL
                               AND a.activitytypeid IN (1551,1555,1560)
                           )a
                   )DS_BVSTG_AP1_ACTIVITY_2STEP
                ON DS_BVSTG_AP1_ACTIVITY_2STEP.Created = DATE(IMPORTRULEDATE)
               AND RIGHT(PHONE01,10) = DS_BVSTG_AP1_ACTIVITY_2STEP.HOMEPHONE
              LEFT JOIN (
                    SELECT detail.DialingListID ,
                           MIN(calls.FIRST_AGENTNAME) FIRST_AGENTNAME ,
                           MIN(calls.FIRST_AGENTOFFICE) FIRST_AGENTOFFICE ,
                           MIN(DS_AGENT_KEY.EmployeeNumber) CallEmployeeNumber ,
                           MAX(calls.DURATION) DURATION ,
                           MAX(calls.RINGTIME) RINGTIME ,
                           MAX(calls.TALKTIME) TALKTIME ,
                           MAX(calls.WORKTIME) WORKTIME ,
                           MAX(TO_NUMBER(detail.PREVIEWTIME/1000)) PREVIEWTIME ,
                           COUNT(1) calls ,
