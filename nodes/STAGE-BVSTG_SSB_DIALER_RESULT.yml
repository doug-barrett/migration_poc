        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','V_DLBV_PCCE_DL_5050_5050_CURRENT') }} V_DLBV_PCCE_DL_5050_5050_CURRENT
              LEFT JOIN (
                    SELECT Created,
                           customerid,
                           HOMEPHONE
                      FROM(
                            SELECT DATE(a.created)Created,
                                   a.customerid,
                                   HOMEPHONE
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_ACTIVITY_2STEP" a
                             INNER JOIN "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_CUSTOMER" b
                                ON a.customerid = b.customerid
                             WHERE b.HOMEPHONE IS NOT NULL
                               AND a.activitytypeid IN (1551,1555,1560)
                             UNION SELECT DATE(a.created),
                                   a.customerid,
                                   CONTACTPHONE
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_ACTIVITY_2STEP" a
                             INNER JOIN "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_CUSTOMER" b
                                ON a.customerid = b.customerid
                             WHERE b.CONTACTPHONE IS NOT NULL
                               AND a.activitytypeid IN (1551,1555,1560)
                             UNION SELECT DATE(a.created),
                                   a.customerid,
                                   CELLPHONE
                              FROM "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_ACTIVITY_2STEP" a
                             INNER JOIN "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_AP1_CUSTOMER" b
                                ON a.customerid = b.customerid
                             WHERE b.CELLPHONE IS NOT NULL
