    sourceMapping:
      - aliases:
          BVSTG_IM_AU1_DEALS: 768835e0-9688-46c0-a9aa-0f414a97d037
          DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION: b0e80be4-9751-4d96-a11d-f935debb1375
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_IM_AU1_DEALS
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_IM_AU1_DEALS') }} BVSTG_IM_AU1_DEALS
              LEFT JOIN (
                    SELECT DEAL_ID ,
                           COUNT(DISTINCT b.ID) Calls
                      FROM {{ ref('STAGE','BVSTG_IM_AU1_DEALS') }} a
                      LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} b
                        ON RIGHT(b.ANI, 10) = a.Phone
                       AND DATE (b.STARTDATETIME) BETWEEN DATE (CREATION_DATE) AND DATE (IFNULL(WON_LOST_DATE, CURRENT_DATE ()))
                       AND (b.isinbound = 1 OR b.ISOUTBOUND = 1)
                     WHERE IFNULL(Phone, '') != ''
                       AND isinternalcall = 0
                     GROUP BY DEAL_ID
                   ) DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
                ON DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION.DEAL_ID = BVSTG_IM_AU1_DEALS.DEAL_ID
              LEFT JOIN (
                    SELECT DEAL_ID ,
                           CASE WHEN SUM(CASE WHEN isoutbound = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISOUTBOUND ,
                           CASE WHEN SUM(CASE WHEN isoutbound = 1 AND isofferedcall = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISOUTBOUND_ATTEMP ,
                           CASE WHEN SUM(CASE WHEN isoutbound = 1 AND talktime > 90 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISOUTBOUND_90SEC ,
                           CASE WHEN SUM(CASE WHEN isinbound = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISINBOUND ,
                           CASE WHEN SUM(CASE WHEN isinbound = 1 AND isofferedcall = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISINBOUND_ATTEMP ,
                           CASE WHEN SUM(CASE WHEN isinbound = 1 AND isanswercall = 1 THEN 1 ELSE 0 END) > 0 THEN 1
                                ELSE 0
                                 END ISINBOUND_ANSWERED
                      FROM {{ ref('STAGE','BVSTG_IM_AU1_DEALS') }} a
                      LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} b
                        ON Coalesce(RIGHT(b.ani, 10),RIGHT(b.digitsdialed, 10)) = a.Phone
                       AND DATE (b.STARTDATETIME) BETWEEN DATE (CREATION_DATE) AND DATE (IFNULL(WON_LOST_DATE, CURRENT_DATE ()))
                     WHERE IFNULL(Phone, '') != ''
                       AND isinternalcall = 0
                     GROUP BY DEAL_ID
                   ) DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION_OUTBOUND
                ON DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION_OUTBOUND.DEAL_ID = BVSTG_IM_AU1_DEALS.DEAL_ID
        name: BVSTG_IM_DEALS
        noLinkRefs: []
