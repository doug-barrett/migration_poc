          - locationName: NP
            nodeName: I_MAXESTIMATE
          - locationName: NP
            nodeName: D_ESTIMATE
          - locationName: NP
            nodeName: I_ESTIMATEWINLOSS
        join:
          joinCondition: |-
            FROM {{ ref('NP','I_ESTIMATESTATUSCHANGESUMMARY') }} I_ESTIMATESTATUSCHANGESUMMARY
              LEFT OUTER JOIN {{ ref('NP','I_MAXESTIMATE') }} I_MAXESTIMATE
                ON I_MAXESTIMATE.ESTIMATEID = I_ESTIMATESTATUSCHANGESUMMARY.ESTIMATEID
               AND ROWNUMBER = 1
               AND I_MAXESTIMATE.ODSSOURCESYSTEMNAME = 'JDE'
              LEFT OUTER JOIN {{ ref('NP','D_ESTIMATE') }} D_ESTIMATE
                ON D_ESTIMATE.ESTIMATEID = I_ESTIMATESTATUSCHANGESUMMARY.ESTIMATEID
               AND D_ESTIMATE.ESTIMATENUMBER = I_MAXESTIMATE.ESTIMATENUMBER
               AND D_ESTIMATE.ESTIMATEVERSIONNUMBER = I_MAXESTIMATE.ESTIMATEVERSIONNUMBER
               AND D_ESTIMATE.ODSSOURCESYSTEMNAME = 'JDE'
              LEFT OUTER JOIN D_JDEJOBSTATUS
                ON I_ESTIMATESTATUSCHANGESUMMARY.D_JDEJOBSTATUS_KEY = D_JDEJOBSTATUS.D_JDEJOBSTATUS_KEY
              LEFT OUTER JOIN {{ ref('NP','I_ESTIMATEWINLOSS') }} I_ESTIMATEWINLOSS
                ON I_ESTIMATEWINLOSS.ESTIMATEID = I_ESTIMATESTATUSCHANGESUMMARY.ESTIMATEID
