        dependencies: []
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT date_trunc('month', DATE) month_,
                           date_trunc('quarter', DATE) quarter_,
                           date_trunc('quarter', DATE) - interval '3 month' pq,
                           STATE,
                           metric_value
                      FROM (
                            SELECT DATE, officestate STATE,
                                   split_part(metric, '_', 2) metric_value
                              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
                             WHERE split_part(metric, '_', 2) IN ('M3', 'M7', 'M13')
                               AND officestate NOT IN ('MS', 'OH', 'PA', 'MA', 'NC')
                         UNION ALL SELECT DATE, 'MA',
                                   split_part(metric, '_', 2)
                              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
                             WHERE split_part(metric, '_', 2) IN ('M3', 'M7', 'M13')
                               AND officestate = 'NY'
                         UNION ALL SELECT DATE, officestate,
                                   split_part(metric, '_', 2)
                              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
                             WHERE split_part(metric, '_', 2) = 'M3'
                               AND officestate IN ('MS', 'OH', 'PA', 'NC')
                         UNION ALL SELECT DATE, officestate,
                                   split_part(metric, '_', 2)
                              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
                             WHERE split_part(metric, '_', 2)= 'M7'
                               AND officestate = 'NC'
                         UNION ALL SELECT DATE, CASE WHEN officestate = 'AL' THEN 'MS'
                                        WHEN officestate = 'IN' THEN 'OH'
                                        WHEN officestate = 'NY' THEN 'PA'
                                         END,
                                   split_part(metric, '_', 2)
                              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
                             WHERE split_part(metric, '_', 2) IN ('M7', 'M13')
                               AND officestate IN ('AL', 'IN', 'NY')
                         UNION ALL SELECT DATE, 'NC',
                                   split_part(metric, '_', 2)
                              FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
                             WHERE split_part(metric, '_', 2) = 'M13'
                               AND officestate = 'SC'
                           )
                     GROUP BY 1,
                              2,
                              3,
                              4,
                              5
                   ) bvstg_comm_au0_employee_retention
              LEFT JOIN ( SELECT date_trunc('quarter', DATE) quarter_,
                   STATE,
                   metric_value,
                   iff(date_trunc('quarter', DATE) < '2025-10-01', percentile_cont(0.50) within GROUP (ORDER BY metricvalue), percentile_cont(0.60) within GROUP (ORDER BY metricvalue)) AS tier1,
                   iff(date_trunc('quarter', DATE) < '2025-10-01', percentile_cont(0.80) within GROUP (ORDER BY metricvalue), percentile_cont(0.90) within GROUP (ORDER BY metricvalue)) AS tier2
              FROM ( SELECT DATE, officestate STATE,
                   split_part(metric, '_', 2) metric_value,
                   metricvalue,
                   metric,
                   denominator_cy
              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
             WHERE split_part(metric, '_', 2) IN ('M3', 'M7', 'M13')
               AND officestate NOT IN ('MS', 'OH', 'PA', 'MA','NC')
            UNION ALL SELECT DATE, 'MA',
                   split_part(metric, '_', 2),
                   metricvalue,
                   metric,
                   denominator_cy
              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
             WHERE officestate = 'NY'
            UNION ALL SELECT DATE, officestate,
                   split_part(metric, '_', 2),
                   metricvalue,
                   metric,
                   denominator_cy
              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
             WHERE split_part(metric, '_', 2) = 'M3'
               AND officestate IN ('MS', 'OH', 'PA', 'NC')
            UNION ALL SELECT DATE, officestate,
                   split_part(metric, '_', 2),
                   metricvalue,
                   metric,
                   denominator_cy
              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention
             WHERE split_part(metric, '_', 2) = 'M7'
               AND officestate = 'NC'
            UNION ALL SELECT DATE, 'NC',
                   split_part(metric, '_', 2),
                   metricvalue,
                   metric,
                   denominator_cy
              FROM RETAIL_PROD.SCH_BVSTAGE.bvstg_comm_au0_employee_retention WHE
