        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_IPR_CALL_DETAIL_OUTBOUND_SHARE') }} AS SELECT ISA.DNIS,
                   ISA.ANI,
                   TCD.CALLGUID,
                   ISA.INTELEPEER_ID,
                   TCD.STARTDATETIMEUTC,
                   TCD.ROUTERCALLKEYSEQUENCENUMBER,
                   ISA.DBDATETIME,
                   TCD.ROUTERCALLKEYDAY,
                   TCD.ROUTERCALLKEY,
                   AK.CISCO_LOGINNAME,
                   SC.FIRSTNAME,
                   SC.LASTNAME,
                   TCD.AGENTSKILLTARGETID,
                   AK.EMPLOYEENAME,
                   AK.OFFICECODE,
                   EU.DISTRICT,
                   RO.AREACODE,
                   EU.STATE,
                   RO.CHANNEL,
                   TCD.CALLDISPOSITION,
                   TCD.CALLDISPOSITIONFLAG,
                   TCD.NETWORKTIME,
                   TCD.DURATION,
                   TCD.RINGTIME,
                   TCD.DELAYTIME,
                   TCD.TIMETOABAND,
                   TCD.HOLDTIME,
                   TCD.TALKTIME,
                   TCD.WORKTIME,
                   TCD.LOCALQTIME,
                   RCD.ROUTERERRORCODE
              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCEXT_IPEER_SMARTANALYTICS_CURRENT ISA
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_TERMINATION_CALL_DETAIL_CURRENT TCD
                ON ISA.ROUTERCALLKEYDAY = TCD.ROUTERCALLKEYDAY
               AND ISA.ROUTERCALLKEY = TCD.ROUTERCALLKEY
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_PCCE_ROUTE_CALL_DETAIL_CURRENT RCD
                ON ISA.ROUTERCALLKEYDAY = RCD.ROUTERCALLKEYDAY
               AND ISA.ROUTERCALLKEY = RCD.ROUTERCALLKEY
             INNER JOIN "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY" AK
                ON TCD.AGENTSKILLTARGETID = AK.CISCO_SKILLTARGETID
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_SFDC_CONTACT" SC
                ON AK.EMPLOYEENUMBER = SC.EMPLOYEENUMBER
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" RO
                ON AK.officecode = RO.Officecode
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_HR_EMPLOYEEUNIQUE" EU
                ON AK.EMPLOYEENUMBER = EU.EMPLOYEENUMBER
