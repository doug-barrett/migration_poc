        join:
          joinCondition: |-
            FROM (
                    WITH DUPLICATE_RECORDS AS (
                            SELECT A.*
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }} A
                              LEFT JOIN (
                                    SELECT PRIMARY_KEY
                                      FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU3') }}
                                 UNION ALL SELECT PRIMARY_KEY
                                      FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU4') }}
                                 UNION ALL SELECT PRIMARY_KEY
                                      FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU5') }}
                                   ) B
                                ON (A.PRIMARY_KEY = B.PRIMARY_KEY)
                             WHERE B.PRIMARY_KEY IS NULL
                               AND A.DUPLICATE_KEY <> 'none_duplicate'
                           ) ,
                           UNIFICATION AS (
                            SELECT CREATED,
                                   END_MONTH,
                                   CUSTOMERID,
                                   PRIMARY_KEY,
                                   SOURCEDB,
                                   ISLEGACYCUSTOMER,
                                   CUSTOMER_STATUS ,
                                   VALID_FIRSTNAME AS FIRSTNAME ,
                                   VALID_LASTNAME AS LASTNAME ,
                                   VALID_DOB AS DOB ,
                                   VALID_MAINZIP AS MAINZIP ,
                                   VALID_EMAIL AS EMAIL ,
                                   VALID_PHONE AS PHONE ,
                                   GENDER,
                                   MAINSTREET,
                                   MAINSTATE,
                                   LICENSENUMBER,
                                   NON_NULL_FIELD_COUNT,
                                   KEY_NAME_DOB_EMAIL_PHONE,
                                   DUPLICATE_KEY ,
                                   MD5(KEY_NAME_DOB_EMAIL_PHONE) AS CDP_CUSTOMERID ,
                                   KEY_NAME_DOB_EMAIL_PHONE AS CLUSTER_KEY ,
                                   100 AS FUZZY_SCORE ,
                                   'DUPLICATE_RECORD' AS FUZZ_SCORE_KEY
                              FROM DUPLICATE_RECORDS
                             WHERE DUPLICATES = 1
                           ) ,
                           MATCHING AS (
                            SELECT C.CREATED,
                                   C.END_MONTH,
                                   C.CUSTOMERID,
                                   C.PRIMARY_KEY,
                                   C.SOURCEDB,
                                   C.ISLEGACYCUSTOMER,
                                   C.CUSTOMER_STATUS ,
                                   C.VALID_FIRSTNAME AS FIRSTNAME ,
                                   C.VALID_LASTNAME AS LASTNAME ,
                                   C.VALID_DOB AS DOB ,
                                   C.VALID_MAINZIP AS MAINZIP ,
                                   C.VALID_EMAIL AS EMAIL ,
                                   C.VALID_PHONE AS PHONE ,
                                   C.GENDER,
                                   C.MAINSTREET,
                                   C.MAINSTATE,
                                   C.LICENSENUMBER,
                                   C.NON_NULL_FIELD_COUNT,
                                   C.KEY_NAME_DOB_EMAIL_PHONE,
                                   C.DUPLICATE_KEY ,
                                   D.CDP_CUSTOMERID ,
                                   D.CLUSTER_KEY ,
                                   100 AS FUZZY_SCORE ,
                                   'DUPLICATE_RECORD' AS FUZZ_SCORE_KEY
                              FROM (
                                    SELECT *
                                      FROM DUPLICATE_RECORDS
                                     WHERE DUPLICATES > 1
                                   ) C
                              LEFT JOIN (
                                    SELECT *
                                      FROM UNIFICATION
                                   ) D
                                ON (C.DUPLICATE_KEY = D.DUPLICATE_KEY)
                           ) SELECT *
                      FROM UNIFICATION
                     WHERE CLUSTER_KEY IS NOT NULL
                     UNION SELECT *
                      FROM MATCHING
                     WHERE CLUSTER_KEY IS NOT NULL
                   ) bvstg_cust_uni_au6
