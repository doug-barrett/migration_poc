    sourceMapping:
      - aliases:
          BVSTG_COMM_AU3_ACCRUAL_REPORT: 1d7f1cd1-233f-4434-8feb-ae61fa086402
          BVSTG_COMM_AU2_ACCRUAL_REPORT: 21cc3cf6-c616-4abc-92e0-a88366425765
