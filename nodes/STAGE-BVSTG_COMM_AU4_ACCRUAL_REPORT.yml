    sourceMapping:
      - aliases:
          BVSTG_COMM_AU3_ACCRUAL_REPORT: d443c16b-4ba1-4494-a621-b3c8537eea67
          BVSTG_COMM_AU2_ACCRUAL_REPORT: 85b85f98-f5f7-4d78-9a86-c6087e56d775
        customSQL:
