        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU3_ACCRUAL_REPORT
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU2_ACCRUAL_REPORT
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT ifnull(bvstg_comm_au3_accrual_report.month, bvstg_comm_au2_accrual_report.month)
             MONTH,
                   ifnull(bvstg_comm_au3_accrual_report.carrierdisplayname, bvstg_comm_au2_accrual_report.carrierdisplayname) carrierdisplayname,
                   bvstg_comm_au2_accrual_report.carrier carrier_cdrc,
                   ifnull(bvstg_comm_au3_accrual_report.carriername_grouped, bvstg_comm_au2_accrual_report.carriername_grouped) carriername_grouped,
                   ifnull(bvstg_comm_au3_accrual_report.Branch, bvstg_comm_au2_accrual_report.branch) Branch,
                   ifnull(bvstg_comm_au3_accrual_report.statecode, bvstg_comm_au2_accrual_report.state_cdrc) CDRC_State,
                   ifnull(bvstg_comm_au3_accrual_report.OfficeCode, bvstg_comm_au2_accrual_report.OfficeCode) OfficeCode,
                   ifnull(bvstg_comm_au3_accrual_report.statecode, state_store) Store_State,
                   ifnull(MA_PolicyCount, 0) Policy_Count,
                   CASE WHEN v_bvstg_comm_accrual_estimation_logic.EstimationLogic = 'L2' THEN ifnull(MA_NBS_Policies, 0)
                        ELSE ifnull(NBS_Sales, 0)
                         END AS NBS_Policies,
                   ifnull(MA_RWL_POLICIES,0) RWL_Policies,
                   CASE WHEN v_bvstg_comm_accrual_estimation_logic.EstimationLogic = 'L2' THEN ifnull(MA_NBS_PREMIUM, 0) + ifnull(MA_RWL_PREMIUM, 0) + ifnull(MA_END_PREMIUM, 0) + ifnull(MA_CAN_PREMIUM, 0) + ifnull(MA_REI_PREMIUM, 0) + ifnull(MA_OTH_PREMIUM, 0)
                        ELSE ifnull(NBS_WrittenPremium,0) + ifnull(MA_RWL_PREMIUM,0) + ifnull(MA_END_PREMIUM,0) + ifnull(MA_CAN_PREMIUM,0) + ifnull(MA_REI_PREMIUM, 0) + ifnull(MA_OTH_PREMIUM, 0)
                         END AS Total_Premium,
                   CASE WHEN v_bvstg_comm_accrual_estimation_logic.EstimationLogic = 'L2' THEN ifnull(MA_NBS_PREMIUM,0) * ifnull(MA_NBSCOMMISSIONRATE,0) + ifnull(MA_RWL_PREMIUM,0) * ifnull(MA_RWLCOMMISSIONRATE,0) + ifnull(MA_END_COMMISSION,0) + ifnull(MA_CAN_COMMISSION,0) + ifnull(MA_REI_COMMISSION,0) + ifnull(MA_OTH_COMMISSION,0)
                        ELSE ifnull(NBS_WrittenPremium,0) * MA_NBSCOMMISSIONRATE + ifnull(MA_RWL_PREMIUM,0) * ifnull(MA_RWLCOMMISSIONRATE,0) + ifnull(MA_END_COMMISSION,0) + ifnull(MA_CAN_COMMISSION,0) + ifnull(MA_REI_COMMISSION,0) + ifnull(MA_OTH_COMMISSION,0)
                         END AS Actual_Commission,
                   CASE WHEN v_bvstg_comm_accrual_estimation_logic.EstimationLogic = 'L2' THEN ifnull(MA_NBS_PREMIUM,0)
                        ELSE ifnull(NBS_WrittenPremium,0)
                         END AS NBS_Premium,
                   ifnull(MA_RWL_PREMIUM,0) RWL_PREMIUM,
                   ifnull(MA_END_PREMIUM,0) END_PREMIUM,
                   ifnull(MA_CAN_PREMIUM,0) CAN_PREMIUM,
                   ifnull(MA_REI_PREMIUM, 0) REI_PREMIUM,
                   ifnull(MA_OTH_PREMIUM, 0) OTH_PREMIUM,
                   ifnull(NBS_WrittenPremium,0) * ifnull(MA_NBSCOMMISSIONRATE,0) NBS_COMMISSION,
                   ifnull(MA_RWL_PREMIUM,0) * ifnull(MA_RWLCOMMISSIONRATE,0) RWL_COMMISSION,
                   ifnull(MA_END_COMMISSION,0) END_COMMISSION,
                   ifnull(MA_CAN_COMMISSION,0) CAN_Commission,
                   ifnull(MA_REI_COMMISSION,0) REI_COMMISSION,
                   ifnull(MA_OTH_COMMISSION,0) OTH_COMMISSION,
                   1 IsEstimate,
                   v_bvstg_comm_accrual_estimation_logic.EstimationLogic,
                   v_bvstg_comm_accrual_estimation_logic.EstimationLogic_Descr
              FROM {{ ref('STAGE','BVSTG_COMM_AU3_ACCRUAL_REPORT') }} bvstg_comm_au3_accrual_report
              FULL OUTER JOIN {{ ref('STAGE','BVSTG_COMM_AU2_ACCRUAL_REPORT') }} bvstg_comm_au2_accrual_report
                ON bvstg_comm_au3_accrual_report.month = bvstg_comm_au2_accrual_report.month
               AND bvstg_comm_au3_accrual_report.carrierdisplayname = bvstg_comm_au2_accrual_report.carrierdisplayname
               AND bvstg_comm_au3_accrual_report.carriername_grouped = bvstg_comm_au2_ac
        name: BVSTG_COMM_AU4_ACCRUAL_REPORT
        noLinkRefs: []
