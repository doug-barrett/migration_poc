        description: The JDE Work order number mapped from the payglobal job code.  If the Job code starts with WF, WG, TC, TF, CA, TA then the following digits are the work order number.  WF - Faults  WG - Whg Fibre Faults  TC - Click Tasks  TF - Financial Tasks  CA - Capital tasks  TA - Task Activity (new in April 2022)  If the Job code starts with Z then there is no work order (map to -1).
