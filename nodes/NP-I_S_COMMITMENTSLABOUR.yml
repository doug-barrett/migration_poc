            transform: |-
              CASE WHEN ISNULL(I_COMMITMENTSLABOUR.JOBCODE,'') = ''                            THEN -1
                          WHEN LEFT(I_COMMITMENTSLABOUR.JOBCODE,2) IN ('WF','WG','TC','TF','CA','WA') THEN SUBSTRING(I_COMMITMENTSLABOUR.JOBCODE,3,LEN(I_COMMITMENTSLABOUR.JOBCODE))
                          WHEN I_COMMITMENTSLABOUR.JOBCODE LIKE 'Z%'                                  THEN -1
                          ELSE CONVERT(VARCHAR(12),D_JOBNUMBER.WORKORDERNUMBER)
                           END
