            transform: |-
              CASE WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Referrals'              THEN 'Referrals'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Call-In'                THEN 'Call In'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Main Site'              THEN 'Main Site'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'LMS'                    THEN 'LMS'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Current Customer'       THEN 'Current Customer'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Franchise'              THEN 'Franchise'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Walk-In'                THEN 'Walk In'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Customer Referral'      THEN 'Referrals'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Credit Union Referrals' THEN 'Referrals'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Cross Sell'             THEN 'Cross Sell'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Employee Referral'      THEN 'Referrals'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'NSA Referral'           THEN 'Referrals'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Alliant Referral'       THEN 'Referrals'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Social Media'           THEN 'Advertisements'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Apollo - Commercial'    THEN 'Advertisements'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'call in'                THEN 'Call In'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'CALL IN'                THEN 'Call In'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Print Advertisement'    THEN 'Advertisements'
                          WHEN V_DLBV_API_INSUREDMINE_DEAL_CURRENT.PRIMARY_SOURCE = 'Walk In'                THEN 'Walk In'
                          ELSE 'Others'
                           END
