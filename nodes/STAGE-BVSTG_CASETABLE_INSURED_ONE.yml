        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_EDW.DS_IM_DEALS DS_IM_DEALS
             INNER JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_INSUREDMINE_DEAL_CURRENT V_DLBV_API_INSUREDMINE_DEAL_CURRENT
                ON DS_IM_DEALS.DEAL_ID = V_DLBV_API_INSUREDMINE_DEAL_CURRENT.DEAL_ID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_INSUREDMINE_DEAL_QUOTE_CURRENT V_DLBV_API_INSUREDMINE_DEAL_QUOTE_CURRENT
                ON DS_IM_DEALS.DEAL_ID = V_DLBV_API_INSUREDMINE_DEAL_QUOTE_CURRENT.DEAL_ID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_INSUREDMINE_DEAL_LABEL_CURRENT V_DLBV_API_INSUREDMINE_DEAL_LABEL_CURRENT
                ON DS_IM_DEALS.DEAL_ID = V_DLBV_API_INSUREDMINE_DEAL_LABEL_CURRENT.DEAL_ID
             WHERE lower(DS_IM_DEALS.ORIGINAL_PIPELINE) = 'new business'
               AND DS_IM_DEALS.DEAL_ID IS NOT NULL
               AND DS_IM_DEALS.CREATION_DATE >= DATE '2025-04-01'
               AND DS_IM_DEALS.CREATION_DATE <= CAST(GETDATE() AS DATE)
