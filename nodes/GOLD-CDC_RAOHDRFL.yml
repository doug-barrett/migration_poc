        nodeName: SRC_RAOHDRFL
      join:
        joinCondition: "FROM {{ ref('GOLD', 'SRC_RAOHDRFL') }} \"SRC_RAOHDRFL\"\n\
          \ Where AUD_TIME <= (Select MAX(BATCH_END) FROM {{ ref('SILVER', 'CDC_BATCH') }} )\nAND AUD_TIME > (Select MAX(BATCH_START) FROM {{ ref('SILVER', 'CDC_BATCH') }})\nAND (AUD_CODE <> 'F' or (AUD_CODE is null and\
          \ AUD_TYPE = 'RR')) QUALIFY RANK() \nOVER (PARTITION BY  RHCMP, RHCON0\n\
          ORDER BY AUD_TIME DESC, Aud_Seqno DESC, CASE  \nWHEN AUD_TYPE in ('PT','PX','FI')\t\
          THEN 1 \nWHEN AUD_TYPE in ('UB','FB','FP','BR')\tTHEN 2 \nWHEN AUD_TYPE\
          \ in ('UP','UR')\tTHEN 3 \nWHEN AUD_TYPE in ('DL','FD')\tTHEN 4 \nWHEN AUD_TYPE\
          \ in ('RR')\t\tTHEN 5 \n ELSE 0 END DESC) = 1"
