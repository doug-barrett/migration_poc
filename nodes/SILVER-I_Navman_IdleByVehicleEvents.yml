      - locationName: GOLD
        nodeName: D_Vehicle
      join:
        joinCondition: "FROM {{ ref('BRONZE', 'L_Navman_IdleByVehicle') }} \"L_Navman_IdleByVehicle\"\
          \nLEFT JOIN {{ ref('SILVER', 'I_IdleMapping') }} \"I_IdleMapping\"\n  ON\
          \ L_NAVMAN_IDLEBYVEHICLE.VEHICLEID = I_IDLEMAPPING.VEHICLEID AND 'IDLE'\
          \ = I_IDLEMAPPING.EVENTTYPEID AND L_NAVMAN_IDLEBYVEHICLE.IDLESTARTTIME =\
          \ I_IDLEMAPPING.EVENTDATETIME\nLEFT JOIN {{ ref('SILVER', 'I_Navman_Vehicle_Hist')\
          \ }} \"I_Navman_Vehicle_Hist\"\n  ON L_NAVMAN_IDLEBYVEHICLE.VEHICLEID =\
          \ I_NAVMAN_VEHICLE_HIST.ID\nLEFT JOIN {{ ref('SILVER', 'I_Navman_Driver_Hist')\
          \ }} \"I_Navman_Driver_Hist\"\n  ON L_NAVMAN_IDLEBYVEHICLE.DRIVERID = I_NAVMAN_DRIVER_HIST.ID\n\
          LEFT JOIN {{ ref('GOLD', 'D_Vehicle') }} \"D_Vehicle\"\n  ON I_NAVMAN_VEHICLE_HIST.REGISTRATION\
          \ = D_VEHICLE.REGISTRATION\nWHERE  \nWHERE THEY HAVEN'T BEEN DELETED IN\
          \ JDE  COALESCE(D_VEHICLE.VEHICLEREGISTER, VEHICLENUMBER.VEHICLEREGISTER,\
          \ DISPLAYNUMBER.VEHICLEREGISTER, 'JDE') = 'JDE'  AND COALESCE(D_VEHICLE.PLANTSTATUS,\
          \ VEHICLENUMBER.PLANTSTATUS, DISPLAYNUMBER.PLANTSTATUS, 'DOES NOT EXIST')\
          \ <> 'DOES NOT EXIST'"
