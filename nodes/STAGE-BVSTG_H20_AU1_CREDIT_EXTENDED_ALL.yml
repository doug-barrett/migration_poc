        join:
          joinCondition: |-
            FROM (
                    SELECT DS_BVSTG_AP1_PAYMENT.TRANSACTIONID,
                           To_DATE(DS_BVSTG_AP1_PAYMENT.CREATED_TRANSACTION) AS PAYMENT_CREATED,
                           SUM(DS_BVSTG_AP1_PAYMENT.PaymentAmount) AS PAYMENT_AMOUNT
                      FROM {{ ref('STAGE','BVSTG_H20_LAPSE_MODEL_REFRESH') }} MODEL_REFRESH
                     INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_PAYMENT') }} DS_BVSTG_AP1_PAYMENT
                        ON MODEL_REFRESH.TransactionID = DS_BVSTG_AP1_PAYMENT.TRANSACTIONID
                     WHERE DS_BVSTG_AP1_PAYMENT.ISNSF = 0
                       AND DS_BVSTG_AP1_PAYMENT.ISRECEIVED = 1
                       AND DS_BVSTG_AP1_PAYMENT.ISVOID_PAYMENT = 0
                       AND DS_BVSTG_AP1_PAYMENT.ISROWDELETED_PAYMENT = 0
                       AND DS_BVSTG_AP1_PAYMENT.ISROWDELETED_TRANSACTION = 0
                       AND To_Date(DS_BVSTG_AP1_PAYMENT.CREATED_PAYMENT) = To_Date(DS_BVSTG_AP1_PAYMENT.CREATED_TRANSACTION)
                     GROUP BY DS_BVSTG_AP1_PAYMENT.TRANSACTIONID,
                              To_DATE(DS_BVSTG_AP1_PAYMENT.CREATED_TRANSACTION)
                   ) DS_BVSTG_AP1_PAYMENT
             INNER JOIN (
                    SELECT DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONID,
                           To_Date(DS_BVSTG_AP1_TRANSACTIONITEM.CREATED) AS TRANSACTIONITEM_CREATED,
                           SUM(DS_BVSTG_AP1_TRANSACTIONITEM.AMOUNT) AS TRANSACTIONITEMAMOUNT
                      FROM {{ ref('STAGE','BVSTG_H20_LAPSE_MODEL_REFRESH') }} MODEL_REFRESH
                     INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONITEM') }} DS_BVSTG_AP1_TRANSACTIONITEM
                        ON MODEL_REFRESH.TransactionID = DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONID
                       AND To_Date(DS_BVSTG_AP1_TRANSACTIONITEM.CREATED) = To_Date(DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONCREATED)
                       AND DS_BVSTG_AP1_TRANSACTIONITEM.ISVOID = 0
                     GROUP BY DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONID,
                              To_Date(DS_BVSTG_AP1_TRANSACTIONITEM.CREATED)
                   ) DS_BVSTG_AP1_TRANSACTIONITEM
                ON DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONID = DS_BVSTG_AP1_PAYMENT.TRANSACTIONID
               AND DS_BVSTG_AP1_TRANSACTIONITEM.TRANSACTIONITEM_CREATED = DS_BVSTG_AP1_PAYMENT.PAYMENT_CREATED
