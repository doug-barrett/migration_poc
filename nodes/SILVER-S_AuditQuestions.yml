      join:
        joinCondition: |-
          FROM {{ ref('SILVER', 'I_NPS_AuditChecklistQuestion') }} "I_NPS_AuditChecklistQuestion"
          LEFT JOIN {{ ref('BRONZE', 'L_NPS_AuditChecklist') }} "L_NPS_AuditChecklist"
            ON I_NPS_AUDITCHECKLISTQUESTION.AUDITCHECKLISTID = L_NPS_AUDITCHECKLIST.ID
          LEFT JOIN {{ ref('SILVER', 'I_AuditDetails') }} "I_AuditDetails"
            ON L_NPS_AUDITCHECKLIST.AUDITID = I_AUDITDETAILS.ID AND I_NPS_AUDITCHECKLISTQUESTION.ODSSOURCESYSTEMNAME = I_AUDITDETAILS.ODSSOURCESYSTEMNAME
          LEFT JOIN {{ ref('SILVER', 'I_AuditBankQuestion') }} "I_AuditBankQuestion"
          WHERE I_NPS_AUDITCHECKLISTQUESTION.USEPREDEFINEDRESPONSE = 1      --DO NOT INCLUDE ANY OF THE PARENT RECORDS SET UP TO GROUP THE QUESTIONS   AND I_NPS_AUDITCHECKLISTQUESTION.ISCATEGORY = 0      --ONLY INCLUDE THE QUESTIONS THAT NORTHPOWER HAVE IDENTIFIED WITH THE UNIQUE      -- QUESTION ID SO WE CAN TRACK THE QUESTION USAGE THROUGH THE USED TEMPLATES AND CHECKLISTS   AND PATINDEX('% #%',I_NPS_AUDITCHECKLISTQUESTION.QUESTIONTEXT) > 0
          LEFT JOIN {{ ref('GOLD', 'D_AuditDetails') }} "D_AuditDetails"
            ON "I_NPS_AuditChecklistQuestion"."AuditID" = "D_AuditDetails"."AuditCode" AND "I_NPS_AuditChecklistQuestion"."ODSSourceSystemName" = "D_AuditDetails"."ODSSourceSystemName"
          LEFT JOIN {{ ref('GOLD', 'D_Employee') }} "D_Employee"
            ON "I_NPS_AuditChecklistQuestion"."AuditorEmployeeCode" = "D_Employee"."EmployeeCode"
          LEFT JOIN {{ ref('GOLD', 'D_BusinessUnit') }} "D_BusinessUnit"
            ON "I_NPS_AuditChecklistQuestion"."BusinessUnitCode" = "D_BusinessUnit"."BusinessUnitCode"
          LEFT JOIN {{ ref('GOLD', 'D_AlternateBusinessUnit') }} "D_AlternateBusinessUnit"
            ON "I_NPS_AuditChecklistQuestion"."AlternativeBusinessUnitCode" = "D_AlternateBusinessUnit"."BusinessUnitCode"
          LEFT JOIN {{ ref('GOLD', 'D_AuditCategory') }} "D_AuditCategory"
            ON "I_NPS_AuditChecklistQuestion"."AuditCategoryID" = "D_AuditCategory"."AuditCategoryCode" AND "I_NPS_AuditChecklistQuestion"."ODSSourceSystemName" = "D_AuditCategory"."ODSSourceSystemName"
          LEFT JOIN {{ ref('GOLD', 'D_AuditQuestion') }} "D_AuditQuestion"
            ON "I_NPS_AuditChecklistQuestion"."QuestionCode" = "D_AuditQuestion"."QuestionCode"
          LEFT JOIN {{ ref('GOLD', 'D_Risk') }} "D_Risk"
            ON "I_NPS_AuditChecklistQuestion"."RiskCategoryID" = "D_Risk"."RiskCode"
          LEFT JOIN {{ ref('GOLD', 'D_AuditStatus') }} "D_AuditStatus"
            ON "I_NPS_AuditChecklistQuestion"."StatusID" = "D_AuditStatus"."AuditStatusCode"
          LEFT JOIN {{ ref('GOLD', 'D_Obligation') }} "D_Obligation"
            ON "I_NPS_AuditChecklistQuestion"."ObligationCode" = "D_Obligation"."ObligationCode"
          LEFT JOIN {{ ref('GOLD', 'D_ObligationVerificationType') }} "D_ObligationVerificationType"
            ON "I_NPS_AuditChecklistQuestion"."VerificationTypeCode" = "D_ObligationVerificationType"."VerificationTypeCode"
          LEFT JOIN {{ ref('GOLD', 'D_Location') }} "D_Location"
            ON "I_NPS_AuditChecklistQuestion"."DepotCode" = "D_Location"."LocationCode"
          LEFT JOIN {{ ref('GOLD', 'D_ObligationLocation') }} "D_ObligationLocation"
            ON "I_NPS_AuditChecklistQuestion"."DepotCode" = "D_ObligationLocation"."ObligationLocationCode"
