      config: {}
      dataType: VARCHAR(15)
      description: There are one of three pre-defined responses available to Auditor.
        They can also skip a question or mark it as not applicable.
      name: Response
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN "I_NPS_AUDITCHECKLISTQUESTION".""NotApplicable"" =
          0    AND "I_NPS_AUDITCHECKLISTQUESTION".""PredefinedResponseResult"" = 0   THEN
          'NOT ANSWERED'   WHEN "I_NPS_AUDITCHECKLISTQUESTION".""NotApplicable"" =
          0    AND "I_NPS_AUDITCHECKLISTQUESTION".""PredefinedResponseResult"" = 1   THEN
          'COMPLIANT'   WHEN "I_NPS_AUDITCHECKLISTQUESTION".""NotApplicable"" = 0    AND
          "I_NPS_AUDITCHECKLISTQUESTION".""PredefinedResponseResult"" = 2   THEN 'NOT
          COMPLIANT'   WHEN "I_NPS_AUDITCHECKLISTQUESTION".""NotApplicable"" = 0    AND
          "I_NPS_AUDITCHECKLISTQUESTION".""PredefinedResponseResult"" = 3   THEN 'OTHER
          ANSWER'   WHEN "I_NPS_AUDITCHECKLISTQUESTION".""NotApplicable"" = 1   THEN
          'NOT APPLICABLE'  ELSE 'UNKNOWN' END
