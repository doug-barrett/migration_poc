             WHERE ds_mkt_call_customer.SOURCEDB_CUSTOMER = 'AppOne'
               AND ds_mkt_call_customer.Direction = 1
               AND ds_mkt_call_customer.TCONNECTED > 0
               AND (('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 0 AND DATE(ds_mkt_call_customer.STARTDATETIME) >='2020-01-01') OR ('{{ parameters.HWM_BVSTG_AppOne_Refresh_Flag }}' = 1 AND DATEDIFF(DAY,ds_mkt_call_customer.DSS_CREATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_AppOne_Refresh_Days }}')) QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_mkt_call_customer.INTERACTIONIDKEY ORDER BY ds_bvstg_ap1_leadhistory.created DESC, CASE WHEN ds_bvstg_ap1_leadhistory.PRIMARYUSERID = ds_agent_key.AP1_USERID THEN 1 ELSE 2 END) = 1
