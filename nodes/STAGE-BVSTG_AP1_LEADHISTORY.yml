        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AP1_AU1_LEADHISTORY') }} bvstg_ap1_au1_leadhistory
              LEFT JOIN {{ ref('STAGE','V_S_AP1_LEAD_MROC_CURRENT') }} v_s_ap1_Lead_mroc_current
                ON bvstg_ap1_au1_leadhistory.LeadID = CAST(v_s_ap1_Lead_mroc_current.LeadID AS varchar(50))
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current
                ON v_dlbv_api_lms_masterlead_current.LMS_LEAD_ID = v_s_ap1_Lead_mroc_current.ExternalLeadID
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current_lead_partner
                ON v_s_ap1_Lead_mroc_current.externalleadid = v_dlbv_api_lms_masterlead_current_lead_partner.lead_id_partner
              LEFT JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} v_s_ap1_employee_mroc_current
                ON bvstg_ap1_au1_leadhistory.ASSISTANTID = v_s_ap1_employee_mroc_current.UserID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_OFFICE_MROC_CURRENT') }} v_s_ap1_office_mroc_current
                ON v_s_ap1_office_mroc_current.officeID = v_s_ap1_Lead_mroc_current.OfficeID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_MASTERLEADTEMPERATURE_MROC_CURRENT') }} v_s_ap1_masterleadtemperature_mroc_current
                ON (v_s_ap1_Lead_mroc_current.MasterLeadTemperatureID = v_s_ap1_masterleadtemperature_mroc_current.MasterLeadTemperatureID)
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU2_LEADHISTORY') }} bvstg_ap1_au2_leadhistory
                ON (bvstg_ap1_au2_leadhistory.HistoryID = bvstg_ap1_au1_leadhistory.HistoryID)
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_AP1_LEADHISTORY_LEADTYPE') }} v_preb_ap1_leadhistory_leadtype
                ON v_preb_ap1_leadhistory_leadtype.LeadID = bvstg_ap1_au1_leadhistory.LeadID
              LEFT JOIN {{ ref('DATA_VAULT','S_AP1_PHONECALL_MROC') }} s_ap1_phonecall_mroc
                ON (v_s_ap1_Lead_mroc_current.LeadID = CAST(s_ap1_phonecall_mroc.LeadID AS varchar(50)) AND DATE(v_s_ap1_Lead_mroc_current.Created) = DATE(s_ap1_phonecall_mroc.Created))
              LEFT JOIN (
                    SELECT LEADID,
                           AssistantID ,
                           DATE(CREATED) AS DATE ,
                           MAX(CASE WHEN TransactionID IS NOT NULL THEN 1 ELSE 0 END) istransferSale ,
                           MIN(REPLACE(HISTORYID,'AT','')) ActivityID
                      FROM {{ ref('STAGE','BVSTG_AP1_AU1_LEADHISTORY') }}
                     WHERE Entity='Transfer'
                     GROUP BY LEADID,
                              AssistantID ,
                              DATE(CREATED)
                   )bvstg_ap1_au1_leadhistory_transfer
                ON (bvstg_ap1_au1_leadhistory.LEADID =bvstg_ap1_au1_leadhistory_transfer.LEADID AND DATE(bvstg_ap1_au1_leadhistory.Created) = DATE(bvstg_ap1_au1_leadhistory_transfer.DATE) AND bvstg_ap1_au1_leadhistory.AssistantID = bvstg_ap1_au1_leadhistory_transfer.AssistantID)
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_AP1_LEADHISTORY_NEW') }} v_preb_ap1_leadhistory_new
                ON (v_preb_ap1_leadhistory_new.LeadID = bvstg_ap1_au1_leadhistory.LeadID AND v_preb_ap1_leadhistory_new.min_Lead_Ranking = bvstg_ap1_au2_leadhistory.Lead_Ranking)
             WHERE 1=1 QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_ap1_au1_leadhistory.HistoryID ORDER BY bvstg_ap1_au1_leadhistory.created DESC) = 1
