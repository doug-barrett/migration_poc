    sourceMapping:
    - aliases:
        SRC_WOHEADFL: 84632029-a690-561f-b445-c32e39e19d98
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: SRC_WOHEADFL
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'SRC_WOHEADFL') }} "SRC_WOHEADFL"
           Where Aud_Time <= (Select MAX(Batch_End) FROM "DOUG_POC"."DP001"."CDC_BATCH")
          AND Aud_Time > (Select MAX(Batch_Start) FROM "DOUG_POC"."DP001"."CDC_BATCH")
          AND (Aud_Code <> 'F' or (Aud_Code is null and Aud_Type = 'RR')) QUALIFY RANK() 
          OVER (PARTITION BY  VHCMP,  
          VHWO0  
