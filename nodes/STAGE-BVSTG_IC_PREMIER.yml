          - locationName: UNKNOWN
            nodeName: V_PREB_IC_PREMIER_OUTBOUND
          - locationName: UNKNOWN
            nodeName: V_PREB_IC_PREMIER_OUTBOUND_ALL
        join:
          joinCondition: |-
            FROM {{ ref('UNKNOWN','V_PREB_IC_PREMIER') }} v_preb_ic_premier
              LEFT JOIN (
                    SELECT COUNT(DISTINCT SESSIONID) total_ob_premier ,
                           EMPLOYEENUMBER ,DATE
                      FROM {{ ref('UNKNOWN','V_PREB_IC_PREMIER_OUTBOUND') }}
                     GROUP BY EMPLOYEENUMBER, DATE
                    HAVING COUNT(DISTINCT SESSIONID) > 0
                   ) v_preb_ic_premier_outbound
                ON v_preb_ic_premier_outbound.employeenumber = TO_VARCHAR(v_preb_ic_premier.employeenumber)
               AND v_preb_ic_premier_outbound.DATE = v_preb_ic_premier.DATE
              LEFT JOIN (
                    SELECT COUNT(DISTINCT SESSIONID) total_ob_calls ,
                           EMPLOYEENUMBER ,DATE
                      FROM {{ ref('UNKNOWN','V_PREB_IC_PREMIER_OUTBOUND_ALL') }}
                     GROUP BY EMPLOYEENUMBER, DATE
                    HAVING COUNT(DISTINCT SESSIONID) > 0
                   ) v_preb_ic_premier_outbound_all
                ON v_preb_ic_premier_outbound_all.employeenumber = TO_VARCHAR(v_preb_ic_premier.employeenumber)
               AND v_preb_ic_premier_outbound_all.DATE = v_preb_ic_premier.DATE
             GROUP BY V_PREB_IC_PREMIER.EmployeeNumber ,
                      V_PREB_IC_PREMIER.PrimaryAgent ,
                      TRIM(V_PREB_IC_PREMIER.AssistantName, ' ') ,
                      V_PREB_IC_PREMIER.Date ,
