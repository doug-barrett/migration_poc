      join:
        joinCondition: |-
          FROM [ORDER_LINE] ORDER_LINE
          
          INNER JOIN [ORDERS] ORDERS
          ON  ORDERS.Contract_Key = ORDER_LINE.Contract_Key
          AND ORDERS.Contract_Seq_Key = ORDER_LINE.Contract_Seq_Key
          AND (ORDER_LINE.Contract_Key,ORDER_LINE.Contract_Seq_Key, ORDER_LINE.Contract_Line_Key) IN
           (SELECT Contract_Key, Contract_Seq_Key, Contract_Line_Key
           FROM [STG_ORDER_LINE]
           WHERE Journal_Type IN (1,3,5))
          
          LEFT OUTER JOIN [HV_LOCATION]  HV_LOCATION
          ON ORDERS.Location_Id =  HV_LOCATION.Location_Id
          AND ORDER_LINE.Reporting_Date BETWEEN HV_LOCATION.Effective_Begin_Date
                                              AND HV_LOCATION.Effective_End_Date
          
          LEFT OUTER JOIN [CV_EQUIPMENT_RATE]  EQUIPMENT_RATE
          ON  ORDER_LINE.Contract_Id =  EQUIPMENT_RATE.CONTRACT_ID
          AND ORDER_LINE.Order_Line_Num =  EQUIPMENT_RATE.Line_Num
          
          LEFT OUTER JOIN [HV_EQUIPMENT_RATE] RA_EQUIPMENT_RATE
          ON  ORDER_LINE.Contract_Id = RA_EQUIPMENT_RATE.Contract_Id
          AND ORDER_LINE.Order_Line_Num =  RA_EQUIPMENT_RATE.Line_Num
          AND ORDER_LINE.Reporting_Date BETWEEN RA_EQUIPMENT_RATE.Effective_Begin_Date
                                        AND RA_EQUIPMENT_RATE.Effective_End_Date
