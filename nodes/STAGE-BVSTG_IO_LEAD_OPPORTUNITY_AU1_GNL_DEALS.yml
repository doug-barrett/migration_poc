            nodeName: DS_IM_DEALS_TIMELINES
        join:
          joinCondition: |-
            FROM (
                    SELECT TIMELINE_ID,
                           CONVERT_TIMEZONE('America/Los_Angeles', createat)::TIMESTAMP_NTZ AS moved_to_bucket_at,
                           LAG(CONVERT_TIMEZONE('America/Los_Angeles', createat)::TIMESTAMP_NTZ) OVER(PARTITION BY DEAL_ID ORDER BY createat) AS previous_moved_to_bucket_at,
                           LEAD(CONVERT_TIMEZONE('America/Los_Angeles', createat)::TIMESTAMP_NTZ) OVER(PARTITION BY DEAL_ID ORDER BY createat) AS Next_moved_to_bucket_at,
                           'IM Automation Lead' GNL_Lead_type,
                           DEAL_ID
                      FROM RETAIL_PROD.SCH_EDW.DS_IM_DEALS_TIMELINES DS_IM_DEALS_TIMELINES
                     WHERE DATE(CREATEAT) >= '2025-09-04'
                       AND TIMELINEINFO = 'Card Moved Back To Bucket'
                 UNION ALL SELECT IM_LEADID TIMELINE_ID,
                           PROCESSED_DATETIME AS moved_to_bucket_at,
                           LAG(PROCESSED_DATETIME) OVER(PARTITION BY IM_LEADID ORDER BY PROCESSED_DATETIME) AS previous_moved_to_bucket_at,
                           LEAD(PROCESSED_DATETIME) OVER(PARTITION BY IM_LEADID ORDER BY PROCESSED_DATETIME)AS Next_moved_to_bucket_at,
                           'ML Scored Lead' GNL_Lead_type,
                           LEAD_ID DEAL_ID
                      FROM DATA_LAKE.BIA_ANALYTICS.INSUREDMINE_RESPONSES_GNLAPI
                     WHERE MESSAGE = 'Lead successfully submitted to Insuredmine!'
                   ) DS_IM_DEALS_TIMELINES
