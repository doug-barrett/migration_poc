    sourceMapping:
      - aliases:
          BVSTG_CUST_UNI_AU1: 08807833-425a-4a34-ba9a-899158cda5b1
          BVSTG_CUST_UNI_AU3: d723ca07-6039-41ab-8a24-e900f0296bf3
          BVSTG_CUST_UNI_AU4: efb25c73-554e-4c42-b4a0-b4149aff024f
          DS_CUSTOMER_UNIFICATION_MASTER: 2001b869-cf91-48ea-b455-d580fc9e0268
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU5
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU1
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU3
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU4
          - locationName: EDW
            nodeName: DS_CUSTOMER_UNIFICATION_MASTER
        join:
          joinCondition: |-
            FROM(
                    WITH FUZZ_MATCH_NAME_ZIP_EMAIL_PHONE AS (
                            SELECT C.*,
                                   D.KEY_MASTER,
                                   D.CDP_CUSTOMERID,
                                   D.CLUSTER_KEY ,
                                   DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(C.KEY_TEST, D.KEY_MASTER) FUZZY_SCORE
                              FROM (
                                    SELECT A.PRIMARY_KEY,
                                           A.VALID_FIRSTNAME ,
                                           CONCAT(A.VALID_FIRSTNAME, '|', A.VALID_LASTNAME, '|', A.VALID_DOB, '|', A.VALID_MAINZIP, '|', A.VALID_EMAIL, '|', A.VALID_PHONE) AS KEY_TEST
                                      FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }} A
                                      LEFT JOIN (
                                            SELECT PRIMARY_KEY
                                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU3') }}
                                         UNION ALL SELECT PRIMARY_KEY
                                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU4') }}
                                           ) B
                                        ON (A.PRIMARY_KEY = B.PRIMARY_KEY)
                                     WHERE B.PRIMARY_KEY IS NULL
                                       AND A.VALID_FIRSTNAME <> ''
                                       AND A.VALID_LASTNAME <> ''
                                       AND A.VALID_DOB <> '1111-11-11'
                                       AND A.VALID_MAINZIP <> ''
                                       AND A.VALID_EMAIL <> ''
                                       AND A.VALID_PHONE <> ''
                                   ) C
                             INNER JOIN (
                                    SELECT DISTINCT FIRSTNAME,
                                           CDP_CUSTOMERID,
                                           CLUSTER_KEY ,
                                           CONCAT(FIRSTNAME, '|', LASTNAME, '|', DOB, '|', MAINZIP, '|', EMAIL, '|', PHONE) AS KEY_MASTER
                                      FROM {{ ref('EDW','DS_CUSTOMER_UNIFICATION_MASTER') }}
                                     WHERE CDP_CUSTOMERID <> ''
                                       AND FIRSTNAME <> ''
                                       AND LASTNAME <> ''
                                       AND DOB <> '1111-11-11'
                                       AND PHONE <> ''
                                       AND EMAIL <> ''
                                       AND MAINZIP <> ''
                                   ) D
                                ON (C.VALID_FIRSTNAME = D.FIRSTNAME)
                             WHERE DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(C.KEY_TEST, D.KEY_MASTER) >= 84 QUALIFY ROW_NUMBER() OVER(PARTITION BY C.PRIMARY_KEY, C.VALID_FIRSTNAME ORDER BY DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(C.KEY_TEST, D.KEY_MASTER) DESC) = 1
                           ) ,
                           UNIFICATION AS (
                            SELECT BL.CREATED,
                                   BL.END_MONTH,
                                   BL.CUSTOMERID,
                                   BL.PRIMARY_KEY,
                                   BL.SOURCEDB,
                                   BL.ISLEGACYCUSTOMER,
                                   BL.CUSTOMER_STATUS ,
                                   BL.VALID_FIRSTNAME AS FIRSTNAME ,
                                   BL.VALID_LASTNAME AS LASTNAME ,
                                   BL.VALID_DOB AS DOB ,
                                   BL.VALID_MAINZIP AS MAINZIP ,
                                   BL.VALID_EMAIL AS EMAIL ,
                                   BL.VALID_PHONE AS PHONE ,
                                   BL.GENDER,
                                   BL.MAINSTREET,
                                   BL.MAINSTATE,
                                   BL.LICENSENUMBER,
                                   BL.NON_NULL_FIELD_COUNT,
                                   BL.KEY_NAME_DOB_EMAIL_PHONE,
                                   BL.DUPLICATE_KEY ,
                                   FUZZ.CDP_CUSTOMERID ,
                                   FUZZ.CLUSTER_KEY ,
                                   FUZZ.FUZZY_SCORE ,
                                   'FUZZ_NAME_LASTNAME_DOB_ZIP_PHONE_EMAIL' AS FUZZ_SCORE_KEY
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }} BL
                             INNER JOIN FUZZ_MATCH_NAME_ZIP_EMAIL_PHONE FUZZ
                                ON (BL.PRIMARY_KEY = FUZZ.PRIMARY_KEY)
                           ) ,
                           DUPLICATED_RECORDS AS (
                            SELECT I.CREATED,
                                   I.END_MONTH,
                                   I.CUSTOMERID,
                                   I.PRIMARY_KEY,
                                   I.SOURCEDB,
                                   I.ISLEGACYCUSTOMER,
                                   I.CUSTOMER_STATUS ,
                                   I.VALID_FIRSTNAME AS FIRSTNAME ,
                                   I.VALID_LASTNAME AS LASTNAME ,
                                   I.VALID_DOB AS DOB ,
                                   I.VALID_MAINZIP AS MAINZIP ,
                                   I.VALID_EMAIL AS EMAIL ,
                                   I.VALID_PHONE AS PHONE ,
                                   I.GENDER,
                                   I.MAINSTREET,
                                   I.MAINSTATE,
                                   I.LICENSENUMBER,
                                   I.NON_NULL_FIELD_COUNT,
                                   I.KEY_NAME_DOB_EMAIL_PHONE,
                                   I.DUPLICATE_KEY ,
                                   K.CDP_CUSTOMERID,
                                   K.CLUSTER_KEY ,
                                   100 AS FUZZY_SCORE ,
                                   'DUPLICATE_RECORD' AS FUZZ_SCORE_KEY
                              FROM (
                                    SELECT *
                                      FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU1') }}
                                     WHERE DUPLICATE_KEY <> 'none_duplicate'
                                       AND PRIMARY_KEY NOT IN (
                                            SELECT PRIMARY_KEY
                                              FROM UNIFICATION
                                         UNION ALL SELECT PRIMARY_KEY
                                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU3') }}
                                         UNION ALL SELECT PRIMARY_KEY
                                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU4') }}
                                           )
                                   ) I
                             INNER JOIN (
                                    SELECT DISTINCT DUPLICATE_KEY,
                                           CDP_CUSTOMERID,
                                           CLUSTER_KEY
                                      FROM UNIFICATION
                                   ) K
                                ON (I.DUPLICATE_KEY = K.DUPLICATE_KEY)
                           ) SELECT *
                      FROM UNIFICATION
                 UNION ALL SELECT *
                      FROM DUPLICATED_RECORDS
                   ) bvstg_cust_uni_au5
