        join:
          joinCondition: |-
            FROM {{ ref('UNKNOWN','V_S_I3_ROUTINGCALLRESULTS_MROC_CURRENT') }} v_s_i3_routingcallresults_mroc_current
              JOIN {{ ref('UNKNOWN','V_S_I3_CAMPAIGNDNIS_MROC_CURRENT') }} v_s_i3_campaigndnis_mroc_current
                ON v_s_i3_routingcallresults_mroc_current.campaignid = v_s_i3_campaigndnis_mroc_current.campaign_id
               AND v_s_i3_routingcallresults_mroc_current.dnis = v_s_i3_campaigndnis_mroc_current.dnis
               AND v_s_i3_campaigndnis_mroc_current.isActive=TRUE
              LEFT JOIN {{ ref('UNKNOWN','V_S_I3_INTERACTIONSUMMARY_MROC_CURRENT') }} v_s_i3_interactionsummary_mroc_current
                ON v_s_i3_routingcallresults_mroc_current.interactionidkey = v_s_i3_interactionsummary_mroc_current.interactionidkey
              LEFT JOIN {{ ref('UNKNOWN','V_S_MKT_I3STATIONOFFICE_MROC_CURRENT') }} v_s_mkt_i3stationoffice_mroc_current
                ON try_to_number(v_s_i3_interactionsummary_mroc_current.laststationid) BETWEEN v_s_mkt_i3stationoffice_mroc_current.stationstart AND v_s_mkt_i3stationoffice_mroc_current.stationend
               AND v_s_mkt_i3stationoffice_mroc_current.isACtive=TRUE
               AND v_s_mkt_i3stationoffice_mroc_current.isRowDeleted=0
              LEFT JOIN {{ ref('UNKNOWN','V_S_MKT_CAMPAIGN_MROC_CURRENT') }} v_s_mkt_campaign_mroc_current
                ON v_s_i3_campaigndnis_mroc_current.id = v_s_mkt_campaign_mroc_current.cars_id
