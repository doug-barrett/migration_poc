    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_PMKT_AU4_ACTION_LOG_TABLE_CONSOLIDATED_FINAL
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT CASE WHEN LOGGINGUSERBEHAVIORID IS NULL THEN '11111111'
                        ELSE LOGGINGUSERBEHAVIORID
                         END AS LOGGINGUSERBEHAVIORID,
                   SESSIONAGENTID_FINAL,
                   SESSIONID_FINAL,
                   STARTDATETIME,
                   ENDDATETIME,
                   AGENT,
                   SOURCE_DATA,
                   SKILLGROUPTARGETNAME_FINAL,
                   SKILL_QUEUE,
                   FINAL_CUSTOMER_ID_TO_KEEP,
                   TIME_FLAG,
                   AGENT_OFFICE_GROUPED,
                   FIRST_AGENTOFFICE_GROUPED,
                   LAST_AGENTOFFICE_GROUPED,
                   CALLTYPEDESCRIPTION,
                   FIRST_SKILLGROUP,
                   FIRST_SKILL_QUEUE,
                   SECOND_SKILLGROUP,
                   SECOND_SKILL_QUEUE,
                   LAST_SKILLGROUP,
                   LAST_SKILL_QUEUE,
                   TOTAL_AGENTS,
                   IS_ICR,
                   ICR_RESULT,
                   ANI_POPULATED,
                   FCR_ELIGIBLE_FLAG,
                   FINAL_SKILL_QUEUE,
                   CASE WHEN SOURCE_DATA IN ('cisco') THEN CONCAT('Call_', CALL_NUMBER, '_', TIME_FLAG)
                        ELSE NEW_GROUPING_FINAL
                         END AS ACTION_
              FROM (
                    SELECT *,
                           FINAL_MAPPING AS NEW_GROUPING_FINAL
                      FROM (
                            SELECT *,
                                   CASE WHEN Mappings_v1 IS NULL THEN UIELEMENTNAME
                                        ELSE CONCAT(Mappings_v1, '_', UIELEMENTNAME)
                                         END AS final_mapping
                              FROM (
                                    SELECT *,
                                           CASE WHEN SPLIT_PART(UISCREEN, '.', 4) <> '' THEN SPLIT_PART(UISCREEN, '.', 4)
                                                WHEN SPLIT_PART(UISCREEN, '.', 3) <> '' THEN SPLIT_PART(UISCREEN, '.', 3)
                                                WHEN SPLIT_PART(UISCREEN, '.', 2) <> '' THEN SPLIT_PART(UISCREEN, '.', 2)
                                                ELSE SPLIT_PART(UISCREEN, '.', 1)
                                                 END AS Mappings_v1
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_ACTION_LOG_TABLE_CONSOLIDATED_FINAL
                                   ) AS split_logic
                           ) AS mapping_logic
                     WHERE final_mapping IS NULL
                        OR final_mapping IN (
                            SELECT DISTINCT final_mapping
                              FROM (
                                    SELECT final_mapping,
                                           SUM(cnt) OVER (ORDER BY cnt DESC) * 100.0 / SUM(cnt) OVER () AS pct
                                      FROM (
                                            SELECT CASE WHEN Mappings_v1 IS NULL THEN UIELEMENTNAME
                                                        ELSE CONCAT(Mappings_v1, '_', UIELEMENTNAME)
                                                         END AS final_mapping,
                                                   COUNT(*) AS cnt
                                              FROM (
                                                    SELECT UIELEMENTNAME,
                                                           CASE WHEN SPLIT_PART(UISCREEN, '.', 4) <> '' THEN SPLIT_PART(UISCREEN, '.', 4)
                                                                WHEN SPLIT_PART(UISCREEN, '.', 3) <> '' THEN SPLIT_PART(UISCREEN, '.', 3)
                                                                WHEN SPLIT_PART(UISCREEN, '.', 2) <> '' THEN SPLIT_PART(UISCREEN, '.', 2)
                                                                ELSE SPLIT_PART(UISCREEN, '.', 1)
                                                                 END AS Mappings_v1
                                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_ACTION_LOG_TABLE_CONSOLIDATED_FINAL
                                                   ) AS core_f
                                             GROUP BY 1
                                           ) AS grp
                                     WHERE LOWER(final_mapping) NOT LIKE '%saveclose%'
                                        OR final_mapping IS NULL
                                   ) AS cum
                             WHERE pct <= 95.0
                           )
                   ) AS filtered_main
            UNION ALL SELECT DISTINCT '22222222' AS LOGGINGUSERBEHAVIORID,
                   T1.SESSIONAGENTID_FINAL,
                   T1.SESSIONID_FINAL,
                   T2.enddatetime_call AS STARTDATETIME,
                   T2.enddatetime_call AS ENDDATETIME,
                   T1.AGENT,
                   T1.SOURCE_DATA,
                   T1.SKILLGROUPTARGETNAME_FINAL,
                   T1.SKILL_QUEUE,
                   T1.FINAL_CUSTOMER_ID_TO_KEEP,
                   'Call End' AS TIME_FLAG,
                   T1.AGENT_OFFICE_GROUPED,
                   T1.FIRST_AGENTOFFICE_GROUPED,
                   T1.LAST_AGENTOFFICE_GROUPED,
                   T1.CALLTYPEDESCRIPTION,
                   T1.FIRST_SKILLGROUP,
                   T1.FIRST_SKILL_QUEUE,
                   T1.SECOND_SKILLGROUP,
                   T1.SECOND_SKILL_QUEUE,
                   T1.LAST_SKILLGROUP,
                   T1.LAST_SKILL_QUEUE,
                   T1.TOTAL_AGENTS,
                   T1.IS_ICR,
                   T1.ICR_RESULT,
                   T1.ANI_POPULATED,
                   T1.FCR_Eligible_Flag,
                   T1.Final_Skill_Queue,
                   'Call End' AS ACTION_
              FROM ( SELECT *
              FROM ( SELECT *,
                   ROW_NUMBER() OVER (PARTITION BY SESSIONID_FINAL ORDER BY STARTDATETIME) AS rn
              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU4_ACTI
        name: BVSTG_PMKT_AU4_BASE_TABLE_PM
        noLinkRefs: []
