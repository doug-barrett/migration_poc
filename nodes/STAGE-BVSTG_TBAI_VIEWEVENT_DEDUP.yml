        join:
          joinCondition: |-
            FROM(
                    SELECT VE.SESSIONID ,
                           VE.STEPNO ,
                           VE.FORMNAME ,
                           VE.EVENTID ,
                           VE.EVENTTYPE ,
                           VE.EVENTTIME
                      FROM {{ ref('STAGE','V_DLBV_TBAI_VIEWEVENT_CURRENT') }} VE
                     INNER JOIN (
                            SELECT SESSIONID,
                                   STEPNO,
                                   CASE WHEN STEPNO = '1' THEN MIN(EVENTTIME)
                                        ELSE MAX(EVENTTIME)
                                         END EVENTTIME
                              FROM {{ ref('STAGE','V_DLBV_TBAI_VIEWEVENT_CURRENT') }}
                             GROUP BY SESSIONID,
                                      STEPNO
                           )VEG
                        ON VE.SESSIONID = VEG.SESSIONID
                       AND VE.STEPNO = VEG.STEPNO
                       AND VE.EVENTTIME = VEG.EVENTTIME
                   )V_DLBV_TBAI_VIEWEVENT_CURRENT
