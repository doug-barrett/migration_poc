        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('DATA_VAULT','H_CAMPAIGN') }} h_campaign
              JOIN {{ ref('STAGE','V_S_MKT_CAMPAIGN_CURRENT') }} v_s_mkt_campaign_current
                ON v_s_mkt_campaign_current.hk_h_campaign = h_campaign.hk_h_campaign
              LEFT JOIN {{ ref('DATA_VAULT','H_BRAND') }} h_brand
                ON h_brand.mkt_brandsid = v_s_mkt_campaign_current.BrandID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_MKT_BRAND_CURRENT v_s_mkt_brand_current
                ON h_brand.hk_h_brand = v_s_mkt_brand_current.hk_h_brand
              LEFT JOIN {{ ref('DATA_VAULT','H_BUDGETMKTGORG') }} h_budgetmktgorg
                ON v_s_mkt_campaign_current.BudgetMktgOrgID = h_budgetmktgorg.BudgetMktgOrgID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_BUDGETMKTGORG_CURRENT') }} v_s_mkt_budgetmktgorg_current
                ON v_s_mkt_budgetmktgorg_current.HK_H_BUDGETMKTGORG = h_budgetmktgorg.HK_H_BUDGETMKTGORG
              LEFT JOIN {{ ref('DATA_VAULT','H_BUYER_OFFICE') }} h_buyer_office
                ON v_s_mkt_campaign_current.BuyerOfficeID = h_buyer_office.Buyer_OfficeID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_BUYER_OFFICE_CURRENT') }} v_s_mkt_buyer_office_current
                ON v_s_mkt_buyer_office_current.HK_H_BUYER_OFFICE = h_buyer_office.HK_H_BUYER_OFFICE
              LEFT JOIN {{ ref('DATA_VAULT','H_DEVICETYPE') }} h_devicetype
                ON v_s_mkt_campaign_current.DeviceTypeID = h_devicetype.DeviceTypeID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_DEVICETYPE_CURRENT') }} v_s_mkt_devicetype_current
                ON v_s_mkt_devicetype_current.HK_H_DEVICETYPE = h_devicetype.HK_H_DEVICETYPE
              LEFT JOIN {{ ref('DATA_VAULT','H_DIGITALCATEGORY') }} h_digitalcategory
                ON v_s_mkt_campaign_current.DigitalCategoryID = h_digitalcategory.DigitalCategoryID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_DIGITALCATEGORY_CURRENT') }} v_s_mkt_digitalcategory_current
                ON v_s_mkt_digitalcategory_current.HK_H_DIGITALCATEGORY = h_digitalcategory.HK_H_DIGITALCATEGORY
              LEFT JOIN {{ ref('DATA_VAULT','H_DMA') }} h_dma
                ON v_s_mkt_campaign_current.DMAID = h_dma.DMAID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_DMA_CURRENT') }} v_s_mkt_dma_current
                ON v_s_mkt_dma_current.HK_H_DMA = h_dma.HK_H_DMA
              LEFT JOIN {{ ref('DATA_VAULT','H_FREQUENCY') }} h_frequency
                ON v_s_mkt_campaign_current.FrequencyID = h_frequency.FrequencyID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_FREQUENCY_CURRENT') }} v_s_mkt_frequency_current
                ON v_s_mkt_frequency_current.HK_H_Frequency= h_frequency.HK_H_Frequency
              LEFT JOIN {{ ref('DATA_VAULT','H_INTERACTIONTYPE') }} h_interactiontype
                ON v_s_mkt_campaign_current.InteractionTypeID = h_interactiontype.InteractionTypeID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_INTERACTIONTYPE_CURRENT') }} v_s_mkt_interactiontype_current
                ON v_s_mkt_interactiontype_current.HK_H_InteractionType = h_interactiontype.HK_H_InteractionType
              LEFT JOIN {{ ref('DATA_VAULT','H_LEADCAPTURETYPE') }} h_leadcapturetype
                ON v_s_mkt_campaign_current.LeadCaptureTypeID = h_leadcapturetype.LeadCaptureTypeID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_LEADCAPTURETYPE_CURRENT') }} v_s_mkt_leadcapturetype_current
                ON v_s_mkt_leadcapturetype_current.HK_H_LeadCaptureType = h_leadcapturetype.HK_H_LeadCaptureType
              LEFT JOIN {{ ref('DATA_VAULT','H_MEDIAPROVIDER') }} h_mediaprovider
                ON v_s_mkt_campaign_current.MediaProviderID = h_mediaprovider.MediaProviderID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_MEDIAPROVIDER_CURRENT') }} v_s_mkt_mediaprovider_current
                ON v_s_mkt_mediaprovider_current.HK_H_MediaProvider = h_mediaprovider.HK_H_MediaProvider
              LEFT JOIN {{ ref('DATA_VAULT','H_PLACEMENTLEVEL') }} h_placementlevel
                ON v_s_mkt_campaign_current.PlacementLevelID = h_placementlevel.PlacementLevelID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_PLACEMENTLEVEL_CURRENT') }} v_s_mkt_placementlevel_current
                ON v_s_mkt_placementlevel_current.HK_H_PlacementLevel = h_placementlevel.HK_H_PlacementLevel
              LEFT JOIN {{ ref('DATA_VAULT','H_PRODUCTTYPE') }} h_producttype
                ON v_s_mkt_campaign_current.ProductTypeID = h_producttype.ProductTypeID
              LEFT JOIN {{ ref('STAGE','V_S_MKT_PRODUCTTYPE_CURRENT') }} v_s_mkt_producttype_current
                ON v_s_mkt_producttype_current.HK_H_ProductType = h_producttype.HK_H_ProductType
