      join:
        joinCondition: 'FROM {{ ref(''GOLD'', ''CDC_CUSMASFL'') }} "CDC_CUSMASFL"


          LEFT OUTER JOIN {{ ref(''GOLD'', ''PARTY'') }} "PARTY"

          ON  CDC_CUSMASFL.CMCMP = PARTY.Company_Code

          AND CDC_CUSMASFL.CMCUS0 = PARTY.Customer_Account_Num

          AND PARTY.Customer_Account_Char = ''''

          AND PARTY.Party_Type_Code = 1

          AND PARTY.dss_current_flag = ''Y''


          UNION

          SELECT

          CDC_CSHCUSFL.Journal_Type

          ,CDC_CSHCUSFL.Journal_Begin_Date

          ,CDC_CSHCUSFL.Journal_End_Date

          ,CDC_CSHCUSFL.CHSCD

          ,COALESCE(PARTY1.Party_Id, 0)

          ,2

          ,CDC_CSHCUSFL.CHCMP

          ,CDC_CSHCUSFL.Customer_Account_Num

          ,CDC_CSHCUSFL.Customer_Account_Char

          FROM {{ ref(''GOLD'', ''CDC_CSHCUSFL'') }} "CDC_CSHCUSFL"


          LEFT OUTER JOIN {{ ref(''GOLD'', ''PARTY'') }} "PARTY1"

          ON  CDC_CSHCUSFL.CHCMP = PARTY1.Company_Code

          AND CDC_CSHCUSFL.Customer_Account_Num = PARTY1.Customer_Account_Num

          AND CDC_CSHCUSFL.Customer_Account_Char = PARTY1.Customer_Account_Char

          AND PARTY1.Party_Type_Code = 2

          AND PARTY1.dss_current_flag = ''Y'''
