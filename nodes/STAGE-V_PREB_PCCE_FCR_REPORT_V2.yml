    sourceMapping:
      - aliases:
          V_PREB_PCCE_FCR_REPORT_V2: 90eba795-150a-41dd-8865-a911072d4954
          BVSTG_PCCE_FCR_DATA_V2: dcd2828e-1d9e-4862-a7a1-a057d103c3a5
          V_PREB_PCCE_FCR_MAPPINGS: 4801aee5-86ec-463e-8541-79c4b7df574e
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_FCR_REPORT_V2') }} AS SELECT BVSTG_PCCE_FCR_DATA.*,
                   IFNULL(MAPPINGS_STATES.MAPVALUE, 'N/A') AS StateAreaCodeBased,
                   IFNULL(MAPPINGS_PERIPH.MAPVALUE, '0') AS FCR_Calls,
                   IFNULL(MAPPINGS_NUMBER.MAPVALUE, '0') AS IsInternalCall,
                   CASE WHEN BVSTG_PCCE_FCR_DATA.HOURSDIFF < (168) THEN 1
                        ELSE 0
                         END AS CALLED_AGAIN,
                   CASE WHEN IFNULL(MAPPINGS_PERIPH.MAPVALUE, '0') = 1 AND BVSTG_PCCE_FCR_DATA.HOURSDIFF < (168) THEN 1
                        ELSE 0
                         END AS FCR_CALLED_AGAIN
              FROM {{ ref('STAGE','BVSTG_PCCE_FCR_DATA_V2') }} BVSTG_PCCE_FCR_DATA
              LEFT JOIN {{ ref('STAGE','V_PREB_PCCE_FCR_MAPPINGS') }} MAPPINGS_STATES
                ON MAPPINGS_STATES.TYPE = 'Areacodes'
               AND MAPPINGS_STATES.MAPCODE = BVSTG_PCCE_FCR_DATA.AREACODE
              LEFT JOIN {{ ref('STAGE','V_PREB_PCCE_FCR_MAPPINGS') }} MAPPINGS_NUMBER
                ON MAPPINGS_NUMBER.TYPE = 'InternalNumbers'
               AND MAPPINGS_NUMBER.MAPCODE = BVSTG_PCCE_FCR_DATA.DIALNUMBER
              LEFT JOIN {{ ref('STAGE','V_PREB_PCCE_FCR_MAPPINGS') }} MAPPINGS_PERIPH
                ON MAPPINGS_PERIPH.TYPE = 'Peripherals'
               AND MAPPINGS_PERIPH.MAPCODE = BVSTG_PCCE_FCR_DATA.ENTERPRISENAME
             WHERE IFNULL(MAPPINGS_NUMBER.MAPVALUE, '0') = '0'
               AND IFNULL(MAPPINGS_STATES.MAPVALUE, 'N/A') NOT IN ('Toll Free','N/A')
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_PCCE_FCR_DATA_V2
          - locationName: STAGE
            nodeName: V_PREB_PCCE_FCR_MAPPINGS
