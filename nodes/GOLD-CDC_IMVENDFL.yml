    - aliases:
        SRC_IMVENDFL: 060865d8-d59c-5990-a1c9-eee0b54285ba
      customSQL:
        customSQL: ''
      dependencies:
      - locationName: GOLD
        nodeName: SRC_IMVENDFL
      join:
        joinCondition: "FROM {{ ref('GOLD', 'SRC_IMVENDFL') }} \"SRC_IMVENDFL\"\n\
          \ Where Aud_Time <= (Select MAX(Batch_End) FROM \"DOUG_POC\".\"DP001\".\"\
          CDC_BATCH\")\nAND Aud_Time > (Select MAX(Batch_Start) FROM \"DOUG_POC\"\
          .\"DP001\".\"CDC_BATCH\")\nAND (Aud_Code <> 'F' or (Aud_Code is null and\
          \ Aud_Type = 'RR')) QUALIFY RANK() \nOVER (PARTITION BY  MVCMP0,  \nMVVND0\
          \  \nORDER BY AUD_TIME DESC, AUD_SEQNO DESC,  CASE  \nWHEN Aud_Type in ('PT','PX','FI')\t\
          THEN 1 \nWHEN Aud_Type in ('UB','FB','FP','BR')\tTHEN 2 \nWHEN Aud_Type\
          \ in ('UP','UR')\tTHEN 3 \nWHEN Aud_Type in ('DL','FD')\tTHEN 4 \nWHEN Aud_Type\
          \ in ('RR')\t\tTHEN 5 \n ELSE 0 END DESC) = 1"
      name: CDC_IMVENDFL
      noLinkRefs: []
