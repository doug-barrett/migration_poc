    sourceMapping:
      - aliases:
          BVSTG_AU24_CSPR: 565e1743-0116-4bff-814e-d2dd779aaa50
          DS_LEAD_OPORTUNITY_CONVERSION: 646005ea-4b67-4cc9-8590-7bed264df45a
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
          S_MKT_BROADCAST_CALENDAR: 9ef229ed-d635-470a-ba97-d32e331a48bc
          DS_RAM_RETAIL_REPOSITORY: d29a0c5c-e296-46c4-bc55-861d60fe906d
          DS_MKT_LEAD_SOURCE: 0aaa279e-0731-4ba4-882c-75dc6cf7d3c9
          V_DS_RETAIL_OFFICE: cc22551d-ab5b-4f83-a682-b6117f6a557e
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU24_CSPR
          - locationName: EDW
            nodeName: DS_LEAD_OPORTUNITY_CONVERSION
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: DATA_VAULT
            nodeName: S_MKT_BROADCAST_CALENDAR
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: EDW
            nodeName: DS_MKT_LEAD_SOURCE
          - locationName: EDW
            nodeName: V_DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT bvstg_au24_cspr.*,
                   YEAR_NUMBER,
                   MONTH_NUMBER,
                   State,
                   LEADSFROMPRODUCER,
                   TRANSFERS,
                   SALES,
                   QUOTES //
              FROM DATA_LAKE.BIA_ANALYTICS.BVSTG_AU24_CSPR bvstg_au24_cspr
              FROM {{ ref('STAGE','BVSTG_AU24_CSPR') }} BVSTG_AU24_CSPR
              LEFT JOIN (SELECT ds_lead_oportunity_conversion.year_number,
                   ds_lead_oportunity_conversion.month_number,
                   ds_lead_oportunity_conversion.state,
                   ds_lead_oportunity_conversion.officecode,
                   ds_lead_oportunity_conversion.leadsfromproducer,
                   ds_lead_oportunity_conversion.transfers,
                   ds_lead_oportunity_conversion.sales,
                   ds_lead_oportunity_conversion.quotes
              FROM (SELECT year_number,
                   month_number,
                   State,
                   OfficeCode,
                   SUM(leadsfromproducer) leadsfromproducer,
                   SUM(transfers) transfers,
                   SUM(Sales) Sales,
                   SUM(Quotes) Quotes
              FROM (
                    SELECT s_mkt_broadcast_calendar.year_number,
                           s_mkt_broadcast_calendar.month_number,
                           CASE WHEN ds_retail_office.salesvp like '%Josue%' THEN 'NTS'
                                ELSE ds_retail_office.StateCode
                                 END AS State,
                           ds_lead_oportunity_conversion.OfficeCode,
                           SUM(leadsfromproducer) leadsfromproducer,
                           SUM(transfers) transfers,
                           SUM(TOTALPOLICIES) Sales,
                           SUM(TOTALQUOTES) Quotes
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_LEAD_OPORTUNITY_CONVERSION" ds_lead_oportunity_conversion //
                      FROM {{ ref('EDW','DS_LEAD_OPORTUNITY_CONVERSION') }} DS_LEAD_OPORTUNITY_CONVERSION
                      LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" ds_retail_office // {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE
                        ON ds_lead_oportunity_conversion.OfficeCode = ds_retail_office.OfficeCode
                      LEFT JOIN // "RETAIL_PROD"."SCH_DATA_VAULT"."S_MKT_BROADCAST_CALENDAR" s_mkt_broadcast_calendar {{ ref('DATA_VAULT','S_MKT_BROADCAST_CALENDAR') }} S_MKT_BROADCAST_CALENDAR
                        ON s_mkt_broadcast_calendar.Date = ds_lead_oportunity_conversion.created
                     WHERE s_mkt_broadcast_calendar.YEAR_NUMBER >= 2021
                       AND ds_lead_oportunity_conversion.OfficeCode NOT IN ('HCIBP','ZCA001','DCACAL', 'ZIL001', '10FLPB')
                       AND CASE WHEN ds_retail_office.salesvp like '%Josue%' THEN 'NTS'
                                ELSE ds_retail_office.StateCode
                                 END IS NOT NULL
                       AND ds_retail_office.StateCode != 'BC'
                     GROUP BY s_mkt_broadcast_calendar.year_number,
                              s_mkt_broadcast_calendar.month_number,
                              CASE WHEN ds_retail_office.salesvp like '%Josue%' THEN 'NTS'
                                   ELSE ds_retail_office.StateCode
                                    END,
                              ds_lead_oportunity_conversion.OfficeCode
                 UNION ALL SELECT YEAR(CREATEDDATE) YEAR,
                           MONTH(CREATEDDATE)
                     MONTH,
                           REP_STATECODE,
                           COALESCE(biaprimarytransactionoffice, FOLLOWUP_OFFICECODE) officeCode,
                           0 LEADSFROMPRODUCER,
                           SUM(CASE WHEN classification = 'New Transfer' THEN counter ELSE 0 END) Transfers,
                           SUM(CASE WHEN label = 'New Business Auto' THEN counter ELSE 0 END) NBSales,
                           SUM(CASE WHEN classificationgroup = 'New Quotes Auto' THEN counter ELSE 0 END) Quotes
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY" //
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                     WHERE year(CREATEDDATE) >= 2021
                       AND SOurceDB IN ('CIGH', 'ConfieHub')
                       AND REP_STATECODE IN('AL','LA','IL')
                       AND (classification = 'New Transfer' OR classificationgroup = 'New Quotes Auto' OR label = 'New Business Auto')
                     GROUP BY YEAR(CREATEDDATE),
                              MONTH(CREATEDDATE),
                              REP_STATECODE,
                              COALESCE(biaprimarytransactionoffice, FOLLOWUP_OFFICECODE)
                 UNION ALL SELECT YEAR(leadcreated) YEAR,
                           MONTH(leadcreated)
                     MONTH,
                           "StateCode",
                           officecode,
                           count(DISTINCT customerid) LEADSFROMPRODUCER,
                           0 Transfer,
                           0 Sale,
                           0 Quote
                      FROM RETAIL_PROD.SCH_EDW.DS_MKT_LEAD_SOURCE ds_mkt_lead_source //
                      FROM {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} DS_MKT_LEAD_SOURCE
                      JOIN RETAIL_PROD.SCH_EDW.V_DS_RETAIL_OFFICE ds_retail_office // {{ ref('EDW','V_DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE
                        ON ds_mkt_lead_source.officecode = ds_retail_office."OfficeCode"
                     WHERE sourcedb = 'CIGH'
                       AND leadcreated >= '2021-01-01'
                       AND officecode != 'IO House Account'
                     GROUP BY YEAR(leadcreated),
                              MONTH(leadcreated),
                              "StateCode",
                              officecode
                   )
