                           NULL AS UIELEMENTTYPE,
                           NULL AS UICONTAINERCONTROL,
                           NULL AS UISCREEN,
                           NULL AS UIEVENTTYPE,
                           AGENT,
                           'cisco' AS source_data
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID
