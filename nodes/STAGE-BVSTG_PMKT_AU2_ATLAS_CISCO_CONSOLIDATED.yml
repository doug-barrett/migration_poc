        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT common_table.LOGGINGUSERBEHAVIORID,
                           SESSIONAGENTID,
                           SESSIONID_FINAL,
                           PHONENUMBER_FINAL,
                           CUSTOMERID_FINAL,
                           LEADID_FINAL,
                           STARTDATETIME,
                           ENDDATETIME,
                           UIELEMENTNAME,
                           UIELEMENTTYPE,
                           UICONTAINERCONTROL,
                           UISCREEN,
                           UIEVENTTYPE,
                           AGENT,
                           source_data
                      FROM (
                            SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO1
                         UNION ALL SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO2
                         UNION ALL SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO3
                         UNION ALL SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO4
                         UNION ALL SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO5
                         UNION ALL SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO6
                         UNION ALL SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO7
                           ) common_table
                     INNER JOIN (
                            SELECT LOGGINGUSERBEHAVIORID,
                                   min(aa_) AS min_aa
                              FROM (
                                    SELECT *
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO1
                                 UNION ALL SELECT *
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO2
                                 UNION ALL SELECT *
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO3
                                 UNION ALL SELECT *
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO4
                                 UNION ALL SELECT *
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO5
                                 UNION ALL SELECT *
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO6
                                 UNION ALL SELECT *
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO7
                                   )
                             GROUP BY 1
                           ) common_table_v1
                        ON common_table.LOGGINGUSERBEHAVIORID = common_table_v1.LOGGINGUSERBEHAVIORID
                       AND common_table.aa_ = common_table_v1.min_aa
                 UNION ALL SELECT DISTINCT NULL AS LOGGINGUSERBEHAVIORID,
                           sessionagentid,
                           sessionid AS SESSIONID_FINAL,
                           right(ANI, 10) AS PHONENUMBER_FINAL,
                           FINAL_CUSTOMER_ID_TO_KEEP AS CUSTOMERID_FINAL,
                           COALESCE(LEADID_APPONE_PHONE_CALL, LEADID_CALL_CUSTOMER) AS LEADID_FINAL,
                           STARTDATETIME,
                           ENDDATETIME,
                           NULL AS UIELEMENTNAME,
                           NULL AS UIELEMENTTYPE,
                           NULL AS UICONTAINERCONTROL,
                           NULL AS UISCREEN,
                           NULL AS UIEVENTTYPE,
                           AGENT,
                           'cisco' AS source_data
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU1_CISCO_CALL_DATA_CUSTOMERID
                   ) BVSTG_PMKT_AU3_ATLAS_CISCO7
