                           UICONTAINERCONTROL,
                           UISCREEN,
                           UIEVENTTYPE,
                           AGENT,
                           source_data
                      FROM (
                            SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO1
