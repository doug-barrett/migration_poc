        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT common_table.LOGGINGUSERBEHAVIORID,
                           SESSIONAGENTID,
                           SESSIONID_FINAL,
                           PHONENUMBER_FINAL,
                           CUSTOMERID_FINAL,
                           LEADID_FINAL,
