                         UNION ALL SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO5
                         UNION ALL SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO6
                         UNION ALL SELECT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO7
                           ) common_table
                     INNER JOIN (
                            SELECT LOGGINGUSERBEHAVIORID,
                                   min(aa_) AS min_aa
                              FROM (
                                    SELECT *
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO1
                                 UNION ALL SELECT *
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU3_ATLAS_CISCO2
                                 UNION ALL SELECT *
