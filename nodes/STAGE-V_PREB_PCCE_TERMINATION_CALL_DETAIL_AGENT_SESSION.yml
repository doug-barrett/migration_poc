    sourceMapping:
      - aliases:
          V_PREB_PCCE_TERMINATION_CALL_DETAIL_AGENT_SESSION: 49daa1ef-5702-4f69-b15e-c80d1526659b
          BVSTG_PCCE_TERMINATION_CALL_AGENT_SESSION_AU1: 0181a3a1-c961-429a-a606-572bb2ab5b28
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_TERMINATION_CALL_DETAIL_AGENT_SESSION') }} AS SELECT ds_pcce_termination_call_detail.SessionID || '-' || ds_pcce_termination_call_detail.agentskilltargetid AS SessionAgentID,
                   ds_pcce_termination_call_detail_1.ranking Rank_Agent_Session,
                   ds_pcce_termination_call_detail_3.last_ranking Rank_Agent_Session_desc,
                   DENSE_RANK() OVER (PARTITION BY ds_pcce_termination_call_detail.SessionID ,ds_pcce_termination_call_detail_1.AGENTSKILLTARGETID ORDER BY ds_pcce_termination_call_detail.RANK_AGENTASSIGNED) Rank_Agent_Agent,
                   CASE WHEN ds_pcce_termination_call_detail.isAnswerCall=0 THEN 0
                        ELSE DENSE_RANK() OVER (PARTITION BY ds_pcce_termination_call_detail.SessionID, ds_pcce_termination_call_detail.isAnswerCall ORDER BY ds_pcce_termination_call_detail.StartDateTime)
                         END Rank_Agent_Answer,
                   ds_pcce_termination_call_detail_2.Session_Agents, --,ds_pcce_termination_call_detail.*
             ds_pcce_termination_call_detail.AGENT,
                   ds_pcce_termination_call_detail.AGENTNAME,
                   ds_pcce_termination_call_detail.AGENTOFFICE,
                   ds_pcce_termination_call_detail.AGENTPERIPHERALNUMBER,
                   ds_pcce_termination_call_detail.AGENTSKILLTARGETID,
                   ds_pcce_termination_call_detail.ANI,
                   ds_pcce_termination_call_detail.CALLDISPOSITION,
                   ds_pcce_termination_call_detail.CALLDISPOSITIONNAME,
                   ds_pcce_termination_call_detail.CALLTYPEDESCRIPTION,
                   ds_pcce_termination_call_detail.CALLTYPENAME,
                   ds_pcce_termination_call_detail.CONFERENCETIME,
                   ds_pcce_termination_call_detail.DELAYTIME,
                   ds_pcce_termination_call_detail.DIGITSDIALED,
                   ds_pcce_termination_call_detail.DNIS,
                   ds_pcce_termination_call_detail.DURATION,
                   ds_pcce_termination_call_detail.ENDDATETIME,
                   ds_pcce_termination_call_detail.HOLDTIME,
                   ds_pcce_termination_call_detail.IS_SECONDLINE_OFFERED,
                   ds_pcce_termination_call_detail.IS_SECONDLINE_RECEIVED,
                   ds_pcce_termination_call_detail.ISABANDONCALL,
                   ds_pcce_termination_call_detail.ISANSWERCALL,
                   ds_pcce_termination_call_detail.ISINBOUND,
                   ds_pcce_termination_call_detail.ISINTERNALCALL,
                   ds_pcce_termination_call_detail.ISOFFEREDCALL,
                   ds_pcce_termination_call_detail.ISOUTBOUND,
                   ds_pcce_termination_call_detail.ISREDIRECTED,
                   ds_pcce_termination_call_detail.ISRETAILOFFICE,
                   ds_pcce_termination_call_detail.ISRINGGROUPTRANSFER,
                   ds_pcce_termination_call_detail.ISRONAS,
                   ds_pcce_termination_call_detail.ISSPEEDDIAL,
                   ds_pcce_termination_call_detail.ISTRANSFER_ATTEMPT,
                   ds_pcce_termination_call_detail.ISTRANSFER_OFFERED,
                   ds_pcce_termination_call_detail.ISTRANSFER_RECEIVED,
                   ds_pcce_termination_call_detail.LOCALQTIME,
                   ds_pcce_termination_call_detail.NETQTIME,
                   ds_pcce_termination_call_detail.NETWORKTIME,
                   ds_pcce_termination_call_detail.RECOVERYKEY,
                   ds_pcce_termination_call_detail.RINGTIME,
                   ds_pcce_termination_call_detail.ROUTEDSKILLGROUPSKILLTARGETID,
                   ds_pcce_termination_call_detail.ROUTERCALLKEY,
                   ds_pcce_termination_call_detail.ROUTERCALLKEYDAY,
                   ds_pcce_termination_call_detail.SESSIONID,
                   ds_pcce_termination_call_detail.SKILLGROUPTARGETNAME,
                   ds_pcce_termination_call_detail.STARTDATETIME,
                   ds_pcce_termination_call_detail.TALKTIME,
                   ds_pcce_termination_call_detail.TIMETOABAND,
                   ds_pcce_termination_call_detail.VARIABLE1,
                   ds_pcce_termination_call_detail.VARIABLE10,
                   ds_pcce_termination_call_detail.VARIABLE2,
                   ds_pcce_termination_call_detail.VARIABLE3,
                   ds_pcce_termination_call_detail.VARIABLE4,
                   ds_pcce_termination_call_detail.VARIABLE5,
                   ds_pcce_termination_call_detail.VARIABLE6,
                   ds_pcce_termination_call_detail.VARIABLE7,
                   ds_pcce_termination_call_detail.VARIABLE8,
                   ds_pcce_termination_call_detail.VARIABLE9,
                   ds_pcce_termination_call_detail.WORKTIME,
                   ds_pcce_termination_call_detail.DSS_CREATE_TIME,
                   ds_pcce_termination_call_detail.DSS_UPDATE_TIME
              FROM {{ ref('STAGE','BVSTG_PCCE_TERMINATION_CALL_AGENT_SESSION_AU1') }} ds_pcce_termination_call_detail
             INNER JOIN (
                    SELECT SessionID id,
                           AGENTSKILLTARGETID,
                           DENSE_RANK() OVER (PARTITION BY SessionID ORDER BY MIN(STARTDATETIME),MIN(ENDDATETIME),MIN(RECOVERYKEY))ranking
                      FROM {{ ref('STAGE','BVSTG_PCCE_TERMINATION_CALL_AGENT_SESSION_AU1') }}
                     WHERE agentskilltargetid IS NOT NULL
                     GROUP BY id,
                              AGENTSKILLTARGETID
                   )ds_pcce_termination_call_detail_1
                ON (ds_pcce_termination_call_detail_1.id=ds_pcce_termination_call_detail.SessionID AND ds_pcce_termination_call_detail_1.AGENTSKILLTARGETID=ds_pcce_termination_call_detail.AGENTSKILLTARGETID)
             INNER JOIN (
                    SELECT SessionID id,
                           AGENTSKILLTARGETID,
                           DENSE_RANK() OVER (PARTITION BY SessionID ORDER BY MIN(STARTDATETIME) DESC,MIN(ENDDATETIME) DESC,MIN(RECOVERYKEY) DESC)last_ranking
                      FROM {{ ref('STAGE','BVSTG_PCCE_TERMINATION_CALL_AGENT_SESSION_AU1') }}
                     WHERE agentskilltargetid IS NOT NULL
                     GROUP BY id,
                              AGENTSKILLTARGETID
                   )ds_pcce_termination_call_detail_3
                ON (ds_pcce_termination_call_detail_3.id=ds_pcce_termination_call_detail.SessionID AND ds_pcce_termination_call_detail_3.AGENTSKILLTARGETID=ds_pcce_termination_call_detail.AGENTSKILLTARGETID)
             INNER JOIN (
                    SELECT SessionID id,
                           COUNT(DISTINCT AGENTSKILLTARGETID) Session_Agents
                      FROM {{ ref('STAGE','BVSTG_PCCE_TERMINATION_CALL_AGENT_SESSION_AU1') }}
                     WHERE agentskilltargetid IS NOT NULL
                     GROUP BY id
                   )ds_pcce_termination_call_detail_2
                ON ds_pcce_termination_call_detail_2.id=ds_pcce_termination_call_detail.SessionID
             WHERE ds_pcce_termination_call_detail.AGENTSKILLTARGETID IS NOT NULL
               AND (ds_pcce_termination_call_detail.ROUTERCALLKEY >0 OR (ds_pcce_termination_call_detail.ROUTERCALLKEY = 0 AND ds_pcce_termination_call_detail.PERIPHERALCALLTYPE IN (9,38)))
