      join:
        joinCondition: |-
          FROM {{ ref('SILVER', 'I_AuditDetails') }} "I_AuditDetails"
          LEFT JOIN {{ ref('GOLD', 'D_AuditDetails') }} "D_AuditDetails"
            ON "I_AuditDetails"."ID" = "D_AuditDetails"."AuditCode" AND "I_AuditDetails"."ODSSourceSystemName" = "D_AuditDetails"."ODSSourceSystemName"
          LEFT JOIN {{ ref('GOLD', 'D_AuditCategory') }} "D_AuditCategory"
            ON "I_AuditDetails"."AuditCategoryID" = "D_AuditCategory"."AuditCategoryCode" AND "I_AuditDetails"."ODSSourceSystemName" = "D_AuditCategory"."ODSSourceSystemName"
          LEFT JOIN {{ ref('GOLD', 'D_Employee') }} "D_Employee"
            ON "I_AuditDetails"."AuditorEmployeeCode" = "D_Employee"."EmployeeCode"
          LEFT JOIN {{ ref('GOLD', 'D_BusinessUnit') }} "D_BusinessUnit"
            ON "I_AuditDetails"."BusinessUnitCode" = "D_BusinessUnit"."BusinessUnitCode"
          LEFT JOIN {{ ref('GOLD', 'D_DueDate') }} "D_DueDate"
            ON "I_AuditDetails"."ScheduledEndDate" = "D_DueDate"."DueDate"
          LEFT JOIN {{ ref('GOLD', 'D_ActualDate') }} "D_ActualDate"
            ON "I_AuditDetails"."ActualEndDate" = "D_ActualDate"."ActualDate"
          LEFT JOIN {{ ref('GOLD', 'D_AuditStatus') }} "D_AuditStatus"
            ON "I_AuditDetails"."StatusID" = "D_AuditStatus"."AuditStatusCode"
          LEFT JOIN {{ ref('GOLD', 'D_AlternateBusinessUnit') }} "D_AlternateBusinessUnit"
            ON "I_AuditDetails"."AlternativeBusinessUnitCode" = "D_AlternateBusinessUnit"."BusinessUnitCode"
          LEFT JOIN {{ ref('GOLD', 'D_ObligationLocation') }} "D_ObligationLocation"
            ON "I_AuditDetails"."DepotCode" = "D_ObligationLocation"."ObligationLocationCode"
          LEFT JOIN {{ ref('GOLD', 'D_Location') }} "D_Location"
            ON "I_AuditDetails"."DepotCode" = "D_Location"."LocationCode"
