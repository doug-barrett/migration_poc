        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_RULEMATRIX_ACTIVITY') }} (reportingname, resulttype, allocation, rulematrix, eventtype, label, classification, modeid, istrantype, transactiontype, ispoltype, policytype, isfeetype, feetype, haspremium, hasfee, isvoid, iscorporatevoid, hasadditionalproduct, islegacy, isprimaryfee, isresulttype, Rtype, isCGroup, classificationgroup) AS SELECT v_dlbv_ram_reporting_current.reportingname,
                   v_dlbv_ram_reporting_current.resulttype,
                   v_dlbv_ram_rulematrix_activity_current.allocation,
                   v_dlbv_ram_rulematrix_activity_current.rulematrix,
                   v_dlbv_ram_rulematrix_activity_current.eventtype,
                   v_dlbv_ram_rulematrix_activity_current.label,
                   v_dlbv_ram_rulematrix_activity_current.classification,
                   v_dlbv_ram_mode_current.modeid,
                   v_dlbv_ram_rulematrix_activity_current.istrantype,
                   v_dlbv_ram_transactiontype_current.transactiontype,
                   v_dlbv_ram_rulematrix_activity_current.ispoltype,
                   v_dlbv_ram_policytype_current.policytype,
                   v_dlbv_ram_rulematrix_activity_current.isfeetype,
                   v_dlbv_ram_feetype_current.feetype,
                   v_dlbv_ram_rulematrix_activity_current.haspremium,
                   v_dlbv_ram_rulematrix_activity_current.hasfee,
                   v_dlbv_ram_rulematrix_activity_current.isvoid,
                   v_dlbv_ram_rulematrix_activity_current.iscorporatevoid,
                   v_dlbv_ram_rulematrix_activity_current.hasadditionalproduct,
                   v_dlbv_ram_rulematrix_activity_current.islegacy,
                   v_dlbv_ram_rulematrix_activity_current.isprimaryfee,
                   v_dlbv_ram_rulematrix_activity_current.isresulttype,
                   v_dlbv_ram_resulttype_current.resulttype,
                   v_dlbv_ram_rulematrix_activity_current.classificationgroup,
                   v_dlbv_ram_ClassificationGroup_current.classificationgroup
              FROM {{ ref('STAGE','V_DLBV_RAM_REPORTING_CURRENT') }} v_dlbv_ram_reporting_current
              JOIN {{ ref('STAGE','V_DLBV_RAM_REPORTINGMATRIX_CURRENT') }} v_dlbv_ram_reportingmatrix_current
                ON v_dlbv_ram_reporting_current.reportingid = v_dlbv_ram_reportingmatrix_current.reportingid
               AND v_dlbv_ram_reportingmatrix_current.isactive = 1
              JOIN {{ ref('STAGE','V_DLBV_RAM_RULEMATRIX_ACTIVITY_CURRENT') }} v_dlbv_ram_rulematrix_activity_current
                ON v_dlbv_ram_reportingmatrix_current.rulematrix = v_dlbv_ram_rulematrix_activity_current.rulematrix
               AND v_dlbv_ram_rulematrix_activity_current.isactive = 1
              LEFT JOIN {{ ref('STAGE','V_DLBV_RAM_MODE_CURRENT') }} v_dlbv_ram_mode_current
                ON v_dlbv_ram_rulematrix_activity_current.rulematrix = v_dlbv_ram_mode_current.mappingid
               AND v_dlbv_ram_mode_current.isactive = 1
              LEFT JOIN {{ ref('STAGE','V_DLBV_RAM_TRANSACTIONTYPE_CURRENT') }} v_dlbv_ram_transactiontype_current
                ON v_dlbv_ram_rulematrix_activity_current.rulematrix = v_dlbv_ram_transactiontype_current.mappingid
               AND v_dlbv_ram_transactiontype_current.isactive = 1
              LEFT JOIN {{ ref('STAGE','V_DLBV_RAM_POLICYTYPE_CURRENT') }} v_dlbv_ram_policytype_current
                ON v_dlbv_ram_rulematrix_activity_current.rulematrix = v_dlbv_ram_policytype_current.mappingid
               AND v_dlbv_ram_policytype_current.isactive = 1
              LEFT JOIN {{ ref('STAGE','V_DLBV_RAM_FEETYPE_CURRENT') }} v_dlbv_ram_feetype_current
                ON v_dlbv_ram_rulematrix_activity_current.rulematrix = v_dlbv_ram_feetype_current.mappingid
               AND v_dlbv_ram_feetype_current.isactive = 1
              LEFT JOIN {{ ref('STAGE','V_DLBV_RAM_RESULTTYPE_CURRENT') }} v_dlbv_ram_resulttype_current
                ON v_dlbv_ram_rulematrix_activity_current.rulematrix = v_dlbv_ram_resulttype_current.mappingid
               AND v_dlbv_ram_resulttype_current.isactive = 1
              LEFT JOIN {{ ref('STAGE','V_DLBV_RAM_CLASSIFICATIONGROUP_CURRENT') }} v_dlbv_ram_ClassificationGroup_current
                ON v_dlbv_ram_rulematrix_activity_current.RuleMatrix = v_dlbv_ram_ClassificationGroup_current.MappingID
               AND v_dlbv_ram_ClassificationGroup_current.isActive = 1
             WHERE v_dlbv_ram_reporting_current.isActive = 1 ;
