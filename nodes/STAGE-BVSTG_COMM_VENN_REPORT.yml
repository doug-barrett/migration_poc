        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_COMM_AU5_VENN_REPORT') }} bvstg_comm_au5_venn_report
              LEFT JOIN (SELECT POLICYNUMBERFORMATTED,
                   CARRIERNAME,
                   TRANSACTION_GROUP,
                   CREATED,
                   TRANSACTIONID,
                   SOURCE_TABLE
              FROM (SELECT POLICYNUMBERFORMATTED,
                   CASE WHEN CARRIERNAME IN ('Infinity', 'Kemper') THEN 'Infinity/Kemper'
                        WHEN CARRIERNAME IN ('Bristol West')       THEN 'Bristol West/Foremost'
                        WHEN CARRIERNAME = 'Legacy'                THEN 'Legacy/Nevada General'
                        ELSE CARRIERNAME
                         END AS CARRIERNAME,
                   TRANSACTION_GROUP,
                   CREATED,
                   LASTUPDATED,
                   TRANSACTIONID,
                   CASE WHEN sourcetable='tran'            THEN 'S_AP1_TRANSACTION_MROC'
                        WHEN sourcetable='tranitem'        THEN 'S_AP1_TRANSACTIONITEM_MROC'
                        WHEN sourcetable='cdt_policy'      THEN 'S_AP1_CDTPOLICY'
                        WHEN sourcetable='psc_tab'         THEN 'S_AP1_POLICYSTATUSCHANGE_MROC'
                        WHEN sourcetable='trandetail_ams'  THEN 'DS_AMS_TRANSACTIONDETAIL'
                        WHEN sourcetable='splc_policytran' THEN 'DS_SPLC_POLICYTRANSACTION'
                         END AS SOURCE_TABLE,
                   CASE WHEN transaction_group = 'Reinstatement'                            THEN 1
                        WHEN transaction_group = 'Cancellation'                             THEN 2
                        WHEN transaction_group IN ('Endorsement', 'New Business','Renewal') THEN 3
                        WHEN transaction_group = 'Other-Inactive'                           THEN 4
                        WHEN transaction_group = 'Other-Active'                             THEN 5
                        WHEN transaction_group IS NULL                                      THEN 6
                         END AS preference_order -- from "RETAIL_PROD"."SCH_BVSTAGE"."BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT"      FROM {{ ref('STAGE','BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT') }}         where description not in ('CancelPending', 'Void','Expired')     )    qualify  row_number() over (partition by policynumberformatted,carriername,transaction_group,date(created) order by lastupdated desc,preference_order)=1      ) as BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT      on bvstg_comm_au5_venn_report.policynumberformatted=BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT.policynumberformatted      and bvstg_comm_au5_venn_report.carrier=BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT.carriername      and bvstg_comm_au5_venn_report.last_txn_date_cdt=date(BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT.created)      and bvstg_comm_au5_venn_report.Last_txn_cdt=BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT.transaction_group         left join      (select distinct policynumberformatted, carrierdisplayname, count (distinct customerid)  No_Customers       --from "RETAIL_PROD"."SCH_EDW"."DS_POLICYSUMMARY_V2" as ds_policysummary_v2       FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2    left join          (select distinct policynumber_Edw, carriername_Edw, policynumberformatted, carrierdisplayname          -- from "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES"     FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}          ) as ds_bvstg_comm_policynumberformatting_allsources          on ds_bvstg_comm_policynumberformatting_allsources.policynumber_edw = ds_policysummary_v2.policynumber          and ds_bvstg_comm_policynumberformatting_allsources.carriername_edw = ds_policysummary_v2.carriername       group by policynumberformatted, carrierdisplayname      ) as DS_POLICYSUMMARY_V2       ON BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT.policynumberformatted = DS_POLICYSUMMARY_V2.policynumberformatted      and BVSTG_COMM_AU2_POLICY_STATUS_EXTRACT_CDT.carriername = DS_POLICYSUMMARY_V2.carrierdisplayname       left join     (select distinct policynumberformatted,carrier      -- from RETAIL_PROD.SCH_BVSTAGE.V_BVSTG_COMM_MIGRATEDPOLICIES     from {{ ref('UNKNOWN','V_BVSTG_COMM_MIGRATEDPOLICIES') }}      ) as v_bvstg_comm_migratedpolicies      on bvstg_comm_au5_venn_report.policynumberformatted = v_bvstg_comm_migratedpolicies.policynumberformatted      and bvstg_comm_au5_venn_report.CARRIER = v_bvstg_comm_migratedpolicies.CARRIER     left join   (select distinct policynumberformatted,carrier,islegacytransaction   --from RETAIL_PROD.SCH_EDW.DS_COMM_EOM_EXTRACT_ALLSOURCES) DS_COMM_EOM_EXTRACT_ALLSOURCES   from [TABLEOWNER].[DS_COMM_EOM_EXTRAC
