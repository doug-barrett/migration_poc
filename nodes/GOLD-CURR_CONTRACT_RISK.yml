          LEFT JOIN {{ ref(''BRONZE'', ''CODE_DESC'') }} code_desc ON code_desc.CODESC_CODE = mrv_iics_mt_conformed_mrvcons_current_contract_risk.FULL_DAY_CVRG_CODE

