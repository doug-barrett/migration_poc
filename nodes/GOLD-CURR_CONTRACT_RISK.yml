          LEFT JOIN {{ ref(''BRONZE'', ''RISK_WAIT_PERIOD'') }} risk_wait_period ON risk_wait_period.CODE = mrv_iics_mt_conformed_mrvcons_current_contract_risk.RISK_WAIT_PERIOD AND risk_wait_period.CODE = mrv_iics_mt_conformed_mrvcons_current_contract_risk.LKP_PRODUCT_SYSTEM_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''ILLNESS_PAY_PERIOD'') }} illness_pay_period ON illness_pay_period.CODE = mrv_iics_mt_conformed_mrvcons_current_contract_risk.ILLNESS_PAY_PERIOD_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''FREQ'') }} freq ON freq.CODE = mrv_iics_mt_conformed_mrvcons_current_contract_risk.SUM_INSRD_FREQ_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''FREQ_DESC'') }} freq_desc ON freq_desc.CODE = mrv_iics_mt_conformed_mrvcons_current_contract_risk.FREQ_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''MRV_REF360_ASSESS_V'') }} mrv_ref360_assess_v ON mrv_ref360_assess_v.CODE = mrv_iics_mt_conformed_mrvcons_current_contract_risk.ASSESS_CODE

          LEFT JOIN {{ ref(''BRONZE'', ''MRV_REF360_OCCUPATION_CLASS_V'') }} mrv_ref360_occupation_class_v ON mrv_ref360_occupation_class_v.CODE = mrv_iics_mt_conformed_mrvcons_current_contract_risk.OCUTPN_CLASS_CODE

