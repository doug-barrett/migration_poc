        customSQL:
          customSQL: ""
        dependencies:
          - locationName: UNKNOWN
            nodeName: V_BVSTG_ASSIGNED_TO_COLLECTIONS
        join:
          joinCondition: |-
            FROM DATA_LAKE.BIA_ANALYTICS.V_BVSTG_ASSIGNED_TO_COLLECTIONS_V2 V_BVSTG_ASSIGNED_TO_COLLECTIONS
              LEFT JOIN (
                    SELECT DISTINCT *
                      FROM DATA_LAKE.BIA_ANALYTICS.V_BVSTG_COLLECTED_BY_ROLES
                   ) V_BVSTG_COLLECTED_BY_ROLES
                ON V_BVSTG_COLLECTED_BY_ROLES.ID = V_BVSTG_ASSIGNED_TO_COLLECTIONS.ID
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY DS_AP1_TRANSACTIONSUMMARY
                ON V_BVSTG_ASSIGNED_TO_COLLECTIONS.TransactionID = DS_AP1_TRANSACTIONSUMMARY.transactionid
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 DS_CUSTOMERSUMMARY_V2
                ON DS_AP1_TRANSACTIONSUMMARY.CUSTOMERID = DS_CUSTOMERSUMMARY_V2.CUSTOMERID
               AND DS_CUSTOMERSUMMARY_V2.sourcedb = 'AppOne'
              LEFT JOIN (
                    SELECT policyid,
                           COUNT(DISTINCT POLICYID, lower(firstname), lower(lastname)) Driver_count
                      FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_DVC_DRIVER_SOURCE
                     WHERE sourcedb = 'AppOne'
                       AND date(CREATED) >= '2022-01-01'
                       AND isrowdeleted = 0
                       AND status = 'Active'
                       AND isexcluded = 0
                     GROUP BY 1
                   ) driver
                ON DS_AP1_TRANSACTIONSUMMARY.policyid = driver.policyid
              LEFT JOIN (
                    SELECT POLICYID,
                           MIN_BY(MAKE, RANKING) MAKE,
                           MIN_BY(MODEL, RANKING) MODEL,
                           MIN_BY(BODYTYPE, RANKING) BODYTYPE,
                           MIN_BY(VEHICLEYEAR, RANKING) VEHICLEYEAR,
                           count(DISTINCT POLICYVEHICLEID) AS Vehicle_Count
                      FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_DVC_VEHICLE_SOURCE
                     WHERE sourcedb = 'AppOne'
                       AND status = 'Active'
                       AND isrowdeleted = 0
                       AND date(CREATED) >= '2022-01-01'
                     GROUP BY 1
                   ) vehicle
                ON DS_AP1_TRANSACTIONSUMMARY.policyid = vehicle.policyid
              LEFT JOIN (
                    SELECT policyid,
                           MAX(CASE WHEN COVERAGETYPEDISPLAYNAME = 'Collision' THEN DEDUCTIBLE END) Collision_Deductible,
                           MAX(CASE WHEN COVERAGETYPEDISPLAYNAME = 'Comprehensive' THEN DEDUCTIBLE END) Comprehensive_Deductible
                      FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_DVC_COVERAGE_SOURCE
                     WHERE date(created) >= '2022-01-01'
                       AND sourcedb = 'AppOne'
                       AND status = 'Active'
                       AND isrowdeleted = 0
                       AND coveragetypedisplayname IN ('Collision','Comprehensive')
                     GROUP BY 1
                   ) coverage
                ON DS_AP1_TRANSACTIONSUMMARY.policyid = coverage.policyid
             WHERE --V_BVSTG_ASSIGNED_TO_COLLECTIONS.date_in_collections >= '2023-01-01' AND       V_BVSTG_ASSIGNED_TO_COLLECTIONS.ISACTIVE = 'True'      AND V_BVSTG_ASSIGNED_TO_COLLECTIONS.ASSIGN_STATUS  = 'Assigned'      AND V_BVSTG_COLLECTED_BY_ROLES.ID IS NULL
        name: BVSTG_COLLECTIONS_ASSIGNED_QUERY
        noLinkRefs: []
