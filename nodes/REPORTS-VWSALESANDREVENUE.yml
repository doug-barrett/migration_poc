      config: {}
      dataType: VARCHAR
      description: SUPPLIER NAME TO BE USED ON FINANCIAL REPORTS
      name: FinancialReportingSupplierName
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: |-
          CASE
          \N    WHEN CONTRACT.VERTICAL <> 'FOOD AND NUTRITION' THEN
          \N        LTRIM(RTRIM(
          \N            COALESCE(
          \N                NULLIF(VWSYSCOCHECK.FINANCIALREPORTINGSUPPLIERNAME, 'UNKNOWN'),
          \N                NULLIF(CONTRACT.FINANCIALREPORTINGSUPPLIERNAME, 'UNKNOWN'),
          \N                NULLIF(SUPPLIER.REPORTINGSUPPLIERNAME, 'UNKNOWN'),
          \N                SALESANDREVENUE.SUPPLIERNAME
          \N            )
          \N        ))
          \NWHEN CONTRACT.SOURCEENTITYNAME = 'PREMIER' AND CONTRACT.CONTRACTNUMBER NOT LIKE'%PP-DI%' THEN CONTRACT.FINANCIALREPORTINGSUPPLIERNAME
          \NWHEN CONTRACT.SOURCEENTITYNAME ='VIZIENT' AND (CONTRACT.CONTRACTNUMBER NOT LIKE '%FD%'AND CONTRACT.CONTRACTNUMBER NOT LIKE '%FX%') THEN CONTRACT.FINANCIALREPORTINGSUPPLIERNAME
          \NWHEN CONTRACT.SOURCEENTITYNAME = 'PREMIER' THEN 'US FOODS, INC. - PREMIER'
          \N    WHEN CONTRACT.SOURCEENTITYNAME = 'VIZIENT' AND CONTRACT.SUPPLIERNAME = 'SYSCO CORPORATION' THEN 'SYSCO CORPORATION'
          \NWHEN SUPPLIER.SUPPLIERNAME = 'US FOODS, INC. - VIZIENT' THEN CONTRACT.FINANCIALREPORTINGSUPPLIERNAME
          \N
          \N    WHEN CONTRACT.SOURCEENTITYNAME = 'VIZIENT' AND VWSYSCOCHECK.FORCEID =ACCOUNT.FORCEID THEN 'SYSCO CORPORATION'
          \N    WHEN CONTRACT.SOURCEENTITYNAME = 'VIZIENT' THEN 'US FOODS, INC. - VIZIENT'
          \N    ELSE
          \N        LTRIM(RTRIM(
          \N            COALESCE(
          \N                NULLIF(VWSYSCOCHECK.FINANCIALREPORTINGSUPPLIERNAME, 'UNKNOWN'),
          \N                NULLIF(CONTRACT.FINANCIALREPORTINGSUPPLIERNAME, 'UNKNOWN'),
          \N                NULLIF(SUPPLIER.REPORTINGSUPPLIERNAME, 'UNKNOWN'),
          \N                SALESANDREVENUE.SUPPLIERNAME
          \N            )
          \N        ))
          \NEND AS FINANCIALREPORTINGSUPPLIERNAME
