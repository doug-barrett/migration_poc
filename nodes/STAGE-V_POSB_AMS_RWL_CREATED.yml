          BVSTG_AMS_AU3_BASICPOL_INFO: 1ad8f9e0-3c95-4fc3-be6d-542153f7eca9
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_AMS_RWL_CREATED') }} AS SELECT a.PolID,
                   MIN(a.ENTEREDDATE)ENTEREDDATE
              FROM(
                    SELECT a.PolID,
                           b.ENTEREDDATE,
                           b.BACKINVTPID,
                           b.NEWINVTPID
                      FROM {{ ref('DATA_VAULT','S_AMS_INVOICE') }} a
                     INNER JOIN {{ ref('DATA_VAULT','H_INVOICE') }} a1
                        ON a.HK_H_INVOICE = a1.HK_H_INVOICE
                     INNER JOIN {{ ref('DATA_VAULT','S_AMS_INVOICETRANSACTION_MROC') }} b
                        ON a1.INVID = b.INVID
                     WHERE a.PolID IN(
                            SELECT PolID
                              FROM {{ ref('STAGE','BVSTG_AMS_AU3_BASICPOL_INFO') }}
                             WHERE ModeID = 14
                           )
                       AND LINEOFBUS='AUTOP'
                       AND TRANTYPE='RWL' QUALIFY ROW_NUMBER() OVER (PARTITION BY a.HK_H_INVOICE,HK_H_INVOICETRANSACTION ORDER BY a.DSS_VERSION DESC,b.DSS_VERSION DESC)=1
                   ) a
             INNER JOIN {{ ref('STAGE','BVSTG_AMS_AU3_BASICPOL_INFO') }} b
                ON a.PolID = b.PolID
               AND b.ModeID = 14
             GROUP BY a.PolID
            HAVING DATEDIFF(DAY,MIN(DATE(a.ENTEREDDATE)), MIN(b.entereddate)) BETWEEN 1 AND 90
        dependencies:
