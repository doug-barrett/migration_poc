      config: {}
      dataType: VARCHAR(15)
      description: Business Key for the subsequent Dimension
      name: CompetencyStatusCode
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN SOURCEDATA = 'CERTIFICATION' THEN     CASE WHEN DAYSTOEXPIRE
          < 0 THEN '30' --EXPIRED          WHEN DAYSTOEXPIRE <= 90 THEN '20' --EXPIRING          ELSE
          '10' END --CURRENT + 90   WHEN SOURCEDATA = 'TRAINING' THEN     CASE WHEN
          DAYSTOEXPIRE > -90 THEN '50' --IN TRAINING, BUT STILL CLOSE TO START DATE,
          SO EXCLUDE          ELSE '40' END --IN TRAINING, BUT NO CERTIFICATION   WHEN
          SOURCEDATA = 'PATHWAY' THEN     CASE WHEN DAYSTOEXPIRE > -90 THEN '70' --REQUIRED,
          BUT STILL CLOSE TO START DATE, SO EXCLUDE          ELSE '60' END --REQUIRED,
          BUT NO RECORDS CURRENTLY   ELSE 'UNKNOWN' END
