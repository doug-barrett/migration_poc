        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_AL3_COVERAGES_CURRENT') }} AS SELECT ds_al3_coverages.hk_h_sweeplogs ,
                   ds_al3_coverages.hk_h_personalautomobilecoverageandadjustmentsgroup ,
                   ds_al3_coverages.id ,
                   ds_al3_coverages.createddate ,
                   ds_al3_coverages.al3_effectivedate ,
                   ds_al3_coverages.transactionsequencenumber ,
                   ds_al3_coverages.policynumber ,
                   ds_al3_coverages.policyeffectivedate ,
                   ds_al3_coverages.policyexpirationdate ,
                   ds_al3_coverages.customerid ,
                   ds_al3_coverages.policyid ,
                   ds_al3_coverages.coveragecodepersonalautomobile ,
                   ds_al3_coverages.rate ,
                   ds_al3_coverages.fulltermpremium ,
                   ds_al3_coverages.formnumber ,
                   ds_al3_coverages.limit1 ,
                   ds_al3_coverages.limit2 ,
                   ds_al3_coverages.deductible1discountorsurcharge ,
                   ds_al3_coverages.coveragecodedescription ,
                   ds_al3_coverages.coverageeffectivedate ,
                   ds_al3_coverages.coverageexpirationdate ,
                   ds_al3_coverages.formeditiondate ,
                   ds_al3_coverages.coverage_createddate
              FROM {{ ref('EDW','DS_AL3_COVERAGES') }} ds_al3_coverages
             INNER JOIN (
                    SELECT DISTINCT u.policyid,
                           u.id,
                           RANK() OVER (PARTITION BY u.policyid ORDER BY u.al3_effectivedate DESC,u.TRANSACTIONSEQUENCENUMBER DESC,u.id DESC) Ranking
                      FROM {{ ref('EDW','DS_AL3_COVERAGES') }} u
                   )uniqueid
                ON (ds_al3_coverages.policyid = uniqueid.policyid AND ds_al3_coverages.id = uniqueid.id AND uniqueid.Ranking = 1)=1
