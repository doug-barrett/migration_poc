        join:
          joinCondition: |-
            FROM {{ ref('DATA_VAULT','H_BASICPOLINFO') }} h_basicpolinfo
              JOIN {{ ref('STAGE','V_S_AMS_BASICPOLINFO_MROC_CURRENT') }} v_s_ams_basicpolinfo_mroc_current
                ON h_basicpolinfo.HK_h_basicpolinfo = v_s_ams_basicpolinfo_mroc_current.HK_h_basicpolinfo
              JOIN {{ ref('DATA_VAULT','L_BASICPOLINFO_POLICYTRANSACTION') }} l_basicpolinfo_policytransaction
                ON h_basicpolinfo.HK_h_basicpolinfo = l_basicpolinfo_policytransaction.HK_h_basicpolinfo
              JOIN {{ ref('DATA_VAULT','H_POLICYTRANSACTION') }} h_policytransaction
                ON l_basicpolinfo_policytransaction.HK_h_policytransaction = h_policytransaction.HK_h_policytransaction
              JOIN {{ ref('STAGE','V_S_AMS_POLICYTRANSACTION_MROC_CURRENT') }} v_s_ams_policytransaction_mroc_current
                ON h_policytransaction.HK_h_policytransaction = v_s_ams_policytransaction_mroc_current.HK_h_policytransaction
              JOIN {{ ref('DATA_VAULT','L_BASICPOLINFO_LINEOFBUSINESS') }} l_basicpolinfo_lineofbusiness
                ON h_basicpolinfo.HK_h_basicpolinfo = l_basicpolinfo_lineofbusiness.HK_h_basicpolinfo
              JOIN {{ ref('DATA_VAULT','H_LINEOFBUSINESS') }} h_lineofbusiness
                ON l_basicpolinfo_lineofbusiness.HK_h_lineofbusiness = h_lineofbusiness.HK_h_lineofbusiness
              JOIN {{ ref('DATA_VAULT','L_LOBSETUP_LINEOFBUSINESS') }} l_lobsetup_lineofbusiness
                ON h_lineofbusiness.HK_h_lineofbusiness = l_lobsetup_lineofbusiness.HK_h_lineofbusiness
              JOIN {{ ref('DATA_VAULT','H_LOBSETUP') }} h_lobsetup
                ON l_lobsetup_lineofbusiness.HK_h_lobsetup = h_lobsetup.HK_h_lobsetup
              JOIN {{ ref('STAGE','V_S_AMS_LINEOFBUSINESS_MROC_CURRENT') }} v_s_ams_lineofbusiness_mroc_current
                ON h_lineofbusiness.HK_h_lineofbusiness = v_s_ams_lineofbusiness_mroc_current.HK_h_lineofbusiness
              JOIN {{ ref('STAGE','V_S_AMS_LOBSETUP_MROC_CURRENT') }} v_s_ams_lobsetup_mroc_current
                ON h_lobsetup.HK_h_lobsetup = v_s_ams_lobsetup_mroc_current.HK_h_lobsetup
             WHERE --v_s_ams_basicpolinfo_mroc_current.PolEffDate = v_s_ams_policytransaction_mroc_current.EffDate  --AND  (   (v_s_ams_lobsetup_mroc_current.INCOMEGRPLOBS = 'PC' AND h_lobsetup.NAMELOBS != 'AUTOP')      OR      (v_s_ams_lobsetup_mroc_current.INCOMEGRPLOBS = 'OP')      OR       (h_lobsetup.NAMELOBS = 'AUTOP')    )  AND v_s_ams_basicpolinfo_mroc_current.status != 'D'  AND v_s_ams_basicpolinfo_mroc_current.cotype != 'S'  AND v_s_ams_lineofbusiness_mroc_current.expdate >= TO_DATE('9999-01-01')
