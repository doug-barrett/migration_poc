    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT cdrc.*,
                           CASE WHEN mastercarrierid IN (3, 160, 355, 356, 359, 360) THEN ltrim(trim(ifnull(pgr_codes.ProducerCode, cdrc.ProducerCode)), '0')
                                ELSE "DATA_LAKE"."BIA_ANALYTICS".ProducerCode_Format_CDRC(cdrc.producercode, cdrc.producercode2, cdrc.mastercarrierid)
                                 END ProducerCode_Updated
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT cdrc
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_BVSTG_COMM_PRODUCERCODE_MANUAL_MAPPING pgr_codes
                        ON cdrc.producercode = pgr_codes.propertycode
                   ) v_dlbv_comm_carrierdatarepositorycomplete_current
              LEFT JOIN ( SELECT DISTINCT *
              FROM ( SELECT DISTINCT *,
                   CASE WHEN count(DISTINCT ifnull(officecode, 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) = 1 AND count(DISTINCT ifnull(to_varchar(generalledgernumber), 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) = 1                                                                                                                                                                                                                                                                                                  THEN 'CAMS'
                        WHEN count(DISTINCT ifnull(officecode, 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) > 1 AND count(DISTINCT ifnull(to_varchar(generalledgernumber), 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) = 1 AND (count(DISTINCT ifnull(to_varchar(dss_update_time), 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) > 1 OR count(DISTINCT ifnull(isactive, 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) > 1)                                                        THEN 'CAMS'
                        WHEN count(DISTINCT ifnull(officecode, 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) >= 1 AND count(DISTINCT ifnull(to_varchar(generalledgernumber), 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) > 1 AND mastercarrierid >= 353 AND mastercarrierid <= 374 AND (count(DISTINCT ifnull(to_varchar(dss_update_time), 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) > 1 OR count(DISTINCT ifnull(isactive, 'Missing')) OVER (PARTITION BY mastercarrierid, producercode_cams) > 1) THEN 'CAMS'
                        ELSE 'Policy Bridge Table'
                         END AS mapping_preference
              FROM ( SELECT DISTINCT MASTERCARRIERID,
                   CARRIERNAME,
                   to_number(businessentitycode, 3, 0) GENERALLEDGERNUMBER,
                   trim(v_dlbv_comm_carrierproducercode_current.OFFICECODE) Officecode,
                   PRODUCERCODE,
                   "DATA_LAKE"."BIA_ANALYTICS".ProducerCode_Format_CAMS(Producercode, producersubcode, MASTERCARRIERID) PRODUCERCODE_CAMS,
                   PRODUCERSUBCODE,
                   ds_retail_office.IsFranchise,
                   ds_retail_office.Channel,
                   ds_retail_office.statecode statecode,
                   v_dlbv_comm_carrierproducercode_current.dss_update_time,
                   v_dlbv_comm_carrierproducercode_current.ISACTIVE
              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_COMM_CARRIERPRODUCERCODE_CURRENT
              LEFT JOIN (
                    SELECT DISTINCT MASTERCARRIERID,
                           CARRIERNAME
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_COMM_MASTERCARRIER_CURRENT
                   ) v_dlbv_comm_mastercarrier_current
                ON v_dlbv_comm_carrierproducercode_current.carrierid = v_dlbv_comm_mastercarrier_current.mastercarrierid
              LEFT JOIN (
                    SELECT *,
                           CASE WHEN TERRITORYMANAGERNAME = 'Michael Sanchez' THEN 'True'
                                ELSE 'False'
                                 END ISFRANCHISE
                      FROM RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE
                   ) ds_retail_office
                ON trim(v_dlbv_comm_carrierproducercode_current.officecode) = ds_retail_office.officecode
             WHERE v_dlbv_comm_carrierproducercode_current.CARRIERID > 0
               AND v_dlbv_c
