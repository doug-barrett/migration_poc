    sourceMapping:
    - aliases:
        CDC_CSHSHPFL: f42262a8-d714-526e-938c-dfeb2362ef8c
        PARTY: 3a625579-b31e-596c-b22c-35345677b3b7
        ADDRESS: 90cc3016-dd03-5a43-885f-e199d834b092
      customSQL:
        customSQL: ''
      dependencies:
      - locationName: GOLD
        nodeName: CDC_CSHSHPFL
      - locationName: GOLD
        nodeName: PARTY
      - locationName: GOLD
        nodeName: ADDRESS
      join:
        joinCondition: "FROM {{ ref('GOLD', 'CDC_CSHSHPFL') }} \"CDC_CSHSHPFL\"\n\
          LEFT OUTER JOIN {{ ref('GOLD', 'PARTY') }} \"PARTY\"\n ON   CDC_CSHSHPFL.CSCMP\
          \ = PARTY.COMPANY_CODE\n AND  CDC_CSHSHPFL.CUSTOMER_ACCOUNT_CHAR = PARTY.CUSTOMER_ACCOUNT_CHAR\n\
          \ AND  CDC_CSHSHPFL.CUSTOMER_ACCOUNT_NUM = PARTY.CUSTOMER_ACCOUNT_NUM\n\
          \ AND  PARTY.PARTY_TYPE_CODE = 2\n AND  PARTY.DSS_CURRENT_FLAG = 'Y'\n\n\
          LEFT OUTER JOIN {{ ref('GOLD', 'ADDRESS') }} \"ADDRESS\"\n ON  ADDRESS.ADDRESS_TYPE_CODE='M'\n\
          \ AND UPPER(CDC_CSHSHPFL.CSCMP) = UPPER(ADDRESS.COMPANY_CODE)\n AND UPPER(CDC_CSHSHPFL.CSADR1)\
          \ = UPPER(ADDRESS.ADDRESS_TEXT_1)\n AND UPPER(CDC_CSHSHPFL.CSADR2) = UPPER(ADDRESS.ADDRESS_TEXT_2)\n\
          \ AND UPPER(CDC_CSHSHPFL.CSCITY) = UPPER(ADDRESS.CITY_CODE)\n AND UPPER(CDC_CSHSHPFL.CSST)\
          \ = UPPER(ADDRESS.STATE_CODE)\n AND UPPER(CDC_CSHSHPFL.CSZIP) = UPPER(ADDRESS.POSTAL_CODE)\n\
          AND ADDRESS.Country_Code = ''\n\nLEFT OUTER JOIN {{ ref('GOLD', 'ADDRESS')\
          \ }} \"ADDRESS_1\"\n ON  ADDRESS_1.ADDRESS_TYPE_CODE='T'\n AND UPPER(CDC_CSHSHPFL.CSCMP)\
          \ = UPPER(ADDRESS_1.COMPANY_CODE)\n AND CDC_CSHSHPFL.CSAREA = ADDRESS_1.Area_Code\n\
          \ AND CDC_CSHSHPFL.CSPHON = ADDRESS_1.PHONE_NUM"
