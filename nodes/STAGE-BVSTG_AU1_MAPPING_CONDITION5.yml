        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT DISTINCT casetable_insured_one.*,
                           ram_retail_repository_aa.new_id,
                           NULL AS id,
                           ram_retail_repository_aa.policyid AS policyid_rr,
                           ram_retail_repository_aa.transactionid,
                           ram_retail_repository_aa.policynumber,
                           ram_retail_repository_aa.carriername,
                           ram_retail_repository_aa.primaryagentultipro_broker,
                           ram_retail_repository_aa.customerid,
                           ram_retail_repository_aa.createddate,
                           ram_retail_repository_aa.transactiondate,
                           ram_retail_repository_aa.leadid,
                           ram_retail_repository_aa.final_txn,
                           ram_retail_repository_aa.ram_retail_cisco_loginname,
                           5 AS mapping_preference
                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CASETABLE_INSURED_ONE casetable_insured_one
                     INNER JOIN (
                            SELECT DISTINCT *
                              FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_transactional_data_io
                             WHERE customerid IS NOT NULL
                               AND ram_retail_cisco_loginname IS NOT NULL
                               AND transactionid IS NOT NULL
                               AND new_id NOT IN (
                                    SELECT DISTINCT new_id
                                      FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_au1_mapping_condition1
                                     UNION SELECT DISTINCT new_id
                                      FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_au1_mapping_condition2
                                     UNION SELECT DISTINCT new_id
                                      FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_au1_mapping_condition3
                                     UNION SELECT DISTINCT new_id
                                      FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_au1_mapping_condition4
                                   )
                           ) AS ram_retail_repository_aa
                        ON trim(lower(ram_retail_repository_aa.primaryagentultipro_broker))=trim(lower(casetable_insured_one.PRIMARY_EMPLOYEE_CODE))
                       AND trim(lower(ram_retail_repository_aa.policynumber))=trim(lower(casetable_insured_one.policy_number_final))
                       AND trim(lower(ram_retail_repository_aa.leadid))=trim(lower(casetable_insured_one.lmsid_final))
                     WHERE ram_retail_repository_aa.createddate BETWEEN casetable_insured_one.CREATION_DATE AND IFNULL(date(casetable_insured_one.WON_LOST_DATE)+ INTERVAL '1 DAY', date(CONVERT_TIMEZONE('UTC',CURRENT_DATE ())))
                   ) BVSTG_CASETABLE_INSURED_ONE
             WHERE deal_id NOT IN (SELECT DISTINCT deal_id
              FROM (SELECT DISTINCT deal_id
              FROM ( SELECT DISTINCT casetable_insured_one.*,
                   ram_retail_repository_aa.new_id,
                   NULL AS id,
                   ram_retail_repository_aa.policyid AS policyid_rr,
                   ram_retail_repository_aa.transactionid,
                   ram_retail_repository_aa.policynumber,
                   ram_retail_repository_aa.carriername,
                   ram_retail_repository_aa.primaryagentultipro_broker,
                   ram_retail_repository_aa.customerid,
                   ram_retail_repository_aa.createddate,
                   ram_retail_repository_aa.transactiondate,
                   ram_retail_repository_aa.leadid,
                   ram_retail_repository_aa.final_txn,
                   ram_retail_repository_aa.ram_retail_cisco_loginname,
                   5 AS mapping_preference
              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_CASETABLE_INSURED_ONE casetable_insured_one
             INNER JOIN (
                    SELECT DISTINCT *
                      FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_transactional_data_io
                     WHERE customerid IS NOT NULL
                       AND ram_retail_cisco_loginname IS NOT NULL
                       AND transactionid IS NOT NULL
                       AND new_id NOT IN (
                            SELECT DISTINCT new_id
                              FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_au1_mapping_condition1
                             UNION SELECT DISTINCT new_id
                              FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_au1_mapping_condition2
                             UNION SELECT DISTINCT new_id
                              FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_au1_mapping_condition3
                             UNION SELECT DISTINCT new_id
                              FROM RETAIL_DEV.SCH_BVSTAGE.bvstg_au1_mapping_condition4
                           )
                   ) AS ram_retail_repository_aa
                ON trim(lower(ram_retail_repository_aa.primaryagentultipro_broker))=trim(lower(casetable_insured_one.PRIMARY_EMPLOYEE_CODE))
               AND trim(lower(ram_retail_repository_aa.policynumber))=trim(lower(casetable_insured_one.policy_number_final))
               AND trim(lower(ram_retail_repository_aa.leadid))=trim(lower(casetable_insured_one.lmsid_final))
             WHERE ram_retail_repository_aa.createddate BETWEEN cas
