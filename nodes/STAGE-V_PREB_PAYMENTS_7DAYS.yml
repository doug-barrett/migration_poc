    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          V_PREB_TRANSACTIONITEMS_7DAYS: b68200e9-c624-459b-a2ac-58188e5181d3
          DS_POLICYSUMMARY_V2: 9a05931f-0fe2-4275-8b38-8e88eb9c6968
          DS_RAM_RETAIL_REPOSITORY: 39a9b6bb-124a-4925-91e8-c1b9157d7e95
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref('STAGE','V_PREB_TRANSACTIONITEMS_7DAYS') }} AS SELECT ds_policysummary_v2.PolicyID,
                   SUM(CASE WHEN LABEL = 'Endorsements Fee' THEN AMOUNT ELSE 0 END) AS ENDORSEMENTFEE_7DAYS,
                   SUM(CASE WHEN LABEL = 'Monthly Payments Fee' THEN AMOUNT ELSE 0 END) AS MONTHLYPAYMENTFEE_7DAYS,
                   SUM(CASE WHEN LABEL = 'Reinstatement Fee' THEN AMOUNT ELSE 0 END) AS REINSTATEMENTFEE_7DAYS,
                   SUM(CASE WHEN LABEL = 'Documentation Fee' THEN AMOUNT ELSE 0 END) AS DOCFEE_7DAYS,
                   SUM(CASE WHEN LABEL = 'SR-22 Fee' THEN AMOUNT ELSE 0 END) AS SR22FEE_7DAYS,
                   SUM(CASE WHEN CLASSIFICATION = 'Ancillary' THEN AMOUNT ELSE 0 END) AS Acillary_Amt_7DAYS,
                   SUM(CASE WHEN CLASSIFICATION = 'Ancillary' THEN Counter ELSE 0 END) AS Acillary_Count_7DAYS,
                   SUM(CASE WHEN IFNULL(ds_ram_retail_repository.isPrimaryFee, 0) = 1 THEN Amount ELSE 0 END) PRIMARYFEE_7DAYS,
                   SUM(COUNTER) AS TOTALCOUNT7DAYS,
                   SUM(AMOUNT) AS TOTALAMOUNT7DAYS,
                   MAX(Total_due) AS Total_due
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
             INNER JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                ON ds_ram_retail_repository.PolicyID = ds_policysummary_v2.PolicyID
               AND DATE(ds_ram_retail_repository.CREATEDDATE) BETWEEN DATE(ds_policysummary_v2.STARTDATE) AND DATEADD(DAY,7,DATE(ds_policysummary_v2.STARTDATE))
              LEFT JOIN (
                    SELECT PolicyID,
                           SUM(Amount) Total_due
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                     WHERE SourceDB = 'AppOne'
                     GROUP BY policyID
                   ) ds_ram_retail_repository_t
                ON ds_ram_retail_repository_t.PolicyID = ds_policysummary_v2.PolicyID
             WHERE ds_policysummary_v2.SOURCEDB = 'AppOne'
               AND DATE(ds_policysummary_v2.STARTDATE) BETWEEN '2020-01-01' AND CURRENT_DATE() -1
             GROUP BY ds_policysummary_v2.PolicyID
        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
