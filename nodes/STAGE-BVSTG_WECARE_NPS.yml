    sourceMapping:
      - aliases:
          V_DLBV_API_HUBSPOT_FEEDBACK_SUBMISSION_CURRENT: 53ca5d59-e63d-4293-ab88-8aeec79bbfbe
          V_DLBV_API_HUBSPOT_FEEDBACK_SUBMISSION_ASSOCIATION_CURRENT: ba26748f-7f4c-49d6-bdad-a52d1f8ac832
          DS_HUBSPOT_LEADS: 02b868be-f68f-4de7-b050-a7e53f362bda
          DS_HUBSPOT_DEALS: 3389f396-2c6a-4363-9ad2-618fa71b0342
          DS_RAM_RETAIL_REPOSITORY: d29a0c5c-e296-46c4-bc55-861d60fe906d
        customSQL:
