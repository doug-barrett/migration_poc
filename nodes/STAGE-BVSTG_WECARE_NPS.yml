        dependencies:
          - locationName: UNKNOWN
            nodeName: HUBSPOT_FEEDBACK_SUBMISSION
          - locationName: STAGE
            nodeName: V_DLBV_API_HUBSPOT_FEEDBACK_SUBMISSION_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_API_HUBSPOT_FEEDBACK_SUBMISSION_ASSOCIATION_CURRENT
          - locationName: EDW
            nodeName: DS_HUBSPOT_LEADS
          - locationName: EDW
            nodeName: DS_HUBSPOT_DEALS
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_DLBV_API_HUBSPOT_FEEDBACK_SUBMISSION_CURRENT') }} HUBSPOT_FEEDBACK_SUBMISSION
             INNER JOIN {{ ref('STAGE','V_DLBV_API_HUBSPOT_FEEDBACK_SUBMISSION_ASSOCIATION_CURRENT') }} FEEDBACK_SUBMISSION_ASSOCIATION
                ON FEEDBACK_SUBMISSION_ASSOCIATION.FEEDBACKID=HUBSPOT_FEEDBACK_SUBMISSION.FEEDBACKID
             INNER JOIN "DATA_LAKE"."BIA_ANALYTICS"."API_OB_HUBSPOT_LEADRESULT" HUBSPOT_LEADRESULT
                ON HUBSPOT_LEADRESULT.CONTACTID=FEEDBACK_SUBMISSION_ASSOCIATION.ASSOCIATIONID
             INNER JOIN {{ ref('EDW','DS_HUBSPOT_LEADS') }} DS_HUBSPOT_LEADS
                ON DS_HUBSPOT_LEADS.LEADSPK=HUBSPOT_LEADRESULT.LEADSPK
               AND HUBSPOT_FEEDBACK_SUBMISSION.CREATEDATE >=DS_HUBSPOT_LEADS.SALEDATE
             INNER JOIN {{ ref('EDW','DS_HUBSPOT_DEALS') }} DS_HUBSPOT_DEALS
                ON DS_HUBSPOT_DEALS.LEADID=DS_HUBSPOT_LEADS.LEAD_ID
               AND HUBSPOT_FEEDBACK_SUBMISSION.CREATEDATE>=DS_HUBSPOT_DEALS.SALEDATE
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} DS_RAM_RETAIL_REPOSITORY
                ON DS_RAM_RETAIL_REPOSITORY.TransactionID= DS_HUBSPOT_DEALS.SALEID
               AND DS_RAM_RETAIL_REPOSITORY.LABEL='New Business Auto'
             WHERE YEAR(HUBSPOT_FEEDBACK_SUBMISSION.CREATEDATE)|| RIGHT('0'|| MONTH(HUBSPOT_FEEDBACK_SUBMISSION.CREATEDATE),2) ='{{ parameters.HWM_BVSTG_Wecare }}' QUALIFY ROW_NUMBER() OVER (PARTITION BY HUBSPOT_FEEDBACK_SUBMISSION.FEEDBACKID ORDER BY CASE WHEN date(HUBSPOT_FEEDBACK_SUBMISSION.CREATEDATE)=date(DS_HUBSPOT_DEALS.SALEDATE) THEN 1 WHEN date(HUBSPOT_FEEDBACK_SUBMISSION.CREATEDATE)>date(DS_HUBSPOT_DEALS.SALEDATE) THEN 2 ELSE 3 END, DS_HUBSPOT_DEALS.SALEDATE DESC) = 1
        name: BVSTG_WECARE_NPS
        noLinkRefs: []
