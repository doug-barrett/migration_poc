          V_MKT_WEEKNUM: fb888797-28da-4554-aa1d-2a81383654a5
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_MKT_NOT_WEEKLYUNIQUE') }} AS SELECT DISTINCT call_id,
                   0 IsWeeklyUnique
              FROM (
                    SELECT call_id,
                           0 IsWeeklyUnique,
                           RANK() OVER(PARTITION BY year(a.INITIATEDDATETIME),week(a.INITIATEDDATETIME),a.caller_Number ORDER BY CASE WHEN a.Call_Status IN('ANSWER','SYSTEM CONNECT') THEN 1 ELSE 2 END, a.Call_Start, a.call_id) Ranking
                      FROM {{ ref('STAGE','BVSTG_MKT_AU1C_CALL_LOG_CARS') }} a
                      JOIN (
                            SELECT y.Year_Number,
                                   y.Week_Number,
                                   Caller_Number
                              FROM {{ ref('STAGE','BVSTG_MKT_AU1C_CALL_LOG_CARS') }} x
                             INNER JOIN {{ ref('STAGE','V_MKT_WEEKNUM') }} y
                                ON year(x.INITIATEDDATETIME) =y.Year_Number
                               AND week(x.INITIATEDDATETIME) = y.Week_Number
                             WHERE IsWeeklyUnique = 1
                             GROUP BY y.Year_Number,
                                      y.Week_Number,
                                      Caller_Number
                            HAVING count(1) > 1
                           ) b
                        ON year(a.INITIATEDDATETIME) =b.Year_Number
                       AND week(a.INITIATEDDATETIME) = b.Week_Number
                       AND a.Caller_Number = b.Caller_Number
                     WHERE IsWeeklyUnique = 1
                   )
             WHERE RANKING>1
        dependencies:
