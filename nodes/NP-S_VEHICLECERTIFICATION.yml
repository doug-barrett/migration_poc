        join:
          joinCondition: FROM {{ ref('NP','I_VEHICLECERTIFICATION') }} I_VEHICLECERTIFICATION --THESE JOINS ARE NEEDED FOR THE LAST 2 JOINS TO WORK  LEFT OUTER JOIN [D_RISK]   ON I_VEHICLECERTIFICATION.RISKCODE = D_RISK.RISKCODE  LEFT OUTER JOIN [D_VEHICLESERVICETYPE]   ON I_VEHICLECERTIFICATION.SERVICEDESCRIPTION = D_VEHICLESERVICETYPE.SERVICEDESCRIPTION    AND ISNULL(CAST(I_VEHICLECERTIFICATION.SERVICEDISTANCEINTERVAL AS VARCHAR(15)), 'UNKNOWN') = D_VEHICLESERVICETYPE.SERVICEDISTANCEINTERVAL    AND ISNULL(CAST(I_VEHICLECERTIFICATION.SERVICEMONTHSINTERVAL AS VARCHAR(15)), 'UNKNOWN') = D_VEHICLESERVICETYPE.SERVICEMONTHSINTERVAL      LEFT JOIN D_OBLIGATION  --ONLY CODED TO ONE OBLIGATION AND FOR ONLY ONE RISK TYPE TO STOP DUPLICATES RISK CODE = PREVENTATIVE MAINTENANCE   ON OBLIGATIONCODE = '42' AND D_RISK.RISKCODE = 776 AND D_VEHICLESERVICETYPE.SERVICETYPE IN ('WOF', 'COF')   --SPECIFIC VERIFICATION AND ONLY WHEN THERE IS AN OBLIGATION  LEFT JOIN D_OBLIGATIONVERIFICATIONTYPE   ON VERIFICATIONTYPE = 'CUSTOM - VEHICLE CERTIFICATION' AND D_OBLIGATION_KEY IS NOT NULL
        name: S_VEHICLECERTIFICATION
