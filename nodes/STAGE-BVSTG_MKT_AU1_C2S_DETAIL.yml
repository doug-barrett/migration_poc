    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
          - locationName: EDW
            nodeName: DS_MKT_LEAD_SOURCE
          - locationName: STAGE
            nodeName: V_S_MKT_BROADCAST_CALENDAR_CURRENT
          - locationName: EDW
            nodeName: DS_MKT_CALLSOURCE
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN
          - locationName: DATA_VAULT
            nodeName: S_AP1_LEAD_MROC
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
        join:
          joinCondition: |-
            FROM RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION ds_pcce_termination_call_summary_session
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_CALLSOURCE DS_MKT_CALLSOURCE
                ON DS_MKT_CALLSOURCE.INTERACTIONIDKEY = ds_pcce_termination_call_summary_session.ID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_MKT_BROADCAST_CALENDAR_CURRENT v_s_mkt_broadcast_calendar_current
                ON DATE(ds_pcce_termination_call_summary_session.StartDateTime) = v_s_mkt_broadcast_calendar_current.DATE
              LEFT JOIN (
                    SELECT a.LEADID,
                           a.SOURCEDB,
                           b.ID
                      FROM RETAIL_PROD.SCH_EDW.DS_MKT_LEAD_SOURCE a
                     INNER JOIN RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION b
                        ON SPLIT_PART(a.CallID,'-',1) || '-' || SPLIT_PART(a.CallID,'-',2) = b.ID
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_TBAI_EXPORTKEYS_CURRENT c
                        ON a.leadid = c.APPONEINTERNALLEADID
                       AND a.SOURCEDB = 'AppOne'
                       AND a.ORIGINALORGANIZATIONCODE = 'OLBT'
                     WHERE IFNULL(ISINBOUNDDIALER,0) = 0
                       AND a.LMS_ID IS NULL
                       AND c.LMSLEADID IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY b.ID ORDER BY a.LEADCREATED)=1
                   )LEAD_SOURCE_TCSS
                ON ds_pcce_termination_call_summary_session.ID = LEAD_SOURCE_TCSS.ID
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_LEAD_SOURCE DS_MKT_LEAD_SOURCE
                ON DS_MKT_LEAD_SOURCE.LeadID = LEAD_SOURCE_TCSS.LeadID
               AND DS_MKT_LEAD_SOURCE.SOURCEDB= LEAD_SOURCE_TCSS.SOURCEDB
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_CAMPAIGN ds_mkt_campaign
                ON IFNULL(DS_MKT_LEAD_SOURCE.CampaignId,ds_mkt_callsource.Campaign_Id) = ds_mkt_campaign.CAMPAIGNID
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 DS_CUSTOMERSUMMARY_V2
                ON DS_MKT_LEAD_SOURCE.customerid = DS_CUSTOMERSUMMARY_V2.customerid
               AND DS_MKT_LEAD_SOURCE.SourceDB = DS_CUSTOMERSUMMARY_V2.SourceDB
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY DS_RAM_RETAIL_REPOSITORY_S
                ON DS_RAM_RETAIL_REPOSITORY_S.TransactionID = DS_MKT_LEAD_SOURCE.SaleID
               AND DS_RAM_RETAIL_REPOSITORY_S.LABEL like 'New Business%'
              LEFT JOIN (
                    SELECT a.LeadID,
                           b.description
                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LEAD_MROC a
                     INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_LINEOFBUSINESSTYPE_MROC b
                        ON a.lineofbusinesstypeid = b.lineofbusinesstypeid QUALIFY ROW_NUMBER() OVER (PARTITION BY a.LeadID ORDER BY a.DSS_VERSION DESC)=1
                   )S_AP1_LEAD_MROC
                ON S_AP1_LEAD_MROC.LeadID = DS_MKT_LEAD_SOURCE.LeadID
               AND DS_MKT_LEAD_SOURCE.SourceDB = 'AppOne'
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY DS_RAM_RETAIL_REPOSITORY_T
                ON DS_RAM_RETAIL_REPOSITORY_T.ActivityID = DS_MKT_LEAD_SOURCE.TransferID
               AND DS_RAM_RETAIL_REPOSITORY_T.SourceDB = DS_MKT_LEAD_SOURCE.SourceDB
             WHERE IFNULL(ISINBOUNDDIALER,0) = 0
               AND (ds_pcce_termination_call_summary_session.STARTDATETIME >= '2023-01-01' OR DS_MKT_LEAD_SOURCE.SALEDATE >='2023-01-01')/*  AND (       ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0)       OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1            AND DATEDIFF(DAY,DS_MKT_LEAD_SOURCE.DSS_UPDATE_TIME,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}' )      OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1            AND DATEDIFF(DAY,ds_pcce_termination_call_summary_session.StartDateTime,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}' ) )  */ QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_pcce_termination_call_summary_session.ID ORDER BY ds_pcce_termination_call_summary_session.STARTDATETIME)=1
        name: SRC_bvstg_mkt_au1_c2s_v2_calls
