    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          DS_COMM_EOM_EXTRACT_ALLSOURCES: 2b203c3a-983b-4862-9cb4-5a58db260d09
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_COMM_EOM_EXTRACT_ALLSOURCES
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT ds_comm_eom_1.*,
                   datediff('months',ds_comm_eom_1.nbsmonth, current_date()) Age,
                   CASE WHEN ds_comm_eom_extract_allsources4.NewBusinessPolicyFlag IS NULL AND to_number(substr(ds_comm_eom_1.monthsfromnbs,2,len(ds_comm_eom_1.monthsfromnbs)))<= ds_comm_eom_1.term THEN 'New Policy'
                        WHEN ds_comm_eom_extract_allsources4.NewBusinessPolicyFlag IS NULL AND to_number(substr(ds_comm_eom_1.monthsfromnbs,2,len(ds_comm_eom_1.monthsfromnbs)))> ds_comm_eom_1.term  THEN 'Renewed Policy'
                        ELSE ds_comm_eom_extract_allsources4.NewBusinessPolicyFlag
                         END AS NewBusinessPolicyFlag,
                   ifnull(ds_comm_eom_extract_allsources2.TotalPolicies,0) TotalPolicies,
                   ifnull(ds_comm_eom_extract_allsources3.ActivePolicies,0) ActivePolicies
              FROM (
                    SELECT DISTINCT *
                      FROM (
                            SELECT DISTINCT carrier,
                                   retailtype,
                                   agencystate,
                                   agency,
                                   customer_type,
                                   term,
                                   leadtype,
                                   NBSMonth,
                                   ispolicyincs,
                                   ispolicyincdt,
                                   lineofbusiness,
                                   policysource,
                                   customerstate,
                                   isOnlineBinding,
                                   ifnull(TERRITORYMANAGERNAME,'-') TERRITORYMANAGERNAME,
                                   ifnull(isFranchise, 0) isFranchise,
                                   Paidtype,
                                   ifnull(UPRATE_POLICY_FLAG, 0) UPRATE_POLICY_FLAG,
                                   ifnull(Ancillary_Flag, 0) Ancillary_Flag,
                                   PREMIUM_FINANCE_FLAG,
                                   islegacytransaction,
                                   officetype
                              FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}
                             WHERE monthsfromnbs = 'M1'
                           ) ds_comm_eom_extract_allsources_a
                     CROSS JOIN (
                            SELECT DISTINCT monthsfromnbs
                              FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}
                             WHERE year(nbsmonth) >=2019
                           ) ds_comm_eom_extract_allsources_b
                   ) ds_comm_eom_1
              LEFT JOIN (SELECT DISTINCT carrier,
                   retailtype,
                   agencystate,
                   agency,
                   customer_type,
                   term,
                   leadtype,
                   NBSMonth,
                   ispolicyincs,
                   ispolicyincdt,
                   lineofbusiness,
                   policysource,
                   customerstate,
                   isOnlineBinding,
                   ifnull(TERRITORYMANAGERNAME,'-') TERRITORYMANAGERNAME,
                   ifnull(isFranchise, 0) isFranchise,
                   PaidType,
                   ifnull(UPRATE_POLICY_FLAG, 0) UPRATE_POLICY_FLAG,
                   ifnull(Ancillary_Flag, 0) Ancillary_Flag,
                   ifnull(PREMIUM_FINANCE_FLAG, 0) PREMIUM_FINANCE_FLAG,
                   islegacytransaction,
                   officetype,
                   count(DISTINCT policynumberformatted,carrier) TotalPolicies
              FROM {{ ref('EDW','DS_COMM_EOM_EXTRACT_ALLSOURCES') }}
             WHERE year(nbsmonth) >=2019
             GROUP BY carrier,
                      retailtype,
                      agencystate,
                      agency,
                      customer_type,
                      term,
                      leadtype,
                      NBSMonth,
                      ispolicyincs,
                      ispolicyincdt,
                      lineofbusiness,
                      policysource,
                      customerstate,
                      isOnlineBinding,
                      ifnull(TERRITORYMANAGERNAME,'-'),
                      ifnull(isFranchise, 0),
                      PaidType,
                      ifnull(UPRATE_POLICY_FLAG, 0),
                      ifnull(Ancillary_Flag, 0),
