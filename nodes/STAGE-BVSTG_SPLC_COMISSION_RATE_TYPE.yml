            FROM {{ ref('STAGE','BVSTG_SPLC_COMISSION_RATE') }} bvstg_splc_comission_rate
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_SPLC_COMISSION_RATE_FLAG') }} ds_bvstg_splc_comission_rate_flag
                ON bvstg_splc_comission_rate.PolicyID = ds_bvstg_splc_comission_rate_flag.PolicyID
              LEFT JOIN DATA_LAKE.BIA_ANALYTICS.SPLC_COMMISSION_RATES comm_rates
                ON LOWER(bvstg_splc_comission_rate.COMM_TYPE) = LOWER(comm_rates.COMP_TYPE)
               AND LOWER(bvstg_splc_comission_rate.JOBTITLE) = LOWER(comm_rates.JOB_TITLE)
              LEFT JOIN DATA_LAKE.BIA_ANALYTICS.SPLC_COMMISSION_RATES comm_rates_fee
                ON LOWER(AMSDESCRIPTION)|| ' fees' = LOWER(comm_rates_fee.COMP_TYPE)
               AND LOWER(bvstg_splc_comission_rate.JOBTITLE) = LOWER(comm_rates_fee.JOB_TITLE)
              LEFT JOIN (
