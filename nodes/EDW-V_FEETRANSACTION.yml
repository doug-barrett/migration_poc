    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          V_FEETRANSACTION: e7abdcda-312e-4347-804e-45e0412c3bac
          DS_AP1_TRANSACTIONSUMMARY: c9014461-b3e2-471a-b720-398d60b6acff
          DS_RETAIL_OFFICE: 581aed87-ec65-482f-aa6f-9a04a9d54476
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('EDW','V_FEETRANSACTION') }} AS SELECT TO_DATE(retail_transactionsummary.created) AS "CreatedDate" ,
                   retail_transactionsummary.transactionid AS "TransactionId" ,
                   retail_transactionsummary.TransactionType AS "Transactiontype" ,
                   retail_transactionsummary.primaryfee AS "PrimaryFee" ,
                   bvstg_retail_office.salesvp AS "salesVP" ,
                   bvstg_retail_office.districtmanagername AS "District_Manager" ,
                   retail_transactionsummary.PrimaryAgentFullname AS "ProducerName" ,
                   bvstg_retail_office.statecode AS "state" ,
                   bvstg_retail_office.status AS "status" ,
                   bvstg_retail_office.districtcode AS "District" ,
                   bvstg_retail_office.bmo AS "BudgetMktgOrg" ,
                   retail_transactionsummary.BIAPrimaryAgentOffice AS "BiaPrimaryTransactionOffice" ,
                   bvstg_retail_office.officename AS "name" ,
                   retail_transactionsummary.carriername AS "CarrierName" ,
                   retail_transactionsummary.lineofbusinesstype AS "LineOfBusinessType" ,
                   retail_transactionsummary.SR_22_Fees AS "SR-22 Fees" ,
                   retail_transactionsummary.EndorsementFee AS "EndorsementFee" ,
                   retail_transactionsummary.MonthlyPaymentFee AS "MonthlypaymentFee" ,
                   retail_transactionsummary.ReinstatementFee AS "ReinstatementFee" ,
                   retail_transactionsummary.DocFee AS "DocFee" ,
                   retail_transactionsummary.ConvenicenceFee AS "ConvenicenceFee" ,
                   retail_transactionsummary.AncillaryCount AS "AncillaryCount" ,
                   retail_transactionsummary.isesign AS "IsEsign" ,
                   retail_transactionsummary.isezbuy AS "isEzBuy" ,
                   retail_transactionsummary.IsVoid AS "IsVoid" ,
                   retail_transactionsummary.enteredamount AS "Ancillary Product Amount" ,
                   retail_transactionsummary.companycost AS "Company Cost"
              FROM {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} retail_transactionsummary
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} bvstg_retail_office
                ON retail_transactionsummary.BIAPrimaryAgentOffice = bvstg_retail_office.officecode
               AND retail_transactionsummary.DSS_CURRENT_FLAG='Y'
               AND bvstg_retail_office.DSS_CURRENT_FLAG='Y'
             WHERE retail_transactionsummary.isrowdeleted = FALSE
               AND retail_transactionsummary.isLegacyTransaction = 'Native'
               AND retail_transactionsummary.isvoid = 0
               AND retail_transactionsummary.isCorporateVoid = 0
               AND YEAR(retail_transactionsummary.created) IN (YEAR(CURRENT_DATE())-1,YEAR(CURRENT_DATE()))
        dependencies:
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }}
            {{ ref('EDW','DS_RETAIL_OFFICE') }}
