    sourceMapping:
    - aliases:
        SRC_CSHCUSFL: 8ecb11eb-dc47-5b69-bcbe-8530705d8301
      customSQL:
        customSQL: ''
      dependencies:
      - locationName: GOLD
        nodeName: SRC_CSHCUSFL
      join:
        joinCondition: "FROM {{ ref('GOLD', 'SRC_CSHCUSFL') }} \"SRC_CSHCUSFL\"\n\
          \ Where Aud_Time <= (Select MAX(Batch_End) FROM \"DOUG_POC\".\"DP001\".\"\
          CDC_BATCH\" )\nAND Aud_Time > (Select MAX(Batch_Start) FROM \"DOUG_POC\"\
          .\"DP001\".\"CDC_BATCH\")\nAND (Aud_Code <> 'F' or (Aud_Code is null and\
          \ Aud_Type = 'RR')) QUALIFY RANK() \nOVER (PARTITION BY  CHCMP, CHDLST,\
          \ CHDL0  \nORDER BY AUD_TIME DESC, AUD_SEQNO DESC, CASE  \nWHEN Aud_Type\
          \ in ('PT','PX','FI')\tTHEN 1 \nWHEN Aud_Type in ('UB','FB','FP','BR')\t\
          THEN 2 \nWHEN Aud_Type in ('UP','UR')\tTHEN 3 \nWHEN Aud_Type in ('DL','FD')\t\
          THEN 4 \nWHEN Aud_Type in ('RR')\t\tTHEN 5 \n ELSE 0 END DESC) = 1"
      name: CDC_CSHCUSFL
      noLinkRefs: []
