        description: ""
        name: LINEOFBUSINESS
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN LOWER(CATEGORY) LIKE '%commercial%' OR LOWER(CATEGORY) LIKE '%bop%' OR LOWER(CATEGORY) LIKE '%package%' OR LOWER(CATEGORY) LIKE '%businessowners%' OR LOWER(CATEGORY) LIKE '%business owner%' OR LOWER(CATEGORY) LIKE '%truckers%' OR LOWER(CATEGORY) LIKE '%garage%' OR LOWER(CATEGORY) LIKE '%dealer%' OR LOWER(CATEGORY) LIKE '%builder%' OR LOWER(CATEGORY) LIKE '%contractors bop%' OR LOWER(typeofbusiness) LIKE '%commercial%' THEN 'Commercial'
                          WHEN LOWER(CATEGORY) LIKE '%home%' OR LOWER(CATEGORY) LIKE '%dwelling%' OR LOWER(CATEGORY) LIKE '%tenant%' OR LOWER(CATEGORY) LIKE '%renter%' OR LOWER(CATEGORY) LIKE '%condo%' OR LOWER(CATEGORY) LIKE '%seasonal%' OR LOWER(CATEGORY) LIKE '%non-standard home%' OR LOWER(CATEGORY) LIKE '%fair plan%' OR LOWER(CATEGORY) LIKE '%fire%'                                                                                                  THEN 'Home_or_Property'
                          WHEN LOWER(CATEGORY) LIKE '%auto%' OR LOWER(CATEGORY) LIKE '%motor%' OR LOWER(CATEGORY) LIKE '%private passenger%' OR LOWER(CATEGORY) LIKE '%recreational%' OR LOWER(CATEGORY) LIKE '%rv%' OR LOWER(CATEGORY) LIKE '%travel trlr%' OR LOWER(CATEGORY) LIKE '%golf cart%' OR LOWER(CATEGORY) LIKE '%roadside assistance%'                                                                                                                   THEN 'Auto'
                          WHEN LOWER(CATEGORY) LIKE '%liability%' OR LOWER(CATEGORY) LIKE '%errors%' OR LOWER(CATEGORY) LIKE '%directors%' OR LOWER(CATEGORY) LIKE '%employer practice%' OR LOWER(CATEGORY) LIKE '%employment%' OR LOWER(CATEGORY) LIKE '%fiduciary%'                                                                                                                                                                                                THEN 'General_or_Professional Liability' -- Health / Medical

                          WHEN LOWER(CATEGORY) LIKE '%health%' OR LOWER(CATEGORY) LIKE '%medical%' OR LOWER(CATEGORY) LIKE '%medicare%' OR LOWER(CATEGORY) LIKE '%disability%'                                                                                                                                                                                                                                                                                       THEN 'Health' -- Umbrella / Excess Liability

                          WHEN LOWER(CATEGORY) LIKE '%umbrella%' OR LOWER(CATEGORY) LIKE '%excess%'                                                                                                                                                                                                                                                                                                                                                                  THEN 'Umbrella_Excess Liability' -- Workers Comp

                          WHEN LOWER(CATEGORY) LIKE '%workers comp%' OR LOWER(CATEGORY) LIKE '%workers\' compensation%' OR LOWER(CATEGORY) LIKE '%ny state dbl%' OR LOWER(CATEGORY) LIKE '%dbl%' OR LOWER(CATEGORY) LIKE '%employers liability%'                                                                                                                                                                                                                     THEN 'Workers Compensation' -- Marine / Boat / Watercraft

                          WHEN LOWER(CATEGORY) LIKE '%boat%' OR LOWER(CATEGORY) LIKE '%marine%' OR LOWER(CATEGORY) LIKE '%watercraft%' OR LOWER(CATEGORY) LIKE '%yacht%' OR LOWER(CATEGORY) LIKE '%snowmobile%'                                                                                                                                                                                                                                                      THEN 'Watercraft_Marine' -- Bonds

                          WHEN LOWER(CATEGORY) LIKE '%bond%' OR LOWER(CATEGORY) LIKE '%surety%' OR LOWER(CATEGORY) LIKE '%performance bond%'                                                                                                                                                                                                                                                                                                                         THEN 'Bonds' -- Flood / Earthquake

                          WHEN LOWER(CATEGORY) LIKE '%flood%' OR LOWER(CATEGORY) LIKE '%earthquake%' OR LOWER(CATEGORY) LIKE '%difference in condition%'                                                                                                                                                                                                                                                                                                             THEN 'Flood_Earthquake_DIC'
                          ELSE 'Other'
                           END
