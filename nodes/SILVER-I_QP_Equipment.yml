      config: {}
      dataType: VARCHAR(2000)
      description: ''
      name: VehicleNumber
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: --THE VEHICLE "Details" ARE IN A FREE TEXT FIELD, SO HAVE TRIED
          TO COVER 3 OF THE COMMONLY  -- USED METHODS OF RECORDING  CASE   -- WHEN
          STRAIGHT VEHICLE NUMBER IS ENTERED   WHEN LENGTH("L_QP_EQUIPMENTITEM".""UserDefinedField1"")
          = 4 AND ISNUMERIC(LEFT("L_QP_EQUIPMENTITEM".""UserDefinedField1"",1)) =
          0 THEN "L_QP_EQUIPMENTITEM".""UserDefinedField1""   -- WHEN THE VEHICLE
          NUMBER IS PREFIXED BY VY   WHEN LENGTH("L_QP_EQUIPMENTITEM".""UserDefinedField1"")
          = 6 AND LEFT("L_QP_EQUIPMENTITEM".""UserDefinedField1"",2) = 'VY' THEN RIGHT("L_QP_EQUIPMENTITEM".""UserDefinedField1"",4)   --
          WHEN THE "Registration" NUMBER OF THE VEHICLE IS ENTERED   WHEN "D_VEHICLE".""VehicleNumber""
          IS NOT NULL THEN "D_VEHICLE".""VehicleNumber""  ELSE "L_QP_EQUIPMENTITEM".""UserDefinedField1""
          END
