                ON D_EMPLOYEE.EMPLOYEECODE = L_PG_EMPLOYEE.EMPLOYEECODE --USE DATA FROM THE LAST FULL TWELVE MONTHS   WHERE D_PERIOD.PERIODNUMBER BETWEEN @V_CURRENTF1OPENPERIOD - 12 AND @V_CURRENTF1OPENPERIOD - 1   AND D_EMPLOYEE.TERMINATED = 0     GROUP BY    F_PAYROLLTRANSACTIONS.D_EMPLOYEE_KEY  , D_EMPLOYEE.EMPLOYEECODE   , D_EMPLOYEE.EMPLOYEECOSTGROUP  , D_EMPLOYEE.PROFILEDHOURS  , D_EMPLOYEE.ANNUALLEAVEENTITLEMENTINWEEKS  , CASE   WHEN CHARINDEX('.',D_EMPLOYEE.JOBFUNCTION) >= 2    THEN LEFT(D_EMPLOYEE.JOBFUNCTION,CHARINDEX('.',D_EMPLOYEE.JOBFUNCTION)-1)   ELSE ''  END  , CASE    WHEN L_PG_EMPLOYEE.XBONUS IS NOT NULL      THEN CONVERT(DECIMAL(10,2),LEFT(L_PG_EMPLOYEE.XBONUS, LEN(L_PG_EMPLOYEE.XBONUS) - 1)) / 100    ELSE 0  END  , L_PG_EMPLOYEE.RATEAMOUNT  , D_EMPLOYEE.BUSINESSUNITCODE    --NOT INTERESTED IN COUNTERS OR ALLOWANCES WITHOUT VALUE   HAVING SUM(PAIDAMOUNT) <> 0
