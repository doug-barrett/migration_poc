      customSQL:
        customSQL: "SELECT \n\t\t\tinvoices.id AS JobId,\n\t\t\tOriginalUsers.employee_number\
          \ AS Original_user_id,\n\t\t\tinvoices.original_invoice_id,\n\t\t\tinvoices.warranty_reason,\n\
          \t\t\t(invoices.parts_cost + invoices.labor_cost+invoices.freight_cost)\
          \ Warranty_Cost, \n\t\t\tcoalesce(comp.id,-11) as account_company_id,\n\t\
          \t\tinvoices.date,\n\t\t\tcoalesce(OriginalInvoice.location_id,-11) as \
          \ Original_location_id,\n\t\t\tcoalesce(invoices.location_id,-11) as  location_id,\n\
          \t\t\tMAX(OriginalAppointment.id) AS max_original_appointment_id,\n\t\t\t\
          OriginalAppointment.id AS original_appointment_id\n\t\tFROM \n\t\t\tinvoices\n\
          \t\tINNER JOIN locations ON invoices.location_id=locations.id\n\t\tLEFT\
          \ JOIN appointments OriginalAppointment ON OriginalAppointment.invoice_id=invoices.original_invoice_id\n\
          \t\tLEFT JOIN invoices OriginalInvoice ON invoices.original_invoice_id=OriginalInvoice.id\n\
          \t\tLEFT JOIN users OriginalUsers ON OriginalAppointment.user_id=OriginalUsers.employee_number\n\
          \        left join companies comp on invoices.account_company_id = comp.id\n\
          \t\tWHERE \n\t\t \n\t\t\t invoices.job_status<>'VO'\n\t\t\tAND invoices.warranty_reason\
          \ NOT IN ('', 'Mirror', 'Courtesy')\n\t\t\tAND invoices.warranty_reason\
          \ IS NOT NULL\n\t\t\tAND OriginalAppointment.status='CLOSED'\n\t\t\tAND\
          \ invoices.warranty_reason<>''\n\t\tGROUP BY invoices.id\n\t\tHAVING original_appointment_id=max_original_appointment_id"
