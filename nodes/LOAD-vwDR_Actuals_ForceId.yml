          LEFT JOIN {{ ref('TABLEAU', 'Contract') }} "Contract"
            ON AGGFORCEID_CONTRACTID_ACTUALS.CONTRACTID = CONTRACT.CONTRACTID
          LEFT JOIN {{ ref('TABLEAU', 'Supplier') }} "Supplier"
            ON CONTRACT.SUPPLIERID = SUPPLIER.SUPPLIERID
