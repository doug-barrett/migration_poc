            transform: --THE VEHICLE DETAILS ARE IN A FREE TEXT FIELD, SO HAVE TRIED TO COVER 3 OF THE COMMONLY  -- USED METHODS OF RECORDING  CASE   -- WHEN STRAIGHT VEHICLE NUMBER IS ENTERED   WHEN LEN(L_QP_EQUIPMENTITEM.USERDEFINEDFIELD1) = 4 AND ISNUMERIC(LEFT(L_QP_EQUIPMENTITEM.USERDEFINEDFIELD1,1)) = 0 THEN L_QP_EQUIPMENTITEM.USERDEFINEDFIELD1   -- WHEN THE VEHICLE NUMBER IS PREFIXED BY VY   WHEN LEN(L_QP_EQUIPMENTITEM.USERDEFINEDFIELD1) = 6 AND LEFT(L_QP_EQUIPMENTITEM.USERDEFINEDFIELD1,2) = 'VY' THEN RIGHT(L_QP_EQUIPMENTITEM.USERDEFINEDFIELD1,4)   -- WHEN THE REGISTRATION NUMBER OF THE VEHICLE IS ENTERED   WHEN D_VEHICLE.VEHICLENUMBER IS NOT NULL THEN D_VEHICLE.VEHICLENUMBER  ELSE L_QP_EQUIPMENTITEM.USERDEFINEDFIELD1 END
