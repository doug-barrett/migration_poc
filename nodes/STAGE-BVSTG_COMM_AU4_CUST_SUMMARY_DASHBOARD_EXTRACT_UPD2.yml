        join:
          joinCondition: |-
            FROM (SELECT last_carrier,
                   metric,
                   sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), -4) THEN metricvalue END) AS m1pif,
                   sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), -3) THEN metricvalue END) AS m2pif,
                   sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), -2) THEN metricvalue END) AS m3pif,
                   sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), -1) THEN metricvalue END) AS m4pif,
                   (sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), -4) THEN metricvalue END) + sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), -3) THEN metricvalue END) + sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), -2) THEN metricvalue END))/3 AS averagepif
              FROM {{ ref('STAGE','BVSTG_COMM_AU1_CUST_SUMMARY_DASHBOARD_EXTRACT_UPD2') }} BVSTG_COMM_AU1_CUST_SUMMARY_DASHBOARD_EXTRACT_UPD2 -- from BVSTG_COMM_AU1_CUST_SUMMARY_DASHBAORD_EXTRACT_UPD2 BVSTG_COMM_AU1_CUST_SUMMARY_DASHBAORD_EXTRACT_UPD2  where cutoffdate >= add_months(date_trunc('month', current_date), -4)    and cutoffdate <= add_months(date_trunc('month', current_date), -1)    and metric = 'CIF_EOM'   and (last_carrier in (select distinct carrierdisplayname from {{ ref('STAGE','DS_BVSTG_COMM_PAIDTYPEMAPPING') }} ds_bvstg_comm_paidtypemapping                 -- from "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_PAIDTYPEMAPPING" ds_bvstg_comm_paidtypemapping         where finalstatus in ('Combined_Status_Earned_A', 'Combined_Status_Collected_A', 'Combined_Status_Collected_B')         and carrierdisplayname <> 'Western General')        or last_carrier in (select distinct carrierdisplayname          from {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}         -- from "DATA_LAKE"."BIA_ANALYTICS"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF"         where lower(carrierdisplayname) like 'bluefire%'))           group by metric, last_carrier) BVSTG_COMM_AU1_CUST_SUMMARY_DASHBOARD_EXTRACT_UPD2  where m4pif <= averagepif*0.85
