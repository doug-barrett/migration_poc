    sourceMapping:
    - aliases:
        SRC_RASDETFL: 5370bdc6-6e25-5aff-b84b-eebffbc06ba1
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: SRC_RASDETFL
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'SRC_RASDETFL') }} "SRC_RASDETFL"
          
          LEFT OUTER JOIN "DOUG_POC"."DP001"."ID_ITEM"
          ON SRC_RASDETFL.RSCMP = ID_ITEM.Company_Code
          AND  SRC_RASDETFL.RSITEM = ID_ITEM.Item_Code
          AND SRC_RASDETFL.RSSTKC = ID_ITEM.Stock_Class_Code
          
           
          Where SRC_RASDETFL.Aud_Time <= (Select MAX(Batch_End) FROM "DOUG_POC"."DP001"."CDC_BATCH")
          AND SRC_RASDETFL.Aud_Time > (Select MAX(Batch_Start) FROM "DOUG_POC"."DP001"."CDC_BATCH")
          AND (SRC_RASDETFL.Aud_Code <> 'F' or (SRC_RASDETFL.Aud_Code is null and SRC_RASDETFL.Aud_Type = 'RR')) QUALIFY RANK() 
          OVER (PARTITION BY  RSCMP, RSCON0, RSSEQ0, RSOSEQ, RSISEQ 
          ORDER BY SRC_RASDETFL.AUD_TIME DESC, CASE  
          WHEN Aud_Type in ('PT','PX','FI')	THEN 1 
          WHEN Aud_Type in ('UB','FB','FP','BR')	THEN 2 
          WHEN Aud_Type in ('UP','UR')	THEN 3 
          WHEN Aud_Type in ('DL','FD')	THEN 4 
          WHEN Aud_Type in ('RR')		THEN 5 
           ELSE 0 END DESC) = 1
      name: ETL_RASDETFL
      noLinkRefs: []
