name: I_SALESFORCEGENERATION
id: 7ad8f427-3c07-053e-96a1-79cda25b84ed
fileVersion: 1
type: Node
operation:
  locationName: SILVER
  name: I_SALESFORCEGENERATION
  sqlType: View
  type: sql
  version: 1
  description: Salesforce Generation details from work order and cases. Multi select will be turned off for this field, but there is not harm in creating records for all values coming into here for now
  materializationType: view
  isMultisource: false
  metadata:
    sourceMapping:
      - name: source1
        join:
          joinCondition: 'FROM {{ ref(''SILVER'', ''I_SALESFORCECASES'') }}'
        dependencies:
          - locationName: SILVER
            nodeName: I_SALESFORCECASES
    columns:
      - name: GENERATIONTYPE
        dataType: VARCHAR(64)
        description: Generation Type
        columnReference:
          stepCounter: '1'
          columnCounter: '1'
        transform: 'COALESCE(I_SALESFORCECASES.GENERATIONTYPE, I_SALESFORCEWORKORDERS.GENERATIONTYPE)'
      - name: ENERGYSTORAGETYPE
        dataType: VARCHAR(64)
        description: Energy Storage Type
        columnReference:
          stepCounter: '1'
          columnCounter: '2'
        transform: 'CASE 		WHEN COALESCE(I_SALESFORCEWORKORDERS.ENERGYSTORAGETYPE, ''Not Applicable'') = ''Not Applicable'' THEN COALESCE(I_SALESFORCECASES.ENERGYSTORAGETYPE, ''Not Applicable'') 		ELSE COALESCE(I_SALESFORCEWORKORDERS.ENERGYSTORAGETYPE, ''Not Applicable'') 	END'
