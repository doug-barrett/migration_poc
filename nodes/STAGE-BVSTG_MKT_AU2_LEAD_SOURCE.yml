        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_MKT_AU1_LEAD_SOURCE') }} bvstg_mkt_au1_lead_source
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository_quotes
                ON bvstg_mkt_au1_lead_source.leadid = ds_ram_retail_repository_quotes.leadid
               AND ds_ram_retail_repository_quotes.SourceDb = 'AppOne'
               AND ds_ram_retail_repository_quotes.Classification like 'New Quotes%'
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository_transfer
                ON bvstg_mkt_au1_lead_source.leadid = ds_ram_retail_repository_transfer.leadid
               AND ds_ram_retail_repository_transfer.SourceDb = 'AppOne'
               AND ds_ram_retail_repository_transfer.Classification IN('New Transfer','New HCI Transfer')
              LEFT JOIN {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository_sale
                ON bvstg_mkt_au1_lead_source.leadid = ds_ram_retail_repository_sale.leadid
               AND ds_ram_retail_repository_sale.SourceDb = 'AppOne'
               AND ds_ram_retail_repository_sale.label IN('New Business Complementary', 'New Business Auto')
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON ds_mkt_campaign.marchex_id = bvstg_mkt_au1_lead_source.marchex_id
               AND bvstg_mkt_au1_lead_source.campaignid IS NULL
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current_web
                ON CAST(v_dlbv_api_lms_masterlead_current_web.LMS_Lead_id AS varchar(100)) = bvstg_mkt_au1_lead_source.ExternalLeadID
              LEFT JOIN {{ ref('STAGE','V_DLBV_API_LMS_MASTERLEAD_CURRENT') }} v_dlbv_api_lms_masterlead_current_partner
                ON CAST(v_dlbv_api_lms_masterlead_current_partner.LEAD_ID_PARTNER AS varchar(100)) = bvstg_mkt_au1_lead_source.ExternalLeadID
              LEFT JOIN ( SELECT COALESCE(V_PREB_GOOGLE_ESTIMATE.Total_Fee_Amt, 0) + COALESCE(V_PREB_GOOGLE_ESTIMATE.total_ancillary_amt, 0) + (IFNULL(V_PREB_GOOGLE_ESTIMATE.Annualized_written_premium, 0) / 12) * (IFNULL(V_PREB_GOOGLE_ESTIMATE.score, 0) *.1) * (CASE WHEN V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT.mincomm IS NULL OR V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT.maxcomm IS NULL THEN 15 WHEN V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT.mincomm = 0 THEN V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT.maxcomm ELSE 0.5 * (V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT.mincomm + V_DLBV_COMM_AGREEMENTREPOSITORY_CURRENT.maxcomm) END) ConversionValue,
