              LEFT JOIN (
                    SELECT carriername,
                           carriername_grouped
                      FROM {{ ref('STAGE','DS_BVSTG_COMM_CARRIERMAPPING') }} QUALIFY ROW_NUMBER() OVER (PARTITION BY carriername ORDER BY carriername_grouped) = 1
                   ) DS_BVSTG_COMM_CARRIERMAPPING
                ON DS_BVSTG_COMM_CARRIERMAPPING.carriername = DS_POLICYSUMMARY_V2.carriername
              LEFT JOIN ( SELECT carrier,
