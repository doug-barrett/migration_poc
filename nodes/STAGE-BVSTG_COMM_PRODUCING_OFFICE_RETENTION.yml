                         END AS m13_score,
                   CASE WHEN date <'2025-12-01' THEN retention_score_old
                        ELSE retention_score_new
                         END AS retention_score
              FROM {{ ref('STAGE','BVSTG_COMM_AU1_PRODUCING_OFFICE_RETENTION') }} --from bvstg_comm_au1_producing_office_retention  left join (  select distinct *   from {{ ref('STAGE','V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT') }}  --from "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT"  where isrowdeleted=0  qualify row_number() over (partition by retention_type,tier,start_month order by record_insertion_timestamp desc,lastupdateddate desc)=1  ) AS V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3  on concat(trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.retention_type),'_',trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.tier)) = bvstg_comm_au1_producing_office_retention.m3_tier  and bvstg_comm_au1_producing_office_retention.date between V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.start_month and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.end_month  and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.retention_type like ('%M3%')  left join (  select distinct *   from {{ ref('STAGE','V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT') }}  --from "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT"  where isrowdeleted=0  qualify row_number() over (partition by retention_type,tier,start_month order by record_insertion_timestamp desc,lastupdateddate desc)=1  ) AS V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7  on concat(trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.retention_type),'_',trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.tier))=bvstg_comm_au1_pr
