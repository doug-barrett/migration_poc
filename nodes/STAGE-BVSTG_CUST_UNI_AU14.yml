        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU14
          - locationName: STAGE
            nodeName: BVSTG_CUST_UNI_AU13
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION
        join:
          joinCondition: |-
            FROM(
                    WITH CALL_HISTORY AS (
                            SELECT BASE_LINE.CDP_CUSTOMERID,
                                   BASE_LINE.LAST_CUSTOMERID,
                                   BASE_LINE.LAST_TRANSACTIONID,
                                   BASE_LINE.LAST_STARTDATE,
                                   IFNULL(BASE_LINE.LAST_ENDDATE, CURRENT_DATE()) AS ESTIMATE_END_DATE,
                                   MKT_ID.INTERACTIONIDKEY,
                                   MKT_ID.DIRECTION
                              FROM {{ ref('STAGE','BVSTG_CUST_UNI_AU13') }} BASE_LINE
                              LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} MKT_ID
                                ON (BASE_LINE.LAST_CUSTOMERID = MKT_ID.CUSTOMERID AND DATE(MKT_ID.STARTDATETIME) >= BASE_LINE.LAST_STARTDATE AND DATE(MKT_ID.STARTDATETIME) <= IFNULL(LAST_ENDDATE, CURRENT_DATE()))
                           ) ,
                           FULL_HISTORY AS (
                            SELECT CALL_HISTORY.CDP_CUSTOMERID ,
                                   CALL_HISTORY.LAST_CUSTOMERID ,
                                   CALL_HISTORY.LAST_TRANSACTIONID ,
                                   CALL_HISTORY.LAST_STARTDATE ,
                                   CALL_HISTORY.ESTIMATE_END_DATE ,
                                   CALL_HISTORY.DIRECTION ,
                                   CALL_SUMMARY.*
                              FROM CALL_HISTORY CALL_HISTORY
                             INNER JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION') }} CALL_SUMMARY
                                ON (CALL_HISTORY.INTERACTIONIDKEY = CALL_SUMMARY.ID)
                           ) ,
                           FEATURE_CREATION AS (
                            SELECT CDP_CUSTOMERID ,
                                   LAST_CUSTOMERID ,
                                   LAST_TRANSACTIONID ,
                                   LAST_STARTDATE ,
                                   COUNT(*) TOTAL_OF_CALLS ,
                                   SUM(CASE WHEN ISINBOUND = 1 THEN 1 ELSE 0 END) TOTAL_INBOUND_CALLS ,
                                   SUM(CASE WHEN ISOUTBOUND = 1 THEN 1 ELSE 0 END) TOTAL_OUTBOUND_CALLS ,
                                   MAX(CASE WHEN ISINBOUND = 1 THEN DATE(STARTDATETIME) END) MOST_RECENT_INBOUNDCALL ,
                                   MAX(CASE WHEN ISOUTBOUND = 1 THEN DATE(STARTDATETIME) END) MOST_RECENT_OUTBOUNDCALL
                              FROM FULL_HISTORY
                             GROUP BY CDP_CUSTOMERID,
                                      LAST_CUSTOMERID,
                                      LAST_TRANSACTIONID,
                                      LAST_STARTDATE
                           ) SELECT *
                      FROM FEATURE_CREATION
                   ) bvstg_cust_uni_au14
