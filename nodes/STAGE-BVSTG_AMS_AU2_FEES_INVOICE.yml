          - locationName: DATA_VAULT
            nodeName: L_LOBSETUP_LINEOFBUSINESS
          - locationName: DATA_VAULT
            nodeName: H_LOBSETUP
        join:
          joinCondition: |-
            FROM (
                    SELECT a.HK_h_invoice ,
                           a.InvId ,
                           a.HK_h_invoicetransaction ,
                           a.InvtpId ,
                           CASE WHEN b.LineOfBus IS NULL THEN c.LineOfBus
                                ELSE b.LineOfBus
                                 END AS LineOfBus ,
                           a.EnteredDate ,
                           a.HK_h_basicpolinfo ,
                           a.PolID
                      FROM {{ ref('STAGE','BVSTG_AMS_AU1_FEES_INVOICE') }} a
                      LEFT JOIN (
                            SELECT Table2.HK_h_invoice ,
                                   Table2.InvId ,
                                   v_s_ams_invoicetransaction_mroc_current.LineOfBus ,
                                   v_s_ams_invoicetransaction_mroc_current.EnteredDate
                              FROM {{ ref('STAGE','BVSTG_AMS_AU1_FEES_INVOICE') }} Table2
                              LEFT JOIN {{ ref('STAGE','V_S_AMS_INVOICE_MROC_CURRENT') }} v_s_ams_invoice_mroc_current
                                ON Table2.InvId = v_s_ams_invoice_mroc_current.InvId
                              LEFT JOIN {{ ref('STAGE','V_S_AMS_INVOICETRANSACTION_MROC_CURRENT') }} v_s_ams_invoicetransaction_mroc_current
                                ON v_s_ams_invoice_mroc_current.InvId = v_s_ams_invoicetransaction_mroc_current.InvId
                             WHERE v_s_ams_invoicetransaction_mroc_current.LineOfBus IS NOT NULL
                           )b
                        ON a.HK_H_INVOICE = b.HK_H_INVOICE
                      LEFT JOIN (
                            SELECT a.HK_h_basicpolinfo,
                                   MIN(e.NAMELOBS) AS LineOfBus
                              FROM {{ ref('DATA_VAULT','L_BASICPOLINFO_LINEOFBUSINESS') }} a
                             INNER JOIN {{ ref('DATA_VAULT','H_LINEOFBUSINESS') }} b
                                ON a.HK_h_lineofbusiness = b.HK_h_lineofbusiness
                             INNER JOIN {{ ref('DATA_VAULT','L_LOBSETUP_LINEOFBUSINESS') }} c
                                ON a.HK_h_lineofbusiness = c.HK_h_lineofbusiness
                             INNER JOIN {{ ref('DATA_VAULT','H_LOBSETUP') }} e
                                ON (e.HK_h_lobsetup = c.HK_h_lobsetup)
                             GROUP BY a.HK_h_basicpolinfo
                           )c
                        ON (a.HK_h_basicpolinfo = c.HK_h_basicpolinfo)
                   )h_invoicetransaction
             WHERE h_invoicetransaction.lineofbus = 'AUTOP'
