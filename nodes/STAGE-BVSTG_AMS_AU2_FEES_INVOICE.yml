        dependencies:
          - locationName: UNKNOWN
            nodeName: L_INVOICE_INVOICETRANSACTION
          - locationName: STAGE
            nodeName: BVSTG_AMS_AU1_FEES_INVOICE
          - locationName: STAGE
            nodeName: V_S_AMS_INVOICE_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AMS_INVOICETRANSACTION_MROC_CURRENT
          - locationName: DATA_VAULT
            nodeName: L_BASICPOLINFO_LINEOFBUSINESS
          - locationName: DATA_VAULT
