    sourceMapping:
      - aliases:
          V_POSB_SPLC_FEE: 4b69152c-7a7e-48ab-b87b-28e279edb3c6
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_FEE') }} AS SELECT PolID ,
                   TranType ,
                   Label ,
                   MAX(FeeName) FeeName ,
                   MAX(Counter) Counter ,
                   TransactionDate ,
                   SUM(Amount) Amount ,
                   PrimaryAgentUltipro_Broker ,
                   PrimaryAgentName_Broker
              FROM(
                    SELECT h_splc_gltransaction.gltid ,
                           h_splc_basicpolinfo.PolID ,
                           v_s_splc_invoicetransaction_current.TranType ,
                           v_preb_reporting_mapping.feerevenue AS Label ,
                           CASE WHEN v_preb_reporting_mapping_count.FeeRevenue IS NULL THEN 1
                                ELSE 0
                                 END AS Counter ,
                           v_s_splc_gltransaction_current.entereddate AS CreatedDate ,
                           DATE(v_s_splc_gltransaction_current.TranDate) AS TransactionDate ,
                           v_s_splc_gltransaction_current.debitamt AS Amount ,
                           v_s_splc_employee_current.ShortName AS PrimaryAgentUltipro_Broker ,
                           CONCAT(v_s_splc_employee_current.FirstName, ' ', v_s_splc_employee_current.LastName) AS PrimaryAgentName_Broker ,
                           TRIM(UPPER(IFNULL(v_preb_reporting_mapping.FeeName,''))) FeeName
                      FROM RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_GLTRANSACTION h_splc_gltransaction
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_SPLC_GLTRANSACTION_CURRENT v_s_splc_gltransaction_current
                        ON h_splc_gltransaction.HK_H_GLTRANSACTION = v_s_splc_gltransaction_current.HK_H_GLTRANSACTION
                      LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_INVOICETRANSACTION h_splc_invoicetransaction
                        ON h_splc_invoicetransaction.Invtpid = v_s_splc_gltransaction_current.Invtpid
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_SPLC_INVOICETRANSACTION_CURRENT v_s_splc_invoicetransaction_current
                        ON v_s_splc_invoicetransaction_current.HK_H_INVOICETRANSACTION = h_splc_invoicetransaction.HK_H_INVOICETRANSACTION
                      LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_BASICPOLINFO h_splc_basicpolinfo
                        ON v_s_splc_gltransaction_current.PolicyId = h_splc_basicpolinfo.PolID
                      LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_SETUPBILLINGTRAN h_splc_setupbillingtran
                        ON v_s_splc_invoicetransaction_current.ChargeCode = h_splc_setupbillingtran.ChargeCode
                      LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_EMPLOYEE h_splc_employee
                        ON h_splc_employee.EMPCODE = v_s_splc_gltransaction_current.CHANGEDBY
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_SPLC_EMPLOYEE_CURRENT v_s_splc_employee_current
                        ON v_s_splc_employee_current.HK_H_EMPLOYEE = h_splc_employee.HK_H_EMPLOYEE
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_SPLC_SETUPBILLINGTRAN_CURRENT v_s_splc_setupbillingtran_current
                        ON h_splc_setupbillingtran.HK_H_SETUPBILLINGTRAN = v_s_splc_setupbillingtran_current.HK_H_SETUPBILLINGTRAN
                      LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_EMPLOYEE h_splc_employee_fee
                        ON h_splc_employee_fee.EMPCODE = v_s_splc_gltransaction_current.CHANGEDBY
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_REPORTING_MAPPING v_preb_reporting_mapping
                        ON v_preb_reporting_mapping.TransactionType = 'SPLC'
                       AND v_preb_reporting_mapping.FeeType='SPLC'
                       AND TRIM(UPPER(IFNULL(v_preb_reporting_mapping.FeeName,''))) = UPPER(v_s_splc_setupbillingtran_current.CHARGEDESC)
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_REPORTING_MAPPING v_preb_reporting_mapping_count
                        ON v_preb_reporting_mapping_count.FeeRevenue = v_preb_reporting_mapping.FeeRevenue
                      LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.H_SPLC_POLICYTRANPREMIUM h_splc_policytranpremium
                        ON h_splc_basicpolinfo.PolID = h_splc_policytranpremium.POLID
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_SPLC_POLICYTRANPREMIUM_CURRENT v_s_splc_policytranpremium_current
                        ON v_s_splc_policytranpremium_current.HK_H_POLICYTRANPREMIUM = h_splc_policytranpremium.HK_H_POLICYTRANPREMIUM
                     WHERE v_preb_reporting_mapping_count.ClassificationGroup ='Fee'
                       AND v_s_splc_gltransaction_current.GLNumber ='11211000'
                       AND v_s_splc_policytranpremium_current.CHARGECATPOLTP = 2 QUALIFY ROW_NUMBER() OVER (PARTITION BY h_splc_gltransaction.gltid ORDER BY v_s_splc_gltransaction_current.entereddate)=1
                   )a
             GROUP BY PolID ,
                      TranType ,
                      Label ,
                      TransactionDate ,
                      PrimaryAgentUltipro_Broker ,
                      PrimaryAgentName_Broker
        dependencies:
          - locationName: DATA_VAULT
            nodeName: H_SPLC_POLICYTRANPREMIUM
