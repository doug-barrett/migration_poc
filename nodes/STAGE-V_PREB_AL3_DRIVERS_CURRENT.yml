    sourceMapping:
      - aliases:
          V_PREB_AL3_DRIVERS_CURRENT: cd4c0bf8-8efd-4331-b501-54cbc97627d3
          DS_AL3_DRIVERS: c1a101f8-5a58-448c-8377-66b760505ec9
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_AL3_DRIVERS_CURRENT') }} AS SELECT ds_al3_drivers.hk_h_sweeplogs ,
                   ds_al3_drivers.hk_h_drivergroup ,
                   ds_al3_drivers.id ,
                   ds_al3_drivers.createddate ,
                   ds_al3_drivers.al3_effectivedate ,
                   ds_al3_drivers.transactionsequencenumber ,
                   ds_al3_drivers.policynumber ,
                   ds_al3_drivers.policyeffectivedate ,
                   ds_al3_drivers.policyexpirationdate ,
                   ds_al3_drivers.customerid ,
                   ds_al3_drivers.policyid ,
                   ds_al3_drivers.driversname ,
                   ds_al3_drivers.socialsecuritynumber ,
                   ds_al3_drivers.driverslicensenumber ,
                   ds_al3_drivers.licensedstate ,
                   ds_al3_drivers.licenseclasscode ,
                   ds_al3_drivers.driversexcode ,
                   ds_al3_drivers.drivertypecode ,
                   ds_al3_drivers.dateofbirth
              FROM {{ ref('EDW','DS_AL3_DRIVERS') }} ds_al3_drivers
             INNER JOIN (
                    SELECT DISTINCT u.policyid,
                           u.id,
                           RANK() OVER (PARTITION BY u.policyid ORDER BY u.al3_effectivedate DESC,u.TRANSACTIONSEQUENCENUMBER DESC,u.id DESC) Ranking
                      FROM {{ ref('EDW','DS_AL3_DRIVERS') }} u
                   )uniqueid
                ON (ds_al3_drivers.policyid = uniqueid.policyid AND ds_al3_drivers.id = uniqueid.id AND uniqueid.Ranking = 1)
        dependencies:
          - locationName: EDW
            nodeName: DS_AL3_DRIVERS
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_AL3_DRIVERS') }}
        name: V_PREB_AL3_DRIVERS_CURRENT
        noLinkRefs: []
