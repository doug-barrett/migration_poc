        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_STATUS') }} AS SELECT h_splc_policytransaction.polid,
                   CASE WHEN v_s_splc_policytransaction_current.trantype IN ('REW','NBS','RWL') THEN 'Active'
                        WHEN v_s_splc_policytransaction_current.trantype IN ('XLC','XLN')       THEN 'Cancelled'
                        WHEN v_s_splc_policytransaction_current.trantype IN ('REI')             THEN 'Reinstated'
                        ELSE 'Active'
                         END Status,
                   v_s_splc_basicpolinfo_current.poltypelob,
                   DATE(h_splc_policytransaction.effdate) statusdate
              FROM {{ ref('DATA_VAULT','H_SPLC_POLICYTRANSACTION') }} h_splc_policytransaction
             INNER JOIN {{ ref('STAGE','V_S_SPLC_POLICYTRANSACTION_CURRENT') }} v_s_splc_policytransaction_current
                ON v_s_splc_policytransaction_current.HK_H_POLICYTRANSACTION = h_splc_policytransaction.HK_H_POLICYTRANSACTION
             INNER JOIN {{ ref('DATA_VAULT','L_SPLC_POLICYTRANSACTION_BASICPOLINFO') }} l_splc_policytransaction_basicpolinfo
                ON l_splc_policytransaction_basicpolinfo.HK_H_POLICYTRANSACTION = h_splc_policytransaction.HK_H_POLICYTRANSACTION
              LEFT JOIN {{ ref('DATA_VAULT','H_SPLC_BASICPOLINFO') }} h_splc_basicpolinfo
                ON h_splc_basicpolinfo.HK_H_BASICPOLINFO = l_splc_policytransaction_basicpolinfo.HK_H_BASICPOLINFO
              LEFT JOIN {{ ref('STAGE','V_S_SPLC_BASICPOLINFO_CURRENT') }} v_s_splc_basicpolinfo_current
                ON v_s_splc_basicpolinfo_current.HK_H_BASICPOLINFO = h_splc_basicpolinfo.HK_H_BASICPOLINFO
             WHERE v_s_splc_policytransaction_current.trantype IN ('REW','NBS','XLC','XLN','REI','RWL') QUALIFY ROW_NUMBER() OVER (PARTITION BY h_splc_policytransaction.polid,v_s_splc_basicpolinfo_current.poltypelob ORDER BY h_splc_policytransaction.effdate DESC, v_s_splc_policytransaction_current.entereddate DESC) = 1
