            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONITEM') }} ds_bvstg_ap1_transactionitem
             INNER JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                ON ds_ap1_transactionsummary.TransactionID = ds_bvstg_ap1_transactionitem.TransactionID
             INNER JOIN (
                    SELECT DISTINCT v_s_ap1_employee_mroc_current.USERID ,
                           v_s_ap1_role_mroc_current.ROLENAME ,
                           v_s_ap1_employee_mroc_current.FullName
                      FROM {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} v_s_ap1_employee_mroc_current
                     INNER JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_ROLE_MROC_CURRENT') }} v_s_ap1_employee_role_mroc_current
                        ON (v_s_ap1_employee_mroc_current.UserID = v_s_ap1_employee_role_mroc_current.UserID)
                     INNER JOIN {{ ref('STAGE','V_S_AP1_ROLE_MROC_CURRENT') }} v_s_ap1_role_mroc_current
                        ON v_s_ap1_role_mroc_current.RoleID = v_s_ap1_employee_role_mroc_current.RoleID
                     WHERE v_s_ap1_employee_role_mroc_current.ISROWDELETED = 0 QUALIFY ROW_NUMBER() OVER (PARTITION BY v_s_ap1_employee_mroc_current.USERID ORDER BY CASE WHEN v_s_ap1_role_mroc_current.ROLENAME LIKE '%Accou%' OR v_s_ap1_role_mroc_current.ROLENAME LIKE '%QC%' THEN 1 ELSE 2 END, v_s_ap1_employee_role_mroc_current.userinroleid DESC) = 1
                   )v_s_ap1_role_mroc_current
                ON v_s_ap1_role_mroc_current.USERID = ds_bvstg_ap1_transactionitem.CreatedBy
             INNER JOIN {{ ref('STAGE','DS_BVSTG_AP1_POLICY') }} ds_bvstg_ap1_policy
                ON ds_ap1_transactionsummary.PolicyID = ds_bvstg_ap1_policy.PolicyID
               AND ds_bvstg_ap1_policy.TRANSACTIONTYPE IN('New Business', 'Renewal')
             INNER JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary_NB_RWL
                ON ds_ap1_transactionsummary_NB_RWL.TransactionID = ds_bvstg_ap1_policy.TransactionID
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_LOGINSTATUS') }} ds_bvstg_ap1_loginstatus
                ON ds_bvstg_ap1_loginstatus.USERID = ds_bvstg_ap1_transactionitem.createdBy
               AND ds_bvstg_ap1_loginstatus.CREATED <= ds_bvstg_ap1_transactionitem.Created
              LEFT JOIN {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} v_s_ap1_office_mroc_current
                ON v_s_ap1_office_mroc_current.OfficeID = ds_bvstg_ap1_loginstatus.LOGGEDINOFFICEID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_ORGANIZATION_MROC_CURRENT') }} v_s_ap1_organization_mroc_current
                ON v_s_ap1_organization_mroc_current.organizationID = v_s_ap1_office_mroc_current.organizationID
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ds_retail_office.officeCode = ds_ap1_transactionsummary_NB_RWL.BIAPRIMARYAGENTOFFICE
             WHERE ((DAYOFMONTH(DATE(CURRENT_DATE())) <= 3 AND DATE(ds_bvstg_ap1_transactionitem.created) BETWEEN TO_DATE(DATEADD(MONTH,-1,date_trunc('MONTH',CURRENT_DATE()))) AND last_day(CURRENT_DATE())) OR (DAYOFMONTH(DATE(CURRENT_DATE())) > 3 AND DATE(ds_bvstg_ap1_transactionitem.created) BETWEEN TO_DATE(date_trunc('MONTH',CURRENT_DATE())) AND last_day(CURRENT_DATE())))
               AND ds_bvstg_ap1_transactionitem.codedefinition = 'FeeType'
               AND ds_bvstg_ap1_transactionitem.isvoid = 0
               AND v_s_ap1_role_mroc_current.ROLENAME IN ('Customer Service','CS - SME','CS - Back Office','CS - Escalations','CS - Retention','CS - Agent','CS - Supervisor') QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_bvstg_ap1_transactionitem.transactionitemID ORDER BY ds_bvstg_ap1_loginstatus.CREATED DESC) = 1
        name: BVSTG_AP1_CUSTOMERSERVICEFEES
