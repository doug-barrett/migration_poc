        dependencies:
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTIONITEM
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
          - locationName: STAGE
            nodeName: V_S_AP1_EMPLOYEE_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_EMPLOYEE_ROLE_MROC_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_ROLE_MROC_CURRENT
          - locationName: STAGE
