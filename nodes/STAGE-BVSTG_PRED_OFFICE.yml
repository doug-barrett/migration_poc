              LEFT JOIN {{ ref('STAGE','BVSTG_RETAIL_OFFICE') }} bvstg_retail_office
                ON v_s_boe_retail_location_mroc_current.officecode = bvstg_retail_office.officecode
             WHERE bvstg_retail_office.officecode IS NULL QUALIFY rank() OVER (PARTITION BY v_s_boe_retail_location_mroc_current.POLICYDEPARTMENT ORDER BY v_s_boe_retail_location_mroc_current.DSS_VERSION DESC) = 1
