      - aliases:
          V_S_AP1_OFFICE_MROC_CURRENT: 10a8d585-e3a5-4b7d-b330-572dffc0b6eb
          REF_AP1_CODEVALUE: 82b757c3-e1cf-4bdf-8c38-c7ff17f49fcc
          V_S_AP1_ORGANIZATION_MROC_CURRENT: 596c2a68-417d-4048-b533-df986ee97850
          BVSTG_RETAIL_OFFICE: b46935b3-c779-41d4-a3bc-ee38bc08c9b6
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_S_AP1_OFFICE_MROC_CURRENT
          - locationName: EDW
            nodeName: REF_AP1_CODEVALUE
          - locationName: STAGE
            nodeName: V_S_AP1_ORGANIZATION_MROC_CURRENT
          - locationName: STAGE
            nodeName: BVSTG_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_S_AP1_OFFICE_MROC_CURRENT') }} v_s_ap1_office_mroc_current
              JOIN {{ ref('EDW','REF_AP1_CODEVALUE') }} ref_ap1_codevalue
                ON v_s_ap1_office_mroc_current.Stateid = ref_ap1_codevalue.codevalueid
              JOIN {{ ref('STAGE','V_S_AP1_ORGANIZATION_MROC_CURRENT') }} v_s_ap1_organization_mroc_current
                ON v_s_ap1_office_mroc_current.organizationid = v_s_ap1_organization_mroc_current.organizationid
              LEFT JOIN {{ ref('STAGE','BVSTG_RETAIL_OFFICE') }} bvstg_retail_office
                ON v_s_ap1_office_mroc_current.officecode = bvstg_retail_office.officecode
             WHERE bvstg_retail_office.officecode IS NULL
               AND v_s_ap1_office_mroc_current.officecode NOT LIKE 'SSB %'
               AND v_s_ap1_office_mroc_current.officecode != 'Closed'
               AND v_s_ap1_office_mroc_current.isrowdeleted = 0
               AND v_s_ap1_organization_mroc_current.isrowdeleted = 0
             GROUP BY v_s_ap1_office_mroc_current.officecode ,
                      ref_ap1_codevalue.codevalue ,
                      v_s_ap1_organization_mroc_current.code ,
                      v_s_ap1_organization_mroc_current.name ,
                      v_s_ap1_office_mroc_current.officecode ,
                      v_s_ap1_office_mroc_current.DSS_VERSION ,
                      v_s_ap1_office_mroc_current.isActive ,
                      v_s_ap1_organization_mroc_current.organizationID ,
                      v_s_ap1_organization_mroc_current.DSS_VERSION QUALIFY rank() OVER (PARTITION BY v_s_ap1_office_mroc_current.officecode ORDER BY v_s_ap1_office_mroc_current.DSS_VERSION DESC, v_s_ap1_office_mroc_current.isActive DESC) = 1
               AND rank() OVER (PARTITION BY v_s_ap1_organization_mroc_current.organizationID ORDER BY v_s_ap1_organization_mroc_current.DSS_VERSION DESC) = 1
        name: SRC_bvstg_pred_office_ap1_NoSF
        noLinkRefs: []
