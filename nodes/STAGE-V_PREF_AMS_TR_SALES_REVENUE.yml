    sourceMapping:
      - aliases:
          V_PREF_AMS_TR_SALES_REVENUE: 6680745d-7cea-4390-817f-550d33199e23
          BVSTG_AMS_TRANSACTIONSUMMARY: 91c21d9a-fba0-4926-b489-e6d8f5263a9f
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREF_AMS_TR_SALES_REVENUE') }} AS SELECT CASE WHEN CODEDEFINITION='QuoteType' THEN 'Quote'
                        WHEN TranTypeCode IN ('REI')    THEN 'Reinstatement'
                        WHEN TranTypeCode IN ('REW')    THEN 'Rewrite'
                        WHEN TranTypeCode IN ('NBS')    THEN 'New Business'
                        WHEN TranTypeCode IN ('XLC')    THEN 'Cancellation Request'
                        WHEN TranTypeCode IN ('PCH')    THEN 'Endorsement'
                        WHEN TranTypeCode IN ('RWL')    THEN 'Renewal'
                        ELSE 'Unknown'
                         END AS TransactionType ,
                   term AS term ,
                   CustomerID AS CustomerID ,
                   'Native' AS isLegacyTransaction ,
                   TO_DATE(TransactionDate) AS Date ,
                   'UNKNOWN' AS TransactionMethod ,
                   cocode AS Mastercarrierid ,
                   CASE WHEN CODEDEFINITION='QuoteType' THEN ExecutiveId
                        ELSE BrokerId
                         END AS EmployeeNumber ,
                   NameLOBS AS lineofbusinesstype ,
                   IFNULL(OfficeCode,department) AS OfficeCode ,
                   PolicyId AS PolicyID ,
                   SUM(CASE WHEN CODEDEFINITION='QuoteType' AND TranTypeCode IN ('NBS','REW') THEN 1 ELSE 0 END) AS Quotes ,
                   0 AS leads ,
                   0 AS paid ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('REI') AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN 1 ELSE 0 END) AS reinstatements ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN BilledPremium ELSE 0 END) AS current_premium ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN BilledPremium ELSE 0 END) AS carrier_premium ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('XLC') AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN BilledPremium ELSE 0 END) AS cancelled_premium ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('REI') AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN BilledPremium ELSE 0 END) AS reinstate_premium ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN BilledPremium ELSE 0 END) AS written_premium ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN BilledPremium ELSE 0 END) AS carrier_submit_premium ,
                   0 AS voided_written_premium ,
                   0 AS voided_carrier_submit_premium ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN 1 ELSE 0 END) AS rewrites ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('PCH') AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN 1 ELSE 0 END) AS endorsements ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('XLC') AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN 1 ELSE 0 END) AS cancellations ,
                   0 AS monthly_payments ,
                   0 AS voided_rewrites ,
                   0 AS voided_endorsements ,
                   0 AS voided_monthly_payments ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('NBS','REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' THEN 1 ELSE 0 END) AS new_sales ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('NBS','REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' AND PolicyType = 'Private Passenger Auto' THEN 1 ELSE 0 END) AS new_auto_sales ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('NBS','REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND LINEOFBUS = 'AUTOP' AND INCOMEGRPLOBS='PC' AND PolicyType != 'Private Passenger Auto' THEN 1 ELSE 0 END) AS new_non_auto_sales ,
                   SUM(CASE WHEN CODEDEFINITION='AncillaryType' AND TranTypeCode IN ('NBS') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND PolicyType != 'Carrier MVR Fee' AND INCOMEGRPLOBS='OP' THEN 1 ELSE 0 END) AS new_ancillary_sales ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('RWL') THEN 1 ELSE 0 END) AS renewal_sales ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('RWL') AND PolicyType = 'Private Passenger Auto' THEN 1 ELSE 0 END) AS renewal_auto_sales ,
                   SUM(CASE WHEN CODEDEFINITION='TransactionType' AND TranTypeCode IN ('RWL') AND PolicyType != 'Private Passenger Auto' THEN 1 ELSE 0 END) AS renewal_non_auto_sales ,
                   SUM(CASE WHEN CODEDEFINITION='AncillaryType' AND TranTypeCode IN ('REW') AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND PolicyType != 'Carrier MVR Fee' AND INCOMEGRPLOBS='OP' THEN 1 ELSE 0 END) AS renewal_ancillary_sales ,
                   0 AS voided_new_sales ,
                   0 AS voided_new_auto_sales ,
                   0 AS voided_new_non_auto_sales ,
                   0 AS voided_new_ancillary_sales ,
                   0 AS voided_renewal_sales ,
                   0 AS voided_renewal_auto_sales ,
                   0 AS voided_renewal_non_auto_sales ,
                   0 AS voided_renewal_ancillary_sales ,
                   SUM(CASE WHEN CODEDEFINITION='FeeType' AND TranTypeCode IN ('NBS','REW') THEN FeeAmt ELSE 0 END) AS new_fee_revenue ,
                   SUM(CASE WHEN CODEDEFINITION='FeeType' AND TranTypeCode IN ('PCH') THEN FeeAmt ELSE 0 END) AS endorsement_revenue ,
                   0 AS monthly_payment_revenue ,
                   SUM(CASE WHEN CODEDEFINITION='FeeType' AND TranTypeCode IN ('REI') THEN FeeAmt ELSE 0 END) AS reinstatement_revenue ,
                   0 AS documentation_revenue ,
                   SUM(CASE WHEN CODEDEFINITION='FeeType' AND TranTypeCode IN ('RWL') THEN FeeAmt ELSE 0 END) AS renewal_fee_revenue ,
                   SUM(CASE WHEN TranTypeCode IN ('NBS','REW') AND CODEDEFINITION='AncillaryType' AND BILLEDPREMIUM> 0 AND ISBILLEDPREMIUM> 0 AND PolicyType != 'Carrier MVR Fee' AND INCOMEGRPLOBS='OP' THEN BilledPremium ELSE 0 END) AS ancillary_revenue ,
                   0 AS ancillary_cost ,
                   0 AS voided_new_fee_revenue ,
                   0 AS voided_endorsement_revenue ,
                   0 AS voided_monthly_payment_revenue ,
                   0 AS voided_reinstatement_revenue ,
                   0 AS voided_documentation_revenue ,
                   0 AS voided_renewal_fee_revenue ,
                   0 AS voided_ancillary_revenue ,
                   0 AS voided_ancillary_cost ,
                   0 AS payment_received ,
                   0 AS voided_payment ,
                   0 AS credit_extended ,
                   0 AS credit_collected ,
                   0 AS refund ,
                   0 AS goals_auto_policy_sales ,
                   0 AS goals_new_revenue
              FROM {{ ref('STAGE','BVSTG_AMS_TRANSACTIONSUMMARY') }}
             WHERE CODEDEFINITION='QuoteType'
                OR TranTypeCode IN ('REI')
                OR TranTypeCode IN ('REW')
                OR TranTypeCode IN ('NBS')
                OR TranTypeCode IN ('XLC')
                OR TranTypeCode IN ('PCH')
                OR TranTypeCode IN ('RWL')
             GROUP BY CASE WHEN CODEDEFINITION='QuoteType' THEN 'Quote'
                           WHEN TranTypeCode IN ('REI')    THEN 'Reinstatement'
                           WHEN TranTypeCode IN ('REW')    THEN 'Rewrite'
                           WHEN TranTypeCode IN ('NBS')    THEN 'New Business'
                           WHEN TranTypeCode IN ('XLC')    THEN 'Cancellation Request'
                           WHEN TranTypeCode IN ('PCH')    THEN 'Endorsement'
                           WHEN TranTypeCode IN ('RWL')    THEN 'Renewal'
                           ELSE 'Unknown'
                            END ,
                      term ,
                      CustomerID ,
                      TO_DATE(TransactionDate) ,
                      cocode ,
                      CASE WHEN CODEDEFINITION='QuoteType' THEN ExecutiveId
                           ELSE BrokerId
                            END ,
                      NameLOBS ,
                      IFNULL(OfficeCode,department) ,
                      PolicyId
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AMS_TRANSACTIONSUMMARY
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','BVSTG_AMS_TRANSACTIONSUMMARY') }}
        name: V_PREF_AMS_TR_SALES_REVENUE
        noLinkRefs: []
