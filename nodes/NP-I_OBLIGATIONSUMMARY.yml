          - locationName: NP
            nodeName: I_JDE_BUSINESSUNITMASTER
          - locationName: NP
            nodeName: D_OBLIGATIONVERIFICATIONTYPE
          - locationName: NP
            nodeName: D_VEHICLE
        join:
          joinCondition: |-
            FROM D_VEHICLE
              LEFT OUTER JOIN F_VEHICLECERTIFICATION
                ON D_VEHICLE.D_VEHICLE_KEY = F_VEHICLECERTIFICATION.D_VEHICLE_KEY
              LEFT OUTER JOIN [D_BUSINESSUNIT]
                ON D_VEHICLE.BUSINESSUNITCODE = D_BUSINESSUNIT.BUSINESSUNITCODE
              LEFT OUTER JOIN D_RISK
                ON D_RISK.D_RISK_KEY = F_VEHICLECERTIFICATION.D_RISK_KEY
              LEFT JOIN D_OBLIGATION
                ON ISNULL(F_VEHICLECERTIFICATION.D_OBLIGATION_KEY, (SELECT D_OBLIGATION_KEY FROM D_OBLIGATION WHERE OBLIGATIONCODE = '42')) = D_OBLIGATION.D_OBLIGATION_KEY
              LEFT JOIN I_JDE_BUSINESSUNITMASTER
                ON D_BUSINESSUNIT.BUSINESSUNITCODE = I_JDE_BUSINESSUNITMASTER.BUSINESSUNITCODE
              LEFT JOIN D_OBLIGATIONVERIFICATIONTYPE
                ON ISNULL(F_VEHICLECERTIFICATION.D_OBLIGATIONVERIFICATI_KEY, (SELECT D_OBLIGATIONVERIFICATI_KEY FROM D_OBLIGATIONVERIFICATIONTYPE WHERE VERIFICATIONTYPE = 'CUSTOM - VEHICLE CERTIFICATION')) = D_OBLIGATIONVERIFICATIONTYPE.D_OBLIGATIONVERIFICATI_KEY
             WHERE D_VEHICLE.VEHICLEREGISTER = 'JDE'
               AND D_VEHICLE.PLANTSTATUS = 'OPERATIONAL' --PRE-OPERATIONAL??  AND D_VEHICLE.REGISTRATION <> 'UNKNOWN'  AND ISNULL(F_VEHICLECERTIFICATION.D_OBLIGATION_KEY, 0) <> -1  --ONLY VEHICLES THAT ARE FLAGGED AS REQUIRED WOF/COF  AND FITNESSTESTINGREQUIREDCODE = 'Y' GROUP BY D_OBLIGATION.OBLIGATIONCODE    ,D_BUSINESSUNIT.BUSINESSUNITCODE    ,BUDGETHOLDEREMPLOYEECODE    ,VERIFICATIONTYPECODE
