              JOIN {{ ref('NP','D_OBLIGATION') }} D_OBLIGATION
                ON F_QMSCONTROLLEDDOCUMENTREVIEW.D_OBLIGATION_KEY = D_OBLIGATION.D_OBLIGATION_KEY
              JOIN {{ ref('NP','D_BUSINESSUNIT') }} D_BUSINESSUNIT
                ON F_QMSCONTROLLEDDOCUMENTREVIEW.D_BUSINESSUNIT_KEY = D_BUSINESSUNIT.D_BUSINESSUNIT_KEY
              JOIN {{ ref('NP','D_EMPLOYEE') }} D_EMPLOYEE
                ON F_QMSCONTROLLEDDOCUMENTREVIEW.D_EMPLOYEE_KEY = D_EMPLOYEE.D_EMPLOYEE_KEY
              JOIN {{ ref('NP','D_OBLIGATIONLOCATION') }} D_OBLIGATIONLOCATION
                ON F_QMSCONTROLLEDDOCUMENTREVIEW.D_OBLIGATIONLOCATION_KEY = D_OBLIGATIONLOCATION.D_OBLIGATIONLOCATION_KEY
              JOIN {{ ref('NP','D_OBLIGATIONVERIFICATIONTYPE') }} D_OBLIGATIONVERIFICATIONTYPE
                ON F_QMSCONTROLLEDDOCUMENTREVIEW.D_OBLIGATIONVERIFICATI_KEY = D_OBLIGATIONVERIFICATIONTYPE.D_OBLIGATIONVERIFICATI_KEY
             WHERE F_QMSCONTROLLEDDOCUMENTREVIEW.D_QMSDOCUMENT_KEY NOT IN (0,-1)
               AND F_QMSCONTROLLEDDOCUMENTREVIEW.D_OBLIGATIONLOCATION_KEY NOT IN (0,-1)
