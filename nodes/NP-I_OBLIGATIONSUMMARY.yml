                          ELSE 'NOT COMPLIANT'
                           END
          - columnReferences: []
            transform: CASE -- IF ALL NON COMPLIANT     WHEN MAX(I_OBLIGATIONREFERENCE_CERTIFICATIONRATIODETAILS.COMPLIANCE) = 0 THEN 'NOT COMPLIANT'     --IF ALL COMPLIANT     WHEN MIN(I_OBLIGATIONREFERENCE_CERTIFICATIONRATIODETAILS.COMPLIANCE) = 1 THEN 'COMPLIANT'     -- IF SOME ARE COMPLIANT AND SOME NOT     ELSE 'PARTIAL'     END
          - columnReferences: []
            transform: |-
              CASE WHEN CAST (I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.OBLIGATIONRESULT AS DECIMAL(9,2)) / CAST(I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.DOCUMENTCOUNT AS DECIMAL(9,2)) > .95                                                                                                                                                                                      THEN 'COMPLIANT'
                          WHEN CAST (I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.OBLIGATIONRESULT AS DECIMAL(9,2)) / CAST(I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.DOCUMENTCOUNT AS DECIMAL(9,2)) > .85 AND CAST (I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.OBLIGATIONRESULT AS DECIMAL(9,2)) / CAST(I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.DOCUMENTCOUNT AS DECIMAL(9,2)) <= .95 THEN 'PARTIAL'
                          WHEN CAST (I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.OBLIGATIONRESULT AS DECIMAL(9,2)) / CAST(I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.DOCUMENTCOUNT AS DECIMAL(9,2)) <= .85                                                                                                                                                                                     THEN 'NOT COMPLIANT'
                          ELSE 'UNKNOWN'
                           END
          - columnReferences: []
            transform: |-
              CASE WHEN OBLIGATIONRESULT = 1 THEN 'COMPLIANT'
                          ELSE 'NOT COMPLIANT'
                           END
