                          WHEN CAST (I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.OBLIGATIONRESULT AS DECIMAL(9,2)) / CAST(I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.DOCUMENTCOUNT AS DECIMAL(9,2)) > .85 AND CAST (I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.OBLIGATIONRESULT AS DECIMAL(9,2)) / CAST(I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.DOCUMENTCOUNT AS DECIMAL(9,2)) <= .95 THEN 'PARTIAL'
                          WHEN CAST (I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.OBLIGATIONRESULT AS DECIMAL(9,2)) / CAST(I_OBLIGATIONREFERENCE_SHAREPOINTDOCUMENTGROUP.DOCUMENTCOUNT AS DECIMAL(9,2)) <= .85                                                                                                                                                                                     THEN 'NOT COMPLIANT'
                          ELSE 'UNKNOWN'
                           END
          - columnReferences: []
            transform: |-
