            transform: CASE WHEN F_QMSCONTROLLEDDOCUMENTREVIEW.UPTODATEDOCUMENTCOUNT= 1 THEN 'COMPLIANT' -- THE DOCUMENT IS STILL VALID, BUT SHOULD BE REVIEWED SHORTLY   WHEN F_QMSCONTROLLEDDOCUMENTREVIEW.DUEFORREVIEWDOCUMENTCOUNT = 1 THEN 'COMPLIANT'   -- DOCUMENT IS NO LONGER WITHIN THE REVIEW PERIOD   WHEN F_QMSCONTROLLEDDOCUMENTREVIEW.OVERDUEDOCUMENTCOUNT = 1 THEN 'NOT COMPLIANT'    ELSE 'UNKNOWN' END
          - columnReferences:
              - columnCounter: 93af3002-77ea-4166-ba3c-941f9ae4b853
                stepCounter: a8d80664-5e30-42f2-88da-bcf17aa89e53
            transform: |-
              CASE WHEN SUM(F_VEHICLECERTIFICATION.VEHICLECERTIFICATIONCOMPLIANT) IS NULL AND SUM(CASE WHEN F_VEHICLECERTIFICATION.D_VEHICLE_KEY IS NULL THEN 1 ELSE 0 END) >= 1                                                                          THEN 'NOT COMPLIANT'
                          WHEN SUM(CASE WHEN F_VEHICLECERTIFICATION.D_VEHICLE_KEY IS NULL THEN 1 ELSE 0 END) >= 1 AND SUM(F_VEHICLECERTIFICATION.VEHICLECERTIFICATIONCOMPLIANT) < 1 AND SUM(F_VEHICLECERTIFICATION.VEHICLECERTIFICATIONOVERDUE) < 0              THEN 'NOT VERIFIED'
                          WHEN SUM(F_VEHICLECERTIFICATION.VEHICLECERTIFICATIONCOMPLIANT) >= 1 AND (SUM(F_VEHICLECERTIFICATION.VEHICLECERTIFICATIONOVERDUE) = 0 AND SUM(CASE WHEN F_VEHICLECERTIFICATION.D_VEHICLE_KEY IS NULL THEN 1 ELSE 0 END) = 0)            THEN 'COMPLIANT'
                          WHEN SUM(F_VEHICLECERTIFICATION.VEHICLECERTIFICATIONCOMPLIANT) >= 1 AND (SUM(F_VEHICLECERTIFICATION.VEHICLECERTIFICATIONOVERDUE) >= 1 OR SUM(CASE WHEN F_VEHICLECERTIFICATION.D_VEHICLE_KEY IS NULL THEN 1 ELSE 0 END) >= 1)           THEN 'PARTIAL'
                          WHEN SUM(ISNULL(F_VEHICLECERTIFICATION.VEHICLECERTIFICATIONCOMPLIANT, 0)) = 0 AND (SUM(F_VEHICLECERTIFICATION.VEHICLECERTIFICATIONOVERDUE) >= 1 OR SUM(CASE WHEN F_VEHICLECERTIFICATION.D_VEHICLE_KEY IS NULL THEN 1 ELSE 0 END) >= 1) THEN 'NOT COMPLIANT'
                          ELSE 'UNKNOWN'
                           END
          - columnReferences:
              - columnCounter: df99396b-a742-4b78-b9e1-83b892ec4637
                stepCounter: c660473a-ccd8-4a14-b4aa-31d7fdee55aa
            transform: |-
              CASE WHEN I_OBLIGATIONREFERENCE_AUDIT.COMPLIANCERATE > .95                                                     THEN 'COMPLIANT'
                          WHEN I_OBLIGATIONREFERENCE_AUDIT.COMPLIANCERATE >.85 AND I_OBLIGATIONREFERENCE_AUDIT.COMPLIANCERATE <=.95 THEN 'PARTIAL'
                          WHEN I_OBLIGATIONREFERENCE_AUDIT.COMPLIANCERATE <=.85                                                     THEN 'NOT COMPLIANT'
                          ELSE 'UNKNOWN'
                           END
          - columnReferences:
