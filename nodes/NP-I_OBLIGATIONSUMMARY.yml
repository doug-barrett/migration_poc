                stepCounter: 0d0b19b5-b042-475d-9d06-c93373c2a5ad
            transform: CASE --WHEN COMPETENCY CURRENT AND NO NOT CERTIFIED THEN COMPLIANT    WHEN SUM(F_COMPETENCY.COMPETENCYCURRENTCOUNT) >= 1 AND SUM(F_COMPETENCY.NOTCERTIFIEDCOUNT) = 0 THEN 'COMPLIANT'    --WHEN SOME ARE CURRENT AND SOME ARE NOT CERTIFIED THEN PARTIAL    WHEN SUM(F_COMPETENCY.NOTCERTIFIEDCOUNT) >= 1 AND SUM(F_COMPETENCY.COMPETENCYCURRENTCOUNT) >= 1 THEN 'PARTIAL'    --WHEN NONE ARE CURRENT AND SOME ARE NOT CERTIFIED THEN NOT COMPLIANT    WHEN SUM(F_COMPETENCY.NOTCERTIFIEDCOUNT) >= 1 AND SUM(F_COMPETENCY.COMPETENCYCURRENTCOUNT) = 0 THEN 'NOT COMPLIANT'    --WHEN NONE ARE CURRENT AND NONE ARE EXPIRED    ELSE 'UNKNOWN'   END
          - columnReferences: []
