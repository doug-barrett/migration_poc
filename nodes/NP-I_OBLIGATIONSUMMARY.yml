            transform: CASE -- IF ALL NON COMPLIANT     WHEN MAX(I_OBLIGATIONREFERENCE_CERTIFICATIONRATIODETAILS.COMPLIANCE) = 0 THEN 'NOT COMPLIANT'     --IF ALL COMPLIANT     WHEN MIN(I_OBLIGATIONREFERENCE_CERTIFICATIONRATIODETAILS.COMPLIANCE) = 1 THEN 'COMPLIANT'     -- IF SOME ARE COMPLIANT AND SOME NOT     ELSE 'PARTIAL'     END
