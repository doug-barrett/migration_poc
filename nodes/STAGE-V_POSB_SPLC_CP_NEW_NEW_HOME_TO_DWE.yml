        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_CP_NEW_NEW_HOME_TO_DWE') }} AS SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.ID
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
             INNER JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION_NEW_NEW_2
                ON DS_SPLC_POLICYTRANSACTION.PRIORPOLID= DS_SPLC_POLICYTRANSACTION_NEW_NEW_2.POLICYID
               AND DS_SPLC_POLICYTRANSACTION_NEW_NEW_2.POLICYTYPE Like 'Dwelling Fire%'
               AND DATE(DS_SPLC_POLICYTRANSACTION_NEW_NEW_2.STATUSDATE) >= DATE(DATEADD(DAY,-30,DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)))
               AND DS_SPLC_POLICYTRANSACTION_NEW_NEW_2.Status='Cancelled'
               AND DS_SPLC_POLICYTRANSACTION.POLICYTYPE Like 'Homeowners%'
             WHERE DS_SPLC_POLICYTRANSACTION.TranType ='NBS'
