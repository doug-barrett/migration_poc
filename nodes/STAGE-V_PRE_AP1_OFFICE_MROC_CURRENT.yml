        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} AS SELECT o.HK_H_OFFICE,
                   o.OFFICEID,
                   o.officecode Ap1_officecode,
                   o.ORGANIZATIONID,
                   o.CREATED,
                   o.CREATEDBY,
                   o.LASTUPDATED,
                   o.LASTUPDATEDBY,
                   o.ISROWDELETED,
