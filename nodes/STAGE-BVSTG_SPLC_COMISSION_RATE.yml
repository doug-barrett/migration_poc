                          WHEN Renewal_All_Customers = 1                                            THEN CASE WHEN TRANTYPE IN ('ARR', 'RWR', 'RIX', 'BRW', 'SYR', 'RWL', 'SYN', 'RNR') AND New_New_o = 1 THEN 'New/New 1st Renewal 6M' WHEN TRANTYPE IN ('ARR', 'RWR', 'RIX', 'BRW', 'SYR', 'RWL', 'SYN', 'RNR') AND New_Old_o = 1 THEN 'New/Old 1st Renewal 6M' WHEN TRANTYPE IN ('ARR', 'RWR', 'RIX', 'BRW', 'SYR', 'RWL', 'SYN', 'RNR') AND Cross_Sell_Existing_o = 1 THEN 'Cross Sell 1st Renewal 6M' WHEN TRANTYPE = 'XLC' AND New_New_o = 1 THEN 'New/New Cancellation' WHEN TRANTYPE = 'XLC' AND New_Old_o = 1 THEN 'New/Old Cancellation' WHEN TRANTYPE = 'XLC' AND Cross_Sell_Existing_o = 1 THEN 'Cross Sell Cancellation' WHEN TRANTYPE = 'REI' AND New_New_o = 1 THEN 'New/New Reinstatement' WHEN TRANTYPE = 'REI' AND New_Old_o = 1 THEN 'New/Old Reinstatement' WHEN TRANTYPE = 'REI' AND Cross_Sell_Existing_o = 1 THEN 'Cross Sell Reinstatement' WHEN TRANTYPE IN ('RWX', 'NRA') AND New_New_o = 1 THEN 'New/New Non Renewal' WHEN TRANTYPE IN ('RWX', 'NRA') AND New_Old_o = 1 THEN 'New/Old Non Renewal' WHEN TRANTYPE IN ('RWX', 'NRA') AND Cross_Sell_Existing_o = 1 THEN 'Cross Sell Non Renewal' WHEN TRANTYPE IN ('BPC', 'PCH', 'PAB', 'POL', 'BND') AND New_New_o = 1 THEN 'New/New Policy Change' WHEN TRANTYPE IN ('BPC', 'PCH', 'PAB', 'POL', 'BND') AND New_Old_o = 1 THEN 'New/Old Policy Change' WHEN TRANTYPE IN ('BPC', 'PCH', 'PAB', 'POL', 'BND') AND Cross_Sell_Existing_o = 1 THEN 'Cross Sell Policy Change' END
                          WHEN WinBack_Flag = 1                                                     THEN CASE WHEN TRANTYPE IN ('REW', 'NBS') THEN 'WinBack' WHEN TRANTYPE IN ('ARR', 'RWR', 'RIX', 'BRW', 'SYR', 'SYN', 'RNR') THEN 'WinBack' END
                          WHEN Replacement_Flag = 1                                                 THEN CASE WHEN TRANTYPE IN ('REW', 'NBS') THEN '' WHEN TRANTYPE IN ('ARR', 'RWR', 'RIX', 'BRW', 'SYR', 'SYN', 'RNR') THEN '' WHEN TRANTYPE IN ('BPC', 'PCH', 'PAB', 'POL', 'BND') THEN 'Policy Change' WHEN TRANTYPE = 'XLC' THEN 'Cancellation' WHEN TRANTYPE = 'REI' THEN 'Reinstatement' WHEN TRANTYPE IN ('RWX', 'NRA') THEN 'Non Renewal' END
