          - locationName: NP
            nodeName: I_SHP_OBLIGATIONREFERENCE
          - locationName: NP
            nodeName: I_SHP_SHAREPOINTLISTITEM
        join:
          joinCondition: |-
            FROM {{ ref('NP','I_SHP_OBLIGATIONREFERENCE') }} I_SHP_OBLIGATIONREFERENCE
              LEFT JOIN {{ ref('NP','I_SHP_SHAREPOINTLISTITEM') }} I_SHP_SHAREPOINTLISTITEM
                ON I_SHP_OBLIGATIONREFERENCE.LINKEDDOCUMENT = I_SHP_SHAREPOINTLISTITEM.LISTLINK
              LEFT OUTER JOIN D_OBLIGATIONLOCATION
                ON D_OBLIGATIONLOCATION.OBLIGATIONLOCATION = I_SHP_SHAREPOINTLISTITEM.DEPOT
              LEFT OUTER JOIN D_EMPLOYEE
                ON EMAIL = I_SHP_SHAREPOINTLISTITEM.RESPONSIBLEPERSON
             WHERE I_SHP_OBLIGATIONREFERENCE.VERIFICATIONTYPE = 'SHAREPOINT LIST'
               AND I_SHP_OBLIGATIONREFERENCE.SCOPE = 'DEPOT'
