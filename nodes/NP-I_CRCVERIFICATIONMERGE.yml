            FROM {{ ref('NP','F_AUDITQUESTIONS') }} F_AUDITQUESTIONS
              JOIN {{ ref('NP','D_EMPLOYEE') }} D_EMPLOYEE
                ON F_AUDITQUESTIONS.D_EMPLOYEE_KEY = D_EMPLOYEE.D_EMPLOYEE_KEY
              JOIN {{ ref('NP','D_AUDITDETAILS') }} D_AUDITDETAILS
                ON F_AUDITQUESTIONS.D_AUDITDETAILS_KEY = D_AUDITDETAILS.D_AUDITDETAILS_KEY
              JOIN {{ ref('NP','D_RISK') }} D_RISK
