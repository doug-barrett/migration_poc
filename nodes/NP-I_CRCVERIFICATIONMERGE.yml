              JOIN {{ ref('NP','D_AUDITQUESTION') }} D_AUDITQUESTION
                ON F_AUDITQUESTIONS.D_AUDITQUESTION_KEY = D_AUDITQUESTION.D_AUDITQUESTION_KEY
              JOIN {{ ref('NP','D_WORKORDER') }} D_WORKORDER
                ON F_AUDITQUESTIONS.D_WORKORDER_KEY = D_WORKORDER.D_WORKORDER_KEY
              JOIN {{ ref('NP','D_BUSINESSUNIT') }} D_BUSINESSUNIT
                ON F_AUDITQUESTIONS.D_BUSINESSUNIT_KEY = D_BUSINESSUNIT.D_BUSINESSUNIT_KEY
             WHERE (D_AUDITDETAILS.AUDITFORM = 'ONSITE OBSERVATION' OR D_AUDITDETAILS.AUDITFORM = 'ONSITE OBSERVATION (CRC)')
