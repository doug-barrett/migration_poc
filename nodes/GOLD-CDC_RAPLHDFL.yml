    sourceMapping:
    - aliases:
        SRC_RAPLHDFL: 2479d7a4-a91b-5a29-bc8d-acf87aa6fda2
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: SRC_RAPLHDFL
      join:
        joinCondition: |-
          FROM {{ ref('GOLD', 'SRC_RAPLHDFL') }} "SRC_RAPLHDFL"
           Where Aud_Time <= (Select MAX(Batch_End) FROM "DOUG_POC"."DP001"."CDC_BATCH")
          AND Aud_Time > (Select MAX(Batch_Start) FROM "DOUG_POC"."DP001"."CDC_BATCH")
          AND (Aud_Code <> 'F' or (Aud_Code is null and Aud_Type = 'RR'))
           QUALIFY RANK() 
          OVER (PARTITION BY  ROCMP,      
          ROPHL0     
          ORDER BY AUD_TIME DESC, CASE  
          WHEN Aud_Type in ('PT','PX','FI')   THEN 1 
          WHEN Aud_Type in ('UB','FB','FP','BR')  THEN 2 
          WHEN Aud_Type in ('UP','UR')               THEN 3 
          WHEN Aud_Type in ('DL' , 'FD')      THEN 4 
          WHEN Aud_Type in ('RR')              THEN 5 
           ELSE 0 END DESC) = 1
      name: CDC_RAPLHDFL
      noLinkRefs: []
