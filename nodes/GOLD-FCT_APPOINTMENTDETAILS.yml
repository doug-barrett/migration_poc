  description: "Fact: AppointmentDetails\n\nDAX Measures (for Semantic View):\n  -\
    \ Invoice Appointments:  CALCULATE(COUNTROWS(AppointmentDetails),AppointmentDetails[Status]=\"\
    CLOSED\",AppointmentDetails[TechUsername]<>\"-11\",USE\n  - Latest Closed Appointment\
    \ Date: CALCULATE(max(AppointmentDetails[AppointmentDate]),AppointmentDetails[Status]=\"\
    Closed\")\n  - Tech Job Count:   IF(IScrossFILTERED(Technicians[TechnicianName]),\
    \     CALCULATE(DISTINCTCOUNT(AppointmentDetails[JobId]), Jobs[JobStatu\n  - Tech\
    \ Head Count:  COUNTROWS(FILTER(VALUES(AppointmentDetails[TechUsername]), [Tech\
    \ Job Count]>0))\n  - Average Tech Jobs:  DIVIDE(AppointmentDetails[Tech Job Count],\
    \ AppointmentDetails[Tech Head Count])\n  - Average Daily Tech Jobs:   DIVIDE([Average\
    \ Tech Jobs], [Working Days])\n  - Appointment Count:  CALCULATE(COUNTROWS(AppointmentDetails),\
    \ AppointmentDetails[Status] IN {\"Open\", \"Closed\"}, keepfilters(AppointmentDetai\n\
    \  - Appointments Job Count:  calculate( DISTINCTCOUNT(AppointmentDetails[JobId]),\
    \ AppointmentDetails[Status] IN {\"Open\", \"Closed\"}, userelationship(\n  -\
    \ Appointments Resched Count:   calculate( COUNT(AppointmentDetails[JobId]), \
    \ AppointmentDetails[Status] = \"Resched\",  keepfilters(AppointmentDetails[\n\
    \  - Tech Completion %:  round( divide( [Appointments Job Count], [Appointments\
    \ Job Count] + [Appointments Resched Count], 0),3 ) \n"
