                           row_number() OVER (PARTITION BY BVSTG_PMKT_AU1_CISCO_CALL_BASE_PRE_CUSTOMERID.sessionid ORDER BY startdatetime) AS call_row_number_,
                           round(TIMESTAMPDIFF(SECONDS, startdatetime,enddatetime) / 60, 2) AS call_duration_minutes_,
                           t2.skill_queue,
                           concat(ifnull(t2.level2,'-'), ' ', ifnull(t2.level3,'-')) AS skillgrouptargetname_final
                      FROM "RETAIL_DEV"."SCH_BVSTAGE"."BVSTG_PMKT_AU1_CISCO_CALL_BASE_PRE_CUSTOMERID" BVSTG_PMKT_AU1_CISCO_CALL_BASE_PRE_CUSTOMERID
                      LEFT JOIN "RETAIL_DEV"."SCH_EDW"."DS_PCCE_SKILL_PQUEUE_MAPPING" AS t2
                        ON lower(trim(BVSTG_PMKT_AU1_CISCO_CALL_BASE_PRE_CUSTOMERID.SKILLGROUPTARGETNAME)) = lower(trim(t2.queue_name))
                   ) BVSTG_PMKT_AU1_CISCO_CALL_BASE_PRE_CUSTOMERID
              LEFT JOIN (
                    SELECT DISTINCT ap1_userid,
                           EmployeeNumber,
                           employeename,
                           officecode,
                           lower(cisco_loginname) AS cisco_loginname,
                           companycode,
                           hr_status,
                           company,
                           originalhiredate,
                           lasthiredate,
                           terminationdate,
                           jobtitle,
                           jobfamily,
                           jobcode,
                           employeetype
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY"
                     WHERE Rank_EmployeeNumber=1
                       AND cisco_loginname IS NOT NULL QUALIFY row_number() OVER (PARTITION BY employeenumber ORDER BY dss_create_time) = 1
                   ) DS_AGENT_KEY
                ON lower(trim(BVSTG_PMKT_AU1_CISCO_CALL_BASE_PRE_CUSTOMERID.agent)) = lower(trim(DS_AGENT_KEY.CISCO_LOGINNAME))
              LEFT JOIN ( SELECT DISTINCT id,
                   first_agentoffice,
                   last_agentoffice,
                   CASE WHEN (lower(trim(first_agentoffice)) like ('%ctsc%') OR lower(trim(first_agentoffice)) like ('%speciality%telesales%') OR lower(trim(first_agentoffice)) like ('%telesales%'))                                                                                                                                                                                           THEN 'Telesales'
                        WHEN (lower(trim(first_agentoffice)) like ('%customer%service%') OR lower(trim(first_agentoffice)) like ('%cs%one%service') OR lower(trim(first_agentoffice)) like ('%cs%back%office%') OR lower(trim(first_agentoffice)) like ('%one%source%cs%') OR lower(trim(first_agentoffice)) like ('%cs%one%source%') OR lower(trim(first_agentoffice)) like ('%cs%retention%')) THEN 'Customer Service'
                        WHEN DS_RETAIL_OFFICE.territorymanagername='Michael Sanchez' OR lower(trim(first_agentoffice)) like '%zca%'                                                                                                                                                                                                                                                              THEN 'Franchise'
                        WHEN lower(trim(first_agentoffice)) like '%corp%'                                                                                                                                                                                                                                                                                                                        THEN 'Corporate'
                        WHEN DS_RETAIL_OFFICE.officetype IS NOT NULL                                                                                                                                                                                                                                                                                                                             THEN DS_RETAIL_OFFICE.officetype
                        ELSE 'Others'
                         END AS first_agentoffice_grouped, ----------Updated    case     when (lower(trim(last_agentoffice)) like ('%ctsc%')        or lower(trim(last_agentoffice)) like ('%speciality%telesales%')        or lower(trim(last_agentoffice)) like ('%telesales%')) then 'Telesales'    when (lower(trim(last_agentoffice)) like ('%customer%service%')            or lower(trim(last_agentoffice)) like ('%cs%one%service')            or lower(trim(last_agentoffice)) like ('%cs%back%office%')            or lower(trim(last_agentoffice)) like ('%one%source%cs%')            or lower(trim(last_agentoffice)) like ('%cs%one%source%')            or lower(trim(last_agentoffice)) like ('%cs%retention%')) then 'Customer Service'     when DS_RETAIL_OFFICE_1.territorymanagername='Michael Sanchez' or lower(trim(last_agentoffice)) like '%zca%' then 'Franchise'     when lower(trim(last_agentoffice)) like '%corp%' then 'Corporate'    when DS_RETAIL_OFFICE_1.officetype is not null then DS_RETAIL_OFFICE_1.officetype            else 'Others' end as last_agentoffice_grouped  ----------Updated        from "RETAIL_PROD"."SCH_EDW"."DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION"       left join "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE"              on ifnull(DS_RETAIL_OFFICE.officecode,'-')=ifnull(DS_PCCE_TERMI
