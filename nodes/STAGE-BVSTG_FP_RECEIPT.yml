        description: ""
        name: RECEIVABLETYPEDESC
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN v_dlbv_fp_receiptdetail.ReceivableType =1                                                                                        THEN 'Interest'
                          WHEN v_dlbv_fp_staticreceipttype.description ='Recovered Write-Off' AND v_dlbv_fp_receiptdetail.ReceivableType =2                     THEN 'Rcpt_Rev_WO_2'
                          WHEN v_dlbv_fp_staticreceipttype.description !='Recovered Write-Off' AND v_dlbv_fp_receiptdetail.ReceivableType =2                    THEN 'Principal'
                          WHEN v_dlbv_fp_receiptdetail.ReceivableType =3                                                                                        THEN 'Late Fee'
                          WHEN v_dlbv_fp_receiptdetail.ReceivableType =4                                                                                        THEN 'NSF Fee'
                          WHEN v_dlbv_fp_receiptdetail.ReceivableType =5                                                                                        THEN 'Cancel Fee'
                          WHEN v_dlbv_fp_receiptdetail.ReceivableType =6                                                                                        THEN 'Other'
                          WHEN v_dlbv_fp_receiptdetail.ReceivableType =7                                                                                        THEN 'Florida Doc Stamp'
                          WHEN v_dlbv_fp_staticreceipttype.description IN('Recovered Write-Off','Write Off') AND v_dlbv_fp_receiptdetail.ReceivableType =8     THEN 'Principal'
                          WHEN v_dlbv_fp_staticreceipttype.description NOT IN('Recovered Write-Off','Write Off') AND v_dlbv_fp_receiptdetail.ReceivableType =8 THEN 'Principal and Interested'
                          WHEN v_dlbv_fp_receiptdetail.ReceivableType =8                                                                                        THEN 'Principal and Interest'
                          WHEN v_dlbv_fp_receiptdetail.ReceivableType =9                                                                                        THEN 'Setup Fee'
                          WHEN v_dlbv_fp_receiptdetail.ReceivableType =10                                                                                       THEN 'Down Payment'
                          WHEN v_dlbv_fp_receiptdetail.ReceivableType =11                                                                                       THEN 'Add-on Product'
                           END
