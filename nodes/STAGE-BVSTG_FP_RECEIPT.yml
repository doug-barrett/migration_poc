            nodeName: V_DLBV_FP_RECEIPTDETAIL
          - locationName: STAGE
            nodeName: V_DLBV_FP_STATICRECEIPTTYPE
          - locationName: STAGE
            nodeName: V_DLBV_FP_ACCOUNTS
          - locationName: STAGE
            nodeName: V_DLBV_FP_COMPANY
          - locationName: STAGE
            nodeName: V_DLBV_FP_ACCOUNTINSURANCEPOLICIES
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_DLBV_FP_RECEIPT') }} v_dlbv_fp_receipt
             INNER JOIN {{ ref('STAGE','V_DLBV_FP_RECEIPTDETAIL') }} v_dlbv_fp_receiptdetail
                ON v_dlbv_fp_receiptdetail.ReceiptID = v_dlbv_fp_receipt.ID
               AND CASE WHEN v_dlbv_fp_receipt.DSS_RECORD_SOURCE LIKE '%AMS%' THEN 'CIGH'
                        ELSE 'SPLC'
                         END = CASE WHEN v_dlbv_fp_receiptdetail.DSS_RECORD_SOURCE LIKE '%AMS%' THEN 'CIGH'
                        ELSE 'SPLC'
                         END
              LEFT JOIN {{ ref('STAGE','V_DLBV_FP_STATICRECEIPTTYPE') }} v_dlbv_fp_staticreceipttype
                ON v_dlbv_fp_receipt.RECEIPTTYPE = v_dlbv_fp_staticreceipttype.id
               AND CASE WHEN v_dlbv_fp_receipt.DSS_RECORD_SOURCE LIKE '%AMS%' THEN 'CIGH'
                        ELSE 'SPLC'
                         END = CASE WHEN v_dlbv_fp_staticreceipttype.DSS_RECORD_SOURCE LIKE '%AMS%' THEN 'CIGH'
                        ELSE 'SPLC'
                         END
              LEFT JOIN {{ ref('STAGE','V_DLBV_FP_ACCOUNTS') }} V_DLBV_FP_ACCOUNTS
                ON V_DLBV_FP_ACCOUNTS.ID = v_dlbv_fp_receipt.accountid
               AND CASE WHEN V_DLBV_FP_ACCOUNTS.DSS_RECORD_SOURCE like '%AMS%' THEN 'CIGH'
                        ELSE 'SPLC'
                         END = CASE WHEN v_dlbv_fp_receipt.DSS_RECORD_SOURCE like '%AMS%' THEN 'CIGH'
                        ELSE 'SPLC'
                         END
              LEFT JOIN (
                    SELECT p.ACCOUNTID,
                           CO.SITEID,
                           CO.name,
                           CASE WHEN CO.DSS_RECORD_SOURCE like '%AMS%' THEN 'CIGH'
                                ELSE 'SPLC'
                                 END SourceDB
                      FROM {{ ref('STAGE','V_DLBV_FP_COMPANY') }} CO
                     INNER JOIN {{ ref('STAGE','V_DLBV_FP_ACCOUNTINSURANCEPOLICIES') }} p
                        ON CO.ID=p.INS_ID
                       AND CASE WHEN CO.DSS_RECORD_SOURCE like '%AMS%' THEN 'CIGH'
                                ELSE 'SPLC'
                                 END = CASE WHEN P.DSS_RECORD_SOURCE like '%AMS%' THEN 'CIGH'
                                ELSE 'SPLC'
                                 END
                   )V_DLBV_FP_COMPANY
                ON V_DLBV_FP_COMPANY.ACCOUNTID = V_DLBV_FP_ACCOUNTS.ID
               AND V_DLBV_FP_COMPANY.SITEID=V_DLBV_FP_ACCOUNTS.SITEID
               AND V_DLBV_FP_COMPANY.SOURCEDB = CASE WHEN V_DLBV_FP_ACCOUNTS.DSS_RECORD_SOURCE like '%AMS%' THEN 'CIGH'
                        ELSE 'SPLC'
                         END
              LEFT JOIN RETAIL_PROD.SCH_DATA_VAULT.s_ams_basicpolinfo_mroc s_ams_basicpolinfo_mroc
                ON SPLIT_PART(s_ams_basicpolinfo_mroc.DESCRIPTIONBPOL,'#',2) = V_DLBV_FP_ACCOUNTS.ACCOUNTNUMBER
               AND s_ams_basicpolinfo_mroc.DESCRIPTIONBPOL IS NOT NULL
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_AMS_TRANSACTIONDETAIL ds_ams_transactiondetail
                ON ds_ams_transactiondetail.PolicyID = s_ams_basicpolinfo_mroc.polid
               AND ds_ams_transactiondetail.ModeID IN(12,14)
             WHERE DATE(v_dlbv_fp_receipt.ReceiptDate) >= '2021-01-01' QUALIFY ROW_NUMBER() OVER (PARTITION BY v_dlbv_fp_receipt.id ORDER BY v_dlbv_fp_receipt.id)=1
        name: BVSTG_FP_RECEIPT
        noLinkRefs: []
