      dependencies:
      - locationName: GOLD
        nodeName: SRC_SYSRGNFL
      join:
        joinCondition: "FROM {{ ref('GOLD', 'SRC_SYSRGNFL') }} \"SRC_SYSRGNFL\"\n\
          \ Where AUD_TIME <= (Select MAX(BATCH_END) FROM {{ ref('SILVER', 'CDC_BATCH') }} )\nand      AUD_TIME  >  (Select MAX(BATCH_START) FROM {{ ref('SILVER', 'CDC_BATCH') }})\nAND (AUD_CODE <> 'F' or (AUD_CODE is null and\
          \ AUD_TYPE = 'RR')) QUALIFY RANK() \nOVER (PARTITION BY  ZRCMP, ZRRGN  \
          \  \nORDER BY AUD_TIME DESC, AUD_SEQNO DESC, CASE  \nWHEN AUD_TYPE in ('PT','PX','FI')\
          \   THEN 1 \nWHEN AUD_TYPE in ('UB','FB','FP','BR')  THEN 2 \nWHEN AUD_TYPE\
          \ in ('UP','UR')               THEN 3 \nWHEN AUD_TYPE in ('DL' , 'FD') \
          \     THEN 4 \nWHEN AUD_TYPE in ('RR')              THEN 5 \n ELSE 0 END\
          \ DESC) = 1"
