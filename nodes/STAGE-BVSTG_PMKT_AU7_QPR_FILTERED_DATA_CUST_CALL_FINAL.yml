        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT SESSIONAGENTID_FINAL,
                   SESSIONID_FINAL,
                   AGENT,
                   SOURCE_DATA,
                   SKILLGROUPTARGETNAME_FINAL,
                   SKILL_QUEUE,
                   FINAL_CUSTOMER_ID_TO_KEEP,
                   TIME_FLAG,
                   AGENT_OFFICE_GROUPED,
                   FIRST_AGENTOFFICE_GROUPED,
                   LAST_AGENTOFFICE_GROUPED,
                   CALLTYPEDESCRIPTION,
                   FIRST_SKILLGROUP,
                   FIRST_SKILL_QUEUE,
                   SECOND_SKILLGROUP,
                   SECOND_SKILL_QUEUE,
                   LAST_SKILLGROUP,
                   LAST_SKILL_QUEUE,
                   TOTAL_AGENTS,
                   IS_ICR,
                   ICR_RESULT,
                   ANI_POPULATED,
                   FCR_ELIGIBLE_FLAG,
                   FINAL_SKILL_QUEUE,
                   ACTION_FINAL,
                   STARTDATETIME,
                   ENDDATETIME,
                   SKILLGROUP_TRANSFER_FLAG,
                   CONCAT('Call :', call_number, ', ', ACTION_FINAL_TO_TAKE) AS ACTION_FINAL_TO_TAKE, -- String formatting from v2     GROUPS_, FINAL_TRANSATION, SUCCESS_FLAG, STARTDATE, ENDDATE, CUSTOMERS, TIME_FLAG_FINAL,     STARTDATETIME_CALL, STARTDATE_CALL,     CONCAT('Call :', call_number, ', ', action_final_to_take_cust) AS ACTION_FINAL_TO_TAKE_CUST,     TOTAL_CALLS, CALL_DURATION, GAP_BETWEEN_CALL, AVG_CALL_DURATION, AVG_GAP_BETWEEN_CALLS,     CONCAT('Call :', call_number, ', ', action_final_to_take_new) AS ACTION_FINAL_TO_TAKE_NEW,     fcr_flag, FCR_Txn_Flag, call_number FROM (     SELECT          v1.*,         CASE WHEN fcr.sessionid IS NOT NULL THEN 'FCR' ELSE 'Non FCR' END AS fcr_flag,         CASE              WHEN v1.fcr_eligible_flag = 'FCR Eligible' AND fcr.sessionid IS NOT NULL AND v1.success_flag = 1 THEN 'Txn Done - FCR'             WHEN v1.fcr_eligible_flag = 'FCR Eligible' AND fcr.sessionid IS NULL AND v1.success_flag = 1 THEN 'Txn Done - Non FCR'             WHEN v1.fcr_eligible_flag = 'FCR Eligible' AND v1.success_flag = 0 THEN 'No Txn'             WHEN v1.fcr_eligible_flag = 'Not FCR Eligible' AND v1.success_flag = 1 THEN 'Txn Done - Non FCR'             WHEN v1.fcr_eligible_flag = 'Not FCR Eligible' AND v1.success_flag = 0 THEN 'No Txn'             ELSE 'Check'          END AS FCR_Txn_Flag     FROM (         SELECT              BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL.*,             BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST.call_number, BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST.total_calls, BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST.call_duration,              BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST.gap_between_call, BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST.avg_call_duration, BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST.avg_gap_between_calls,             CASE WHEN BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL.source_data IN ('app one') THEN NULL ELSE BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL.action_final_to_take END AS action_final_to_take_cust,             CASE WHEN BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL.source_data = 'Transactions' THEN NULL ELSE BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL.action_final_to_take END AS action_final_to_take_new         FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL AS BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL         LEFT JOIN RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST AS BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST              ON BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL.customers = BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST.customers AND BVSTG_PMKT_AU5_QPR_FILTERED_DATA_FINAL.sessionid_final = BVSTG_PMKT_AU6_QPR_FILTERED_DATA_CUST.sessionid_final     ) v1     LEFT JOIN (         SELECT DISTINCT sessionid         FROM (             SELECT sessionid,                 CASE                      WHEN DATEDIFF(day, startdatetime, call_time_after_session) > 27 THEN 'FCR Eligible'                     WHEN DATEDIFF(day, startdatetime, call_time_after_session) IS NULL AND DATEDIFF(day, startdatetime, CURRENT_DATE) < 27 THEN 'NA'                     WHEN DATEDIFF(day, startdatetime, call_time_after_session) IS NULL THEN 'FCR Eligible'                     ELSE 'Not FCR Eligible'                 END AS fcr_status             FROM RETAIL_DEV.SCH_BVSTAGE.V_BVSTG_PMKT_AU01_FCR_FLAG         ) WHERE fcr_status = 'FCR Eligible'     ) fcr ON v1.sessionid_final = fcr.sessionid AND v1.FCR_ELIGIBLE_FLAG = 'FCR Eligible' AND v1.success_flag = 1 ) formatted_base UNION ALL SELECT      SESSIONAGE
