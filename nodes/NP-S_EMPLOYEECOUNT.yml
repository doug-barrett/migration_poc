            transform: |-
              CASE WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 20  THEN '< 20'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 25  THEN '20 - 24'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 30  THEN '25 - 29'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 35  THEN '30 - 34'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 40  THEN '35 - 39'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 45  THEN '40 - 44'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 50  THEN '45 - 49'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 55  THEN '50 - 54'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 60  THEN '55 - 59'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 65  THEN '60 - 64'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, BIRTHDATE, MONTHDATE)) / 12) < 100 THEN '65+'
                          ELSE 'UNKNOWN'
                           END
