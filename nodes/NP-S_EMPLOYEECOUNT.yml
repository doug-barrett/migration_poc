        dataType: VARCHAR(80)
        defaultValue: ""
        description: Length Of Service
        name: LENGTHOFSERVICE
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, I_EMPLOYEECOUNT_HIST.STARTDATE, MONTHDATE)) / 12) < .6 THEN 'LESS THAN 6 MONTHS'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, I_EMPLOYEECOUNT_HIST.STARTDATE, MONTHDATE)) / 12) < 2  THEN '6 MONTHS - 2 YEARS'
                          WHEN CONVERT(DECIMAL(10, 2), CONVERT(DECIMAL(10, 2), DATEDIFF(MONTH, I_EMPLOYEECOUNT_HIST.STARTDATE, MONTHDATE)) / 12) < 5  THEN '2 - 5 YEARS'
                          ELSE 'MORE THAN 5 YEARS'
                           END
      - appliedColumnTests: {}
