            FROM RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_AGENT_SESSION ds_pcce_termination_call_agent_session
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_CALL_CUSTOMER ds_mkt_call_customer
                ON ds_mkt_call_customer.interactionidkey = ds_pcce_termination_call_agent_session.sessionid
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_CUSTOMERSUMMARY_V2 ds_customersummary_v2
                ON ds_customersummary_v2.CustomerID = TO_VARCHAR(ds_mkt_call_customer.CustomerID)
               AND ds_customersummary_v2.sourcedb = 'AppOne'
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY ds_ram_retail_repository
                ON ds_ram_retail_repository.customerid = TO_VARCHAR(ds_mkt_call_customer.customerid)
               AND ds_ram_retail_repository.sourcedb = 'AppOne'
             INNER JOIN RETAIL_PROD.SCH_EDW.DS_AGENT_KEY ds_agent_key
                ON ds_agent_key.cisco_skilltargetid = ds_pcce_termination_call_agent_session.agentskilltargetid
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_CFA_HCI_AGENTS_CURRENT v_dlbv_cfa_hci_agents_current --hci    ON v_dlbv_cfa_hci_agents_current.employeenumber = to_varchar(ds_agent_key.employeenumber)    LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_BOE_TJ_EMPLOYEE_CURRENT v_s_boe_tj_employee_current  --tj     ON v_s_boe_tj_employee_current.ultipronumber = to_varchar(ds_agent_key.employeenumber)      LEFT JOIN RETAIL_PROD.SCH_EDW.DS_RETAIL_OFFICE ds_retail_office   ON ds_agent_key.OfficeCode = ds_retail_office.OfficeCode    WHERE DATE(ds_pcce_termination_call_agent_session.STARTDATETIME) >= DATE_TRUNC('MONTH', DATEADD(MONTH, - 12, CURRENT_DATE ()))   GROUP BY ds_agent_key.EMPLOYEENUMBER,        DS_PCCE_TERMINATION_CALL_AGENT_SESSION.STARTDATETIME       ,v_dlbv_cfa_hci_agents_current.userid,        v_s_boe_tj_employee_current.useri3,        v_dlbv_cfa_hci_agents_current.employeenumber,        v_s_boe_tj_employee_current.ultipronumber,       ds_agent_key.cisco_loginname
