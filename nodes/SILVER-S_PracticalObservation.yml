        ratings of 2 or 3.
      name: CompliantCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN I_CS_OBSERVATIONCHECKLIST.OBSERVATIONRATING IN (2,3)
          THEN 1  --SOMETIMES THE ASSESSOR JUST COMPLETES THE OBSERVATION AND FORGETS
          TO RATE  -- THE EMPLOYEE AS COMPETENT   WHEN COALESCE(I_CS_OBSERVATIONCHECKLIST.CHECKLISTSTATUS,'MISSING')
