    sourceMapping:
    - aliases:
        SRC_CUSMASFL: 1a684003-b407-5735-b911-bb4cc7ee7035
        DV_PARTY: 34cbfe43-0feb-57cb-9e9f-1d8d3238f854
        DV_LOCATION: fdd7bb98-8fc4-5715-a7a1-5cd1906c5ab9
      customSQL:
        customSQL: ''
      dependencies:
      - locationName: GOLD
        nodeName: SRC_CUSMASFL
      - locationName: GOLD
        nodeName: DV_PARTY
      - locationName: GOLD
        nodeName: DV_LOCATION
      join:
        joinCondition: 'FROM {{ ref(''GOLD'', ''SRC_CUSMASFL'') }} "SRC_CUSMASFL"


          LEFT OUTER JOIN {{ ref(''GOLD'', ''DV_PARTY'') }} "DV_PARTY"

          ON  SRC_CUSMASFL.CMCMP  = DV_PARTY.Company_Code

          AND SRC_CUSMASFL.CMCUS0 = DV_PARTY.Customer_Account_Num

          AND DV_PARTY.Party_Type_Code = 1


          LEFT OUTER JOIN {{ ref(''GOLD'', ''DV_LOCATION'') }} "DV_LOCATION_QUOTE"

          ON  SRC_CUSMASFL.CMCMP  = DV_LOCATION_QUOTE.Company_Code

          AND SRC_CUSMASFL.CMTCRQ = DV_LOCATION_QUOTe.Location_Code


          LEFT OUTER JOIN {{ ref(''GOLD'', ''DV_LOCATION'') }} "DV_LOCATION_RESERV"

          ON  SRC_CUSMASFL.CMCMP  = DV_LOCATION_RESERV.Company_Code

          AND SRC_CUSMASFL.CMTCRR = DV_LOCATION_RESERV.Location_Code

          WHERE AUD_TIME <= (SELECT MAX(BATCH_END) FROM {{ ref(''SILVER'', ''CDC_BATCH'')
          }}) AND AUD_TIME > (SELECT MAX(BATCH_START) FROM {{ ref(''SILVER'', ''CDC_BATCH'')
          }}) AND (AUD_CODE <> ''F'' OR (AUD_CODE IS NULL AND AUD_TYPE = ''RR''))
          QUALIFY RANK() OVER (PARTITION BY CMCMP, CMCUS0 ORDER BY AUD_TIME DESC,
          Aud_Seqno DESC, CASE WHEN AUD_TYPE IN (''PT'',''PX'',''FI'') THEN 1 WHEN
          AUD_TYPE IN (''UB'',''FB'',''FP'',''BR'') THEN 2 WHEN AUD_TYPE IN (''UP'',''UR'')
          THEN 3 WHEN AUD_TYPE IN (''DL'',''FD'') THEN 4 WHEN AUD_TYPE IN (''RR'')
          THEN 5 ELSE 0 END DESC) = 1'
      name: ETL_CUSTOMER_TOTAL_CONTROL
      noLinkRefs: []
