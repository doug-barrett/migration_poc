                          WHEN max_talktime > 240 AND max_talktime <= 300 THEN '4-5 min'
                          WHEN max_talktime > 300 AND max_talktime <= 360 THEN '5-6 min'
                          WHEN max_talktime > 360 AND max_talktime <= 420 THEN '6-7 min'
                          WHEN max_talktime > 420 AND max_talktime <= 480 THEN '7-8 min'
                          WHEN max_talktime > 480 AND max_talktime <= 540 THEN '8-9 min'
                          WHEN max_talktime > 540 AND max_talktime <= 600 THEN '9-10 min'
                          WHEN max_talktime > 600                         THEN 'gt 10 min'
                           END
