    sourceMapping:
      - aliases:
          BVSTG_AU3_LEAD_FEATURES_GROUPED: b3280547-025c-4a2d-aeee-3e6794e30081
          DS_MKT_CALL_CUSTOMER: a1eb4560-c80e-4133-a2d9-f6a82026093c
        customSQL:
