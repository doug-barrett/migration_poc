        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU3_LEAD_FEATURES_GROUPED
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_AU3_LEAD_FEATURES_GROUPED') }} bvstg_au3_lead_features_grouped
              LEFT JOIN (
                    SELECT BVSTG_AU3_LEAD_FEATURES_GROUPED.FIRST_GROUP_LEADID ,
                           BVSTG_AU3_LEAD_FEATURES_GROUPED.SECUENCE ,
                           COUNT(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 1 THEN DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY END) Inbound_Calls ,
                           COUNT(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 1 AND DS_MKT_CALL_CUSTOMER.TCONNECTED > 10 THEN DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY END) Inbound_conversation ,
                           COUNT(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 1 AND DATE(STARTDATETIME) BETWEEN BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate - 7 AND BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate THEN DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY END) Inbound_Calls_7days ,
                           COUNT(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 1 AND DS_MKT_CALL_CUSTOMER.TCONNECTED > 10 AND DATE(STARTDATETIME) BETWEEN BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate - 7 AND BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate THEN DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY END) Inbound_conversation_7days ,
                           Max(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 1 THEN DATE(STARTDATETIME) END) Last_Inbound_Date ,
                           COUNT(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 2 THEN DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY END) Outbound_Calls ,
                           COUNT(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 2 AND DS_MKT_CALL_CUSTOMER.TCONNECTED > 10 THEN DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY END) Outbound_conversation ,
                           COUNT(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 2 AND DATE(STARTDATETIME) BETWEEN BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate - 7 AND BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate THEN DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY END) Outbound_Calls_7days ,
                           COUNT(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 2 AND DS_MKT_CALL_CUSTOMER.TCONNECTED > 10 AND DATE(STARTDATETIME) BETWEEN BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate - 7 AND BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate THEN DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY END) Outbound_conversation_7days ,
                           Max(DISTINCT CASE WHEN DS_MKT_CALL_CUSTOMER.DIRECTION = 2 THEN DATE(STARTDATETIME) END) Last_Outbound_Date
                      FROM {{ ref('STAGE','BVSTG_AU3_LEAD_FEATURES_GROUPED') }} BVSTG_AU3_LEAD_FEATURES_GROUPED
                      LEFT JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} DS_MKT_CALL_CUSTOMER
                        ON BVSTG_AU3_LEAD_FEATURES_GROUPED.CustomerID = DS_MKT_CALL_CUSTOMER.CustomerID
                       AND DS_MKT_CALL_CUSTOMER.SOURCEDB_CUSTOMER = BVSTG_AU3_LEAD_FEATURES_GROUPED.SourceDB
                       AND DATE(STARTDATETIME) BETWEEN BVSTG_AU3_LEAD_FEATURES_GROUPED.StartDate AND BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate
                     GROUP BY BVSTG_AU3_LEAD_FEATURES_GROUPED.FIRST_GROUP_LEADID ,
                              BVSTG_AU3_LEAD_FEATURES_GROUPED.SECUENCE
                   )DS_MKT_CALL_CUSTOMER
                ON BVSTG_AU3_LEAD_FEATURES_GROUPED.FIRST_GROUP_LEADID = DS_MKT_CALL_CUSTOMER.FIRST_GROUP_LEADID
               AND BVSTG_AU3_LEAD_FEATURES_GROUPED.SECUENCE = DS_MKT_CALL_CUSTOMER.SECUENCE
              LEFT JOIN ( SELECT BVSTG_AU3_LEAD_FEATURES_GROUPED.FIRST_GROUP_LEADID ,
                   BVSTG_AU3_LEAD_FEATURES_GROUPED.SECUENCE ,
                   COUNT(DISTINCT CASE WHEN DS_RAM_RETAIL_REPOSITORY.CLASSIFICATION ='New Quotes' THEN DS_RAM_RETAIL_REPOSITORY.ID END) Quote ,
                   COUNT(DISTINCT CASE WHEN DS_RAM_RETAIL_REPOSITORY.CLASSIFICATION ='New Quotes' AND DATE(CREATEDDATE) BETWEEN BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate - 7 AND BVSTG_AU3_LEAD_FEATURES_GROUPED.EndDate THEN DS_RAM_RETAIL_REPOSITORY.ID END) Quote_7days ,
                   Max(DISTINCT CASE WHEN DS_RAM_RETAIL_REPOSITORY.CLASSIFICATION ='New Quotes' THEN DATE(CREATEDDATE) END) Last_Quote_Date ,
                   COUNT(DISTINCT CASE WHEN DS_RAM_RETAIL_REPOSITORY.CLASSIFICATION ='New Transfer' THEN DS_RAM_RETAIL_REPOSITORY.ID
        name: BVSTG_AU4_LEAD_FEATURES_GROUPED
        noLinkRefs: []
