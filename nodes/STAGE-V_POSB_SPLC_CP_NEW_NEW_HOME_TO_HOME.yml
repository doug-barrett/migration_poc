               AND DS_SPLC_POLICYTRANSACTION_NEW_NEW_4.POLICYTYPE Like 'Homeowners%'
               AND DATE(DS_SPLC_POLICYTRANSACTION_NEW_NEW_4.STATUSDATE) >= DATE(DATEADD(DAY,-30,DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)))
               AND DS_SPLC_POLICYTRANSACTION_NEW_NEW_4.Status='Cancelled'
               AND DS_SPLC_POLICYTRANSACTION.POLICYTYPE Like 'Homeowners%'
             WHERE DS_SPLC_POLICYTRANSACTION.TranType ='NBS'
