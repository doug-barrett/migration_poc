            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT ENDDATE,
                   OFFICECODE AS
            LOCATION,
                   sum(FTE) AS FTE
              FROM (SELECT bvstg_au5_cspr.ENDDATE,
                   ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS AS OFFICECODE,
                   round(WRKHRS/(WORKING_DAYS*Working_hour_day),1) AS FTE
              FROM (
                    SELECT bvstg_au5_cspr.*,
                           Working_days
                      FROM (
                            SELECT bvstg_au5_cspr.EMPLOYEENUMBER,
                                   bvstg_au5_cspr.ENDDATE,
                                   OFFICECODE,
                                   WRKMINS,
                                   round((WRKMINS/60),1) AS WRKHRS,
                                   '8' AS Working_hour_day
                              FROM (
                                    SELECT DISTINCT ENDDATE,
                                           EMPLOYEENUMBER
                                      FROM (
                                            SELECT enddate,
                                                   EMPLOYEENUMBER,
                                                   CASE WHEN bvstg_au4_cspr.EMPLOYEE IS NOT NULL THEN 1
                                                        ELSE 0
                                                         END AS Flag
                                              FROM (
                                                    SELECT DISTINCT enddate,
                                                           EMPLOYEENUMBER
                                                      FROM {{ ref('STAGE','BVSTG_AU5_CSPR') }}
                                                     WHERE metric = 'fte'
                                                   ) bvstg_au5_cspr
                                              LEFT JOIN (
                                                    SELECT DISTINCT date, employee
                                                      FROM {{ ref('STAGE','BVSTG_AU4_CSPR') }}
                                                   ) bvstg_au4_cspr
                                                ON bvstg_au5_cspr.enddate = bvstg_au4_cspr.date
                                               AND bvstg_au5_cspr.EMPLOYEENUMBER = bvstg_au4_cspr.employee
                                           )
                                     WHERE ENDDATE BETWEEN '2023-01-01' AND (CASE WHEN DAY(CURRENT_DATE()) <= 14 THEN DATEADD(MONTH, -2, CURRENT_DATE()) ELSE DATEADD(MONTH, -1, CURRENT_DATE()) END)
                                       AND flag = 0
                                   ) bvstg_au5_cspr
                              LEFT JOIN (
                                    SELECT EMPLOYEENUMBER,
                                           ENDDATE,
                                           OFFICECODE,
                                           round(WRKMINS/num_offices,1) AS WRKMINS
                                      FROM (
                                            SELECT DISTINCT EMPLOYEENUMBER,
                                                   ENDDATE,

                                          LOCATION AS officecode,
                                                   WRKMINS,
                                                   count(*) OVER (PARTITION BY EMPLOYEENUMBER,ENDDATE) AS num_offices
                                              FROM (
                                                    SELECT DISTINCT EMPLOYEENUMBER,
                                                           EMPNAME,
                                                           ENDDATE,

                                                  LOCATION
                                                      FROM (
                                                            SELECT DISTINCT EMPLOYEENUMBER,
                                                                   concat(EMPLOYEENUMBER,'-',COMPANYIDENTIFIER) AS EMPNAME,
                                                                   date_trunc(MONTH,to_date(PERIODENDDATE)) AS ENDDATE,

                                                          LOCATION,
                                                                   JOB
                                                              FROM {{ ref('STAGE','V_DLBV_API_UKG_EMPLOYEEPAYSTATEMENTS_CURRENT') }}
                                                           ) v_dlbv_api_ukg_employeepaystatements_current
                                                      LEFT JOIN (
                                                            SELECT DISTINCT JOBCODE,
                                                                   JOBFAMILY
                                                              FROM {{ ref('STAGE','V_DLBV_API_UKG_JOBS_CURRENT') }}
                                                           ) v_dlbv_api_ukg_jobs_current
                                                        ON v_dlbv_api_ukg_employeepaystatements_current.JOB = v_dlbv_api_ukg_jobs_current.JOBCODE
                                                     WHERE lower(JOBFAMILY) = 'sales'
                                                   ) v_dlbv_api_ukg_employeepaystatements_current
                                              LEFT JOIN (
                                                    SELECT DISTINCT EMPNAME,
                                                           date_trunc('month',to_date(WORKDATE)) AS WORKDATE,
                                                           sum(WRKMINS) AS WRKMINS
                                                      FROM {{ ref('STAGE','V_DLBV_API_UKG_WORKSUMMARIES_CURRENT') }}
                                                     GROUP BY 1,
                                                              2
                                                   ) v_dlbv_api_ukg_worksummaries_current
                                                ON v_dlbv_api_ukg_employeepaystatements_current.EMPNAME= v_dlbv_api_ukg_worksummaries_current.EMPNAME
                                               AND v_dlbv_api_ukg_employeepaystatements_current.ENDDATE= v_dlbv_api_ukg_worksummaries_current.WORKDATE
                                           )
                                   ) v_dlbv_api_ukg_employeepaystatements_current
                                ON bvstg_au5_cspr.EMPLOYEENUMBER = v_dlbv_api_ukg_employeepaystatements_current.EMPLOYEENUMBER
                               AND bvstg_au5_cspr.ENDDATE = v_dlbv_api_ukg_employeepaystatements_current.ENDDATE
                             WHERE officecode IS NOT NULL
                           ) bvstg_au5_cspr
                      LEFT JOIN (
                            SELECT DISTINCT date_trunc('month',SALESDATE) asofmonth,
                                   sum(SALESDAYWEIGHT) Working_days
                              FROM {{ ref('STAGE','V_DLBV_BOE_SALESCALENDAR_CURRENT') }}
                             WHERE year(SALESDATE)>=2021
                               AND DAYOFWEEK(SALESDATE) NOT IN (6,0)
                               AND SALESDATE <= dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                             GROUP BY 1
                           ) v_dlbv_boe_salescalendar_current
                        ON bvstg_au5_cspr.ENDDATE = v_dlbv_boe_salescalendar_current.asofmonth
                   ) bvstg_au5_cspr
              LEFT JOIN (
                    SELECT DISTINCT officecode,
                           CASE WHEN lower(agencyname) like '%acceptance%' THEN 'Acceptance'
                                ELSE channel
                                 END AS channel_1,
                           statecode,
                           SALESTYPE,
                           agencyname,
                           ACTIVE_OFFICERELATEDTOOFFICESTATUSDETAILS
                      FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
                   ) ds_retail_office
                ON bvstg_au5_cspr.officecode = ds_retail_office.officecode
             WHERE CHANNEL_1 = 'NSA'
               AND SALESTYPE
