        config: {}
        dataType: INTEGER
        defaultValue: ""
        description: Indicates if the Timesheet is submitted on time. It works off the first submission in case its been rejected at some stage.
        name: SUBMITONTIME
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 448ce200-3a95-43c0-a6a4-5477f01bd44d
                stepCounter: eb119afa-469f-47c5-ad66-750391c968b7
            transform: CASE --EXCLUDE PAPER TIMESHEETS   WHEN (I_TIMESHEETAUDIT.EMPLOYEENUMBER IS NULL     OR I_TIMESHEETAUDIT.LASTSTATUS = 'IN PROGRESS')   -- BUT THERE WAS DATA IN THE PAYGLOBAL DATABASE    AND I_PG_TIMESHEETS.NOTIMESHEET = 0   THEN 0   --SOMETIMES THE FULCRUM AUDIT DATE IS NULL, ASSUME THESE ARE SUBMITTED ON TIME   WHEN I_TIMESHEETAUDIT.EMPLOYEENUMBER IS NOT NULL    AND I_TIMESHEETAUDIT.LASTSTATUS = 'COMPLETED'    AND FIRSTSUBMIT IS NULL THEN 1   --SUBMITTED ON SAME DAY   WHEN CONVERT(DATE,FIRSTSUBMIT) = DATETIMESHEET THEN 1   --SUBMITTED BEFORE 8:00AM NEXT DAY   WHEN CALENDARDATE < '2020-09-03' AND DATEDIFF(DAY,CALENDARDATE,FIRSTSUBMIT) = 1 AND DATEPART(HOUR,FIRSTSUBMIT) < 8 THEN 1   --SUBMITTED BEFORE 9:00AM NEXT DAY   WHEN CALENDARDATE >= '2020-09-03' AND DATEDIFF(DAY,CALENDARDATE,FIRSTSUBMIT) = 1 AND DATEPART(HOUR,FIRSTSUBMIT) < 9 THEN 1   --FINISHED LATE   WHEN CONVERT(DATE,TIMESHEETFINISHTIME) = DATETIMESHEET AND DATEPART(HOUR,TIMESHEETFINISHTIME) >= 18    -- AND SUBMITTED BEFORE 1:00PM NEXT DAY    AND DATEDIFF(DAY,CALENDARDATE,FIRSTSUBMIT) = 1 AND DATEPART(HOUR,FIRSTSUBMIT) < 13 THEN 1   --FRIDAY AND SATURDAY WORK CAN WAIT UNTIL MONDAY FOR SUBMISSION   --FRIDAY OR SATURDAY AND SUBMITTED ON THE NEXT DAY   WHEN DATEPART(DW,CALENDARDATE) IN (6,7) AND DATEDIFF(DAY,CALENDARDATE,FIRSTSUBMIT) = 1 THEN 1   --FRIDAY AND SUBMITTED ON SUNDAY   WHEN DATEPART(DW,CALENDARDATE) = 6 AND DATEDIFF(DAY,CALENDARDATE,FIRSTSUBMIT) = 2 THEN 1   --SATURDAY AND SUBMITTED BEFORE 8:00AM MONDAY   WHEN CALENDARDATE < '2020-09-03' AND DATEPART(DW,CALENDARDATE) = 7 AND DATEDIFF(DAY,CALENDARDATE,FIRSTSUBMIT) = 2 AND DATEPART(HOUR,FIRSTSUBMIT) < 8 THEN 1   --SATURDAY AND SUBMITTED BEFORE 9:00AM MONDAY   WHEN CALENDARDATE >= '2020-09-03' AND DATEPART(DW,CALENDARDATE) = 7 AND DATEDIFF(DAY,CALENDARDATE,FIRSTSUBMIT) = 2 AND DATEPART(HOUR,FIRSTSUBMIT) < 9 THEN 1   --FRIDAY AND SUBMITTED BEFORE 8:00AM MONDAY   WHEN CALENDARDATE < '2020-09-03' AND DATEPART(DW,CALENDARDATE) = 6 AND DATEDIFF(DAY,CALENDARDATE,FIRSTSUBMIT) = 3 AND DATEPART(HOUR,FIRSTSUBMIT) < 8 THEN 1   --FRIDAY AND SUBMITTED BEFORE 9:00AM MONDAY   WHEN CALENDARDATE >= '2020-09-03' AND DATEPART(DW,CALENDARDATE) = 6 AND DATEDIFF(DAY,CALENDARDATE,FIRSTSUBMIT) = 3 AND DATEPART(HOUR,FIRSTSUBMIT) < 9 THEN 1  ELSE 0 END
      - appliedColumnTests: {}
        columnReference:
          columnCounter: 7f2225e3-3064-4ac6-ae9c-7caad5f061e7
          stepCounter: 74e7577d-5bb3-45f5-8d73-2b559715f2a5
        config: {}
        dataType: INTEGER
        defaultValue: ""
        description: Indicates if the Timesheet has been approved on time. It works off the date and time of the first approval or rejection instance in case its been rejected at some stage.
        name: APPROVEONTIME
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: ed425cbc-a668-4c34-9383-0feb9a9cc3e7
                stepCounter: eb119afa-469f-47c5-ad66-750391c968b7
            transform: CASE --EXCLUDE PAPER TIMESHEETS   WHEN (I_TIMESHEETAUDIT.EMPLOYEENUMBER IS NULL     OR I_TIMESHEETAUDIT.LASTSTATUS = 'IN PROGRESS')   -- BUT THERE WAS DATA IN THE PAYGLOBAL DATABASE    AND I_PG_TIMESHEETS.NOTIMESHEET = 0   THEN 0   --SOMETIMES THE FULCRUM SYSTEM DOES NOT RECORD THE UPDATE TIME FOR A RECORD CHANGE   -- ASSUME TIMESHEET WAS APPROVED ON TIME   WHEN I_TIMESHEETAUDIT.EMPLOYEENUMBER IS NOT NULL    AND I_TIMESHEETAUDIT.LASTSTATUS = 'COMPLETED'    AND (FIRSTSUBMIT IS NULL OR FIRSTAPPROVAL IS NULL) THEN 1   --IF EMPLOYEE SUBMITS THE TIMESHEET EARLY, THEN APPROVER STILL HAS UNTIL 11:00AM THE DAY FOLLOWING TO APPROVE    WHEN DATEDIFF(DAY,CALENDARDATE,FIRSTAPPROVAL) <= 1    AND DATEPART(HOUR,FIRSTAPPROVAL) < 11 THEN 1   --APPROVED ON SAME DAY, BUT TIMESHEET SUBMITTED AFTER SUBMISSION CUTOFF (NOW 9:00AM)   WHEN CONVERT(DATE,FIRSTSUBMIT) = CONVERT(DATE,FIRSTAPPROVAL)    --IF SUBMITTED BEFORE CUTOFF, THEN IT SHOULD BE PICKED UP BY NEXT CHECK    AND (CALENDARDATE < '2020-09-03' AND DATEPART(HOUR,FIRSTSUBMIT) >= 8     OR CALENDARDATE >= '2020-09-03' AND DATEPART(HOUR,FIRSTSUBMIT) >= 9)   THEN 1   --APPROVED SAME DAY, BUT TIMESHEET WAS SUBMITTED BEFORE SUBMISSION CUTOFF (PRIOR TO 4/9/2020 WAS 8:00AM, NOW 9:00)   WHEN CONVERT(DATE,FIRSTSUBMIT) = CONVERT(DATE,FIRSTAPPROVAL)    AND CALENDARDATE < '2020-09-03'    AND DATEPART(HOUR,FIRSTSUBMIT) < 8    -- AND APPROVED BEFORE 9:30AM CUTOFF    AND (DATEPART(HOUR,FIRSTAPPROVAL) < 9 OR (DATEPART(HOUR,FIRSTAPPROVAL) = 9 AND DATEPART(MINUTE,FIRSTAPPROVAL) <30))   THEN 1   WHEN CONVERT(DATE,FIRSTSUBMIT) = CONVERT(DATE,FIRSTAPPROVAL)    AND CALENDARDATE >= '2020-09-03'    AND DATEPART(HOUR,FIRSTSUBMIT) < 9    -- AND APPROVED BEFORE 11:00AM CUTOFF    AND DATEPART(HOUR,FIRSTAPPROVAL) < 11   THEN 1   --APPROVED NEXT DAY   WHEN DATEDIFF(DAY,FIRSTSUBMIT,FIRSTAPPROVAL) <= 1    --EMPLOYEE SUBMITTED AFTER CUTOFF TIME (PRIOR TO 4/9/2020 WAS 8:00AM)    AND CALENDARDATE < '2020-09-03'    AND DATEPART(HOUR,FIRSTSUBMIT) >= 8    -- AND APPROVED BEFORE 9:30AM CUTOFF    AND (DATEPART(HOUR,FIRSTAPPROVAL) < 9 OR (DATEPART(HOUR,FIRSTAPPROVAL) = 9 AND DATEPART(MINUTE,FIRSTAPPROVAL) <30))   THEN 1   WHEN DATEDIFF(DAY,FIRSTSUBMIT,FIRSTAPPROVAL) <= 1    --EMPLOYEE SUBMITTED AFTER THE CUTOFF TIME (NOW 9:00AM)    AND CALENDARDATE >= '2020-09-03'    AND DATEPART(HOUR,FIRSTSUBMIT) >= 9    -- AND APPROVED BEFORE 11:00AM CUTOFF    AND DATEPART(HOUR,FIRSTAPPROVAL) < 11   THEN 1     --TUESDAY SPECIAL RUN   WHEN DATEPART(DW,FIRSTAPPROVAL) = 3    --SUBMITTED SINCE 7:00AM THAT MORNING    AND DATEDIFF(HOUR,FIRSTSUBMIT,FIRSTAPPROVAL) < 7    --SUBMITTED PRIOR TO 2:00PM CUTOFF    AND DATEPART(HOUR,FIRSTAPPROVAL) < 14   THEN 1   --ON MONDAY MORNING THEY COULD BE SUBMITTING ANYTHING FROM FRIDAY ONWARDS   WHEN DATEPART(DW,FIRSTAPPROVAL) = 2    AND DATEDIFF(HOUR,FIRSTSUBMIT,FIRSTAPPROVAL) < 72    AND CALENDARDATE < '2020-09-03'    AND (DATEPART(HOUR,FIRSTAPPROVAL) < 9 OR (DATEPART(HOUR,FIRSTAPPROVAL) = 9 AND DATEPART(MINUTE,FIRSTAPPROVAL) <30))   THEN 1   --ON MONDAY MORNING THEY COULD BE SUBMITTING ANYTHING FROM FRIDAY ONWARDS   WHEN DATEPART(DW,FIRSTAPPROVAL) = 2    AND DATEDIFF(HOUR,FIRSTSUBMIT,FIRSTAPPROVAL) < 72    AND CALENDARDATE >= '2020-09-03'    AND DATEPART(HOUR,FIRSTAPPROVAL) < 11   THEN 1  ELSE 0 END
