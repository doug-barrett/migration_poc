        join:
          joinCondition: |-
            FROM (
                    (
                            SELECT DISTINCT ds_ram_retail_repository_3.leadid,
                                   ds_ram_retail_repository_3.Customer_Type,
                                   ds_ram_retail_repository_3.Date,
                                   ds_ram_retail_repository_3.Quotes,
                                   ds_ram_retail_repository_3.Label,
                                   ds_ram_retail_repository_3.PolicyNumberFormatted,
                                   ds_ram_retail_repository_3.Carrier,
                                   ds_ram_retail_repository_3.TransactionID,
                                   ds_ram_retail_repository_3.Counter,
                                   COALESCE(ds_retail_office_1.Channel,ifnull(ds_ram_retail_repository_3.sourcedb,'Missing')) Channel
                              FROM ((SELECT DISTINCT leadid, ifnull(customertype, 'Missing') AS Customer_Type, to_date(CreatedDate) Date, count(DISTINCT id) Quotes,'Quotes' AS Label, NULL PolicyNumberFormatted, NULL Carrier, NULL TransactionID, NULL Counter, sourcedb,officecode FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} WHERE year(CreatedDate) >= 2019 AND to_date(CreatedDate) <= current_date()-1 AND (islegacytransaction IS NULL OR islegacytransaction <> 'Migrated') AND counter = 1 AND classification = 'New Quotes' GROUP BY leadid,officecode, ifnull(customertype, 'Missing'), to_date(CreatedDate), 'Quotes', NULL, NULL, NULL, NULL,NULL,sourcedb) ds_ram_retail_repository_3 LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office_1 ON ds_ram_retail_repository_3.officecode = ds_retail_office_1.officecode)
                           )
                 UNION ALL SELECT DISTINCT LeadID,
                           Customer_Type, Date, Quotes,
                           Label,
                           PolicyNumberFormatted,
                           Carrier,
                           TransactionID,
                           Counter,
                           COALESCE(ds_retail_office.Channel,ifnull(ds_ram_retail_repository_4.sourcedb,'Missing')) Channel
                      FROM (
                            SELECT DISTINCT LeadID,
                                   Customer_Type,
                                   CreatedDate Date, 0 Quotes,
                                   'Sales' Label,
                                   PolicyNumberFormatted,
                                   CarrierDisplayName Carrier,
                                   TransactionID,
                                   Counter,
                                   OfficeCode,
                                   SourceDB
                              FROM (
                                    SELECT DISTINCT policynumber,
                                           carriername,
                                           to_date(CreatedDate) CreatedDate,
                                           SourceDB,
                                           LeadID,
                                           transactionid,
                                           Counter,
                                           ifnull(customertype, 'Missing') AS Customer_Type,
                                           OfficeCode
                                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                                     WHERE year(CreatedDate) >= 2019
                                       AND to_date(CreatedDate) <= current_date() -1
                                       AND (islegacytransaction IS NULL OR islegacytransaction <> 'Migrated')
                                       AND counter = 1
                                       AND label IN ('New Business Auto', 'New Business Complementary')
                                   ) ds_ram_retail_repository_2
                              LEFT JOIN (
                                    SELECT DISTINCT policynumber_Edw,
                                           carriername_Edw,
                                           policynumberformatted,
                                           carrierdisplayname
                                      FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}
                                   ) ds_bvstg_comm_policynumberformatting_allsources
                                ON ds_bvstg_comm_policynumberformatting_allsources.policynumber_edw = ds_ram_retail_repository_2.policynumber
                               AND ifnull(ds_bvstg_comm_policynumberformatting_allsources.carriername_edw, '-') = ifnull(ds_ram_retail_repository_2.carriername, '-')
                           ) ds_ram_retail_repository_4
                      LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                        ON ds_ram_retail_repository_4.officecode = ds_retail_office.officecode
                   ) ds_ram_retail_repository
