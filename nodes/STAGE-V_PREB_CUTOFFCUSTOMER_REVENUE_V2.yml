    sourceMapping:
      - aliases:
          V_PREB_CUTOFFCUSTOMER_REVENUE_V2: 9cf0233f-065a-4b9c-aa57-cd94eb231f21
          BVSTG_MONTHS_TO_REFRESH: 9a7d1a17-eb90-42f1-9cbc-8c985a95f31d
          DS_RAM_RETAIL_REPOSITORY: d29a0c5c-e296-46c4-bc55-861d60fe906d
          BVSTG_CUSTOMER_TO_REFRESH: 7cbd0921-faef-4eb6-bdf6-f95f09598096
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_CUTOFFCUSTOMER_REVENUE_V2') }} AS SELECT bvstg_months_to_refresh.cal_Month ,
                   ds_ram_retail_repository.CustomerID ,
                   MD5(ds_ram_retail_repository.CustomerID || ds_ram_retail_repository.SourceDB) AS CustomerKey ,
                   bvstg_months_to_refresh.max_date AS CutOffDate ,
                   ds_ram_retail_repository.SourceDB ,
                   SUM(CASE WHEN ds_ram_retail_repository.classification='Ancillary' THEN ds_ram_retail_repository.Amount ELSE 0 END) AS Ancillary_Amount ,
                   SUM(CASE WHEN ds_ram_retail_repository.classification='Fee' THEN ds_ram_retail_repository.Amount ELSE 0 END) AS Fee_Amount ,
                   SUM(CASE WHEN ds_ram_retail_repository.classification='Service Transactions Fee' THEN ds_ram_retail_repository.Amount ELSE 0 END) AS ServiceTransactionsFee_Amount ,
                   SUM(CASE WHEN ds_ram_retail_repository.classification='Ancillary' THEN ds_ram_retail_repository.Counter ELSE 0 END) AS Ancillary_Count ,
                   SUM(CASE WHEN ds_ram_retail_repository.classification='Fee' THEN ds_ram_retail_repository.Counter ELSE 0 END) AS Fee_Count ,
                   SUM(CASE WHEN ds_ram_retail_repository.classification='Service Transactions Fee' THEN ds_ram_retail_repository.Counter ELSE 0 END) AS ServiceTransactionsFee_Count
              FROM {{ ref('STAGE','BVSTG_MONTHS_TO_REFRESH') }} bvstg_months_to_refresh
             INNER JOIN (
                    SELECT LAST_DAY(ds_ram_retail_repository.CreatedDate) CreatedDate ,
                           CASE WHEN pf.CustomerID IS NOT NULL THEN AP1_CUSTOMER_CIGHID
                                ELSE ds_ram_retail_repository.customerID
                                 END customerID ,
                           classification ,
                           CASE WHEN pf.CustomerID IS NOT NULL THEN 'CIGH'
                                ELSE ds_ram_retail_repository.SourceDB
                                 END SourceDB ,
                           SUM(Amount)Amount ,
                           SUM(Counter)Counter
                      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_CUSTOMER pf
                        ON TO_VARCHAR(PF.CustomerID) = ds_ram_retail_repository.CustomerID
                       AND LEN(pf.AP1_CUSTOMER_CIGHID) >20
                     WHERE (ds_ram_retail_repository.RefreshType IN('AppOne Revenue','CIGH Ancillary','CIGH Fee') OR (ds_ram_retail_repository.RefreshType ='CIGHTransaction' AND ds_ram_retail_repository.classification IN ('Fee Count','Ancillary')))
                       AND IFNULL(ds_ram_retail_repository.isVoid,0) = 0
                     GROUP BY LAST_DAY(ds_ram_retail_repository.CreatedDate) ,
                              CASE WHEN pf.CustomerID IS NOT NULL THEN AP1_CUSTOMER_CIGHID
                                   ELSE ds_ram_retail_repository.customerID
                                    END ,
                              classification ,
                              CASE WHEN pf.CustomerID IS NOT NULL THEN 'CIGH'
                                   ELSE ds_ram_retail_repository.SourceDB
                                    END
                   ) ds_ram_retail_repository
                ON (LAST_DAY(ds_ram_retail_repository.CreatedDate) >= bvstg_months_to_refresh.min_date AND ds_ram_retail_repository.CreatedDate <= bvstg_months_to_refresh.max_date)
             INNER JOIN (
                    SELECT DISTINCT customerid,
                           sourcedb
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                   ) bvstg_customer_to_refresh
                ON IFNULL(bvstg_customer_to_refresh.customerid,'') = IFNULL(ds_ram_retail_repository.customerid,'')
               AND bvstg_customer_to_refresh.sourcedb = ds_ram_retail_repository.sourcedb
             GROUP BY bvstg_months_to_refresh.cal_Month ,
                      ds_ram_retail_repository.CustomerID ,
                      bvstg_months_to_refresh.max_date ,
                      ds_ram_retail_repository.SourceDB
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_MONTHS_TO_REFRESH
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: STAGE
            nodeName: BVSTG_CUSTOMER_TO_REFRESH
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','BVSTG_MONTHS_TO_REFRESH') }}
            {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
            {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
