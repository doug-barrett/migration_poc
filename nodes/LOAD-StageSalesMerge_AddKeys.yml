      config: {}
      dataType: VARCHAR
      description: Supplier Name to be used on financial reports
      name: FinancialReportingSupplierName
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE      WHEN CONTRACT.VERTICAL <> 'FOOD AND NUTRITION' THEN          LTRIM(RTRIM(              COALESCE(                  NULLIF(VWSYSCOCHECK.FINANCIALREPORTINGSUPPLIERNAME,
          'UNKNOWN'),                  NULLIF(CONTRACT.FINANCIALREPORTINGSUPPLIERNAME,
          'UNKNOWN'),                  NULLIF(SUPPLIER.REPORTINGSUPPLIERNAME, 'UNKNOWN'),                  STAGESALESMERGE_BIZXFORMS.SUPPLIERNAME              )          ))  WHEN
          CONTRACT.SOURCEENTITYNAME = 'PREMIER' AND CONTRACT.CONTRACTNUMBER NOT LIKE'%PP-DI%'
          THEN LTRIM(RTRIM(              COALESCE(                  NULLIF(VWSYSCOCHECK.FINANCIALREPORTINGSUPPLIERNAME,
          'UNKNOWN'),                  NULLIF(CONTRACT.FINANCIALREPORTINGSUPPLIERNAME,
          'UNKNOWN'),                  NULLIF(SUPPLIER.REPORTINGSUPPLIERNAME, 'UNKNOWN'),                  STAGESALESMERGE_BIZXFORMS.SUPPLIERNAME              )          ))  WHEN
          CONTRACT.SOURCEENTITYNAME ='VIZIENT' AND (CONTRACT.CONTRACTNUMBER NOT LIKE
          '%FD%'AND CONTRACT.CONTRACTNUMBER NOT LIKE '%FX%')  THEN LTRIM(RTRIM(              COALESCE(                  NULLIF(VWSYSCOCHECK.FINANCIALREPORTINGSUPPLIERNAME,
          'UNKNOWN'),                  NULLIF(CONTRACT.FINANCIALREPORTINGSUPPLIERNAME,
          'UNKNOWN'),                  NULLIF(SUPPLIER.REPORTINGSUPPLIERNAME, 'UNKNOWN'),                  STAGESALESMERGE_BIZXFORMS.SUPPLIERNAME              )          ))  WHEN
          CONTRACT.SOURCEENTITYNAME = 'PREMIER' THEN 'US FOODS, INC. - PREMIER'      WHEN
          CONTRACT.SOURCEENTITYNAME = 'VIZIENT' AND CONTRACT.SUPPLIERNAME = 'SYSCO
          CORPORATION' THEN 'SYSCO CORPORATION'  WHEN SUPPLIER.SUPPLIERNAME = 'US
          FOODS, INC. - VIZIENT' THEN CONTRACT.FINANCIALREPORTINGSUPPLIERNAME      WHEN
          CONTRACT.SOURCEENTITYNAME = 'VIZIENT' AND VWSYSCOCHECK.FORCEID =ACCOUNT.FORCEID
          THEN 'SYSCO CORPORATION'      WHEN CONTRACT.SOURCEENTITYNAME = 'VIZIENT'
          THEN 'US FOODS, INC. - VIZIENT'      ELSE          LTRIM(RTRIM(              COALESCE(                  NULLIF(VWSYSCOCHECK.FINANCIALREPORTINGSUPPLIERNAME,
          'UNKNOWN'),                  NULLIF(CONTRACT.FINANCIALREPORTINGSUPPLIERNAME,
          'UNKNOWN'),                  NULLIF(SUPPLIER.REPORTINGSUPPLIERNAME, 'UNKNOWN'),                  STAGESALESMERGE_BIZXFORMS.SUPPLIERNAME              )          ))  END
