          H_CDTFILE: b6454e19-bbc7-4c28-9747-0434c3146f1e
          V_S_AP1_CDTPOLICY_CURRENT: f89f0301-4988-4a90-9f9b-76a54b8e4d02
          L_CDTPOLICY_CDTTYPE: eafda663-578c-40ed-8d4c-ed8f8f446396
          V_S_AP1_CDTTYPE_CURRENT: 49cd9ec4-721d-4f62-a851-1bff3ecf3d3c
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_CDT_POLICY') }} AS SELECT v_s_ap1_cdtpolicy_current.policyid ,
                   v_s_ap1_cdttype_current.Name AS Status ,
                   MAX(TO_DATE(v_s_ap1_cdtpolicy_current.created)) AS created ,
                   CASE WHEN CDTTypeID =6 THEN PolicyCancellationDate
                        ELSE EndorsementEffectiveDate
                         END AS Statusdate ,
                   RANK() OVER (PARTITION BY v_s_ap1_cdtpolicy_current.policyid ORDER BY CASE WHEN CDTTypeID =6 THEN v_s_ap1_cdtpolicy_current.PolicyCancellationDate ELSE v_s_ap1_cdtpolicy_current.EndorsementEffectiveDate END, MIN(v_s_ap1_cdtpolicy_current.created), MIN(v_s_ap1_cdtpolicy_current.HK_H_CDTPOLICY)) AS SeqNo_asc ,
                   RANK() OVER (PARTITION BY v_s_ap1_cdtpolicy_current.policyid ORDER BY CASE WHEN CDTTypeID =6 THEN v_s_ap1_cdtpolicy_current.PolicyCancellationDate ELSE v_s_ap1_cdtpolicy_current.EndorsementEffectiveDate END DESC, MAX(v_s_ap1_cdtpolicy_current.created) DESC, MAX(v_s_ap1_cdtpolicy_current.HK_H_CDTPOLICY) DESC) AS SeqNo,
                   CASE WHEN v_s_ap1_cdttype_current.Name IN ('Reinstatement','CancelPending','CancelInsuredRequest','Lapse') THEN RANK() OVER (PARTITION BY v_s_ap1_cdtpolicy_current.policyid ORDER BY CASE WHEN v_s_ap1_cdttype_current.Name IN ('Reinstatement','CancelPending','CancelInsuredRequest','Lapse') THEN 1 ELSE 2 END, CASE WHEN CDTTypeID =6 THEN v_s_ap1_cdtpolicy_current.PolicyCancellationDate ELSE v_s_ap1_cdtpolicy_current.EndorsementEffectiveDate END DESC, MAX(v_s_ap1_cdtpolicy_current.created) DESC, MAX(v_s_ap1_cdtpolicy_current.HK_H_CDTPOLICY) DESC)
                        ELSE 1000
                         END AS SeqNo_Status,
                   CASE WHEN v_s_ap1_cdttype_current.Name IN ('Reinstatement','CancelPending','CancelInsuredRequest','Lapse') THEN RANK() OVER (PARTITION BY v_s_ap1_cdtpolicy_current.policyid ORDER BY CASE WHEN v_s_ap1_cdttype_current.Name IN ('Reinstatement','CancelPending','CancelInsuredRequest','Lapse') THEN 1 ELSE 2 END, CASE WHEN CDTTypeID =6 THEN v_s_ap1_cdtpolicy_current.PolicyCancellationDate ELSE v_s_ap1_cdtpolicy_current.EndorsementEffectiveDate END, MIN(v_s_ap1_cdtpolicy_current.created), MIN(v_s_ap1_cdtpolicy_current.HK_H_CDTPOLICY))
                        ELSE 1000
                         END AS SeqNo_Status_asc
              FROM {{ ref('STAGE','V_S_AP1_CDTFILE_CURRENT') }} v_s_ap1_cdtfile_current
              LEFT JOIN {{ ref('DATA_VAULT','H_CDTFILE') }} h_cdtfile
                ON v_s_ap1_cdtfile_current.hk_h_cdtfile = h_cdtfile.hk_h_cdtfile
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CDTPOLICY_CURRENT') }} v_s_ap1_cdtpolicy_current
                ON h_cdtfile.cdtfileid = v_s_ap1_cdtpolicy_current.cdtfileid
              LEFT JOIN {{ ref('DATA_VAULT','L_CDTPOLICY_CDTTYPE') }} l_cdtpolicy_cdttype
                ON v_s_ap1_cdtpolicy_current.hk_h_cdtpolicy = l_cdtpolicy_cdttype.hk_h_cdtpolicy
              LEFT JOIN {{ ref('STAGE','V_S_AP1_CDTTYPE_CURRENT') }} v_s_ap1_cdttype_current
                ON l_cdtpolicy_cdttype.hk_h_cdttype = v_s_ap1_cdttype_current.hk_h_cdttype
             GROUP BY v_s_ap1_cdtpolicy_current.policyid ,
                      v_s_ap1_cdttype_current.Name ,
                      CASE WHEN CDTTypeID =6 THEN v_s_ap1_cdtpolicy_current.PolicyCancellationDate
                           ELSE v_s_ap1_cdtpolicy_current.EndorsementEffectiveDate
                            END
        dependencies:
