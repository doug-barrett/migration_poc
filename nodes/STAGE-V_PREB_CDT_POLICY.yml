            {{ ref('STAGE','V_S_AP1_CDTFILE_CURRENT') }}
            {{ ref('DATA_VAULT','H_CDTFILE') }}
            {{ ref('DATA_VAULT','L_CDTPOLICY_CDTTYPE') }}
            {{ ref('STAGE','V_S_AP1_CDTTYPE_CURRENT') }}
