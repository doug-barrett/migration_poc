        dependencies:
          - locationName: STAGE
            nodeName: V_PREB_GROUP_LEADS_SALES
          - locationName: UNKNOWN
            nodeName: V_PREB_GROUP_LEADS_SALES
          - locationName: STAGE
            nodeName: DS_BVSTG_GROUP_LEAD
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: STAGE
            nodeName: V_DLBV_TBAI_FORMEVENT_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_TBAI_SALESKEYS_CURRENT
          - locationName: STAGE
            nodeName: V_S_AP1_TRANSACTION_MROC_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('UNKNOWN','V_PREB_GROUP_LEADS_SALES') }} V_PREB_GROUP_LEADS_SALES
              LEFT JOIN (
                    SELECT C_CUSTOMERID,
                           L_LEADID,
                           L_LEADDATE,
                           RANK_GROUP_LEADID
                      FROM {{ ref('UNKNOWN','V_PREB_GROUP_LEADS_SALES') }}
                   )V_PREB_GROUP_LEADS_GROUP
                ON V_PREB_GROUP_LEADS_SALES.C_CUSTOMERID = V_PREB_GROUP_LEADS_GROUP.C_CUSTOMERID
               AND V_PREB_GROUP_LEADS_SALES.RANK_GROUP_LEADID = V_PREB_GROUP_LEADS_GROUP.RANK_GROUP_LEADID
              LEFT JOIN (
                    SELECT FIRST_GROUP_LEADID,
                           COUNT(1) Quotes ,
                           MIN(RE.CREATEDDATE) Min_QuoteDate ,
                           MAX(RE.CREATEDDATE) Max_QuoteDate
                      FROM {{ ref('STAGE','DS_BVSTG_GROUP_LEAD') }} LG
                     INNER JOIN (
                            SELECT LeadID,
                                   DATE(CREATEDDATE) CREATEDDATE
                              FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}
                             WHERE Classification like 'New Quotes%'
                             UNION SELECT SK.APPONEINTERNALLEADID AS LeadID ,
                                   DATE(FE.EVENTTIME) CREATEDDATE
                              FROM {{ ref('STAGE','V_DLBV_TBAI_FORMEVENT_CURRENT') }} FE
                              LEFT JOIN {{ ref('STAGE','V_DLBV_TBAI_SALESKEYS_CURRENT') }} SK
                                ON FE.sessionid = SK.sessionid
                             WHERE IFNULL(LEADID,0) !=0
                               AND (formname='Show My Quote')
                           ) RE
                        ON LG.L_LEADID = RE.LeadID
                     GROUP BY FIRST_GROUP_LEADID
                   )DS_RAM_RETAIL_REPOSITORY
                ON V_PREB_GROUP_LEADS_GROUP.L_LEADID = DS_RAM_RETAIL_REPOSITORY.FIRST_GROUP_LEADID
              LEFT JOIN {{ ref('STAGE','V_S_AP1_TRANSACTION_MROC_CURRENT') }} V_S_AP1_TRANSACTION_MROC_CURRENT
                ON TO_VARCHAR(V_S_AP1_TRANSACTION_MROC_CURRENT.TransactionID) = V_PREB_GROUP_LEADS_SALES.L_TRANSACTIONID QUALIFY ROW_NUMBER() OVER (PARTITION BY V_PREB_GROUP_LEADS_SALES.L_LeadID ORDER BY V_PREB_GROUP_LEADS_GROUP.L_LEADDATE)=1
        name: BVSTG_AU2_GROUP_LEAD
