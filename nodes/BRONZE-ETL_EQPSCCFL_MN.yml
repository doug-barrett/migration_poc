        dependencies:
          - locationName: BRONZE
            nodeName: SRC_EQPSCCFL
          - locationName: UNKNOWN
            nodeName: CDC_BATCH_MIDNIGHT
        join:
          joinCondition: |-
            FROM {{ ref('BRONZE','SRC_EQPSCCFL') }} SRC_EQPSCCFL
             WHERE AUD_TIME <= (
                    SELECT MAX(BATCH_END)
                      FROM {{ ref('UNKNOWN','CDC_BATCH_MIDNIGHT') }}
                   )
               AND AUD_TIME > (
                    SELECT MAX(BATCH_START)
                      FROM {{ ref('UNKNOWN','CDC_BATCH_MIDNIGHT') }}
                   )
               AND (AUD_CODE <> 'F' OR (AUD_CODE IS NULL AND AUD_TYPE = 'RR')) QUALIFY RANK() OVER (PARTITION BY B4CMP, B4CATG, B4CLAS, B4SCAT, B4SCLS ORDER BY AUD_TIME DESC, AUD_SEQNO DESC, CASE WHEN AUD_TYPE IN ('PT','PX','FI') THEN 1 WHEN AUD_TYPE IN ('UB','FB','FP','BR') THEN 2 WHEN AUD_TYPE IN ('UP','UR') THEN 3 WHEN AUD_TYPE IN ('DL','FD') THEN 4 WHEN AUD_TYPE IN ('RR') THEN 5 ELSE 0 END DESC) = 1
