    sourceMapping:
      - aliases:
          V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT: b11dac85-5a8b-4318-bf68-54d6f620e57e
          DS_RETAIL_OFFICE: 581aed87-ec65-482f-aa6f-9a04a9d54476
