    sourceMapping:
      - aliases:
          V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT: f457036c-71e2-4ff2-b58f-4e37796bac1f
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
