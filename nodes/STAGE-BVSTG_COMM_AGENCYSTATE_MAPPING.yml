        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: EDW
            nodeName: DS_SPLC_POLICYTRANSACTION
          - locationName: STAGE
            nodeName: BVSTG_COMM_STATELOOKUP
        join:
          joinCondition: |-
            FROM (SELECT DISTINCT md5(ifnull(agency_unmapped,'-')||' '||ifnull(State_Unmapped, '-')||' '||ifnull(source_table, '-')) ds_bvstg_comm_agencystate_mapping_id,
                   agency_unmapped Agency,
                   State_Unmapped State,
                   CASE WHEN StateLookup_2.StateName IS NOT NULL THEN State_v1
                        WHEN StateLookup_3.StateName IS NOT NULL THEN StateLookup_3.StateAbbrev
                        ELSE 'Unknown'
                         END AS StateCode_Mapped,
                   coalesce(StateLookup_2.StateName, StateLookup_3.StateName, 'Unknown') StateName_Mapped,
                   "DATA_LAKE"."BIA_ANALYTICS".Agency_Mapping(Agency) Agency_Mapped_v1,
                   Source_Table
              FROM (SELECT *,
                   CASE WHEN state <> '' AND state IS NOT NULL                                                                    THEN state
                        WHEN agency = 'FWY'                                                                                       THEN 'Unknown'
                        WHEN agency IN ('FWYSA', 'FWYSN')                                                                         THEN 'TX'
                        WHEN agency like '%FWY%' OR agency like '%INSUREONE%' OR agency like '%INSURE ONE%' OR agency like 'OAS%' THEN right(agency,2)
                        WHEN agency like '%FREEWAY%'                                                                              THEN split_part(substr(agency, charindex('OF', agency)+2, len(agency)), ' ', 2)
                        WHEN agency like '%CA INSURANCE SPECIALISTS%' OR agency like '%CALIFORNIA INSURANCE SPECIALISTS%'         THEN 'CA'
                        ELSE 'Unknown'
                         END AS State_v1
              FROM (SELECT *
              FROM (SELECT DISTINCT agency agency_unmapped,
                   state state_unmapped,
                   upper(trim(agency)) agency,
                   upper(trim(state)) state,
                   'CDRC' Source_Table
              FROM {{ ref('STAGE','V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT') }}
             WHERE isduplicate = 'False'
               AND isdeleted = 'False'
            UNION ALL SELECT DISTINCT agencycode agency_unmapped,
                   statecode state_unmapped,
                   upper(trim(agencycode)) agency,
                   upper(trim(statecode)) state,
                   'EDW' Source_Table
              FROM {{ ref('EDW','DS_RETAIL_OFFICE') }}
            UNION ALL SELECT DISTINCT division agency_unmapped,
                   state state_unmapped,
                   upper(Trim(division)) agency,
                   upper(trim(state)) state,
                   'SPLC' Source_Table
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} -- Added 9/15      union all      select distinct agencycode agency_unmapped, statecode state_unmapped, upper(trim(agencycode)) agency, upper(trim(statecode)) state, 'EDW' Source_Table      from {{ ref('EDW','DS_RETAIL_OFFICE') }}      )       where agency is not null and trim(agency) <> '' )) v_dlbv_comm_carrierdatarepositorycomplete_current      left join {{ ref('STAGE','BVSTG_COMM_STATELOOKUP') }} StateLookup_2      on v_dlbv_comm_carrierdatarepositorycomplete_current.State_v1 = StateLookup_2.StateAbbrev      left join {{ ref('STAGE','BVSTG_COMM_STATELOOKUP') }} StateLookup_3      on v_dlbv_comm_carrierdatarepositorycomplete_current.State_V1 = upper(StateLookup_3.StateName)) v_dlbv_comm_carrierdatarepositorycomplete_current
        name: BVSTG_COMM_AGENCYSTATE_MAPPING
