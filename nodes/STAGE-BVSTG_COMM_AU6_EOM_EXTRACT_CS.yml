        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT bvstg_comm_au3_eom_extract_cs.*,
                   CASE WHEN transactiondate IS NOT NULL THEN to_date(transactiondate)
                        ELSE to_date(bvstg_comm_au3_eom_extract_cs_1.nbsmonth)
                         END AS nbsmonth,
                   avg_monthly_premium
              FROM (SELECT CARRIER_UNMAPPED,
                   CSPOLICYNUMBER,
                   CSPOLICYNUMBERFORMATTED,
                   CARRIER,
                   CARRIERDISPLAYNAME,
                   EFFECTIVEDATE,
                   EXECUTIONMONTH,
