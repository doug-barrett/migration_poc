                   CS_CALCULATION_LOGIC,-- MAXEXECUTIONMONTH_UNMAPPEDCARRIER,        SOURCE_TABLE, PaidTypeFinal, lastest_cspolicynumberformatted           from {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }}       where paidtypefinal = 'As Earned') bvstg_comm_au3_eom_extract_cs    left join         (select ds_ram_retail_repository.PolicyNumber,               ds_bvstg_comm_policynumberformatting_allsources.PolicyNumberFormatted,               ds_bvstg_comm_policynumberformatting_allsources.CarrierName,               ds_ram_retail_repository.TransactionDate       from        (select distinct PolicyNumber,                        CarrierName,                       date_trunc('month', to_date(transactiondate)) transactiondate      --from "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"      FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }}      where trim(PolicyNumber) <> ''         and PolicyNumber is not null         and label in ('New Business Auto','New Business Complementary')        and counter = 1        and year(to_date(transactiondate)) >= 2018         and year(to_date(transactiondate))<= 2021        and (islegacytransaction<>'Migrated' or islegacytransaction is null)        ) ds_ram_retail_repository      left join           (select distinct PolicyNumber_EDW,                            CarrierName_EDW,                            PolicyNumberFormatted,                            CarrierName_Mapped CarrierName           --from "DATA_LAKE"."BIA_ANALYTICS"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES") ds_bvstg_comm_policynumberformatting_allsources           --from "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES") ds_bvstg_comm_policynumberformatting_allsources        from {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }})ds_bvstg_comm_policynumberformatting_allsources            on ds_bvstg_comm_policynumberformatting_allsources.PolicyNumber_EDW = ds_ram_retail_repository.PolicyNumber               and ds_bvstg_comm_policynumberformatting_allsources.CarrierName_EDW = ds_ram_retail_repository.CarrierName        where ds_bvstg_comm_policynumberformatting_allsources.CarrierName in (select distinct carrier      from {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }} where paidtypefinal = 'As Earned')    qualify row_number() over (partition by policynumberformatted, ds_bvstg_comm_policynumberformatting_allsources.carriername order by transactiondate) = 1) ds_ram_retail_repository  -----      on bvstg_comm_au3_eom_extract_cs.PolicyNumberFormatted = ds_ram_retail_repository.PolicyNumberFormatted      and bvstg_comm_au3_eom_extract_cs.carrier = ds_ram_retail_repository.CarrierName    left join      (select distinct policynumberformatted, carrier, min(executionmonth) nbsmonth        from {{ ref('STAGE','BVSTG_COMM_AU3_EOM_EXTRACT_CS') }}       where paidtypefinal = 'As Earned'       group by policynumberformatted, carrier) bvstg_comm_au3_eom_extract_cs_1        on bvstg_comm_au3_eom_extract_cs.policynumberformatted = bvstg_comm_au3_eom_extract_cs_1.policynumberformatted      and bvstg_comm_au3_eom_extract_cs.carrier = bvstg_comm_au3_eom_extract_cs_1.carrier    left join     (select distinct policynumberformatted,carrier,avg(monthly_premium) avg_monthly_premium from      (select policynumberformatted,carrier,executionmonth,sum(premium) monthly_premium       from [TABLEOWNER].[bvstg_comm_au3_eom_extrac
        name: BVSTG_COMM_AU6_EOM_EXTRACT_CS
        noLinkRefs: []
