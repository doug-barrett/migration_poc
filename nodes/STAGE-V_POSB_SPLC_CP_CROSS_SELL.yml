        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_CP_CROSS_SELL') }} AS SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.ID
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
             INNER JOIN (
                    SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.POLICYID
                      FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
                     INNER JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION_CROSS_SELL
                        ON DS_SPLC_POLICYTRANSACTION.CustomerID = DS_SPLC_POLICYTRANSACTION_CROSS_SELL.CustomerID
                       AND DS_SPLC_POLICYTRANSACTION_CROSS_SELL.TranType IN('NBS','RWL','REW')
                       AND ((DS_SPLC_POLICYTRANSACTION_CROSS_SELL.Status IN('Cancelled','Expired') AND DS_SPLC_POLICYTRANSACTION_CROSS_SELL.STATUSDATE >= DATE(DATEADD(DAY,-30,DATE(DS_SPLC_POLICYTRANSACTION.EFFECTIVEDATE)))) OR (DS_SPLC_POLICYTRANSACTION_CROSS_SELL.Status IN('Active','Reinstated') AND DS_SPLC_POLICYTRANSACTION_CROSS_SELL.ReportDate < DS_SPLC_POLICYTRANSACTION.ReportDate))
                       AND DATE(DS_SPLC_POLICYTRANSACTION_CROSS_SELL.ReportDate) < DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)
                       AND DS_SPLC_POLICYTRANSACTION.PolicyID != DS_SPLC_POLICYTRANSACTION_CROSS_SELL.PolicyID
                     WHERE DS_SPLC_POLICYTRANSACTION.TranType IN('NBS','REW')
                   )DS_SPLC_POLICYTRANSACTION_POL
                ON DS_SPLC_POLICYTRANSACTION.POLICYID = DS_SPLC_POLICYTRANSACTION_POL.POLICYID
        dependencies:
