    sourceMapping:
      - aliases:
          BUS_SAFETY_EMP_LC_DSS: 5570d6db-4507-4d8c-853b-400397632ebf
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: BRONZE
            nodeName: BUS_EMPLOYEE
          - locationName: UNKNOWN
            nodeName: BUS_EMPLOYEE
          - locationName: UNKNOWN
            nodeName: CV_SAFETY_DSS_COMP
          - locationName: BRONZE
            nodeName: BUS_SAFETY_EMP_LC_DSS
          - locationName: UNKNOWN
            nodeName: BUS_LOCATION_INFORMATION
          - locationName: UNKNOWN
            nodeName: CV_SAFETY_EMP_ONLEAVE
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT BE.EMPLOYEE_ID,
                           BE.HR_STATUS,
                           BE.SUPERVISOR_ID,
                           BE.DEPT_MANAGER_ID,
                           BE.LAST_NAME,
                           BE.FIRST_NAME,
                           BE.CONTACT_NAME,
                           BE.DEPARTMENT_ID,
                           BE.JOB_CODE,
                           BE.LOCATION_ID,
                           BE.LOCATION_CODE,
                           BE.SERVICE_DATE,
                           BE.TERM_DATE,
                           BE.NETWORK_USER_ID,
                           BE.EMAIL_ADDRESS_ID,
                           BE.EMPLOYEE_DESCRIPTION,
                           BE.STAT_ACCOUNT,
                           BE.STAT_ACCOUNT_DESCRIPTION,
                           LC.PROJECT_WORKER,
                           LC.ACTIVE_STATUS,
                           LC.HIRE_DATE,
                           LC.JOB_PROFILE,
                           LC.JOB_FAMILY,
                           LC.WORK_EMAIL,
                           LC.REGION,
                           LC.DISTRICT,
                           LC.LOCATION,
                           LC.LOC_CODE,
                           LC.COST_CENTER,
                           LC.WORKERS_MANAGER,
                           LC.MANAGER_EMAIL,
                           LC.LEARNING_ENROLLMENT_ID,
                           LC.COURSE_ID,
                           LC.COURSE,
                           LC.RECORD_LEARNING_CONTENT,
                           LC.TOPIC,
                           LC.LEARNING_CONTENT_TYPE,
                           LC.ENROLLMENT_INITIATOR,
                           LC.IMPORTED_ENROLLMENT,
                           LC.REGISTRATION_STATUS,
                           CAST(LC.LEARNER_REG_DATE AS DATE) LEARNER_REG_DATE,
                           LC.COMPLETION_STATUS,
                           CAST(LC.COMPLETION_DATE AS DATE) COMPLETION_DATE,
                           CAST(LC.EXPIRATION_DATE AS DATE) EXPIRATION_DATE,
                           LC.DURATION_IN_HOURS,
                           LC.INSTRUCTOR,
                           LC.COURSE_ATTENDANCE_STATUS,
                           LC.RECORD_GRADE,
                           LC.LEARNING_RECORD_TYPE
                      FROM {{ ref('UNKNOWN','BUS_EMPLOYEE') }} BE
                     INNER JOIN {{ ref('UNKNOWN','CV_SAFETY_DSS_COMP') }} DSS
                        ON (BE.EMPLOYEE_ID=DSS.EMPLOYEE_ID)
                     INNER JOIN {{ ref('BRONZE','BUS_SAFETY_EMP_LC_DSS') }} LC
                        ON DSS.EMPLOYEE_ID=LC.EMPLOYEE_ID
                     INNER JOIN {{ ref('UNKNOWN','BUS_LOCATION_INFORMATION') }} BL
                        ON LC.LOC_CODE = BL.LOCATION_CODE
                      LEFT OUTER JOIN (
                            SELECT DISTINCT EMPLOYEE_ID
                              FROM {{ ref('UNKNOWN','CV_SAFETY_EMP_ONLEAVE') }}
                             WHERE EMPLOYEE_STATUS='LOA'
                           ) OL
                        ON DSS.EMPLOYEE_ID=OL.EMPLOYEE_ID
                     WHERE BL.LAWSON_COMPANY_CODE IN (1,70)
                       AND SUBSTR(BL.LAWSON_DISTRICT_CODE,5,3) NOT IN ('090','094','095')
                       AND BL.LAWSON_REGION_CODE NOT IN ('099')
                       AND LC.COMPLETION_STATUS IN ('COMPLETED')
                       AND BE.HR_STATUS='A'
                       AND OL.EMPLOYEE_ID IS NULL
                       AND BE.JOB_CODE NOT IN ('8N0031')
                 UNION ALL SELECT BE.EMPLOYEE_ID,
                           BE.HR_STATUS,
                           BE.SUPERVISOR_ID,
                           BE.DEPT_MANAGER_ID,
                           BE.LAST_NAME,
                           BE.FIRST_NAME,
                           BE.CONTACT_NAME,
                           BE.DEPARTMENT_ID,
                           BE.JOB_CODE,
                           BE.LOCATION_ID,
                           BE.LOCATION_CODE,
                           BE.SERVICE_DATE,
                           BE.TERM_DATE,
                           BE.NETWORK_USER_ID,
                           BE.EMAIL_ADDRESS_ID,
                           BE.EMPLOYEE_DESCRIPTION,
                           BE.STAT_ACCOUNT,
                           BE.STAT_ACCOUNT_DESCRIPTION,
                           '' AS PROJECT_WORKER,
                           '' AS ACTIVE_STATUS,
                           NULL AS HIRE_DATE,
                           '' AS JOB_PROFILE,
                           '' AS JOB_FAMILY,
                           '' AS WORK_EMAIL,
                           '' AS REGION,
                           '' AS DISTRICT,
                           '' AS
                  LOCATION,
                           HRL.LOCATION_CODE AS LOC_CODE,
                           '' AS COST_CENTER,
                           '' AS WORKERS_MANAGER,
                           '' AS MANAGER_EMAIL,
                           '' AS LEARNING_ENROLLMENT_ID,
                           '' AS COURSE_ID,
                           'DSS' AS COURSE,
                           'DRIVER SAFETY SEMINAR' AS RECORD_LEARNING_CONTENT,
                           '' AS TOPIC,
                           '' AS LEARNING_CONTENT_TYPE,
                           '' AS ENROLLMENT_INITIATOR,
                           '' AS IMPORTED_ENROLLMENT,
                           '' AS REGISTRATION_STATUS,
                           CAST(NULL AS TIMESTAMP) AS LEARNER_REG_DATE,
                           'NONE' AS COMPLETION_STATUS,
                           CAST(NULL AS TIMESTAMP) AS COMPLETION_DATE,
                           NULL AS EXPIRATION_DATE,
                           NULL AS DURATION_IN_HOURS,
                           '' AS INSTRUCTOR,
                           '' AS COURSE_ATTENDANCE_STATUS,
                           '' AS RECORD_GRADE,
                           '' AS LEARNING_RECORD_TYPE
                      FROM {{ ref('UNKNOWN','BUS_EMPLOYEE') }} BE
                     INNER JOIN {{ ref('UNKNOWN','CV_SAFETY_DSS_COMP') }} DSS
                        ON (BE.EMPLOYEE_ID = DSS.EMPLOYEE_ID)
                      LEFT OUTER JOIN (
                            SELECT DISTINCT EMPLOYEE_ID,
                                   LOC_CODE
                              FROM {{ ref('BRONZE','BUS_SAFETY_EMP_LC_DSS') }}
                             WHERE COMPLETION_STATUS IN ('COMPLETED')
                           ) LC
                        ON DSS.EMPLOYEE_ID = LC.EMPLOYEE_ID
                     INNER JOIN {{ ref('UNKNOWN','BUS_LOCATION_INFORMATION') }} BL
                        ON BE.LOCATION_ID = BL.LOCATION_ID
                      LEFT OUTER JOIN (
                            SELECT DISTINCT EMPLOYEE_ID
                              FROM {{ ref('UNKNOWN','CV_SAFETY_EMP_ONLEAVE') }}
                             WHERE EMPLOYEE_STATUS = 'LOA'
                           ) OL
                        ON DSS.EMPLOYEE_ID = OL.EMPLOYEE_ID
                      LEFT OUTER JOIN (
                            SELECT DISTINCT EMPLOYEE_ID,
                                   LOCATION_CODE
                              FROM {{ ref('UNKNOWN','CV_SAFETY_EMP_ONLEAVE') }}
                           ) HRL
                        ON DSS.EMPLOYEE_ID = HRL.EMPLOYEE_ID
                     WHERE BL.LAWSON_COMPANY_CODE IN (1,70)
                       AND SUBSTR(BL.LAWSON_DISTRICT_CODE,5,3) NOT IN ('090','094','095')
                       AND BL.LAWSON_REGION_CODE NOT IN ('099')
                       AND BE.HR_STATUS='A'
                       AND OL.EMPLOYEE_ID IS NULL
                       AND LC.EMPLOYEE_ID IS NULL
                       AND BE.JOB_CODE NOT IN ('8N0031')
                       AND BE.SERVICE_DATE < TRUNC(CURRENT_DATE,'MONTH')-1
                   ) DSS
