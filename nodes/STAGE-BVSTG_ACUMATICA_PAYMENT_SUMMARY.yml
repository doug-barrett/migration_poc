              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE_SO
                ON DS_RETAIL_OFFICE_SO.OFFICECODE = DS_BVSTG_AP1_TRANSACTION.TransactionOfficeCode
              LEFT JOIN(
                    SELECT a.PAYMENTID,
                           IFNULL(a.COMMENT,'')Detail
                      FROM RETAIL_PROD.SCH_DATA_VAULT.S_AP1_PAYMENT_MROC a
                     INNER JOIN RETAIL_PROD.SCH_DATA_VAULT.S_AP1_PAYMENTRECEIPT_MROC b
                        ON (a.paymentreceiptid = b.paymentreceiptid) QUALIFY ROW_NUMBER() OVER(PARTITION BY a.PAYMENTID ORDER BY a.DSS_VERSION DESC) = 1
                   )DS_BVSTG_AP1_PAYMENT_DETAIL
                ON DS_BVSTG_AP1_PAYMENT.PAYMENTID = DS_BVSTG_AP1_PAYMENT_DETAIL.PAYMENTID
             WHERE ((date(DS_BVSTG_AP1_PAYMENT.CREATED_PAYMENT) BETWEEN min_date AND max_date) OR (date(DS_BVSTG_AP1_PAYMENT.VOIDEDON_PAYMENT) BETWEEN min_date AND max_date) OR (date(DS_BVSTG_AP1_PAYMENT.NSFON) BETWEEN min_date AND max_date))
