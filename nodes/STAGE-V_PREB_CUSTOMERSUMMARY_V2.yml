    sourceMapping:
      - aliases:
          V_PREB_CUSTOMERSUMMARY_V2: 0a783c4c-87cd-4eaf-8a54-1197b53836a9
          DS_POLICYSUMMARY_V2: 23ba684a-5671-4cfa-9e5f-11f1386d24b3
          BVSTG_CUSTOMER_TO_REFRESH: 7cbd0921-faef-4eb6-bdf6-f95f09598096
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_CUSTOMERSUMMARY_V2') }} AS SELECT ds_policysummary_v2.CustomerKey ,
                   MIN(ds_policysummary_v2.CustomerNo) AS CustomerNo ,
                   MIN(ds_policysummary_v2.StartDate)AS StartDate ,
                   CASE WHEN SUM(CASE WHEN ds_policysummary_v2.Status_Standard = 'Active' THEN 1 ELSE 0 END)>0 THEN NULL
                        ELSE MAX(ds_policysummary_v2.EndDate)
                         END AS EndDate ,
                   SUM(CASE WHEN ds_policysummary_v2.Status_Standard = 'Active' THEN 1 ELSE 0 END) AS PolicyActiveCount ,
                   COUNT(1) AS PolicyCount ,
                   SUM(ds_policysummary_v2.ISGRACE_PERIOD) isgrace_period ,
                   SUM(ds_policysummary_v2.PolicyTenure) AS PolicyTenure ,
                   DATEDIFF(MONTH,MIN(ds_policysummary_v2.StartDate) ,CASE WHEN SUM(CASE WHEN ds_policysummary_v2.Status_Standard = 'Active' THEN 1 ELSE 0 END)>0 THEN TO_DATE(CURRENT_DATE())ELSE MAX(ds_policysummary_v2.EndDate) END) AS CustomerTenure ,
                   CASE WHEN SUM(CASE WHEN ds_policysummary_v2.Status_Standard = 'Active' THEN 1 ELSE 0 END)>0       THEN 'Active'
                        WHEN SUM(CASE WHEN ds_policysummary_v2.Status_Standard = 'Grace Period' THEN 1 ELSE 0 END)>0 THEN 'Grace Period'
                        ELSE 'Inactive'
                         END AS Customer_Status ,
                   COUNT(DISTINCT ds_policysummary_v2.CarrierName) AS unique_carriers ,
                   CASE WHEN SUM(CASE WHEN ds_policysummary_v2.isLegacyTransaction = 'Native' THEN 1 ELSE 0 END) >= 1 THEN 1
                        ELSE 0
                         END AS hasNativePolicies
              FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
             INNER JOIN (
                    SELECT DISTINCT customerid,
                           sourcedb
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                   ) bvstg_customer_to_refresh
                ON IFNULL(bvstg_customer_to_refresh.customerid,'') = IFNULL(ds_policysummary_v2.customerid,'')
               AND bvstg_customer_to_refresh.sourcedb = ds_policysummary_v2.sourcedb
             GROUP BY CustomerKey
        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: STAGE
            nodeName: BVSTG_CUSTOMER_TO_REFRESH
        join:
