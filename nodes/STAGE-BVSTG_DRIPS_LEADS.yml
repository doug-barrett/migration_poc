        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_DRIPS_CDT_POLICY
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_CUSTOMER
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_TRANSACTION
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: STAGE
            nodeName: V_PREB_DRIPS_LEADS_KEYS
          - locationName: STAGE
            nodeName: V_PREB_API_OB_DRIPS_DNC_NUMBERS
          - locationName: STAGE
            nodeName: V_PREB_API_OB_DRIPS_DNC_CONVOSO
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_DRIPS_CDT_POLICY') }} bvstg_drips_cdt_policy
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_CUSTOMER') }} ds_bvstg_ap1_customer
                ON (bvstg_drips_cdt_policy.CustomerID = ds_bvstg_ap1_customer.CustomerID AND LEN(ds_bvstg_ap1_customer.Email)>5 AND ds_bvstg_ap1_customer.Email like '%@%' AND ds_bvstg_ap1_customer.Email like '%.%')
              LEFT JOIN (
                    SELECT Customerid,
                           COUNT(1) AS ActivePol
                      FROM {{ ref('STAGE','BVSTG_DRIPS_CDT_POLICY') }}
                     WHERE TransactionType IN ('New Business','Renewal', 'Reinstatement','Renewal Payment')
                       AND Bia_Status IN ('Active','Reinstated', 'Renewed')
                       AND CAST(LastUpdatedPolicy AS DATE) = DATEADD(DAY,-1,CURRENT_DATE())
                     GROUP BY CustomerID
                   )d
                ON (bvstg_drips_cdt_policy.CustomerID = d.CustomerID)
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTION') }} ds_bvstg_ap1_transaction
                ON bvstg_drips_cdt_policy.TransactionID = ds_bvstg_ap1_transaction.transactionid
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ds_bvstg_ap1_transaction.transactionofficecode = ds_retail_office.officecode
              LEFT JOIN {{ ref('STAGE','V_PREB_DRIPS_LEADS_KEYS') }} v_preb_drips_leads_keys
                ON ds_retail_office.AGENCYCODE=v_preb_drips_leads_keys.Brand
               AND v_preb_drips_leads_keys.LeadStatus = 'Canceled'
              LEFT JOIN {{ ref('STAGE','V_PREB_API_OB_DRIPS_DNC_NUMBERS') }} v_preb_api_ob_drips_dnc_numbers
                ON v_preb_api_ob_drips_dnc_numbers.Phone = IFNULL(ds_bvstg_ap1_customer.Cellphone,ds_bvstg_ap1_customer.Homephone)
              LEFT JOIN {{ ref('STAGE','V_PREB_API_OB_DRIPS_DNC_CONVOSO') }} v_preb_api_ob_drips_dnc_convoso
                ON v_preb_api_ob_drips_dnc_convoso.PhoneNumber = IFNULL(ds_bvstg_ap1_customer.Cellphone,ds_bvstg_ap1_customer.Homephone)
              LEFT JOIN (
                    SELECT DISTINCT CustomerID
                      FROM RETAIL_PROD.SCH_EDW.DS_RAM_RETAIL_REPOSITORY
                     WHERE ORGANIZATIONCODE like 'Z%'
                       AND SourceDB = 'AppOne'
                   )FRAN
                ON FRAN.CustomerID = ds_bvstg_ap1_customer.CustomerID
             WHERE IFNULL(d.ActivePol,0)= 0
               AND ds_bvstg_ap1_customer.email != ''
               AND AGENCYCODE IN ('CUL CA', 'FWY CA')
               AND v_preb_api_ob_drips_dnc_numbers.Phone IS NULL
               AND v_preb_api_ob_drips_dnc_convoso.PhoneNumber IS NULL
               AND FRAN.CustomerID IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_drips_cdt_policy.TransactionId ORDER BY bvstg_drips_cdt_policy.LastUpdatedPolicy DESC) = 1
             ORDER BY DID,
                      first_name,
                      last_name
        name: BVSTG_DRIPS_LEADS
        noLinkRefs: []
