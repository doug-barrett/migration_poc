        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_AMS_AU0_PREMIUM') }} AS SELECT POL.PolID,
                   PR.LineOfBus,
                   COUNT(1) AS isBilling
              FROM {{ ref('STAGE','BVSTG_AMS_AU00_INVOICE_TO_REFRESH') }} INVTP
             INNER JOIN {{ ref('STAGE','V_S_AMS_POLICYTRANPREMIUM_MROC_CURRENT') }} PR
                ON (PR.poltpid = INVTP.poltpid AND PR.lineofbus = INVTP.lineofbus)
             INNER JOIN {{ ref('STAGE','V_S_AMS_BASICPOLINFO_MROC_CURRENT') }} POL
                ON (PR.PolId= POl.PolID AND TO_DATE(PR.ENTEREDDATE) >= TO_DATE(POL.ENTEREDDATE) AND TO_DATE(PR.ENTEREDDATE) <= TO_DATE(POL.POLEXPDATE) AND PR.BilledPremium > 0)
             GROUP BY POL.PolID,
                      PR.LineOfBus
