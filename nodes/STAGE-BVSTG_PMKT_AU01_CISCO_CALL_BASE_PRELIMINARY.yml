    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_AGENT_SESSION
        join:
          joinCondition: |-
            FROM (
                    SELECT DISTINCT t1.SESSIONAGENTID,
                           t1.SESSIONID,
                           t1.STARTDATETIME,
                           t1.ENDDATETIME,
                           t1.AGENTSKILLTARGETID,
                           t1.AGENTNAME,
                           t1.AGENT,
                           t1.SKILLGROUPTARGETNAME,
                           trim(right(t1.ani, 10)) AS ani,
                           t1.CALLDISPOSITION,
                           t1.ROUTEDSKILLGROUPSKILLTARGETID,
                           t1.ISINBOUND,
                           t1.ISOUTBOUND,
                           t1.ISOFFEREDCALL,
                           t1.ISINTERNALCALL,
                           t1.ISTRANSFER_OFFERED,
                           t1.ISTRANSFER_RECEIVED,
                           t1.ISANSWERCALL,
                           t1.ISABANDONCALL,
                           t1.ISREDIRECTED,
                           t1.NETWORKTIME,
                           t1.DURATION,
                           t1.RINGTIME,
                           t1.DELAYTIME,
                           t1.TIMETOABAND,
                           t1.HOLDTIME,
                           t1.TALKTIME,
                           t1.WORKTIME,
                           t1.LOCALQTIME,
                           t1.NETQTIME,
                           t1.AGENTOFFICE,
                           t1.CALLTYPEDESCRIPTION,
                           t1.CALLTYPENAME,
                           t1.DNIS,
                           t2.is_icr,
                           t2.icr_result,
                           CASE WHEN (lower(trim(agentoffice)) like ('%ctsc%') OR lower(trim(agentoffice)) like ('%speciality%telesales%') OR lower(trim(agentoffice)) like ('%telesales%'))                                                                                                                                                                         THEN 'Telesales'
                                WHEN (lower(trim(agentoffice)) like ('%customer%service%') OR lower(trim(agentoffice)) like ('%cs%one%service') OR lower(trim(agentoffice)) like ('%cs%back%office%') OR lower(trim(agentoffice)) like ('%one%source%cs%') OR lower(trim(agentoffice)) like ('%cs%one%source%') OR lower(trim(agentoffice)) like ('%cs%retention%')) THEN 'Customer Service'
                                WHEN territorymanagername='Michael Sanchez' OR lower(trim(agentoffice)) like '%zca%'                                                                                                                                                                                                                                                 THEN 'Franchise'
                                WHEN lower(trim(agentoffice)) like '%corp%'                                                                                                                                                                                                                                                                                          THEN 'Corporate'
                                WHEN officetype IS NOT NULL                                                                                                                                                                                                                                                                                                          THEN officetype
                                ELSE 'Others'
                                 END AS agent_office_grouped,
                           row_number() OVER (PARTITION BY t1.sessionid ORDER BY startdatetime) AS call_row_number,
                           round(TIMESTAMPDIFF(SECONDS, startdatetime,enddatetime) / 60, 2) AS call_duration_minutes,
                           CASE WHEN isinbound = 1  THEN 'Inbound'
                                WHEN isoutbound = 1 THEN 'Outbound'
                                ELSE 'Check'
                                 END AS call_group
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_PCCE_TERMINATION_CALL_AGENT_SESSION" AS t1
                      LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE"
                        ON ifnull(DS_RETAIL_OFFICE.officecode,'-')=ifnull(t1.agentoffice,'-')
                      LEFT JOIN (
                            SELECT DISTINCT id,
                                   is_icr,
                                   icr_result
                              FROM "RETAIL_PROD"."SCH_EDW"."DS_PCCE_TERMINATION_CALL_SUMMARY_SESSION"
                           ) t2
                        ON t1.sessionid=t2.id
                     WHERE to_date(startdatetime)>='2024-10-01'
                       AND agent IS NOT NULL
                       AND (isinbound = 1 OR isoutbound = 1)
                   ) DS_PCCE_TERMINATION_CALL_AGENT_SESSION
              LEFT JOIN (
                    SELECT DISTINCT INTERACTIONIDKEY,
                           to_varchar(customerid) AS CustomerID_Call_Customer,
                           to_varchar(leadid) AS LeadID_Call_Customer,
                           LAST_ACTIVITYDATE,
                           LAS_ACTIVITY_TYPE,
                           LAS_TRANSACTIONID,
                           LAST_TRANSACTIONDATE
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_MKT_CALL_CUSTOMER"
                     WHERE sourcedb_customer='AppOne'
                   ) DS_MKT_CALL_CUSTOMER
                ON DS_PCCE_TERMINATION_CALL_AGENT_SESSION.SESSIONID = DS_MKT_CALL_CUSTOMER.INTERACTIONIDKEY
              LEFT JOIN (
                    SELECT DISTINCT CASE WHEN callid like '%-%-%' THEN substring(callid,1,regexp_instr(callid,'-',1,2)-1)
                                ELSE callid
                                 END AS callid_new,
                           to_varchar(customerid) AS Customerid_AppOne_Phone_Call,
                           to_varchar(leadid) AS Leadid_AppOne_Phone_Call
                      FROM "RETAIL_PROD"."SCH_DATA_VAULT"."S_AP1_PHONECALL_MROC" QUALIFY row_number() OVER (PARTITION BY CASE WHEN callid like '%-%-%' THEN substring(callid,1,regexp_instr(callid,'-',1,2)-1) ELSE callid END ORDER BY dss_create_time DESC)=1
                   ) S_AP1_PHONECALL_MROC
                ON S_AP1_PHONECALL_MROC.callid_new = DS_PCCE_TERMINATION_CALL_AGENT_SESSION.sessionid
        name: BVSTG_PMKT_AU01_CISCO_CALL_BASE_PRELIMINARY
        noLinkRefs: []
