      config: {}
      dataType: VARCHAR(25)
      description: ''
      name: COLLECTION_RISK
      nullable: false
      sourceColumnReferences:
      - columnReferences: []
        transform: "CASE \n\nWHEN (CV_M_CUSTOMER.Credit_Risk_1='0' or CV_M_CUSTOMER.Credit_Risk_2='0')\
          \ \n\nTHEN 'None' \n\nWHEN SUBSTR ( TRIM ( CV_M_CUSTOMER.Credit_Risk_1 )\
          \ , 1 , 1 ) BETWEEN '0' AND '9' \n\n     AND SUBSTR ( TRIM ( CV_M_CUSTOMER.Credit_Risk_2\
          \ ) , 1 , 1 ) BETWEEN '0' AND '9' \n\nTHEN CASE \n\n     WHEN SUBSTR ( CV_M_CUSTOMER.Credit_Risk_1\
          \ , 1 , 3 ) >= ( '384' ) \n\n          AND SUBSTR ( CV_M_CUSTOMER.Credit_Risk_2\
          \ , 1 , 3 ) > '455' \n\n     THEN 'Low' \n\n     WHEN SUBSTR ( CV_M_CUSTOMER.Credit_Risk_1\
          \ , 1 , 3 ) >= '417' \n\n          AND SUBSTR ( CV_M_CUSTOMER.Credit_Risk_2\
          \ , 1 , 3 ) >= '428' \n\n     THEN 'Low'  \n\n     WHEN SUBSTR ( CV_M_CUSTOMER.Credit_Risk_1\
          \ , 1 , 3 ) >= '460' \n\n          AND SUBSTR ( CV_M_CUSTOMER.Credit_Risk_2\
          \ , 1 , 3 ) >= '402' \n\n     THEN 'Low'  \n\n     WHEN SUBSTR ( CV_M_CUSTOMER.Credit_Risk_1\
          \ , 1 , 3 ) > '460' \n\n          AND SUBSTR ( CV_M_CUSTOMER.Credit_Risk_2\
          \ , 1 , 3 ) <= '401' \n\n     THEN 'Medium'  \n\n     WHEN SUBSTR ( CV_M_CUSTOMER.Credit_Risk_1\
          \ , 1 , 3 ) BETWEEN '417' AND '460' \n\n          AND SUBSTR ( CV_M_CUSTOMER.Credit_Risk_2\
          \ , 1 , 3 ) <= '427' \n\n     THEN 'Medium' \n\n     WHEN SUBSTR ( CV_M_CUSTOMER.Credit_Risk_1\
          \ , 1 , 3 ) BETWEEN '384' AND '416' \n\n          AND SUBSTR ( CV_M_CUSTOMER.Credit_Risk_2\
          \ , 1 , 3 ) BETWEEN '376' AND '455' \n\n     THEN 'Medium'  \n\n     WHEN\
          \ SUBSTR ( CV_M_CUSTOMER.Credit_Risk_1 , 1 , 3 ) < '384' \n\n          AND\
          \ SUBSTR ( CV_M_CUSTOMER.Credit_Risk_2 , 1 , 3 ) >= '428' \n\n     THEN\
          \ 'Medium'  \n\n     ELSE 'High'  \n\n     END \n\nELSE 'Unknown'\n\nEND"
