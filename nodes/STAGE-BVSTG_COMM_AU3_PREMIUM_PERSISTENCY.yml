        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT au1pp.carrier,
                   au1pp.term,
                   au1pp.policysource,
                   au1pp.customer_type,
                   au1pp.agency,
                   au1pp.agencystate,
                   au1pp.leadtype,
                   au1pp.lineofbusiness,
                   au1pp.paidtype,
                   au1pp.customerstate,
                   au1pp.isOnlineBinding,
                   au1pp.ISLEGACYTRANSACTION,
