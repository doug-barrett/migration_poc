        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT au1pp.carrier,
                   au1pp.term,
                   au1pp.policysource,
                   au1pp.customer_type,
                   au1pp.agency,
                   au1pp.agencystate,
                   au1pp.leadtype,
                   au1pp.lineofbusiness,
                   au1pp.paidtype,
                   au1pp.customerstate,
                   au1pp.isOnlineBinding,
                   au1pp.ISLEGACYTRANSACTION,
                   au1pp.isFranchise,
                   au1pp.TerritoryManagerName,
                   au1pp.uprate_policy_flag,
                   au1pp.nbsmonth,
                   au1pp.monthsfromnbs,
                   au1pp.collected_premium,
                   au1pp.expected_premium,
                   au1pp.PIF_EOM,
                   au1pp.Policy_Count,
                   1 Extract_Flag
              FROM (SELECT DISTINCT au1pp.*,
                   datediff('months',au1pp.nbsmonth,current_date()) Age,
                   ifnull(au1pp_1.collected_premium,0) collected_premium,
                   ifnull(au1pp_2.expected_premium,0) expected_premium,
                   ifnull(au1pp_3.PIF_EOM,0) PIF_EOM,
                   ifnull(au1pp_4.Policy_Count,0) Policy_Count
              FROM (
                    SELECT *
                      FROM (
                            SELECT DISTINCT carrier,
                                   term,
                                   policysource,
                                   customer_type,
                                   agency,
                                   agencystate,
                                   leadtype,
                                   lineofbusiness,
                                   paidtype,
                                   customerstate,
                                   isOnlineBinding,
                                   isFranchise,
                                   ISLEGACYTRANSACTION,
                                   TerritoryManagerName,
                                   uprate_policy_flag,
                                   nbsmonth
                              FROM {{ ref('STAGE','BVSTG_COMM_AU1_PREMIUM_PERSISTENCY') }}
                             WHERE monthsfromnbs='M1'
                           ) AS au1pp
                     CROSS JOIN (
                            SELECT DISTINCT monthsfromnbs
                              FROM {{ ref('STAGE','BVSTG_COMM_AU1_PREMIUM_PERSISTENCY') }}
                           ) au1pp_1
                   ) AS au1pp
              LEFT JOIN (
                    SELECT carrier,
                           term,
                           policysource,
                           customer_type,
                           agency,
                           agencystate,
                           leadtype,
                           lineofbusiness,
                           paidtype,
                           customerstate,
                           isOnlineBinding,
                           isFranchise,
                           ISLEGACYTRANSACTION,
                           TerritoryManagerName,
                           uprate_policy_flag,
                           nbsmonth,
                           monthsfromnbs,
                           sum(collected_premium) collected_premium
                      FROM {{ ref('STAGE','BVSTG_COMM_AU1_PREMIUM_PERSISTENCY') }}
                     WHERE combinedstatus_eom='Active'
                     GROUP BY carrier,
                              term,
                              policysource,
                              customer_type,
                              agency,
                              agencystate,
                              leadtype,
                              lineofbusiness,
                              paidtype,
                              customerstate,
                              isOnlineBinding,
                              isFranchise,
                              ISLEGACYTRANSACTION,
                              TerritoryManagerName,
                              uprate_policy_flag,
                              nbsmonth,
                              monthsfromnbs
                   ) AS au1pp_1
                ON au1pp.carrier=au1pp_1.carrier
               AND au1pp.term=au1pp_1.term
               AND au1pp.policysource=au1pp_1.policysource
               AND au1pp.customer_type=au1pp_1.customer_type
               AND au1pp.agency=au1pp_1.agency
               AND au1pp.agencystate=au1pp_1.agencystate
               AND au1pp.leadtype=au1pp_1.leadtype
               AND au1pp.lineofbusiness=au1pp_1.lineofbusiness
               AND au1pp.paidtype=au1pp_1.paidtype
               AND au1pp.customerstate=au1pp_1.customerstate
               AND au1pp.isOnlineBinding=au1pp_1.isOnlineBinding
               AND au1pp.ISLEGACYTRANSACTION=au1pp_1.ISLEGACYTRANSACTION
               AND au1pp.isFranchise=au1pp_1.isFranchise
               AND au1pp.TerritoryManagerName=au1pp_1.TerritoryManagerName
               AND au1pp.uprate_policy_flag=au1pp_1.uprate_policy_flag
               AND au1pp.nbsmonth=au1pp_1.nbsmonth
               AND au1pp.monthsfromnbs=au1pp_1.monthsfromnbs
              LEFT JOIN (
                    SELECT carrier,
                           term,
                           policysource,
                           customer_type,
                           agency,
                           agencystate,
                           leadtype,
                           lineofbusiness,
                           paidtype,
                           customerstate,
                           isOnlineBinding,
                           isFranchise,
                           ISLEGACYTRANSACTION,
                           TerritoryManagerName,
                           uprate_policy_flag,
                           nbsmonth,
                           sum(expected_premium) expected_premium
                      FROM {{ ref('STAGE','BVSTG_COMM_AU1_PREMIUM_PERSISTENCY') }}
                     WHERE monthsfromnbs='M1'
                     GROUP BY carrier,
                              term,
                              policysource,
                              customer_type,
                              agency,
                              agencystate,
                              leadtype,
                              lineofbusiness,
                              paidtype,
                              customerstate,
                              isOnlineBinding,
                              isFranchise,
                              ISLEGACYTRANSACTION,
                              TerritoryManagerName,
                              uprate_policy_flag,
                              nbsmonth
