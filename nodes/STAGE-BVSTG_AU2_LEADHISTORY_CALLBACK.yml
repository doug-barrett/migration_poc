          - locationName: STAGE
            nodeName: BVSTG_AU1_LEADHISTORY_CALLBACK
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_LEADHISTORY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU1_LEADHISTORY_CALLBACK') }} bvstg_au1_leadhistory_callback
              LEFT JOIN {{ ref('STAGE','BVSTG_AU1_LEADHISTORY_CALLBACK') }} bvstg_au1_leadhistory_callback_end
                ON (bvstg_au1_leadhistory_callback.LeadID = bvstg_au1_leadhistory_callback_end.LeadID AND bvstg_au1_leadhistory_callback.REASIGN_RANKING = bvstg_au1_leadhistory_callback_end.REASIGN_RANKING - 1)
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }} ds_bvstg_ap1_leadhistory_quote
                ON ds_bvstg_ap1_leadhistory_quote.LeadID = bvstg_au1_leadhistory_callback.LeadID
               AND ds_bvstg_ap1_leadhistory_quote.isquote = 1
               AND ds_bvstg_ap1_leadhistory_quote.Lead_Ranking >= CASE WHEN bvstg_au1_leadhistory_callback.Reasign_Ranking = 1 THEN 1
                        ELSE bvstg_au1_leadhistory_callback.Lead_Ranking
                         END
               AND ds_bvstg_ap1_leadhistory_quote.Lead_Ranking < CASE WHEN bvstg_au1_leadhistory_callback_end.Lead_Ranking IS NULL THEN bvstg_au1_leadhistory_callback.max_Lead_Ranking + 1
                        ELSE bvstg_au1_leadhistory_callback_end.Lead_Ranking
                         END
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }} ds_bvstg_ap1_leadhistory_transfer
                ON ds_bvstg_ap1_leadhistory_transfer.LeadID = bvstg_au1_leadhistory_callback.LeadID
               AND ds_bvstg_ap1_leadhistory_transfer.istransfer = 1
               AND ds_bvstg_ap1_leadhistory_transfer.Lead_Ranking >= CASE WHEN bvstg_au1_leadhistory_callback.Reasign_Ranking = 1 THEN 1
                        ELSE bvstg_au1_leadhistory_callback.Lead_Ranking
                         END
               AND ds_bvstg_ap1_leadhistory_transfer.Lead_Ranking < CASE WHEN bvstg_au1_leadhistory_callback_end.Lead_Ranking IS NULL THEN bvstg_au1_leadhistory_callback.max_Lead_Ranking + 1
                        ELSE bvstg_au1_leadhistory_callback_end.Lead_Ranking
                         END
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_LEADHISTORY') }} ds_bvstg_ap1_leadhistory_sale
                ON ds_bvstg_ap1_leadhistory_sale.LeadID = bvstg_au1_leadhistory_callback.LeadID
               AND ds_bvstg_ap1_leadhistory_sale.isSale = 1
               AND ds_bvstg_ap1_leadhistory_sale.Lead_Ranking >= CASE WHEN bvstg_au1_leadhistory_callback.Reasign_Ranking = 1 THEN 1
                        ELSE bvstg_au1_leadhistory_callback.Lead_Ranking
                         END
               AND ds_bvstg_ap1_leadhistory_transfer.Lead_Ranking < CASE WHEN bvstg_au1_leadhistory_callback_end.Lead_Ranking IS NULL THEN bvstg_au1_leadhistory_callback.max_Lead_Ranking +1
                        ELSE bvstg_au1_leadhistory_callback_end.Lead_Ranking
                         END
             WHERE 1=1 QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_au1_leadhistory_callback.HistoryID ORDER BY ds_bvstg_ap1_leadhistory_quote.Created, ds_bvstg_ap1_leadhistory_transfer.Created)=1
             ORDER BY bvstg_au1_leadhistory_callback.LeadID,
                      bvstg_au1_leadhistory_callback.Lead_Ranking
        name: BVSTG_AU2_LEADHISTORY_CALLBACK
        noLinkRefs: []
