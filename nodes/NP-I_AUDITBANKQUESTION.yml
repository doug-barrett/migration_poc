              LEFT JOIN {{ ref('NP','L_NPS_BANKQUESTION') }} L2
                ON I_AUDITBANKQUESTIONHIERARCHY.LEVEL2ID = L2.ID --THIS CLAUSE MATCHES THE CODE AGAINST THE QUESTIONS THAT ARE ADDED TO THE AUDIT QUESTION DIMENSION.      --ALL THE NEW QUESTIONS HAVE BEEN SET UP WITH RESPONSES, IN NO RESPONSE SET      -- WE PROBABLY DON'T WANT TO KNOW ABOUT THE QUESTION      WHERE L_NPS_BANKQUESTION.USEPREDEFINEDRESPONSE = 1      --DO NOT INCLUDE ANY OF THE PARENT RECORDS SET UP TO GROUP THE QUESTIONS      AND L_NPS_BANKQUESTION.ISCATEGORY = 0      --ONLY INCLUDE THE QUESTIONS THAT NORTHPOWER HAVE IDENTIFIED WITH THE UNIQUE      -- QUESTION ID SO WE CAN TRACK THE QUESTION USAGE THROUGH THE USED TEMPLATES AND CHECKLISTS      AND PATINDEX('% #%',L_NPS_BANKQUESTION.QUESTIONTEXT) > 0
