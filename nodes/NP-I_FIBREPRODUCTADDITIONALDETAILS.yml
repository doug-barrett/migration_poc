              JOIN {{ ref('NP','I_GIS_FIBRESERVICEACTIVITY') }} [I_GIS_FIBRESERVICEACTIVITY]
                ON CUSTOMERTYPE = CUSTOMERTYPE
              JOIN {{ ref('NP','I_JDE_FIBREPRODUCTMIX') }} [I_JDE_FIBREPRODUCTMIX]
