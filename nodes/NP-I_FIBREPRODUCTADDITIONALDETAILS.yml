            FROM {{ ref('NP','L_GIS_FIBERPRODUCTOFFER') }} [L_GIS_FIBERPRODUCTOFFER]
              JOIN {{ ref('NP','D_PRODUCTGROUP') }} [D_PRODUCTGROUP]
                ON PRODUCTGROUPCODE = PRODUCTGROUPCODE
