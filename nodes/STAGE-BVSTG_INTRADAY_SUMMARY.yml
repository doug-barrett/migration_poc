    sourceMapping:
      - aliases:
          BVSTG_INTRADAY_AU1_SUMMARY: a588ffeb-e8e6-4de5-9450-c0921c1a3e0a
          DS_AGENT_KEY: e03830da-869e-4c69-8cc5-0b677f38927e
          DS_RETAIL_OFFICE: 7fd20bc2-12f3-4073-aaf4-8c712d0208af
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_INTRADAY_AU1_SUMMARY
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
        join:
          joinCondition: |-
            FROM (
                    SELECT EmployeeNumber, DATE, HOUR,
                           OfficeCode,
                           SUM(Sales) Sales,
                           SUM(Quotes) Quotes,
                           SUM(TransfersMade) TransfersMade,
                           SUM(TransfersReceived) TransfersReceived,
                           SUM(WebTransfersReceived) WebTransfersReceived,
                           SUM(CallTransfersReceived) CallTransfersReceived,
                           SUM(Inbound) Inbound,
                           SUM(Outbound) Outbound,
                           MIN(MIN_QUOTE_TIME) MIN_QUOTE_TIME,
                           MIN(MIN_SALE_TIME) MIN_SALE_TIME,
                           MIN(MIN_INBOUNDCALL_TIME) MIN_INBOUNDCALL_TIME,
                           MIN(min_OtboundCall_Time) min_OtboundCall_Time,
                           MIN(min_Edorsement_Time) min_Edorsement_Time,
                           MIN(min_Monthly_Payment_Time) min_Monthly_Payment_Time,
                           SUM(Edorsement) Edorsement,
                           SUM(Monthly_Payment) Monthly_Payment,
                           SUM(Ancillary) AS Ancillary,
                           SUM(Reinstatements) AS Reinstatements,
                           MIN(min_Ancillary_Time) AS min_Ancillary_Time,
                           MIN(min_Reinstatement_Time) AS min_Reinstatement_Time,
                           SUM(Fee_Amt) AS Fee_Amt,
                           SUM(Total_Primary_Fee) AS Total_Primary_Fee,
                           SUM(Ancillary_Amt) AS Ancillary_Amt,
                           SUM(sales_inbound) AS sales_inbound,
                           SUM(sales_outbound) AS sales_outbound,
                           SUM(Inbound_Answer) AS Inbound_Answer,
                           SUM(QC_Errors) AS QC_Errors,
                           SUM(Cancellation_90Days) AS Cancellation_90Days,
                           SUM(LOGGEDONTIME) AS LOGGEDONTIME,
                           SUM(NOTREADYTIME) AS NOTREADYTIME
                      FROM {{ ref('STAGE','BVSTG_INTRADAY_AU1_SUMMARY') }}
                     GROUP BY EmployeeNumber, DATE, HOUR,
                           OfficeCode
                   ) bvstg_intraday_au1_summary
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
                ON (bvstg_intraday_au1_summary.EmployeeNumber = ds_agent_key.EmployeeNumber AND ds_agent_key.RANK_EMPLOYEENUMBER = 1 AND bvstg_intraday_au1_summary.EmployeeNumber != '-1')
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON IFNULL(bvstg_intraday_au1_summary.OfficeCode, ds_agent_key.OfficeCode) = ds_retail_office.OfficeCode
             GROUP BY bvstg_intraday_au1_summary.DATE,
                      bvstg_intraday_au1_summary.HOUR,
                      IFNULL(bvstg_intraday_au1_summary.EmployeeNumber, ''),
                      ds_retail_office.OfficeCode
            HAVING (SUM(bvstg_intraday_au1_summary.Sales) + SUM(bvstg_intraday_au1_summary.TransfersReceived) + SUM(bvstg_intraday_au1_summary.TransfersMade) + SUM(bvstg_intraday_au1_summary.WebTransfersReceived) + SUM(bvstg_intraday_au1_summary.CallTransfersReceived) + SUM(bvstg_intraday_au1_summary.Quotes) + SUM(bvstg_intraday_au1_summary.Inbound) + SUM(bvstg_intraday_au1_summary.Outbound) + SUM(bvstg_intraday_au1_summary.Edorsement) + SUM(bvstg_intraday_au1_summary.Monthly_Payment) + SUM(bvstg_intraday_au1_summary.Ancillary) + SUM(bvstg_intraday_au1_summary.Reinstatements) + SUM(bvstg_intraday_au1_summary.Fee_Amt) + SUM(bvstg_intraday_au1_summary.Ancillary_Amt) + SUM(bvstg_intraday_au1_summary.QC_Errors) + SUM(bvstg_intraday_au1_summary.Cancellation_90Days) + SUM(bvstg_intraday_au1_summary.LOGGEDONTIME) + SUM(bvstg_intraday_au1_summary.NOTREADYTIME) + SUM(bvstg_intraday_au1_summary.Total_Primary_Fee)) != 0
        name: SRC_bvstg_intraday_summary_daily
        noLinkRefs: []
