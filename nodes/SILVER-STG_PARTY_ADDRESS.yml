    sourceMapping:
    - aliases:
        WRK_PARTY_ADDR_MAIL: 4ea69f5b-2533-5dae-89aa-8f002079ce68
        ADDRESS: 90cc3016-dd03-5a43-885f-e199d834b092
        PARTY: 3a625579-b31e-596c-b22c-35345677b3b7
      customSQL:
        customSQL: ""
      dependencies:
        - locationName: GOLD
          nodeName: WRK_PARTY_ADDR_MAIL
        - locationName: GOLD
          nodeName: ADDRESS
        - locationName: GOLD
          nodeName: PARTY
      join:
        joinCondition: |-
          FROM (
          Select
          JOURNAL_TYPE,
          JOURNAL_BEGIN_DATE,
          JOURNAL_END_DATE,
          Company_Code as Company_Code,
          Address_Type_Code as Address_Type_Code,
          Address_Line_1_Txt as Address_Line_1_txt,
          Address_Line_2_Txt as Address_Line_2_txt,
          City_Code as City_Code,
          State_Code as State_Code,
          Postal_Code as Postal_Code,
          Cast( 0 as integer) as Area_Code,
          cast( 0 as integer) as Phone_Num,
          Country_Code as Country_Code,
          PARTY_NAME AS PARTY_NAME,
          PARTY_TYPE_CODE AS PARTY_TYPE_CODE,
          CUSTOMER_ACCOUNT_NUM AS CUSTOMER_ACCOUNT_NUM,
          Customer_Account_Char AS Customer_Account_Char
          From {{ ref('GOLD', 'WRK_PARTY_ADDR_MAIL') }} "Union"
          
          Select 
          JOURNAL_TYPE,
          JOURNAL_BEGIN_DATE,
          JOURNAL_END_DATE,
          Company_Code,
          Address_Type_Code,
          Email_Address,
          ', ',',',0,0,'',
          PARTY_NAME,
          PARTY_TYPE_CODE,
          CUSTOMER_ACCOUNT_NUM,
          CUSTOMER_ACCOUNT_CHAR
          From "DOUG_POC"."DP001"."WRK_PARTY_ADDR_EMAIL"
          
          UNION
          
          Select
          JOURNAL_TYPE,
          JOURNAL_BEGIN_DATE,
          JOURNAL_END_DATE,
          Company_Code,
          Address_Type_Code, 
          ',',',','',
          Area_Code,
          Phone_Num, '',
          PARTY_NAME,
          PARTY_TYPE_CODE,
          CUSTOMER_ACCOUNT_NUM,
          Customer_Account_Char
          From "DOUG_POC"."DP001"."WRK_PARTY_ADDR_TELEPHONE"
          
          UNION
          
          Select
          JOURNAL_TYPE,
          JOURNAL_BEGIN_DATE,
          JOURNAL_END_DATE,
          Company_Code,
          Address_Type_Code, 
          ',',',','',
          Area_Code,
          Phone_Num, '',
          PARTY_NAME,
          PARTY_TYPE_CODE,
          CUSTOMER_ACCOUNT_NUM,
          Customer_Account_Char
          From "DOUG_POC"."DP001"."WRK_PARTY_ADDR_FAX"
          ) as TempTable
          
          INNER JOIN {{ ref('GOLD', 'ADDRESS') }} "ADDRESS"
          ON   UPPER(ADDRESS.Company_Code) =  UPPER(TempTable.Company_Code)
          AND  UPPER(ADDRESS.Address_Type_Code) =  UPPER(TempTable.Address_Type_Code)
          AND  UPPER(ADDRESS.Address_Text_1)  =  UPPER(TempTable.Address_Line_1_txt)
          AND  UPPER(ADDRESS.Address_Text_2)  =  UPPER(TempTable.Address_Line_2_txt)
          AND  UPPER(ADDRESS.City_Code) =  UPPER(TempTable.City_Code)
          AND  UPPER(ADDRESS.State_Code) =  UPPER(TempTable.State_Code)
          AND  UPPER(ADDRESS.Postal_Code) =  UPPER(TempTable.Postal_Code)
          AND ADDRESS.Area_Code = TempTable.Area_Code
          AND ADDRESS.Phone_Num = TempTable.Phone_Num
          AND  UPPER(ADDRESS.Country_Code) =  UPPER(TempTable.Country_Code)
          
          INNER JOIN {{ ref('GOLD', 'PARTY') }} "PARTY"
          ON  PARTY.COMPANY_CODE = TEMPTABLE.COMPANY_CODE 
          AND PARTY.Customer_Account_Num = TEMPTABLE.Customer_Account_Num
          AND PARTY.Customer_Account_Char = TEMPTABLE.Customer_Account_Char
          AND PARTY.Party_Type_Code = TEMPTABLE.Party_Type_Code
          AND PARTY.dss_current_flag = 'Y'
      name: STG_PARTY_ADDRESS
      noLinkRefs: []
