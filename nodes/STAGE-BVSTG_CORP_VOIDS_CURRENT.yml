        dependencies:
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT a.TRANSACTIONID ,
                   a.CREATEDDATE ,
                   a.MONTH ,
                   a.YEAR ,
                   a.APPROVALSTATE ,
                   a.ISCORPORATEVOID ,
                   a.CORPORATEVOIDON ,
                   a.ISVOID_TRANSACTION ,
                   a.TID_HAS_ACTIVITY ,
                   a.ACTIVITYID ,
                   a.ACTIVITYTYPEID ,
                   a.ACTIVITYTYPENAME ,
                   a.CREATEDBYNAME ,
                   a.CLOSEDBYNAME ,
                   a.CLOSEON ,
                   a.CUSTOMERID ,
                   a.CUSTOMERFULLNAME ,
                   a.TRANSACTIONTYPE ,
                   a.MAIL_SATE ,
                   a.POLICYNUMBER ,
                   a.CARRIERNAME ,
                   a.NAMECREATEDBY ,
                   a.ORGANIZATIONCODE ,
                   a.OFFICECODE ,
                   a.PRIMARYFEE ,
                   a.EXPECTEDPAYMENT ,
                   a.EXPORTEDTOCOLLECTION ,
                   a.BALANCE ,
                   IFNULL(Broker_Fee.Broker_fees, 0) Broker_fees ,
                   IFNULL(Reverse_fee.Reverse_fees, 0) Reverse_fees ,
                   IFF(OSB_voided.ISVOID_PAYMENT, 1, 0) Is_OSB_Void ,
                   IFNULL(OSB_Total.OSB, 0) OSB ,
                   IFNULL(HouseCredit_total.HouseCredit, 0) HouseCredit ,
                   IFNULL(Insured_refund.REFUND_FROM_INSURACE, 0) REFUND_FROM_INSURACE ,
                   a.OFFICENAME OFFICENAME ,
                   a.CARRIERPREMIUM CARRIERPREMIUM ,
                   IFNULL(Fee_waiver_total.Fee_waiver, 0) Fee_waiver ,
                   IFNULL(Bill_to_Insured_Total.Bill_to_Insured, 0) Bill_to_Insured ,
                   IFF(DirectPayment_Void.is_DirectPayment_Void, 1, 0) is_DirectPayment_Void ,
                   IFNULL(Direct_Payment_total.Direct_Payment, 0) Direct_Payment ,
                   IFNULL(On_Account_total.On_Account, 0) On_Account ,
                   IFNULL(Charge_Back_Debit_total.Charge_Back_Debit, 0) Charge_Back_Debit ,
                   IFNULL(Hold_Credit_Card_Total.Hold_Credit_Card, 0) Hold_Credit_Card ,
                   IFNULL(Check_Request_Total.Check_Request, 0) Check_Request ,
                   IFNULL(Credit_Cards_Total.Credit_Cards, 0) Credit_Cards ,
                   IFNULL(All_Payment.All_payments, 0) All_payments ,
                   pd.Credit_Card ,
                   pd.Cash ,
                   pd.Ezbuy_CC ,
                   pd.Money_Order ,
                   pd.Verified_Credit_Card ,
                   pd.Charge_Back_Credit ,
                   pd.Check_ ,
                   pd.External_Terminal_CC
              FROM ( SELECT DS_AP1_TRANSACTIONSUMMARY.TRANSACTIONID TRANSACTIONID ,
                   DS_AP1_TRANSACTIONSUMMARY.CREATED::DATE CreatedDate ,
                   MONTH(DS_AP1_TRANSACTIONSUMMARY.CREATED)
             MONTH ,
                   YEAR(DS_AP1_TRANSACTIONSUMMARY.CREATED) YEAR ,
                   DS_AP1_TRANSACTIONSUMMARY.APPROVALSTATE ApprovalState ,
                   DS_AP1_TRANSACTIONSUMMARY.ISCORPORATEVOID ,
                   DATE(DS_AP1_TRANSACTIONSUMMARY.CORPORATEVOIDON) CORPORATEVOIDON ,
                   IFF(DS_AP1_TRANSACTIONSUMMARY.isvoid, 1, 0) isVoid_Transaction ,
                   CASE WHEN act.ACTIVITYID IS NOT NULL THEN 1
                        ELSE 0
                         END TID_has_Activity ,
                   act.ACTIVITYID ActivityID ,
                   act.ACTIVITYTYPEID ActivityTypeID ,
                   act.ACTIVITYTYPENAME ActivityTypeName ,
                   INITCAP(DS_AGENT_KEY_CREATED.EMPLOYEENAME) CreatedByName ,
                   INITCAP(DS_AGENT_KEY_CLOSED.EMPLOYEENAME) ClosedByName ,
                   act.CLOSEDON CloseOn ,
                   DS_AP1_TRANSACTIONSUMMARY.CUSTOMERID CustomerID ,
                   DS_BVSTG_AP1_CUSTOMER.FULLNAME CustomerFullName ,
                   DS_AP1_TRANSACTIONSUMMARY.TRANSACTIONTYPE TransactionType ,
                   DS_BVSTG_AP1_CUSTOMER.MAILINGSTATE Mail_Sate ,
                   DS_AP1_TRANSACTIONSUMMARY.POLICYNUMBER PolicyNumber ,
                   DS_AP1_TRANSACTIONSUMMARY.CARRIERNAME CarrierName ,
                   DS_AP1_TRANSACTIONSUMMARY.PRIMARYAGENTFULLNAME NameCreatedBy ,
                   DS_AP1_TRANSACTIONSUMMARY.ORGANIZATIONCODE OrganizationCode ,
                   DS_AP1_TRANSACTIONSUMMARY.TRANSACTIONOFFICECODE OfficeCode ,
                   DS_AP1_TRANSACTIONSUMMARY.primaryagentofficename OfficeName ,
                   IFNULL(DS_AP1_TRANSACTIONSUMMARY.CARRIERPREMIUM, 0) CARRIERPREMIUM ,
                   IFNULL(DS_AP1_TRANSACTIONSUMMARY.PRIMARYFEE, 0) PRIMARYFEE ,
                   IFNULL(DS_AP1_TRANSACTIONSUMMARY.EXPECTEDPAYMENT, 0) EXPECTEDPAYMENT ,
                   IFNULL(DS_AP1_TRANSACTIONSUMMARY.EXPORTEDTOCOLLECTION, 0) EXPORTEDTOCOLLECTION ,
                   (IFNULL(DS_AP1_TRANSACTIONSUMMARY.TOTALDUE, 0) - IFNULL(DS_AP1_TRANSACTIONSUMMARY.TOTALRECEIVED, 0)) Balance
              FROM RETAIL_PROD.SCH_EDW.DS_AP1_TRANSACTIONSUMMARY DS_AP1_TRANSACTIONSUMMARY
              LEFT JOIN (SELECT act.TRANSACTIONID,
                   act.ACTIVITYID,
                   act.ACTIVITYTYPEID,
                   act.ACTIVITYTYPENAME,
                   act.description,
                   act.createdby,
                   act.closedby,
                   act.CLOSEDON
              FROM RETAIL_PROD.SCH_BVSTAGE.DS_BVSTG_AP1_ACTIVITY_2STEP act
             WHERE act.ACTIVITYTYPENAME LIKE 'Corporate Voids%' QUALI
