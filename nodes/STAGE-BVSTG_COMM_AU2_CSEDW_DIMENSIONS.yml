        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT DISTINCT Coalesce(bvstg_comm_au1_cspredw.carrier,ds_comm_summary_dashboard_extract.Carrier,ds_comm_policy_premium_dashboard_allsources.Carrier) AS carrier,
                   Coalesce(bvstg_comm_au1_cspredw.cutoffdate,ds_comm_summary_dashboard_extract.cutoffdate,ds_comm_policy_premium_dashboard_allsources.asofmonth) AS cutoffdate,
                   Coalesce(bvstg_comm_au1_cspredw.AGENCYSTATE,ds_comm_summary_dashboard_extract.storestate,ds_comm_policy_premium_dashboard_allsources.ststate) AS AGENCYSTATE,
                   Coalesce(bvstg_comm_au1_cspredw.CUSTOMERSTATE,ds_comm_summary_dashboard_extract.cstate,ds_comm_policy_premium_dashboard_allsources.custstate) AS CUSTOMERSTATE,
                   Coalesce(bvstg_comm_au1_cspredw.BRAND,ds_comm_summary_dashboard_extract.BRAND,ds_comm_policy_premium_dashboard_allsources.BRAND) AS BRAND,
                   sum(bvstg_comm_au1_cspredw.PIF_CS) AS PIF_CS,
                   sum(bvstg_comm_au1_cspredw.Premium_CS) AS Premium_CS,
                   sum(ds_comm_summary_dashboard_extract.PIF_EDW) AS PIF_EDW,
                   sum(ds_comm_policy_premium_dashboard_allsources.Reporting_Premium) AS Reporting_Premium
              FROM {{ ref('STAGE','BVSTG_COMM_AU1_CSEDW_DIMENSIONS') }} AS bvstg_comm_au1_cspredw
              FULL OUTER JOIN (SELECT asofmonth AS cutoffdate,
                   carrier,
                   ifnull(storestate,'Missing') AS storestate,
                   ifnull(CUSTOMERSTATE,'Missing') AS cstate,
                   ifnull(BRAND,'Missing') AS BRAND,
                   sum(metricvalue) AS PIF_EDW
              FROM (SELECT asofmonth,
                   metricvalue,
                   AGENCYSTATE AS storestate,
                   CUSTOMERSTATE,
                   agency AS BRAND,
                   CASE WHEN carrier = 'Infinity/Kemper'       THEN 'Infinity'
                        WHEN carrier = 'Bristol West/Foremost'THEN 'Bristol West'
                        WHEN carrier='Legacy/Nevada General'   THEN 'Legacy'
                        WHEN Carrier like 'Bluefire%'          THEN 'Bluefire'
                        ELSE carrier
                         END AS Carrier --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_SUMMARY_DASHBOARD_EXTRACT"          from {{ ref('EDW','DS_COMM_SUMMARY_DASHBOARD_EXTRACT') }}       where metric ='PIF_EOM'                   ) DS_COMM_SUMMARY_DASHBOARD_EXTRACT      where carrier in      (select distinct carrier      from {{ ref('STAGE','BVSTG_COMM_AU1_CSEDW_DIMENSIONS') }}     UNION     select distinct carrier      --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_SUMMARY_DASHBOARD_EXTRACT"     from {{ ref('EDW','DS_COMM_SUMMARY_DASHBOARD_EXTRACT') }}     where lower(carrier) like '%first%acceptance%')              group by asofmonth,carrier,     ifnull(storestate,'Missing'),ifnull(CUSTOMERSTATE,'Missing'),ifnull(BRAND,'Missing')) ds_comm_summary_dashboard_extract  on bvstg_comm_au1_cspredw.carrier=ds_comm_summary_dashboard_extract.carrier   and bvstg_comm_au1_cspredw.cutoffdate=ds_comm_summary_dashboard_extract.cutoffdate  and ifnull(bvstg_comm_au1_cspredw.AGENCYSTATE,'Missing')=ifnull(ds_comm_summary_dashboard_extract.STORESTATE,'Missing')  and ifnull(bvstg_comm_au1_cspredw.CUSTOMERSTATE,'Missing')=ifnull(ds_comm_summary_dashboard_extract.cstate,'Missing')  and ifnull(bvstg_comm_au1_cspredw.BRAND,'Missing')=ifnull(ds_comm_summary_dashboard_extract.BRAND,'Missing')    full outer join     (select asofmonth,Carrier,    ifnull(ststate,'Missing') as ststate, ifnull(custstate,'Missing') as custstate, ifnull(BRAND,'Missing') as BRAND,sum(metricvalue) as Reporting_Premium      from (select asofmonth,metricvalue,agencystate as ststate,CUSTOMERSTATE as custstate, agency as BRAND,      case when carrier = 'Infinity/Kemper' then 'Infinity'               when carrier = 'Bristol West/Foremost'then 'Bristol West'      when carrier='Legacy/Nevada General' then 'Legacy'      when Carrier like 'Bluefire%' then 'Bluefire'     else carrier end as Carrier      --from "RETAIL_PROD"."SCH_EDW"."DS_COMM_POLICY_PREMIUM_DASHBOARD_ALLSOURCES"     from {{ ref('EDW','DS_COMM_POLICY_PREMIUM_DASHBOARD_ALLSOURCES') }}     where metric='ReportingPremium'        ) DS_COMM_POLICY_PREMIUM_DASHBOARD_ALLSOURCES        where carrier in      (select distinct carrier        from {{ ref('STAGE','BVSTG_COMM_AU1_CSEDW_DIMENSIONS') }}    UNION    select distinct carrier     --from "
