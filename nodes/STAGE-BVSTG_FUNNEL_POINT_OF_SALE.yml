        dependencies:
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: STAGE
            nodeName: DS_BVSTG_AP1_CUSTOMER
          - locationName: DATA_VAULT
            nodeName: S_AMS_CUSTOMER_MROC
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: EDW
            nodeName: DS_PCCE_TERMINATION_CALL_AGENT_SESSION
        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} ds_ram_retail_repository
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_CUSTOMER') }} ds_bvstg_ap1_customer
                ON ds_ram_retail_repository.CustomerID = ds_bvstg_ap1_customer.CustomerID
               AND ds_ram_retail_repository.SourceDB = 'AppOne'
              LEFT JOIN {{ ref('DATA_VAULT','S_AMS_CUSTOMER_MROC') }} s_ams_customer_mroc
                ON ds_ram_retail_repository.CustomerID = s_ams_customer_mroc.CustID
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key
                ON ds_agent_key.EmployeeNumber = ds_ram_retail_repository.PRIMARYAGENTULTIPRO_BROKER
               AND ds_agent_key.RANK_EMPLOYEENUMBER = 1
              LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} ds_agent_key_secundary
                ON ds_agent_key.EmployeeNumber = ds_ram_retail_repository.SECONDARYAGENTULTIPRO
               AND ds_agent_key.RANK_EMPLOYEENUMBER = 1
              LEFT JOIN {{ ref('EDW','DS_PCCE_TERMINATION_CALL_AGENT_SESSION') }} ds_pcce_termination_call_agent_session
                ON ds_bvstg_ap1_customer.HomePhone = REPLACE(ds_pcce_termination_call_agent_session.ANI,'+1','')
               AND ds_pcce_termination_call_agent_session.ENDDATETIME BETWEEN dateadd(HOUR,-2,ds_ram_retail_repository.CREATEDDATE) AND dateadd(HOUR,2, ds_ram_retail_repository.CREATEDDATE)
