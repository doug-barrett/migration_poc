        dependencies:
          - locationName: EDW
            nodeName: DS_POLICYSUMMARY_V2
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
          - locationName: STAGE
            nodeName: V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT
          - locationName: EDW
            nodeName: DS_COMM_MASTER_POLICY_EXTRACT
          - locationName: STAGE
            nodeName: BVSTG_H20_LAPSE_MODEL_REFRESH
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
              LEFT JOIN (
                    SELECT DISTINCT policynumber_Edw ,
                           carriername_edw ,
                           policynumberformatted ,
                           carriername_mapped ,
                           carrierdisplayname
                      FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}
                   ) ds_bvstg_comm_policynumberformatting_allsources
                ON ds_bvstg_comm_policynumberformatting_allsources.policynumber_Edw = ds_policysummary_v2.policynumber
               AND ds_bvstg_comm_policynumberformatting_allsources.carriername_Edw = ds_policysummary_v2.carriername
              LEFT JOIN (
                    SELECT DISTINCT ds_bvstg_comm_policynumberformatting_allsources.POLICYNUMBERFORMATTED ,
                           ds_bvstg_comm_policynumberformatting_allsources.CarrierName_Mapped ,
                           ds_bvstg_comm_policynumberformatting_allsources.CARRIERDISPLAYNAME ,
                           v_dlbv_comm_carrierdatarepositorycomplete_current.actualcommission ,
                           v_dlbv_comm_carrierdatarepositorycomplete_current.actualcommissionpct
                      FROM {{ ref('STAGE','V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT') }} v_dlbv_comm_carrierdatarepositorycomplete_current
                      LEFT JOIN (
                            SELECT DISTINCT policynumber_cs ,
                                   carriername_cs ,
                                   policynumberformatted ,
                                   carriername_mapped ,
                                   carrierdisplayname
                              FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }}
                           ) ds_bvstg_comm_policynumberformatting_allsources
                        ON ds_bvstg_comm_policynumberformatting_allsources.policynumber_cs = v_dlbv_comm_carrierdatarepositorycomplete_current.policynumber
                       AND ds_bvstg_comm_policynumberformatting_allsources.carriername_cs = v_dlbv_comm_carrierdatarepositorycomplete_current.carrier
                     WHERE isdeleted = 'False'
                       AND isduplicate = 'False' QUALIFY ROW_NUMBER() OVER (PARTITION BY policynumberformatted ,carriername_mapped ORDER BY executionmonth ,dss_update_time ,dss_create_time ,carrierdatarepositorycompleteid) = 1
                   ) v_dlbv_comm_carrierdatarepositorycomplete_current
                ON v_dlbv_comm_carrierdatarepositorycomplete_current.policynumberformatted = ds_bvstg_comm_policynumberformatting_allsources.policynumberformatted
               AND v_dlbv_comm_carrierdatarepositorycomplete_current.carriername_mapped = ds_bvstg_comm_policynumberformatting_allsources.carriername_mapped
              LEFT JOIN {{ ref('EDW','DS_COMM_MASTER_POLICY_EXTRACT') }} ds_comm_master_policy_extract
                ON ds_comm_master_policy_extract.policynumberformatted = v_dlbv_comm_carrierdatarepositorycomplete_current.POLICYNUMBERFORMATTED
               AND ds_comm_master_policy_extract.carrier = v_dlbv_comm_carrierdatarepositorycomplete_current.CarrierName_Mapped
             INNER JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','BVSTG_H20_LAPSE_MODEL_REFRESH') }} bvstg_h20_lapse_model_refresh QUALIFY ROW_NUMBER() OVER (PARTITION BY policynumber ORDER BY row_number ASC) = 1
                   ) bvstg_h20_lapse_model_refresh
                ON ds_policysummary_v2.policyid = bvstg_h20_lapse_model_refresh.policyid
               AND ds_policysummary_v2.SourceDB = bvstg_h20_lapse_model_refresh.SourceDB
             WHERE ds_comm_master_policy_extract.source IN ('AppOne' ,'CIGH')
        name: BVSTG_H20_AU1_CDRC_7DAYS
        noLinkRefs: []
