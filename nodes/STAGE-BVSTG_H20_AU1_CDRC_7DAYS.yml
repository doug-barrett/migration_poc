    sourceMapping:
      - aliases:
          DS_POLICYSUMMARY_V2: 23ba684a-5671-4cfa-9e5f-11f1386d24b3
          DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES: 62e4c62e-c5fa-4abb-8a26-a5acaccb175b
