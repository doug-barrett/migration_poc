            nodeName: BVSTG_COMM_AU4_POLICY_PREMIUM_DASHBOARD_ALLSOURCES
          - locationName: STAGE
            nodeName: V_PRED_MONTHS
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT bvstg_comm_au4_policy_premium_dashboard_allsources_1.*,
                   bvstg_comm_au4_policy_premium_dashboard_allsources_2.METRICVALUE,
                   bvstg_comm_au4_policy_premium_dashboard_allsources_2.METRICVALUE_ACTUAL ,
                   bvstg_comm_au4_policy_premium_dashboard_allsources_2.METRICVALUE_ESTIMATED,
                   bvstg_comm_au4_policy_premium_dashboard_allsources_2.ISESTIMATED,
                   bvstg_comm_au4_policy_premium_dashboard_allsources_2.PIF_EOM,
                   bvstg_comm_au4_policy_premium_dashboard_allsources_2.WP_POLICYCOUNT,
                   SUM(ifnull(METRICVALUE,0)) OVER (PARTITION BY bvstg_comm_au4_policy_premium_dashboard_allsources_1.carrier,bvstg_comm_au4_policy_premium_dashboard_allsources_1.term, bvstg_comm_au4_policy_premium_dashboard_allsources_1.policysource,bvstg_comm_au4_policy_premium_dashboard_allsources_1.customer_type, bvstg_comm_au4_policy_premium_dashboard_allsources_1.agency,bvstg_comm_au4_policy_premium_dashboard_allsources_1.agencystate, bvstg_comm_au4_policy_premium_dashboard_allsources_1.leadtype,bvstg_comm_au4_policy_premium_dashboard_allsources_1.lineofbusiness, bvstg_comm_au4_policy_premium_dashboard_allsources_1.paidtype,bvstg_comm_au4_policy_premium_dashboard_allsources_1.nbs_rwl_policy_flag, bvstg_comm_au4_policy_premium_dashboard_allsources_1.customerstate,bvstg_comm_au4_policy_premium_dashboard_allsources_1.isOnlineBinding, bvstg_comm_au4_policy_premium_dashboard_allsources_1.isFranchise,bvstg_comm_au4_policy_premium_dashboard_allsources_1.TerritoryManagerName, bvstg_comm_au4_policy_premium_dashboard_allsources_1.ISLEGACYTRANSACTION, bvstg_comm_au4_policy_premium_dashboard_allsources_1.Metric ORDER BY bvstg_comm_au4_policy_premium_dashboard_allsources_1.ASOFMONTH ROWS BETWEEN 11 PRECEDING AND CURRENT ROW) AS TTM
              FROM(
                    SELECT a.*,
                           cutoffdate asofmonth
                      FROM(
                            SELECT DISTINCT carrier,
                                   term,
                                   policysource,
                                   customer_type,
                                   agency,
                                   agencystate,
                                   leadtype,
                                   lineofbusiness,
                                   paidtype,
                                   nbs_rwl_policy_flag,
                                   customerstate,
                                   isOnlineBinding,
                                   isFranchise ,
                                   TerritoryManagerName,
                                   metric,
                                   min(asofmonth) min_asofmonth,
                                   ISLEGACYTRANSACTION
                              FROM {{ ref('STAGE','BVSTG_COMM_AU4_POLICY_PREMIUM_DASHBOARD_ALLSOURCES') }}
                             GROUP BY carrier,
                                      term,
                                      policysource,
                                      customer_type,
                                      agency,
                                      agencystate,
                                      leadtype,
                                      lineofbusiness,
                                      paidtype,
                                      nbs_rwl_policy_flag,
                                      customerstate,
                                      isOnlineBinding,
                                      isFranchise ,
                                      TerritoryManagerName,
                                      ISLEGACYTRANSACTION,
                                      metric
                           ) a
                     CROSS JOIN (
                            SELECT DISTINCT to_date(min_date) AS cutoffdate
                              FROM {{ ref('STAGE','V_PRED_MONTHS') }}
                             WHERE min_date >= '2019-01-01'
                               AND min_date <= (
                                    SELECT max(asofmonth)
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU4_POLICY_PREMIUM_DASHBOARD_ALLSOURCES') }}
                                   )
                           ) b
                   ) bvstg_comm_au4_policy_premium_dashboard_allsources_1
              LEFT JOIN {{ ref('STAGE','BVSTG_COMM_AU4_POLICY_PREMIUM_DASHBOARD_ALLSOURCES') }} bvstg_comm_au4_policy_premium_dashboard_allsources_2
                ON bvstg_comm_au4_policy_premium_dashboard_allsources_1.carrier = bvstg_comm_au4_policy_premium_dashboard_allsources_2.carrier
               AND bvstg_comm_au4_policy_premium_dashboard_allsources_1.term = bvstg_comm_au4_policy_premium_dashboard_allsources_2.term
               AND bvstg_comm_au4_policy_premium_dashboard_allsources_1.policysource = bvstg_comm_au4_policy_premium_dashboard_allsources_2.policysource
               AND bvstg_comm_au4_policy_premium_dashboard_allsources_1.customer_type = bvstg_comm_au4_policy_premium_dashboard_allsources_2.customer_type
               AND bvstg_comm_au4_policy_premium_dashboard_allsources_1.agency = bvstg_comm_au4_policy_premium_dashboard_allsources_2.agency
               AND bvstg_comm_au4_policy_premium_dashboard_allsources_1.agencystate = bvstg_comm_au4_policy_premium_dashboard_allsources_2.agencystate
               AND bvstg_comm_au4_policy_premium_dashboard_allsources_1.leadtype = bvstg_comm_au4_policy_premium_dashboard_allsources_2.leadtype
               AND
        name: BVSTG_COMM_POLICY_PREMIUM_DASHBOARD_ALLSOURCES
        noLinkRefs: []
