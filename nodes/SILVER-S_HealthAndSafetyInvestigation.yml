        stepCounter: bf61b871-a9b6-5002-8428-596c80b50f07
      config: {}
      dataType: NUMBER(38,0)
      description: Number of Investigations not completed on time or if not yet completed
        are already past their target date. Investigations without targets are not
        counted.
      name: OverdueInvestigationCount
