      config: {}
      dataType: NUMBER(38,0)
      description: Number of currently open Investigations as recorded in the NPSafe
        database. Open Investigations are linked to the current period and date dimensions.
      name: OpenInvestigationCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN I_HEALTHANDSAFETYINVESTIGATION.CLOSEDDATE IS NULL   --NPSAFE
          DOES NOT USE THE CANSTARTDATE   -- AND I_HEALTHANDSAFETYINVESTIGATION.CANSTARTDATE
          IS NOT NULL   -- AND I_HEALTHANDSAFETYINVESTIGATION.CANSTARTDATE < CURRENT_TIMESTAMP()   THEN
          1 ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: 40c4481c-0d9a-5fba-b1a0-8a003e1176d3
        stepCounter: bf61b871-a9b6-5002-8428-596c80b50f07
      config: {}
      dataType: NUMBER(38,0)
      description: Number of closed Investigations as recorded in the NPSafe database.
        Closed Investigations are linked to the period and date dimensions based on
        the closed date.
      name: ClosedInvestigationCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   WHEN I_HEALTHANDSAFETYINVESTIGATION.CLOSEDDATE IS NOT NULL   THEN
          1 ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
        columnCounter: ad9af46b-7e1f-5b0b-b31a-9b1775e51826
        stepCounter: bf61b871-a9b6-5002-8428-596c80b50f07
      config: {}
      dataType: NUMBER(38,0)
      description: Number of Investigations completed on time or if not yet completed
        are not past their target date. Investigations without targets are not counted.
      name: OnTimeInvestigationCount
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   --NO TARGET   WHEN I_HEALTHANDSAFETYINVESTIGATION.TARGETDATE
          IS NULL THEN 0   --OPEN BUT NOT DUE YET   WHEN I_HEALTHANDSAFETYINVESTIGATION.CLOSEDDATE
          IS NULL    AND I_HEALTHANDSAFETYINVESTIGATION.TARGETDATE >= CAST(CURRENT_TIMESTAMP()
          AS DATE) THEN 1   --CLOSED ON OR BEFORE DUE DATE   WHEN I_HEALTHANDSAFETYINVESTIGATION.CLOSEDDATE
          IS NOT NULL    AND I_HEALTHANDSAFETYINVESTIGATION.TARGETDATE >= I_HEALTHANDSAFETYINVESTIGATION.CLOSEDDATE
          THEN 1  ELSE 0 END
    - appliedColumnTests: {}
      columnReference:
