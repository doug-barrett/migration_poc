        transform: "CASE WHEN \"CV_MODEL_FIN_ORGANIZATION\".\"DISTRICT\" between '090' and '099' THEN  'OVERHEAD AND OTHER' /*Region and District Offices */\n\n                 WHEN \"CV_MODEL_FIN_ORGANIZATION\".\"DISTRICT\" between '290' and '299' THEN  'OVERHEAD AND OTHER' /*Region and District Offices */\n\n                 WHEN \"CV_MODEL_FIN_ORGANIZATION\".\"REGION\" in ('099','299') THEN  'OVERHEAD AND OTHER' /* Corporate Offices*/\n\n                 WHEN \"CV_MODEL_FIN_ORGANIZATION\".\"REGION\" > '299' THEN  'OVERHEAD AND OTHER' /* Other Regions - Foreign and Inactive*/\n\n                 WHEN \"CV_MODEL_FIN_ORGANIZATION\".\"ACCT_UNIT\" between '7000' and '7999' THEN  'OVERHEAD AND OTHER' /* Adjustment Nodes */\n\n                 WHEN \"CV_MODEL_FIN_ORGANIZATION\".\"CLOSED_DATE\" <> 0 THEN 'OVERHEAD AND OTHER' /* Inactive locations not moved to Reg 99 */\n\n\n\n       /* Since one of the big re-alignments we separated specialty regions to like = like */\n\n\n\n                \
          \ WHEN REGION  in ('007','207') THEN 'Power & HVAC'\n\n                 WHEN REGION in ('004','204')  THEN 'TRENCH'\n\n                 WHEN REGION  in ('012','212') THEN 'PUMP'\n\n       /* Set up so the logic ends with all else */\n\n                 ELSE 'AERIAL & GENERAL'\n\n           END"
