          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: STAGE
            nodeName: V_DLBV_CPS_EMPLOYEESUPN_CURRENT
          - locationName: UNKNOWN
            nodeName: V_PREB_CANCEL_PENDING_BLENDED_CALLS
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_AU1_CANCEL_PENDING') }} bvstg_au1_cancel_pending
              LEFT JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2
                ON bvstg_au1_cancel_pending.PolicyID = ds_policysummary_v2.PolicyID
               AND bvstg_au1_cancel_pending.SourceDB = ds_policysummary_v2.SourceDB
               AND ds_policysummary_v2.EndDate IS NULL
               AND ds_policysummary_v2.STATUS_STANDARD != 'Inactive'
              LEFT JOIN {{ ref('EDW','DS_POLICYSUMMARY_V2') }} ds_policysummary_v2_c
                ON ds_policysummary_v2_c.CustomerID = bvstg_au1_cancel_pending.CustomerID
               AND ds_policysummary_v2_c.PolicyID != bvstg_au1_cancel_pending.PolicyID
               AND ds_policysummary_v2_c.SourceDB = bvstg_au1_cancel_pending.SourceDB
               AND ds_policysummary_v2_c.POLICYSTATUS IN('Active','Reinstated')
               AND ds_policysummary_v2_c.STATUS_STANDARD != 'Inactive'
               AND ds_policysummary_v2_c.ISLEGACYTRANSACTION IN('Native','Other')
               AND ds_policysummary_v2_c.BIAPRIMARYAGENTOFFICE != 'JOR'
               AND ds_policysummary_v2_c.PRODUCERID != 'TEST'
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ds_retail_office.OfficeCode = bvstg_au1_cancel_pending.Primary_Agent_Office
              LEFT JOIN {{ ref('STAGE','V_DLBV_CPS_EMPLOYEESUPN_CURRENT') }} v_dlbv_cps_employeesupn_current
                ON bvstg_au1_cancel_pending.ProducerID = v_dlbv_cps_employeesupn_current.EmployeeNumber
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_CANCEL_PENDING_BLENDED_CALLS') }} v_preb_cancel_pending_blended_calls
                ON v_preb_cancel_pending_blended_calls.id = bvstg_au1_cancel_pending.id QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_au1_cancel_pending.id ORDER BY IFNULL(ds_policysummary_v2.LAST_BIA_STATUSDATE,ds_policysummary_v2.BIA_STATUSDATE) DESC ,IFNULL(ds_policysummary_v2_c.LAST_BIA_STATUSDATE,ds_policysummary_v2_c.BIA_STATUSDATE) DESC ,v_dlbv_cps_employeesupn_current.DSS_CREATE_TIME DESC)=1
