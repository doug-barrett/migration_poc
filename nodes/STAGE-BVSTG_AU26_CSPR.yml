    sourceMapping:
      - aliases:
          BVSTG_AU11_CSPR: 6d1e6adc-c29e-440b-93de-16afcc326fe4
          BVSTG_AU19_CSPR: a69d53a8-08cd-4b14-806d-dce28ba6bb48
          BVSTG_AU13_CSPR: fc77d8ce-b627-4c1f-a073-c105e416a343
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_AU11_CSPR
          - locationName: STAGE
            nodeName: BVSTG_AU19_CSPR
          - locationName: STAGE
            nodeName: BVSTG_AU13_CSPR
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT bvstg_au25_cspr.*,
                   bvstg_au11_cspr.Child_Accounts,
                   bvstg_au11_cspr.ACCOUNTS_MAPPED,
                   bvstg_au11_cspr.VALUES_MONTH,
                   CASE WHEN OFFICECODE_OLD IN ('_TX_','_IL_','_CA_') THEN ROW_NUMBER() over(PARTITION BY ASOFMONTH,officecode_old ORDER BY asofmonth)
                        ELSE ROW_NUMBER() over(PARTITION BY ASOFMONTH,officecode ORDER BY asofmonth)
                         END row_num
              FROM (SELECT OFFICECODES_MAPPED,
                   max(IS_OS_OFFICECODE) IS_OS_OFFICECODE,
                   monthyear,
                   ACCOUNTID_DESCRIPTION Child_Accounts,
                   CASE WHEN ACCOUNTS_MAPPED IN ('Compensation','Advertising','Commissions') THEN concat(ACCOUNTS_MAPPED,' OneStream')
                        WHEN ACCOUNTS_MAPPED='Ancillary Product Revenue'                     THEN 'Ancillary Revenue'
                        WHEN ACCOUNTS_MAPPED='Occupancy Utils. Maint. Security'              THEN 'Occupancy, Utils., Maint. & Security'
                        WHEN ACCOUNTS_MAPPED='Commission/Policy Issuance Costs'              THEN 'Commission / Policy Issuance Costs'
                        WHEN ACCOUNTS_MAPPED='Postage Printing Supplies'                     THEN 'Postage, Printing & Supplies'
                        ELSE ACCOUNTS_MAPPED
                         END ACCOUNTS_MAPPED,
                   sum(values_month) values_month
              FROM (SELECT OFFICECODES_MAPPED,
                   ud2id,
                   CASE WHEN ud2id IS NULL THEN 0
                        ELSE 1
                         END IS_OS_OFFICECODE,
                   monthyear,
                   replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(ACCOUNTID_DESCRIPTION,'  ',' '),'.',''),', ','_'),',','_'),'/','_'),'(',''),')',''), ' - ','_'),' & ','_'),'&','_'),'-','_'),' ','_') AS ACCOUNTID_DESCRIPTION,
                   replace(replace(Accounts_Mapped,'_',' '),'&',' & ') Accounts_Mapped,
                   CASE WHEN month(monthyear) <> 1 THEN values_month - lag(values_month) OVER (PARTITION BY officecodes_Mapped, ud2id, Accounts_Mapped, ACCOUNTID_DESCRIPTION ORDER BY monthyear)
                        ELSE values_month
                         END AS values_month
              FROM (SELECT DISTINCT OFFICECODES_MAPPED,
                   ud2id,
                   ACCOUNTID_DESCRIPTION,
                   date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear,
                   accounts_mapped,
                   ifnull(sum(values_month),0) values_month
              FROM (
                    SELECT bvstg_au11_cspr.UD2ID,
                           bvstg_au19_cspr.officecodes_mapped,
                           yearid,
                           accountid,
                           bvstg_au11_cspr.ACCOUNTID_DESCRIPTION,
                           CASE WHEN accountid IN ('2603','2604','2605','2606','2607','2608') THEN 'Advertising_OS'
                                ELSE bvstg_au13_cspr.accounts_mapped
                                 END AS accounts_mapped,

                     MONTH,
                           codes,
                           sum(ifnull(values_month,0)) AS Values_Month
                      FROM {{ ref('STAGE','BVSTG_AU11_CSPR') }} bvstg_au11_cspr UNPIVOT (values_month FOR MONTH IN (M1VALUE, M2VALUE, M3VALUE, M4VALUE, M5VALUE, M6VALUE, M7VALUE, M8VALUE, M9VALUE, M10VALUE, M11VALUE, M12VALUE))
                      LEFT JOIN (
                            SELECT DISTINCT ud2id,
                                   officecodes_mapped
                              FROM {{ ref('STAGE','BVSTG_AU19_CSPR') }}
                           ) bvstg_au19_cspr
                        ON bvstg_au11_cspr.ud2id=bvstg_au19_cspr.ud2id
                      LEFT JOIN (
                            SELECT DISTINCT childid,
                                   accounts_mapped
                              FROM {{ ref('STAGE','BVSTG_AU13_CSPR') }}
                           ) bvstg_au13_cspr
                        ON bvstg_au11_cspr.accountid=bvstg_au13_cspr.childid
                      LEFT JOIN "DATA_LAKE"."BIA_ANALYTICS"."ACCOUNTID_CODES" accountid_codes
                        ON bvstg_au13_cspr.accounts_mapped= accountid_codes.accounts_mapped
                     GROUP BY bvstg_au11_cspr.UD2ID,
                              yearid,
                              accountid,

                        MONTH,
                              bvstg_au11_cspr.ACCOUNTID_DESCRIPTION,
                              bvstg_au19_cspr.officecodes_mapped,
                              CASE WHEN accountid IN ('2603','2604','2605','2606','2607','2608') THEN 'Advertising_OS'
                                   ELSE bvstg_au13_cspr.accounts_mapped
                                    END,
                              codes
                   )
             WHERE ud2id IN (
                    SELECT DISTINCT ud2id
                      FROM {{ ref('STAGE','BVSTG_AU19_CSPR') }}
                   )
               AND accountid IN (
                    SELECT DISTINCT childid
                      FROM {{ ref('STAGE','BVSTG_AU13_CSPR') }}
                   )
               AND monthyear <= dateadd('day',-1,date_trunc('month',CURRENT_DATE))
             GROUP BY OFFICECODES_MAPPED,
                      ud2id,
                      ACCOUNTID_DESCRIPTION,
                      accounts_mapped,
                      date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
        name: BVSTG_AU26_CSPR
        noLinkRefs: []
