          \    LEFT OUTER JOIN [DBIFAMV]  DBIFAMV_7\n    ON   DBIFGLN.OBJ_ID = DBIFAMV_7.OBJ_ID\n\
          \    AND DBIFAMV_7.MATRIX_CAT = 'CREDIT'\n    LEFT OUTER JOIN [DBIFAMV]\
          \  DBIFAMV_8\n    ON   DBIFGLN.OBJ_ID = DBIFAMV_8.OBJ_ID\n    AND DBIFAMV_8.MATRIX_CAT\
          \ = 'STO-MERGED/W'\n    LEFT OUTER JOIN [DBIFAMV]  DBIFAMV_9\n    ON   DBIFGLN.OBJ_ID\
