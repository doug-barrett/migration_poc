          \ = DBIFAMV_3.OBJ_ID\n    AND DBIFAMV_3.MATRIX_CAT = 'STORE-CLOSED'\n  \
          \  LEFT OUTER JOIN [DBIFAMV]  DBIFAMV_4\n    ON   DBIFGLN.OBJ_ID = DBIFAMV_4.OBJ_ID\n\
          \    AND DBIFAMV_4.MATRIX_CAT = 'BENCHMARK'\n    LEFT OUTER JOIN [DBIFAMV]\
          \  DBIFAMV_5\n    ON   DBIFGLN.OBJ_ID = DBIFAMV_5.OBJ_ID\n    AND DBIFAMV_5.MATRIX_CAT\
          \ = 'CD-HUB'\n    LEFT OUTER JOIN [DBIFAMV]  DBIFAMV_6\n    ON   DBIFGLN.OBJ_ID\
          \ = DBIFAMV_6.OBJ_ID\n    AND DBIFAMV_6.MATRIX_CAT = 'UR_TERRITORY'\n  \
