          - locationName: UNKNOWN
            nodeName: V_PREB_C2S_GROUP_LEAD
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_MKT_C2S_DETAIL') }} ds_mkt_c2s_detail
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_LMS_MASTERLEAD_CURRENT V_DLBV_API_LMS_MASTERLEAD_CURRENT
                ON V_DLBV_API_LMS_MASTERLEAD_CURRENT.LMS_LEAD_ID = ds_mkt_c2s_detail.LMS_LEAD_ID
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_C2S_GROUP_LEAD') }} V_PREB_C2S_GROUP_LEAD
                ON ds_mkt_c2s_detail.LMS_LEAD_ID = V_PREB_C2S_GROUP_LEAD.G_LMS_LEAD_ID
               AND V_PREB_C2S_GROUP_LEAD.RANK_LMS = 1
              LEFT JOIN RETAIL_PROD.SCH_EDW.DS_MKT_CAMPAIGN DS_MKT_CAMPAIGN
                ON IFNULL(v_preb_c2s_group_lead.G_CAMPAIGN_ID,ds_mkt_c2s_detail.CAMPAIGN_ID) = DS_MKT_CAMPAIGN.CAMPAIGNID
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_S_MKT_BROADCAST_CALENDAR_CURRENT V_S_MKT_BROADCAST_CALENDAR_CURRENT
                ON V_S_MKT_BROADCAST_CALENDAR_CURRENT.DATE = DATE(ds_mkt_c2s_detail.lead_created_at)
             WHERE V_PREB_C2S_GROUP_LEAD.G_LMS_LEAD_ID IS NULL
               AND ds_mkt_c2s_detail.LMS_LEAD_ID IS NOT NULL
               AND (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND DATEDIFF(DAY,V_DLBV_API_LMS_MASTERLEAD_CURRENT.lead_created_at,CURRENT_DATE()) <= '{{ parameters.HWM_BVSTG_Mkt_Refresh_Days }}'))
