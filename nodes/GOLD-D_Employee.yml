      config: {}
      dataType: VARCHAR(30)
      description: Age grouping based on 5 year spans
      name: AgeGroup5Year
      nullable: false
      sourceColumnReferences:
      - columnReferences: []
        transform: --THERE IS A LITTLE ERROR USING THE MONTH "calculation" (BUT BETTER
          THAN THE YEAR "calculation")  -- SO I HAVE MADE IT SO THAT PEOPLE DON'T
          GO UP INTO THE NEXT AGE BRACKET UNTIL THE  -- END OF THE MONTH OF THEIR
          BIRTHDAY.  CASE   WHEN "I_PG_EMPLOYEE"."BIRTHDATE" IS NULL THEN 'UNKNOWN'   WHEN
          DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP()) <= 240 THEN
          '< 20'   WHEN DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP())
          <= 300 THEN '20 - 24'   WHEN DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP())
          <= 360 THEN '25 - 29'   WHEN DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP())
          <= 420 THEN '30 - 34'   WHEN DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP())
          <= 480 THEN '35 - 39'   WHEN DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP())
          <= 540 THEN '40 - 44'   WHEN DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP())
          <= 600 THEN '45 - 49'   WHEN DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP())
          <= 660 THEN '50 - 54'   WHEN DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP())
          <= 720 THEN '55 - 59'   WHEN DATEDIFF(MONTH,"I_PG_EMPLOYEE"."BIRTHDATE",CURRENT_TIMESTAMP())
          <= 780 THEN '60 - 64'   ELSE '65+'  END
    - appliedColumnTests: {}
