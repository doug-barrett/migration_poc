        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT *
                      FROM {{ ref('DATA_VAULT','H_TRANSACTION') }}
                     WHERE dss_record_source NOT IN('SRC_AMS360.dbo.AFW_Transaction')
                   ) h_transaction
             INNER JOIN {{ ref('STAGE','V_S_AP1_TRANSACTION_MROC_CURRENT') }} v_s_ap1_transaction_mroc_current
                ON h_transaction.HK_h_transaction = v_s_ap1_transaction_mroc_current.HK_h_transaction
               AND v_s_ap1_transaction_mroc_current.isrowdeleted = 0
              LEFT JOIN {{ ref('DATA_VAULT','H_EMPLOYEE') }} h_employee
                ON TO_CHAR(v_s_ap1_transaction_mroc_current.primaryproducerid) = h_employee.employeeid
              LEFT JOIN {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} v_pre_ap1_office_mroc_current_org
                ON v_pre_ap1_office_mroc_current_org.officeid = v_s_ap1_transaction_mroc_current.officeid
              LEFT JOIN {{ ref('DATA_VAULT','H_OFFICE') }} h_office
                ON CASE WHEN v_pre_ap1_office_mroc_current_org.ORGANIZATIONID IN (229,230,211) THEN v_s_ap1_transaction_mroc_current.officeID
                        ELSE v_s_ap1_transaction_mroc_current.producerofficeid
                         END = h_office.officeid
              LEFT JOIN {{ ref('STAGE','V_S_AP1_EMPLOYEE_MROC_CURRENT') }} v_s_ap1_employee_mroc_current
                ON h_employee.HK_h_employee = v_s_ap1_employee_mroc_current.HK_h_employee
              LEFT JOIN {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} v_s_ap1_office_mroc_current
                ON h_office.HK_h_office = v_s_ap1_office_mroc_current.HK_h_office
               AND v_s_ap1_office_mroc_current.isrowdeleted = 0
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_TRANSACTIONEZBUY') }} bvstg_ap1_au_TransactionEzBuy
                ON h_transaction.HK_h_transaction = bvstg_ap1_au_TransactionEzBuy.HK_h_transaction
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_TRANSACTIONESIGN') }} bvstg_ap1_au_TransactionEsign
                ON h_transaction.HK_h_transaction = bvstg_ap1_au_TransactionEsign.HK_h_transaction
              LEFT JOIN {{ ref('DATA_VAULT','H_CUSTOMER') }} h_customer
                ON TO_CHAR(v_s_ap1_transaction_mroc_current.customerid) = h_customer.customerid
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_TRANSACTIONPAYROLLOVERWRITE') }} bvstg_ap1_au_TransactionPayrollOverwrite
                ON h_transaction.transactionid = bvstg_ap1_au_TransactionPayrollOverwrite.transactionid
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_TRANSACTIONSTATUS') }} bvstg_ap1_au_TransactionStatusSubmittedDate
                ON h_transaction.HK_h_transaction = bvstg_ap1_au_TransactionStatusSubmittedDate.HK_h_transaction
               AND bvstg_ap1_au_TransactionStatusSubmittedDate.KEY = 'Submitted'
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_TRANSACTIONSTATUS') }} bvstg_ap1_au_TransactionStatusApprovedByOfficeDate
                ON h_transaction.HK_h_transaction = bvstg_ap1_au_TransactionStatusApprovedByOfficeDate.HK_h_transaction
               AND bvstg_ap1_au_TransactionStatusApprovedByOfficeDate.KEY IN ('ApprovedByOffice' ,'UserApprovedByOffice')
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_TRANSACTIONSTATUS') }} bvstg_ap1_au_TransactionStatusApprovedByOrgDate
                ON h_transaction.HK_h_transaction = bvstg_ap1_au_TransactionStatusApprovedByOrgDate.HK_h_transaction
               AND bvstg_ap1_au_TransactionStatusApprovedByOrgDate.KEY = 'ApprovedByOrg'
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_TRANSACTIONSTATUS') }} bvstg_ap1_au_TransactionStatusApprovedByAdminQCDate
                ON h_transaction.HK_h_transaction = bvstg_ap1_au_TransactionStatusApprovedByAdminQCDate.HK_h_transaction
               AND bvstg_ap1_au_TransactionStatusApprovedByAdminQCDate.KEY = 'ApprovedByAdminQC'
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_SECONDARYTRANSACTION_LASTLOGINOFFICE') }} bvstg_ap1_au_Secondarytransaction_lastloginoffice
                ON h_transaction.transactionid = bvstg_ap1_au_Secondarytransaction_lastloginoffice.transactionid
              LEFT JOIN {{ ref('STAGE','BVSTG_AP1_AU_TRANSACTIONSTATUSNEW') }} bvstg_ap1_au_TransactionStatusNew
                ON h_transaction.HK_h_transaction = bvstg_ap1_au_TransactionStatusNew.HK_h_transaction
              LEFT JOIN {{ ref('STAGE','BVSTG_RETAIL_CODEDEFINITION') }} bvstg_retail_codedefinition
                ON v_s_ap1_transaction_mroc_current.transactiontypeid = bvstg_retail_codedefinition.TypeID
              LEFT JOIN {{ ref('DATA_VAULT','H_OFFICE') }} transaction_office
                ON v_s_ap1_transaction_mroc_current.officeid =
            TRANSACTION
