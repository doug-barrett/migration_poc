        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_COMM_CARRIERDATAREPOSITORYCOMPLETE_CURRENT
        join:
          joinCondition: |-
            EXTENDED
              FROM ( SELECT CarrierDataRepositoryCompleteID,
                   mastercarrierid,
                   carrier,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.state,
                   agency,
                   ProducerCode,
                   ProducerCode2,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.OfficeCode,
                   PolicyNumber,
                   EffectiveDate,
                   isstandard,
                   PREMIUM,
                   ACTUALCOMMISSIONPCT,
                   ACTUALCOMMISSION,
                   EXECUTIONMONTH,
                   ISDUPLICATE,
                   ISDELETED,
                   ProducerCode_Formatted_CDRC,
                   ProducerCode_Formatted_CAMS,
                   carriername_grouped,
                   carrierdisplayname,
                   OfficeCode_Final,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN ds_retail_office_1.BUSINESSENTITYCODE
                        ELSE ifnull(ds_retail_office.BUSINESSENTITYCODE,BRANCH_SM)
                         END AS BRANCH,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN ds_retail_office_1.CHANNEL
                        ELSE upper(ifnull(ds_retail_office.CHANNEL, ifnull(sourcedb_om, CHANNEL_SM)))
                         END AS CHANNEL,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN CASE WHEN ds_retail_office_1.territorymanagername = 'Michael Sanchez' THEN 'True' ELSE 'False' END
                        ELSE CASE WHEN ds_retail_office.territorymanagername = 'Michael Sanchez' THEN 'True' ELSE 'False' END
                         END AS ISFRANCHISE,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN ds_retail_office_1.statecode
                        ELSE ifnull(ds_retail_office.statecode, STATE_SM)
                         END AS statecode_Final
              FROM (SELECT v_dlbv_comm_carrierdatarepositorycomplete_current.CarrierDataRepositoryCompleteID,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.mastercarrierid,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.carrier,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.state,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.agency,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.ProducerCode ProducerCode,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.ProducerCode2 ProducerCode2,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.OfficeCode,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.PolicyNumber,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.EffectiveDate,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.isstandard,
                   CASE WHEN v_dlbv_comm_carrierdatarepositorycomplete_current.Carrier = 'Key Insurance' AND v_dlbv_comm_carrierdatarepositorycomplete_current.ACTUALCOMMISSIONPCT='2.50' THEN 0
                        ELSE v_dlbv_comm_carrierdatarepositorycomplete_current.PREMIUM
                         END AS PREMIUM,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.ACTUALCOMMISSIONPCT,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.ACTUALCOMMISSION,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.EXECUTIONMONTH,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.ISDUPLICATE,
                   v_dlbv_comm_carrierdatarepositorycomplete_current.ISDELETED,
                   DS_BVSTG_COMM_PRODUCERCODEOFFICE_MAP.ProducerCode_Formatted_CDRC,
                   DS_BVSTG_COMM_PRODUCERCODEOFFICE_MAP.ProducerCode_Formatted_CAMS,
                   DS_BVSTG_COMM_PRODUCERCODEOFFICE_MAP.CHANNEL_SM,
                   DS_BVSTG_COMM_PRODUCERCODEOFFICE_MAP.BRANCH_SM,
                   DS_BVSTG_COMM_PR
        name: BVSTG_AU9_CSPR
        noLinkRefs: []
