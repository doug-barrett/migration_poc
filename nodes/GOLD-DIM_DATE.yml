  description: |
    Dimension: Date

    DAX Measures (for Semantic View):
      - Expense Days: CALCULATE([Calendar Days],  'Date'[WeekDayName] <>"Saturday" && 'Date'[WeekDayName] <>"Sunday")
      - Fridays: CALCULATE(countrows('Date'), 'Date'[WeekDayName] = "Friday")
      - Working Days: Calculate([Expense Days], isblank('Date'[Holiday]))
      - Calendar Days: COUNTROWS('Date')
      - Date Range End: MAX ('Date'[Date])
      - Date Range Start: MIN ( 'Date'[Date] )
      - Date Range Label:   var varStart = FORMAT([Date Range Start], "Mmmm YYYY") var varEnd = FORMAT([Date Range End], "Mmmm YYYY") RETURN IF(va
      - Date Range Label Short:   var varStart = FORMAT([Date Range Start], "Mmm'YY") var varEnd = FORMAT([Date Range End], "Mmm'YY") RETURN IF(varStart
