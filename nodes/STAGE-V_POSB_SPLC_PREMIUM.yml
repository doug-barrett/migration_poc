    sourceMapping:
      - aliases:
          V_POSB_SPLC_PREMIUM: 7b9fecb3-f760-4c90-aa51-312d6b5710e3
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_PREMIUM') }} AS SELECT h_splc_policytranpremium.polID,
                   h_splc_policytranpremium.EffDate,
                   CASE WHEN sum(v_s_splc_policytranpremium_current.Premium) > 0 AND sum(v_s_splc_policytranpremium_current.Premium) IS NOT NULL               THEN sum(v_s_splc_policytranpremium_current.Premium)
                        WHEN sum(v_s_splc_policytranpremium_current.BILLEDPREMIUM) > 0 AND sum(v_s_splc_policytranpremium_current.BILLEDPREMIUM) IS NOT NULL   THEN sum(v_s_splc_policytranpremium_current.BILLEDPREMIUM)
                        WHEN sum(v_s_splc_policytranpremium_current.WRITTENPREMIUM) > 0 AND sum(v_s_splc_policytranpremium_current.WRITTENPREMIUM) IS NOT NULL THEN sum(v_s_splc_policytranpremium_current.WRITTENPREMIUM)
                        ELSE sum(v_s_splc_basicpolinfo_current.FULLTERMPREMIUM)
                         END AS Premium,
                   MAX(v_s_splc_policytranpremium_current.FULLTERMPREMIUM) FULLTERMPREMIUM,
                   SUM(CASE WHEN CHARGECATPOLTP=1 THEN v_s_splc_policytranpremium_current.Premium END) TransactionPremium,
                   SUM(CASE WHEN CHARGECATPOLTP=2 THEN v_s_splc_policytranpremium_current.Premium END) TransactionFees
              FROM "RETAIL_PROD"."SCH_DATA_VAULT"."H_SPLC_POLICYTRANPREMIUM" h_splc_policytranpremium
             INNER JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_S_SPLC_POLICYTRANPREMIUM_CURRENT" v_s_splc_policytranpremium_current
                ON (h_splc_policytranpremium.HK_H_POLICYTRANPREMIUM = v_s_splc_policytranpremium_current.HK_H_POLICYTRANPREMIUM)
              LEFT JOIN "RETAIL_PROD"."SCH_DATA_VAULT"."H_SPLC_BASICPOLINFO" h_splc_basicpolinfo
                ON h_splc_basicpolinfo.polid = h_splc_policytranpremium.polID
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_S_SPLC_BASICPOLINFO_CURRENT" v_s_splc_basicpolinfo_current
                ON v_s_splc_basicpolinfo_current.HK_H_BASICPOLINFO = h_splc_basicpolinfo.HK_H_BASICPOLINFO
             WHERE v_s_splc_policytranpremium_current.IncludePremium = 'Y'
             GROUP BY h_splc_policytranpremium.polID,
                      h_splc_policytranpremium.EffDate
