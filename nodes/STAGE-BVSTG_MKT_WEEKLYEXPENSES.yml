                      IFNULL(ds_mkt_calllogs.Nat_Camp_Billing_Code,'National NBC') ,
                      ds_mkt_calllogs.Office_Type ,
                      ds_mkt_media_mix.ConnectedCalls ,
                      ds_mkt_media_mix.CostByWeek
