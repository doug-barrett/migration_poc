    sourceMapping:
      - aliases:
          DS_MKT_MEDIA_MIX: 55efc16c-0fa0-4fff-9f74-7161192184dd
          DS_MKT_CALLLOGS: 259616fa-a3e4-42bc-8241-ee6c1bd21955
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_MKT_MEDIA_MIX
          - locationName: EDW
            nodeName: DS_MKT_CALLLOGS
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_MKT_MEDIA_MIX') }} ds_mkt_media_mix
              LEFT JOIN {{ ref('EDW','DS_MKT_CALLLOGS') }} ds_mkt_calllogs
                ON (ds_mkt_calllogs.Broadcast_Year = ds_mkt_media_mix.Broadcast_Year AND ds_mkt_calllogs.Broadcast_Week = ds_mkt_media_mix.Broadcast_Week AND ds_mkt_calllogs.StationCampaignName = ds_mkt_media_mix.StationCampaignName AND ds_mkt_calllogs.Campaign_Brand_Name = ds_mkt_media_mix.Campaign_Brand AND ds_mkt_calllogs.Campaign_DMAIdentifier = ds_mkt_media_mix.Campaign_DMAIdentifier AND ds_mkt_calllogs.Campaign_Source = ds_mkt_media_mix.Campaign_Source)
             WHERE (ds_mkt_calllogs.call_status IN ('SYSTEM CONNECT', 'ANSWER') OR ds_mkt_calllogs.call_status IS NULL)
               AND upper(ds_mkt_media_mix.Campaign_Brand) IN ('FWY NAT', 'FWY NAT ENG', 'SSB NAT')
               AND ds_mkt_media_mix.Campaign_Source IN ('TV-N','RA','OB','PR')
               AND (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND ds_mkt_media_mix.Broadcast_Year >= YEAR(DATEADD(DAY,-15,CURRENT_DATE()))))
             GROUP BY ds_mkt_media_mix.Broadcast_Year ,
                      ds_mkt_media_mix.Broadcast_Week ,
                      ds_mkt_media_mix.Month_Number ,
                      ds_mkt_media_mix.StationCampaignName ,
                      ds_mkt_media_mix.Campaign_Brand ,
                      ds_mkt_media_mix.Campaign_Source ,
                      ds_mkt_media_mix.Campaign_DMAIdentifier ,
                      ds_mkt_calllogs.Office_Code ,
                      IFNULL(ds_mkt_calllogs.Nat_Camp_Billing_Code,'National NBC') ,
                      ds_mkt_calllogs.Office_Type ,
                      ds_mkt_media_mix.ConnectedCalls ,
                      ds_mkt_media_mix.CostByWeek
        name: SRC_bvstg_mkt_weeklyexpenses_2_refresh
        noLinkRefs: []
      - aliases:
          DS_MKT_WEEKLYEXPENSES: 1eda2712-56d0-4851-a0e9-ee86f178614c
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: EDW
            nodeName: DS_MKT_WEEKLYEXPENSES
        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_MKT_WEEKLYEXPENSES') }} ds_mkt_weeklyexpenses
             WHERE (('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mkt_Refresh_flag }}' = 1 AND ds_mkt_weeklyexpenses.Broadcast_Year>= YEAR(DATEADD(DAY,-15,CURRENT_DATE()))))
