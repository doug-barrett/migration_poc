      join:
        joinCondition: |-
          FROM {{ ref('DIM', 'OPPORTUNITY') }} "OPPORTUNITY"
          LEFT JOIN {{ ref('DIM', 'CONTRACT') }} "CONTRACT"
            ON OPPORTUNITY.CONTRACTKEY = CONTRACT.CONTRACTKEY
          LEFT JOIN {{ ref('DIM', 'ACCOUNT') }} "ACCOUNT"
            ON ACCOUNT.ACCOUNTKEY = OPPORTUNITY.ACCOUNTKEY
          LEFT JOIN {{ ref('FACT', 'SALESANDREVENUE') }} "SALESANDREVENUE"
            ON SALESANDREVENUE.ACCOUNTKEY =OPPORTUNITY.ACCOUNTKEY
          LEFT JOIN {{ ref('DIM', 'FINANCIALSALESTERRITORY') }} "FINANCIALSALESTERRITORY"
            ON ACCOUNT.FINANCIALSALESTERRITORYKEY=FINANCIALSALESTERRITORY.FINANCIALSALESTERRITORYKEY
          LEFT JOIN {{ ref('DIM', 'SALESTERRITORY') }} "SALESTERRITORY"
            ON SALESTERRITORY.TERRITORYID=ACCOUNT.TERRITORYID
          LEFT JOIN {{ ref('DIM', 'ACCOUNTHIERARCHY') }} "ACCOUNTHIERARCHY"
            ON ACCOUNTHIERARCHY.FORCEID=ACCOUNT.FORCEID WHERE OPPORTUNITY.OPPORTUNITYKEY > 0
