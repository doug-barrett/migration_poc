        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_IO_LEAD_OPPORTUNITY_AU1_GNL_DEALS') }} bvstg_io_lead_opportunity_au1_gnl_deals
              LEFT JOIN {{ ref('STAGE','BVSTG_IO_LEAD_OPPORTUNITY_AU3A_ACT_SUM') }} au3a_act_sum
                ON bvstg_io_lead_opportunity_au1_gnl_deals.TIMELINE_ID = au3a_act_sum.TIMELINE_ID
              LEFT JOIN {{ ref('STAGE','BVSTG_IO_LEAD_OPPORTUNITY_AU3B_OB_CALLS') }} au3b_ob_calls
                ON bvstg_io_lead_opportunity_au1_gnl_deals.TIMELINE_ID = au3b_ob_calls.TIMELINE_ID
              LEFT JOIN {{ ref('STAGE','BVSTG_IO_LEAD_OPPORTUNITY_AU3C_CONTACTS') }} au3c_contacts
                ON bvstg_io_lead_opportunity_au1_gnl_deals.TIMELINE_ID = au3c_contacts.TIMELINE_ID
              LEFT JOIN {{ ref('STAGE','BVSTG_IO_LEAD_OPPORTUNITY_AU2C_DEALS') }} au2c_deals
                ON bvstg_io_lead_opportunity_au1_gnl_deals.TIMELINE_ID = au2c_deals.TIMELINE_ID
              LEFT JOIN (
                    SELECT DATE(startdatetime) AS call_date,
                           COUNT(DISTINCT AGENT) AS two_step_assistants
                      FROM RETAIL_PROD.SCH_EDW.DS_PCCE_TERMINATION_CALL_AGENT_SESSION
                     WHERE DATE(startdatetime) >= '2025-09-04'
                       AND isinbound = 1
                       AND skillgrouptargetname = 'Telesales_InsureOne'
                     GROUP BY 1
                     ORDER BY 1
                   ) DS_PCCE_TERMINATION_CALL_AGENT_SESSION
                ON DATE(bvstg_io_lead_opportunity_au1_gnl_deals.MOVED_TO_BUCKET_AT) = DS_PCCE_TERMINATION_CALL_AGENT_SESSION.call_date QUALIFY row_number() over(PARTITION BY bvstg_io_lead_opportunity_au1_gnl_deals.timeline_id ORDER BY bvstg_io_lead_opportunity_au1_gnl_deals.MOVED_TO_BUCKET_AT DESC) = 1
