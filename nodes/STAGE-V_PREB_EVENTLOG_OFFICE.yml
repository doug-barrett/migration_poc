    sourceMapping:
      - aliases:
          V_PREB_EVENTLOG_OFFICE: b90db7a1-85a4-4128-9416-c1c3b6a960f9
          V_DLBV_OSW_EVENTLOG_CURRENT: f762c521-650f-44e2-bdc5-db0ecaacc877
          V_DLBV_OSW_EVENTDATA_CURRENT: af3234ed-18fd-4fb6-9400-a85b9f3c03fd
          V_S_AMS_GLDEPARTMENT_MROC_CURRENT: 52202ddd-3546-41a1-810b-e283ca5dd783
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_EVENTLOG_OFFICE') }} AS SELECT v_dlbv_osw_eventdata_current.eventlogid ,
                   v_dlbv_osw_eventlog_current.EventDate ,
                   v_dlbv_osw_eventlog_current.TransactionType ,
                   v_dlbv_osw_eventlog_current.User ,
                   v_dlbv_osw_eventlog_current.Host ,
                   v_dlbv_osw_eventdata_current.AgentEmpCode ,
                   v_dlbv_osw_eventdata_current.AgentShortName ,
                   v_dlbv_osw_eventdata_current.BrokerCode ,
                   v_dlbv_osw_eventdata_current.BrokerShortName ,
                   v_dlbv_osw_eventdata_current.OfficeCode ,
                   v_dlbv_osw_eventdata_current.OfficeShortName ,
                   v_s_ams_gldepartment_mroc_current.Name AS DepartmentName ,
                   v_dlbv_osw_eventdata_current.CustNo ,
                   v_dlbv_osw_eventdata_current.CustId ,
                   v_dlbv_osw_eventdata_current.PolNo ,
                   v_dlbv_osw_eventdata_current.PolId ,
                   v_dlbv_osw_eventdata_current.QuoteNumber ,
                   v_dlbv_osw_eventdata_current.AccountNumber ,
                   v_dlbv_osw_eventdata_current.State
              FROM {{ ref('STAGE','V_DLBV_OSW_EVENTLOG_CURRENT') }} v_dlbv_osw_eventlog_current
             INNER JOIN {{ ref('STAGE','V_DLBV_OSW_EVENTDATA_CURRENT') }} v_dlbv_osw_eventdata_current
                ON (v_dlbv_osw_eventdata_current.eventlogid = v_dlbv_osw_eventlog_current.id)
             INNER JOIN {{ ref('STAGE','V_S_AMS_GLDEPARTMENT_MROC_CURRENT') }} v_s_ams_gldepartment_mroc_current
                ON (v_dlbv_osw_eventdata_current.OfficeCode = v_s_ams_gldepartment_mroc_current.GLDeptCode)
             WHERE TO_DATE(v_dlbv_osw_eventlog_current.EventDate) >= '2020-01-01'
               AND v_dlbv_osw_eventlog_current.EventType = 'TransactionEnd'
             ORDER BY v_dlbv_osw_eventlog_current.EventDate
