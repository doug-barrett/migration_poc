  description: "Fact: CapacityDetails\n\nDAX Measures (for Semantic View):\n  - Total\
    \ Assignments:  CALCULATE(     SUM(CapacityDetails[value]),     CapacityDetails[type]\
    \ = \"Assignments\" )\n  - Total Available Capacity:  CALCULATE(     SUM(CapacityDetails[value]),\
    \     CapacityDetails[type] = \"Capacity\" )\n  - Remaining Capacity:  [Total\
    \ Available Capacity] - [Total Assignments]\n  - Capacity Utilization %:   DIVIDE(\
    \     [Total Assignments],     [Total Available Capacity],     0 )\n  - Over Capacity\
    \ Flag:   IF(     [Total Assignments] > [Total Available Capacity],     1,   \
    \  0 )\n  - Capacity Status:   SWITCH(     TRUE(),     [Capacity Utilization %]\
    \ > 1, \"Over Capacity\",     [Capacity Utilization %] > 0.8, \"Near Capac\n \
    \ - Avg Assignments (7-day, No Weekends):  VAR Today = TODAY() VAR Last7Weekdays\
    \ =     TOPN(         7,         FILTER(             ALL(CapacityDetails),   \
    \      \n"
