          V_PREB_PCCE_OPM_AGENT_METRICS: 9d8fe76a-889b-426a-96c7-8e3380d30cd3
          V_DLBV_PCCE_AGENT_SKILL_GROUP_INTERVAL_CURRENT: abf23a94-40a5-42cc-b69a-fbe26bf5ec41
          V_S_BOE_TJ_EMPLOYEE_CURRENT: bca35e69-623b-4584-aca2-0dd8510d031b
          DS_PCCE_AGENT_SKILL_GROUP_INTERVAL: b1ae9509-1b84-47bb-bb8d-dca0287a498a
          DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS: 64f9ad9d-906e-46b3-8b70-a738b22b9d5c
          DS_PCCE_AGENT_ACTIVITY: 92804f39-fd5c-4515-8b6e-734bcdffa388
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_OPM_AGENT_METRICS') }} AS SELECT v_s_boe_tj_employee_current.skilltargetid ,
                   v_s_boe_tj_employee_current.UserI3 ,
                   v_s_boe_tj_employee_current.year ,
                   v_s_boe_tj_employee_current.week ,
                   v_s_boe_tj_employee_current.Agentname ,
                   v_s_boe_tj_employee_current.OfficeName ,
                   v_s_boe_tj_employee_current.AHT ,
                   (v_s_boe_tj_employee_current_1.LOGGEDONTIME-v_s_boe_tj_employee_current_1.notreadytime)/v_s_boe_tj_employee_current_1.LOGGEDONTIME AS Utilization ,
                   DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS.Productive ,
                   DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS.NonProductive ,
                   DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS.AGENTAVAILTIME ,
                   DS_PCCE_AGENT_ACTIVITY.PaidTime ,
                   v_s_boe_tj_employee_current_1.LOGGEDONTIME
              FROM (
                    SELECT skilltargetid ,
                           b.UserI3 ,
                           YEAROFWEEKISO(a.DATETIME)YEAR ,
                           weekiso(a.DATETIME) WEEK ,
                           b.FullName AS AgentName ,
                           b.OfficeName ,
                           ROUND(IFNULL(SUM(HANDLEDCALLSTIME)/NULLIF(SUM(CALLSHANDLED),0),0)) AS AHT
                      FROM {{ ref('STAGE','V_DLBV_PCCE_AGENT_SKILL_GROUP_INTERVAL_CURRENT') }} a
                     INNER JOIN {{ ref('STAGE','V_S_BOE_TJ_EMPLOYEE_CURRENT') }} b
                        ON (a.SKILLTARGETID = b.AgentSKILLTARGETID)
                     WHERE DATE(a.DATETIME) >= '2020-10-12'
                     GROUP BY skilltargetid ,
                              b.UserI3 ,
                              YEAROFWEEKISO(a.DATETIME) ,
                              weekiso(a.DATETIME) ,
                              b.FullName ,
                              b.OfficeName
                   ) v_s_boe_tj_employee_current
              LEFT JOIN (
                    SELECT skilltargetid ,
                           YEAROFWEEKISO(a.DATETIME)YEAR ,
                           weekiso(a.DATETIME) WEEK ,
                           b.FullName AS AgentName ,
                           b.OfficeName ,
                           SUM(LOGGEDONTIME)LOGGEDONTIME ,
                           SUM(notreadytime)notreadytime
                      FROM {{ ref('EDW','DS_PCCE_AGENT_SKILL_GROUP_INTERVAL') }} a
                     INNER JOIN {{ ref('STAGE','V_S_BOE_TJ_EMPLOYEE_CURRENT') }} b
                        ON (a.SKILLTARGETID = b.AgentSKILLTARGETID)
                     WHERE DATE(a.DATETIME) >= '2020-10-12'
                     GROUP BY skilltargetid ,
                              b.UserI3 ,
                              YEAROFWEEKISO(a.DATETIME) ,
                              weekiso(a.DATETIME) ,
                              b.FullName ,
                              b.OfficeName
                   ) v_s_boe_tj_employee_current_1
                ON (v_s_boe_tj_employee_current.skilltargetid = v_s_boe_tj_employee_current_1.SkillTargetID AND v_s_boe_tj_employee_current.YEAR = v_s_boe_tj_employee_current_1.YEAR AND v_s_boe_tj_employee_current.week = v_s_boe_tj_employee_current_1.week)
              LEFT JOIN (
                    SELECT SkillTargetID ,
                           YEAROFWEEKISO(Datetime)YEAR ,
                           weekiso(Datetime)WEEK ,
                           SUM(Productive)Productive ,
                           SUM(NonProductive)NonProductive ,
                           SUM(AGENTAVAILTIME)AGENTAVAILTIME
                      FROM(
                            SELECT SkillTargetID ,
                                   Datetime ,
                                   (MAX(AGENTLOGGEDONTIME) - MIN(AGENTNOTREADY)) AS Productive ,
                                   MIN(AGENTNOTREADY) NonProductive ,
                                   MAX(AGENTAVAILTIME)AGENTAVAILTIME
                              FROM {{ ref('EDW','DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS') }}
                             WHERE DATE(Date) >= '2020-10-12'
                             GROUP BY SkillTargetID,
                                      Datetime
                           )a
                     GROUP BY SkillTargetID,
                              YEAROFWEEKISO(Datetime),
                              weekiso(Datetime)
                   )DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS
                ON (v_s_boe_tj_employee_current.skilltargetid = DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS.SkillTargetID AND v_s_boe_tj_employee_current.YEAR = DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS.YEAR AND v_s_boe_tj_employee_current.week = DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS.week)
              LEFT JOIN (
                    SELECT AGENT_SKILLTARGETID,
                           YEAR,
                           WEEK,
                           SUM(IFNULL(PaidTime,0)) AS PaidTime
                      FROM (
                            SELECT AGENT_SKILLTARGETID ,
                                   YEAROFWEEKISO(START_TIME)YEAR ,
                                   weekiso(START_TIME)WEEK ,
                                   Activity ,
                                   SUM(IFNULL(Duration,0))*1.0/3600 PaidTime
                              FROM {{ ref('EDW','DS_PCCE_AGENT_ACTIVITY') }}
                             WHERE Activity NOT IN ('Gone Home','Log-In','Log-Out','Admin Work','Device Error','End of Shift','Connection Failure')
                             GROUP BY AGENT_SKILLTARGETID,
                                      Activity,
                                      YEAROFWEEKISO(START_TIME),
                                      weekiso(START_TIME)
                           )a
                     GROUP BY AGENT_SKILLTARGETID,
                              YEAR,
                              WEEK
                   )DS_PCCE_AGENT_ACTIVITY
                ON (DS_PCCE_AGENT_ACTIVITY.Agent_SkillTargetID = DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS.SkillTargetID AND DS_PCCE_AGENT_ACTIVITY.YEAR = DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS.YEAR AND DS_PCCE_AGENT_ACTIVITY.week = DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS.week)
        dependencies:
          - locationName: STAGE
            nodeName: V_S_BOE_TJ_EMPLOYEE_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_PCCE_AGENT_SKILL_GROUP_INTERVAL_CURRENT
          - locationName: EDW
            nodeName: DS_PCCE_AGENT_SKILL_GROUP_INTERVAL
          - locationName: EDW
            nodeName: DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS
          - locationName: EDW
            nodeName: DS_PCCE_AGENT_ACTIVITY
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('STAGE','V_S_BOE_TJ_EMPLOYEE_CURRENT') }}
            {{ ref('STAGE','V_DLBV_PCCE_AGENT_SKILL_GROUP_INTERVAL_CURRENT') }}
            {{ ref('EDW','DS_PCCE_AGENT_SKILL_GROUP_INTERVAL') }}
            {{ ref('EDW','DS_PCCE_AGENT_HISTORICAL_ALL_FIELDS') }}
            {{ ref('EDW','DS_PCCE_AGENT_ACTIVITY') }}
        name: V_PREB_PCCE_OPM_AGENT_METRICS
        noLinkRefs: []
