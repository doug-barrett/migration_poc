    sourceMapping:
      - aliases:
          V_PRED_MONTHS: ae944c3a-4867-4559-b5a6-92a3211e7fa8
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_PRED_MONTHS
        join:
          joinCondition: |-
            EXTENDED
              FROM ((SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('NSA') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('SPLC') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END)) UNION ALL (SELECT DISTINCT DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) asofmonth,('Missing/Total') PolicySource_Dimension FROM {{ ref('STAGE','V_PRED_MONTHS') }} WHERE CAL_YEAR>='2021' AND (CASE WHEN day(current_date())<15 THEN DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -2, date_trunc('month',current_date())) ELSE DATE_FROM_PARTS(CAL_YEAR,CAL_MONTH_NO, 1) <= dateadd(MONTH, -1, date_trunc('month',current_date())) END))) V_PRED_MONTHS ------------------- New Organic Store  left join  (select date_trunc('month',to_date(StoreOpenDate)) Asofmonth,   sourcedb PolicySource_Dimension,   count(distinct OfficeCode) as new_organic_store   from   (select ifnull(ds_retail_office.OFFICECODE, ds_ram_retail_repository.OfficeCode) OfficeCode,   (case when lower(ds_ram_retail_repository.sourcedb)='splc' then 'SPLC'   when lower(ds_ram_retail_repository.sourcedb) in ('cigh','appone','nsa','dnsa') then 'NSA'   else 'Missing/Total' end) sourcedb ,   ifnull(StoreOpenDate_RR, OfficeOpenedDate) StoreOpenDate,   case when LocationSTatus like 'Closed%' then 'Closed'   when LocationStatus in ('Open', 'Pending') then 'Open'   when LocationStatus = 'Dark' then 'Dark' end as LocationStatus,   case when lower(officestatusdetail) = 'acquisition' then officestatusdetail else 'Organic' end as officestatusdetail,   officetype, statecode   from   (select OfficeCode, min(to_date(createddate)) StoreOpenDate_RR,sourcedb   from "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"   where counter =1   group by officecode,sourcedb   ) ds_ram_retail_repository   full join "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" ds_retail_office   on ds_ram_retail_repository.officecode = ds_retail_office.officecode   where lower(LocationStatus) = 'open'   and StoreOpenDate >= '2021-01-01' and StoreOpenDate < current_date()   )   where lower(officestatusdetail) = 'organic'   group by date_trunc('month',to_date(StoreOpenDate)), PolicySource_Dimension  ) DS_RAM_RETAIL_REPOSITORY  on V_PRED_MONTHS.asofmonth = DS_RAM_RETAIL_REPOSITORY.asofmonth and V_PRED_MONTHS.PolicySource_Dimension = DS_RAM_RETAIL_REPOSITORY.PolicySource_Dimension      ------------------- Locations Acquired Retail  left join  (select date_trunc('month',to_date(StoreOpenDate)) Asofmonth,   sourcedb PolicySource_Dimension,   count(distinct statecode) as locations_acquired_retail   from   (select ifnull(ds_retail_office.OFFICECODE, ds_ram_retail_repository.OfficeCode) OfficeCode,   (case when lower(ds_ram_retail_repository.sourcedb)='splc' then 'SPLC'   when lower(ds_ram_retail_repository.sourcedb) in ('cigh','appone','nsa','dnsa') then 'NSA'   else 'Missing/Total' end) sourcedb ,   ifnull(StoreOpenDate_RR, OfficeOpenedDate) StoreOpenDate,   case when LocationSTatus like 'Closed%' then 'Closed'   when LocationStatus in ('Open', 'Pending') then 'Open'   when LocationStatus = 'Dark' then 'Dark' end as LocationStatus,   case when lower(officestatusdetail) = 'acquisition' then officestatusdetail else 'Organic' end as officestatusdetail,   officetype, statecode   from   (select OfficeCode, min(to_date(createddate)) StoreOpenDate_RR,source
        name: BVSTG_AU36_CONFIE_OPM
        noLinkRefs: []
