    sourceMapping:
      - aliases:
          V_API_ACUMATICA_FINAL: 3bb1e359-bcc4-4185-8031-953b857d0f19
          BVSTG_AU2_ACUMATICA: 19510e53-9d9a-467a-93cc-a4c58001862b
          V_API_ACUMATICA_REVENUEDESCRIPTION: c185e424-337f-4170-bb40-4cffb1605172
          V_API_ACUMATICA_ACCOUNT: 61a89197-77bb-4e67-8af0-becf88eec7c2
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_API_ACUMATICA_FINAL') }} AS SELECT BVSTG_AU2_ACUMATICA.Year_Month ,
                   BVSTG_AU2_ACUMATICA.Branch ,
                   BVSTG_AU2_ACUMATICA.Account ,
                   BVSTG_AU2_ACUMATICA.Description ,
                   CASE WHEN BVSTG_AU2_ACUMATICA.Branch = 425 AND (to_varchar(ACCOUNT) like '4%' OR to_varchar(ACCOUNT) like '5%') THEN '06-099-090050-00'
                        ELSE IFNull(BVSTG_AU2_ACUMATICA.Subaccount, CONCAT(BVSTG_AU2_ACUMATICA.state,'-',BVSTG_AU2_ACUMATICA.dept,'-',BVSTG_AU2_ACUMATICA.store,'-00'))
                         END Subaccount ,
                   sum(COUNT) Quantity ,
                   sum(CASE WHEN CLASS ='Debit' THEN Amount ELSE 0 END) Debit ,
                   sum(CASE WHEN CLASS ='Credit' THEN Amount ELSE 0 END) Credit ,
                   CONCAT(BVSTG_AU2_ACUMATICA.Agency,' ',Description,' ',TYPE, ' -',BVSTG_AU2_ACUMATICA.DateCode) Transaction_Description ,
                   isVoid ,
                   BVSTG_AU2_ACUMATICA.StateCode
              FROM(
                    SELECT Branch ,
                           A.Number ACCOUNT ,
                           A.Subaccount Subaccount ,
                           IFNULL(src.stateCode,'00') state ,
                           CASE WHEN src.FeeName = 'Commercial Broker Fee'                                                              THEN '074'
                                WHEN Branch NOT IN (551,552) AND ACCOUNT NOT IN (12120,20720,22010,20730) AND src.stateCode IS NOT NULL THEN '077'
                                WHEN Branch IN (551,552) AND ACCOUNT NOT IN (12120,20720,22010,20730) AND src.stateCode IS NOT NULL     THEN '079'
                                ELSE '000'
                                 END dept ,
                           IFNULL(src.store,'00000') store ,
                           R.Name Description ,
                           A.Type ,
                           CASE WHEN A."Value" = 'Amount' THEN sum(src.Amount)
                                WHEN A."Value" = 'Cost'   THEN sum(src.Cost)
                                 END Amount ,
                           CASE WHEN src.isVoid=0 THEN substring(MONTHNAME(src.FeeCreatedDate),0,4) || ' ' ||Year(src.FeeCreatedDate)
                                ELSE substring(MONTHNAME(src.VoidedOn),0,4) || ' ' || Year(src.VoidedOn)
                                 END DateCode ,
                           A."Order" ,
                           A.Class ,
                           src.Agency ,
                           A.isVoid ,
                           src.stateCode ,
                           count(DISTINCT CASE WHEN A.isVoid=0 THEN TID ELSE ItemID END) COUNT ,
                           voidFix ,
                           src.Year_Month
                      FROM {{ ref('STAGE','BVSTG_AU2_ACUMATICA') }} src
                     INNER JOIN {{ ref('STAGE','V_API_ACUMATICA_REVENUEDESCRIPTION') }} R
                        ON R.RevenueDescriptionID = src.RevenueDescriptionID
                     INNER JOIN {{ ref('STAGE','V_API_ACUMATICA_ACCOUNT') }} A
                        ON A.RevenueDescriptionID = src.RevenueDescriptionID
                       AND A.isActive=1
                       AND A.isVoid=src.isVoid
                     WHERE CASE WHEN voidFix = 0 AND A.Type like '%Fix%' THEN 1
                                ELSE 0
                                 END = 0
                     GROUP BY Branch ,
                              A.Number ,
                              A.Subaccount ,
                              state ,
                              CASE WHEN src.FeeName = 'Commercial Broker Fee'                                                              THEN '074'
                                   WHEN Branch NOT IN (551,552) AND ACCOUNT NOT IN (12120,20720,22010,20730) AND src.stateCode IS NOT NULL THEN '077'
                                   WHEN Branch IN (551,552) AND ACCOUNT NOT IN (12120,20720,22010,20730) AND src.stateCode IS NOT NULL     THEN '079'
                                   ELSE '000'
                                    END ,
                              dept ,
                              store ,
                              R.Name ,
                              A.Type ,
                              A.RevenueDescriptionID ,
                              CASE WHEN src.isVoid=0 THEN substring(MONTHNAME(src.FeeCreatedDate),0,4) || ' ' ||Year(src.FeeCreatedDate)
                                   ELSE substring(MONTHNAME(src.VoidedOn),0,4) || ' ' ||Year(src.VoidedOn)
                                    END ,
                              A."Order" ,
                              A.Class ,
                              src.Agency ,
                              A.isVoid ,
                              src.stateCode ,
                              src.Cost ,
                              src.isVoid ,
                              src.stateCode ,
                              src.FeeName ,
                              A."Value" ,
                              voidFix ,
                              src.Year_Month
                   ) BVSTG_AU2_ACUMATICA
             WHERE BVSTG_AU2_ACUMATICA.Amount!=0
             GROUP BY BVSTG_AU2_ACUMATICA.Year_Month ,
                      BVSTG_AU2_ACUMATICA.Branch ,
                      BVSTG_AU2_ACUMATICA.Account ,
                      BVSTG_AU2_ACUMATICA.Description ,
                      IFNull(BVSTG_AU2_ACUMATICA.Subaccount, CONCAT(BVSTG_AU2_ACUMATICA.state,'-',BVSTG_AU2_ACUMATICA.dept,'-',BVSTG_AU2_ACUMATICA.store,'-00')) ,
                      CONCAT(BVSTG_AU2_ACUMATICA.Agency,' ',Description,' ',TYPE, ' -',BVSTG_AU2_ACUMATICA.DateCode) ,
                      BVSTG_AU2_ACUMATICA.isVoid ,
                      BVSTG_AU2_ACUMATICA.StateCode
