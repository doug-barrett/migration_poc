        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_DLBV_SFDC_SCORECARDS_CURRENT') }} V_DLBV_SFDC_SCORECARDS_CURRENT
              LEFT JOIN {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} ds_ams_transactionDetail
                ON ds_ams_transactionDetail.POLICYNUMBER = V_DLBV_SFDC_SCORECARDS_CURRENT.POLICY__C
               AND DATE(ds_ams_transactionDetail.TRANSACTIONDATE) BETWEEN DATEADD(DAYS,-60,V_DLBV_SFDC_SCORECARDS_CURRENT.CREATEDDATE) AND DATEADD(DAYS,60,V_DLBV_SFDC_SCORECARDS_CURRENT.CREATEDDATE)
               AND ds_ams_transactionDetail.ModeID IN(12,14)
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE
                ON DS_RETAIL_OFFICE.OfficeName = V_DLBV_SFDC_SCORECARDS_CURRENT.ACCOUNT
             WHERE DATE(DATEADD(HOUR,-5,REPLACE(V_DLBV_SFDC_SCORECARDS_CURRENT.CREATEDDATE,'T',' '))) >= '2023-01-02' /* AND             (           ('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 0 AND DATE(DATEADD(HOUR,-5,REPLACE(V_DLBV_SFDC_SCORECARDS_CURRENT.CREATEDDATE,'T',' '))) >='2021-01-01')       OR ('{{ parameters.HWM_BVSTG_CIGH_Refresh_Flag }}' = 1        AND HOUR(current_timestamp()) <= '{{ parameters.HWM_BVSTG_Hour }}'        AND DATE(DATEADD(HOUR,-5,REPLACE(V_DLBV_SFDC_SCORECARDS_CURRENT.CREATEDDATE,'T',' '))) >= DATEADD(MONTH,-2,CURRENT_DATE())        )                )*/
               AND General_Group='CIGH 7 Errors'
               AND ACTION_REQUIRED_OR_NOTIFICATION IN('Action Required','Notification ONLY')
               AND (CLOSE_REASON IN('Awaiting for Response','No Resolution','Notified Agent and Closed By Ops','Resolved By Agent','Response Received & No Resolution','') OR CLOSE_REASON IS NULL)
               AND IFNULL(POLICY,'') != ''
               AND ACCOUNTID!= '001A00000180dEbIAI'
               AND DESCRIPTIVE_GROUP IN('Carrier required documents missing  illegible  altered  incomplete or incorrect (Includeds Photos)', 'Fee disclosure documents missing  illegible  altered  incomplete or incorrect', 'File not scanned within 4 hours', 'Missing signatures on Confie and Carrier paperwork', 'Policy uploaded with incorrect or incomplete driver  vehicles  coverage  or mileage (compared to management system rater)') QUALIFY ROW_NUMBER() OVER (PARTITION BY V_DLBV_SFDC_SCORECARDS_CURRENT.CASENUMBER ORDER BY CASE WHEN DS_RETAIL_OFFICE.ISACTIVE = TRUE THEN 1 ELSE 2 END, IFNULL(DS_RETAIL_OFFICE.OFFICEOPENEDDATE, DS_RETAIL_OFFICE.OPENDATE) DESC) = 1
