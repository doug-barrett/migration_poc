              LEFT JOIN {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} ds_ams_transactionDetail
                ON ds_ams_transactionDetail.POLICYNUMBER = V_DLBV_SFDC_SCORECARDS_CURRENT.POLICY__C
               AND DATE(ds_ams_transactionDetail.TRANSACTIONDATE) BETWEEN DATEADD(DAYS,-60,V_DLBV_SFDC_SCORECARDS_CURRENT.CREATEDDATE) AND DATEADD(DAYS,60,V_DLBV_SFDC_SCORECARDS_CURRENT.CREATEDDATE)
