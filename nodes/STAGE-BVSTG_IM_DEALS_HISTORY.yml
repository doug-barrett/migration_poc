    sourceMapping:
      - aliases:
          BVSTG_IM_AU2_DEALS_HISTORY: c7f3a7ea-645e-4b2b-9a05-c904f0abc9e9
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_IM_AU2_DEALS_HISTORY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_IM_AU2_DEALS_HISTORY') }} bvstg_im_au2_deals_history
              LEFT JOIN (
                    SELECT DISTINCT a.deal_id,
                           DATE (b.createat) createat,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'iscreated' THEN 1 ELSE 0 END) iscreated,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'iswon' THEN 1 ELSE 0 END) iswon,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'issubmittingrenewal' THEN 1 ELSE 0 END) issubmittingrenewal,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'issold' THEN 1 ELSE 0 END) issold,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'isrenewalwon' THEN 1 ELSE 0 END) isrenewalwon,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'isrenewalreviewed' THEN 1 ELSE 0 END) isrenewalreviewed,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'isrenewalreplaced' THEN 1 ELSE 0 END) isrenewalreplaced,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'isrenewalrenewed' THEN 1 ELSE 0 END) isrenewalrenewed,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'isquoted' THEN 1 ELSE 0 END) isquoted,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'islost' THEN 1 ELSE 0 END) islost,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'islapsed' THEN 1 ELSE 0 END) islapsed,
                           MAX(CASE WHEN B.deal_id IS NOT NULL AND SOURCE = 'isdue' THEN 1 ELSE 0 END) isdue,
                           MAX(a.istransfer) istransfer,
                           MAX(a.istopipeline) istopipeline,
                           MAX(a.isreassigned) isreassigned,
                           MAX(a.istobucket) istobucket,
                           MAX(a.isinprogresswinback) isinprogresswinback,
                           MAX(a.iswebform) iswebform
                      FROM {{ ref('STAGE','BVSTG_IM_AU2_DEALS_HISTORY') }} a
                      LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_IM_UNIQUE_FLAGS b
                        ON a.deal_id = b.deal_id
                       AND DATE (a.DATE) = DATE (b.createat)
                     GROUP BY a.deal_id,
                              DATE (b.createat)
                   ) v_preb_im_unique_flags
                ON v_preb_im_unique_flags.deal_id = bvstg_im_au2_deals_history.deal_id
               AND DATE (v_preb_im_unique_flags.createat) = DATE (bvstg_im_au2_deals_history.DATE)
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_IM_HIST_SESSION_OUTBOUND v_preb_im_hist_session_outbound
                ON v_preb_im_hist_session_outbound.deal_id = bvstg_im_au2_deals_history.deal_id
               AND v_preb_im_hist_session_outbound.max_retailagent_employeenumber = bvstg_im_au2_deals_history.primaryagentemployeenumber
              LEFT JOIN RETAIL_PROD.SCH_BVSTAGE.V_PREB_IM_HIST_TCD v_preb_im_hist_tcd
                ON v_preb_im_hist_tcd.deal_id = bvstg_im_au2_deals_history.deal_id
               AND DATE (bvstg_im_au2_deals_history.DATE) = IFNULL(DATE (v_preb_im_hist_tcd.min_startdatetime), DATE (v_preb_im_hist_tcd.max_startdatetime)) QUALIFY ROW_NUMBER() OVER (PARTITION BY bvstg_im_au2_deals_history.ID ORDER BY v_preb_im_hist_session_outbound.ISINBOUND DESC, v_preb_im_hist_session_outbound.ISOUTBOUND DESC) = 1
        name: BVSTG_IM_DEALS_HISTORY
        noLinkRefs: []
