      customSQL:
        customSQL: ''
      dependencies:
      - locationName: FACT
        nodeName: RevenueBudget
      - locationName: TABLEAU
        nodeName: RevenueBudgetDetail
      - locationName: TABLEAU
        nodeName: AccountHierarchy
      - locationName: TABLEAU
        nodeName: Account
      - locationName: TABLEAU
        nodeName: Contract
      - locationName: TABLEAU
        nodeName: SalesTerritory
      - locationName: TABLEAU
        nodeName: FinancialSalesTerritory
      join:
        joinCondition: |-
          FROM {{ ref('FACT', 'RevenueBudget') }} "RevenueBudget"
          LEFT JOIN {{ ref('TABLEAU', 'RevenueBudgetDetail') }} "RevenueBudgetDetail"
            ON REVENUEBUDGET.REVENUEBUDGETDETAILKEY = REVENUEBUDGETDETAIL.REVENUEBUDGETDETAILKEY
          LEFT JOIN {{ ref('TABLEAU', 'AccountHierarchy') }} "AccountHierarchy"
            ON REVENUEBUDGET.ACCOUNTHIERARCHYKEY = ACCOUNTHIERARCHY.ACCOUNTHIERARCHYKEY
          LEFT JOIN {{ ref('TABLEAU', 'Account') }} "Account"
