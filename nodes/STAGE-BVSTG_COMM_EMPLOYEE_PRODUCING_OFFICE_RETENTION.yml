                   CASE WHEN (m13_tier='Not Qualified' AND m13_retention_cy IS NULL AND m13_retention_py IS NULL) OR m13_tier='PY Not Null; CY Null' THEN NULL
                        WHEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13.score IS NOT NULL                                                               THEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13.score
                        ELSE 0
                         END AS m13_score,
                   CASE WHEN m3_score IS NULL
               AND m7_score IS NULL
               AND m13_score IS NULL THEN NULL WHEN (m3_retention_py IS NULL AND m7_retention_py IS NULL AND m13_retention_py IS NULL)
               AND (m3_retention_cy IS NOT NULL AND m7_retention_cy IS NULL AND m13_retention_cy IS NULL)
               AND m3_tier='M3_Tier 1' THEN (m3_score + 1) -- required for minimum bonus amount  else ifnull(m3_score,0) + ifnull(m7_score,0) + ifnull(m13_score,0) end as retention_score  from {{ ref('STAGE','BVSTG_COMM_AU1_EMPLOYEE_PRODUCING_OFFICE_RETENTION') }}  --from bvstg_comm_au1_employee_producing_office_retention  left join (  select distinct *   from {{ ref('STAGE','V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT') }}  --from "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT"  where isrowdeleted=0  qualify row_number() over (partition by retention_type,tier,start_month order by record_insertion_timestamp desc,lastupdateddate desc)=1  ) AS V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3  on concat(trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.retention_type),'_',trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.tier)) = bvstg_comm_au1_employee_producing_office_retention.m3_tier  and bvstg_comm_au1_employee_producing_office_retention.date between V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.start_month and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.end_month  and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.retention_type like ('%M3%')  left join (  select distinct *   from {{ ref('STAGE','V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT') }}  --from "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT"  where isrowdeleted=0  qualify row_number() over (partition by retention_type,tier,start_month order by record_insertion_timestamp desc,lastupdateddate desc)=1  ) AS V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7  on concat(trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.retention_type),'_',trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.tier))=bvstg_comm_au1_employee_producing_office_retention.m7_tier  and bvstg_comm_au1_employee_producing_office_retention.date between V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.start_month and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.end_month  and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.retention_type like ('%M7%')  left join (  select distinct *   from {{ ref('STAGE','V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT') }}  --from "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT"  where isrowdeleted=0  qualify row_number() over (partition by retention_type,tier,start_month order by record_insertion_timestamp desc,lastupdateddate desc)=1  ) AS V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13  on concat(trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13.retention_type),'_',trim(V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13.tier))=bvstg_comm_au1_employee_producing_office_retention.m13_tier  and bvstg_comm_au1_employee_producing_office_retention.date between V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13.start_month and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13.end_month  and V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m13.retention_type like ('%M13%')  ) AS bvstg_comm_au1_employee_producing_office_retention  left join (  select distinct *   from [
