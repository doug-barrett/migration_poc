                        WHEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.score IS NOT NULL                                                            THEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.score
                        ELSE 0
