            EXTENDED
              FROM (SELECT DISTINCT bvstg_comm_au1_employee_producing_office_retention.*,
                   CASE WHEN (m3_tier='Not Qualified' AND m3_retention_cy IS NULL AND m3_retention_py IS NULL) OR m3_tier='PY Not Null; CY Null' THEN NULL
                        WHEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.score IS NOT NULL                                                            THEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m3.score
                        ELSE 0
                         END AS m3_score,
                   CASE WHEN (m7_tier='Not Qualified' AND m7_retention_cy IS NULL AND m7_retention_py IS NULL) OR m7_tier='PY Not Null; CY Null' THEN NULL
                        WHEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.score IS NOT NULL                                                            THEN V_DLBV_RST_RT_SCORE_BY_TIER_CURRENT_m7.score
                        ELSE 0
