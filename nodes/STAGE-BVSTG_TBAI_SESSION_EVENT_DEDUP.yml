                           MAX(EVENTTIME) EVENTTIME ,
                           DENSE_RANK() OVER (PARTITION BY FE.SESSIONID ORDER BY MAX(EVENTTIME)) Rank ,
                           DENSE_RANK() OVER (PARTITION BY FE.SESSIONID ORDER BY MAX(EVENTTIME) DESC) Rank2
                      FROM {{ ref('STAGE','V_DLBV_TBAI_FORMEVENT_CURRENT') }} FE
                     GROUP BY SESSIONID ,
                              FE.CARRIERNAME ,
                              FE.PROVINCE ,
                              FE.CITY ,
                              FE.ZIP ,
                              FE.PRODUCER ,
                              FE.LANGUAGE ,
                              FE.CONTACTTYPE ,
                              FE.VERSION ,
