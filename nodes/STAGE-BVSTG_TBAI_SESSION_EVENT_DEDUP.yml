        join:
          joinCondition: |-
            FROM(
                    SELECT FE.SESSIONID ,
                           FE.CARRIERNAME ,
                           FE.PROVINCE ,
                           FE.CITY ,
                           FE.ZIP ,
                           FE.PRODUCER ,
