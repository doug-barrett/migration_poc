        join:
          joinCondition: |-
            FROM {{ ref('EDW','DS_AP1_TRANSACTIONERROR_DETAILS') }} ds_ap1_transactionerror_details
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTION') }} ds_bvstg_ap1_transaction
                ON ds_ap1_transactionerror_details.transactionid = ds_bvstg_ap1_transaction.transactionid
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_AP1_TRANSACTIONERROR') }} ds_bvstg_ap1_transactionerror
                ON ds_bvstg_ap1_transactionerror.transactionid = ds_ap1_transactionerror_details.transactionid
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON ds_retail_office.officecode = ds_ap1_transactionerror_details.officecode
              LEFT JOIN (
                    SELECT s_ap1_organization_mroc.code Company ,
                           v_pre_ap1_office_mroc_current.officecode
                      FROM {{ ref('STAGE','V_PRE_AP1_OFFICE_MROC_CURRENT') }} v_pre_ap1_office_mroc_current
                     INNER JOIN {{ ref('DATA_VAULT','S_AP1_ORGANIZATION_MROC') }} s_ap1_organization_mroc
                        ON s_ap1_organization_mroc.organizationid = v_pre_ap1_office_mroc_current.organizationid
                   ) v_pre_ap1_office_mroc_current_org
                ON v_pre_ap1_office_mroc_current_org.officecode = ds_retail_office.officecode
             WHERE DATE (ds_bvstg_ap1_transaction.created) >= '2020-01-01'
               AND YEAR(ds_bvstg_ap1_transaction.created) <= YEAR(CURRENT_DATE()) QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_ap1_transactionerror_details.transactionid ORDER BY CASE WHEN ds_bvstg_ap1_transactionerror.approvalstate = 'ApprovedByAdminQC' THEN 1 WHEN ds_bvstg_ap1_transactionerror.approvalstate = 'ApprovedByOrg' THEN 2 ELSE 3 END) = 1
