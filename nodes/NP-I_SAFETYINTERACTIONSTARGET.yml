        join:
          joinCondition: |-
            FROM {{ ref('NP','D_EMPLOYEE') }} D_EMPLOYEE
             INNER JOIN {{ ref('NP','D_DATE') }} D_DATE
                ON CALENDARDATE = CONVERT(DATE,GETDATE())
             INNER JOIN {{ ref('NP','L_SHP_LSINOMINEE') }} L_SHP_LSINOMINEE
                ON USERPRINCIPALNAME = NOMINEE
             WHERE D_EMPLOYEE.TERMINATED = 0
               AND ISDELETED = 'FALSE'
             GROUP BY D_EMPLOYEE.EMPLOYEECODE,
                      EOMONTH(CALENDARDATE),
                      D_DATE.PERIODNUMBER,
                      L_SHP_LSINOMINEE.INTERATIONTYPE
