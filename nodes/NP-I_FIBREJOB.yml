        description: 'Percentage Penalty Incurred '
        name: PERCENTAGEPENALTY
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |-
              CASE WHEN SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED IS NULL                                           THEN 0.00
                          WHEN SLA__BDATE IS NULL                                                                          THEN 0.00
                          WHEN ISNULL(CAUSE__BOF__BMISSING__BAPPOINTMENT, 'CUSTOMER') IN ('CUSTOMER', 'RSP')               THEN 0.00
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 3  THEN 0.00
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 6  THEN 0.10
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 9  THEN 0.20
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 12 THEN 0.30
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 15 THEN 0.40
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 18 THEN 0.50
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 21 THEN 0.60
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 24 THEN 0.70
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 27 THEN 0.80
                          WHEN DATEDIFF(HOUR, DATEADD(DAY, 1, SLA__BDATE), SUB__BCONTRACTOR__B__U__BTIME__BCOMPLETED) < 30 THEN 0.90
                          ELSE 1.00
                           END
