_dimensions)))    and executionmonth >= (select dateadd('month',-4,(select max(cutoffdate)         from {{ ref('STAGE','BVSTG_COMM_AU2_CSEDW_DIMENSIONS') }}        --from bvstg_comm_au2_csedw_dimensions      )))    group by ds_bvstg_comm_carriermapping_2.carrierdisplayname    ) v_dlbv_comm_carrierdatarepositorycomplete_current_2    on bvstg_comm_au2_cspredw.carrierdisplayname=v_dlbv_comm_carrierdatarepositorycomplete_current_2.carrierdisplayname    group by bvstg_comm_au2_cspredw.carrierdisplayname, bvstg_comm_au2_cspredw.cutoffdate,bvstg_comm_au2_cspredw.AGENCYSTATE,bvstg_comm_au2_cspredw.CUSTOMERSTATE,bvstg_comm_au2_cspredw.BRAND    ) as bvstg_comm_au2_cspredw
