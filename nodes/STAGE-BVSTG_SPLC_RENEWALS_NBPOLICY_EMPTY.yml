        dependencies:
          - locationName: UNKNOWN
            nodeName: V_POSB_SPLC_RENEWALS_NBPOLICY
          - locationName: STAGE
            nodeName: DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES
          - locationName: EDW
            nodeName: DS_SPLC_POLICYTRANSACTION
        join:
          joinCondition: |-
            FROM {{ ref('UNKNOWN','V_POSB_SPLC_RENEWALS_NBPOLICY') }} v_posb_splc_renewals_nbpolicy
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }} ds_bvstg_comm_policynumberformatting_allsources
                ON (ds_bvstg_comm_policynumberformatting_allsources.PolicyNumber_EDW = v_posb_splc_renewals_nbpolicy.PolicyNumber AND ds_bvstg_comm_policynumberformatting_allsources.CarrierName_EDW = v_posb_splc_renewals_nbpolicy.CARRIERNAME)
              LEFT JOIN {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }} ds_bvstg_comm_policynumberformatting_allsources_a
                ON (ds_bvstg_comm_policynumberformatting_allsources_a.PolicyNumberFormatted = ds_bvstg_comm_policynumberformatting_allsources.PolicyNumberFormatted AND ds_bvstg_comm_policynumberformatting_allsources_a.CarrierName_Mapped = ds_bvstg_comm_policynumberformatting_allsources.CarrierName_Mapped)
              LEFT JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} ds_splc_policytransaction_nb
                ON ds_bvstg_comm_policynumberformatting_allsources_a.PolicyNumber_EDW = ds_splc_policytransaction_nb.PolicyNumber
               AND ds_bvstg_comm_policynumberformatting_allsources_a.CarrierName_EDW = ds_splc_policytransaction_nb.CARRIERNAME
               AND ds_splc_policytransaction_nb.trantype IN ('NBS')
               AND ds_splc_policytransaction_nb.POLICYTYPE like '%Business Auto%'
              LEFT JOIN (
                    SELECT b.PolicyID,
                           TRANSACTIONDATE,
                           EFFECTIVEDATE,
                           POLICYNUMBERFORMATTED,
                           a.CarrierName_EDW
                      FROM {{ ref('STAGE','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES') }} a
                     INNER JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} b
                        ON a.PolicyNumber_EDW = b.PolicyNumber
                       AND a.CarrierName_EDW = b.CARRIERNAME
                     WHERE b.trantype IN ('RWL')
                       AND b.POLICYTYPE like '%Business Auto%' QUALIFY ROW_NUMBER() OVER (PARTITION BY a.POLICYNUMBERFORMATTED,a.CarrierName_EDW ORDER BY b.TRANSACTIONDATE,b.EFFECTIVEDATE) =1
                   ) ds_bvstg_comm_policynumberformatting_allsources_nb
                ON ds_bvstg_comm_policynumberformatting_allsources.POLICYNUMBERFORMATTED = ds_bvstg_comm_policynumberformatting_allsources_nb.POLICYNUMBERFORMATTED
               AND ds_bvstg_comm_policynumberformatting_allsources.CarrierName_EDW = ds_bvstg_comm_policynumberformatting_allsources_nb.CarrierName_EDW
             WHERE v_posb_splc_renewals_nbpolicy.NBPolicyID IS NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY v_posb_splc_renewals_nbpolicy.policyID,v_posb_splc_renewals_nbpolicy.policytype ORDER BY ds_bvstg_comm_policynumberformatting_allsources_nb.TransactionDate,ds_bvstg_comm_policynumberformatting_allsources_nb.EFFECTIVEDATE) = 1
        name: BVSTG_SPLC_RENEWALS_NBPOLICY_EMPTY
