        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_HCI_TRANSFERS
          - locationName: STAGE
            nodeName: BVSTG_HCI_TRANSACTION
          - locationName: STAGE
            nodeName: V_DLBV_CFA_HCI_AGENTS_CURRENT
          - locationName: STAGE
            nodeName: V_DLBV_CFA_HCI_COMPENSATION_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_HCI_TRANSFERS') }} bvstg_hci_transfers
             INNER JOIN {{ ref('STAGE','V_DLBV_CFA_HCI_AGENTS_CURRENT') }} v_dlbv_cfa_hci_agents_current
                ON v_dlbv_cfa_hci_agents_current.EmployeeNumber = bvstg_hci_transfers.EmployeeNumber
               AND v_dlbv_cfa_hci_agents_current.userRole like '%Health Care%'
               AND v_dlbv_cfa_hci_agents_current.ISACTIVEHEALTHCARE = 1
             INNER JOIN {{ ref('STAGE','V_DLBV_CFA_HCI_COMPENSATION_CURRENT') }} v_dlbv_cfa_hci_compensation_current
                ON v_dlbv_cfa_hci_compensation_current.CompensationID = v_dlbv_cfa_hci_agents_current.CompensationID
             INNER JOIN {{ ref('STAGE','BVSTG_HCI_TRANSACTION') }} bvstg_hci_transaction
                ON bvstg_hci_transaction.LeadID = bvstg_hci_transfers.leadID
             WHERE (('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 0) OR ('{{ parameters.HWM_BVSTG_Mapping_Refresh_Flag }}' = 1 AND DATE(bvstg_hci_transfers.CreatedDate) >= DATEADD(MONTH,-'{{ parameters.HWM_BVSTG_Month_refresh }}',DATEADD(DAY,1,last_day(DATEADD(DAY,-5,DATE(CURRENT_DATE())))))))
             GROUP BY bvstg_hci_transfers.EmployeeNumber,
                      bvstg_hci_transfers.FullName,
                      v_dlbv_cfa_hci_compensation_current.Sale,
                      bvstg_hci_transfers.CREATEDDATE
        name: SRC_bvstg_hci_facilitators_1
        noLinkRefs: []
      - aliases:
          BVSTG_HCI_TRANSFERS: 4e77d96f-281f-4652-ab67-f7bf8fec096c
          BVSTG_HCI_TRANSACTION: b98a63db-7cb5-40b9-a274-ffc004d71702
          V_DLBV_CFA_HCI_AGENTS_CURRENT: aea54a44-b819-44d1-9652-c238111d1259
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_HCI_TRANSFERS
          - locationName: STAGE
            nodeName: BVSTG_HCI_TRANSACTION
          - locationName: STAGE
            nodeName: V_DLBV_CFA_HCI_AGENTS_CURRENT
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_HCI_TRANSFERS') }} bvstg_hci_transfers
             INNER JOIN {{ ref('STAGE','BVSTG_HCI_TRANSACTION') }} bvstg_hci_transaction
                ON bvstg_hci_transaction.LeadID = bvstg_hci_transfers.leadID
             WHERE bvstg_hci_transfers.EmployeeNumber IN (
                    SELECT EmployeeNumber
                      FROM {{ ref('STAGE','V_DLBV_CFA_HCI_AGENTS_CURRENT') }}
                     WHERE userRole like '%Health Care%'
                   )
             GROUP BY bvstg_hci_transfers.CREATEDDATE
        name: SRC_bvstg_hci_facilitators_2
        noLinkRefs: []
