      - aliases:
          BVSTG_HCI_TRANSFERS: 4e77d96f-281f-4652-ab67-f7bf8fec096c
          V_DLBV_CFA_HCI_AGENTS_CURRENT: aea54a44-b819-44d1-9652-c238111d1259
          V_DLBV_CFA_HCI_COMPENSATION_CURRENT: d9e765ee-2858-4c2c-a8cf-f5d6afe7f04d
          BVSTG_HCI_TRANSACTION: b98a63db-7cb5-40b9-a274-ffc004d71702
        customSQL:
