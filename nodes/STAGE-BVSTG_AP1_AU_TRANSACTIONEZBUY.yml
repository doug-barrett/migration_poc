              JOIN {{ ref('STAGE','BVSTG_AP1_TRANSACTION_REFRESH') }} bvstg_ap1_transaction_refresh
                ON h_transaction.transactionid = TO_CHAR(bvstg_ap1_transaction_refresh.transactionid)
