            FROM {{ ref('STAGE','V_S_AP1_PAYMENT_MROC_CURRENT') }} v_s_ap1_payment_mroc_current
              JOIN {{ ref('STAGE','V_S_AP1_PAYMENTRECEIPT_MROC_CURRENT') }} v_s_ap1_paymentreceipt_mroc_current
