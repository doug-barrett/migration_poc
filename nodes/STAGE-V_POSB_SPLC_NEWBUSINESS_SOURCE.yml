        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_NEWBUSINESS_SOURCE') }} AS SELECT h_splc_policytransaction.polid,
                   v_s_splc_basicpolinfo_current.poltypelob,
                   H_SPLC_BASICPOLINFO_NEW.PolID NBPolicyID
              FROM {{ ref('DATA_VAULT','H_SPLC_POLICYTRANSACTION') }} h_splc_policytransaction
             INNER JOIN {{ ref('STAGE','V_S_SPLC_POLICYTRANSACTION_CURRENT') }} v_s_splc_policytransaction_current
                ON v_s_splc_policytransaction_current.HK_H_POLICYTRANSACTION = h_splc_policytransaction.HK_H_POLICYTRANSACTION
             INNER JOIN {{ ref('DATA_VAULT','H_SPLC_BASICPOLINFO') }} H_SPLC_BASICPOLINFO
                ON H_SPLC_BASICPOLINFO.POLID = h_splc_policytransaction.polid
             INNER JOIN {{ ref('STAGE','V_S_SPLC_BASICPOLINFO_CURRENT') }} V_S_SPLC_BASICPOLINFO_CURRENT
                ON V_S_SPLC_BASICPOLINFO_CURRENT.HK_H_BASICPOLINFO = H_SPLC_BASICPOLINFO.HK_H_BASICPOLINFO
             INNER JOIN {{ ref('STAGE','V_S_SPLC_BASICPOLINFO_CURRENT') }} V_S_SPLC_BASICPOLINFO_CURRENT_NEW
                ON V_S_SPLC_BASICPOLINFO_CURRENT_NEW.CUSTID = V_S_SPLC_BASICPOLINFO_CURRENT.CUSTID
               AND V_S_SPLC_BASICPOLINFO_CURRENT_NEW.POLTYPELOB = V_S_SPLC_BASICPOLINFO_CURRENT.POLTYPELOB
               AND V_S_SPLC_BASICPOLINFO_CURRENT_NEW.cocode = V_S_SPLC_BASICPOLINFO_CURRENT.cocode
               AND DATE(V_S_SPLC_BASICPOLINFO_CURRENT_NEW.ENTEREDDATE) <= DATE(V_S_SPLC_BASICPOLINFO_CURRENT_NEW.ENTEREDDATE)
             INNER JOIN {{ ref('DATA_VAULT','H_SPLC_BASICPOLINFO') }} H_SPLC_BASICPOLINFO_NEW
                ON V_S_SPLC_BASICPOLINFO_CURRENT_NEW.HK_H_BASICPOLINFO = H_SPLC_BASICPOLINFO_NEW.HK_H_BASICPOLINFO
             INNER JOIN {{ ref('DATA_VAULT','H_SPLC_POLICYTRANSACTION') }} H_SPLC_POLICYTRANSACTION_NEW
                ON H_SPLC_POLICYTRANSACTION_NEW.POLID = H_SPLC_BASICPOLINFO_NEW.POLID
             INNER JOIN {{ ref('STAGE','V_S_SPLC_POLICYTRANSACTION_CURRENT') }} V_S_SPLC_POLICYTRANSACTION_CURRENT_NEW
                ON V_S_SPLC_POLICYTRANSACTION_CURRENT_NEW.HK_H_POLICYTRANSACTION = H_SPLC_POLICYTRANSACTION_NEW.HK_H_POLICYTRANSACTION
               AND V_S_SPLC_POLICYTRANSACTION_CURRENT_NEW.TRANTYPE = 'NBS' QUALIFY ROW_NUMBER() OVER (PARTITION BY h_splc_policytransaction.polid,v_s_splc_basicpolinfo_current.poltypelob ORDER BY V_S_SPLC_BASICPOLINFO_CURRENT_NEW.ENTEREDDATE DESC, h_splc_policytransaction.effdate DESC, v_s_splc_policytransaction_current.entereddate DESC) = 1
