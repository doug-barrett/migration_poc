            nodeName: BVSTG_COMM_AU1_DASHBOARD_EXTRACT
        join:
          joinCondition: |-
            FROM (
                    SELECT carrier,
                           max(M1_CancellationRate) M1_CancellationRate,
                           max(M2_CancellationRate) M2_CancellationRate,
                           max(M3_CancellationRate) M3_CancellationRate,
                           max(M1_RenewalRate) M1_RenewalRate,
                           max(M2_RenewalRate) M2_RenewalRate,
                           max(M3_RenewalRate) M3_RenewalRate,
                           max(M1_PendingRenewalRate) M1_PendingRenewalRate,
                           max(M2_PendingRenewalRate) M2_PendingRenewalRate,
                           max(M3_PendingRenewalRate) M3_PendingRenewalRate,
                           max(M1_ReinstatementRate) M1_ReinstatementRate,
                           max(M2_ReinstatementRate) M2_ReinstatementRate,
                           max(M3_ReinstatementRate) M3_ReinstatementRate
                      FROM (
                            SELECT carrier,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -4) THEN CancellationRate
                                        ELSE 0
                                         END AS M1_CancellationRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -3) THEN CancellationRate
                                        ELSE 0
                                         END AS M2_CancellationRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -2) THEN CancellationRate
                                        ELSE 0
                                         END AS M3_CancellationRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -4) THEN RenewalRate
                                        ELSE 0
                                         END AS M1_RenewalRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -3) THEN RenewalRate
                                        ELSE 0
                                         END AS M2_RenewalRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -2) THEN RenewalRate
                                        ELSE 0
                                         END AS M3_RenewalRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -4) THEN PendingRenewalRate
                                        ELSE 0
                                         END AS M1_PendingRenewalRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -3) THEN PendingRenewalRate
                                        ELSE 0
                                         END AS M2_PendingRenewalRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -2) THEN PendingRenewalRate
                                        ELSE 0
                                         END AS M3_PendingRenewalRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -4) THEN ReinstatementRate
                                        ELSE 0
                                         END AS M1_ReinstatementRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -3) THEN ReinstatementRate
                                        ELSE 0
                                         END AS M2_ReinstatementRate,
                                   CASE WHEN asofmonth = add_months(date_trunc('month', current_date()), -2) THEN ReinstatementRate
                                        ELSE 0
                                         END AS M3_ReinstatementRate
                              FROM (
                                    SELECT carrier,
                                           asofmonth,
                                           sum(CASE WHEN metric = 'Cancelled_Policies' THEN MetricValue END)/ sum(CASE WHEN metric = 'PIF_BOM' THEN MetricValue END) CancellationRate,
                                           sum(CASE WHEN metric = 'Renewed_Policies' THEN MetricValue END)/ sum(CASE WHEN metric = 'Pending_Renewals' THEN MetricValue END) RenewalRate,
                                           sum(CASE WHEN metric = 'Pending_Renewals' THEN MetricValue END)/ sum(CASE WHEN metric = 'PIF_BOM' THEN MetricValue END) PendingRenewalRate,
                                           sum(CASE WHEN metric = 'Reinstated_Policies' THEN MetricValue END)/ sum(CASE WHEN metric = 'PIF_BOM' THEN MetricValue END) ReinstatementRate
                                      FROM (
                                            SELECT DISTINCT asofmonth,
                                                   metric,
                                                   sum(metricvalue) MetricValue,
                                                   carrier
                                              FROM {{ ref('STAGE','BVSTG_COMM_AU1_DASHBOARD_EXTRACT') }} bvstg_comm_au1_dashboard_extract
                                             WHERE metric IN ('PIF_BOM', 'Cancelled_Policies', 'Renewed_Policies', 'Pending_Renewals', 'Reinstated_Policies')
                                               AND asofmonth >= add_months(date_trunc('month', current_date()), -4)
                                               AND asofmonth <= add_months(date_trunc('month', current_date()), -2)
                                             GROUP BY carrier,
                                                      asofmonth,
                                                      metric
                                           )
                                     GROUP BY carrier,
                                              asofmonth
                                   )
                           )
                     GROUP BY carrier
                   )bvstg_comm_au1_dashboard_extract
