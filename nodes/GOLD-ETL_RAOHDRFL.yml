    sourceMapping:
    - aliases:
        SRC_RAOHDRFL: 18c453d4-f8aa-5f12-b56b-5212e6dbe526
      customSQL:
        customSQL: ''
      dependencies:
      - locationName: GOLD
        nodeName: SRC_RAOHDRFL
      join:
        joinCondition: "FROM  {{ ref('GOLD', 'SRC_RAOHDRFL') }} \"SRC_RAOHDRFL\"\n\nLEFT OUTER JOIN IDENTIFIER('\"WS_MIGRATION\".\"GOLD\".ID_LOCATION')\nON \"SRC_RAOHDRFL\".\"RHCMP\" = \"ID_LOCATION\".\"COMPANY_CODE\"\n AND \"SRC_RAOHDRFL\".\"RHLOC\" = \"ID_LOCATION\".\"LOCATION_CODE\"\n\nLEFT OUTER JOIN IDENTIFIER('\"WS_MIGRATION\".\"GOLD\".ID_PARTY')\nON  \"SRC_RAOHDRFL\".\"RHCMP\" = \"ID_PARTY\".\"COMPANY_CODE\"\nAND CASE WHEN \"SRC_RAOHDRFL\".\"RHCUS0\" > 0 THEN  \"SRC_RAOHDRFL\".\"RHCUS0\" ELSE  0 END \n     = \"ID_PARTY\".\"CUSTOMER_ACCOUNT_NUM\"\nAND CASE WHEN \"SRC_RAOHDRFL\".\"RHCUS0\" = 0 \n         THEN \"TRIM\"(\"SRC_RAOHDRFL\".\"RHDLST\") || \"TRIM\"(\"SRC_RAOHDRFL\".\"RHDL0\")\n          ELSE '' END\n   = \"ID_PARTY\".\"CUSTOMER_ACCOUNT_CHAR\"\nAND \"ID_PARTY\".\"PARTY_TYPE_CODE\" in (1,2)\n\nLEFT OUTER JOIN IDENTIFIER('\"WS_MIGRATION\".\"GOLD\".ID_CUSTOMER_JOB')\nON  \"SRC_RAOHDRFL\".\"RHCMP\" = \"ID_CUSTOMER_JOB\".\"COMPANY_CODE\"\nAND \"ID_PARTY\".\"PARTY_ID\" = \"ID_CUSTOMER_JOB\"\
          .\"PARTY_ID\"\nAND \"ID_PARTY\".\"PARTY_TYPE_CODE\" = \"ID_CUSTOMER_JOB\".\"PARTY_TYPE_CODE\"\nAND \"SRC_RAOHDRFL\".\"RHJOB0\" = \"ID_CUSTOMER_JOB\".\"JOB_NUM\"\n\n \nWhere \"AUD_TIME\" <= (Select \"MAX\"(\"BATCH_END\") "
      name: ETL_RAOHDRFL
      noLinkRefs: []
