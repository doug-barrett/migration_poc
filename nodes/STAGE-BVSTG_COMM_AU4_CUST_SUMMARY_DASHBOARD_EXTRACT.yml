        join:
          joinCondition: |-
            FROM ( SELECT last_carrier ,
                   metric ,
                   sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), - 4) THEN metricvalue END) AS m1pif ,
                   sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), - 3) THEN metricvalue END) AS m2pif ,
                   sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), - 2) THEN metricvalue END) AS m3pif ,
                   sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), - 1) THEN metricvalue END) AS m4pif ,
                   (sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), - 4) THEN metricvalue END) + sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), - 3) THEN metricvalue END) + sum(CASE WHEN cutoffdate = add_months(date_trunc('month', CURRENT_DATE), - 2) THEN metricvalue END)) / 3 AS averagepif
              FROM {{ ref('STAGE','BVSTG_COMM_AU1_CUST_SUMMARY_DASHBOARD_EXTRACT') }} bvstg_comm_au1_cust_summary_dashboard_extract -- from "DATA_LAKE"."BIA_ANALYTICS"."BVSTG_COMM_AU1_CUST_SUMMARY_DASHBOARD_EXTRACT" bvstg_comm_au1_cust_summary_dashboard_extract   WHERE cutoffdate >= add_months(date_trunc('month', CURRENT_DATE), - 4)    AND cutoffdate <= add_months(date_trunc('month', CURRENT_DATE), - 1)    AND metric = 'CIF_EOM'    AND (     last_carrier IN (      SELECT DISTINCT carrierdisplayname      FROM {{ ref('STAGE','DS_BVSTG_COMM_PAIDTYPEMAPPING') }} ds_bvstg_comm_paidtypemapping      -- from "RETAIL_PROD"."SCH_BVSTAGE"."DS_BVSTG_COMM_PAIDTYPEMAPPING" ds_bvstg_comm_paidtypemapping      WHERE finalstatus IN ('Combined_Status_Earned_A', 'Combined_Status_Collected_A', 'Combined_Status_Collected_B')       AND carrierdisplayname <> 'Western General'      )     OR last_carrier IN (      SELECT DISTINCT carrierdisplayname      FROM {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}      -- from "RETAIL_PROD"."SCH_EDW"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF"      WHERE lower(carrierdisplayname) LIKE 'bluefire%'      )     )   GROUP BY metric    ,last_carrier   ) bvstg_comm_au1_cust_summary_dashboard_extract  WHERE m4pif <= averagepif * 0.85
        name: BVSTG_COMM_AU4_CUST_SUMMARY_DASHBOARD_EXTRACT
