        dependencies:
          - locationName: EDW
            nodeName: DS_MKT_CAMPAIGN2SALES
          - locationName: STAGE
            nodeName: V_FORMS2SALE
          - locationName: EDW
            nodeName: DS_AP1_TRANSACTIONSUMMARY
        join:
          joinCondition: |-
            FROM {{ ref('STAGE','V_FORMS2SALE') }} ds_mkt_campaign2sales
              LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                ON ds_mkt_campaign2sales.SALEID = ds_ap1_transactionsummary.Transactionid
             WHERE BudgetMktgState IN ('MO','WA','NY')
               AND (('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 0 AND DATE(ds_mkt_campaign2sales.DSS_CREATE_TIME) = DATEADD(DAY,-1,CURRENT_DATE())) OR ('{{ parameters.HWM_BVSTG_API_Outb_Refresh_Flag }}' = 1 AND DATE(ds_mkt_campaign2sales.DSS_CREATE_TIME) = DATEADD(DAY,-1,CURRENT_DATE())))
               AND ContactType = 'Inbound Call'
               AND SourceSystem = 'AppOne'
               AND Vendor IN ('Google','Website') QUALIFY ROW_NUMBER() OVER (PARTITION BY ds_mkt_campaign2sales.InteractionIDKey ORDER BY ds_mkt_campaign2sales.VintageDate DESC)=1
        name: BVSTG_ROI_CALLDATA
