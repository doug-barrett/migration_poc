    sourceMapping:
      - aliases:
          V_PREB_POLICYSUMMARY_CDT_SUMMARY: 755e4912-354b-449c-9f8a-11eae3c3bc69
          BVSTG_AU1_POLICYSUMMARY: 4c4854d9-4fd9-4c10-82a6-1d08772281f3
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_POLICYSUMMARY_CDT_SUMMARY') }} AS SELECT bvstg_au1_policysummary.NBTransactionID ,
                   SUM(bvstg_au1_policysummary.countcdt) AS countcdt ,
                   SUM(bvstg_au1_policysummary.newbusiness) AS newbusiness ,
                   SUM(bvstg_au1_policysummary.endorsement) AS endorsement ,
                   SUM(bvstg_au1_policysummary.nonrenewal) AS nonrenewal ,
                   SUM(bvstg_au1_policysummary.rewrite) AS rewrite ,
                   SUM(bvstg_au1_policysummary.renewal) AS renewal ,
                   SUM(bvstg_au1_policysummary.renewaloffer) AS renewaloffer ,
                   SUM(bvstg_au1_policysummary.reinstatement) AS reinstatement ,
                   SUM(bvstg_au1_policysummary.cancelpending) AS cancelpending ,
                   SUM(bvstg_au1_policysummary.cancelled) AS cancelled ,
                   MAX(bvstg_au1_policysummary_last_cdt.last_cdt) AS last_cdt ,
                   MAX(bvstg_au1_policysummary_last_cdt.last_cdteffectivedate) AS last_cdteffectivedate ,
                   MAX(bvstg_au1_policysummary_last_cdt.Last_cdt_createdDate) AS Last_cdt_createdDate ,
                   MAX(bvstg_au1_policysummary_last_status.last_cdt_status) AS last_cdt_status ,
                   MAX(bvstg_au1_policysummary_last_status.last_cdt_statusdate) AS last_cdt_statusdate
              FROM {{ ref('STAGE','BVSTG_AU1_POLICYSUMMARY') }} bvstg_au1_policysummary
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','BVSTG_AU1_POLICYSUMMARY') }}
                     WHERE last_cdteffectivedate IS NOT NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY NBTransactionID ORDER BY last_cdteffectivedate DESC, Transactionid) = 1
                   )bvstg_au1_policysummary_last_cdt
                ON bvstg_au1_policysummary.NBTransactionID = bvstg_au1_policysummary_last_cdt.NBTransactionID
              LEFT JOIN (
                    SELECT *
                      FROM {{ ref('STAGE','BVSTG_AU1_POLICYSUMMARY') }}
                     WHERE last_cdt_statusdate IS NOT NULL QUALIFY ROW_NUMBER() OVER (PARTITION BY NBTransactionID ORDER BY last_cdt_statusdate DESC, Transactionid) = 1
                   )bvstg_au1_policysummary_last_status
                ON bvstg_au1_policysummary.NBTransactionID = bvstg_au1_policysummary_last_status.NBTransactionID
             GROUP BY bvstg_au1_policysummary.NBTransactionID
        dependencies:
