    sourceMapping:
      - aliases:
          BVSTG_DIALER_AU1_TELESALES: 4cc18ca3-c805-4fd0-984f-3614f9eecccd
          DS_CUSTOMERSUMMARY_V2: bfbcbb64-c981-41ce-827f-e0330b80cf2d
          DS_MKT_CALL_CUSTOMER: b9bec5bd-83fe-4758-95ec-851f723f90ef
          S_AP1_LEAD_MROC: 2db4359b-0fbc-4c10-9bbc-9bbd97642f6e
          DS_AGENT_KEY: 489968a6-2aa9-4c60-83b4-b001aab3e3a8
          V_S_AP1_APPOINTMENT_MROC_CURRENT: 165f0a49-1c16-4138-af78-4f018afcc334
          DS_MKT_LEAD_SOURCE: 11ed51b7-3963-4bf2-81b7-ee9ae173436d
          V_DIALER_TELESALES_PHONE: 2154ae13-7919-4212-a416-823d6237b2e9
          V_DLBV_MKT_TIMEZONES_STATE: 9daba5b5-60b5-4f63-9d82-2be1d4349af8
          V_DLBV_MKT_TIMEZONES: 66cd70ef-2b74-4766-a2f6-9f540dc9ee7d
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_DIALER_AU1_TELESALES
          - locationName: EDW
            nodeName: DS_CUSTOMERSUMMARY_V2
          - locationName: EDW
            nodeName: DS_MKT_CALL_CUSTOMER
          - locationName: DATA_VAULT
            nodeName: S_AP1_LEAD_MROC
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: STAGE
            nodeName: V_S_AP1_APPOINTMENT_MROC_CURRENT
          - locationName: EDW
            nodeName: DS_MKT_LEAD_SOURCE
          - locationName: STAGE
            nodeName: V_DIALER_TELESALES_PHONE
          - locationName: STAGE
            nodeName: V_DLBV_MKT_TIMEZONES_STATE
          - locationName: STAGE
            nodeName: V_DLBV_MKT_TIMEZONES
        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('STAGE','BVSTG_DIALER_AU1_TELESALES') }} BVSTG_DIALER_AU1_TELESALES
             INNER JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} DS_CUSTOMERSUMMARY_V2
                ON BVSTG_DIALER_AU1_TELESALES.C_CUSTOMERID = ds_customersummary_v2.CustomerID
               AND DS_CUSTOMERSUMMARY_V2.SOURCEDB = 'AppOne'
              LEFT JOIN (
                    SELECT b.CUSTOMERID,
                           MAX(STARTDATETIME) STARTDATETIME
                      FROM {{ ref('STAGE','BVSTG_DIALER_AU1_TELESALES') }} a
                     INNER JOIN {{ ref('EDW','DS_MKT_CALL_CUSTOMER') }} b
                        ON a.C_CUSTOMERID = b.CustomerID
                       AND DATE (b.STARTDATETIME) >= DATEADD(MONTH, - 2, CURRENT_DATE ())
                       AND b.SOURCEDB_CUSTOMER = 'AppOne'
                       AND TCONNECTED >= 10
                     GROUP BY b.CUSTOMERID
                   ) DS_MKT_CALL_CUSTOMER
                ON BVSTG_DIALER_AU1_TELESALES.C_CUSTOMERID = DS_MKT_CALL_CUSTOMER.CustomerID
              LEFT JOIN (
                    SELECT CustomerID,
                           COUNT(CASE WHEN DATE (a.STARTDATETIME) >= DATEADD(DAY, - 5, CURRENT_DATE ()) THEN a.INTERACTIONIDKEY END) Calls_Telesales,
                           COUNT(CASE WHEN DATE (a.STARTDATETIME) >= DATEADD(DAY, - 3, CURRENT_DATE ()) THEN a.INTERACTIONIDKEY END) Calls_HC,
                           MAX(CASE WHEN DATE (a.STARTDATETIME) >= DATEADD(DAY, - 5, CURRENT_DATE ()) THEN a.STARTDATETIME END) STARTDATETIME_Telesales,
                           MAX(CASE WHEN DATE (a.STARTDATETIME) >= DATEADD(DAY, - 7, CURRENT_DATE ()) THEN a.STARTDATETIME END) STARTDATETIME_HC,
                           SUM(CASE WHEN DATE (a.STARTDATETIME) >= DATEADD(DAY, - 5, CURRENT_DATE ()) AND TCONNECTED > 10 THEN 1 ELSE 0 END) Connected_10_Telesales,
                           SUM(CASE WHEN DATE (a.STARTDATETIME) >= DATEADD(DAY, - 7, CURRENT_DATE ()) AND TCONNECTED > 10 THEN 1 ELSE 0 END) Connected_10_HC,

                      FROM RETAIL_PROD.SCH_EDW.ds_mkt_call_customer a
                     INNER JOIN RETAIL_PROD.SCH_EDW.ds_pcce_termination_call_summary_session b
                        ON a.INTERACTIONIDKEY = b.ID
                       AND ORIGINATED = 'D'
                     WHERE SOURCEDB_CUSTOMER = 'AppOne'
                       AND TCONNECTED > 0
                       AND DATE (a.STARTDATETIME) >= DATEADD(DAY, - 7, CURRENT_DATE ())
                       AND DIRECTION = 2
                     GROUP BY CustomerID
                   ) DS_MKT_CALL_CUSTOMER_calls
                ON DS_MKT_CALL_CUSTOMER_calls.CustomerID = BVSTG_DIALER_AU1_TELESALES.C_CUSTOMERID
              LEFT JOIN (
                    SELECT a.FIRST_GROUP_LEADID,
                           MAX(c.JOBTITLE) JOBTITLE,
                           MAX(CASE WHEN d.LeadID IS NOT NULL THEN 1 ELSE 0 END) Appointmaint,
                           MAX(CASE WHEN e.LeadID IS NOT NULL THEN 1 ELSE 0 END) olb_no_lms
                      FROM {{ ref('STAGE','BVSTG_DIALER_AU1_TELESALES') }} a
                     INNER JOIN {{ ref('DATA_VAULT','S_AP1_LEAD_MROC') }} b
                        ON a.LAST_LEADID = TO_VARCHAR(b.LeadID)
                      LEFT JOIN {{ ref('EDW','DS_AGENT_KEY') }} c
                        ON c.AP1_USERID = b.CREATEDBY
                       AND c.JOBFAMILY = 'SALES'
                      LEFT JOIN {{ ref('STAGE','V_S_AP1_APPOINTMENT_MROC_CURRENT') }} d
                        ON d.LeadID = b.LeadID
                       AND DATEADD(HOUR, - 7, DATETIMEUTC) >= CURRENT_TIMESTAMP()
                      LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} e
                        ON e.LeadID = b.LeadID
                       AND e.ORIGINALORGANIZATIONCODE = 'OLBT'
                       AND e.LMS_ID IS NULL
                     GROUP BY a.FIRST_GROUP_LEADID
                   ) DS_BVSTG_GROUP_LEAD
                ON TO_VARCHAR(DS_BVSTG_GROUP_LEAD.FIRST_GROUP_LEADID) = BVSTG_DIALER_AU1_TELESALES.FIRST_GROUP_LEADID
              LEFT JOIN {{ ref('STAGE','V_DIALER_TELESALES_PHONE') }} v_dialer_telesales_phone_1
                ON BVSTG_DIALER_AU1_TELESALES.C_CUSTOMERID = v_dialer_telesales_phone_1.CustomerID
               AND v_dialer_telesales_phone_1.Rank = 1
              LEFT JOIN {{ ref('STAGE','V_DIALER_TELESALES_PHONE') }} v_dialer_telesales_phone_2
                ON BVSTG_DIALER_AU1_TELESALES.C_CUSTOMERID = v_dialer_telesales_phone_2.CustomerID
               AND v_dialer_telesales_phone_2.Rank = 2
              LEFT JOIN {{ ref('STAGE','V_DLBV_MKT_TIMEZONES_STATE') }} V_DLBV_MKT_TIMEZONES_STATE
                ON V_DLBV_MKT_TIMEZONES_STATE.STATECODE = IFNULL(ds_customersummary_v2.MAINSTATE, ds_customersummary_v2.MAILINGSTATE)
              LEFT JOIN {{ ref('STAGE','V_DLBV_MKT_TIMEZONES') }} V_DLBV_MKT_TIMEZONES
                ON V_DLBV_MKT_TIMEZONES_STATE.TIMEZONE = V_DLBV_MKT_TIMEZONES.TIMEZONENAME
              LEFT JOIN (
                    SELECT DISTINCT CustomerID
                      FROM RETAIL_PROD.SCH_BVSTAGE.V_PREB_DNC
                   ) V_PREB_DNC
                ON V_PREB_DNC.CustomerID = ds_cus
