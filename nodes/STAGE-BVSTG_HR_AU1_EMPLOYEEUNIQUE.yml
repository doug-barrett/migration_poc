        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT DISTINCT ds_retail_office.SalesVP AS SalesVP1 ,
                           ds_retail_office.DistrictManagerName AS District_Manager1 ,
                           ds_retail_office.StateCode AS State1 ,
                           ds_retail_office.OfficeCode AS Code1 ,
