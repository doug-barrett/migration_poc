                        ON employeedata.LocationCode = ds_retail_office.OfficeCode
                      LEFT JOIN {{ ref('STAGE','BVSTG_HR_UKG_EMPREHIRE') }} bvstg_hr_ukg_emprehire
                        ON CONCAT(RTRIM(LTRIM(employeedata.EmployeeNumber)) ,RTRIM(LTRIM(employeedata.CompanyCode)) ,RTRIM(LTRIM(employeedata.PayGroupCode))) = CONCAT(RTRIM(LTRIM(bvstg_hr_ukg_emprehire.EmployeeNumber)) ,RTRIM(LTRIM(bvstg_hr_ukg_emprehire.CompanyCode)) ,RTRIM(LTRIM(bvstg_hr_ukg_emprehire.PayGroupCode)))
