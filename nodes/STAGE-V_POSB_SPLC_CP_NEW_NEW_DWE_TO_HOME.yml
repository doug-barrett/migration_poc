            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_SPLC_CP_NEW_NEW_DWE_TO_HOME') }} AS SELECT DISTINCT DS_SPLC_POLICYTRANSACTION.ID
              FROM {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION
             INNER JOIN {{ ref('EDW','DS_SPLC_POLICYTRANSACTION') }} DS_SPLC_POLICYTRANSACTION_NEW_NEW_3
                ON DS_SPLC_POLICYTRANSACTION.PRIORPOLID= DS_SPLC_POLICYTRANSACTION_NEW_NEW_3.POLICYID
               AND DS_SPLC_POLICYTRANSACTION_NEW_NEW_3.POLICYTYPE Like 'Homeowners%'
               AND DATE(DS_SPLC_POLICYTRANSACTION_NEW_NEW_3.STATUSDATE) >= DATE(DATEADD(DAY,-30,DATE(DS_SPLC_POLICYTRANSACTION.ReportDate)))
               AND DS_SPLC_POLICYTRANSACTION_NEW_NEW_3.Status='Cancelled'
               AND DS_SPLC_POLICYTRANSACTION.POLICYTYPE Like 'Dwelling Fire%'
             WHERE DS_SPLC_POLICYTRANSACTION.TranType ='NBS'
