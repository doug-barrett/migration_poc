_ram_retail_repository.POLICYID = ds_ams_case_error.PolicyID  left join "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" ds_retail_office  on ds_ram_retail_repository.officecode = ds_retail_office.officecode  WHERE ds_ram_retail_repository.LABEL in  ('New Business Auto' , 'New Business Complementary')  AND ds_ram_retail_repository.SourceDB = 'CIGH'  and statecode in ('AL', 'LA', 'IL')  and (islegacytransaction is null or islegacytransaction <> 'Migrated')  and date(CreatedDate) between '2021-01-01' and current_date()-1  GROUP BY PrimaryAgentUltiPro_Broker,to_date(CREATEDDATE), ds_ram_retail_repository.OfficeCode)  group by 1,2  ) DS_RAM_RETAIL_REPOSITORY  on V_PRED_MONTHS.asofmonth = DS_RAM_RETAIL_REPOSITORY.asofmonth and V_PRED_MONTHS.PolicySource_Dimension = DS_RAM_RETAIL_REPOSITORY.PolicySource_Dimension    ---------------------- CIGH % Policies with Errors Denominator  Left join  (select date_trunc('month', CreatedDate) asofmonth,  'Missing/Total' PolicySource_Dimension,  sum(metricvalue)qc_revision_errorrate_cigh_den  from  (SELECT PrimaryAgentUltiPro_Broker ProducerNumber,to_date(CREATEDDATE) CreatedDate, ds_ram_retail_repository.OfficeCode,  null, null, null, null, null,null, null, null, null, 'CIGH' SourceDB, null, null, null,  'Brand' SubjectArea,'With_Error_Denominator' Metric,  count(distinct ds_ram_retail_repository.policyid) MetricValue  FROM  "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY" ds_ram_retail_repository  Left JOIN "RETAIL_PROD"."SCH_EDW"."DS_AMS_CASE_ERROR" ds_ams_case_error  ON ds_ram_retail_repository.POLICYID = ds_ams_case_error.PolicyID  left join "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" ds_retail_office  on ds_ram_retail_repository.officecode = ds_retail_office.officecode  WHERE ds_ram_retail_repository.LABEL in  ('New Business Auto' , 'New Business Complementary')  AND ds_ram_retail_repository.SourceDB = 'CIGH'  and statecode in ('AL', 'LA', 'IL')  and (islegacytransaction is null or islegacytransaction <> 'Migrated')  and d
