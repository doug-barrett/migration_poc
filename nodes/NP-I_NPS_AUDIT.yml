    sourceMapping:
      - aliases:
          L_NPS_AUDIT: ab1e0147-cc75-4567-9b3b-01fbaacfdf25
          L_NPS_AUDITCHECKLIST: 1855148f-8474-4aa3-9e8f-78b7d8eb60ac
          L_NPS_YAUDITCATEGORY: e1298e9b-359d-4ae7-a538-75d5e2b46b21
          L_NPS_XAUDITOR: daf7e976-d13d-420c-834c-7dc40699fcd5
          L_NPS_PERSON: 9cbf0810-d07e-48fd-ae8c-d3f3d2e0c81e
          L_NPS_YDEPARTMENT: 685efa4d-7004-47ee-bc30-656313467b79
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: NP
            nodeName: L_NPS_AUDIT
          - locationName: NP
            nodeName: L_NPS_AUDITCHECKLIST
          - locationName: NP
            nodeName: L_NPS_YAUDITCATEGORY
          - locationName: NP
            nodeName: L_NPS_XAUDITOR
          - locationName: NP
            nodeName: L_NPS_PERSON
          - locationName: NP
            nodeName: L_NPS_YDEPARTMENT
        join:
          joinCondition: |-
            FROM {{ ref('NP','L_NPS_AUDIT') }}
              LEFT OUTER JOIN (
                    SELECT AUDITID,
                           MAX(ID) AS CHECKLISTID
                      FROM L_NPS_AUDITCHECKLIST
                     GROUP BY AUDITID
                   ) MAXCHECKLIST
                ON L_NPS_AUDIT.ID = MAXCHECKLIST.AUDITID
              LEFT OUTER JOIN {{ ref('NP','L_NPS_AUDITCHECKLIST') }}
                ON MAXCHECKLIST.AUDITID = L_NPS_AUDITCHECKLIST.AUDITID
               AND MAXCHECKLIST.CHECKLISTID = L_NPS_AUDITCHECKLIST.ID
              LEFT OUTER JOIN {{ ref('NP','L_NPS_YAUDITCATEGORY') }}
                ON L_NPS_AUDIT.AUDITCATEGORYID = L_NPS_YAUDITCATEGORY.ID
              LEFT OUTER JOIN {{ ref('NP','L_NPS_XAUDITOR') }}
                ON L_NPS_AUDIT.ID = L_NPS_XAUDITOR.AUDITID
               AND L_NPS_XAUDITOR.ISLEADAUDITOR = 1
              LEFT OUTER JOIN {{ ref('NP','L_NPS_PERSON') }}
                ON L_NPS_XAUDITOR.PERSONID = L_NPS_PERSON.ID
              LEFT OUTER JOIN {{ ref('NP','L_NPS_YDEPARTMENT') }}
                ON L_NPS_PERSON.DEPARTMENTID = L_NPS_YDEPARTMENT.ID
              LEFT OUTER JOIN D_BUSINESSUNIT
                ON (L_NPS_YDEPARTMENT.NAME LIKE '[A-Z0-9][A-Z0-9][A-Z0-9] %' AND LEN(D_BUSINESSUNIT.BUSINESSUNITCODE) = 3 AND LEFT(L_NPS_YDEPARTMENT.NAME,3) = D_BUSINESSUNIT.BUSINESSUNITCODE)
                OR (L_NPS_YDEPARTMENT.NAME LIKE '[A-Z0-9][A-Z0-9][A-Z0-9] %' AND LEN(D_BUSINESSUNIT.BUSINESSUNITCODE) = 6 AND LEFT(L_NPS_YDEPARTMENT.NAME,3) + '905' = D_BUSINESSUNIT.BUSINESSUNITCODE)
        name: I_NPS_AUDIT
        noLinkRefs: []
