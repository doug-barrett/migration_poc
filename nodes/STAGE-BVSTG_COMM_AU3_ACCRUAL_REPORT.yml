        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT date_trunc('month',to_date(CreatedDate))
             MONTH,
                   ds_bvstg_comm_policynumberformatting_allsources.carriername_grouped,
                   ds_bvstg_comm_policynumberformatting_allsources.carrierdisplayname,
                   ds_retail_office.statecode,
                   ds_retail_office.businessentitycode branch,
                   ds_retail_office.officecode,
                   TotalWorkingDays,
                   RemainingDays,
                   sum(CASE WHEN label IN ('New Business Auto', 'New Business Complementary') THEN counter ELSE 0 END) NBS_Sales,
                   sum(CASE WHEN label IN ('New Business Auto', 'New Business Complementary') THEN writtenPremiumamount ELSE 0 END) NBS_WrittenPremium,
                   sum(CASE WHEN label IN ('New Business Auto', 'New Business Complementary') AND ds_bvstg_comm_termcleaning.term = 6 THEN counter ELSE 0 END) NBS_Sales_6,
