                   sum(CASE WHEN label IN ('Renewal Auto', 'Renewal Complementary') THEN counter ELSE 0 END) RWL_Sales,
                   sum(CASE WHEN label IN ('Renewal Auto', 'Renewal Complementary') THEN writtenPremiumamount ELSE 0 END) RWL_WrittenPremium,
                   sum(CASE WHEN label IN ('Renewal Auto', 'Renewal Complementary') AND ds_bvstg_comm_termcleaning.term = 6 THEN counter ELSE 0 END) RWL_Sales_6,
                   sum(CASE WHEN label IN ('Renewal Auto', 'Renewal Complementary') AND ds_bvstg_comm_termcleaning.term = 6 THEN writtenPremiumamount ELSE 0 END) RWL_WrittenPremium_6,
