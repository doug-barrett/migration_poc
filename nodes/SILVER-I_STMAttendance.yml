      config: {}
      dataType: NUMBER(38,0)
      description: Count if an employee attended at least one meeting per month. Do
        not count more than one otherwise we can't compare against target at a cost
        centre level.
      name: MonthlyEmployeeAttendance
      nullable: true
      sourceColumnReferences:
      - columnReferences: []
        transform: CASE   --WHEN ITS THE FIRST RECORD FOR THE EMPLOYEE   -- DON'T
          COUNT EXTRAS IF THE EMPLOYEE ATTENDED MULTIPLE MEETINGS IN THE MONTH     WHEN
          ROW_NUMBER() OVER (PARTITION BY I_PG_EMPLOYEE.EMPLOYEECODE, PERIODNUMBER
          ORDER BY DATEOFSAFETEAMMEETING) = 1   AND   -- ONLY COUNT EMPLOYEES IF THEY
          HAVE ATTENDED A MEETING THAT MONTH.   MEETINGID IS NOT NULL  THEN 1  ELSE
          0 END
