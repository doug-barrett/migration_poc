            FROM {{ ref('NP','F_RETAILERBILLINGDETAILS') }} F_RETAILERBILLINGDETAILS
              LEFT OUTER JOIN D_RETAILERBILLINGFILE
                ON F_RETAILERBILLINGDETAILS.D_RETAILERBILLINGFILE_KEY = D_RETAILERBILLINGFILE.D_RETAILERBILLINGFILE_KEY
              LEFT OUTER JOIN D_ICPTARIFF
