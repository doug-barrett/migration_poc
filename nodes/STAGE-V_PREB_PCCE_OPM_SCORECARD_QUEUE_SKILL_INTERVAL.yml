    sourceMapping:
      - aliases:
          V_PREB_PCCE_OPM_SCORECARD_QUEUE_SKILL_INTERVAL: e37d982f-b96b-4bf2-90af-3a412c0b6fd6
          STAGE_INTERVALS: e5aec9dc-38f0-443e-b8d2-53ab340464ae
          BVSTG_PCCE_QUEUE_SKILL_GROUP_INTERVAL: afc055ad-767d-4b56-b8ce-a93a65921bbb
          DS_PCCE_SKILL_PQUEUE_MAPPING: 9b261141-77ef-4b17-be8f-0d0d5d8d9668
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE
             OR REPLACE VIEW {{ ref_no_link('STAGE','V_PREB_PCCE_OPM_SCORECARD_QUEUE_SKILL_INTERVAL') }} AS SELECT SKILL_QUEUE ,
                   LEVEL1 ,
                   LEVEL2 ,
                   LEVEL3 ,
                   LEVEL4 ,
                   LEVEL5 ,
                   stage_intervals.StartDate StartDate ,
                   SUM(bvstg_pcce_queue_skill_group_interval.AnswerWaitTime) AS AnswerWaitTime ,
                   SUM(bvstg_pcce_queue_skill_group_interval.CallsAnswered) AS CallsAnswered ,
                   SUM(bvstg_pcce_queue_skill_group_interval.talkTime) AS talkTime ,
                   SUM(bvstg_pcce_queue_skill_group_interval.HoldTime) AS HoldTime ,
                   SUM(bvstg_pcce_queue_skill_group_interval.callsoffered) AS CallsOfferedRouted ,
                   SUM(bvstg_pcce_queue_skill_group_interval.RouterCallsAbandQ) + SUM(bvstg_pcce_queue_skill_group_interval.RouterCallsAbandToAgent) AS RouterCallsAbandQ ,
                   SUM(bvstg_pcce_queue_skill_group_interval.ServiceLevelCalls) AS ServiceLevelCalls ,
                   DIV0(SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.ServiceLevelCalls, 0)), SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.CallsHandled, 0))) servicelLevel ,
                   0 AS OverflowOut ,
                   sum(IFNULL(bvstg_pcce_queue_skill_group_interval.TalkTime, 0)) / NULLIF(sum(IFNULL(bvstg_pcce_queue_skill_group_interval.CallsHandled, 0)), 0) AS aat ,
                   sum(IFNULL(bvstg_pcce_queue_skill_group_interval.handledcallstime, 0)) / NULLIF(SUM(bvstg_pcce_queue_skill_group_interval.CallsAnswered), 0) AS aht ,
                   sum(bvstg_pcce_queue_skill_group_interval.AnswerWaitTime) / NULLIF(sum(bvstg_pcce_queue_skill_group_interval.CallsAnswered), 0) AS asa ,
                   MAX(bvstg_pcce_queue_skill_group_interval.RouterMaxCallWaitTime) AS lwt ,
                   (SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.RouterCallsAbandQ, 0)) + SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.RouterCallsAbandToAgent, 0))) AS CallsAbanACD ,
                   (SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.CallsHandled, 0)) + SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.RouterCallsAbandQ, 0)) + SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.RouterError, 0)) + SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.RouterCallsDequeued, 0)) + SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.RouterCallsAbandToAgent, 0)) + SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.RedirectNoAnsCalls, 0))) AS CallsHandledACD ,
                   SUM(CASE WHEN IFNULL(ServiceLevelType, 0) = 0 THEN 0 WHEN IFNULL(ServiceLevelType, 0) = 1 THEN IFNULL(ServiceLevelCalls, 0) WHEN IFNULL(ServiceLevelType, 0) = 2 THEN IFNULL(ServiceLevelCalls, 0) WHEN IFNULL(ServiceLevelType, 0) = 3 THEN IFNULL(ServiceLevelCalls, 0) + IFNULL(ServiceLevelCallsAband, 0) ELSE 0 END) N_Answered_Acd_Svc_Lvl ,
                   SUM(CASE WHEN IFNULL(ServiceLevelType, 0) = 0 THEN 0 WHEN IFNULL(ServiceLevelType, 0) = 1 THEN IFNULL(ServiceLevelCallsOffered, 0) - IFNULL(RouterCallsDequeued, 0) - IFNULL(RouterCallsAbandDequeued, 0) - IFNULL(ServiceLevelCallsAband, 0) WHEN IFNULL(ServiceLevelType, 0) = 2 THEN IFNULL(ServiceLevelCallsOffered, 0) - IFNULL(RouterCallsDequeued, 0) - IFNULL(RouterCallsAbandDequeued, 0) WHEN IFNULL(ServiceLevelType, 0) = 3 THEN IFNULL(ServiceLevelCallsOffered, 0) - IFNULL(RouterCallsDequeued, 0) - IFNULL(RouterCallsAbandDequeued, 0) ELSE 0 END) N_Entered_Acd ,
                   sum(IFNULL(bvstg_pcce_queue_skill_group_interval.HandledCallsTime, 0)) AS HandledCallsTime ,
                   SUM(WorkReadyTime) WorkReadyTime ,
                   SUM(WorkNotReadyTime) WorkNotReadyTime ,
                   SUM(availtime) availabletime ,
                   SUM(notreadytime) notreadytime ,
                   SUM(loggedontime) loggedontime ,
                   MIN(bvstg_pcce_queue_skill_group_interval.DSS_UPDATE_TIME) DSS_UPDATE_TIME ,
                   SUM(IFNULL(bvstg_pcce_queue_skill_group_interval.CallsHandled, 0)) AS CallsHandled
              FROM {{ ref('STAGE','STAGE_INTERVALS') }} stage_intervals
              LEFT JOIN {{ ref('STAGE','BVSTG_PCCE_QUEUE_SKILL_GROUP_INTERVAL') }} bvstg_pcce_queue_skill_group_interval
                ON bvstg_pcce_queue_skill_group_interval.Interval >= stage_intervals.StartDate
               AND bvstg_pcce_queue_skill_group_interval.Interval < stage_intervals.EndDate
              LEFT JOIN (
                    SELECT DISTINCT ds_pcce_skill_pqueue_mapping.SKILL_QUEUE,
                           ds_pcce_skill_pqueue_mapping.LEVEL1,
                           ds_pcce_skill_pqueue_mapping.LEVEL2,
                           ds_pcce_skill_pqueue_mapping.LEVEL3,
                           ds_pcce_skill_pqueue_mapping.LEVEL4,
                           ds_pcce_skill_pqueue_mapping.LEVEL5,
                           ds_pcce_skill_pqueue_mapping.QueueType,
                           ds_pcce_skill_pqueue_mapping.DELETED
                      FROM {{ ref('EDW','DS_PCCE_SKILL_PQUEUE_MAPPING') }}
                   ) ds_pcce_skill_pqueue_mapping
                ON (bvstg_pcce_queue_skill_group_interval.FullName = ds_pcce_skill_pqueue_mapping.SKILL_QUEUE AND ds_pcce_skill_pqueue_mapping.deleted = 0 AND ds_pcce_skill_pqueue_mapping.QueueType = 'SKILL')
             WHERE DATE (stage_intervals.StartDate) BETWEEN (
                    SELECT MIN(interval)
                      FROM {{ ref('STAGE','BVSTG_PCCE_QUEUE_SKILL_GROUP_INTERVAL') }}
                   ) AND (
                    SELECT MAX(interval)
                      FROM {{ ref('STAGE','BVSTG_PCCE_QUEUE_SKILL_GROUP_INTERVAL') }}
                   )
             GROUP BY ds_pcce_skill_pqueue_mapping.SKILL_QUEUE ,
                      ds_pcce_skill_pqueue_mapping.LEVEL1 ,
                      ds_pcce_skill_pqueue_mapping.LEVEL2 ,
                      ds_pcce_skill_pqueue_mapping.LEVEL3 ,
                      ds_pcce_skill_pqueue_mapping.LEVEL4 ,
                      ds_pcce_skill_pqueue_mapping.LEVEL5 ,
                      stage_intervals.StartDate
             ORDER BY stage_intervals.StartDate
        dependencies:
          - locationName: EDW
            nodeName: DS_OPM_LOB_QUEUE_MAPPING
          - locationName: STAGE
            nodeName: STAGE_INTERVALS
          - locationName: STAGE
            nodeName: BVSTG_PCCE_QUEUE_SKILL_GROUP_INTERVAL
          - locationName: EDW
            nodeName: DS_PCCE_SKILL_PQUEUE_MAPPING
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_OPM_LOB_QUEUE_MAPPING') }}
            {{ ref('STAGE','STAGE_INTERVALS') }}
