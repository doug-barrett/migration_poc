            transform: CASE -- WHEN COMPLETED AND NOT OVERDUE    WHEN ENDSTATUSDATE IS NULL AND     DUEDATE > GETDATE() THEN REMAININGMINUTES    --NOT COMPLETED AND OVERDUE    WHEN ENDSTATUSDATE IS NULL AND     DUEDATE < GETDATE() THEN -(DATEDIFF(MINUTE, MIN(DUEDATE), GETDATE()) - SUM(CASE      WHEN D_DATE.WEEKDAYFLAG = 'N' OR       D_DATE.NZPUBLICHOLIDAYFLAG = 'Y' THEN 1440      ELSE 0     END))    -- WHEN COMPLETED AND NOT OVER SLA    WHEN ENDSTATUSDATE IS NOT NULL AND     ENDSTATUSDATE < DUEDATE THEN CASE      WHEN SALESTYPECODE = '210' THEN 7200      WHEN SALESTYPECODE = '205' THEN 14400      WHEN SALESTYPECODE = '315' THEN 21600      ELSE 0     END     - DURATIONMINUTES    -- WHEN COMPLETED AND OVER SLA DATE    ELSE -(DATEDIFF(MINUTE, DUEDATE, ENDSTATUSDATE) - SUM(CASE      WHEN D_DATE.WEEKDAYFLAG = 'N' OR       D_DATE.NZPUBLICHOLIDAYFLAG = 'Y' THEN 1440      ELSE 0     END))   END
