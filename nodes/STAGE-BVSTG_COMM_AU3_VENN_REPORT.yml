        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT bvstg_comm_au2_venn_report.*,
                   V_S_SPLC_BASICPOLINFO_CURRENT.invalidflag --from  bvstg_comm_au2_venn_report    from {{ ref('STAGE','BVSTG_COMM_AU2_VENN_REPORT') }}    left join    (select distinct polno, V_S_SPLC_COMPANY_CURRENT.name, DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.policynumberformatted,         DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.Carrierdisplayname, 'Invalidpolicies' invalidflag     from     (select distinct polno, HK_H_BASICPOLINFO, COCODE, RENEWALRPTFLAG, STATUS     --from "RETAIL_PROD"."SCH_BVSTAGE"."V_S_SPLC_BASICPOLINFO_CURRENT"     from {{ ref('STAGE','V_S_SPLC_BASICPOLINFO_CURRENT') }}    )  V_S_SPLC_BASICPOLINFO_CURRENT    left JOIN     (select distinct HK_H_BASICPOLINFO      --from "RETAIL_PROD"."SCH_DATA_VAULT"."H_SPLC_BASICPOLINFO"     from {{ ref('DATA_VAULT','H_SPLC_BASICPOLINFO') }}     ) H_SPLC_BASICPOLINFO    on V_S_SPLC_BASICPOLINFO_CURRENT.HK_H_BASICPOLINFO = H_SPLC_BASICPOLINFO.HK_H_BASICPOLINFO     left join    (select distinct COCODE, HK_H_COMPANY      --from "RETAIL_PROD"."SCH_DATA_VAULT"."H_SPLC_COMPANY"     from {{ ref('DATA_VAULT','H_SPLC_COMPANY') }}     )  H_SPLC_COMPANY   ON V_S_SPLC_BASICPOLINFO_CURRENT.COCODE = H_SPLC_COMPANY.COCODE     left JOIN    (select distinct  HK_H_COMPANY, name      --from "RETAIL_PROD"."SCH_BVSTAGE"."V_S_SPLC_COMPANY_CURRENT"     from {{ ref('STAGE','V_S_SPLC_COMPANY_CURRENT') }}      ) V_S_SPLC_COMPANY_CURRENT    ON H_SPLC_COMPANY.HK_H_COMPANY = V_S_SPLC_COMPANY_CURRENT.HK_H_COMPANY     left JOIN    (select distinct policynumber_edw, carriername_edw, policynumberformatted, carrierdisplayname      --from "RETAIL_PROD"."SCH_EDW"."DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF"    ---used _BF table     from {{ ref('EDW','DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES_BF') }}     ) DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES   ON V_S_SPLC_BASICPOLINFO_CURRENT.polno = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.policynumber_edw   and V_S_SPLC_COMPANY_CURRENT.name = DS_BVSTG_COMM_POLICYNUMBERFORMATTING_ALLSOURCES.carriername_edw    where V_S_SPLC_BASICPOLINFO_CURRENT.RENEWALRPTFLAG IN ('Q', 'T') OR V_S_SPLC_BASICPOLINFO_CURRENT.STATUS= 'D'    ) V_S_SPLC_BASICPOLINFO_CURRENT     on bvstg_comm_au2_venn_report.Policynumberformatted=V_S_SPLC_BASICPOLINFO_CURRENT.policynumberformatted    and bvstg_comm_au2_venn_report.Carrier=V_S_SPLC_BASICPOLINFO_CURRENT.Carrierdisplayname    ) bvstg_comm_au2_venn_report        left join    (select PolicyNumberformatted, carrierdisplayname, sum(premium) TotalPremium      from      (SELECT DISTINCT V_S_SPLC_BASICPOLINFO_CURRENT.POLNO, V_S_SPLC_BASICPOLINFO_CURRENT.POLTYPELOB, V_S_SPLC_BASICPOLINFO_CURRENT.POLEFFDATE,       V_S_SPLC_BASICPOLINFO_CURRENT.POLEXPDATE, H_SPLC_POLICYTRANPREMIUM.POLID, PREMIUM, name      --FROM "RETAIL_PROD"."SCH_DATA_VAULT"."H_SPLC_POLICYTRANPREMIUM" H_SPLC_POLICYTRANPREMIUM      FROM {{ ref('DATA_VAULT','H_SPLC_POLICYTRANPREMIUM') }}  H_SPLC_POLICYTRANPREMIUM       --left JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_S_SPLC_POLICYTRANPREMIUM_CURRENT" V_S_SPLC_POLICYTRANPREMIUM_CURRENT      left join {{ ref('STAGE','V_S_SPLC_POLICYTRANPREMIUM_CURRENT') }} V_S_SPLC_POLICYTRANPREMIUM_CURRENT     ON H_SPLC_POLICYTRANPREMIUM.HK_H_POLICYTRANPREMIUM = V_S_SPLC_POLICYTRANPREMIUM_CURRENT.HK_H_POLICYTRANPREMIUM    --left JOIN "RETAIL_PROD"."SCH_DATA_VAULT"."H_SPLC_BASICPOLINFO" H_SPLC_BASICPOLINFO      left join {{ ref('DATA_VAULT','H_SPLC_BASICPOLINFO') }} H_SPLC_BASICPOLINFO    ON H_SPLC_POLICYTRANPREMIUM.POLID = H_SPLC_BASICPOLINFO.POLID       --left JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_S_SPLC_BASICPOLINFO_CURRENT" V_S_SPLC_BASICPOLINFO_CURRENT      left join {{ ref('STAGE','V_S_SPLC_BASICPOLINFO_CURRENT') }}  V_S_SPLC_BASICPOLINFO_CURRENT     ON H_SPLC_BASICPOLINFO.HK_H_BASICPOLINFO=V_S_SPLC_BASICPOLINFO_CURRENT.HK_H_BASICPOLINFO       --left join "RETAIL_PROD"."SCH_DATA_VAULT"."H_SPLC_COMPANY" H_SPLC_COMPANY      left join {{ ref('DATA_VAULT','H_SPLC_COMPANY') }}  H_SPLC_COMPANY     ON V_S_SPLC_BASICPOLINFO_CURRENT.COCODE=H_SPLC_COMPANY.COCODE
