        nodeName: DWSA_OR_OPT_CONVERT
      - locationName: BRONZE
        nodeName: DW_TRNX_TYPE
      - locationName: BRONZE
        nodeName: REF360_STATE
      join:
        joinCondition: 'FROM {{ ref(''BRONZE'', ''DW_CONTRACT'') }} dw_contract

          LEFT JOIN {{ ref(''BRONZE'', ''OR_DCASH'') }} or_dcash ON or_dcash.CSH_POL_NUM = dw_contract.CONTRACT_ID /* Detail Outer Join */

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT_OPTION'') }} ulkp_dw_product_option ON ulkp_dw_product_option.PRODUCT_KEY = dw_contract.product_key AND ulkp_dw_product_option.PRODUCT_OPTION_CODE = CASE WHEN (or_dcash.csh_sd_ben_type IS NULL) or or_dcash.csh_sd_ben_type=''SPR'' THEN ''NA'' ELSE or_dcash.csh_sd_ben_type END

          LEFT JOIN {{ ref(''BRONZE'', ''DWSA_OR_OPT_CONVERT'') }} ulkp_dwsa_or_opt_convert ON ulkp_dwsa_or_opt_convert.COUNTRY_CODE = (DECODE(or_dcash.csh_branch_code,''3'', ''NZL'',''AUS'')) AND ulkp_dwsa_or_opt_convert.STAT_FUND_CODE = dw_contract.csh_stat_fund AND ulkp_dwsa_or_opt_convert.UNIT_CLASS = dw_contract.csh_unit_class

          LEFT JOIN {{ ref(''BRONZE'', ''DW_PRODUCT_OPTION'') }} ulkp_dw_product_option_2 ON ulkp_dw_product_option_2.PRODUCT_KEY = dw_contract.product_key AND ulkp_dw_product_option_2.PRODUCT_OPTION_CODE = (CASE WHEN dw_contract.csh_prod_category=''CI'' THEN ''dummy'' ELSE ulkp_dwsa_or_opt_convert.INVEST_OPT_CODE END)

          LEFT JOIN {{ ref(''BRONZE'', ''DW_TRNX_TYPE'') }} ulkp_dw_trnx_type ON ulkp_dw_trnx_type.SOURCE_TRNX_TYPE_CODE = or_dcash.csh_sd_basis_method ||or_dcash.csh_sd_standalone_ind||or_dcash.csh_sd_type||or_dcash.csh_sd_amp_pay_ind AND ulkp_dw_trnx_type.BUSN_LINE = dw_contract.csh_prod_category

          LEFT JOIN {{ ref(''BRONZE'', ''REF360_STATE'') }} ulkp_ref360_state ON ulkp_ref360_state.CODE = dw_contract.csh_sd_state_code

          LEFT JOIN {{ ref(''BRONZE'', ''DW_TRNX_TYPE'') }} ulkp_dw_trnx_type_2 ON ulkp_dw_trnx_type_2.SOURCE_TRNX_TYPE_CODE = ''MGR'' AND ulkp_dw_trnx_type_2.BUSN_LINE = dw_contract.csh_prod_category

          LEFT JOIN {{ ref(''BRONZE'', ''DW_TRNX_TYPE'') }} ulkp_dw_trnx_type_3 ON ulkp_dw_trnx_type_3.SOURCE_TRNX_TYPE_CODE = ''BRK'' AND ulkp_dw_trnx_type_3.BUSN_LINE = dw_contract.csh_prod_category

          LEFT JOIN {{ ref(''BRONZE'', ''DW_TRNX_TYPE'') }} ulkp_dw_trnx_type_4 ON ulkp_dw_trnx_type_4.SOURCE_TRNX_TYPE_CODE = dw_contract.csh_cash_cause||or_dcash.csh_report_ind AND ulkp_dw_trnx_type_4.BUSN_LINE = dw_contract.csh_prod_category

          LEFT JOIN {{ ref(''BRONZE'', ''DW_TRNX_TYPE'') }} ulkp_dw_trnx_type_5 ON ulkp_dw_trnx_type_5.SOURCE_TRNX_TYPE_CODE = dw_contract.csh_cash_cause||or_dcash.csh_trans_ind AND ulkp_dw_trnx_type_5.BUSN_LINE = dw_contract.csh_prod_category'
      name: source1
      noLinkRefs: []
