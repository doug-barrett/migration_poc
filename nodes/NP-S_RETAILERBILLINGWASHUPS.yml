    sourceMapping:
      - aliases:
          I_RETAILERBILLINGWASHUPSUMMARY: 301e78b1-f39a-4d19-bbae-1563350165bd
          D_BILLEDDATE: aa12de44-6873-4394-95df-eafdd350373f
        customSQL:
