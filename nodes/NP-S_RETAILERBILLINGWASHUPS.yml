    sourceMapping:
      - aliases:
          I_RETAILERBILLINGWASHUPSUMMARY: 642cc1ac-fa2b-4b38-ba75-d12e996fff5a
          D_BILLEDDATE: 91370822-5a35-430c-9d70-6e2b621d420b
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: NP
            nodeName: D_BILLEDDATE
          - locationName: NP
            nodeName: I_RETAILERBILLINGWASHUPSUMMARY
        join:
          joinCondition: |-
            FROM {{ ref('NP','I_RETAILERBILLINGWASHUPSUMMARY') }} I_RETAILERBILLINGWASHUPSUMMARY
              LEFT OUTER JOIN D_RETAILERBILLINGFILE
                ON I_RETAILERBILLINGWASHUPSUMMARY.RECIPIENTCODE = D_RETAILERBILLINGFILE.RECIPIENTCODE
               AND I_RETAILERBILLINGWASHUPSUMMARY.SENDERCODE = D_RETAILERBILLINGFILE.SENDERCODE
               AND I_RETAILERBILLINGWASHUPSUMMARY.CONSUMPTIONMONTH = D_RETAILERBILLINGFILE.REPORTMONTH
               AND I_RETAILERBILLINGWASHUPSUMMARY.WASHUPMONTH = D_RETAILERBILLINGFILE.WASHUPMONTH
               AND ((I_RETAILERBILLINGWASHUPSUMMARY.HHRTAG = 'NHH' AND D_RETAILERBILLINGFILE.FILETYPE != 'ICPHHR') OR (I_RETAILERBILLINGWASHUPSUMMARY.HHRTAG = 'HHR' AND D_RETAILERBILLINGFILE.FILETYPE = 'ICPHHR'))
              LEFT OUTER JOIN D_DATE
                ON I_RETAILERBILLINGWASHUPSUMMARY.CONSUMPTIONMONTH + '01' = D_DATE.D_DATE_KEY
              LEFT OUTER JOIN {{ ref('NP','D_BILLEDDATE') }}
                ON I_RETAILERBILLINGWASHUPSUMMARY.D_BILLEDDATE_KEY = D_BILLEDDATE.D_BILLEDDATE_KEY
        name: S_RETAILERBILLINGWASHUPS
