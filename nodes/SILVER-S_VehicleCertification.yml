      join:
        joinCondition: |-
          FROM {{ ref('SILVER', 'I_VehicleCertification') }} "I_VEHICLECERTIFICATI"
          LEFT JOIN {{ ref('SILVER', 'D_OBLIGATI') }} "D_OBLIGATI"
            ON --ONLY CODED TO ONE OBLIGATION AND FOR ONLY ONE RISK TYPE TO STOP DUPLICATES RISK CODE = PREVENTATIVE MAINTENANCE ON OBLIGATIONCODE = '42' AND D_RISK.RISKCODE = 776 AND D_VEHICLESERVICETYPE.SERVICETYPE IN ('WOF', 'COF') --SPECIFIC VERIFICATION AND ONLY WHEN THERE IS AN OBLIGATION
          LEFT JOIN {{ ref('GOLD', 'D_ObligationVerificationType') }} "D_ObligationVerificationType"
            ON VERIFICATIONTYPE = 'CUSTOM - VEHICLE CERTIFICATION' AND D_OBLIGATION_KEY IS NOT NULL
          LEFT JOIN {{ ref('GOLD', 'D_Vehicle') }} "D_Vehicle"
            ON "I_VehicleCertification"."FleetNumber" = "D_Vehicle"."VehicleNumber"
          LEFT JOIN {{ ref('GOLD', 'D_Employee') }} "D_Employee"
            ON "I_VehicleCertification"."DriverCode" = "D_Employee"."EmployeeCode"
          LEFT JOIN {{ ref('GOLD', 'D_BusinessUnit') }} "D_BusinessUnit"
            ON "I_VehicleCertification"."BusinessUnitCode" = "D_BusinessUnit"."BusinessUnitCode"
          LEFT JOIN {{ ref('GOLD', 'D_Risk') }} "D_Risk"
          LEFT JOIN {{ ref('GOLD', 'D_VehicleServiceType') }} "D_VehicleServiceType"
