        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2
        join:
          joinCondition: |-
            FROM (
                    SELECT *
                      FROM (
                            SELECT BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2.*,
                                   t2.session_flag
                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2 BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2
                              LEFT JOIN (
                                    SELECT coalesce(t1.sessionid_final, t2.sessionid_final) AS sessionid_final,
                                           coalesce(t1.agent, t2.agent) AS agent,
                                           CASE WHEN t1.sessionid_final IS NULL AND t2.sessionid_final IS NOT NULL     THEN 'Only AppOne'
                                                WHEN t1.sessionid_final IS NOT NULL AND t2.sessionid_final IS NULL     THEN 'Only CISCO'
                                                WHEN t1.sessionid_final IS NOT NULL AND t2.sessionid_final IS NOT NULL THEN 'Both'
                                                ELSE 'check'
                                                 END AS session_flag
                                      FROM (
                                            SELECT DISTINCT sessionid_final,
                                                   agent
                                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2
                                             WHERE source_data IN ('cisco')
                                           ) AS t1
                                      FULL OUTER JOIN (
                                            SELECT DISTINCT sessionid_final,
                                                   agent
                                              FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2
                                             WHERE source_data IN ('app one')
                                           ) AS t2
                                        ON t2.sessionid_final = t1.sessionid_final
                                       AND t2.agent = t1.agent
                                   ) AS t2
                                ON t2.sessionid_final = BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2.sessionid_final
                               AND t2.agent = BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2.agent
                             WHERE BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2.sessionid_final IS NOT NULL
                           )
                     WHERE session_flag IN ('Both')
                   ) BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2
             INNER JOIN (
                    SELECT sessionid_final,
                           count(DISTINCT phonenumber_final) AS tot_phone
                      FROM (
                            SELECT *
                              FROM (
                                    SELECT BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2.*,
                                           t2.session_flag
                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2 BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2
                                      LEFT JOIN (
                                            SELECT coalesce(t1.sessionid_final, t2.sessionid_final) AS sessionid_final,
                                                   coalesce(t1.agent, t2.agent) AS agent,
                                                   CASE WHEN t1.sessionid_final IS NULL AND t2.sessionid_final IS NOT NULL     THEN 'Only AppOne'
                                                        WHEN t1.sessionid_final IS NOT NULL AND t2.sessionid_final IS NULL     THEN 'Only CISCO'
                                                        WHEN t1.sessionid_final IS NOT NULL AND t2.sessionid_final IS NOT NULL THEN 'Both'
                                                        ELSE 'check'
                                                         END AS session_flag
                                              FROM (
                                                    SELECT DISTINCT sessionid_final,
                                                           agent
                                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2
                                                     WHERE source_data IN ('cisco')
                                                   ) AS t1
                                              FULL OUTER JOIN (
                                                    SELECT DISTINCT sessionid_final,
                                                           agent
                                                      FROM RETAIL_DEV.SCH_BVSTAGE.BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2
                                                     WHERE source_data IN ('app one')
                                                   ) AS t2
                                                ON t2.sessionid_final = t1.sessionid_final
                                               AND t2.agent = t1.agent
                                           ) AS t2
                                        ON t2.sessionid_final = BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2.sessionid_final
                                       AND t2.agent = BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2.agent
                                     WHERE BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2.sessionid_final IS NOT NULL
                                   )
                             WHERE session_flag IN ('Both')
                           ) BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2
                     GROUP BY 1
                   ) base_table
                ON BVSTG_PMKT_AU2_ATLAS_CISCO_CONSOLIDATED_FINAL_2.sessionid_final = base_table.sessionid_final
               AND base_table.tot_phone = 1
