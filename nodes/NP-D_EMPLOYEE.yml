            transform: |-
              CASE WHEN I_PG_EMPLOYEE.BIRTHDATE IS NULL                          THEN 'UNKNOWN'
                          WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 240 THEN '< 20'
                          WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 360 THEN '20 - 29'
