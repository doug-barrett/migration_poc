            transform: --THERE IS A LITTLE ERROR USING THE MONTH CALCULATION (BUT BETTER THAN THE YEAR CALCULATION)  -- SO I HAVE MADE IT SO THAT PEOPLE DON'T GO UP INTO THE NEXT AGE BRACKET UNTIL THE  -- END OF THE MONTH OF THEIR BIRTHDAY.  CASE   WHEN I_PG_EMPLOYEE.BIRTHDATE IS NULL THEN 'UNKNOWN'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 240 THEN '< 20'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 300 THEN '20 - 24'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 360 THEN '25 - 29'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 420 THEN '30 - 34'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 480 THEN '35 - 39'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 540 THEN '40 - 44'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 600 THEN '45 - 49'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 660 THEN '50 - 54'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 720 THEN '55 - 59'   WHEN DATEDIFF(MONTH,I_PG_EMPLOYEE.BIRTHDATE,GETDATE()) <= 780 THEN '60 - 64'   ELSE '65+'  END
