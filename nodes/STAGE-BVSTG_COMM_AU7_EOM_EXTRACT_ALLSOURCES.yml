    sourceMapping:
      - aliases:
          BVSTG_COMM_AU6_EOM_EXTRACT_ALLSOURCES: 14056e7c-9274-4e99-a87d-ce5e4c757bf1
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: BVSTG_COMM_AU6_EOM_EXTRACT_ALLSOURCES
        join:
          joinCondition: |-
            EXTENDED
              FROM (SELECT DISTINCT bvstg_comm_au6_eom_extract_allsources.*,
                   nbs_transaction_id.nbtransactionid
              FROM (SELECT DISTINCT bvstg_comm_au6_eom_extract_allsources.* ,
                   ifnull(ds_comm_policy_office_mapping.sourcedb, 'Missing') AS PolicySource,
                   ds_bvstg_comm_termcleaning.Term,
                   ifnull(ds_comm_policy_office_mapping.Customer_Type, 'Missing') AS Customer_Type,
                   ds_comm_policy_office_mapping.EffectiveDate,
                   ds_comm_policy_office_mapping.ExpirationDate,
                   v_bvstg_comm_lob_mapping.LOB_Mapped AS LOB,
                   ds_comm_policy_office_mapping.OfficeCode,
                   ds_comm_policy_office_mapping.leadid,
                   ifnull(ds_comm_policy_office_mapping.customerid, concat(bvstg_comm_au6_eom_extract_allsources.policynumberformatted, ' ', bvstg_comm_au6_eom_extract_allsources.carrier)) AS customerid,
                   CASE WHEN ds_comm_policy_office_mapping.customerid IS NULL THEN 0
                        ELSE 1
                         END AS Customer_ID_Flag,
                   CASE WHEN lower(ifnull(ds_retail_office.channel,ifnull(sourcedb,'Missing'))) IN ('nsa','appone','cigh') THEN 'NSA'
                        WHEN lower(ifnull(ds_retail_office.channel,ifnull(sourcedb,'Missing'))) IN ('splc')                THEN 'SPLC'
                        WHEN lower(ifnull(ds_retail_office.channel,ifnull(sourcedb,'Missing'))) IN ('missing')             THEN 'Missing'
                        ELSE ifnull(ds_retail_office.channel,ifnull(sourcedb,'Missing'))
                         END AS RetailType,
                   ds_comm_policy_office_mapping.ProducerID,
                   CASE WHEN DS_RETAIL_OFFICE.brand like 'Acceptance%' AND firstrecorddate='2022-09-01' THEN date_trunc('month',startdate_cutoffpolicy)
                        ELSE firstrecorddate
                         END AS firstrecorddate_new,
                   MatchType,
                   islegacytransaction,
                   ifnull(DS_RAM_RETAIL_REPOSITORY.Premium_finance_flag,0) Premium_finance_flag
              FROM {{ ref('STAGE','BVSTG_COMM_AU6_EOM_EXTRACT_ALLSOURCES') }} bvstg_comm_au6_eom_extract_allsources
              LEFT JOIN (SELECT DISTINCT policynumberformatted,
                   carrierdisplayname,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN NULL
                        ELSE officecode_policy_match_first
                         END AS officecode,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN 'Missing'
                        ELSE sourcedb_policy_match_first
                         END AS sourcedb,
                   created_policy_match_first AS created,
                   effectivedate_policy_match_first AS effectivedate,
                   expirationdate_policy_match_first AS expirationdate,
                   customerno_policy_match_first AS customerno,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN NULL
                        ELSE customerid_policy_match_first
                         END AS customerid,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN 'Missing'
                        ELSE customer_type_policy_match_first
                         END AS customer_type,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN NULL
                        ELSE LineOFBusinessType_Policy_Match_First
                         END AS LineOFBusinessType,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN NULL
                        ELSE leadid_Policy_Match_First
                         END AS leadid,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN NULL
                        ELSE ProducerID_Policy_Match_First
                         END AS ProducerID,
                   CASE WHEN policynumberformatted IS NULL OR policynumberformatted IN ('NULL','0','') OR policynumberformatted like '9999999%' OR policynumberformatted like '100000000%' THEN 'Invalid_Policy'
                        ELSE MatchType_Policy_Match_First
                         END AS MatchType,
                   CASE WHEN policynumberformatted IS NULL
                OR policynumberformatted IN ('NULL','0','')
        name: BVSTG_COMM_AU7_EOM_EXTRACT_ALLSOURCES
        noLinkRefs: []
