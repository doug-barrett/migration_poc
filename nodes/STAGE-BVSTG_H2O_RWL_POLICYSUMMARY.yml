        join:
          joinCondition: |-
            EXTENDED
              FROM {{ ref('EDW','DS_POLICYSUMMARY_RENEWALS') }} ds_policysummary_renewals
              LEFT JOIN {{ ref('EDW','DS_CUSTOMERSUMMARY_V2') }} ds_customersummary_v2
                ON cast(ds_customersummary_v2.customerID AS varchar(60)) = ds_policysummary_renewals.customerID
               AND ds_customersummary_v2.SOURCEDB = ds_policysummary_renewals.SOURCEDB
              LEFT JOIN {{ ref('UNKNOWN','V_PREB_CARRIERMAPPING') }} v_preb_carriermapping
                ON v_preb_carriermapping.CarrierName = ds_policysummary_renewals.CarrierName
              LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                ON cast(ds_ap1_transactionsummary.transactionid AS varchar(60)) = ds_policysummary_renewals.transactionid
               AND ds_policysummary_renewals.sourcedb = 'AppOne'
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON cast(ds_retail_office.officecode AS varchar(60)) = ds_ap1_transactionsummary.biaprimaryagentoffice
              LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source
                ON cast(ds_mkt_lead_source.leadid AS varchar(60)) = ds_ap1_transactionsummary.leadid
               AND ds_mkt_lead_source.sourcedb = 'AppOne'
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON cast(ds_mkt_campaign.campaignid AS varchar(60)) = ds_mkt_lead_source.campaignid
