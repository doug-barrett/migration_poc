              LEFT JOIN {{ ref('EDW','DS_AP1_TRANSACTIONSUMMARY') }} ds_ap1_transactionsummary
                ON cast(ds_ap1_transactionsummary.transactionid AS varchar(60)) = ds_policysummary_renewals.transactionid
               AND ds_policysummary_renewals.sourcedb = 'AppOne'
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office
                ON cast(ds_retail_office.officecode AS varchar(60)) = ds_ap1_transactionsummary.biaprimaryagentoffice
              LEFT JOIN {{ ref('EDW','DS_MKT_LEAD_SOURCE') }} ds_mkt_lead_source
                ON cast(ds_mkt_lead_source.leadid AS varchar(60)) = ds_ap1_transactionsummary.leadid
               AND ds_mkt_lead_source.sourcedb = 'AppOne'
              LEFT JOIN {{ ref('EDW','DS_MKT_CAMPAIGN') }} ds_mkt_campaign
                ON cast(ds_mkt_campaign.campaignid AS varchar(60)) = ds_mkt_lead_source.campaignid
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_FEES_30DAYS_BEF_EXP') }} bvstg_h2o_rwl_au1_fees_30days_bef_exp
                ON bvstg_h2o_rwl_au1_fees_30days_bef_exp.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_PAYMENTS_30DAYS_BEF_EXP') }} bvstg_h2o_rwl_au1_payments_30days_bef_exp
                ON bvstg_h2o_rwl_au1_payments_30days_bef_exp.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_DRIVERS_30DAYS_BEF_EXP') }} bvstg_h2o_rwl_au1_drivers_30days_bef_exp
                ON bvstg_h2o_rwl_au1_drivers_30days_bef_exp.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_VEHICLE_30DAYS_BEF_EXP') }} bvstg_h2o_rwl_au1_vehicle_30days_bef_exp
                ON bvstg_h2o_rwl_au1_vehicle_30days_bef_exp.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_PREMIUMCHANGE_30DAYS_BEF_EXP') }} bvstg_h2o_rwl_au1_premiumchange_30days_bef_exp
                ON bvstg_h2o_rwl_au1_premiumchange_30days_bef_exp.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_CALLS_30DAYS_BEF_EXP') }} bvstg_h2o_rwl_au1_calls_30days_bef_exp
                ON bvstg_h2o_rwl_au1_calls_30days_bef_exp.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_LIABILITY_30DAYS_BEF_EXP') }} bvstg_h2o_rwl_au1_liability_30days_bef_exp
                ON bvstg_h2o_rwl_au1_liability_30days_bef_exp.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_CARRIERPREMIUM_30DAYS_BEF_EXP') }} bvstg_h2o_rwl_au1_carrierpremium_30days_bef_exp
                ON bvstg_h2o_rwl_au1_carrierpremium_30days_bef_exp.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_CDT_30DAYS_BEF_EXP') }} bvstg_h2o_rwl_au1_cdt_30days_bef_exp
                ON bvstg_h2o_rwl_au1_cdt_30days_bef_exp.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN {{ ref('STAGE','BVSTG_H2O_RWL_AU1_CREDIT_EXTENDED') }} bvstg_h2o_rwl_au1_credit_extended
                ON bvstg_h2o_rwl_au1_credit_extended.PR_ID = ds_policysummary_renewals.ID
              LEFT JOIN (
                    SELECT NBTransactionID,
                           TERMNUMBER,
                           MAX(Source_PolicyID) Source_PolicyID,
                           MIN(TRANSACTIONID)TRANSACTIONID
                      FROM {{ ref('EDW','DS_POLICYSUMMARY_RENEWALS') }}
                     WHERE TransactionID IS NOT NULL
                     GROUP BY NBTransactionID,
                              TERMNUMBER
                   )DS_POLICYSUMMARY_RENEWALS_NOEMPTY
                ON (ds_policysummary_renewals.NBTransactionID = DS_POLICYSUMMARY_RENEWALS_NOEMPTY.NBTransactionID AND DS_POLICYSUMMARY_RENEWALS_NOEMPTY.TERMNUMBER < ds_policysummary_renewals.TERMNUMBER)
              LEFT JOIN {{ ref('STAGE','V_PREB_H20_CLARITAS_7DAYS') }} v_preb_h20_claritas_7days
                ON cast(v_preb_h20_claritas_7days.customerid AS varchar(60)) = ds_policysummary_renewals.customerID
