        join:
          joinCondition: |-
            EXTENDED
              FROM ((
                    SELECT bvstg_comm_au1_confie_opm.monthyear,
                           bvstg_comm_au1_confie_opm.accounts_mapped,
                           ud2id,
                           ud1id,
                           CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY Accounts_Mapped,ud2id,ud1id ORDER BY monthyear)
                                ELSE values_month
                                 END AS values_month,
                           'Retail_Revenue_Budget' AS sg_description
                      FROM (
                            SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                                   accounts_mapped,
                                   ifnull(sum(values_month),0) values_month,
                                   ud2id,
                                   ud1id
                              FROM (
                                    SELECT bvstg_comm_au13_confie_opm.UD2ID,
                                           bvstg_comm_au13_confie_opm.UD1ID,
                                           bvstg_comm_au13_confie_opm.yearid,
                                           bvstg_comm_au13_confie_opm.accountid,
                                           ds_bvstg_comm_au16_confie_opm.accounts_mapped,
                                           bvstg_comm_au13_confie_opm.month,
                                           sum(ifnull(values_month,0)) Values_Month
                                      FROM {{ ref('UNKNOWN','BVSTG_COMM_AU13_CONFIE_OPM ') }} UNPIVOT (values_month FOR MONTH IN (M1VALUE,M2VALUE,M3VALUE,M4VALUE,M5VALUE,M6VALUE, M7VALUE,M8VALUE,M9VALUE,M10VALUE,M11VALUE,M12VALUE))
                                      LEFT JOIN {{ ref('EDW','DS_BVSTG_COMM_AU16_CONFIE_OPM') }} ds_bvstg_comm_au16_confie_opm
                                        ON bvstg_comm_au13_confie_opm.accountid=ds_bvstg_comm_au16_confie_opm.childid
                                     GROUP BY bvstg_comm_au13_confie_opm.UD2ID,
                                              bvstg_comm_au13_confie_opm.UD1ID,
                                              bvstg_comm_au13_confie_opm.yearid,
                                              bvstg_comm_au13_confie_opm.accountid,
                                              bvstg_comm_au13_confie_opm.month,
                                              ds_bvstg_comm_au16_confie_opm.accounts_mapped
                                   )
                             WHERE concat(ud2id,ud1id) IN (
                                    SELECT DISTINCT concat(ud2id,ud1id)
                                      FROM {{ ref('STAGE','BVSTG_COMM_AU18_CONFIE_OPM') }}
                                     WHERE sg_description= 'Retail_Revenue_Budget'
                                   )
                               AND accountid IN (
                                    SELECT DISTINCT childid
                                      FROM {{ ref('EDW','DS_BVSTG_COMM_AU16_CONFIE_OPM') }}
                                   )
                               AND monthyear<=dateadd('day',-1,date_trunc('month',CURRENT_DATE))
                             GROUP BY accounts_mapped,
                                      ud2id,
                                      ud1id,
                                      date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01'))
                           ) bvstg_comm_au1_confie_opm
                   )
            UNION ALL ( SELECT bvstg_comm_au2_confie_opm.monthyear,
                   bvstg_comm_au2_confie_opm.accounts_mapped,
                   ud2id,
                   ud1id,
                   CASE WHEN month(monthyear) <> 1 THEN values_month- lag(values_month) OVER (PARTITION BY Accounts_Mapped,ud2id,ud1id ORDER BY monthyear)
                        ELSE values_month
                         END AS values_month,
                   'MGA_Revenue_Budget' AS sg_description
              FROM ( SELECT DISTINCT date(concat(yearid,'-',replace(replace(MONTH,'M'),'VALUE'),'-01')) monthyear ,
                   accounts_mapped,
                   ifnull(sum(values_month),0) values_month,
                   ud2id,
                   ud1id
              FROM (
                    SELECT bvstg_comm_au13_confie_opm.UD2ID,
                           bvstg_comm_au13_confie_opm.UD1ID,
                           bvstg_comm_au13_confie_opm.yearid,
                           bvstg_comm_au13_confie_opm.accountid,
                           ds_bvstg_comm_au16_confie_opm.accounts_mapped,
                           bvstg_comm_au13_confie_opm.month,
                           sum(ifnull(values_month,0)) Values_Month
                      FROM {{ ref('STAGE','BVSTG_COMM_AU13_CONFIE_OPM') }} bvstg_comm_au13_confie_opm UNPIVOT (values_month FOR MONTH IN (M1VALUE,M2VALUE,M3VALUE,M4VALUE,M5VALUE,M6VALUE, M7VALUE,M8VALUE,M9VALUE,M10VALUE,M11VALUE,M12VALUE))
                      LEFT JOIN {{ ref('EDW','DS_BVSTG_COMM_AU16_CONFIE_OPM') }} ds_bvstg_comm_au16_confie_opm
                        ON bvstg_comm_au13_confie_opm.accountid=ds_bvstg_comm_au16_confie_opm.childid
                     GROUP BY bvstg_comm_au13_confie_opm.UD2ID,
                              bvstg_comm_au13_confie_opm.UD1ID,
                              bvstg_comm_au13_confie_opm.yearid,
                              bvstg_comm_au13_confie_opm.accountid,
                              bvstg_comm_au13_confie_opm.month,
                              ds_bvstg_comm_au16_confie_opm.accounts_mapped
                   )
             WHERE concat(ud2id,ud1id) IN (SELECT DISTINCT concat(ud2id,ud1id)
              FROM {{ ref('STAGE','BVSTG_COMM_AU18_CONFIE_OPM') }}
