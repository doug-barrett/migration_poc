        customSQL:
          customSQL: ""
        dependencies:
          - locationName: STAGE
            nodeName: V_DLBV_BOE_SALESCALENDAR_CURRENT
          - locationName: STAGE
            nodeName: BVSTG_AU10_RETAIL_RFG_EXTRACT
          - locationName: EDW
            nodeName: DS_AGENT_KEY
          - locationName: EDW
            nodeName: DS_RETAIL_OFFICE
          - locationName: EDW
            nodeName: DS_RAM_RETAIL_REPOSITORY
          - locationName: STAGE
            nodeName: V_DLBV_CPS_EMPLOYEESUPN_CURRENT
          - locationName: EDW
            nodeName: DS_HR_EMPLOYEEUNIQUE
        join:
          joinCondition: |-
            EXTENDED
              FROM (
                    SELECT DISTINCT SALESDATE My_Date,
                           DAYOFWEEK(SALESDATE) SALESDATE_WeekDay,
                           SALESDAYWEIGHT,
                           PYSALESDATE,
                           CASE WHEN SALESDAYWEIGHT IS NOT NULL THEN SALESDAYWEIGHT
                                ELSE CASE WHEN DAYOFWEEK(SALESDATE) = 0 THEN 0 WHEN DAYOFWEEK(SALESDATE) = 6 THEN 0.5 ELSE 1 END
                                 END AS SALESDAYWEIGHT_created
                      FROM {{ ref('STAGE','V_DLBV_BOE_SALESCALENDAR_CURRENT') }}
                   ) v_dlbv_boe_salescalendar_current //
              FROM "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_BOE_SALESCALENDAR_CURRENT") v_dlbv_boe_salescalendar_current
              LEFT JOIN {{ ref('STAGE','BVSTG_AU10_RETAIL_RFG_EXTRACT') }} //
              LEFT JOIN BVSTG_AU10_RETAIL_RFG_EXTRACT
                ON v_dlbv_boe_salescalendar_current.My_Date = bvstg_au10_retail_rfg_extract.date
              LEFT JOIN (
                    SELECT DISTINCT EmployeeNumber,
                           employeename,
                           officecode AS employee_assigned_office
                      FROM {{ ref('EDW','DS_AGENT_KEY') }} //
                      FROM "RETAIL_PROD"."SCH_EDW"."DS_AGENT_KEY"
                     WHERE Rank_EmployeeNumber=1 QUALIFY row_number() OVER (PARTITION BY employeenumber ORDER BY dss_create_time) = 1
                   ) ds_agent_key
                ON bvstg_au10_retail_rfg_extract.ProducerNumber = ds_agent_key.EmployeeNumber
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} DS_RETAIL_OFFICE_1 //
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" DS_RETAIL_OFFICE_1
                ON ifnull(ds_agent_key.employee_assigned_office,'-') = ifnull(DS_RETAIL_OFFICE_1.officecode,'-')
              LEFT JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} //
              LEFT JOIN "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE"
                ON ifnull(bvstg_au10_retail_rfg_extract.officecode,'-') = ifnull(ds_retail_office.officecode,'-')
              LEFT JOIN (
                    SELECT ifnull(ds_retail_office.OFFICECODE, ds_ram_retail_repository.OfficeCode) OfficeCode,
                           ifnull(StoreOpenDate_RR, OfficeOpenedDate) StoreOpenDate,
                           ds_retail_office.OfficeClosedDate StoreClosedDate,
                           TERRITORYEMPLOYEEID AS TERRITORYEMPLOYEEID,
                           AREAEMPLOYEEID AREAEMPLOYEEID,
                           DISTRICTEMPLOYEEID DISTRICTEMPLOYEEID,
                           CASE WHEN LocationSTatus like 'Closed%'         THEN 'Closed'
                                WHEN LocationStatus IN ('Open', 'Pending') THEN 'Open'
                                WHEN LocationStatus = 'Dark'               THEN 'Dark'
                                 END AS LocationStatus
                      FROM (
                            SELECT OfficeCode,
                                   min(to_date(createddate)) StoreOpenDate_RR
                              FROM {{ ref('EDW','DS_RAM_RETAIL_REPOSITORY') }} //
                              FROM "RETAIL_PROD"."SCH_EDW"."DS_RAM_RETAIL_REPOSITORY"
                             WHERE counter =1
                             GROUP BY officecode
                           ) ds_ram_retail_repository
                      FULL OUTER JOIN {{ ref('EDW','DS_RETAIL_OFFICE') }} ds_retail_office //
                      FULL OUTER JOIN "RETAIL_PROD"."SCH_EDW"."DS_RETAIL_OFFICE" ds_retail_office
                        ON ds_ram_retail_repository.officecode = ds_retail_office.officecode
                   ) ds_ram_retail_repository
                ON bvstg_au10_retail_rfg_extract.OfficeCode = ds_ram_retail_repository.OfficeCode
              LEFT JOIN (
                    SELECT DISTINCT SALESDATE,
                           DAYOFWEEK(SALESDATE) SALESDATE_WeekDay,
                           SALESDAYWEIGHT,
                           PYSALESDATE
                      FROM {{ ref('STAGE','V_DLBV_BOE_SALESCALENDAR_CURRENT') }}
                   ) V_DLBV_BOE_SALESCALENDAR_CURRENT_1 //
              FROM "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_BOE_SALESCALENDAR_CURRENT") V_DLBV_BOE_SALESCALENDAR_CURRENT_1
                ON bvstg_au10_retail_rfg_extract.date = to_date(v_dlbv_boe_salescalendar_current_1.PYSALESDATE)
              LEFT JOIN (
                    SELECT DISTINCT upn.EMPLOYEENUMBER,
                           emp.EMPLOYEENAME
                      FROM {{ ref('STAGE','V_DLBV_CPS_EMPLOYEESUPN_CURRENT') }} upn //
                      FROM "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_CPS_EMPLOYEESUPN_CURRENT" upn
                      JOIN (
                            SELECT DISTINCT EMPLOYEENUMBER,
                                   EMPLOYEENAME
                              FROM {{ ref('EDW','DS_HR_EMPLOYEEUNIQUE') }} //
                              FROM "RETAIL_PROD"."SCH_EDW"."DS_HR_EMPLOYEEUNIQUE"
                             WHERE islast = 1 QUALIFY ROW_NUMBER() OVER (PARTITION BY EMPLOYEENUMBER ORDER BY DSS_UPDATE_TIME DESC)=1
                           ) emp
                        ON upn.EMPLOYEENUMBER=emp.EMPLOYEENUMBER
                   ) v_dlbv_cps_employeesupn_current_1 --DM  on ds_retail_office.DISTRICTEMPLOYEEID = v_dlbv_cps_employeesupn_current_1.EmployeeNumber      left join   (SELECT DISTINCT upn.EMPLOYEENUMBER, emp.EMPLOYEENAME  from {{ ref('STAGE','V_DLBV_CPS_EMPLOYEESUPN_CURRENT') }} upn  //from "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_CPS_EMPLOYEESUPN_CURRENT" upn  join (SELECT DISTINCT EMPLOYEENUMBER, EMPLOYEENAME  from {{ ref('EDW','DS_HR_EMPLOYEEUNIQUE') }}  //from "RETAIL_PROD"."SCH_EDW"."DS_HR_EMPLOYEEUNIQUE"  WHERE islast =
        name: BVSTG_AU0_RETAIL_RFG_EXTRACT
        noLinkRefs: []
