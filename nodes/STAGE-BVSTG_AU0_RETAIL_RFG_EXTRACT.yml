          V_DLBV_BOE_SALESCALENDAR_CURRENT: 36274d3e-dc3a-4e9b-b8c8-136b0c7df257
          BVSTG_AU10_RETAIL_RFG_EXTRACT: 74070d86-3210-412b-b104-5c15b7557454
          DS_AGENT_KEY: 489968a6-2aa9-4c60-83b4-b001aab3e3a8
