              - columnCounter: 9c82d121-229b-47ea-bf82-4e5a6cd9b0b4
                stepCounter: c2382fe4-8840-4f7b-affb-098f98be982c
            transform: |-
              CASE WHEN ISNULL(I_PG_JOB.JOBCODE,'') = ''                            THEN -1
                          WHEN LEFT(I_PG_JOB.JOBCODE,2) IN ('WF','WG','TC','TF','CA','WA') THEN SUBSTRING(I_PG_JOB.JOBCODE,3,LEN(I_PG_JOB.JOBCODE))
                          WHEN I_PG_JOB.JOBCODE LIKE 'Z%'                                  THEN -1
                          ELSE CONVERT(VARCHAR(12),D_JOBNUMBER.WORKORDERNUMBER)
                           END
