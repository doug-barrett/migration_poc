                stepCounter: ce748ae5-b227-40b4-9144-6ab9135afb67
            transform: --WE WANT TO RECORD THE SAME VALUE AS POSTED TO F1 VIA LABOUR COSTING INTERFACE  -- BUT THERE WILL NEVER BE ANY SALARIED WORKERS IN THE PRODUCTIVITY DATA  CASE   --FOR ALLOWANCES WITH A VALID JOBCODE   WHEN ISNULL(I_PG_HISTORICALLOWANCE.JOBCODE,'') <> ''        AND I_PG_HISTORICALLOWANCE.JOBCODE NOT IN (SELECT PAIDHOURSTYPECODE FROM I_PAIDHOURSTYPE)    THEN CASE     WHEN LEFT(I_ALLOWANCE.XALLOWCAT,1) = '1'      THEN I_PG_EMPLOYEE.XRECOVRATE1 * I_PG_HISTORICALLOWANCE.QUANTITY     WHEN LEFT(I_ALLOWANCE.XALLOWCAT,1) = '2'      THEN I_PG_EMPLOYEE.XRECOVRATE2 * I_PG_HISTORICALLOWANCE.QUANTITY     WHEN LEFT(I_ALLOWANCE.XALLOWCAT,1) = '3'      THEN I_PG_EMPLOYEE.XRECOVRATE3 * I_PG_HISTORICALLOWANCE.QUANTITY     -- INCLUDE ANY ALLOWANCES THAT MAY HAVE BEEN COSTED TO A JOB     WHEN LEFT(I_ALLOWANCE.XALLOWCAT,1) = '5'      THEN I_PG_HISTORICALLOWANCE.TOTALAMOUNT     ELSE 0 END   ELSE 0 END
