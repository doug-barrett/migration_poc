                        FROM I_PAIDHOURSTYPE
                       WHERE PAIDHOURSCATEGORY = 'LEAVE'
                     ) THEN RIGHT(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,2) WHEN I_PG_HISTORICALLOWANCE.JOBCODE IN (
                      SELECT PAIDHOURSTYPECODE
