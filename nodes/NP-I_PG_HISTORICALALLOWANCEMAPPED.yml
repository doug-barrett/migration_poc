        name: INCLUDEFORPRODUCTIVITY
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: CASE WHEN --ONLY TAKE TRANSACTIONS FOR THE ALLOWANCES THAT AFFECT PRODUCTIVITY REPORTING    (LEFT(ISNULL(I_ALLOWANCE.XALLOWCAT,'0'),1) IN ('1','2','3','4','5')    --AUSTRALIAN RDO TAKEN NEEDS TO BE INCLUDED BUT IS NOT COUNTED AS LEAVE    -- AS THIS IS COUNTED WHEN THE RDO IS ACCRUED      OR (I_ALLOWANCE.ODSSOURCESYSTEMNAME = 'PAYGLOBALAUS'          AND I_ALLOWANCE.PAYING = 1))    --EXCLUDE WAGED WORKERS WHO DO NOT USE THE RECOVERY ACCOUNT E.G. CONTROL    AND I_PG_EMPLOYEE.EMPLOYEECOSTGROUP = 'FIELD STAFF' AND I_PG_EMPLOYEE.PAYPERIODCODE NOT IN ('FS', 'MD', 'NP', 'WCE.FS')  THEN 'INCLUDE'  ELSE 'EXCLUDE' END
