            transform: --FOR FIELD STAFF USE THE WORK DATE TO ASSIGN THE PERIOD  --FOR OFFICE BASED STAFF USE THE PERIOD END  -- THIS IS BECAUSE FIELD STAFF HAVE THEIR WAGES ACRUED INTO THE PERIOD  CASE  -- WHEN I_PG_EMPLOYEE.ITEMCODE = '7995'   WHEN I_PG_EMPLOYEE.EMPLOYEECOSTGROUP = 'FIELD STAFF'   AND I_PG_EMPLOYEE.PAYPERIODCODE NOT IN ('FS','MD','NP','WCE.FS')  --ON A FEW OCCASIONS THERE IS NO DATE FOR THE TRANSACTION IN THE SOURCE SYSTEM  THEN ISNULL(I_BMPLOADPERIOD.BMPLOADPERIODNO, I_BMPLOADPERIOD2.BMPLOADPERIODNO)  ELSE I_BMPLOADPERIOD2.BMPLOADPERIODNO  END
