            transform: --THE LAST 2 DIGITS OF THE JDE AND F1 ACCOUNTS ARE THE SAME  -- THERE ARE FOUR TYPES OF LABOUR, SO WE CAN HARD CODE THIS MAPPING  --FIRST CHECK FOR REDUNDANCY PAYMENTS AS THESE DON'T FOLLOW THESE RULES  -- AND CHECK FOR MISSING COST CENTRE CODES ON THE TRANSACTION E.G. TAX OVERIDES  CASE   WHEN I_PG_HISTORICALLOWANCE.COSTCENTRECODE IS NULL     THEN CASE WHEN LEFT(I_PG_EMPLOYEE.ITEMCODE,2) IN ('79','66') THEN '66'              WHEN LEFT(I_PG_EMPLOYEE.ITEMCODE,2) IN ('86','78') THEN '78'              WHEN LEFT(I_PG_EMPLOYEE.ITEMCODE,2) IN ('51','60') THEN '60'     ELSE '70'     END + RIGHT(I_PG_EMPLOYEE.ITEMCODE,2)   WHEN SUBSTRING(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,4,4) IN ('7923','8923')    THEN '7923'   WHEN SUBSTRING(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,4,2) IN ('79','66')    THEN '66' + RIGHT(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,2)   WHEN SUBSTRING(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,4,2) IN ('86','78')    THEN '78' + RIGHT(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,2)   WHEN SUBSTRING(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,4,2) IN ('51','60')    THEN '60' + RIGHT(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,2)   WHEN SUBSTRING(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,4,2) IN ('67','70')    THEN '70' + RIGHT(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,2)   -- USING THE SUBSTRING ALLOWS FOR THE BS ACCOUNTS USED FOR AUS LEAVE ACCRUALS   ELSE SUBSTRING(I_PG_HISTORICALLOWANCE.COSTCENTRECODE,4,4)  END
