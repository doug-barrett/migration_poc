    sourceMapping:
      - aliases:
          V_POSB_RENEWALS_NBPOLICY: a8c43520-e242-457f-8c3e-a2294c025dca
          DS_AMS_TRANSACTIONDETAIL: 4936a3c8-0f74-4387-9efa-a5a8cec1fedb
          BVSTG_CUSTOMER_TO_REFRESH: 7cbd0921-faef-4eb6-bdf6-f95f09598096
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_POSB_RENEWALS_NBPOLICY') }} AS SELECT ds_ams_transactiondetail.PolicyID ,
                   ds_ams_transactiondetail.policytype ,
                   MAX(ds_ams_transactiondetail.id) AS id ,
                   MAX(ds_ams_transactiondetail_nb.PolicyID) AS NBPolicyID ,
                   MAX(ds_ams_transactiondetail.PolicyNumber) AS PolicyNumber ,
                   MAX(ds_ams_transactiondetail.PolicyEffectiveDate) AS PolicyEffectiveDate ,
                   MAX(ds_ams_transactiondetail.PolicyExpirationDate) AS PolicyExpirationDate ,
                   MAX(ds_ams_transactiondetail.Status) AS Status ,
                   MAX(ds_ams_transactiondetail.StatusDate) AS StatusDate ,
                   MAX(ds_ams_transactiondetail.Company) AS Company ,
                   MAX(ds_ams_transactiondetail.CustomerAccountNumber) AS CustomerAccountNumber ,
                   MIN(TO_DATE(ds_ams_transactiondetail.TransactionDate)) AS TransactionDate
              FROM {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} ds_ams_transactiondetail
             INNER JOIN (
                    SELECT DISTINCT customerid
                      FROM {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
                     WHERE bvstg_customer_to_refresh.SourceDb = 'CIGH'
                   ) bvstg_customer_to_refresh
                ON bvstg_customer_to_refresh.customerid = ds_ams_transactiondetail.customerid
              LEFT JOIN {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }} ds_ams_transactiondetail_nb
                ON (ds_ams_transactiondetail.Company = ds_ams_transactiondetail_nb.Company AND ds_ams_transactiondetail.policytype = ds_ams_transactiondetail_nb.policytype AND ds_ams_transactiondetail.CustomerAccountNumber=ds_ams_transactiondetail_nb.CustomerAccountNumber AND ds_ams_transactiondetail_nb.modeid IN (12,32) AND (ds_ams_transactiondetail.PolicyNumber = ds_ams_transactiondetail_nb.PolicyNumber OR (ds_ams_transactiondetail_nb.Company like '%Affirmative%' AND left(ds_ams_transactiondetail.PolicyNumber,10) = left(ds_ams_transactiondetail_nb.PolicyNumber,10)) OR (ds_ams_transactiondetail_nb.Company like '%Founders%' AND right(ds_ams_transactiondetail.PolicyNumber,6) = right(ds_ams_transactiondetail_nb.PolicyNumber,6)) OR (ds_ams_transactiondetail_nb.Company like '%Unique%' AND right(ds_ams_transactiondetail.PolicyNumber,7) = right(ds_ams_transactiondetail_nb.PolicyNumber,7)) OR ((ds_ams_transactiondetail_nb.Company like '%American%' OR ds_ams_transactiondetail_nb.Company like '%American Freedom%') AND right(left(ds_ams_transactiondetail.PolicyNumber,10),7) = right(left(ds_ams_transactiondetail_nb.PolicyNumber,10),7)) OR (ds_ams_transactiondetail_nb.Company like '%United%' AND left(ds_ams_transactiondetail.PolicyNumber,4) = left(ds_ams_transactiondetail_nb.PolicyNumber,4) AND right(ds_ams_transactiondetail.PolicyNumber,6) = right(ds_ams_transactiondetail_nb.PolicyNumber,6)) OR (ds_ams_transactiondetail_nb.Company like '%USAgencies%' AND left(ds_ams_transactiondetail.PolicyNumber,7) = left(ds_ams_transactiondetail_nb.PolicyNumber,7)) OR (ds_ams_transactiondetail_nb.Company like '%National%' AND left(ds_ams_transactiondetail.PolicyNumber,10) = left(ds_ams_transactiondetail_nb.PolicyNumber,10)) OR (ds_ams_transactiondetail_nb.Company like '%Falcon%' AND left(ds_ams_transactiondetail.PolicyNumber,10) = left(ds_ams_transactiondetail_nb.PolicyNumber,10)) OR (ds_ams_transactiondetail_nb.Company like '%Traders%' AND left(ds_ams_transactiondetail.PolicyNumber,10) = left(ds_ams_transactiondetail_nb.PolicyNumber,10)) OR (ds_ams_transactiondetail_nb.Company like '%Echelon%' AND left(ds_ams_transactiondetail.PolicyNumber,11) = left(ds_ams_transactiondetail_nb.PolicyNumber,11))))
             WHERE ds_ams_transactiondetail.modeid IN (14,34)
               AND ds_ams_transactiondetail.PolicyType NOT IN ('Carrier Policy Fee','Package (P)')
               AND ds_ams_transactiondetail.BilledPremium > 0
             GROUP BY ds_ams_transactiondetail.PolicyID,
                      ds_ams_transactiondetail.policytype
        dependencies:
          - locationName: EDW
            nodeName: DS_AMS_TRANSACTIONDETAIL
          - locationName: STAGE
            nodeName: BVSTG_CUSTOMER_TO_REFRESH
        join:
          joinCondition: |-
            -- Nodes used in the SQL override:
            {{ ref('EDW','DS_AMS_TRANSACTIONDETAIL') }}
            {{ ref('STAGE','BVSTG_CUSTOMER_TO_REFRESH') }}
