    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies: []
        join:
          joinCondition: |-
            FROM (
                    WITH T1 AS (
                            SELECT DISTINCT (AGENT_NAME), LOWER(AGENT_NAME) AS KEY_AGENT_TL,
                                   LOWER(SPLIT_PART(AGENT_NAME, ' ', 1)) AS FIRSTNAME,
                                   MIN(DATE (CREATEAT)) AS FIRST_CREATEDATE,
                                   MAX(DATE (CREATEAT)) AS MAX_CREATEDATE
                              FROM RETAIL_PROD.SCH_BVSTAGE.V_DLBV_API_INSUREDMINE_TIMELINES_CURRENT
                             WHERE AGENT_NAME NOT IN (
                                    SELECT DISTINCT AGENT_NAME
                                      FROM DATA_ANALYTICS.DS_FEATURE_REPO.SUMMARY_EMPLOYEE_NUMBER_01
                                   )
                             GROUP BY 1
                           ),
                           EMPLOYEE_BATCH AS (
                            SELECT DISTINCT EMPLOYEENAME,
                                   EMPLOYEENUMBER,
                                   LOWER(SPLIT_PART(EMPLOYEENAME, ' ', 1)) AS FIRSTNAME
                              FROM RETAIL_PROD.SCH_BVSTAGE.V_PREB_IM_PRIMARY_AGENT_TM
                           ),
                           FUZZ_MATCH AS (
                            SELECT *,
                                   COUNT(*) OVER (PARTITION BY C.AGENT_NAME) AS DUPLICATED
                              FROM (
                                    SELECT A.AGENT_NAME,
                                           A.FIRST_CREATEDATE,
                                           A.MAX_CREATEDATE,
                                           B.EMPLOYEENAME,
                                           NULL AS ORIGINALHIREDATE,
                                           NULL AS TERMINATIONDATE,
                                           NULL AS COMPANY,
                                           B.EMPLOYEENUMBER,
                                           DATA_ANALYTICS.DS_FEATURE_REPO.RAPID_FUZZ(A.KEY_AGENT_TL, LOWER(B.EMPLOYEENAME)) SCORE
                                      FROM T1 A
                                      LEFT JOIN EMPLOYEE_BATCH B
                                        ON (A.FIRSTNAME = B.FIRSTNAME)
                                   ) C
                             WHERE C.SCORE = 100
                           ) SELECT *
                      FROM FUZZ_MATCH
                   ) bvstg_agent_number_au2
