        join:
          joinCondition: |-
            FROM {{ ref('STAGE','BVSTG_MKT_AU1A_LEAD_CAMPAIGN') }} bvstg_mkt_au1a_lead_campaign
              JOIN {{ ref('STAGE','BVSTG_I3_AU1A_INTERACTIONSUMMARY') }} bvstg_i3_au1a_interactionsummary
                ON bvstg_mkt_au1a_lead_campaign.phonesystemuserid = bvstg_i3_au1a_interactionsummary.lastlocaluserid
               AND NOT((bvstg_i3_au1a_interactionsummary.RemoteNumberfmt = bvstg_mkt_au1a_lead_campaign.HomePhone AND bvstg_mkt_au1a_lead_campaign.HomePhone IS NOT NULL) OR (bvstg_i3_au1a_interactionsummary.RemoteNumberfmt = bvstg_mkt_au1a_lead_campaign.CellPhone AND bvstg_mkt_au1a_lead_campaign.CellPhone IS NOT NULL) OR (bvstg_i3_au1a_interactionsummary.RemoteNumberfmt = bvstg_mkt_au1a_lead_campaign.ContactPhone AND bvstg_mkt_au1a_lead_campaign.ContactPhone IS NOT NULL))
               AND ((bvstg_i3_au1a_interactionsummary.RemoteNumber_areacode = bvstg_mkt_au1a_lead_campaign.HomePhone_areacode AND bvstg_mkt_au1a_lead_campaign.HomePhone IS NOT NULL) OR (bvstg_i3_au1a_interactionsummary.RemoteNumber_areacode = bvstg_mkt_au1a_lead_campaign.CellPhone_areacode AND bvstg_mkt_au1a_lead_campaign.CellPhone IS NOT NULL) OR (bvstg_i3_au1a_interactionsummary.RemoteNumber_areacode = bvstg_mkt_au1a_lead_campaign.ContactPhone_areacode AND bvstg_mkt_au1a_lead_campaign.ContactPhone IS NOT NULL))
               AND bvstg_i3_au1a_interactionsummary.StartDateTime <= DATEADD(SECOND,+3600,bvstg_mkt_au1a_lead_campaign.lead_Created)
               AND bvstg_mkt_au1a_lead_campaign.lead_Created_Time > bvstg_i3_au1a_interactionsummary.StartTime
               AND bvstg_i3_au1a_interactionsummary.StartDate = bvstg_mkt_au1a_lead_campaign.lead_Created_date
             WHERE bvstg_mkt_au1a_lead_campaign.LeadSource IS NULL
