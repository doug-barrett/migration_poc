    sourceMapping:
      - aliases:
          V_TELESALES_DILER_REFRESH_SPECIALTY: 91cd2222-a36e-4ebb-a437-f4ba18424c61
          DS_DIALER_TELESALES_SPECIALTY: 32557878-d7a5-4024-9247-3412d5d50575
          V_DLBV_PCCE_DL_5026_5026_CURRENT: adcc851d-494a-4264-9586-fc726d6034cb
        customSQL:
          customSQL: |-
            {{ stage('SQL Override') }}
            CREATE OR REPLACE VIEW {{ ref_no_link('STAGE','V_TELESALES_DILER_REFRESH_SPECIALTY') }} AS SELECT DISTINCT ds_dialer_telesales_specialty.C_CUSTOMERID || ' - ' || CASE WHEN ds_dialer_telesales_specialty.ACTIVITYTRANSFER = 1 THEN 'Transfer not Sold'
                        ELSE 'Lead not Transfer'
                         END CustomerID ,
                   ds_dialer_telesales_specialty.FIRSTNAME ,
                   ds_dialer_telesales_specialty.LASTNAME ,
                   ds_dialer_telesales_specialty.PHONE1 ,
                   ds_dialer_telesales_specialty.PHONE2 ,
                   ds_dialer_telesales_specialty.HOUR ,
                   ds_dialer_telesales_specialty.TIMEZONEHOURS ,
                   ds_dialer_telesales_specialty.TIMEZONE
              FROM {{ ref('EDW','DS_DIALER_TELESALES_SPECIALTY') }} ds_dialer_telesales_specialty
              LEFT JOIN {{ ref('STAGE','V_DLBV_PCCE_DL_5026_5026_CURRENT') }} V_DLBV_PCCE_DL_5026_5026_CURRENT
                ON ds_dialer_telesales_specialty.C_CUSTOMERID = RTRIM(split_part(V_DLBV_PCCE_DL_5026_5026_CURRENT.AccountNumber, '-', 0))
               AND DATE(V_DLBV_PCCE_DL_5026_5026_CURRENT.ImportRuleDate) =CURRENT_DATE()
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_CPS_IDNC_CURRENT" DNC
                ON ds_dialer_telesales_specialty.PHONE1 = DNC.PhoneNumber
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_CPS_IDNC_CURRENT" DNC1
                ON ds_dialer_telesales_specialty.PHONE2 = DNC1.PhoneNumber
              LEFT JOIN "RETAIL_PROD"."SCH_BVSTAGE"."V_DLBV_PCCE_DIALER_DETAIL_CURRENT" DD
                ON DD.DIALINGLISTID = V_DLBV_PCCE_DL_5026_5026_CURRENT.DIALINGLISTID
             WHERE ds_dialer_telesales_specialty.INSERTEDDATE = CURRENT_DATE()
               AND ((HOUR(CURRENT_TIMESTAMP()) <= 8 AND ds_dialer_telesales_specialty.Hour <= 9) OR (HOUR(CURRENT_TIMESTAMP()) BETWEEN 9 AND 16 AND ds_dialer_telesales_specialty.Hour <= HOUR(CURRENT_TIMESTAMP())+3) OR HOUR(CURRENT_TIMESTAMP()) >= 17 )--AND DD.DIALINGLISTID IS NULL

               AND V_DLBV_PCCE_DL_5026_5026_CURRENT.AccountNumber IS NULL
               AND DNC.PhoneNumber IS NULL
               AND DNC1.PhoneNumber IS NULL
             ORDER BY ds_dialer_telesales_specialty.HOUR
