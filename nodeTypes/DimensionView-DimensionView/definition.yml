fileVersion: 1
id: DimensionView
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |
    capitalized: Dimension View
    short: DV
    tagColor: '#6B5B95'
    plural: Dimension Views

    config:
      - groupName: Options
        items: 
        - type: materializationSelector
          options:
            - view
          default: view
          isRequired: true

        - type: toggleButton
          attributeName: selectDistinct
          displayName: Distinct

        - type: multisourceToggle

        - type: overrideSQLToggle

        - displayName: Multi Source Strategy
          attributeName: insertStrategy
          type: dropdownSelector
          default: UNION
          options:
          - "UNION"
          - "UNION ALL" 
          isRequired: true
          enableIf: "{% if node.isMultisource %} true {% else %} false {% endif %}"
name: Dimension View
type: NodeType
