fileVersion: 1
id: WS_SCD2
isDisabled: false
metadata:
  defaultStorageLocation: GOLD
  error: null
  nodeMetadataSpec: |
    capitalized: WS SCD2
    short: SCD2
    plural: WS SCD2 Dimensions
    tagColor: '#8B5CF6'

    config:
    - groupName: Options
      items:
      - type: businessKeyColumns
        isRequired: true

      - type: changeTrackingColumns
        isRequired: false

      - displayName: Enable Tests
        attributeName: testsEnabled
        type: toggleButton
        default: true

      - displayName: Pre-SQL
        attributeName: preSQL
        type: textBox
        syntax: sql
        isRequired: false

      - displayName: Post-SQL
        attributeName: postSQL
        type: textBox
        syntax: sql
        isRequired: false

    - groupName: Hidden config
      enableIf: "false"
      items:
      - displayName: Type
        type: materializationSelector
        default: table
        options:
        - table
        isRequired: false

    systemColumns:
    - displayName: Effective_Begin_Date
      transform: ''
      dataType: DATE
      placement: end
      attributeName: isSystemStartDate

    - displayName: Effective_End_Date
      transform: ''
      dataType: DATE
      placement: end
      attributeName: isSystemEndDate

    - displayName: Create_DTTM
      transform: CAST(CURRENT_TIMESTAMP AS TIMESTAMP)
      dataType: TIMESTAMP
      placement: end
      attributeName: isSystemCreateDate

    - displayName: Last_Update_DTTM
      transform: CAST(CURRENT_TIMESTAMP AS TIMESTAMP)
      dataType: TIMESTAMP
      placement: end
      attributeName: isSystemUpdateDate

    - displayName: dss_current_flag
      transform: '''Y'''
      dataType: VARCHAR(1)
      placement: end
      attributeName: isSystemCurrentFlag

    - displayName: dss_version
      transform: '1'
      dataType: NUMBER(38,0)
      placement: end
      attributeName: isSystemVersion
name: WS SCD2
type: NodeType
